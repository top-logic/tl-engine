com.top_logic.tl.ai.core.provider.LLMService.EnvironmentSection.user-preferences.tooltip = Nun zu <i>den Benutzereinstellungen</i>.
com.top_logic.tl.ai.core.provider.LLMService.tooltip = Der Dienst „tl-ai“ war vor seiner Konfiguration nach Zielgruppen unterteilt (Gitea #691); er wird nicht mehr betrieben. <p> Die darin enthaltenen Funktionen sind nun auf vier Dienste verteilt: <i>LLM-Anbieter</i> (die Anbieter, der Modellkatalog, Failover), <i>Agent-Laufzeit</i> (welcher Agent läuft auf welchem Modell und wie viele Läufe gleichzeitig), <i>Agent-Anwendungswissen</i> (was einem Agenten über die Anwendung mitgeteilt wird) und <i>Agent-Richtlinien</i> (welche Kosten ein Durchlauf verursachen darf und welche Daten ein Agent über eine Person speichern darf). </p> <p> Die Klasse bleibt nur bestehen, damit die Konfiguration einer Anwendung für den alten Dienst gelesen und mit einem Hinweis abgelehnt werden kann, der angibt, wo die einzelnen Abschnitte nun hingehören: Ohne sie würde die Engine den Start mit der Meldung „Klasse nicht gefunden“ abbrechen und keinen neuen Ort nennen, und sie kennt keinen Alias für einen umbenannten Dienst. <i>LLM-Anbieter</i> fragen zu Beginn nach <code>#refuseOldConfiguration(InstantiationContext)</code>. Es handelt sich nicht um ein Modul und wird nie gestartet; entfernen Sie es mit der nächsten Hauptversion. </p>
