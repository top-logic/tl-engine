model.Tag.Tag.tooltip = A tag that marks a historic state of a business object under a name so that it can be found and inspected again later.
model.Tag.tooltip = Module for naming historic states of business objects. A tag references a fixed revision of an object and thereby makes an earlier state of the data reproducible.
