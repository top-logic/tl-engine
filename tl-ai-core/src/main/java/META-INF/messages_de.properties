com.top_logic.tl.ai.core.agent.ExecutionMode.tooltip = Der aktuelle Ausführungsmodus des Systems. <p>Beeinflusst, welche Werkzeuge das System zulässt. GLOBALE Werkzeuge (solche, die den gemeinsamen Anwendungsstatus ändern) sind nur im <i>Entwicklungs-</i> und <i>Wartungsmodus</i> erlaubt, niemals im <i>Produktionsmodus</i>.</p> <p>Das Brückenmodul ordnet dies den Zuständen des MaintenanceWindowManager von TopLogic zu.</p>
