tl.title = TL AI Demo

# Das Paar zu den deklarierten Typen aus dem Sicherheits-Testbett (Issue #258). Hier beschrieben und
# nicht im Bundle von tl-ai-core, weil beide zum secdemo-Aspekt gehören und nicht zum Framework.
admin.ai.tool.secdemo-projects.listProjects = Listet die für das Konto lesbaren Projekte auf und deklariert den Typ pm:Project; ein Konto ohne Leserecht darauf wird abgewiesen, bevor das Tool läuft.
admin.ai.tool.secdemo-projects.listProjectsUndeclared = Listet die für das Konto lesbaren Projekte auf, ohne einen Typ zu deklarieren; ein Konto ohne Leserecht auf pm:Project erhält eine leere Liste statt einer Abweisung.
