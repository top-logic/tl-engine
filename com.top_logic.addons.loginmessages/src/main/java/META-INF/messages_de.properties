class.com.top_logic.addons.loginmessages.layout.I18NConstants.RESET_LOGIN_MESSAGE = Login-Nachricht zurückgesetzt.
class.com.top_logic.addons.loginmessages.script.I18NConstants.CONFIRMED_LOGIN_MESSAGES__USER = Login-Meldungen von „{0}“ bestätigt.
com.top_logic.addons.loginmessages.layout.LoginMessageNamingScheme$LoginMessageName = Name der Login-Nachricht
com.top_logic.addons.loginmessages.layout.LoginMessageNamingScheme$LoginMessageName.tooltip = Ein <i>Modellname</i> für eine <i>Login-Nachricht</i>.
