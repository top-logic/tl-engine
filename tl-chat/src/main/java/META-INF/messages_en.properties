com.top_logic.ai.chat.history.LegacyChatSessionMigration = Legacy chat session migration
com.top_logic.ai.chat.history.LegacyChatSessionMigration.tooltip = One-time eager migration of legacy <code>tl.ai.chat:ChatSession</code> objects to <i>agent sessions</i> at application startup. <p> Each legacy session becomes an <i>agent session</i> (kind CHAT) with the same title, owner, timestamps and metadata, plus one synthetic completed <i>agent execution</i> carrying the old V2 message blob verbatim as its transcript. Legacy blobs in the pre-V2 format cannot be replayed; their conversation content is dropped with a warning (title and timestamps are preserved). Each legacy object is deleted after migration, so after one boot of this version the <code>ChatSession</code> table is empty and subsequent startups are a cheap no-op. </p> <p> Migration is best-effort: a failure is logged and never prevents application startup; remaining legacy sessions are retried on the next boot. </p> <p>
