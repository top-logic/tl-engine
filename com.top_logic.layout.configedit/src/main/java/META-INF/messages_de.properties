com.top_logic.layout.configedit.ConfigControl = Konfigurationskontrolle
com.top_logic.layout.configedit.ConfigControl.tooltip = Annotation, die den <i>Konfigurationskontroll-Anbieter</i> benennt, der die annotierte Eigenschaft bearbeitet. <p> An einem Getter legt sie die Kontrolle für diese Eigenschaft fest. An einer Konfigurationsschnittstelle legt sie die Kontrolle für Eigenschaften fest, deren Werttyp diese Schnittstelle ist. Sie ist das konfigurationsseitige Gegenstück zu TLInputControl und hat Vorrang vor jedem anderen Schritt der Auflösung von ConfigControlService. </p>
com.top_logic.layout.configedit.ConfigControl.value = Wert
com.top_logic.layout.configedit.ConfigControl.value.tooltip = Der Anbieter, der die Kontrolle erstellt. Muss einen öffentlichen Konstruktor ohne Argumente besitzen.
com.top_logic.layout.configedit.ConfigControlService = Konfigurationskontroll-Dienst
com.top_logic.layout.configedit.ConfigControlService$ProviderMapping = Anbieter-Zuordnung
com.top_logic.layout.configedit.ConfigControlService$ProviderMapping.tooltip = Ein einzelner Eintrag der Zuordnung von Werttyp zu Anbieter.
com.top_logic.layout.configedit.ConfigControlService.Config.providers = Anbieter
com.top_logic.layout.configedit.ConfigControlService.Config.providers.tooltip = Zuordnungen von Werttyp zu Anbieter, indiziert nach dem Java-Typ des Eigenschaftswerts.
com.top_logic.layout.configedit.ConfigControlService.ProviderMapping.impl = Implementierung
com.top_logic.layout.configedit.ConfigControlService.ProviderMapping.impl.tooltip = Der Kontroll-Anbieter, der für Eigenschaften dieses Werttyps verwendet wird.
com.top_logic.layout.configedit.ConfigControlService.ProviderMapping.type = Typ
com.top_logic.layout.configedit.ConfigControlService.ProviderMapping.type.tooltip = Der Java-Typ des Eigenschaftswerts, für den diese Zuordnung gilt.
com.top_logic.layout.configedit.ConfigControlService.tooltip = Dienst, der die Eingabekontrolle für eine Konfigurationseigenschaft auflöst. <p> Auflösungsreihenfolge, angelehnt an die klassische deklarative Formular-Implementierung com.top_logic.layout.form.values.edit.editor.ValueEditor: </p> <ol> <li>@Encrypted gewinnt immer: eine solche Eigenschaft wird in einem Passwortfeld bearbeitet, unabhängig davon, welcher der folgenden Schritte sonst zuträfe.</li> <li>Die <i>Konfigurationskontrolle</i>-Annotation an der Eigenschaft oder an ihrem Werttyp.</li> <li>Eine Eigenschaft, die nicht "spezialisiert" ist (keine Optionen, kein @Format, keine Wertbindung) und deren Java-Typ eine der folgenden Kontrollen direkt unterstützt - String, boolean, ein numerischer Typ oder Date - wird mit dieser Kontrolle bearbeitet, gebunden an den unveränderten, typisierten Wert.</li> <li>Andernfalls erhält eine durch Auswahl bearbeitete Eigenschaft (eine Optionsliste oder ein Enum) eine Auswahl. Beschränkt auf <i>einfache</i> und <i>Referenz</i>-Eigenschaften.</li> <li>Andernfalls die in diesem Dienst konfigurierte Zuordnung von Werttyp zu Anbieter.</li> <li>Andernfalls der eingebaute Text-Rückfall, geparst und formatiert über den eigenen ConfigurationValueProvider der Eigenschaft.</li> </ol> <p> Das Spezialisierungs-Veto ist der Grund, warum eine Eigenschaft mit eigenem Format nie an die "direkte" Kontrolle für ihren Java-Typ übergeben wird: ein als Tageszeit formatiertes Date wird über dieses Format als Text bearbeitet, nicht in einem Datumswähler, der eine Zeit weder anzeigen noch entgegennehmen könnte - derselbe Fehler, der bei DatePickerControlProvider auf Seiten der Modellattribute behoben wurde. </p> <p> Die konfigurierte Zuordnung ist es, die einem Modul oberhalb dieses Moduls erlaubt, eine Kontrolle beizutragen - der TL-Script-Editor etwa liegt in tl-model-search-react. </p>
