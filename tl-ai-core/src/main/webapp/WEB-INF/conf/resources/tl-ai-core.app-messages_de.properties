admin.ai.agentSecurity.catalog.description = Beschreibung
admin.ai.agentSecurity.catalog.description.tooltip = Was das Werkzeug tut, in einem Satz für die Verwaltung. Wo niemand einen solchen Satz schreiben konnte - bei Werkzeugen eines verbundenen Servers und bei in der Anwendung angelegten -, steht der Text, den das Sprachmodell erhält, und die Zeile sagt das.
admin.ai.agentSecurity.catalog.group = Gruppe
admin.ai.agentSecurity.catalog.group.tooltip = Die Werkzeuggruppe ist die Einheit, die eine Rolle gewährt bekommt. Ein Werkzeug ohne Gruppe ist für alle gesperrt.
admin.ai.agentSecurity.catalog.groupSource = Herkunft der Gruppe
admin.ai.agentSecurity.catalog.groupSource.tooltip = Ob das Werkzeug seine Gruppe selbst deklariert oder ob die Richtlinie sie zuordnet. Erklärt, warum das Entfernen einer Zuordnung ein Werkzeug entklassifiziert und das daneben nicht.
admin.ai.agentSecurity.catalog.reachableFor = Erreichbar für
admin.ai.agentSecurity.catalog.reachableFor.tooltip = Die Rollen, die die Richtlinie konfiguriert und die dieses Werkzeug erreichen. Administratoren erreichen jedes Werkzeug und sind hier absichtlich nicht aufgeführt.
admin.ai.agentSecurity.catalog.risk = Besonderheit
admin.ai.agentSecurity.catalog.risk.tooltip = Was diese Gruppe besonders macht: privilegiert (kann jede andere Berechtigung ausdrücken), sendet Daten nach außen, oder implizit gewährt (jedes Konto hält sie).
admin.ai.agentSecurity.catalog.tabber = Werkzeug-Katalog
admin.ai.agentSecurity.catalog.title = Alle Werkzeuge dieser Anwendung mit ihrer Werkzeuggruppe und den Rollen, die sie erreichen
admin.ai.agentSecurity.catalog.tool = Werkzeug
admin.ai.agentSecurity.catalog.tool.tooltip = Der Name, unter dem die Richtlinie das Werkzeug kennt, und der Name, den eine Ablehnung im Protokoll nennt.
admin.ai.agentSecurity.effective.mode = Modus
admin.ai.agentSecurity.effective.mode.tooltip = Interaktiv: ein Lauf mit einem Benutzer, der eine Bestätigung beantworten kann. Hintergrund: ein unbeaufsichtigter Lauf, für den zusätzlich die Hintergrund-Zulassungsliste gilt.
admin.ai.agentSecurity.effective.rows = Effektive Rechte
admin.ai.agentSecurity.effective.rows.provenance = Entscheidende Regel
admin.ai.agentSecurity.effective.rows.provenance.tooltip = Welche Regel der Richtlinie entschieden hat - und welche Regel dabei überstimmt wurde.
admin.ai.agentSecurity.effective.rows.risk = Besonderheit
admin.ai.agentSecurity.effective.rows.risk.tooltip = Was diese Werkzeuggruppe besonders macht: privilegiert (kann jede andere Berechtigung ausdrücken), sendet Daten nach außen, oder implizit gewährt (jedes Konto hält sie).
admin.ai.agentSecurity.effective.rows.subject = Werkzeuggruppe / Werkzeug
admin.ai.agentSecurity.effective.rows.subject.tooltip = Eine Zeile je Werkzeuggruppe; aufklappen zeigt die einzelnen Werkzeuge. Werkzeuge ohne Gruppe stehen für sich, weil keine Gruppen-Berechtigung sie erreichen kann.
admin.ai.agentSecurity.effective.rows.title = Was ein Konto oder eine Rolle mit der wirksamen Richtlinie aufrufen darf, und warum
admin.ai.agentSecurity.effective.rows.toolCount = Anzahl
admin.ai.agentSecurity.effective.rows.toolCount.tooltip = Wie viele registrierte Werkzeuge zu dieser Gruppe gehören. Null heißt nicht immer "keine": Werkzeuge, die ein Agent nur für sich selbst mitbringt - etwa die Selbstauskunft listTools - stehen in keiner Registrierung und sind hier nicht mitgezählt.
admin.ai.agentSecurity.effective.rows.verdict = Ergebnis
admin.ai.agentSecurity.effective.rows.verdict.tooltip = Ob das Konto diese Gruppe beziehungsweise dieses Werkzeug aufrufen darf.
admin.ai.agentSecurity.effective.subject = Konto / Rolle
admin.ai.agentSecurity.effective.subject.tooltip = Wessen effektive Rechte gezeigt werden: ein Konto der Anwendung, oder - hypothetisch - wer eine von der Richtlinie konfigurierte Rolle hält.
admin.ai.agentSecurity.effective.tabber = Effektive Rechte
admin.ai.agentSecurity.effective.title = Effektive Rechte
admin.ai.agentSecurity.policy.tabber = Richtlinie
admin.ai.agentSecurity.policy.title = Wer welche Werkzeuggruppen benutzen darf
admin.ai.agentSecurity.tabber = Agent-Sicherheit
