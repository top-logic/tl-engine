com.top_logic.security.passkey.PasskeyRefusedException.Category.USER_NOT_VERIFIED.tooltip = Der Authentifikator hat seinen Benutzer nicht überprüft, obwohl dies erforderlich war.
com.top_logic.security.passkey.PasskeyRefusedException.Category.WRONG_ORIGIN = Falsche Adresse
com.top_logic.security.passkey.PasskeyRefusedException.Category.WRONG_ORIGIN.tooltip = Die Registrierung oder Anmeldung lief auf einer Seite, deren Ursprung die vertrauende Partei nicht akzeptiert.
com.top_logic.security.passkey.PasskeyService = Passkey-Dienst
com.top_logic.security.passkey.PasskeyService.Config.origins = Ursprünge
com.top_logic.security.passkey.PasskeyService.Config.origins.tooltip = Die Ursprünge, auf denen der Browser eine Registrierung oder Anmeldung ausführen darf, z. B. <code>https://app.example.com</code>. <p> Gesetzt, ersetzen sie den Ursprung der öffentlichen Adresse der Anwendung; geben Sie diese Adresse daher mit an, wenn Passkeys auch dort funktionieren sollen. Leer: der Ursprung der öffentlichen Adresse der Anwendung (%HOST%, Variable <code>tl_host</code>). </p>
com.top_logic.security.passkey.PasskeyService.Config.rp-id = ID der vertrauenden Partei
com.top_logic.security.passkey.PasskeyService.Config.rp-id.tooltip = Die ID der vertrauenden Partei: die Domäne, an die die Passkeys gebunden sind, z. B. <code>example.com</code>. <p> Ein Passkey kann nur auf dieser Domäne und ihren Subdomänen verwendet werden; eine Änderung macht daher alle registrierten Passkeys unbrauchbar. Sie muss der Host jedes akzeptierten Ursprungs oder eine übergeordnete Domäne davon sein. Leer: der Host der öffentlichen Adresse der Anwendung (%HOST%, Variable <code>tl_host</code>) oder, ohne diese, der Host des ersten der Ursprünge. </p>
com.top_logic.security.passkey.PasskeyService.Config.rp-name = Name der vertrauenden Partei
com.top_logic.security.passkey.PasskeyService.Config.rp-name.tooltip = Der Name der vertrauenden Partei, der bei der Erstellung eines Passkeys von einem Authentifikator angezeigt wird. <p> Leer: Der Titel der Anwendung. </p>
com.top_logic.security.passkey.PasskeyService.Config.timeout = Zeitlimit
com.top_logic.security.passkey.PasskeyService.Config.timeout.tooltip = Wie lange der Browser darauf wartet, dass der Benutzer eine Registrierung oder Anmeldung bestätigt, und wie lange eine gestartete Registrierung oder Anmeldung angenommen wird.
com.top_logic.security.passkey.PasskeyService.Config.usage = Verwendung
com.top_logic.security.passkey.PasskeyService.Config.usage.tooltip = Wofür die Passkeys der Anwendung dienen: für eine Anmeldung allein mit einem Passkey oder als zweiter Faktor nach dem Passwort. <p> Die Passkeys dienen einem von beidem, nie beidem zugleich. Für eine Anmeldung allein mit einem Passkey registrierte Passkeys sind auffindbar, als zweiter Faktor registrierte nicht, soweit der Authentifikator das zulässt; eine Änderung der Verwendung gilt für die registrierten Passkeys so, wie sie sind. </p>
com.top_logic.security.passkey.PasskeyService.Config.user-verification = Benutzerüberprüfung
com.top_logic.security.passkey.PasskeyService.Config.user-verification.tooltip = Ob ein Authentifikator seinen Benutzer (PIN, biometrische Daten) verifizieren muss, wenn ein Passkey registriert oder als zweiter Faktor verwendet wird. <p> Gilt für die Verwendung <i>Zweiter Faktor</i>. Bei der Verwendung <i>Anmeldung</i> ist der Passkey der einzige Nachweis einer Anmeldung, daher ist die Benutzerüberprüfung immer erforderlich. </p>
com.top_logic.security.passkey.PasskeyService.tooltip = Die vertrauende Partei der Passkeys (Web-Authentication-Credentials) der Zugänge: Sie registriert Passkeys und überprüft Anmeldungen mit ihnen. <h2>Adresse der vertrauenden Partei</h2> <p> Die ID der vertrauenden Partei und die akzeptierten Ursprünge werden beim Start des Dienstes aus der öffentlichen Adresse der Anwendung genommen, dem Alias %HOST% (gesetzt aus der Variable <code>tl_host</code>): Der Ursprung dieser Adresse ist der akzeptierte Ursprung, ihr Host die ID der vertrauenden Partei. Die Optionen „rp-id“ und „origins“ überschreiben sie, siehe die Auflösung. Aus einer Anfrage wird nichts übernommen: Ein Reverse-Proxy entscheidet, was eine Anfrage aussagt, und die ID der vertrauenden Partei bindet jeden Passkey dauerhaft. Lässt sich kein Ursprung ermitteln, protokolliert der Dienst einen Fehler und läuft ohne Passkeys weiter: Jede Methode <code>start</code> lehnt mit der Meldung ab, dass keine Passkeys eingerichtet sind. </p> <h2>Ablehnungen</h2> <p> Eine Methode <code>finish</code> lehnt einen Passkey mit einer <i>Passkey-Ablehnung</i> ab, die die Kategorie der Ablehnung und den abgelehnten Passkey nennt, und protokolliert die Ablehnung als Warnung mit der Kategorie, dem Grund, der Credential-ID, den beteiligten Konten und dem Ursprung, den der Browser gemeldet hat. Die Kategorien ergeben sich aus den Prüfungen dieses Dienstes, bevor die Bibliothek ihre eigenen ausführt; eine Ablehnung durch die Bibliothek ist <i>Fehlgeschlagen</i> mit ihrem Grund. </p> <h2>Verwendung der Passkeys</h2> <p> Die Option „usage“ legt fest, wofür die Passkeys der Anwendung dienen, eines von: </p> <ul> <li><i>Anmeldung</i>: Ein Passkey allein meldet sein Konto an. Registrierte Passkeys sind auffindbar, sodass sie ohne Benutzernamen anmelden, und Registrierungen und Anmeldungen erfordern immer, dass der Authentifikator seinen Benutzer verifiziert (PIN, biometrische Daten), da der Passkey der einzige Nachweis ist. Eine Anmeldung mit einem Passkey nach dem Passwort wird abgelehnt.</li> <li><i>Zweiter Faktor</i>: Ein Passkey bestätigt die Anmeldung eines Kontos nach seinem Passwort. Registrierte Passkeys sind nicht auffindbar, soweit der Authentifikator das zulässt, und Registrierungen und Anmeldungen erfordern die konfigurierte Benutzerüberprüfung. Eine Anmeldung allein mit einem Passkey wird abgelehnt.</li> </ul>
com.top_logic.security.passkey.PasskeyUsage = Verwendung der Passkeys
com.top_logic.security.passkey.PasskeyUsage.LOGIN = Anmeldung
com.top_logic.security.passkey.PasskeyUsage.LOGIN.tooltip = Ein Passkey allein meldet sein Konto an, ohne das Passwort. <p> Passkeys werden auffindbar angelegt, sodass der Benutzer einen auswählt, ohne einen Benutzernamen anzugeben, und der Authentifikator verifiziert immer seinen Benutzer (PIN, biometrische Daten), da der Passkey der einzige Nachweis der Anmeldung ist. Passkeys sind kein zweiter Faktor. </p>
com.top_logic.security.passkey.PasskeyUsage.SECOND_FACTOR = Zweiter Faktor
com.top_logic.security.passkey.PasskeyUsage.SECOND_FACTOR.tooltip = Ein Passkey bestätigt die Anmeldung eines Kontos nach seinem Passwort, als zweiter Faktor. <p> Passkeys werden nicht auffindbar angelegt, soweit der Authentifikator das zulässt, und der Authentifikator verifiziert seinen Benutzer wie konfiguriert. Eine Anmeldung allein mit einem Passkey wird nicht angeboten. </p>
com.top_logic.security.passkey.PasskeyUsage.tooltip = Wofür die Passkeys einer Anwendung dienen, siehe <i>Verwendung</i> (<i>Konfiguration des Passkey-Dienstes</i>). <p> Eine Anwendung verwendet ihre Passkeys entweder für eine Anmeldung allein mit einem Passkey oder als zweiten Faktor nach dem Passwort, nie für beides: Ein Passkey, der allein anmeldet, würde sonst auch nach dem Passwort verlangt, und der zweite Faktor wäre kein zweiter Nachweis. </p>
com.top_logic.security.passkey.view.DeletePasskeyAction = Aktion „Passkey löschen“
com.top_logic.security.passkey.view.DeletePasskeyAction.tooltip = <i>Aktion „Objekt löschen“</i>, die einen <i>Passkey</i> im Namen des Kontos löscht, dem er gehört, und dabei verhindert, dass ein Konto, das einen zweiten Faktor verwenden muss, seinen letzten löscht. <p> Ein Konto mit der <i>MFA-Anforderung</i> <i>erforderlich</i> kann seinen zweiten Faktor nicht abschalten (siehe <i>Aktion „MFA abschalten“</i>), also kann es auch den Passkey nicht löschen, der sein einziger zweiter Faktor ist: Das Löschen wird abgelehnt, es sei denn, das Konto behält einen weiteren Passkey oder hat eine andere konfigurierte Methode der Anmeldung eingerichtet, z. B. eine Authenticator-App. Ein Befehl mit dieser Aktion ist für einen solchen Passkey deaktiviert und nennt den Grund. Melden die Passkeys der Anwendung allein an (<i>Anmeldung</i>), sind sie kein zweiter Faktor, und jeder Passkey darf gelöscht werden. </p> <p> Ein Administrator, der den Passkey eines anderen entfernt, löscht ihn mit der <i>Aktion „Objekt löschen“</i>: Ein Konto, das einen zweiten Faktor verwenden muss und keinen mehr hat, richtet bei seiner nächsten Anmeldung einen ein. </p> <p> Beispiel: Den ausgewählten Passkey des aktuellen Benutzers löschen. </p><pre> &lt;generic-command inputs="selectedPasskey"&gt; &lt;executability&gt; &lt;null-input-disabled/&gt; &lt;/executability&gt; &lt;confirm expr="..."/&gt; &lt;verify-identity/&gt; &lt;delete-passkey/&gt; &lt;write-channel name="selectedPasskey" clear="true"/&gt; &lt;/generic-command&gt; </pre>
com.top_logic.security.passkey.view.PasskeyCeremonyElement = Passkey-Element
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.account = Konto
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.account.tooltip = Kanal mit dem Konto, für das der Passkey verwendet oder erstellt wird. <p> Der Kanal muss vom Server gefüllt werden, z. B. von der Anmeldung, nicht durch eine Eingabe des Benutzers. Solange er kein Konto enthält, ist die Schaltfläche deaktiviert. </p>
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.appearance = Aussehen
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.appearance.tooltip = Das Aussehen der Schaltfläche, z. B. <i>„Link“</i> für einen Inline-Link.
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.auto-start = Automatischer Start
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.auto-start.tooltip = Ob der Browser den Passkey abfragt, sobald das Element angezeigt wird, ohne dass auf die Schaltfläche geklickt wird. <p> Ein Browser, der die Anfrage erst nach einem Klick des Benutzers akzeptiert, lehnt den automatischen Start stillschweigend ab; die Schaltfläche bleibt verfügbar. </p>
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.image = Bild
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.image.tooltip = Das Symbol der Schaltfläche.
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.label = Bezeichnung
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.label.tooltip = Die Bezeichnung der Schaltfläche.
com.top_logic.security.passkey.view.PasskeyCeremonyElement.tooltip = Basisklasse eines <i>UI-Elements</i> mit einer Schaltfläche, die im Browser eine <i>Passkey-Zeremonie</i> für das Konto auf einem optionalen Kanal ausführt.
com.top_logic.security.passkey.view.PasskeyFunctions.mayUse = Konto darf Passkeys verwenden
com.top_logic.security.passkey.view.PasskeyFunctions.mayUse.param.account.tooltip = Das zu testende Konto.
com.top_logic.security.passkey.view.PasskeyFunctions.mayUse.return = Ob das Konto Passkeys erstellen darf.
com.top_logic.security.passkey.view.PasskeyFunctions.mayUse.tooltip = Ob das angegebene Konto Passwörter erstellen darf. <p> Auf diese Weise bietet eine Ansicht die Erstellung eines Passworts nur für ein Konto an, das ein solches haben darf: <code>passkeyMayUse(currentUser())</code>. Das anonyme Konto darf niemals eines erstellen. Wenn sich die Passwörter der Anwendung selbstständig anmelden, dürfen alle anderen Konten dies ebenfalls; wenn es sich um zweite Faktoren handelt, darf ein Konto, dessen zweiter Faktor dauerhaft deaktiviert ist, dies nicht. </p>
com.top_logic.security.passkey.view.PasskeyLoginElement = Passkey-Anmeldeelement
com.top_logic.security.passkey.view.PasskeyLoginElement.tooltip = <i>UI-Element</i> mit einer Schaltfläche, die mit einem Passkey anmeldet. <p> Ohne Konto-Kanal wählt der Benutzer einen Passkey eines beliebigen Kontos, und der Passkey allein meldet sein Konto an (der Authentifikator verifiziert dabei immer seinen Benutzer). Mit Konto-Kanal werden nur die Passkeys des Kontos auf dem Kanal akzeptiert: der Passkey als zweiter Faktor, z. B. im Dialog, den die Anmeldung mit dem Konto öffnet, dessen Passwort sie geprüft hat. </p> <p> Die Verwendung der Passkeys entscheidet, welche von beiden angeboten wird: das Element ohne Konto-Kanal nur für <i>Anmeldung</i>, das Element mit Konto-Kanal nur für <i>Zweiter Faktor</i>. Ein Element, dessen Art der Anmeldung die Verwendung nicht zulässt, bietet keinen Vorgang an und ist ausgeblendet. </p> <p> Die Anmeldung wird für das Konto fortgesetzt, dem der Passkey gehört, wie es die Prüfung des Passkeys festgestellt hat: Die passwortlose Anmeldung beginnt den <i>Anmeldeablauf</i> des Kontos, mit dem <i>Anmeldeschritt zweiter Faktor</i> als nachgewiesen markiert; der Passkey als zweiter Faktor schließt den <i>Anmeldeschritt zweiter Faktor</i> der laufenden Anmeldung ab. In beiden Fällen laufen die weiteren Anmeldeschritte, bevor die Sitzung beginnt. </p>
com.top_logic.security.passkey.view.PasskeyRegistrationElement = Passkey-Registrierung
com.top_logic.security.passkey.view.PasskeyRegistrationElement.Config.complete-login = Anmeldung abschließen
com.top_logic.security.passkey.view.PasskeyRegistrationElement.Config.complete-login.tooltip = Ob ein gespeicherter Passkey die Anmeldung des Kontos auf dem Konto-Kanal fortsetzt, das bei der Anmeldung seinen zweiten Faktor einrichtet. <p> Erfordert den Konto-Kanal und schließt Aktionen nach einer Registrierung aus. </p>
com.top_logic.security.passkey.view.PasskeyRegistrationElement.Config.on-success = Bei Erfolg
com.top_logic.security.passkey.view.PasskeyRegistrationElement.Config.on-success.tooltip = Aktionen, die ausgeführt werden, nachdem ein Passkey gespeichert wurde, mit dem Passkey als Argument <code>"passkey"</code>.
com.top_logic.security.passkey.view.PasskeyRegistrationElement.tooltip = <i>UI-Element</i> mit einer Schaltfläche, über die ein Passkey für ein Konto erstellt wird. <p> Das Element dient zwei Zwecken: </p> <ul> <li>Ein angemeldetes Konto erstellt einen eigenen Passkey, z. B. in seinen Einstellungen. Dabei handelt es sich entweder um das angemeldete Konto oder um das Konto auf dem Kontokanal, das dann ebenfalls das angemeldete Konto sein muss. Nachdem der Passkey gespeichert wurde, werden die Aktionen mit ihm als Argument <code>"passkey"</code> ausgeführt, z. B. um eine Liste der Passkeys zu aktualisieren.</li> <li>Bei der Anmeldung wird ein Passkey als zweiter Faktor eingerichtet (<i>vollständige Anmeldung</i>): Das Konto auf dem Kontokanal, das dort von der Anmeldung nach der Passwortprüfung abgelegt wurde, muss einen zweiten Faktor verwenden und hat noch keinen eingerichtet. Die Registrierung erfolgt mit der Verifizierung des Benutzers durch den Authentifikator, sodass der gespeicherte Passkey das Konto bestätigt und den Schritt des zweiten Faktors bei der Anmeldung abschließt.</li> </ul> <p> Ein Konto, das nicht in diese Situation passt, erhält keinen Passkey: Die Schaltfläche ist deaktiviert und gibt den Grund dafür an. </p>
com.top_logic.security.passkey.view.PasskeySecondFactor = Passkey als zweiter Faktor
com.top_logic.security.passkey.view.PasskeySecondFactor.tooltip = <i>Zweiter Faktor</i> zur Bestätigung einer Anmeldung mit einem Passkey des Kontos. <p> Die Methode steht nur zur Verfügung, wenn die Passkeys der Anwendung zweite Faktoren sind, bei der Verwendung <i>Zweiter Faktor</i>. Bei der Verwendung <i>Anmeldung</i> meldet ein Passkey allein an, und kein Konto hat diese Methode eingerichtet oder darf sie einrichten. </p> <p> Ein Konto ist entsprechend eingerichtet, wenn es über einen Passkey verfügt, und kann eingerichtet werden, wenn die Verwendung von Passkeys möglich ist. Bei der Verifizierung handelt es sich um den Passkey-Dialog mit einem <i>Passkey-Anmeldeelement</i> für das Konto, bei der Einrichtung um den Einrichtungsdialog mit einem <i>Passkey-Registrierungselement</i>, das die Anmeldung abschließt; beide erhalten das Konto über den Dialogkanal <code>"account"</code>. </p>
com.top_logic.security.passkey.view.PasskeyUsageElement = Element einer Passkey-Verwendung
com.top_logic.security.passkey.view.PasskeyUsageElement.Config.usage = Verwendung
com.top_logic.security.passkey.view.PasskeyUsageElement.Config.usage.tooltip = Die Verwendung der Passkeys, in der der Inhalt angezeigt wird.
com.top_logic.security.passkey.view.PasskeyUsageElement.tooltip = <i>UI-Element</i>, das seinen Inhalt nur anzeigt, wenn die Passkeys der Anwendung wie konfiguriert verwendet werden, die in der Konfiguration des <i>Passkey-Dienstes</i> eingestellte Verwendung. <p> Eine Ansicht bietet das, was zu einer Verwendung der Passkeys gehört – ein Passkey, der allein anmeldet, oder ein Passkey als zweiter Faktor –, in einem Element für diese Verwendung an, sodass die Anwendung nur die Angebote der Verwendung zeigt, mit der sie konfiguriert ist: </p> <pre> &lt;if-passkey-usage usage="login"&gt; &lt;text&gt; &lt;label&gt;&lt;en&gt;A passkey signs you in without user name and password.&lt;/en&gt;&lt;/label&gt; &lt;/text&gt; ... &lt;/if-passkey-usage&gt; </pre> <p> Die Verwendung ist Teil der Konfiguration des <i>Passkey-Dienstes</i> und wird daher einmal entschieden, wenn das Steuerelement des Elements erzeugt wird. Bei einer anderen Verwendung zeigt das Element einen leeren, ausgeblendeten Inhalt, der in seinem Container keinen Platz einnimmt (kein Abstand des umgebenden Stapels auf einer seiner Seiten), wie ein bedingtes Element, dessen Bedingung nicht erfüllt ist. </p>
