com.top_logic.layout.configedit.ConfigControlService.AnnotationControlMapping.annotation = Annotation
com.top_logic.layout.configedit.ConfigControlService.AnnotationControlMapping.annotation.tooltip = Der Annotationstyp, den eine Eigenschaft aufweisen muss, damit dieser Eintrag gilt.
