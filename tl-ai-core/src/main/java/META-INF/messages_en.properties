com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome.tooltip = Terminal state of an approval flow, carried by <i>approval result</i>.
com.top_logic.tl.ai.core.provider.LLMProviderRegistry = LLM provider registry
com.top_logic.tl.ai.core.provider.LLMProviderRegistry$ProviderConfig = Provider configuration
com.top_logic.tl.ai.core.provider.LLMProviderRegistry$ProviderConfig.tooltip = Configuration for a single LLM provider. <p> Each provider has a name (e.g. "anthropic", "openai", "mistral"), API credentials, and a comma-separated list of model names it serves. </p>
com.top_logic.tl.ai.core.provider.LLMProviderRegistry.Config.default-model = Default model
com.top_logic.tl.ai.core.provider.LLMProviderRegistry.Config.default-model.tooltip = The default model name to use when no model is explicitly specified on an agent. <p> This should match a model listed in one of the providers. </p>
com.top_logic.tl.ai.core.provider.LLMProviderRegistry.Config.providers = Providers
com.top_logic.tl.ai.core.provider.LLMProviderRegistry.Config.providers.tooltip = The configured LLM providers, keyed by provider name. <p> Each provider entry specifies connection details (API key, base URL) and a comma-separated list of model names it serves. When building an agent, the registry matches the agent's model name against these lists to select the correct provider. </p>
com.top_logic.tl.ai.core.provider.LLMProviderRegistry.ProviderConfig.api-key = Api key
com.top_logic.tl.ai.core.provider.LLMProviderRegistry.ProviderConfig.api-key.tooltip = The API key for authentication with the provider.
com.top_logic.tl.ai.core.provider.LLMProviderRegistry.ProviderConfig.base-url = Base URL
com.top_logic.tl.ai.core.provider.LLMProviderRegistry.ProviderConfig.base-url.tooltip = The base URL for the provider's API. <p> Optional. When not set, the default URL for the provider type is used. </p>
com.top_logic.tl.ai.core.provider.LLMProviderRegistry.ProviderConfig.models = Models
com.top_logic.tl.ai.core.provider.LLMProviderRegistry.ProviderConfig.models.tooltip = Comma-separated list of model names served by this provider. <p> Used to match agent model references to the correct provider. May be empty if the provider name alone is sufficient for matching. </p>
com.top_logic.tl.ai.core.provider.LLMProviderRegistry.ProviderConfig.version = Version
com.top_logic.tl.ai.core.provider.LLMProviderRegistry.ProviderConfig.version.tooltip = Provider-specific API version string. <p> Used by Anthropic to set the anthropic-version header. Ignored by other providers. </p>
com.top_logic.tl.ai.core.provider.LLMProviderRegistry.tooltip = Registry of LLM provider connections. <p> Manages provider configurations (API keys, base URLs, model lists) and creates <i>LLM provider</i> instances for given model names. Agent execution is handled by <i>agent factory</i>. </p>
com.top_logic.tl.ai.core.provider.ProviderException$Kind = Kind
com.top_logic.tl.ai.core.provider.ProviderException$Kind.tooltip = Classification of the error.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.AUTHENTICATION = Authentication
com.top_logic.tl.ai.core.provider.ProviderException.Kind.AUTHENTICATION.tooltip = 401/403 \u2014 invalid or expired API key.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.BILLING = Billing
com.top_logic.tl.ai.core.provider.ProviderException.Kind.BILLING.tooltip = 402 \u2014 billing or payment issue. Terminal, not retryable.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.CONTEXT_WINDOW_EXCEEDED = Context window exceeded
com.top_logic.tl.ai.core.provider.ProviderException.Kind.CONTEXT_WINDOW_EXCEEDED.tooltip = Request too large for the model's context window.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.INVALID_REQUEST = Invalid request
com.top_logic.tl.ai.core.provider.ProviderException.Kind.INVALID_REQUEST.tooltip = 400 \u2014 malformed request.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.OVERLOADED = Overloaded
com.top_logic.tl.ai.core.provider.ProviderException.Kind.OVERLOADED.tooltip = 529 or 5xx \u2014 provider overloaded or temporarily unavailable.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.RATE_LIMITED = Rate limited
com.top_logic.tl.ai.core.provider.ProviderException.Kind.RATE_LIMITED.tooltip = 429 \u2014 rate limited. Check <code>ProviderException#retryAfter()</code>.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.UNKNOWN = Unknown
com.top_logic.tl.ai.core.provider.ProviderException.Kind.UNKNOWN.tooltip = Unclassified error.
com.top_logic.tl.ai.core.provider.ResponseFormat = Response format
com.top_logic.tl.ai.core.provider.ResponseFormat.JSON = JSON
com.top_logic.tl.ai.core.provider.ResponseFormat.JSON.tooltip = Structured JSON object response.
com.top_logic.tl.ai.core.provider.ResponseFormat.TEXT = Text
com.top_logic.tl.ai.core.provider.ResponseFormat.TEXT.tooltip = Plain text response (default).
com.top_logic.tl.ai.core.provider.ResponseFormat.tooltip = Controls the format of the LLM response.
com.top_logic.tl.ai.core.provider.ToolChoice = Tool choice
com.top_logic.tl.ai.core.provider.ToolChoice.AUTO = Auto
com.top_logic.tl.ai.core.provider.ToolChoice.AUTO.tooltip = The LLM decides whether to call a tool (default).
com.top_logic.tl.ai.core.provider.ToolChoice.NONE = None
com.top_logic.tl.ai.core.provider.ToolChoice.NONE.tooltip = The LLM must not call any tool.
com.top_logic.tl.ai.core.provider.ToolChoice.REQUIRED = Required
com.top_logic.tl.ai.core.provider.ToolChoice.REQUIRED.tooltip = The LLM must call at least one tool.
com.top_logic.tl.ai.core.provider.ToolChoice.tooltip = Controls how the LLM selects tools during a request.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChat = Agent chat
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChat.param.agentName.tooltip = The agent name from the Agent Registry.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChat.param.userMessage.tooltip = The user message to prompt the Agent with.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChat.return = The response from the AI Agent.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChat.tooltip = Call an AI Agent from the Registry.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChatWithListener = Agent chat with listener
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChatWithListener.param.agentName.tooltip = The agent name from the Agent Registry.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChatWithListener.param.listener.tooltip = Receives progress events during the run.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChatWithListener.param.userMessage.tooltip = The user message to prompt the Agent with.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChatWithListener.return = The response from the AI Agent.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChatWithListener.tooltip = Call an AI Agent from the Registry with an event listener. <p> Not exposed as a TL-Script function \u2014 uses a distinct name to avoid ambiguity in the script registry. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool = Call tool
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool.param.parameters.tooltip = A map of parameter names to values, or null if the tool has no parameters.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool.param.toolName.tooltip = The qualified name of the tool to invoke.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool.return = The result of the tool execution as a string.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool.tooltip = Invokes a tool manually with the given parameters. <p> This function allows direct invocation of registered tools from TL-Script. The tool is identified by its qualified name in the format factory-name.tool-name. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat = Chat
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.param.messages.tooltip = A list of messages. Each message can be: <ul> <li>String: Treated as user text message</li> <li>Map with "role" and "content": Explicit role (system/user/assistant). Content can be string, binary data, or a list of mixed content.</li> <li>Binary data: Treated as user image/document message</li> </ul>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.param.model.tooltip = The model name to use, or null to use the default model configured in <i>LLM provider registry</i>.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.param.responseFormat.tooltip = The response format specification. Can be: <ul> <li>null: No specific format requirement</li> <li>String "text" or "json": Simple format type</li> <li>Map with "name" and "schema" fields describing a JSON schema for structured output.</li> </ul>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.param.tools.tooltip = A collection of qualified tool names to make available to the AI agent (e.g., ["mytools.calculateSum", "texttools.formatText"]), or null to provide no tools.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.return = The assistant's response text.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.tooltip = Sends a multi-turn conversation to a chat completion provider. <p> Messages can be strings, maps with role/content, or lists. Content can be text strings or <i>binary data</i> for images and documents. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.models = Models
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.models.return = An immutable list of all configured model names.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.models.tooltip = Returns a list of all available model names from the <i>LLM provider registry</i>. <p> Model names can be passed to the <i>chat</i> function to select which AI model to use. The returned list maintains a consistent order across calls. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.runAgent = Run agent
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.runAgent.param.agentName.tooltip = The agent name as stored in the KB
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.runAgent.param.userMessage.tooltip = The user message to send to the agent
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.runAgent.return = The agent's final text response
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.runAgent.tooltip = Run an agent defined in the knowledge base via AgentFactory. <p> Builds an <i>agent loop</i> from a KB-defined agent and runs it with the given user message. The agent is resolved by name from the tl.ai.core:Agent model instances. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.toolInfo = Tool info
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.toolInfo.param.toolName.tooltip = The qualified name of the tool.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.toolInfo.return = A map containing the tool's metadata with the structure described above, or null if the tool is not found.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.toolInfo.tooltip = Retrieves detailed information about a registered tool. <p> This function returns metadata about a tool including its name, description, and parameter schema. The tool is identified by its qualified name in the format factory-name.tool-name. </p> <p> The returned map contains: </p> <ul> <li>name - The tool's name</li> <li>qualifiedName - The tool's fully qualified name</li> <li>description - A description of what the tool does</li> <li>inputSchemaJson - The JSON Schema string for tool parameters</li> </ul>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.tools = Tools
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.tools.return = A list of all registered tool names.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.tools.tooltip = Returns a list of all available tool names from the <i>tool registry service</i>. <p> Tool names are in the qualified format factory-name.tool-name. These names can be passed to the <i>chat</i> function to make tools available to the AI agent. </p>
com.top_logic.tl.ai.core.scripting.Converters.htmlToMarkdown = HTML to markdown
com.top_logic.tl.ai.core.scripting.Converters.htmlToMarkdown.param.html.tooltip = Text in HTML format.
com.top_logic.tl.ai.core.scripting.Converters.htmlToMarkdown.return = Markdown formatted text.
com.top_logic.tl.ai.core.scripting.Converters.htmlToMarkdown.tooltip = Converts HTML to <i>Markdown</i>.
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtml = Markdown to HTML
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtml.param.markdown.tooltip = Text in <i>Markdown</i> format.
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtml.return = HTML fragment that can be rendered.
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtml.tooltip = Converts <i>Markdown</i> to HTML.
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtmlString = Markdown to HTML string
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtmlString.param.markdown.tooltip = Text in <i>Markdown</i> format.
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtmlString.return = HTML string.
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtmlString.tooltip = Converts <i>Markdown</i> to an HTML string.
com.top_logic.tl.ai.core.session.Part$ApprovalDecision = Approval decision
com.top_logic.tl.ai.core.session.Part$ApprovalDecision.tooltip = Approval decision made by the user.
com.top_logic.tl.ai.core.session.Part$SystemEventType = System event type
com.top_logic.tl.ai.core.session.Part$SystemEventType.tooltip = Types of system events.
com.top_logic.tl.ai.core.session.Part$ToolCallStatus = Tool call status
com.top_logic.tl.ai.core.session.Part$ToolCallStatus.tooltip = Status of a tool call through its lifecycle.
com.top_logic.tl.ai.core.session.Part$TransactionType = Transaction type
com.top_logic.tl.ai.core.session.Part$TransactionType.tooltip = KB transaction type.
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.APPROVED = Approved
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.APPROVED_FOR_SESSION = Approved for session
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.DENIED = Denied
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.TIMED_OUT = Timed out
com.top_logic.tl.ai.core.session.Part.SystemEventType.APPROVAL_MODE_CHANGED = Approval mode changed
com.top_logic.tl.ai.core.session.Part.SystemEventType.CANCELLED = Cancelled
com.top_logic.tl.ai.core.session.Part.SystemEventType.MODEL_CHANGED = Model changed
com.top_logic.tl.ai.core.session.Part.ToolCallStatus.COMPLETED = Completed
com.top_logic.tl.ai.core.session.Part.ToolCallStatus.DENIED = Denied
com.top_logic.tl.ai.core.session.Part.ToolCallStatus.FAILED = Failed
com.top_logic.tl.ai.core.session.Part.ToolCallStatus.RUNNING = Running
