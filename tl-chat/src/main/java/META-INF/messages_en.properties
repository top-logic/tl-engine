com.top_logic.ai.chat.view.AgentChatElement.tooltip = Declarative <agent-chat/> element for the React view layer. <p> The shipped component is TLAgentChat. A host that composes the chat from the exported building blocks in tl-chat-seams.js registers its own element (register('MyChat', MyComposition)) and names it here as react-element. The control still binds the session and the tracker; the browser component still talks to /chat/*. </p>
