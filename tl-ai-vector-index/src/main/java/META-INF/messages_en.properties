class.com.top_logic.ai.vector.index.I18NConstants.ERROR_VECTOR_INDEX_NOT_AVAILABLE = The vector index is not available: no embedding model is configured. Ask the administrator to configure a Mistral API key for the vector index.
class.com.top_logic.ai.vector.index.I18NConstants.ERROR_VECTOR_INDEX_NOT_AVAILABLE.help = Error reported when the vector index is searched although it has no embedding model, e.g. because no Mistral API key is available.
