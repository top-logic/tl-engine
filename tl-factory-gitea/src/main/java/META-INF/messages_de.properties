com.top_logic.factory.gitea.GiteaHostingProvider.tooltip = <i>Git-Hosting-Anbieter</i> eines <a href="https://about.gitea.com/">Gitea</a> -Servers. <p> Die Repositorys werden in der Organisation <i>„Owner</i> of the Gitea“ unter <i>der Basis-URL</i> angelegt. Die Anfragen werden anhand der konfigurierten Anmeldedaten authentifiziert; liegen diese nicht vor, erfolgt die Authentifizierung über das Zugriffstoken im Secret <code>"tl_factory_gitea_token"</code>, das mit dem Schema <code>"token"</code> gesendet wird. </p> <p> Das intelligente HTTP-Protokoll von Git greift auf ein Repository über dessen Klon-URL unterhalb der Basis-URL zu, wobei die Authentifizierung mit denselben Anmeldedaten erfolgt. </p><h2>Das Zugriffstoken</h2> <p> Die Sperre benötigt die Berechtigungsbereiche „write:organization“ (Erstellen eines Repositorys in der Organisation) und „write:repository“ (Lesen von Repositorys, Schützen von Branches). Ihr Benutzer muss berechtigt sein, Repositorys in der Organisation zu erstellen und diese zu verwalten, z. B. als Mitglied der <i>„Owners“</i> seines Teams. </p><h2>Zweigschutz</h2> <p> Durch den Schutz eines Branches wird eine Branch-Schutzregel eingerichtet, die nach dem Branch benannt ist: Das Pushen ist für jeden Benutzer mit Schreibzugriff erlaubt (enable_push, keine Push-Allowlist), Force-Pushing ist für niemanden erlaubt (enable_force_push off), die geschützten Dateimuster sind die durch Semikolons getrennten angegebenen Muster (protected_file_patterns), es gibt keine ungeschützten Dateimuster. Gitea erzwingt dann Folgendes: </p> <ul> <li>Ein geschützter Zweig kann nicht gelöscht werden, und ein Push, der dessen Historie überschreibt, wird abgelehnt – auch für Administratoren.</li> <li>Ein Push, der eine geschützte Datei ändert, wird abgelehnt, auch für Administratoren. Gitea gleicht die Muster mit dem Pfad in Kleinbuchstaben ab; * passt weder auf / noch auf ., ** passt auf jede beliebige Zeichenfolge.</li> <li>Ein Pull-Request, der eine geschützte Datei ändert, kann nur von einem Benutzer zusammengeführt werden, der den Zweigschutz umgehen darf: einem Administrator des Repositorys (block_admin_merge_override off). Eine solche Zusammenführung ignoriert die erforderlichen Genehmigungen; Giteas eigene Überprüfung des Pull-Requests meldet die geänderten geschützten Dateien an alle anderen Benutzer.</li> <li>Jeder andere Pull-Request benötigt <i>die erforderlichen Genehmigungen</i> und darf keine abgelehnte Überprüfung aufweisen (block_on_rejected_reviews); eine Genehmigung wird durch einen neuen Commit verworfen (dismiss_stale_approvals).</li> </ul> <p> Eine bereits für den Zweig geltende Regel wird durch diese Einstellungen ersetzt. Ein Zweig wird nach dem Push, der ihn erstellt, geschützt: Gitea lehnt den Push ab, der einen Zweig erstellt, dessen Regel geschützte Dateimuster enthält („Start-Commit nicht gefunden“), daher muss der erste Push in ein leeres Repository zuvor erfolgen. </p>
