com.top_logic.ai.a2a.protocol.TaskState.INPUT_REQUIRED.tooltip = Der Agent hat eine Frage gestellt und wartet auf die Antwort.
com.top_logic.ai.a2a.protocol.TaskState.REJECTED = Abgelehnt
com.top_logic.ai.a2a.protocol.TaskState.REJECTED.tooltip = Vom Agenten nicht angenommen.
com.top_logic.ai.a2a.protocol.TaskState.SUBMITTED = Angenommen
com.top_logic.ai.a2a.protocol.TaskState.SUBMITTED.tooltip = Angenommen, noch nicht begonnen.
com.top_logic.ai.a2a.protocol.TaskState.WORKING = In Arbeit
com.top_logic.ai.a2a.protocol.TaskState.WORKING.tooltip = Der Agent läuft.
com.top_logic.ai.a2a.protocol.TaskState.tooltip = Die Aufgabenstatus von A2A v1.0; auf der Leitung TASK_STATE_COMPLETED.
