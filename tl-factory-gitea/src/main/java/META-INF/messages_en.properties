com.top_logic.factory.gitea.GiteaHostingProvider.tooltip = <i>Git hosting provider</i> of a <a href="https://about.gitea.com/">Gitea</a> server. <p> The repositories are created in the organization <i>Owner</i> of the Gitea at <i>Base URL</i>. The requests are authenticated by the configured credentials; without them, with the access token in the secret <code>"tl_factory_gitea_token"</code>, sent with the scheme <code>"token"</code>. </p> <p> Git's smart HTTP protocol reaches a repository at its clone URL below the base URL, authenticated with the same credentials. </p> <h2>The access token</h2> <p> The token needs the scopes write:organization (creating a repository in the organization) and write:repository (reading repositories, protecting branches). Its user must be allowed to create repositories in the organization and to administer them, e.g. as member of its team <i>Owners</i>. </p> <h2>Branch protection</h2> <p> Protecting a branch sets up a branch protection rule named like the branch: pushing is allowed for every user with write access (enable_push, no push allowlist), force pushing for no one (enable_force_push off), the protected file patterns are the given patterns joined by semicolons (protected_file_patterns), there are no unprotected file patterns. Gitea then enforces: </p> <ul> <li>A protected branch cannot be deleted, and a push rewriting its history is rejected, also for administrators.</li> <li>A push changing a protected file is rejected, also for administrators. Gitea matches the patterns against the lower-cased path; * matches neither / nor ., ** matches any sequence.</li> <li>A pull request changing a protected file can be merged only by a user who may bypass the branch protection: an administrator of the repository (block_admin_merge_override off). Such a merge ignores the required approvals; Gitea's own check of the pull request reports the changed protected files to every other user.</li> <li>Every other pull request needs <i>Required approvals</i> approvals and no rejecting review (block_on_rejected_reviews); an approval is dismissed by a new commit (dismiss_stale_approvals).</li> </ul> <p> A rule the branch already has is replaced by these settings. A branch is protected after the push creating it: Gitea rejects the push that creates a branch whose rule has protected file patterns ("cannot find the start commit"), so the first push into an empty repository has to happen before. </p>
