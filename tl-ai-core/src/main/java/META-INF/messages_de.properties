com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.DownloadAccess.AS_ACCESS.tooltip = Es gilt, was die Zugriffseinstellung daneben sagt: Ein Ursprung, der besucht werden darf, darf auch herunterladen. Das bedeutet ein Eintrag, der Downloads nicht erwähnt.
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.DownloadAccess.DENY = Ablehnen
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.DownloadAccess.DENY.tooltip = Abgelehnt: Der Ursprung darf gelesen werden, eine Datei von dort wird aber nie gespeichert.
