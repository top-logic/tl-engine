com.top_logic.tl.ai.eval.CitationExpectation = Erwartung an die Quellen
com.top_logic.tl.ai.eval.CitationExpectation.max-unread-links = Maximale Anzahl ungelesener Links
com.top_logic.tl.ai.eval.CitationExpectation.max-unread-links.tooltip = Wie viele Weblinks im Text des Modells dürfen auf Seiten verweisen, die noch nicht gelesen wurden?
com.top_logic.tl.ai.eval.CitationExpectation.min-domains = Mindestanzahl an Domains
com.top_logic.tl.ai.eval.CitationExpectation.min-domains.tooltip = Von wie vielen verschiedenen Webhosts müssen die zitierten Quellen mindestens stammen; 0 für keine Begrenzung. <p> Ein Bericht, der drei Seiten eines Anbieters zitiert, zählt als eine Stimme, unabhängig davon, wie viele Fußnoten er enthält. „www.“ ist nicht Teil des Hosts. </p>
com.top_logic.tl.ai.eval.CitationExpectation.min-sources = Mindestanzahl an Quellen
com.top_logic.tl.ai.eval.CitationExpectation.min-sources.tooltip = Wie viele verschiedene Quellen muss die Antwort mindestens anführen? <p> Mindestens eine – weshalb diese Erwartung bei einem Durchlauf, bei dem keine Quelle angegeben wurde, nicht erfüllt wird. </p>
com.top_logic.tl.ai.eval.CitationExpectation.tooltip = Eine <i>Erwartung</i> an die Quellen der Antwort: Sie zitiert genug der Seiten, die der Lauf gelesen hat, und verlinkt nichts, was der Lauf nicht gelesen hat. <p> Deterministisch - und darin liegt ihr Wert neben der <i>Bewertung durch ein Modell</i>: Ob ein Link auf eine gelesene Seite zeigt, ist eine Tatsache, die der Lauf festgehalten hat, keine Meinung. Eine zitierte Quelle ist eine Fußnote, die die Zitatprüfung behalten hat - sie stand also auf der Leseliste des Laufs, des Leiters oder eines Helfers. Ein ungelesener Link ist ein Weblink im Text des Modells, der keine Fußnote wurde: eine erfundene Adresse, ein nie geöffnetes Suchergebnis, eine Seite aus dem Gedächtnis des Modells. </p><pre> &lt;citations label="cites-what-it-read" min-sources="3" min-domains="2"/&gt; </pre>
com.top_logic.tl.ai.eval.EvalConfig = Evaluationskonfiguration
com.top_logic.tl.ai.eval.EvalConfig$Arm = Arm
com.top_logic.tl.ai.eval.EvalConfig$Arm.tooltip = Eine Seite des Vergleichs: eine Agentendefinition, die auf einem Modell läuft. <p> Zwei Dinge sind hier gebündelt, weil sie sich in dieser Testumgebung nicht trennen lassen. Eine modellbezogene Überschreibung pro Lauf gibt es in Java, aber die mitgelieferte Richtlinie für den Tool-Zugriff steht standardmäßig auf model-access default="assigned" und verweigert ein Modell, dem der Agent nicht zugewiesen ist; daher wird die Matrix aus einer Agentendefinition pro Modell aufgebaut und nicht aus einem Agenten und einem Modellparameter. Den Arm als Paar zu konfigurieren macht aus dieser Einschränkung einen Vorteil: Zwei Arme, die <em>dasselbe</em> Modell und unterschiedliche Agentendefinitionen benennen, vergleichen zwei Versionen der Testumgebung – zwei System-Prompts, zwei Tool-Sätze – auf einem Modell, und das ist die günstigere und oft die aufschlussreichere der beiden Fragen, die diese Suite beantworten kann. </p>
com.top_logic.tl.ai.eval.EvalConfig.Arm.agent = Agent
com.top_logic.tl.ai.eval.EvalConfig.Arm.agent.tooltip = Die Agentendefinition, die dieser Arm ausführt, über ihren konfigurierten Namen.
com.top_logic.tl.ai.eval.EvalConfig.Arm.model = Modell
com.top_logic.tl.ai.eval.EvalConfig.Arm.model.tooltip = Das Modell, dem <i>Agent</i> zugewiesen ist. Hier wiederholt, damit die CSV es benennen kann, ohne den Dienst zu fragen, und damit der Arm übersprungen werden kann, bevor er gestartet wird, wenn das Modell keine Tools aufrufen kann.
com.top_logic.tl.ai.eval.EvalConfig.arms = Arme
com.top_logic.tl.ai.eval.EvalConfig.arms.tooltip = Die zu vergleichenden Arme, in der Reihenfolge des Berichts.
com.top_logic.tl.ai.eval.EvalConfig.judge-model = Beurteilungsmodell
com.top_logic.tl.ai.eval.EvalConfig.judge-model.tooltip = Das Modell, das jede <i>Bewertung durch ein Modell</i> dieser Datei entscheidet; leer, wenn kein Szenario eine hat. <p> Hier festgelegt, damit Läufe an verschiedenen Tagen vom selben Bewerter beurteilt werden - ein Vergleich zwischen Läufen mit verschiedenen Bewertern misst die Bewerter. Wählen Sie ein Modell einer anderen Familie als die der Varianten, die sonst ihre eigenen Gewohnheiten bewerten würden. </p>
com.top_logic.tl.ai.eval.EvalConfig.judge-provider = Anbieter des Bewertungsmodells
com.top_logic.tl.ai.eval.EvalConfig.judge-provider.tooltip = Der Anbieter, der das <i>Bewertungsmodell</i> bereitstellt, oder leer, wenn nur ein Anbieter es anbietet.
com.top_logic.tl.ai.eval.EvalConfig.repeats = Wiederholungen
com.top_logic.tl.ai.eval.EvalConfig.repeats.tooltip = Wie oft jeder Arm jedes Szenario ausführt, sofern das Szenario nichts anderes sagt. <p> Drei ist der übliche Standardwert. Wiederholungen liefern eine Zuverlässigkeitskennzahl (pass^k, „alle k Versuche waren erfolgreich“); zur Unterscheidung zweier Modelle tragen sie kaum bei – das leistet die Anzahl der Szenarien. Lesen Sie den Hinweis zur Statistik in der README des Moduls, bevor Sie einen kleinen Unterschied als Unterschied lesen. </p>
com.top_logic.tl.ai.eval.EvalConfig.scenarios = Szenarien
com.top_logic.tl.ai.eval.EvalConfig.scenarios.tooltip = Die Aufgaben, in der Reihenfolge des Berichts.
com.top_logic.tl.ai.eval.EvalConfig.tooltip = Eine vollständige Evaluation: die Arme, die sie vergleicht, und die Szenarien, die sie ihnen stellt. <p> Wird aus einer eigenständigen Konfigurationsdatei gelesen, sodass ein Szenariensatz eine Datei ist, die eine Anwendung neben ihrem eigenen Modell ausliefert, und keine Java-Klasse, die jemand kompilieren muss. </p><pre> &lt;eval xmlns:config="http://www.top-logic.com/ns/config/6.0" repeats="3"&gt; &lt;arms&gt; &lt;arm name="sonnet" agent="Eval_Sonnet" model="claude-sonnet-4-6"/&gt; &lt;arm name="haiku" agent="Eval_Haiku" model="claude-haiku-4-5-20251001"/&gt; &lt;/arms&gt; &lt;scenarios&gt; &lt;scenario id="..." prompt="..." oracle="..."&gt; &lt;kb-query .../&gt; &lt;/scenario&gt; &lt;/scenarios&gt; &lt;/eval&gt; </pre>
com.top_logic.tl.ai.eval.EvalScenario = Evaluationsszenario
com.top_logic.tl.ai.eval.EvalScenario.arms = Arme
com.top_logic.tl.ai.eval.EvalScenario.arms.tooltip = Auf welchen Armen dieses Szenario läuft, über den Armnamen; leer bedeutet: alle Arme der Suite. <p> Ein Szenario auf einzelne Arme zu beschränken ist für eine Aufgabe gedacht, die nur einer Seite gestellt werden kann – etwa eine Fähigkeit, die die Agentendefinition eines Arms nicht trägt. Eine Einschränkung aus Kostengründen macht die Matrix unausgewogen und die Bestehensquoten unvergleichbar; verzichten Sie dann lieber auf Wiederholungen. </p>
com.top_logic.tl.ai.eval.EvalScenario.expectations = Erwartungen
com.top_logic.tl.ai.eval.EvalScenario.expectations.tooltip = Was nach dem Durchlauf gelten muss. Alle müssen erfüllt sein, damit der Durchlauf als bestanden gilt. <p> Darf nicht leer sein – ein Szenario, das nichts behauptet, würde für jedes Modell ein Bestehen melden. </p>
com.top_logic.tl.ai.eval.EvalScenario.id = ID
com.top_logic.tl.ai.eval.EvalScenario.id.tooltip = Identifiziert das Szenario in der CSV und in jedem Bericht.
com.top_logic.tl.ai.eval.EvalScenario.oracle = Oracle
com.top_logic.tl.ai.eval.EvalScenario.oracle.tooltip = Die dokumentierte Referenzlösung: wie diese Aufgabe erledigt wird, und warum die Erwartungen darunter die richtigen sind.
com.top_logic.tl.ai.eval.EvalScenario.prompt = Prompt
com.top_logic.tl.ai.eval.EvalScenario.prompt.tooltip = Die Benutzernachricht, mit der der Durchlauf beginnt – die gesamte Eingabe, die das Modell bekommt, neben dem System-Prompt des Agenten.
com.top_logic.tl.ai.eval.EvalScenario.repeats = Wiederholungen
com.top_logic.tl.ai.eval.EvalScenario.repeats.tooltip = Wie oft jeder Arm dieses Szenario ausführt, oder <code>0</code> für den Standardwert der Suite. <p> Wiederholungen gibt es, weil hier kein Anbieter einen Seed für das Sampling anbietet und die Temperatur keine Lösung ist: Sie zu senken tauscht eine Art von Varianz gegen eine andere und kann das Ergebnis verzerren. Deshalb wird eine Zelle als k von n gemeldet, nie als einzelnes Bestanden oder Fehlgeschlagen. </p>
com.top_logic.tl.ai.eval.EvalScenario.tooltip = Eine Geschäftsaufgabe, die der Testumgebung gestellt wird, mit allem, was nötig ist, um hinterher zu entscheiden, ob sie erledigt wurde. <p> Ein Szenario läuft einmal pro Arm und pro Wiederholung, und jeder dieser Durchläufe wird unabhängig bewertet. Es bringt kein eigenes Setup mit: Die ganze Suite läuft gegen eine einmal befüllte Wissensbasis, die die Suite zwischen den Durchläufen neu befüllt, sodass ein Szenario eine Aufgabe und ihre Erwartungen beschreibt und sonst nichts. </p><h2>Das Oracle</h2> <p><i>Oracle</i> ist Pflicht, und genau das ist sein Sinn. Es ist die Referenzlösung – die Tool-Aufrufe, die ein kompetenter Bearbeiter machen würde –, in Prosa aufgeschrieben. Ohne sie ist ein Szenario, an dem jedes Modell scheitert, nicht von einem unmöglichen Szenario zu unterscheiden, und ein Benchmark, dessen unlösbare Aufgaben niemand bemerkt hat, misst nichts. Es wird nicht ausgeführt; es wird von demjenigen gelesen, der entscheiden muss, ob eine rote Zelle dem Modell anzulasten ist. </p>
com.top_logic.tl.ai.eval.Expectation.label = Bezeichnung
com.top_logic.tl.ai.eval.Expectation.label.tooltip = Kurzname dieser Erwartung, mit dem gesagt wird, welche fehlgeschlagen ist. <p> Landet in der Spalte failedGraders der CSV, sollte sich also wie eine Behauptung lesen – „alpha-has-four-tickets“ statt „check1“. Bleibt er leer, greift der Bewerter auf eine generierte Beschreibung dessen zurück, was er verglichen hat. </p>
com.top_logic.tl.ai.eval.JudgeExpectation = Bewertung durch ein Modell
com.top_logic.tl.ai.eval.JudgeExpectation.pass-ratio = Erfolgsquote
com.top_logic.tl.ai.eval.JudgeExpectation.pass-ratio.tooltip = Der Anteil der Kriterien, die erfüllt sein müssen, von 0 (ausgeschlossen) bis 1; 1 bedeutet, dass alle Kriterien erfüllt sind.
com.top_logic.tl.ai.eval.JudgeExpectation.reference = Referenz
com.top_logic.tl.ai.eval.JudgeExpectation.reference.tooltip = Die richtige Antwort, sofern es bei einer Frage eine gibt; andernfalls leer. <p> Wird dem Richter als Referenz gezeigt, anhand derer die Kriterien gemessen werden – nicht dem Agenten. </p>
com.top_logic.tl.ai.eval.JudgeExpectation.rubric = Bewertungskriterien
com.top_logic.tl.ai.eval.JudgeExpectation.rubric.tooltip = Die Kriterien, jeweils eines pro Zeile.
com.top_logic.tl.ai.eval.JudgeExpectation.tooltip = Eine <i>Erwartung</i> an den Inhalt der Antwort, die ein Bewertungsmodell anhand von Kriterien entscheidet. <p> Für den Teil einer Rechercheaufgabe, den keine Regel prüfen kann: ob der Bericht die Frage beantwortet, nennt, was er nennen muss, und den gefundenen Widerspruch darlegt. Der Bewerter ist ein festgelegtes Modell, das die Eval-Datei nennt (<i>Bewertungsmodell</i>), damit zwei Läufe vom selben Bewerter verglichen werden; es sollte einer anderen Familie angehören als das geprüfte Modell, das sonst seine eigenen Gewohnheiten bewerten würde. </p> <p> Die Kriterien stehen eines pro Zeile; ein führendes "- " entfällt. Der Bewerter sagt für jedes Kriterium, ob die Antwort es erfüllt, und die Erwartung gilt, wenn der Anteil der erfüllten Kriterien die <i>Erfolgsquote</i> erreicht. Ein Bewerter, der nicht gefragt werden konnte oder dessen Antwort sich nicht lesen lässt, lässt die Erwartung mit dem Grund scheitern - nie gelingen. </p><pre> &lt;judge label="answers-the-question"&gt; &lt;reference&gt;Geoffrey Hinton, PhD from the University of Edinburgh (1978).&lt;/reference&gt; &lt;rubric&gt; - Names the University of Edinburgh. - Says that the younger laureate is Geoffrey Hinton. &lt;/rubric&gt; &lt;/judge&gt; </pre>
com.top_logic.tl.ai.eval.KbQuery = Wissensbasis-Abfrage
com.top_logic.tl.ai.eval.KbQuery.expected = Erwartet
com.top_logic.tl.ai.eval.KbQuery.expected.tooltip = Der Wert, den <i>Ausdruck</i> liefern muss, als Text verglichen. <p> Pflicht, und zwar mit Absicht: Eine Erwartung ohne erwarteten Wert könnte immer nur behaupten, dass „der Ausdruck lief“, und das ist keine Aussage über die Aufgabe. </p>
com.top_logic.tl.ai.eval.KbQuery.expression = Ausdruck
com.top_logic.tl.ai.eval.KbQuery.expression.tooltip = Der TL-Script-Ausdruck, der nach dem Durchlauf ausgewertet wird, unter dem Konto, unter dem der Durchlauf lief.
com.top_logic.tl.ai.eval.KbQuery.tooltip = Eine <i>Erwartung</i> an den <b>Endzustand der Wissensbasis</b>: Ein TL-Script-Ausdruck wird nach dem Durchlauf ausgewertet, und sein Ergebnis muss einem geschriebenen Wert entsprechen. <p> Dies ist der wichtigste Bewerter der Evaluation, und er bewertet bewusst die Datenbank statt des Transkripts. Ein Transkript sagt, was das Modell zu tun behauptet hat; nur die Daten sagen, was geschehen ist. Er ist außerdem der einzige Bewerter, der es übersteht, wenn ein Modell die Aufgabe auf einem Weg löst, den niemand vorhergesehen hat. </p><pre> &lt;kb-query label="alpha-has-four-tickets" expression="count(all(`pm:Ticket`).filter(t -&gt; $t.get(`pm:Ticket#title`) == 'Login fails'))" expected="1" /&gt; </pre> <p> Verglichen wird die Zeichenkettendarstellung des Ergebnisses, denn ein TL-Script-Ausdruck liefert je nach Schreibweise Double, Integer, String oder einen Wrapper, und eine Konfigurationsdatei kann nur Text tragen. Schreiben Sie den Ausdruck so, dass er einen Skalar liefert – count(...), isEmpty(...), einen einzelnen Attributwert – und keine Sammlung, deren Darstellung niemand vorhersagen kann. </p>
com.top_logic.tl.ai.eval.Presented = Dargestellt
com.top_logic.tl.ai.eval.Presented.as = Darstellung
com.top_logic.tl.ai.eval.Presented.as.tooltip = Wie die Objekte dargestellt worden sein müssen; leer für jede Art. <p> Verglichen wird mit dem, was das Tool aus dem Aufruf gemacht hat: Ein Aufruf ohne „as“, der mehrere Objekte zeigte, zählt als <i>Tabelle</i>. </p>
com.top_logic.tl.ai.eval.Presented.chart-kind = Diagrammtyp
com.top_logic.tl.ai.eval.Presented.chart-kind.tooltip = Welche Art von Diagramm es gewesen sein muss; leer für jede. Nur mit as="CHART" sinnvoll.
com.top_logic.tl.ai.eval.Presented.expected = Erwartet
com.top_logic.tl.ai.eval.Presented.expected.tooltip = Der Wert, den <i>„Expression“</i> liefern muss, als Text verglichen.
com.top_logic.tl.ai.eval.Presented.expression = Ausdruck
com.top_logic.tl.ai.eval.Presented.expression.tooltip = TL-Script-Funktion der dargestellten Objekte und der Diagrammwerte, rows -&gt; values -&gt; ..., die nach dem Lauf ausgewertet wird.
com.top_logic.tl.ai.eval.Presented.tooltip = Eine <i>Erwartung</i> hinsichtlich dessen, was der Durchlauf <b>dem Benutzer angezeigt hat</b>: Sein letzter Aufruf von „present“ hat die richtigen Objekte auf die richtige Weise angezeigt. <p> Das Gegenstück zur <i>Wissensdatenbankabfrage</i> für eine Aufgabe, bei der keine Daten verändert werden. „Zeige mir alle Tickets als Tabelle“ lässt die Datenbank unverändert, sodass ein Bewerter der Daten einen Durchlauf akzeptiert, der nichts bewirkt hat; das Ergebnis der Aufgabe ist die Darstellung, und diese wird hier bewertet. Der Bewerter vertraut nicht der Beschreibung des Modells: Er wertet die Abfrage, die das Modell bestanden hat – oder löst die IDs auf –, selbst aus, und zwar über denselben Ausführungsmechanismus, den das Tool verwendet, und überprüft die Objekte, die dabei herauskommen. </p><pre> &lt;presented label="all-tickets-as-a-table" as="TABLE"&gt; &lt;expression&gt;rows -&gt; values -&gt; $rows.size() == all(`pm:Ticket`).size() &amp;&amp; $rows.containsAll(all(`pm:Ticket`))&lt;/expression&gt; &lt;expected&gt;true&lt;/expected&gt; &lt;/presented&gt; </pre> <p> Der Ausdruck ist eine Funktion zweier Listen: der dargestellten Objekte und – bei einem Diagramm – der Werte, die die Wertfunktion des Modells für diese berechnet, in derselben Reihenfolge (ansonsten leer), sodass ein Diagramm mit den richtigen Objekten, das jedoch falsche Zahlen anzeigt, fehlschlägt. Das Ergebnis wird als Text verglichen, so wie es auch <i>bei Abfragen in der Wissensdatenbank</i> der Fall ist. </p>
com.top_logic.tl.ai.eval.RunOutcome = Ergebnis des Durchlaufs
com.top_logic.tl.ai.eval.RunOutcome.COULD_NOT_RUN = Konnte nicht ausgeführt werden
com.top_logic.tl.ai.eval.RunOutcome.COULD_NOT_RUN.tooltip = Der Arm wurde nie gestartet, weil die Testumgebung ihn nicht ausführen kann. <p> Bewusst etwas anderes als <i>Fehlgeschlagen</i>. Ein Modell, dessen Katalogeintrag sagt, dass es keine Tools aufrufen kann, ist nicht an unseren Tool-Beschreibungen gescheitert – es wurde nie gefragt. Es als Fehlschlag zu zählen hieße, einer Frage, die niemand gestellt hat, eine Zahl zu geben, und diese Zahl in eine Bestehensquote einzurechnen würde jedes andere Modell derselben Tabelle zu schlecht darstellen. </p>
com.top_logic.tl.ai.eval.RunOutcome.ERROR = Fehler
com.top_logic.tl.ai.eval.RunOutcome.ERROR.tooltip = Der Durchlauf fand statt, warf eine Ausnahme und wurde trotzdem bewertet – die Erwartungen entscheiden. <p> Ein Modell, das auf halbem Weg abbricht und dennoch die richtigen Daten hinterlässt, hat nicht bestanden; ein Modell, das abbricht und nichts hinterlässt, scheitert an den Erwartungen. Dies ist also eine Detailspalte und kein drittes Ergebnis, und es erscheint in der CSV als stopReason ERROR. </p>
com.top_logic.tl.ai.eval.RunOutcome.FAIL = Fehlgeschlagen
com.top_logic.tl.ai.eval.RunOutcome.FAIL.tooltip = Der Durchlauf fand statt, und mindestens eine Erwartung war nicht erfüllt.
com.top_logic.tl.ai.eval.RunOutcome.PASS = Bestanden
com.top_logic.tl.ai.eval.RunOutcome.PASS.tooltip = Jede Erwartung war erfüllt.
com.top_logic.tl.ai.eval.RunOutcome.tooltip = Wie ein Durchlauf eines Szenarios auf einem Arm geendet hat.
com.top_logic.tl.ai.eval.ToolSequence = Tool-Folge
com.top_logic.tl.ai.eval.ToolSequence.forbidden = Verboten
com.top_logic.tl.ai.eval.ToolSequence.forbidden.tooltip = Tool-Namen, die unter den Tool-Aufrufen des Durchlaufs nicht vorkommen dürfen. <p> Ein Aufruf gilt als erfolgt, sobald die Schleife ihn abgesetzt hat, ob er dann gelang, fehlschlug oder abgelehnt wurde: „Das Modell hat versucht, das Projekt zu löschen“ ist der Befund, und ein Gate, das ihn zufällig verhindert hat, macht den Versuch nicht akzeptabel. </p>
com.top_logic.tl.ai.eval.ToolSequence.max-calls = Höchstzahl der Aufrufe
com.top_logic.tl.ai.eval.ToolSequence.max-calls.tooltip = Wie viele Tool-Aufrufe der gesamte Durchlauf ausführen darf; 0 bedeutet keine Begrenzung. <p> Bei einer Aufgabe, deren Aufwand darin besteht, „zeige mir alle Tickets als Tabelle“ korrekt darzustellen, sind ein oder zwei Aufrufe ausreichend (#616), während ein Durchlauf, bei dem jede Zeile aufgelistet, abgerufen und erst dann angezeigt wird, denselben Bildschirm zum fünffachen Preis erreicht. Jeder Aufruf zählt, auch die erforderlichen. </p>
com.top_logic.tl.ai.eval.ToolSequence.required = Erforderlich
com.top_logic.tl.ai.eval.ToolSequence.required.tooltip = Tool-Namen, die alle unter den Tool-Aufrufen des Durchlaufs vorkommen müssen, in beliebiger Reihenfolge. <p> Muss mindestens ein Tool nennen – siehe den Klassenkommentar. Der Bewerter meldet die fehlenden Namen und nicht bloß, dass etwas fehlte. </p>
com.top_logic.tl.ai.eval.ToolSequence.tooltip = Eine <i>Erwartung</i> daran, welche Tools der Durchlauf aufgerufen hat: Jeder erforderliche Name wurde aufgerufen, kein verbotener. <p> Die Reihenfolge wird bewusst nicht überprüft. Ein Modell, das denselben Endzustand über einen anderen Weg erreicht, hat die Aufgabe nicht verfehlt, und eine Überprüfung der Reihenfolge der Schritte bestraft genau das – weshalb die Frameworks, die beides anbieten, standardmäßig die ungeordnete Variante verwenden. </p> <p> Dieser Bewerter dient für den Teil einer Aufgabe, den die Datenbank nicht darstellen kann: Ein Ablehnungsszenario, dessen Kernpunkt darin besteht, dass niemals ein Schreibvorgang stattgefunden hat, sieht in den Daten identisch aus wie ein Lauf, der vor dem Start abgestürzt ist. Die Kombination aus „Die Ticketanzahl beträgt weiterhin vier“ und „Das Lösch-Tool wurde nie aufgerufen“ unterscheidet die beiden Fälle. </p><pre> &lt;tool-sequence label="read-only" required="model-instances.listInstances" forbidden="script-exec.changeData" /&gt; </pre> <p> Schreiben Sie einen Namen so, wie ein Administrator ihn konfiguriert, z. B. „factory.tool“: Ein Durchlauf protokolliert den reinen Namen, den das Modell verwendet hat, und der Grader vergleicht anhand des letzten Segments; daher dokumentiert die „factory“ im konfigurierten Namen, welches Tool gemeint ist, ohne beim Vergleich unterzugehen. <i>„Required“</i> darf nicht leer sein – eine „tool-sequence“-Erwartung mit ausschließlich verbotenen Namen würde einen Durchlauf bestehen, bei dem überhaupt nichts passiert ist. </p>
