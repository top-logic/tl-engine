model.tl.model.i18n.I18NHtml = Internationalisiertes HTML
model.tl.model.i18n.I18NHtml.tooltip = Ein formatierter Text, der in mehreren Sprachen erfasst werden kann. Er verhält sich wie der Typ "HTML", enthält aber je Sprache einen eigenen Inhalt: Jeder Nutzer sieht den Inhalt in seiner eigenen Sprache, und liegt für diese Sprache keiner vor, den Inhalt der für die Anwendung konfigurierten Fallback-Sprache.
