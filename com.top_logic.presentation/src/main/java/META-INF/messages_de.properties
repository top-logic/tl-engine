com.top_logic.presentation.script.PptTemplateFunctions.analyze = Präsentationsvorlage analysieren
com.top_logic.presentation.script.PptTemplateFunctions.analyze.param.template.tooltip = Die zu analysierende PowerPoint-Datei (<code>.pptx</code> oder <code>.potx</code>).
com.top_logic.presentation.script.PptTemplateFunctions.analyze.return = Das Wörterbuch, das die Vorlage beschreibt.
com.top_logic.presentation.script.PptTemplateFunctions.analyze.tooltip = Beschreibt den Aufbau und den Stil einer PowerPoint-Präsentation oder -Vorlage. <p> Das Ergebnis gibt Auskunft darüber, welche Folienlayouts eine Vorlage bietet, wo sich deren Platzhalter befinden und wie deren Texte aussehen sowie welche Farben, Schriftarten und Formstile die Vorlage verwendet. Es besteht ausschließlich aus Wörterbüchern, Listen, Texten, Zahlen und Wahrheitswerten, sodass es in JSON konvertiert werden kann. Einträge ohne Wert werden weggelassen. Alle Längenangaben sind in Punkten angegeben, Farben als sechs Hexadezimalziffern <code>RRGGBB</code>. </p> <p> Das Ergebnis ist ein Wörterbuch mit den folgenden Einträgen: </p> <ul> <li><code>"slideSize"</code>: Die Breite und Höhe einer Folie.</li> <li><code>"masters"</code>: Die Folienmaster mit ihrem Design (Designfarben und Schriftarten), ihrem Hintergrund, ihren Platzhaltern und ihren sonstigen Formen wie Logos.</li> <li><code>"layouts"</code>: Die Folienlayouts aller Folienmaster in der Reihenfolge, in der PowerPoint sie anzeigt. Jedes Layout hat seine Position in dieser Liste, seinen Namen, seinen vordefinierten Typ (z. B. <code>TITLE</code>, wenn es sich nicht um ein benutzerdefiniertes Layout handelt), seinen Folienmaster, seinen Hintergrund, seine Platzhalter und seine sonstigen Formen. Ein Platzhalter wird durch seinen Typ (z. B. <code>title</code>, <code>body</code>), seinen Index, seine tatsächliche Position und Größe, den Stil seines Textes und seinen Aufforderungstext beschrieben.</li> <li><code>"slides"</code>: Die Folien der Präsentation mit ihrem Layout und ihren Formen. Eine Form wird durch ihre Art, ihren Namen, ihre Position und Größe, ihre Geometrie, ihre Füllung, ihren Umriss, ihren Schatten und ihren Text beschrieben. Formen einer Gruppe werden als deren untergeordnete Elemente aufgeführt.</li> </ul> <p> Eine aus dem Design entnommene Farbe benennt die Designfarbe, auf die sie sich bezieht, zusammen mit den darauf angewendeten Anpassungen (z. B. Helligkeit oder Transparenz), sodass eine Form erstellt werden kann, die dem Farbschema der Vorlage entspricht. </p>
com.top_logic.presentation.script.PptTextFunctions.measureText = Text auf einer Folie messen
com.top_logic.presentation.script.PptTextFunctions.measureText.param.bold.tooltip = Ob der Text fett gesetzt ist.
com.top_logic.presentation.script.PptTextFunctions.measureText.param.font.tooltip = Der Name der Schriftfamilie, z. B. <code>Arial</code>.
com.top_logic.presentation.script.PptTextFunctions.measureText.param.italic.tooltip = Ob der Text kursiv gesetzt ist.
com.top_logic.presentation.script.PptTextFunctions.measureText.param.size.tooltip = Die Schriftgröße in Punkten.
com.top_logic.presentation.script.PptTextFunctions.measureText.param.text.tooltip = Der zu messende Text.
com.top_logic.presentation.script.PptTextFunctions.measureText.param.width.tooltip = Die für den Text verfügbare Breite in Punkten. Wird dieser Wert nicht angegeben, erfolgt kein Zeilenumbruch.
com.top_logic.presentation.script.PptTextFunctions.measureText.return = Das Wörterbuch, das die Ausdehnung des Textes beschreibt.
com.top_logic.presentation.script.PptTextFunctions.measureText.tooltip = Misst den Platz, den ein Text auf einer PowerPoint-Folie einnimmt. <p> Der Text wird genau so gesetzt wie in einem Textfeld ohne Innenränder, das als Bild gerendert wird. Jeder Zeilenumbruch im Text leitet einen neuen Absatz ein. Wenn eine Breite angegeben wird, wird der Text an Wortgrenzen umgebrochen, um in diese Breite zu passen, andernfalls nur an seinen Zeilenumbrüchen. </p> <p> Das Ergebnis ist ein Wörterbuch mit den folgenden Einträgen: </p> <ul> <li><code>"width"</code>: Die Breite der breitesten Zeile in Punkten.</li> <li><code>"lines"</code>: Die Anzahl der Zeilen nach dem Zeilenumbruch.</li> <li><code>"height"</code>: Die Höhe des Textes in Punkten. Ein Textfeld benötigt diese Höhe zuzüglich seines oberen und unteren Innenrands, um den gesamten Text anzuzeigen.</li> <li><code>"lineHeight"</code>: Der Abstand zwischen zwei Zeilen in Punkten.</li> <li><code>"fontAvailable"</code>: Gibt an, ob die Schriftart auf dem Server installiert ist. Eine nicht installierte Schriftart wird durch eine Standardschriftart ersetzt, sodass die Messung nicht mit dem Text übereinstimmt, den PowerPoint auf einem Computer anzeigt, auf dem die Schriftart vorhanden ist.</li> </ul>
