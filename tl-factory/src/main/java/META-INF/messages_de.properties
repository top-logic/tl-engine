com.top_logic.factory.project.FactoryFunctions.createWorkspace.tooltip = Legt den Workspace eines Projekts an: einen Container, in dem die Anwendung erzeugt - oder bei Git-Hosting aus dem Repository des Projekts geklont -, gebaut und gestartet wird.
com.top_logic.factory.project.FactoryFunctions.engineVersion = Standard-Engine-Version
com.top_logic.factory.project.FactoryFunctions.engineVersion.return = Die konfigurierte Engine-Version.
com.top_logic.factory.project.FactoryFunctions.engineVersion.tooltip = Die TopLogic-Version, auf der ein neues Projekt seine Anwendung aufbaut, sofern es keine andere wählt.
com.top_logic.factory.project.FactoryFunctions.gitHosting = Git-Hosting eingeschaltet
com.top_logic.factory.project.FactoryFunctions.gitHosting.return = Ob Git-Hosting eingeschaltet ist.
com.top_logic.factory.project.FactoryFunctions.gitHosting.tooltip = Ob die Projekte Repositorys bei einem Git-Hosting-Dienst haben.
com.top_logic.factory.project.FactoryFunctions.imageOutdated = Workspace-Image veraltet
com.top_logic.factory.project.FactoryFunctions.imageOutdated.param.workspace.tooltip = Der Workspace eines Projekts.
com.top_logic.factory.project.FactoryFunctions.imageOutdated.return = Ob der Workspace veraltet ist.
com.top_logic.factory.project.FactoryFunctions.imageOutdated.tooltip = Ob der Container eines Workspaces auf einem anderen als dem aktuellen Workspace-Image läuft, sodass ihm Änderungen an den Werkzeugen des Images fehlen, bis er aktualisiert wird.
com.top_logic.factory.project.FactoryFunctions.lastBuild = Letzter CI-Build
com.top_logic.factory.project.FactoryFunctions.lastBuild.param.project.tooltip = Das Projekt.
com.top_logic.factory.project.FactoryFunctions.lastBuild.return = Ein Wörterbuch mit der Nummer (Schlüssel „number“), dem Status („state“, z. B. „SUCCESS“, und „stateLabel“ für die Anzeige), der Seite („url“), der Startzeit („startTime“) und der Dauer in Sekunden („durationSeconds“) des Builds; wenn der CI-Server nicht gefragt werden kann, ein Wörterbuch nur mit dem Grund („error“); nichts, wenn CI deaktiviert ist, das Projekt keinen CI-Job hat oder der Job keinen Build.
com.top_logic.factory.project.FactoryFunctions.lastBuild.tooltip = Der letzte Build des CI-Jobs eines Projekts, abgerufen vom CI-Server.
com.top_logic.factory.project.FactoryFunctions.start = Workspace eines Projekts starten
com.top_logic.factory.project.FactoryFunctions.start.param.project.tooltip = Ein Projekt, dessen Workspace gestoppt ist.
com.top_logic.factory.project.FactoryFunctions.start.tooltip = Startet den Workspace eines Projekts und damit seine Anwendung.
com.top_logic.factory.project.FactoryFunctions.startBuild = CI-Build starten
com.top_logic.factory.project.FactoryFunctions.startBuild.param.project.tooltip = Ein Projekt mit Repository.
com.top_logic.factory.project.FactoryFunctions.startBuild.return = Die Meldung, aus der hervorgeht, welcher Build gestartet wurde.
com.top_logic.factory.project.FactoryFunctions.startBuild.tooltip = Startet einen Build der Anwendung eines Projekts auf dem CI-Server. Der CI-Job des Projekts wird zunächst erstellt, falls er noch nicht existiert, und so konfiguriert, dass das Repository des Projekts gebaut wird.
com.top_logic.factory.project.FactoryFunctions.stop = Workspace eines Projekts stoppen
com.top_logic.factory.project.FactoryFunctions.stop.param.project.tooltip = Ein Projekt, dessen Workspace läuft.
com.top_logic.factory.project.FactoryFunctions.stop.tooltip = Stoppt den Workspace eines Projekts und damit seine Anwendung. Quellen, Maven-Repository und Datenbank des Workspaces bleiben erhalten.
com.top_logic.factory.project.FactoryFunctions.update = Workspace eines Projekts aktualisieren
com.top_logic.factory.project.FactoryFunctions.update.param.project.tooltip = Ein Projekt, auf dessen Workspace keine Operation läuft.
com.top_logic.factory.project.FactoryFunctions.update.tooltip = Legt den Container des Workspaces eines Projekts auf dem aktuellen Workspace-Image neu an. Quellen, Maven-Repository, Datenbank und initiales Passwort des Workspaces bleiben erhalten; ein laufender Workspace wird wieder gestartet.
com.top_logic.factory.project.ProjectWorkspaces = Projekt-Workspaces
com.top_logic.factory.project.ProjectWorkspaces.Config.application-check-interval = Prüfintervall der Anwendungen
com.top_logic.factory.project.ProjectWorkspaces.Config.application-check-interval.tooltip = Millisekunden zwischen zwei Prüfungen der Anwendungen der Workspaces, deren Container läuft, 0 für keine Prüfungen. <p> Die Anwendung eines laufenden Containers kann ohne eine Operation der Steueranwendung stoppen oder starten, z. B. wenn der Agent des Workspace sie neu startet. Die Prüfung speichert <i>Anwendung gestoppt</i> für einen Workspace im Zustand <i>Läuft</i>, dessen Anwendung gestoppt oder fehlgeschlagen ist, und <i>Läuft</i> für einen Workspace im Zustand <i>Anwendung gestoppt</i>, dessen Anwendung wieder antwortet. </p>
com.top_logic.factory.project.ProjectWorkspaces.Config.log-flush-interval = Speicherintervall der Ausgabe
com.top_logic.factory.project.ProjectWorkspaces.Config.log-flush-interval.tooltip = Millisekunden zwischen zwei Commits der Ausgabe einer laufenden Operation.
com.top_logic.factory.project.ProjectWorkspaces.Config.max-log-size = Maximale Größe der Ausgabe
com.top_logic.factory.project.ProjectWorkspaces.Config.max-log-size.tooltip = Anzahl der Zeichen der Ausgabe einer Operation, die gespeichert werden; ältere Ausgaben werden verworfen.
com.top_logic.factory.project.ProjectWorkspaces.tooltip = Dienst, der die Operationen auf den Workspaces der Projekte im Hintergrund ausführt und die Workspace-Objekte dabei aktuell hält. <p> Anlegen, Starten, Stoppen und Entfernen eines Workspaces dauert Sekunden bis Minuten. Eine Operation wird daher aus einer Anfrage heraus gestartet, die nur den Zustand speichert, in dem die Operation ist (z. B. <i>„wird gebaut“</i>), und läuft auf einem Worker-Thread dieses Dienstes in einem Systemkontext. Die Ausgabe der Operation wird in einem <i>Workspace-Log</i> gesammelt, das sie in jedem Speicherintervall in einer eigenen Transaktion speichert; der Endzustand wird gespeichert, wenn die Operation endet. Eine Ansicht, die diesen Commits folgt, zeigt den Fortschritt, während die Operation läuft. </p> <p> Auf einem Workspace läuft immer nur eine Operation. Nach einem Neustart vergleicht der Dienst die gespeicherten Zustände mit den vorhandenen Containern (siehe <i>Workspace-Abgleich</i>). Auch das geschieht auf einem Worker-Thread, sodass die Anwendung auch dann startet, wenn die Container-Plattform nicht erreichbar ist. </p>
com.top_logic.factory.project.WorkspaceLogSource = Log-Quelle eines Workspaces
com.top_logic.factory.project.WorkspaceLogSource.Config.tail-lines = Letzte Zeilen
com.top_logic.factory.project.WorkspaceLogSource.Config.tail-lines.tooltip = Die Anzahl der letzten Zeilen des Logs, die veröffentlicht werden.
com.top_logic.factory.project.WorkspaceLogSource.Config.workspace = Workspace
com.top_logic.factory.project.WorkspaceLogSource.Config.workspace.tooltip = Der Kanal der Ansicht, der den tl.factory:Workspace hält, dessen Log veröffentlicht wird.
com.top_logic.factory.project.WorkspaceLogSource.tooltip = <i>Kanalquelle</i>, die das Log der Anwendung eines Workspaces veröffentlicht, während es geschrieben wird: die letzten Zeilen der Ausgabe des Hauptprozesses des Workspaces auf dem konfigurierten Kanal, als ein Text. <pre> &lt;source-channel name="appLog" update-interval="1000"&gt; &lt;source class="com.top_logic.factory.project.WorkspaceLogSource" workspace="workspace" tail-lines="500"/&gt; &lt;/source-channel&gt; </pre> <p> Jede angezeigte Ansicht folgt dem Log des Workspaces, den ihr Kanal hält, und folgt einem anderen, wenn sich der Kanal ändert. Ein Neustart des Workspaces beendet die Ausgabe seines Hauptprozesses; der nächste Commit, der den Workspace ändert - seinen Zustand -, folgt der neuen Ausgabe. Die Lieferung endet, wenn die Ansicht nicht mehr angezeigt wird. </p>
com.top_logic.factory.project.WorkspaceStatus = Workspace-Status
com.top_logic.factory.project.WorkspaceStatus.APP_STOPPED = Anwendung gestoppt
com.top_logic.factory.project.WorkspaceStatus.APP_STOPPED.tooltip = Der Container läuft, seine Anwendung nicht: Sie wurde gestoppt oder ist beim Start fehlgeschlagen. <p> Der Agent des Workspace kann in diesem Zustand arbeiten, z. B. um die Anwendung zu reparieren. </p>
com.top_logic.factory.project.WorkspaceStatus.BUILDING = Wird gebaut
com.top_logic.factory.project.WorkspaceStatus.BUILDING.tooltip = Der Container wird angelegt, die Anwendung wird erzeugt und gebaut.
com.top_logic.factory.project.WorkspaceStatus.CREATED = Angelegt
com.top_logic.factory.project.WorkspaceStatus.CREATED.tooltip = Der Container existiert, wurde jedoch noch nie gestartet.
com.top_logic.factory.project.WorkspaceStatus.ERROR = Fehler
com.top_logic.factory.project.WorkspaceStatus.ERROR.tooltip = Die letzte Operation ist fehlgeschlagen oder der Container ist verloren gegangen; die Ausgabe nennt den Grund.
com.top_logic.factory.project.WorkspaceStatus.REMOVING = Wird aufgeräumt
com.top_logic.factory.project.WorkspaceStatus.REMOVING.tooltip = Der Container und die Volumes werden entfernt.
com.top_logic.factory.project.WorkspaceStatus.RUNNING = Läuft
com.top_logic.factory.project.WorkspaceStatus.RUNNING.tooltip = Die Anwendung läuft und antwortet unter dem Vorschau-Link.
com.top_logic.factory.project.WorkspaceStatus.STARTING = Wird gestartet
com.top_logic.factory.project.WorkspaceStatus.STARTING.tooltip = Die Anwendung startet; der Zustand wechselt zu <i>„läuft“</i>, sobald sie antwortet.
com.top_logic.factory.project.WorkspaceStatus.STOPPED = Gestoppt
com.top_logic.factory.project.WorkspaceStatus.STOPPED.tooltip = Der Container ist angehalten, seine Volumes bleiben erhalten.
com.top_logic.factory.project.WorkspaceStatus.STOPPING = Wird gestoppt
com.top_logic.factory.project.WorkspaceStatus.STOPPING.tooltip = Der Container wird angehalten.
com.top_logic.factory.project.WorkspaceStatus.UNKNOWN = Unbekannt
com.top_logic.factory.project.WorkspaceStatus.UNKNOWN.tooltip = Die Container-Plattform hat den Zustand nicht mitgeteilt, z. B. weil sie nicht erreichbar war.
com.top_logic.factory.project.WorkspaceStatus.UPDATING = Wird aktualisiert
com.top_logic.factory.project.WorkspaceStatus.UPDATING.tooltip = Der Container wird auf dem aktuellen Workspace-Image neu angelegt, seine Volumes bleiben erhalten.
com.top_logic.factory.project.WorkspaceStatus.tooltip = Der gespeicherte Zustand des Workspaces eines Projekts, das Java-Gegenstück der Klassifikatoren der Aufzählung <code>"WorkspaceStatus"</code>. <p> Neben den Zuständen des Containers, die ein <i>Workspace-Provider</i> meldet (siehe <i>Workspace-Zustand</i>), ist ein Workspace in einem beschäftigten Zustand, solange eine Operation auf ihm läuft, und im Zustand <i>„Fehler“</i>, nachdem eine Operation fehlgeschlagen ist. </p>
com.top_logic.factory.proxy.ProxyAdmission$Status = Zulassung
com.top_logic.factory.proxy.ProxyAdmission$Status.tooltip = Ob eine Anfrage an ihre Route übergeben wird, und warum nicht.
com.top_logic.factory.proxy.ProxyAdmission.Status.ADMITTED = Zugelassen
com.top_logic.factory.proxy.ProxyAdmission.Status.ADMITTED.tooltip = Das Token ist gültig; die Anfrage wird an ihre Route übergeben.
com.top_logic.factory.proxy.ProxyAdmission.Status.FOREIGN_SOURCE = Fremde Quelle
com.top_logic.factory.proxy.ProxyAdmission.Status.FOREIGN_SOURCE.tooltip = Das Token ist gültig, wurde aber zuerst von einer anderen Adresse aus verwendet.
com.top_logic.factory.proxy.ProxyAdmission.Status.INVALID_TOKEN = Ungültiges Token
com.top_logic.factory.proxy.ProxyAdmission.Status.INVALID_TOKEN.tooltip = Das Token fehlt, ist unbekannt, widerrufen oder abgelaufen, oder sein Workspace existiert nicht mehr.
com.top_logic.factory.proxy.ProxyAdmission.Status.RATE_LIMITED = Ratenbegrenzt
com.top_logic.factory.proxy.ProxyAdmission.Status.RATE_LIMITED.tooltip = Das Token ist gültig, hat aber in der letzten Minute zu viele Anfragen gestellt.
com.top_logic.factory.proxy.ProxyError = Proxy-Fehler
com.top_logic.factory.proxy.ProxyError.FOREIGN_SOURCE = Fremde Quelle
com.top_logic.factory.proxy.ProxyError.FOREIGN_SOURCE.tooltip = Das Token der Anfrage ist an eine andere Adresse gebunden.
com.top_logic.factory.proxy.ProxyError.INVALID_TOKEN = Ungültiges Token
com.top_logic.factory.proxy.ProxyError.INVALID_TOKEN.tooltip = Die Anfrage trägt kein gültiges Token.
com.top_logic.factory.proxy.ProxyError.NOT_FOUND = Nicht gefunden
com.top_logic.factory.proxy.ProxyError.NOT_FOUND.tooltip = Die Anfrage erreicht keine Route, oder der Proxy ist ausgeschaltet.
com.top_logic.factory.proxy.ProxyError.RATE_LIMITED = Ratenbegrenzt
com.top_logic.factory.proxy.ProxyError.RATE_LIMITED.tooltip = Das Token der Anfrage hat seine Ratenbegrenzung überschritten.
com.top_logic.factory.proxy.ProxyError.SOURCE_NOT_ALLOWED = Quelle nicht zulässig
com.top_logic.factory.proxy.ProxyError.SOURCE_NOT_ALLOWED.tooltip = Die Anfrage kommt von einer Adresse, die der Proxy nicht annimmt.
com.top_logic.factory.proxy.ProxyError.tooltip = Warum der <i>Workspace-Proxy-Handler</i> eine Anfrage ablehnt, bevor ihre Route sie bearbeitet. <p> Die Route beantwortet sie im Format ihres Protokolls. Die Meldung ist ein fester Text, nie etwas aus der Anfrage. </p>
com.top_logic.factory.proxy.ProxyRoute.Config.path = Pfad
com.top_logic.factory.proxy.ProxyRoute.Config.path.tooltip = Der Pfad der Route unterhalb der Wurzel des Proxys: beginnt mit einem Schrägstrich und endet mit keinem, z. B. /llm-proxy.
com.top_logic.factory.proxy.WorkspaceProxyService = Workspace-Proxy-Dienst
com.top_logic.factory.proxy.WorkspaceProxyService.Config.allowed-sources = Zulässige Quellen
com.top_logic.factory.proxy.WorkspaceProxyService.Config.allowed-sources.tooltip = Die Client-Adressen, von denen Anfragen angenommen werden: Bereiche in CIDR-Notation (IPv4 oder IPv6), einzelne Adressen oder <code>"workspace-network"</code> für das Netzwerk der Workspace-Container. <p> Leer nimmt jede Adresse an. Geprüft wird die Adresse der Verbindung, nie ein Header der Anfrage: Hinter einem Reverse-Proxy oder einem Gateway ist es die Adresse dieses Proxys. </p>
com.top_logic.factory.proxy.WorkspaceProxyService.Config.listen-address = Lauschadresse
com.top_logic.factory.proxy.WorkspaceProxyService.Config.listen-address.tooltip = Die Adresse, auf der der Proxy mit einem eigenen Port lauscht, siehe <i>Lauschport</i>. <p> Die Voreinstellung, die Loopback-Adresse, dient nur einem Reverse-Proxy oder Tunnel auf demselben Host. Läuft die Steueranwendung auf dem Host des Docker-Daemons, ist es die Adresse, für die host-gateway in den Workspaces steht - das Gateway der Standard-Bridge von Docker, z. B. 172.17.0.1 -, sodass die Workspaces ihn erreichen, aber kein anderer Host. In einem eigenen Container lauscht die Steueranwendung auf 0.0.0.0, und der Port wird nicht oder nur auf einer internen Adresse veröffentlicht. </p>
com.top_logic.factory.proxy.WorkspaceProxyService.Config.listen-port = Lauschport
com.top_logic.factory.proxy.WorkspaceProxyService.Config.listen-port.tooltip = Der Port, auf dem der Proxy neben dem Port der Steueranwendung lauscht; 0 für keinen eigenen Port. <p> Die Routen sind dort unter ihren Pfaden erreichbar. Der Port wird nur geöffnet, wenn der Proxy über seine URL eingeschaltet ist. </p>
com.top_logic.factory.proxy.WorkspaceProxyService.Config.max-token-lifetime = Maximale Token-Lebensdauer
com.top_logic.factory.proxy.WorkspaceProxyService.Config.max-token-lifetime.tooltip = Die längste Lebensdauer eines Tokens in Millisekunden, z. B. 4h; eine längere angeforderte Lebensdauer wird darauf gekürzt.
com.top_logic.factory.proxy.WorkspaceProxyService.Config.proxy-url = Proxy-URL
com.top_logic.factory.proxy.WorkspaceProxyService.Config.proxy-url.tooltip = Die URL der Wurzel des Proxys, wie die Workspace-Container sie erreichen, ohne den Pfad einer Route: sein eigener Port, z. B. http://host.docker.internal:8091, oder die Webanwendung mit dem <i>Workspace-Proxy-Servlet</i>, z. B. http://host.docker.internal:8080/tl-factory-app. <p> Eine Route ist unter dieser URL, gefolgt von ihrem Pfad, erreichbar. Leer schaltet den Proxy aus. </p>
com.top_logic.factory.proxy.WorkspaceProxyService.Config.rate-limit = Ratenbegrenzung
com.top_logic.factory.proxy.WorkspaceProxyService.Config.rate-limit.tooltip = Die Anfragen pro Minute, die ein Token stellen darf, in Schüben bis zu dieser Zahl; 0 für keine Begrenzung. <p> Eine Anfrage darüber hinaus wird mit 429 und den zu wartenden Sekunden in Retry-After beantwortet, die Claude Code abwartet, bevor es die Anfrage wiederholt. Die Voreinstellung lässt einem Agenten, der mit voller Geschwindigkeit arbeitet - eine Anfrage pro Schritt und einige Nebenanfragen -, Spielraum und begrenzt ein Token, das aus dem Workspace gelangt ist. </p>
com.top_logic.factory.proxy.WorkspaceProxyService.Config.routes = Routen
com.top_logic.factory.proxy.WorkspaceProxyService.Config.routes.tooltip = Die Dienste, auf die der Proxy den Workspaces Zugriff gibt, jeder unterhalb eines eigenen Pfads.
com.top_logic.factory.proxy.WorkspaceProxyService.Config.servlet-enabled = Servlet eingeschaltet
com.top_logic.factory.proxy.WorkspaceProxyService.Config.servlet-enabled.tooltip = Ob der Proxy auch in der Webanwendung antwortet, über den Port der Steueranwendung, unter den Pfaden, auf die das <i>Workspace-Proxy-Servlet</i> abgebildet ist. <p> Standardmäßig aus: Den Port der Steueranwendung erreichen ihre Benutzer, und der Proxy muss dort nicht erreichbar sein. Ist es eingeschaltet, muss ein Reverse-Proxy vor der Steueranwendung Clients von außen von diesen Pfaden fernhalten. </p>
com.top_logic.factory.proxy.WorkspaceProxyService.tooltip = Zugriff der Workspaces auf Dienste der Umgebung der Steueranwendung ohne Zugangsdaten im Workspace. <p> Ein Workspace-Container erhält in seiner Umgebung weder Zugangsdaten noch ein Token, nur was seine Routen brauchen, um den Proxy zu finden, z. B. die URL der LLM-Route - die URL des Proxys, gefolgt vom Pfad der Route. Ein Prozess, der den Proxy nutzen darf - ein Agentenlauf -, erhält ein eigenes Token, das für seinen Workspace ausgestellt und nur diesem Prozess in der Umgebung seines Kommandos übergeben wird, mit der Git-Konfiguration, die die Routen beitragen. Der Proxy nimmt eine Anfrage von einer zulässigen Adresse an, deren Token sie zulässt, und übergibt sie der Route ihres Pfads, die die Zugangsdaten ihres Upstreams hinzufügt und sie weiterleitet, siehe <i>Workspace-Proxy-Handler</i>. </p> <p> Ein Token besteht aus <code>"tlwst_"</code>, gefolgt von einem zufälligen Geheimnis von etwa 256 Bit. Es ist für alle Routen gültig, bis es widerrufen wird - wenn sein Lauf endet -, bis seine Lebensdauer abläuft (höchstens <i>Maximale Token-Lebensdauer</i>) oder bis sein Workspace entfernt wird. Es ist an die Adresse seiner ersten Anfrage gebunden und auf <i>Ratenbegrenzung</i> Anfragen pro Minute begrenzt, siehe <i>Token-Zuteilungen</i>. Tokens werden nur im Speicher gehalten, als ihre Hashes; ein Neustart der Steueranwendung macht alle ungültig, zusammen mit den von ihr gestarteten Läufen. </p> <p> Der Proxy wird über seine URL eingeschaltet: Ohne sie erhalten Workspaces keine URL, es wird kein Token ausgestellt, und der Proxy beantwortet jede Anfrage mit 404. Er lauscht auf einem eigenen Port (<i>Workspace-Proxy-Listener</i>, <i>Lauschadresse</i>, <i>Lauschport</i>); das <i>Workspace-Proxy-Servlet</i> in der Webanwendung antwortet nur, wenn <i>Servlet eingeschaltet</i> gesetzt ist. </p>
com.top_logic.factory.server.ServerProviderConfig.base-url = Basis-URL
com.top_logic.factory.server.ServerProviderConfig.base-url.tooltip = Die URL des Servers; leer schaltet den Anbieter ab.
com.top_logic.factory.workspace.WorkspaceService = Workspace-Dienst
com.top_logic.factory.workspace.WorkspaceService.Config.applications = Anwendungs-Workspaces
com.top_logic.factory.workspace.WorkspaceService.Config.applications.tooltip = Wie Workspaces eingerichtet werden, die eine TopLogic-Anwendung enthalten.
com.top_logic.factory.workspace.WorkspaceService.Config.provider = Anbieter
com.top_logic.factory.workspace.WorkspaceService.Config.provider.tooltip = Die Container-Plattform, in der die Workspaces angelegt werden.
com.top_logic.factory.workspace.WorkspaceService.tooltip = Dienst, der den <i>Workspace-Anbieter</i> hält, der die Workspaces der Anwendung verwaltet. <p> Beim Start des Dienstes wird die Container-Plattform nicht kontaktiert, sodass die Anwendung auch dann startet, wenn die Plattform nicht erreichbar ist; das meldet erst die erste Workspace-Operation. </p>
com.top_logic.factory.workspace.WorkspaceState = Workspace-Zustand
com.top_logic.factory.workspace.WorkspaceState.CREATED = Angelegt
com.top_logic.factory.workspace.WorkspaceState.CREATED.tooltip = Der Container existiert, wurde aber noch nie gestartet.
com.top_logic.factory.workspace.WorkspaceState.MISSING = Fehlt
com.top_logic.factory.workspace.WorkspaceState.MISSING.tooltip = Der Workspace hat keinen Container. Volumes des Workspaces können noch vorhanden sein.
com.top_logic.factory.workspace.WorkspaceState.RUNNING = Läuft
com.top_logic.factory.workspace.WorkspaceState.RUNNING.tooltip = Der Container läuft.
com.top_logic.factory.workspace.WorkspaceState.STOPPED = Gestoppt
com.top_logic.factory.workspace.WorkspaceState.STOPPED.tooltip = Der Container wurde schon einmal gestartet und läuft gerade nicht. Seine Volumes bleiben erhalten.
com.top_logic.factory.workspace.WorkspaceState.UNKNOWN = Unbekannt
com.top_logic.factory.workspace.WorkspaceState.UNKNOWN.tooltip = Der Container ist in einem Zustand, den der Anbieter nicht verwaltet, z. B. pausiert, wird entfernt oder abgestürzt.
com.top_logic.factory.workspace.WorkspaceState.tooltip = Der Zustand des Containers eines Workspaces, wie ihn ein <i>Workspace-Anbieter</i> meldet.
com.top_logic.factory.workspace.app.ApplicationWorkspaces$ApplicationState = Anwendungsstatus
com.top_logic.factory.workspace.app.ApplicationWorkspaces$ApplicationState.tooltip = Der Zustand der Anwendung in einem laufenden Workspace, wie <code>"tl-workspace-app"</code> ihn meldet.
com.top_logic.factory.workspace.app.ApplicationWorkspaces$Config = Anwendungs-Workspaces
com.top_logic.factory.workspace.app.ApplicationWorkspaces$Config.tooltip = Konfiguration der <i>Anwendungs-Workspaces</i>.
com.top_logic.factory.workspace.app.ApplicationWorkspaces.ApplicationState.CHANGING = Im Wechsel
com.top_logic.factory.workspace.app.ApplicationWorkspaces.ApplicationState.CHANGING.tooltip = Die Anwendung wird gestartet oder beendet.
com.top_logic.factory.workspace.app.ApplicationWorkspaces.ApplicationState.FAILED = Fehlgeschlagen
com.top_logic.factory.workspace.app.ApplicationWorkspaces.ApplicationState.FAILED.tooltip = Die Anwendung hat sich selbst beendet oder ihre Initialisierung ist fehlgeschlagen.
com.top_logic.factory.workspace.app.ApplicationWorkspaces.ApplicationState.RUNNING = Läuft
com.top_logic.factory.workspace.app.ApplicationWorkspaces.ApplicationState.RUNNING.tooltip = Die Anwendung antwortet.
com.top_logic.factory.workspace.app.ApplicationWorkspaces.ApplicationState.STOPPED = Gestoppt
com.top_logic.factory.workspace.app.ApplicationWorkspaces.ApplicationState.STOPPED.tooltip = Die Anwendung wurde auf Anforderung gestoppt oder ist noch nicht gebaut.
com.top_logic.factory.workspace.app.ApplicationWorkspaces.ApplicationState.UNKNOWN = Unbekannt
com.top_logic.factory.workspace.app.ApplicationWorkspaces.ApplicationState.UNKNOWN.tooltip = Der Workspace teilt ihn nicht mit.
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.build-timeout = Build-Timeout
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.build-timeout.tooltip = Sekunden, die ein Maven-Lauf dauern darf: das Erzeugen einer Anwendung, ihr Build, das Befüllen eines Release-Repositorys. <p> Ein Lauf, der länger dauert, wird abgebrochen und lässt die Operation fehlschlagen. </p>
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.engine-version = Engine-Version
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.engine-version.tooltip = Die TopLogic-Version, auf der eine Anwendung aufgebaut wird, die keine eigene Version wählt.
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.image-repository = Image-Name
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.image-repository.tooltip = Name des Workspace-Images ohne Tag. <p> Das Tag ist der Inhalts-Hash der Dateien, aus denen das Image erstellt wurde. </p>
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.repository-url = URL des Repositorys
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.repository-url.tooltip = URL des Maven-Repositorys, aus dem die TopLogic-Versionen bezogen werden.
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.start-timeout = Start-Timeout
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.start-timeout.tooltip = Sekunden, die auf die Antwort einer gestarteten Anwendung gewartet wird.
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider = Docker-Workspace-Anbieter
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.connect-timeout = Verbindungs-Timeout
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.connect-timeout.tooltip = Timeout in Sekunden für den Aufbau einer Verbindung zum Daemon.
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.cpu-limit = CPU-Begrenzung
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.cpu-limit.tooltip = Die Anzahl der CPUs, die ein Workspace-Container nutzen darf, z. B. 4 oder 1.5; 0 für keine Begrenzung. <p> Eine Begrenzung über den CPUs des Daemon-Hosts wird auf diese gekürzt. Unter einem rootless Daemon braucht die Begrenzung den an den Benutzer des Daemons delegierten CPU-Controller, siehe den Artikel factory/docker-server. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.docker-host = Docker-Host
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.docker-host.tooltip = Die URI des Docker-Daemons. <p> Entweder der Socket eines lokalen Daemons, z. B. unix:///var/run/docker.sock, oder die Adresse eines entfernten Daemons oder eines Socket-Proxys, z. B. tcp://docker-proxy:2375. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.extra-hosts = Zusätzliche Hosts
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.extra-hosts.tooltip = Einträge, die zu den Host-Namen hinzugefügt werden, die ein Workspace-Container auflöst, jeder ein Host-Name und eine Adresse, getrennt durch einen Doppelpunkt. <p> Die Adresse host-gateway steht für die Adresse des Daemon-Hosts, wie die Container sie sehen: host.docker.internal:host-gateway lässt einen Workspace einen Dienst auf dem Daemon-Host, z. B. eine dort direkt laufende Anwendung, unter dem Namen host.docker.internal erreichen. Die Einträge gelten für Container, die danach angelegt werden. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.host-ip = Host-IP
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.host-ip.tooltip = Die Adresse des Daemon-Hosts, auf der der Port eines Workspaces veröffentlicht wird. <p> Die Voreinstellung, die Loopback-Adresse, macht die Anwendungen der Workspaces nur vom Daemon-Host aus erreichbar. Ein Server, der sie den Browsern seiner Benutzer bereitstellt, nennt die Adresse der Schnittstelle, auf der sie erreichbar sein sollen, z. B. die, an die ein Reverse-Proxy weiterleitet; leer veröffentlicht sie auf allen Adressen des Hosts. Ein rootful Docker-Daemon veröffentlicht Ports an den Firewall-Regeln des Hosts (UFW) vorbei, daher ist die Adresse die Einschränkung, die gilt. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.host-port-max = Höchster Host-Port
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.host-port-max.tooltip = Der höchste Port des Daemon-Hosts, auf dem ein Workspace-Port veröffentlicht wird.
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.host-port-min = Niedrigster Host-Port
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.host-port-min.tooltip = Der niedrigste Port des Daemon-Hosts, auf dem ein Workspace-Port veröffentlicht wird.
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.isolate-workspaces = Workspaces isolieren
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.isolate-workspaces.tooltip = Ob die Workspace-Container einander im Netzwerk nicht erreichen. <p> Das Netzwerk wird mit ausgeschaltetem <code>"com.docker.network.bridge.enable_icc"</code> angelegt: Ein Container erreicht den Daemon-Host - sein Gateway - und über ihn die Außenwelt, aber nicht die Ports eines anderen Containers im Netzwerk. Die Option wird beim Anlegen des Netzwerks gesetzt; ein vorhandenes Netzwerk mit anderer Einstellung wird nicht geändert, der Anbieter protokolliert eine Warnung, und das Netzwerk muss entfernt werden, damit es neu angelegt wird. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.label-namespace = Label-Namensraum
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.label-namespace.tooltip = Präfix der Schlüssel der Labels, an denen der Anbieter seine Objekte erkennt. <p> Zwei Anwendungen, die denselben Daemon nutzen, müssen verschiedene Namensräume verwenden, sonst hält jede die Workspaces der anderen für ihre eigenen. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.memory-limit = Speicherbegrenzung
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.memory-limit.tooltip = Der Speicher, den ein Workspace-Container nutzen darf, z. B. 8g; 0 für keine Begrenzung. <p> Die Voreinstellung 8g fasst die Java-Prozesse eines Workspaces - die Anwendung, einen Maven-Build und den tl-mcp-Server des Agenten, die jeweils ein Viertel der Begrenzung als Standard-Heap nehmen - neben Claude Code und dem headless Chromium der Browser-Prüfungen. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.name-prefix = Namenspräfix
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.name-prefix.tooltip = Präfix der Namen der Container und Volumes, die der Anbieter anlegt. <p> Der Name eines Containers ist das Präfix gefolgt von der Workspace-Kennung, der Name eines Volumes zusätzlich gefolgt vom Volume-Namen. Namen müssen nur eindeutig sein, der Anbieter erkennt ein Objekt nie an seinem Namen. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.network = Netzwerk
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.network.tooltip = Name des Docker-Netzwerks, dem die Workspace-Container beitreten. <p> Existiert das Netzwerk nicht, wird es angelegt. Eine Anwendung, die selbst in einem Container desselben Daemons läuft, muss mit diesem Netzwerk verbunden sein, um die Workspaces über den Container-Namen zu erreichen. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.pids-limit = Prozessbegrenzung
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.pids-limit.tooltip = Die Anzahl der Prozesse und Threads, die ein Workspace-Container gleichzeitig ausführen darf; 0 für keine Begrenzung. <p> Die Begrenzung stoppt eine Fork-Bombe; die Voreinstellung lässt Platz für die Threads mehrerer Java-Prozesse und des Browsers. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.public-host = Öffentlicher Host
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.public-host.tooltip = Host-Name des Daemon-Hosts, unter dem ein Browser die veröffentlichten Ports erreicht. <p> Die Vorschau-URL eines Workspaces wird aus diesem Namen und dem Host-Port gebildet. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.stop-timeout = Stopp-Timeout
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.stop-timeout.tooltip = Sekunden, die ein Container beim Stoppen zum Herunterfahren bekommt, bevor er beendet wird.
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.terminate-timeout = Abbruch-Timeout
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.terminate-timeout.tooltip = Sekunden, die ein in einem Workspace laufender Befehl beim Abbrechen bekommt, um sich zu beenden, bevor er hart beendet wird.
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.tls-cert-path = TLS-Zertifikatsverzeichnis
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.tls-cert-path.tooltip = Verzeichnis mit dem Client-Zertifikat (cert.pem, key.pem) und dem CA-Zertifikat (ca.pem) für eine TLS-Verbindung zu einem tcp://-Daemon. <p> Ist es nicht gesetzt, ist die Verbindung unverschlüsselt. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.tooltip = <i>Workspace-Anbieter</i>, der jeden Workspace in einem Container eines Docker-Daemons ausführt, angesprochen über die Docker-Engine-API. <p> Der Daemon wird über <i>Docker-Host</i> adressiert, sodass die Anwendung auf dem Daemon-Host selbst, in einem Container dieses Daemons (mit Zugriff auf dessen Socket oder einen Socket-Proxy) oder an beliebiger anderer Stelle (mit einem entfernten Daemon) laufen kann. Deshalb legt der Anbieter nur benannte Volumes an und bindet nie einen Pfad ein: Ein Host-Pfad würde auf dem Daemon-Host aufgelöst, nicht dort, wo die Anwendung läuft. </p> <p> Alles, was der Anbieter anlegt, trägt Labels im Label-Namensraum: Container und Volumes das Label <code>"workspace"</code> mit der Workspace-Kennung, gemeinsame Volumes das Label <code>"shared"</code> mit ihrem logischen Namen, gebaute Images das Label <code>"image"</code> mit ihrem Repository, das Netzwerk das Label <code>"network"</code>. Der Anbieter findet seine Objekte nur über diese Labels, nie über ihren Namen. </p> <p> Alle Workspace-Container treten dem Netzwerk <i>Netzwerk</i> bei, das angelegt wird, falls es nicht existiert. Der Container-Port eines Workspaces wird auf einem Port im Bereich von <i>Niedrigster Host-Port</i> bis <i>Höchster Host-Port</i> veröffentlicht, den der Daemon bei jedem Start neu unter den zu diesem Zeitpunkt freien Ports des Bereichs wählt. </p> <p> Das Netzwerk wird mit ausgeschaltetem <code>"com.docker.network.bridge.enable_icc"</code> angelegt, wenn <i>Workspaces isolieren</i> gesetzt ist, sodass ein Workspace-Container keinen anderen darin erreicht. Der Host-Port wird nur auf <i>Host-IP</i> gebunden, standardmäßig die Loopback-Adresse des Daemon-Hosts. </p> <p> Jeder Workspace-Container ist in Speicher, CPUs und Prozessen begrenzt, läuft ohne jede Capability (<i>alle</i> entfernt) und mit <code>"no-new-privileges"</code>: Kein Prozess darin erlangt Rechte, auch keiner des Benutzers root oder eines setuid-Programms. Der Anbieter führt selbst keinen Befehl als root aus; ein Befehl wird von seinem eigenen Benutzer beendet. </p> <p> Die zusätzlichen Hosts werden zu den Host-Namen hinzugefügt, die ein Workspace-Container auflöst, z. B. um die Anwendung auf dem Daemon-Host über das Gateway des Daemons zu erreichen. </p> <p> Ein Befehl, der in einem Workspace läuft, braucht ein sh mit kill im Image: Der Befehl läuft unter einem Shell-Skript, das seine Prozess-ID meldet, und beim Abbrechen werden seiner Prozessgruppe mit kill Signale gesendet. </p>
