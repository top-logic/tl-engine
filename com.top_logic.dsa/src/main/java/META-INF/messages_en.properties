com.top_logic.dsa.repos.Repository.get = Get
com.top_logic.dsa.repos.Repository.get.param.aPathIncludingFileName.tooltip = Path to the file including the file name use null to indicate a top-level file
com.top_logic.dsa.repos.Repository.get.param.aVersion.tooltip = Version of the repository entry to retrive
com.top_logic.dsa.repos.Repository.get.return = An InputStream with the requested version of the document (please close() it after usage).
com.top_logic.dsa.repos.Repository.get.tooltip = Returns a stream with the given version of the given reporitory entry <p> Please close() the stream as soon as possible since the underlying Implementation my not be able to reuse the entry until then. </p>
com.top_logic.dsa.repos.Repository.getCurrentRevisionNum = Get current revision number
com.top_logic.dsa.repos.Repository.getCurrentRevisionNum.param.aPathIncludingFileName.tooltip = Path to the file including the file name
com.top_logic.dsa.repos.Repository.getCurrentRevisionNum.param.aUser.tooltip = User Requesting the info.
com.top_logic.dsa.repos.Repository.getCurrentRevisionNum.return = A number starting at 1 for the first revision.
com.top_logic.dsa.repos.Repository.getCurrentRevisionNum.tooltip = Give numer of the current top-level revision, starting at 1. In case the Entry is <code>inUpdate</code> for the given user it will one more than in other cases.
