com.top_logic.ai.vector.index.VectorIndexTLScriptFunctions.search.param.limit.tooltip = Optional parameter for number of expected records to return (defaults to 5).
com.top_logic.ai.vector.index.VectorIndexTLScriptFunctions.search.param.query.tooltip = The string query to search inside the vector database.
com.top_logic.ai.vector.index.VectorIndexTLScriptFunctions.search.param.scoreThreshold.tooltip = Minimum score threshold. Must be between 0 and 1 (defaults to 0.8).
com.top_logic.ai.vector.index.VectorIndexTLScriptFunctions.search.return = A list of record dictionaries matching the query and parameters.
com.top_logic.ai.vector.index.VectorIndexTLScriptFunctions.search.tooltip = Returns a list of results from the Vector database <p> Example usage in TL-Script to resolve objects, contained in the Vector Index result: </p> <pre> { franceVacations = vectorIndexSearch("all vacations in France", 2); $franceVacations.map(x -> { "internalId": $x["embedded"]["text"].parseJson()["internalId"], "TopLogic-type": $x["embedded"]["text"].parseJson()["TopLogic-type"], "Instance": (`test.indexingVector:Vacation`).filter(a -> $a.get(`test.indexingVector:Vacation#id`).equals($x["embedded"]["text"].parseJson()["internalId"])) }) } </pre>
