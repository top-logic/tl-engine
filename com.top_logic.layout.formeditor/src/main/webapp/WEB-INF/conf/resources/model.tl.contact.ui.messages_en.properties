model.tl.contact.ui = UI
model.tl.contact.ui.CreateAccount = Create account
model.tl.contact.ui.CreateAccount.tooltip = Form type of the dialog that creates a person contact together with an account for that person. It combines the attributes of the contact with the user name of the account to be created.
model.tl.contact.ui.CreateLogin = Create login
model.tl.contact.ui.CreateLogin.login = Login
model.tl.contact.ui.CreateLogin.login.tooltip = The user name of the account to be created. A name that an existing account already uses is rejected. If no name is given, only the contact is created and no account.
model.tl.contact.ui.CreateLogin.tooltip = Form type that adds the user name of an account to be created to a creation dialog. Objects of this type are not stored; the type only describes the input of the dialog.
model.tl.contact.ui.tooltip = Module with the form types for the dialogs that create a contact together with an account for it.
