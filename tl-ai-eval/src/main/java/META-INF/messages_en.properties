com.top_logic.tl.ai.eval.CitationExpectation = Citation expectation
com.top_logic.tl.ai.eval.CitationExpectation.max-unread-links = Maximum unread links
com.top_logic.tl.ai.eval.CitationExpectation.max-unread-links.tooltip = How many web links of the model's text may point at pages no run read.
com.top_logic.tl.ai.eval.CitationExpectation.min-domains = Minimum domains
com.top_logic.tl.ai.eval.CitationExpectation.min-domains.tooltip = From how many distinct web hosts the cited sources must come at least; 0 for no bound. <p> A report that cites three pages of one vendor is one voice, however many footnotes it has. www. is not part of the host. </p>
com.top_logic.tl.ai.eval.CitationExpectation.min-sources = Minimum sources
com.top_logic.tl.ai.eval.CitationExpectation.min-sources.tooltip = How many distinct sources the answer must cite at least. <p> At least 1, which is what makes this expectation fail a run that answered without a source. </p>
com.top_logic.tl.ai.eval.CitationExpectation.tooltip = An <i>expectation</i> on the sources of the answer: it cites enough of the pages the run read, and links nothing the run did not read. <p> Deterministic, and that is its value next to <i>judge expectation</i>: whether a link points at a read page is a fact the run recorded, not an opinion. A cited source is a footnote the citation check kept - so it was on the run's reading list, the lead's or a worker's. An unread link is a web link in the model's own text that did not become a footnote: an invented address, a search result never opened, a page remembered from training. </p> <pre> &lt;citations label="cites-what-it-read" min-sources="3" min-domains="2"/&gt; </pre>
com.top_logic.tl.ai.eval.EvalConfig = Eval configuration
com.top_logic.tl.ai.eval.EvalConfig$Arm = Arm
com.top_logic.tl.ai.eval.EvalConfig$Arm.tooltip = One side of the comparison: an agent definition running on a model. <p> Two things are bundled here because they cannot be separated in this harness. A per-run model override exists in Java, but the shipped tool-access policy defaults to model-access default="assigned" and refuses a model the agent is not assigned, so the matrix is built from one agent definition per model rather than from one agent and a model parameter. Configuring the arm as a pair turns that constraint into a feature: two arms naming the <em>same</em> model and different agent definitions compare two versions of the harness - two system prompts, two tool sets - on one model, which is the cheaper and often the more actionable of the two questions this suite can answer. </p>
com.top_logic.tl.ai.eval.EvalConfig.Arm.agent = Agent
com.top_logic.tl.ai.eval.EvalConfig.Arm.agent.tooltip = The agent definition this arm runs, by its configured name.
com.top_logic.tl.ai.eval.EvalConfig.Arm.model = Model
com.top_logic.tl.ai.eval.EvalConfig.Arm.model.tooltip = The model <i>Agent</i> is assigned, repeated here so that the CSV can name it without asking the service, and so that the arm can be skipped before it is started when the model cannot call tools.
com.top_logic.tl.ai.eval.EvalConfig.arms = Arms
com.top_logic.tl.ai.eval.EvalConfig.arms.tooltip = The arms to compare, in report order.
com.top_logic.tl.ai.eval.EvalConfig.judge-model = Judge model
com.top_logic.tl.ai.eval.EvalConfig.judge-model.tooltip = The model that decides every <i>judge expectation</i> of this file; empty when no scenario has one. <p> Pinned here so that runs on different days are graded by the same judge - a comparison between runs with different judges measures the judges. Choose a model of another family than the arms, which would otherwise grade their own habits. </p>
com.top_logic.tl.ai.eval.EvalConfig.judge-provider = Judge provider
com.top_logic.tl.ai.eval.EvalConfig.judge-provider.tooltip = The provider serving <i>Judge model</i>, or empty when only one provider exposes it.
com.top_logic.tl.ai.eval.EvalConfig.repeats = Repeats
com.top_logic.tl.ai.eval.EvalConfig.repeats.tooltip = How often every arm runs every scenario, unless the scenario says otherwise. <p> Three is the working default. Repeats buy a reliability figure (pass^k, "all k attempts succeeded"); they buy very little resolution between two models, which is what scenario count buys - see the statistics note in the module README before reading a small difference as one. </p>
com.top_logic.tl.ai.eval.EvalConfig.scenarios = Scenarios
com.top_logic.tl.ai.eval.EvalConfig.scenarios.tooltip = The tasks, in report order.
com.top_logic.tl.ai.eval.EvalConfig.tooltip = A whole eval: the arms it compares and the scenarios it puts to them. <p> Read from a standalone configuration file, so a scenario set is a file an application ships beside its own model rather than a Java class anybody has to compile. </p> <pre> &lt;eval xmlns:config="http://www.top-logic.com/ns/config/6.0" repeats="3"&gt; &lt;arms&gt; &lt;arm name="sonnet" agent="Eval_Sonnet" model="claude-sonnet-4-6"/&gt; &lt;arm name="haiku" agent="Eval_Haiku" model="claude-haiku-4-5-20251001"/&gt; &lt;/arms&gt; &lt;scenarios&gt; &lt;scenario id="..." prompt="..." oracle="..."&gt; &lt;kb-query .../&gt; &lt;/scenario&gt; &lt;/scenarios&gt; &lt;/eval&gt; </pre>
com.top_logic.tl.ai.eval.EvalScenario = Eval scenario
com.top_logic.tl.ai.eval.EvalScenario.arms = Arms
com.top_logic.tl.ai.eval.EvalScenario.arms.tooltip = Which arms this scenario runs on, by arm name; empty means every arm of the suite. <p> Restricting a scenario to some arms is for a task that only one side can be asked - a capability an arm's agent definition does not carry, say. Narrowing it to save money makes the matrix unbalanced and the pass rates incomparable, so prefer dropping repeats. </p>
com.top_logic.tl.ai.eval.EvalScenario.expectations = Expectations
com.top_logic.tl.ai.eval.EvalScenario.expectations.tooltip = What must hold after the run. All of them must pass for the run to count as passed. <p> Must not be empty - a scenario that asserts nothing would report a pass for every model. </p>
com.top_logic.tl.ai.eval.EvalScenario.id = ID
com.top_logic.tl.ai.eval.EvalScenario.id.tooltip = Identifies the scenario in the CSV and in every report.
com.top_logic.tl.ai.eval.EvalScenario.oracle = Oracle
com.top_logic.tl.ai.eval.EvalScenario.oracle.tooltip = The documented reference solution: how this task is done, and why the expectations below are the right ones.
com.top_logic.tl.ai.eval.EvalScenario.prompt = Prompt
com.top_logic.tl.ai.eval.EvalScenario.prompt.tooltip = The user message the run starts from - the whole input the model gets, beside the agent's own system prompt.
com.top_logic.tl.ai.eval.EvalScenario.repeats = Repeats
com.top_logic.tl.ai.eval.EvalScenario.repeats.tooltip = How often each arm runs this scenario, or <code>0</code> to take the suite's default. <p> Repeats exist because no provider here offers a sampling seed and temperature is not a fix: lowering it trades one kind of variance for another and can bias the result. So a cell is reported as k of n, never as a single pass or fail. </p>
com.top_logic.tl.ai.eval.EvalScenario.tooltip = One business task put to the harness, with everything needed to decide afterwards whether it was done. <p> A scenario is run once per arm and per repeat, and each such run is graded independently. It carries no setup of its own: the whole suite runs against one seeded knowledge base, which the suite reseeds between runs, so a scenario describes a task and its expectations and nothing else. </p> <h2>The oracle</h2> <p> <i>Oracle</i> is mandatory, and that is the point of it. It is the reference solution - the tool calls a competent operator would make - written down in prose. Without one, a scenario that every model fails is indistinguishable from a scenario that is impossible, and a benchmark whose unsolvable tasks nobody noticed measures nothing. It is not executed; it is read by whoever has to decide whether a red cell is the model's fault. </p>
com.top_logic.tl.ai.eval.Expectation.label = Label
com.top_logic.tl.ai.eval.Expectation.label.tooltip = Short name of this expectation, used to say which one failed. <p> Reaches the CSV's failedGraders column, so it should read as a claim - "alpha-has-four-tickets" rather than "check1". Left empty, the grader falls back to a generated description of what it compared. </p>
com.top_logic.tl.ai.eval.JudgeExpectation = Judge expectation
com.top_logic.tl.ai.eval.JudgeExpectation.pass-ratio = Pass ratio
com.top_logic.tl.ai.eval.JudgeExpectation.pass-ratio.tooltip = The share of criteria that must be met, from 0 (exclusive) to 1; 1 means all of them.
com.top_logic.tl.ai.eval.JudgeExpectation.reference = Reference
com.top_logic.tl.ai.eval.JudgeExpectation.reference.tooltip = The correct answer, for a question that has one; empty otherwise. <p> Shown to the judge as the reference the criteria are measured against - not to the agent. </p>
com.top_logic.tl.ai.eval.JudgeExpectation.rubric = Rubric
com.top_logic.tl.ai.eval.JudgeExpectation.rubric.tooltip = The criteria, one per line.
com.top_logic.tl.ai.eval.JudgeExpectation.tooltip = An <i>expectation</i> on what the answer says, decided by a judge model against a rubric. <p> For the half of a research task that no rule can check: whether the report answers the question, names what it must name, and states the contradiction it found. The judge is one pinned model, named on the eval file (<i>Judge model</i> (<i>eval configuration</i>)), so that two runs are compared by the same judge; it should be of another family than the model under test, which would otherwise grade its own habits. </p> <p> The rubric is one criterion per line; a leading "- " is dropped. The judge says for each whether the answer meets it, and the expectation holds when the share of met criteria reaches <i>Pass ratio</i>. A judge that could not be asked, or whose answer cannot be read, fails the expectation with the reason - never passes it. </p> <pre> &lt;judge label="answers-the-question"&gt; &lt;reference&gt;Geoffrey Hinton, PhD from the University of Edinburgh (1978).&lt;/reference&gt; &lt;rubric&gt; - Names the University of Edinburgh. - Says that the younger laureate is Geoffrey Hinton. &lt;/rubric&gt; &lt;/judge&gt; </pre>
com.top_logic.tl.ai.eval.KbQuery = Knowledge-base query
com.top_logic.tl.ai.eval.KbQuery.expected = Expected
com.top_logic.tl.ai.eval.KbQuery.expected.tooltip = The value <i>Expression</i> must produce, compared as text. <p> Mandatory, and mandatory on purpose: an expectation with no expected value could only ever assert "the expression ran", which is not a claim about the task. </p>
com.top_logic.tl.ai.eval.KbQuery.expression = Expression
com.top_logic.tl.ai.eval.KbQuery.expression.tooltip = The TL-Script expression evaluated after the run, as the account the run acted as.
com.top_logic.tl.ai.eval.KbQuery.tooltip = An <i>expectation</i> on the <b>final state of the knowledge base</b>: a TL-Script expression is evaluated after the run and its result must equal a written value. <p> This is the eval's primary grader, and it grades the database rather than the transcript on purpose. A transcript says what the model claimed to do; only the data says what happened. It is also the only grader that survives a model solving the task a way nobody anticipated. </p> <pre> &lt;kb-query label="alpha-has-four-tickets" expression="count(all(`pm:Ticket`).filter(t -&gt; $t.get(`pm:Ticket#title`) == 'Login fails'))" expected="1" /&gt; </pre> <p> The comparison is on the string rendering of the result, because a TL-Script expression yields Double, Integer, String or a wrapper depending on how it is written, and a configuration file can only carry text. Write the expression so that it produces a scalar - count(...), isEmpty(...), a single attribute value - and not a collection whose rendering nobody can predict. </p>
com.top_logic.tl.ai.eval.Presented = Presented
com.top_logic.tl.ai.eval.Presented.as = As
com.top_logic.tl.ai.eval.Presented.as.tooltip = How the objects must have been shown; empty for any way. <p> Compared with what the tool made of the call, so a call that named no as and showed several objects counts as a table. </p>
com.top_logic.tl.ai.eval.Presented.chart-kind = Chart kind
com.top_logic.tl.ai.eval.Presented.chart-kind.tooltip = The kind of chart it must have been; empty for any. Only meaningful with as="CHART".
com.top_logic.tl.ai.eval.Presented.expected = Expected
com.top_logic.tl.ai.eval.Presented.expected.tooltip = The value <i>Expression</i> must produce, compared as text.
com.top_logic.tl.ai.eval.Presented.expression = Expression
com.top_logic.tl.ai.eval.Presented.expression.tooltip = TL-Script function of the presented objects and the chart's values, rows -> values -> ..., evaluated after the run.
com.top_logic.tl.ai.eval.Presented.tooltip = An <i>expectation</i> on what the run <b>showed the user</b>: its last present call showed the right objects, the right way. <p> The counterpart of <i>knowledge-base query</i> for a task that changes no data. "Show me all tickets as a table" leaves the database as it was, so a grader of the data passes a run that did nothing; what the task produced is the presentation, and that is graded here. The grader does not trust the model's description of it: it evaluates the query the model passed - or resolves the ids - itself, through the same executor the tool uses, and checks the objects that come out. </p> <pre> &lt;presented label="all-tickets-as-a-table" as="TABLE"&gt; &lt;expression&gt;rows -&gt; values -&gt; $rows.size() == all(`pm:Ticket`).size() &amp;&amp; $rows.containsAll(all(`pm:Ticket`))&lt;/expression&gt; &lt;expected&gt;true&lt;/expected&gt; &lt;/presented&gt; </pre> <p> The expression is a function of two lists: the presented objects, and - for a chart - the values the model's value function computes for them, in the same order (empty otherwise), so that a chart of the right objects drawing the wrong number fails. Its result is compared as text, the way <i>knowledge-base query's</i> is. </p>
com.top_logic.tl.ai.eval.RunOutcome = Run outcome
com.top_logic.tl.ai.eval.RunOutcome.COULD_NOT_RUN = Could not run
com.top_logic.tl.ai.eval.RunOutcome.COULD_NOT_RUN.tooltip = The arm was never started, because the harness cannot run it. <p> Distinct from <i>fail</i> on purpose. A model whose catalogue entry says it cannot call tools has not failed our tool descriptions - it was never asked. Counting it as a failure would put a number on a question nobody put to it, and averaging that number into a pass rate would understate every other model in the same table. </p>
com.top_logic.tl.ai.eval.RunOutcome.ERROR = Error
com.top_logic.tl.ai.eval.RunOutcome.ERROR.tooltip = The run happened, threw, and was graded anyway - the expectations decide. <p> A model that errors halfway and still leaves the right data behind has not passed; a model that errors and leaves nothing behind fails on the expectations. So this is a detail column, not a third outcome, and appears in the CSV as the stopReason ERROR. </p>
com.top_logic.tl.ai.eval.RunOutcome.FAIL = Fail
com.top_logic.tl.ai.eval.RunOutcome.FAIL.tooltip = The run happened and at least one expectation did not hold.
com.top_logic.tl.ai.eval.RunOutcome.PASS = Pass
com.top_logic.tl.ai.eval.RunOutcome.PASS.tooltip = Every expectation held.
com.top_logic.tl.ai.eval.RunOutcome.tooltip = How one run of one scenario on one arm ended.
com.top_logic.tl.ai.eval.ToolSequence = Tool sequence
com.top_logic.tl.ai.eval.ToolSequence.forbidden = Forbidden
com.top_logic.tl.ai.eval.ToolSequence.forbidden.tooltip = Tool names that must not appear among the run's tool calls. <p> A call counts as made once the loop dispatched it, whether it then succeeded, failed or was denied: "the model tried to delete the project" is the finding, and a gate that happened to stop it does not make the attempt acceptable. </p>
com.top_logic.tl.ai.eval.ToolSequence.max-calls = Maximum calls
com.top_logic.tl.ai.eval.ToolSequence.max-calls.tooltip = How many tool calls the whole run may make; 0 for no bound. <p> For a task whose cost is the finding: "show me all tickets as a table" done right is one or two calls (#616), and a run that lists, fetches every row and only then shows them reached the same screen at five times the price. Every call counts, the required ones included. </p>
com.top_logic.tl.ai.eval.ToolSequence.required = Required
com.top_logic.tl.ai.eval.ToolSequence.required.tooltip = Tool names that must all appear among the run's tool calls, in any order. <p> Must name at least one tool - see the class comment. The grader reports the missing names, not merely that something was missing. </p>
com.top_logic.tl.ai.eval.ToolSequence.tooltip = An <i>expectation</i> on which tools the run called: every required name was called, no forbidden name was. <p> Order is deliberately not checked. A model that reaches the same end state by a different route has not failed the task, and an ordered trajectory check punishes exactly that - which is why the frameworks that offer both default to the unordered one. </p> <p> What this grader is for is the half of a task that the database cannot show: a refusal scenario whose whole point is that a write never happened looks identical, in the data, to a run that crashed before it started. Pairing "the ticket count is still four" with "the deleting tool was never called" distinguishes the two. </p> <pre> &lt;tool-sequence label="read-only" required="model-instances.listInstances" forbidden="script-exec.changeData" /&gt; </pre> <p> Write a name the way an administrator configures it, factory.tool: a run records the bare name the model used, and the grader compares on the last segment, so the factory in the configured name documents which tool is meant without being lost in the comparison. <i>Required</i> must not be empty - a tool-sequence expectation with only forbidden names would pass a run in which nothing at all happened. </p>
