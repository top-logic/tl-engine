com.top_logic.dsa.repos.Repository.getInformation.param.aPath.tooltip = Path to a file or folder.
com.top_logic.dsa.repos.Repository.getInformation.return = The information for the top-level revision
com.top_logic.dsa.repos.Repository.getInformation.tooltip = Give information for top-level revision.
com.top_logic.dsa.repos.Repository.lock = Lock
com.top_logic.dsa.repos.Repository.lock.param.aPathIncludingFileName.tooltip = Path to the file including file name
com.top_logic.dsa.repos.Repository.lock.param.user.tooltip = The User locking the entry
com.top_logic.dsa.repos.Repository.lock.return = True if the object was succesfully locked.
com.top_logic.dsa.repos.Repository.lock.tooltip = Lock the document described by aPath and file name. The lock will fail in case some other user has already locked the file.
com.top_logic.dsa.repos.Repository.mkdir = Mkdir
com.top_logic.dsa.repos.Repository.mkdir.param.aDirectoryName.tooltip = The name of the directory to be created.
com.top_logic.dsa.repos.Repository.mkdir.param.aParentPath.tooltip = The pathname to the directory use null to indicate a top-level directory
com.top_logic.dsa.repos.Repository.mkdir.return = True when cerating succeeded
com.top_logic.dsa.repos.Repository.mkdir.tooltip = Creates a directory below the given Container.
com.top_logic.dsa.repos.Repository.rmdir = Rmdir
com.top_logic.dsa.repos.Repository.rmdir.param.aPath.tooltip = The path to the directory to be deleted
com.top_logic.dsa.repos.Repository.rmdir.return = True if the directory was (marked as) deleted, false otherwise
com.top_logic.dsa.repos.Repository.rmdir.tooltip = Deletes (marks as deleted) the directory if it is empty.
com.top_logic.dsa.repos.Repository.unlock = Unlock
com.top_logic.dsa.repos.Repository.unlock.param.aPathIncludingFileName.tooltip = Path to the file including the file name
com.top_logic.dsa.repos.Repository.unlock.param.user.tooltip = The User locking the entry
com.top_logic.dsa.repos.Repository.unlock.return = True if unlock succeeded, else false
com.top_logic.dsa.repos.Repository.unlock.tooltip = Resets a lock on the given file if the lock was held by the current user. You can only unlock a File in case the same user has called lock() before. In case the Entry was <code>inUpdate</code> the new verison will be released.
