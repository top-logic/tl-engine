com.top_logic.presentation.model.Overflow.tooltip = The handling of a text that does not fit into its element. <p> A text fits, if its height does not exceed the height of the element minus the inner margins and no word has to be broken within to fit into the width. The text of a table cell fits, if no word is broken, since the rows grow with their text. </p>
