com.top_logic.ai.chat.view.ChatSessionsElement.tooltip = Deklaratives „ <chat-sessions/> “-Element: die Sitzungsliste des Chats als eigenes View-Element. <p> Mehrere Chat-Elemente auf einer Seite treten über chat-id demselben Gespräch bei. Der optionale selection-Kanal trägt das offene AgentSession-Objekt, damit eine Host-Tabelle oder ein Formular es schreiben und lesen kann. Ohne Kanal steuert die Liste weiterhin den gemeinsamen Browser-Store, und jedes Element mit derselben chat-id folgt. </p>
