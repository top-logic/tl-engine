com.top_logic.factory.git.GitRoute.Config.connect-timeout.tooltip = Wie lange der Verbindungsaufbau zum Hosting-Dienst dauern darf.
com.top_logic.factory.git.GitRoute.Config.response-timeout = Antwort-Timeout
com.top_logic.factory.git.GitRoute.Config.response-timeout.tooltip = Wie lange der Hosting-Dienst ab Beginn der Anfrage bis zum Status seiner Antwort brauchen darf. <p> Der Hosting-Dienst beantwortet einen Push erst, nachdem er ihn vollständig empfangen hat; diese Zeit umfasst also die Übertragung des größten Pushs. </p>
com.top_logic.factory.git.GitRoute.Config.user-email = Commit-E-Mail-Adresse
com.top_logic.factory.git.GitRoute.Config.user-email.tooltip = Die E-Mail-Adresse von Autor und Committer der Commits in einem Workspace; leer für keine.
com.top_logic.factory.git.GitRoute.Config.user-name = Commit-Name
com.top_logic.factory.git.GitRoute.Config.user-name.tooltip = Der Name von Autor und Committer der Commits, die der Agent und die Steuerungsanwendung in einem Workspace machen; leer für keinen. <p> Jeder Git-Prozess in einem Workspace, der die Git-Konfiguration der Route erhält, hat ihn als <code>"user.name"</code>, das Vorrang vor den Konfigurationsdateien des Workspaces hat. </p>
com.top_logic.factory.git.GitRoute.tooltip = <i>Proxy-Route</i> des Workspace-Proxys zum Repository des Projekts eines Workspaces beim Git-Hosting-Dienst, ohne Zugangsdaten des Hosting-Dienstes im Workspace. <p> Die Route reicht das Smart-HTTP-Protokoll von Git an den <i>Git-Hosting-Anbieter</i> durch, unverändert und in beide Richtungen gestreamt. Unterhalb des Pfads der Route (standardmäßig <code>"/git"</code>) wird ein Repository als <code>/&lt;owner&gt;/&lt;name&gt;.git</code> adressiert - die Endung <code>".git"</code> darf fehlen -, und nur die Anfragen des Protokolls werden weitergeleitet: </p> <ul> <li><code>GET</code> von <code>"info/refs"</code> mit der Abfrage <code>"service"</code>=<code>"git-upload-pack"</code> (Fetch, Clone) oder <code>"git-receive-pack"</code> (Push),</li> <li><code>POST</code> von <code>"git-upload-pack"</code> und <code>"git-receive-pack"</code>.</li> </ul> <p> Das Repository muss das des Projekts des Workspaces sein, für den das Token der Anfrage ausgestellt wurde, verglichen ohne Rücksicht auf Groß- und Kleinschreibung. Jede andere Anfrage - ein anderer Pfad oder eine andere Methode, das Repository eines anderen Projekts, ein Workspace ohne Repository - und jede Anfrage, solange kein Hosting-Anbieter konfiguriert ist, wird mit 404 beantwortet, ohne zu verraten, ob ein Repository existiert. </p> <p> Von der Anfrage werden nur die Header des Git-Protokolls weitergeleitet - <code>"Content-Type"</code>, <code>"Content-Encoding"</code> einer komprimierten Anfrage, <code>"Git-Protocol"</code> für die Protokollversion 2, <code>"Accept"</code>, <code>"Accept-Encoding"</code>, <code>"Accept-Language"</code>, <code>"User-Agent"</code> -, nie das Token des Clients, Cookies oder Header, denen der Hosting-Dienst von der Adresse der Steueranwendung trauen könnte (z. B. der Benutzer-Header eines authentifizierenden Reverse-Proxys). Die Anfrage wird mit den Zugangsdaten der Steueranwendung authentifiziert. Status, Header und Body der Antwort werden zurückgereicht, wie sie kommen, außer Cookies und Hop-by-Hop-Headern. </p> <p> Lehnt der Hosting-Dienst die Zugangsdaten ab (401), werden sie verworfen; eine Anfrage von <code>"info/refs"</code>, die keinen Body hat, wird einmal mit frischen wiederholt. Eine Anfrage mit Body kann nicht wiederholt werden - der Body wird beim Eintreffen an den Hosting-Dienst gestreamt und ist weg -, sie wird mit 502 beantwortet. Da Git immer mit <code>"info/refs"</code> beginnt, werden rotierte Zugangsdaten dort übernommen. </p> <p> Eine Anfrage ohne gültiges Token wird mit 401 und <code>"WWW-Authenticate"</code> für Basic-Authentifizierung beantwortet: Git sendet seine erste Anfrage ohne Zugangsdaten und fragt seinen Credential-Helper erst nach einer solchen Aufforderung. Das Token wird als Passwort der Basic-Authentifizierung akzeptiert (siehe <i>Workspace-Proxy-Handler</i>); ein Prozess in einem Workspace erhält den Credential-Helper, der damit antwortet. </p>
com.top_logic.factory.llm.LLMRoute = LLM-Route
com.top_logic.factory.llm.LLMRoute.Config.provider = Anbieter
com.top_logic.factory.llm.LLMRoute.Config.provider.tooltip = Der Name des Anthropic-Anbieters unter den <i>LLM-Anbietern</i>, dessen API-Schlüssel, Basis-URL, Version und Timeouts die Route verwendet.
com.top_logic.factory.llm.LLMRoute.tooltip = <i>Proxy-Route</i> des Workspace-Proxys zur Anthropic Messages API, ohne API-Schlüssel im Workspace. <p> Ein Workspace-Container erhält die URL der Route in <code>"ANTHROPIC_BASE_URL"</code>, ein Prozess das Token des Proxys in <code>"ANTHROPIC_AUTH_TOKEN"</code>; Claude Code sendet es als Bearer-Token. </p> <p> Weitergeleitet wird nur POST von <code>"/v1/messages"</code> und <code>"/v1/messages/count_tokens"</code> (unterhalb des Pfads der Route, standardmäßig <code>"/llm-proxy"</code>), mit dem Query-String; alles andere wird mit 404 beantwortet. Die Ablehnungen des Proxys werden als Fehler der Anthropic API beantwortet, z. B. <code>"authentication_error"</code> für ein ungültiges Token. </p> <p> Die weitergeleitete Anfrage trägt die Header des Clients außer den Zugangsdaten (<code>"Authorization"</code>, <code>"x-api-key"</code>), Cookies, Host, den Hop-by-Hop-Headern und <code>"accept-encoding"</code>, so dass die Antwort unkomprimiert kommt und gestreamt werden kann. Der Rumpf wird an die API gestreamt, während er ankommt. Die Route fügt die Zugangsdaten des <i>LLM-Upstreams</i> hinzu - den API-Schlüssel des Anbieters in <code>"x-api-key"</code> - und setzt <code>"anthropic-version"</code> auf dessen Version, wenn der Client keine gesendet hat; <code>"anthropic-version"</code> und anthropic-beta eines Clients bleiben erhalten. Status, Header und Rumpf der Antwort werden zurückgegeben, der Rumpf Stück für Stück weitergereicht, sobald er ankommt, so dass ein Server-Sent-Event-Stream den Client erreicht, während er erzeugt wird. </p> <p> Der API-Schlüssel erscheint weder in einem Log noch in einer Antwort der Route. </p>
