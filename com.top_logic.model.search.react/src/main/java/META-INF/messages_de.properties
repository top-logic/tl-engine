class.com.top_logic.model.search.react.I18NConstants.ERROR_SCRIPT_EVALUATION__MSG = Das Skript konnte nicht ausgewertet werden: {0}
class.com.top_logic.model.search.react.I18NConstants.ERROR_SCRIPT_PARSE__MSG = Das Skript konnte nicht analysiert werden: {0}
class.com.top_logic.model.search.react.I18NConstants.SCRIPT_RESULT_COLUMN = Ergebnis
com.top_logic.model.search.react.EvaluateDynamicScriptAction = Dynamisches Skript auswerten
com.top_logic.model.search.react.EvaluateDynamicScriptAction.Config.commitMessage.tooltip = Die Meldung, mit der die Änderungen des Skripts festgeschrieben werden. <p> Wenn nicht gesetzt, nennt die Meldung das ausgeführte Skript. </p> <p> Eine Meldung kann den Platzhalter '{0}' enthalten, der durch den Quelltext des Skripts ersetzt wird. Wird nur verwendet, wenn die Auswertung in einer Transaktion läuft. </p>
com.top_logic.model.search.react.EvaluateDynamicScriptAction.tooltip = <i>Ansichtsaktion</i> der TL-Script-Konsole, die den Skriptquelltext kompiliert und auswertet, den sie verarbeitet – das Standardargument ihrer Kette. <p> Das Skript verwendet die Argumente der Kette als Variablen, ohne sie zu deklarieren: Es wird anhand der Namen der Argumente kompiliert, mit denen es ausgeführt wird. </p> <p> Der Quellcode ist der Text, den ein Entwickler in den Editor der Konsole eingegeben hat. Da die Aktion den ihr übergebenen Wert ausführt, gehört sie ausschließlich zu dieser Konsole: Sie beansprucht kein Tag und wird nicht als Baustein angeboten, und die Konsolenansicht verweist mit `class=` darauf. Eine Ansicht, die ein eigenes Skript ausführt, verwendet <i>die Aktion „Skript auswerten“</i>, deren Skript Teil der Ansichtsdefinition ist, anstatt als Daten übermittelt zu werden. </p> <p> Die Änderungen werden mit der konfigurierten Commit-Meldung festgeschrieben, standardmäßig mit einer Meldung, die das ausgeführte Skript benennt. </p>
com.top_logic.model.search.react.EvaluateScriptAction = Skript auswerten
com.top_logic.model.search.react.EvaluateScriptAction.Config.commitMessage.tooltip = Die Meldung, mit der die Änderungen des Skripts festgeschrieben werden. <p> Wenn nicht festgelegt, enthält die Meldung die Bezeichnung des Befehls und dessen Hauptargument. </p> <p> Eine Meldung kann den Platzhalter '{0}' enthalten, der durch die Bezeichnung des Hauptarguments des Befehls ersetzt wird. Wird nur verwendet, wenn die Auswertung in einer Transaktion ausgeführt wird. </p>
com.top_logic.model.search.react.EvaluateScriptAction.Config.script = Skript
com.top_logic.model.search.react.EvaluateScriptAction.Config.script.tooltip = Das auszuwertende Skript. <p> Verwendet die Argumente der Kette als Variablen, die nach ihnen benannt sind, ohne sie zu deklarieren. </p>
com.top_logic.model.search.react.EvaluateScriptAction.tooltip = <i>View-Aktion</i>, die das in ihrer Konfiguration angegebene TL-Skript auswertet. <p> Das Skript verwendet die Argumente der Kette als Variablen, ohne sie zu deklarieren: In einem Befehl mit dem Eingabekanal „item“ wirkt sich <code>$item.get(`my.module:MyType#name`)</code> auf das Objekt aus, das der Kanal enthält, während ein globaler Ausdruck wie <code>all(`my.module:MyType`)</code> kein Objekt verwendet. Das Auswertungsergebnis ist das Ergebnis der Aktion, das von den nachfolgenden Aktionen wahrgenommen wird. </p> <p> Ist die Option „transaction“ gesetzt, läuft die Auswertung innerhalb einer festgeschriebenen Transaktion, sodass ein Skript, das persistente Objekte erstellt, ändert oder löscht, eine dauerhafte Wirkung hat; andernfalls läuft es ohne umgebende Transaktion, und alle Änderungen werden verworfen. Die Änderungen werden mit der konfigurierten Commit-Meldung festgeschrieben, standardmäßig mit einer Meldung, die den Befehl und sein Hauptargument nennt. </p>
com.top_logic.model.search.react.ScriptResultTable = Tabelle mit den Skript-Ergebnissen
com.top_logic.model.search.react.ScriptResultTable.Config.input = Eingabe
com.top_logic.model.search.react.ScriptResultTable.Config.input.tooltip = Kanal, der das anzuzeigende Rohauswertungsergebnis enthält.
com.top_logic.model.search.react.ScriptResultTable.tooltip = Tabelle, die das Ergebnis einer Skriptbewertung anzeigt, mit Spalten, die aus dem Ergebnis abgeleitet wurden. <p> Anwendungsspezifisches Konsolen-Widget (referenziert über „class=“, kein wiederverwendbares „@TagName“-Element). Der Eingabekanal enthält das Rohauswertungsergebnis; ein geschriebenes Ergebnis baut die Tabelle über ein <i>Skript-Ergebnis-Steuerelement</i> neu auf, das die Spalten aus den Zeilenwerten ableitet (eine Spalte pro Objektattribut sowie eine Bezeichnung für primitive Werte). </p>
com.top_logic.model.search.react.TLScriptEditorElement = Skript-Editor-Element
com.top_logic.model.search.react.TLScriptEditorElement.Config.context-variables = Kontextvariablen
com.top_logic.model.search.react.TLScriptEditorElement.Config.context-variables.tooltip = Namen von Variablen, die von der umgebenden Infrastruktur an das bearbeitete Skript gebunden werden und daher auf oberster Ebene der <code>$</code>-Vervollständigung angeboten werden.
com.top_logic.model.search.react.TLScriptEditorElement.Config.readOnly = Nur lesen
com.top_logic.model.search.react.TLScriptEditorElement.Config.readOnly.tooltip = Ob der Editor schreibgeschützt ist.
com.top_logic.model.search.react.TLScriptEditorElement.Config.value = Wert
com.top_logic.model.search.react.TLScriptEditorElement.Config.value-channel = Wertkanal
com.top_logic.model.search.react.TLScriptEditorElement.Config.value-channel.tooltip = Der Kanal, in dem der bearbeitete Text veröffentlicht wird und über den externe Schreibvorgänge den Editor aktualisieren.
com.top_logic.model.search.react.TLScriptEditorElement.Config.value.tooltip = Der ursprüngliche TL-Script-Ausdruck. <p> Wird als Anfangswert verwendet, wenn kein Wertkanal festgelegt ist oder der Kanal leer ist. </p>
com.top_logic.model.search.react.TLScriptEditorElement.tooltip = Ein <i>UI-Element</i>, das einen TL-Script-Editor mit <code>CodeMirror</code> -6-basierter Nummerierung darstellt. <p> Verwendung in .view.xml: </p><pre> &lt;tlscript-editor value="x -&gt; $x + 1" /&gt; </pre> <p> Über einen Wertkanal wird der bearbeitete Text an diesen Kanal gesendet (und Schreibvorgänge auf externen Kanälen aktualisieren den Editor), sodass ein Befehl das aktuelle Skript auslesen kann – die Grundlage für eine interaktive Konsole. </p>
com.top_logic.model.search.react.TLScriptFieldControlProvider = TL-Script-Editor
com.top_logic.model.search.react.TLScriptFieldControlProvider.tooltip = Bearbeitet ein Feld mit TL-Script-Wert in einem TL-Script-Editor. <p> Der Editor arbeitet mit dem Quelltext des Skripts, während das Feld diesen in einer von zwei Formen enthält: </p> <ul> <li>Eine Konfigurationseigenschaft enthält den geparsten Ausdruck, der gemäß dem in der Konfigurationsdatei verwendeten Format konvertiert wurde, sodass genau die Skripte eingegeben werden können, die eine Konfiguration akzeptiert.</li> <li>Ein Attribut vom Modelltyp `tl.model.search:Expr` enthält den kompilierten <i>Suchausdruck</i>, <i>der</i> gemäß <i>der Speicherabbildung</i> dieses Typs konvertiert wurde, sodass das eingegebene Skript genau dem entspricht, das gespeichert wird.</li> </ul> <p> Welche Form das Feld enthält, wird durch seinen Werttyp bestimmt. Ein Skript, das nicht gelesen werden kann, wird im Feld als Eingabefehler gemeldet, wobei der gespeicherte Wert unverändert bleibt; der Fehler wird zwar gemeldet, der Wert jedoch nicht bestätigt. Der Editor akzeptiert Eingaben, solange das Feld bearbeitbar ist, und passt sich Änderungen der Bearbeitbarkeit an. </p> <p> Der Editor ist groß: Wo er keinen Platz mehr hat, wird die erste Zeile des Skriptquellcodes, die mehr als Leerzeichen enthält, an seiner Stelle angezeigt. </p>
