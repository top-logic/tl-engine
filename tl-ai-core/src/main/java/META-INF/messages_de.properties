com.top_logic.tl.ai.core.tools.ToolMethod.name = Name
com.top_logic.tl.ai.core.tools.ToolMethod.name.tooltip = Name des Werkzeugs. Standardmäßig wird der Name der Java-Methode verwendet, wenn er leer ist.
com.top_logic.tl.ai.core.tools.ToolMethod.tooltip = Markiert eine Methode als ein Werkzeug, das der Agent aufrufen kann. <p>Die mit Anmerkungen versehene Methode wird von <code>AnnotatedTools#from(Object)</code> entdeckt und als <i>Werkzeuginstanz</i> verpackt. Die Parameter der Methode müssen mit <i>p</i> annotiert werden, um Beschreibungen für den LLM bereitzustellen.</p> <p><b>Thread-Sicherheit:</b> Das Provider-Objekt (die an <code>AnnotatedTools#from(Object)</code> übergebene Instanz) wird von allen Benutzern gemeinsam genutzt, wenn der <i>Tool-Dispatcher</i> gemeinsam genutzt wird. Kommentierte Methoden <em>dürfen</em> sich <em>nicht</em> auf veränderbare Instanzfelder stützen. Der benutzerspezifische Status sollte über einen <i>Tool-Kontextparameter</i> empfangen und nicht im Provider-Objekt gespeichert werden.</p>
com.top_logic.tl.ai.core.tools.ToolMode = Werkzeug-Modus
com.top_logic.tl.ai.core.tools.ToolMode.GLOBAL = Global
com.top_logic.tl.ai.core.tools.ToolMode.GLOBAL.tooltip = Das Tool nimmt Änderungen am gemeinsamen Anwendungsstatus vor (Modell, Layouts, Workflows).
com.top_logic.tl.ai.core.tools.ToolMode.READ = Lesen Sie
com.top_logic.tl.ai.core.tools.ToolMode.READ.tooltip = Das Tool liest nur Daten. Keine Änderungen, keine Genehmigung erforderlich.
com.top_logic.tl.ai.core.tools.ToolMode.USER_SCOPED = Benutzerdefiniert
com.top_logic.tl.ai.core.tools.ToolMode.USER_SCOPED.tooltip = Das Tool nimmt Änderungen vor, die nur für den aktuellen Benutzer gelten (temporäre Ansichten, persönliche Dashboards).
com.top_logic.tl.ai.core.tools.ToolMode.tooltip = Kategorisiert, welche Art von Zustandsänderung ein Werkzeug vornimmt. <p>Wird vom Framework für die Filterung von Spezifikationen (Ausblenden von GLOBAL-Tools vor nicht privilegierten Benutzern), die Freigabekontrolle und Gleichzeitigkeitsentscheidungen verwendet.</p>
com.top_logic.tl.ai.core.tools.interaction.TaskTool = Aufgabenwerkzeug
com.top_logic.tl.ai.core.tools.interaction.TaskTool.tooltip = Werkzeug zur Verwaltung von Agentenaufgaben innerhalb einer Verarbeitungssitzung. <p> Bietet CRUD-Operationen fï¿½r einen speicherinternen <i>Aufgabenspeicher</i>, der ï¿½ber die <i>Aufgabenspeicherbindung</i> an den aktuellen Thread gebunden ist. Aufgaben werden verwendet, um den Fortschritt zu verfolgen und mehrstufige Agentenarbeit zu organisieren. </p>
com.top_logic.tl.ai.core.tools.model.AnnotationDefinitionExplorerTool = Explorer-Tool fï¿½r Anmerkungsdefinitionen
com.top_logic.tl.ai.core.tools.model.AnnotationDefinitionExplorerTool.tooltip = Werkzeug zur Erkundung von Schemata fï¿½r Anmerkungsdefinitionen. <p> Dieses Tool ermï¿½glicht es KI-Agenten, Anmerkungsdefinitionen zu verstehen (was konfiguriert werden KANN), nicht Anmerkungsinstanzen (was konfiguriert ist). Es bietet Schemainformationen, einschlieï¿½lich Metadaten zu Eigenschaften, Typen, Einschrï¿½nkungen und Standardeinstellungen. </p> <h3>Beispiel fï¿½r die Verwendung:</h3> <pre> // Untersuchen einer bestimmten Anmerkungsdefinition describeAnnotation("com.top_logic.model.annotate.Visibility") // Untersuchen einer Formulardefinitionsanmerkung describeAnnotation("com.top_logic.model.form.definition.FormDefinition") </pre> <h3>Integration</h3>: <p> Registrieren Sie dieses Werkzeug ï¿½ber <i>annotierte Werkzeuge</i> und weisen Sie es einem Agenten ï¿½ber die <i>LLM-Provider-Registrierungskonfiguration</i> zu. </p>
com.top_logic.tl.ai.core.tools.model.InstanceBrowserTool = Instanz-Browser-Tool
com.top_logic.tl.ai.core.tools.model.InstanceBrowserTool.tooltip = Tool fï¿½r den Zugriff auf TopLogic-Instanzdaten aus der Wissensdatenbank. <p> Dieses Tool bietet Methoden zum Auflisten von Instanzen eines Typs mit Paginierung und zum Abrufen detaillierter Informationen ï¿½ber einzelne Instanzen. Alle Methoden geben JSON-formatierte Zeichenketten fï¿½r die Verwendung durch KI-Agenten zurï¿½ck. </p>
com.top_logic.tl.ai.core.tools.model.ModelAnnotationBrowserTool = Browser-Tool fï¿½r Modellkommentare
com.top_logic.tl.ai.core.tools.model.ModelAnnotationBrowserTool.tooltip = Werkzeug zum Durchsuchen von Annotationen auf TopLogic-Modellelementen (Module, Typen, Teile, Aufzï¿½hlungen, Klassifikatoren). <p> Mit diesem Tool kï¿½nnen KI-Agenten die Metadaten von Annotationen auf Modellelementen mit optionaler Vererbungsunterstï¿½tzung prï¿½fen. Es liefert detaillierte Informationen ï¿½ber jede Anmerkung, einschlieï¿½lich ihres Tag-Namens, der Konfigurationsschnittstelle und der Eigenschaftswerte. </p> <h3>Beispiel fï¿½r die Verwendung:</h3> <pre> // Auflisten lokaler Anmerkungen zu einem Modul getCurrentAnnotations("tl.core", false) // Auflisten lokaler Anmerkungen zu einem Typ getCurrentAnnotations("tl.core:TLObject", false) // Auflisten aller Anmerkungen einschlieï¿½lich vererbter getCurrentAnnotations("tl.core:TLObject", true) // Anmerkungen zu einer Enumeration auflisten getCurrentAnnotations("tl.core:TLScope", false) // Anmerkungen zu einem Typteil auflisten getCurrentAnnotations("tl.core:TLObject#name", false) // Anmerkungen zu einem Klassifikator (enum literal) auflisten getCurrentAnnotations("tl.core:TLScope#global", false) </pre> <h3>Integration</h3>: <p> Registrieren Sie dieses Tool ï¿½ber <i>annotierte Tools</i> und weisen Sie es einem Agenten ï¿½ber die <i>LLM-Provider-Registry-Konfiguration</i> zu. </p>
com.top_logic.tl.ai.core.tools.model.ModelAnnotationEditorTool = Editor fï¿½r Modellbeschriftungen
com.top_logic.tl.ai.core.tools.model.ModelAnnotationEditorTool.tooltip = Werkzeug zum Setzen und Entfernen von Annotationen auf TopLogic-Modellelementen. <p> Mit diesem Tool kï¿½nnen KI-Agenten Metadaten zu Modellelementen (Module, Typen, Teile, Klassifikatoren) ï¿½ndern. Annotationskonfigurationen werden als JSON akzeptiert, die dem Schema des <i>Konfigurationsschematools</i> entsprechen. </p>
com.top_logic.tl.ai.core.tools.model.ModelBrowserTool = Modell-Browser-Tool
com.top_logic.tl.ai.core.tools.model.ModelBrowserTool.tooltip = Werkzeug zum Durchsuchen der TopLogic-Modellstruktur (Module, Typen, Teile). <p> Dieses Tool bietet drei Methoden, die die natï¿½rliche Hierarchie fï¿½r die Modelluntersuchung bilden: Auflistung aller Module, Auflistung der Typen innerhalb eines Moduls und Auflistung der Eigenschaften/Referenzen eines Typs. Alle Methoden geben JSON-formatierte Strings zurï¿½ck, die von KI-Agenten verwendet werden kï¿½nnen. </p>
com.top_logic.tl.ai.core.tools.model.ModelEditorTool = Modell-Editor-Werkzeug
com.top_logic.tl.ai.core.tools.model.ModelEditorTool.tooltip = Werkzeug zum Erstellen und Aktualisieren von TopLogic-Modellelementen. <p> Dieses Tool bietet Methoden zum Erstellen und Aktualisieren von Modulen, Klassen, Eigenschaften, Referenzen, Rï¿½ckwï¿½rtsreferenzen und Aufzï¿½hlungen im TopLogic-Anwendungsmodell. </p> <p> Alle Methoden geben JSON-formatierte Zeichenketten zurï¿½ck, die von KI-Agenten verwendet werden kï¿½nnen. </p>
com.top_logic.tl.ai.core.tools.model.ModelSearchTool = Werkzeug zur Modellsuche
com.top_logic.tl.ai.core.tools.model.ModelSearchTool.tooltip = Werkzeug fï¿½r die Suche im gesamten TopLogic-Anwendungsmodell. <p> Dieses Tool bietet eine intelligente Textsuche ï¿½ber Module, Typen (Klassen, Aufzï¿½hlungen, Datentypen) und Eigenschaften/Referenzen. Es durchsucht technische Namen, qualifizierte Namen, Bezeichnungen und Beschreibungen und gibt die 10 relevantesten Treffer mit Kontextinformationen zurï¿½ck. </p>
com.top_logic.tl.ai.core.tools.model.SearchAnnotationTool = Werkzeug fï¿½r Suchanmerkungen
com.top_logic.tl.ai.core.tools.model.SearchAnnotationTool.tooltip = Tool zur Auflistung der verfï¿½gbaren Annotationstypen fï¿½r TopLogic-Modellelemente. <p> Mit diesem Tool kï¿½nnen KI-Agenten herausfinden, welche Annotationstypen auf ein bestimmtes Modellelement angewendet werden kï¿½nnen. Es listet alle @InApp-Annotationsarten auf, gefiltert nach Art und Typ des Zielelements. </p>
com.top_logic.tl.ai.core.tools.model.TypeAnalysisTool = Werkzeug zur Typenanalyse
com.top_logic.tl.ai.core.tools.model.TypeAnalysisTool.tooltip = Werkzeug zur Analyse von TopLogic-Typ-Abhï¿½ngigkeiten und -Beziehungen. <p> Dieses Tool bietet Methoden, um zu verstehen, wie Typen im gesamten Modell verwendet werden: Finden aller Verwendungen eines Typs und Finden, wo ein Teil definiert und vererbt wird. Alle Methoden geben JSON-formatierte Strings zurï¿½ck, die von KI-Agenten verwendet werden kï¿½nnen. </p>
com.top_logic.tl.ai.core.tools.registry.ReflectiveToolFactory = Reflektierende Werkzeugfabrik
com.top_logic.tl.ai.core.tools.registry.ReflectiveToolFactory.Config.tool-class = Werkzeugklasse
com.top_logic.tl.ai.core.tools.registry.ReflectiveToolFactory.Config.tool-class.tooltip = Die Java-Klasse, die mit @ToolMethod annotierte Methoden enthält. <p> Diese Klasse wird nach Werkzeugdefinitionen durchsucht. Alle Methoden, die mit @ToolMethod annotiert sind, werden als AI-Tools angezeigt. </p>
com.top_logic.tl.ai.core.tools.registry.ReflectiveToolFactory.tooltip = Eine <i>Werkzeugfabrik</i>, die reflektiv Werkzeuge aus einer Java-Klasse mit @ToolMethod-kommentierten Methoden entdeckt. <p> Diese Fabrik extrahiert Werkzeugspezifikationen aus der konfigurierten Klasse und erstellt entsprechende <i>Werkzeuginstanzen</i> für jede annotierte Methode. </p>
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory = Script-Werkzeugfabrik
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.Config.tools = Werkzeuge
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.Config.tools.tooltip = Die zu erstellenden Werkzeuge. <p> Jedes Werkzeug wird durch seine Spezifikation (Name, Beschreibung, Parameter) und eine TL-Script-Implementierung definiert. </p>
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.concurrency-safe = Gleichzeitigkeitssicher
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.concurrency-safe.tooltip = Gibt an, ob dieses Werkzeug sicher parallel zu anderen parallelitätssicheren Werkzeugen ausgeführt werden kann. <p> Wenn der Wert null ist (Standard), wird er von <i>Modus</i> abgeleitet: true für <i>lesend</i> und <i>benutzerdefiniert</i>, false für <i>global</i>. </p>
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.description = Beschreibung
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.description.tooltip = Die Beschreibung dessen, was das Werkzeug tut.
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.implementation = Umsetzung
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.implementation.tooltip = Die TL-Script-Implementierung des Werkzeugs. <p> Das Skript erhält die Parameter des Tools als Variablen und sollte das Ergebnis des Tools als String zurückgeben. </p>
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.mode = Modus
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.mode.tooltip = Welche Art von Zustandsänderung dieses Werkzeug vornimmt. <p> Der Standardwert ist <i>global</i>. Setzen Sie es auf <i>read</i> für Werkzeuge, die nur Daten lesen, oder auf <i>user scoped</i> für Werkzeuge, die nur den aktuellen Benutzer betreffen. </p>
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.name = Name
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.name.tooltip = Der Name des Tools.
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.parameters = Parameter
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.parameters.tooltip = Die Parameter, die dieses Werkzeug akzeptiert. <p> Jeder Parameter wird durch seinen Namen und seine Konfiguration (Typ, Beschreibung usw.) definiert. </p>
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ToolParameterConfig.description = Beschreibung
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ToolParameterConfig.description.tooltip = Die Beschreibung des Parameters.
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ToolParameterConfig.name = Name
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ToolParameterConfig.name.tooltip = Der Name des Parameters.
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ToolParameterConfig.type = Typ
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ToolParameterConfig.type.tooltip = Der JSON-Schematyp des Parameters (z. B. "string", "number", "boolean", "object", "array").
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.tooltip = Eine <i>Werkzeugfabrik</i>, die Werkzeuge aus TL-Script-Implementierungen erstellt. <p> Mit dieser Fabrik können Werkzeuge direkt in der Konfiguration mit TL-Script-Code definiert werden. Jedes Werkzeug besteht aus einer Spezifikation (Name, Beschreibung, Parameter) und einem TL-Script-Ausdruck, der die Logik des Werkzeugs implementiert. </p>
com.top_logic.tl.ai.core.tools.registry.ToolRegistryService = Werkzeugregistrierungsdienst
com.top_logic.tl.ai.core.tools.registry.ToolRegistryService$ToolFactoryConfig = Werkzeug-Werkskonfiguration
com.top_logic.tl.ai.core.tools.registry.ToolRegistryService$ToolFactoryConfig.tooltip = Konfiguration für eine benannte Werkzeugfabrik.
com.top_logic.tl.ai.core.tools.registry.ToolRegistryService.Config.tool-factories = Werkzeugfabriken
com.top_logic.tl.ai.core.tools.registry.ToolRegistryService.Config.tool-factories.tooltip = Karte der benannten Werkzeugfabriken, die in der Anwendung verfügbar sind. <p> Jede Werkzeugfabrik wird durch einen eindeutigen Namen identifiziert. Der Fabrikname wird Teil des qualifizierten Werkzeugnamens (Fabrikname.Werkzeugname), mit dem in TL-Script-Funktionen auf Werkzeuge verwiesen wird. </p>
com.top_logic.tl.ai.core.tools.registry.ToolRegistryService.ToolFactoryConfig.implementation = Umsetzung
com.top_logic.tl.ai.core.tools.registry.ToolRegistryService.ToolFactoryConfig.implementation.tooltip = Die Implementierung der Werkzeugfabrik.
com.top_logic.tl.ai.core.tools.registry.ToolRegistryService.tooltip = Registrierungsdienst zur Verwaltung der in der Anwendung verfügbaren Werkzeuge. <p> Die Werkzeuge sind nach Fabriken organisiert. Jede Fabrik produziert einen Satz von Werkzeugen, und jedes Werkzeug wird durch einen qualifizierten Namen im Format {factory-name}{tool-name} identifiziert. So können Werkzeuge aus verschiedenen Fabriken denselben einfachen Namen haben, ohne dass es zu Konflikten kommt. </p>
com.top_logic.tl.ai.core.tools.script.TLScriptReferenceTool = Skript-Referenzwerkzeug
com.top_logic.tl.ai.core.tools.script.TLScriptReferenceTool.tooltip = Werkzeug zum Auflisten von TLScript-Funktionen und zum Abrufen der Dokumentation. <p> Dieses Tool ermï¿½glicht den Zugriff auf die TLScript-Funktionsregistrierung, so dass KI-Agenten verfï¿½gbare Funktionen entdecken und detaillierte Dokumentationen zu ihnen abrufen kï¿½nnen. Es verwendet den <i>Search Builder</i>, um auf die Metadaten der Funktionen zuzugreifen. </p>
com.top_logic.tl.ai.core.tools.script.TLScriptTool = Skript-Tool
com.top_logic.tl.ai.core.tools.script.TLScriptTool.tooltip = Werkzeug zur Validierung und Ausfï¿½hrung von TLScript-Code. <p> Dieses Tool ermï¿½glicht die Validierung und Ausfï¿½hrung von TLScript. Beide Methoden verwenden den gemeinsamen <i>Skript-Executor</i> fï¿½r die zentrale Validierungs- und Ausfï¿½hrungslogik. </p>
com.top_logic.tl.ai.core.tools.script.messages.ErrorType = Fehlerart
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.LEXICAL_ERROR = Lexikalischer Fehler
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.LEXICAL_ERROR.tooltip = Lexikalischer Fehler (ungï¿½ltige Zeichen).
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.SYNTAX_ERROR = Syntax-Fehler
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.SYNTAX_ERROR.tooltip = Syntaxfehler (Parserfehler).
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.VALIDATION_ERROR = Validierungsfehler
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.VALIDATION_ERROR.tooltip = Validierungsfehler (Modellreferenzen, Typenprï¿½fung).
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.tooltip = Art des Validierungsfehlers.
