class.com.top_logic.layout.view.agent.I18NConstants.PERMISSION_UI_ACT = Oberfläche bedienen
class.com.top_logic.layout.view.agent.I18NConstants.PERMISSION_UI_ACT.help = Bezeichnung der Zugriffstoken-Berechtigung <code>"ui-act"</code>.
class.com.top_logic.layout.view.agent.I18NConstants.PERMISSION_UI_OBSERVE = Oberfläche beobachten
class.com.top_logic.layout.view.agent.I18NConstants.PERMISSION_UI_OBSERVE.help = Bezeichnung der Zugriffstoken-Berechtigung <code>"ui-observe"</code>.
com.top_logic.layout.view.agent.AccessTokenAuthenticator = Authentifizierer für Zugriffstoken
com.top_logic.layout.view.agent.AccessTokenAuthenticator.tooltip = Lässt einen Agenten zu, der ein Zugriffstoken mit einer Berechtigung für die Oberfläche vorlegt. <p> Ein Token mit <code>"ui-observe"</code> lässt den Agenten die Sitzung lesen, aus der das Token ausgestellt wurde, ein Token mit <code>"ui-act"</code> (das Ersteres einschließt) lässt ihn in dieser Sitzung auch handeln. Beide Berechtigungen binden an diese Sitzung. Ein Token ohne eine von ihnen, ein unbekanntes, zurückgezogenes oder abgelaufenes Token und ein Token eines gelöschten Kontos lassen niemanden zu. Jede Zulassung wird am Token vermerkt, sodass sein Besitzer sieht, dass ein Agent es verwendet. </p>
com.top_logic.layout.view.agent.AgentAccess = Agentenzugriff
com.top_logic.layout.view.agent.AgentAccess.Config.authenticators = Authentifikatoren
com.top_logic.layout.view.agent.AgentAccess.Config.authenticators.tooltip = Die Authentifikatoren, die die Anmeldedaten von Aufrufern außerhalb des Browsers erkennen, in der Reihenfolge, in der sie befragt werden.
com.top_logic.layout.view.agent.AgentAccess.tooltip = Zugriff von Aufrufern außerhalb des Browsers auf das <i>Agent-Servlet</i>. <p> Ein Browser erreicht den Endpunkt mit seinem Sitzungs-Cookie. Ein Agent außerhalb des Browsers übermittelt stattdessen im „Authorization“-Header eine Berechtigungsangabe, die von den registrierten <i>Agenten-Authentifizierern</i> dem Konto zugeordnet wird, für das er auftritt. </p> <p> Ein Anmeldenachweis benennt zudem die Sitzung, in der der Agent arbeitet: Der Benutzer stellt ihn aus einer laufenden Sitzung heraus aus und ermöglicht es dem Agenten damit, die Fenster dieser Sitzung zu steuern. Die Sitzung wird hier unter einem Schlüssel registriert, den der Anmeldenachweis enthält, und die Registrierung endet mit der Sitzung – ein Agent kann die Sitzung, zu der er zugelassen wurde, nicht überdauern. </p> <p> Ist kein Authentifikator registriert, erreichen nur Browser den Endpunkt. </p>
com.top_logic.layout.view.agent.AgentSessionBinding = Sitzungsbindung des Agentenzugriffs
com.top_logic.layout.view.agent.AgentSessionBinding.tooltip = <i>Sitzungsbindung</i> der Berechtigungen für die Oberfläche: Registriert die Sitzung, in der ein Token erstellt wird, beim <i>Agentenzugriff</i> und benennt den Endpunkt des <i>Agent-Servlets</i>.
