com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.Access.ALLOW.tooltip = Erlaubt.
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.Access.DENY = Ablehnen
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.Access.DENY.tooltip = Abgelehnt.
