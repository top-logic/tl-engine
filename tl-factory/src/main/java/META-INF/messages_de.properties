com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.thinking-display = Anzeige des Denkens
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.thinking-display.tooltip = Wie das Denken des Modells in der Ausgabe von Claude Code erscheint: <code>"summarized"</code> für eine Zusammenfassung, die der Chat anzeigt; <code>omitted</code> für keinen Text; leer für die Voreinstellung von Claude Code, die es im Print-Modus weglässt.
com.top_logic.factory.agent.claude.ClaudeCodeHarness.tooltip = <i>Agent-Harness</i>, der Claude Code im Print-Modus mit stream-json als Ein- und Ausgabe ausführt. <p> Der Prozess wird als </p> <pre> claude -p --input-format stream-json --output-format stream-json --verbose --include-partial-messages --permission-mode bypassPermissions [--thinking-display &lt;Anzeige&gt;] [--model &lt;Modell&gt;] [--resume &lt;Session-ID&gt;] [--append-system-prompt &lt;Anweisungen&gt;] [&lt;weitere Argumente&gt;] </pre> <p> als Workspace-Benutzer gestartet - Claude Code verweigert als root das Umgehen seiner Rückfragen - mit der Umgebung des Prozesses, z. B. seinem Token für den Workspace-Proxy in <code>"ANTHROPIC_AUTH_TOKEN"</code>. Der Container hat die URL der LLM-Route des Proxys in <code>"ANTHROPIC_BASE_URL"</code>. Die Ausgabe übersetzt das <i>Claude-Code-Protokoll</i>. </p>
