com.top_logic.ai.service.scripting.OpenAIScriptFunctions.toolInfo.return = Eine Karte, die die Metadaten des Werkzeugs mit der oben beschriebenen Struktur enthï¿½lt, oder null, wenn das Werkzeug nicht gefunden wird.
com.top_logic.ai.service.scripting.OpenAIScriptFunctions.toolInfo.tooltip = Ruft detaillierte Informationen ï¿½ber ein registriertes Werkzeug ab. <p> Diese Funktion gibt Metadaten ï¿½ber ein Werkzeug zurï¿½ck, einschlieï¿½lich seines Namens, seiner Beschreibung und seiner Parameterspezifikationen. Das Werkzeug wird durch seinen qualifizierten Namen im Format Fabrik-Name.Werkzeug-Name identifiziert. </p> <p> Die zurï¿½ckgegebene Karte enthï¿½lt: </p> <ul> <li>name - Einfacher Name des Werkzeugs (ohne Fabrikprï¿½fix)</li> <li>qualifiedName - Der vollstï¿½ndig qualifizierte Name des Werkzeugs</li> <li>description - Eine Beschreibung der Funktion des Werkzeugs (optional, kann fehlen)</li> <li>parameters - Eine Liste von Parameterspezifikationen, wobei jeder Parameter eine Karte mit Namen (String) und erforderlichen (booleschen) Feldern ist</li> </ul> <p> Beispiel fï¿½r die Verwendung in TL-Script: </p> <pre> // Ermittelt Informationen fï¿½r ein Werkzeug ohne Parameter aiToolInfo("tlscript.listTLScriptFunctions") // Rï¿½ckgabe: // { // "name": "listTLScriptFunctions", // "qualifiedName": "tlscript.listTLScriptFunctions", // "description": "List all available TLScript functions...", // "parameters": [] // } // Ermittelt Informationen zu einem Werkzeug mit Parametern aiToolInfo("tlscript.getTLScriptFunctionDocumentation") // Rï¿½ckgabe: // { // "name": "getTLScriptFunctionDocumentation", // "qualifiedName": "tlscript.getTLScriptFunctionDocumentation", // "description": "Get detailed documentation for a specific TLScript function...", // "parameters": [ // { // "name": "functionName", // "required": true // } // ] // } // Nicht existierendes Werkzeug aiToolInfo("nicht existierendes.Werkzeug") // Rï¿½ckgabe: null </pre>
