com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Config.api-key.tooltip = Der API-Schlüssel für die <code>xAI</code>.
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Config.protocol = Protokoll
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Config.protocol.tooltip = Das Drahtprotokoll, das bei der Kommunikation mit dem Endpunkt <code>xAI</code> verwendet werden soll. <p> <i>Chatvervollständigungen</i> erzeugt einen <i>Anbieter für Chatvervollständigungen</i>; <i>Antworten</i> erzeugt einen <i>Anbieter für OpenAI-Antworten</i>. </p>
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Protocol.CHAT_COMPLETIONS = Chat-Completions
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Protocol.CHAT_COMPLETIONS.tooltip = <code>OpenAI</code> Protokoll für Chatabschlüsse (/v1/chat/completions, SSE mit [DONE]).
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Protocol.RESPONSES = Responses
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Protocol.RESPONSES.tooltip = <code>OpenAI</code> Antwortprotokoll (/v1/responses, ereignistypische SSE).
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.tooltip = <i>LLM-Anbieterkonfiguration</i> für die <code>xAI</code> (Grok) API. <p> Die <code>xAI</code> unterstützt sowohl das <code>OpenAI</code> für Chatabschlüsse (/v1/chat/completions) als auch das <code>OpenAI</code> für Antworten (/v1/responses). Verwenden Sie <i>Protokoll</i>, um das Leitungsformat auszuwählen. Die Standardeinstellung ist " <i>Chat Completions"</i>. </p>
com.top_logic.tl.ai.core.screenshots.ScreenshotService = Screenshot-Dienst
com.top_logic.tl.ai.core.screenshots.ScreenshotService.tooltip = Dienst, der <i>Screenshot-Geschäftsobjekte</i> (ein aufgenommenes PNG-Bild sowie dessen Metadaten) dauerhaft speichert. <p> Er ähnelt dem „GeneratedHtmlPageService“ in seiner Struktur, mit einem bewussten Unterschied: Er eröffnet <b>keine</b> eigene Transaktion. Screenshots werden durch das Verb „browserScreenshot“ erstellt, ein DATA_WRITE-Tool, dessen Transaktion durch den <i>Transaktionsbereich</i> der Agentenschleife (die „Tool-Transaktionsnaht“) eröffnet und bestätigt wird. Das Erstellen des Objekts in dieser umgebenden Transaktion gewährleistet, dass der Screenshot atomar mit dem Rest des Durchlaufs bleibt – er wird festgeschrieben, wenn der Durchlauf festgeschrieben wird, und zurückgesetzt, wenn der Durchlauf zurückgesetzt wird. Programmatische Aufrufer (und Tests) stellen daher ihre eigene Transaktion um den Aufruf zur Erstellung des Screenshots herum bereit. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChat = Agenten-Chat
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChat.param.agentName.tooltip = Der Name des Agenten, wie er in der Wissensbasis konfiguriert ist.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChat.param.userMessage.tooltip = Die Benutzernachricht, die an den Agenten gesendet werden soll.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChat.return = Die letzte Textantwort des Agenten.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChat.tooltip = Führt einen benannten Agenten aus dem <i>Agenten-Factory</i> -Register mit einer einzelnen Benutzernachricht aus. <p> Der Agent wird anhand seines Namens aus den Instanzen des Modells „tl.ai.core:Agent“ ermittelt. Für jeden Aufruf wird eine neue <i>Konversation</i> erstellt; zwischen den Aufrufen wird kein Konversationsverlauf beibehalten. </p> <p> Die gesamte Agentenschleife läuft inline auf dem aufrufenden Thread und blockiert, bis der Durchlauf beendet ist, was mehrere Minuten dauern kann. Wird der Agent aus einer Anfrage heraus aufgerufen, hält er diese Anfrage (und den zugehörigen Servlet-Thread) für die gesamte Laufzeit fest. </p> <p><b>Nicht über die Skriptkonsole nutzbar. Verwenden Sie dort <i>„agentChatAsync</i> “.</b> Eine Anfrage fixiert die Revision der Wissensdatenbank, bei der sie gestartet wurde, und ein Inline-Lauf schreibt über diese hinaus: Die eigenen<i>Agent-Sitzungs- und Ausführungsdatensätze</i> des Laufs werden außerhalb des Arbeitsstroms im Schreib-Thread <i>des Agent-Ausführungsspeichers</i> festgeschrieben, und jedes vom Agenten aufgerufene Schreibwerkzeug führt ebenfalls eine Festschreibung durch. Es reicht daher aus, den Lauf lediglich aufzuzeichnen. Wenn die Konsole anschließend die Ergebniszeile rendert, lehnt der Cache die nun veraltete Revision der Anfrage ab, und die Anfrage schlägt mit einer „KnowledgeBaseRuntimeException“ fehl: „Session-Revision ungültig: Erwartet 95, aber 89 erhalten“ (die Revisionsnummern variieren) – nachdem der Agent seine Arbeit bereits erledigt hat. Das Symptom ist ein langes Hängenbleiben, gefolgt von einem internen Fehler, nicht ein verlorener Lauf. </p> <p> Das Zurücklesen eines asynchronen Laufs erfordert eine <b>zweite</b> Konsolenausführung: Innerhalb der Anfrage, die ihn gestartet hat, gibt <i>agentRunStatus</i> aus demselben Grund der Revisionsfestlegung null (nicht RUNNING) zurück, egal wie lange das Skript wartet. Siehe <i>agentChatAsync</i>. </p> <p> Es wird mit dem Konto agiert, das das Skript ausgeführt hat: Der <i>Tool-Kontext</i> des Laufs wird für den Benutzer erstellt, der an den aufrufenden Thread gebunden ist; daher wird jeder Tool-Aufruf anhand der Rollen dieses Kontos autorisiert und der Modellzugriff anhand der Rechte dieses Kontos geprüft, und der Aufruf wird sofort abgelehnt, wenn der aufrufende Thread keinen Benutzer hat. Es gibt keinen uneingeschränkten Modus, auf den zurückgegriffen werden kann. Ein Skript verfügt über keine Genehmigungsoberfläche, daher werden die Tool-Aufrufe, zu denen das Konto berechtigt ist, automatisch genehmigt, anstatt von einem Menschen bestätigt zu werden. </p> <p> Anwendungsbeispiel in TL-Script: </p><pre> aiAgentChat("my-agent", "Fasse die neuesten Änderungen zusammen.") </pre>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChatAsync = Asynchroner Agent-Chat
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChatAsync.param.agentName.tooltip = Der in der Wissensdatenbank konfigurierte Name des Agenten.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChatAsync.param.userMessage.tooltip = Die Benutzermeldung, die an den Agenten gesendet werden soll.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChatAsync.return = Die persistente ID der Sitzung als <i>String</i> -Handle, über das Status und Ergebnis abgefragt werden können.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChatAsync.tooltip = Startet einen benannten Agenten in einem Hintergrund-Thread und kehrt sofort mit einem Handle zurück. <p> Im Gegensatz zu <i>`agentChat`</i>, das die Agentenschleife synchron im aufrufenden Thread ausführt und so lange blockiert, bis sie beendet ist, übergibt diese Funktion den Lauf an den <i>Scheduler-Dienst</i> und kehrt sofort zurück. Der Rückgabewert ist die persistente ID der Sitzung als einfacher <i>String-Handle</i>: Abfragen mit <i>`agentRunStatus`</i> und <i>`agentRunResult`</i>, um den Fortschritt zu verfolgen und das Transkript abzurufen, sobald der Lauf abgeschlossen ist. </p> <p> Der Hintergrundlauf kehrt in die Untersitzung des aufrufenden Benutzers zurück (die hier synchron auf dem aufrufenden Thread erfasst wird, da sie nicht threadübergreifend gelesen werden kann), sodass der Agent und seine Tools als dieser Benutzer mit dessen Berechtigungen agieren. Eine <i>Agentensitzung vom</i> Typ „BACKGROUND“ wird im Voraus erstellt, sodass der Aufrufer stets ein verwendbares Handle erhält; der Ausführungsdatensatz wird vor dem ersten Modellaufruf erstellt, sobald die Schleife beginnt, und bei Beendigung mit Status und Protokoll abgeschlossen (auch im Fehlerfall, der als „ERROR“ protokolliert wird). </p> <p><b>Warnung – unbeaufsichtigte automatische Genehmigung:</b> Bei einem Hintergrundlauf ist kein Mensch vorhanden, der Aufforderungen zur Tool-Genehmigung beantworten kann, daher wird jeder Tool-Aufruf automatisch genehmigt. Ein asynchroner Lauf kann daher beliebige schreibende/destruktive Tool-Aktionen (Daten löschen, externe Systeme aufrufen, …) unbeaufsichtigt ausführen. Starten Sie asynchrone Läufe nur für Agenten, denen Sie vertrauen, dass sie ohne Aufsicht handeln. Eine Anwendung, die eine Tool-Zugriffsrichtlinie konfiguriert hat, kann dies einschränken: Der Lauf wird zusätzlich auf die Hintergrund-Whitelist dieser Richtlinie beschränkt, gerade weil die Freigabe die Kontrollmöglichkeit ist, die ihr entzogen wurde. </p> <p><b>Vorbehalt – getrennte Transaktion:</b> Der Hintergrundlauf führt das Commit in einer eigenen Transaktion durch, unabhängig von der des Aufrufers. Er kann die noch nicht festgeschriebenen Änderungen des Aufrufers nicht sehen, und wenn diese Funktion aus einer Geschäftstransaktion heraus aufgerufen wird, die später zurückgesetzt wird, ist der Agent (und seine Nebenwirkungen) dennoch bereits ausgeführt worden. </p> <p><b>Frage das Handle in einer separaten Anfrage ab.</b> Die Ausführung bleibt für den Rest der Anfrage, die sie gestartet hat, unsichtbar, egal wie lange diese Anfrage im Wartezustand verbleibt: Die Sitzung wurde mit einer Revision committet, die neuer ist als die festgelegte Revision dieser Anfrage, sodass das Handle hier nicht aufgelöst wird und <i>`agentRunStatus`</i> null zurückgibt – nicht `RUNNING`. In der Skriptkonsole bedeutet dies zwei Ausführungen: Eine startet den Lauf und behält das Handle, eine spätere liest Status und Ergebnis aus. Übertragen Sie das Handle mit `storeInSession`/`loadFromSession` oder fügen Sie es in das Folgeskript ein. </p> <p> Anwendungsbeispiel in TL-Script. Die erste Ausführung startet den Lauf und behält das Handle: </p> <pre> { handle = aiAgentChatAsync("my-agent", "Summarize the latest changes."); $handle.storeInSession(key: "my-run"); $handle; } </pre> <p> Eine spätere Ausführung liest diesen, sobald der Lauf beendet ist, wieder ein: </p> <pre> { handle = loadFromSession("my-run"); aiAgentRunStatus($handle) == "COMPLETE" ? aiAgentRunResult($handle) : null; } </pre>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunCancel = Agentenlauf abbrechen
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunCancel.param.handle.tooltip = Die von <i>agentChatAsync</i> zurückgegebene Zeichenfolge „session-id“ – entweder direkt eine <i>Agent-Sitzung</i>, direkt eine <i>Agent-Ausführung</i> oder eine „run-id“-Zeichenfolge.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunCancel.return = „true“, wenn ein noch laufender Durchlauf zum Abbruch markiert wurde; „false“, wenn das Handle nicht aufgelöst werden konnte oder der Durchlauf bereits beendet war.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunCancel.tooltip = Fordert die Abbruch eines laufenden asynchronen Agentenlaufs an, der mit ` <i>agentChatAsync</i>` gestartet wurde. <p> Cluster-sicher: Das Handle wird auf die oberste Ausführungsebene aufgelöst, und die persistente Abbruchmarkierung des Laufs wird gesetzt und festgeschrieben – ein normaler KB-Schreibvorgang, der von jedem Knoten aus funktioniert, sodass der Knoten, der den Abbruch empfängt, nicht unbedingt der Knoten sein muss, auf dem der Job ausgeführt wird. Der ausführende Knoten erkennt die Markierung bei seinem nächsten Durchlauf der Agent-Schleife und bricht den Lauf ab, der daraufhin mit dem Status „CANCELLED“ abgeschlossen wird. Die Abbruchverarbeitung erfolgt somit asynchron: Rufen Sie <i>`agentRunStatus`</i> ab, um zu beobachten, wann der Lauf den Status „CANCELLED“ erreicht. </p> <p> Eine No-Op-Operation für einen Lauf, der bereits einen Endzustand erreicht hat (es gibt nichts mehr abzusagen). </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunResult = Ergebnis des Agentenlaufs
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunResult.param.handle.tooltip = Die von <i>agentChatAsync</i> zurückgegebene Zeichenfolge „session-id“ – entweder direkt eine <i>Agent-Sitzung</i>, direkt eine <i>Agent-Ausführung</i> oder eine „run-id“-Zeichenfolge.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunResult.return = Der endgültige Antworttext, wenn der Durchlauf ABGESCHLOSSEN ist, andernfalls null.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunResult.tooltip = Gibt die endgültige Antwort eines asynchronen Agentenlaufs zurück, sobald dieser <i>abgeschlossen</i> ist. <p> Dies entspricht dem synchronen <i>agentChat</i>: Es wird dieselbe „final-answer“-Zeichenkette zurückgegeben, die agentChat für den Durchlauf zurückgegeben hätte – also die dauerhaft gespeicherte Antwort, nicht das Transkript. Verwenden Sie <i>„agentRunTranscript“</i>, um das vollständige Konversationsprotokoll abzurufen. Bevor der Lauf abgeschlossen ist – oder falls er in einem anderen Status als „COMPLETE“ beendet wurde – gibt diese Funktion „null“ zurück; verwenden Sie <i>„agentRunStatus“</i>, um die verschiedenen Fälle zu unterscheiden. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunStatus = Status der Agentenausführung
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunStatus.param.handle.tooltip = Die von <i>agentChatAsync</i> zurückgegebene Zeichenfolge „session-id“ – entweder direkt eine <i>Agent-Sitzung</i>, direkt eine <i>Agent-Ausführung</i> oder eine „run-id“-Zeichenfolge.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunStatus.return = Der Statusname oder „null“, falls das Handle keinem Lauf zugeordnet werden kann.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunStatus.tooltip = Gibt den Status eines mit ` <i>agentChatAsync</i>` gestarteten asynchronen Agentenlaufs zurück. <p> Der Status entspricht einem der <i>Ausführungsstatusnamen</i> (RUNNING, COMPLETE, ERROR, CANCELLED, REJECTED). Solange der Lauf noch in der Warteschlange steht oder seine Aufzeichnung im aufrufenden Thread noch nicht sichtbar ist, wird „RUNNING“ zurückgegeben. </p> <p><b>Nicht in der Anfrage, die den Lauf gestartet hat.</b> Wird dies aus derselben Anfrage wie <i>„agentChatAsync“</i> aufgerufen, wird „null“ anstelle von „RUNNING“ zurückgegeben, unabhängig davon, wie lange das Skript dazwischen wartet: Die Sitzung des Durchlaufs wurde in einer neueren Revision als der festgehaltenen dieser Anfrage festgeschrieben, sodass das Handle dort zu nichts führt und ein nicht auflösbares Handle nicht als „läuft“ gemeldet werden kann. Abfrage aus einer späteren Anfrage, d. h. aus einer separaten Ausführung in der Skriptkonsole. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunTranscript = Protokoll des Agent-Laufs
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunTranscript.param.handle.tooltip = Die von <i>agentChatAsync</i> zurückgegebene Zeichenfolge „session-id“ – entweder direkt eine <i>Agent-Sitzung</i>, direkt eine <i>Agent-Ausführung</i> oder eine „run-id“-Zeichenfolge.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunTranscript.return = Das serialisierte Transkript oder „null“, falls der Handle nicht aufgelöst werden kann oder noch kein Transkript aufgezeichnet wurde.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunTranscript.tooltip = Gibt das vollständige Konversationsprotokoll (Transkript) eines asynchronen Agentenlaufs zurück. <p> Das Transkript ist das serialisierte Konversationsprotokoll pro Durchlauf (wie es vom <i>Konversationsprotokoll-Serializer</i> erzeugt wird). Es wird bei Abschluss des Durchlaufs geschrieben, ist also null, solange der Durchlauf noch im Status „RUNNING“ ist, und wird verfügbar, sobald der Durchlauf einen Endzustand erreicht – einschließlich „ERROR“ und „CANCELLED“, bei denen das Teilprotokoll die nützlichste Diagnoseinformation darstellt. Um nur die endgültige Antwort des Agenten abzurufen, verwenden Sie <i>„agentRunResult</i>“. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool = Tool aufrufen
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool.param.parameters.tooltip = Eine Zuordnung von Parameternamen zu Werten oder null, wenn das Tool keine Parameter hat.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool.param.toolName.tooltip = Der qualifizierte Name des aufzurufenden Tools.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool.return = Das Ergebnis der Ausführung des Tools in Form einer Zeichenkette.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool.tooltip = Ruft ein Tool manuell mit den angegebenen Parametern auf. <p> Diese Funktion ermöglicht den direkten Aufruf von registrierten Tools aus TL-Script. Das Tool wird durch seinen qualifizierten Namen im Format Fabrik-Name.Tool-Name identifiziert. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat = Chat
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.param.messages.tooltip = Eine Liste von Nachrichten. Jede Nachricht kann sein: <ul> <li>Zeichenkette: Wird als Benutzertextnachricht behandelt</li> <li>Karte mit "Rolle" und "Inhalt": Explizite Rolle (System/Benutzer/Assistent). Der Inhalt kann eine Zeichenkette, binäre Daten oder eine Liste mit gemischtem Inhalt sein.</li> <li>Binäre Daten: Werden als Bild-/Dokumentennachricht des Benutzers behandelt</li> </ul>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.param.model.tooltip = Der zu verwendende Modellname oder null, um das im <i>LLM-Dienst</i> konfigurierte Standardmodell zu verwenden.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.param.responseFormat.tooltip = Die Spezifikation des Antwortformats. Kann sein: <ul> <li>Null: Keine spezifische Formatanforderung</li> <li>Zeichenfolge "text" oder "json": Einfacher Formattyp</li> <li>Karte mit den Feldern "name" und "schema", die ein JSON-Schema für eine strukturierte Ausgabe beschreiben.</li> </ul>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.param.tools.tooltip = Eine Sammlung qualifizierter Toolnamen, die dem KI-Agenten zur Verfügung gestellt werden sollen (z. B. ["mytools.calculateSum", "texttools.formatText"]), oder null, um keine Tools bereitzustellen.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.return = Der Antworttext des Assistenten.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.tooltip = Sendet eine Multiturn-Konversation an einen Chat-Abschlussanbieter. <p> Nachrichten können Strings, Maps mit Rolle/Inhalt oder Listen sein. Der Inhalt kann aus Textstrings oder <i>binären Daten</i> für Bilder und Dokumente bestehen. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.models = Modelle
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.models.return = Eine unveränderliche Liste mit allen konfigurierten Modellnamen.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.models.tooltip = Gibt eine Liste aller verfügbaren Modellnamen aus dem <i>LLM-Dienst</i> zurück. <p> Die Modellnamen können an die <i>Chat-Funktion</i> übergeben werden, um das zu verwendende KI-Modell auszuwählen. Die zurückgegebene Liste sorgt für eine konsistente Reihenfolge bei Aufrufen. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.toolInfo = Tool-Infos
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.toolInfo.param.toolName.tooltip = Der qualifizierte Name des Tools.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.toolInfo.return = Eine Karte, die die Metadaten des Tools mit der oben beschriebenen Struktur enthält, oder null, wenn das Tool nicht gefunden wird.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.toolInfo.tooltip = Ruft detaillierte Informationen über ein registriertes Tool ab. <p> Diese Funktion gibt Metadaten über ein Tool zurück, einschließlich seines Namens, seiner Beschreibung und seines Parameterschemas. Das Tool wird durch seinen qualifizierten Namen im Format Fabrik-Name.Tool-Name identifiziert. </p> <p> Die zurückgegebene Karte enthält: </p> <ul> <li>name - Der Name des Tools</li> <li>qualifiedName - Der vollständig qualifizierte Name des Tools</li> <li>description - Eine Beschreibung der Funktion des Tools</li> <li>inputSchemaJson - Die JSON-Schemazeichenkette für Toolparameter</li> </ul>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.tools = Tools
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.tools.return = Eine Liste mit allen registrierten Toolnamen.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.tools.tooltip = Gibt eine Liste aller verfügbaren Toolnamen aus dem <i>Tool-Registrierungsdienst</i> zurück. <p> Die Toolnamen haben das qualifizierte Format Fabrikname.Toolname. Diese Namen können an die <i>Chat-Funktion</i> übergeben werden, um dem KI-Agenten Tools zur Verfügung zu stellen. </p>
com.top_logic.tl.ai.core.scripting.Converters.htmlToMarkdown = HTML zu Markdown
com.top_logic.tl.ai.core.scripting.Converters.htmlToMarkdown.param.html.tooltip = Text im HTML-Format.
com.top_logic.tl.ai.core.scripting.Converters.htmlToMarkdown.return = Markdown-formatierter Text.
com.top_logic.tl.ai.core.scripting.Converters.htmlToMarkdown.tooltip = Konvertiert HTML in <i>Markdown</i>.
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtml = Markdown zu HTML
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtml.param.markdown.tooltip = Text im <i>Markdown-Format</i>.
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtml.return = HTML-Fragment, das gerendert werden kann.
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtml.tooltip = Konvertiert <i>Markdown</i> in HTML.
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtmlString = Markdown zu HTML-String
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtmlString.param.markdown.tooltip = Text im <i>Markdown-Format</i>.
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtmlString.return = HTML-Zeichenfolge.
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtmlString.tooltip = Konvertiert <i>Markdown</i> in eine HTML-Zeichenkette.
com.top_logic.tl.ai.core.security.AiToolAccessService = Zugangsdienst für KI-Tools
com.top_logic.tl.ai.core.security.AiToolAccessService.tooltip = Entscheidet, welche Sicherheitsrollen welche Agenten-Tools verwenden dürfen. <p> Wird immer angewendet. Eine Rolle, die hier nicht konfiguriert ist, darf kein Tool verwenden; eine Anwendung, die nichts konfiguriert, lässt ihre Agenten das Modell und die Daten lesen und nichts ändern. </p>
com.top_logic.tl.ai.core.security.RoleToolAccess$GroupSource = Gruppenquelle
com.top_logic.tl.ai.core.security.RoleToolAccess$GroupSource.tooltip = Woher die Tool-Gruppe eines Tools stammt.
com.top_logic.tl.ai.core.security.RoleToolAccess.GroupSource.CONFIGURED = Konfiguriert
com.top_logic.tl.ai.core.security.RoleToolAccess.GroupSource.CONFIGURED.tooltip = Eine Gruppen-Zuordnung der Richtlinie stellt das Tool in ihre Gruppe. Entweder deklariert das Tool keine, oder ein Administrator hat es neu eingeordnet.
com.top_logic.tl.ai.core.security.RoleToolAccess.GroupSource.DECLARED = Erklärt
com.top_logic.tl.ai.core.security.RoleToolAccess.GroupSource.DECLARED.tooltip = Das Tool gibt in seinem Code seine eigene Gruppe an.
com.top_logic.tl.ai.core.security.RoleToolAccess.GroupSource.NONE = Keine
com.top_logic.tl.ai.core.security.RoleToolAccess.GroupSource.NONE.tooltip = Weder noch: Das Tool gehört zu keiner Gruppe und steht daher niemandem zur Verfügung.
com.top_logic.tl.ai.core.security.ToolAccessPolicy = Richtlinie zum Zugriff auf Tools
com.top_logic.tl.ai.core.security.ToolAccessPolicy$BackgroundAllowlist = Hintergrund-Zulassungsliste
com.top_logic.tl.ai.core.security.ToolAccessPolicy$BackgroundAllowlist.tooltip = Die Obergrenze für Agent-Läufe, bei denen niemand einen Tool-Aufruf bestätigen kann. <p> Entweder eine Liste von Funktionen oder <i>„All“</i>, um solche Läufe ohne eigene Begrenzung zu akzeptieren. Ein Eintrag ohne jegliche Funktion ist die strengste Wahl: Diese Läufe gehen dann nicht über die Kommunikation mit dem Benutzer und die Auskunft über den eigenen Tool-Bestand hinaus. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy$Baseline = Grundberechtigungen
com.top_logic.tl.ai.core.security.ToolAccessPolicy$Baseline.tooltip = Die Berechtigungen, die jeder Benutzer unabhängig von seinen Rollen erhält. <p> Ein Eintrag ohne jede Berechtigung ist zulässig und gewährt nichts – so drückt eine Anwendung aus, dass allen Benutzern überhaupt keine Berechtigung gewährt wird. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy$Grant = Berechtigung
com.top_logic.tl.ai.core.security.ToolAccessPolicy$Grant.tooltip = Ein Eintrag in einer Liste von Berechtigungen oder Verweigerungen: entweder eine gesamte Berechtigungsgruppe oder namentlich genannte einzelne Tools.
com.top_logic.tl.ai.core.security.ToolAccessPolicy$GroupMembership = Gruppenmitgliedschaft
com.top_logic.tl.ai.core.security.ToolAccessPolicy$GroupMembership.tooltip = Eine Tool-Gruppe und die Tools, die zu ihr gehören. <p> Für Tools, die selbst keine Gruppe angeben. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy$RoleAccess = Zugriffsrechte für Rollen
com.top_logic.tl.ai.core.security.ToolAccessPolicy$RoleAccess.tooltip = Was eine Sicherheitsrolle nutzen darf und was nicht.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.BackgroundAllowlist.all = Alle Tools erlauben
com.top_logic.tl.ai.core.security.ToolAccessPolicy.BackgroundAllowlist.all.tooltip = Erlaubt einem Lauf, bei dem niemand zum Fragen da ist, alles, was die Rollen des handelnden Benutzers erlauben. <p> Schalten Sie dies nur ein, wenn Sie solche Läufe bewusst ohne eigene Obergrenze wollen. Es gibt die einzige Sicherung auf, die für die Bestätigung einsteht, die niemand geben kann. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.BackgroundAllowlist.grants = Berechtigungen
com.top_logic.tl.ai.core.security.ToolAccessPolicy.BackgroundAllowlist.grants.tooltip = Die Tool-Gruppen und einzelnen Tools, die ein Lauf verwenden darf, bei dem niemand zum Fragen da ist. <p> Wird ignoriert, wenn <i>Alle Tools erlauben</i> eingeschaltet ist. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.Baseline.grants = Berechtigungen
com.top_logic.tl.ai.core.security.ToolAccessPolicy.Baseline.grants.tooltip = Die Tool-Gruppen und einzelnen Tools, die jeder Benutzer verwenden darf.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.Grant.group = Gruppe
com.top_logic.tl.ai.core.security.ToolAccessPolicy.Grant.group.tooltip = Die Tool-Gruppe, auf die sich dieser Eintrag bezieht. <p> Lassen Sie dieses Feld leer, wenn der Eintrag stattdessen einzelne Tools benennt. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.Grant.tools = Tools
com.top_logic.tl.ai.core.security.ToolAccessPolicy.Grant.tools.tooltip = Die einzelnen Tools, auf die sich dieser Eintrag bezieht, mit ihrem qualifizierten Namen. <p> Wählen Sie eines oder mehrere aus. Lassen Sie dieses Feld leer, wenn der Eintrag stattdessen eine Tool-Gruppe benennt: Ein Eintrag bezieht sich entweder auf eine Gruppe oder auf Tools, niemals auf beides. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.GroupMembership.name.tooltip = Die Tool-Gruppe, zu der die hier aufgeführten Tools gehören.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.GroupMembership.tools = Tools
com.top_logic.tl.ai.core.security.ToolAccessPolicy.GroupMembership.tools.tooltip = Die Tools dieser Gruppe, mit ihrem qualifizierten Namen. <p> Wählen Sie jedes Tool aus, das hierher gehört. Ein Tool, das nicht aufgeführt ist, behält die Gruppe bei, die es selbst angibt, und hat überhaupt keine, wenn es keine angibt. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.RoleAccess.denies = Verbote
com.top_logic.tl.ai.core.security.ToolAccessPolicy.RoleAccess.denies.tooltip = Die Tool-Gruppen und einzelnen Tools, die diese Rolle niemals verwenden darf. <p> Eine Verweigerung hier gewinnt immer: gegen die Freigaben dieser Rolle und gegen die Freigaben jeder anderen Rolle desselben Benutzers. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.RoleAccess.grants = Berechtigungen
com.top_logic.tl.ai.core.security.ToolAccessPolicy.RoleAccess.grants.tooltip = Die Tool-Gruppen und einzelnen Tools, die diese Rolle verwenden darf.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.RoleAccess.name.tooltip = Die Sicherheitsrolle, um die es in diesem Eintrag geht.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.background-allowlist = Hintergrund-Zulassungsliste
com.top_logic.tl.ai.core.security.ToolAccessPolicy.background-allowlist.tooltip = Was ein Agentenlauf verwenden darf, bei dem niemand zum Fragen da ist: ein geplanter oder asynchroner Lauf oder eine Anfrage eines externen Clients. <p> Ein solcher Lauf bestätigt jeden Tool-Aufruf selbst, daher ist dies seine Obergrenze; die Rollen des handelnden Benutzers gelten zusätzlich. Eine Anwendung, die oben eine Rolle aufführt und dieses Element weglässt, startet nicht. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.baseline = Grundberechtigungen
com.top_logic.tl.ai.core.security.ToolAccessPolicy.baseline.tooltip = Funktionen, die jeder angemeldete Benutzer zusätzlich zu den durch seine Rollen gewährten erhält. <p> Die Kommunikation mit dem Benutzer und die Auskunft über den eigenen Tool-Bestand erfordern keinen Eintrag – beides ist ohnehin gewährt. Wenn Sie nichts eintragen, dürfen alle das Modell und die Geschäftsdaten lesen. Lassen Sie dieses Element leer, um nichts weiter zu gewähren. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.tool-access = Zugriff auf Tools
com.top_logic.tl.ai.core.security.ToolAccessPolicy.tool-access.tooltip = Die Rollen und was jede von ihnen verwenden darf. <p> Eine Rolle, die hier nicht aufgeführt ist, darf kein Tool verwenden. Eine leere Liste lässt daher jedem Benutzer nur das, was <i>Grundberechtigungen</i> gewährt. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.tool-groups = Tool-Gruppen
com.top_logic.tl.ai.core.security.ToolAccessPolicy.tool-groups.tooltip = Ordnet Tools einer Tool-Gruppe zu, wenn das Tool selbst keine angibt. <p> Nötig für Tools, die erst im laufenden Betrieb auftauchen: die eines angebundenen MCP-Servers und TL-Script-Tools. Ein solches Tool ist für niemanden verwendbar, solange es hier nicht aufgeführt ist, und ein Eintrag hier überschreibt auch die Gruppe, die ein Tool selbst angibt. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.tooltip = Welche Sicherheitsrollen welche Agenten-Tools verwenden dürfen. <p> Erlaubt ist nur, was hier freigegeben wird: Eine Rolle, die nicht aufgeführt ist, darf überhaupt kein Tool verwenden, und ein Benutzer, der keine der aufgeführten Rollen innehat, ebenso wenig. Dies gilt immer – es gibt keine Einstellung, die es abschaltet. Eine Anwendung, die nichts aufführt, lässt ihren Agenten die unten aufgeführten, nur lesenden Berechtigungen. </p>
com.top_logic.tl.ai.core.security.ToolAccessRule$Kind = Art
com.top_logic.tl.ai.core.security.ToolAccessRule$Kind.tooltip = Die Mechanismen, auf denen eine Entscheidung bezüglich einer Richtlinie für den Zugriff auf Tools beruhen kann.
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.ADMIN_BYPASS = Admin-Umgehung
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.ADMIN_BYPASS.tooltip = Das Konto verfügt über Administratorrechte und umgeht diese Ebene daher vollständig.
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.BACKGROUND_CEILING = Hintergrunddecke
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.BACKGROUND_CEILING.tooltip = Die Obergrenze für Läufe, bei denen niemand auf eine Bestätigungsabfrage reagiert. Gilt auch für Administratoren.
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.BASELINE = Ausgangswert
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.BASELINE.tooltip = Ein Eintrag der richtlinieneigenen Basis, der jedes Konto erreicht.
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.DEFAULT_BASELINE = Standard-Basislinie
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.DEFAULT_BASELINE.tooltip = Die Standard-Einstellung „Nur-Lesen“ gilt, da die Richtlinie keine eigene Baseline festlegt.
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.IMPLICIT_BASELINE = Implizite Basislinie
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.IMPLICIT_BASELINE.tooltip = Wird jedem Benutzer in jedem Ausführungsmodus automatisch gewährt, ohne dass eine Konfiguration erforderlich ist.
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.NOT_GRANTED = Nicht bewilligt
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.NOT_GRANTED.tooltip = Die Richtlinie enthält keine entsprechenden Bestimmungen: Es gibt weder einen Basiseintrag noch eine Rolle für das Konto.
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.ROLE_DENY = Rolle verweigern
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.ROLE_DENY.tooltip = Ein Verbot einer der Rollen des Kontos. Hat Vorrang vor allen Berechtigungen.
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.ROLE_GRANT = Rollenzuweisung
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.ROLE_GRANT.tooltip = Eine Berechtigung, über die das Konto aufgrund einer seiner Rollen verfügt.
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.UNCLASSIFIED = Nicht klassifiziert
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.UNCLASSIFIED.tooltip = Das Tool gehört zu keiner Berechtigungsgruppe, sodass es nicht unter eine Gruppenberechtigung fällt und nur durch eine explizite, für jedes Tool einzeln erteilte Berechtigung zugänglich ist.
com.top_logic.tl.ai.core.security.layout.ApplyToolAccessPolicyCommand = Richtlinie übernehmen
com.top_logic.tl.ai.core.security.layout.ApplyToolAccessPolicyCommand.tooltip = Prüft die bearbeitete Richtlinie für den Tool-Zugriff und schreibt sie, wenn der nächste Anwendungsstart sie akzeptieren würde.
com.top_logic.tl.ai.core.security.layout.CapabilityRisk = Besonderheit einer Tool-Gruppe
com.top_logic.tl.ai.core.security.layout.CapabilityRisk.EGRESS = Sendet Daten nach außen
com.top_logic.tl.ai.core.security.layout.CapabilityRisk.EGRESS.tooltip = Ihre Tools senden Daten aus der Anwendung heraus.
com.top_logic.tl.ai.core.security.layout.CapabilityRisk.IMPLICIT = Implizit gewährt
com.top_logic.tl.ai.core.security.layout.CapabilityRisk.IMPLICIT.tooltip = Jedes Konto hält sie, konfiguriert oder nicht.
com.top_logic.tl.ai.core.security.layout.CapabilityRisk.NONE = Keine
com.top_logic.tl.ai.core.security.layout.CapabilityRisk.NONE.tooltip = Nichts über das hinaus, was die Gruppe selbst sagt.
com.top_logic.tl.ai.core.security.layout.CapabilityRisk.PRIVILEGED = Privilegiert
com.top_logic.tl.ai.core.security.layout.CapabilityRisk.PRIVILEGED.tooltip = Ihre Tools können jede andere Berechtigung ausdrücken, ein Grant gewährt also mehr als er nennt.
com.top_logic.tl.ai.core.security.layout.CapabilityRisk.tooltip = Was eine Tool-Gruppe zum zweiten Hinsehen bringt.
com.top_logic.tl.ai.core.security.layout.DiscardToolAccessPolicyCommand = Änderungen verwerfen
com.top_logic.tl.ai.core.security.layout.DiscardToolAccessPolicyCommand.tooltip = Wirft die ungespeicherten Änderungen der Richtlinie für den Tool-Zugriff weg und zeigt die gespeicherte wieder an.
com.top_logic.tl.ai.core.security.layout.EffectiveToolAccessComponent = Ansicht "Effektive Rechte"
com.top_logic.tl.ai.core.security.layout.EffectiveToolAccessComponent.tooltip = Zeigt an, was ein Konto oder eine Rolle aufrufen darf und welche Regel der Richtlinie dies festgelegt hat. <p> Nur-Lese-Zugriff; diese Ansicht gibt Auskunft über den <em>aktuell laufenden</em> Dienst: Was gespeichert, aber noch nicht in Kraft getreten ist, wird hier nicht angezeigt. Die Richtlinie selbst wird auf der Registerkarte „Richtlinie“ festgelegt. </p>
com.top_logic.tl.ai.core.security.layout.PolicyDraft$BackgroundChoice = Wahl der Obergrenze für unbeaufsichtigte Läufe
com.top_logic.tl.ai.core.security.layout.PolicyDraft$BackgroundChoice.tooltip = Die Obergrenze für Läufe, in denen niemand einen Aufruf bestätigen kann.
com.top_logic.tl.ai.core.security.layout.PolicyDraft$BaselineChoice = Wahl der Grundberechtigungen
com.top_logic.tl.ai.core.security.layout.PolicyDraft$BaselineChoice.tooltip = Was jedes Konto zusätzlich zu den Grants seiner Rollen erhält.
com.top_logic.tl.ai.core.security.layout.PolicyDraft$CapabilityState = Zustand einer Tool-Gruppe
com.top_logic.tl.ai.core.security.layout.PolicyDraft$CapabilityState.tooltip = Was eine Rolle über eine Tool-Gruppe sagt.
com.top_logic.tl.ai.core.security.layout.PolicyDraft$RoleTemplate = Vorlage für eine Rolle
com.top_logic.tl.ai.core.security.layout.PolicyDraft$RoleTemplate.tooltip = Ein Ausgangspunkt für eine Rolle, die der Richtlinie hinzugefügt wird.
com.top_logic.tl.ai.core.security.layout.PolicyDraft.BackgroundChoice.ALL = Alles, was die Rollen erlauben
com.top_logic.tl.ai.core.security.layout.PolicyDraft.BackgroundChoice.ALL.tooltip = Keine eigene Obergrenze: Solche Läufe erreichen alles, was die Rollen des handelnden Kontos gewähren.
com.top_logic.tl.ai.core.security.layout.PolicyDraft.BackgroundChoice.CUSTOM = Eigene Liste
com.top_logic.tl.ai.core.security.layout.PolicyDraft.BackgroundChoice.CUSTOM.tooltip = Nur die gewählten Tool-Gruppen und Tools.
com.top_logic.tl.ai.core.security.layout.PolicyDraft.BackgroundChoice.UNDECLARED = Nicht festgelegt
com.top_logic.tl.ai.core.security.layout.PolicyDraft.BackgroundChoice.UNDECLARED.tooltip = Nicht festgelegt. Ungültig, sobald die Richtlinie eine Rolle nennt, und beim Übernehmen abgewiesen.
com.top_logic.tl.ai.core.security.layout.PolicyDraft.BaselineChoice.CUSTOM = Eigene Liste
com.top_logic.tl.ai.core.security.layout.PolicyDraft.BaselineChoice.CUSTOM.tooltip = Genau die gewählten Tool-Gruppen, die die Vorgabe vollständig ersetzen.
com.top_logic.tl.ai.core.security.layout.PolicyDraft.BaselineChoice.DEFAULT = Standard
com.top_logic.tl.ai.core.security.layout.PolicyDraft.BaselineChoice.DEFAULT.tooltip = Die ausgelieferte Nur-Lese-Vorgabe: Jedes Konto darf das Modell und die Daten lesen.
com.top_logic.tl.ai.core.security.layout.PolicyDraft.BaselineChoice.NOTHING = Nichts
com.top_logic.tl.ai.core.security.layout.PolicyDraft.BaselineChoice.NOTHING.tooltip = Nichts. Nur, was eine Rolle gewährt, plus die beiden Gruppen, die keine Richtlinie entziehen kann.
com.top_logic.tl.ai.core.security.layout.PolicyDraft.CapabilityState.ABSENT = Nicht genannt
com.top_logic.tl.ai.core.security.layout.PolicyDraft.CapabilityState.ABSENT.tooltip = Die Rolle sagt nichts dazu. Eine andere Rolle des Kontos oder die Grundberechtigung kann sie trotzdem gewähren.
com.top_logic.tl.ai.core.security.layout.PolicyDraft.CapabilityState.DENIED = Verboten
com.top_logic.tl.ai.core.security.layout.PolicyDraft.CapabilityState.DENIED.tooltip = Die Rolle verbietet sie. Das schlägt jede Berechtigung jeder anderen Rolle und die Grundberechtigung.
com.top_logic.tl.ai.core.security.layout.PolicyDraft.CapabilityState.GRANTED = Gewährt
com.top_logic.tl.ai.core.security.layout.PolicyDraft.CapabilityState.GRANTED.tooltip = Die Rolle gewährt sie.
com.top_logic.tl.ai.core.security.layout.PolicyDraft.RoleTemplate.CLERK = Sachbearbeiter
com.top_logic.tl.ai.core.security.layout.PolicyDraft.RoleTemplate.CLERK.tooltip = Liest, und ändert Geschäftsdaten, wobei der Nutzer jeden Aufruf bestätigt.
com.top_logic.tl.ai.core.security.layout.PolicyDraft.RoleTemplate.DEVELOPER = Entwickler
com.top_logic.tl.ai.core.security.layout.PolicyDraft.RoleTemplate.DEVELOPER.tooltip = Die Tool-Gruppen des Sachbearbeiters plus das Ausführen von TL-Script.
com.top_logic.tl.ai.core.security.layout.PolicyDraft.RoleTemplate.NONE = Keine
com.top_logic.tl.ai.core.security.layout.PolicyDraft.RoleTemplate.NONE.tooltip = Nichts gewährt. Jede Tool-Gruppe beginnt als nicht genannt.
com.top_logic.tl.ai.core.security.layout.PolicyDraft.RoleTemplate.READ_ONLY = Nur-Lese-Assistent
com.top_logic.tl.ai.core.security.layout.PolicyDraft.RoleTemplate.READ_ONLY.tooltip = Liest das Modell und die Geschäftsdaten und ändert nichts.
com.top_logic.tl.ai.core.security.layout.SecurityRoleKind = Art einer Sicherheitsrolle
com.top_logic.tl.ai.core.security.layout.SecurityRoleKind.APPLICATION = Anwendungsrolle
com.top_logic.tl.ai.core.security.layout.SecurityRoleKind.APPLICATION.tooltip = Eine Rolle dieser Anwendung, die Konten erhalten, damit sie ihre Aufgabe erledigen können.
com.top_logic.tl.ai.core.security.layout.SecurityRoleKind.FRAMEWORK = Framework-Rolle
com.top_logic.tl.ai.core.security.layout.SecurityRoleKind.FRAMEWORK.tooltip = Eine Rolle des Frameworks, deren Bedeutung hier bekannt sein muss, bevor man sie gewährt.
com.top_logic.tl.ai.core.security.layout.SecurityRoleKind.INTERNAL = Interne Rolle
com.top_logic.tl.ai.core.security.layout.SecurityRoleKind.INTERNAL.tooltip = Eine Rolle, die das Framework intern verwendet und für die ein Tool-Grant nichts bedeutet.
com.top_logic.tl.ai.core.security.layout.SecurityRoleKind.tooltip = Auf welche Art von Sicherheitsrolle ein Name verweist, dort wo ein Administrator eine auswählt.
com.top_logic.tl.ai.core.security.layout.ToolAccessPolicyComponent = Richtlinie für den Tool-Zugriff
com.top_logic.tl.ai.core.security.layout.ToolAccessPolicyComponent$EntryKind = Art des Eintrags
com.top_logic.tl.ai.core.security.layout.ToolAccessPolicyComponent$EntryKind.tooltip = Was ein Eintrag in einer Berechtigungsliste bezeichnet.
com.top_logic.tl.ai.core.security.layout.ToolAccessPolicyComponent.EntryKind.GROUP = Gruppe
com.top_logic.tl.ai.core.security.layout.ToolAccessPolicyComponent.EntryKind.GROUP.tooltip = Eine ganze Tool-Gruppe.
com.top_logic.tl.ai.core.security.layout.ToolAccessPolicyComponent.EntryKind.TOOLS = Tools
com.top_logic.tl.ai.core.security.layout.ToolAccessPolicyComponent.EntryKind.TOOLS.tooltip = Einzelne Tools, mit ihrem qualifizierten Namen.
com.top_logic.tl.ai.core.security.layout.ToolAccessPolicyComponent.tooltip = Konfiguriert, welche Sicherheitsrollen welche Agenten-Tools benutzen dürfen. <p> Schreibt die Richtlinie des Zugangsdienstes für KI-Tools. Das Gespeicherte wird wirksam, sobald dieser Dienst neu gestartet wird. Diese Ansicht bietet den Neustart an. </p>
com.top_logic.tl.ai.core.security.layout.ToolAccessVerdict = Ergebnis des Tool-Zugriffs
com.top_logic.tl.ai.core.security.layout.ToolAccessVerdict.ALLOWED = Gewährt
com.top_logic.tl.ai.core.security.layout.ToolAccessVerdict.ALLOWED.tooltip = Darf benutzt werden.
com.top_logic.tl.ai.core.security.layout.ToolAccessVerdict.DENIED = Verweigert
com.top_logic.tl.ai.core.security.layout.ToolAccessVerdict.DENIED.tooltip = Darf nicht benutzt werden.
