com.top_logic.xio.importer.handlers.ScopedImportHandler.Config.expr.tooltip = Ausdruck zur Berechnung des neuen Kontexts für verschachtelte Importe. <p> Es wird erwartet, dass der Ausdruck eine Funktion ist, die als einziges Argument den aktuellen Umfang des Imports annimmt. </p>
com.top_logic.xio.importer.handlers.ScopedImportHandler.Config.scope-var = Kontext-Variable
com.top_logic.xio.importer.handlers.ScopedImportHandler.Config.scope-var.tooltip = Die Variable, der das <i>Expr-Ergebnis</i> zugewiesen werden soll.
com.top_logic.xio.importer.handlers.ScopedImportHandler.tooltip = <i>Verschachtelter Importhandler</i>, der einen neuen Importkontext durch Auswertung einer Funktion auswählt.
