com.top_logic.layout.react.wysiwyg.ObjectLinkConfig = Objektverknüpfung
com.top_logic.layout.react.wysiwyg.ObjectLinkConfig.dialog-view = Dialogansicht
com.top_logic.layout.react.wysiwyg.ObjectLinkConfig.dialog-view.tooltip = Pfad der Ansicht, in der das Objekt ausgewählt wird, relativ zum Basispfad der Ansichten.
com.top_logic.layout.react.wysiwyg.ObjectLinkConfig.result-channel = Ergebniskanal
com.top_logic.layout.react.wysiwyg.ObjectLinkConfig.result-channel.tooltip = Name des Kanals, auf dem der Dialog das ausgewählte Objekt veröffentlicht. <p> Der Editor fügt einen Link ein, sobald ein Objekt auf diesem Kanal erscheint; der Dialog schreibt ihn daher erst, wenn der Benutzer sich entschieden hat, und nicht auf jedem Schritt dorthin. Ein Dialog, der sich beim Veröffentlichen seines Ergebnisses nicht selbst schließt, wird geschlossen, sobald der Link im Text steht. </p>
com.top_logic.layout.react.wysiwyg.ObjectLinkConfig.tooltip = Woher der Editor das Objekt bezieht, für das ein Link eingefügt wird. <p> Der Benutzer wählt das Objekt in einem Dialog der Anwendung aus, der das gewählte Objekt auf einem Kanal veröffentlicht. Was und wie ausgewählt wird, ist beliebig, solange der Dialog das Objekt auf diesen Kanal schreibt: eine Tabelle der fraglichen Objekte, eine Suche, ein Baum. </p>
com.top_logic.layout.react.wysiwyg.WysiwygControlProvider = WYSIWYG-Editor
com.top_logic.layout.react.wysiwyg.WysiwygControlProvider.Config.object-link = Objektverknüpfung
com.top_logic.layout.react.wysiwyg.WysiwygControlProvider.Config.object-link.tooltip = Woher der Editor das Objekt bezieht, für das ein Link eingefügt werden soll. <p> Wird festgelegt, um die Schaltfläche zum Einfügen eines Links zu einem Anwendungsobjekt anzubieten. Ohne diese Angabe verfügt der Editor nicht über eine solche Schaltfläche. </p>
com.top_logic.layout.react.wysiwyg.WysiwygControlProvider.tooltip = <i>React-Feldcontrol-Provider</i> für Attribute vom Typ tl.model.wysiwyg:Html. <p> Der Editor bietet eine Schaltfläche zum Einfügen eines Links auf ein Anwendungsobjekt, wenn eine <i>Objektverknüpfung</i> festlegt, in welchem Dialog das Objekt ausgewählt wird. Ohne diese Angabe formatiert der Editor nur Text. </p>
