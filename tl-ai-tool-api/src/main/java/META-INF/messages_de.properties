com.top_logic.tl.ai.tool.api.registry.ReflectiveToolFactory.Config.tool-class.tooltip = Die Java-Klasse, die mit <i>Werkzeugmethoden</i> kommentierte Methoden enthält. <p> Diese Klasse wird nach Werkzeugdefinitionen durchsucht. Alle Methoden, die mit @ToolMethod gekennzeichnet sind, werden als AI-Tools angezeigt. </p>
