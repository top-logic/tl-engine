com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.discovery-uri = Discovery URI
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.discovery-uri.tooltip = URL to retrieve <i>Provider metadata</i> from. <p> If not set, <i>Provider metadata</i> must be configured explicitly. </p>
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.logout-url = Logout URL
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.max-age = Maximum age
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.max-clock-skew = Maximum clock skew
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.preferred-jws-algorithm = Preferred jws algorithm
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.provider-metadata = Provider metadata
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.provider-metadata.tooltip = The provider detail configuration in JSON format. <p> If not set, <i>Discovery URI</i> must be set to dynamically retrieve the provider configuration. </p>
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.read-timeout = Read timeout
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.resource-retriever = Resource retriever
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.response-mode = Response mode
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.response-type = Response type
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.scope = Scope
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.secret = Secret
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.secret.tooltip = The client secret to authenticate this application at the identity provider. <p> Recommended is a reference to the secret by its name, so that the secret is not part of the configuration, e.g. <code>&lt;secret name="OIDC_CLIENT_SECRET"/&gt;</code>, which the default secret store reads from the environment variable of that name holding the plain secret. An attribute value is an encrypted secret, or a plain secret with the prefix <code>unencrypted:</code>. </p> <p> The secret is not read at startup, so that the application starts without it. It is read when a login with this client starts and before each token request, so that a rotated secret is used without restart. While the secret is missing, the login page does not offer this client. </p>
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.state-generator = State generator
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.use-nonce = Use nonce
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.with-state = With state
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.tooltip = Base class for <i>client configurators</i> allowing to configure common properties.
com.top_logic.security.auth.pac4j.config.HasCallbackUrl.callback-url = Callback URL
com.top_logic.security.auth.pac4j.config.HasCallbackUrl.callback-url-absolute = Callback URL absolute
com.top_logic.security.auth.pac4j.config.HasCallbackUrl.callback-url-absolute.tooltip = Whether the <i>Callback URL</i> is an absolute URL. <p> If <code>false</code>, the <i>Callback URL</i> is relative to the application's context path. </p>
com.top_logic.security.auth.pac4j.config.HasCallbackUrl.callback-url.tooltip = URL where the the <i>callback filter</i> is reachable.
com.top_logic.security.auth.pac4j.config.Pac4jConfigFactory = Pac4j configuration factory
com.top_logic.security.auth.pac4j.config.Pac4jConfigFactory.Config.clients = Clients
com.top_logic.security.auth.pac4j.config.Pac4jConfigFactory.Config.clients.tooltip = Authentication <i>client</i> configurations.
com.top_logic.security.auth.pac4j.config.Pac4jConfigFactory.tooltip = <i>TopLogic</i> module building the pac4j configuration.
com.top_logic.security.auth.pac4j.config.azure.AzureClientConfigurator = Azure client configurator
com.top_logic.security.auth.pac4j.config.azure.AzureClientConfigurator.Config.discovery-uri.tooltip = Must not be set because it is hard-coded by the <i>azure ad2client</i> implementation. <p> Set <i>Tenant</i> instead. </p>
com.top_logic.security.auth.pac4j.config.azure.AzureClientConfigurator.Config.tenant = Tenant
com.top_logic.security.auth.pac4j.config.azure.AzureClientConfigurator.tooltip = <i>Client configurator</i> for an <i>azure ad2client</i> with specialized configuration options.
com.top_logic.security.auth.pac4j.config.google.GoogleClientConfigurator = Google client configurator
com.top_logic.security.auth.pac4j.config.google.GoogleClientConfigurator.tooltip = <i>Client configurator</i> specialized for <i>google oidc clients</i>.
com.top_logic.security.auth.pac4j.config.keycloak.KeycloakClientConfigurator = Keycloak client configurator
com.top_logic.security.auth.pac4j.config.keycloak.KeycloakClientConfigurator.Config.base-uri = Base URI
com.top_logic.security.auth.pac4j.config.keycloak.KeycloakClientConfigurator.Config.discovery-uri.tooltip = Must not be set because it is hard-coded by the <i>keycloak oidc client</i> implementation. <p> Set <i>Base URI</i> and <i>Realm</i> instead. </p>
com.top_logic.security.auth.pac4j.config.keycloak.KeycloakClientConfigurator.Config.realm = Realm
com.top_logic.security.auth.pac4j.config.keycloak.KeycloakClientConfigurator.tooltip = <i>Client configurator</i> for an <i>keycloak oidc client</i> with specialized configuration options.
com.top_logic.security.auth.pac4j.provisioning.NameConflict = Name conflict
com.top_logic.security.auth.pac4j.provisioning.NameConflict.REFUSE = Refuse
com.top_logic.security.auth.pac4j.provisioning.NameConflict.REFUSE.tooltip = The login is refused with a message naming the conflict.
com.top_logic.security.auth.pac4j.provisioning.NameConflict.RENAME = Rename
com.top_logic.security.auth.pac4j.provisioning.NameConflict.RENAME.tooltip = The account is created under the name <code>&lt;name&gt;@&lt;client&gt;</code>, if that is taken as well under <code>&lt;name&gt;@&lt;client&gt;-2</code>, <code>&lt;name&gt;@&lt;client&gt;-3</code>, and so on.
com.top_logic.security.auth.pac4j.provisioning.NameConflict.tooltip = What <i>OIDC account provisioning</i> does when the login name of an account to create is already taken by an account the identity is not linked to. <p> Such an account is never linked to the identity: it may belong to someone else. </p>
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping = OIDC account provisioning
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.allowed-email-domains = Allowed email domains
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.allowed-email-domains.tooltip = The domains of the e-mail addresses for which accounts are created, e.g. <code>example.com</code>. <p> Empty: accounts are created for every e-mail address, and for identities without one. The domains are compared ignoring case. </p>
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.authentication-device = Authentication device
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.authentication-device.tooltip = The ID of the authentication device of a created account. <p> Empty: the account has no authentication device and can log in only through an external login. </p>
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.create-accounts = Create accounts
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.create-accounts.tooltip = Whether an account is created for an identity for which no account is found. <p> The account has no password and logs in only through the external login. </p>
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.default-groups = Default groups
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.default-groups.tooltip = The names of the groups an account is a member of while the identity has no claim <i>Group claim</i>. <p> They are synchronized like the groups of the claim: once the claim is present, the account loses them unless the claim yields them as well. </p>
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.email-claim = Email claim
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.email-claim.tooltip = The claim with the e-mail address of the identity.
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.email-verified-claim = Email verified claim
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.email-verified-claim.tooltip = The claim telling whether the identity provider has confirmed the e-mail address.
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.first-name-claim = First name claim
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.first-name-claim.tooltip = The claim with the first name of a created account.
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.group-claim = Group claim
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.group-claim.tooltip = The claim with the groups of the user at the identity provider, e.g. <code>groups</code> (Keycloak, Entra ID) or <code>roles</code>. <p> The claim holds a list of values, or a single one. The values are translated to groups of the application by <i>Group mapping</i>. At every login, the account becomes a member of the groups the claim yields, and loses the memberships an earlier login has granted and the claim no longer yields. Memberships assigned in the application by hand are not touched. </p> <p> Empty: only the <i>Default groups</i> are synchronized. </p>
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.group-mapping = Group mapping
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.group-mapping.tooltip = The groups of the application by the value of the claim <i>Group claim</i>. <p> An entry <code>&lt;group claim-value="admins" groups="Administrators,Editors"/&gt;</code> makes an account whose claim contains the value <code>admins</code> a member of the groups with the names <code>Administrators</code> and <code>Editors</code>. Values without entry are ignored, unless <i>Groups by name</i> is set. </p>
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.groups-by-name = Groups by name
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.groups-by-name.tooltip = Whether a value of the claim <i>Group claim</i> without entry in <i>Group mapping</i> names the existing group of the same name.
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.last-name-claim = Last name claim
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.last-name-claim.tooltip = The claim with the last name of a created account.
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.link-by-email = Link by email
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.link-by-email.tooltip = Whether an identity without account is linked to the account with its e-mail address. <p> Only if the identity provider has confirmed the address (claim <i>Email verified claim</i>) and exactly one account has it. Switch it on only for an identity provider whose confirmation of e-mail addresses is trusted: whoever controls an address there gets the account with that address. </p>
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.link-by-name = Link by name
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.link-by-name.tooltip = Whether an identity without account is linked to the account with its login name.
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.listeners = Listeners
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.listeners.tooltip = The <i>external login listeners</i> called at every login. <p> They are called in the transaction of the login, after the account has been found or created. </p>
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.login-name-claim = Login name claim
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.login-name-claim.tooltip = The claim with the login name of the account. <p> The name of an account to create, and the name an identity is linked by (<i>Link by name</i>). Without this claim, the name the client extracts is used. </p>
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.name-conflict = Name conflict
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.name-conflict.tooltip = What happens when the login name of an account to create is taken by an account the identity is not linked to.
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.require-verified-email = Require verified email
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.require-verified-email.tooltip = Whether an account is created only for an identity whose e-mail address the identity provider has confirmed (claim <i>Email verified claim</i>).
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.tooltip = <i>External user mapping</i> for the <code>user-mapping</code> of a pac4j client that links the accounts to the identities of the identity provider and creates the accounts on demand. <p> The account of an <i>external identity</i> is the first one found in this order: </p> <ol> <li>the account carrying an <i>oidc identity</i> with the client and subject of the identity,</li> <li>with <i>Link by email</i>: the single account with the e-mail address of the identity, if the identity provider has confirmed it,</li> <li>with <i>Link by name</i>: the account with the login name of the identity,</li> <li>with <i>Create accounts</i>: a new account.</li> </ol> <p> An account found by e-mail or name gets the identity attached, a new account as well. If the account already carries another identity of the same client, the login is refused. Without an account the login is refused with an <i>unknown account exception</i>. </p> <p> After the account is known, its group memberships are synchronized with the claim <i>Group claim</i> (see <i>Group mapping</i>), then the listeners are called in the same transaction. An exception rolls the transaction back and refuses the login. A login that changes nothing and has no listeners to call opens no transaction. </p> <p> The e-mail address of an account is the e-mail of its user information, which exists only with the contact module. Without it, a created account gets only its first and last name, and <i>Link by email</i> finds no account. </p>
