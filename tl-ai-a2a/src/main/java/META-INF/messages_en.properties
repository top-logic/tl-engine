com.top_logic.ai.a2a.A2AService.tooltip = Connects this application's agents to other agents over the A2A protocol v1.0: exposes configured agents (/a2a/*, <i>A2A servlet</i>) and lets local agents call configured remote agents (tool factory a2a, A2AClientTools). <p> Deny by default: an agent is reachable only if it is listed under &lt;agents&gt;, and only with a credential one of the &lt;authentications&gt; accepts - the schemes of the MCP endpoint, personal access tokens among them. A run acts as the account the credential names. </p>
