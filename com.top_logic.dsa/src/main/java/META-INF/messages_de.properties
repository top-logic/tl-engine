com.top_logic.dsa.repos.Repository.existsEntry.tooltip = Prüft, ob der angegebene Name im Repository vorhanden ist
com.top_logic.dsa.repos.Repository.get = Holen Sie sich
com.top_logic.dsa.repos.Repository.get.param.aPathIncludingFileName.tooltip = Pfad zur Datei einschließlich des Dateinamens; verwende „null“, um eine Datei auf oberster Ebene anzugeben
com.top_logic.dsa.repos.Repository.get.param.aVersion.tooltip = Abzurufende Version des Repository-Eintrags
com.top_logic.dsa.repos.Repository.get.return = Ein InputStream mit der angeforderten Version des Dokuments (bitte schließen Sie ihn nach der Verwendung mit „close()“).
com.top_logic.dsa.repos.Repository.get.tooltip = Gibt einen Stream mit der angegebenen Version des angegebenen Repository-Eintrags zurück <p> Bitte schließen Sie den Stream so schnell wie möglich mit „close()“, da die zugrunde liegende Implementierung den Eintrag bis dahin möglicherweise nicht wiederverwenden kann. </p>
com.top_logic.dsa.repos.Repository.getCurrentRevisionNum = Aktuelle Revisionsnummer abrufen
com.top_logic.dsa.repos.Repository.getCurrentRevisionNum.param.aPathIncludingFileName.tooltip = Pfad zur Datei einschließlich des Dateinamens
com.top_logic.dsa.repos.Repository.getCurrentRevisionNum.param.aUser.tooltip = Benutzer, der die Informationen anfordert.
com.top_logic.dsa.repos.Repository.getCurrentRevisionNum.return = Eine Nummer, die bei der ersten Überarbeitung bei 1 beginnt.
com.top_logic.dsa.repos.Repository.getCurrentRevisionNum.tooltip = Geben Sie die Nummer der aktuellen Revision auf oberster Ebene an, beginnend mit 1. Falls der Eintrag für den angegebenen Benutzer <code>inUpdate</code> ist, ist die Nummer um eins höher als in den anderen Fällen.
com.top_logic.dsa.repos.Repository.getEntries = Einträge abrufen
com.top_logic.dsa.repos.Repository.getEntries.param.aPathOfDirectory.tooltip = Der Pfad zum Verzeichnis
com.top_logic.dsa.repos.Repository.getEntries.return = Eine Auflistung mit den VersionInfo-Angaben aller Einträge oder Verzeichnisse der obersten Ebene.
com.top_logic.dsa.repos.Repository.getEntries.tooltip = Gibt eine Auflistung von „EntryInfos“ für das angegebene Verzeichnis zurück.
com.top_logic.dsa.repos.Repository.getInformation = Informationen abrufen
com.top_logic.dsa.repos.Repository.getInformation.param.aPath.tooltip = Pfad zu einer Datei oder einem Ordner.
com.top_logic.dsa.repos.Repository.getInformation.return = Informationen zur Überarbeitung der obersten Ebene
com.top_logic.dsa.repos.Repository.getInformation.tooltip = Geben Sie Informationen für die Überarbeitung auf oberster Ebene an.
com.top_logic.dsa.repos.Repository.lock = Sperre
com.top_logic.dsa.repos.Repository.lock.param.aPathIncludingFileName.tooltip = Pfad zur Datei einschließlich Dateiname
com.top_logic.dsa.repos.Repository.lock.param.user.tooltip = Der Benutzer, der die Sperre für den Eintrag aktiviert
com.top_logic.dsa.repos.Repository.lock.return = Wahr, wenn die Sperre des Objekts erfolgreich durchgeführt wurde.
com.top_logic.dsa.repos.Repository.lock.tooltip = Sperre des durch aPath und den Dateinamen beschriebenen Dokuments. Die Sperre schlägt fehl, falls ein anderer Benutzer die Datei bereits gesperrt hat.
com.top_logic.dsa.repos.Repository.mkdir = Mkdir
com.top_logic.dsa.repos.Repository.mkdir.param.aDirectoryName.tooltip = Der Name des zu erstellenden Verzeichnisses.
com.top_logic.dsa.repos.Repository.mkdir.param.aParentPath.tooltip = Der Pfadname zum Verzeichnis; verwenden Sie „null“, um ein Verzeichnis auf oberster Ebene anzugeben
com.top_logic.dsa.repos.Repository.mkdir.return = Wahr, wenn die Erstellung erfolgreich war
com.top_logic.dsa.repos.Repository.mkdir.tooltip = Erstellt ein Verzeichnis unterhalb des angegebenen Containers.
com.top_logic.dsa.repos.Repository.rmdir = Rmdir
com.top_logic.dsa.repos.Repository.rmdir.param.aPath.tooltip = Der Pfad zu dem Verzeichnis, das gelöscht werden soll
com.top_logic.dsa.repos.Repository.rmdir.return = Wahr, wenn das Verzeichnis (als) gelöscht markiert wurde, andernfalls falsch
com.top_logic.dsa.repos.Repository.rmdir.tooltip = Löscht das Verzeichnis (markiert es als gelöscht), sofern es leer ist.
com.top_logic.dsa.repos.Repository.unlock = Entsperren
com.top_logic.dsa.repos.Repository.unlock.param.aPathIncludingFileName.tooltip = Pfad zur Datei einschließlich des Dateinamens
com.top_logic.dsa.repos.Repository.unlock.param.user.tooltip = Der Benutzer, der die Sperre für den Eintrag aktiviert
com.top_logic.dsa.repos.Repository.unlock.return = Wahr, wenn das Entsperren erfolgreich war, andernfalls falsch
com.top_logic.dsa.repos.Repository.unlock.tooltip = Setzt eine Sperre für die angegebene Datei zurück, sofern diese vom aktuellen Benutzer gesperrt wurde. Eine Datei kann nur entsperrt werden, wenn derselbe Benutzer zuvor die Funktion `lock()` aufgerufen hat. War der Eintrag <code>inUpdate</code>, wird die neue Version freigegeben.
com.top_logic.dsa.repos.RepositoryDataSourceAdaptor = Adapter für Repository-Datenquellen
