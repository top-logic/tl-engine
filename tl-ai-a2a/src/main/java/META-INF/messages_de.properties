com.top_logic.ai.a2a.A2AService.tooltip = Verbindet die Agenten dieser Anwendung über das A2A-Protokoll v1.0 mit anderen Agenten: stellt konfigurierte Agenten bereit (/a2a/*, <i>A2A-Servlet</i>) und lässt lokale Agenten konfigurierte entfernte Agenten aufrufen (Werkzeug-Factory a2a, A2AClientTools). <p> Standardmäßig geschlossen: Ein Agent ist nur erreichbar, wenn er unter &lt;agents&gt; steht, und nur mit einem Nachweis, den eine der &lt;authentications&gt; annimmt - die Verfahren des MCP-Endpunkts, darunter persönliche Zugriffstokens. Ein Lauf handelt als das Konto, das der Nachweis nennt. </p>
