com.top_logic.ai.service.scripting.OpenAIScriptFunctions.callTool.tooltip = Ruft ein Tool manuell mit den angegebenen Parametern auf. <p> Diese Funktion ermï¿½glicht den direkten Aufruf von registrierten Werkzeugen aus TL-Script. Das Werkzeug wird durch seinen qualifizierten Namen im Format Fabrik-Name.Werkzeug-Name identifiziert. </p> <p> Die Parameter kï¿½nnen als Map ï¿½bergeben werden, deren Schlï¿½ssel mit den Parameternamen des Werkzeugs ï¿½bereinstimmen, oder als Positionsargumente, falls das Werkzeug diese akzeptiert. Die Funktion gibt das Ergebnis des Werkzeugs als Zeichenkette zurï¿½ck. </p> <p> Beispiel fï¿½r die Verwendung in TL-Script: </p> <pre> aiCallTool("tlscript.listTLScriptFunctions", map()) aiCallTool("tlscript.getTLScriptFunctionDocumentation", map("functionName" -&gt; "list")) </pre>
