class.com.top_logic.ai.mcp.server.authentication.I18NConstants.ERROR_AUTHENTICATION_UNAVAILABLE__DOMAIN = The MCP authentication "{0}" could not be created and therefore authenticates nobody. Check its configuration and its secret on MCPServerService.
class.com.top_logic.ai.mcp.server.authentication.I18NConstants.ERROR_AUTHENTICATION_UNAVAILABLE__DOMAIN.help = One configured authentication could not be built, so it authenticates nobody.
class.com.top_logic.ai.mcp.server.authentication.I18NConstants.ERROR_INTERACTION_ALREADY_BOUND = Refusing this request: its thread already carries a TopLogic interaction, so the authenticated account could not be bound to it and the request would have acted as somebody else.
class.com.top_logic.ai.mcp.server.authentication.I18NConstants.ERROR_INTERACTION_ALREADY_BOUND.help = The request arrived on a thread that already carries a TopLogic interaction.
class.com.top_logic.ai.mcp.server.authentication.I18NConstants.ERROR_NO_ACCOUNT_FOR_CREDENTIAL = Authenticated, but this credential names no application account. The MCP endpoint acts as the account it authenticated and never in system context, so give the secret a user-id - preferably a dedicated service account.
class.com.top_logic.ai.mcp.server.authentication.I18NConstants.ERROR_NO_ACCOUNT_FOR_CREDENTIAL.help = The caller authenticated, but the credential is not mapped to an application account.
class.com.top_logic.ai.mcp.server.authentication.I18NConstants.ERROR_NO_AUTHENTICATION_CONFIGURED = The MCP endpoint /mcp/* is not available: this application configures no authentication for it, and the endpoint serves no request it cannot attribute to an account. Configure an authentication and a secret on MCPServerService - see doc/security/mcp-endpoint.md.
class.com.top_logic.ai.mcp.server.authentication.I18NConstants.ERROR_NO_AUTHENTICATION_CONFIGURED.help = The endpoint serves nobody because no authentication is configured for it.
class.com.top_logic.ai.mcp.server.authentication.I18NConstants.ERROR_SESSION_BELONGS_TO_ANOTHER_ACCOUNT = This mcp-session-id belongs to another account. An MCP session stays with the account that opened it; start your own session with an initialize request.
class.com.top_logic.ai.mcp.server.authentication.I18NConstants.ERROR_SESSION_BELONGS_TO_ANOTHER_ACCOUNT.help = A second account tried to use an MCP session another account opened.
com.top_logic.ai.mcp.server.MCPServerService = MCP server service
com.top_logic.ai.mcp.server.MCPServerService.Config.allowed-hosts = Allowed hosts
com.top_logic.ai.mcp.server.MCPServerService.Config.allowed-hosts.tooltip = The host names this endpoint answers to, for example mcp.example.com or localhost:*. <p> When set, a request whose Host header is not in this list is refused with 421. Empty checks no Host. :* matches any port. </p>
com.top_logic.ai.mcp.server.MCPServerService.Config.allowed-origins = Allowed origins
com.top_logic.ai.mcp.server.MCPServerService.Config.allowed-origins.tooltip = The origins a browser may call this endpoint from, for example https://app.example.com or http://localhost:*. <p> A request that carries an Origin header not in this list is refused with 403, which is what stops a web page from reaching the endpoint through DNS rebinding. A request without an Origin header - every command-line and desktop client - is not affected. Empty refuses every request that carries an Origin. :* matches any port. </p>
com.top_logic.ai.mcp.server.MCPServerService.Config.authentications.tooltip = How a caller of the MCP endpoint proves who it is. <p> Configure at least one, or the endpoint refuses every request: it serves nothing it cannot attribute to an account. HTTP basic authenticates against the account's own password database, an API key maps a key to a named account, and a bearer token is validated against the authorization server the deployment runs. A caller may present any one of the configured schemes. </p> <p> Prefer an API key for a service account over the password of a real person: it is revocable on its own, and it keeps a login out of a client configuration file. </p>
com.top_logic.ai.mcp.server.MCPServerService.Config.dynamic-resources = Dynamic resources
com.top_logic.ai.mcp.server.MCPServerService.Config.dynamic-resources.tooltip = List of configurable dynamic resources. <p> Each resource is configured using the polymorphic configuration pattern, allowing different implementations to provide MCP resources in different ways: </p> <ul> <li><i>configurable resource template</i> - Uses TL-Script expressions to compute content</li> <li>Future implementations can add other resource types (static, database-driven, etc.)</li> </ul>
com.top_logic.ai.mcp.server.MCPServerService.Config.exposed-tools = Exposed tools
com.top_logic.ai.mcp.server.MCPServerService.Config.exposed-tools.tooltip = The tools of the application an MCP client sees and may call. <p> Nothing is published that is not listed here, so an empty list publishes no tool. An entry names a single tool - and may give it the name, title and description an external model reads - or a whole tool group. A tool that is not listed is unknown to an MCP client. A listed tool is still authorized per call against the caller's roles and the background allowlist. </p>
com.top_logic.ai.mcp.server.MCPServerService.Config.instructions = Instructions
com.top_logic.ai.mcp.server.MCPServerService.Config.instructions.tooltip = What an MCP client is told about this server when it connects. <p> Sent in the answer to initialize; clients put it in front of their model. Say what the application is, which published tool to use for what, and how its identifiers look. Empty sends no instructions. </p>
com.top_logic.ai.mcp.server.MCPServerService.Config.keep-alive-interval = Keep alive interval
com.top_logic.ai.mcp.server.MCPServerService.Config.keep-alive-interval.tooltip = Keep-alive interval in seconds for SSE connections. <p>Default: 30 seconds</p>
com.top_logic.ai.mcp.server.MCPServerService.Config.secrets = Secrets
com.top_logic.ai.mcp.server.MCPServerService.Config.secrets.tooltip = The secrets the configured authentications check a caller against. <p> Each secret names the domain of the authentication it belongs to. A secret must name the account the request then acts as: this endpoint never processes a request in system context, so a secret without an account is refused at request time. </p>
com.top_logic.ai.mcp.server.MCPServerService.Config.server-name = Server name
com.top_logic.ai.mcp.server.MCPServerService.Config.server-name.tooltip = The name of the MCP server.
com.top_logic.ai.mcp.server.MCPServerService.Config.server-version = Server version
com.top_logic.ai.mcp.server.MCPServerService.Config.server-version.tooltip = The version of the MCP server.
com.top_logic.ai.mcp.server.MCPServerService.tooltip = TopLogic service that provides an MCP (Model Context Protocol) server for exposing application-specific APIs to AI models via HTTP transport. <p> This service initializes an MCP server during application startup using the MCP protocol over HTTP and ensures proper cleanup during shutdown. The server can be configured through the TopLogic application configuration. </p> <p> The service exposes HTTP endpoints (registered in web-fragment.xml under /mcp/*) that implement the MCP protocol for bidirectional communication between AI clients and the TopLogic application. MCP authentication filter guards that path: it authenticates every request and opens the TLContext of the account it resolved, which the protocol handlers then run in. </p> <p> <b>This service is switched off in the configuration this module ships</b>, and an application that switches it on has to say who may reach it: /mcp/* serves no request it cannot attribute to an account, and it accepts only the authentications the application configures. Configure none and every request is refused. See doc/security/mcp-endpoint.md and issue #261. While the service is off, MCPTransportServlet answers the whole /mcp/* path with 503. </p> <p> The service uses <i>servlet context</i> to obtain the application's context path at startup, ensuring that endpoint URLs sent to clients include the correct context path regardless of the deployment configuration. </p>
com.top_logic.ai.mcp.server.dynamic.ConfigurableResourceTemplate = Configurable resource template
com.top_logic.ai.mcp.server.dynamic.ConfigurableResourceTemplate.tooltip = Implementation of <i>dynamic resource</i> that uses TL-Script expressions to dynamically generate resource content. <p> This class bridges the configuration-based resource template definition (<i>resource template configuration</i>) with the MCP server's resource handling mechanism. It extracts parameters from the URI, passes them to the TL-Script expression, and returns the computed content as an MCP resource. </p>
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.content = Content
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.content.tooltip = TL-Script expression to compute the resource content. <p> The expression has access to parameters extracted from the URI template as implicit variables. The expression is automatically wrapped in a function that declares parameters matching the URI template parameter names, making them available within the expression. </p> <p> For example, if the URI template is "myapp://item/{itemId}/version/{version}" and a request comes for "myapp://item/12345/version/v2", the expression is executed as if wrapped in: itemId -> version -> yourExpression, where $itemId has value "12345" and $version has value "v2". </p> <p> The expression can return different types, which are handled as follows: </p> <ul> <li><i>collection</i> - Each element is converted to a separate <i>resource contents</i> item in the result list, allowing a single resource template to return multiple resource contents</li> <li><i>binary data</i> - Content type is checked: text-based types (e.g., text/*, application/json, application/xml) are served as text, while binary types (e.g., application/pdf, image/*) are base64-encoded and served as blob</li> <li><i>map</i> - Serialized as JSON with application/json content type</li> <li><i>HTML fragment</i> - Rendered to HTML string with text/html content type</li> <li>Any other value - Converted to string using toString() with text/plain content type</li> </ul> <p> If a MIME type is explicitly configured via <i>MIME type</i>, it overrides the default content type for the return type. </p> <p> Example for single parameter (URI template: "myapp://item/{itemId}"): </p> <pre> $myService.getItem($itemId).toJson() </pre> <p> Example for multiple parameters (URI template: "myapp://item/{itemId}/version/{version}"): </p> <pre> $myService.getItem($itemId, $version).toJson() </pre> <p> Example returning a Map (will be serialized as JSON): </p> <pre> map("id" -> $itemId, "data" -> $myService.getItem($itemId)) </pre>
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.description = Description
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.description.tooltip = Description of what this resource provides. <p> Should explain what data the resource returns and what parameters it expects. </p>
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.mime-type = MIME type
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.mime-type.tooltip = MIME type of the resource content. <p> Common values: </p> <ul> <li>"application/json" - JSON data</li> <li>"text/plain" - Plain text</li> <li>"text/html" - HTML content</li> <li>"text/markdown" - Markdown content</li> </ul>
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.name = Name
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.name.tooltip = Resource name template. <p> Can include parameter placeholders like "item-data-{itemId}" which will be replaced with actual values from the URI. </p>
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.title = Title
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.title.tooltip = Human-readable title for the resource. <p> This is displayed to users/agents browsing available resources. </p>
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.uri-template = URI template
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.uri-template.tooltip = URI template with parameter placeholders. <p> The template uses the format scheme://path/{param1}/{param2} where parameters are enclosed in curly braces. These parameters will be extracted from the URI and passed to the TL-Script expression. </p> <p> Example: "myapp://data/{itemId}" </p>
com.top_logic.ai.mcp.server.tools.ExposedTool = Exposed tool
com.top_logic.ai.mcp.server.tools.ExposedTool.description = Description
com.top_logic.ai.mcp.server.tools.ExposedTool.description.tooltip = What the tool does, written for an external model. <p> Empty means the tool's own description, which is written for the application's own agents and may refer to things an external model does not have, such as the conversation's selection or other tools by their internal names. </p>
com.top_logic.ai.mcp.server.tools.ExposedTool.group = Group
com.top_logic.ai.mcp.server.tools.ExposedTool.group.tooltip = The tool group whose tools to publish, all of them under their default name, title and description. <p> A tool belongs to the group the agent tool access policy assigns it to, or else to the group it declares itself - the same group a role is granted. Leave this empty if the entry names a single tool instead. </p>
com.top_logic.ai.mcp.server.tools.ExposedTool.name = Name
com.top_logic.ai.mcp.server.tools.ExposedTool.name.tooltip = The name an MCP client calls the tool by. <p> At most 64 characters out of letters, digits, _ and -. Empty means the tool's registry name, factory__tool. Prefer a short, verb-first name that is unique within the application, for example search_projects: an MCP client puts its own server prefix in front of it. </p>
com.top_logic.ai.mcp.server.tools.ExposedTool.title = Title
com.top_logic.ai.mcp.server.tools.ExposedTool.title.tooltip = The name of the tool a person reads in the MCP client. <p> Empty means a title derived from the tool's own name (listModules becomes "List modules"). </p>
com.top_logic.ai.mcp.server.tools.ExposedTool.tool = Tool
com.top_logic.ai.mcp.server.tools.ExposedTool.tool.tooltip = The tool to publish, by its qualified name (factory.tool). <p> Leave this empty if the entry names a tool group instead. </p>
com.top_logic.ai.mcp.server.tools.ExposedTool.tooltip = One entry of the tools the MCP server publishes: a single tool, or every tool of a tool group. <p> An entry names either a tool or a group, never both. Only a tool entry may say how the tool is published - its name, title and description - because these describe one tool and a group has many. A tool that is named by its own entry and is also a member of a listed group is published once, as its own entry says. </p>
