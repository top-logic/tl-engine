com.top_logic.ai.service.tools.model.ModelBrowserTool.tooltip = Werkzeug zum Durchsuchen der TopLogic-Modellstruktur (Module, Typen, Teile). <p> Dieses Werkzeug bietet drei Methoden, die die nat�rliche Hierarchie f�r die Modelluntersuchung bilden: <ul> <li><code>#listModules()</code> - Auflistung aller Module in der Anwendung</li> <li><code>#listTypes(String)</code> - Auflistung der Typen innerhalb eines bestimmten Moduls</li> <li><code>#listTypeParts(String, String, Boolean)</code> - Auflistung der Eigenschaften/Referenzen eines Typs</li> </ul> </p> <p> Alle Methoden geben JSON-formatierte Zeichenketten zur�ck, die von KI-Agenten verwendet werden k�nnen. </p>
