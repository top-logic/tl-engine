com.top_logic.factory.agent.WorkspaceAgentService.Config.harness.tooltip = The coding agent that runs in the workspaces.
com.top_logic.factory.agent.WorkspaceAgentService.Config.idle-timeout = Idle timeout
com.top_logic.factory.agent.WorkspaceAgentService.Config.idle-timeout.tooltip = How long the process of a conversation is kept after its last answer, e.g. 15min; the next message starts a new process continuing the conversation.
com.top_logic.factory.agent.WorkspaceAgentService.Config.interrupt-timeout = Interrupt timeout
com.top_logic.factory.agent.WorkspaceAgentService.Config.interrupt-timeout.tooltip = How long a run waits for the agent to stop after the user stopped it, before its process is terminated.
com.top_logic.factory.agent.WorkspaceAgentService.Config.stop-timeout = Stop timeout
com.top_logic.factory.agent.WorkspaceAgentService.Config.stop-timeout.tooltip = How long a process that is no longer needed has to end after its input was closed, before it is terminated.
com.top_logic.factory.agent.WorkspaceAgentService.Config.token-lifetime = Token lifetime
com.top_logic.factory.agent.WorkspaceAgentService.Config.token-lifetime.tooltip = The lifetime of the token of an agent process for the LLM proxy, e.g. 4h; at most the longest lifetime of the proxy. <p> A process whose token has less than half of its lifetime left is replaced by a new one before its next run, so that a run has at least that half. </p>
com.top_logic.factory.agent.WorkspaceAgentService.tooltip = Service holding the <i>workspace agents</i> of the <code>"AgentConversation"</code>s: the coding agent that works in a workspace, one process per conversation. <p> <i>Agent conversation resolver</i> lets the agents answer the chats whose subject is a conversation. Cleaning up a workspace stops its agents; a shutdown stops all of them. </p>
com.top_logic.factory.agent.claude.ClaudeCodeHarness = Claude code harness
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.command = Command
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.command.tooltip = The program of Claude Code in the workspace image.
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.extra-args = Extra arguments
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.extra-args.tooltip = Further arguments appended to the command line, e.g. --max-turns,50.
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.model = Model
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.model.tooltip = The model Claude Code works with, e.g. claude-sonnet-4-6 or an alias such as sonnet; empty for the default of Claude Code.
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.thinking-display = Thinking display
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.thinking-display.tooltip = How the thinking of the model appears in the output of Claude Code: <code>"summarized"</code> for a summary of it, which the chat shows; omitted for no text; empty for the default of Claude Code, which omits it in print mode.
com.top_logic.factory.agent.claude.ClaudeCodeHarness.tooltip = <i>Agent harness</i> running Claude Code in print mode with stream-json input and output. <p> The process is started as </p> <pre> claude -p --input-format stream-json --output-format stream-json --verbose --include-partial-messages --permission-mode bypassPermissions [--thinking-display &lt;display&gt;] [--model &lt;model&gt;] [--resume &lt;session ID&gt;] [&lt;extra args&gt;] </pre> <p> as the workspace user - Claude Code refuses to bypass its permission prompts as root - with the token of the process in <code>"ANTHROPIC_AUTH_TOKEN"</code>. The container has the URL of the LLM proxy in <code>"ANTHROPIC_BASE_URL"</code>. The output is translated by <i>claude code protocol</i>. </p>
com.top_logic.factory.llm.LLMProxyService = LLM proxy service
com.top_logic.factory.llm.LLMProxyService.Config.allowed-sources = Allowed sources
com.top_logic.factory.llm.LLMProxyService.Config.allowed-sources.tooltip = The client addresses requests are accepted from: ranges in CIDR notation (IPv4 or IPv6), single addresses, or <code>"workspace-network"</code> for the network of the workspace containers. <p> Empty accepts every address. The address is the one of the connection, never a header of the request: behind a reverse proxy or a gateway it is the address of that proxy. </p>
com.top_logic.factory.llm.LLMProxyService.Config.max-token-lifetime = Maximum token lifetime
com.top_logic.factory.llm.LLMProxyService.Config.max-token-lifetime.tooltip = The longest lifetime of a token in milliseconds, e.g. 4h; a longer one asked for is cut to it.
com.top_logic.factory.llm.LLMProxyService.Config.provider = Provider
com.top_logic.factory.llm.LLMProxyService.Config.provider.tooltip = The name of the Anthropic provider of the <i>LLM providers</i> whose API key, base URL, version and timeouts the proxy uses.
com.top_logic.factory.llm.LLMProxyService.Config.proxy-url = Proxy URL
com.top_logic.factory.llm.LLMProxyService.Config.proxy-url.tooltip = The URL of the <i>LLM proxy servlet</i> as the workspace containers reach it, e.g. http://host.docker.internal:8080/tl-factory-app/llm-proxy. <p> It is passed to the workspace containers in <code>"ANTHROPIC_BASE_URL"</code>. Empty switches the proxy off. </p>
com.top_logic.factory.llm.LLMProxyService.tooltip = Access of the workspaces to the Anthropic Messages API without an API key in the workspace. <p> A workspace container gets no API key and no token in its environment, only the URL of the <i>LLM proxy servlet</i> of the control application in <code>"ANTHROPIC_BASE_URL"</code>. A process that may use the API - an agent run - gets a token of its own, issued for its workspace and passed only to that process in <code>"ANTHROPIC_AUTH_TOKEN"</code>; Claude Code sends it as bearer token. The proxy accepts a request from an accepted address whose token is valid, adds the API key of the configured provider of the <i>LLM providers</i> and forwards the request. </p> <p> A token is <code>"tlwst_"</code> followed by a random secret of about 256 bits (see <i>secret tokens</i>). It is valid until it is revoked - when its run ends -, until its lifetime ends (at most <i>Maximum token lifetime</i>), or until its workspace is removed. Tokens are kept in memory only, as their hashes; a restart of the control application invalidates all of them, together with the runs it started. </p> <p> The proxy is switched on by its URL: without one, workspaces get no URL, no token is issued, and the servlet answers every request with 404. </p>
