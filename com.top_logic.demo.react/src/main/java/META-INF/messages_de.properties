com.top_logic.demo.react.view.DemoEditorConfig$Address.tooltip = Eine Postanschrift.
com.top_logic.demo.react.view.DemoEditorConfig$Item = Artikel
com.top_logic.demo.react.view.DemoEditorConfig$Item.tooltip = Ein benannter Artikel mit einer Stückzahl.
com.top_logic.demo.react.view.DemoEditorConfig$Priority = Priorität
com.top_logic.demo.react.view.DemoEditorConfig$Priority.tooltip = Prioritätsklassifikator für <i>„Priority“</i> (<i>Konfiguration des Demo-Editors</i>).
com.top_logic.demo.react.view.DemoEditorConfig.Address.city = Stadt
com.top_logic.demo.react.view.DemoEditorConfig.Address.city.tooltip = Die Stadt.
com.top_logic.demo.react.view.DemoEditorConfig.Address.street = Straße
com.top_logic.demo.react.view.DemoEditorConfig.Address.street.tooltip = Die Straße einschließlich der Hausnummer.
com.top_logic.demo.react.view.DemoEditorConfig.Item.name = Name
com.top_logic.demo.react.view.DemoEditorConfig.Item.name.tooltip = Der Name des Artikels.
com.top_logic.demo.react.view.DemoEditorConfig.Item.quantity = Anzahl
com.top_logic.demo.react.view.DemoEditorConfig.Item.quantity.tooltip = Die Stückzahl.
com.top_logic.demo.react.view.DemoEditorConfig.Priority.HIGH = Hoch
com.top_logic.demo.react.view.DemoEditorConfig.Priority.HIGH.tooltip = Höchste Priorität.
com.top_logic.demo.react.view.DemoEditorConfig.Priority.LOW = Niedrig
com.top_logic.demo.react.view.DemoEditorConfig.Priority.LOW.tooltip = Niedrigste Priorität.
com.top_logic.demo.react.view.DemoEditorConfig.Priority.MEDIUM = Mittel
com.top_logic.demo.react.view.DemoEditorConfig.Priority.MEDIUM.tooltip = Standardpriorität.
com.top_logic.demo.react.view.DemoEditorConfig.address = Adresse
com.top_logic.demo.react.view.DemoEditorConfig.address.tooltip = Eine verschachtelte Adresse, die inline als monomorphes Element dargestellt wird.
com.top_logic.demo.react.view.DemoEditorConfig.catalog = Katalog
com.top_logic.demo.react.view.DemoEditorConfig.catalog.tooltip = Die angebotenen Artikel, indiziert nach Namen, eine <i>Map</i> statt der <i>Liste</i> von <i>Artikel</i>.
com.top_logic.demo.react.view.DemoEditorConfig.count = Anzahl
com.top_logic.demo.react.view.DemoEditorConfig.count.tooltip = Eine begrenzte Anzahl von Elementen. <p> Eine Anzahl von null oder weniger wird beanstandet, aber nicht abgelehnt: Die Einschränkung <i>positive</i> ist als Warnung deklariert, sodass die Demo neben der Verletzung von <i>Verantwortlich</i> auch eine Warnung zu zeigen hat. </p>
com.top_logic.demo.react.view.DemoEditorConfig.description = Beschreibung
com.top_logic.demo.react.view.DemoEditorConfig.description.tooltip = Eine längere Freitextbeschreibung über mehrere Zeilen. <p> Der Control-Provider <i>mehrzeiliger Text</i> macht die Eigenschaft zu einem Textbereich statt zur einzeiligen Eingabe von <i>Titel</i>. </p>
com.top_logic.demo.react.view.DemoEditorConfig.dueDate = Fälligkeitsdatum
com.top_logic.demo.react.view.DemoEditorConfig.dueDate.tooltip = Der Zeitpunkt, bis zu dem die Konfiguration wirksam sein muss, ein Datum zusammen mit seiner Uhrzeit.
com.top_logic.demo.react.view.DemoEditorConfig.enabled = Aktiviert
com.top_logic.demo.react.view.DemoEditorConfig.enabled.tooltip = Ob die Konfiguration aktiv ist.
com.top_logic.demo.react.view.DemoEditorConfig.icon = Symbol
com.top_logic.demo.react.view.DemoEditorConfig.icon.tooltip = Das Symbol, das für diese Konfiguration steht - aus den Symbolen des Themes ausgewählt, so wie bei einem Modellattribut vom Typ Symbol, statt in seiner kodierten Form eingetippt.
com.top_logic.demo.react.view.DemoEditorConfig.items = Artikel
com.top_logic.demo.react.view.DemoEditorConfig.items.tooltip = Eine Liste mit bezeichneter Artikel und Mengenangaben.
com.top_logic.demo.react.view.DemoEditorConfig.owner = Verantwortlich
com.top_logic.demo.react.view.DemoEditorConfig.owner.tooltip = Wer verantwortlich ist - ein Pflichtfeld, damit eine leere Eingabe beim Anwenden abgelehnt wird und die Demo eine Verletzung vorzuweisen hat.
com.top_logic.demo.react.view.DemoEditorConfig.priority = Priorität
com.top_logic.demo.react.view.DemoEditorConfig.priority.tooltip = Die ausgewählte Priorität.
com.top_logic.demo.react.view.DemoEditorConfig.shippingAddresses = Lieferadressen
com.top_logic.demo.react.view.DemoEditorConfig.shippingAddresses.tooltip = Die Lieferadressen, ein Array von <i>Adresse</i> statt einer <i>Liste</i>.
com.top_logic.demo.react.view.DemoEditorConfig.summary = Zusammenfassung
com.top_logic.demo.react.view.DemoEditorConfig.summary.tooltip = Eine lokalisierte einzeilige Zusammenfassung, bearbeitet als Text über das Format des <i>Ressourcenschlüssels</i>.
com.top_logic.demo.react.view.DemoEditorConfig.tags = Schlagworte
com.top_logic.demo.react.view.DemoEditorConfig.tags.tooltip = Schlagworte, die diese Konfiguration beschreiben, als ein einziger kommaseparierter Text. <p> Eine <i>Liste</i> einfacher Werte mit einem eigenen <i>Format</i> ist keine Sammlung einzeln zu bearbeitender Einträge - das Format macht aus der ganzen Liste einen Text und wieder zurück, also ein einzelnes Eingabefeld statt des Sammlungseditors, den <i>Artikel</i> bekommt. Genau das leistet hier <i>Kommaseparierte Zeichenketten</i>: Die Eigenschaft wird als "rot, grün, blau" bearbeitet. </p>
com.top_logic.demo.react.view.DemoEditorConfig.timeout = Zeitlimit
com.top_logic.demo.react.view.DemoEditorConfig.timeout.tooltip = Wie lange gewartet wird, bevor aufgegeben wird, als Dauer geschrieben, etwa "5h 10min" oder "22ms". <p> Der Wert ist eine schlichte Millisekundenzahl; <i>Millisekundenformat</i> macht daraus etwas Lesbares und wieder zurück. Anders als jedes andere Format in dieser Konfiguration kann dieses die Eingabe <em>zurückweisen</em> - eine unbekannte Einheit oder ein Text, der gar keine Dauer ist -, und genau das macht es zum Beispiel des Demos für einen am Feld gemeldeten Formatfehler. </p>
com.top_logic.demo.react.view.DemoEditorConfig.title = Titel
com.top_logic.demo.react.view.DemoEditorConfig.title.tooltip = Ein frei wählbarer Titel.
com.top_logic.demo.react.view.DemoEditorConfig.tooltip = In sich geschlossene Beispielkonfiguration, bearbeitet mit der Demo des Konfigurationseditors. <p> Verwendet eine Reihe von Eigenschaftstypen (Text, mehrzeiliger Text, Zahl, Boolescher Wert, Aufzählung, ein Datum mit Uhrzeit, ein verschachteltes Element, eine Liste von Elementen, ein Array von Elementen, eine Map von Elementen, eine Liste einfacher Zeichenketten, geschrieben als ein kommagetrennter Text, eine Dauer und ein <i>Ressourcenschlüssel</i>), sodass der React-Konfigurationseditor jede Editorvariante rendert. </p>
