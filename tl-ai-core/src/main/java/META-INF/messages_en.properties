com.top_logic.tl.ai.core.session.Part.TransactionType.COMMITTED = Committed
com.top_logic.tl.ai.core.session.Part.TransactionType.ROLLED_BACK = Rolled back
com.top_logic.tl.ai.core.tools.P = P
com.top_logic.tl.ai.core.tools.P.required = Required
com.top_logic.tl.ai.core.tools.P.required.tooltip = Whether this parameter is required. Defaults to true.
com.top_logic.tl.ai.core.tools.P.tooltip = Describes a parameter of a <i>tool method</i>-annotated method.
com.top_logic.tl.ai.core.tools.P.value = Value
com.top_logic.tl.ai.core.tools.P.value.tooltip = Description of the parameter. Sent to the LLM.
com.top_logic.tl.ai.core.tools.ToolMethod = Tool method
com.top_logic.tl.ai.core.tools.ToolMethod.concurrencySafe = Concurrency safe
com.top_logic.tl.ai.core.tools.ToolMethod.concurrencySafe.tooltip = Whether this tool can safely run in parallel with other concurrency-safe tools. Defaults to false (fail-closed).
com.top_logic.tl.ai.core.tools.ToolMethod.description = Description
com.top_logic.tl.ai.core.tools.ToolMethod.description.tooltip = Description of what this tool does. Sent to the LLM. Multiple values are joined with newline.
com.top_logic.tl.ai.core.tools.ToolMethod.mode = Mode
com.top_logic.tl.ai.core.tools.ToolMethod.mode.tooltip = What kind of state change this tool makes. Defaults to <i>global</i> (fail-closed).
com.top_logic.tl.ai.core.tools.ToolMethod.name = Name
com.top_logic.tl.ai.core.tools.ToolMethod.name.tooltip = Tool name. Defaults to the Java method name if empty.
com.top_logic.tl.ai.core.tools.ToolMethod.tooltip = Marks a method as a tool that the agent can invoke. <p>The annotated method is discovered by <code>AnnotatedTools#from(Object)</code> and wrapped as a <i>tool</i> instance. The method's parameters must be annotated with <i>p</i> to provide descriptions for the LLM.</p> <p><b>Thread safety:</b> The provider object (the instance passed to <code>AnnotatedTools#from(Object)</code>) is shared across all users when the <i>tool dispatcher</i> is shared. Annotated methods <em>must not</em> rely on mutable instance fields. Per-user state should be received via a <i>tool context</i> parameter, not stored on the provider object.</p>
com.top_logic.tl.ai.core.tools.ToolMode = Tool mode
com.top_logic.tl.ai.core.tools.ToolMode.GLOBAL = Global
com.top_logic.tl.ai.core.tools.ToolMode.GLOBAL.tooltip = Tool makes changes to shared application state (model, layouts, workflows).
com.top_logic.tl.ai.core.tools.ToolMode.READ = Read
com.top_logic.tl.ai.core.tools.ToolMode.READ.tooltip = Tool only reads data. No changes, no approval needed.
com.top_logic.tl.ai.core.tools.ToolMode.USER_SCOPED = User scoped
com.top_logic.tl.ai.core.tools.ToolMode.USER_SCOPED.tooltip = Tool makes changes scoped to the current user only (temp views, personal dashboards).
com.top_logic.tl.ai.core.tools.ToolMode.tooltip = Categorizes what kind of state change a tool makes. <p>Used by the framework for spec filtering (hiding GLOBAL tools from non-privileged users), approval gating, and concurrency decisions.</p>
com.top_logic.tl.ai.core.tools.interaction.TaskTool = Task tool
com.top_logic.tl.ai.core.tools.interaction.TaskTool.tooltip = Tool for managing agent tasks within a processing session. <p> Provides CRUD operations on an in-memory <i>task store</i> that is bound to the current thread via <i>task store binding</i>. Tasks are used to track progress and organize multi-step agent work. </p>
com.top_logic.tl.ai.core.tools.model.AnnotationDefinitionExplorerTool = Annotation definition explorer tool
com.top_logic.tl.ai.core.tools.model.AnnotationDefinitionExplorerTool.tooltip = Tool for exploring annotation definition schemas. <p> This tool allows AI agents to understand annotation DEFINITIONS (what CAN be configured), not annotation INSTANCES (what IS configured). It provides schema information including property metadata, types, constraints, and defaults. </p> <h3>Example Usage:</h3> <pre> // Explore a specific annotation definition describeAnnotation("com.top_logic.model.annotate.Visibility") // Explore form-definition annotation describeAnnotation("com.top_logic.model.form.definition.FormDefinition") </pre> <h3>Integration:</h3> <p> Register this tool via <i>annotated tools</i> and assign it to an agent through the <i>LLM provider registry</i> configuration. </p>
com.top_logic.tl.ai.core.tools.model.InstanceBrowserTool = Instance browser tool
com.top_logic.tl.ai.core.tools.model.InstanceBrowserTool.tooltip = Tool for accessing TopLogic instance data from the knowledge base. <p> This tool provides methods for listing instances of a type with pagination and retrieving detailed information about individual instances. All methods return JSON-formatted strings for consumption by AI agents. </p>
com.top_logic.tl.ai.core.tools.model.ModelAnnotationBrowserTool = Model annotation browser tool
com.top_logic.tl.ai.core.tools.model.ModelAnnotationBrowserTool.tooltip = Tool for browsing annotations on TopLogic model elements (modules, types, parts, enumerations, classifiers). <p> This tool allows AI agents to inspect annotation metadata on model elements with optional inheritance support. It provides detailed information about each annotation including its tag name, configuration interface, and property values. </p> <h3>Example Usage:</h3> <pre> // List local annotations on a module getCurrentAnnotations("tl.core", false) // List local annotations on a type getCurrentAnnotations("tl.core:TLObject", false) // List all annotations including inherited getCurrentAnnotations("tl.core:TLObject", true) // List annotations on an enumeration getCurrentAnnotations("tl.core:TLScope", false) // List annotations on a type part getCurrentAnnotations("tl.core:TLObject#name", false) // List annotations on a classifier (enum literal) getCurrentAnnotations("tl.core:TLScope#global", false) </pre> <h3>Integration:</h3> <p> Register this tool via <i>annotated tools</i> and assign it to an agent through the <i>LLM provider registry</i> configuration. </p>
com.top_logic.tl.ai.core.tools.model.ModelAnnotationEditorTool = Model annotation editor tool
com.top_logic.tl.ai.core.tools.model.ModelAnnotationEditorTool.tooltip = Tool for setting and removing annotations on TopLogic model elements. <p> This tool allows AI agents to modify annotation metadata on model elements (modules, types, parts, classifiers). Annotation configurations are accepted as JSON matching the schema from <i>configuration schema tool</i>. </p>
com.top_logic.tl.ai.core.tools.model.ModelBrowserTool = Model browser tool
com.top_logic.tl.ai.core.tools.model.ModelBrowserTool.tooltip = Tool for browsing TopLogic model structure (modules, types, parts). <p> This tool provides three methods that form the natural hierarchy for model exploration: listing all modules, listing types within a module, and listing properties/references of a type. All methods return JSON-formatted strings for consumption by AI agents. </p>
com.top_logic.tl.ai.core.tools.model.ModelEditorTool = Model editor tool
com.top_logic.tl.ai.core.tools.model.ModelEditorTool.tooltip = Tool for creating and updating TopLogic model elements. <p> This tool provides methods for creating and updating modules, classes, properties, references, backward references, and enumerations in the TopLogic application model. </p> <p> All methods return JSON-formatted strings for consumption by AI agents. </p>
com.top_logic.tl.ai.core.tools.model.ModelSearchTool = Model search tool
com.top_logic.tl.ai.core.tools.model.ModelSearchTool.tooltip = Tool for searching across the TopLogic application model. <p> This tool provides intelligent text search across modules, types (classes, enumerations, datatypes), and properties/references. It searches technical names, qualified names, labels, and descriptions, returning the top 10 most relevant matches with contextual information. </p>
com.top_logic.tl.ai.core.tools.model.SearchAnnotationTool = Search annotation tool
com.top_logic.tl.ai.core.tools.model.SearchAnnotationTool.tooltip = Tool for listing available annotation types for TopLogic model elements. <p> This tool allows AI agents to discover which annotation types can be applied to a given model element. It enumerates all @InApp annotation types filtered by the target element's kind and type. </p>
com.top_logic.tl.ai.core.tools.model.TypeAnalysisTool = Type analysis tool
com.top_logic.tl.ai.core.tools.model.TypeAnalysisTool.tooltip = Tool for analyzing TopLogic type dependencies and relationships. <p> This tool provides methods for understanding how types are used throughout the model: finding all usages of a type and finding where a part is defined and inherited. All methods return JSON-formatted strings for consumption by AI agents. </p>
com.top_logic.tl.ai.core.tools.registry.ReflectiveToolFactory = Reflective tool factory
com.top_logic.tl.ai.core.tools.registry.ReflectiveToolFactory.Config.tool-class = Tool class
com.top_logic.tl.ai.core.tools.registry.ReflectiveToolFactory.Config.tool-class.tooltip = The Java class containing @ToolMethod annotated methods. <p> This class will be scanned for tool definitions. All methods annotated with @ToolMethod will be exposed as AI tools. </p>
com.top_logic.tl.ai.core.tools.registry.ReflectiveToolFactory.tooltip = A <i>tool factory</i> that reflectively discovers tools from a Java class with @ToolMethod annotated methods. <p> This factory extracts tool specifications from the configured class and creates corresponding <i>tool</i> instances for each annotated method. </p>
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory = Script tool factory
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.Config.tools = Tools
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.Config.tools.tooltip = The tools to create. <p> Each tool is defined by its specification (name, description, parameters) and a TL-Script implementation. </p>
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.concurrency-safe = Concurrency safe
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.concurrency-safe.tooltip = Whether this tool can safely run in parallel with other concurrency-safe tools. <p> When null (the default), the value is derived from <i>Mode</i>: true for <i>read</i> and <i>user scoped</i>, false for <i>global</i>. </p>
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.description = Description
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.description.tooltip = The description of what the tool does.
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.implementation = Implementation
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.implementation.tooltip = The TL-Script implementation of the tool. <p> The script receives the tool parameters as variables and should return the tool's result as a string. </p>
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.mode = Mode
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.mode.tooltip = What kind of state change this tool makes. <p> Defaults to <i>global</i>. Set to <i>read</i> for tools that only read data, or <i>user scoped</i> for tools that only affect the current user. </p>
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.name = Name
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.name.tooltip = The name of the tool.
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.parameters = Parameters
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.parameters.tooltip = The parameters this tool accepts. <p> Each parameter is defined by its name and configuration (type, description, etc.). </p>
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ToolParameterConfig.description = Description
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ToolParameterConfig.description.tooltip = The description of the parameter.
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ToolParameterConfig.name = Name
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ToolParameterConfig.name.tooltip = The name of the parameter.
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ToolParameterConfig.type = Type
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ToolParameterConfig.type.tooltip = The JSON schema type of the parameter (e.g., "string", "number", "boolean", "object", "array").
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.tooltip = A <i>tool factory</i> that creates tools from TL-Script implementations. <p> This factory allows defining tools directly in configuration using TL-Script code. Each tool consists of a specification (name, description, parameters) and a TL-Script expression that implements the tool's logic. </p>
com.top_logic.tl.ai.core.tools.registry.ToolRegistryService = Tool registry service
com.top_logic.tl.ai.core.tools.registry.ToolRegistryService$ToolFactoryConfig = Tool factory configuration
com.top_logic.tl.ai.core.tools.registry.ToolRegistryService$ToolFactoryConfig.tooltip = Configuration for a named tool factory.
com.top_logic.tl.ai.core.tools.registry.ToolRegistryService.Config.tool-factories = Tool factories
com.top_logic.tl.ai.core.tools.registry.ToolRegistryService.Config.tool-factories.tooltip = Map of named tool factories available in the application. <p> Each tool factory is identified by a unique name. The factory name becomes part of the qualified tool name (factory-name.tool-name) used to reference tools in TL-Script functions. </p>
com.top_logic.tl.ai.core.tools.registry.ToolRegistryService.ToolFactoryConfig.implementation = Implementation
com.top_logic.tl.ai.core.tools.registry.ToolRegistryService.ToolFactoryConfig.implementation.tooltip = The tool factory implementation.
com.top_logic.tl.ai.core.tools.registry.ToolRegistryService.tooltip = Registry service for managing tools available in the application. <p> Tools are organized by factory. Each factory produces a set of tools, and each tool is identified by a qualified name in the format {factory-name}.{tool-name}. This allows tools from different factories to have the same simple name without conflicts. </p>
com.top_logic.tl.ai.core.tools.script.TLScriptReferenceTool = Script reference tool
com.top_logic.tl.ai.core.tools.script.TLScriptReferenceTool.tooltip = Tool for listing TLScript functions and retrieving documentation. <p> This tool provides access to the TLScript function registry, allowing AI agents to discover available functions and retrieve detailed documentation for them. It uses <i>search builder</i> to access the function metadata. </p>
com.top_logic.tl.ai.core.tools.script.TLScriptTool = Script tool
com.top_logic.tl.ai.core.tools.script.TLScriptTool.tooltip = Tool for validating and executing TLScript code. <p> This tool provides validation and execution of TLScript. Both methods use the shared <i>script executor</i> for core validation and execution logic. </p>
com.top_logic.tl.ai.core.tools.script.messages.ErrorType = Error type
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.LEXICAL_ERROR = Lexical error
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.LEXICAL_ERROR.tooltip = Lexical error (invalid characters).
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.SYNTAX_ERROR = Syntax error
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.SYNTAX_ERROR.tooltip = Syntax error (parser error).
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.VALIDATION_ERROR = Validation error
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.VALIDATION_ERROR.tooltip = Validation error (model references, type checking).
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.tooltip = Type of validation error.
