com.top_logic.factory.agent.AgentHarness.command.param.launch.tooltip = Wo der Prozess läuft, wird die Konversation fortgesetzt, und sein Token für den LLM-Proxy wird ausschließlich vom Befehl an den Prozess übergeben.
