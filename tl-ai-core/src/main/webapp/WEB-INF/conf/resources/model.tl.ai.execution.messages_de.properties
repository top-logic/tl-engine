model.tl.ai.execution.AgentExecution.displayCost = Kosten
model.tl.ai.execution.AgentExecution.displayCost.tooltip = Was der Lauf gekostet hat, umgerechnet in die Systemwährung zum Wechselkurs von USD, der am Tag des Laufs galt. In US-Dollar, solange es keinen solchen Kurs gibt.
