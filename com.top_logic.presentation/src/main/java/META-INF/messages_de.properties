com.top_logic.presentation.script.PptDescriptionFunctions.color.param.color.tooltip = Die Grundfarbe: der Name einer Theme-Farbe, eine hexadezimale Farbe, der Name einer Farbrolle oder ein Farb-Wörterbuch, dessen Veränderungen erhalten bleiben, sofern sie hier nicht angegeben werden.
com.top_logic.presentation.script.PptDescriptionFunctions.color.param.lumMod.tooltip = Faktor für die Helligkeit, z. B. 0,75 zum Abdunkeln.
com.top_logic.presentation.script.PptDescriptionFunctions.color.param.lumOff.tooltip = Verschiebung der Helligkeit zwischen -1 und 1, z. B. 0,4 zusammen mit einem <code>lumMod</code> von 0,6 zum Aufhellen.
com.top_logic.presentation.script.PptDescriptionFunctions.color.param.satMod.tooltip = Sättigungsfaktor.
com.top_logic.presentation.script.PptDescriptionFunctions.color.param.satOff.tooltip = Versatz für die Sättigung zwischen -1 und 1.
com.top_logic.presentation.script.PptDescriptionFunctions.color.param.shade.tooltip = Mischt die Farbe mit Schwarz: 1 behält die Farbe bei, 0 ergibt Schwarz.
com.top_logic.presentation.script.PptDescriptionFunctions.color.param.tint.tooltip = Mischt die Farbe mit Weiß: 1 behält die Farbe bei, 0 ergibt Weiß.
com.top_logic.presentation.script.PptDescriptionFunctions.color.return = Das Wörterbuch, in dem die Farbe beschrieben wird.
com.top_logic.presentation.script.PptDescriptionFunctions.color.tooltip = Beschreibt eine in Helligkeit, Sättigung oder Transparenz veränderte Farbe. <p> Beispiel: <code>pptColor("accent1", lumMod: 0.75)</code> ist die erste Akzentfarbe des Themes, abgedunkelt auf 75 % Helligkeit. Alle Veränderungen werden als Anteile angegeben, z. B. 0,75 für 75 %. </p> <p> Das Ergebnis ist ein Wörterbuch mit dem Eintrag <code>"scheme"</code> (Theme-Farbe), <code>"rgb"</code> (feste Farbe) oder <code>"role"</code> (Farbrolle) und den angegebenen Veränderungen. </p>
com.top_logic.presentation.script.PptDescriptionFunctions.column = Beschreibe eine Spalte
com.top_logic.presentation.script.PptDescriptionFunctions.column.param.align.tooltip = Die horizontale Ausrichtung der Elemente mit eigener Breite: <code>stretch</code> (Standard) und <code>start</code> richten sie links aus, <code>center</code> zentriert sie, <code>end</code> richtet sie rechts aus.
com.top_logic.presentation.script.PptDescriptionFunctions.column.param.children.tooltip = Die Elemente der Spalte: Formen, Textfelder, Tabellen, Bilder, Zeilen und Spalten.
com.top_logic.presentation.script.PptDescriptionFunctions.column.param.gap.tooltip = Der vertikale Abstand zwischen zwei Elementen. Ohne Angabe gilt der Abstand <code>gap</code> des Vorlagenprofils.
com.top_logic.presentation.script.PptDescriptionFunctions.column.param.height.tooltip = Die Höhe oder <code>auto</code> für die Höhe ihrer Elemente.
com.top_logic.presentation.script.PptDescriptionFunctions.column.param.weight.tooltip = Der Anteil am freien Platz einer umschließenden Zeile oder Spalte bzw. des Inhaltsbereichs. Der Standardwert ist 1.
com.top_logic.presentation.script.PptDescriptionFunctions.column.param.weights.tooltip = Die Anteile der Elemente an der verbleibenden Höhe, eine Zahl für jedes Element.
com.top_logic.presentation.script.PptDescriptionFunctions.column.param.width.tooltip = Die Breite.
com.top_logic.presentation.script.PptDescriptionFunctions.column.param.x.tooltip = Die horizontale Position des linken Randes. Wenn weder <code>x</code> noch <code>y</code> angegeben wird, wird die Spalte zusammen mit den übrigen Inhalten der Folie angeordnet.
com.top_logic.presentation.script.PptDescriptionFunctions.column.param.y.tooltip = Die vertikale Position des oberen Randes.
com.top_logic.presentation.script.PptDescriptionFunctions.column.return = Das Wörterbuch, das die Spalte beschreibt.
com.top_logic.presentation.script.PptDescriptionFunctions.column.tooltip = Beschreibt eine Spalte: untereinander angeordnete Elemente. <p> Beispiel: ein Text in seiner natürlichen Höhe über einer Tabelle, die den Rest einnimmt: <code>pptColumn([pptTextBox("Summary", height: "auto"), pptTable($rows, headerRows: 1)])</code> </p> <p> Ein Element mit einer Höhe (<code>height</code>) erhält diese Höhe, ein Element mit der Höhe <code>auto</code> die Höhe seines Inhalts bei der Breite der Spalte. Die übrigen Elemente teilen sich die verbleibende Höhe entsprechend ihrem Anteil <code>weight</code> (Standardwert 1) oder den Anteilen <code>weights</code> der Spalte. Horizontal nimmt ein Element ohne eigene Breite die Breite der Spalte ein. Die Elemente haben keine eigene Position. Zeilen und Spalten können beliebig verschachtelt werden. </p> <p> Mehrere Inhaltselemente einer Folie ohne Position werden wie in einer Spalte angeordnet. </p>
com.top_logic.presentation.script.PptDescriptionFunctions.gradient = Beschreibe einen Farbverlauf
com.top_logic.presentation.script.PptDescriptionFunctions.gradient.param.angle.tooltip = Die Richtung eines linearen Farbverlaufs in Grad, im Uhrzeigersinn, wobei 0 (Standard) von links nach rechts verläuft.
com.top_logic.presentation.script.PptDescriptionFunctions.gradient.param.path.tooltip = Die Form eines Farbverlaufs, der sich von der Mitte aus ausbreitet: <code>circle</code>, <code>rect</code> oder <code>shape</code>. Darf nicht zusammen mit einem Winkel angegeben werden.
com.top_logic.presentation.script.PptDescriptionFunctions.gradient.param.stops.tooltip = Die Farben entlang des Farbverlaufs, mindestens zwei. Eine Farbe wird in gleichmäßigem Abstand zu ihren Nachbarn platziert, es sei denn, es wird ein Wörterbuch mit den Einträgen <code>"position"</code> (zwischen 0 und 1) und <code>"color"</code> angegeben.
com.top_logic.presentation.script.PptDescriptionFunctions.gradient.return = Das Wörterbuch, das den Farbverlauf beschreibt.
com.top_logic.presentation.script.PptDescriptionFunctions.gradient.tooltip = Beschreibt einen Farbverlauf zum Ausfüllen einer Form. <p> Beispiel: <code>pptGradient(["accent1", "accent2"], angle: 90)</code> verläuft von der ersten Akzentfarbe oben zur zweiten unten. </p>
com.top_logic.presentation.script.PptDescriptionFunctions.image = Beschreibe ein Bild
com.top_logic.presentation.script.PptDescriptionFunctions.image.param.data.tooltip = Das Bild, z. B. eine PNG-, JPEG- oder SVG-Datei.
com.top_logic.presentation.script.PptDescriptionFunctions.image.param.fit.tooltip = Wie das Bild an den Rahmen angepasst wird: <code>contain</code> (Standard) zeigt das gesamte Bild so groß wie möglich an, <code>cover</code> füllt den Rahmen aus und schneidet den überstehenden Teil ab, <code>stretch</code> verzerrt das Bild, um es an den Rahmen anzupassen.
com.top_logic.presentation.script.PptDescriptionFunctions.image.param.height.tooltip = Die Höhe oder <code>auto</code> für die Höhe des Bildes, wobei das Seitenverhältnis entsprechend der Breite beibehalten wird.
com.top_logic.presentation.script.PptDescriptionFunctions.image.param.weight.tooltip = Der Anteil am freien Platz einer Zeile oder Spalte (<code>pptRow()</code>, <code>pptColumn()</code>) oder des Inhaltsbereichs, sofern keine eigene Größe angegeben ist. Der Standardwert ist 1.
com.top_logic.presentation.script.PptDescriptionFunctions.image.param.width.tooltip = Die Breite.
com.top_logic.presentation.script.PptDescriptionFunctions.image.param.x.tooltip = Die horizontale Position des linken Randes.
com.top_logic.presentation.script.PptDescriptionFunctions.image.param.y.tooltip = Die vertikale Position des oberen Randes.
com.top_logic.presentation.script.PptDescriptionFunctions.image.return = Das Wörterbuch, das das Bild beschreibt.
com.top_logic.presentation.script.PptDescriptionFunctions.image.tooltip = Beschreibt ein Bild.
com.top_logic.presentation.script.PptDescriptionFunctions.line = Beschreibe eine Kontur
com.top_logic.presentation.script.PptDescriptionFunctions.line.param.color.tooltip = Die Linienfarbe.
com.top_logic.presentation.script.PptDescriptionFunctions.line.param.dash.tooltip = Der Strichstil: <code>solid</code>, <code>dot</code>, <code>dash</code>, <code>lgDash</code>, <code>dashDot</code>, <code>lgDashDot</code>, <code>lgDashDotDot</code>, <code>sysDash</code>, <code>sysDot</code>, <code>sysDashDot</code> oder <code>sysDashDotDot</code>.
com.top_logic.presentation.script.PptDescriptionFunctions.line.param.width.tooltip = Die Linienbreite.
com.top_logic.presentation.script.PptDescriptionFunctions.line.return = Das Wörterbuch, das die Kontur beschreibt.
com.top_logic.presentation.script.PptDescriptionFunctions.line.tooltip = Beschreibt den Umriss einer Form.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph = Beschreibe einen Absatz
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.param.align.tooltip = Die horizontale Ausrichtung: <code>left</code>, <code>center</code>, <code>right</code> oder <code>justify</code>.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.param.bold.tooltip = Ob der Text fettformatiert ist.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.param.bullet.tooltip = Das Aufzählungszeichen: <code>true</code> oder <code>false</code>, um das Aufzählungszeichen des Platzhalters ein- oder auszuschalten; <code>none</code>, das Aufzählungszeichen selbst oder ein Wörterbuch mit den Einträgen <code>char</code> und <code>color</code>.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.param.caps.tooltip = Ob der Text in Großbuchstaben angezeigt wird.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.param.color.tooltip = Die Textfarbe.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.param.font.tooltip = Die Schriftfamilie.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.param.italic.tooltip = Ob der Text kursiv ist.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.param.level.tooltip = Die Einrückungsebene von 0 (Standard) bis 8.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.param.lineSpacing.tooltip = Der Zeilenabstand als Vielfaches der Einzelzeilenhöhe, z. B. 1,2.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.param.runs.tooltip = Der Inhalt des Absatzes: eine Zeichenkette, ein Textabschnitt (<code>pptRun()</code>) oder eine Liste davon.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.param.size.tooltip = Die Schriftgröße.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.param.spaceAfter.tooltip = Der Abstand nach dem Absatz.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.param.spaceBefore.tooltip = Der Abstand vor dem Absatz.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.param.spacing.tooltip = Zusätzlicher Abstand zwischen den Zeichen; negativ, um den Text zu verdichten.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.param.underline.tooltip = Ob der Text unterstrichen ist.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.return = Das Wörterbuch, in dem der Absatz beschrieben wird.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.tooltip = Beschreibt einen Absatz eines Textes. <p> Die Formatierungsargumente (Schriftart, Größe, Farbe, …) gelten für alle Textabschnitte des Absatzes, sofern ein Textabschnitt keine eigene Formatierung festlegt. </p>
com.top_logic.presentation.script.PptDescriptionFunctions.row = Beschreibe eine Zeile
com.top_logic.presentation.script.PptDescriptionFunctions.row.param.align.tooltip = Die vertikale Ausrichtung der Elemente: <code>stretch</code> (Standard), <code>start</code>, <code>center</code> oder <code>end</code>.
com.top_logic.presentation.script.PptDescriptionFunctions.row.param.children.tooltip = Die Elemente der Zeile: Formen, Textfelder, Tabellen, Bilder, Zeilen und Spalten.
com.top_logic.presentation.script.PptDescriptionFunctions.row.param.gap.tooltip = Der horizontale Abstand zwischen zwei Elementen. Ohne Angabe gilt der Abstand <code>gap</code> des Vorlagenprofils.
com.top_logic.presentation.script.PptDescriptionFunctions.row.param.height.tooltip = Die Höhe oder <code>auto</code> für die Höhe des höchsten Elements.
com.top_logic.presentation.script.PptDescriptionFunctions.row.param.weight.tooltip = Der Anteil am freien Platz einer umschließenden Zeile oder Spalte bzw. des Inhaltsbereichs. Der Standardwert ist 1.
com.top_logic.presentation.script.PptDescriptionFunctions.row.param.weights.tooltip = Die Anteile der Elemente an der verbleibenden Breite, eine Zahl für jedes Element.
com.top_logic.presentation.script.PptDescriptionFunctions.row.param.width.tooltip = Die Breite.
com.top_logic.presentation.script.PptDescriptionFunctions.row.param.x.tooltip = Die horizontale Position des linken Randes. Wenn weder <code>x</code> noch <code>y</code> angegeben wird, wird die Zeile zusammen mit den übrigen Inhalten der Folie angeordnet.
com.top_logic.presentation.script.PptDescriptionFunctions.row.param.y.tooltip = Die vertikale Position des oberen Randes.
com.top_logic.presentation.script.PptDescriptionFunctions.row.return = Das Wörterbuch, das die Zeile beschreibt.
com.top_logic.presentation.script.PptDescriptionFunctions.row.tooltip = Beschreibt eine Zeile: nebeneinander angeordnete Elemente. <p> Beispiel: drei Karten, die mittlere doppelt so breit wie die anderen: <code>pptRow([pptShape(fill: "accent1", text: "A"), pptShape(fill: "accent2", text: "B", weight: 2), pptShape(fill: "accent3", text: "C")])</code> </p> <p> Ein Element mit einer Breite (<code>width</code>) erhält diese Breite. Die anderen Elemente teilen sich die verbleibende Breite entsprechend ihrem Anteil <code>weight</code> (Standardwert 1) oder den Anteilen <code>weights</code> der Zeile. Vertikal wird ein Element ohne eigene Höhe auf die Höhe der Zeile gestreckt, es sei denn, <code>align</code> ist angegeben; dann erhält es die Höhe seines Inhalts. Die Elemente haben keine eigene Position. Zeilen und Spalten können beliebig verschachtelt werden. </p>
com.top_logic.presentation.script.PptDescriptionFunctions.run = Beschreibe einen Textabschnitt
com.top_logic.presentation.script.PptDescriptionFunctions.run.param.bold.tooltip = Ob der Text fettformatiert ist.
com.top_logic.presentation.script.PptDescriptionFunctions.run.param.caps.tooltip = Ob der Text in Großbuchstaben angezeigt wird.
com.top_logic.presentation.script.PptDescriptionFunctions.run.param.color.tooltip = Die Textfarbe.
com.top_logic.presentation.script.PptDescriptionFunctions.run.param.font.tooltip = Die Schriftfamilie.
com.top_logic.presentation.script.PptDescriptionFunctions.run.param.hyperlink.tooltip = Die URL, auf die der Text verweist.
com.top_logic.presentation.script.PptDescriptionFunctions.run.param.italic.tooltip = Ob der Text kursiv ist.
com.top_logic.presentation.script.PptDescriptionFunctions.run.param.size.tooltip = Die Schriftgröße.
com.top_logic.presentation.script.PptDescriptionFunctions.run.param.spacing.tooltip = Zusätzlicher Abstand zwischen den Zeichen; negativ, um den Text zu verdichten.
com.top_logic.presentation.script.PptDescriptionFunctions.run.param.text.tooltip = Der Text. Ein Zeilenumbruch unterbricht die Zeile, ohne einen neuen Absatz zu beginnen.
com.top_logic.presentation.script.PptDescriptionFunctions.run.param.underline.tooltip = Ob der Text unterstrichen ist.
com.top_logic.presentation.script.PptDescriptionFunctions.run.return = Das Wörterbuch, das den Textabschnitt beschreibt.
com.top_logic.presentation.script.PptDescriptionFunctions.run.tooltip = Beschreibt einen Teil eines Absatzes mit eigener Formatierung. <p> Beispiel: <code>pptParagraph([pptRun("Note: ", bold: true), "the rest"])</code> </p>
com.top_logic.presentation.script.PptDescriptionFunctions.shadow = Beschreibe einen Schatten
com.top_logic.presentation.script.PptDescriptionFunctions.shadow.param.blur.tooltip = Der Unschärferadius. Der Standardwert beträgt 6.
com.top_logic.presentation.script.PptDescriptionFunctions.shadow.param.color.tooltip = Die Farbe des Schattens, seine Transparenz als <code>alpha</code> angegeben (siehe <code>pptColor()</code>). Standard ist Schwarz mit 35 % Deckkraft.
com.top_logic.presentation.script.PptDescriptionFunctions.shadow.param.direction.tooltip = Die Richtung des Schattens in Grad, im Uhrzeigersinn, wobei 0 nach rechts zeigt. Der Standardwert ist 90 (nach unten).
com.top_logic.presentation.script.PptDescriptionFunctions.shadow.param.distance.tooltip = Der Abstand des Schattens von der Form. Der Standardwert beträgt 2.
com.top_logic.presentation.script.PptDescriptionFunctions.shadow.return = Das Wörterbuch, in dem der Schatten beschrieben wird.
com.top_logic.presentation.script.PptDescriptionFunctions.shadow.tooltip = Beschreibt den Schatten einer Form.
com.top_logic.presentation.script.PptDescriptionFunctions.shape = Beschreibe eine Form
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.adjust.tooltip = Anpassungswerte der vordefinierten Geometrie nach ihren Namen (z. B. <code>adj</code>), wie in der Datei angegeben (100000 für 100 %).
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.align.tooltip = Die horizontale Ausrichtung des Textes: <code>left</code>, <code>center</code>, <code>right</code> oder <code>justify</code>.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.anchor.tooltip = Die vertikale Ausrichtung des Textes: <code>top</code>, <code>middle</code> oder <code>bottom</code>.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.bold.tooltip = Ob der Text fettformatiert ist.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.caps.tooltip = Ob der Text in Großbuchstaben angezeigt wird.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.color.tooltip = Die Textfarbe.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.cornerRadius.tooltip = Der Eckenradius eines <code>roundRect</code>. Wird er ohne Geometrie angegeben, ist die Form ein <code>roundRect</code>.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.fill.tooltip = Die Füllung: eine Farbe, <code>none</code> oder ein Farbverlauf (<code>pptGradient()</code>). Wird kein Wert angegeben, bleibt die Form ungefüllt.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.font.tooltip = Die Schriftfamilie.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.geometry.tooltip = Der Name der vordefinierten Geometrie, z. B. <code>rect</code> (Standard), <code>roundRect</code>, <code>ellipse</code>, <code>triangle</code>, <code>rightArrow</code>, <code>chevron</code> oder <code>line</code>.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.height.tooltip = Die Höhe oder <code>auto</code> für die Höhe des Textes bei seiner Breite.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.insets.tooltip = Die inneren Ränder: eine Zahl für alle Seiten oder ein Wörterbuch mit den Einträgen <code>left</code>, <code>top</code>, <code>right</code> und <code>bottom</code>.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.italic.tooltip = Ob der Text kursiv ist.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.line.tooltip = Der Umriss: eine Farbe, <code>none</code> oder eine Umrissbeschreibung (<code>pptLine()</code>), die in der Textfarbe <code>tx1</code> gezeichnet wird, sofern keine Farbe angegeben ist. Wird keine Angabe gemacht, hat die Form keinen Umriss.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.overflow.tooltip = Was mit einem Text geschieht, der nicht in die Form passt: <code>shrink</code> (Standard) verkleinert die Schriftgröße, jedoch nicht unter die <code>minFontSize</code> des Vorlagenprofils, und schneidet den Text mit „…“ ab, wenn er dann immer noch nicht passt; <code>ellipsis</code> schneidet den Text ab, ohne die Schriftgröße zu verkleinern; <code>visible</code> lässt den Text über die Form hinausragen; <code>error</code> bricht die Erstellung der Präsentation ab.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.shadow.tooltip = Der Schatten: <code>true</code> für den Standardschatten oder eine Schattenbeschreibung (<code>pptShadow()</code>).
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.size.tooltip = Die Schriftgröße.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.spacing.tooltip = Zusätzlicher Abstand zwischen den Zeichen; negativ, um den Text zu verdichten.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.split.tooltip = Ob Absätze, die nicht in die Form passen, auf einer weiteren Folie fortgesetzt werden, wobei der Titel der Folie wiederholt wird. Es kann jeweils nur ein Element einer Folie fortgesetzt werden.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.text.tooltip = Der Text in der Form.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.underline.tooltip = Ob der Text unterstrichen ist.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.weight.tooltip = Der Anteil am freien Platz einer Zeile oder Spalte (<code>pptRow()</code>, <code>pptColumn()</code>) oder des Inhaltsbereichs, sofern keine eigene Größe angegeben ist. Der Standardwert ist 1.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.width.tooltip = Die Breite.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.wrap.tooltip = Ob der Text am Rand der Form umgebrochen wird.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.x.tooltip = Die horizontale Position des linken Randes.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.y.tooltip = Die vertikale Position des oberen Randes.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.return = Das Wörterbuch, in dem die Form beschrieben wird.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.tooltip = Beschreibt eine geometrische Form, optional mit Text. <p> Beispiel: <code>pptShape(geometry: "roundRect", x: 30, y: 130, width: 300, height: 200, fill: "accent1", text: "Hello", color: "bg1")</code> </p> <p> Die Form zeigt nur das, was beschrieben wird: Ohne <code>fill</code> ist sie nicht ausgefüllt, ohne <code>line</code> hat sie keinen Umriss, und ihr Text hat die Textfarbe der Vorlage, sofern nicht <code>color</code> angegeben ist. Der Text wird horizontal und vertikal zentriert, sofern nicht <code>align</code> oder <code>anchor</code> etwas anderes vorgeben. </p> <p> Die Formatierungsargumente (Schriftart, Größe, Farbe, …) gelten für den gesamten Text, sofern nicht ein Absatz oder ein Textabschnitt eine eigene Formatierung definiert. </p>
com.top_logic.presentation.script.PptDescriptionFunctions.slide = Beschreibe eine Folie
com.top_logic.presentation.script.PptDescriptionFunctions.slide.param.content.tooltip = Die Elemente auf der Folie: Formen, Textfelder, Tabellen, Bilder, Zeilen und Spalten.
com.top_logic.presentation.script.PptDescriptionFunctions.slide.param.hidden.tooltip = Ob die Folie in der Bildschirmpräsentation ausgeblendet ist.
com.top_logic.presentation.script.PptDescriptionFunctions.slide.param.layout.tooltip = Das Folienlayout: sein Index (wie in <code>layouts</code> von <code>pptAnalyze()</code>), sein Name oder seine Rolle <code>title</code>, <code>content</code>, <code>agenda</code>, <code>section</code> oder <code>closing</code>. Ohne Angabe wird das Inhaltslayout verwendet.
com.top_logic.presentation.script.PptDescriptionFunctions.slide.param.notes.tooltip = Die Sprechernotizen als Text oder als Liste von Zeilen.
com.top_logic.presentation.script.PptDescriptionFunctions.slide.param.placeholders.tooltip = Texte weiterer Platzhalter: ein Wörterbuch vom Platzhalterindex (wie in den <code>placeholders</code> eines Layouts in <code>pptAnalyze()</code>) oder Platzhalternamen auf den Text.
com.top_logic.presentation.script.PptDescriptionFunctions.slide.param.subtitle.tooltip = Der Text des Platzhalters für den Untertitel.
com.top_logic.presentation.script.PptDescriptionFunctions.slide.param.title.tooltip = Der Text des Platzhalters für den Titel.
com.top_logic.presentation.script.PptDescriptionFunctions.slide.return = Das Wörterbuch, in dem die Folie beschrieben wird.
com.top_logic.presentation.script.PptDescriptionFunctions.slide.tooltip = Beschreibt eine Folie. <p> Die Folie wird auf einem Folienlayout der Vorlage erstellt. Ihr Titel und Untertitel füllen die Platzhalter für Titel und Untertitel des Layouts aus, weitere Platzhalter werden anhand ihres Index oder Namens ausgefüllt. Die Inhaltselemente werden auf der Folie platziert: Ein Element mit einer Position (<code>x</code> oder <code>y</code>) wird dort platziert. Die Elemente ohne Position werden im Inhaltsbereich des Layouts untereinander angeordnet, wie die untergeordneten Elemente einer Spalte (<code>pptColumn()</code>); ein einzelnes Element füllt den Inhaltsbereich aus. </p>
com.top_logic.presentation.script.PptDescriptionFunctions.table = Beschreibe eine Tabelle
com.top_logic.presentation.script.PptDescriptionFunctions.table.param.columnWeights.tooltip = Die relativen Breiten der Spalten, die die Breite der Tabelle aufteilen. Wenn weder Gewichte noch Breiten angegeben sind, haben alle Spalten die gleiche Breite.
com.top_logic.presentation.script.PptDescriptionFunctions.table.param.columnWidths.tooltip = Die Breiten der Spalten. Dürfen nicht zusammen mit den Gewichten angegeben werden.
com.top_logic.presentation.script.PptDescriptionFunctions.table.param.headerRows.tooltip = Die Anzahl der Zeilen oben, die als Kopfzeilen formatiert werden.
com.top_logic.presentation.script.PptDescriptionFunctions.table.param.height.tooltip = Die Höhe oder <code>auto</code> für die Höhe der Zeilen bei der angegebenen Breite.
com.top_logic.presentation.script.PptDescriptionFunctions.table.param.rowHeight.tooltip = Die Mindesthöhe einer Zeile.
com.top_logic.presentation.script.PptDescriptionFunctions.table.param.rows.tooltip = Die Zeilen der Tabelle, jede eine Liste von Zellen mit derselben Anzahl an Zellen. Eine Zelle ist ein Text oder eine Zellbeschreibung (<code>pptCell()</code>).
com.top_logic.presentation.script.PptDescriptionFunctions.table.param.weight.tooltip = Der Anteil am freien Platz einer Zeile oder Spalte (<code>pptRow()</code>, <code>pptColumn()</code>) oder des Inhaltsbereichs, sofern keine eigene Größe angegeben ist. Der Standardwert ist 1.
com.top_logic.presentation.script.PptDescriptionFunctions.table.param.width.tooltip = Die Breite.
com.top_logic.presentation.script.PptDescriptionFunctions.table.param.x.tooltip = Die horizontale Position des linken Randes.
com.top_logic.presentation.script.PptDescriptionFunctions.table.param.y.tooltip = Die vertikale Position des oberen Randes.
com.top_logic.presentation.script.PptDescriptionFunctions.table.return = Das Wörterbuch, das die Tabelle beschreibt.
com.top_logic.presentation.script.PptDescriptionFunctions.table.tooltip = Beschreibt eine Tabelle. <p> Beispiel: <code>pptTable(rows: [["Name", "Value"], ["A", 1], ["B", pptCell("2", fill: "accent2")]], headerRows: 1, columnWeights: [2, 1])</code> </p> <p> Die Zeilen wachsen mit ihrem Text. Zeilen, die nicht in die Höhe der Tabelle passen, werden auf weiteren Folien fortgesetzt, die die Kopfzeilen und den Titel der Folie, ergänzt um das <code>continuationSuffix</code> des Vorlagenprofils, wiederholen. Auf diesen Folien füllt die Tabelle den Inhaltsbereich aus. Nur ein Element einer Folie kann fortgesetzt werden. </p>
com.top_logic.presentation.script.PptDescriptionFunctions.textBox = Beschreibe ein Textfeld
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.align.tooltip = Die horizontale Ausrichtung: <code>left</code>, <code>center</code>, <code>right</code> oder <code>justify</code>.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.anchor.tooltip = Die vertikale Ausrichtung: <code>top</code>, <code>middle</code> oder <code>bottom</code>.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.bold.tooltip = Ob der Text fettformatiert ist.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.caps.tooltip = Ob der Text in Großbuchstaben angezeigt wird.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.color.tooltip = Die Textfarbe.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.font.tooltip = Die Schriftfamilie.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.height.tooltip = Die Höhe oder <code>auto</code> für die Höhe des Textes bei seiner Breite.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.insets.tooltip = Die inneren Ränder: eine Zahl für alle Seiten oder ein Wörterbuch mit den Einträgen <code>left</code>, <code>top</code>, <code>right</code> und <code>bottom</code>.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.italic.tooltip = Ob der Text kursiv ist.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.overflow.tooltip = Was mit einem Text geschieht, der nicht in das Textfeld passt: <code>shrink</code> (Standard) verkleinert die Schriftgröße, jedoch nicht unter die <code>minFontSize</code> des Vorlagenprofils, und schneidet den Text mit „…“ ab, wenn er dann immer noch nicht passt; <code>ellipsis</code> schneidet den Text ab, ohne die Schriftgröße zu verkleinern; <code>visible</code> lässt den Text über das Textfeld hinausragen; <code>error</code> bricht die Erstellung der Präsentation ab.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.size.tooltip = Die Schriftgröße.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.spacing.tooltip = Zusätzlicher Abstand zwischen den Zeichen; negativ, um den Text zu verdichten.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.split.tooltip = Ob Absätze, die nicht in das Feld passen, auf einer weiteren Folie fortgesetzt werden, wobei der Titel der Folie wiederholt wird, z. B. bei einer langen Liste mit Aufzählungspunkten. Es kann jeweils nur ein Element einer Folie fortgesetzt werden.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.text.tooltip = Der Text.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.underline.tooltip = Ob der Text unterstrichen ist.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.weight.tooltip = Der Anteil am freien Platz einer Zeile oder Spalte (<code>pptRow()</code>, <code>pptColumn()</code>) oder des Inhaltsbereichs, sofern keine eigene Größe angegeben ist. Der Standardwert ist 1.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.width.tooltip = Die Breite.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.wrap.tooltip = Ob der Text am Rand des Feldes umgebrochen wird.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.x.tooltip = Die horizontale Position des linken Randes.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.y.tooltip = Die vertikale Position des oberen Randes.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.return = Das Wörterbuch, das das Textfeld beschreibt.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.tooltip = Beschreibt ein Textfeld: einen Text ohne Füllung und Umrandung. <p> Sofern nicht anders angegeben, hat das Textfeld keine inneren Ränder, sodass der Text genau an seiner Position beginnt. </p>
com.top_logic.presentation.script.PptRenderFunctions.render = Folien als Bilder darstellen
com.top_logic.presentation.script.PptRenderFunctions.render.param.presentation.tooltip = Die PowerPoint-Datei (<code>.pptx</code> oder <code>.potx</code>), die dargestellt werden soll.
com.top_logic.presentation.script.PptRenderFunctions.render.param.slides.tooltip = Die Indizes der darzustellenden Folien, die erste Folie hat den Index 0. Eine einzelne Zahl wählt eine einzelne Folie. Ohne Angabe oder bei einer leeren Liste werden alle Folien dargestellt.
com.top_logic.presentation.script.PptRenderFunctions.render.param.width.tooltip = Die Breite der Bilder in Pixeln, zwischen 16 und 8000.
com.top_logic.presentation.script.PptRenderFunctions.render.return = Die Liste der PNG-Bilder.
com.top_logic.presentation.script.PptRenderFunctions.render.tooltip = Stellt Folien einer PowerPoint-Präsentation als Bilder dar. <p> Das Ergebnis enthält für jede angeforderte Folie ein PNG-Bild in der angegebenen Reihenfolge. Ein Bild ist nach dem Folienindex benannt, z. B. <code>slide-03.png</code> für die Folie mit dem Index 3 (die vierte Folie). Seine Höhe ergibt sich aus der Breite und dem Seitenverhältnis der Folien. </p> <p> Wie die Folienlayouts einer Vorlage aussehen, zeigt <code>pptRenderLayouts()</code>. </p>
com.top_logic.presentation.script.PptRenderFunctions.renderLayouts = Folienlayouts als Bilder darstellen
com.top_logic.presentation.script.PptRenderFunctions.renderLayouts.param.layouts.tooltip = Die Indizes der darzustellenden Layouts, das erste Layout hat den Index 0. Eine einzelne Zahl wählt ein einzelnes Layout. Ohne Angabe oder bei einer leeren Liste werden alle Layouts dargestellt.
com.top_logic.presentation.script.PptRenderFunctions.renderLayouts.param.template.tooltip = Die PowerPoint-Datei (<code>.pptx</code> oder <code>.potx</code>), deren Layouts dargestellt werden sollen.
com.top_logic.presentation.script.PptRenderFunctions.renderLayouts.param.width.tooltip = Die Breite der Bilder in Pixeln, zwischen 16 und 8000.
com.top_logic.presentation.script.PptRenderFunctions.renderLayouts.return = Die Liste der PNG-Bilder.
com.top_logic.presentation.script.PptRenderFunctions.renderLayouts.tooltip = Stellt Folienlayouts einer PowerPoint-Vorlage als Bilder dar. <p> Für jedes angeforderte Layout wird eine Folie mit diesem Layout dargestellt. Ihre Platzhalter zeigen ihren Eingabehinweis oder, falls sie keinen haben, ihren Typnamen (z. B. <code>body</code>), sodass Position und Textstil jedes Platzhalters sichtbar werden. Die Layouts sind in der Reihenfolge des Eintrags <code>layouts</code> im Ergebnis von <code>pptAnalyze()</code> nummeriert. </p> <p> Das Ergebnis enthält für jedes angeforderte Layout ein PNG-Bild in der angegebenen Reihenfolge. Ein Bild ist nach dem Layout-Index benannt, z. B. <code>layout-11.png</code>. </p> <p> Die Beispielfolien einer Vorlage stellt <code>pptRender()</code> dar. </p>
com.top_logic.presentation.script.PptTemplateFunctions.analyze = Präsentationsvorlage analysieren
com.top_logic.presentation.script.PptTemplateFunctions.analyze.param.template.tooltip = Die zu analysierende PowerPoint-Datei (<code>.pptx</code> oder <code>.potx</code>).
com.top_logic.presentation.script.PptTemplateFunctions.analyze.return = Das Wörterbuch, das die Vorlage beschreibt.
com.top_logic.presentation.script.PptTemplateFunctions.analyze.tooltip = Beschreibt den Aufbau und den Stil einer PowerPoint-Präsentation oder -Vorlage. <p> Das Ergebnis gibt Auskunft darüber, welche Folienlayouts eine Vorlage bietet, wo sich deren Platzhalter befinden und wie deren Texte aussehen sowie welche Farben, Schriftarten und Formstile die Vorlage verwendet. Es besteht ausschließlich aus Wörterbüchern, Listen, Texten, Zahlen und Wahrheitswerten, sodass es in JSON konvertiert werden kann. Einträge ohne Wert werden weggelassen. Alle Längenangaben sind in Punkten angegeben, Farben als sechs Hexadezimalziffern <code>RRGGBB</code>. </p> <p> Das Ergebnis ist ein Wörterbuch mit den folgenden Einträgen: </p> <ul> <li><code>"slideSize"</code>: Die Breite und Höhe einer Folie.</li> <li><code>"masters"</code>: Die Folienmaster mit ihrem Design (Designfarben und Schriftarten), ihrem Hintergrund, ihren Platzhaltern und ihren sonstigen Formen wie Logos.</li> <li><code>"layouts"</code>: Die Folienlayouts aller Folienmaster in der Reihenfolge, in der PowerPoint sie anzeigt. Jedes Layout hat seine Position in dieser Liste, seinen Namen, seinen vordefinierten Typ (z. B. <code>TITLE</code>, wenn es sich nicht um ein benutzerdefiniertes Layout handelt), seinen Folienmaster, seinen Hintergrund, seine Platzhalter und seine sonstigen Formen. Ein Platzhalter wird durch seinen Typ (z. B. <code>title</code>, <code>body</code>), seinen Index, seine tatsächliche Position und Größe, den Stil seines Textes und seinen Aufforderungstext beschrieben.</li> <li><code>"slides"</code>: Die Folien der Präsentation mit ihrem Layout und ihren Formen. Eine Form wird durch ihre Art, ihren Namen, ihre Position und Größe, ihre Geometrie, ihre Füllung, ihren Umriss, ihren Schatten und ihren Text beschrieben. Formen einer Gruppe werden als deren untergeordnete Elemente aufgeführt.</li> </ul> <p> Eine aus dem Design entnommene Farbe benennt die Designfarbe, auf die sie sich bezieht, zusammen mit den darauf angewendeten Anpassungen (z. B. Helligkeit oder Transparenz), sodass eine Form erstellt werden kann, die dem Farbschema der Vorlage entspricht. </p>
com.top_logic.presentation.script.PptTextFunctions.measureText = Text auf einer Folie messen
com.top_logic.presentation.script.PptTextFunctions.measureText.param.bold.tooltip = Ob der Text fett gesetzt ist.
com.top_logic.presentation.script.PptTextFunctions.measureText.param.caps.tooltip = Ob der Text in Großbuchstaben angezeigt wird, wie ein Text, der in PowerPoint mit „Alle Großbuchstaben“ formatiert ist.
com.top_logic.presentation.script.PptTextFunctions.measureText.param.font.tooltip = Der Name der Schriftfamilie, z. B. <code>Arial</code>.
com.top_logic.presentation.script.PptTextFunctions.measureText.param.italic.tooltip = Ob der Text kursiv gesetzt ist.
com.top_logic.presentation.script.PptTextFunctions.measureText.param.size.tooltip = Die Schriftgröße in Punkten.
com.top_logic.presentation.script.PptTextFunctions.measureText.param.spacing.tooltip = Der zusätzliche Abstand zwischen zwei Zeichen in Punkt, wie er in PowerPoint als Zeichenabstand eingestellt wird. Ein negativer Wert schmälert den Text.
com.top_logic.presentation.script.PptTextFunctions.measureText.param.text.tooltip = Der zu messende Text.
com.top_logic.presentation.script.PptTextFunctions.measureText.param.width.tooltip = Die für den Text verfügbare Breite in Punkten. Wird dieser Wert nicht angegeben, erfolgt kein Zeilenumbruch.
com.top_logic.presentation.script.PptTextFunctions.measureText.return = Das Wörterbuch, das die Ausdehnung des Textes beschreibt.
com.top_logic.presentation.script.PptTextFunctions.measureText.tooltip = Misst den Platz, den ein Text auf einer PowerPoint-Folie einnimmt. <p> Der Text wird genau wie in einem Textfeld ohne Innenränder angeordnet, das in ein Bild umgewandelt wird. Jeder Zeilenumbruch im Text leitet einen neuen Absatz ein. Wenn eine Breite angegeben wird, wird der Text an Wortgrenzen umgebrochen, um diese Breite einzuhalten, andernfalls nur an den Zeilenumbrüchen. Zeichenabstände und Großbuchstaben werden wie in PowerPoint angewendet, z. B. um die gesperrten Titel einer Vorlage zu messen. </p> <p> Das Ergebnis ist ein Wörterbuch mit den folgenden Einträgen: </p> <ul> <li><code>"width"</code>: Die Breite der breitesten Zeile in Punkten.</li> <li><code>"lines"</code>: Die Anzahl der Zeilen nach dem Zeilenumbruch.</li> <li><code>"height"</code>: Die Höhe des Textes in Punkt. Ein Textfeld benötigt diese Höhe zuzüglich seiner inneren oberen und unteren Ränder, um den gesamten Text anzuzeigen.</li> <li><code>"lineHeight"</code>: Der Abstand zwischen zwei Zeilen in Punkten.</li> <li><code>"fontAvailable"</code>: Gibt an, ob die Schriftart auf dem Server installiert ist. Eine nicht installierte Schriftart wird durch eine Standardschriftart ersetzt, sodass die Maße nicht mit dem Text übereinstimmen, den PowerPoint auf einem Computer anzeigt, auf dem die Schriftart vorhanden ist.</li> </ul>
