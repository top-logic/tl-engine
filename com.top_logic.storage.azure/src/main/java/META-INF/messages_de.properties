com.top_logic.storage.azure.AzureBlobStore = Azure Blob-Speicher
com.top_logic.storage.azure.AzureBlobStore.Config.block-size = Blockgröße
com.top_logic.storage.azure.AzureBlobStore.Config.block-size.tooltip = Die Größe der Blöcke eines Uploads in Blöcken. <p> Pro laufendem Upload wird ein Block im Arbeitsspeicher gepuffert. Die Größe muss mindestens 64 kB betragen. Da ein Blob aus höchstens 50.000 Blöcken besteht, begrenzt die Blockgröße die Größe eines Blobs: Der Standardwert von 8 MB ermöglicht Blobs von bis zu 400 GB. </p>
com.top_logic.storage.azure.AzureBlobStore.Config.class.tooltip = Implementierungsklasse des Speichers.
com.top_logic.storage.azure.AzureBlobStore.Config.container = Container
com.top_logic.storage.azure.AzureBlobStore.Config.container.tooltip = Der Name des Containers, in dem die Blobs gespeichert sind. <p> Der Container muss bereits vorhanden sein; er wird nicht vom Speicher angelegt, sodass ein falsch geschriebener Name erkannt wird, anstatt den Inhalt stillschweigend in einem neuen Container zu speichern. </p>
com.top_logic.storage.azure.AzureBlobStore.Config.direct-download = Direkter Download
com.top_logic.storage.azure.AzureBlobStore.Config.direct-download-lifetime = Gültigkeitsdauer direkter Downloads
com.top_logic.storage.azure.AzureBlobStore.Config.direct-download-lifetime.tooltip = Die Zeit, in der eine URL für einen direkten Download gültig bleibt, z. B. <code>60s</code>. <p> Der Speicher überprüft die Gültigkeit zu Beginn der Übertragung, sodass ein langsamer Download großer Inhalte auch nach Ablauf der URL abgeschlossen wird. Jeder, der die URL besitzt, kann den Inhalt innerhalb dieses Zeitraums abrufen. Maximal 7 Tage. Nur relevant, wenn <i>„Direkter Download“</i> aktiviert ist. </p>
com.top_logic.storage.azure.AzureBlobStore.Config.direct-download-min-size = Mindestgröße direkter Downloads
com.top_logic.storage.azure.AzureBlobStore.Config.direct-download-min-size.tooltip = Die Mindestgröße von Inhalten, die direkt aus dem Speicher heruntergeladen werden. <p> Kleinere Inhalte werden über den Anwendungsserver gestreamt, da die Umleitung mehr Kosten verursachen würde, als sie einspart. Die Größe wird in Byte angegeben, optional mit einer Einheit, z. B. <code>1MB</code>. Nur relevant, wenn <i>„Direkter Download“</i> aktiviert ist. </p>
com.top_logic.storage.azure.AzureBlobStore.Config.direct-download.tooltip = Ob Browser Inhalte direkt aus dem Speicher herunterladen. <p> Wenn diese Option aktiviert ist, wird ein Download in der React-Benutzeroberfläche mit einer Weiterleitung zu einer URL des Blobs mit einer Shared-Access-Signatur beantwortet, anstatt den Inhalt über den Anwendungsserver zu streamen. Der Browser muss auf den Speicher zugreifen können (siehe <i>„Öffentlicher Endpunkt“</i>). Der Speicher bedient dann auch Bereichsanfragen, z. B. zum Springen innerhalb von Audio- oder PDF-Inhalten. Die Integritätsprüfung des Inhalts anhand seines gespeicherten Hash-Werts wird bei direkten Downloads nicht durchgeführt. Das Signieren der URL erfordert den Kontoschlüssel; bei einer Verbindungszeichenfolge, die keinen Kontoschlüssel enthält, wird der Inhalt gestreamt. </p>
com.top_logic.storage.azure.AzureBlobStore.Config.prefix = Präfix
com.top_logic.storage.azure.AzureBlobStore.Config.prefix.tooltip = Präfix der Namen der Blobs innerhalb des Containers, z. B. <code>blobs/</code>. <p> Der Name eines Blobs setzt sich aus diesem Präfix und dem unmittelbar darauf folgenden Schlüssel des Blobs zusammen; daher muss ein Präfix, das als Verzeichnis dienen soll, mit einem Schrägstrich enden. Mehrere Speicher können sich einen Container mit unterschiedlichen Präfixen teilen. Leer, um die Blobs auf der obersten Ebene des Containers zu speichern. Blobs unter dem Präfix, die nicht zum Speicher gehören, sowie Blobs in tiefer liegenden Verzeichnissen unterhalb des Präfixes werden ignoriert. </p>
com.top_logic.storage.azure.AzureBlobStore.Config.public-endpoint = Öffentlicher Endpunkt
com.top_logic.storage.azure.AzureBlobStore.Config.public-endpoint.tooltip = Die URL, über die Browser auf den Blob-Dienst des Speicherkontos zugreifen, z. B. <code>https://files.example.com</code>. <p> Für diese Adresse werden URLs für direkte Downloads anstelle des Endpunkts des Kontos ausgegeben. Beim Speicheremulator Azurite enthält die Adresse den Kontonamen als Pfad, genau wie der Endpunkt. Leer, wenn Browser über den Endpunkt des Kontos auf den Speicher zugreifen. Nur relevant, wenn <i>„Direkter Download“</i> aktiviert ist. </p>
com.top_logic.storage.azure.AzureBlobStore.Config.single-upload-threshold = Schwellenwert für einzelne Uploads
com.top_logic.storage.azure.AzureBlobStore.Config.single-upload-threshold.tooltip = Die maximale Größe von Inhalten, die in einer einzelnen Anfrage hochgeladen werden können. <p> Inhalte bis zu dieser Größe werden im Arbeitsspeicher gepuffert und in einer einzigen Anfrage hochgeladen. Größere Inhalte werden in Blöcken hochgeladen. Die Größe wird in Byte angegeben, optional mit einer Einheit, z. B. <code>16MB</code>. </p>
com.top_logic.storage.azure.AzureBlobStore.tooltip = <i>Blob-Speicher</i>, bei dem jeder Blob als Block-Blob in einem Container von Azure Blob Storage gespeichert wird. <p> Der Blob eines Inhalts wird durch das konfigurierte Präfix benannt, gefolgt vom Schlüssel des Blobs. Der Container muss bereits vorhanden sein. Inhalte bis zum Schwellenwert für Einzel-Uploads werden im Arbeitsspeicher gepuffert und in einer einzigen Anfrage hochgeladen; größere Inhalte sowie Inhalte unbekannter Größe, die den Schwellenwert überschreiten, werden in Blöcken gestreamt, wobei jeweils ein Block gepuffert und nach Abschluss festgeschrieben wird. Blöcke eines fehlgeschlagenen Uploads werden niemals festgeschrieben; der Speicher verwirft sie automatisch nach 7 Tagen. Ein Blob wird niemals überschrieben: Das Speichern schlägt fehl, wenn bereits ein Blob mit dem gewählten Namen existiert. </p> <p> Optional laden Browser Inhalte direkt aus dem Speicher über kurzlebige URLs mit einer Shared-Access-Signatur herunter, anstatt sie über den Anwendungsserver zu empfangen (siehe <i>„Direkter Download“</i>). </p>
com.top_logic.storage.azure.AzureRepositoryContentReader = Inhaltsleser für Azure-Repositorys
com.top_logic.storage.azure.AzureRepositoryContentReader.Config.attic = Attic
com.top_logic.storage.azure.AzureRepositoryContentReader.Config.attic.tooltip = Das Verzeichnis, in dem die aus dem Repository gelöschten Dokumente gespeichert sind, relativ zu dem durch <i>„Verzeichnisname“</i> angegebenen Verzeichnis. <p> Ist kein Verzeichnis angegeben, werden gelöschte Dokumente nicht gesucht. </p>
com.top_logic.storage.azure.AzureRepositoryContentReader.Config.container-name = Containername
com.top_logic.storage.azure.AzureRepositoryContentReader.Config.container-name.tooltip = Der Name des Containers, in dem sich das Repository befindet.
com.top_logic.storage.azure.AzureRepositoryContentReader.Config.directory-name = Verzeichnisname
com.top_logic.storage.azure.AzureRepositoryContentReader.Config.directory-name.tooltip = Das Verzeichnis im Container, das das Repository und das Attic enthält.
com.top_logic.storage.azure.AzureRepositoryContentReader.Config.path = Pfad
com.top_logic.storage.azure.AzureRepositoryContentReader.Config.path.tooltip = Das Verzeichnis des Repositorys, relativ zu dem unter <i>„Verzeichnisname“</i> angegebenen Verzeichnis.
com.top_logic.storage.azure.AzureRepositoryContentReader.tooltip = <i>Inhaltsleser</i> für ein Dokumenten-Repository früherer Versionen, das in einem Container von Azure Blob Storage gespeichert wurde. <p> Das Repository befindet sich im konfigurierten Container unterhalb des Verzeichnisses <code>&lt;directory-name&gt;/&lt;path&gt;/</code>, gelöschte Dokumente unterhalb von <code>&lt;directory-name&gt;/&lt;attic&gt;/</code>. Unterhalb dieser Verzeichnisse folgen die Blobs derselben Namenskonvention wie die Dateien eines Repositorys im Dateisystem (siehe <i>Inhaltsleser für Dateirepositorys</i>): Die Versionen eines Dokuments sind Blobs mit dem Namen <code>_&lt;version&gt;_n_&lt;author&gt;</code> im Verzeichnis <code>_f&lt;name&gt;</code>, die sich in den (maskierten) Verzeichnissen des Dokumentpfads befinden. </p> <p> Um die Dokumente eines solchen Repositorys zu migrieren, konfiguriert die Anwendung den Leser in ihrer Konfiguration als Eingabe für den <i>Dokumentinhalts-Migrationsprozessor</i> mit den Einstellungen des bisherigen Repositorys: </p><pre> &lt;config config:interface="com.top_logic.knowledge.service.migration.processors.DocumentRepositoryConfig"&gt; &lt;reader class="com.top_logic.storage.azure.AzureRepositoryContentReader" connection-string="%AZURE_BLOB_CONNECTION_SECRET%" container-name="..." directory-name="..." path="repository" attic="attic" /&gt; &lt;/config&gt; </pre>
com.top_logic.storage.azure.AzureStorageAccountConfig = Konfiguration des Azure-Speicherkontos
com.top_logic.storage.azure.AzureStorageAccountConfig.account-key = Kontoschlüssel
com.top_logic.storage.azure.AzureStorageAccountConfig.account-key.tooltip = Ein Zugriffsschlüssel des Speicherkontos. <p> Erforderlich, wenn keine Verbindungszeichenfolge angegeben wird. Der Wert wird in der Konfiguration verschlüsselt oder als Klartext mit dem Präfix <code>unencrypted:</code> angegeben. </p>
com.top_logic.storage.azure.AzureStorageAccountConfig.account-name = Kontoname
com.top_logic.storage.azure.AzureStorageAccountConfig.account-name.tooltip = Der Name des Speicherkontos. <p> Erforderlich, wenn keine Verbindungszeichenfolge angegeben wird. </p>
com.top_logic.storage.azure.AzureStorageAccountConfig.connection-string = Verbindungszeichenfolge
com.top_logic.storage.azure.AzureStorageAccountConfig.connection-string.tooltip = Die Verbindungszeichenfolge des Speicherkontos, wie sie in den Zugriffsschlüsseln des Kontos im Azure-Portal angezeigt wird, z. B. <code>DefaultEndpointsProtocol=https;AccountName=myaccount;AccountKey=...;EndpointSuffix=core.windows.net</code>. <p> Die Verbindungszeichenfolge enthält den Kontoschlüssel, daher wird der Wert in der Konfiguration verschlüsselt oder als Klartext mit dem Präfix <code>unencrypted:</code> angegeben. Das Feld bleibt leer, wenn das Konto über seinen Kontonamen und Kontoschlüssel angegeben wird. Eine Verbindungszeichenfolge mit einer Shared-Access-Signatur anstelle eines Kontoschlüssels gewährt ebenfalls Zugriff, erlaubt jedoch keine direkten Downloads. </p>
com.top_logic.storage.azure.AzureStorageAccountConfig.endpoint = Endpunkt
com.top_logic.storage.azure.AzureStorageAccountConfig.endpoint.tooltip = Die URL des Blob-Dienstes des Speicherkontos, z. B. <code>https://myaccount.blob.core.windows.net</code>. <p> Leer lassen für den Standard-Endpunkt eines Kontos in der Azure-Cloud, der aus dem Kontonamen abgeleitet wird. Erforderlich für andere Clouds und für den Speicheremulator Azurite, bei denen der Kontoname Teil des Pfads ist (<code>http://127.0.0.1:10000/devstoreaccount1</code>). Wird nur in Verbindung mit dem Kontonamen und dem Kontoschlüssel verwendet. </p>
com.top_logic.storage.azure.AzureStorageAccountConfig.tooltip = Einstellungen für den Zugriff auf ein Azure-Speicherkonto. <p> Das Konto wird entweder über eine Verbindungszeichenfolge oder über den Kontonamen und den Kontoschlüssel mit einem optionalen Endpunkt angegeben. Es wird genau eine der beiden Formen verwendet. </p>
