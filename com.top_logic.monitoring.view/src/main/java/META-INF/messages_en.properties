class.com.top_logic.monitoring.view.I18NConstants.ERROR_TOO_MANY_PERIODS__MAX = The range contains more than {0} periods. Choose a longer period or a shorter range.
class.com.top_logic.monitoring.view.I18NConstants.ERROR_UNKNOWN_PERIOD__PERIOD = Unknown period "{0}". Valid periods are hour, day, week, month and year.
com.top_logic.monitoring.view.MonitorFunctions.memoryUsage = Memory usage over time
com.top_logic.monitoring.view.MonitorFunctions.memoryUsage.return = The recorded entries in the order they were recorded, the oldest first. Empty if the <i>memory logging</i> is not running or keeps no entries.
com.top_logic.monitoring.view.MonitorFunctions.memoryUsage.tooltip = The memory usage the <i>memory logging</i> has recorded. <p> Each entry is a dictionary with the time it was recorded under <code>"date"</code>, the bytes used by objects under <code>"used"</code>, reserved by the VM under <code>"total"</code>, available to the VM at most under <code>"max"</code> and reserved but unused under <code>"free"</code>. The number of garbage collections and the milliseconds spent in them since the start of the VM, summed over all garbage collectors, are given under <code>"gcCount"</code> and <code>"gcTime"</code>; the difference of two entries tells how much garbage collection happened between them. </p>
com.top_logic.monitoring.view.MonitorFunctions.sessionLogins = Logins per period
com.top_logic.monitoring.view.MonitorFunctions.sessionLogins.param.from.tooltip = The start of the range (inclusive), <code>null</code> to start with the first recorded login.
com.top_logic.monitoring.view.MonitorFunctions.sessionLogins.param.period.tooltip = The length of a period: <code>"hour"</code>, <code>"day"</code>, <code>"week"</code>, <code>"month"</code> or <code>"year"</code>.
com.top_logic.monitoring.view.MonitorFunctions.sessionLogins.param.to.tooltip = The end of the range (exclusive), <code>null</code> to end now.
com.top_logic.monitoring.view.MonitorFunctions.sessionLogins.return = The periods in their order in time, empty if the range contains no login and has no start.
com.top_logic.monitoring.view.MonitorFunctions.sessionLogins.tooltip = The number of user sessions begun in each period of a time range. <p> The periods are hours, days, weeks, months or years in the time zone of the current user, the first one being the one containing the start of the range. Each period is a dictionary with its start under <code>"start"</code> and the number of logins in it under <code>"count"</code>; a period without login is reported with a count of zero. </p>
