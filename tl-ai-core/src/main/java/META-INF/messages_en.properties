com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.tooltip = TopLogic-provided agent and skill definitions. <p> These are platform-level definitions shipped with TopLogic. Application-specific agents and skills should be created via the Agent Editor. </p> <p> Application modules may extend a platform agent's keyed lists (tools, skills, delegations, mcp-servers) via the standard configuration overlay mechanism: an overlay only declares the entries it adds or removes, and the platform's remaining entries flow through unchanged. Scalar properties such as description and system-prompt are still atomically replaced when overridden, so overlays should leave them unset unless a true replacement is intended. </p>
