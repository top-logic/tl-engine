com.top_logic.ai.views.ViewChangeAction = View change action
com.top_logic.ai.views.ViewChangeAction$Decision = Decision
com.top_logic.ai.views.ViewChangeAction$Decision.tooltip = What <i>view change action</i> does.
com.top_logic.ai.views.ViewChangeAction.Config.action = Action
com.top_logic.ai.views.ViewChangeAction.Config.action.tooltip = What is done with the change set.
com.top_logic.ai.views.ViewChangeAction.Decision.APPLY = Apply
com.top_logic.ai.views.ViewChangeAction.Decision.APPLY.tooltip = <code>ViewChanges#apply(TLObject)</code>
com.top_logic.ai.views.ViewChangeAction.Decision.REJECT = Reject
com.top_logic.ai.views.ViewChangeAction.Decision.REJECT.tooltip = <code>ViewChanges#reject(TLObject)</code>
com.top_logic.ai.views.ViewChangeAction.Decision.REVERT = Revert
com.top_logic.ai.views.ViewChangeAction.Decision.REVERT.tooltip = <code>ViewChanges#revert(TLObject)</code>
com.top_logic.ai.views.ViewChangeAction.tooltip = Decides on the view change set it is given: applies, rejects or reverts it in a transaction of its own, and shows the written views in the window the command was run in. <pre> &lt;generic-command input="selectedSet"&gt; ... &lt;view-change action="APPLY"/&gt; &lt;/generic-command&gt; </pre>
com.top_logic.ai.views.ViewPreviewElement = View preview element
com.top_logic.ai.views.ViewPreviewElement$Side = Side
com.top_logic.ai.views.ViewPreviewElement$Side.tooltip = Which text of the change is shown.
com.top_logic.ai.views.ViewPreviewElement.Config.change = Change
com.top_logic.ai.views.ViewPreviewElement.Config.change.tooltip = Channel holding the change, a tl.ai.views:ViewChange.
com.top_logic.ai.views.ViewPreviewElement.Config.side = Side
com.top_logic.ai.views.ViewPreviewElement.Config.side.tooltip = Which text of the change is shown.
com.top_logic.ai.views.ViewPreviewElement.Side.AFTER = After
com.top_logic.ai.views.ViewPreviewElement.Side.AFTER.tooltip = The view as the change makes it.
com.top_logic.ai.views.ViewPreviewElement.Side.BEFORE = Before
com.top_logic.ai.views.ViewPreviewElement.Side.BEFORE.tooltip = The view as the change found it.
com.top_logic.ai.views.ViewPreviewElement.tooltip = <view-preview>: one view of a change set, built by the engine from the text the change set holds and shown with the real data - before anything is written. <p> A preview changes nothing: its commands stay on the toolbar but are disabled, and the actions of rows, inputs and forms are left out. The view gets channels of its own. </p> <pre> &lt;view-preview change="selectedChange" side="AFTER"/&gt; </pre>
