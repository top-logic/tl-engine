/**
 * The state contract between the server-side controls and the React components rendering them.
 *
 * Each message describes the state object a control sends to its component: the property names,
 * their types and their meaning. A component library replacing a TopLogic component (see
 * "replace" of 'tl-react-bridge') renders the state described here.
 *
 * The message of a replaceable component, by the component name it is registered under:
 *
 *   TLButton          - ButtonState
 *   TLToggleButton    - ToggleButtonState
 *   TLCheckbox        - CheckboxState
 *   TLTextInput       - TextInputState
 *   TLPasswordInput   - PasswordInputState
 *   TLNumberInput     - NumberInputState
 *   TLDatePicker      - DatePickerState
 *   TLSelect          - SelectState
 *   TLDropdownSelect  - DropdownSelectState
 *   TLOptionChips     - DropdownSelectState
 *   TLSegmentedChoice - DropdownSelectState
 *   TLChoiceGroup     - DropdownSelectState
 *   TLTabBar          - TabBarState
 *   TLWindow          - WindowState
 *   TLDialog          - DialogState
 *   TLMenu            - MenuState
 *   TLSnackbar        - SnackbarState
 *   TLAlert           - AlertState
 *   TLFormField       - FormFieldState
 *   TLText            - TextState
 *   TLCard            - CardState
 *   TLAppBar          - AppBarState
 *   TLBreadcrumb      - BreadcrumbState
 *   TLProgress        - ProgressState
 *   TLSlider          - SliderState
 *
 * The state is a JSON object: a property that is absent has its documented default. A property
 * holding a control of its own (the content of a window, for instance) holds a ChildControl, which
 * the component renders through TLChild of 'tl-react-bridge'. The
 * Java side takes the property names from the generated constants, the TypeScript side reads the
 * state through the generated types (exported from 'tl-react-bridge').
 */
package com.top_logic.layout.react.state;

option NoReflection;
option NoBinary;
option NoXml;
option NoListener;
option NoTypeKind;
option TypeScript = "../../../react-src/state/control-state.ts";

/**
 * State properties every control carries.
 */
message ControlState {
	/**
	 * Whether the control is hidden. A hidden control keeps its component mounted (with its local
	 * state), the component renders nothing or is styled away.
	 */
	bool hidden;

	/**
	 * An additional CSS class for the root element of the component, standing beside the classes
	 * the component brings itself.
	 */
	string cssClass;
}

/**
 * State properties every form field carries.
 */
message FieldState extends ControlState {
	/**
	 * The value of the field. Its JSON form depends on the kind of the field, see the state of the
	 * concrete field component.
	 */
	json value;

	/**
	 * Whether the value can be edited. A field that cannot be edited displays its value only.
	 */
	bool editable;

	/**
	 * Whether the field is shown as an inactive input. A disabled field accepts no input, but
	 * presents its value in a visibly inactive input instead of displaying the value only. Only
	 * set while {@link #editable} is not.
	 */
	bool disabled;

	/**
	 * Whether a value is required.
	 */
	bool mandatory;

	/**
	 * Whether the empty value is a legal value of the field.
	 */
	bool nullable;

	/**
	 * Whether the value of the field is invalid, see {@link #errorMessage}.
	 */
	bool hasError;

	/**
	 * The message describing the error, while {@link #hasError} is set.
	 */
	string errorMessage;

	/**
	 * Whether the value of the field is questionable without being invalid.
	 */
	bool hasWarnings;

	/**
	 * The label of the field.
	 */
	string label;

	/**
	 * The tooltip of the field (plain text).
	 */
	string tooltip;

	/**
	 * The text shown while the field is empty and editable.
	 */
	string placeholder;

	/**
	 * Whether pressing Enter in the field sends the submit command with the value typed.
	 */
	bool submitOnEnter;
}

/**
 * State of a button, the component {@code TLButton}.
 *
 * A click sends the command {@code click} to the server, unless {@link #navigateUrl} is set.
 */
message ButtonState extends ControlState {

	/**
	 * What a button shows of its icon and its label.
	 */
	enum DisplayMode {
		/** Only the icon is shown; the label serves as tooltip and accessible name. */
		@Name("icon-only")
		ICON_ONLY;

		/** Icon and label side by side. */
		@Name("icon-label")
		ICON_LABEL;

		/** Only the label is shown. */
		@Name("label-only")
		LABEL_ONLY;
	}

	/**
	 * How a button is drawn.
	 *
	 * The control does not send {@link #DEFAULT}: an absent appearance means the default.
	 */
	enum Appearance {
		/** The standard appearance, or the appearance the container of the button suggests. */
		@Name("default")
		DEFAULT;

		/** Emphasized, for the primary action of a dialog. */
		@Name("primary")
		PRIMARY;

		/** No frame and no fill until pointed at: for toolbars and icon buttons. */
		@Name("ghost")
		GHOST;

		/** An inline text link rather than a button. */
		@Name("link")
		LINK;
	}

	/**
	 * The kind of action a button stands for.
	 *
	 * The control does not send {@link #DEFAULT}: an absent tone means the default.
	 */
	enum Tone {
		/** An ordinary action. */
		@Name("default")
		DEFAULT;

		/** A destructive action: delete, discard, revoke. */
		@Name("danger")
		DANGER;
	}

	/**
	 * The size of a button.
	 *
	 * The control does not send {@link #DEFAULT}: an absent size means the default.
	 */
	enum Size {
		/** The standard size. */
		@Name("default")
		DEFAULT;

		/** A compact button, e.g. for a secondary inline action. */
		@Name("small")
		SMALL;
	}

	/**
	 * The label of the button.
	 */
	string label;

	/**
	 * Whether the button cannot be pressed.
	 */
	bool disabled;

	/**
	 * Whether the effect of the button's command is currently in force: the alternative chosen, or
	 * a pressed toggle. Absent when not.
	 */
	bool active;

	/**
	 * The icon of the button, the encoded form of a theme image (e.g. {@code css:fas fa-edit} for
	 * an icon font class, or the path of an image file).
	 */
	string image;

	/**
	 * An explicit tooltip (plain text), shown whatever the button displays.
	 */
	string tooltip;

	/**
	 * What the button shows of its {@link #image} and its {@link #label}. Absent: the label only.
	 */
	DisplayMode displayMode;

	/**
	 * Additional CSS classes of the button, separated by spaces.
	 */
	string cssClasses;

	/**
	 * How the button is drawn. Absent means {@link Appearance#DEFAULT}: the standard appearance, or
	 * the appearance its container suggests.
	 */
	Appearance appearance;

	/**
	 * The kind of action the button stands for. Absent means {@link Tone#DEFAULT}, an ordinary
	 * action.
	 */
	Tone tone;

	/**
	 * The size of the button. Absent means {@link Size#DEFAULT}, the standard size.
	 */
	Size size;

	/**
	 * A URL the browser navigates to on a click, instead of sending a command to the server.
	 */
	string navigateUrl;

	/**
	 * Whether {@link #navigateUrl} is opened in a browser window of its own, instead of replacing
	 * the page the button is on.
	 */
	bool navigateNewWindow;

	/**
	 * The keyboard gesture that triggers the button (e.g. {@code ENTER}, {@code Ctrl+S}).
	 */
	string keyGesture;
}

/**
 * State of a boolean field drawn as a box that is ticked or a switch that is flipped, the
 * component {@code TLCheckbox}.
 *
 * The {@link #value} is {@code true}, {@code false}, or - for a {@link #triState} field -
 * {@code null} for "no value". A change is sent as the command {@code valueChanged} with the
 * new value as argument {@code value}.
 */
message CheckboxState extends FieldState {

	/**
	 * The presentation of a boolean field.
	 *
	 * The component draws {@link #CHECKBOX} and {@link #SWITCH}; the control does not send
	 * {@link #CHECKBOX}, an absent display means a box that is ticked. {@link #SELECT} and
	 * {@link #RADIO} are presentations of a boolean offered as a choice between labelled values,
	 * which is a field choosing one object ({@link DropdownSelectState}); they are never sent to
	 * this component.
	 */
	enum Display {
		/** A box that is ticked. */
		@Name("checkbox")
		CHECKBOX;

		/** A switch that is flipped. */
		@Name("switch")
		SWITCH;

		/** A field choosing between yes and no. */
		@Name("select")
		SELECT;

		/** Radio buttons for yes and no. */
		@Name("radio")
		RADIO;
	}

	/**
	 * Whether the field has a third state for "no value". The component then shows an unset
	 * field as indeterminate and cycles through the states on click: checked, unchecked, unset.
	 */
	bool triState;

	/**
	 * The shape of the field. Absent means {@link Display#CHECKBOX}, a box that is ticked.
	 */
	Display display;
}

/**
 * A control embedded in the state of another control, rendered by the component registered
 * under its {@link #module}.
 *
 * The embedding component renders it through {@code TLChild} of 'tl-react-bridge', which mounts
 * the component with the given {@link #state} and keeps it up to date.
 */
message ChildControl {
	/**
	 * The ID of the control, the address of its commands and of the updates of its state.
	 */
	string controlId;

	/**
	 * The name of the component rendering the control (e.g. {@code TLButton}).
	 */
	string module;

	/**
	 * The initial state of the control, an object as described by the state message of its
	 * component.
	 */
	json state;

	/**
	 * The source of the view the control is the root of, for development tools. Absent for a
	 * control that is no view root.
	 */
	string viewSource;
}

/**
 * State of a toggle button, the component {@code TLToggleButton}.
 *
 * A click sends the command {@code click} to the server.
 */
message ToggleButtonState extends ControlState {
	/**
	 * The label of the button.
	 */
	string label;

	/**
	 * Whether the button is pressed.
	 */
	bool active;
}

/**
 * State properties of a field the user types a value into.
 */
message TypingFieldState extends FieldState {
	/**
	 * How long a typed value is held back before it is sent, in milliseconds. Absent: the default
	 * of the component.
	 */
	int64 debounceMs;

	/**
	 * Whether a typed value is held back until the field loses focus, instead of being sent while
	 * the user is still typing. Takes precedence over {@link #debounceMs}.
	 */
	bool sendValueOnBlur;

	/**
	 * Whether the field sends the command {@code commit} when it loses focus.
	 */
	bool commitOnBlur;
}

/**
 * State of a text field, the component {@code TLTextInput}.
 *
 * The {@link #value} is the text, a string.
 */
message TextInputState extends TypingFieldState {

	/**
	 * The kind of value a text field edits, the {@code type} of the HTML input.
	 */
	enum InputType {
		/** Plain text. */
		@Name("text")
		TEXT;

		/** A web address. */
		@Name("url")
		URL;

		/** An e-mail address. */
		@Name("email")
		EMAIL;

		/** A telephone number. */
		@Name("tel")
		TEL;

		/** A search term. */
		@Name("search")
		SEARCH;
	}

	/**
	 * The kind of value the field edits. Absent: plain text.
	 */
	InputType inputType;

	/**
	 * An icon shown inside the input ahead of the text, the encoded form of a theme image.
	 */
	string icon;

	/**
	 * Whether the input offers a button that empties it, while it holds a value.
	 */
	bool clearable;

	/**
	 * Whether the field is a text area of several lines, see {@link #rows}.
	 */
	bool multiline;

	/**
	 * The number of visible rows of a {@link #multiline} field.
	 */
	int32 rows;
}

/**
 * State of a password field, the component {@code TLPasswordInput}.
 *
 * The {@link #value} is the password typed, a string.
 */
message PasswordInputState extends TypingFieldState {
}

/**
 * State of a number field, the component {@code TLNumberInput}.
 *
 * The {@link #value} is the number written in the format of the field, a string; the text typed
 * is sent back as it is and parsed by the server.
 */
message NumberInputState extends TypingFieldState {

	/**
	 * The on-screen keyboard a number is typed on.
	 */
	enum InputMode {
		/** A whole number: digits and a sign. */
		@Name("numeric")
		NUMERIC;

		/** A number with a fraction: digits, a sign and a decimal separator. */
		@Name("decimal")
		DECIMAL;

		/** A number whose format writes words, a duration for instance. */
		@Name("text")
		TEXT;
	}

	/**
	 * The on-screen keyboard the input asks for.
	 */
	InputMode inputMode;
}

/**
 * State of a field for a date, a time of day, or both, the component {@code TLDatePicker}.
 *
 * The {@link #value} is the ISO form of the value for the HTML input of the {@link #inputType}, a
 * string (e.g. {@code 2026-06-01}, {@code 14:30}, {@code 2026-06-01T14:30}).
 */
message DatePickerState extends FieldState {

	/**
	 * The part of a point in time a field edits, the {@code type} of the HTML input.
	 */
	enum InputType {
		/** A date without a time of day. */
		@Name("date")
		DATE;

		/** A time of day without a date. */
		@Name("time")
		TIME;

		/** A date with a time of day. */
		@Name("datetime-local")
		DATE_TIME;
	}

	/**
	 * The part of a point in time the field edits.
	 */
	InputType inputType;

	/**
	 * The value written in the display format of the current user, shown while the field is not
	 * editable.
	 */
	string displayValue;
}

/**
 * State of a field choosing one value from a short list, the component {@code TLSelect}.
 *
 * The {@link #value} is the chosen value, in the JSON form of the {@link Option#value} of the
 * option naming it.
 */
message SelectState extends FieldState {

	/**
	 * A value that can be chosen.
	 */
	message Option {
		/**
		 * The value, in its JSON form.
		 */
		json value;

		/**
		 * The label of the value.
		 */
		string label;
	}

	/**
	 * The values that can be chosen. A value the field holds is among them, also where it cannot
	 * be chosen anew.
	 */
	repeated Option options;
}

/**
 * State of a field choosing one or more objects, the components {@code TLDropdownSelect} (a list
 * that opens on demand), {@code TLOptionChips} (every option a toggle of its own),
 * {@code TLSegmentedChoice} (the options as the segments of one bar) and {@code TLChoiceGroup}
 * (a radio button or a checkbox for every option).
 *
 * The {@link #value} is the list of the chosen objects, each an {@link Option} (also for a field
 * choosing one object). A change is sent as the command {@code valueChanged} with the list of the
 * {@link Option#value}s of the chosen options as argument {@code value}.
 */
message DropdownSelectState extends FieldState {

	/**
	 * The shape the options are offered in.
	 *
	 * The control does not send {@link #DROPDOWN}: an absent display means a list that opens on
	 * demand.
	 */
	enum Display {
		/** A list that opens on demand. */
		@Name("dropdown")
		DROPDOWN;

		/** Every option a toggle of its own. */
		@Name("chips")
		CHIPS;

		/** The options as the segments of one bar. */
		@Name("segmented")
		SEGMENTED;

		/**
		 * A radio button for every option, or a checkbox for every option of a field choosing
		 * several objects.
		 */
		@Name("radio")
		RADIO;
	}

	/**
	 * The direction the options of a group of radio buttons or checkboxes are laid out in.
	 *
	 * The control does not send {@link #VERTICAL}: an absent orientation means the options stand
	 * one below the other.
	 */
	enum Orientation {
		/** The options side by side, wrapping onto further lines where the room ends. */
		@Name("horizontal")
		HORIZONTAL;

		/** The options one below the other. */
		@Name("vertical")
		VERTICAL;
	}

	/**
	 * An object that can be chosen.
	 */
	message Option {
		/**
		 * The ID of the option, by which the client names it to the server.
		 */
		string value;

		/**
		 * The label of the object.
		 */
		string label;

		/**
		 * The icon of the object, the encoded form of a theme image.
		 */
		string image;

		/**
		 * The color role the object carries in the model (the external name of a value color:
		 * neutral, brand, error, …, category-8). An option with a role is drawn as a pill of that
		 * role, one without as plain text.
		 */
		string colorRole;

		/**
		 * Whether the option leads to the place the application displays the object at, when
		 * followed: the command {@code goto} with the {@link #value} as argument {@code option}.
		 * Only set on the chosen options of a field that is not editable.
		 */
		bool link;
	}

	/**
	 * The shape the options are offered in. Absent means {@link Display#DROPDOWN}, a list that
	 * opens on demand.
	 */
	Display display;

	/**
	 * The direction the options are laid out in. Only the shape {@link Display#RADIO} reads it.
	 * Absent means {@link Orientation#VERTICAL}, the options one below the other.
	 */
	Orientation orientation;

	/**
	 * The objects that can be chosen, valid while {@link #optionsLoaded} is set. A list that opens
	 * on demand asks for them with the command {@code loadOptions}.
	 */
	repeated Option options;

	/**
	 * Whether {@link #options} is up to date.
	 */
	bool optionsLoaded;

	/**
	 * Whether the chosen objects are kept in the order the user gives them, instead of being
	 * sorted.
	 */
	bool customOrder;

	/**
	 * Whether more than one object can be chosen.
	 */
	bool multiSelect;

	/**
	 * Whether the list that opens on demand offers no input to filter its options by; absent means
	 * it does. Without the input, typing the beginning of a label moves to the option it starts.
	 * Only the shape {@link Display#DROPDOWN} reads it.
	 */
	bool noFilter;

	/**
	 * The label of the choice of no object: the option of its own a group of radio buttons offers
	 * for it, the text the other shapes show while nothing is chosen.
	 */
	string emptyOptionLabel;
}

/**
 * State of a tab strip above the content of the selected tab, the component {@code TLTabBar}.
 *
 * A click on a tab sends the command {@code selectTab} with the {@link Tab#id} as argument
 * {@code tabId}.
 */
message TabBarState extends ControlState {

	/**
	 * A tab of the strip.
	 */
	message Tab {
		/**
		 * The ID of the tab.
		 */
		string id;

		/**
		 * The label of the tab.
		 */
		string label;

		/**
		 * The icon of the tab, the encoded form of a theme image.
		 */
		string icon;
	}

	/**
	 * The tabs, in the order of the strip.
	 */
	repeated Tab tabs;

	/**
	 * The {@link Tab#id} of the selected tab.
	 */
	string activeTabId;

	/**
	 * The content of the selected tab.
	 */
	ChildControl activeContent;
}

/**
 * State of a window: a frame with a title bar, a body and a footer, the component
 * {@code TLWindow}.
 *
 * Closing the window sends the command {@code close}, resizing it the command {@code resize}.
 */
message WindowState extends ControlState {
	/**
	 * The title of the window.
	 */
	string title;

	/**
	 * The width of the window, a CSS length (e.g. {@code 32rem}, {@code 640px}).
	 */
	string width;

	/**
	 * The height of the window, a CSS length. Absent: the height of the content.
	 */
	string height;

	/**
	 * The width in pixels the user gave the window when last resizing it. Absent: none remembered.
	 *
	 * Together with {@link #customHeight}, the remembered size replaces the configured
	 * {@link #width} and the automatic height, but only while it fits into the browser window: the
	 * client decides this, as only it knows the size of the browser window.
	 */
	int32 customWidth;

	/**
	 * The height in pixels the user gave the window when last resizing it. Absent: none
	 * remembered.
	 */
	int32 customHeight;

	/**
	 * Whether the user can resize the window by dragging its edges.
	 */
	bool resizable;

	/**
	 * Whether the user can close the window. Absent: closable.
	 */
	bool closable;

	/**
	 * The content of the window body.
	 */
	ChildControl child;

	/**
	 * The toolbar of the title bar. Absent: none.
	 */
	ChildControl toolbar;

	/**
	 * The toolbar of the footer. Absent: none.
	 */
	ChildControl footer;

	/**
	 * Buttons added to the window one by one.
	 */
	repeated ChildControl toolbarButtons;
}

/**
 * State of a modal surface over the page, the component {@code TLDialog}.
 *
 * Dismissing the dialog sends the command {@code close}.
 */
message DialogState extends ControlState {
	/**
	 * Whether the dialog is shown.
	 */
	bool open;

	/**
	 * Whether a click beside the dialog dismisses it. Absent: dismissed.
	 */
	bool closeOnBackdrop;

	/**
	 * Whether the user can dismiss the dialog. Absent: dismissable.
	 */
	bool closable;

	/**
	 * The content of the dialog.
	 */
	ChildControl child;
}

/**
 * State of a popup menu, the component {@code TLMenu}.
 *
 * Choosing an item sends the command {@code selectItem} with the {@link Entry#id} as argument
 * {@code itemId}; closing the menu without choosing sends the command {@code close}.
 */
message MenuState extends ControlState {

	/**
	 * The kind of an entry.
	 */
	enum EntryType {
		/** An item that can be chosen. */
		@Name("item")
		ITEM;

		/** A line between groups of entries. */
		@Name("separator")
		SEPARATOR;

		/** A caption naming the entries that follow it; it can neither be chosen nor focused. */
		@Name("header")
		HEADER;
	}

	/**
	 * An entry of the menu.
	 */
	message Entry {
		/**
		 * The kind of the entry.
		 */
		EntryType type;

		/**
		 * The ID of an item.
		 */
		string id;

		/**
		 * The label of an item or a header.
		 */
		string label;

		/**
		 * The icon of an item, the encoded form of a theme image.
		 */
		string icon;

		/**
		 * Whether the item cannot be chosen.
		 */
		bool disabled;

		/**
		 * Whether the effect of the item's command is currently in force, marking the item as the
		 * chosen one among its alternatives.
		 */
		bool active;

		/**
		 * Additional CSS classes of the item, separated by spaces.
		 */
		string cssClasses;

		/**
		 * The kind of action the item stands for. Absent means `default`, an ordinary action;
		 * `danger` marks an item whose command destroys or discards what the user has.
		 */
		ButtonState.Tone tone;
	}

	/**
	 * Whether the menu is shown.
	 */
	bool open;

	/**
	 * The ID of the element the menu is shown at. Absent while it is shown at
	 * {@link #anchorX}/{@link #anchorY}.
	 */
	string anchorId;

	/**
	 * The horizontal position in the viewport the menu is shown at, in pixels.
	 */
	int32 anchorX;

	/**
	 * The vertical position in the viewport the menu is shown at, in pixels.
	 */
	int32 anchorY;

	/**
	 * The entries of the menu.
	 */
	repeated Entry items;
}

/**
 * State of a short message at the edge of the page, the component {@code TLSnackbar}.
 *
 * Dismissing the message sends the command {@code dismiss} with the {@link #generation} of the
 * message as argument {@code generation}.
 */
message SnackbarState extends ControlState {

	/**
	 * The kind of a message.
	 */
	enum Variant {
		/** An information. */
		@Name("info")
		INFO;

		/** The report of a success. */
		@Name("success")
		SUCCESS;

		/** A warning. */
		@Name("warning")
		WARNING;

		/** The report of an error. */
		@Name("error")
		ERROR;
	}

	/**
	 * The message, plain text. Shown where there is no {@link #content}.
	 */
	@Name("message")
	string messageText;

	/**
	 * The message, HTML. Takes precedence over {@link #messageText}.
	 */
	string content;

	/**
	 * The kind of the message.
	 */
	Variant variant;

	/**
	 * The time after which the message is dismissed, in milliseconds; zero for a message that stays
	 * until it is dismissed.
	 */
	int32 duration;

	/**
	 * Whether a message is shown.
	 */
	bool visible;

	/**
	 * The number of the message shown, counting the messages this control has shown.
	 */
	int32 generation;
}

/**
 * State of a highlighted message standing in the content of a page, the component {@code TLAlert}.
 *
 * A hidden alert (see {@link ControlState#hidden}) renders nothing. Dismissing the alert sends the
 * command {@code dismiss} with the {@link #generation} of the content dismissed as argument
 * {@code generation}.
 */
message AlertState extends ControlState {
	/**
	 * The kind of the message, selecting its color and its icon. Absent: an information.
	 */
	SnackbarState.Variant variant;

	/**
	 * The heading of the message, plain text. Absent: no heading.
	 */
	string title;

	/**
	 * The message, plain text.
	 */
	@Name("message")
	string messageText;

	/**
	 * The icon of the message, the encoded form of a theme image matching the {@link #variant}.
	 */
	string icon;

	/**
	 * Whether the user can dismiss the message.
	 */
	bool closable;

	/**
	 * The buttons offering what to do about the message, in display order.
	 */
	repeated ChildControl actions;

	/**
	 * The number of the content shown, counting the contents this control has shown. A dismiss
	 * reporting another number refers to a content that is no longer shown.
	 */
	int32 generation;
}

/**
 * State of the frame around a form field, the component {@code TLFormField}: the label, the
 * marks for a required and a modified field, the error and warning messages and the help text,
 * around the control of the input itself ({@link #field}).
 *
 * The frame is not a field of its own: the value, its editability and its validation belong to the
 * embedded {@link #field}. A label that names its input states this to the input through
 * {@code FieldLabelContext} of 'tl-react-bridge'. Messages, help and the mark for a required
 * field belong to editing: the component omits them inside a read-only form layout. The
 * component sends no commands.
 */
message FormFieldState extends ControlState {

	/**
	 * Where the label of a field stands relative to its input.
	 */
	enum LabelPosition {
		/** The label beside the input. */
		@Name("side")
		SIDE;

		/** The label above the input. */
		@Name("top")
		TOP;

		/** The label after the input, e.g. trailing a checkbox. */
		@Name("after")
		AFTER;

		/**
		 * No visible label; the input spans the full width of the field. The label text still names
		 * the input for assistive technology.
		 */
		@Name("hidden")
		HIDDEN;

		/**
		 * {@link #SIDE} or {@link #TOP}, chosen from the width available. A position of a form
		 * layout, which resolves it for the fields it contains; a field is not given it.
		 */
		@Name("auto")
		AUTO;
	}

	/**
	 * The label of the field, plain text. Absent or empty: no label, and the input is not named by
	 * one.
	 */
	string label;

	/**
	 * Whether a value is required, marked next to the label.
	 */
	bool required;

	/**
	 * The message describing why the value of the {@link #field} is invalid. Absent: no error.
	 */
	string error;

	/**
	 * The icon shown in front of the {@link #error} message, the encoded form of a theme image.
	 */
	string errorIcon;

	/**
	 * The messages describing why the value of the {@link #field} is questionable, shown while
	 * there is no {@link #error}. Absent: no warnings.
	 */
	repeated string warnings;

	/**
	 * The icon shown in front of each of the {@link #warnings}, the encoded form of a theme image.
	 */
	string warningIcon;

	/**
	 * A text explaining the field, plain text, shown on demand below the input. Absent: no help.
	 */
	string helpText;

	/**
	 * A description of the field, plain text, offered as the tooltip of its label. Absent: none.
	 * A rich tooltip ({@link #hasTooltip}) takes precedence.
	 */
	string tooltipText;

	/**
	 * Whether the server offers a rich tooltip for the label, HTML fetched from the control under
	 * the key {@code tooltip} (the attribute {@code data-tooltip} with the value
	 * {@code key:tooltip}). Takes precedence over {@link #tooltipText}.
	 */
	bool hasTooltip;

	/**
	 * Whether the value of the field has been modified and not yet saved.
	 */
	bool dirty;

	/**
	 * Where the label stands relative to the input. Absent: the position the enclosing form layout
	 * gives its fields.
	 */
	LabelPosition labelPosition;

	/**
	 * Whether the field spans the full row of a form layout of several columns.
	 */
	bool fullLine;

	/**
	 * Whether the field is shown. Absent: shown. A field not shown keeps its {@link #field}
	 * mounted, so that the field control keeps receiving its updates.
	 */
	bool visible;

	/**
	 * The control of the input.
	 */
	ChildControl field;
}

/**
 * State of a read-only text, the component {@code TLText}.
 *
 * How the text is drawn is stated as roles rather than as font and color values: a typographic
 * role ({@link #variant}), a color role ({@link #tone}) and the shape it takes
 * ({@link #appearance}). The component sends no commands.
 */
message TextState extends ControlState {

	/**
	 * How text longer than the available width is displayed.
	 */
	enum Overflow {
		/** Wrapped onto several lines. */
		@Name("wrap")
		WRAP;

		/** Kept on a single line, the overflow truncated with an ellipsis. */
		@Name("ellipsis")
		ELLIPSIS;
	}

	/**
	 * What a text is for, its typographic role.
	 */
	enum Variant {
		/** Running text, the size a page is read at. */
		@Name("body")
		BODY;

		/** The heading of a section within a page. */
		@Name("title")
		TITLE;

		/** The heading a page is introduced with. */
		@Name("headline")
		HEADLINE;

		/** The largest text on a page, for the one statement a landing page is built around. */
		@Name("display")
		DISPLAY;

		/** The name of a value, shown above or beside what it names. */
		@Name("label")
		LABEL;

		/** A remark accompanying another text: a hint, a date, an attribution. */
		@Name("caption")
		CAPTION;
	}

	/**
	 * What the color of a text means, its color role.
	 */
	enum Tone {
		/** The color text is read in. */
		@Name("primary")
		PRIMARY;

		/** Text of lesser weight than what stands beside it. */
		@Name("secondary")
		SECONDARY;

		/** An explanation of the value or the field it accompanies. */
		@Name("helper")
		HELPER;

		/** Text the application draws attention to, in the color interactive elements share. */
		@Name("accent")
		ACCENT;

		/** An outcome that went well. */
		@Name("success")
		SUCCESS;

		/** A condition the reader should act on before it becomes a failure. */
		@Name("warning")
		WARNING;

		/** A failure. */
		@Name("error")
		ERROR;

		/** Text on a filled surface, which brings its own background color. */
		@Name("on-color")
		ON_COLOR;
	}

	/**
	 * The shape a text is drawn in.
	 */
	enum Appearance {
		/** Plain text, drawn as a pill when the text carries a color role of its own. */
		@Name("text")
		TEXT;

		/**
		 * A pill, whether or not the text carries a color role: a badge, a status, a tag. Its color
		 * is the color role of the text, or the color of its tone for a text without one.
		 */
		@Name("pill")
		PILL;
	}

	/**
	 * The text, plain text. Absent: empty. An empty text is never drawn as a pill.
	 */
	string text;

	/**
	 * How text longer than the available width is displayed. Absent means {@link Overflow#WRAP},
	 * wrapped onto several lines.
	 */
	Overflow overflow;

	/**
	 * The typographic role of the text. Absent means {@link Variant#BODY}, running text.
	 */
	Variant variant;

	/**
	 * The color role of the text. Absent means {@link Tone#PRIMARY}, the color text is read in.
	 */
	Tone tone;

	/**
	 * The shape the text is drawn in. Absent means {@link Appearance#TEXT}, plain text.
	 */
	Appearance appearance;

	/**
	 * The ARIA role of the element (e.g. {@code alert} for a message announced when it appears).
	 * Absent: none.
	 */
	string role;

	/**
	 * The color role the displayed value carries in the model (the external name of a value color:
	 * neutral, brand, error, …, category-8). A text with a color role is drawn as a pill of that
	 * role. Absent: none.
	 */
	string colorRole;

	/**
	 * Whether the server offers a rich tooltip for the text, HTML fetched from the control under
	 * the key {@code tooltip} (the attribute {@code data-tooltip} with the value
	 * {@code key:tooltip}).
	 */
	bool hasTooltip;
}

/**
 * State of a card: a container grouping its content visually, with an optional header, the
 * component {@code TLCard}.
 *
 * A card has no behaviour of its own (no minimizing, maximizing or popping out); it sends no
 * commands.
 */
message CardState extends ControlState {

	/**
	 * How a card sets itself off from its surroundings.
	 */
	enum Variant {
		/** A thin border. */
		@Name("outlined")
		OUTLINED;

		/** A drop shadow. */
		@Name("elevated")
		ELEVATED;
	}

	/**
	 * The space between the edge of a card and its content.
	 */
	enum Padding {
		/** The standard space. */
		@Name("default")
		DEFAULT;

		/** A reduced space. */
		@Name("compact")
		COMPACT;

		/** No space. */
		@Name("none")
		NONE;
	}

	/**
	 * The title shown in the header, plain text. Absent: no title. The header is shown while there
	 * is a title or {@link #headerActions}.
	 */
	string title;

	/**
	 * How the card sets itself off. Absent means {@link Variant#OUTLINED}, a thin border.
	 */
	Variant variant;

	/**
	 * The space around the content. Absent means {@link Padding#DEFAULT}, the standard space.
	 */
	Padding padding;

	/**
	 * The buttons in the header, in display order. Absent: none.
	 */
	repeated ChildControl headerActions;

	/**
	 * The content of the card.
	 */
	ChildControl child;
}

/**
 * State of the bar at the top of an application, the component {@code TLAppBar}: a control
 * opening it, the title, inline content, the commands placed in it and a control closing it, in
 * this order.
 *
 * The component suggests the appearance {@code ghost} to the buttons of its {@link #actions} (see
 * {@link ButtonState#appearance}). It sends no commands.
 */
message AppBarState extends ControlState {

	/**
	 * How the bar sets itself off from the content below it.
	 */
	enum Variant {
		/** A flat bar without a shadow. */
		@Name("flat")
		FLAT;

		/** A bar raised above the content by a drop shadow. */
		@Name("elevated")
		ELEVATED;
	}

	/**
	 * The text naming the application, plain text. Absent: empty.
	 */
	string title;

	/**
	 * How the bar sets itself off. Absent means {@link Variant#FLAT}, a flat bar.
	 */
	Variant variant;

	/**
	 * The control opening the bar, ahead of the title (e.g. a button opening the navigation).
	 * Absent: none.
	 */
	ChildControl leading;

	/**
	 * Inline content between the title and the {@link #actions}, in display order. Absent: none.
	 */
	repeated ChildControl children;

	/**
	 * The toolbar of the commands placed in the bar. It renders nothing while it holds no command,
	 * and folds the commands that do not fit into its overflow menu. Absent: none.
	 */
	ChildControl actions;

	/**
	 * The control closing the bar, after the {@link #actions}. Absent: none.
	 */
	ChildControl trailing;
}

/**
 * State of a navigation trail showing the current location in a hierarchy, the component
 * {@code TLBreadcrumb}.
 *
 * Every item before the last one leads back to its place: a click on it sends the command
 * {@code navigate} with the {@link Item#id} of the item as argument {@code itemId}. The last item
 * is the current location and leads nowhere.
 */
message BreadcrumbState extends ControlState {

	/**
	 * A place in the trail.
	 */
	message Item {
		/**
		 * The ID of the item, by which the client names it to the server.
		 */
		string id;

		/**
		 * The label of the item, plain text.
		 */
		string label;
	}

	/**
	 * The places from the outermost to the current location, which is the last item. Absent: none.
	 */
	repeated Item items;
}

/**
 * State of a bar displaying a fraction, with an optional label beside it, the component
 * {@code TLProgress}.
 *
 * The component sends no commands.
 */
message ProgressState extends ControlState {
	/**
	 * The filled part of the track, a number between 0 and 1. Absent or {@code null}: the
	 * indeterminate bar, which says that something is going on without saying how far it has come.
	 */
	double fraction;

	/**
	 * The text beside the bar, plain text (e.g. {@code 3 / 4}). Absent: the bar stands alone.
	 */
	string label;
}

/**
 * State of a number field set by dragging a handle along a track, the component
 * {@code TLSlider}.
 *
 * The {@link #value} is the number itself, or {@code null} for a field holding no value; the
 * handle of an empty field stands at the {@link #min} and no text is shown. A change is sent as
 * the command {@code valueChanged} with the number the handle stands on as argument
 * {@code value}, once the handle comes to rest.
 */
message SliderState extends FieldState {
	/**
	 * The smallest value the handle can stand on. Absent: 0.
	 */
	double min;

	/**
	 * The largest value the handle can stand on. Absent: 100.
	 */
	double max;

	/**
	 * The distance between two values the handle can stand on. Absent: 1.
	 */
	double step;

	/**
	 * The value written in the format of the field, plain text, shown beside the handle and as the
	 * whole display of a field that is not editable. Absent: no text.
	 */
	string valueLabel;

	/**
	 * How long a value is held back after the handle last moved before it is sent, in
	 * milliseconds; releasing the handle sends it at once. Absent: the default of the component.
	 */
	int64 debounceMs;
}
