com.top_logic.tl.ai.core.agent.AllAgentNamesGenerator = Generator für alle Agentennamen
com.top_logic.tl.ai.core.agent.AllAgentNamesGenerator.tooltip = <i>Listengenerator-Adapter</i>, der alle verfügbaren Agentennamen als Optionen bereitstellt. <p> Verwendet als <options> Generator für das Delegations-Attribut von tl.ai.core:Agent. </p>
com.top_logic.tl.ai.core.agent.AllMcpServerNamesGenerator = Generator für alle mcp-Servernamen
