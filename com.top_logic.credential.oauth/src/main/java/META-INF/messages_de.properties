com.top_logic.credential.oauth.ClientSecretAuthentication.Config.method = Übertragungsart
com.top_logic.credential.oauth.ClientSecretAuthentication.Config.method.tooltip = Wie das Secret an den Autorisierungsserver gesendet wird.
