<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Markdown link parser tests</title>
    <style>
        body { font-family: monospace; padding: 1em; }
        .case { border-bottom: 1px solid #ccc; padding: 0.5em 0; }
        .label { font-weight: bold; }
        .input { color: #555; white-space: pre; }
        .output { padding-left: 1em; }
        .pass { color: green; }
        .fail { color: red; }
    </style>
</head>
<body>
    <h1>Markdown link parser test cases</h1>
    <p>Each case shows input, rendered output, and PASS/FAIL based on expected HTML.</p>
    <div id="cases"></div>

    <script>
        const Utils = {
            escapeHtml(s) {
                return String(s)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }
        };

        // Real Markdown.basicFormat — must stay in sync with chat-client.js.
        const Markdown = {
            _safeHref(url) {
                if (!url) return null;
                if (/[\s\x00-\x1f\x7f]/.test(url)) return null;
                if (url.startsWith('/')) return url;
                if (/^https?:\/\//i.test(url)) return url;
                return null;
            },

            _anchor(text, url) {
                const safe = this._safeHref(url);
                if (safe == null) return text;
                const hrefAttr = safe.replace(/"/g, '&quot;');
                return '<a href="' + hrefAttr + '" target="_blank" rel="noopener noreferrer">' + text + '</a>';
            },

            basicFormat(text) {
                if (!text) return '';
                let html = Utils.escapeHtml(text);
                html = html.replace(/```(\w*)\n([\s\S]*?)```/g,
                    (_, lang, code) => '<pre><code class="language-' + (lang || 'text') + '">' + code + '</code></pre>');
                html = html.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, linkText, url) => {
                    return this._anchor(linkText, url);
                });
                html = html.replace(/(^|[\s(])((?:https?:\/\/)[^\s<>"')]+)/g, (match, lead, url) => {
                    return lead + this._anchor(url, url);
                });
                html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
                html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
                html = html.replace(/\n\n/g, '</p><p>');
                html = '<p>' + html + '</p>';
                html = html.replace(/\n/g, '<br>');
                return html;
            }
        };

        const cases = [
            {
                label: 'Relative same-origin link',
                input: 'Open [the report](/ai-html/abc123) please',
                expectContains: '<a href="/ai-html/abc123" target="_blank" rel="noopener noreferrer">the report</a>'
            },
            {
                label: 'HTTPS absolute link',
                input: 'Visit [our site](https://example.com)',
                expectContains: '<a href="https://example.com" target="_blank" rel="noopener noreferrer">our site</a>'
            },
            {
                label: 'javascript: URL must NOT become an anchor',
                input: 'click [here](javascript:alert(1))',
                expectNotContains: '<a'
            },
            {
                label: 'data: URL must NOT become an anchor',
                input: 'see [this](data:text/html,<script>)',
                expectNotContains: '<a'
            },
            {
                label: 'Bare https URL autolinks',
                input: 'see https://example.com',
                expectContains: '<a href="https://example.com"'
            },
            {
                label: 'Multiple links on one line',
                input: '[a](/x) and [b](/y)',
                expectContains: '<a href="/y"'
            },
            {
                label: 'Link text containing HTML chars is escaped',
                input: '[<script>](/safe)',
                expectContains: '&lt;script&gt;'
            }
        ];

        const container = document.getElementById('cases');
        for (const c of cases) {
            const div = document.createElement('div');
            div.className = 'case';
            const html = Markdown.basicFormat(c.input);
            let pass;
            if (c.expectContains) {
                pass = html.includes(c.expectContains);
            } else if (c.expectNotContains) {
                pass = !html.includes(c.expectNotContains);
            }
            div.innerHTML =
                '<div class="label">' + c.label + ' &mdash; <span class="' + (pass ? 'pass' : 'fail') + '">' +
                    (pass ? 'PASS' : 'FAIL') + '</span></div>' +
                '<div class="input">in:  ' + Utils.escapeHtml(c.input) + '</div>' +
                '<div class="output">out: <code>' + Utils.escapeHtml(html) + '</code></div>' +
                '<div class="output">rendered: ' + html + '</div>';
            container.appendChild(div);
        }
    </script>
</body>
</html>
