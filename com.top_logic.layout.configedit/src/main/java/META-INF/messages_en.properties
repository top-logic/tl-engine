com.top_logic.layout.configedit.ConfigControlService.ProviderMapping.type.tooltip = The Java type of the property value this mapping applies to.
com.top_logic.layout.configedit.ConfigControlService.tooltip = Service resolving the input control for a configuration property. <p> Resolves a property whose value can go into a single widget: directly by its Java type, by selecting from a fixed set of options, or as text through a value provider that can turn the value into text and back. createModel and createControl both reject any property that fits none of those - see checkSupportedKind's own JavaDoc for exactly which <i>property kinds</i> that excludes and why. Such a property (a structure, a collection, or a <i>complex</i> property with only a value binding and no format) is rendered by a dedicated nested editor or type selector before this service is ever asked. </p> <p> createModel decides the value domain: a property that is not specialized and whose Java type one of the built-in widgets handles directly - String, boolean, a numeric type, or Date - gets the plain, typed <i>configuration field model</i>; otherwise a property edited by selecting (an option list, or an enum) gets a <i>configuration select field model</i>; everything else with a value provider gets the format-aware <i>configuration format field model</i> (text). </p> <p> createControl then resolves the widget: </p> <ol> <li>@Encrypted always wins, deliberately ahead of every other step - see below.</li> <li><i>Configuration control</i> annotation on the property or on its value type.</li> <li>A <i>configuration select field model</i> gets a select.</li> <li>The value-type-to-provider map configured in this service.</li> <li>The built-in fallback: the direct widget for a non-specialized property whose type createModel also treated as directly editable, otherwise text parsed and formatted through the property's own ConfigurationValueProvider.</li> </ol> <p> @Encrypted runs before the <i>configuration control</i> annotation, not just before the built-in steps: a module may override the control for a property, but it must never be able to make a secret readable by choosing a control that displays it in the clear. This is a deliberate security decision on its own terms, independent of the specialization veto below. </p> <p> The specialization veto is why a property with its own format is never handed to the "direct" widget for its Java type: a Date formatted as a time of day is edited through that format as text, not in a date picker that could not show or accept a time - the same defect DatePickerControlProvider was fixed against on the model-attribute side. </p> <p> The configured map is what lets a module above this one contribute a control - the TL-Script editor, for instance, lives in tl-model-search-react. </p>
