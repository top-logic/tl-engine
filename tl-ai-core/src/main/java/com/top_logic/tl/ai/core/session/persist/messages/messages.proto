package com.top_logic.tl.ai.core.session.persist.messages;

option NoBinary;
option NoVisit;
option NoListener;
option NoInterfaces;
option NoXml;

/** Token usage breakdown. */
message TokenUsageDto {
	/** Input tokens. */
	int inputTokens;

	/** Output tokens. */
	int outputTokens;

	/** Thinking tokens. */
	int thinkingTokens;

	/** Cache read tokens. */
	int cacheReadTokens;

	/** Cache write tokens. */
	int cacheWriteTokens;
}

/** A complete conversation in the turn-based persistence format. */
message PersistedConversationV2 {
	/** The turns in this conversation. */
	repeated PersistedTurn turns;

	/** Session metadata. */
	SessionMetadataV2 metadata;
}

/** A single turn in a conversation, representing one user-assistant exchange. */
message PersistedTurn {
	/** Unique turn identifier. */
	string id;

	/** Sequential turn number within the conversation. */
	int turnNumber;

	/** Timestamp when this turn started. */
	long timestamp;

	/** The model used for this turn. */
	string model;

	/** The provider used for this turn. */
	string provider;

	/** Token usage for this turn. */
	TokenUsageDto usage;

	/** Parts contributed by the user in this turn. */
	repeated PersistedPart userParts;

	/** Parts contributed by the assistant in this turn. */
	repeated PersistedPart assistantParts;

	/** Server-rendered HTML of the assistant's text content. Computed at load time, not persisted. */
	string contentHtml;
}

/** A single part within a turn, representing one atomic piece of content. */
message PersistedPart {
	/** Unique part identifier. */
	string id;

	/** Timestamp when this part was created. */
	long timestamp;

	/** Discriminator for the part type. */
	string type;

	/** Text content data. */
	TextPartDto textData;

	/** Thinking/reasoning data. */
	ThinkingPartDto thinkingData;

	/** Tool call data. */
	ToolCallPartDto toolCallData;

	/** Approval request data. */
	ApprovalPartDto approvalData;

	/** User interaction data. */
	InteractionPartDto interactionData;

	/** Context compaction data. */
	CompactionPartDto compactionData;

	/** Error data. */
	ErrorPartDto errorData;

	/** Transaction data. */
	TransactionPartDto transactionData;

	/** Agent delegation data. */
	DelegationPartDto delegationData;

	/** System event data. */
	SystemPartDto systemData;
}

/** Text content part. */
message TextPartDto {
	/** The text content. */
	string text;
}

/** Thinking/reasoning content part. */
message ThinkingPartDto {
	/** The thinking text. */
	string text;

	/** Opaque provider token for multi-turn continuity (signature / encrypted_content). */
	string continuityToken;
}

/** Tool call part with invocation details and result. */
message ToolCallPartDto {
	/** Name of the tool that was called. */
	string toolName;

	/** JSON-encoded arguments passed to the tool. */
	string argsJson;

	/** Execution status of the tool call. */
	string status;

	/** The result returned by the tool. */
	string result;

	/** Reference to an externally stored result. */
	string resultRef;

	/** Error message if the tool call failed. */
	string errorMessage;

	/** Reason the tool call was denied. */
	string denyReason;

	/** Duration of the tool call in milliseconds. */
	long durationMs;
}

/** Approval request part for tool calls requiring user confirmation. */
message ApprovalPartDto {
	/** ID of the tool call requiring approval. */
	string toolCallId;

	/** Name of the tool requiring approval. */
	string toolName;

	/** JSON-encoded arguments for the tool call. */
	string argsJson;

	/** Reason displayed to the user for the approval request. */
	string displayReason;

	/** The user's decision. */
	string decision;

	/** Optional comment from the user. */
	string userComment;

	/** Timestamp when the approval was resolved. */
	long resolvedAt;
}

/** User interaction part for questions posed to the user. */
message InteractionPartDto {
	/** Type of interaction. */
	string interactionType;

	/** The question posed to the user. */
	string question;

	/** Optional header text. */
	string header;

	/** Available options for the user to choose from. */
	repeated string options;

	/** Whether multiple options can be selected. */
	boolean multiSelect;

	/** The user's response. */
	string userResponse;

	/** Timestamp when the interaction was resolved. */
	long resolvedAt;
}

/** Context compaction event part. */
message CompactionPartDto {
	/** Token count before compaction. */
	int tokensBefore;

	/** Token count after compaction. */
	int tokensAfter;

	/** What triggered the compaction. */
	string trigger;
}

/** Error event part. */
message ErrorPartDto {
	/** The kind of error. */
	string kind;

	/** The error message text. */
	string errorMessage;
}

/** Transaction event part. */
message TransactionPartDto {
	/** The transaction type. */
	string type;

	/** The revision number. */
	long revisionNumber;

	/** Optional reason for the transaction. */
	string reason;
}

/** Agent delegation part. */
message DelegationPartDto {
	/** The agent delegating the task. */
	string fromAgent;

	/** The agent receiving the task. */
	string toAgent;

	/** Summary of the input given to the delegate. */
	string inputSummary;

	/** Summary of the result from the delegate. */
	string resultSummary;

	/** Session ID of the child agent session. */
	string childSessionId;

	/** Duration of the delegation in milliseconds. */
	long durationMs;

	/** Nested child parts from the sub-agent's execution. */
	repeated PersistedPart childParts;

	/** Number of LLM iterations the sub-agent executed, or -1 if unknown. */
	int turnsUsed;

	/** Cumulative token usage of the sub-agent. */
	TokenUsageDto totalUsage;

	/** Why the sub-agent stopped (e.g. COMPLETE, MAX_TURNS, ERROR). */
	string stopReason;
}

/** System event part. */
message SystemPartDto {
	/** The type of system event. */
	string eventType;

	/** Optional details about the event. */
	string details;
}

/** Session metadata for the turn-based persistence format. */
message SessionMetadataV2 {
	/** Tool names approved for this session. */
	repeated string approvedTools;

	/** Cumulative token usage across all turns. */
	TokenUsageDto cumulativeUsage;

	/** Last model used. */
	string lastModel;

	/** Last provider used. */
	string lastProvider;

	/** The approval mode for the session. */
	string approvalMode;
}
