com.top_logic.tl.ai.core.provider.openai.OpenAIProviderConfig.Config.api-key = Api-Schlüssel
com.top_logic.tl.ai.core.provider.openai.OpenAIProviderConfig.Config.api-key.tooltip = Der API-Schlüssel für die <code>OpenAI</code>.
com.top_logic.tl.ai.core.provider.openai.OpenAIProviderConfig.tooltip = <i>LLM-Anbieterkonfiguration</i> für die <code>OpenAI</code>.
