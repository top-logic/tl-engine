com.top_logic.ai.demo.secdemo.SecDemoSetupService = Service zur Einrichtung von Sicherheitsdemonstrationen
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.component-access = Zugriff auf Komponenten
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.component-access.tooltip = Die Ansichten (Layout-Komponenten), die die Demo-Rollen öffnen dürfen, im Format der Datei „WEB-INF/conf/security.xml“ der Engine. <p> Zugriffsrechte allein reichen nicht aus, um eine Anwendung nutzbar zu machen: Eine Rolle, die einen Typ lesen darf, sieht dennoch keine Registerkarte, solange sie keine Befehlsgruppe im übergeordneten <i>zusammengesetzten Sicherheitslayout</i> besitzt. Genau das wird bei den Demo-Rollen bereitgestellt. </p> <p> Im Gegensatz zum Import der Engine werden die Einträge hier <em>additiv</em> angewendet: Der Zugriff außerhalb dieser Konfiguration bleibt unberührt, sodass die mitgelieferte Demo unbeeinträchtigt bleibt, solange der Aspekt deaktiviert ist. </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.initial-password = Anfangspasswort
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.initial-password.tooltip = Passwort, das den Demokonten bei ihrer Erstellung zugewiesen wird. <p> Es muss den Passwortrichtlinien des konfigurierten Authentifizierungsgeräts entsprechen (standardmäßig: mindestens 8 Zeichen aus mindestens zwei Zeichenklassen). </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.tooltip = Richtet die Testumgebung für den End-to-End-Sicherheitstest des Agenten ein: zwei Demokonten, deren Gruppenzugehörigkeiten, die Rollenzuweisungen am Sicherheitsstamm, den Komponentenzugriff (Layout), den die Demorollen benötigen, um auf den Agent-Chat zuzugreifen, sowie eine Handvoll Beispielinstanzen. <p> Der Dienst wird nur gestartet, wenn der Opt-in-Eintrag WEB-INF/conf/secdemo.config.xml in der Datei WEB-INF/conf/metaConf.txt aufgeführt ist. Alle Schritte sind idempotent, sodass ein Neustart der Anwendung keine Duplikate erzeugt. </p> <p> Die Rollen selbst werden durch <i>„initial roles“</i> angelegt, die Gruppen durch <i>„initial groups“</i>; beides wird im selben Aspekt konfiguriert. Was noch übrig bleibt – die Zuordnung einer Rolle zu einer Gruppe <em>im Sicherheitsstamm</em> und die Erstellung von Konten – hat in der Engine keine deklarative Entsprechung, daher dieser Dienst. </p> <p> Das Gleiche gilt für den Komponentenzugriff. Die Engine liest die Zugriffskonfiguration deklarativ aus der Datei „WEB-INF/conf/security.xml“ (<i>Einrichtung der Zugriffskonfiguration</i>) aus, doch dieser Pfad ist fest vorgegeben, und der Import <em>setzt</em> die Zugriffsrechte jeder Ansicht in der Anwendung <em>zurück</em>, bevor die Datei angewendet wird. Ein Opt-in-Aspekt darf dies nicht tun; daher wendet dieser Dienst genau dasselbe Format <i>der Zugriffskonfiguration</i> zusätzlich an. </p>
