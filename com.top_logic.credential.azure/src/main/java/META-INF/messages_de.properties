class.com.top_logic.credential.azure.I18NConstants.ERROR_IDENTITY_ENDPOINT_UNREACHABLE__URL = Der Endpunkt der verwalteten Identität „{0}“ ist nicht erreichbar. Die Anwendung läuft nicht in Azure, oder der Endpunkt ist von ihr aus nicht zugänglich.
class.com.top_logic.credential.azure.I18NConstants.ERROR_INVALID_URL__URL = Die URL „{0}“ ist ungültig.
class.com.top_logic.credential.azure.I18NConstants.ERROR_MALFORMED_RESPONSE__URL = Die Antwort von „{0}“ ist fehlerhaft.
class.com.top_logic.credential.azure.I18NConstants.ERROR_SECRET_EMPTY__NAME_VAULT = Das Geheimnis „{0}“ im Key Vault „{1}“ hat keinen Wert.
class.com.top_logic.credential.azure.I18NConstants.ERROR_SECRET_REQUEST_FAILED__NAME_VAULT_STATUS_DETAIL = Das Lesen des Geheimnisses „{0}“ aus dem Key Vault „{1}“ ist fehlgeschlagen (HTTP-Status {2}). {3}
class.com.top_logic.credential.azure.I18NConstants.ERROR_TOKEN_REQUEST_FAILED__RESOURCE_URL_STATUS_DETAIL = Der Endpunkt der verwalteten Identität „{1}“ hat kein Zugriffstoken für die Ressource „{0}“ ausgestellt (HTTP-Status {2}). {3}
class.com.top_logic.credential.azure.I18NConstants.ERROR_VAULT_UNREACHABLE__URL = Der Key Vault „{0}“ ist nicht erreichbar.
com.top_logic.credential.azure.AzureRestConfig.connect-timeout = Verbindungs-Timeout
com.top_logic.credential.azure.AzureRestConfig.connect-timeout.tooltip = Maximale Zeit für den Aufbau einer Verbindung zum Endpunkt.
com.top_logic.credential.azure.AzureRestConfig.request-timeout = Anfrage-Timeout
com.top_logic.credential.azure.AzureRestConfig.request-timeout.tooltip = Maximale Zeit für eine Anfrage an den Endpunkt, bis die Antwort empfangen ist.
com.top_logic.credential.azure.KeyVaultSecretSource = Geheimnis aus Azure Key Vault
com.top_logic.credential.azure.KeyVaultSecretSource.Config.cache-time = Cache-Dauer
com.top_logic.credential.azure.KeyVaultSecretSource.Config.cache-time.tooltip = Zeit, die ein aus dem Key Vault gelesenes Geheimnis verwendet wird, bevor es erneut gelesen wird. <p> Ein im Key Vault rotiertes Geheimnis wird spätestens nach dieser Zeit wirksam. </p>
com.top_logic.credential.azure.KeyVaultSecretSource.Config.credentials = Zugangsdaten
com.top_logic.credential.azure.KeyVaultSecretSource.Config.credentials.tooltip = Zugangsdaten für die Anfragen an den Key Vault. <p> Ohne Angabe wird die verwaltete Identität der Maschine oder App verwendet, siehe <i>Azure Managed Identity</i>. </p>
com.top_logic.credential.azure.KeyVaultSecretSource.Config.secret-name = Name des Geheimnisses
com.top_logic.credential.azure.KeyVaultSecretSource.Config.secret-name.tooltip = Name des Geheimnisses im Key Vault.
com.top_logic.credential.azure.KeyVaultSecretSource.Config.secret-version = Version des Geheimnisses
com.top_logic.credential.azure.KeyVaultSecretSource.Config.secret-version.tooltip = Version des Geheimnisses. <p> Ohne Angabe wird die aktuelle Version gelesen, sodass eine neue Version nach Ablauf der Cache-Dauer wirksam wird. </p>
com.top_logic.credential.azure.KeyVaultSecretSource.Config.vault-url = Key-Vault-URL
com.top_logic.credential.azure.KeyVaultSecretSource.Config.vault-url.tooltip = URL des Key Vaults, z. B. <code>https://my-vault.vault.azure.net</code>.
com.top_logic.credential.azure.KeyVaultSecretSource.tooltip = <i>Geheimnisquelle</i>, die ein Geheimnis aus Azure Key Vault liest. <p> Die Anwendung authentifiziert sich beim Key Vault mit einem Zugriffstoken, standardmäßig mit ihrer verwalteten Identität (siehe <i>Azure Managed Identity</i>), sodass die Konfiguration nur angibt, wo das Geheimnis liegt. Die Identität benötigt die Rolle „Key Vault Secrets User“ auf dem Key Vault oder dem Geheimnis. </p> <p> Das Geheimnis wird für die konfigurierte Cache-Dauer behalten und danach erneut gelesen, sodass ein im Key Vault rotiertes Geheimnis ohne Neustart der Anwendung wirksam wird. </p> <p> Ein API-Schlüssel, gelesen aus dem Key Vault mit der systemseitig zugewiesenen verwalteten Identität: </p><pre> &lt;secret class="com.top_logic.credential.azure.KeyVaultSecretSource" vault-url="https://my-vault.vault.azure.net" secret-name="openai-api-key" /&gt; </pre> <p> Mit einer benutzerseitig zugewiesenen verwalteten Identität werden die Zugangsdaten explizit angegeben: </p><pre> &lt;secret class="com.top_logic.credential.azure.KeyVaultSecretSource" vault-url="https://my-vault.vault.azure.net" secret-name="openai-api-key" &gt; &lt;credentials class="com.top_logic.credential.azure.ManagedIdentityCredentials" resource="https://vault.azure.net" client-id="00000000-0000-0000-0000-000000000000" /&gt; &lt;/secret&gt; </pre>
com.top_logic.credential.azure.ManagedIdentityCredentials = Azure Managed Identity
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.client-id = Client-ID
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.client-id.tooltip = Client-ID der zu verwendenden benutzerseitig zugewiesenen verwalteten Identität. <p> Ohne Angabe wird die systemseitig zugewiesene Identität verwendet, oder die einzige benutzerseitig zugewiesene Identität, wenn es keine systemseitig zugewiesene gibt. </p>
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.endpoint = Endpunkt
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.endpoint.tooltip = URL eines Token-Endpunkts, der wie der Instance Metadata Service antwortet. <p> Ohne Angabe wird der Endpunkt automatisch bestimmt: der in der Umgebung eines App Service, einer Function oder einer Container App bekanntgegebene Endpunkt, sonst der Instance Metadata Service. </p>
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.max-attempts = Maximale Versuche
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.max-attempts.tooltip = Maximale Anzahl an Versuchen einer Token-Anfrage, die mit einem vorübergehenden Fehler beantwortet wird.
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.renewal-margin = Erneuerungsvorlauf
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.renewal-margin.tooltip = Zeit vor dem Ende der Lebensdauer eines Zugriffstokens, zu der es erneuert wird. <p> Als Vorlauf wird höchstens die halbe Lebensdauer des Tokens verwendet. </p>
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.resource = Ressource
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.resource.tooltip = Kennung des Azure-Dienstes, für den das Token angefordert wird, z. B. <code>https://cognitiveservices.azure.com</code> für Azure AI Services oder <code>https://vault.azure.net</code> für Azure Key Vault.
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.retry-delay = Wartezeit vor Wiederholung
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.retry-delay.tooltip = Wartezeit vor dem zweiten Versuch einer Token-Anfrage. Die Zeit verdoppelt sich mit jedem weiteren Versuch.
com.top_logic.credential.azure.ManagedIdentityCredentials.tooltip = <i>Zugangsdaten-Anbieter</i>, der Anfragen mit einem Zugriffstoken der verwalteten Identität (Managed Identity) der Azure-Maschine oder -App authentifiziert, auf der die Anwendung läuft. <p> Azure stellt das Token für die Identität aus, die der virtuellen Maschine, dem App Service, der Function oder der Container App zugewiesen ist, sodass die Anwendung selbst keinerlei Geheimnis besitzt. Der Zugriff wird der Identität in Azure gewährt (Rollenzuweisung), z. B. die Rolle <code>Cognitive Services OpenAI User</code> für ein in Azure AI Services bereitgestelltes Sprachmodell. </p> <p> Das Token wird vom Identitäts-Endpunkt der Plattform geholt: In einem App Service, einer Function oder einer Container App gibt die Plattform den Endpunkt in den Umgebungsvariablen <code>IDENTITY_ENDPOINT</code> und <code>IDENTITY_HEADER</code> bekannt. Sonst, z. B. auf einer virtuellen Maschine oder in einem Scale Set, kommt das Token vom Instance Metadata Service (IMDS) unter <code>http://169.254.169.254</code>. Das Token wird zwischengespeichert und vor seinem Ablauf erneuert (siehe <i>Token-Cache</i>). </p> <p> Ein Sprachmodell in Azure AI Services mit der systemseitig zugewiesenen Identität: </p> <pre> &lt;credentials class="com.top_logic.credential.azure.ManagedIdentityCredentials" resource="https://cognitiveservices.azure.com" /&gt; </pre> <p> Bei einer benutzerseitig zugewiesenen Identität wählt deren Client-ID sie aus: </p> <pre> &lt;credentials class="com.top_logic.credential.azure.ManagedIdentityCredentials" resource="https://cognitiveservices.azure.com" client-id="00000000-0000-0000-0000-000000000000" /&gt; </pre> <p> Im Azure Kubernetes Service (AKS) authentifiziert sich ein Pod stattdessen mit Workload Identity: Sein projiziertes Service-Account-Token wird bei Microsoft Entra ID mit dem <i>OAuth-Client-Credentials</i>-Anbieter gegen ein Zugriffstoken getauscht. Dabei werden die Variablen <code>AZURE_TENANT_ID</code>, <code>AZURE_CLIENT_ID</code> und <code>AZURE_FEDERATED_TOKEN_FILE</code> verwendet, die der Workload-Identity-Webhook im Pod setzt. Die Konfiguration referenziert sie über Aliase, die in der Anwendungskonfiguration definiert sind: </p> <pre> &lt;alias&gt; &lt;entry name="%AZURE_TENANT_ID%" value="${env:AZURE_TENANT_ID}"/&gt; &lt;entry name="%AZURE_CLIENT_ID%" value="${env:AZURE_CLIENT_ID}"/&gt; &lt;entry name="%AZURE_FEDERATED_TOKEN_FILE%" value="${env:AZURE_FEDERATED_TOKEN_FILE}"/&gt; &lt;/alias&gt; </pre> <pre> &lt;credentials class="com.top_logic.credential.oauth.ClientCredentialsProvider" token-url="https://login.microsoftonline.com/%AZURE_TENANT_ID%/oauth2/v2.0/token" client-id="%AZURE_CLIENT_ID%" scope="https://cognitiveservices.azure.com/.default" &gt; &lt;client-authentication class="com.top_logic.credential.oauth.ClientAssertionAuthentication"&gt; &lt;assertion class="com.top_logic.basic.credential.FileSecretSource" path="%AZURE_FEDERATED_TOKEN_FILE%"/&gt; &lt;/client-authentication&gt; &lt;/credentials&gt; </pre> <p> Eine Anfrage, die mit einem Status beantwortet wird, den Azure als vorübergehend dokumentiert (404 und 410 während der Metadata Service aktualisiert wird, 429 bei Drosselung, 5xx), wird einige Male mit wachsendem Abstand wiederholt. Ein überhaupt nicht erreichbarer Endpunkt wird sofort gemeldet, da die Anwendung dann nicht in Azure läuft. </p>
