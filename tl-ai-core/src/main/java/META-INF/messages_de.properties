com.top_logic.tl.ai.core.agent.AllModelNamesGenerator = Generator für alle Modellnamen
com.top_logic.tl.ai.core.agent.AllModelNamesGenerator.tooltip = <i>Listengenerator-Adapter</i>, der explizit konfigurierte AI-Modellnamen als Optionen bereitstellt. <p> Gibt nur Modelle zurück, die ein Administrator zur Liste der erlaubten Modelle eines Anbieters hinzugefügt hat, und schließt Modelle aus, die lediglich über die Anbieter-API entdeckt wurden. Verwendet als <options> Generator für das Model-Attribut von tl.ai.core:Agent. </p>
com.top_logic.tl.ai.core.agent.AllSkillNamesGenerator = Generator für alle Skill-Namen
com.top_logic.tl.ai.core.agent.AllSkillNamesGenerator.tooltip = <i>Listengenerator-Adapter</i>, der alle verfügbaren Skill-Namen als Optionen bereitstellt. <p> Wird als <options> Generator für das Skills-Attribut von tl.ai.core:Agent verwendet. </p>
