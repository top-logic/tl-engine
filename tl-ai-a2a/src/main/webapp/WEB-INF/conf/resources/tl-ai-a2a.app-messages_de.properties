admin.ai.tool.a2a.askAgent = Fragt einen entfernten Agenten einer anderen Anwendung über das A2A-Protokoll und wartet auf seine Antwort.
admin.ai.tool.a2a.fetchArtifact = Liest ein A2A-Artefakt über seine Referenz, ganz oder einen Abschnitt davon.
admin.ai.tool.a2a.getAgentTask = Wartet auf eine Aufgabe, die bei einem entfernten Agenten gestartet wurde und noch läuft, und liefert ihre Antwort.
admin.ai.tool.a2a.listAgentConversations = Listet die Gespräche auf, die diese Unterhaltung mit entfernten Agenten offen hat.
admin.ai.tool.a2a.listAgents = Listet die entfernten Agenten anderer Anwendungen auf, die diese Anwendung über das A2A-Protokoll fragen darf.
admin.ai.tool.a2a.replyAgent = Beantwortet eine Frage eines entfernten Agenten und wartet auf seine nächste Antwort.
