com.top_logic.xio.importer.handlers.XMLPropertyImport.Config.target-var.tooltip = Name der Variable, aus der das Kontextobjekt entnommen werden soll.
com.top_logic.xio.importer.handlers.XMLPropertyImport.tooltip = Liest das aktuelle Element und setzt seine XML-Darstellung in der angegebenen Eigenschaft.
