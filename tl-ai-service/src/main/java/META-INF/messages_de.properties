com.top_logic.ai.service.agents.AgentRegistry.Config.skills.tooltip = Die konfigurierten Fertigkeiten, geordnet nach dem Namen der Fertigkeit. <p> Jeder Eintrag definiert einen wiederverwendbaren Skill mit seiner Beschreibung und seinem Prompt-Inhalt. Skills werden �ber den Namen von <i>Skills</i><i>(Agentenkonfiguration</i>) referenziert. </p>
com.top_logic.ai.service.agents.AgentRegistry.tooltip = Register der zur Laufzeit konfigurierbaren Agenten und F�higkeiten. <p> Jeder Agent wird in XML �ber die <i>Agentenkonfiguration</i> deklariert und enth�lt seinen LLM-Modellnamen, optionale Denkparameter, Systemaufforderung, Werkzeuge und F�higkeiten. Skills werden �ber die <i>Skill-Konfiguration</i> deklariert. Dieser Dienst validiert die Konfigurationen beim Start und bietet Factory-Methoden, um daraus vollst�ndig verdrahtete <i>LangChain4j-Agenten</i> zu erstellen. </p> <p> Die Modellbildung ist anbieterabh�ngig: Wenn das referenzierte Modell von einem bekannten Anbieter bereitgestellt wird<i>(anthropic chat model factory</i>, <i>mistral chat model factory</i>, <i>open AI chat model factory</i>), werden die Parameter des Agenten (Denken, Temperatur, maximale Token) auf eine neue, ungepoolte Modellinstanz angewendet. Andernfalls wird das gepoolte Modell des <i>KI-Dienstes</i> als Fallback zur�ckgegeben. </p>
