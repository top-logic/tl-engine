com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.bearer-token-env-var.tooltip = Name einer Umgebungsvariablen, die ein Bearer-Token enthält. <p> Die Variable wird bei der Verbindungsherstellung aus der Serverumgebung ausgelesen und ihr Wert wird im Authorization-Header unter Verwendung des Bearer-Schemas gesendet. So bleibt das Geheimnis selbst außerhalb der Konfiguration. </p>
