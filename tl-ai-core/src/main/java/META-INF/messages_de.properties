com.top_logic.tl.ai.core.provider.chatcompletions.TokenLimitParam.tooltip = JSON-Feldname, der das Output-Token-Limit in einem Chat Completions-Anfragekörper enthält. <p>Die Chat Completions API hat bisher max_tokens verwendet, aber GPT-5 und o-series reasoning models lehnen dies ab und verlangen max_completion_tokens (was auch versteckte reasoning tokens berücksichtigt). Andere <code>OpenAI</code> Backends (Mistral, <code>xAI</code>, lokale Server) verstehen nur max_tokens, so dass der Feldname per Anbietervoreinstellung wählbar ist.</p>
com.top_logic.tl.ai.core.provider.health.FailoverConfig = Failover-Konfiguration
com.top_logic.tl.ai.core.provider.health.FailoverConfig$Chain = Kette
com.top_logic.tl.ai.core.provider.health.FailoverConfig$Chain.tooltip = Wohin die Durchläufe eines Modells gelangen, wenn es keine Antwort liefern kann, in der Reihenfolge.
com.top_logic.tl.ai.core.provider.health.FailoverConfig$Target = Ziel
com.top_logic.tl.ai.core.provider.health.FailoverConfig$Target.tooltip = Ein Modell in einer Fallback-Kette.
com.top_logic.tl.ai.core.provider.health.FailoverConfig.Chain.fallbacks = Ausweichlösungen
com.top_logic.tl.ai.core.provider.health.FailoverConfig.Chain.fallbacks.tooltip = Die Modelle, die stattdessen ausprobiert werden sollen, in der angegebenen Reihenfolge. <p> Sie werden ab dem ersten Modell nacheinander ausprobiert, wobei diejenigen übersprungen werden, die selbst markiert sind. Eine Kette, deren Einträge alle markiert sind, führt zu einem Fehlschlag des Durchlaufs mit dem Fehler des letzten Modells, das tatsächlich aufgerufen wurde. </p>
com.top_logic.tl.ai.core.provider.health.FailoverConfig.Chain.name.tooltip = Das Modell, aus dem diese Kette herausführt.
com.top_logic.tl.ai.core.provider.health.FailoverConfig.Target.model = Modell
com.top_logic.tl.ai.core.provider.health.FailoverConfig.Target.model.tooltip = Das Modell, das stattdessen ausgeführt werden soll. <p> Der entscheidende Punkt ist die Anbieterunabhängigkeit: Die Tool-Schemas, das Antwortformat und die Stichprobenoptionen werden für jeden Anbieter, der dieses Modell bereitstellt, neu angepasst. </p>
com.top_logic.tl.ai.core.provider.health.FailoverConfig.Target.provider = Anbieter
com.top_logic.tl.ai.core.provider.health.FailoverConfig.Target.provider.tooltip = Der konfigurierte Anbieter, der <i>das Modell</i> bereitstellen muss, oder leer, wenn der einzige Anbieter des Modells dieses bereitstellt. <p> Genau dort benötigt, wo die Agentenausführung es benötigt: Ein Modell, für das zwei Anbieter-Einträge verfügbar sind, muss angeben, welcher davon gemeint ist. </p>
com.top_logic.tl.ai.core.provider.health.FailoverConfig.capacity-ttl-seconds = Lebensdauer der Kapazitätsmarkierung (s)
com.top_logic.tl.ai.core.provider.health.FailoverConfig.capacity-ttl-seconds.tooltip = Wie lange eine <i>Kapazitäts</i> markierung in Sekunden gültig ist. <p> Ratenbegrenzung und Überlastungsumgehung erfolgen innerhalb von Sekunden, und die dem Lauf eigene Backoff-Phase hat die kurzen Ausfälle bereits abgewartet, bis ein Fehler hier eintritt. Lang genug, um den Rest des Laufs auf ein anderes Modell zu verlagern, kurz genug, damit die nächste Konversation dort beginnt, wo sie konfiguriert wurde. </p>
com.top_logic.tl.ai.core.provider.health.FailoverConfig.chains = Ketten
com.top_logic.tl.ai.core.provider.health.FailoverConfig.chains.tooltip = Die Fallback-Ketten, sortiert nach dem Modell, aus dem sie herausführen. <p> Ein Modell, das nicht aufgeführt ist, verfügt über kein Fallback – dies ist die Standardeinstellung für jedes Modell. </p>
com.top_logic.tl.ai.core.provider.health.FailoverConfig.quota-ttl-seconds = Lebensdauer der Quotenmarke (s)
com.top_logic.tl.ai.core.provider.health.FailoverConfig.quota-ttl-seconds.tooltip = Wie lange eine <i>Quoten</i> markierung in Sekunden gültig bleibt. <p> Ein aufgebrauchtes Budget oder ein abgelehnter Schlüssel erholt sich nicht von selbst, daher ist diese Einstellung auf einen längeren Zeitraum ausgelegt: standardmäßig einen Tag, was über die täglichen Zeitfenster hinausgeht, nach denen die Anbieter die Quoten zurücksetzen. Der Wert 0 sorgt dafür, dass die Markierung so lange gültig bleibt, bis ein Administrator sie zurücksetzt – dies ist die richtige Einstellung, wenn jemand die Quoten überwacht. </p>
com.top_logic.tl.ai.core.provider.health.FailoverConfig.rate-limit-wait-seconds = Wartezeit bei Ratenbegrenzung (s)
com.top_logic.tl.ai.core.provider.health.FailoverConfig.rate-limit-wait-seconds.tooltip = Wie lange ein Agent insgesamt in Sekunden auf ein Modell wartet, das mit „zu viele Anfragen“ (HTTP 429) antwortet, bevor seine Runde fehlschlägt. <p> Der Agent fragt erneut mit zunehmend längeren Pausen an, jedoch nie früher, als es der Dienst des Modells vorsieht, und der Chat zeigt dem Nutzer an, dass er wartet. Stellen Sie diesen Wert auf mindestens die Zeit ein, die eine Anfrage des langsamsten Modells benötigt: Was das Modell aufhält, ist in der Regel eine weitere Anfrage mit demselben Schlüssel. Ein Durchlauf, dessen Modell eine Fallback-Kette hat, wartet nicht so lange – er wechselt nach seinen Wiederholungsversuchen zum Fallback. </p>
com.top_logic.tl.ai.core.provider.health.FailoverConfig.tooltip = Wohin ein Lauf geleitet wird, wenn das Modell, mit dem er konfiguriert wurde, keine Antwort liefern kann. <p> Standardmäßig leer, und ein leerer Abschnitt ändert nichts: Ein Lauf, der sein Modell verliert, schlägt genauso fehl wie zuvor. Eine Installation, in der ein Fallback angegeben ist, bewirkt ein anderes Verhalten – der Lauf wird auf dem nächsten funktionsfähigen Modell der Kette fortgesetzt, und der Wechsel wird im Lauf protokolliert, sodass ein Operator erkennen kann, warum der Lauf an einer anderen Stelle als der konfigurierten endete. </p> <p> Die Kette wird anhand <em>des Modellnamens</em> ermittelt, unabhängig davon, welcher Anbieter sie bereitstellt: Bei einem Fallback geht es um das Modell, das ein Agent angefordert hat, und die Agenten, die dasselbe Modell anfordern, erwarten denselben Ausweg. Ein Fallback-Eintrag kann seinen eigenen Anbieter benennen; auf diese Weise wird dasselbe Modell, das von zwei Konten – oder von Anthropic und Bedrock – bereitgestellt wird, zu einem Fallback für sich selbst. </p>
com.top_logic.tl.ai.core.provider.health.FailoverConfig.transient-ttl-seconds = Lebensdauer der transienten Markierung (s)
com.top_logic.tl.ai.core.provider.health.FailoverConfig.transient-ttl-seconds.tooltip = Wie lange eine <i>vorübergehende</i> Markierung anhält, in Sekunden. <p> Eine so schwache Markierung blockiert ein Modell niemals vollständig – sie kostet das Modell einen Versuch pro Runde –, daher bestimmt ihre Lebensdauer lediglich, wie lange der Fehler im Gedächtnis bleibt. </p>
com.top_logic.tl.ai.core.provider.health.HealthCause = Grund des Modellzustands
com.top_logic.tl.ai.core.provider.health.HealthCause.CAPACITY = Kapazität
com.top_logic.tl.ai.core.provider.health.HealthCause.CAPACITY.tooltip = Das Modell ist vorhanden, hat aber derzeit keinen Platz – es ist durch eine Ratenbegrenzung eingeschränkt oder überlastet. <p> Es regeneriert sich innerhalb von Sekunden von selbst, daher hat die Markierung eine kurze TTL, anstatt auf einen Administrator zu warten. </p>
com.top_logic.tl.ai.core.provider.health.HealthCause.QUOTA = Quote
com.top_logic.tl.ai.core.provider.health.HealthCause.QUOTA.tooltip = Das Konto kann dieses Modell überhaupt nicht nutzen – das Kontingent ist aufgebraucht oder der Schlüssel wurde abgelehnt. <p> Nichts, was diese Anwendung tut, kann das beheben, daher ist die Markierung dauerhaft: Sie bleibt bestehen, bis die konfigurierte lange TTL abgelaufen ist oder ein Administrator sie zurücksetzt. </p>
com.top_logic.tl.ai.core.provider.health.HealthCause.TRANSIENT = Vorübergehend
com.top_logic.tl.ai.core.provider.health.HealthCause.TRANSIENT.tooltip = Ein Aufruf ist aus einem nicht identifizierten Grund fehlgeschlagen. <p> Die schwächste Aussage: Das Modell bleibt einmal pro Runde einsatzfähig, sodass eine einzelne fehlerhafte Verbindung weder ein funktionierendes Modell umgeht noch einen sich wiederholenden Fehler verbirgt. </p>
com.top_logic.tl.ai.core.provider.health.HealthCause.tooltip = Warum ein Modell als „unhealthy“ gekennzeichnet wird und wie stark diese Aussage ist. <p> Die Reihenfolge der Konstanten entspricht der Reihenfolge der Stärke: Eine Markierung ersetzt eine aktive Markierung nur dann, wenn ihr Grund mindestens ebenso stark ist. Dadurch wird verhindert, dass eine vorübergehende Schwankung eine noch geltende Quoten-Sperre aufhebt – siehe <code>ModelAvailability#reportFailure</code>. </p>
com.top_logic.tl.ai.core.provider.local.LocalProviderConfig = Lokal (OpenAI-kompatibel)
com.top_logic.tl.ai.core.provider.local.LocalProviderConfig.tooltip = <i>LLM-Anbieterkonfiguration</i> für lokale <code>OpenAI</code> Server (Ollama, LM Studio, <code>vLLM</code>). <p> Die Basis-URL ist obligatorisch und es ist kein API-Schlüssel erforderlich. Lokale Server sprechen das <code>OpenAI</code> Chat Completions-Protokoll (/v1/chat/completions), daher erzeugt diese Konfiguration einen <i>Chat Completions-Anbieter</i>. </p>
com.top_logic.tl.ai.core.provider.mistral.MistralProviderConfig = Mistral
com.top_logic.tl.ai.core.provider.mistral.MistralProviderConfig.Config.api-key = Api-Schlüssel
com.top_logic.tl.ai.core.provider.mistral.MistralProviderConfig.Config.api-key.tooltip = Der API-Schlüssel für die Mistral-Authentifizierung.
com.top_logic.tl.ai.core.provider.mistral.MistralProviderConfig.tooltip = <i>LLM-Anbieterkonfiguration</i> für die Mistral AI API.
com.top_logic.tl.ai.core.provider.openai.AzureOpenAIProviderConfig = Azure OpenAI
com.top_logic.tl.ai.core.provider.openai.AzureOpenAIProviderConfig.Config.api-key = Api-Schlüssel
com.top_logic.tl.ai.core.provider.openai.AzureOpenAIProviderConfig.Config.api-key.tooltip = Der API-Schlüssel für die Authentifizierung. <p>Bei Azure <code>OpenAI</code> mit <i>api key</i> ist dies der Azure-Abonnementschlüssel. Bei Gateway-Bereitstellungen mit <i>Bearer</i> ist dies das Bearer-Token.</p>
com.top_logic.tl.ai.core.provider.openai.AzureOpenAIProviderConfig.Config.api-version = API-Version
com.top_logic.tl.ai.core.provider.openai.AzureOpenAIProviderConfig.Config.api-version.tooltip = Der Abfrageparameter api-version, der bei jeder Anfrage gesendet wird. <p>Der Standardwert ist 2024-10-21. Dies ist die Version, die von Nexus GPT und Carina Chat-Gateways sowie von Azure <code>OpenAI</code> benötigt wird.</p>
com.top_logic.tl.ai.core.provider.openai.AzureOpenAIProviderConfig.Config.auth-scheme = Auth-Schema
com.top_logic.tl.ai.core.provider.openai.AzureOpenAIProviderConfig.Config.auth-scheme.tooltip = Das HTTP-Authentifizierungsschema, das zum Senden des API-Schlüssels verwendet wird. <p>Bei <i>Bearer</i> (Standardeinstellung) wird der Schlüssel in den Authorization-Header gesetzt, was den Erwartungen der Nexus- und Carina-Gateways entspricht. Bei <i>Api key</i> wird er in den api-key-Header gesetzt, was von echten Azure-<code>OpenAI</code>-Ressourcenendpunkten verlangt wird.</p> <p>Wird für Zugangsdaten nicht verwendet, die ihren Header selbst bestimmen.</p>
com.top_logic.tl.ai.core.provider.openai.AzureOpenAIProviderConfig.tooltip = <i>LLM-Anbieterkonfigurationsvorgabe</i> für Azure <code>OpenAI</code> Chatvervollständigungsbereitstellungsendpunkte. <p> Konfiguriert einen <i>Chat Completions-Anbieter</i> mit dem Azure-spezifischen Bereitstellungspfad {model}, einem Abfrageparameter für die API-Version und einem auswählbaren Authentifizierungsschema<i>(Bearer</i> für Gateways wie Nexus GPT / Carina Chat; <i>API-Schlüssel</i> für echte Azure <code>OpenAI</code> ). Auf Azure ist kein Endpunkt für die Modellauflistung verfügbar, so dass die Modelle manuell zur Modellliste hinzugefügt werden müssen. </p>
com.top_logic.tl.ai.core.provider.openai.OpenAICompatibleProviderConfig = OpenAI-kompatibel
com.top_logic.tl.ai.core.provider.openai.OpenAICompatibleProviderConfig.Config.api-key = Api-Schlüssel
com.top_logic.tl.ai.core.provider.openai.OpenAICompatibleProviderConfig.Config.api-key.tooltip = Der API-Schlüssel für die Authentifizierung. <p> Optional - einige Dienste verwenden andere Authentifizierungsmechanismen. </p>
com.top_logic.tl.ai.core.provider.openai.OpenAICompatibleProviderConfig.tooltip = <i>LLM-Anbieterkonfiguration</i> für Dienste von Drittanbietern, die das Protokoll <code>OpenAI</code> Chat Completions" implementieren. <p> Im Gegensatz zu <i>OpenAI</i> ist die Basis-URL obligatorisch (es gibt keinen sinnvollen Standard). Der API-Schlüssel ist optional, da einige Dienste andere Authentifizierungsmechanismen verwenden. Erzeugt einen <i>Anbieter für Chatvervollständigungen</i> mit dem Ziel /v1/chat/completions. </p>
com.top_logic.tl.ai.core.provider.openai.OpenAIProviderConfig = OpenAI
com.top_logic.tl.ai.core.provider.openai.OpenAIProviderConfig.Config.api-key = Api-Schlüssel
com.top_logic.tl.ai.core.provider.openai.OpenAIProviderConfig.Config.api-key.tooltip = Der API-Schlüssel für die <code>OpenAI</code>.
com.top_logic.tl.ai.core.provider.openai.OpenAIProviderConfig.tooltip = <i>LLM-Anbieterkonfiguration</i> für die <code>OpenAI</code>.
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig = xAI
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig$Protocol = Protokoll
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig$Protocol.tooltip = Leitungsprotokoll, das für die Kommunikation mit dem Endpunkt <code>xAI</code> zu verwenden ist.
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Config.api-key = Api-Schlüssel
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Config.api-key.tooltip = Der API-Schlüssel für die <code>xAI</code>.
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Config.protocol = Protokoll
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Config.protocol.tooltip = Das Drahtprotokoll, das bei der Kommunikation mit dem Endpunkt <code>xAI</code> verwendet werden soll. <p> <i>Chatvervollständigungen</i> erzeugt einen <i>Anbieter für Chatvervollständigungen</i>; <i>Antworten</i> erzeugt einen <i>Anbieter für OpenAI-Antworten</i>. </p>
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Protocol.CHAT_COMPLETIONS = Chat-Completions
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Protocol.CHAT_COMPLETIONS.tooltip = <code>OpenAI</code> Protokoll für Chatabschlüsse (/v1/chat/completions, SSE mit [DONE]).
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Protocol.RESPONSES = Responses
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Protocol.RESPONSES.tooltip = <code>OpenAI</code> Antwortprotokoll (/v1/responses, ereignistypische SSE).
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.tooltip = <i>LLM-Anbieterkonfiguration</i> für die <code>xAI</code> (Grok) API. <p> Die <code>xAI</code> unterstützt sowohl das <code>OpenAI</code> für Chatabschlüsse (/v1/chat/completions) als auch das <code>OpenAI</code> für Antworten (/v1/responses). Verwenden Sie <i>Protokoll</i>, um das Leitungsformat auszuwählen. Die Standardeinstellung ist " <i>Chat Completions"</i>. </p>
com.top_logic.tl.ai.core.research.ResearchRuns = Recherchen
com.top_logic.tl.ai.core.research.ResearchRuns.tooltip = Speichert Recherchen als Objekte vom Typ <i>Recherche</i>. <p> <b>In einer eigenen Transaktion, auf einem eigenen Thread</b>: Der Lauf, der seinen Bericht speichert, kann eine offene Transaktion für die Schreibvorgänge eines früheren Tool-Aufrufs halten, und ein Bericht, der darin geschrieben würde, würde mit diesem Durchgang zurückgerollt. Der Aufrufer wartet auf das Schreiben. </p> <p> <b>Einmal je Lead-Lauf.</b> Ein Lead-Lauf, der seinen Bericht ein zweites Mal speichert - weil die erste Antwort zu spät kam oder weil er den Bericht neu geschrieben hat -, ersetzt, was er zuvor gespeichert hat; er speichert nie eine zweite Recherche. Die Schreibvorgänge laufen nacheinander auf einem Thread, sodass ein zweiter Aufruf, der kommt, während der erste noch geschrieben wird, die Recherche des ersten findet. </p> <p> <b>Nur für seinen Eigentümer.</b> Die Recherche wird mit dem Konto, für das sie lief, als Eigentümer geschrieben; die Rollenregeln in tl-ai-core.binarySecurity.config.xml lassen dieses Konto, und nur dieses, die Recherche, ihre Teile und die archivierten Seiten lesen, auf die sie verweisen. Administratoren lesen ohnehin alles. </p>
com.top_logic.tl.ai.core.screenshots.ScreenshotService = Screenshot-Dienst
com.top_logic.tl.ai.core.screenshots.ScreenshotService.tooltip = Dienst, der <i>Screenshot-Geschäftsobjekte</i> (ein aufgenommenes PNG-Bild sowie dessen Metadaten) dauerhaft speichert. <p> Er ähnelt dem „GeneratedHtmlPageService“ in seiner Struktur, mit einem bewussten Unterschied: Er eröffnet <b>keine</b> eigene Transaktion. Screenshots werden durch das Verb „browserScreenshot“ erstellt, ein DATA_WRITE-Tool, dessen Transaktion durch den <i>Transaktionsbereich</i> der Agentenschleife (die „Tool-Transaktionsnaht“) eröffnet und bestätigt wird. Das Erstellen des Objekts in dieser umgebenden Transaktion gewährleistet, dass der Screenshot atomar mit dem Rest des Durchlaufs bleibt – er wird festgeschrieben, wenn der Durchlauf festgeschrieben wird, und zurückgesetzt, wenn der Durchlauf zurückgesetzt wird. Programmatische Aufrufer (und Tests) stellen daher ihre eigene Transaktion um den Aufruf zur Erstellung des Screenshots herum bereit. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChat = Agenten-Chat
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChat.param.agentName.tooltip = Der Name des Agenten, wie er in der Wissensbasis konfiguriert ist.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChat.param.userMessage.tooltip = Die Benutzernachricht, die an den Agenten gesendet werden soll.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChat.return = Die letzte Textantwort des Agenten.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChat.tooltip = Führt einen benannten Agenten aus dem <i>Agenten-Factory</i> -Register mit einer einzelnen Benutzernachricht aus. <p> Der Agent wird anhand seines Namens aus den Instanzen des Modells „tl.ai.core:Agent“ ermittelt. Für jeden Aufruf wird eine neue <i>Konversation</i> erstellt; zwischen den Aufrufen wird kein Konversationsverlauf beibehalten. </p> <p> Die gesamte Agentenschleife läuft inline auf dem aufrufenden Thread und blockiert, bis der Durchlauf beendet ist, was mehrere Minuten dauern kann. Wird der Agent aus einer Anfrage heraus aufgerufen, hält er diese Anfrage (und den zugehörigen Servlet-Thread) für die gesamte Laufzeit fest. </p> <p><b>Nicht über die Skriptkonsole nutzbar. Verwenden Sie dort <i>„agentChatAsync</i> “.</b> Eine Anfrage fixiert die Revision der Wissensdatenbank, bei der sie gestartet wurde, und ein Inline-Lauf schreibt über diese hinaus: Die eigenen<i>Agent-Sitzungs- und Ausführungsdatensätze</i> des Laufs werden außerhalb des Arbeitsstroms im Schreib-Thread <i>des Agent-Ausführungsspeichers</i> festgeschrieben, und jedes vom Agenten aufgerufene Schreib-Tool führt ebenfalls eine Festschreibung durch. Es reicht daher aus, den Lauf lediglich aufzuzeichnen. Wenn die Konsole anschließend die Ergebniszeile rendert, lehnt der Cache die nun veraltete Revision der Anfrage ab, und die Anfrage schlägt mit einer „KnowledgeBaseRuntimeException“ fehl: „Session-Revision ungültig: Erwartet 95, aber 89 erhalten“ (die Revisionsnummern variieren) – nachdem der Agent seine Arbeit bereits erledigt hat. Das Symptom ist ein langes Hängenbleiben, gefolgt von einem internen Fehler, nicht ein verlorener Lauf. </p> <p> Das Zurücklesen eines asynchronen Laufs erfordert eine <b>zweite</b> Konsolenausführung: Innerhalb der Anfrage, die ihn gestartet hat, gibt <i>agentRunStatus</i> aus demselben Grund der Revisionsfestlegung null (nicht RUNNING) zurück, egal wie lange das Skript wartet. Siehe <i>agentChatAsync</i>. </p> <p> Es wird mit dem Konto agiert, das das Skript ausgeführt hat: Der <i>Tool-Kontext</i> des Laufs wird für den Benutzer erstellt, der an den aufrufenden Thread gebunden ist; daher wird jeder Tool-Aufruf anhand der Rollen dieses Kontos autorisiert und der Modellzugriff anhand der Rechte dieses Kontos geprüft, und der Aufruf wird sofort abgelehnt, wenn der aufrufende Thread keinen Benutzer hat. Es gibt keinen uneingeschränkten Modus, auf den zurückgegriffen werden kann. Ein Skript verfügt über keine Genehmigungsoberfläche, daher werden die Tool-Aufrufe, zu denen das Konto berechtigt ist, automatisch genehmigt, anstatt von einem Menschen bestätigt zu werden. </p> <p> Anwendungsbeispiel in TL-Script: </p><pre> aiAgentChat("my-agent", "Fasse die neuesten Änderungen zusammen.") </pre>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChatAsync = Asynchroner Agent-Chat
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChatAsync.param.agentName.tooltip = Der in der Wissensdatenbank konfigurierte Name des Agenten.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChatAsync.param.userMessage.tooltip = Die Benutzermeldung, die an den Agenten gesendet werden soll.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChatAsync.return = Die persistente ID der Sitzung als <i>String</i> -Handle, über das Status und Ergebnis abgefragt werden können.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChatAsync.tooltip = Startet einen benannten Agenten in einem Hintergrund-Thread und kehrt sofort mit einem Handle zurück. <p> Im Gegensatz zu <i>`agentChat`</i>, das die Agentenschleife synchron im aufrufenden Thread ausführt und so lange blockiert, bis sie beendet ist, übergibt diese Funktion den Lauf an den <i>Scheduler-Dienst</i> und kehrt sofort zurück. Der Rückgabewert ist die persistente ID der Sitzung als einfacher <i>String-Handle</i>: Abfragen mit <i>`agentRunStatus`</i> und <i>`agentRunResult`</i>, um den Fortschritt zu verfolgen und das Transkript abzurufen, sobald der Lauf abgeschlossen ist. </p> <p> Der Hintergrundlauf kehrt in die Untersitzung des aufrufenden Benutzers zurück (die hier synchron auf dem aufrufenden Thread erfasst wird, da sie nicht threadübergreifend gelesen werden kann), sodass der Agent und seine Tools als dieser Benutzer mit dessen Berechtigungen agieren. Eine <i>Agentensitzung vom</i> Typ „BACKGROUND“ wird im Voraus erstellt, sodass der Aufrufer stets ein verwendbares Handle erhält; der Ausführungsdatensatz wird vor dem ersten Modellaufruf erstellt, sobald die Schleife beginnt, und bei Beendigung mit Status und Protokoll abgeschlossen (auch im Fehlerfall, der als „ERROR“ protokolliert wird). </p> <p><b>Warnung – unbeaufsichtigte automatische Genehmigung:</b> Bei einem Hintergrundlauf ist kein Mensch vorhanden, der Aufforderungen zur Tool-Genehmigung beantworten kann, daher wird jeder Tool-Aufruf automatisch genehmigt. Ein asynchroner Lauf kann daher beliebige schreibende/destruktive Tool-Aktionen (Daten löschen, externe Systeme aufrufen, …) unbeaufsichtigt ausführen. Starten Sie asynchrone Läufe nur für Agenten, denen Sie vertrauen, dass sie ohne Aufsicht handeln. Eine Anwendung, die eine Tool-Zugriffsrichtlinie konfiguriert hat, kann dies einschränken: Der Lauf wird zusätzlich auf die Hintergrund-Whitelist dieser Richtlinie beschränkt, gerade weil die Freigabe die Kontrollmöglichkeit ist, die ihr entzogen wurde. </p> <p><b>Vorbehalt – getrennte Transaktion:</b> Der Hintergrundlauf führt das Commit in einer eigenen Transaktion durch, unabhängig von der des Aufrufers. Er kann die noch nicht festgeschriebenen Änderungen des Aufrufers nicht sehen, und wenn diese Funktion aus einer Geschäftstransaktion heraus aufgerufen wird, die später zurückgesetzt wird, ist der Agent (und seine Nebenwirkungen) dennoch bereits ausgeführt worden. </p> <p><b>Frage das Handle in einer separaten Anfrage ab.</b> Die Ausführung bleibt für den Rest der Anfrage, die sie gestartet hat, unsichtbar, egal wie lange diese Anfrage im Wartezustand verbleibt: Die Sitzung wurde mit einer Revision committet, die neuer ist als die festgelegte Revision dieser Anfrage, sodass das Handle hier nicht aufgelöst wird und <i>`agentRunStatus`</i> null zurückgibt – nicht `RUNNING`. In der Skriptkonsole bedeutet dies zwei Ausführungen: Eine startet den Lauf und behält das Handle, eine spätere liest Status und Ergebnis aus. Übertragen Sie das Handle mit `storeInSession`/`loadFromSession` oder fügen Sie es in das Folgeskript ein. </p> <p> Anwendungsbeispiel in TL-Script. Die erste Ausführung startet den Lauf und behält das Handle: </p> <pre> { handle = aiAgentChatAsync("my-agent", "Summarize the latest changes."); $handle.storeInSession(key: "my-run"); $handle; } </pre> <p> Eine spätere Ausführung liest diesen, sobald der Lauf beendet ist, wieder ein: </p> <pre> { handle = loadFromSession("my-run"); aiAgentRunStatus($handle) == "COMPLETE" ? aiAgentRunResult($handle) : null; } </pre>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunCancel = Agentenlauf abbrechen
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunCancel.param.handle.tooltip = Die von <i>agentChatAsync</i> zurückgegebene Zeichenfolge „session-id“ – entweder direkt eine <i>Agent-Sitzung</i>, direkt eine <i>Agent-Ausführung</i> oder eine „run-id“-Zeichenfolge.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunCancel.return = „true“, wenn ein noch laufender Durchlauf zum Abbruch markiert wurde; „false“, wenn das Handle nicht aufgelöst werden konnte oder der Durchlauf bereits beendet war.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunCancel.tooltip = Fordert die Abbruch eines laufenden asynchronen Agentenlaufs an, der mit ` <i>agentChatAsync</i>` gestartet wurde. <p> Cluster-sicher: Das Handle wird auf die oberste Ausführungsebene aufgelöst, und die persistente Abbruchmarkierung des Laufs wird gesetzt und festgeschrieben – ein normaler KB-Schreibvorgang, der von jedem Knoten aus funktioniert, sodass der Knoten, der den Abbruch empfängt, nicht unbedingt der Knoten sein muss, auf dem der Job ausgeführt wird. Der ausführende Knoten erkennt die Markierung bei seinem nächsten Durchlauf der Agent-Schleife und bricht den Lauf ab, der daraufhin mit dem Status „CANCELLED“ abgeschlossen wird. Die Abbruchverarbeitung erfolgt somit asynchron: Rufen Sie <i>`agentRunStatus`</i> ab, um zu beobachten, wann der Lauf den Status „CANCELLED“ erreicht. </p> <p> Eine No-Op-Operation für einen Lauf, der bereits einen Endzustand erreicht hat (es gibt nichts mehr abzusagen). </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunError = Fehler beim Ausführen des Agenten
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunError.param.handle.tooltip = Die von <i>agentChatAsync</i> zurückgegebene Zeichenfolge „session-id“ – entweder direkt eine <i>Agent-Sitzung</i>, direkt eine <i>Agent-Ausführung</i> oder eine „run-id“-Zeichenfolge.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunError.return = Die protokollierte Fehlermeldung oder „null“, falls keine vorliegt.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunError.tooltip = Gibt zurück, was bei einem asynchronen Agentenlauf schiefgelaufen ist, ohne den Fehler auszulösen. <p> Dies ist die Fehlermeldung, <i>die `agentRunResult`</i> auslösen würde: die vom Provider selbst generierte Meldung für einen Lauf, der am Modell gescheitert ist, die Ausnahmemeldung für einen Lauf, der davor oder dabei gescheitert ist, sowie `null` für einen Lauf, der noch läuft oder erfolgreich war. Verwenden Sie diese Funktion, wenn das Skript den Fehler aufzeichnen oder anzeigen soll, anstatt dadurch gestoppt zu werden. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunResult = Ergebnis des Agentenlaufs
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunResult.param.handle.tooltip = Die von <i>agentChatAsync</i> zurückgegebene Zeichenfolge „session-id“ – entweder direkt eine <i>Agent-Sitzung</i>, direkt eine <i>Agent-Ausführung</i> oder eine „run-id“-Zeichenfolge.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunResult.return = Der endgültige Antworttext, wenn der Durchlauf ABGESCHLOSSEN ist, andernfalls null.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunResult.tooltip = Gibt die endgültige Antwort eines asynchronen Agentenlaufs zurück, sobald dieser <i>abgeschlossen</i> ist. <p> Dies entspricht dem synchronen <i>agentChat</i>: Es wird dieselbe „final-answer“-Zeichenkette zurückgegeben, die agentChat für den Durchlauf zurückgegeben hätte – also die dauerhaft gespeicherte Antwort, nicht das Transkript. Verwenden Sie <i>„agentRunTranscript“</i>, um das vollständige Konversationsprotokoll abzurufen. Bevor der Lauf abgeschlossen ist – oder falls er in einem anderen Status als „COMPLETE“ beendet wurde – gibt diese Funktion „null“ zurück; verwenden Sie <i>„agentRunStatus“</i>, um die verschiedenen Fälle zu unterscheiden. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunStatus = Status der Agentenausführung
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunStatus.param.handle.tooltip = Die von <i>agentChatAsync</i> zurückgegebene Zeichenfolge „session-id“ – entweder direkt eine <i>Agent-Sitzung</i>, direkt eine <i>Agent-Ausführung</i> oder eine „run-id“-Zeichenfolge.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunStatus.return = Der Statusname oder „null“, falls das Handle keinem Lauf zugeordnet werden kann.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunStatus.tooltip = Gibt den Status eines mit ` <i>agentChatAsync</i>` gestarteten asynchronen Agentenlaufs zurück. <p> Der Status entspricht einem der <i>Ausführungsstatusnamen</i> (RUNNING, COMPLETE, ERROR, CANCELLED, REJECTED). Solange der Lauf noch in der Warteschlange steht oder seine Aufzeichnung im aufrufenden Thread noch nicht sichtbar ist, wird „RUNNING“ zurückgegeben. </p> <p><b>Nicht in der Anfrage, die den Lauf gestartet hat.</b> Wird dies aus derselben Anfrage wie <i>„agentChatAsync“</i> aufgerufen, wird „null“ anstelle von „RUNNING“ zurückgegeben, unabhängig davon, wie lange das Skript dazwischen wartet: Die Sitzung des Durchlaufs wurde in einer neueren Revision als der festgehaltenen dieser Anfrage festgeschrieben, sodass das Handle dort zu nichts führt und ein nicht auflösbares Handle nicht als „läuft“ gemeldet werden kann. Abfrage aus einer späteren Anfrage, d. h. aus einer separaten Ausführung in der Skriptkonsole. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunTranscript = Protokoll des Agent-Laufs
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunTranscript.param.handle.tooltip = Die von <i>agentChatAsync</i> zurückgegebene Zeichenfolge „session-id“ – entweder direkt eine <i>Agent-Sitzung</i>, direkt eine <i>Agent-Ausführung</i> oder eine „run-id“-Zeichenfolge.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunTranscript.return = Das serialisierte Transkript oder „null“, falls der Handle nicht aufgelöst werden kann oder noch kein Transkript aufgezeichnet wurde.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunTranscript.tooltip = Gibt das vollständige Konversationsprotokoll (Transkript) eines asynchronen Agentenlaufs zurück. <p> Das Protokoll ist das serialisierte Konversationsprotokoll pro Durchlauf (wie vom <i>Konversationsprotokoll-Serializer</i> erzeugt). Solange der Durchlauf noch im Status „RUNNING“ ist, enthält es die Daten, die der Durchlauf bei seinem letzten Tool-Aufruf, seiner letzten Genehmigungsanfrage oder dem Abschluss einer Iteration aufgezeichnet hat; davor ist der Wert null. Das vollständige Transkript wird geschrieben, sobald der Lauf einen Endzustand erreicht, einschließlich „ERROR“ und „CANCELLED“, wobei das Teilprotokoll hier die nützlichste Diagnose darstellt. Um nur die endgültige Antwort des Agenten abzurufen, verwenden Sie <i>„agentRunResult</i>“. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool = Tool aufrufen
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool.param.parameters.tooltip = Eine Zuordnung von Parameternamen zu Werten oder null, wenn das Tool keine Parameter hat.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool.param.toolName.tooltip = Der qualifizierte Name des aufzurufenden Tools.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool.return = Das Ergebnis der Ausführung des Tools in Form einer Zeichenkette.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool.tooltip = Ruft ein Tool manuell mit den angegebenen Parametern auf. <p> Diese Funktion ermöglicht den direkten Aufruf von registrierten Tools aus TL-Script. Das Tool wird durch seinen qualifizierten Namen im Format Fabrik-Name.Tool-Name identifiziert. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat = Chat
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.param.messages.tooltip = Eine Liste von Nachrichten. Jede Nachricht kann sein: <ul> <li>Zeichenkette: Wird als Benutzertextnachricht behandelt</li> <li>Karte mit "Rolle" und "Inhalt": Explizite Rolle (System/Benutzer/Assistent). Der Inhalt kann eine Zeichenkette, binäre Daten oder eine Liste mit gemischtem Inhalt sein.</li> <li>Binäre Daten: Werden als Bild-/Dokumentennachricht des Benutzers behandelt</li> </ul>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.param.model.tooltip = Der zu verwendende Modellname oder null, um das in <i>Agenten-Laufzeit</i> konfigurierte Standardmodell zu verwenden.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.param.responseFormat.tooltip = Die Spezifikation des Antwortformats. Kann sein: <ul> <li>Null: Keine spezifische Formatanforderung</li> <li>Zeichenfolge "text" oder "json": Einfacher Formattyp</li> <li>Karte mit den Feldern "name" und "schema", die ein JSON-Schema für eine strukturierte Ausgabe beschreiben.</li> </ul>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.param.tools.tooltip = Eine Sammlung qualifizierter Toolnamen, die dem KI-Agenten zur Verfügung gestellt werden sollen (z. B. ["mytools.calculateSum", "texttools.formatText"]), oder null, um keine Tools bereitzustellen.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.return = Der Antworttext des Assistenten.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.tooltip = Sendet eine Multiturn-Konversation an einen Chat-Abschlussanbieter. <p> Nachrichten können Strings, Maps mit Rolle/Inhalt oder Listen sein. Der Inhalt kann aus Textstrings oder einem binären Anhang bestehen, der Text, ein Bild oder ein PDF-Dokument enthält. Ein Anhang mit einem anderen Inhaltstyp wird abgelehnt, wobei sein Inhaltstyp genannt wird: Kein Modellanbieter kann ihn übertragen. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.cost = Kosten
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.cost.param.execution.tooltip = Ein Agentenlauf (tl.ai.execution:AgentExecution).
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.cost.return = Der Betrag; „null“ für einen Lauf, bei dem keine Kosten angefallen sind, und für alles andere als einen Lauf.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.cost.tooltip = Die Kosten des jeweiligen Laufs in der Währung, in der der Agentenaktivitätsmonitor die Kosten anzeigt. <p> Ein Lauf erfasst seine Kosten in US-Dollar, der Währung der Preise. Diese werden zum Wechselkurs der Währung „USD“, der am Tag des Laufstarts gültig war, in die Systemwährung der Anwendung umgerechnet; sofern kein solcher Kurs vorliegt, bleiben die Kosten in US-Dollar; siehe <i>Kostenumrechnung</i>. <i>costCurrency</i> bezeichnet die Währung. Das abgeleitete Attribut „tl.ai.execution:AgentExecution#displayCost“ ist diese Funktion. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.costCurrency = Kostenwährung
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.costCurrency.param.execution.tooltip = Ein Agent-Lauf (tl.ai.execution:AgentExecution).
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.costCurrency.return = Der Code; „null“ für einen Lauf, bei dem keine Kosten verzeichnet wurden.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.costCurrency.tooltip = Der ISO-4217-Code der Währung, in der <i>die Kosten</i> für den angegebenen Lauf ausgewiesen werden, ist: die Systemwährung oder USD, sofern am Tag des Laufs kein Wechselkurs für die Umrechnung vorliegt.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.costWarning = Kostenwarnung
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.costWarning.return = Die Warnung oder „null“, wenn kein Grund zur Warnung vorliegt.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.costWarning.tooltip = Worauf der Agentenaktivitätsmonitor heute in der Sprache des Benutzers hinsichtlich der Kosten hinweist. <p> Solange heute kein Wechselkurs US-Dollar in die Systemwährung umrechnet, werden die Kosten in US-Dollar angezeigt und das Geldbudget wird nicht geprüft; hier wird angegeben, welche der beiden Bedingungen zutrifft. Keine Angabe, solange ein solcher Kurs vorliegt oder die Systemwährung US-Dollar ist. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.memoryDelete = Speicher löschen
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.memoryDelete.param.memory.tooltip = Die Funktion „tl.ai.execution:UserMemory“ soll gelöscht werden.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.memoryDelete.return = Das gilt immer: Eine Ablehnung ist eine <i>TopLogic-Ausnahme</i>, kein „false“.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.memoryDelete.tooltip = Löscht einen Datensatz, den der Agent über einen Benutzer gespeichert hat. <p> Der Schreibvorgang erfolgt über den <i>Ausführungsspeicher des Agenten</i> und nicht über den Wrapper: Der Speicher führt das Commit in seinem eigenen Schreib-Thread durch (sodass dies auch aus einem schreibgeschützten Kontext wie einem Rendering-Ausdruck heraus funktioniert) und informiert jedes geöffnete Fenster des Eigentümers darüber, wodurch die Zeile aus der Speicherliste entfernt wird, ohne auf den nächsten Befehl zu warten. </p> <p> Lehnt eine Speichereinheit ab, die weder dem aktiven Konto gehört noch von diesem verwaltet wird. Die Überprüfung findet hier statt und nicht nur in der Ansicht, die sie aufruft – aus demselben Grund, aus dem sie auch bei <i>`sessionDelete`</i> hier erfolgt: Die Eingabe eines Befehls ist das, was ein Kanal gerade enthält, und diese Funktion ist sowohl von einer Scheduler-Aufgabe als auch von der TL-Script-Konsole aus erreichbar. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.modelHealth = Modellzustand
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.modelHealth.return = Eine Map pro geltender Markierung, die neueste zuerst; niemals <code>null</code>.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.modelHealth.tooltip = Wofür jedes Modell dieser Anlage derzeit bekanntermaßen geeignet ist. <p> Pro markiertem Modell gibt es einen Eintrag; ein Modell, mit dem niemand Probleme hatte, fehlt einfach, sodass eine leere Liste bedeutet, dass alle Modelle einwandfrei funktionieren. Die Schlüssel sind „model“, „cause“ (QUOTA, CAPACITY oder TRANSIENT), „kind“ (der Anbieterfehler, der zur Markierung geführt hat), Terminal (ob das Modell vollständig übersprungen wird, anstatt einen Versuch pro Runde zu erhalten), Detail (die Formulierung des Anbieters), markedAt und expiresAt – wobei letzteres bei einer Markierung fehlt, die so lange gültig bleibt, bis sie zurückgesetzt wird. </p> <p> Ein Lesezugriff für einen Monitor, der also nichts abgreift und keine Berechtigung benötigt: Welche Modelle derzeit ausfallen, ist ein Betriebszustand und keine Daten einer bestimmten Person. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.modelHealthReset = Modellzustand zurücksetzen
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.modelHealthReset.param.model.tooltip = Das Modell, dessen Markierung gelöscht werden soll, oder <code>null</code>, um alle Markierungen zu löschen.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.modelHealthReset.return = Wie viele Markierungen gelöscht wurden - 0, wenn das Modell gar nicht markiert war.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.modelHealthReset.tooltip = Löscht die gegen ein Modell vorgebrachten Einwände, sodass es beim nächsten Durchlauf erneut versucht wird. <p> Der Ausweg aus einer hartnäckigen QUOTA-Markierung: Ein abgelehnter Schlüssel oder ein aufgebrauchtes Budget wird außerhalb dieser Anwendung behoben, und nichts hier kann erkennen, dass dies geschehen ist. Ein Administrator, der das Problem behoben hat, teilt dies damit mit. </p> <p> Nur für Administratoren. Die Markierungen verhindern, dass ein Lauf auf einem Modell ausgeführt wird, das unnötig Kosten verursacht, und das Löschen dieser Markierungen ist eine betriebliche Entscheidung, keine Benutzereinstellung. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.models = Modelle
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.models.return = Eine unveränderliche Liste mit allen konfigurierten Modellnamen.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.models.tooltip = Gibt eine Liste aller verfügbaren Modellnamen aus <i>LLM-Anbieter</i> zurück. <p> Die Modellnamen können an die <i>Chat-Funktion</i> übergeben werden, um das zu verwendende KI-Modell auszuwählen. Die zurückgegebene Liste sorgt für eine konsistente Reihenfolge bei Aufrufen. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.research = Recherche
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.research.param.effort.tooltip = Wie gründlich: "quick" (ein Rechercheur), "standard" (drei Rechercheure, der Standard) oder "deep" (fünf bis acht Rechercheure, zwei weitere Runden).
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.research.param.owner.tooltip = Das Konto, als das die Recherche arbeitet, dessen Budget sie verbraucht und in dessen Chat-Liste der Bericht erscheint: ein Konto oder sein Anmeldename. Leer bedeutet das aufrufende Konto. Nur ein Aufruf ohne Konto, zum Beispiel eine geplante Aufgabe, darf ein anderes Konto angeben.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.research.param.question.tooltip = Was recherchiert werden soll.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.research.return = Das Handle des Laufs: die persistente ID seines Chats als Zeichenkette.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.research.tooltip = Startet eine Web-Recherche in einem Hintergrund-Thread und gibt sofort ein Handle zurück. <p> Die Recherche ist Alberts Skill TL_deepResearch: Albert plant Teilfragen, Rechercheure lesen parallel im Web, und Albert schreibt einen Bericht, der auf die gelesenen Seiten verweist. Diese Funktion startet sie ohne Chat-Fenster - aus einem Skript oder aus einer geplanten Aufgabe (ScriptTask). </p> <p> <b>Wo der Bericht steht.</b> Der Lauf wird als Chat des Eigentümers aufgezeichnet, mit dem Titel „Recherche:“ und dem Anfang der Frage. Der Chat erscheint in der Chat-Liste des Eigentümers, der den Bericht dort mit seinen Fußnoten liest. <i>agentRunResult</i> gibt für das Handle denselben Bericht zurück. </p> <p> <b>Niemand ist da.</b> Der Lauf kann keine Frage stellen und bestätigt seine Tool-Aufrufe selbst. Die Hintergrund-Freigabeliste der Tool-Zugriffsrichtlinie begrenzt seine Tools. Das Token- und Geldbudget des Eigentümers begrenzt den Lauf wie einen Chat-Lauf; ein abgelehnter Lauf ruft kein Modell auf und zeichnet die Ablehnung als Antwort auf. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.runInfo = Laufdaten
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.runInfo.return = Eine Map mit den oben beschriebenen Schlüsseln; niemals <code>null</code>.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.runInfo.tooltip = Zu welchem Agentenlauf der aufrufende Code gehört. <p> Lesbar aus der Implementierung eines konfigurierten Skript-Tools, das innerhalb eines Tool-Aufrufs läuft, und aus jedem TL-Script unterhalb eines Agenten - dem Rumpf eines Skript-Tools, einer von ihm aufgerufenen konfigurierten Funktion, einem Listener. Es ist derselbe Datensatz, den ein Java-Tool über seinen Ausführungskontext liest. </p> <p> Die Map hat diese Schlüssel, von denen jeder <code>null</code> sein kann: </p> <ul> <li>runId - dieser Lauf. Ein neuer pro Chat-Nachricht.</li> <li>conversationId - das Gespräch, das alle Läufe eines Chats teilen.</li> <li>agentName - der Agent, der den Lauf bearbeitet.</li> <li>model / provider - womit er spricht.</li> <li>executionId - die persistente Ausführungszeile dieses Laufs, zur Weitergabe an einen Dienst, der sie auflöst.</li> <li>delegationDepth - wie tief dieser Lauf in einer Delegationskette sitzt; null an der Spitze.</li> </ul> <p> Außerhalb eines Agentenlaufs ist jeder Wert <code>null</code> und die Tiefe null. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.sessionDelete = Sitzung löschen
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.sessionDelete.param.session.tooltip = Die zu löschende „tl.ai.execution:AgentSession“.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.sessionDelete.return = Das gilt immer: Eine Ablehnung ist eine <i>TopLogic-Ausnahme</i>, kein „false“.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.sessionDelete.tooltip = Löscht eine Chat-Sitzung samt aller darin aufgezeichneten Inhalte, nachdem alle laufenden Ausführungen dieser Sitzung angehalten wurden. <p> Ein noch laufender Durchlauf in der Sitzung wird zunächst zum Beenden aufgefordert; die Löschung wirkt sich dann kaskadierend auf die Aufgaben der Sitzung, ihre Interaktionsanfragen und ihre Ausführungen aus. Außerdem werden die geöffneten Fenster informiert, wodurch der gelöschte Chat aus einer Liste und aus dem Chat-Speicherzustand des Fensters entfernt wird. Das Löschen kann nicht rückgängig gemacht werden. Eine bereits gelöschte Sitzung antwortet sofort mit „true“: Der Aufruf wollte sie löschen, und sie ist gelöscht, sodass nichts mehr zu löschen ist. </p> <p> Lehnt eine Sitzung ab, die weder dem aktiven Konto gehört noch von diesem verwaltet wird – aus demselben Grund wie bei der Umbenennung einer Sitzung. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.sessionRename = Sitzung umbenennen
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.sessionRename.param.session.tooltip = Die „tl.ai.execution:AgentSession“ soll umbenannt werden.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.sessionRename.param.title.tooltip = Der neue Titel; darf nicht leer sein.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.sessionRename.return = Die umbenannte Sitzung, damit der Aufruf verkettet werden kann.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.sessionRename.tooltip = Benennt eine Chat-Sitzung um, sodass alle Listen, in denen sie angezeigt wird, sofort angepasst werden. <p> Der Schreibvorgang läuft über den <i>Ausführungsspeicher des Agenten</i>, nicht über das Attribut: Der Speicher führt den Commit in seinem eigenen Schreib-Thread durch (sodass dies auch aus einem schreibgeschützten Kontext wie einem Rendering-Ausdruck heraus funktioniert), erhöht den Wert „lastUpdated“ der Sitzung – nach dem die Liste gruppiert – und informiert jedes geöffnete Fenster des Eigentümers, sodass ein zweiter Browser-Tab aktualisiert wird, ohne auf den nächsten Befehl zu warten. </p> <p> Lehnt eine Sitzung ab, die weder dem handelnden Konto gehört noch von diesem verwaltet wird. Die Überprüfung erfolgt hier und nicht nur in der Ansicht, die sie aufruft: Die Eingabe eines Befehls ist das, was ein Kanal gerade enthält, und diese Funktion ist auch von einer Scheduler-Aufgabe und der TL-Script-Konsole aus erreichbar. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.toolInfo = Tool-Infos
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.toolInfo.param.toolName.tooltip = Der qualifizierte Name des Tools.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.toolInfo.return = Eine Karte, die die Metadaten des Tools mit der oben beschriebenen Struktur enthält, oder null, wenn das Tool nicht gefunden wird.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.toolInfo.tooltip = Ruft detaillierte Informationen über ein registriertes Tool ab. <p> Diese Funktion gibt Metadaten über ein Tool zurück, einschließlich seines Namens, seiner Beschreibung und seines Parameterschemas. Das Tool wird durch seinen qualifizierten Namen im Format Fabrik-Name.Tool-Name identifiziert. </p> <p> Die zurückgegebene Karte enthält: </p> <ul> <li>name - Der Name des Tools</li> <li>qualifiedName - Der vollständig qualifizierte Name des Tools</li> <li>description - Eine Beschreibung der Funktion des Tools</li> <li>inputSchemaJson - Die JSON-Schemazeichenkette für Toolparameter</li> </ul>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.tools = Tools
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.tools.return = Eine Liste mit allen registrierten Toolnamen.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.tools.tooltip = Gibt eine Liste aller verfügbaren Toolnamen aus dem <i>Tool-Registrierungsdienst</i> zurück. <p> Die Toolnamen haben das qualifizierte Format Fabrikname.Toolname. Diese Namen können an die <i>Chat-Funktion</i> übergeben werden, um dem KI-Agenten Tools zur Verfügung zu stellen. </p>
com.top_logic.tl.ai.core.scripting.Converters.htmlToMarkdown = HTML zu Markdown
com.top_logic.tl.ai.core.scripting.Converters.htmlToMarkdown.param.html.tooltip = Text im HTML-Format.
com.top_logic.tl.ai.core.scripting.Converters.htmlToMarkdown.return = Markdown-formatierter Text.
com.top_logic.tl.ai.core.scripting.Converters.htmlToMarkdown.tooltip = Konvertiert HTML in <i>Markdown</i>.
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtml = Markdown zu HTML
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtml.param.markdown.tooltip = Text im <i>Markdown-Format</i>.
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtml.return = HTML-Fragment, das gerendert werden kann. Bereinigt, siehe <i>markdownToHtmlString</i>.
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtml.tooltip = Konvertiert <i>Markdown</i> in HTML.
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtmlString = Markdown zu HTML-String
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtmlString.param.markdown.tooltip = Text im <i>Markdown-Format</i>.
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtmlString.return = HTML-Zeichenfolge.
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtmlString.tooltip = Wandelt <i>Markdown</i> in eine HTML-Zeichenkette um. <p> Das Ergebnis kann bedenkenlos in eine Seite geschrieben werden: Rohes HTML im Markdown wird vom Renderer maskiert, und das, was der Renderer selbst erzeugt, wird anschließend durch <i>einen HTML-Sanitizer</i> geleitet, der alle Elemente, Attribute und URL-Schemas entfernt, die eine Markdown-Antwort nicht benötigt. Beide Schritte sind erforderlich – der Escaping-Prozess kann einen <code>[text](javascript:...)</code> Link nicht erkennen, da es sich dabei um Markdown und nicht um HTML handelt. </p>
com.top_logic.tl.ai.core.security.AiToolAccessService = Zugangsdienst für KI-Tools
com.top_logic.tl.ai.core.security.AiToolAccessService.tooltip = Entscheidet, welche Sicherheitsrollen welche Agenten-Tools verwenden dürfen. <p> Wird immer angewendet. Eine Rolle, die hier nicht konfiguriert ist, darf kein Tool verwenden; eine Anwendung, die nichts konfiguriert, lässt ihre Agenten das Modell und die Daten lesen und nichts ändern. </p>
com.top_logic.tl.ai.core.security.DeclaredTypeAccess$Verdict = Befund
com.top_logic.tl.ai.core.security.DeclaredTypeAccess$Verdict.tooltip = Was das Anwendungsmodell und die Rechte des Prinzipals über einen deklarierten Typnamen aussagen.
com.top_logic.tl.ai.core.security.DeclaredTypeAccess.Verdict.NO_SUCH_TYPE = Kein solcher Typ
com.top_logic.tl.ai.core.security.DeclaredTypeAccess.Verdict.NO_SUCH_TYPE.tooltip = Das Modell dieser Anwendung kennt keinen solchen Typ. <p> Eine fehlerhafte Deklaration, und bewusst keine Ablehnung: Ein Tippfehler ist keine Aussage über Rechte, und ihn zu einer solchen zu machen, würde jedem Benutzer grundlos ein funktionierendes Tool wegnehmen. </p>
com.top_logic.tl.ai.core.security.DeclaredTypeAccess.Verdict.READABLE = Lesbar
com.top_logic.tl.ai.core.security.DeclaredTypeAccess.Verdict.READABLE.tooltip = Der Prinzipal darf den Typ oder einen darunterliegenden Typ lesen.
com.top_logic.tl.ai.core.security.DeclaredTypeAccess.Verdict.UNREADABLE = Unlesbar
com.top_logic.tl.ai.core.security.DeclaredTypeAccess.Verdict.UNREADABLE.tooltip = Der Typ existiert, und der Prinzipal darf ihn nicht lesen.
com.top_logic.tl.ai.core.security.RoleAccessPolicy$Cause = Grund
com.top_logic.tl.ai.core.security.RoleAccessPolicy$Cause.tooltip = Warum ein Name abgelehnt wurde.
com.top_logic.tl.ai.core.security.RoleAccessPolicy$Dimension = Dimension
com.top_logic.tl.ai.core.security.RoleAccessPolicy$Dimension.tooltip = Worum es in diesem Abschnitt geht.
com.top_logic.tl.ai.core.security.RoleAccessPolicy$Fallback = Voreinstellung
com.top_logic.tl.ai.core.security.RoleAccessPolicy$Fallback.tooltip = Was eine Sektion von einem Benutzer zulässt, dessen Rollen sie nicht namentlich nennt.
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Cause.AGENTS_OWN_DENIED = Das des Agenten ist verboten
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Cause.AGENTS_OWN_DENIED.tooltip = Der Agent selbst nutzt es, und eine Rolle verbietet es. <p> Das hat niemand gewählt: Zwei Einstellungen der Anwendung widersprechen sich - einem Agenten ist ein Modell zugewiesen, oder er deklariert einen Server, das bzw. den eine Rolle des handelnden Kontos nie verwenden darf. Deshalb bekommt dieser Fall eine eigene Meldung, gerichtet an einen Benutzer, der nichts tun kann, als es zu melden. </p>
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Cause.INFRASTRUCTURE_AGENT = Infrastruktur-Agent
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Cause.INFRASTRUCTURE_AGENT.tooltip = Der Agent ist Teil der Infrastruktur: Die Anwendung führt ihn aus, niemand kommuniziert mit ihm. <p> Dies ist keine Entscheidung einer Rolle und kann von keiner Rolle außer Kraft gesetzt werden – siehe AgentDefinition#infrastructure(). Es wird in einem eigenen Satz erwähnt, da die Aussage „Ihre Rollen umfassen dies nicht“ den Benutzer an einen Administrator weiterleiten würde, der keine Berechtigungen erteilen kann. </p>
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Cause.NOT_GRANTED = Nicht erlaubt
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Cause.NOT_GRANTED.tooltip = Nichts erlaubt es: keine Rolle des Benutzers, und auch nicht die Voreinstellung des Abschnitts.
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Cause.NOT_THE_AGENTS = Nicht das des Agenten
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Cause.NOT_THE_AGENTS.tooltip = Erlaubt ist nur, was der Agent selbst verwendet, und dies ist es nicht.
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Cause.ROLE_DENY = Von der Rolle verboten
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Cause.ROLE_DENY.tooltip = Eine Benutzerrolle verbietet dies ausdrücklich.
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Dimension.AGENT = Agent
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Dimension.AGENT.tooltip = Welche Agenten ein Benutzer ausführen darf.
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Dimension.MCP_SERVER = MCP-Server
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Dimension.MCP_SERVER.tooltip = Welche MCP-Server ein Benutzer an eine einzelne Anfrage anhängen darf.
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Dimension.MODEL = Modell
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Dimension.MODEL.tooltip = Welche Sprachmodelle ein Benutzer für eine einzelne Anfrage auswählen kann.
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Fallback.ALL = Alle
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Fallback.ALL.tooltip = Alles, was die Anwendung hat.
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Fallback.BOUND = Nur das des Agenten
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Fallback.BOUND.tooltip = Nur was der Agent selbst verwendet - sein zugewiesenes Modell, seine angegebenen Server. <p> Genau das verweigert NONE ebenfalls: Die beiden unterscheiden sich darin, was einem Client angeboten wird, nicht darin, was er tun darf. </p>
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Fallback.NONE = Keine
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Fallback.NONE.tooltip = Nichts, und es wird auch nichts angeboten.
com.top_logic.tl.ai.core.security.RoleToolAccess$GroupSource = Gruppenquelle
com.top_logic.tl.ai.core.security.RoleToolAccess$GroupSource.tooltip = Woher die Tool-Gruppe eines Tools stammt.
com.top_logic.tl.ai.core.security.RoleToolAccess.GroupSource.CONFIGURED = Konfiguriert
com.top_logic.tl.ai.core.security.RoleToolAccess.GroupSource.CONFIGURED.tooltip = Eine Gruppen-Zuordnung der Richtlinie stellt das Tool in ihre Gruppe. Entweder deklariert das Tool keine, oder ein Administrator hat es neu eingeordnet.
com.top_logic.tl.ai.core.security.RoleToolAccess.GroupSource.DECLARED = Erklärt
com.top_logic.tl.ai.core.security.RoleToolAccess.GroupSource.DECLARED.tooltip = Das Tool gibt in seinem Code seine eigene Gruppe an.
com.top_logic.tl.ai.core.security.RoleToolAccess.GroupSource.NONE = Keine
com.top_logic.tl.ai.core.security.RoleToolAccess.GroupSource.NONE.tooltip = Weder noch: Das Tool gehört zu keiner Gruppe und steht daher niemandem zur Verfügung.
com.top_logic.tl.ai.core.security.RunEntryPoint = Einstiegspunkt des Laufs
com.top_logic.tl.ai.core.security.RunEntryPoint.A2A = A2A
com.top_logic.tl.ai.core.security.RunEntryPoint.A2A.tooltip = Eine Anfrage eines anderen Agenten über den A2A-Endpunkt (tl-ai-a2a), mit einem eigenen Nachweis. Der aufrufende Agent beantwortet, was der Lauf fragt; ein solcher Lauf ist daher kein Hintergrundlauf.
com.top_logic.tl.ai.core.security.RunEntryPoint.CHAT = Chat
com.top_logic.tl.ai.core.security.RunEntryPoint.CHAT.tooltip = Der Chat, in dem ein Nutzer die Nachricht eingegeben hat und auf die Antwort wartet.
com.top_logic.tl.ai.core.security.RunEntryPoint.INTERNAL = Intern
com.top_logic.tl.ai.core.security.RunEntryPoint.INTERNAL.tooltip = Ein Lauf, den das Produkt für den Nutzer gestartet hat und den der Nutzer weder angefordert hat noch auswählen kann - die Prompt-Verbesserung des Chats ist der Fall, für den es das gibt.
com.top_logic.tl.ai.core.security.RunEntryPoint.MCP = MCP
com.top_logic.tl.ai.core.security.RunEntryPoint.MCP.tooltip = Eine Anfrage, die über den MCP-Endpunkt eingegangen ist und eigene Anmeldedaten enthielt.
com.top_logic.tl.ai.core.security.RunEntryPoint.SCHEDULED = Geplant
com.top_logic.tl.ai.core.security.RunEntryPoint.SCHEDULED.tooltip = Ein Lauf, den ein Scheduler gestartet hat, zu einer Zeit, die niemand gewählt hat, um dabei zu sein.
com.top_logic.tl.ai.core.security.RunEntryPoint.SCRIPT = Skript
com.top_logic.tl.ai.core.security.RunEntryPoint.SCRIPT.tooltip = Ein TL-Script-Aufruf - aiAgentChat, aiCallTool, aiAgentChatAsync, aiResearch.
com.top_logic.tl.ai.core.security.RunEntryPoint.tooltip = Wie ein Agentenlauf gestartet wurde. <p> Ein Teil dessen, woraus eine <i>Sicherheitskontext-Factory</i> entscheidet - für eine Anwendung, deren Antwort davon abhängt, woher der Aufruf kam, und nicht nur davon, wer ihn macht. Für sich genommen sagt das nichts über Rechte: Was ein Lauf darf, folgt aus dem Konto, als das er handelt, und ob ein Mensch eine Bestätigung geben kann, wird getrennt angegeben. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy = Richtlinie zum Zugriff auf Tools
com.top_logic.tl.ai.core.security.ToolAccessPolicy$AgentAccess = Agentenzugriff
com.top_logic.tl.ai.core.security.ToolAccessPolicy$AgentAccess.tooltip = Welche Sicherheitsrollen welche Agenten ausführen dürfen. <p> Nennen Sie keine Rolle, und jeder darf jeden Agenten ausführen. Nennen Sie eine Rolle, und deren Inhaber dürfen genau die Agenten ausführen, die sie erlaubt - ein Rolleneintrag, der keinen erlaubt, lässt seine Inhaber überhaupt keinen Agenten ausführen. Administratoren sind nie eingeschränkt. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy$AgentDefault = Agenten-Voreinstellung
com.top_logic.tl.ai.core.security.ToolAccessPolicy$AgentDefault.tooltip = Was ein Benutzer ausführen darf, der keine der in diesem Abschnitt genannten Rollen innehat.
com.top_logic.tl.ai.core.security.ToolAccessPolicy$AgentGrant = Agenteneintrag
com.top_logic.tl.ai.core.security.ToolAccessPolicy$AgentGrant.tooltip = Ein Eintrag einer Liste von Erlaubnissen oder Verboten: die Agenten, die er nennt.
com.top_logic.tl.ai.core.security.ToolAccessPolicy$AgentRoleAccess = Agentenzugriff einer Rolle
com.top_logic.tl.ai.core.security.ToolAccessPolicy$AgentRoleAccess.tooltip = Welche Agenten eine Sicherheitsrolle ausführen darf und welche nicht.
com.top_logic.tl.ai.core.security.ToolAccessPolicy$BackgroundAllowlist = Hintergrund-Zulassungsliste
com.top_logic.tl.ai.core.security.ToolAccessPolicy$BackgroundAllowlist.tooltip = Die Obergrenze für Agent-Läufe, bei denen niemand einen Tool-Aufruf bestätigen kann. <p> Entweder eine Liste von Funktionen oder <i>„All“</i>, um solche Läufe ohne eigene Begrenzung zu akzeptieren. Ein Eintrag ohne jegliche Funktion ist die strengste Wahl: Diese Läufe gehen dann nicht über die Kommunikation mit dem Benutzer und die Auskunft über den eigenen Tool-Bestand hinaus. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy$Baseline = Grundberechtigungen
com.top_logic.tl.ai.core.security.ToolAccessPolicy$Baseline.tooltip = Die Berechtigungen, die jeder Benutzer unabhängig von seinen Rollen erhält. <p> Ein Eintrag ohne jede Berechtigung ist zulässig und gewährt nichts – so drückt eine Anwendung aus, dass allen Benutzern überhaupt keine Berechtigung gewährt wird. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy$Grant = Berechtigung
com.top_logic.tl.ai.core.security.ToolAccessPolicy$Grant.tooltip = Ein Eintrag in einer Liste von Berechtigungen oder Verweigerungen: entweder eine gesamte Berechtigungsgruppe oder namentlich genannte einzelne Tools.
com.top_logic.tl.ai.core.security.ToolAccessPolicy$GroupMembership = Gruppenmitgliedschaft
com.top_logic.tl.ai.core.security.ToolAccessPolicy$GroupMembership.tooltip = Eine Tool-Gruppe und die Tools, die zu ihr gehören. <p> Für Tools, die selbst keine Gruppe angeben. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy$McpAccess = MCP-Zugriff
com.top_logic.tl.ai.core.security.ToolAccessPolicy$McpAccess.tooltip = Welche Sicherheitsrollen welche MCP-Server an eine einzelne Anfrage anhängen dürfen. <p> Nennen Sie keine Rolle, und jede Anfrage erreicht die Server, die ihr Agent angibt, und keine anderen. Nennen Sie eine Rolle, und deren Inhaber dürfen zusätzlich die Server anhängen, die sie erlaubt. Administratoren sind nie eingeschränkt. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy$McpDefault = MCP-Voreinstellung
com.top_logic.tl.ai.core.security.ToolAccessPolicy$McpDefault.tooltip = Was ein Benutzer anhängen darf, der keine der in diesem Abschnitt genannten Rollen innehat.
com.top_logic.tl.ai.core.security.ToolAccessPolicy$McpGrant = MCP-Server-Eintrag
com.top_logic.tl.ai.core.security.ToolAccessPolicy$McpGrant.tooltip = Ein Eintrag einer Liste von Erlaubnissen oder Verboten: die MCP-Server, die er nennt.
com.top_logic.tl.ai.core.security.ToolAccessPolicy$McpRoleAccess = MCP-Zugriff einer Rolle
com.top_logic.tl.ai.core.security.ToolAccessPolicy$McpRoleAccess.tooltip = Welche MCP-Server eine Sicherheitsrolle anhängen darf und welche nicht.
com.top_logic.tl.ai.core.security.ToolAccessPolicy$ModelAccess = Modellzugriff
com.top_logic.tl.ai.core.security.ToolAccessPolicy$ModelAccess.tooltip = Welche Sicherheitsrollen für eine einzelne Anfrage welches Sprachmodell wählen dürfen. <p> Nennen Sie keine Rolle, und jede Anfrage läuft mit dem Modell, das ihrem Agenten zugewiesen ist. Nennen Sie eine Rolle, und deren Inhaber dürfen zusätzlich die Modelle wählen, die sie erlaubt. Administratoren sind nie eingeschränkt. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy$ModelDefault = Modell-Voreinstellung
com.top_logic.tl.ai.core.security.ToolAccessPolicy$ModelDefault.tooltip = Was ein Benutzer wählen kann, der keine der in diesem Abschnitt genannten Rollen innehat.
com.top_logic.tl.ai.core.security.ToolAccessPolicy$ModelGrant = Modelleintrag
com.top_logic.tl.ai.core.security.ToolAccessPolicy$ModelGrant.tooltip = Ein Eintrag einer Liste von Erlaubnissen oder Verboten: die Modelle, die er nennt.
com.top_logic.tl.ai.core.security.ToolAccessPolicy$ModelRoleAccess = Modellzugriff einer Rolle
com.top_logic.tl.ai.core.security.ToolAccessPolicy$ModelRoleAccess.tooltip = Welche Modelle eine Sicherheitsrolle auswählen darf und welche nicht.
com.top_logic.tl.ai.core.security.ToolAccessPolicy$RoleAccess = Zugriffsrechte für Rollen
com.top_logic.tl.ai.core.security.ToolAccessPolicy$RoleAccess.tooltip = Was eine Sicherheitsrolle nutzen darf und was nicht.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.AgentAccess.default = Standard
com.top_logic.tl.ai.core.security.ToolAccessPolicy.AgentAccess.default.tooltip = Was ein Benutzer ausführen darf, dessen Rollen unten nicht aufgeführt sind.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.AgentAccess.roles = Rollen
com.top_logic.tl.ai.core.security.ToolAccessPolicy.AgentAccess.roles.tooltip = Die Rollen und welche Agenten jede von ihnen ausführen darf.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.AgentDefault.ALL = Alle
com.top_logic.tl.ai.core.security.ToolAccessPolicy.AgentDefault.ALL.tooltip = Jeder Agent der Anwendung.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.AgentDefault.NONE = Keine
com.top_logic.tl.ai.core.security.ToolAccessPolicy.AgentDefault.NONE.tooltip = Überhaupt kein Agent. Nur die unten genannten Rollen dürfen etwas ausführen.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.AgentGrant.agents = Agenten
com.top_logic.tl.ai.core.security.ToolAccessPolicy.AgentGrant.agents.tooltip = Die Agenten, die dieser Eintrag meint, mit Namen.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.AgentRoleAccess.denies = Verbote
com.top_logic.tl.ai.core.security.ToolAccessPolicy.AgentRoleAccess.denies.tooltip = Die Agenten, die diese Rolle niemals ausführen darf. <p> Ein Verbot hier gewinnt immer - gegen das, was diese Rolle erlaubt, und gegen das, was jede andere Rolle desselben Benutzers erlaubt. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.AgentRoleAccess.grants = Erlaubnisse
com.top_logic.tl.ai.core.security.ToolAccessPolicy.AgentRoleAccess.grants.tooltip = Die Agenten, die diese Rolle ausführen darf. <p> Lassen Sie dies leer, damit die Rolle überhaupt keinen Agenten ausführen darf. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.AgentRoleAccess.name.tooltip = Die Sicherheitsrolle, um die es bei diesem Eintrag geht.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.BackgroundAllowlist.all = Alle Tools erlauben
com.top_logic.tl.ai.core.security.ToolAccessPolicy.BackgroundAllowlist.all.tooltip = Erlaubt einem Lauf, bei dem niemand zum Fragen da ist, alles, was die Rollen des handelnden Benutzers erlauben. <p> Schalten Sie dies nur ein, wenn Sie solche Läufe bewusst ohne eigene Obergrenze wollen. Es gibt die einzige Sicherung auf, die für die Bestätigung einsteht, die niemand geben kann. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.BackgroundAllowlist.grants = Berechtigungen
com.top_logic.tl.ai.core.security.ToolAccessPolicy.BackgroundAllowlist.grants.tooltip = Die Tool-Gruppen und einzelnen Tools, die ein Lauf verwenden darf, bei dem niemand zum Fragen da ist. <p> Wird ignoriert, wenn <i>Alle Tools erlauben</i> eingeschaltet ist. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.Baseline.grants = Berechtigungen
com.top_logic.tl.ai.core.security.ToolAccessPolicy.Baseline.grants.tooltip = Die Tool-Gruppen und einzelnen Tools, die jeder Benutzer verwenden darf.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.Grant.group = Gruppe
com.top_logic.tl.ai.core.security.ToolAccessPolicy.Grant.group.tooltip = Die Tool-Gruppe, auf die sich dieser Eintrag bezieht. <p> Lassen Sie dieses Feld leer, wenn der Eintrag stattdessen einzelne Tools benennt. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.Grant.tools = Tools
com.top_logic.tl.ai.core.security.ToolAccessPolicy.Grant.tools.tooltip = Die einzelnen Tools, auf die sich dieser Eintrag bezieht, mit ihrem qualifizierten Namen. <p> Wählen Sie eines oder mehrere aus. Lassen Sie dieses Feld leer, wenn der Eintrag stattdessen eine Tool-Gruppe benennt: Ein Eintrag bezieht sich entweder auf eine Gruppe oder auf Tools, niemals auf beides. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.GroupMembership.name.tooltip = Die Tool-Gruppe, zu der die hier aufgeführten Tools gehören.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.GroupMembership.tools = Tools
com.top_logic.tl.ai.core.security.ToolAccessPolicy.GroupMembership.tools.tooltip = Die Tools dieser Gruppe, mit ihrem qualifizierten Namen. <p> Wählen Sie jedes Tool aus, das hierher gehört. Ein Tool, das nicht aufgeführt ist, behält die Gruppe bei, die es selbst angibt, und hat überhaupt keine, wenn es keine angibt. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpAccess.default = Standard
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpAccess.default.tooltip = Was ein Benutzer anhängen darf, dessen Rollen unten nicht aufgeführt sind.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpAccess.roles = Rollen
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpAccess.roles.tooltip = Die Rollen und welche MCP-Server jede von ihnen anhängen darf.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpDefault.AGENT = Agent
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpDefault.AGENT.tooltip = Nur die Server, die der Agent der Anfrage selbst angibt. Die Wahl wird nicht angeboten.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpDefault.ALL = Alle
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpDefault.ALL.tooltip = Jeder Server, den die Anwendung konfiguriert hat.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpDefault.NONE = Keine
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpDefault.NONE.tooltip = Überhaupt kein Server, nicht einmal die, die der Agent angibt.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpGrant.servers = Server
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpGrant.servers.tooltip = Die MCP-Server, die dieser Eintrag meint, mit Namen.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpRoleAccess.denies = Verbote
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpRoleAccess.denies.tooltip = Die MCP-Server, die diese Rolle niemals anhängen darf. <p> Ein Verbot hier gewinnt immer - gegen das, was diese Rolle erlaubt, gegen das, was jede andere Rolle desselben Benutzers erlaubt, und gegen die Server, die der Agent selbst angibt. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpRoleAccess.grants = Erlaubnisse
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpRoleAccess.grants.tooltip = Die MCP-Server, die diese Rolle anhängen darf. <p> Lassen Sie dies leer, damit die Rolle überhaupt keinen Server anhängen darf - auch nicht die, die der Agent selbst angibt. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpRoleAccess.name.tooltip = Die Sicherheitsrolle, um die es bei diesem Eintrag geht.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelAccess.default = Standard
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelAccess.default.tooltip = Was ein Benutzer auswählen kann, dessen Rollen unten nicht aufgeführt sind.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelAccess.roles = Rollen
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelAccess.roles.tooltip = Die Rollen und welche Modelle jede von ihnen wählen darf.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelDefault.ALL = Alle
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelDefault.ALL.tooltip = Jedes Modell, das von der Anwendung konfiguriert wurde.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelDefault.ASSIGNED = Zugewiesen
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelDefault.ASSIGNED.tooltip = Nur das Modell, das dem Agenten der Anfrage zugewiesen ist. Die Wahl wird nicht angeboten.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelDefault.NONE = Keine
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelDefault.NONE.tooltip = Nichts, nicht einmal das Modell des Agenten - was jede Anfrage anhält, die ein Modell nennt.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelGrant.models = Modelle
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelGrant.models.tooltip = Die Modelle, die dieser Eintrag meint, mit Namen.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelRoleAccess.denies = Verbote
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelRoleAccess.denies.tooltip = Die Modelle, die diese Rolle niemals wählen darf. <p> Ein Verbot hier gewinnt immer - gegen das, was diese Rolle erlaubt, und gegen das, was jede andere Rolle desselben Benutzers erlaubt. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelRoleAccess.grants = Erlaubnisse
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelRoleAccess.grants.tooltip = Die Modelle, die diese Rolle wählen darf. <p> Das Modell, das einem Agenten zugewiesen ist, ist immer verwendbar; hier geht es darum, für eine einzelne Anfrage ein anderes zu wählen. Lassen Sie dies leer, um der Rolle diese Wahl zu nehmen. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelRoleAccess.name.tooltip = Die Sicherheitsrolle, um die es in diesem Eintrag geht.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.RoleAccess.denies = Verbote
com.top_logic.tl.ai.core.security.ToolAccessPolicy.RoleAccess.denies.tooltip = Die Tool-Gruppen und einzelnen Tools, die diese Rolle niemals verwenden darf. <p> Eine Verweigerung hier gewinnt immer: gegen die Freigaben dieser Rolle und gegen die Freigaben jeder anderen Rolle desselben Benutzers. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.RoleAccess.grants = Berechtigungen
com.top_logic.tl.ai.core.security.ToolAccessPolicy.RoleAccess.grants.tooltip = Die Tool-Gruppen und einzelnen Tools, die diese Rolle verwenden darf.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.RoleAccess.name.tooltip = Die Sicherheitsrolle, um die es in diesem Eintrag geht.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.agent-access = Agentenzugriff
com.top_logic.tl.ai.core.security.ToolAccessPolicy.agent-access.tooltip = Welche Sicherheitsrollen welche Agenten ausführen dürfen. <p> Jeder darf jeden Agenten ausführen, bis hier eine Rolle genannt wird. Sobald eine der Rollen eines Benutzers genannt ist, darf dieser Benutzer genau die Agenten ausführen, die seine genannten Rollen erlauben - siehe <i>Agentenzugriff</i>. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.background-allowlist = Hintergrund-Zulassungsliste
com.top_logic.tl.ai.core.security.ToolAccessPolicy.background-allowlist.tooltip = Was ein Agentenlauf verwenden darf, bei dem niemand zum Fragen da ist: ein geplanter oder asynchroner Lauf oder eine Anfrage eines externen Clients. <p> Ein solcher Lauf bestätigt jeden Tool-Aufruf selbst, daher ist dies seine Obergrenze; die Rollen des handelnden Benutzers gelten zusätzlich. Eine Anwendung, die oben eine Rolle aufführt und dieses Element weglässt, startet nicht. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.baseline = Grundberechtigungen
com.top_logic.tl.ai.core.security.ToolAccessPolicy.baseline.tooltip = Funktionen, die jeder angemeldete Benutzer zusätzlich zu den durch seine Rollen gewährten erhält. <p> Die Kommunikation mit dem Benutzer und die Auskunft über den eigenen Tool-Bestand erfordern keinen Eintrag – beides ist ohnehin gewährt. Wenn Sie nichts eintragen, dürfen alle das Modell und die Geschäftsdaten lesen. Lassen Sie dieses Element leer, um nichts weiter zu gewähren. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.mcp-access = MCP-Zugriff
com.top_logic.tl.ai.core.security.ToolAccessPolicy.mcp-access.tooltip = Welche Sicherheitsrollen welche MCP-Server an eine einzelne Anfrage anhängen dürfen. <p> Niemand hängt einen Server an, bis dies es sagt: Voreingestellt erreicht eine Anfrage die Server, die ihr Agent selbst angibt, und keine anderen - siehe <i>MCP-Zugriff</i>. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.model-access = Modellzugriff
com.top_logic.tl.ai.core.security.ToolAccessPolicy.model-access.tooltip = Welche Sicherheitsrollen für eine einzelne Anfrage welche Sprachmodelle wählen dürfen. <p> Niemand wählt ein Modell, bis dies es sagt: Voreingestellt läuft eine Anfrage mit dem Modell, das ihrem Agenten zugewiesen ist, gleich was ein Client verlangt - siehe <i>Modellzugriff</i>. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.tool-access = Zugriff auf Tools
com.top_logic.tl.ai.core.security.ToolAccessPolicy.tool-access.tooltip = Die Rollen und was jede von ihnen verwenden darf. <p> Eine Rolle, die hier nicht aufgeführt ist, darf kein Tool verwenden. Eine leere Liste lässt daher jedem Benutzer nur das, was <i>Grundberechtigungen</i> gewährt. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.tool-groups = Tool-Gruppen
com.top_logic.tl.ai.core.security.ToolAccessPolicy.tool-groups.tooltip = Ordnet Tools einer Tool-Gruppe zu, wenn das Tool selbst keine angibt. <p> Nötig für Tools, die erst im laufenden Betrieb auftauchen: die eines angebundenen MCP-Servers und TL-Script-Tools. Ein solches Tool ist für niemanden verwendbar, solange es hier nicht aufgeführt ist, und ein Eintrag hier überschreibt auch die Gruppe, die ein Tool selbst angibt. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.tooltip = Welche Sicherheitsrollen welche Agenten-Tools verwenden dürfen. <p> Erlaubt ist nur, was hier freigegeben wird: Eine Rolle, die nicht aufgeführt ist, darf überhaupt kein Tool verwenden, und ein Benutzer, der keine der aufgeführten Rollen innehat, ebenso wenig. Dies gilt immer – es gibt keine Einstellung, die es abschaltet. Eine Anwendung, die nichts aufführt, lässt ihren Agenten die unten aufgeführten, nur lesenden Berechtigungen. </p>
com.top_logic.tl.ai.core.security.ToolAccessRule$Kind = Art
com.top_logic.tl.ai.core.security.ToolAccessRule$Kind.tooltip = Die Mechanismen, auf denen eine Entscheidung bezüglich einer Richtlinie für den Zugriff auf Tools beruhen kann.
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.ADMIN_BYPASS = Admin-Umgehung
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.ADMIN_BYPASS.tooltip = Das Konto verfügt über Administratorrechte und umgeht diese Ebene daher vollständig.
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.BACKGROUND_CEILING = Hintergrunddecke
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.BACKGROUND_CEILING.tooltip = Die Obergrenze für Läufe, bei denen niemand auf eine Bestätigungsabfrage reagiert. Gilt auch für Administratoren.
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.BASELINE = Ausgangswert
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.BASELINE.tooltip = Ein Eintrag der richtlinieneigenen Basis, der jedes Konto erreicht.
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.DEFAULT_BASELINE = Standard-Basislinie
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.DEFAULT_BASELINE.tooltip = Die Standard-Einstellung „Nur-Lesen“ gilt, da die Richtlinie keine eigene Baseline festlegt.
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.IMPLICIT_BASELINE = Implizite Basislinie
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.IMPLICIT_BASELINE.tooltip = Wird jedem Benutzer in jedem Ausführungsmodus automatisch gewährt, ohne dass eine Konfiguration erforderlich ist.
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.NOT_GRANTED = Nicht bewilligt
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.NOT_GRANTED.tooltip = Die Richtlinie enthält keine entsprechenden Bestimmungen: Es gibt weder einen Basiseintrag noch eine Rolle für das Konto.
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.ROLE_DENY = Rolle verweigern
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.ROLE_DENY.tooltip = Ein Verbot einer der Rollen des Kontos. Hat Vorrang vor allen Berechtigungen.
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.ROLE_GRANT = Rollenzuweisung
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.ROLE_GRANT.tooltip = Eine Berechtigung, über die das Konto aufgrund einer seiner Rollen verfügt.
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.UNCLASSIFIED = Nicht klassifiziert
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.UNCLASSIFIED.tooltip = Das Tool gehört zu keiner Berechtigungsgruppe, sodass es nicht unter eine Gruppenberechtigung fällt und nur durch eine explizite, für jedes Tool einzeln erteilte Berechtigung zugänglich ist.
com.top_logic.tl.ai.core.security.layout.ApplyToolAccessPolicyCommand = Richtlinie übernehmen
com.top_logic.tl.ai.core.security.layout.ApplyToolAccessPolicyCommand.tooltip = Prüft die bearbeitete Richtlinie für den Tool-Zugriff und schreibt sie, wenn der nächste Anwendungsstart sie akzeptieren würde.
com.top_logic.tl.ai.core.security.layout.CapabilityRisk = Besonderheit einer Tool-Gruppe
com.top_logic.tl.ai.core.security.layout.CapabilityRisk.EGRESS = Sendet Daten nach außen
com.top_logic.tl.ai.core.security.layout.CapabilityRisk.EGRESS.tooltip = Ihre Tools senden Daten aus der Anwendung heraus.
com.top_logic.tl.ai.core.security.layout.CapabilityRisk.IMPLICIT = Implizit gewährt
com.top_logic.tl.ai.core.security.layout.CapabilityRisk.IMPLICIT.tooltip = Jedes Konto hält sie, konfiguriert oder nicht.
com.top_logic.tl.ai.core.security.layout.CapabilityRisk.NONE = Keine
com.top_logic.tl.ai.core.security.layout.CapabilityRisk.NONE.tooltip = Nichts über das hinaus, was die Gruppe selbst sagt.
com.top_logic.tl.ai.core.security.layout.CapabilityRisk.PRIVILEGED = Privilegiert
com.top_logic.tl.ai.core.security.layout.CapabilityRisk.PRIVILEGED.tooltip = Ihre Tools können jede andere Berechtigung ausdrücken, ein Grant gewährt also mehr als er nennt.
com.top_logic.tl.ai.core.security.layout.CapabilityRisk.tooltip = Was eine Tool-Gruppe zum zweiten Hinsehen bringt.
com.top_logic.tl.ai.core.security.layout.DiscardToolAccessPolicyCommand = Änderungen verwerfen
com.top_logic.tl.ai.core.security.layout.DiscardToolAccessPolicyCommand.tooltip = Wirft die ungespeicherten Änderungen der Richtlinie für den Tool-Zugriff weg und zeigt die gespeicherte wieder an.
com.top_logic.tl.ai.core.security.layout.DraftAccess$Mark = Markierung
com.top_logic.tl.ai.core.security.layout.DraftAccess$Mark.tooltip = Was das Overlay einer Zelle über ihren Zustand hinaus hinzufügt.
com.top_logic.tl.ai.core.security.layout.DraftAccess.Mark.AGENTS_OWN = Eigenes eines Agenten
com.top_logic.tl.ai.core.security.layout.DraftAccess.Mark.AGENTS_OWN.tooltip = Erreichbar, obwohl keine Zelle es gewährt, weil ein Agent, den die Rolle ausführen darf, es selbst verwendet.
com.top_logic.tl.ai.core.security.layout.DraftAccess.Mark.NONE = Keine
com.top_logic.tl.ai.core.security.layout.DraftAccess.Mark.NONE.tooltip = Nichts: die Zelle sagt, was der Lauf tut.
com.top_logic.tl.ai.core.security.layout.DraftAccess.Mark.REFUSED = Abgelehnt
com.top_logic.tl.ai.core.security.layout.DraftAccess.Mark.REFUSED.tooltip = Der Lauf lehnt ab, was die Zelle oder die Voreinstellung gewährt, aus einem Grund, den keine Zelle dieser Matrix zeigt.
com.top_logic.tl.ai.core.security.layout.EffectiveToolAccessComponent = Ansicht "Effektive Rechte"
com.top_logic.tl.ai.core.security.layout.EffectiveToolAccessComponent.tooltip = Zeigt an, was ein Konto oder eine Rolle aufrufen darf und welche Regel der Richtlinie dies festgelegt hat. <p> Nur-Lese-Zugriff; diese Ansicht gibt Auskunft über den <em>aktuell laufenden</em> Dienst: Was gespeichert, aber noch nicht in Kraft getreten ist, wird hier nicht angezeigt. Die Richtlinie selbst wird auf der Registerkarte „Richtlinie“ festgelegt. </p>
com.top_logic.tl.ai.core.security.layout.MatrixDimension = Matrix-Dimension
com.top_logic.tl.ai.core.security.layout.MatrixDimension.AGENTS = Agenten
com.top_logic.tl.ai.core.security.layout.MatrixDimension.AGENTS.tooltip = Welche Agenten eine Rolle ausführen darf.
com.top_logic.tl.ai.core.security.layout.MatrixDimension.CAPABILITIES = Fähigkeiten
com.top_logic.tl.ai.core.security.layout.MatrixDimension.CAPABILITIES.tooltip = Welche Tool-Gruppen eine Rolle verwenden darf.
com.top_logic.tl.ai.core.security.layout.MatrixDimension.MCP_SERVERS = MCP-Server
com.top_logic.tl.ai.core.security.layout.MatrixDimension.MCP_SERVERS.tooltip = Welche MCP-Server eine Rolle anbinden darf.
com.top_logic.tl.ai.core.security.layout.MatrixDimension.MODELS = Modelle
com.top_logic.tl.ai.core.security.layout.MatrixDimension.MODELS.tooltip = Welche Sprachmodelle eine Rolle wählen darf.
com.top_logic.tl.ai.core.security.layout.MatrixDimension.tooltip = Welche Spalten eine Matrix des Richtlinien-Editors hat.
com.top_logic.tl.ai.core.security.layout.PolicyCellControl$Ghost = Schatten
com.top_logic.tl.ai.core.security.layout.PolicyCellControl$Ghost.tooltip = Was eine Zelle einer nicht genannten Zeile zeigt: was die Voreinstellung des Abschnitts der Rolle gibt.
com.top_logic.tl.ai.core.security.layout.PolicyCellControl.Ghost.AGENTS_OWN = Eigenes eines Agenten
com.top_logic.tl.ai.core.security.layout.PolicyCellControl.Ghost.AGENTS_OWN.tooltip = Die Voreinstellung lässt nur zu, was der Agent selbst verwendet.
com.top_logic.tl.ai.core.security.layout.PolicyCellControl.Ghost.GRANTED = Gewährt
com.top_logic.tl.ai.core.security.layout.PolicyCellControl.Ghost.GRANTED.tooltip = Die Voreinstellung lässt jeden Namen zu.
com.top_logic.tl.ai.core.security.layout.PolicyCellControl.Ghost.NONE = Keine
com.top_logic.tl.ai.core.security.layout.PolicyCellControl.Ghost.NONE.tooltip = Die Voreinstellung lässt nichts zu.
com.top_logic.tl.ai.core.security.layout.PolicyDraft$BackgroundChoice = Wahl der Obergrenze für unbeaufsichtigte Läufe
com.top_logic.tl.ai.core.security.layout.PolicyDraft$BackgroundChoice.tooltip = Die Obergrenze für Läufe, in denen niemand einen Aufruf bestätigen kann.
com.top_logic.tl.ai.core.security.layout.PolicyDraft$BaselineChoice = Wahl der Grundberechtigungen
com.top_logic.tl.ai.core.security.layout.PolicyDraft$BaselineChoice.tooltip = Was jedes Konto zusätzlich zu den Grants seiner Rollen erhält.
com.top_logic.tl.ai.core.security.layout.PolicyDraft$CellState = Zustand einer Zelle
com.top_logic.tl.ai.core.security.layout.PolicyDraft$CellState.tooltip = Was eine Rolle über eine Tool-Gruppe, einen Agenten, ein Modell oder einen MCP-Server sagt: eine Zelle der Matrix.
com.top_logic.tl.ai.core.security.layout.PolicyDraft.BackgroundChoice.ALL = Alles, was die Rollen erlauben
com.top_logic.tl.ai.core.security.layout.PolicyDraft.BackgroundChoice.ALL.tooltip = Keine eigene Obergrenze: Solche Läufe erreichen alles, was die Rollen des handelnden Kontos gewähren.
com.top_logic.tl.ai.core.security.layout.PolicyDraft.BackgroundChoice.CUSTOM = Eigene Liste
com.top_logic.tl.ai.core.security.layout.PolicyDraft.BackgroundChoice.CUSTOM.tooltip = Nur die gewählten Tool-Gruppen und Tools.
com.top_logic.tl.ai.core.security.layout.PolicyDraft.BackgroundChoice.UNDECLARED = Nicht festgelegt
