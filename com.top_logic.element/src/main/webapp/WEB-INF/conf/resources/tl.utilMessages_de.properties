model.tl.util = Zusätzliche Basistypen
model.tl.util.Any = Unspezifiziert
model.tl.util.Any.tooltip = Platzhalter für einen Wert, dessen Typ nicht näher festgelegt ist. Der Typ wird dort verwendet, wo der konkrete Typ eines Wertes erst zur Laufzeit bekannt ist.
model.tl.util.Color = Farbe
model.tl.util.Color.tooltip = Eine Farbe, die über einen Farbwähler ausgewählt und in hexadezimaler Schreibweise gespeichert wird.
model.tl.util.Country = Land
model.tl.util.Country.tooltip = Ein Land aus der Liste der dem System bekannten Länder. Der Wert wird als Länderkennung gespeichert und in der Sprache des Nutzers angezeigt.
model.tl.util.IconResource = Anzeigewert (nur Icon)
model.tl.util.IconResource.tooltip = Wie der Typ "Anzeigewert", es wird jedoch nur das Icon angezeigt. Die Beschriftung des Wertes wird als sein Tooltip verwendet.
model.tl.util.JSON = JSON
model.tl.util.JSON.tooltip = Ein strukturierter Wert wie ein Objekt, eine Liste, eine Zahl oder ein Text. Der Wert wird in JSON-Schreibweise gespeichert.
model.tl.util.Language = Sprache
model.tl.util.Language.tooltip = Eine Sprache aus der Liste der dem System bekannten Sprachen. Der Wert wird als Sprachkennung gespeichert und in der Sprache des Nutzers angezeigt.
model.tl.util.Resource = Anzeigewert
model.tl.util.Resource.tooltip = Ein Anzeigewert, der Beschriftung, Icon, Tooltip und einen optionalen Verweis zusammenfasst. Der Typ dient der Anzeige eines Wertes, der selbst kein Fachobjekt ist.
model.tl.util.TimeZone = Zeitzone
model.tl.util.TimeZone.tooltip = Eine Zeitzone aus der Liste der dem System bekannten Zeitzonen.
model.tl.util.URL = URL
model.tl.util.URL.tooltip = Eine Web-Adresse. Der Wert wird als Verweis angezeigt, der direkt geöffnet werden kann.
model.tl.util.tooltip = Modul mit zusätzlichen Datentypen, die nicht zu den technischen Basistypen gehören, z.B. Farben, Sprachen, Länder und strukturierte Werte.
