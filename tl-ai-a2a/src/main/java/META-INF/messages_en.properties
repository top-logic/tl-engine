com.top_logic.ai.a2a.A2AService.RemoteAgentConfig.credentials = Credentials
com.top_logic.ai.a2a.A2AService.RemoteAgentConfig.credentials.tooltip = How the calls to the remote agent are authenticated. <p> Typically a personal access token of the remote application, sent as bearer token and read from an environment variable or a file: </p> <pre> &lt;remote-agent name="other" card-url="https://example.com/other/a2a/agent/agent-card.json"&gt; &lt;credentials class="com.top_logic.basic.credential.HeaderCredentials" scheme="Bearer"&gt; &lt;secret name="OTHER_A2A_TOKEN"/&gt; &lt;/credentials&gt; &lt;/remote-agent&gt; </pre> <p> If not set, the calls are sent without credentials. The agent card is always fetched without credentials. A call whose credentials are rejected (HTTP 401) is repeated once with fresh credentials. </p>
