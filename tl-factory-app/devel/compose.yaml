#
# Local development setup of the control application tl-factory-app: a Gitea as git hosting service
# and a Jenkins as CI server, published on the bind address of the host
# (TL_FACTORY_DEVEL_BIND_ADDRESS, default the loopback address), where the control application
# running on the host and the browsers reach them.
#
# Started, stopped and reset by tl-factory-devel.sh, which also creates the users, the
# organization and the tokens and writes the generated credentials to the secret folder of the
# developer (~/.top-logic/secrets). Described in the developer article factory/index, section
# "Local setup".
#
# The URLs: both services know the public host name of the setup (TL_FACTORY_DEVEL_PUBLIC_HOST,
# default localhost), under which the browsers reach them: Gitea reports its pages and clone URLs
# below its ROOT_URL http://<public host>:<gitea port>/, Jenkins its pages below its Jenkins URL
# http://<public host>:<jenkins port>/. The control application talks to both through their
# published ports. Jenkins clones from the clone URLs of Gitea; inside its container, git rewrites
# them to the Gitea service on the network of the setup (http://gitea:3000/, see the config
# gitconfig below).

name: tl-factory-devel

services:

  gitea:
    # The version tl-factory-gitea generates its client from and tests against (gitea.version in
    # tl-factory-gitea/pom.xml); Renovate updates both together.
    # renovate: datasource=docker depName=gitea/gitea
    image: gitea/gitea:28.2.0
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://${TL_FACTORY_DEVEL_PUBLIC_HOST:-localhost}:${TL_FACTORY_DEVEL_GITEA_PORT:-3300}/
      # The URLs below the ROOT_URL, not below the host the request names (the default "auto").
      GITEA__server__PUBLIC_URL_DETECTION: legacy
      GITEA__server__DISABLE_SSH: "true"
      GITEA__repository__DEFAULT_BRANCH: main
      GITEA__service__DISABLE_REGISTRATION: "true"
    ports:
      - "${TL_FACTORY_DEVEL_BIND_ADDRESS:-127.0.0.1}:${TL_FACTORY_DEVEL_GITEA_PORT:-3300}:3000"
    volumes:
      - gitea-data:/data
    restart: unless-stopped

  jenkins:
    # The Jenkins of tl-factory-jenkins (pinned release and plugins) with Maven and the Maven settings
    # of the workspace image, building the applications on the built-in node.
    build:
      context: ../../tl-factory-jenkins/src/test/docker/jenkins
      target: devel
      additional_contexts:
        workspace-image: ../../tl-factory/src/main/java/com/top_logic/factory/workspace/app/image
    image: tl-factory-devel-jenkins
    depends_on:
      - gitea
    # The users and credentials, written by tl-factory-devel.sh: TL_JENKINS_ADMIN,
    # TL_JENKINS_ADMIN_PASSWORD, TL_JENKINS_API_TOKEN, TL_JENKINS_SCM_CREDENTIALS_ID,
    # TL_JENKINS_SCM_USER and TL_JENKINS_SCM_PASSWORD for the init script of the image.
    env_file:
      - path: ${tl_devel_secrets_dir:-${HOME}/.top-logic/secrets}/tl_factory_devel_jenkins.env
        required: false
    environment:
      TL_JENKINS_EXECUTORS: "2"
      TL_JENKINS_URL: http://${TL_FACTORY_DEVEL_PUBLIC_HOST:-localhost}:${TL_FACTORY_DEVEL_JENKINS_PORT:-8380}/
    ports:
      - "${TL_FACTORY_DEVEL_BIND_ADDRESS:-127.0.0.1}:${TL_FACTORY_DEVEL_JENKINS_PORT:-8380}:8080"
    configs:
      - source: gitconfig
        target: /etc/gitconfig
    volumes:
      - jenkins-home:/var/jenkins_home
    restart: unless-stopped

configs:
  # The clone URLs of Gitea name the public host, which the Jenkins container need not reach; as
  # localhost, the default public host, it reaches itself. A job keeps the clone URL it was
  # configured with until the control application configures it again before its next build, so
  # both names are rewritten.
  gitconfig:
    content: |
      [url "http://gitea:3000/"]
        insteadOf = http://${TL_FACTORY_DEVEL_PUBLIC_HOST:-localhost}:${TL_FACTORY_DEVEL_GITEA_PORT:-3300}/
        insteadOf = http://localhost:${TL_FACTORY_DEVEL_GITEA_PORT:-3300}/

volumes:
  gitea-data:
  jenkins-home:

networks:
  default:
    name: tl-factory-devel
