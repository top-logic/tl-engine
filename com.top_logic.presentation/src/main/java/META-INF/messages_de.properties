com.top_logic.presentation.script.PptDescriptionFunctions.shape.tooltip = Beschreibt eine geometrische Form, optional mit Text. <p> Beispiel: <code>pptShape(geometry: "roundRect", x: 30, y: 130, width: 300, height: 200, fill: "accent1", text: "Hello", color: "bg1")</code> </p> <p> Die Formatierungsargumente (Schriftart, Größe, Farbe, …) gelten für den gesamten Text, sofern nicht ein Absatz oder ein Textabschnitt eine eigene Formatierung definiert. </p>
com.top_logic.presentation.script.PptDescriptionFunctions.slide = Beschreibe eine Folie
com.top_logic.presentation.script.PptDescriptionFunctions.slide.param.content.tooltip = Die Elemente auf der Folie: Formen, Textfelder, Tabellen und Bilder.
com.top_logic.presentation.script.PptDescriptionFunctions.slide.param.hidden.tooltip = Ob die Folie in der Bildschirmpräsentation ausgeblendet ist.
com.top_logic.presentation.script.PptDescriptionFunctions.slide.param.layout.tooltip = Das Folienlayout: sein Index (wie in <code>layouts</code> von <code>pptAnalyze()</code>), sein Name oder seine Rolle <code>title</code>, <code>content</code>, <code>agenda</code>, <code>section</code> oder <code>closing</code>. Ohne Angabe wird das Inhaltslayout verwendet.
com.top_logic.presentation.script.PptDescriptionFunctions.slide.param.notes.tooltip = Die Sprechernotizen als Text oder als Liste von Zeilen.
com.top_logic.presentation.script.PptDescriptionFunctions.slide.param.placeholders.tooltip = Texte weiterer Platzhalter: ein Wörterbuch vom Platzhalterindex (wie in den <code>placeholders</code> eines Layouts in <code>pptAnalyze()</code>) oder Platzhalternamen auf den Text.
com.top_logic.presentation.script.PptDescriptionFunctions.slide.param.subtitle.tooltip = Der Text des Platzhalters für den Untertitel.
com.top_logic.presentation.script.PptDescriptionFunctions.slide.param.title.tooltip = Der Text des Platzhalters für den Titel.
com.top_logic.presentation.script.PptDescriptionFunctions.slide.return = Das Wörterbuch, in dem die Folie beschrieben wird.
com.top_logic.presentation.script.PptDescriptionFunctions.slide.tooltip = Beschreibt eine Folie. <p> Die Folie wird auf einem Folienlayout der Vorlage erstellt. Ihr Titel und Untertitel füllen die Platzhalter für Titel und Untertitel des Layouts aus, weitere Platzhalter werden anhand ihres Index oder Namens ausgefüllt. Die Inhaltselemente werden auf der Folie platziert: Ein Element mit Position und Größe wird dort platziert, ein einzelnes Element ohne diese Angaben füllt den Inhaltsbereich des Layouts aus. </p>
com.top_logic.presentation.script.PptDescriptionFunctions.table = Beschreibe eine Tabelle
com.top_logic.presentation.script.PptDescriptionFunctions.table.param.columnWeights.tooltip = Die relativen Breiten der Spalten, die die Breite der Tabelle aufteilen. Wenn weder Gewichte noch Breiten angegeben sind, haben alle Spalten die gleiche Breite.
com.top_logic.presentation.script.PptDescriptionFunctions.table.param.columnWidths.tooltip = Die Breiten der Spalten. Dürfen nicht zusammen mit den Gewichten angegeben werden.
com.top_logic.presentation.script.PptDescriptionFunctions.table.param.headerRows.tooltip = Die Anzahl der Zeilen oben, die als Kopfzeilen formatiert werden.
com.top_logic.presentation.script.PptDescriptionFunctions.table.param.height.tooltip = Die Höhe.
com.top_logic.presentation.script.PptDescriptionFunctions.table.param.rowHeight.tooltip = Die Mindesthöhe einer Zeile.
com.top_logic.presentation.script.PptDescriptionFunctions.table.param.rows.tooltip = Die Zeilen der Tabelle, jede eine Liste von Zellen mit derselben Anzahl an Zellen. Eine Zelle ist ein Text oder eine Zellbeschreibung (<code>pptCell()</code>).
com.top_logic.presentation.script.PptDescriptionFunctions.table.param.width.tooltip = Die Breite.
com.top_logic.presentation.script.PptDescriptionFunctions.table.param.x.tooltip = Die horizontale Position des linken Randes.
com.top_logic.presentation.script.PptDescriptionFunctions.table.param.y.tooltip = Die vertikale Position des oberen Randes.
com.top_logic.presentation.script.PptDescriptionFunctions.table.return = Das Wörterbuch, das die Tabelle beschreibt.
com.top_logic.presentation.script.PptDescriptionFunctions.table.tooltip = Beschreibt eine Tabelle. <p> Beispiel: <code>pptTable(rows: [["Name", "Value"], ["A", 1], ["B", pptCell("2", fill: "accent2")]], headerRows: 1, columnWeights: [2, 1])</code> </p>
com.top_logic.presentation.script.PptDescriptionFunctions.textBox = Beschreibe ein Textfeld
