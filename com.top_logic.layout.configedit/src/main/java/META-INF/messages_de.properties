com.top_logic.layout.configedit.ConfigFormControl.Commands.INLINE.tooltip = Als Knöpfe des Formulars selbst, neben seinen Feldern. <p> Für eine eigenständige Verwendung, die keine Symbolleiste hat, in die sie gehören könnten. </p>
com.top_logic.layout.configedit.ConfigFormControl.Commands.NONE = Keine
com.top_logic.layout.configedit.ConfigFormControl.Commands.NONE.tooltip = Gar nicht - kein Bearbeitungsmodus, der Editor schreibt direkt in die übergebene Konfiguration.
com.top_logic.layout.configedit.ConfigFormControl.Commands.TOOLBAR = Symbolleiste
com.top_logic.layout.configedit.ConfigFormControl.Commands.TOOLBAR.tooltip = Nicht durch dieses Steuerelement: Die Befehle werden über <code>ConfigFormControl#commands()</code> herausgegeben, damit eine umgebende Symbolleiste sie darstellt. <p> Das tut ein aus einem Modell erzeugtes Formular, und deshalb sollte ein Konfigurationsformular innerhalb eines Panels es genauso tun - die Befehle sitzen in der Symbolleiste des Panels, und das Formular füllt das Panel. </p>
com.top_logic.layout.configedit.DatePickerFormatProvider = Datumswähler nach Format
com.top_logic.layout.configedit.DatePickerFormatProvider.Config.kind = Art
com.top_logic.layout.configedit.DatePickerFormatProvider.Config.kind.tooltip = Welchen Teil eines Zeitpunkts der Wert der beanspruchten Eigenschaft bezeichnet.
com.top_logic.layout.configedit.DatePickerFormatProvider.tooltip = <i>Konfigurations-Kontroll-Anbieter</i>, der einen <i>Datumswähler</i> einer festen <i>Art</i> erzeugt. <p> Gedacht als Implementierung eines <i>Format-Zuordnungs</i>-Eintrags, der eine Eigenschaft beansprucht, deren Wertanbieter ein Date auf einen bestimmten Teil eines Zeitpunkts einschränkt — etwa <i>Tageszeit als Date</i> auf <i>Uhrzeit</i>. Eingetragen wird er je Wertanbieter-Klasse (siehe <i>Formate</i>), nicht je Java-Typ: Ein formatiertes Date erreicht dieses Bedienelement über jene Zuordnung, noch vor dem allgemeinen Format-Textfeld, das der eingebaute Rückfall ihm sonst gibt — der Rückfall kann eine Tageszeit nicht von einem reinen Datum unterscheiden, weil beide ein Date sind, die Klasse des Wertanbieters aber schon. </p>
com.top_logic.layout.configedit.I18NStringFormatProvider = Anbieter für internationalisierte Zeichenketten
com.top_logic.layout.configedit.I18NStringFormatProvider.Config.rows = Zeilen
com.top_logic.layout.configedit.I18NStringFormatProvider.Config.rows.tooltip = Die Anzahl der sichtbaren Zeilen des Inline-Eingabefelds oder 0, um es als einzeiliges Feld darzustellen. <p> Wird für eine Eigenschaft verwendet, deren Text nicht ausdrücklich über mehrere Zeilen erstrecken soll. Der Text einer Eigenschaft, die mit der Annotation <i>„Mehrzeilig“</i>, <i>„Common Mark“</i> oder <i>„HTML“</i> versehen ist, wird in Eingabefeldern mit der Anzahl an Zeilen bearbeitet, die die Annotation vorgibt. </p>
com.top_logic.layout.configedit.I18NStringFormatProvider.tooltip = <i>Konfigurationssteuerungsanbieter</i>, der eine <i>Ressourcenschlüssel-Eigenschaft</i> so bearbeitet, wie ein <i>internationalisiertes String-Modell-Attribut</i> bearbeitet wird: ein Inline-Feld in der Sprache des Benutzers sowie eine Schaltfläche, die den Editor für die anderen Sprachen öffnet. <p> Die Implementierung für einen <i>Format-Mapping-</i> Eintrag, der eine Eigenschaft beansprucht, deren Wert-Berechnung einen <i>Ressourcenschlüssel</i> erzeugt, z. B. <i>„Wertformat</i>“. Ohne diese Beanspruchung würde eine solche Eigenschaft auf den integrierten Fallback zurückgreifen, der nur die <em>kodierte</em> Form des Werts als Text anbieten kann – eine einzige Zeichenkette, die alle Sprachen gleichzeitig enthält, in der framework-eigenen Kodierung. Niemand bearbeitet eine Übersetzung auf diese Weise; derselbe Wert in einem Modell verfügt über eine Eingabe pro Sprache sowie eine maschinelle Übersetzung zwischen diesen, und ein konfiguriertes Modell sollte sich davon nicht unterscheiden. </p> <p> Ein mehrzeiliger Text – eine Eigenschaft mit der Annotation <i>„Mehrzeilig“</i>, <i>„Common Mark“</i> oder <i>„HTML“</i> – wird in einem mehrzeiligen Eingabefeld pro Sprache bearbeitet. Ein <i>„Common Mark“</i>- oder <i>HTML</i>-Text wird formatiert angezeigt, solange er nicht bearbeitet werden kann. </p> <p> Das Beanspruchen der Eigenschaft ist auch das, was diesem Steuerelement den benötigten Wert verleiht: Durch die Beanspruchung gibt „createModel“ das typisierte <i>Konfigurationsfeld-Modell</i> über den <i>Ressourcenschlüssel</i> selbst aus, anstatt das <i>Konfigurationsformat-Feld-Modell</i> über dessen kodierten Text – und ein <i>Ressourcenschlüssel</i> ist genau das, was <i>das React-Internationalisierungs-String-Eingabesteuerelement</i> liest und schreibt. </p>
