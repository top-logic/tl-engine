model.tl.ai.access = Personal access tokens
model.tl.ai.access.AccessToken = Access token
model.tl.ai.access.AccessToken.createdAt = Created
model.tl.ai.access.AccessToken.createdAt.tooltip = When the token was created.
model.tl.ai.access.AccessToken.expiresAt = Expires
model.tl.ai.access.AccessToken.expiresAt.tooltip = From this moment on the token is refused. Empty if it does not expire.
model.tl.ai.access.AccessToken.hint = Token
model.tl.ai.access.AccessToken.hint.tooltip = The beginning of the token, to tell it apart from your other tokens. The whole token is shown only once, when it is created.
model.tl.ai.access.AccessToken.lastUsed = Last used
model.tl.ai.access.AccessToken.lastUsed.tooltip = When a client last authenticated with the token, to the minute. Empty if it was never used.
model.tl.ai.access.AccessToken.name = Name
model.tl.ai.access.AccessToken.name.tooltip = What the token is for, for example the client it is used in.
model.tl.ai.access.AccessToken.owner = Account
model.tl.ai.access.AccessToken.owner.tooltip = The account the token acts as. A request with the token has exactly the rights of this account.
model.tl.ai.access.AccessToken.secretHash = Hash
model.tl.ai.access.AccessToken.secretHash.tooltip = The SHA-256 of the token. The token itself is not stored.
model.tl.ai.access.AccessToken.tooltip = A personal access token with which a client - an MCP client such as Claude Code, or another agent over A2A - acts as the account that created it.
model.tl.ai.access.AccessTokenRequest = New access token
model.tl.ai.access.AccessTokenRequest.name = Name
model.tl.ai.access.AccessTokenRequest.name.tooltip = What the token is for, for example the client it is used in.
model.tl.ai.access.AccessTokenRequest.token = Token
model.tl.ai.access.AccessTokenRequest.token.tooltip = Copy the token now. It is not shown again, and it is not stored.
model.tl.ai.access.AccessTokenRequest.tooltip = What is asked for when an access token is created.
model.tl.ai.access.AccessTokenRequest.validForDays = Valid for (days)
model.tl.ai.access.AccessTokenRequest.validForDays.tooltip = How many days from now the token is accepted. Leave empty for a token that does not expire.
