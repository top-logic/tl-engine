com.top_logic.xio.command.XMLImportCommand.Config.postProcessing = Nachbearbeitung
com.top_logic.xio.command.XMLImportCommand.Config.postProcessing.tooltip = Funktion, die auf dem importierten Objekt aufgerufen wird, nachdem der Import erfolgreich war. <p> Die Funktion erhält das importierte Objekt als erstes Argument und das Zielmodell des Befehls als zweites Argument: </p> <pre> <code>result -> model -> ...</code> </pre> <p> Die Funktion wird innerhalb der Importtransaktion aufgerufen und kann zusätzliche Nebeneffekte erzeugen. Insbesondere, wenn der Import ein transientes Objekt erzeugt, ist die Nachbearbeitung erforderlich, um das transiente Importergebnis in ein persistentes Objekt umzuwandeln, damit der Import überhaupt eine Wirkung hat. </p>
