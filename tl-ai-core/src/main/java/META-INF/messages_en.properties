com.top_logic.tl.ai.core.execution.AgentExecutionStore$InteractionState.tooltip = Lifecycle state of an <i>interaction request</i>. Mirrors the <code>tl.ai.execution:InteractionState</code> enumeration.
com.top_logic.tl.ai.core.execution.AgentExecutionStore$InteractionType = Interaction type
com.top_logic.tl.ai.core.execution.AgentExecutionStore$InteractionType.tooltip = Kind of human-in-the-loop request. Mirrors the <code>tl.ai.execution:InteractionType</code> enumeration.
com.top_logic.tl.ai.core.execution.AgentExecutionStore$SessionKind = Session kind
com.top_logic.tl.ai.core.execution.AgentExecutionStore$SessionKind.tooltip = How an <i>agent session</i> was started. Mirrors the <code>tl.ai.execution:SessionKind</code> enumeration.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.ExecutionStatus.CANCELLED = Cancelled
com.top_logic.tl.ai.core.execution.AgentExecutionStore.ExecutionStatus.CANCELLED.tooltip = The run was cancelled/aborted.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.ExecutionStatus.COMPLETE = Complete
com.top_logic.tl.ai.core.execution.AgentExecutionStore.ExecutionStatus.COMPLETE.tooltip = The run finished normally.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.ExecutionStatus.ERROR = Error
com.top_logic.tl.ai.core.execution.AgentExecutionStore.ExecutionStatus.ERROR.tooltip = The run failed.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.ExecutionStatus.REJECTED = Rejected
com.top_logic.tl.ai.core.execution.AgentExecutionStore.ExecutionStatus.REJECTED.tooltip = The run was rejected by an approval decision.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.ExecutionStatus.RUNNING = Running
com.top_logic.tl.ai.core.execution.AgentExecutionStore.ExecutionStatus.RUNNING.tooltip = The agent loop is currently running (or crashed without reaching a terminal state).
com.top_logic.tl.ai.core.execution.AgentExecutionStore.InteractionState.CANCELLED = Cancelled
com.top_logic.tl.ai.core.execution.AgentExecutionStore.InteractionState.CANCELLED.tooltip = Withdrawn, e.g. because the run was aborted.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.InteractionState.PENDING = Pending
com.top_logic.tl.ai.core.execution.AgentExecutionStore.InteractionState.PENDING.tooltip = Waiting for a response.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.InteractionState.RESOLVED = Resolved
com.top_logic.tl.ai.core.execution.AgentExecutionStore.InteractionState.RESOLVED.tooltip = Answered by the responder.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.InteractionState.TIMED_OUT = Timed out
com.top_logic.tl.ai.core.execution.AgentExecutionStore.InteractionState.TIMED_OUT.tooltip = No response within the allowed time.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.InteractionType.APPROVAL = Approval
com.top_logic.tl.ai.core.execution.AgentExecutionStore.InteractionType.APPROVAL.tooltip = Tool-call approval.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.InteractionType.CHOICE = Choice
com.top_logic.tl.ai.core.execution.AgentExecutionStore.InteractionType.CHOICE.tooltip = Selection from options.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.InteractionType.QUESTION = Question
com.top_logic.tl.ai.core.execution.AgentExecutionStore.InteractionType.QUESTION.tooltip = Free-text question.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.SessionKind.BACKGROUND = Background
com.top_logic.tl.ai.core.execution.AgentExecutionStore.SessionKind.BACKGROUND.tooltip = Background job without an interactive surface.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.SessionKind.CHAT = Chat
com.top_logic.tl.ai.core.execution.AgentExecutionStore.SessionKind.CHAT.tooltip = Interactive chat with a person as owner.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.SessionKind.SCHEDULED = Scheduled
com.top_logic.tl.ai.core.execution.AgentExecutionStore.SessionKind.SCHEDULED.tooltip = Run triggered by a scheduler.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.SessionKind.SCRIPT = Script
com.top_logic.tl.ai.core.execution.AgentExecutionStore.SessionKind.SCRIPT.tooltip = Run started from a TL-Script function.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.tooltip = Service that persists and retrieves the <code>tl.ai.execution</code> model: <i>agent session</i>, <i>agent execution</i>, <i>interaction request</i> and <i>agent task</i>. <p> This is the single write path for agent-run persistence. Any entry point that runs an agent (chat, TL-Script, delegation, background jobs) records its run through this service, so all executions are uniformly queryable regardless of how they were started. </p> <p> All mutating methods run on a dedicated writer thread inside a fresh system interaction with their own <i>transaction</i>. Callers therefore need neither a transaction nor a committable KB context — recording works from any caller context, including read-only ones such as TL-Script evaluation during rendering (whose ImmutableDBContext cannot commit). Queries run on the calling thread and require a bound TopLogic context. </p> <p> <b>Invariant:</b> nothing reachable from a KnowledgeBase UpdateListener (or any other synchronous commit hook) may call a mutating method of this service — the caller blocks on the single writer thread, whose commit synchronously notifies those listeners, so such a call closes a deadlock cycle. </p> <p> Callers do <em>not</em> automatically see their own writes: writer commits happen in a separate session, and a subsession's stable view only advances at sanctioned points. The chat servlet advances the session revision at request begin, which covers all HTTP read-back paths. </p>
com.top_logic.tl.ai.core.execution.layout.RequestCancelCommand = Request cancel command
com.top_logic.tl.ai.core.execution.layout.RequestCancelCommand.tooltip = Requests cancellation of the selected <i>agent execution</i>. <p> Deliberately not a TL-Script transaction writing the run's cancel marker directly: the marker has to be written by the agent execution store, which runs on the store's writer thread and re-reads the run's status at the head revision first, so a run that is concurrently finishing on another cluster node is seen correctly. A plain UI transaction bypasses both. </p> <p> Cancellation is asynchronous. The node executing the run observes the committed marker at its next agent-loop turn; the run then finalizes as cancelled. The message shown here says so rather than pretending the run is already over. </p>
com.top_logic.tl.ai.core.htmlpages.GeneratedHtmlPageService = Generated HTML page service
com.top_logic.tl.ai.core.htmlpages.GeneratedHtmlPageService.tooltip = Service that persists and retrieves <i>generated HTML page</i> entities.
com.top_logic.tl.ai.core.mcp.HttpMcpTransport = HTTP mcp transport
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.bearer-token-env-var = Bearer token env var
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.bearer-token-env-var.tooltip = Name of an environment variable holding a bearer token. <p> The variable is read from the server's environment at connect time and its value is sent in the Authorization header using the Bearer scheme. This keeps the secret itself out of the configuration. </p>
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.headers = Headers
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.headers.tooltip = Static HTTP headers sent with every request. <p> Each entry is a header name and the value to send under it, e.g. an API key header the server expects in addition to the bearer token. </p>
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.url = URL
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.url.tooltip = The URL of the MCP server endpoint (e.g., "https://mcp.example.com/mcp").
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.tooltip = <i>Mcp transport configuration</i> creating an MCP HTTP transport (Streamable HTTP). <p> The MCP server runs as an external HTTP service. Authentication is handled via static headers or a bearer token resolved from an environment variable at connect time. </p>
com.top_logic.tl.ai.core.mcp.McpServerRegistry = Mcp server registry
com.top_logic.tl.ai.core.mcp.McpServerRegistry$McpServerConfig = Mcp server configuration
com.top_logic.tl.ai.core.mcp.McpServerRegistry$McpServerConfig.tooltip = Configuration for a single MCP server.
com.top_logic.tl.ai.core.mcp.McpServerRegistry.Config.servers = Servers
com.top_logic.tl.ai.core.mcp.McpServerRegistry.Config.servers.tooltip = Map of named MCP server configurations.
com.top_logic.tl.ai.core.mcp.McpServerRegistry.McpServerConfig.tool-timeout-seconds = Tool timeout seconds
com.top_logic.tl.ai.core.mcp.McpServerRegistry.McpServerConfig.tool-timeout-seconds.tooltip = Timeout in seconds for individual tool calls.
com.top_logic.tl.ai.core.mcp.McpServerRegistry.McpServerConfig.transport = Transport
com.top_logic.tl.ai.core.mcp.McpServerRegistry.McpServerConfig.transport.tooltip = Transport configuration (stdio or HTTP).
com.top_logic.tl.ai.core.mcp.McpServerRegistry.tooltip = Service managing connections to external MCP servers. <p> Configured via XML with named MCP server entries. Each server is connected at startup, and its tools are discovered via the MCP tools/list call. Agents reference servers by name via their mcpServers attribute; <i>agent factory</i> pulls the server's tools into the agent's <i>tool catalog</i>. </p>
com.top_logic.tl.ai.core.mcp.NamedValueConfig = Named value configuration
com.top_logic.tl.ai.core.mcp.NamedValueConfig.tooltip = A named string value for use in config maps. <p> Used for the environment variables and HTTP headers of an MCP transport: one entry carries the name to set and the value to set it to. </p>
com.top_logic.tl.ai.core.mcp.NamedValueConfig.value = Value
com.top_logic.tl.ai.core.mcp.NamedValueConfig.value.tooltip = The value.
com.top_logic.tl.ai.core.mcp.StdioMcpTransport = Stdio mcp transport
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.args = Arguments
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.args.tooltip = Command-line arguments passed to the command. <p> In XML config, provide as comma-separated values: args="-y,@modelcontextprotocol/server-github" </p>
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.command = Command
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.command.tooltip = The command to execute (e.g., "npx" or "python").
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.env = Env
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.env.tooltip = Environment variables for the subprocess. <p> Use this to pass API keys without writing them into the configuration: an entry value of ${env:GITHUB_TOKEN} is resolved from the server's own environment. </p>
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.tooltip = <i>Mcp transport configuration</i> creating an MCP stdio transport (subprocess). <p> The MCP server is started as a child process. Communication happens via stdin/stdout using JSON-RPC. Environment variables can be used to pass API keys or other secrets. </p>
com.top_logic.tl.ai.core.migration.RequireEmptyTableProcessor = Require empty table processor
com.top_logic.tl.ai.core.migration.RequireEmptyTableProcessor.Config.hint = Hint
com.top_logic.tl.ai.core.migration.RequireEmptyTableProcessor.Config.hint.tooltip = Explains how to get the table emptied, appended to the error message.
com.top_logic.tl.ai.core.migration.RequireEmptyTableProcessor.Config.table = Table
com.top_logic.tl.ai.core.migration.RequireEmptyTableProcessor.Config.table.tooltip = Name of the table type that must no longer contain rows.
com.top_logic.tl.ai.core.migration.RequireEmptyTableProcessor.tooltip = <i>Migration processor</i> that fails the migration when a table still holds live rows. <p> Guards a following <i>delete table processor</i>: dropping a table that still has rows destroys those rows without a trace. Placing this processor in front turns that into a refused startup with an actionable message, so the data is still there to be rescued. </p> <p> A non-empty table is reported as a <i>table not empty</i> error rather than as a logged error. That is deliberate, see <i>table not empty</i>. </p> <p> Only the current rows are counted. A versioned KnowledgeBase keeps the historic versions of already deleted objects in the same table, and those must not block the drop. </p> <p> A table that the database does not know at all is reported and accepted: an application that never deployed the module owning the table has nothing to lose. </p>
com.top_logic.tl.ai.core.provider.AuthScheme = Auth scheme
com.top_logic.tl.ai.core.provider.AuthScheme.API_KEY = Api key
com.top_logic.tl.ai.core.provider.AuthScheme.API_KEY.tooltip = Azure <code>OpenAI</code> subscription key, sent as the value of the api-key header. <p>Used when connecting directly to an Azure <code>OpenAI</code> resource endpoint that requires the subscription key in the api-key header rather than an Authorization bearer token.</p>
com.top_logic.tl.ai.core.provider.AuthScheme.BEARER = Bearer
com.top_logic.tl.ai.core.provider.AuthScheme.BEARER.tooltip = Standard OAuth2 bearer token, sent as the Authorization header with the Bearer scheme. <p>Used by <code>OpenAI</code>, Mistral, <code>xAI</code>, and Azure-compatible gateways such as Nexus that accept bearer tokens in the standard header.</p>
com.top_logic.tl.ai.core.provider.AuthScheme.tooltip = HTTP authentication scheme used when sending requests to an LLM provider endpoint. <p><i>Bearer</i> covers the standard <code>OpenAI</code> style: the key follows the Bearer scheme in the Authorization header. <i>Api key</i> covers the Azure <code>OpenAI</code> convention of sending the key in a plain api-key header without a scheme prefix.</p>
com.top_logic.tl.ai.core.provider.EffortLevels$Kind = Kind
com.top_logic.tl.ai.core.provider.EffortLevels$Kind.tooltip = Which of the two assignment fields a level belongs in.
com.top_logic.tl.ai.core.provider.EffortLevels.Kind.NONE = None
com.top_logic.tl.ai.core.provider.EffortLevels.Kind.NONE.tooltip = The model offers no effort setting.
com.top_logic.tl.ai.core.provider.EffortLevels.Kind.REASONING_EFFORT = Reasoning effort
com.top_logic.tl.ai.core.provider.EffortLevels.Kind.REASONING_EFFORT.tooltip = The model spends effort on reasoning before it answers, as OpenAI and xAI models do.
com.top_logic.tl.ai.core.provider.EffortLevels.Kind.THINKING_EFFORT = Thinking effort
com.top_logic.tl.ai.core.provider.EffortLevels.Kind.THINKING_EFFORT.tooltip = The model spends effort on thinking before it answers, as Anthropic models do.
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.base-url = Base URL
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.base-url.tooltip = The base URL of the provider API endpoint.
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.catalog-provider-id = Catalog provider ID
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.catalog-provider-id.tooltip = The provider ID used to look up model metadata from the remote catalog (models.dev). <p> Each provider supplies a sensible default matching its models.dev entry. Leave empty for providers that have no remote catalog (e.g. local servers) — their models must be defined in the model catalog manually. </p>
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.connect-timeout = Connect timeout
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.connect-timeout.tooltip = TCP connection timeout in seconds. <p> Controls how long the HTTP client waits to establish a TCP connection to the provider endpoint before giving up. </p>
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.custom-headers = Custom headers
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.custom-headers.tooltip = Extra HTTP headers sent on every request to this provider. <p> Useful for custom authentication schemes, routing headers, or provider-specific metadata that must accompany each API call. </p>
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.models = Models
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.models.tooltip = Model names enabled for this provider. <p> Only models listed here are available for use. If empty, no models are exposed from this provider. </p>
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.request-timeout = Request timeout
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.request-timeout.tooltip = Total streaming request timeout in seconds. <p> Maximum wall-clock time allowed for a complete streaming request, including the time spent receiving streamed tokens. A generous default accommodates long-running agent responses. </p>
com.top_logic.tl.ai.core.provider.LLMService = LLM service
com.top_logic.tl.ai.core.provider.LLMService$AgentExecutionConfig = Agent execution configuration
com.top_logic.tl.ai.core.provider.LLMService$AgentExecutionConfig.tooltip = Agent execution configuration: chat entry point, default model, and per-agent overrides. <p> Agent definitions (identity, system prompt, tools, delegations) are managed by <i>TopLogic-Agents and Skills</i> and the knowledge base. This section controls the operational side: which agent serves as the chat entry point, which model to use by default, and per-agent overrides for model selection and execution parameters. </p>
com.top_logic.tl.ai.core.provider.LLMService$AgentOverride = Agent override
com.top_logic.tl.ai.core.provider.LLMService$AgentOverride.tooltip = Per-agent override for model selection and execution parameters. <p> Each entry overrides the default model for a specific agent and optionally configures execution parameters (max turns, timeouts, tool choice) and model-specific settings (temperature, reasoning effort). Parameters left null inherit defaults from the model catalog or system defaults. </p>
com.top_logic.tl.ai.core.provider.LLMService$ModelCatalogConfig = Model catalog configuration
com.top_logic.tl.ai.core.provider.LLMService$ModelCatalogConfig.tooltip = Configuration for the model metadata catalog. <p> Provides read-only metadata about each model's capabilities (tool calling, reasoning, temperature support) and limits (context window, max output tokens). The catalog is fetched from <a href="https://models.dev">models.dev</a> on startup for all models configured in the provider section. Models not found in the remote catalog (e.g. locally hosted models) can be defined manually in the model overrides. </p>
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.agent-overrides = Agent overrides
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.agent-overrides.tooltip = Per-agent overrides. Agents not listed here use the default model. Applies to all agents regardless of source (config-defined or KB).
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.chat-entry-point = Chat entry point
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.chat-entry-point.tooltip = The agent that serves as the main entry point when a user opens a new chat session. <p> This agent receives the initial user message and orchestrates the conversation. It may delegate to other agents via its delegations list. </p>
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.default-model = Default model
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.default-model.tooltip = The fallback model used by agents that have no explicit override in <i>Agent overrides</i>. <p> To assign a specific model (and optional tuning parameters) to an individual agent, add an entry to the agent overrides map instead. </p>
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.default-provider = Default provider
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.default-provider.tooltip = The provider serving the default model, or empty when only one provider exposes it. <p> Applies to every agent that has no provider of its own. Left empty for a default model exposed by two providers, the service refuses to start rather than pick one by configuration order. </p>
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.owner = Owner
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.owner.tooltip = The enclosing service <i>configuration</i>, used to resolve configured models from its provider section within the same edit form.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.context-window = Context window
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.context-window.tooltip = Context window size override, or null for catalog default.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-retries = Maximum retries
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-retries.tooltip = Maximum retries on transient errors, or null for default.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-tokens = Maximum tokens
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-tokens.tooltip = Maximum output tokens per LLM call, or null for catalog default.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-tool-result-chars = Maximum tool result chars
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-tool-result-chars.tooltip = Maximum characters per tool result, or null for default.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-turns = Maximum turns
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-turns.tooltip = Maximum agent loop turns, or null for default.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.model = Model
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.model.tooltip = The model to use for this agent.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.provider = Provider
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.provider.tooltip = The provider serving this agent's model, or empty when only one provider exposes it. <p> Name a provider when two provider entries expose the same model - separate accounts, or an official endpoint next to a gateway. Left empty for a model exposed twice, the service refuses to start. An agent inheriting the default model inherits the default provider. </p>
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.reasoning-effort = Reasoning effort
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.reasoning-effort.tooltip = <code>OpenAI</code>/<code>xAI</code> reasoning effort (low/medium/high), or null.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.reasoning-summary = Reasoning summary
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.reasoning-summary.tooltip = <code>OpenAI</code>/<code>xAI</code> reasoning summary (auto/detailed), or null.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.temperature = Temperature
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.temperature.tooltip = Sampling temperature, or null for default.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.thinking-effort = Thinking effort
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.thinking-effort.tooltip = Anthropic thinking effort (low/medium/high/max), or null.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.timeout-seconds = Timeout seconds
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.timeout-seconds.tooltip = Request timeout in seconds, or null for default.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.tool-choice = Tool choice
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.tool-choice.tooltip = Tool choice (AUTO/REQUIRED/NONE), or null for provider default.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.top-k = Top-K
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.top-k.tooltip = Anthropic top-k parameter, or null.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.top-p = Top-P
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.top-p.tooltip = Top-p sampling parameter, or null for default.
com.top_logic.tl.ai.core.provider.LLMService.Config.agent-execution = Agent execution
com.top_logic.tl.ai.core.provider.LLMService.Config.agent-execution.tooltip = Agent execution configuration: chat entry point, default model, and per-agent overrides for model selection and execution parameters.
com.top_logic.tl.ai.core.provider.LLMService.Config.environment = Environment
com.top_logic.tl.ai.core.provider.LLMService.Config.environment.tooltip = What every agent run is told about the situation it runs in: the wording of the environment block, the application name the model is given, and whether the accounts' own preference texts are part of it.
com.top_logic.tl.ai.core.provider.LLMService.Config.model-catalog = Model catalog
com.top_logic.tl.ai.core.provider.LLMService.Config.model-catalog.tooltip = Model metadata catalog describing each model's capabilities and limits. <p> Populated automatically from the remote <a href="https://models.dev">models.dev</a> catalog on startup. Manual overrides can be added for models not listed in the remote catalog (e.g. local or custom-hosted models). </p>
com.top_logic.tl.ai.core.provider.LLMService.Config.providers = Providers
com.top_logic.tl.ai.core.provider.LLMService.Config.providers.tooltip = The configured LLM providers, keyed by provider name. <p> Each entry carries provider-specific properties. </p>
com.top_logic.tl.ai.core.provider.LLMService.ModelCatalogConfig.catalog-url = Catalog URL
com.top_logic.tl.ai.core.provider.LLMService.ModelCatalogConfig.catalog-url.tooltip = The URL of the remote model catalog.
com.top_logic.tl.ai.core.provider.LLMService.ModelCatalogConfig.llm-configuration = Model metadata
com.top_logic.tl.ai.core.provider.LLMService.ModelCatalogConfig.llm-configuration.tooltip = Per-model metadata (limits, capabilities). <p> Populated automatically from the remote catalog on startup. Read-only — do not modify manually. </p>
com.top_logic.tl.ai.core.provider.LLMService.ModelCatalogConfig.model-overrides = Model overrides
com.top_logic.tl.ai.core.provider.LLMService.ModelCatalogConfig.model-overrides.tooltip = Manually defined model metadata for models not in the remote catalog. <p> Use this for local models or <code>OpenAI</code>-compatible endpoints whose models are not listed on models.dev. Entries here take precedence over catalog entries with the same name. </p>
com.top_logic.tl.ai.core.provider.LLMService.tooltip = Central service for LLM provider management, model resolution, and agent execution configuration. <p> The service configuration is organized into three sections: </p> <ol> <li><b>Providers</b> — connection details for each LLM provider (API keys, base URLs, model allowlists). Each provider entry defines how to reach a specific LLM API endpoint and which models are enabled.</li> <li><b>Agent Execution</b> — configures the chat entry-point agent, the default model used by all agents, and optional per-agent overrides for model selection and execution parameters (temperature, max tokens, timeouts, reasoning effort, etc.).</li> <li><b>Model Catalog</b> — read-only metadata describing each model's capabilities (tool calling, reasoning, temperature support) and limits (context window, max output tokens). Populated automatically from the <a href="https://models.dev">models.dev</a> remote catalog on startup, with optional manual overrides for local or unlisted models.</li> </ol>
com.top_logic.tl.ai.core.provider.ProviderException$Kind = Kind
com.top_logic.tl.ai.core.provider.ProviderException$Kind.tooltip = Classification of the error.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.AUTHENTICATION = Authentication
com.top_logic.tl.ai.core.provider.ProviderException.Kind.AUTHENTICATION.tooltip = 401/403 — invalid or expired API key.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.BILLING = Billing
com.top_logic.tl.ai.core.provider.ProviderException.Kind.BILLING.tooltip = 402 — billing or payment issue. Terminal, not retryable.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.CONTEXT_WINDOW_EXCEEDED = Context window exceeded
com.top_logic.tl.ai.core.provider.ProviderException.Kind.CONTEXT_WINDOW_EXCEEDED.tooltip = Request too large for the model's context window.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.INVALID_REQUEST = Invalid request
com.top_logic.tl.ai.core.provider.ProviderException.Kind.INVALID_REQUEST.tooltip = 400 — malformed request.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.OVERLOADED = Overloaded
com.top_logic.tl.ai.core.provider.ProviderException.Kind.OVERLOADED.tooltip = 529 or 5xx — provider overloaded or temporarily unavailable.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.RATE_LIMITED = Rate limited
com.top_logic.tl.ai.core.provider.ProviderException.Kind.RATE_LIMITED.tooltip = 429 — rate limited. Check retryAfter().
com.top_logic.tl.ai.core.provider.ProviderException.Kind.UNKNOWN = Unknown
com.top_logic.tl.ai.core.provider.ProviderException.Kind.UNKNOWN.tooltip = Unclassified error.
com.top_logic.tl.ai.core.provider.ResponseFormat$Kind = Kind
com.top_logic.tl.ai.core.provider.ResponseFormat$Kind.tooltip = The shape of a <i>response format</i>.
com.top_logic.tl.ai.core.provider.ResponseFormat.Kind.JSON = JSON
com.top_logic.tl.ai.core.provider.ResponseFormat.Kind.JSON.tooltip = Some JSON object, with no schema saying which.
com.top_logic.tl.ai.core.provider.ResponseFormat.Kind.JSON_SCHEMA = JSON schema
com.top_logic.tl.ai.core.provider.ResponseFormat.Kind.JSON_SCHEMA.tooltip = A JSON object satisfying the schema this format carries.
com.top_logic.tl.ai.core.provider.ResponseFormat.Kind.TEXT = Text
com.top_logic.tl.ai.core.provider.ResponseFormat.Kind.TEXT.tooltip = Plain text response (default).
com.top_logic.tl.ai.core.provider.ToolChoice = Tool choice
com.top_logic.tl.ai.core.provider.ToolChoice.AUTO = Auto
com.top_logic.tl.ai.core.provider.ToolChoice.AUTO.tooltip = The LLM decides whether to call a tool (default).
com.top_logic.tl.ai.core.provider.ToolChoice.NONE = None
com.top_logic.tl.ai.core.provider.ToolChoice.NONE.tooltip = The LLM must not call any tool.
com.top_logic.tl.ai.core.provider.ToolChoice.REQUIRED = Required
com.top_logic.tl.ai.core.provider.ToolChoice.REQUIRED.tooltip = The LLM must call at least one tool.
com.top_logic.tl.ai.core.provider.ToolChoice.tooltip = Controls how the LLM selects tools during a request.
com.top_logic.tl.ai.core.provider.anthropic.AnthropicProviderConfig = Anthropic
com.top_logic.tl.ai.core.provider.anthropic.AnthropicProviderConfig.Config.api-key = Api key
com.top_logic.tl.ai.core.provider.anthropic.AnthropicProviderConfig.Config.api-key.tooltip = The API key for Anthropic authentication.
com.top_logic.tl.ai.core.provider.anthropic.AnthropicProviderConfig.Config.version = Version
com.top_logic.tl.ai.core.provider.anthropic.AnthropicProviderConfig.Config.version.tooltip = The Anthropic API version string sent as anthropic-version header.
com.top_logic.tl.ai.core.provider.anthropic.AnthropicProviderConfig.tooltip = <i>LLM provider configuration</i> for the Anthropic Messages API. <p> Provides the version property specific to Anthropic's anthropic-version header requirement. </p>
com.top_logic.tl.ai.core.provider.bedrock.BedrockConverseProviderConfig = AWS Bedrock
com.top_logic.tl.ai.core.provider.bedrock.BedrockConverseProviderConfig.Config.api-key = Api key
com.top_logic.tl.ai.core.provider.bedrock.BedrockConverseProviderConfig.Config.api-key.tooltip = The API key forwarded as Authorization: Bearer. <p>May be null for endpoints that use a different authentication mechanism (e.g. IAM instance roles or custom gateway injection).</p>
com.top_logic.tl.ai.core.provider.bedrock.BedrockConverseProviderConfig.tooltip = <i>LLM provider configuration</i> preset for the AWS Bedrock Converse streaming API. <p> Configures a <i>bedrock converse provider</i> against any Bedrock-compatible endpoint, including Nexus-Claude gateways and direct regional AWS Bedrock endpoints (https://bedrock-runtime.{region}.amazonaws.com). Authentication uses Bearer-token scheme inherited from <i>bedrock converse provider</i>. </p> <p> No model-listing endpoint exists on Bedrock, so models must be added to the models list manually and discoverModels() always returns an empty list. </p>
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry$Config = Configuration
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry$Config.tooltip = Model metadata configuration.
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry$OverrideConfig = Override configuration
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry$OverrideConfig.tooltip = Editable model metadata for manually configured models (e.g. local or <code>OpenAI</code>-compatible endpoints) that are not in the remote catalog. <p> Unlike <i>configuration</i>, these properties are writable in the admin UI and are not cleared on startup. </p>
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.attachment = File attachments
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.attachment.tooltip = Whether the model supports file attachments.
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.context-window = Context window
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.context-window.tooltip = Maximum input context window size in tokens.
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.knowledge-cutoff = Knowledge cutoff
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.knowledge-cutoff.tooltip = Training data knowledge cutoff date (e.g. "2026-01-31").
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.last-updated = Last updated
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.last-updated.tooltip = Date of the last update to this model.
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.max-input = Maximum input
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.max-input.tooltip = Maximum input tokens, if the model distinguishes input from context limits.
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.max-output = Maximum output
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.max-output.tooltip = Maximum output tokens per response.
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.open-weights = Open weights
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.open-weights.tooltip = Whether the model weights are publicly available.
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.reasoning = Reasoning support
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.reasoning.tooltip = Whether the model supports extended thinking / chain-of-thought reasoning.
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.release-date = Release date
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.release-date.tooltip = Model release date.
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.status = Status
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.status.tooltip = Lifecycle status of the model, e.g. "alpha", "beta", or "deprecated". Empty when the model is generally available.
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.structured-output = Structured output support
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.structured-output.tooltip = Whether the model supports structured (JSON) output.
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.temperature = Temperature support
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.temperature.tooltip = Whether the model supports the temperature sampling parameter.
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.tool-call = Tool calling
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.tool-call.tooltip = Whether the model supports tool/function calling.
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.OverrideConfig.context-window = Context window
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.OverrideConfig.context-window.tooltip = Maximum input context window size in tokens.
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.OverrideConfig.max-output = Maximum output
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.OverrideConfig.max-output.tooltip = Maximum output tokens per response.
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.OverrideConfig.reasoning = Reasoning
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.OverrideConfig.reasoning.tooltip = Whether the model supports extended thinking / chain-of-thought reasoning.
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.OverrideConfig.temperature = Temperature
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.OverrideConfig.temperature.tooltip = Whether the model supports the temperature sampling parameter.
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.OverrideConfig.tool-call = Tool call
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.OverrideConfig.tool-call.tooltip = Whether the model supports tool/function calling.
com.top_logic.tl.ai.core.provider.chatcompletions.TokenLimitParam = Token limit parameter
com.top_logic.tl.ai.core.provider.chatcompletions.TokenLimitParam.MAX_COMPLETION_TOKENS = Maximum completion tokens
com.top_logic.tl.ai.core.provider.chatcompletions.TokenLimitParam.MAX_COMPLETION_TOKENS.tooltip = Max_completion_tokens field, required by GPT-5/o-series reasoning models on Azure <code>OpenAI</code> and real <code>OpenAI</code> Chat Completions endpoints.
com.top_logic.tl.ai.core.provider.chatcompletions.TokenLimitParam.MAX_TOKENS = Maximum tokens
com.top_logic.tl.ai.core.provider.chatcompletions.TokenLimitParam.MAX_TOKENS.tooltip = Legacy max_tokens field, understood by Mistral, <code>xAI</code>, and local servers.
com.top_logic.tl.ai.core.provider.chatcompletions.TokenLimitParam.tooltip = JSON field name carrying the output-token limit in a Chat Completions request body. <p>The Chat Completions API historically used max_tokens, but GPT-5 and o-series reasoning models reject it and require max_completion_tokens (which also accounts for hidden reasoning tokens). Other <code>OpenAI</code>-compatible backends (Mistral, <code>xAI</code>, local servers) only understand max_tokens, so the field name is selectable per provider preset.</p>
com.top_logic.tl.ai.core.provider.local.LocalProviderConfig = Local (OpenAI-compatible)
com.top_logic.tl.ai.core.provider.local.LocalProviderConfig.tooltip = <i>LLM provider configuration</i> for local <code>OpenAI</code>-compatible servers (Ollama, LM Studio, <code>vLLM</code>). <p> The base URL is mandatory and no API key is required. Local servers speak the <code>OpenAI</code> Chat Completions protocol (/v1/chat/completions), so this config produces a <i>chat completions provider</i>. </p>
com.top_logic.tl.ai.core.provider.mistral.MistralProviderConfig = Mistral
com.top_logic.tl.ai.core.provider.mistral.MistralProviderConfig.Config.api-key = Api key
com.top_logic.tl.ai.core.provider.mistral.MistralProviderConfig.Config.api-key.tooltip = The API key for Mistral authentication.
com.top_logic.tl.ai.core.provider.mistral.MistralProviderConfig.tooltip = <i>LLM provider configuration</i> for the Mistral AI API.
com.top_logic.tl.ai.core.provider.openai.AzureOpenAIProviderConfig = Azure OpenAI
com.top_logic.tl.ai.core.provider.openai.AzureOpenAIProviderConfig.Config.api-key = Api key
com.top_logic.tl.ai.core.provider.openai.AzureOpenAIProviderConfig.Config.api-key.tooltip = The API key for authentication. <p>For Azure <code>OpenAI</code> with <i>api key</i> this is the Azure subscription key. For gateway deployments using <i>bearer</i> this is the bearer token.</p>
com.top_logic.tl.ai.core.provider.openai.AzureOpenAIProviderConfig.Config.api-version = Api version
com.top_logic.tl.ai.core.provider.openai.AzureOpenAIProviderConfig.Config.api-version.tooltip = The api-version query parameter sent on every request. <p>Defaults to 2024-10-21, which is the version required by Nexus GPT and Carina chat gateways as well as production Azure <code>OpenAI</code> deployments.</p>
com.top_logic.tl.ai.core.provider.openai.AzureOpenAIProviderConfig.Config.auth-scheme = Auth scheme
com.top_logic.tl.ai.core.provider.openai.AzureOpenAIProviderConfig.Config.auth-scheme.tooltip = The HTTP authentication scheme used to send the API key. <p><i>Bearer</i> (the default) places the key in the Authorization header, which is what Nexus and Carina gateways expect. <i>Api key</i> places it in the api-key header, which is required by real Azure <code>OpenAI</code> resource endpoints.</p>
com.top_logic.tl.ai.core.provider.openai.AzureOpenAIProviderConfig.tooltip = <i>LLM provider configuration</i> preset for Azure <code>OpenAI</code> Chat Completions deployment endpoints. <p> Configures a <i>chat completions provider</i> with the Azure-specific deployment path /openai/deployments/{model}/chat/completions, an api-version query parameter, and a selectable authentication scheme (<i>bearer</i> for gateways such as Nexus GPT / Carina chat; <i>api key</i> for real Azure <code>OpenAI</code> subscription-key auth). No model-listing endpoint is available on Azure, so models must be added to the models list manually. </p>
com.top_logic.tl.ai.core.provider.openai.OpenAICompatibleProviderConfig = OpenAI-compatible
com.top_logic.tl.ai.core.provider.openai.OpenAICompatibleProviderConfig.Config.api-key = Api key
com.top_logic.tl.ai.core.provider.openai.OpenAICompatibleProviderConfig.Config.api-key.tooltip = The API key for authentication. <p> Optional — some services use different authentication mechanisms. </p>
com.top_logic.tl.ai.core.provider.openai.OpenAICompatibleProviderConfig.tooltip = <i>LLM provider configuration</i> for third-party services that implement the <code>OpenAI</code> Chat Completions protocol. <p> Unlike <i>OpenAI</i>, the base URL is mandatory (there is no sensible default). The API key is optional since some services use different authentication mechanisms. Produces a <i>chat completions provider</i> targeting /v1/chat/completions. </p>
com.top_logic.tl.ai.core.provider.openai.OpenAIProviderConfig = OpenAI
com.top_logic.tl.ai.core.provider.openai.OpenAIProviderConfig.Config.api-key = Api key
com.top_logic.tl.ai.core.provider.openai.OpenAIProviderConfig.Config.api-key.tooltip = The API key for <code>OpenAI</code> authentication.
com.top_logic.tl.ai.core.provider.openai.OpenAIProviderConfig.tooltip = <i>LLM provider configuration</i> for the <code>OpenAI</code> cloud API.
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig = xAI
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig$Protocol = Protocol
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig$Protocol.tooltip = Wire protocol to use when talking to the <code>xAI</code> endpoint.
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Config.api-key = Api key
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Config.api-key.tooltip = The API key for <code>xAI</code> authentication.
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Config.protocol = Protocol
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Config.protocol.tooltip = The wire protocol to use when communicating with the <code>xAI</code> endpoint. <p> <i>Chat completions</i> produces a <i>chat completions provider</i>; <i>responses</i> produces an <i>OpenAI Responses provider</i>. </p>
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Protocol.CHAT_COMPLETIONS = Chat completions
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Protocol.CHAT_COMPLETIONS.tooltip = <code>OpenAI</code> Chat Completions protocol (/v1/chat/completions, SSE with [DONE]).
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Protocol.RESPONSES = Responses
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Protocol.RESPONSES.tooltip = <code>OpenAI</code> Responses protocol (/v1/responses, event-typed SSE).
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.tooltip = <i>LLM provider configuration</i> for the <code>xAI</code> (Grok) API. <p> The <code>xAI</code> API supports both the <code>OpenAI</code> Chat Completions protocol (/v1/chat/completions) and the <code>OpenAI</code> Responses protocol (/v1/responses). Use <i>Protocol</i> to select the wire format. The default is <i>chat completions</i>. </p>
com.top_logic.tl.ai.core.screenshots.ScreenshotService = Screenshot service
com.top_logic.tl.ai.core.screenshots.ScreenshotService.tooltip = Service that persists <i>screenshot</i> business objects (a captured PNG plus its metadata). <p> Mirrors GeneratedHtmlPageService in shape, with one deliberate difference: it does <b>not</b> open its own Transaction. Screenshots are created by the browserScreenshot agent verb, a DATA_WRITE tool whose transaction is opened and committed by the agent loop's <i>transaction scope</i> (the "tool transaction seam"). Creating the object in that ambient transaction keeps the screenshot atomic with the rest of the turn - it is committed when the turn commits and rolled back if the turn is rolled back. Programmatic callers (and tests) therefore supply their own transaction around the screenshot-creating call. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChat = Agent chat
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChat.param.agentName.tooltip = The agent name as configured in the knowledge base.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChat.param.userMessage.tooltip = The user message to send to the agent.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChat.return = The agent's final text response.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChat.tooltip = Runs a named agent from the <i>agent factory</i> registry with a single user message. <p> The agent is resolved by name from the tl.ai.core:Agent model instances. A fresh <i>conversation</i> is created for each call; no conversation history is retained between invocations. </p> <p> The whole agent loop runs inline on the calling thread and blocks until the run finishes, which can take minutes. Called from a request, it holds that request (and its servlet thread) for the entire run. </p> <p> <b>Not usable from the Script console. Use <i>agentChatAsync</i> there.</b> A request pins the knowledge-base revision it started at, and an inline run commits past it: the run's own <i>agent session</i>/<i>agent execution</i> records are committed out-of-band on the <i>agent execution store</i> writer thread, and any writing tool the agent calls commits as well. Merely recording the run is therefore enough. When the console then renders the result row, the cache refuses the request's now-stale revision and the request fails with KnowledgeBaseRuntimeException: Session revision invalid: Expected 95 but got 89 (the revision numbers vary) - after the agent has already done its work. The symptom is a long hang followed by an internal error, not a lost run. </p> <p> Reading an async run back needs a <b>second</b> console execution: within the request that started it, <i>agentRunStatus</i> returns null (not RUNNING) for the same revision-pinning reason, however long the script waits. See <i>agentChatAsync</i>. </p> <p> Acts as the account that executed the script: the run's <i>tool context</i> is built for the user bound to the calling thread, so every tool call is authorized against that account's roles and model access against that account's rights, and the call is refused outright when the calling thread has no user. There is no unrestricted mode to fall back to. A script has no approval surface, so the tool calls the account is permitted to make are auto-approved rather than confirmed by a human. </p> <p> Example usage in TL-Script: </p> <pre> aiAgentChat("my-agent", "Summarize the latest changes.") </pre>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChatAsync = Agent chat async
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChatAsync.param.agentName.tooltip = The agent name as configured in the knowledge base.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChatAsync.param.userMessage.tooltip = The user message to send to the agent.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChatAsync.return = The session's persistent id as a <i>string</i> handle to poll for status and result.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChatAsync.tooltip = Starts a named agent on a background thread and returns immediately with a handle. <p> Unlike <i>agentChat</i>, which runs the agent loop synchronously on the calling thread and blocks until it finishes, this function submits the run to the <i>scheduler service</i> and returns right away. The return value is the session's persistent id as a plain <i>string</i> handle: poll it with <i>agentRunStatus</i> and <i>agentRunResult</i> to observe progress and retrieve the transcript once the run is COMPLETE. </p> <p> The background run re-enters the calling user's sub-session (captured synchronously here on the calling thread, as it cannot be read off-thread), so the agent and its tools act as that user with that user's permissions. A BACKGROUND-kind <i>agent session</i> is created up front so the caller always receives a usable handle; the execution record is created before the first model call, once the loop starts, and finalized with status and transcript when it ends (including on failure, recorded as ERROR). </p> <p> <b>Warning - unattended auto-approval:</b> a background run has no human to answer tool-approval prompts, so every tool call is auto-approved. An async run can therefore perform any write/destructive tool action (delete data, call external systems, ...) unattended. Only start async runs for agents you trust to act without supervision. An application that has configured a tool access policy can bound this: the run is additionally restricted to that policy's background allowlist, precisely because approval is the control it has lost. </p> <p> <b>Caveat - detached transaction:</b> the background run commits in its own transaction, independent of the caller's. It cannot see the caller's uncommitted changes, and if this function is called from a business transaction that later rolls back, the agent (and its side effects) will still have run. </p> <p> <b>Poll the handle in a separate request.</b> The run stays invisible for the rest of the request that started it, however long that request sleeps: the session was committed at a revision newer than this request's pinned one, so the handle does not resolve here and <i>agentRunStatus</i> returns null - not RUNNING. In the Script console this means two executions: one starts the run and keeps the handle, a later one reads status and result. Carry the handle over with storeInSession/loadFromSession, or paste it into the follow-up script. </p> <p> Example usage in TL-Script. The first execution starts the run and keeps its handle: </p> <pre> { handle = aiAgentChatAsync("my-agent", "Summarize the latest changes."); $handle.storeInSession(key: "my-run"); $handle; } </pre> <p> A later execution, once the run has finished, reads it back: </p> <pre> { handle = loadFromSession("my-run"); aiAgentRunStatus($handle) == "COMPLETE" ? aiAgentRunResult($handle) : null; } </pre>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunCancel = Agent run cancel
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunCancel.param.handle.tooltip = The string session-id handle returned by <i>agentChatAsync</i>, an <i>agent session</i> directly, an <i>agent execution</i> directly, or a run-id string.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunCancel.return = True if a still-running run was signalled to cancel; false if the handle could not be resolved or the run was already terminal.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunCancel.tooltip = Requests cancellation of a running async agent run started with <i>agentChatAsync</i>. <p> Cluster-safe: the handle is resolved to its top-level execution and the run's persisted cancel marker is set and committed - a normal KB write that works from any node, so the node receiving the cancel need not be the node running the job. The running node observes the marker at its next agent-loop turn and cancels the run, which then finalizes as CANCELLED. Cancellation is therefore asynchronous: poll <i>agentRunStatus</i> to observe the run reach CANCELLED. </p> <p> A no-op for a run that has already reached a terminal state (nothing left to cancel). </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunError = Agent run error
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunError.param.handle.tooltip = The string session-id handle returned by <i>agentChatAsync</i>, an <i>agent session</i> directly, an <i>agent execution</i> directly, or a run-id string.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunError.return = The recorded error message, or null if there is none.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunError.tooltip = Returns what went wrong in an async agent run, without raising it. <p> This is the error message <i>agentRunResult</i> would raise: the provider's own message for a run that failed against the model, the exception message for a run that failed before or around it, null for a run that is still going or that succeeded. Use it when the script wants to record or display the failure rather than be stopped by it. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunResult = Agent run result
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunResult.param.handle.tooltip = The string session-id handle returned by <i>agentChatAsync</i>, an <i>agent session</i> directly, an <i>agent execution</i> directly, or a run-id string.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunResult.return = The final answer text when the run is COMPLETE, or null while it is not finished.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunResult.tooltip = Returns the final answer of an async agent run once it is <i>complete</i>. <p> This is symmetric with the synchronous <i>agentChat</i>, in both directions: it returns the same final-answer string that agentChat would have returned for the run - the persisted response, not the transcript - and it raises what agentChat would have raised. A run that ended in ERROR, CANCELLED or REJECTED therefore fails here with the recorded error message rather than reading as an absent answer. Use <i>agentRunTranscript</i> for the full conversation log. </p> <p> null means only "not finished yet": the handle resolves to no execution (queued, or not yet visible in this request's revision) or the run is still RUNNING. A script that wants to handle a failure instead of failing asks <i>agentRunStatus</i> first and reads <i>agentRunError</i>; the documented polling shape (aiAgentRunStatus($h) == "COMPLETE" ? aiAgentRunResult($h) : null) never reaches the raise. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunStatus = Agent run status
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunStatus.param.handle.tooltip = The string session-id handle returned by <i>agentChatAsync</i>, an <i>agent session</i> directly, an <i>agent execution</i> directly, or a run-id string.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunStatus.return = The status name, or null if the handle cannot be resolved to a run.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunStatus.tooltip = Returns the status of an async agent run started with <i>agentChatAsync</i>. <p> The status is one of the <i>execution status</i> names (RUNNING, COMPLETE, ERROR, CANCELLED, REJECTED). While the run is still queued or its recording has not yet become visible on the calling thread, RUNNING is returned. </p> <p> <b>Not in the request that started the run.</b> Called from the same request as <i>agentChatAsync</i>, this returns null rather than RUNNING, however long the script waits in between: the run's session was committed at a revision newer than that request's pinned one, so the handle resolves to nothing there and an unresolvable handle cannot be reported as running. Poll from a later request, i.e. from a separate Script console execution. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunTranscript = Agent run transcript
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunTranscript.param.handle.tooltip = The string session-id handle returned by <i>agentChatAsync</i>, an <i>agent session</i> directly, an <i>agent execution</i> directly, or a run-id string.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunTranscript.return = The serialized transcript, or null if the handle cannot be resolved or no transcript has been recorded yet.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunTranscript.tooltip = Returns the full conversation log (transcript) of an async agent run. <p> The transcript is the serialized per-run conversation log (as produced by <i>conversation log serializer</i>). It is written at run finalization, so it is null while the run is still RUNNING and becomes available once the run reaches any terminal state - including ERROR and CANCELLED, where the partial log is the most useful diagnostic. For the agent's final answer alone, use <i>agentRunResult</i>. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool = Call tool
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool.param.parameters.tooltip = A map of parameter names to values, or null if the tool has no parameters.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool.param.toolName.tooltip = The qualified name of the tool to invoke.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool.return = The result of the tool execution as a string.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool.tooltip = Invokes a tool manually with the given parameters. <p> This function allows direct invocation of registered tools from TL-Script. The tool is identified by its qualified name in the format factory-name.tool-name. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat = Chat
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.param.messages.tooltip = A list of messages. Each message can be: <ul> <li>String: Treated as user text message</li> <li>Map with "role" and "content": Explicit role (system/user/assistant). Content can be string, binary data, or a list of mixed content.</li> <li>Binary data: Treated as user image/document message</li> </ul>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.param.model.tooltip = The model name to use, or null to use the default model configured in <i>LLM service</i>.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.param.responseFormat.tooltip = The response format specification, which reaches the provider's request. Can be: <ul> <li>null: No specific format requirement</li> <li>String "text": the provider default</li> <li>String "json": some JSON object, with nothing saying which. Not every provider has such a mode - Anthropic has not - and one that has not refuses the call.</li> <li>Map with "schema" (the JSON schema the answer must satisfy), and optionally "name" (what the provider registers the schema under, default "response") and "strict" (whether the provider must reject its own output when it does not validate, default false). This is the shape worth using: a JSON mode still lets the model choose its own field names.</li> </ul>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.param.tools.tooltip = A collection of qualified tool names to make available to the AI agent (e.g., ["mytools.calculateSum", "texttools.formatText"]), or null to provide no tools.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.return = The assistant's response text.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.tooltip = Sends a multi-turn conversation to a chat completion provider. <p> Messages can be strings, maps with role/content, or lists. Content can be text strings or a binary attachment carrying text, an image or a PDF document. An attachment of any other content type is refused, naming it: no model provider can carry it. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.models = Models
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.models.return = An immutable list of all configured model names.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.models.tooltip = Returns a list of all available model names from the <i>LLM service</i>. <p> Model names can be passed to the <i>chat</i> function to select which AI model to use. The returned list maintains a consistent order across calls. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.sessionDelete = Session delete
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.sessionDelete.param.session.tooltip = The tl.ai.execution:AgentSession to delete.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.sessionDelete.return = Always true; a refusal is a <i>TopLogic exception</i>, not a false.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.sessionDelete.tooltip = Deletes a chat session with everything recorded under it, after asking any live run of it to stop. <p> A run still going on in the session is asked to stop first; the deletion then cascades over the session's tasks, its interaction requests and its executions. It also tells the open windows, which is what drops the deleted chat out of a list and out of the window's in-memory chat state. Deletion cannot be undone. </p> <p> Refuses a session the acting account neither owns nor administers, for the same reason renaming one does. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.sessionRename = Session rename
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.sessionRename.param.session.tooltip = The tl.ai.execution:AgentSession to rename.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.sessionRename.param.title.tooltip = The new title; must not be blank.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.sessionRename.return = The renamed session, so the call can be chained.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.sessionRename.tooltip = Renames a chat session, so that every list showing it follows at once. <p> The write goes through the <i>agent execution store</i>, not through the attribute: the store commits on its writer thread (so this works from a read-only context such as a rendering expression), bumps the session's lastUpdated - which is what its list groups by - and tells every open window of the owner, so a second browser tab updates without waiting for its next command. </p> <p> Refuses a session the acting account neither owns nor administers. The check is here and not only in the view that calls it: a command's input is whatever a channel happens to hold, and this function is reachable from a scheduler task and the TL-Script console as well. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.toolInfo = Tool info
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.toolInfo.param.toolName.tooltip = The qualified name of the tool.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.toolInfo.return = A map containing the tool's metadata with the structure described above, or null if the tool is not found.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.toolInfo.tooltip = Retrieves detailed information about a registered tool. <p> This function returns metadata about a tool including its name, description, and parameter schema. The tool is identified by its qualified name in the format factory-name.tool-name. </p> <p> The returned map contains: </p> <ul> <li>name - The tool's name</li> <li>qualifiedName - The tool's fully qualified name</li> <li>description - A description of what the tool does</li> <li>inputSchemaJson - The JSON Schema string for tool parameters</li> </ul>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.tools = Tools
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.tools.return = A list of all registered tool names.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.tools.tooltip = Returns a list of all available tool names from the <i>tool registry service</i>. <p> Tool names are in the qualified format factory-name.tool-name. These names can be passed to the <i>chat</i> function to make tools available to the AI agent. </p>
com.top_logic.tl.ai.core.scripting.Converters.htmlToMarkdown = HTML to markdown
com.top_logic.tl.ai.core.scripting.Converters.htmlToMarkdown.param.html.tooltip = Text in HTML format.
com.top_logic.tl.ai.core.scripting.Converters.htmlToMarkdown.return = Markdown formatted text.
