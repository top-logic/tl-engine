com.top_logic.ai.a2a.A2AService.Config.artifact-sources = Artefakt-Quellen
com.top_logic.ai.a2a.A2AService.Config.artifact-sources.tooltip = Hooks, die die Artefakte dieser Anwendung über Referenzen veröffentlichen, der Reihe nach gefragt.
com.top_logic.ai.a2a.A2AService.Config.authentications.tooltip = Wie ein aufrufender Agent nachweist, wer er ist: persönliche Zugriffstokens (&lt;personal-access-token-authentication&gt;), ein einem Konto zugeordneter API-Schlüssel, OAuth-Bearer-Tokens, HTTP Basic. Leer: Jeder Aufruf wird abgewiesen.
com.top_logic.ai.a2a.A2AService.Config.data-handlers = Daten-Handler
com.top_logic.ai.a2a.A2AService.Config.data-handlers.tooltip = Hooks, die die strukturierten Datenteile eingehender Nachrichten verarbeiten, der Reihe nach gefragt.
com.top_logic.ai.a2a.A2AService.Config.max-blocking-seconds = Maximale Wartezeit (s)
com.top_logic.ai.a2a.A2AService.Config.max-blocking-seconds.tooltip = Wie lange ein blockierendes SendMessage höchstens auf seine Aufgabe wartet und wie lange ein lokales askAgent höchstens auf einen entfernten Agenten wartet.
com.top_logic.ai.a2a.A2AService.Config.observers = Beobachter
com.top_logic.ai.a2a.A2AService.Config.observers.tooltip = Hooks, die von den A2A-Austauschen in beide Richtungen erfahren. Standardmäßig keine; einer, der sie aus der Anwendung hinausreicht, muss das selbst absichern - siehe <i>A2A-Beobachter</i>.
com.top_logic.ai.a2a.A2AService.Config.public-url = Öffentliche URL
com.top_logic.ai.a2a.A2AService.Config.public-url.tooltip = Die öffentliche Basis-URL der Anwendung, z. B. https://example.com/app, für die Agentenkarten. Leer: aus der Anfrage, die die Karte abruft. <p> Setzen Sie sie hinter einem Proxy, der TLS beendet, außer der Servlet-Container wendet die Weiterleitungs-Header des Proxys an. Sonst nennen die Karten http-Adressen, und ein Aufrufer, der eine Karte über https liest, lehnt sie ab. </p>
com.top_logic.ai.a2a.A2AService.Config.remote-agents = Entfernte Agenten
com.top_logic.ai.a2a.A2AService.Config.remote-agents.tooltip = Die entfernten A2A-Agenten, die lokale Agenten aufrufen dürfen.
com.top_logic.ai.a2a.A2AService.Config.secrets = Geheimnisse
com.top_logic.ai.a2a.A2AService.Config.secrets.tooltip = Die Geheimnisse, gegen die die Authentifizierungen prüfen.
com.top_logic.ai.a2a.A2AService.Config.subject-resolvers = Gegenstand-Ermittler
com.top_logic.ai.a2a.A2AService.Config.subject-resolvers.tooltip = Hooks, die bestimmen, worum es in einer eingehenden Unterhaltung geht, der Reihe nach gefragt.
com.top_logic.ai.a2a.A2AService.ExposedAgentConfig.agent = Agent
com.top_logic.ai.a2a.A2AService.ExposedAgentConfig.agent.tooltip = Der tl-ai-Agent, der ihn bedient.
com.top_logic.ai.a2a.A2AService.ExposedAgentConfig.allow-writes = Schreiben erlauben
com.top_logic.ai.a2a.A2AService.ExposedAgentConfig.allow-writes.tooltip = Ob ein über A2A gestarteter Lauf Tools verwenden darf, die die Anwendung ändern. Sie laufen dann ohne Freigabe-Rückfrage. Aus: Diese Tools werden dem Lauf nicht angeboten.
com.top_logic.ai.a2a.A2AService.ExposedAgentConfig.description = Beschreibung
com.top_logic.ai.a2a.A2AService.ExposedAgentConfig.description.tooltip = Was der Agent tut, für die Agentenkarte.
com.top_logic.ai.a2a.A2AService.ExposedAgentConfig.display-name = Anzeigename
com.top_logic.ai.a2a.A2AService.ExposedAgentConfig.display-name.tooltip = Der Name auf der Agentenkarte. Leer: der Pfad.
com.top_logic.ai.a2a.A2AService.ExposedAgentConfig.model = Modell
com.top_logic.ai.a2a.A2AService.ExposedAgentConfig.model.tooltip = Das Modell, das die Läufe verwenden. Leer: das eigene Modell des Agenten oder das der Anwendung.
com.top_logic.ai.a2a.A2AService.ExposedAgentConfig.path = Pfad
com.top_logic.ai.a2a.A2AService.ExposedAgentConfig.path.tooltip = Der Name des Agenten in URLs: /a2a/{path}.
com.top_logic.ai.a2a.A2AService.ExposedAgentConfig.skills = Fähigkeiten
com.top_logic.ai.a2a.A2AService.ExposedAgentConfig.skills.tooltip = Die Fähigkeiten auf der Agentenkarte.
com.top_logic.ai.a2a.A2AService.RemoteAgentConfig.card-url = Karten-URL
com.top_logic.ai.a2a.A2AService.RemoteAgentConfig.card-url.tooltip = Die URL der Karte des entfernten Agenten. <p> Die Karte wird ohne Zugangsdaten gelesen. Die Aufrufe an den Agenten, mit seinen Zugangsdaten und den Nachrichten, gehen nur an den Ursprung (Schema, Host und Port) dieser URL und an die Endpunkt-Ursprünge. Eine Adresse der Karte mit einem anderen Ursprung beendet den Aufruf, und keine Anfrage wird gesendet. Verwenden Sie https: Eine http-URL zu einem Host, der kein Loopback-Host ist, gibt beim Start eine Warnung. </p>
com.top_logic.ai.a2a.A2AService.RemoteAgentConfig.credentials = Zugangsdaten
com.top_logic.ai.a2a.A2AService.RemoteAgentConfig.credentials.tooltip = Wie die Aufrufe an den Remote-Agenten authentifiziert werden. <p> In der Regel wird ein persönliches Zugriffstoken der Remote-Anwendung verwendet, das als Bearer-Token gesendet und aus einer Umgebungsvariablen oder einer Datei gelesen wird: </p><pre> &lt;remote-agent name="other" card-url="https://example.com/other/a2a/agent/agent-card.json"&gt; &lt;credentials class="com.top_logic.basic.credential.HeaderCredentials" scheme="Bearer"&gt; &lt;secret name="OTHER_A2A_TOKEN"/&gt; &lt;/credentials&gt; &lt;/remote-agent&gt; </pre> <p> Ist nichts angegeben, werden die Aufrufe ohne Zugangsdaten gesendet. Die Agent-Karte wird immer ohne Zugangsdaten abgerufen. Ein Aufruf, dessen Zugangsdaten abgelehnt werden (HTTP 401), wird einmal mit frischen Zugangsdaten wiederholt. </p>
com.top_logic.ai.a2a.A2AService.RemoteAgentConfig.endpoint-origins = Endpunkt-Ursprünge
com.top_logic.ai.a2a.A2AService.RemoteAgentConfig.endpoint-origins.tooltip = Weitere Ursprünge, die die Karte für die Aufrufe an den entfernten Agenten nennen darf, neben dem Ursprung der Karten-URL. <p> Für eine Karte auf der Adresse einer Domain und einen Agenten auf einem anderen Host, wie es das A2A-Protokoll erlaubt. Die Aufrufe an diese Ursprünge tragen die Zugangsdaten und die Nachrichten, nennen Sie also nur Ursprünge der entfernten Anwendung. Ein Ursprung ist scheme://host oder scheme://host:port, ohne Pfad, z. B. https://agents.example.com. Trennen Sie mehrere durch Kommas. Leer: nur der Ursprung der Karten-URL. </p>
com.top_logic.ai.a2a.A2AService.SkillConfig.description = Beschreibung
com.top_logic.ai.a2a.A2AService.SkillConfig.description.tooltip = Was die Fähigkeit leistet.
com.top_logic.ai.a2a.A2AService.SkillConfig.id = ID
com.top_logic.ai.a2a.A2AService.SkillConfig.id.tooltip = Die ID der Fähigkeit.
com.top_logic.ai.a2a.A2AService.SkillConfig.name = Name
com.top_logic.ai.a2a.A2AService.SkillConfig.name.tooltip = Der Name der Fähigkeit. Leer: die ID.
com.top_logic.ai.a2a.A2AService.SkillConfig.tags = Schlagwörter
com.top_logic.ai.a2a.A2AService.SkillConfig.tags.tooltip = Schlagwörter.
com.top_logic.ai.a2a.A2AService.tooltip = Verbindet die Agenten dieser Anwendung über das A2A-Protokoll v1.0 mit anderen Agenten: stellt konfigurierte Agenten bereit (/a2a/*, <i>A2A-Servlet</i>) und lässt lokale Agenten konfigurierte entfernte Agenten aufrufen (Tool-Factory a2a, A2AClientTools). <p> Standardmäßig geschlossen: Ein Agent ist nur erreichbar, wenn er unter &lt;agents&gt; steht, und nur mit einem Nachweis, den eine der &lt;authentications&gt; annimmt - die Verfahren des MCP-Endpunkts, darunter persönliche Zugriffstokens. Ein Lauf handelt als das Konto, das der Nachweis nennt. </p>
com.top_logic.ai.a2a.A2ASubjectResolver.resolveSubject = Thema klären
com.top_logic.ai.a2a.A2ASubjectResolver.resolveSubject.tooltip = Das Thema des Gesprächs oder <code>null</code>, um es dem nächsten Entscheider zu überlassen.
