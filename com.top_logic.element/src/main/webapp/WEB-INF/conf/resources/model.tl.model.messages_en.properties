model.tl.model = Model
model.tl.model.DBType = Database type
model.tl.model.DBType.tooltip = The type of a database column. It determines how a value is physically stored in the database.
model.tl.model.DeletionPolicy = Deletion policy
model.tl.model.DeletionPolicy.tooltip = Determines what happens to a reference when a referenced object is deleted: the reference is cleared, the referring object is deleted as well, the reference is fixed to the last state before the deletion, or the deletion is rejected.
model.tl.model.DerivedTLTypePart = Derived part
model.tl.model.DerivedTLTypePart.derived = Derived
model.tl.model.DerivedTLTypePart.derived.tooltip = Whether the value of this part is computed. A computed value cannot be edited.
model.tl.model.DerivedTLTypePart.tooltip = Base type for parts of a type whose value can be computed from other values instead of being stored.
model.tl.model.HistoryType = Historization
model.tl.model.HistoryType.tooltip = Determines whether a reference points to the current state of an object, to a fixed historic state, or may contain both.
model.tl.model.TLAnnotation = Annotation
model.tl.model.TLAnnotation.tooltip = An annotation of a model element. Annotations refine the behaviour and the display of a model element without changing its structure.
model.tl.model.TLAssociation = Association
model.tl.model.TLAssociation.ends = Association ends
model.tl.model.TLAssociation.ends.tooltip = The ends of the association. They determine which types are connected by the association.
model.tl.model.TLAssociation.subsets = Subsets
model.tl.model.TLAssociation.subsets.tooltip = The associations whose links together form this derived association.
model.tl.model.TLAssociation.tooltip = A relation between business objects. An association has ends that describe the participating types. Every reference is implemented by an association.
model.tl.model.TLAssociation.union = Supersets
model.tl.model.TLAssociation.union.tooltip = The derived associations of which this association is a subset. The links of this association are also visible in those associations.
model.tl.model.TLAssociationEnd = Association end
model.tl.model.TLAssociationEnd.aggregate = Aggregate
model.tl.model.TLAssociationEnd.aggregate.tooltip = Flag for an association end that points in the direction of the aggregation (the whole) of a composition relationship (part/whole).
model.tl.model.TLAssociationEnd.composite = Composite
model.tl.model.TLAssociationEnd.composite.tooltip = Flag for an association end that points in the direction of the parts of a whole of a composition relationship (part/whole).
model.tl.model.TLAssociationEnd.deletionPolicy = Deletion policy
model.tl.model.TLAssociationEnd.deletionPolicy.tooltip = Determines what happens to a link when the object at this end is deleted.
model.tl.model.TLAssociationEnd.endIndex = Index of association end
model.tl.model.TLAssociationEnd.endIndex.tooltip = The position of this end in the list of ends of its association.
model.tl.model.TLAssociationEnd.historyType = Historization
model.tl.model.TLAssociationEnd.historyType.tooltip = Determines whether this end holds current objects, objects of a fixed historic state, or both.
model.tl.model.TLAssociationEnd.navigate = Can navigate
model.tl.model.TLAssociationEnd.navigate.tooltip = Whether the association may be navigated to this end. Only for a navigable end the values can be retrieved from the object at the other end.
model.tl.model.TLAssociationEnd.reference = Reference
model.tl.model.TLAssociationEnd.reference.tooltip = The reference that navigates the association to this end.
model.tl.model.TLAssociationEnd.tooltip = An end of an association. It determines which type participates in the relation at this position and how the values are treated.
model.tl.model.TLClass = Business object type
model.tl.model.TLClass.abstract = Abstract
model.tl.model.TLClass.abstract.tooltip = An abstract class cannot be instantiated. It only serves as common base type of its specializations.
model.tl.model.TLClass.final = Final
model.tl.model.TLClass.final.tooltip = A final class cannot be specialized further.
model.tl.model.TLClass.generalizations = Generalizations
model.tl.model.TLClass.generalizations.tooltip = The classes from which this class inherits its properties and references.
model.tl.model.TLClass.scope = Scope
model.tl.model.TLClass.specializations = Specializations
model.tl.model.TLClass.specializations.tooltip = The classes that inherit from this class.
model.tl.model.TLClass.tooltip = A type of business objects. A class defines properties and references and can inherit them from other classes.
model.tl.model.TLClassifier = Classifier
model.tl.model.TLClassifier.default = Default
model.tl.model.TLClassifier.default.tooltip = Whether this classifier is preselected as default value of its enumeration.
model.tl.model.TLClassifier.index = Index
model.tl.model.TLClassifier.index.tooltip = The position of the classifier in the list of classifiers of its enumeration.
model.tl.model.TLClassifier.tooltip = A possible value of an enumeration.
model.tl.model.TLEnumeration = Enumeration
model.tl.model.TLEnumeration.classifiers = Classifiers
model.tl.model.TLEnumeration.classifiers.tooltip = The classifiers of the enumeration in the order in which they are offered for selection.
model.tl.model.TLEnumeration.tooltip = A type whose values are a fixed set of classifiers. Enumerations are used to classify business objects.
model.tl.model.TLModel = TL-Model
model.tl.model.TLModel.modules = Modules
model.tl.model.TLModel.modules.tooltip = The modules of the application model.
model.tl.model.TLModel.tooltip = The application model as a whole. It is the root of the model and contains all modules of the application.
model.tl.model.TLModelPart = Model part
model.tl.model.TLModelPart.annotations = Annotations
model.tl.model.TLModelPart.annotations.tooltip = The annotations of the model element. They configure its behaviour and its display.
model.tl.model.TLModelPart.model = Model
model.tl.model.TLModelPart.model.tooltip = The model this element belongs to.
model.tl.model.TLModelPart.tooltip = Base type of all elements of the application model: the model itself, its modules, its types and their parts. Every model part can be annotated.
model.tl.model.TLModule = Module
model.tl.model.TLModule.singletons = Root objects
model.tl.model.TLModule.singletons.tooltip = The root objects of the module. A root object is created automatically together with the module and serves as entry point into the data of the module.
model.tl.model.TLModule.tooltip = A module of the application model. A module groups types that belong together and forms the global name space for them.
model.tl.model.TLModuleSingletons = Root objects
model.tl.model.TLModuleSingletons.module = Module
model.tl.model.TLModuleSingletons.module.tooltip = The module the root object belongs to.
model.tl.model.TLModuleSingletons.name = Name
model.tl.model.TLModuleSingletons.name.tooltip = The name under which the root object can be retrieved from its module. The default root object has the name "ROOT".
model.tl.model.TLModuleSingletons.singleton = Singleton
model.tl.model.TLModuleSingletons.singleton.tooltip = The object that serves as root object of the module.
model.tl.model.TLModuleSingletons.tooltip = The assignment of a root object to a module. A module can have several root objects that are distinguished by their name.
model.tl.model.TLNamedPart = Named part
model.tl.model.TLNamedPart.name = Name
model.tl.model.TLNamedPart.name.tooltip = The technical name of the model element. It identifies the element within its container and is used in configurations and in TL-Script.
model.tl.model.TLNamedPart.tooltip = Base type of all model elements that have a name.
model.tl.model.TLObject = Business object
model.tl.model.TLObject.tType = Type
model.tl.model.TLObject.tType.tooltip = The model type that describes this object.
model.tl.model.TLObject.tooltip = Base type of all objects that are stored in the persistency layer. Every business object of the application is of this type.
model.tl.model.TLPrimitive = Data type
model.tl.model.TLPrimitive.binary = Binary
model.tl.model.TLPrimitive.binary.tooltip = Whether values of this data type are compared byte by byte. Texts then distinguish upper and lower case.
model.tl.model.TLPrimitive.dbPrecision = Database precision
model.tl.model.TLPrimitive.dbPrecision.tooltip = The number of decimal places of the database column in which a value of this data type is stored.
model.tl.model.TLPrimitive.dbSize = Database size
model.tl.model.TLPrimitive.dbSize.tooltip = The size of the database column in which a value of this data type is stored, e.g. the maximum number of characters of a text.
model.tl.model.TLPrimitive.dbType = Database type
model.tl.model.TLPrimitive.dbType.tooltip = The type of the database column in which a value of this data type is stored.
model.tl.model.TLPrimitive.tooltip = A primitive data type such as a number, a text or a date. A data type describes how a value is stored in the database and how it is displayed and entered.
model.tl.model.TLProperty = Property
model.tl.model.TLProperty.tooltip = A property of a type whose value is a primitive value such as a number, a text or a date.
model.tl.model.TLReference = Reference
model.tl.model.TLReference.aggregate = Aggregate
model.tl.model.TLReference.aggregate.tooltip = Whether the referenced object is the container of the referring object. Such a reference is the inverse of a composition.
model.tl.model.TLReference.backwards = Backwards
model.tl.model.TLReference.backwards.tooltip = Whether this reference navigates its association against the direction in which the association was declared.
model.tl.model.TLReference.composite = Composition
model.tl.model.TLReference.composite.tooltip = Whether the referenced objects are parts of the referring object. Parts are deleted together with their container.
model.tl.model.TLReference.deletionPolicy = Deletion policy
model.tl.model.TLReference.deletionPolicy.tooltip = Determines what happens to this reference when a referenced object is deleted.
model.tl.model.TLReference.end = Association end
model.tl.model.TLReference.end.tooltip = The association end this reference navigates to. Most properties of the reference are derived from this end.
model.tl.model.TLReference.historyType = Historization
model.tl.model.TLReference.historyType.tooltip = Determines whether the reference holds current objects, objects of a fixed historic state, or both.
model.tl.model.TLReference.opposite = Opposite
model.tl.model.TLReference.opposite.tooltip = The reference that navigates the same association in the opposite direction.
model.tl.model.TLReference.oppositeEnd = Assocation end of opposite
model.tl.model.TLReference.oppositeEnd.tooltip = The association end this reference navigates from, i.e. the end that holds the referring object.
model.tl.model.TLReference.tooltip = A reference from a business object to other business objects. A reference is implemented by an association and navigates it in one direction.
model.tl.model.TLScope = Scope
model.tl.model.TLScope.tooltip = Base type for objects in which types can be defined. Besides the module, in which the globally visible types are defined, an object can also define types that are only visible locally.
model.tl.model.TLScope.types = Types
model.tl.model.TLScope.types.tooltip = The types that are defined in this scope.
model.tl.model.TLStructuredType = Structured type
model.tl.model.TLStructuredType.localParts = Local parts
model.tl.model.TLStructuredType.localParts.tooltip = The parts that are declared at this type itself. Parts that are only inherited from a generalization are not contained.
model.tl.model.TLStructuredType.tooltip = Base type of all types that have parts, i.e. properties and references: business object types, enumerations and associations.
model.tl.model.TLStructuredTypePart = Structured type part
model.tl.model.TLStructuredTypePart.abstract = Abstract
model.tl.model.TLStructuredTypePart.abstract.tooltip = Abstract properties can only be defined in abstract classes and must be overwritten in concrete classes. Abstract properties do not have a storage implementation.
model.tl.model.TLStructuredTypePart.bag = Bag
model.tl.model.TLStructuredTypePart.bag.tooltip = Whether the same value may occur several times. Only relevant for a part that can hold several values.
model.tl.model.TLStructuredTypePart.classifiedBy = Classified by
model.tl.model.TLStructuredTypePart.classifiedBy.tooltip = The classifiers that assign this part to one or more groups. Such a classification can be used e.g. to control the visibility of the part or the access to it.
model.tl.model.TLStructuredTypePart.definition = Definition
model.tl.model.TLStructuredTypePart.definition.tooltip = The part in which this part was originally declared. For an override this is the overridden part of the generalization, otherwise the part itself.
model.tl.model.TLStructuredTypePart.mandatory = Mandatory
model.tl.model.TLStructuredTypePart.mandatory.tooltip = Whether a value must be given for this part.
model.tl.model.TLStructuredTypePart.multiple = Multiple
model.tl.model.TLStructuredTypePart.multiple.tooltip = Whether the part can hold several values instead of only a single one.
model.tl.model.TLStructuredTypePart.ordered = Ordered
model.tl.model.TLStructuredTypePart.ordered.tooltip = Whether the order of the values is preserved. Only relevant for a part that can hold several values.
model.tl.model.TLStructuredTypePart.override = Override
model.tl.model.TLStructuredTypePart.override.tooltip = Whether this part overrides a part of the same name of a generalization.
model.tl.model.TLStructuredTypePart.tooltip = Base type of the properties and references of a structured type. It defines the settings that are common to both, such as multiplicity, mandatoriness and classification.
model.tl.model.TLType = Type
model.tl.model.TLType.module = Module
model.tl.model.TLType.module.tooltip = The module in which the type is defined.
model.tl.model.TLType.scope = Scope
model.tl.model.TLType.scope.tooltip = The scope in which the type is defined. For a globally visible type this is its module.
model.tl.model.TLType.tooltip = Base type of all types of the application model: business object types, enumerations, data types and associations.
model.tl.model.TLTypePart = Type part
model.tl.model.TLTypePart.owner = Definition type
model.tl.model.TLTypePart.owner.tooltip = The type at which this part is declared.
model.tl.model.TLTypePart.tooltip = Base type of all parts of a type: properties, references, association ends and classifiers.
model.tl.model.TLTypePart.type = Target type
model.tl.model.TLTypePart.type.tooltip = The type of the values of this part.
model.tl.model.tooltip = Module with the types that describe the application model itself. Every element of the model - module, type, attribute - is itself a business object of one of these types and can therefore be inspected and searched like application data.
