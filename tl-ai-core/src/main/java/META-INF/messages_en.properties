com.top_logic.tl.ai.core.provider.chatcompletions.TokenLimitParam = Token limit parameter
com.top_logic.tl.ai.core.provider.chatcompletions.TokenLimitParam.MAX_COMPLETION_TOKENS = Maximum completion tokens
com.top_logic.tl.ai.core.provider.chatcompletions.TokenLimitParam.MAX_COMPLETION_TOKENS.tooltip = Max_completion_tokens field, required by GPT-5/o-series reasoning models on Azure <code>OpenAI</code> and real <code>OpenAI</code> Chat Completions endpoints.
com.top_logic.tl.ai.core.provider.chatcompletions.TokenLimitParam.MAX_TOKENS = Maximum tokens
com.top_logic.tl.ai.core.provider.chatcompletions.TokenLimitParam.MAX_TOKENS.tooltip = Legacy max_tokens field, understood by Mistral, <code>xAI</code>, and local servers.
com.top_logic.tl.ai.core.provider.chatcompletions.TokenLimitParam.tooltip = JSON field name carrying the output-token limit in a Chat Completions request body. <p>The Chat Completions API historically used max_tokens, but GPT-5 and o-series reasoning models reject it and require max_completion_tokens (which also accounts for hidden reasoning tokens). Other <code>OpenAI</code>-compatible backends (Mistral, <code>xAI</code>, local servers) only understand max_tokens, so the field name is selectable per provider preset.</p>
com.top_logic.tl.ai.core.provider.local.LocalProviderConfig = Local (OpenAI-compatible)
com.top_logic.tl.ai.core.provider.local.LocalProviderConfig.tooltip = <i>LLM provider configuration</i> for local <code>OpenAI</code>-compatible servers (Ollama, LM Studio, <code>vLLM</code>). <p> The base URL is mandatory and no API key is required. Local servers speak the <code>OpenAI</code> Chat Completions protocol (/v1/chat/completions), so this config produces a <i>chat completions provider</i>. </p>
com.top_logic.tl.ai.core.provider.mistral.MistralProviderConfig = Mistral
com.top_logic.tl.ai.core.provider.mistral.MistralProviderConfig.Config.api-key = Api key
com.top_logic.tl.ai.core.provider.mistral.MistralProviderConfig.Config.api-key.tooltip = The API key for Mistral authentication.
com.top_logic.tl.ai.core.provider.mistral.MistralProviderConfig.tooltip = <i>LLM provider configuration</i> for the Mistral AI API.
com.top_logic.tl.ai.core.provider.openai.AzureOpenAIProviderConfig = Azure OpenAI
com.top_logic.tl.ai.core.provider.openai.AzureOpenAIProviderConfig.Config.api-key = Api key
com.top_logic.tl.ai.core.provider.openai.AzureOpenAIProviderConfig.Config.api-key.tooltip = The API key for authentication. <p>For Azure <code>OpenAI</code> with <i>api key</i> this is the Azure subscription key. For gateway deployments using <i>bearer</i> this is the bearer token.</p>
com.top_logic.tl.ai.core.provider.openai.AzureOpenAIProviderConfig.Config.api-version = Api version
com.top_logic.tl.ai.core.provider.openai.AzureOpenAIProviderConfig.Config.api-version.tooltip = The api-version query parameter sent on every request. <p>Defaults to 2024-10-21, which is the version required by Nexus GPT and Carina chat gateways as well as production Azure <code>OpenAI</code> deployments.</p>
com.top_logic.tl.ai.core.provider.openai.AzureOpenAIProviderConfig.Config.auth-scheme = Auth scheme
com.top_logic.tl.ai.core.provider.openai.AzureOpenAIProviderConfig.Config.auth-scheme.tooltip = The HTTP authentication scheme used to send the API key. <p><i>Bearer</i> (the default) places the key in the Authorization header, which is what Nexus and Carina gateways expect. <i>Api key</i> places it in the api-key header, which is required by real Azure <code>OpenAI</code> resource endpoints.</p>
com.top_logic.tl.ai.core.provider.openai.AzureOpenAIProviderConfig.tooltip = <i>LLM provider configuration</i> preset for Azure <code>OpenAI</code> Chat Completions deployment endpoints. <p> Configures a <i>chat completions provider</i> with the Azure-specific deployment path /openai/deployments/{model}/chat/completions, an api-version query parameter, and a selectable authentication scheme (<i>bearer</i> for gateways such as Nexus GPT / Carina chat; <i>api key</i> for real Azure <code>OpenAI</code> subscription-key auth). No model-listing endpoint is available on Azure, so models must be added to the models list manually. </p>
com.top_logic.tl.ai.core.provider.openai.OpenAICompatibleProviderConfig = OpenAI-compatible
com.top_logic.tl.ai.core.provider.openai.OpenAICompatibleProviderConfig.Config.api-key = Api key
com.top_logic.tl.ai.core.provider.openai.OpenAICompatibleProviderConfig.Config.api-key.tooltip = The API key for authentication. <p> Optional — some services use different authentication mechanisms. </p>
com.top_logic.tl.ai.core.provider.openai.OpenAICompatibleProviderConfig.tooltip = <i>LLM provider configuration</i> for third-party services that implement the <code>OpenAI</code> Chat Completions protocol. <p> Unlike <i>OpenAI</i>, the base URL is mandatory (there is no sensible default). The API key is optional since some services use different authentication mechanisms. Produces a <i>chat completions provider</i> targeting /v1/chat/completions. </p>
com.top_logic.tl.ai.core.provider.openai.OpenAIProviderConfig = OpenAI
com.top_logic.tl.ai.core.provider.openai.OpenAIProviderConfig.Config.api-key = Api key
com.top_logic.tl.ai.core.provider.openai.OpenAIProviderConfig.Config.api-key.tooltip = The API key for <code>OpenAI</code> authentication.
com.top_logic.tl.ai.core.provider.openai.OpenAIProviderConfig.tooltip = <i>LLM provider configuration</i> for the <code>OpenAI</code> cloud API.
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig = xAI
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig$Protocol = Protocol
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig$Protocol.tooltip = Wire protocol to use when talking to the <code>xAI</code> endpoint.
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Config.api-key = Api key
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Config.api-key.tooltip = The API key for <code>xAI</code> authentication.
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Config.protocol = Protocol
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Config.protocol.tooltip = The wire protocol to use when communicating with the <code>xAI</code> endpoint. <p> <i>Chat completions</i> produces a <i>chat completions provider</i>; <i>responses</i> produces an <i>OpenAI Responses provider</i>. </p>
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Protocol.CHAT_COMPLETIONS = Chat completions
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Protocol.CHAT_COMPLETIONS.tooltip = <code>OpenAI</code> Chat Completions protocol (/v1/chat/completions, SSE with [DONE]).
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Protocol.RESPONSES = Responses
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Protocol.RESPONSES.tooltip = <code>OpenAI</code> Responses protocol (/v1/responses, event-typed SSE).
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.tooltip = <i>LLM provider configuration</i> for the <code>xAI</code> (Grok) API. <p> The <code>xAI</code> API supports both the <code>OpenAI</code> Chat Completions protocol (/v1/chat/completions) and the <code>OpenAI</code> Responses protocol (/v1/responses). Use <i>Protocol</i> to select the wire format. The default is <i>chat completions</i>. </p>
com.top_logic.tl.ai.core.screenshots.ScreenshotService = Screenshot service
com.top_logic.tl.ai.core.screenshots.ScreenshotService.tooltip = Service that persists <i>screenshot</i> business objects (a captured PNG plus its metadata). <p> Mirrors GeneratedHtmlPageService in shape, with one deliberate difference: it does <b>not</b> open its own Transaction. Screenshots are created by the browserScreenshot agent verb, a DATA_WRITE tool whose transaction is opened and committed by the agent loop's <i>transaction scope</i> (the "tool transaction seam"). Creating the object in that ambient transaction keeps the screenshot atomic with the rest of the turn - it is committed when the turn commits and rolled back if the turn is rolled back. Programmatic callers (and tests) therefore supply their own transaction around the screenshot-creating call. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChat = Agent chat
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChat.param.agentName.tooltip = The agent name as configured in the knowledge base.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChat.param.userMessage.tooltip = The user message to send to the agent.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChat.return = The agent's final text response.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChat.tooltip = Runs a named agent from the <i>agent factory</i> registry with a single user message. <p> The agent is resolved by name from the tl.ai.core:Agent model instances. A fresh <i>conversation</i> is created for each call; no conversation history is retained between invocations. </p> <p> Example usage in TL-Script: </p> <pre> aiAgentChat("my-agent", "Summarize the latest changes.") </pre>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChatAsync = Agent chat async
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChatAsync.param.agentName.tooltip = The agent name as configured in the knowledge base.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChatAsync.param.userMessage.tooltip = The user message to send to the agent.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChatAsync.return = The session's persistent id as a <i>string</i> handle to poll for status and result.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChatAsync.tooltip = Starts a named agent on a background thread and returns immediately with a handle. <p> Unlike <i>agentChat</i>, which runs the agent loop synchronously on the calling thread and blocks until it finishes, this function submits the run to the <i>scheduler service</i> and returns right away. The return value is the session's persistent id as a plain <i>string</i> handle: poll it with <i>agentRunStatus</i> and <i>agentRunResult</i> to observe progress and retrieve the transcript once the run is COMPLETE. </p> <p> The background run re-enters the calling user's sub-session (captured synchronously here on the calling thread, as it cannot be read off-thread), so the agent and its tools act as that user with that user's permissions. A BACKGROUND-kind <i>agent session</i> is created up front so the caller always receives a usable handle; the execution record is created before the first model call, once the loop starts, and finalized with status and transcript when it ends (including on failure, recorded as ERROR). </p> <p> <b>Warning - unattended auto-approval:</b> a background run has no human to answer tool-approval prompts, so every tool call is auto-approved. An async run can therefore perform any write/destructive tool action (delete data, call external systems, ...) unattended. Only start async runs for agents you trust to act without supervision. An application that has configured a tool access policy can bound this: the run is additionally restricted to that policy's background allowlist, precisely because approval is the control it has lost. </p> <p> <b>Caveat - detached transaction:</b> the background run commits in its own transaction, independent of the caller's. It cannot see the caller's uncommitted changes, and if this function is called from a business transaction that later rolls back, the agent (and its side effects) will still have run. </p> <p> Example usage in TL-Script: </p> <pre> handle = aiAgentChatAsync("my-agent", "Summarize the latest changes."); // ... later ... aiAgentRunStatus(handle) == "COMPLETE" ? aiAgentRunResult(handle) : null </pre>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunCancel = Agent run cancel
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunCancel.param.handle.tooltip = The string session-id handle returned by <i>agentChatAsync</i>, an <i>agent session</i> directly, an <i>agent execution</i> directly, or a run-id string.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunCancel.return = True if a still-running run was signalled to cancel; false if the handle could not be resolved or the run was already terminal.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunCancel.tooltip = Requests cancellation of a running async agent run started with <i>agentChatAsync</i>. <p> Cluster-safe: the handle is resolved to its top-level execution and the run's persisted cancel marker is set and committed - a normal KB write that works from any node, so the node receiving the cancel need not be the node running the job. The running node observes the marker at its next agent-loop turn and cancels the run, which then finalizes as CANCELLED. Cancellation is therefore asynchronous: poll <i>agentRunStatus</i> to observe the run reach CANCELLED. </p> <p> A no-op for a run that has already reached a terminal state (nothing left to cancel). </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunResult = Agent run result
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunResult.param.handle.tooltip = The string session-id handle returned by <i>agentChatAsync</i>, an <i>agent session</i> directly, an <i>agent execution</i> directly, or a run-id string.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunResult.return = The final answer text when the run is COMPLETE, otherwise null.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunResult.tooltip = Returns the final answer of an async agent run once it is <i>complete</i>. <p> This is symmetric with the synchronous <i>agentChat</i>: it returns the same final-answer string that agentChat would have returned for the run - the persisted response, not the transcript. Use <i>agentRunTranscript</i> for the full conversation log. Before the run completes - or if it ended in any non-COMPLETE state - this returns null; use <i>agentRunStatus</i> to distinguish the cases. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunStatus = Agent run status
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunStatus.param.handle.tooltip = The string session-id handle returned by <i>agentChatAsync</i>, an <i>agent session</i> directly, an <i>agent execution</i> directly, or a run-id string.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunStatus.return = The status name, or null if the handle cannot be resolved to a run.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunStatus.tooltip = Returns the status of an async agent run started with <i>agentChatAsync</i>. <p> The status is one of the <i>execution status</i> names (RUNNING, COMPLETE, ERROR, CANCELLED, REJECTED). While the run is still queued or its recording has not yet become visible on the calling thread, RUNNING is returned. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunTranscript = Agent run transcript
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunTranscript.param.handle.tooltip = The string session-id handle returned by <i>agentChatAsync</i>, an <i>agent session</i> directly, an <i>agent execution</i> directly, or a run-id string.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunTranscript.return = The serialized transcript, or null if the handle cannot be resolved or no transcript has been recorded yet.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentRunTranscript.tooltip = Returns the full conversation log (transcript) of an async agent run. <p> The transcript is the serialized per-run conversation log (as produced by <i>conversation log serializer</i>). It is written at run finalization, so it is null while the run is still RUNNING and becomes available once the run reaches any terminal state - including ERROR and CANCELLED, where the partial log is the most useful diagnostic. For the agent's final answer alone, use <i>agentRunResult</i>. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool = Call tool
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool.param.parameters.tooltip = A map of parameter names to values, or null if the tool has no parameters.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool.param.toolName.tooltip = The qualified name of the tool to invoke.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool.return = The result of the tool execution as a string.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool.tooltip = Invokes a tool manually with the given parameters. <p> This function allows direct invocation of registered tools from TL-Script. The tool is identified by its qualified name in the format factory-name.tool-name. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat = Chat
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.param.messages.tooltip = A list of messages. Each message can be: <ul> <li>String: Treated as user text message</li> <li>Map with "role" and "content": Explicit role (system/user/assistant). Content can be string, binary data, or a list of mixed content.</li> <li>Binary data: Treated as user image/document message</li> </ul>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.param.model.tooltip = The model name to use, or null to use the default model configured in <i>LLM service</i>.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.param.responseFormat.tooltip = The response format specification. Can be: <ul> <li>null: No specific format requirement</li> <li>String "text" or "json": Simple format type</li> <li>Map with "name" and "schema" fields describing a JSON schema for structured output.</li> </ul>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.param.tools.tooltip = A collection of qualified tool names to make available to the AI agent (e.g., ["mytools.calculateSum", "texttools.formatText"]), or null to provide no tools.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.return = The assistant's response text.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.tooltip = Sends a multi-turn conversation to a chat completion provider. <p> Messages can be strings, maps with role/content, or lists. Content can be text strings or <i>binary data</i> for images and documents. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.models = Models
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.models.return = An immutable list of all configured model names.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.models.tooltip = Returns a list of all available model names from the <i>LLM service</i>. <p> Model names can be passed to the <i>chat</i> function to select which AI model to use. The returned list maintains a consistent order across calls. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.toolInfo = Tool info
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.toolInfo.param.toolName.tooltip = The qualified name of the tool.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.toolInfo.return = A map containing the tool's metadata with the structure described above, or null if the tool is not found.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.toolInfo.tooltip = Retrieves detailed information about a registered tool. <p> This function returns metadata about a tool including its name, description, and parameter schema. The tool is identified by its qualified name in the format factory-name.tool-name. </p> <p> The returned map contains: </p> <ul> <li>name - The tool's name</li> <li>qualifiedName - The tool's fully qualified name</li> <li>description - A description of what the tool does</li> <li>inputSchemaJson - The JSON Schema string for tool parameters</li> </ul>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.tools = Tools
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.tools.return = A list of all registered tool names.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.tools.tooltip = Returns a list of all available tool names from the <i>tool registry service</i>. <p> Tool names are in the qualified format factory-name.tool-name. These names can be passed to the <i>chat</i> function to make tools available to the AI agent. </p>
com.top_logic.tl.ai.core.scripting.Converters.htmlToMarkdown = HTML to markdown
com.top_logic.tl.ai.core.scripting.Converters.htmlToMarkdown.param.html.tooltip = Text in HTML format.
com.top_logic.tl.ai.core.scripting.Converters.htmlToMarkdown.return = Markdown formatted text.
com.top_logic.tl.ai.core.scripting.Converters.htmlToMarkdown.tooltip = Converts HTML to <i>Markdown</i>.
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtml = Markdown to HTML
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtml.param.markdown.tooltip = Text in <i>Markdown</i> format.
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtml.return = HTML fragment that can be rendered.
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtml.tooltip = Converts <i>Markdown</i> to HTML.
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtmlString = Markdown to HTML string
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtmlString.param.markdown.tooltip = Text in <i>Markdown</i> format.
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtmlString.return = HTML string.
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtmlString.tooltip = Converts <i>Markdown</i> to an HTML string.
com.top_logic.tl.ai.core.security.AiSecurityMode = Ai security mode
com.top_logic.tl.ai.core.security.AiSecurityMode.ENFORCED = Enforced
com.top_logic.tl.ai.core.security.AiSecurityMode.ENFORCED.tooltip = Everything is checked: the run needs a logged-in user, and both the tools it may call and the data it may touch are checked against that user's roles.
com.top_logic.tl.ai.core.security.AiSecurityMode.LEGACY = Legacy
com.top_logic.tl.ai.core.security.AiSecurityMode.LEGACY.tooltip = Nothing is checked: neither which tools the acting user may use nor which data they may see. <p> The state of an application that has configured no policy of its own. </p>
com.top_logic.tl.ai.core.security.AiSecurityMode.SYSTEM = System
com.top_logic.tl.ai.core.security.AiSecurityMode.SYSTEM.tooltip = The run acts as the application itself rather than as a user, and every such run is recorded in the security audit log. <p> For automation that deliberately has no user identity. </p>
com.top_logic.tl.ai.core.security.AiSecurityMode.tooltip = How strictly security is enforced when an agent runs. <p> A single agent may name a <i>stricter</i> mode for itself than the application uses; it can never name a laxer one. </p>
com.top_logic.tl.ai.core.security.AiToolAccessService = Ai tool access service
com.top_logic.tl.ai.core.security.AiToolAccessService.tooltip = Decides which security roles may use which agent tools. <p> As long as no role is configured, no tool call is checked and every agent behaves as it did before this service existed. A configured role is the switch that turns the checks on. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy = Tool access policy
com.top_logic.tl.ai.core.security.ToolAccessPolicy$BackgroundAllowlist = Background allowlist
com.top_logic.tl.ai.core.security.ToolAccessPolicy$BackgroundAllowlist.tooltip = The upper limit for agent runs that have nobody to confirm a tool call. <p> Either a list of capabilities, or <i>All</i> to accept such runs with no limit of their own. An entry without any capability is the strictest choice: those runs then reach nothing except asking a question. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy$Grant = Grant
com.top_logic.tl.ai.core.security.ToolAccessPolicy$Grant.tooltip = One entry of a list of permissions or refusals: either a whole capability group, or named single tools.
com.top_logic.tl.ai.core.security.ToolAccessPolicy$GroupMembership = Group membership
com.top_logic.tl.ai.core.security.ToolAccessPolicy$GroupMembership.tooltip = One capability group and the tools belonging to it. <p> For tools that do not state a group themselves. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy$RoleAccess = Role access
com.top_logic.tl.ai.core.security.ToolAccessPolicy$RoleAccess.tooltip = What one security role may and may not use.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.BackgroundAllowlist.all = All
com.top_logic.tl.ai.core.security.ToolAccessPolicy.BackgroundAllowlist.all.tooltip = Lets a run with nobody to ask use everything the acting user's roles allow. <p> Switch this on only if you deliberately want such runs without a limit of their own. It gives up the only safeguard that stands in for the confirmation nobody is there to give. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.BackgroundAllowlist.grants = Grants
com.top_logic.tl.ai.core.security.ToolAccessPolicy.BackgroundAllowlist.grants.tooltip = The capabilities and single tools a run with nobody to ask may use. <p> Ignored when <i>All</i> is switched on. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.Grant.group = Group
com.top_logic.tl.ai.core.security.ToolAccessPolicy.Grant.group.tooltip = The capability group this entry refers to. <p> Leave this empty if the entry names single tools instead. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.Grant.tools = Tools
com.top_logic.tl.ai.core.security.ToolAccessPolicy.Grant.tools.tooltip = The single tools this entry refers to, by their qualified name. <p> Pick one or several. Leave this empty if the entry names a capability group instead: an entry says either a group or tools, never both. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.GroupMembership.name.tooltip = The capability group the tools listed here belong to.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.GroupMembership.tools = Tools
com.top_logic.tl.ai.core.security.ToolAccessPolicy.GroupMembership.tools.tooltip = The tools belonging to this group, by their qualified name. <p> Pick every tool that belongs here. A tool that is not listed keeps the group it declares itself, and has none at all if it declares none. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.RoleAccess.denies = Denies
com.top_logic.tl.ai.core.security.ToolAccessPolicy.RoleAccess.denies.tooltip = The capabilities and single tools this role may never use. <p> A refusal here always wins - over what this role is granted, and over what every other role of the same user grants. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.RoleAccess.grants = Grants
com.top_logic.tl.ai.core.security.ToolAccessPolicy.RoleAccess.grants.tooltip = The capabilities and single tools this role may use.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.RoleAccess.name.tooltip = The security role this entry is about.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.background-allowlist = Background allowlist
com.top_logic.tl.ai.core.security.ToolAccessPolicy.background-allowlist.tooltip = What an agent run with nobody to ask may use: a scheduled or asynchronous run, or a request from an external client. <p> Such a run confirms every tool call itself, so this is its upper limit; the acting user's roles apply on top. Once the policy is enforced, an application leaving this out does not start. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.baseline = Baseline
com.top_logic.tl.ai.core.security.ToolAccessPolicy.baseline.tooltip = Capabilities every logged-in user gets in addition to the ones their roles grant. <p> Asking the user a question, loading a skill and delegating to a sub-agent are granted anyway and need no entry here. Leave this empty unless you want a further capability for everyone. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.security-mode = Security mode
com.top_logic.tl.ai.core.security.ToolAccessPolicy.security-mode.tooltip = How strictly this policy is applied. <p> With <i>enforced</i> every tool call is checked against the roles of the acting user; with <i>legacy</i> nothing is checked. If no mode is chosen, the policy is enforced as soon as at least one role is configured below. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.tool-access = Tool access
com.top_logic.tl.ai.core.security.ToolAccessPolicy.tool-access.tooltip = The roles, and what each of them may use. <p> A role that is not listed here may use no tool. As long as this list is empty, the policy is not enforced at all. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.tool-groups = Tool groups
com.top_logic.tl.ai.core.security.ToolAccessPolicy.tool-groups.tooltip = Assigns tools to a capability group when the tool does not state its own. <p> Needed for tools that appear only while the application runs: those of a connected MCP server, and TL-Script tools. Such a tool is usable by nobody until it is listed here, and an entry here also overrides the group a tool states itself. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.tooltip = Which security roles may use which agent tools. <p> Nothing is allowed that is not granted here: a role that is not listed may use no tool at all. As long as no role is listed, the policy is not enforced and every tool an agent carries stays usable by everyone who may use that agent. </p>
com.top_logic.tl.ai.core.session.Part$ApprovalDecision = Approval decision
com.top_logic.tl.ai.core.session.Part$ApprovalDecision.tooltip = Approval decision made by the user.
com.top_logic.tl.ai.core.session.Part$SystemEventType = System event type
com.top_logic.tl.ai.core.session.Part$SystemEventType.tooltip = Types of system events.
com.top_logic.tl.ai.core.session.Part$ToolCallStatus = Tool call status
com.top_logic.tl.ai.core.session.Part$ToolCallStatus.tooltip = Status of a tool call through its lifecycle.
com.top_logic.tl.ai.core.session.Part$TransactionType = Transaction type
com.top_logic.tl.ai.core.session.Part$TransactionType.tooltip = KB transaction type.
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.APPROVED = Approved
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.APPROVED.tooltip = User approved this tool call.
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.APPROVED_FOR_SESSION = Approved for session
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.APPROVED_FOR_SESSION.tooltip = User approved this tool for the remainder of the session.
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.DENIED = Denied
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.DENIED.tooltip = User denied this tool call.
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.TIMED_OUT = Timed out
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.TIMED_OUT.tooltip = Approval request timed out without a response.
com.top_logic.tl.ai.core.session.Part.SystemEventType.APPROVAL_MODE_CHANGED = Approval mode changed
com.top_logic.tl.ai.core.session.Part.SystemEventType.APPROVAL_MODE_CHANGED.tooltip = Approval mode was changed during the run.
com.top_logic.tl.ai.core.session.Part.SystemEventType.CANCELLED = Cancelled
com.top_logic.tl.ai.core.session.Part.SystemEventType.CANCELLED.tooltip = Agent run was cancelled by the user.
com.top_logic.tl.ai.core.session.Part.SystemEventType.MODEL_CHANGED = Model changed
com.top_logic.tl.ai.core.session.Part.SystemEventType.MODEL_CHANGED.tooltip = LLM model was switched during the run.
com.top_logic.tl.ai.core.session.Part.ToolCallStatus.COMPLETED = Completed
com.top_logic.tl.ai.core.session.Part.ToolCallStatus.COMPLETED.tooltip = Tool finished successfully.
com.top_logic.tl.ai.core.session.Part.ToolCallStatus.DENIED = Denied
com.top_logic.tl.ai.core.session.Part.ToolCallStatus.DENIED.tooltip = Tool was denied by security or approval.
com.top_logic.tl.ai.core.session.Part.ToolCallStatus.FAILED = Failed
com.top_logic.tl.ai.core.session.Part.ToolCallStatus.FAILED.tooltip = Tool threw an error.
com.top_logic.tl.ai.core.session.Part.ToolCallStatus.RUNNING = Running
com.top_logic.tl.ai.core.session.Part.ToolCallStatus.RUNNING.tooltip = Tool is currently executing.
com.top_logic.tl.ai.core.session.Part.TransactionType.BEGAN = Began
com.top_logic.tl.ai.core.session.Part.TransactionType.BEGAN.tooltip = Transaction was started.
com.top_logic.tl.ai.core.session.Part.TransactionType.COMMITTED = Committed
com.top_logic.tl.ai.core.session.Part.TransactionType.COMMITTED.tooltip = Transaction was committed successfully.
com.top_logic.tl.ai.core.session.Part.TransactionType.ROLLED_BACK = Rolled back
com.top_logic.tl.ai.core.session.Part.TransactionType.ROLLED_BACK.tooltip = Transaction was rolled back.
com.top_logic.tl.ai.core.tools.authoring.AgentAuthoringTool = Agent authoring tool
com.top_logic.tl.ai.core.tools.authoring.AgentAuthoringTool.tooltip = Tool for creating, inspecting, updating, and deleting application Agents and Skills. <p> Mutating methods inherit the default <i>structural</i> mode, so they require human approval and are blocked in production. Query methods are <i>read</i>. This tool only sees application agents/skills; framework (TopLogic-provided) ones are not visible or editable here. </p>
com.top_logic.tl.ai.core.tools.authoring.FrameworkWiringTool = Framework wiring tool
com.top_logic.tl.ai.core.tools.authoring.FrameworkWiringTool.tooltip = Tool for adding and removing tools, skills, and delegations on framework (TopLogic-provided) agents and skills. <p> Wiring operations write an additive config overlay and restart <i>TopLogic-Agents and Skills</i> so changes take effect immediately. Query methods read the running service state. </p>
com.top_logic.tl.ai.core.tools.authoring.ScriptToolAuthoringTool = Script tool authoring tool
com.top_logic.tl.ai.core.tools.authoring.ScriptToolAuthoringTool.tooltip = Tool for creating, inspecting, updating, and deleting TL-Script tools in the custom factory of the <i>tool registry service</i> configuration. <p> Mutating methods persist a configuration overlay and restart the <i>tool registry service</i> so that changes take effect immediately; they inherit <i>structural</i> (approval required, blocked in production). Query methods are <i>read</i> and read the persisted configuration. </p>
com.top_logic.tl.ai.core.tools.interaction.TaskTool = Task tool
com.top_logic.tl.ai.core.tools.interaction.TaskTool.tooltip = Tool for managing agent tasks within a processing session. <p> Provides CRUD operations on an in-memory <i>task store</i> that is bound to the current thread via <i>task store binding</i>. Tasks are used to track progress and organize multi-step agent work. </p>
com.top_logic.tl.ai.core.tools.model.AnnotationDefinitionExplorerTool = Annotation definition explorer tool
com.top_logic.tl.ai.core.tools.model.AnnotationDefinitionExplorerTool.tooltip = Tool for exploring annotation definition schemas. <p> This tool allows AI agents to understand annotation DEFINITIONS (what CAN be configured), not annotation INSTANCES (what IS configured). It provides schema information including property metadata, types, constraints, and defaults. </p> <h3>Example Usage:</h3> <pre> // Explore a specific annotation definition describeAnnotation("com.top_logic.model.annotate.Visibility") // Explore form-definition annotation describeAnnotation("com.top_logic.model.form.definition.FormDefinition") </pre> <h3>Integration:</h3> <p> Register this tool via <i>annotated tools</i> and assign it to an agent through the <i>LLM service</i> configuration. </p>
com.top_logic.tl.ai.core.tools.model.InstanceBrowserTool = Instance browser tool
com.top_logic.tl.ai.core.tools.model.InstanceBrowserTool.tooltip = Tool for accessing TopLogic instance data from the knowledge base. <p> This tool provides methods for listing instances of a type with pagination and retrieving detailed information about individual instances. All methods return JSON-formatted strings for consumption by AI agents. </p>
com.top_logic.tl.ai.core.tools.model.LockTool = Lock tool
com.top_logic.tl.ai.core.tools.model.LockTool.tooltip = Tool for checking whether a model element is currently locked by another editor.
com.top_logic.tl.ai.core.tools.model.ModelAnnotationBrowserTool = Model annotation browser tool
com.top_logic.tl.ai.core.tools.model.ModelAnnotationBrowserTool.tooltip = Tool for browsing annotations on TopLogic model elements (modules, types, parts, enumerations, classifiers). <p> This tool allows AI agents to inspect annotation metadata on model elements with optional inheritance support. It provides detailed information about each annotation including its tag name, configuration interface, and property values. </p> <h3>Example Usage:</h3> <pre> // List local annotations on a module getCurrentAnnotations("tl.core", false) // List local annotations on a type getCurrentAnnotations("tl.core:TLObject", false) // List all annotations including inherited getCurrentAnnotations("tl.core:TLObject", true) // List annotations on an enumeration getCurrentAnnotations("tl.core:TLScope", false) // List annotations on a type part getCurrentAnnotations("tl.core:TLObject#name", false) // List annotations on a classifier (enum literal) getCurrentAnnotations("tl.core:TLScope#global", false) </pre> <h3>Integration:</h3> <p> Register this tool via <i>annotated tools</i> and assign it to an agent through the <i>LLM service</i> configuration. </p>
com.top_logic.tl.ai.core.tools.model.ModelAnnotationEditorTool = Model annotation editor tool
com.top_logic.tl.ai.core.tools.model.ModelAnnotationEditorTool.tooltip = Tool for setting and removing annotations on TopLogic model elements. <p> This tool allows AI agents to modify annotation metadata on model elements (modules, types, parts, classifiers). Annotation configurations are accepted as JSON matching the schema from <i>configuration schema tool</i>. </p>
com.top_logic.tl.ai.core.tools.model.ModelBrowserTool = Model browser tool
com.top_logic.tl.ai.core.tools.model.ModelBrowserTool.tooltip = Tool for browsing TopLogic model structure (modules, types, parts). <p> This tool provides three methods that form the natural hierarchy for model exploration: listing all modules, listing types within a module, and listing properties/references of a type. All methods return JSON-formatted strings for consumption by AI agents. </p>
com.top_logic.tl.ai.core.tools.model.ModelEditorTool = Model editor tool
com.top_logic.tl.ai.core.tools.model.ModelEditorTool.tooltip = Tool for creating and updating TopLogic model elements. <p> This tool provides methods for creating and updating modules, classes, properties, references, backward references, and enumerations in the TopLogic application model. </p> <p> All methods return JSON-formatted strings for consumption by AI agents. </p>
com.top_logic.tl.ai.core.tools.model.ModelSearchTool = Model search tool
com.top_logic.tl.ai.core.tools.model.ModelSearchTool.tooltip = Tool for searching across the TopLogic application model. <p> This tool provides intelligent text search across modules, types (classes, enumerations, datatypes), and properties/references. It searches technical names, qualified names, labels, and descriptions, returning the top 10 most relevant matches with contextual information. </p>
com.top_logic.tl.ai.core.tools.model.SearchAnnotationTool = Search annotation tool
com.top_logic.tl.ai.core.tools.model.SearchAnnotationTool.tooltip = Tool for listing available annotation types for TopLogic model elements. <p> This tool allows AI agents to discover which annotation types can be applied to a given model element. It enumerates all @InApp annotation types filtered by the target element's kind and type. </p>
com.top_logic.tl.ai.core.tools.model.TypeAnalysisTool = Type analysis tool
com.top_logic.tl.ai.core.tools.model.TypeAnalysisTool.tooltip = Tool for analyzing TopLogic type dependencies and relationships. <p> This tool provides methods for understanding how types are used throughout the model: finding all usages of a type and finding where a part is defined and inherited. All methods return JSON-formatted strings for consumption by AI agents. </p>
com.top_logic.tl.ai.core.tools.model.ViewDocumentTool = View document tool
com.top_logic.tl.ai.core.tools.model.ViewDocumentTool.tooltip = Lets an agent perceive the content stored on a model object. <p> Given the TID of any object that holds a tl.core:Binary attribute, the tool reads the stored bytes and brings them to the model in the right modality: images and PDFs ride along in the tool result as multimodal content (so a vision-capable model actually <em>sees</em> them), text is returned inline, and anything else produces a plain explanation. It is not tied to any particular type - a browser screenshot, an uploaded invoice PDF and an attached CSV all go through the same path. </p> <p> Read access is checked through the run's model security, which consults the engine's model access rights when the run's mode enforces them and grants everything otherwise. </p>
com.top_logic.tl.ai.core.tools.perception.Modality = Modality
com.top_logic.tl.ai.core.tools.perception.Modality.IMAGE = Image
com.top_logic.tl.ai.core.tools.perception.Modality.IMAGE.tooltip = A raster image (PNG, JPEG, GIF, WebP, ...).
com.top_logic.tl.ai.core.tools.perception.Modality.PDF = Pdf
com.top_logic.tl.ai.core.tools.perception.Modality.PDF.tooltip = A PDF document.
com.top_logic.tl.ai.core.tools.perception.Modality.tooltip = A non-text input modality that a model may or may not be able to perceive.
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport = Perception support
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport.SUPPORTED = Supported
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport.SUPPORTED.tooltip = The catalogue states the model accepts this modality.
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport.UNKNOWN = Unknown
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport.UNKNOWN.tooltip = The catalogue has no entry for the model, so nothing can be concluded.
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport.UNSUPPORTED = Unsupported
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport.UNSUPPORTED.tooltip = The catalogue states the model does not accept this modality.
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport.tooltip = Whether the active model can perceive a given <i>modality</i>. <p> The answer is derived from the model catalogue, which is best-effort metadata: it may be missing entirely for locally hosted or custom models. <i>Unknown</i> keeps that case distinguishable from a model that is documented as text-only. </p>
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory = Script tool factory
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory$ScriptToolConfig = Script tool configuration
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory$ScriptToolConfig.tooltip = Configuration for a single TL-Script tool. <p> Inherits name, parameters (with full <i>type</i> picker), label, description, and implementation expression from <i>script configuration</i>. Adds the AI-specific mode and concurrency flags. </p>
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.Config.tools = Tools
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.Config.tools.tooltip = The tools to create.
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.concurrency-safe = Concurrency safe
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.concurrency-safe.tooltip = Whether this tool can safely run in parallel with other concurrency-safe tools.
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.mode = Mode
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.mode.tooltip = What kind of state change this tool makes. Defaults to <i>data write</i>.
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.tooltip = A <i>tool factory</i> that creates tools from TL-Script implementations. <p> Each tool configuration reuses the engine's <i>script configuration</i> contract — the same parameter type-picker, mandatory / multiple flags, default values, and i18n descriptions used by configured TL-Script functions — and adds the AI-specific mode and concurrency flag. </p>
com.top_logic.tl.ai.core.tools.registry.SubagentToolFactory = Subagent tool factory
com.top_logic.tl.ai.core.tools.registry.SubagentToolFactory.tooltip = A <i>tool factory</i> that provides the generic asynchronous-subagent orchestration tools: spawn_subagent (fire-and-forget spawn), list_agents, subagent_status (non-blocking status probe) and wait_for_subagent (opt-in blocking join). <p> These tools are independent of the pre-wired delegation flow: any agent can select them by name to spawn an arbitrary predefined agent chosen at call time. The target <i>agent factory</i> is resolved lazily per call so the factory can be created before the agent services have started. </p>
com.top_logic.tl.ai.core.tools.script.TLScriptReferenceTool = Script reference tool
com.top_logic.tl.ai.core.tools.script.TLScriptReferenceTool.tooltip = Tool for listing TLScript functions and retrieving documentation. <p> This tool provides access to the TLScript function registry, allowing AI agents to discover available functions and retrieve detailed documentation for them. It uses <i>search builder</i> to access the function metadata. </p>
com.top_logic.tl.ai.core.tools.script.TLScriptTool = Script tool
com.top_logic.tl.ai.core.tools.script.TLScriptTool.tooltip = Tool for validating and executing TLScript code. <p> This tool provides validation and execution of TLScript. Both methods use the shared <i>script executor</i> for core validation and execution logic. </p>
com.top_logic.tl.ai.core.tools.script.messages.ErrorType = Error type
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.LEXICAL_ERROR = Lexical error
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.LEXICAL_ERROR.tooltip = Lexical error (invalid characters).
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.SYNTAX_ERROR = Syntax error
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.SYNTAX_ERROR.tooltip = Syntax error (parser error).
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.VALIDATION_ERROR = Validation error
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.VALIDATION_ERROR.tooltip = Validation error (model references, type checking).
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.tooltip = Type of validation error.
com.top_logic.tl.ai.core.tools.web.BraveSearchEngine = Brave
com.top_logic.tl.ai.core.tools.web.BraveSearchEngine.Config.api-key = Api key
com.top_logic.tl.ai.core.tools.web.BraveSearchEngine.Config.api-key.tooltip = The Brave Search API subscription token (stored encrypted).
com.top_logic.tl.ai.core.tools.web.BraveSearchEngine.Config.base-url = Base URL
com.top_logic.tl.ai.core.tools.web.BraveSearchEngine.Config.base-url.tooltip = The Brave Search API endpoint URL.
com.top_logic.tl.ai.core.tools.web.BraveSearchEngine.tooltip = <i>Web search engine</i> backed by the Brave Web Search API (GET /res/v1/web/search). <p> Brave has no native include/exclude-domain request parameters, so domain filters are realised by appending site:/-site: search operators to the query. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService = Browser tools service
com.top_logic.tl.ai.core.tools.web.BrowserToolsService$SandboxMode = Sandbox mode
com.top_logic.tl.ai.core.tools.web.BrowserToolsService$SandboxMode.tooltip = Whether Chromium's OS-level sandbox is used for the browser sessions.
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.acquire-timeout-seconds = Acquire timeout seconds
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.acquire-timeout-seconds.tooltip = How long a tool call waits for a free session slot before failing fast with a "browser busy, retry" error, in seconds. <p> Kept short on purpose: a bounded wait cannot exhaust the servlet thread pool the way the former unbounded lock could. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.action-timeout-seconds = Action timeout seconds
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.action-timeout-seconds.tooltip = Timeout for acting on a single <b>element</b> - browserClick / browserType, and reading the accessibility snapshot - in seconds. <p> Deliberately much shorter than the page-load timeout, because the two wait for entirely different things. A click waits for the element to become <em>actionable</em> (attached, visible, stable, unobstructed, enabled); if the page has re-rendered that element away - the classic search box whose suggestion list replaces the control after the query is typed - no amount of further waiting can make the wait succeed, and a page-load-sized budget just turns a dead click into a half-minute stall followed by an opaque timeout. Bounding it to a few seconds lets the tool answer promptly with an actionable "re-snapshot and use a fresh ref" instruction (see <i>browser reference not actionable exception</i>) while still absorbing the ordinary case of an element that needs a moment to settle. </p> <p> Raise it for a deliberately slow or heavily animated application; it is clamped to at most the page-load timeout, since waiting longer for one element than for a whole page load is never useful. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.allow-any-domains = Allow any domains
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.allow-any-domains.tooltip = Whether the public-domain allowlist is disabled (allow-any-domains mode). <p> When false (the safe default), a navigation is permitted only if the top-level origin is on the allowlist. When true, the allowlist is ignored and any public domain is reachable - <em>except</em> that SSRF protection and the blocklist still apply unconditionally. Allow-any relaxes only the public-domain allowlist, never SSRF or the blocklist. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.allowed-domains = Allowed domains
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.allowed-domains.tooltip = Administrator-owned allowlist of domains the browser may navigate to. <p> A navigation is permitted only if the target host equals one of these entries or is a sub-domain of one. If empty, the browser refuses every navigation (fail-closed). This is policy configuration - it is not the model-supplied allowedDomains argument of <i>web search tool</i>. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.apply-allowlist-to-all-requests = Apply allowlist to all requests
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.apply-allowlist-to-all-requests.tooltip = Whether the allowlist governs <b>every</b> connection the browser makes, rather than only the top-level document origin. <p> The allowlist has always been a <em>top-level-origin</em> control: an allowlisted page may pull in sub-resources (fonts, scripts, images from a CDN) from anywhere that is neither SSRF-blocked nor blocklisted, exactly as an ordinary browser would. false (the default) preserves that: the filtering proxy enforces SSRF and the blocklist for every connection, and the allowlist keeps being enforced for the top-level origin only. </p> <p> Set to true for a locked-down installation whose intent is "this browser may talk to these domains and nothing else": the proxy then refuses <em>any</em> connection to a host that is not on the allowlist, sub-resources included. That is strictly safer - it also stops an allowlisted page from beaconing to a third party - but a page whose assets live on other domains will render without them, so it is an explicit operator decision rather than the default. It has no effect when allow-any is enabled (there is no allowlist to apply), and it can never relax anything: SSRF and the blocklist apply to every connection in both settings. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.blocked-domains = Blocked domains
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.blocked-domains.tooltip = Administrator-owned blocklist of domains the browser must never navigate to. <p> A top-level origin is refused if its host equals one of these entries or is a sub-domain of one (same matching as <i>Allowed domains</i>). The blocklist takes precedence over the allowlist and applies in every mode, including allow-any. It carves exceptions out of a broad allowlist (or out of allow-any). SSRF protection is enforced independently and cannot be relaxed. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.browser-sandbox = Browser sandbox
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.browser-sandbox.tooltip = Whether the browser sessions run inside Chromium's own OS-level sandbox. <p> The sandbox is the boundary between a renderer executing <em>attacker-controlled page JavaScript</em> and the host the application runs on: without it, a renderer exploit is simply code running with the application's own privileges, inside the application's process tree. It is therefore on wherever it can be, and it is not a performance knob. </p> <p> <i>Auto</i> (the default) keeps it on and gives it up only inside a container, recognised by the marker files and cgroup layout a container runtime leaves behind. That is the one environment where it cannot simply stay on: the default Docker/Podman seccomp profile denies the clone/unshare calls Chromium's namespace sandbox needs, so a sandboxed launch fails outright there. The right answer for a container is a runtime profile that permits those calls (tracked as the deploy-image ticket) - until then, the sandbox is dropped in containers and only in containers. </p> <p> <i>Enabled</i> and <i>disabled</i> are the escape hatches: ENABLED keeps the sandbox even in a container (correct once the image carries a seccomp profile that allows it; the browser will fail to start if it does not), and DISABLED gives it up unconditionally, which weakens the isolation of every browsed page and should only ever be a temporary diagnostic. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.cookie-pools-enabled = Cookie pools enabled
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.cookie-pools-enabled.tooltip = Master switch for cookie pools: whether the browserSaveCookies / browserUseCookies verbs are operative. <p> true (the default) enables persistent, named, encrypted login pools: a session can save its current login state into a named pool and a later session can start seeded from one (see CookiePoolService). When false, both verbs refuse with a clear message and no cookie state is captured or seeded - use this to switch the whole feature off for an installation regardless of what the model tries. Turning it off does not affect ordinary navigation or the per-session isolated context. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.evade-bot-detection = Evade bot detection
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.evade-bot-detection.tooltip = Whether the browser should disguise its automation fingerprint so bot-protection walls are less likely to serve it an access-denied / challenge page (off by default). <p> When false (the default) the browser behaves as an out-of-the-box headless Chromium: no user-agent override, no extra launch argument, no fingerprint init script. When true, each session's context is made to look like an ordinary desktop Chrome: the --disable-blink-features=AutomationControlled launch switch is added, a realistic desktop Chrome user-agent (and matching Accept-Language) is set, and a small init script masks the usual automation tells (navigator.webdriver, empty navigator.plugins, navigator.languages, missing window.chrome). </p> <p> The <b>full</b> Chromium build (Playwright channel "chromium", new headless - still windowless) that evasion also depends on - the light chrome-headless-shell is itself a fingerprint some bot walls suppress content for, even when the UA and navigator.webdriver are masked - is launched for every session regardless of this setting, because it is what allows the UDP egress of WebRTC to be turned off. See BrowserSession.buildLaunchOptions, including the deployment prerequisite that carries. </p> <p> <b>Caveat - authorised use only.</b> Enabling this deliberately circumvents a site's automated-access protection and may violate that site's Terms of Service. It is an operator opt-in for authorised targets (for example a logged-in site the operator owns or has permission to automate), off by default, and must not be enabled to access sites where doing so is not permitted. It does not touch SSRF, the blocklist or the allowlist, which stay enforced unchanged. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.headless = Headless
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.headless.tooltip = Whether browser sessions are launched headless (no visible window). <p> true (the default) is the production-safe path: every session runs a windowless Chromium, so nothing appears on the app host and no local display is required. Set to false to launch a <b>headed</b> (visible) Chromium window on the app host's desktop - a dev/local convenience that requires a local display and must not be used in production or on remote/headless hosts. When headed is requested on a host with no display, the service fails fast at startup rather than hanging on a launch that can never succeed. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.max-concurrent-sessions = Maximum concurrent sessions
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.max-concurrent-sessions.tooltip = Maximum number of live browser sessions (isolated contexts) allowed at once. <p> This bounds memory: each live session is its own Chromium process (roughly 200-400 MB incl. its Playwright driver). Requests beyond the cap reclaim an idle session by LRU or, if none is idle, fail fast with a retryable "browser busy" error. The default of 4 keeps peak browser memory around 1 GB; raise it in line with available RAM. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.max-page-bytes = Maximum page bytes
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.max-page-bytes.tooltip = Maximum number of HTML bytes read from a page before extraction stops.
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.max-page-chars = Maximum page chars
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.max-page-chars.tooltip = Maximum number of characters of extracted text a browser tool returns.
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.navigation-settle-millis = Navigation settle millis
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.navigation-settle-millis.tooltip = Hard cap, in milliseconds, of the post-navigation <b>settle</b>: after a page-loading operation (browserNavigate / browserBack) finishes its network/load wait and before the page is captured, the browser waits until the DOM goes quiet (no mutation for a short internal debounce window, ~500 ms) or this cap elapses, whichever comes first. <p> This closes the common gap where a page injects a cookie-consent banner, lazy widget or other content a beat <em>after</em> navigation returns: without the settle the snapshot is taken too early and misses it, forcing a manual re-snapshot. A still page goes quiet almost immediately and is delayed by at most the debounce window, so fast pages are not meaningfully slowed; a page that never stops mutating (constant animation/polling) is bounded by this cap. The cap is always applied well inside the per-operation deadline, so it can never cause a hang. </p> <p> Set to 0 to disable the settle entirely and restore immediate capture. It does <em>not</em> apply to browserSnapshot (explicit re-capture) or browserType (same-page edit), which stay immediate. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.navigation-timeout-seconds = Navigation timeout seconds
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.navigation-timeout-seconds.tooltip = Timeout for a <b>page load</b> (navigate, back), in seconds. <p> This bounds waiting for the network: how long the browser may spend reaching domcontentloaded on a slow site. Acting on an <em>element</em> is bounded separately and much more tightly by <i>Action timeout seconds</i>. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.session-idle-timeout-seconds = Session idle timeout seconds
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.session-idle-timeout-seconds.tooltip = How long a session may stay idle (no tool call) before it is closed and its resources released, in seconds.
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.SandboxMode.AUTO = Auto
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.SandboxMode.AUTO.tooltip = The default: the sandbox is used everywhere except inside a container, where the default runtime profile prevents Chromium from setting one up.
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.SandboxMode.DISABLED = Disabled
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.SandboxMode.DISABLED.tooltip = The sandbox is never used, whatever the environment looks like. This weakens the isolation of every browsed page.
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.SandboxMode.ENABLED = Enabled
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.SandboxMode.ENABLED.tooltip = The sandbox is always used, containers included. Chromium refuses to start where it cannot set one up.
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.tooltip = Service owning the pool of isolated, per-session headless Chromium browsers used by <i>browser tool</i>. <p> It holds the configuration (per-navigation timeout, page byte/character caps, the administrator-owned domain allowlist/blocklist/allow-any policy, and the concurrency bounds) and owns the <i>browser session pool</i>. Each agent session gets its <b>own</b> <i>browser session</i> - a dedicated <code>Playwright/Browser/BrowserContext</code> with separate cookies/storage - reused across the many tool calls of a run. Two concurrent sessions can never see each other's cookies, pages or results. </p> <p> <b>Concurrency model (replaces the former single global lock).</b> Sessions run fully concurrently. A <i>browser session pool</i> caps the number of live sessions at <i>Maximum concurrent sessions</i> (a memory bound, not a throughput throttle). Starting a new session waits at most <i>Acquire timeout seconds</i> for a free slot, reclaiming the least-recently-used idle session if needed; if none frees up it fails fast with <i>browser busy exception</i> rather than blocking the caller thread indefinitely. Idle sessions are evicted after <i>Session idle timeout seconds</i>. Every browser operation runs under a hard outer deadline, so one hung page can never pin a slot. </p> <p> Security is layered and applied in a fixed order of precedence for every navigation and every in-browser request (main document, redirects and sub-resources): </p> <ol> <li><b>SSRF always wins.</b> Any request to a private, loopback, link-local or otherwise internal address is refused through <i>URL safety</i>, unconditionally. No configuration can relax this.</li> <li><b>The blocklist always applies.</b> A top-level origin on the administrator-owned blocklist is refused, in every mode.</li> <li><b>Then the allowlist - unless allow-any is enabled.</b> By default the top-level origin must also be on the allowlist. When allow-any is enabled, the public-domain allowlist is skipped (any public domain that is neither SSRF-blocked nor blocklisted is reachable); allow-any relaxes <em>only</em> the allowlist, never SSRF or the blocklist.</li> </ol> <p> The allowlist, blocklist and allow-any flag are policy configuration owned by the administrator - not model-supplied arguments. The default (allowlist-enforced, allow-any off) is safe-by-default: an empty allowlist with allow-any off refuses every navigation. </p> <p> <b>Where the policy is enforced.</b> The authoritative layer is a single service-wide <i>filtering proxy</i> on the loopback interface that <em>every</em> browser session is pinned to: every connection Chromium makes - top-level navigation, redirect hop, sub-resource, IP-literal target - is checked there before a packet leaves the machine, and the destination is DNS-pinned so a rebinding host cannot slip through. One proxy suffices because the allowlist, blocklist and allow-any flag are <em>service</em> configuration, identical for every session; nothing about the decision varies per session. Inside each browser the same policy is applied again by a per-context request route, plus a redirect guard and a final-URL re-validation, which is what turns a refusal into the tool's clean policy message. </p>
