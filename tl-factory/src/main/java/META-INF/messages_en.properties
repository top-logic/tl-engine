com.top_logic.factory.agent.AgentConversationResolver = Agent conversation resolver
com.top_logic.factory.agent.AgentConversationResolver.tooltip = <i>Conversation backend resolver</i> letting the coding agent of a workspace answer the chats whose subject is an <code>"AgentConversation"</code>.
com.top_logic.factory.agent.WorkspaceAgentService = Workspace agent service
com.top_logic.factory.agent.WorkspaceAgentService.Config.harness = Harness
com.top_logic.factory.agent.WorkspaceAgentService.Config.harness.tooltip = The coding agent that runs in the workspaces.
com.top_logic.factory.agent.WorkspaceAgentService.Config.idle-timeout = Idle timeout
com.top_logic.factory.agent.WorkspaceAgentService.Config.idle-timeout.tooltip = How long the process of a conversation is kept after its last answer, e.g. 15min; the next message starts a new process continuing the conversation.
com.top_logic.factory.agent.WorkspaceAgentService.Config.interrupt-timeout = Interrupt timeout
com.top_logic.factory.agent.WorkspaceAgentService.Config.interrupt-timeout.tooltip = How long a run waits for the agent to stop after the user stopped it, before its process is terminated.
com.top_logic.factory.agent.WorkspaceAgentService.Config.stop-timeout = Stop timeout
com.top_logic.factory.agent.WorkspaceAgentService.Config.stop-timeout.tooltip = How long a process that is no longer needed has to end after its input was closed, before it is terminated.
com.top_logic.factory.agent.WorkspaceAgentService.Config.token-lifetime = Token lifetime
com.top_logic.factory.agent.WorkspaceAgentService.Config.token-lifetime.tooltip = The lifetime of the token of an agent process for the workspace proxy, e.g. 4h; at most the longest lifetime of the proxy. <p> A process whose token has less than half of its lifetime left is replaced by a new one before its next run, so that a run has at least that half. </p>
com.top_logic.factory.agent.WorkspaceAgentService.tooltip = Service holding the <i>workspace agents</i> of the <code>"AgentConversation"</code>s: the coding agent that works in a workspace, one process per conversation. <p> <i>Agent conversation resolver</i> lets the agents answer the chats whose subject is a conversation. Cleaning up a workspace stops its agents; a shutdown stops all of them. </p>
com.top_logic.factory.agent.claude.ClaudeCodeHarness = Claude code harness
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.command = Command
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.command.tooltip = The program of Claude Code in the workspace image.
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.extra-args = Extra arguments
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.extra-args.tooltip = Further arguments appended to the command line, e.g. --max-turns,50.
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.model = Model
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.model.tooltip = The model Claude Code works with, e.g. claude-sonnet-4-6 or an alias such as sonnet; empty for the default of Claude Code.
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.thinking-display = Thinking display
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.thinking-display.tooltip = How the thinking of the model appears in the output of Claude Code: <code>"summarized"</code> for a summary of it, which the chat shows; omitted for no text; empty for the default of Claude Code, which omits it in print mode.
com.top_logic.factory.agent.claude.ClaudeCodeHarness.tooltip = <i>Agent harness</i> running Claude Code in print mode with stream-json input and output. <p> The process is started as </p> <pre> claude -p --input-format stream-json --output-format stream-json --verbose --include-partial-messages --permission-mode bypassPermissions [--thinking-display &lt;display&gt;] [--model &lt;model&gt;] [--resume &lt;session ID&gt;] [--append-system-prompt &lt;instructions&gt;] [&lt;extra args&gt;] </pre> <p> as the workspace user - Claude Code refuses to bypass its permission prompts as root - with the environment of the process, e.g. its token for the workspace proxy in <code>"ANTHROPIC_AUTH_TOKEN"</code>. The container has the URL of the LLM route of the proxy in <code>"ANTHROPIC_BASE_URL"</code>. The output is translated by <i>claude code protocol</i>. </p>
