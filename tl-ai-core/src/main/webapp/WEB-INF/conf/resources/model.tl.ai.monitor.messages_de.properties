model.tl.ai.monitor = Agentenmonitor
model.tl.ai.monitor.Period = Zeitraum
model.tl.ai.monitor.Period.firstDay = Erster Tag der Achse
model.tl.ai.monitor.Period.firstDay.tooltip = Linker Rand eines Verlaufsdiagramms, als ganzer Tag. Leer bei "Alle" - dann ist es der Tag des ältesten Laufs.
model.tl.ai.monitor.Period.fromDay = Von
model.tl.ai.monitor.Period.fromDay.tooltip = Erster Tag des Zeitraums. Dieser Tag zählt vollständig mit.
model.tl.ai.monitor.Period.label = Bezeichnung
model.tl.ai.monitor.Period.label.tooltip = Wie der Zeitraum heißt, wo eine Zahl ihren Zeitraum nennen muss - etwa in der Beschriftung einer Kachel.
model.tl.ai.monitor.Period.lastDay = Letzter Tag der Achse
model.tl.ai.monitor.Period.lastDay.tooltip = Rechter Rand eines Verlaufsdiagramms, als ganzer Tag. Bei einem Vorgabezeitraum ist das heute.
model.tl.ai.monitor.Period.preset = Vorgabe
model.tl.ai.monitor.Period.preset.tooltip = Die gewählte Option des Zeitraumreglers: eine Tagesanzahl, 0 für "Alle", -1 für einen benutzerdefinierten Bereich.
model.tl.ai.monitor.Period.toDay = Bis
model.tl.ai.monitor.Period.toDay.tooltip = Letzter Tag des Zeitraums. Dieser Tag zählt vollständig mit.
model.tl.ai.monitor.Period.windowEnd = Ende des Zeitfensters
model.tl.ai.monitor.Period.windowEnd.tooltip = Obere Grenze, exklusiv: die Mitternacht nach dem letzten Tag. Leer, wenn der Zeitraum nach oben offen ist.
model.tl.ai.monitor.Period.windowStart = Anfang des Zeitfensters
model.tl.ai.monitor.Period.windowStart.tooltip = Untere Grenze, inklusiv. Leer, wenn der Zeitraum nach unten offen ist.
