com.top_logic.tl.ai.core.provider.bedrock.BedrockConverseProviderConfig.Config.api-key.tooltip = Der API-Schlüssel, der als Authorization: Bearer übermittelt wird. <p>Kann bei Endpunkten, die einen anderen Authentifizierungsmechanismus verwenden, null sein, siehe <i>Zugangsdaten</i>.</p>
com.top_logic.tl.ai.core.provider.bedrock.BedrockConverseProviderConfig.tooltip = <i>LLM-Anbieterkonfigurationsvoreinstellung</i> für die AWS Bedrock Converse-Streaming-API. <p> Konfiguriert einen <i>Bedrock Converse-Anbieter</i> für jeden Bedrock-kompatiblen Endpunkt, einschließlich Nexus-Claude-Gateways und direkte regionale AWS Bedrock-Endpunkte (https://bedrock-runtime.{region}.amazonaws.com). Ein API-Schlüssel wird als Bearer-Token gesendet. </p> <p> Auf Bedrock gibt es keinen Endpunkt für die Modellauflistung, daher müssen Modelle manuell zur Modellliste hinzugefügt werden und discoverModels() gibt immer eine leere Liste zurück. </p>
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry$Config = Konfiguration
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry$Config.tooltip = Konfiguration der Modell-Metadaten.
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry$OverrideConfig = Überschreibungskonfiguration
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry$OverrideConfig.tooltip = Bearbeitbare Modell-Metadaten für manuell konfigurierte Modelle (z. B. lokale oder <code>OpenAI</code>-kompatible Endpunkte), die nicht im entfernten Katalog stehen. <p> Anders als bei der <i>Konfiguration</i> sind diese Eigenschaften in der Administrationsoberfläche bearbeitbar und werden beim Start nicht geleert. </p> <p> <b>Preise.</b> Ein lokales Modell hat im Katalog keinen Preis und kostet daher in einem Geldbudget nichts. Die Preiseigenschaften geben ihm einen, in US-Dollar je Million Token wie im Katalog. Eine Überschreibung, die einen Eingabe- oder Ausgabepreis setzt, ersetzt die Katalogpreise dieses Modells; eine, die keinen davon setzt, behält sie. </p>
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry$PriceProperties = Preiseigenschaften
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry$PriceProperties.tooltip = Die Preise eines Modells je Million Token in US-Dollar - Einheit und Währung des models.dev-Katalogs. <p> Daraus wird berechnet, was ein Lauf kostet: Jede Art von Token, die der Anbieter meldet, wird zu ihrem eigenen Preis berechnet. Ein nicht angegebener Preis fällt zurück - Cache-Lesen und Cache-Schreiben auf den Eingabepreis, Reasoning auf den Ausgabepreis -, weil der Anbieter diese Token trotzdem berechnet. </p>
