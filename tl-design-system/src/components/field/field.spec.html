<!doctype html>
<html lang="de" data-tl-mode="light" data-tl-density="normal">
<head>
<meta charset="utf-8">
<title>TopLogic Design System — Feld</title>
<link rel="stylesheet" href="/fonts/style/interFonts.css">
<link rel="stylesheet" href="/fonts/style/bootstrap-icons.css">
<link rel="stylesheet" href="/dist/primitives.css">
<link rel="stylesheet" href="/dist/tokens.css">
<link rel="stylesheet" href="/dist/base.css">
<link rel="stylesheet" href="/dist/components.css">
<link rel="stylesheet" href="/specimen/specimen.css">
<style>
  /* 120 px: die schmale Tabellenzelle, in der die Pill heute hart abgeschnitten wird. */
  .specimen__cell { width: 7.5rem; }
  /* 320 px: ein langer Absatz im mehrzeiligen Lesewert muss umbrechen, nicht in einer Ellipse enden. */
  .specimen__cell--wide { width: 20rem; }
</style>
</head>
<body>
<main class="specimen">
  <div class="specimen__bar">
    <a class="tl-type-label" href="/">← Grundklassen</a>
    <span class="tl-type-heading-lg">Feld</span>
    <label class="tl-type-label"><input type="checkbox" id="mode"> dunkel</label>
    <label class="tl-type-label"><input type="checkbox" id="density"> kompakt</label>
  </div>

  <!-- Jede Zeile: ein Zustand oder eine Form, mit Beschriftung. Das Skript setzt die Zeilen auf jede Fläche. -->
  <template id="rows">
    <div class="specimen__row specimen__row--label-sm specimen__row--narrow">
      <span class="tl-type-label">Platzhalter</span>
      <input class="tl-field tl-type-body" placeholder="Platzhalter" aria-label="Platzhalter">
    </div>
    <div class="specimen__row specimen__row--label-sm specimen__row--narrow">
      <span class="tl-type-label">Wert</span>
      <input class="tl-field tl-type-body" value="Wert" aria-label="Wert">
    </div>
    <div class="specimen__row specimen__row--label-sm specimen__row--narrow">
      <span class="tl-type-label">aria-invalid</span>
      <input class="tl-field tl-type-body" value="Fehler" aria-invalid="true" aria-label="Fehler">
    </div>
    <div class="specimen__row specimen__row--label-sm specimen__row--narrow">
      <span class="tl-type-label">data-tl-state warning</span>
      <input class="tl-field tl-type-body" value="Warnung" data-tl-state="warning" aria-label="Warnung">
    </div>
    <div class="specimen__row specimen__row--label-sm specimen__row--narrow">
      <span class="tl-type-label">disabled</span>
      <input class="tl-field tl-type-body" value="deaktiviert" disabled aria-label="deaktiviert">
    </div>
    <div class="specimen__row specimen__row--label-sm specimen__row--narrow">
      <span class="tl-type-label">Select</span>
      <select class="tl-field tl-type-body" aria-label="Auswahl"><option>Auswahl</option></select>
    </div>
    <div class="specimen__row specimen__row--label-sm specimen__row--narrow">
      <span class="tl-type-label">Datum</span>
      <input type="date" class="tl-field tl-type-body" value="2026-10-06" aria-label="Datum">
    </div>
    <div class="specimen__row specimen__row--label-sm specimen__row--narrow">
      <span class="tl-type-label">Zeit</span>
      <input type="time" class="tl-field tl-type-body" value="09:30" aria-label="Zeit">
    </div>
    <div class="specimen__row specimen__row--label-sm specimen__row--narrow">
      <span class="tl-type-label">Zeitpunkt, disabled</span>
      <input type="datetime-local" class="tl-field tl-type-body" value="2026-10-06T09:30" disabled aria-label="Zeitpunkt">
    </div>
    <div class="specimen__row specimen__row--label-sm specimen__row--narrow">
      <span class="tl-type-label">mehrzeilig</span>
      <textarea class="tl-field tl-field--multiline tl-type-body" rows="3" aria-label="mehrzeilig">mehrzeilig</textarea>
    </div>
    <div class="specimen__row specimen__row--label-sm specimen__row--narrow">
      <span class="tl-type-label">Icon und Löschen</span>
      <span class="tl-field-group">
        <span class="tl-field-group__icon"><i class="tl-icon-sm bi bi-search" aria-hidden="true"></i></span>
        <input class="tl-field tl-type-body" value="mit Icon und Löschen" aria-label="Suche">
        <button type="button" class="tl-button tl-button--ghost tl-button--sm tl-button--icon tl-type-body" aria-label="Löschen"><i class="tl-icon-sm bi bi-x-lg" aria-hidden="true"></i></button>
      </span>
    </div>
    <div class="specimen__row specimen__row--label-sm specimen__row--narrow">
      <span class="tl-type-label">Link öffnen</span>
      <span class="tl-field-group">
        <input class="tl-field tl-type-body" value="https://www.top-logic.com" aria-label="Adresse">
        <a href="#" class="tl-button tl-button--ghost tl-button--sm tl-button--icon tl-type-body" aria-label="Öffnen"><i class="tl-icon-sm bi bi-box-arrow-up-right" aria-hidden="true"></i></a>
      </span>
    </div>
    <div class="tl-type-body specimen__row specimen__row--label-sm specimen__row--narrow">
      <span class="tl-type-label">Lesewert</span>
      <span class="tl-field-value"><span class="tl-field-value__text">Lesewert</span></span>
    </div>
    <div class="tl-type-body specimen__row specimen__row--label-sm specimen__row--narrow">
      <span class="tl-type-label">Lesewert als Link</span>
      <a href="#" class="tl-field-value"><span class="tl-field-value__text">root (Link)</span></a>
    </div>
    <div class="tl-type-body specimen__row specimen__row--label-sm specimen__row--narrow">
      <span class="tl-type-label">Lesewert mehrzeilig</span>
      <div class="tl-field-value tl-field-value--multiline"><span class="tl-field-value__text">Erste Zeile</span><span class="tl-field-value__text">&nbsp;</span><span class="tl-field-value__text">Dritte Zeile nach einer Leerzeile</span></div>
    </div>
    <div class="tl-type-body specimen__row specimen__row--label-sm specimen__row--narrow">
      <span class="tl-type-label">Lesewert mehrzeilig, langer Absatz, 320 px</span>
      <div class="specimen__cell--wide"><div class="tl-field-value tl-field-value--multiline"><span class="tl-field-value__text">Ein langer Absatz im schreibgeschützten Feld: Er steht in einer Zelle von zwanzig rem Breite und muss dort umbrechen, statt nach der ersten Zeile mit einer Ellipse zu enden. Auch ein überlanges Wort wie Donaudampfschifffahrtsgesellschaftskapitänsmütze bricht notfalls mitten im Wort.</span></div></div>
    </div>
    <div class="tl-type-body specimen__row specimen__row--label-sm specimen__row--narrow">
      <span class="tl-type-label">schmale Zelle, 120 px</span>
      <div class="specimen__cell"><span class="tl-field-value"><span class="tl-pill" data-tl-role="warning"><span class="tl-pill__label">Ein sehr langer Statuswert</span></span></span></div>
    </div>
  </template>

  <section class="specimen__panel" id="on-layer"><p class="tl-type-heading-sm">Auf surface-layer</p></section>
  <section class="specimen__base" id="on-base"><p class="tl-type-heading-sm">Auf surface-base</p></section>
  <section class="specimen__overlay" id="on-overlay"><p class="tl-type-heading-sm">Auf surface-overlay</p></section>
</main>
<script>
  const tpl = document.getElementById('rows');
  for (const id of ['on-layer', 'on-base', 'on-overlay']) document.getElementById(id).append(tpl.content.cloneNode(true));
  const html = document.documentElement;
  document.getElementById('mode').addEventListener('change', (e) => html.setAttribute('data-tl-mode', e.target.checked ? 'dark' : 'light'));
  document.getElementById('density').addEventListener('change', (e) => html.setAttribute('data-tl-density', e.target.checked ? 'compact' : 'normal'));
</script>
</body>
</html>
