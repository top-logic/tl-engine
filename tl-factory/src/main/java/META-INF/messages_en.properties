com.top_logic.factory.project.WorkspaceStatus.tooltip = The stored state of the workspace of a project, the Java counterpart of the classifiers of the enumeration <code>"WorkspaceStatus"</code>. <p> Besides the states of the container a <i>workspace provider</i> reports (see <i>workspace state</i>), a workspace is in a busy state while an operation runs on it, and in state <i>error</i> after an operation failed. </p>
