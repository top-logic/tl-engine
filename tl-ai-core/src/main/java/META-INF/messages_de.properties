com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.tooltip = Von TopLogic bereitgestellte Definitionen für Agenten und Fähigkeiten. <p> Dies sind Definitionen auf Plattformebene, die mit TopLogic ausgeliefert werden. Anwendungsspezifische Agenten und Fertigkeiten sollten über den Agenteneditor erstellt werden. </p> <p> Anwendungsmodule können die Schlüssellisten eines Plattformagenten (Tools, Skills, Delegationen, mcp-Server) über den Standardkonfigurations-Overlay-Mechanismus erweitern: Ein Overlay deklariert nur die Einträge, die es hinzufügt oder entfernt, und die übrigen Einträge der Plattform werden unverändert übernommen. Skalare Eigenschaften wie description und system-prompt werden weiterhin atomar ersetzt, wenn sie überschrieben werden, daher sollten Overlays sie nicht setzen, es sei denn, eine echte Ersetzung ist beabsichtigt. </p>
