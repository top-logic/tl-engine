model.tl.contact.external = External contacts
model.tl.contact.external.ExternalContact = External contact
model.tl.contact.external.ExternalContact.tooltip = A single contact from an external system. The value is not a business object of the application; it carries the data delivered by that system, such as name, division, telephone number and e-mail address.
model.tl.contact.external.ExternalContactSet = Collection of external contacts
model.tl.contact.external.ExternalContactSet.tooltip = Several contacts from an external system in one attribute. Apart from the number of values, the type behaves like the type for a single external contact.
model.tl.contact.external.tooltip = Module with the data types for contacts that are not administered in the application but read from an external system.
