com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.RolePolicy.name.tooltip = Die Sicherheitsrolle, um die es in diesem Eintrag geht.
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.RolePolicy.policy = Richtlinie
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.RolePolicy.policy.tooltip = Die Richtlinie, unter der diese Rolle browst. Ein Name, den keine Richtlinie darüber deklariert, ist ein Startfehler.
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.default = Standard
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.default.tooltip = Die Richtlinie für einen Benutzer, der keine der unten genannten Rollen hält. <p> Lassen Sie sie weg, und ein solcher Benutzer erreicht jeden Ursprung, den die SSRF-Prüfung zulässt - genau das, was eine Anwendung ohne Konfiguration hier immer getan hat. Nennen Sie eine Richtlinie, um sie für alle zur Untergrenze zu machen. </p>
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.policies = Richtlinien
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.policies.tooltip = Die Richtlinien, die diese Anwendung kennt, jeweils unter dem Namen, mit dem eine Rolle sie anspricht.
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.roles = Rollen
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.roles.tooltip = Welche Sicherheitsrolle unter welcher Richtlinie browst. <p> Ein Benutzer, der mehrere dieser Rollen hält, ist an <b>alle</b> ihre Richtlinien zugleich gebunden: Ein Ursprung ist nur erreichbar, wenn jede einzelne ihn erlaubt. Eine weitere Rolle zu halten kann deshalb nie erweitern, was ein Benutzer erreicht. </p>
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.tooltip = Welche Ursprünge die Agenten dieser Anwendung besuchen dürfen, je Sicherheitsrolle. <p> Konfigurieren Sie nichts, und nichts ändert sich: Jeder Ursprung, der die SSRF-Prüfung besteht, ist erreichbar wie bisher. Nennen Sie eine Richtlinie, und wer sie hält, erreicht genau die Ursprünge, die sie erlaubt. </p> <p> Das gilt für alle drei Wege aus der Anwendung heraus - den Browser, webFetch und webSearch. Es ist die Obergrenze: Eine Domain-Liste, die ein Agent an webSearch übergibt, kann sie nur weiter einschränken, nie erweitern. </p>
com.top_logic.tl.ai.core.tools.web.Freshness = Frische
