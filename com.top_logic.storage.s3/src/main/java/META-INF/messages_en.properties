com.top_logic.storage.s3.S3BlobStore = S3blob store
com.top_logic.storage.s3.S3BlobStore.Config.access-key = Access key
com.top_logic.storage.s3.S3BlobStore.Config.access-key.tooltip = The access key ID for authenticating at the storage. <p> Access key and secret key are either both given or both empty. When both are empty, the credentials are taken from the default credentials provider chain of the AWS SDK (environment variables, <code>~/.aws/credentials</code>, IAM role of the instance or container). </p>
com.top_logic.storage.s3.S3BlobStore.Config.bucket = Bucket
com.top_logic.storage.s3.S3BlobStore.Config.bucket.tooltip = The name of the bucket holding the blobs. <p> The bucket must exist; it is not created by the store. </p>
com.top_logic.storage.s3.S3BlobStore.Config.class.tooltip = Implementation class of the store.
com.top_logic.storage.s3.S3BlobStore.Config.direct-download = Direct download
com.top_logic.storage.s3.S3BlobStore.Config.direct-download-lifetime = Direct download lifetime
com.top_logic.storage.s3.S3BlobStore.Config.direct-download-lifetime.tooltip = The time a URL for a direct download stays valid, e.g. <code>60s</code>. <p> The storage checks the validity when the transfer starts, so a slow download of large content completes after the URL has expired. Anyone holding the URL can fetch the content within this time. At least one second, at most 7 days; the default is one minute. Only relevant if <i>Direct download</i> is enabled. </p>
com.top_logic.storage.s3.S3BlobStore.Config.direct-download-min-size = Direct download minimum size
com.top_logic.storage.s3.S3BlobStore.Config.direct-download-min-size.tooltip = The minimum size of content downloaded directly from the storage. <p> Smaller content is streamed through the application server, since the redirect would cost more than it saves. The size is given in bytes, optionally with a unit, e.g. <code>1MB</code>; the default is 1 MB. Only relevant if <i>Direct download</i> is enabled. </p>
com.top_logic.storage.s3.S3BlobStore.Config.direct-download.tooltip = Whether browsers download content directly from the storage. <p> When enabled, a download in the React UI is answered with a redirect to a presigned URL of the object instead of streaming the content through the application server. The browser must be able to reach the storage, see <i>Public endpoint</i>. The storage then also serves range requests, e.g. for seeking in audio or PDF content. The integrity check of the content against its stored hash is not applied to direct downloads. </p>
com.top_logic.storage.s3.S3BlobStore.Config.endpoint = Endpoint
com.top_logic.storage.s3.S3BlobStore.Config.endpoint.tooltip = The URL of the S3 service, e.g. <code>https://minio.example.com:9000</code>. <p> Empty for AWS S3, where the endpoint is derived from the region. Required for S3-compatible servers. The value is an absolute URL with protocol and host. </p>
com.top_logic.storage.s3.S3BlobStore.Config.kms-key-id = KMS key ID
com.top_logic.storage.s3.S3BlobStore.Config.kms-key-id.tooltip = The ID or ARN of the key used for the encryption mode SSE-KMS. <p> Empty to use the default key of the key management service. Only relevant if the <i>Server side encryption</i> is SSE-KMS, ignored for other encryption modes. </p>
com.top_logic.storage.s3.S3BlobStore.Config.multipart-threshold = Multipart threshold
com.top_logic.storage.s3.S3BlobStore.Config.multipart-threshold.tooltip = The maximum size of content uploaded in a single request. <p> Content up to this size is buffered in memory and uploaded in one request. Larger content is uploaded in parts. The size is given in bytes, optionally with a unit, e.g. <code>16MB</code>, and must not exceed 2147483639 bytes (2 GB minus 8 bytes). The default is 16 MB. </p> <p> The threshold should be at least the <i>Part size</i>: a smaller threshold uploads content between both sizes as multipart upload of a single part, which takes three requests instead of one. </p>
com.top_logic.storage.s3.S3BlobStore.Config.part-size = Part size
com.top_logic.storage.s3.S3BlobStore.Config.part-size.tooltip = The size of the parts of a multipart upload. <p> One part is buffered in memory per running upload. The size is given in bytes, optionally with a unit, e.g. <code>8MB</code>. It must be at least 5 MB and must not exceed 2147483639 bytes (2 GB minus 8 bytes). Since S3 accepts at most 10,000 parts per upload, the part size limits the size of a blob: the default of 8 MB allows blobs of up to 80 GB. </p>
com.top_logic.storage.s3.S3BlobStore.Config.path-style-access = Path style access
com.top_logic.storage.s3.S3BlobStore.Config.path-style-access.tooltip = Whether the bucket is addressed as part of the URL path (<code>https://host/bucket/key</code>) instead of the host name (<code>https://bucket.host/key</code>). <p> Most self-hosted S3-compatible servers (e.g. <code>MinIO</code>) require path-style access. </p>
com.top_logic.storage.s3.S3BlobStore.Config.prefix = Prefix
com.top_logic.storage.s3.S3BlobStore.Config.prefix.tooltip = Prefix of the object names of the blobs inside the bucket, e.g. <code>blobs/</code>. <p> The object name of a blob is this prefix directly followed by the key of the blob, so a prefix that is meant as directory must end with a slash. Several stores may share a bucket with different prefixes. Empty to store the blobs at the top level of the bucket. Objects under the prefix that are not blobs of the store, and objects in deeper directories below the prefix, are ignored. </p>
com.top_logic.storage.s3.S3BlobStore.Config.public-endpoint = Public endpoint
com.top_logic.storage.s3.S3BlobStore.Config.public-endpoint.tooltip = The URL under which browsers reach the S3 service, e.g. <code>https://storage.example.com</code>. <p> URLs for direct downloads are issued for this address. Empty if browsers reach the storage under the address given in <i>Endpoint</i>. The value is an absolute URL with protocol and host. Only relevant if <i>Direct download</i> is enabled. </p>
com.top_logic.storage.s3.S3BlobStore.Config.region = Region
com.top_logic.storage.s3.S3BlobStore.Config.region.tooltip = The region of the bucket, e.g. <code>eu-central-1</code>. <p> S3-compatible servers usually accept any region; the request signature is computed for the region given here. </p>
com.top_logic.storage.s3.S3BlobStore.Config.secret-key = Secret key
com.top_logic.storage.s3.S3BlobStore.Config.secret-key.tooltip = The secret key belonging to the <i>Access key</i>. <p> Required, if an access key is given. The value is given encrypted in the configuration, or as plain text with the prefix <code>unencrypted:</code>. </p>
com.top_logic.storage.s3.S3BlobStore.Config.server-side-encryption = Server side encryption
com.top_logic.storage.s3.S3BlobStore.Config.server-side-encryption.tooltip = The server-side encryption the storage applies to stored blobs.
com.top_logic.storage.s3.S3BlobStore.tooltip = <i>Blob store</i> keeping each blob as an object in a bucket of AWS S3 or an S3-compatible object storage (e.g. <code>MinIO</code>, Ceph RGW, Garage, <code>SeaweedFS</code>). <p> The object of a blob is named by the configured prefix followed by the key of the blob. The bucket must exist. Content up to the multipart threshold is buffered in memory and uploaded in a single request; larger content and content of unknown size exceeding the threshold is streamed in a multipart upload, buffering one part at a time. A failed multipart upload is aborted; leftovers of interrupted uploads are removed by the cleanup of the store. </p> <p> Without configured access keys, the credentials are taken from the default credentials provider chain of the AWS SDK: environment variables, the <code>~/.aws/credentials</code> file, or the IAM role of the instance or container. </p> <p> Optionally, browsers download content directly from the storage through short-lived presigned URLs instead of receiving it through the application server, see <i>Direct download</i>. </p>
com.top_logic.storage.s3.ServerSideEncryptionMode = Server side encryption mode
com.top_logic.storage.s3.ServerSideEncryptionMode.NONE = None
com.top_logic.storage.s3.ServerSideEncryptionMode.NONE.tooltip = No encryption is requested; the default encryption settings of the bucket apply.
com.top_logic.storage.s3.ServerSideEncryptionMode.SSE_KMS = SSE-KMS
com.top_logic.storage.s3.ServerSideEncryptionMode.SSE_KMS.tooltip = Encryption with a key of the key management service of the storage (SSE-KMS). <p> The key is configured in the store; without a key, the default key of the key management service is used. </p>
com.top_logic.storage.s3.ServerSideEncryptionMode.SSE_S3 = SSE-S3
com.top_logic.storage.s3.ServerSideEncryptionMode.SSE_S3.tooltip = Encryption with keys managed by the storage (SSE-S3, AES-256).
com.top_logic.storage.s3.ServerSideEncryptionMode.tooltip = Server-side encryption applied by the storage to the blobs of a <i>s3blob store</i>. <p> The content is encrypted and decrypted by the storage, transparently for the application. Range reads keep working. </p>
