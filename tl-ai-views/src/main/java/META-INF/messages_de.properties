com.top_logic.ai.views.ViewPreviewElement.tooltip = <view-preview>: eine Ansicht eines Änderungsvorschlags, von der Engine aus dem Text des Vorschlags gebaut und mit den echten Daten gezeigt - bevor etwas geschrieben wird. <p> Eine Vorschau ändert nichts: Ihre Befehle bleiben in der Werkzeugleiste, sind aber deaktiviert, und die Aktionen von Zeilen, Eingaben und Formularen fallen weg. Die Ansicht bekommt eigene Kanäle. </p><pre> &lt;view-preview change="selectedChange" side="AFTER"/&gt; </pre>
