tl.security.selfservice.mail.registrationExists.body = <p>Guten Tag,</p>\n<p>für diese E-Mail-Adresse wurde eine Registrierung in der Anwendung {0} angefordert. Mit dieser Adresse besteht aber bereits ein Zugang.</p>\n<p>Falls Sie Ihr Passwort vergessen haben, verwenden Sie bitte die Funktion „Passwort vergessen“ auf der Anmeldeseite der Anwendung.</p>\n<p>Falls Sie keine Registrierung angefordert haben, können Sie diese E-Mail ignorieren. Ihr Zugang bleibt unverändert.</p>\n<p>Mit freundlichen Grüßen<br/>\nIhr {0}-Team</p>
