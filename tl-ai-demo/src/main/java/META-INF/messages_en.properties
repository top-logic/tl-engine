com.top_logic.ai.demo.chat.DemoChatElement = Demo chat element
com.top_logic.ai.demo.chat.DemoChatElement.Config.invoice-type = Invoice type
com.top_logic.ai.demo.chat.DemoChatElement.Config.invoice-type.tooltip = Qualified name of the type whose instances the "Rechnungen" section lists.
com.top_logic.ai.demo.chat.DemoChatElement.tooltip = The demo's own <demo-agent-chat/>: the chat plus the invoices of this application. <p> It is what a host element looks like. The composition itself lives in the browser (DemoChat in tl-ai-demo/ui), which the React element name points at; the only thing the server has to add is the data the composition shows - the invoices of tl.ai.demo.imageclassification:Invoice, read by <i>demo chat control</i> and put into the control's state. </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService = Security demo setup service
com.top_logic.ai.demo.secdemo.SecDemoSetupService$PersonaConfig = Persona configuration
com.top_logic.ai.demo.secdemo.SecDemoSetupService$PersonaConfig.tooltip = One persona of the test bed: an account, the groups it joins, and the roles the aspect's role rules are expected to give it.
com.top_logic.ai.demo.secdemo.SecDemoSetupService$ProjectConfig = Project configuration
com.top_logic.ai.demo.secdemo.SecDemoSetupService$ProjectConfig.tooltip = One example project: its name, the logins it lists as partners, and the tickets it contains.
com.top_logic.ai.demo.secdemo.SecDemoSetupService$TicketConfig = Ticket configuration
com.top_logic.ai.demo.secdemo.SecDemoSetupService$TicketConfig.tooltip = One example ticket.
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.component-access = Component access
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.component-access.tooltip = The views (layout components) the persona roles may open, in the format of the engine's WEB-INF/conf/security.xml. <p> Model access rights alone do not make an application usable: a role that may read a type still sees no tab until it holds a command group on the enclosing <i>compound security layout</i>. This is where the persona roles get that. </p> <p> A profile named "*" is applied to every role a configured persona is expected to hold. That is how the test bed states that all personas see the same UI: the only thing distinguishing two of them is then the policy, never what they can reach, which is what makes an allow/deny pair on one prompt comparable. A profile named after a single role still works, for a persona that deliberately needs different views. </p> <p> In contrast to the engine's import, the entries here are applied <em>additively</em>: no access outside this configuration is touched, so the shipped demo is unaffected while the aspect is switched off. </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.initial-password = Initial password
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.initial-password.tooltip = Password given to the persona accounts when they are created. <p> Must satisfy the password policy of the configured authentication device (by default: at least 8 characters from at least two character classes). </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.personas = Personas
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.personas.tooltip = The accounts to seed, indexed by login. <p> One entry per persona of the test bed. Kept in configuration rather than in code so that the matrix a tester has to hold in their head - which login joins which group, which role that should produce, and what each one demonstrates - is readable in one place, next to the &lt;role-rules&gt;, the &lt;tool-access&gt; policy and the &lt;security-config&gt; that give those roles their meaning. </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.projects = Projects
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.projects.tooltip = The example projects and their tickets. <p> A project's partners are what the scope role rule reads, so this list is where the fixture's per-object security actually comes from: it is ordinary business data, and the rule derives the role from it. </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.groups = Groups
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.groups.tooltip = Names of the groups this account joins. <p> Must be declared on <i>initial groups</i> in the same aspect. Group membership is the only thing an administrator maintains by hand here; every role follows from it through a rule. </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.login = Login name
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.login.tooltip = Login name of the account to create.
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.partner-of = Partner of
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.partner-of.tooltip = Names of the projects this account is expected to hold the scope role on. <p> Also not an assignment: it follows from the account being listed in those projects' partners, which is configured on <i>Projects</i> (<i>security demo setup service configuration</i>). Stated here for the same reason <i>Roles</i> is - so the check has something to check against. </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.purpose = Purpose
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.purpose.tooltip = One line saying what this persona is in the fixture to demonstrate. <p> Logged at boot, so the boot log doubles as an index of the test bed. </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.roles = Roles
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.roles.tooltip = Names of the roles the aspect's tier rules are expected to give this account <b>on the security root</b>. <p> Not an assignment. Nothing in this service grants a role - the <singleton-rule> entries of the aspect do, from group membership. This is the claim the matrix makes, and <i>security demo setup service</i> checks it after boot so that a rule which produces nothing is a warning naming the persona rather than a silently narrow agent. </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.ProjectConfig.name = Name
com.top_logic.ai.demo.secdemo.SecDemoSetupService.ProjectConfig.name.tooltip = Name of the project.
com.top_logic.ai.demo.secdemo.SecDemoSetupService.ProjectConfig.partners = Partners
com.top_logic.ai.demo.secdemo.SecDemoSetupService.ProjectConfig.partners.tooltip = Logins of the accounts this project lists in pm:Project#partners. <p> The input of the scope role rule, and therefore the whole of this fixture's per-object security. It is ordinary business data; the rule derives the role from it. </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.ProjectConfig.tickets = Tickets
com.top_logic.ai.demo.secdemo.SecDemoSetupService.ProjectConfig.tickets.tooltip = The tickets contained in this project.
com.top_logic.ai.demo.secdemo.SecDemoSetupService.TicketConfig.body = Body
com.top_logic.ai.demo.secdemo.SecDemoSetupService.TicketConfig.body.tooltip = The ticket's body, readable by projectPartner only through a <part> grant.
com.top_logic.ai.demo.secdemo.SecDemoSetupService.TicketConfig.title = Title
com.top_logic.ai.demo.secdemo.SecDemoSetupService.TicketConfig.title.tooltip = The ticket's title, readable by everybody who may read the ticket.
com.top_logic.ai.demo.secdemo.SecDemoSetupService.tooltip = Seeds the fixtures of the agent security test bed: one account per persona, its group memberships, the example projects and tickets, the component (layout) access every persona needs to reach the agent chat - and a boot-time check that the declarative role rules produced the roles the persona matrix claims. <p> The service is only started when the opt-in aspect WEB-INF/conf/secdemo.config.xml is listed in WEB-INF/conf/metaConf.txt. All steps are idempotent, so restarting the application does not duplicate anything. </p> <p> <b>It assigns no roles.</b> That is the difference from the version of this fixture that preceded issue #290, and it is the point: roles arrive from the <role-rules> of the same aspect - a <singleton-rule> per tier, reading group membership, and a <rule type="reference"> deriving the scope from pm:Project#partners. Assigning them from Java taught no configuration idiom and, worse, hid the failure the tier/scope split makes possible: a role rule that produces nothing. So the matrix states which roles each persona is <em>expected</em> to hold and this service checks, after the seed data is committed, whether the rules delivered them. </p> <p> What has no declarative counterpart in the engine, and is therefore still here: creating accounts, joining them to groups, creating example instances, and applying component access. The engine's <i>access configuration setup</i> reads component access declaratively, but only from one fixed path, and its import <em>resets</em> the access of every view in the application before applying that file. An opt-in aspect must not do either, so this service applies the very same <i>access configuration</i> format additively. </p>
