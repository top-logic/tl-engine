class.com.top_logic.model.search.react.I18NConstants.ERROR_SCRIPT_EVALUATION__MSG = The script could not be evaluated: {0}
class.com.top_logic.model.search.react.I18NConstants.ERROR_SCRIPT_PARSE__MSG = The script could not be parsed: {0}
class.com.top_logic.model.search.react.I18NConstants.SCRIPT_RESULT_COLUMN = Result
com.top_logic.model.search.react.EvaluateDynamicScriptAction = Evaluate dynamic script action
com.top_logic.model.search.react.EvaluateDynamicScriptAction.Config.commitMessage.tooltip = The message to annotate to the changes the script performs. <p> If not set, the message names the executed script. </p> <p> A message may contain the placeholder '{0}' that is replaced with the source of the script. Only used when the evaluation runs in a transaction. </p>
com.top_logic.model.search.react.EvaluateDynamicScriptAction.tooltip = <i>View action</i> of the TL-Script console, compiling and evaluating the script source it processes - the default argument of its chain. <p> The script uses the arguments of the chain as variables, without declaring them: it is compiled against the names of the arguments it runs with. </p> <p> The source is the text a developer entered into the console's editor. Since the action executes the value it is given, it belongs to that console alone: it claims no tag and is not offered as a building block, and the console view references it by class=. A view running a script of its own uses <i>evaluate script action</i>, whose script is part of the view definition instead of arriving as data. </p> <p> The changes are committed with the configured commit message, by default with a message naming the executed script. </p>
com.top_logic.model.search.react.EvaluateScriptAction = Evaluate script action
com.top_logic.model.search.react.EvaluateScriptAction.Config.commitMessage.tooltip = The message to annotate to the changes the script performs. <p> If not set, the message names the label of the command and the command's main argument. </p> <p> A message may contain the placeholder '{0}' that is replaced with the label of the command's main argument. Only used when the evaluation runs in a transaction. </p>
com.top_logic.model.search.react.EvaluateScriptAction.Config.script = Script
com.top_logic.model.search.react.EvaluateScriptAction.Config.script.tooltip = The script to evaluate. <p> Uses the arguments of the chain as variables named after them, without declaring them. </p>
com.top_logic.model.search.react.EvaluateScriptAction.tooltip = <i>View action</i> evaluating the TL-Script given in its configuration. <p> The script uses the arguments of the chain as variables, without declaring them: in a command with the input channel item, <code>$item.get(`my.module:MyType#name`)</code> works on the object the channel holds, while a global expression such as <code>all(`my.module:MyType`)</code> uses none. The evaluation result is the result of the action, seen by its follow-up actions. </p> <p> With the transaction option set, the evaluation runs inside a committed transaction, so a script creating, modifying or deleting persistent objects has a lasting effect; otherwise it runs without an ambient transaction and any modification is discarded. The changes are committed with the configured commit message, by default with a message naming the command and its main argument. </p>
com.top_logic.model.search.react.ScriptResultTable = Script result table
com.top_logic.model.search.react.ScriptResultTable.Config.input = Input
com.top_logic.model.search.react.ScriptResultTable.Config.input.tooltip = Channel holding the raw evaluation result to display.
com.top_logic.model.search.react.ScriptResultTable.tooltip = Table showing a script evaluation result, with columns derived from the result. <p> App-specific console widget (referenced by class=, not a reusable @TagName element). The input channel holds the raw evaluation result; a written result rebuilds the table through a <i>script result control</i>, which derives the columns from the row values (one column per object attribute, plus a label column for primitive values). </p>
com.top_logic.model.search.react.TLScriptEditorElement = Script editor element
com.top_logic.model.search.react.TLScriptEditorElement.Config.context-variables = Context variables
com.top_logic.model.search.react.TLScriptEditorElement.Config.context-variables.tooltip = Names of variables that the surrounding infrastructure binds around the edited script and that are therefore offered at the top level of <code>$</code>-completion.
com.top_logic.model.search.react.TLScriptEditorElement.Config.readOnly = Read only
com.top_logic.model.search.react.TLScriptEditorElement.Config.readOnly.tooltip = Whether the editor is read-only.
com.top_logic.model.search.react.TLScriptEditorElement.Config.value = Value
com.top_logic.model.search.react.TLScriptEditorElement.Config.value-channel = Value channel
com.top_logic.model.search.react.TLScriptEditorElement.Config.value-channel.tooltip = Channel the edited text is published to, and from which external writes update the editor.
com.top_logic.model.search.react.TLScriptEditorElement.Config.value.tooltip = The initial TL-Script expression text. <p> Used as the initial value when no value channel is set or the channel is empty. </p>
com.top_logic.model.search.react.TLScriptEditorElement.tooltip = A <i>UI element</i> that renders a <code>CodeMirror</code> 6-based TL-Script editor. <p> Usage in .view.xml: </p> <pre> &lt;tlscript-editor value="x -&gt; $x + 1" /&gt; </pre> <p> With a value channel, the edited text is published to that channel (and external channel writes update the editor), so a command can read the current script — the basis of an interactive console. </p>
com.top_logic.model.search.react.TLScriptFieldControlProvider = TL-Script editor
com.top_logic.model.search.react.TLScriptFieldControlProvider.tooltip = Edits a TL-Script valued field in a TL-Script editor. <p> The editor works on the source text of the script, while the field holds it in one of two forms: </p> <ul> <li>A configuration property holds the parsed expression, converted by the format the configuration file uses, so exactly the scripts a configuration accepts can be entered.</li> <li>An attribute of the model type tl.model.search:Expr holds the compiled <i>search expression</i>, converted by that type's storage mapping <i>expression storage mapping</i>, so the entered script is the one that is stored.</li> </ul> <p> Which form the field holds is told by its value type. A script that cannot be read is reported on the field as an input error and leaves the stored value untouched; while the error is reported, the value is not confirmed. The editor accepts input while the field is editable and follows changes of its editability. </p> <p> The editor is large: where it has no room, the first line of the script's source that holds more than white space stands for it. </p>
