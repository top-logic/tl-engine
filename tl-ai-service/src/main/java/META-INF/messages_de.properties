com.top_logic.ai.service.agents.background.BackgroundConfig$Scope.tooltip = Legt den Einsatzbereich des Hintergrundagenten fest.
com.top_logic.ai.service.agents.background.BackgroundConfig.Scope.APPLICATION = Anmeldung
com.top_logic.ai.service.agents.background.BackgroundConfig.Scope.APPLICATION.tooltip = Der Agent arbeitet auf der Anwendungsebene, unabhï¿½ngig von jeder Chatsitzung.
com.top_logic.ai.service.agents.background.BackgroundConfig.Scope.CHAT = Chat
com.top_logic.ai.service.agents.background.BackgroundConfig.Scope.CHAT.tooltip = Der Agent arbeitet im Kontext einer bestimmten Chatsitzung. <p> Dies ist der Standardbereich. </p>
com.top_logic.ai.service.agents.background.BackgroundConfig.input = Eingabe
com.top_logic.ai.service.agents.background.BackgroundConfig.input.tooltip = Optionale zusätzliche Eingabekonfiguration für diesen Hintergrundagenten. <p> Bei Pre-Turn-Triggern ist die anstehende Nutzermeldung immer enthalten. Wenn hier eine zusätzliche Eingabequelle konfiguriert ist, empfängt der Agent beide Teile in XML-Tags verpackt (<user-message> und <additional-context>). Wenn keine Eingabe konfiguriert ist, empfängt der Agent die rohe Benutzernachricht ohne Tags. </p> <p> Bei anderen Auslösertypen ist die Eingabekonfiguration die einzige Datenquelle für den Agenten. ChatContextInput ist für Pre-Turn-Trigger oder anwendungsspezifische Agenten nicht verfügbar. </p>
com.top_logic.ai.service.agents.background.BackgroundConfig.output-handlers = Ausgabe-Handler
com.top_logic.ai.service.agents.background.BackgroundConfig.output-handlers.tooltip = Die Ausgabehandler, die die Ergebnisse dieses Hintergrundagenten verarbeiten. <p> Handler erhalten die rohe LLM-Antwort und kï¿½nnen eine beliebige Verarbeitung durchfï¿½hren. Es stehen zwei Handler-Typen zur Verfï¿½gung: <i>Konfiguration</i> fï¿½r benutzerdefinierte Java-Klassen und <i>Skript-Output-Handler</i> fï¿½r Inline-TL-Script. </p>
com.top_logic.ai.service.agents.background.BackgroundConfig.scope = Umfang
com.top_logic.ai.service.agents.background.BackgroundConfig.scope.tooltip = Der Einsatzbereich dieses Hintergrundagenten. <p> Standardmï¿½ï¿½ig ist dies <i>Chat</i>. </p>
com.top_logic.ai.service.agents.background.BackgroundConfig.tooltip = Konfiguration fï¿½r einen Hintergrundagenten, der auï¿½erhalb von interaktiven Chatsitzungen arbeitet. <p> Ein Hintergrundagent wird durch seinen <i>Anwendungsbereich</i>, einen <i>Auslï¿½ser</i>, der bestimmt, wann er lï¿½uft, und eine <i>Eingabe</i>, die bestimmt, welche Daten er verarbeitet, definiert. </p>
