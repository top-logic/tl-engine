com.top_logic.security.passkey.PasskeyRefusedException.Category.OTHER_ACCOUNT = Anderes Konto
com.top_logic.security.passkey.PasskeyRefusedException.Category.OTHER_ACCOUNT.tooltip = Der Passkey gehört zu einem anderen Konto als dem, für das die Anmeldung gestartet wurde.
