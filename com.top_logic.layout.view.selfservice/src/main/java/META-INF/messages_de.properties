com.top_logic.layout.view.selfservice.ApplyPasswordResetAction = Passwort zurücksetzen
com.top_logic.layout.view.selfservice.ApplyPasswordResetAction.tooltip = <i>Aktion anzeigen</i>, die die Selbstbedienungs-Passwortzurücksetzung abschließt: Dabei wird der im Zurücksetzungsdialog eingegebene Code mit dem bei <i>der Passwortzurücksetzungsanforderung</i> generierten <i>Code</i> (innerhalb dessen Gültigkeitsdauer) abgeglichen und anschließend das neue Passwort für das Konto übernommen. <p> Bei Erfolg wird der Dialog geschlossen und der Benutzer wird darüber informiert, dass er sich mit dem neuen Passwort anmelden kann – die Zurücksetzung führt <em>nicht</em> zur Anmeldung des Benutzers (im Gegensatz zu den regulären Folgeschritten der Anmeldung). </p>
com.top_logic.layout.view.selfservice.CheckVerificationCodeAction = Aktion „Bestätigungscode prüfen“
com.top_logic.layout.view.selfservice.CheckVerificationCodeAction.tooltip = <i>View-Aktion</i> des Code-Dialogs einer <i>Kontoanfrage</i>: Sie prüft den eingegebenen Code gegen den <i>Bestätigungscode</i>, der per E-Mail verschickt wurde, und ersetzt den Dialog durch den Dialog, der das Konto anlegt. <p> Der Code-Dialog (<code>"verification-code.view.xml"</code>) bearbeitet ein transientes <code>"tl.login:OtpEntry"</code>. Er trägt die Anfrage auf dem Kanal <code>"request"</code> und den Code auf dem Kanal <code>"verification"</code>. </p> <p> Der Kontodialog bearbeitet ein transientes <code>"tl.login:AccountCreation"</code>, dessen Benutzername die E-Mail-Adresse der Anfrage ist. Er erhält die Anfrage auf dem Kanal <code>"request"</code> und auf dem Kanal <code>"passwords"</code>, ob die Person ein Passwort wählt; die <i>Aktion „Eigenes Konto anlegen“</i> legt das Konto an. </p>
com.top_logic.layout.view.selfservice.CreateOwnAccountAction = Aktion „Eigenes Konto anlegen“
com.top_logic.layout.view.selfservice.CreateOwnAccountAction.tooltip = <i>View-Aktion</i> des Kontodialogs einer <i>Kontoanfrage</i>: Sie legt das Konto an und lässt die Anfrage fortfahren, meldet also z. B. den neuen Benutzer an. <p> Die Eingabe ist das <code>"tl.login:AccountCreation"</code>, das der Dialog bearbeitet; die Anfrage kommt aus dem Kanal <code>"request"</code>. Eine Ablehnung - fehlender Nachname, Passwörter, die voneinander abweichen oder gegen die Passwortregeln verstoßen, eine Anfrage, die nicht mehr fortgesetzt werden kann, ein Rückruf, der das Konto ablehnt - wird gemeldet, und der Dialog bleibt offen. </p>
com.top_logic.layout.view.selfservice.RequestInvitationCodeAction = Aktion „Einladungscode anfordern“
com.top_logic.layout.view.selfservice.RequestInvitationCodeAction.tooltip = <i>View-Aktion</i>, die die Annahme einer <i>Einladung</i> beginnt: Sie schickt einen <i>Bestätigungscode</i> an die Adresse der Einladung und öffnet den Code-Dialog, in dem die eingeladene Person ihn eingibt (siehe <i>Aktion „Bestätigungscode prüfen“</i>). <p> Die Aktion verarbeitet das Token des Einladungslinks (siehe <code>"invitation"</code>) oder die Einladung selbst. Eine Einladung, die nicht offen ist, lehnt sie mit dem Grund ab, ebenso eine Anforderung, die zu kurz auf die vorige für dieselbe Einladung folgt. Ohne konfigurierten Mailserver wird die Anforderung abgelehnt, und es öffnet sich kein Dialog: Der Code wird ausschließlich per E-Mail verschickt. </p> <p> Der Dialog trägt die Einladung als <i>Einladungsanfrage</i> und den Code auf seinen Kanälen; beide bleiben auf dem Server. Ein bereits geöffneter oberster Dialog, z. B. der Code-Dialog, aus dem ein neuer Code angefordert wird, wird ersetzt. </p>
com.top_logic.layout.view.selfservice.RequestPasswordResetAction = Passwort zurücksetzen
com.top_logic.layout.view.selfservice.RequestPasswordResetAction.tooltip = <i>Aktion anzeigen</i>, die die Selbstbedienungs-Passwortzurücksetzung startet: Sie generiert einen Bestätigungscode, sendet diesen per E-Mail an das identifizierte Konto und öffnet den Dialog zur Passwortzurücksetzung (wobei das Konto, der erwartete Code und dessen Erstellungszeit in den Dialogkanälen mitgeführt werden). <p> Um nicht preiszugeben, ob ein Benutzername existiert, ist das Verhalten unabhängig davon, ob das Konto gefunden wurde, identisch: Es wird immer ein Code generiert und der Dialog zum Zurücksetzen wird immer geöffnet; die E-Mail wird nur gesendet, wenn ein passendes, passwortänderbares Konto mit einer E-Mail-Adresse existiert. </p>
com.top_logic.layout.view.selfservice.RequestRegistrationCodeAction = Aktion „Registrierungscode anfordern“
com.top_logic.layout.view.selfservice.RequestRegistrationCodeAction.Config.captcha = Captcha
com.top_logic.layout.view.selfservice.RequestRegistrationCodeAction.Config.captcha.tooltip = Der Name des Kanals der View, der die Lösung des Captchas enthält, also des Kanals, in den das Captcha-Element schreibt.
com.top_logic.layout.view.selfservice.RequestRegistrationCodeAction.tooltip = <i>View-Aktion</i> des Registrierungsdialogs: Sie fordert bei der <i>Selbstregistrierung</i> einen <i>Bestätigungscode</i> für die eingegebene E-Mail-Adresse an und öffnet den Code-Dialog, in dem der Besucher ihn eingibt (siehe <i>Aktion „Bestätigungscode prüfen“</i>). <p> Die Eingabe ist das transiente <code>"tl.login:RegistrationRequest"</code>, das der Dialog bearbeitet. Die Lösung des Captchas, falls die Selbstregistrierung eines verlangt, kommt aus dem Kanal, den <i>Captcha</i> benennt. Eine Lösung wird nur einmal akzeptiert, daher leert die Aktion diesen Kanal nach jeder Anforderung, wodurch das Captcha eine neue Aufgabe erhält. </p> <p> Der Besucher erhält in jedem Fall dieselbe Meldung, ob die Adresse ein Konto hat oder nicht, sodass der Dialog nicht verrät, welche Adressen ein Konto haben. Eine Ablehnung - Registrierung abgeschaltet, Captcha nicht gelöst, ungültige Adresse, eine Anforderung, die zu kurz auf die vorige folgt - wird gemeldet, und der Dialog bleibt offen. </p> <p> Der Code-Dialog trägt die Adresse als <i>Registrierungsanfrage</i>, die das Konto anlegt. </p>
com.top_logic.layout.view.selfservice.SendNewCodeAction = Aktion „Neuen Code senden“
com.top_logic.layout.view.selfservice.SendNewCodeAction.tooltip = <i>View-Aktion</i> des Code-Dialogs einer <i>Kontoanfrage</i>, die einen neuen <i>Bestätigungscode</i> anfordert. <p> Die Anfrage auf dem Kanal <code>"request"</code> entscheidet, was geschieht: Eine Einladung schickt einen neuen Code an ihre Adresse, eine Registrierung führt zurück zum Dialog, der den Code anfordert, da ein neuer Code ein neues Captcha erfordert. </p>
