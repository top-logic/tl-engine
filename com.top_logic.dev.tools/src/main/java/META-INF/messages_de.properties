com.top_logic.dev.tools.model.ModelEditAction = Aktionsschritt „Modell bearbeiten“
com.top_logic.dev.tools.model.ModelEditAction$Mode = Modus
com.top_logic.dev.tools.model.ModelEditAction$Mode.tooltip = Die Modellmutation, die eine <i>Modellbearbeitungsaktion</i> ausführt.
com.top_logic.dev.tools.model.ModelEditAction.Config.container = Behälter
com.top_logic.dev.tools.model.ModelEditAction.Config.container.tooltip = Name des Kanals mit dem Container, in dem das neue Element angelegt wird: das Zielmodul für <i>Typ anlegen</i>, der Eigentümertyp (oder einer seiner Teile) für <i>Attribut anlegen</i>, die Aufzählung für <i>Klassifikator anlegen</i>, die spezialisierte Klasse für <i>Generalisierung hinzufügen</i> und <i>Generalisierung entfernen</i>. Wird von <i>Modul anlegen</i> und <i>Löschen</i> nicht verwendet.
com.top_logic.dev.tools.model.ModelEditAction.Config.mode = Modus
com.top_logic.dev.tools.model.ModelEditAction.Config.mode.tooltip = Die durchzuführende Modellmutation.
com.top_logic.dev.tools.model.ModelEditAction.Mode.ADD_GENERALIZATION = Generalisierung hinzufügen
com.top_logic.dev.tools.model.ModelEditAction.Mode.ADD_GENERALIZATION.tooltip = Fügt die in der Eingabe ausgewählte Klasse als Generalisierung der Containerklasse hinzu.
com.top_logic.dev.tools.model.ModelEditAction.Mode.CREATE_ATTRIBUTE = Attribut erstellen
com.top_logic.dev.tools.model.ModelEditAction.Mode.CREATE_ATTRIBUTE.tooltip = Füge dem Containertyp eine neue Eigenschaft hinzu, die durch die Eingabe beschrieben wird.
com.top_logic.dev.tools.model.ModelEditAction.Mode.CREATE_CLASSIFIER = Klassifikator erstellen
com.top_logic.dev.tools.model.ModelEditAction.Mode.CREATE_CLASSIFIER.tooltip = Füge der Container-Aufzählung einen neuen Klassifikator hinzu, dessen Name sich nach der Eingabe richtet.
com.top_logic.dev.tools.model.ModelEditAction.Mode.CREATE_MODULE = Modul erstellen
com.top_logic.dev.tools.model.ModelEditAction.Mode.CREATE_MODULE.tooltip = Erstellen Sie ein neues Modul mit dem Namen der Eingabe.
com.top_logic.dev.tools.model.ModelEditAction.Mode.CREATE_TYPE = Typ erstellen
com.top_logic.dev.tools.model.ModelEditAction.Mode.CREATE_TYPE.tooltip = Erstelle im Container-Modul eine neue Klasse oder Enumeration mit dem in der Eingabe angegebenen Namen.
com.top_logic.dev.tools.model.ModelEditAction.Mode.DELETE = Löschen
com.top_logic.dev.tools.model.ModelEditAction.Mode.DELETE.tooltip = Lösche das als Aktionsargument übergebene Modellteil.
com.top_logic.dev.tools.model.ModelEditAction.Mode.REMOVE_GENERALIZATION = Generalisierung entfernen
com.top_logic.dev.tools.model.ModelEditAction.Mode.REMOVE_GENERALIZATION.tooltip = Entfernt die als Aktionsargument übergebene Klasse aus den Generalisierungen der Containerklasse.
com.top_logic.dev.tools.model.ModelEditAction.tooltip = <i>Aktion</i>, die das Anwendungsmodell im Modelleditor ändert: legt ein Modul, einen Typ (Klasse oder Aufzählung) oder ein Attribut an, fügt einer Klasse eine Generalisierung hinzu oder entfernt sie, oder löscht einen Modellteil. <p> Die ändernden Operationen erzeugen ihr Ergebnis mit den <i>Model-Util</i>-Primitiven und geben den neu angelegten Teil an ihre Folgeaktionen weiter, damit er in den Auswahlkanal des Editors geschrieben werden kann. Der Name des angelegten Elements (und bei einem Attribut dessen Werttyp und Kardinalität) stammen aus dem transienten Objekt, das die Aktion verarbeitet (dem Ergebnis eines umschließenden <store-form-state> im Dialogformular); der Container, in dem das Element angelegt wird, stammt aus dem konfigurierten Containerkanal. Alle Operationen müssen in einer Transaktion laufen (die Aktion in <with-transaction> einschließen). </p>
