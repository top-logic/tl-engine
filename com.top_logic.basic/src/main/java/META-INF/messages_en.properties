com.top_logic.basic.credential.oauth.ClientSecretAuthentication.Config.secret.tooltip = The client secret.
com.top_logic.basic.credential.oauth.ClientSecretAuthentication.Method.BASIC = HTTP basic authentication
com.top_logic.basic.credential.oauth.ClientSecretAuthentication.Method.BASIC.tooltip = HTTP basic authentication with the form-encoded client identifier and secret as user and password (<code>client_secret_basic</code>).
com.top_logic.basic.credential.oauth.ClientSecretAuthentication.Method.POST = Request body
com.top_logic.basic.credential.oauth.ClientSecretAuthentication.Method.POST.tooltip = The client identifier and secret as parameters <code>"client_id"</code> and <code>"client_secret"</code> of the request body (<code>client_secret_post</code>).
com.top_logic.basic.credential.oauth.ClientSecretAuthentication.tooltip = <i>Client authentication</i> with a client secret (RFC 6749 §2.3.1). <pre> &lt;client-authentication class="com.top_logic.basic.credential.oauth.ClientSecretAuthentication" method="basic"&gt; &lt;secret class="com.top_logic.basic.credential.FileSecretSource" path="/run/secrets/client-secret"/&gt; &lt;/client-authentication&gt; </pre>
com.top_logic.basic.credential.oauth.DeviceLoginProvider = Device login provider
com.top_logic.basic.credential.oauth.DeviceLoginProvider.Config.device-authorization-url = Device authorization URL
com.top_logic.basic.credential.oauth.DeviceLoginProvider.Config.device-authorization-url.tooltip = URL of the device authorization endpoint of the authorization server. <p> If empty, the endpoint is read from the discovery document of the issuer. </p>
com.top_logic.basic.credential.oauth.DeviceLoginProvider.Config.refresh-token-store = Refresh token store
com.top_logic.basic.credential.oauth.DeviceLoginProvider.Config.refresh-token-store.tooltip = Storage of the refresh token, so that a restarted application needs no new login. <p> If not given, the refresh token is kept in memory only. </p>
com.top_logic.basic.credential.oauth.DeviceLoginProvider.tooltip = <i>Credential provider</i> authenticating requests with a personal access token of a user, who confirms the login once in a browser (OAuth 2.0 device authorization grant, RFC 8628). <p> Meant for development: a developer's application calls an API gateway with a token of the developer instead of holding a key of the external service. The client is typically a public client without client authentication. </p> <p> A token is obtained in this order: </p> <ol> <li>The cached access token, while it is valid.</li> <li>A new access token for the refresh token received last, or the refresh token in the configured store after a restart.</li> <li>A device login: the first request without a usable token starts the login in the background and fails with a message naming the URL to open and the code to confirm. The same instruction is logged as warning. Further requests fail with the same message until the user has confirmed the login; then the next request is authenticated. A denied or expired login is followed by a new one on the next request.</li> </ol> <p> Each token response with a refresh token updates the store, since the authorization server may issue a new refresh token with each use. A refresh token rejected by the server is removed from the store and a new device login starts. </p> <p> The scope <code>offline_access</code> lets the authorization server issue an offline refresh token. A regular refresh token is bound to the user's login session at the server and becomes invalid with it, e.g. after a few hours or when the user logs out in the browser. An offline token stays valid until it is unused for a longer period or revoked, so restarts of the application need no new login for days or weeks. </p> <p> A developer's configuration against a Keycloak realm, keeping the refresh token in the home directory of the developer: </p> <pre> &lt;credentials class="com.top_logic.basic.credential.oauth.DeviceLoginProvider" issuer="https://login.example.com/realms/my-realm" client-id="dev-gateway" scope="openid offline_access" &gt; &lt;refresh-token-store class="com.top_logic.basic.credential.oauth.FileRefreshTokenStore"/&gt; &lt;/credentials&gt; </pre> <p> The device code, access token and refresh token never appear in a log message or exception message, only the URL to open and the code the user confirms there. </p>
com.top_logic.basic.credential.oauth.FileRefreshTokenStore = File refresh token store
com.top_logic.basic.credential.oauth.FileRefreshTokenStore.Config.path = Path
com.top_logic.basic.credential.oauth.FileRefreshTokenStore.Config.path.tooltip = Path of the file holding the refresh token. <p> If empty, the file is located in the directory <code>.config/toplogic/oauth</code> of the user's home directory and named after the authorization server and the client. </p>
com.top_logic.basic.credential.oauth.FileRefreshTokenStore.tooltip = <i>Refresh token store</i> keeping the refresh token of a client in a file readable only by its owner. <pre> &lt;refresh-token-store class="com.top_logic.basic.credential.oauth.FileRefreshTokenStore"/&gt; </pre> <p> Without a configured path, the file is <code>~/.config/toplogic/oauth/&lt;server&gt;__&lt;client&gt;.json</code> in the home directory of the user running the application, where server and client are the identifier of the authorization server and the client identifier, with every character other than letters, digits, dot and hyphen replaced by an underscore. All applications of the user against the same client share the file, so that one login serves all of them. </p> <p> The file is a JSON object holding the token together with the server and client it belongs to. A file whose server or client does not match is ignored and overwritten by the next token. On file systems with POSIX permissions, the file is readable and writable only by its owner (0600), and directories created for it are accessible only by their owner (0700). The file is replaced atomically, so that a concurrent reader never sees a partially written token. </p>
com.top_logic.basic.credential.oauth.JwsAlgorithm = JWS algorithm
com.top_logic.basic.credential.oauth.JwsAlgorithm.ES256 = ES256
com.top_logic.basic.credential.oauth.JwsAlgorithm.ES256.tooltip = ECDSA with the curve P-256 and SHA-256. <p> The signature is the concatenation of the values R and S of 32 bytes each (RFC 7518 §3.4), the format the JDK produces as <code>SHA256withECDSAinP1363Format</code>. </p>
com.top_logic.basic.credential.oauth.JwsAlgorithm.RS256 = RS256
com.top_logic.basic.credential.oauth.JwsAlgorithm.RS256.tooltip = RSASSA-PKCS1-v1_5 with SHA-256, signed with an RSA key.
com.top_logic.basic.credential.oauth.JwsAlgorithm.tooltip = Signature algorithm of a JSON web signature (RFC 7518 §3.1). <p> The constant names are the algorithm names of the header <code>"alg"</code>. </p>
com.top_logic.basic.credential.oauth.OAuthClient = OAuth client
com.top_logic.basic.credential.oauth.OAuthClient.tooltip = An OAuth 2.0 client at an authorization server: creates requests to the server that carry the client's identity and credentials. <p> The building block of credential providers that obtain tokens with any grant type. A provider creates a token request, adds the parameters of its grant and sends it. It keeps the token in a <i>token cache</i>. </p>
com.top_logic.basic.credential.oauth.OAuthClientConfig.client-authentication = Client authentication
com.top_logic.basic.credential.oauth.OAuthClientConfig.client-authentication.tooltip = How the client proves its identity to the authorization server. <p> If not given, the client is a public client that sends only its identifier. </p>
com.top_logic.basic.credential.oauth.OAuthClientConfig.client-id = Client ID
com.top_logic.basic.credential.oauth.OAuthClientConfig.client-id.tooltip = Identifier of the client at the authorization server.
com.top_logic.basic.credential.oauth.OAuthClientConfig.default-token-lifetime = Default token lifetime
com.top_logic.basic.credential.oauth.OAuthClientConfig.default-token-lifetime.tooltip = Assumed lifetime of an access token whose lifetime the authorization server does not specify. <p> When a service rejects such a token earlier, the consumer invalidates it and a new token is requested. </p>
com.top_logic.basic.credential.oauth.OAuthClientConfig.parameters = Parameters
com.top_logic.basic.credential.oauth.OAuthClientConfig.parameters.tooltip = Additional parameters of the token request, e.g. <code>audience</code> or <code>resource</code> (RFC 8707) to select the service the token is meant for.
com.top_logic.basic.credential.oauth.OAuthClientConfig.renewal-margin = Renewal margin
com.top_logic.basic.credential.oauth.OAuthClientConfig.renewal-margin.tooltip = Time before the end of the lifetime of an access token when it is renewed. <p> At most half of the token's lifetime is used as margin, so that short-lived tokens are still used for a while. </p>
com.top_logic.basic.credential.oauth.OAuthClientConfig.scope = Scope
com.top_logic.basic.credential.oauth.OAuthClientConfig.scope.tooltip = Space-separated scopes requested for the access token, e.g. <code>https://cognitiveservices.azure.com/.default</code> for Azure. <p> If empty, the authorization server grants its default scope. </p>
com.top_logic.basic.credential.oauth.OAuthServer = OAuth server
com.top_logic.basic.credential.oauth.OAuthServer.tooltip = Connection to an OAuth 2.0 authorization server. <p> Locates the endpoints of the server, either from the configured token URL or from the discovery document of the issuer (OIDC Discovery, RFC 8414), and sends form-encoded requests to them. </p> <p> The discovery document is fetched once on first use and kept. A failed fetch is not kept, the next use tries again. </p> <p> No exception thrown by this class contains a request parameter or the content of a response, since these may carry secrets or tokens. Error responses are reported with their HTTP status and their error code and description. </p>
com.top_logic.basic.credential.oauth.OAuthServerConfig.connect-timeout = Connect timeout
com.top_logic.basic.credential.oauth.OAuthServerConfig.connect-timeout.tooltip = Maximum time for establishing a connection to the authorization server.
com.top_logic.basic.credential.oauth.OAuthServerConfig.issuer = Issuer
com.top_logic.basic.credential.oauth.OAuthServerConfig.issuer.tooltip = Identifier (URL) of the authorization server, e.g. <code>https://login.example.com/realms/my-realm</code> for a Keycloak realm. <p> The endpoints of the server are read from its discovery document at <code>&lt;issuer&gt;/.well-known/openid-configuration</code>. Either the issuer or the token URL must be given. </p>
com.top_logic.basic.credential.oauth.OAuthServerConfig.request-timeout = Request timeout
com.top_logic.basic.credential.oauth.OAuthServerConfig.request-timeout.tooltip = Maximum time for a request to the authorization server, until the response has been received.
com.top_logic.basic.credential.oauth.OAuthServerConfig.token-url = Token URL
com.top_logic.basic.credential.oauth.OAuthServerConfig.token-url.tooltip = URL of the token endpoint of the authorization server. <p> Either the token URL or the issuer must be given. </p>
com.top_logic.basic.credential.oauth.PrivateKeyJwtAuthentication = Private key JWT authentication
com.top_logic.basic.credential.oauth.PrivateKeyJwtAuthentication.Config.algorithm = Algorithm
com.top_logic.basic.credential.oauth.PrivateKeyJwtAuthentication.Config.algorithm.tooltip = The signature algorithm, which determines the type of the private key.
com.top_logic.basic.credential.oauth.PrivateKeyJwtAuthentication.Config.assertion-lifetime = Assertion lifetime
com.top_logic.basic.credential.oauth.PrivateKeyJwtAuthentication.Config.assertion-lifetime.tooltip = Time until the assertion expires.
com.top_logic.basic.credential.oauth.PrivateKeyJwtAuthentication.Config.key-id = Key ID
com.top_logic.basic.credential.oauth.PrivateKeyJwtAuthentication.Config.key-id.tooltip = Identifier of the key, sent in the header of the assertion. <p> Allows the authorization server to select the public key when several keys are registered for the client, e.g. during a key rotation. </p>
com.top_logic.basic.credential.oauth.PrivateKeyJwtAuthentication.Config.private-key = Private key
com.top_logic.basic.credential.oauth.PrivateKeyJwtAuthentication.Config.private-key.tooltip = The private key of the client in PKCS#8 PEM format (<code>-----BEGIN PRIVATE KEY-----</code>).
com.top_logic.basic.credential.oauth.PrivateKeyJwtAuthentication.tooltip = <i>Client authentication</i> with a JSON web token signed by the client's private key (<code>private_key_jwt</code>, RFC 7523 §2.2). <p> For each request a new assertion is created with the client identifier as issuer and subject, the token endpoint as audience, a random identifier and a short lifetime. The public key is registered for the client at the authorization server, the private key never leaves the application. </p> <pre> &lt;client-authentication class="com.top_logic.basic.credential.oauth.PrivateKeyJwtAuthentication" algorithm="ES256" key-id="my-app-2026" &gt; &lt;private-key class="com.top_logic.basic.credential.FileSecretSource" path="/run/secrets/my-app-key.pem"/&gt; &lt;/client-authentication&gt; </pre> <p> A matching key pair is created with <code>openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out my-app-key.pem</code> (ES256) or <code>openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out my-app-key.pem</code> (RS256), the public key to register with <code>openssl pkey -in my-app-key.pem -pubout</code>. </p>
