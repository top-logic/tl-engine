tl.security.selfservice.mail.invitation.body = <p>Guten Tag,</p>\n<p>Sie wurden eingeladen, einen Zugang für die Anwendung {0} anzulegen.</p>\n<p>Um mit der Einrichtung zu beginnen, öffnen Sie bitte den folgenden Link und folgen Sie den Anweisungen auf der Webseite:<br/>\n<a href="{1}">{1}</a></p>\n<p>Falls Sie diese Einladung nicht erwartet haben, können Sie diese E-Mail einfach ignorieren.</p>\n<p>Mit freundlichen Grüßen<br/>\nIhr {0}-Team</p>
tl.security.selfservice.mail.invitation.subject = Einladung zu {0}
tl.security.selfservice.mail.resetMfa.body = <p>Guten Tag,</p>\n<p>Für Ihren Zugang zu {0} wurde das Zurücksetzen der Multi-Faktor-Authentifizierung angefordert.</p>\n<p>Wenn Sie dies angefordert haben, können Sie die Multi-Faktor-Authentifizierung mit dem folgenden Code zurücksetzen.<br/>\n<b>Bestätigungscode:</b> {1}</p>\n<p>Aus Sicherheitsgründen ist dieser Code nur für begrenzte Zeit gültig und kann nur einmal verwendet werden.</p>\n<p>Bei Fragen oder wenn Sie Unterstützung benötigen, wenden Sie sich bitte an unser Support-Team.</p>\n<p>Mit freundlichen Grüßen<br/>\nIhr {0}-Team</p>
tl.security.selfservice.mail.resetMfa.subject = Bestätigungscode zum Zurücksetzen der Multi-Faktor-Authentifizierung in {0}
tl.security.selfservice.mail.resetPassword.body = <p>Guten Tag,</p>\n<p>Für Ihren Zugang zu {0} wurde das Zurücksetzen des Passworts angefordert.</p>\n<p>Wenn Sie dies angefordert haben, können Sie mit dem folgenden Code ein neues Passwort festlegen.<br/>\n<b>Bestätigungscode:</b> {1}</p>\n<p>Aus Sicherheitsgründen ist dieser Code nur für begrenzte Zeit gültig und kann nur einmal verwendet werden.</p>\n<p>Falls Sie das Zurücksetzen des Passworts <b>nicht</b> angefordert haben, können Sie diese E-Mail einfach ignorieren. Ihr Passwort bleibt dann unverändert.</p>\n<p>Zu Ihrer Sicherheit empfehlen wir ein starkes Passwort, das Sie nur hier verwenden und regelmäßig ändern.</p>\n<p>Bei Fragen oder wenn Sie Unterstützung benötigen, wenden Sie sich bitte an unser Support-Team.</p>\n<p>Mit freundlichen Grüßen<br/>\nIhr {0}-Team</p>
tl.security.selfservice.mail.resetPassword.subject = Anforderung zum Zurücksetzen des Passworts in {0}
tl.security.selfservice.mail.verification.body = <p>Guten Tag,</p>\n<p>bitte geben Sie den folgenden Bestätigungscode in der Anwendung ein, um fortzufahren:<br/>\n<b>Bestätigungscode:</b> {1}</p>\n<p>Dieser Bestätigungscode ist nur für begrenzte Zeit gültig.</p>\n<p>Falls Sie diese Einladung nicht erwartet haben, können Sie diese E-Mail einfach ignorieren.</p>\n<p>Mit freundlichen Grüßen<br/>\nIhr {0}-Team</p>
tl.security.selfservice.mail.verification.subject = Ihr Bestätigungscode für {0}
