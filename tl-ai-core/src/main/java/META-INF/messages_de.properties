com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.OriginRule.downloads = Downloads
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.OriginRule.downloads.tooltip = Ob eine Seite dieses Ursprungs einen Datei-Download starten darf. <p> Weggelassen gilt die Einstellung darüber: Ein Ursprung, den diese Regel erlaubt, darf auch herunterladen. Ein Ursprung, den diese Regel ablehnt, lädt nie herunter, was immer hier steht. </p>
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.OriginRule.host = Host
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.OriginRule.host.tooltip = Der Host, um den es in dieser Regel geht. <p> docs.example.com ist genau dieser Host und kein anderer. *.example.com sind alle Sub-Domains von example.com, aber nicht example.com selbst - schreiben Sie beide Einträge, um eine Domain und alles darunter abzudecken. </p>
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.Policy.access = Zugriff
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.Policy.access.tooltip = Was an einem Ursprung gilt, den keine der Regeln darunter nennt. <p> „allow“ macht die Regeln zu Ausnahmen, die verbieten; „deny“ macht sie zu den einzigen Ursprüngen, die diese Richtlinie erreicht. </p>
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.Policy.downloads = Downloads
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.Policy.downloads.tooltip = Ob eine Seite an einem Ursprung, den keine der Regeln darunter nennt, einen Datei-Download starten darf. <p> Weggelassen gilt die Einstellung darüber: Ein Ursprung, der besucht werden darf, darf auch herunterladen. Setzen Sie sie auf „deny“ für eine Richtlinie, die das Web liest, aber nie eine Datei daraus speichert. </p>
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.Policy.name.tooltip = Der Name, unter dem Rollen sich auf diese Richtlinie beziehen.
