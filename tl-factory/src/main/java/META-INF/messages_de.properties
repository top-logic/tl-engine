com.top_logic.factory.ci.CIRoute = CI-Route
com.top_logic.factory.ci.CIRoute.Config.max-log-size = Maximale Log-Größe
com.top_logic.factory.ci.CIRoute.Config.max-log-size.tooltip = Der größte Teil der Konsolenausgabe eines Builds, mit dem die Route antwortet, in Bytes: von einer längeren Ausgabe nur ihre letzten Zeilen.
com.top_logic.factory.ci.CIRoute.tooltip = <i>Proxy-Route</i> des Workspace-Proxys, über die der Coding-Agent eines Workspaces die Anwendung seines Projekts auf dem CI-Server erstellt, ohne dass im Workspace Anmeldedaten für den CI-Server vorhanden sind. <p> Die Route bietet eine eigene, vom CI-Server unabhängige API für den CI-Job des Projekts im Workspace, für den die Sperre der Anfrage ausgestellt wurde. Nachfolgend der Pfad der Route (standardmäßig <code>"/ci"</code>): </p> <ul> <li>POST<code>"builds"</code> startet einen Build und antwortet mit einem JSON-Objekt: dem Job, der Nummer des Builds (null, solange er in der Warteschlange steht) und seiner Seite.</li> <li>GET<code>"last"</code> liefert den letzten Build als JSON-Objekt: Job, Nummer, Status (ein <i>CI-Build-Status</i>), Seite, Startzeit (ISO 8601), Dauer in Millisekunden; 404, wenn der Job keinen Build aufweist.</li> <li>Ein GET-Aufruf mit <code>"builds"</code>(der Nummer des Builds) und <code>"log"</code>, getrennt durch Schrägstriche, liefert das Ende der Konsolenausgabe des Builds als Klartext, maximal <i>„Maximale Protokollgröße“</i> Bytes; eine gekürzte Ausgabe beginnt mit Zeile <code>"[... earlier output omitted ...]"</code>.</li> </ul> <p> Jede andere Anfrage – ein anderer Pfad oder eine andere Methode –, jede Anfrage eines Arbeitsbereichs, dessen Projekt keinen CI-Job hat, sowie jede Anfrage, bei der kein CI-Server konfiguriert ist, wird mit 404 beantwortet. Ein Ausfall des CI-Servers wird mit 502 und einem festen Text beantwortet; die Details werden im Protokoll der Steuerungsanwendung erfasst. Die Anfragen werden wie bei jeder Route mit der Sperre des Arbeitsbereichs authentifiziert, siehe <code>"TL_FACTORY_PROXY_TOKEN"</code>. </p>
com.top_logic.factory.ci.CIService = CI-Service
com.top_logic.factory.ci.CIService.Config.pipeline-template = Pipeline-Vorlage
com.top_logic.factory.ci.CIService.Config.pipeline-template.tooltip = Die Ressource der Webanwendung, deren Inhalt eine neue Anwendung als Pipeline-Definition erhält, die Pipeline-Datei ihres ersten Commits. <p> Eine Anwendung ersetzt den Standard durch eine Ressource desselben Pfads in ihrer eigenen Webanwendung oder nennt hier eine andere Ressource. </p>
com.top_logic.factory.ci.CIService.Config.provider = Anbieter
com.top_logic.factory.ci.CIService.Config.provider.tooltip = Der CI-Server, auf dem die Jobs der Projekte ausgeführt werden. <p> Wenn nicht festgelegt, ist CI deaktiviert; ebenso mit einem Anbieter, dessen Basis-URL leer ist und der dann nicht erzeugt wird. </p>
com.top_logic.factory.ci.CIService.tooltip = Dienst, der den <i>CI-Anbieter</i> des CI-Servers hält, der die Anwendungen der Projekte baut. <p> CI ist optional: Ohne einen Anbieter oder mit einem durch eine leere Basis-URL abgeschalteten ist der Dienst deaktiviert, die Projekte haben keinen CI-Job, und das Anlegen eines Workspaces und die Arbeit darin beziehen keinen CI-Server ein. </p> <p> Der Start des Dienstes kontaktiert den CI-Server nicht, sodass die Anwendung auch startet, wenn er nicht erreichbar ist; die erste Operation meldet das. </p>
com.top_logic.factory.git.GitHostingService = Git-Hosting-Dienst
com.top_logic.factory.git.GitHostingService.Config.protected-files = Geschützte Dateien
com.top_logic.factory.git.GitHostingService.Config.protected-files.tooltip = Glob-Muster der Dateien eines Projekt-Repositorys, die kein Push ändern darf, z. B. die Build-Pipeline und das Deployment der Anwendung. <p> Der Default-Branch jedes Repositorys eines Projekts wird mit diesen Mustern geschützt, sobald ein Workspace des Projekts die Quellen darin hat: Eine Änderung einer solchen Datei gelangt nur über einen geprüften Pull-Request in den Branch, weder der Agent noch die Steuerungsanwendung pushen sie. Die Muster sind relativ zum Wurzelverzeichnis des Repositorys, * passt innerhalb eines Pfadsegments, ** über Segmente hinweg. </p>
com.top_logic.factory.git.GitHostingService.Config.provider = Anbieter
com.top_logic.factory.git.GitHostingService.Config.provider.tooltip = Der Git-Hosting-Dienst, auf dem die Repositorys der Projekte angelegt werden. <p> Wenn nichts angegeben ist, ist der Git-Hosting-Dienst deaktiviert; ebenso mit einem Anbieter, dessen Basis-URL leer ist und der dann nicht erzeugt wird. </p>
com.top_logic.factory.git.GitHostingService.tooltip = Dienst mit dem <i>Git-Hosting-Anbieter</i> des Git-Hosting-Dienstes, auf dem die Repositorys der Projekte liegen. <p> Git-Hosting ist optional: Ohne <i>Anbieter</i> oder mit einem durch eine leere Basis-URL abgeschalteten ist der Dienst deaktiviert, und die Projekte haben kein Repository bei einem Hosting-Dienst. </p> <p> Beim Starten des Dienstes wird keine Verbindung zum Hosting-Dienst hergestellt, sodass die Anwendung auch dann startet, wenn dieser nicht erreichbar ist; der erste Vorgang meldet dies. </p>
com.top_logic.factory.git.GitRoute = Git-Route
