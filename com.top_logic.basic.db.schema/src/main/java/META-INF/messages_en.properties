com.top_logic.basic.db.schema.setup.config.KeyAttributes = Key attributes
com.top_logic.basic.db.schema.setup.config.KeyAttributes.attributes = Attributes
com.top_logic.basic.db.schema.setup.config.KeyAttributes.attributes.tooltip = All key attributes annotated type.
com.top_logic.basic.db.schema.setup.config.KeyAttributes.tooltip = Configuration of the key attributes of a <i>meta object</i>. <p> A key attributes is present in each event describing a change of an object of the annotated type regardless whether it's value has changed or not. Marking an attribute as key attribute is useful, if listeners of the annotated type require the value of such attribute for processing the change. </p>
com.top_logic.basic.db.schema.setup.config.KeyAttributes.type = Type
com.top_logic.basic.db.schema.setup.config.KeyAttributes.type.tooltip = No longer used: The type for which the key attributes are defined.
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.additional-tables = Additional tables
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.additional-tables.tooltip = The additional table declarations for this <i>schema setup</i>. <p> This value is filled from <i>Schemas</i> during a resolve process. </p>
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.branch-last = Branch last
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.branch-last.tooltip = Whether the branch column is placed behind the identifying columns in the primary keys and reference indexes of the tables. <p> By default, the branch column leads each index. This allows databases with index prefix compression (Oracle) to store the branch only once per index block. With this option, the branch column is placed directly before the trailing revision column instead (or at the end of an index without revision column), e.g. the primary key of an object table becomes <code>(IDENTIFIER, BRANCH, REV_MAX)</code> and the index of a reference <code>(&lt;REF&gt;_ID, BRANCH, REV_MAX)</code>. </p> <p> This is meant for database systems that use an index for a condition with an <code>IN</code> list only if the list values are given for the first column of the index (H2). With the branch column in front, loading objects by a list of identifiers and searching the referrers of a list of objects scan the whole table on such a system. </p> <p> Indexes declared with an explicit column list (custom indexes) keep their declared column order. In the other declared indexes, the branch column follows the declared columns. </p> <p> Changing the value for an existing database converts the primary keys and indexes of its tables to the configured layout when the application starts. </p>
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.declarations = Declarations
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.declarations.tooltip = List of resources containing table declarations. <p> These resources are internally used to resolve the <i>meta objects configuration</i> which is stored in <i>Meta objects</i>. </p>
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.key-attributes = Key attributes
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.key-attributes.tooltip = No longer used: All <i>key attributes</i> indexed by type for this <i>schema configuration</i>.
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.meta-objects = Meta objects
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.meta-objects.tooltip = The <i>meta object</i> declarations for this <i>schema setup</i>. <p> This value is filled from <i>Declarations</i> during a resolve process. </p>
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.multiple-branches = Multiple branches
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.multiple-branches.tooltip = Whether the types support more branches than trunk. <p> Changing the value for an existing database converts its tables when the application starts: the branch columns are added and filled with the trunk, or dropped. Dropping the branch columns requires that the database contains only the trunk. </p>
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.providers = Providers
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.providers.tooltip = List of configurations of <i>type provider</i> to create types programatically.
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.schemas = Schemas
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.schemas.tooltip = Declaration of additional low-level tables.
