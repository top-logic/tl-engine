model.tl.contact.ui = UI
model.tl.contact.ui.CreateAccount = Zugang anlegen
model.tl.contact.ui.CreateAccount.tooltip = Formulartyp des Dialogs, der einen Personenkontakt gemeinsam mit einem Zugang für diese Person anlegt. Er verbindet die Attribute des Kontakts mit dem Benutzernamen des anzulegenden Zugangs.
model.tl.contact.ui.CreateLogin = Anmeldedaten anlegen
model.tl.contact.ui.CreateLogin.login = Benutzername
model.tl.contact.ui.CreateLogin.login.tooltip = Der Benutzername des anzulegenden Zugangs. Ein Name, den ein bestehender Zugang schon verwendet, wird abgewiesen. Wird kein Name angegeben, entsteht nur der Kontakt und kein Zugang.
model.tl.contact.ui.CreateLogin.tooltip = Formulartyp, der einem Anlegedialog den Benutzernamen eines zu erzeugenden Zugangs hinzufügt. Objekte dieses Typs werden nicht gespeichert; der Typ beschreibt nur die Eingaben des Dialogs.
model.tl.contact.ui.tooltip = Modul mit den Formulartypen für die Dialoge, die einen Kontakt gemeinsam mit einem Zugang dafür anlegen.
