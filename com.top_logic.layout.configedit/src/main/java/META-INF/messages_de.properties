com.top_logic.layout.configedit.ConfigControlService.ProviderMapping.type.tooltip = Der Java-Typ des Eigenschaftswerts, für den diese Zuordnung gilt.
com.top_logic.layout.configedit.ConfigControlService.tooltip = Dienst, der die Eingabekontrolle für eine Konfigurationseigenschaft auflöst. <p> Löst eine Eigenschaft auf, deren Wert sich in eine einzige Kontrolle einbringen lässt: direkt nach ihrem Java-Typ, durch Auswahl aus einer festen Optionsmenge, oder als Text über einen Wertanbieter, der den Wert in Text umwandeln kann und zurück. createModel und createControl weisen jede Eigenschaft zurück, auf die nichts davon zutrifft - welche Eigenschaftsarten das genau ausschließt und warum, steht in der eigenen Dokumentation von checkSupportedKind. Eine solche Eigenschaft (eine Struktur, eine Sammlung, oder eine komplexe Eigenschaft mit nur einer Wertbindung und ohne Format) wird durch einen eigenen verschachtelten Editor oder Typauswähler dargestellt, bevor dieser Dienst überhaupt gefragt wird. </p> <p> createModel entscheidet über den Wertbereich: Eine Eigenschaft, die nicht spezialisiert ist und deren Java-Typ eine der eingebauten Kontrollen direkt unterstützt - String, boolean, ein numerischer Typ oder Date - erhält das einfache, typisierte Konfigurationsfeldmodell; andernfalls erhält eine durch Auswahl bearbeitete Eigenschaft (eine Optionsliste oder ein Enum) ein Konfigurationsauswahlfeldmodell; alles andere mit einem Wertanbieter erhält das formatbewusste Konfigurationsformatfeldmodell (Text). </p> <p> createControl löst dann die Kontrolle auf: </p> <ol> <li>@Encrypted gewinnt immer, bewusst vor jedem anderen Schritt - siehe unten.</li> <li>Die Konfigurationskontrolle-Annotation an der Eigenschaft oder an ihrem Werttyp.</li> <li>Ein Konfigurationsauswahlfeldmodell erhält eine Auswahl.</li> <li>Die in diesem Dienst konfigurierte Zuordnung von Werttyp zu Anbieter.</li> <li>Der eingebaute Rückfall: die direkte Kontrolle für eine nicht spezialisierte Eigenschaft, deren Typ createModel ebenfalls als direkt bearbeitbar einstuft, andernfalls Text, geparst und formatiert über den eigenen ConfigurationValueProvider der Eigenschaft.</li> </ol> <p> @Encrypted läuft vor der Konfigurationskontrolle-Annotation, nicht nur vor den eingebauten Schritten: Ein Modul darf die Kontrolle für eine Eigenschaft überschreiben, aber es darf niemals in der Lage sein, ein Geheimnis lesbar zu machen, indem es eine Kontrolle wählt, die es im Klartext anzeigt. Dies ist eine bewusste Sicherheitsentscheidung aus eigenem Recht, unabhängig vom unten beschriebenen Spezialisierungs-Veto. </p> <p> Das Spezialisierungs-Veto ist der Grund, warum eine Eigenschaft mit eigenem Format nie an die "direkte" Kontrolle für ihren Java-Typ übergeben wird: ein als Tageszeit formatiertes Date wird über dieses Format als Text bearbeitet, nicht in einem Datumswähler, der eine Zeit weder anzeigen noch entgegennehmen könnte - derselbe Fehler, der bei DatePickerControlProvider auf Seiten der Modellattribute behoben wurde. </p> <p> Die konfigurierte Zuordnung ist es, die einem Modul oberhalb dieses Moduls erlaubt, eine Kontrolle beizutragen - der TL-Script-Editor etwa liegt in tl-model-search-react. </p>
