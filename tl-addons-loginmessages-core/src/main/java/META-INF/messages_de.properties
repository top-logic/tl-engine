class.com.top_logic.addons.loginmessages.script.I18NConstants.CONFIRMED_LOGIN_MESSAGES__USER = Login-Meldungen von „{0}“ bestätigt.
com.top_logic.addons.loginmessages.script.LoginMessagesFunctions.confirm = Login-Meldungen bestätigen
com.top_logic.addons.loginmessages.script.LoginMessagesFunctions.confirm.param.display.tooltip = Die dem Konto angezeigten Meldungen, das Ergebnis von <code>loginMessagesDisplay($account)</code>.
com.top_logic.addons.loginmessages.script.LoginMessagesFunctions.confirm.tooltip = Hält fest, dass das Konto der angegebenen Anzeige die darin angezeigten Login-Meldungen jetzt bestätigt hat. <p> Eine bestätigte Meldung wird erst wieder angezeigt, wenn ihre Bestätigung abgelaufen ist. </p>
com.top_logic.addons.loginmessages.script.LoginMessagesFunctions.display = Anzeige der fälligen Login-Meldungen
com.top_logic.addons.loginmessages.script.LoginMessagesFunctions.display.param.account.tooltip = Das Konto, das sich anmeldet.
com.top_logic.addons.loginmessages.script.LoginMessagesFunctions.display.return = Die Anzeige der für das Konto fälligen Meldungen; leer, wenn keine fällig ist.
com.top_logic.addons.loginmessages.script.LoginMessagesFunctions.display.tooltip = Die für das angegebene Konto fälligen Login-Meldungen, wie die Anmeldung sie zeigt. <p> Das Ergebnis wird als HTML angezeigt, z. B. mit <code>&lt;html input="..."/&gt;</code>: der Text jeder fälligen Meldung in der aktuellen Sprache mit ihren Bildern (als <code>data:</code>-URIs) oder ihr Name, wenn sie keinen Text hat, untereinander. Das Ergebnis hält auch fest, welche Meldungen gezeigt wurden: <code>loginMessagesConfirm($display)</code> bestätigt genau diese, für das angegebene Konto. </p> <p> Das Ergebnis ist kein Modellobjekt, daher erhält es auch ein Skript einer noch nicht abgeschlossenen Anmeldung, das für den anonymen Benutzer läuft, der die Login-Meldungen nicht lesen darf. </p>
com.top_logic.addons.loginmessages.script.LoginMessagesFunctions.due = Fällige Login-Meldungen
com.top_logic.addons.loginmessages.script.LoginMessagesFunctions.due.param.account.tooltip = Das Konto, das sich anmeldet.
com.top_logic.addons.loginmessages.script.LoginMessagesFunctions.due.return = Die anzuzeigenden Meldungen, absteigend nach Namen sortiert.
com.top_logic.addons.loginmessages.script.LoginMessagesFunctions.due.tooltip = Die Login-Meldungen, die dem angegebenen Konto bei seiner Anmeldung angezeigt werden. <p> Eine Meldung wird angezeigt, wenn sie aktiv ist, das heutige Datum zwischen ihrem Start- und Enddatum liegt und das Konto sie noch nicht bestätigt hat oder seine Bestätigung abgelaufen ist. Eine Ansicht zeigt sie mit <code>loginMessagesDisplay($account)</code> an und hält ihre Bestätigung mit <code>loginMessagesConfirm($display)</code> fest. </p> <p> Die Meldungen sind Modellobjekte: Ein Skript, das für einen Benutzer läuft, der sie nicht lesen darf - den anonymen Benutzer einer noch nicht abgeschlossenen Anmeldung -, erhält sie nicht, siehe <i>Anzeige der fälligen Login-Meldungen</i>. </p>
