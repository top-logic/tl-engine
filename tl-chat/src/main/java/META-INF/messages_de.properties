com.top_logic.ai.chat.view.ChatConversationElement$Mention.tooltip = Deklarative Bindung, mit der @ jedes beliebige Modellobjekt erwähnen kann. <p> Die Bindung erfolgt über TL-Script auf dieselbe Weise wie bei „ <data-list> “: „rows“ berechnet die Objekte, die @ anbieten kann; „label“ und „text“ berechnen, was angezeigt wird und welchen zitierten Text die Erwähnung in die Nachricht einfügt. Jede Erwähnung enthält die stabile ID des Objekts, sodass ein Host-Tool diese ID auflösen kann (das Framework enthält kein solches Tool). Vorschläge werden an den Browser übermittelt und dort während der Eingabe des Benutzers gefiltert; halten Sie die Auswahl daher mithilfe von „rows“ und „limit“ überschaubar. </p>
