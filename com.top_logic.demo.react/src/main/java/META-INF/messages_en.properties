class.com.top_logic.demo.react.temperature.I18NConstants.ERROR_BELOW_ABSOLUTE_ZERO__VALUE = "{0}" is below absolute zero.
class.com.top_logic.demo.react.temperature.I18NConstants.ERROR_INVALID_TEMPERATURE__VALUE = "{0}" is no temperature. Enter a number, optionally followed by a unit: °C, °F or K.
com.top_logic.demo.react.channel.DemoTickerSource = Demo ticker source
com.top_logic.demo.react.channel.DemoTickerSource.Config.period = Period
com.top_logic.demo.react.channel.DemoTickerSource.Config.period.tooltip = The time in milliseconds between two telegrams.
com.top_logic.demo.react.channel.DemoTickerSource.tooltip = Demo of a <i>channel source</i>: a simulated server-side feed of temperature telegrams. <p> Each displayed view instance subscribing to it gets a feed of its own, which receives one telegram per period and publishes the state of the feed: the number of telegrams received since the subscription, the time of the last one, and the texts of the last few telegrams. The state before the first telegram is published right on subscription. </p> <pre> &lt;source-channel name="ticker" update-interval="250"&gt; &lt;source class="com.top_logic.demo.react.channel.DemoTickerSource" period="100"/&gt; &lt;/source-channel&gt; </pre>
com.top_logic.demo.react.model.tickets.HeadlineStorage = Headline storage
com.top_logic.demo.react.model.tickets.HeadlineStorage.tooltip = Derived headline of a <i>ticket</i>: its name followed by the label of its status in parentheses. <p> The status label is itself a derived attribute computed by a script. A form computes the headline of the ticket it edits in a <i>tracing scope</i>: the storage receives the ticket itself, its reads are reported as dependencies of the headline field and answered from the values entered in the form. Selecting another status therefore changes the status label and, through it, the headline before anything is saved. </p>
com.top_logic.demo.react.script.TicketFunctions.isClosed = Is closed
com.top_logic.demo.react.script.TicketFunctions.isClosed.param.ticket.tooltip = The ticket to check.
com.top_logic.demo.react.script.TicketFunctions.isClosed.return = Whether the status of the ticket is the closed one.
com.top_logic.demo.react.script.TicketFunctions.isClosed.tooltip = Whether the given ticket is closed. <p> The status of the ticket is read without an access check. </p>
com.top_logic.demo.react.temperature.TemperatureControlProvider = Temperature input
com.top_logic.demo.react.temperature.TemperatureControlProvider.tooltip = <i>React field control provider</i> creating a <i>temperature input control</i>. <p> Set as input control of the type <code>demo.temperature:Temperature</code>, so that every attribute of that type is entered through it: </p> <pre> &lt;input-control&gt; &lt;impl class="com.top_logic.demo.react.temperature.TemperatureControlProvider"/&gt; &lt;/input-control&gt; </pre>
com.top_logic.demo.react.temperature.TemperatureMapping = Temperature mapping
com.top_logic.demo.react.temperature.TemperatureMapping.tooltip = <i>Storage mapping</i> of the model type <code>demo.temperature:Temperature</code>, storing a <i>temperature</i> as a number of degrees Celsius. <p> The mapping knows no context: a value it reads from the database is displayed in degrees Celsius. The unit of the object the value belongs to is attached by <i>temperature storage</i>. </p> <p> Besides a <i>temperature</i>, a plain <i>number</i> is accepted as value and taken as degrees Celsius, so that a script or an import may set a temperature without knowing the value class. </p>
com.top_logic.demo.react.temperature.TemperatureStorage = Temperature storage
com.top_logic.demo.react.temperature.TemperatureStorage.tooltip = Storage of an attribute of type <code>demo.temperature:Temperature</code> that attaches the unit of the owning object to the value it reads. <p> The value is stored like any other primitive value, by the <i>temperature mapping</i> of the type. Reading it, the storage determines the unit of the object and hands out the <i>temperature</i> displayed in that unit. The unit is computed by the function of the <i>temperature unit annotation</i> of the attribute. </p> <p> The storage is chosen for every attribute of the type by the storage annotation of the type itself: </p> <pre> &lt;datatype name="Temperature" db_type="double" kind="Custom"&gt; &lt;annotations&gt; &lt;storage-algorithm&gt; &lt;temperature-storage/&gt; &lt;/storage-algorithm&gt; &lt;/annotations&gt; &lt;temperature-mapping/&gt; &lt;/datatype&gt; </pre>
com.top_logic.demo.react.temperature.TemperatureUnit = Temperature unit
com.top_logic.demo.react.temperature.TemperatureUnit.CELSIUS = Celsius
com.top_logic.demo.react.temperature.TemperatureUnit.CELSIUS.tooltip = Degrees Celsius, the unit a <i>temperature</i> is stored in.
com.top_logic.demo.react.temperature.TemperatureUnit.FAHRENHEIT = Fahrenheit
com.top_logic.demo.react.temperature.TemperatureUnit.FAHRENHEIT.tooltip = Degrees Fahrenheit.
com.top_logic.demo.react.temperature.TemperatureUnit.KELVIN = Kelvin
com.top_logic.demo.react.temperature.TemperatureUnit.KELVIN.tooltip = Kelvin.
com.top_logic.demo.react.temperature.TemperatureUnit.tooltip = A unit in which a <i>temperature</i> is displayed and entered. <p> The constants are named like the classifiers of the model enumeration <code>demo.temperature:TemperatureUnit</code>. </p>
com.top_logic.demo.react.temperature.TemperatureUnitAnnotation = Temperature unit annotation
com.top_logic.demo.react.temperature.TemperatureUnitAnnotation.tooltip = Annotation of an attribute of type <code>demo.temperature:Temperature</code> telling in which unit its value is displayed and entered. <pre> &lt;temperature-unit unit="s -&gt; $s.container().get(`demo.temperature:DemoSite#temperatureUnit`)"/&gt; </pre> <p> An attribute without this annotation displays its value in degrees Celsius. </p>
com.top_logic.demo.react.temperature.TemperatureUnitAnnotation.unit = Unit
com.top_logic.demo.react.temperature.TemperatureUnitAnnotation.unit.tooltip = Function computing the unit from the object owning the attribute. <p> The function receives the object and returns a classifier of the enumeration <code>demo.temperature:TemperatureUnit</code>. If it returns nothing, the value is displayed in degrees Celsius. The function is evaluated without access checks: the unit is part of the display, not of the data the user reads. </p>
com.top_logic.demo.react.view.DemoEditorConfig = Demo editor configuration
com.top_logic.demo.react.view.DemoEditorConfig$Address = Address
com.top_logic.demo.react.view.DemoEditorConfig$Address.tooltip = A postal address.
com.top_logic.demo.react.view.DemoEditorConfig$Item = Item
com.top_logic.demo.react.view.DemoEditorConfig$Item.tooltip = A named item with a quantity.
com.top_logic.demo.react.view.DemoEditorConfig$Priority = Priority
com.top_logic.demo.react.view.DemoEditorConfig$Priority.tooltip = Priority classifier for <i>Priority</i> (<i>demo editor configuration</i>).
com.top_logic.demo.react.view.DemoEditorConfig.Address.city = City
com.top_logic.demo.react.view.DemoEditorConfig.Address.city.tooltip = The city.
com.top_logic.demo.react.view.DemoEditorConfig.Address.street = Street
com.top_logic.demo.react.view.DemoEditorConfig.Address.street.tooltip = The street including house number.
com.top_logic.demo.react.view.DemoEditorConfig.Item.name = Name
com.top_logic.demo.react.view.DemoEditorConfig.Item.name.tooltip = The item name.
com.top_logic.demo.react.view.DemoEditorConfig.Item.quantity = Quantity
com.top_logic.demo.react.view.DemoEditorConfig.Item.quantity.tooltip = The item quantity.
com.top_logic.demo.react.view.DemoEditorConfig.Priority.HIGH = High
com.top_logic.demo.react.view.DemoEditorConfig.Priority.HIGH.tooltip = Highest priority.
com.top_logic.demo.react.view.DemoEditorConfig.Priority.LOW = Low
com.top_logic.demo.react.view.DemoEditorConfig.Priority.LOW.tooltip = Lowest priority.
com.top_logic.demo.react.view.DemoEditorConfig.Priority.MEDIUM = Medium
com.top_logic.demo.react.view.DemoEditorConfig.Priority.MEDIUM.tooltip = Default priority.
com.top_logic.demo.react.view.DemoEditorConfig.address = Address
com.top_logic.demo.react.view.DemoEditorConfig.address.tooltip = A nested address rendered as a monomorphic item in a group of its own.
com.top_logic.demo.react.view.DemoEditorConfig.billingAddress = Billing address
com.top_logic.demo.react.view.DemoEditorConfig.billingAddress.tooltip = The address to send invoices to. <p> The <i>inline</i> annotation displays the street and city of this address as fields of the form itself, unlike the group of <i>Address</i>. </p>
com.top_logic.demo.react.view.DemoEditorConfig.catalog = Catalog
com.top_logic.demo.react.view.DemoEditorConfig.catalog.tooltip = The items on offer, indexed by name, a <i>map</i> rather than the <i>list</i> of <i>Items</i>.
com.top_logic.demo.react.view.DemoEditorConfig.content = Content
com.top_logic.demo.react.view.DemoEditorConfig.content.tooltip = Formatted content written as HTML. <p> The <i>HTML</i> annotation makes the property a WYSIWYG editor while the form is edited, and displays the formatted text while it is not. </p>
com.top_logic.demo.react.view.DemoEditorConfig.count = Count
com.top_logic.demo.react.view.DemoEditorConfig.count.tooltip = A bounded item count. <p> A count of zero or less is questioned but not refused: the <i>positive</i> constraint is declared as a warning, so the demo has a warning to show next to the violation of <i>Owner</i>. </p>
com.top_logic.demo.react.view.DemoEditorConfig.description = Description
com.top_logic.demo.react.view.DemoEditorConfig.description.tooltip = A longer free-text description spanning several lines. <p> The <i>multiple line</i> annotation makes the property a text area rather than the single-line input of <i>Title</i>. </p>
com.top_logic.demo.react.view.DemoEditorConfig.dueDate = Due date
com.top_logic.demo.react.view.DemoEditorConfig.dueDate.tooltip = The point in time by which the configuration must be in effect, a date together with its time of day.
com.top_logic.demo.react.view.DemoEditorConfig.enabled = Enabled
com.top_logic.demo.react.view.DemoEditorConfig.enabled.tooltip = Whether the configuration is active.
com.top_logic.demo.react.view.DemoEditorConfig.icon = Icon
com.top_logic.demo.react.view.DemoEditorConfig.icon.tooltip = The icon standing for this configuration - picked from the theme's icons, the way an icon model attribute is, rather than typed as its encoded form.
com.top_logic.demo.react.view.DemoEditorConfig.items = Items
com.top_logic.demo.react.view.DemoEditorConfig.items.tooltip = A list of named items with quantities.
com.top_logic.demo.react.view.DemoEditorConfig.notes = Notes
com.top_logic.demo.react.view.DemoEditorConfig.notes.tooltip = Notes written in <i>CommonMark</i> syntax. <p> The <i>common mark</i> annotation makes the property a text area while the form is edited, and displays the formatted text while it is not. </p>
com.top_logic.demo.react.view.DemoEditorConfig.owner = Owner
com.top_logic.demo.react.view.DemoEditorConfig.owner.tooltip = Who is responsible - mandatory, so applying an empty one is refused and the demo has a violation to show.
com.top_logic.demo.react.view.DemoEditorConfig.priority = Priority
com.top_logic.demo.react.view.DemoEditorConfig.priority.tooltip = The selected priority.
com.top_logic.demo.react.view.DemoEditorConfig.settings = Settings
com.top_logic.demo.react.view.DemoEditorConfig.settings.tooltip = Settings written as a <i>JSON</i> object. <p> The <i>code</i> annotation makes the property a code editor for <i>JSON</i>. </p>
com.top_logic.demo.react.view.DemoEditorConfig.shippingAddresses = Shipping addresses
com.top_logic.demo.react.view.DemoEditorConfig.shippingAddresses.tooltip = The addresses to ship to, an array of <i>address</i> rather than a <i>list</i>.
com.top_logic.demo.react.view.DemoEditorConfig.sourceContent = Source content
com.top_logic.demo.react.view.DemoEditorConfig.sourceContent.tooltip = Formatted content whose HTML source can be edited as well. <p> The <code>macro</code> feature set of the <i>HTML</i> annotation adds a button to the WYSIWYG editor switching to the HTML source. </p>
com.top_logic.demo.react.view.DemoEditorConfig.summary = Summary
com.top_logic.demo.react.view.DemoEditorConfig.summary.tooltip = A localized one-line summary, edited as text through the <i>resource key</i> format.
com.top_logic.demo.react.view.DemoEditorConfig.tags = Tags
com.top_logic.demo.react.view.DemoEditorConfig.tags.tooltip = Keywords describing this configuration, written as a single comma separated text. <p> A <i>list</i> of plain values with a <i>format</i> of its own is not a collection of entries to be edited one by one - the format turns the whole list into one text and back, so it is a single input, not the collection editor <i>Items</i> gets. That is what <i>comma separated strings</i> does here: the property is edited as "red, green, blue". </p>
com.top_logic.demo.react.view.DemoEditorConfig.timeout = Timeout
com.top_logic.demo.react.view.DemoEditorConfig.timeout.tooltip = How long to wait before giving up, written as a duration such as "5h 10min" or "22ms". <p> The value is a plain millisecond count; <i>millisecond format</i> is what turns it into something readable and back. Unlike every other format in this configuration, this one can <em>reject</em> what is typed - an unknown unit or a text that is no duration at all - which is what makes it the demo's example of a format error being reported at the field. </p>
com.top_logic.demo.react.view.DemoEditorConfig.title = Title
com.top_logic.demo.react.view.DemoEditorConfig.title.tooltip = A free-text title.
com.top_logic.demo.react.view.DemoEditorConfig.tooltip = Self-contained sample configuration edited by the config-editor demo. <p> Exercises a spread of property kinds (text, multi-line text, <i>common mark</i> text, JSON source code, HTML text, number, boolean, enumeration, a date with its time of day, a nested item, a nested item displayed without a group, a list of items, an array of items, a map of items, a list of plain strings written as one comma separated text, a duration, and a <i>resource key</i>) so the React configuration editor renders each editor variant. </p>
