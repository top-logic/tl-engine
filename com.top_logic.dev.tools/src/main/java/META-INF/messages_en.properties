com.top_logic.dev.tools.model.ModelEditAction = Model edit action
com.top_logic.dev.tools.model.ModelEditAction$Mode = Mode
com.top_logic.dev.tools.model.ModelEditAction$Mode.tooltip = The model mutation a <i>model edit action</i> performs.
com.top_logic.dev.tools.model.ModelEditAction.Config.container = Container
com.top_logic.dev.tools.model.ModelEditAction.Config.container.tooltip = Name of the channel holding the container the new element is created in: the target module for <i>create type</i>, the owner type (or one of its parts) for <i>create attribute</i>, the enumeration for <i>create classifier</i>, the specialized class for <i>add generalization</i> and <i>remove generalization</i>. Unused by <i>create module</i> and <i>delete</i>.
com.top_logic.dev.tools.model.ModelEditAction.Config.mode = Mode
com.top_logic.dev.tools.model.ModelEditAction.Config.mode.tooltip = The model mutation to perform.
com.top_logic.dev.tools.model.ModelEditAction.Mode.ADD_GENERALIZATION = Add generalization
com.top_logic.dev.tools.model.ModelEditAction.Mode.ADD_GENERALIZATION.tooltip = Add the class selected in the input as generalization of the container class.
com.top_logic.dev.tools.model.ModelEditAction.Mode.CREATE_ATTRIBUTE = Create attribute
com.top_logic.dev.tools.model.ModelEditAction.Mode.CREATE_ATTRIBUTE.tooltip = Add a new property described by the input to the container type.
com.top_logic.dev.tools.model.ModelEditAction.Mode.CREATE_CLASSIFIER = Create classifier
com.top_logic.dev.tools.model.ModelEditAction.Mode.CREATE_CLASSIFIER.tooltip = Add a new classifier named by the input to the container enumeration.
com.top_logic.dev.tools.model.ModelEditAction.Mode.CREATE_MODULE = Create module
com.top_logic.dev.tools.model.ModelEditAction.Mode.CREATE_MODULE.tooltip = Create a new module named by the input.
com.top_logic.dev.tools.model.ModelEditAction.Mode.CREATE_TYPE = Create type
com.top_logic.dev.tools.model.ModelEditAction.Mode.CREATE_TYPE.tooltip = Create a new class or enumeration named by the input in the container module.
com.top_logic.dev.tools.model.ModelEditAction.Mode.DELETE = Delete
com.top_logic.dev.tools.model.ModelEditAction.Mode.DELETE.tooltip = Delete the model part passed as the action input, or remove the generalization link a tl.devtools:Generalization input stands for.
com.top_logic.dev.tools.model.ModelEditAction.Mode.REMOVE_GENERALIZATION = Remove generalization
com.top_logic.dev.tools.model.ModelEditAction.Mode.REMOVE_GENERALIZATION.tooltip = Remove the class passed as the action input from the generalizations of the container class.
com.top_logic.dev.tools.model.ModelEditAction.tooltip = <i>View action</i> that mutates the application model from the model editor: creates a module, type (class or enumeration) or attribute, adds or removes a generalization of a class, or deletes a model part or generalization link. <p> The mutating operations create their result through the <i>model util</i> primitives and return the newly created part to its follow-up actions, so it can be written to the editor's selection channel. The created element's name (and, for an attribute, its value type and cardinality) come from the transient object the action processes (the result of an enclosing <store-form-state> in the dialog form); the container to create the element in comes from the configured container channel. All operations must run inside a transaction (wrap the action in <with-transaction>). </p>
