class.com.top_logic.layout.view.agent.I18NConstants.ACCESS_TOKEN_ISSUED__LABEL_ACCOUNT = Zugriffstoken „{0}“ für {1} ausgestellt.
class.com.top_logic.layout.view.agent.I18NConstants.ACCESS_TOKEN_USED__LABEL_ACCOUNT = Zugriffstoken „{0}“ von {1} verwendet.
class.com.top_logic.layout.view.agent.I18NConstants.ACCESS_TOKEN_WITHDRAWN__LABEL_ACCOUNT = Zugriffstoken „{0}“ von {1} zurückgezogen.
class.com.top_logic.layout.view.agent.I18NConstants.ERROR_ACCESS_TOKEN_NO_ACCOUNT = Ein Zugriffstoken kann nur für ein angemeldetes Konto ausgestellt werden.
class.com.top_logic.layout.view.agent.I18NConstants.ERROR_ACCESS_TOKEN_NO_INPUT = Es liegt keine Anfrage zur Ausstellung eines Zugriffstokens vor.
class.com.top_logic.layout.view.agent.I18NConstants.ERROR_ACCESS_TOKEN_NO_LABEL = Bitte geben Sie dem Zugriffstoken einen Namen, damit Sie es beim Zurückziehen wiedererkennen können.
class.com.top_logic.layout.view.agent.I18NConstants.ERROR_ACCESS_TOKEN_NO_TOKEN = Es ist kein Zugriffstoken zum Zurückziehen vorhanden.
class.com.top_logic.layout.view.agent.I18NConstants.ERROR_ACCESS_TOKEN_NO_VALIDITY = Bitte geben Sie an, wie lange das Zugriffstoken gültig bleibt.
com.top_logic.layout.view.agent.AccessTokenAuthenticator = Authentifizierer für Zugriffstoken
com.top_logic.layout.view.agent.AccessTokenAuthenticator.tooltip = Gewährt einem Agenten Zutritt, der ein von seinem Besitzer ausgestelltes Zugriffstoken vorlegt. <p> Das vorgelegte Geheimnis wird mit dem gespeicherten Hash abgeglichen; ein widerrufenes oder abgelaufenes Zugriffstoken gewährt niemandem Zutritt. Jeder Zutritt wird am Zugriffstoken protokolliert, sodass dessen Besitzer sehen kann, dass ein Agent es verwendet. </p>
com.top_logic.layout.view.agent.AgentAccess = Agentenzugriff
com.top_logic.layout.view.agent.AgentAccess.Config.authenticators = Authentifikatoren
com.top_logic.layout.view.agent.AgentAccess.Config.authenticators.tooltip = Die Authentifikatoren, die die Anmeldedaten von Aufrufern außerhalb des Browsers erkennen, in der Reihenfolge, in der sie befragt werden.
com.top_logic.layout.view.agent.AgentAccess.tooltip = Zugriff von Aufrufern außerhalb des Browsers auf das <i>Agent-Servlet</i>. <p> Ein Browser erreicht den Endpunkt mit seinem Sitzungs-Cookie. Ein Agent außerhalb des Browsers übermittelt stattdessen im „Authorization“-Header eine Berechtigungsangabe, die von den registrierten <i>Agenten-Authentifizierern</i> dem Konto zugeordnet wird, für das er auftritt. </p> <p> Ein Anmeldenachweis benennt zudem die Sitzung, in der der Agent arbeitet: Der Benutzer stellt ihn aus einer laufenden Sitzung heraus aus und ermöglicht es dem Agenten damit, die Fenster dieser Sitzung zu steuern. Die Sitzung wird hier unter einem Schlüssel registriert, den der Anmeldenachweis enthält, und die Registrierung endet mit der Sitzung – ein Agent kann die Sitzung, zu der er zugelassen wurde, nicht überdauern. </p> <p> Ist kein Authentifikator registriert, erreichen nur Browser den Endpunkt. </p>
com.top_logic.layout.view.agent.IssueAccessTokenAction = Aktion „Zugriffstoken ausstellen“
com.top_logic.layout.view.agent.IssueAccessTokenAction.tooltip = <i>View-Aktion</i>, die anhand der als Eingabe übergebenen Formularwerte ein Zugriffstoken für das aktuelle Konto ausstellt. <p> Die Eingabe ist ein tl.agent:NewAccessToken, das die Bezeichnung des Zugriffstokens, dessen Gültigkeitsdauer in Stunden und die Angabe enthält, ob der Agent handeln darf. Die Aktion gibt einen vorübergehenden Träger der Einladung zurück – die Adresse der Anwendung zusammen mit dem ausgestellten Zugriffstoken –, den die umgebende Kette an den Dialog übergibt, der ihn anzeigt; dies ist der einzige Moment, in dem das Zugriffstoken lesbar ist. Das Zugriffstoken gewährt dem Agenten Zugriff auf die Sitzung, aus der es ausgestellt wurde, die hier unter <i>„Agentenzugriff“</i> registriert ist. </p>
com.top_logic.layout.view.agent.RevokeAccessTokenAction = Aktion „Zugriffstoken zurückziehen“
com.top_logic.layout.view.agent.RevokeAccessTokenAction.tooltip = <i>View-Aktion</i>, die das als Eingabe übergebene Zugriffstoken zurückzieht: Das Zugriffstoken wird gelöscht, und ein Agent, der es vorlegt, erhält keinen Zutritt mehr. <p> Ein Konto zieht seine eigenen Zugriffstoken zurück; das Zurückziehen des Zugriffstokens eines anderen Kontos ist ein administrativer Vorgang und erfordert die Berechtigung, mit der die administrative Ansicht geschützt ist. </p>
