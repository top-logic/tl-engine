com.top_logic.tl.ai.core.limits.BudgetConfig = Budget
com.top_logic.tl.ai.core.limits.BudgetConfig$RoleBudget = Rollenbudget
com.top_logic.tl.ai.core.limits.BudgetConfig$RoleBudget.tooltip = Was die Inhaber einer bestimmten Funktion ausgeben dürfen. <p> Ein Eintrag nennt mindestens eine der beiden Zahlen. Ein Eintrag, der keine der beiden Zahlen nennt, sagt nichts über die Rolle aus, und der Dienst, der über das Budget verfügt, wird nicht damit gestartet. </p>
com.top_logic.tl.ai.core.limits.BudgetConfig.RoleBudget.money = Geld
com.top_logic.tl.ai.core.limits.BudgetConfig.RoleBudget.money.tooltip = Wie viel Geld die Inhaber dieser Rolle in diesem Zeitfenster ausgeben dürfen, in der Währung des Budgets. <p> 0 bedeutet „unbegrenzt“, genau wie beim <i>Geldbudget pro Konto</i>. Leer bedeutet, dass diese Rolle nichts über Geld festlegt. </p>
com.top_logic.tl.ai.core.limits.BudgetConfig.RoleBudget.name.tooltip = Der Name der Rolle, wie er im Sicherheitsstamm vermerkt ist.
com.top_logic.tl.ai.core.limits.BudgetConfig.RoleBudget.tokens = Token
com.top_logic.tl.ai.core.limits.BudgetConfig.RoleBudget.tokens.tooltip = Wie viele Token die Inhaber dieser Rolle in diesem Zeitfenster ausgeben dürfen. <p> 0 bedeutet „unbegrenzt“, genau wie beim <i>Token-Budget pro Konto</i> - so wird eine Rolle von einem Budget ausgenommen, das die Installation sonst hat. Leer bedeutet, dass diese Rolle nichts über Token festlegt. </p>
com.top_logic.tl.ai.core.limits.BudgetConfig.budget-window-hours = Budget-Zeitfenster (Stunden)
com.top_logic.tl.ai.core.limits.BudgetConfig.budget-window-hours.tooltip = Wie weit zurück <i>das Token-Budget pro Konto</i> und <i>das Geldbudget pro Konto</i> in Stunden zählen. <p> Ein gleitendes Zeitfenster, kein Kalendertag: Ein jetzt gestarteter Lauf wird an allem gemessen, was das Konto seit so vielen Stunden ausgegeben hat. 24 Stunden sind der Standardwert. </p>
com.top_logic.tl.ai.core.limits.BudgetConfig.money-budget = Geldbudget pro Konto
com.top_logic.tl.ai.core.limits.BudgetConfig.money-budget.tooltip = Wie viel Geld ein Konto innerhalb des Zeitfensters in der Systemwährung der Anwendung ausgeben darf (Euro, sofern in der Anwendung keine andere Währung festgelegt ist). <p> 0, der Standardwert, bedeutet unbegrenzt. Dies wird genau wie <i>das Token-Budget pro Konto</i> durchgesetzt – Ablehnung beim Start der Ausführung, Unterbrechung zwischen den Zügen – und beide gelten gemeinsam: Sobald einer der beiden Werte erreicht ist, wird das Konto gestoppt. </p> <p> Die Kosten eines Laufs werden pro Modellanfrage berechnet, und zwar als Produkt aus den Token und den Preisen des antwortenden Modells – Input, Output, Schlussfolgerung, Cache-Lesezugriff und Cache-Schreibzugriff haben jeweils ihren eigenen Preis – und werden im Lauf protokolliert. Die Preise stammen aus dem Modellkatalog; ein Modell, für das dort kein Preis angegeben ist – beispielsweise ein lokales Modell –, kostet nichts, es sei denn, in der Modellüberschreibung in den LLM-Anbietern ist ein Preis festgelegt. Wie beim Token-Budget muss hierfür die Laufprotokollierung aktiviert sein. </p> <p> Ein Lauf erfasst seine Kosten in US-Dollar, der Währung der Preise. Es wird zum Wechselkurs der Währung „USD“ am Tag des Laufstarts in die Systemwährung umgerechnet: ein datumsbezogener Kurs, der an diesem Tag gültig ist, andernfalls der Umrechnungsfaktor der Währung „USD“ unter „Administration &gt; Basisverwaltung &gt; Währungen“, sofern es sich nicht um den Wert 1 handelt, mit dem jede Währung angelegt wird. Solange kein Kurs für den heutigen Tag vorliegt, wird dieses Budget nicht durchgesetzt, was im Protokoll und im Agentenaktivitätsmonitor vermerkt wird; das Token-Budget gilt jedoch weiterhin. Eine Systemwährung, die US-Dollar ist, benötigt keinen Kurs. </p>
com.top_logic.tl.ai.core.limits.BudgetConfig.role-budgets = Budgets nach Rolle
com.top_logic.tl.ai.core.limits.BudgetConfig.role-budgets.tooltip = Budgets, die sich vom <i>Token-Budget pro Konto</i> und vom <i>Geldbudget pro Konto</i> für die Inhaber einer Rolle unterscheiden. <p> Ein Konto, das eine dieser Rollen hat, erhält das <em>größte</em> Budget unter ihnen, und ein Konto, das keine davon hat, erhält das <i>Token-Budget pro Konto</i>. Eine Rolle gewährt also Spielraum und nimmt nie welchen weg; nur so kann eine zusätzliche Rolle ein Konto nie schlechter stellen. Token und Geld werden getrennt entschieden: Eine Rolle, die nur einen der beiden Werte nennt, sagt nichts über den anderen. </p> <p> Bewusst so klein. Es ist eine Tabelle von Zahlen, kein Ort, um auszudrücken, wann ein Budget gilt; eine Regel, die mehr braucht als „wer bekommt wie viel“, gehört in die Rollen selbst. </p>
com.top_logic.tl.ai.core.limits.BudgetConfig.token-budget = Token-Budget pro Konto
com.top_logic.tl.ai.core.limits.BudgetConfig.token-budget.tooltip = Wie viele Token ein Konto innerhalb des Zeitfensters ausgeben darf. <p> 0 (Standardwert) bedeutet unbegrenzt. Ein Durchlauf eines Kontos, das diesen Wert bereits erreicht hat, wird vor dem Absenden der ersten Anfrage abgelehnt, und ein Durchlauf, der während der Ausführung die Obergrenze erreicht, wird zwischen den Durchläufen mit dem Stoppgrund BUDGET_EXHAUSTED unterbrochen, wobei die bisher gegebenen Antworten beibehalten werden. </p> <p> Die gezählte Menge umfasst alles, was der Anbieter lesen und schreiben sollte – die Eingabeaufforderung einschließlich ihres zwischengespeicherten Teils und die Ausgabe einschließlich der Begründung –, summiert über die aufgezeichneten Durchläufe des Kontos. Daher muss die Aufzeichnung der Durchläufe aktiviert sein; eine Installation, die nichts aufzeichnet, hat nichts zu zählen, und diese Begrenzung hat keine Auswirkung. </p> <p><b>Was es kostet.</b> Der Wert wird für jede gesendete Nachricht einmal aus den aufgezeichneten Läufen des Kontos ausgelesen, was einem Durchlauf durch die Ausführungszeilen dieses Kontos entspricht. Deshalb ist diese Funktion standardmäßig deaktiviert, sofern ein Administrator sie nicht anfordert. </p>
com.top_logic.tl.ai.core.limits.BudgetConfig.tooltip = Wie viele Token und wie viel Geld ein Konto in einem gleitenden Zeitfenster ausgeben darf. <p> Der Agent arbeitet gegen nutzungsabhängig abgerechnete Anbieter-APIs. Ist hier nichts konfiguriert, wird kein Lauf je angehalten, weil das Konto, für das er arbeitet, genug ausgegeben hat. <b>Das Budget ist aus, bis es konfiguriert wird</b>, aus dem Grund, den die <i>Kapazitätskonfiguration</i> für ihre Obergrenzen nennt. </p> <p> Das Budget zählt die Läufe <em>des Hauptbenutzers</em>. Ein delegierter Unteragent ist Teil des Laufs, der ihn delegiert hat, und verbraucht dessen Budget statt eines eigenen. </p>
com.top_logic.tl.ai.core.limits.CapacityConfig = Kapazität
com.top_logic.tl.ai.core.limits.CapacityConfig.chat-queue = Länge der Chat-Warteschlange
com.top_logic.tl.ai.core.limits.CapacityConfig.chat-queue.tooltip = Wie viele Chat-Läufe auf einen freien Worker-Thread warten dürfen, sobald <i>Chat-Worker-Threads</i> eine Obergrenze festgelegt hat. <p> Ohne diese Obergrenze sagt der Wert nichts aus: Eine Installation, die jeden Lauf sofort ausführt, lässt niemanden warten. </p> <p> Drei Lesarten: </p> <ul> <li>0, der Standardwert – <b>eine Warteschlange ohne feste Länge</b>. Eine Anfrage, die alle Worker-Threads belegt vorfindet, wartet auf einen freien, und ihre Antwort kommt verspätet. Das ist es, was jemand will, der eine Frage gestellt hat; die Aufforderung, noch einmal zu fragen, nicht. Was wartet, ist eine kleine Aufgabe pro Anfrage; ein Rückstau kostet den Server daher nur einen Bruchteil dessen, was das Ausführen dieser Läufe kosten würde.</li> <li>Eine positive Zahl – eine Warteschlange dieser Länge. Eine Anfrage, die auf eine volle Warteschlange trifft, wird mit einem Hinweis abgelehnt, auf den der Benutzer reagieren kann.</li> <li>-1 – <b>überhaupt keine Warteschlange</b>. Jede Anfrage, die alle Worker-Threads belegt vorfindet, wird sofort abgelehnt. Für eine Installation, die lieber „nicht jetzt“ sagt, als einen Benutzer auf eine Antwort warten zu lassen, deren Zeitpunkt vielleicht schon verstrichen ist.</li> </ul>
com.top_logic.tl.ai.core.limits.CapacityConfig.chat-workers = Chat-Worker-Threads
com.top_logic.tl.ai.core.limits.CapacityConfig.chat-workers.tooltip = Wie viele Chat-Läufe diese Installation gleichzeitig ausführt. <p> 0, der Standardwert, bedeutet <b>keine Obergrenze</b>: Jede Anfrage erhält einen eigenen Worker-Thread, so wie es diese Installation tat, bevor es diesen Abschnitt gab. Eine Anwendung mit tausend Benutzern ist mit einer Zahl, die dieses Produkt geraten hat, nicht gut bedient; der Standardwert lautet daher „so viele, wie ankommen“, und die Zahl bestimmt der Administrator. </p> <p> Eine positive Zahl ist die Obergrenze des Thread-Pools, auf dem die Hintergrundläufe des Chats ausgeführt werden. Ein Lauf-Thread wartet fast seine gesamte Lebensdauer auf einen Anbieter; die Obergrenze betrifft daher nicht die CPU, sondern wie viel Arbeitsspeicher, wie viele offene Unterhaltungen und wie viele Anbieterkosten die Installation gleichzeitig in Arbeit haben möchte. Eine Anfrage, die alle Worker-Threads belegt vorfindet, wartet auf einen freien, statt abgewiesen zu werden. </p> <p> Wird einmal gelesen, wenn der Pool zum ersten Mal verwendet wird. Eine Änderung erfordert einen Neustart. </p>
com.top_logic.tl.ai.core.limits.CapacityConfig.concurrent-runs-per-account = Parallele Läufe pro Konto
com.top_logic.tl.ai.core.limits.CapacityConfig.concurrent-runs-per-account.tooltip = Wie viele Läufe ein Konto gleichzeitig ausführen darf. <p> 0 (Standardeinstellung) deaktiviert die Begrenzung. Bei einer gemeinsam genutzten Installation, die viele Benutzer bedient, sollte hier ein kleiner Wert gewählt werden – 3 bis 5 ist ein sinnvoller Bereich –, damit nicht ein einzelnes Konto alle Worker des Pools beanspruchen oder die Rechnung des Anbieters im Alleingang in die Höhe treiben kann. </p> <p> Die Zählung erfolgt über <em>jeden</em> Einstiegspunkt – den Chat, den Scheduler, TL-Script –, da alle ihre Läufe an derselben Stelle starten. Ein delegierter Unteragent ist Teil des übergeordneten Laufs und wird nicht erneut gezählt. </p>
com.top_logic.tl.ai.core.limits.CapacityConfig.subagent-workers = Hintergrund-Subagenten gleichzeitig
com.top_logic.tl.ai.core.limits.CapacityConfig.subagent-workers.tooltip = Wie viele Hintergrund-Subagenten diese Installation gleichzeitig ausführt, über alle Chats hinweg. <p> 0, der Standardwert, bedeutet: keine Obergrenze für die Installation. Jeder Chat führt weiterhin höchstens wenige Subagenten gleichzeitig aus (vier) und stellt die übrigen in die Warteschlange; dies begrenzt alle zusammen, für eine Installation, in der viele Benutzer gleichzeitig Arbeit verteilen. </p> <p> Ein Subagent, der die Obergrenze erreicht vorfindet, <b>wartet</b> in der Warteschlange und startet, sobald ein anderer endet. Abgelehnt wird nichts, denn der Agent, der einen Subagenten gestartet hat, erwartet dessen Ergebnis. </p>
com.top_logic.tl.ai.core.limits.CapacityConfig.tooltip = Wie viele Agent-Instanzen werden bei dieser Installation gleichzeitig ausgeführt? <p> Der Agent läuft auf einem gemeinsam genutzten Anwendungsserver im Auftrag vieler Benutzer. Wenn hier keine Konfiguration vorgenommen wurde, erhält jeder Lauf einen Thread. <b>Alle Obergrenzen sind deaktiviert, bis sie konfiguriert werden</b>: Dieses Produkt wird in Anwendungen mit tausend Benutzern eingesetzt, und ein Wert, der pauschal für alle festgelegt würde, wäre für die meisten nicht geeignet. Wenn eine Obergrenze festgelegt ist, wartet ein Lauf, der diese erreicht, dort, wo Warten die bessere Lösung ist – siehe <i>Länge der Chat-Warteschlange</i> –, und wird abgelehnt, wo dies nicht der Fall ist. </p> <p> Die Obergrenze pro Konto zählt die Instanzen <em>des Hauptbenutzers</em>. Ein delegierter Unteragent ist Teil der Instanz, die ihn delegiert hat, und stellt keine eigene Instanz dar; er wird daher nicht auf diese Obergrenze angerechnet. </p>
com.top_logic.tl.ai.core.limits.RunLimitsConfig = Grenzen für Agentenläufe
com.top_logic.tl.ai.core.limits.RunLimitsConfig.tooltip = Der Abschnitt der Laufzeitgrenzen in der Form vor der Aufteilung der Agenten-Dienste: die Kapazität von AgentRuntimeService und das Budget von AgentPolicyService in einem Element. <p> Wird nur gelesen, wo eine alte Konfiguration erkannt werden muss, und ist das eine Element, das ein Test den Einstellungen der Laufzeitgrenzen anstelle beider Abschnitte übergibt. </p>
com.top_logic.tl.ai.core.mcp.HttpMcpTransport = HTTP-MCP-Transport
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.credentials = Zugangsdaten
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.credentials.tooltip = Wie die Anfragen an den MCP-Server authentifiziert werden. <p> Z. B. mit einem Bearer-Token aus einer Umgebungsvariablen oder einer Datei oder mit einem Zugriffstoken eines OAuth2-Autorisierungsservers. Ist nichts angegeben, werden die Anfragen ohne Zugangsdaten gesendet. </p>
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.headers = Header
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.headers.tooltip = Statische HTTP-Header, die mit jeder Anfrage gesendet werden. <p> Jeder Eintrag besteht aus einem Header-Namen und dem darunter zu sendenden Wert, z. B. einem Routing-Header, den der Server zusätzlich zu den Zugangsdaten erwartet. </p>
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.url = URL
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.url.tooltip = Die URL des MCP-Server-Endpunkts (z. B. "https://mcp.example.com/mcp").
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.tooltip = <i>MCP-Transportkonfiguration</i>, die einen MCP-HTTP-Transport (Streamable HTTP) erstellt. <p> Der MCP-Server läuft als externer HTTP-Dienst. Jede Anfrage wird zum Zeitpunkt ihres Versands mit den konfigurierten Zugangsdaten authentifiziert, z. B. mit einem Bearer-Token aus einer Umgebungsvariablen: </p><pre> &lt;transport class="com.top_logic.tl.ai.core.mcp.HttpMcpTransport" url="https://mcp.example.com/mcp"&gt; &lt;credentials class="com.top_logic.basic.credential.HeaderCredentials" scheme="Bearer"&gt; &lt;secret name="MY_MCP_TOKEN"/&gt; &lt;/credentials&gt; &lt;/transport&gt; </pre> <p> Lehnt der Server die Zugangsdaten ab (HTTP 401), werden sie verworfen und die Anfrage wird einmal mit frischen Zugangsdaten wiederholt. </p>
com.top_logic.tl.ai.core.mcp.McpServerRegistry = Mcp-Server-Register
com.top_logic.tl.ai.core.mcp.McpServerRegistry$McpServerConfig = Mcp-Server-Konfiguration
com.top_logic.tl.ai.core.mcp.McpServerRegistry$McpServerConfig.tooltip = Konfiguration für einen einzelnen MCP-Server.
com.top_logic.tl.ai.core.mcp.McpServerRegistry.Config.servers = Server
com.top_logic.tl.ai.core.mcp.McpServerRegistry.Config.servers.tooltip = Karte der benannten MCP-Serverkonfigurationen.
com.top_logic.tl.ai.core.mcp.McpServerRegistry.McpServerConfig.tool-timeout-seconds = Tool-Timeout Sekunden
com.top_logic.tl.ai.core.mcp.McpServerRegistry.McpServerConfig.tool-timeout-seconds.tooltip = Timeout in Sekunden für einzelne Tool-Aufrufe.
com.top_logic.tl.ai.core.mcp.McpServerRegistry.McpServerConfig.transport = Transport
com.top_logic.tl.ai.core.mcp.McpServerRegistry.McpServerConfig.transport.tooltip = Transportkonfiguration (stdio oder HTTP).
com.top_logic.tl.ai.core.mcp.McpServerRegistry.tooltip = Dienst, der Verbindungen zu externen MCP-Servern verwaltet. <p> Wird über XML mit benannten MCP-Server-Einträgen konfiguriert. Jeder Server wird beim Start verbunden, und seine Tools werden über den Aufruf MCP tools/list ermittelt. Agenten referenzieren Server namentlich über ihr mcpServers-Attribut; die <i>Agentenfabrik</i> zieht die Tools des Servers in den <i>Tool-Katalog</i> des Agenten. </p>
com.top_logic.tl.ai.core.mcp.NamedValueConfig = Konfiguration von benannten Werten
com.top_logic.tl.ai.core.mcp.NamedValueConfig.tooltip = Ein benannter String-Wert zur Verwendung in Konfigurations-Maps. <p> Wird für die Umgebungsvariablen und HTTP-Header eines MCP-Transports verwendet: Ein Eintrag enthält den zu setzenden Namen und den Wert, auf den er gesetzt wird. </p>
com.top_logic.tl.ai.core.mcp.NamedValueConfig.value = Wert
com.top_logic.tl.ai.core.mcp.NamedValueConfig.value.tooltip = Der Wert.
com.top_logic.tl.ai.core.mcp.StdioMcpTransport = Stdio-MCP-Transport
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.args = Argumente
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.args.tooltip = Befehlszeilenargumente, die an den Befehl übergeben werden. <p> In der XML-Konfiguration als kommagetrennte Werte angeben: args="-y,@modelcontextprotocol/server-github" </p>
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.command = Befehl
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.command.tooltip = Der auszuführende Befehl (z. B. "npx" oder "python").
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.env = Env
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.env.tooltip = Umgebungsvariablen für den Unterprozess. <p> Verwenden Sie diese Option, um API-Schlüssel zu übergeben, ohne sie in die Konfiguration einzutragen: Ein Eintragswert von ${env:GITHUB_TOKEN} wird aus der Umgebung des Servers übernommen. </p>
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.tooltip = <i>Mcp-Transportkonfiguration</i>, die einen MCP-Stdio-Transport (Unterprozess) erzeugt. <p> Der MCP-Server wird als Kindprozess gestartet. Die Kommunikation erfolgt über stdin/stdout unter Verwendung von JSON-RPC. Umgebungsvariablen können verwendet werden, um API-Schlüssel oder andere Geheimnisse zu übergeben. </p>
com.top_logic.tl.ai.core.message.UserMessage$Origin = Herkunft
com.top_logic.tl.ai.core.message.UserMessage$Origin.tooltip = Wer hat eine <i>Benutzernachricht</i> verfasst?
com.top_logic.tl.ai.core.message.UserMessage.Origin.AGENT = Agent
com.top_logic.tl.ai.core.message.UserMessage.Origin.AGENT.tooltip = Ein anderer Agent: die Aufgabe, die ein Lead-Agent für seinen Subagenten oder Delegierten geschrieben hat, oder eine Nachricht des Lead-Agenten an einen laufenden Subagenten.
com.top_logic.tl.ai.core.message.UserMessage.Origin.FRAMEWORK = Framework
com.top_logic.tl.ai.core.message.UserMessage.Origin.FRAMEWORK.tooltip = Das Framework: ein Hinweis, der übermittelte Bericht oder die Frage eines Subagenten oder die Zusammenfassung einer Kompaktierung.
com.top_logic.tl.ai.core.message.UserMessage.Origin.USER = Benutzer
com.top_logic.tl.ai.core.message.UserMessage.Origin.USER.tooltip = Der Benutzer in eigenen Worten: was er eingegeben hat oder was ein Skript für ihn gesendet hat.
com.top_logic.tl.ai.core.migration.DropOrphanedColumnProcessor = Prozessor zum Entfernen verwaister Spalten
com.top_logic.tl.ai.core.migration.DropOrphanedColumnProcessor.Config.column = Spalte
com.top_logic.tl.ai.core.migration.DropOrphanedColumnProcessor.Config.column.tooltip = Name des Attributs, das in der Spalte gespeichert ist, wie es in der Schemadefinition steht, aus der es entfernt wurde. <p> Der Spaltenname wird daraus so abgeleitet, wie das Schema ihn ableitet. </p>
com.top_logic.tl.ai.core.migration.DropOrphanedColumnProcessor.Config.table = Tabelle
com.top_logic.tl.ai.core.migration.DropOrphanedColumnProcessor.Config.table.tooltip = Name des Tabellentyps, zu dem die Spalte gehört.
com.top_logic.tl.ai.core.migration.DropOrphanedColumnProcessor.tooltip = <i>Migrationsprozessor</i>, der eine Spalte entfernt, die in der Datenbank zwar noch vorhanden ist, im persistenten Schema jedoch nicht mehr deklariert ist. <p> <i>Der Prozessor zum Entfernen von Spalten</i> findet die Spalte über das persistente Schema und überspringt sie, wenn das Schema kein solches Attribut enthält. Das in der Datenbank gespeicherte Schema wird bei jeder Migration durch das anwendungsspezifische Schema ersetzt. Daher verbleibt in einer Anwendung, die ein Attribut aus ihrer Schemadefinition entfernt hat, ohne dass die Migration zum Entfernen der Spalte ausgeführt wurde, und anschließend eine beliebige Migration durchgeführt hat, eine Spalte, die nirgendwo deklariert ist und auf die <i>der Prozessor zum Entfernen von Spalten</i> nicht zugreifen kann. Dieser Prozessor fragt die Datenbank selbst ab, ob die Spalte vorhanden ist. </p> <p> Er gehört hinter einen <i>Prozessor zum Entfernen von Spalten</i> für dasselbe Attribut: Solange das Schema das Attribut noch deklariert, wird die Spalte diesem Prozessor überlassen, der auch das Schema aktualisiert. Eine nicht vorhandene Tabelle oder Spalte wird gemeldet und akzeptiert. </p>
com.top_logic.tl.ai.core.migration.RequireEmptyTableProcessor = Leere-Tabellen-Prozessor erforderlich
com.top_logic.tl.ai.core.migration.RequireEmptyTableProcessor.Config.hint = Hinweis
com.top_logic.tl.ai.core.migration.RequireEmptyTableProcessor.Config.hint.tooltip = Erläutert, wie die Tabelle geleert und an die Fehlermeldung angehängt werden kann.
com.top_logic.tl.ai.core.migration.RequireEmptyTableProcessor.Config.table = Tabelle
com.top_logic.tl.ai.core.migration.RequireEmptyTableProcessor.Config.table.tooltip = Name des Tabellentyps, der keine Zeilen mehr enthalten darf.
com.top_logic.tl.ai.core.migration.RequireEmptyTableProcessor.tooltip = <i>Migrationsprozessor</i>, der die Migration abbricht, wenn eine Tabelle noch aktive Zeilen enthält. <p> Schützt einen nachfolgenden <i>Prozessor zum Löschen von Tabellen</i>: Das Löschen einer Tabelle, die noch Zeilen enthält, vernichtet diese Zeilen spurlos. Wird dieser Prozessor davor geschaltet, führt dies zu einer abgelehnten Inbetriebnahme mit einer umsetzbaren Meldung, sodass die Daten weiterhin vorhanden sind und gerettet werden können. </p> <p> Eine nicht leere Tabelle wird als Fehler <i>„Tabelle nicht leer</i> “ gemeldet und nicht als protokollierter Fehler. Dies ist beabsichtigt, siehe <i>„Tabelle nicht leer</i>“. </p> <p> Es werden nur die aktuellen Zeilen gezählt. Eine versionierte KnowledgeBase speichert die historischen Versionen bereits gelöschter Objekte in derselben Tabelle, und diese dürfen das Löschen nicht blockieren. </p> <p> Eine Tabelle, die der Datenbank überhaupt nicht bekannt ist, wird gemeldet und akzeptiert: Eine Anwendung, die das Modul, zu dem die Tabelle gehört, nie bereitgestellt hat, hat nichts zu verlieren. </p>
com.top_logic.tl.ai.core.provider.AuthScheme = Auth-Schema
com.top_logic.tl.ai.core.provider.AuthScheme.API_KEY = Api-Schlüssel
com.top_logic.tl.ai.core.provider.AuthScheme.API_KEY.tooltip = Azure-<code>OpenAI</code>-Abonnementschlüssel, der als Wert des api-key-Headers gesendet wird. <p>Wird verwendet, wenn eine direkte Verbindung zu einem Azure-<code>OpenAI</code>-Ressourcenendpunkt hergestellt wird, der den Abonnementschlüssel im api-key-Header anstelle eines Authorization-Bearer-Tokens erfordert.</p>
com.top_logic.tl.ai.core.provider.AuthScheme.BEARER = Bearer
com.top_logic.tl.ai.core.provider.AuthScheme.BEARER.tooltip = Standardmäßiges OAuth2-Bearer-Token, das im Authorization-Header mit dem Bearer-Schema gesendet wird. <p>Wird von <code>OpenAI</code>, Mistral, <code>xAI</code> und Azure-kompatiblen Gateways wie Nexus verwendet, die Bearer-Token im Standard-Header akzeptieren.</p>
com.top_logic.tl.ai.core.provider.AuthScheme.tooltip = HTTP-Authentifizierungsschema, mit dem der API-Schlüssel an einen LLM-Anbieter-Endpunkt gesendet wird. <p><i>Bearer</i> umfasst den <code>OpenAI</code>-Standard: Der Schlüssel folgt dem Bearer-Schema im Authorization-Header. <i>Api key</i> umfasst die Azure-<code>OpenAI</code>-Konvention, den Schlüssel in einem einfachen api-key-Header ohne Schema-Präfix zu senden.</p>
com.top_logic.tl.ai.core.provider.EffortLevels$Kind = Aufwandsart
com.top_logic.tl.ai.core.provider.EffortLevels$Kind.tooltip = In welches der beiden Zuordnungsfelder eine Ebene gehört.
com.top_logic.tl.ai.core.provider.EffortLevels.Kind.NONE = Keiner
com.top_logic.tl.ai.core.provider.EffortLevels.Kind.NONE.tooltip = Das Modell bietet keine Einstellung für den Denkaufwand.
com.top_logic.tl.ai.core.provider.EffortLevels.Kind.REASONING_EFFORT = Reasoning-Aufwand
com.top_logic.tl.ai.core.provider.EffortLevels.Kind.REASONING_EFFORT.tooltip = Das Modell verwendet Zeit auf das logische Schlussfolgern, bevor es eine Antwort gibt, so wie es auch bei den Modellen von OpenAI und xAI der Fall ist.
com.top_logic.tl.ai.core.provider.EffortLevels.Kind.THINKING_EFFORT = Denkaufwand
com.top_logic.tl.ai.core.provider.EffortLevels.Kind.THINKING_EFFORT.tooltip = Das Modell denkt erst einmal nach, bevor es antwortet – genau wie die Modelle von Anthropic.
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.base-url = Basis-URL
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.base-url.tooltip = Die Basis-URL des Anbieter-API-Endpunkts.
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.catalog-provider-id = Kataloganbieter-ID
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.catalog-provider-id.tooltip = Die Anbieter-ID, die zum Abrufen von Modell-Metadaten aus dem externen Katalog (models.dev) verwendet wird. <p> Jeder Anbieter liefert einen sinnvollen Standardwert, der seinem models.dev-Eintrag entspricht. Lassen Sie den Eintrag leer für Anbieter, die keinen Remote-Katalog haben (z. B. lokale Server) - ihre Modelle müssen manuell im Modellkatalog definiert werden. </p>
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.connect-timeout = Verbindungs-Timeout
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.connect-timeout.tooltip = TCP-Verbindungszeitlimit in Sekunden. <p> Legt fest, wie lange der HTTP-Client auf den Aufbau einer TCP-Verbindung zum Anbieter-Endpunkt wartet, bevor er aufgibt. </p>
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.credentials = Zugangsdaten
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.credentials.tooltip = Wie die Anfragen an den Anbieter authentifiziert werden. <p> Z. B. mit einem Zugriffstoken eines OAuth2-Autorisierungsservers, mit der verwalteten Identität der Cloud-Umgebung oder ganz ohne Zugangsdaten, wenn ein dazwischenliegendes Gateway sie hinzufügt. Ist nichts angegeben, werden die Anfragen mit dem API-Schlüssel des Anbieters authentifiziert, sofern einer konfiguriert ist. Beides anzugeben ist ein Fehler. </p>
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.custom-headers = Benutzerdefinierte Header
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.custom-headers.tooltip = Zusätzliche HTTP-Header, die bei jeder Anfrage an diesen Anbieter gesendet werden. <p> Nützlich für benutzerdefinierte Authentifizierungsschemata, Routing-Header oder anbieterspezifische Metadaten, die jeden API-Aufruf begleiten müssen. </p>
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.models = Modelle
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.models.tooltip = Für diesen Anbieter freigegebene Modellnamen. <p> Nur die hier aufgeführten Modelle können verwendet werden. Wenn leer, werden keine Modelle von diesem Anbieter bereitgestellt. </p>
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.request-timeout = Anfrage-Timeout
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.request-timeout.tooltip = Gesamt-Timeout für Streaming-Anfragen in Sekunden. <p> Maximale Wanduhrzeit, die für eine vollständige Streaming-Anfrage zulässig ist, einschließlich der Zeit für den Empfang von Streaming-Token. Eine großzügige Vorgabe trägt langlaufenden Agentenantworten Rechnung. </p>
com.top_logic.tl.ai.core.provider.LLMProviderService = LLM-Anbieter
com.top_logic.tl.ai.core.provider.LLMProviderService$ModelCatalogConfig = Konfiguration des Modellkatalogs
com.top_logic.tl.ai.core.provider.LLMProviderService$ModelCatalogConfig.tooltip = Konfiguration für den Modell-Metadatenkatalog. <p> Stellt schreibgeschützte Metadaten zu den Fähigkeiten (Tool-Aufruf, Schlussfolgerung, Temperaturunterstützung) und Einschränkungen (Kontextfenster, maximale Anzahl an Ausgabetoken) jedes Modells für alle im Abschnitt Anbieter konfigurierten Modelle bereit. Der Dienst startet mit der Kopie des mit der Anwendung mitgelieferten Katalogs von <a href="https://models.dev">models.dev</a> und lädt den aktuellen Katalog nach dem Start im Hintergrund. Modelle, die nicht im Katalog enthalten sind (z. B. lokal gehostete Modelle), können manuell in den Modell-Überschreibungen definiert werden. </p>
com.top_logic.tl.ai.core.provider.LLMProviderService.Config.failover = Ausfallsicherung
com.top_logic.tl.ai.core.provider.LLMProviderService.Config.failover.tooltip = Wohin ein Lauf weitergeleitet wird, wenn das Modell, mit dem er konfiguriert wurde, keine Antwort liefern kann, und wie lange diese Installation sich daran erinnert, dass ein Modell keine Antwort liefern konnte. <p> Standardmäßig leer; ein leerer Abschnitt bewirkt keine Änderung. </p>
com.top_logic.tl.ai.core.provider.LLMProviderService.Config.model-catalog = Modellkatalog
com.top_logic.tl.ai.core.provider.LLMProviderService.Config.model-catalog.tooltip = Modell-Metadatenkatalog mit einer Beschreibung der Fähigkeiten und Grenzen der einzelnen Modelle. <p> Wird beim Start automatisch aus dem externen <a href="https://models.dev">models.dev-Katalog</a> gefüllt. Für Modelle, die nicht im externen Katalog aufgeführt sind (z. B. lokale oder benutzerdefinierte Modelle), können manuelle Überschreibungen hinzugefügt werden. </p>
com.top_logic.tl.ai.core.provider.LLMProviderService.Config.providers = Anbieter
com.top_logic.tl.ai.core.provider.LLMProviderService.Config.providers.tooltip = Die konfigurierten LLM-Anbieter, indiziert nach Anbieternamen. <p> Jeder Eintrag enthält anbieterspezifische Eigenschaften. </p>
com.top_logic.tl.ai.core.provider.LLMProviderService.ModelCatalogConfig.catalog-url = Katalog-URL
com.top_logic.tl.ai.core.provider.LLMProviderService.ModelCatalogConfig.catalog-url.tooltip = Die URL des externen Modellkatalogs.
com.top_logic.tl.ai.core.provider.LLMProviderService.ModelCatalogConfig.fetch-remote-catalog = Remote-Katalog laden
com.top_logic.tl.ai.core.provider.LLMProviderService.ModelCatalogConfig.fetch-remote-catalog.tooltip = Ob der aktuelle Katalog von der Katalog-URL geladen wird. <p> Der Dienst wartet niemals darauf: Er startet mit dem mit der Anwendung mitgelieferten Katalog und lädt den aktuellen im Hintergrund. Ist diese Option deaktiviert, wird überhaupt keine Anfrage gestellt und ausschließlich der mitgelieferte Katalog verwendet – für eine Installation ohne Internetzugang. </p>
com.top_logic.tl.ai.core.provider.LLMProviderService.ModelCatalogConfig.llm-configuration = Metadaten zum Modell
com.top_logic.tl.ai.core.provider.LLMProviderService.ModelCatalogConfig.llm-configuration.tooltip = Metadaten pro Modell (Grenzen, Fähigkeiten). <p> Werden beim Start automatisch aus dem mitgelieferten Katalog und nach dem Laden aus dem Remote-Katalog übernommen. Schreibgeschützt – bitte nicht manuell ändern. </p>
com.top_logic.tl.ai.core.provider.LLMProviderService.ModelCatalogConfig.model-overrides = Modell-Überschreibungen
com.top_logic.tl.ai.core.provider.LLMProviderService.ModelCatalogConfig.model-overrides.tooltip = Manuell festgelegte Modell-Metadaten für Modelle, die nicht im entfernten Katalog stehen. <p> Für lokale Modelle oder <code>OpenAI</code>-kompatible Endpunkte, deren Modelle nicht auf models.dev aufgeführt sind. Einträge hier haben Vorrang vor Katalogeinträgen mit demselben Namen. </p> <p> Ein Eintrag kann einem Modell auch seine Preise geben, in US-Dollar je Million Token. Ein Modell ohne Preis kostet in einem Geldbudget nichts. </p>
com.top_logic.tl.ai.core.provider.LLMProviderService.tooltip = Die LLM-Anbieter dieser Installation: Welche Modelle gibt es und wie kann man auf sie zugreifen, was ist über die einzelnen Modelle bekannt und wohin wird eine Anfrage weitergeleitet, wenn das jeweilige Modell keine Antwort liefern kann? <p> Die Dienstkonfiguration ist in folgende Abschnitte gegliedert: </p> <ol> <li><b>Anbieter</b> – Verbindungsdetails für jeden LLM-Anbieter (API-Schlüssel, Basis-URLs, Modell-Whitelists). Jeder Anbietereintrag definiert, wie ein bestimmter LLM-API-Endpunkt erreicht wird und welche Modelle aktiviert sind.</li> <li><b>Failover</b> – Wohin ein Lauf weitergeleitet wird, wenn das Modell, mit dem er konfiguriert wurde, keine Antwort liefern kann.</li> <li><b>Modellkatalog</b> – schreibgeschützte Metadaten, die die Fähigkeiten jedes Modells (Aufruf von Tools, Schlussfolgerungen, Temperaturunterstützung) und dessen Grenzen (Kontextfenster, maximale Anzahl an Ausgabetoken) beschreiben. Beim Start aus dem mit der Anwendung mitgelieferten Katalog gefüllt und danach im Hintergrund aus dem Remote-Katalog <a href="https://models.dev">von models.dev</a>, mit optionalen manuellen Überschreibungen für lokale oder nicht gelistete Modelle.</li> </ol> <p> Welcher Agent auf welchem dieser Modelle läuft, wird in <i>Agenten-Laufzeit</i> konfiguriert. Dieser Dienst hieß früher „LLMService“; eine Konfiguration, die diesen Dienst noch namentlich nennt, verhindert den Start der Anwendung und gibt eine Meldung aus, in der angegeben wird, wo die einzelnen Abschnitte nun hingehören – siehe <i>LLM-Dienst</i>. </p>
