com.top_logic.tl.ai.core.agent.AllMcpServerNamesGenerator = All mcp server names generator
com.top_logic.tl.ai.core.agent.AllMcpServerNamesGenerator.tooltip = <i>List generator adaptor</i> providing all configured MCP server names as options. <p> Used as <options> generator on the mcpServers attribute of tl.ai.core:Agent. </p>
com.top_logic.tl.ai.core.agent.AllModelNamesGenerator = All model names generator
com.top_logic.tl.ai.core.agent.AllModelNamesGenerator.tooltip = <i>List generator adaptor</i> providing all available AI model names as options. <p> Used as <options> generator on the model attribute of tl.ai.core:Agent. </p>
com.top_logic.tl.ai.core.agent.AllToolNamesGenerator = All tool names generator
com.top_logic.tl.ai.core.agent.AllToolNamesGenerator.tooltip = <i>List generator adaptor</i> providing all available tool names as options. <p> Used as <options> generator on the tools attribute of tl.ai.core:Agent. </p>
com.top_logic.tl.ai.core.agent.ExecutionMode = Execution mode
com.top_logic.tl.ai.core.agent.ExecutionMode.DEVELOPMENT = Development
com.top_logic.tl.ai.core.agent.ExecutionMode.DEVELOPMENT.tooltip = Development environment. All tool modes permitted.
com.top_logic.tl.ai.core.agent.ExecutionMode.MAINTENANCE = Maintenance
com.top_logic.tl.ai.core.agent.ExecutionMode.MAINTENANCE.tooltip = Maintenance window active. All tool modes permitted.
com.top_logic.tl.ai.core.agent.ExecutionMode.PRODUCTION = Production
com.top_logic.tl.ai.core.agent.ExecutionMode.PRODUCTION.tooltip = Production environment. STRUCTURAL tools are denied by the system.
com.top_logic.tl.ai.core.agent.ExecutionMode.tooltip = The system's current execution mode. <p>Affects which tools the system allows. STRUCTURAL tools (those that modify application structure) are only permitted in <i>development</i> and <i>maintenance</i> modes, never in <i>production</i>.</p> <p>The bridge module maps this to TopLogic's MaintenanceWindowManager states.</p>
com.top_logic.tl.ai.core.agent.StopReason = Stop reason
com.top_logic.tl.ai.core.agent.StopReason.ABORTED = Aborted
com.top_logic.tl.ai.core.agent.StopReason.ABORTED.tooltip = Loop was interrupted (cancellation).
com.top_logic.tl.ai.core.agent.StopReason.COMPLETE = Complete
com.top_logic.tl.ai.core.agent.StopReason.COMPLETE.tooltip = LLM finished without requesting tools.
com.top_logic.tl.ai.core.agent.StopReason.CONTEXT_OVERFLOW = Context overflow
com.top_logic.tl.ai.core.agent.StopReason.CONTEXT_OVERFLOW.tooltip = Context window exceeded after compaction retries exhausted.
com.top_logic.tl.ai.core.agent.StopReason.ERROR = Error
com.top_logic.tl.ai.core.agent.StopReason.ERROR.tooltip = Unrecoverable provider error.
com.top_logic.tl.ai.core.agent.StopReason.MAX_TURNS = Maximum turns
com.top_logic.tl.ai.core.agent.StopReason.MAX_TURNS.tooltip = Hit the configured maximum turns limit.
com.top_logic.tl.ai.core.agent.StopReason.REJECTED = Rejected
com.top_logic.tl.ai.core.agent.StopReason.REJECTED.tooltip = Response validator rejected the LLM's response.
com.top_logic.tl.ai.core.agent.StopReason.tooltip = Why the agent loop stopped.
com.top_logic.tl.ai.core.agent.approval.ApprovalMode = Approval mode
com.top_logic.tl.ai.core.agent.approval.ApprovalMode.AUTO_APPROVE = Auto approve
com.top_logic.tl.ai.core.agent.approval.ApprovalMode.AUTO_APPROVE.tooltip = All tool calls are auto-approved without user interaction.
com.top_logic.tl.ai.core.agent.approval.ApprovalMode.MANUAL = Manual
com.top_logic.tl.ai.core.agent.approval.ApprovalMode.MANUAL.tooltip = Each tool call requires manual user approval.
com.top_logic.tl.ai.core.agent.approval.ApprovalMode.tooltip = Controls how tool calls are approved in the human-in-the-loop workflow.
com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome = Approval outcome
com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome.APPROVED = Approved
com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome.APPROVED.tooltip = User approved this single tool call.
com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome.APPROVED_FOR_SESSION = Approved for session
com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome.APPROVED_FOR_SESSION.tooltip = User approved this tool for the remainder of the session.
com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome.REJECTED = Rejected
com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome.REJECTED.tooltip = User rejected the call.
com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome.TIMED_OUT = Timed out
com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome.TIMED_OUT.tooltip = No response arrived within the approval timeout.
com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome.tooltip = Terminal state of an approval flow, carried by <i>approval result</i>.
com.top_logic.tl.ai.core.mcp.HttpMcpTransport = HTTP mcp transport
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.bearer-token-env-var = Bearer token env var
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.bearer-token-env-var.tooltip = Name of an environment variable holding a bearer token. <p> Resolved via System.getenv() at connect time. The token is sent as Authorization: Bearer <token> header. This avoids putting secrets in config files. </p>
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.headers = Headers
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.headers.tooltip = Static HTTP headers sent with every request. <p> In XML: <entry name="X-Api-Key" value="secret"/> </p>
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.url = URL
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.url.tooltip = The URL of the MCP server endpoint (e.g., "https://mcp.example.com/mcp").
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.tooltip = <i>Mcp transport configuration</i> creating an MCP HTTP transport (Streamable HTTP). <p> The MCP server runs as an external HTTP service. Authentication is handled via static headers or a bearer token resolved from an environment variable at connect time. </p>
com.top_logic.tl.ai.core.mcp.McpServerRegistry = Mcp server registry
com.top_logic.tl.ai.core.mcp.McpServerRegistry$McpServerConfig = Mcp server configuration
com.top_logic.tl.ai.core.mcp.McpServerRegistry$McpServerConfig.tooltip = Configuration for a single MCP server.
com.top_logic.tl.ai.core.mcp.McpServerRegistry.Config.servers = Servers
com.top_logic.tl.ai.core.mcp.McpServerRegistry.Config.servers.tooltip = Map of named MCP server configurations.
com.top_logic.tl.ai.core.mcp.McpServerRegistry.McpServerConfig.tool-timeout-seconds = Tool timeout seconds
com.top_logic.tl.ai.core.mcp.McpServerRegistry.McpServerConfig.tool-timeout-seconds.tooltip = Timeout in seconds for individual tool calls.
com.top_logic.tl.ai.core.mcp.McpServerRegistry.McpServerConfig.transport = Transport
com.top_logic.tl.ai.core.mcp.McpServerRegistry.McpServerConfig.transport.tooltip = Transport configuration (stdio or HTTP).
com.top_logic.tl.ai.core.mcp.McpServerRegistry.tooltip = Service managing connections to external MCP servers. <p> Configured via XML with named MCP server entries. Each server is connected at startup, and its tools are discovered via the MCP tools/list call. Agents reference servers by name via their mcpServers attribute; <i>agent factory</i> pulls the server's tools into the agent's <i>tool dispatcher</i>. </p>
com.top_logic.tl.ai.core.mcp.NamedValueConfig = Named value configuration
com.top_logic.tl.ai.core.mcp.NamedValueConfig.tooltip = A named string value for use in config maps. <p> Used for environment variables and HTTP headers in MCP transport configs. In XML: <entry name="KEY" value="VALUE"/> </p>
com.top_logic.tl.ai.core.mcp.NamedValueConfig.value = Value
com.top_logic.tl.ai.core.mcp.NamedValueConfig.value.tooltip = The value.
com.top_logic.tl.ai.core.mcp.StdioMcpTransport = Stdio mcp transport
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.args = Arguments
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.args.tooltip = Command-line arguments passed to the command. <p> In XML config, provide as comma-separated values: args="-y,@modelcontextprotocol/server-github" </p>
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.command = Command
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.command.tooltip = The command to execute (e.g., "npx" or "python").
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.env = Env
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.env.tooltip = Environment variables for the subprocess. <p> Use this to pass API keys without putting them in config: <entry name="GITHUB_TOKEN" value="${env:GITHUB_TOKEN}"/> </p>
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.tooltip = <i>Mcp transport configuration</i> creating an MCP stdio transport (subprocess). <p> The MCP server is started as a child process. Communication happens via stdin/stdout using JSON-RPC. Environment variables can be used to pass API keys or other secrets. </p>
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.models = Models
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.models.tooltip = Allowed model names for this provider. <p> If non-empty, only these models are exposed by this provider. If empty, all models discovered via <code>LLMProviderConfig#discoverModels()</code> are exposed. </p>
com.top_logic.tl.ai.core.provider.LLMProviderRegistry = LLM provider registry
com.top_logic.tl.ai.core.provider.LLMProviderRegistry.Config.default-model = Default model
com.top_logic.tl.ai.core.provider.LLMProviderRegistry.Config.default-model.tooltip = The default model name to use when no model is explicitly specified on an agent. <p> Must match one of the effective model names exposed by the configured providers. </p>
com.top_logic.tl.ai.core.provider.LLMProviderRegistry.Config.providers = Providers
com.top_logic.tl.ai.core.provider.LLMProviderRegistry.Config.providers.tooltip = The configured LLM providers, keyed by provider name. <p> Each provider entry is a polymorphic <i>configuration</i> that carries provider-specific properties (API key, base URL, etc.) and knows how to create the appropriate <i>LLM provider</i> implementation. </p>
com.top_logic.tl.ai.core.provider.LLMProviderRegistry.tooltip = Registry of LLM provider connections. <p> Manages provider configurations and creates <i>LLM provider</i> instances for given model names. Each provider is a polymorphic <i>LLM provider configuration</i> that knows how to create its own provider instance and discover available models. </p>
com.top_logic.tl.ai.core.provider.ProviderException$Kind = Kind
com.top_logic.tl.ai.core.provider.ProviderException$Kind.tooltip = Classification of the error.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.AUTHENTICATION = Authentication
com.top_logic.tl.ai.core.provider.ProviderException.Kind.AUTHENTICATION.tooltip = 401/403 \u2014 invalid or expired API key.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.BILLING = Billing
com.top_logic.tl.ai.core.provider.ProviderException.Kind.BILLING.tooltip = 402 \u2014 billing or payment issue. Terminal, not retryable.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.CONTEXT_WINDOW_EXCEEDED = Context window exceeded
com.top_logic.tl.ai.core.provider.ProviderException.Kind.CONTEXT_WINDOW_EXCEEDED.tooltip = Request too large for the model's context window.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.INVALID_REQUEST = Invalid request
com.top_logic.tl.ai.core.provider.ProviderException.Kind.INVALID_REQUEST.tooltip = 400 \u2014 malformed request.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.OVERLOADED = Overloaded
com.top_logic.tl.ai.core.provider.ProviderException.Kind.OVERLOADED.tooltip = 529 or 5xx \u2014 provider overloaded or temporarily unavailable.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.RATE_LIMITED = Rate limited
com.top_logic.tl.ai.core.provider.ProviderException.Kind.RATE_LIMITED.tooltip = 429 \u2014 rate limited. Check retryAfter().
com.top_logic.tl.ai.core.provider.ProviderException.Kind.UNKNOWN = Unknown
com.top_logic.tl.ai.core.provider.ProviderException.Kind.UNKNOWN.tooltip = Unclassified error.
com.top_logic.tl.ai.core.provider.ResponseFormat = Response format
com.top_logic.tl.ai.core.provider.ResponseFormat.JSON = JSON
com.top_logic.tl.ai.core.provider.ResponseFormat.JSON.tooltip = Structured JSON object response.
com.top_logic.tl.ai.core.provider.ResponseFormat.TEXT = Text
com.top_logic.tl.ai.core.provider.ResponseFormat.TEXT.tooltip = Plain text response (default).
com.top_logic.tl.ai.core.provider.ResponseFormat.tooltip = Controls the format of the LLM response.
com.top_logic.tl.ai.core.provider.ToolChoice = Tool choice
com.top_logic.tl.ai.core.provider.ToolChoice.AUTO = Auto
com.top_logic.tl.ai.core.provider.ToolChoice.AUTO.tooltip = The LLM decides whether to call a tool (default).
com.top_logic.tl.ai.core.provider.ToolChoice.NONE = None
com.top_logic.tl.ai.core.provider.ToolChoice.NONE.tooltip = The LLM must not call any tool.
com.top_logic.tl.ai.core.provider.ToolChoice.REQUIRED = Required
com.top_logic.tl.ai.core.provider.ToolChoice.REQUIRED.tooltip = The LLM must call at least one tool.
com.top_logic.tl.ai.core.provider.ToolChoice.tooltip = Controls how the LLM selects tools during a request.
com.top_logic.tl.ai.core.provider.anthropic.AnthropicProviderConfig = Anthropic provider configuration
com.top_logic.tl.ai.core.provider.anthropic.AnthropicProviderConfig.Config.api-key = Api key
com.top_logic.tl.ai.core.provider.anthropic.AnthropicProviderConfig.Config.api-key.tooltip = The API key for Anthropic authentication.
com.top_logic.tl.ai.core.provider.anthropic.AnthropicProviderConfig.Config.base-url = Base URL
com.top_logic.tl.ai.core.provider.anthropic.AnthropicProviderConfig.Config.base-url.tooltip = The base URL for the Anthropic API.
com.top_logic.tl.ai.core.provider.anthropic.AnthropicProviderConfig.Config.version = Version
com.top_logic.tl.ai.core.provider.anthropic.AnthropicProviderConfig.Config.version.tooltip = The Anthropic API version string sent as anthropic-version header.
com.top_logic.tl.ai.core.provider.anthropic.AnthropicProviderConfig.tooltip = <i>LLM provider configuration</i> for the Anthropic Messages API. <p> Provides the version property specific to Anthropic's anthropic-version header requirement. </p>
com.top_logic.tl.ai.core.provider.local.LocalProviderConfig = Local provider configuration
com.top_logic.tl.ai.core.provider.local.LocalProviderConfig.Config.base-url = Base URL
com.top_logic.tl.ai.core.provider.local.LocalProviderConfig.Config.base-url.tooltip = The base URL of the local server (e.g. http://localhost:11434). <p> Mandatory \u2014 the server address must be explicitly specified. </p>
com.top_logic.tl.ai.core.provider.local.LocalProviderConfig.tooltip = <i>LLM provider configuration</i> for local OpenAI-compatible servers (Ollama, LM Studio, vLLM). <p> The base URL is mandatory and no API key is required. Produces an <i>open AI provider</i> since local servers speak the OpenAI protocol. </p>
com.top_logic.tl.ai.core.provider.mistral.MistralProviderConfig = Mistral provider configuration
com.top_logic.tl.ai.core.provider.mistral.MistralProviderConfig.Config.api-key = Api key
com.top_logic.tl.ai.core.provider.mistral.MistralProviderConfig.Config.api-key.tooltip = The API key for Mistral authentication.
com.top_logic.tl.ai.core.provider.mistral.MistralProviderConfig.Config.base-url = Base URL
com.top_logic.tl.ai.core.provider.mistral.MistralProviderConfig.Config.base-url.tooltip = The base URL for the Mistral API.
com.top_logic.tl.ai.core.provider.mistral.MistralProviderConfig.tooltip = <i>LLM provider configuration</i> for the Mistral AI API.
com.top_logic.tl.ai.core.provider.openai.OpenAICompatibleProviderConfig = Open AI compatible provider configuration
com.top_logic.tl.ai.core.provider.openai.OpenAICompatibleProviderConfig.Config.api-key = Api key
com.top_logic.tl.ai.core.provider.openai.OpenAICompatibleProviderConfig.Config.api-key.tooltip = The API key for authentication. <p> Optional \u2014 some services use different authentication mechanisms. </p>
com.top_logic.tl.ai.core.provider.openai.OpenAICompatibleProviderConfig.Config.base-url = Base URL
com.top_logic.tl.ai.core.provider.openai.OpenAICompatibleProviderConfig.Config.base-url.tooltip = The base URL of the OpenAI-compatible service. <p> Mandatory \u2014 there is no sensible default for third-party services. </p>
com.top_logic.tl.ai.core.provider.openai.OpenAICompatibleProviderConfig.tooltip = <i>LLM provider configuration</i> for third-party services that implement the OpenAI protocol. <p> Unlike <i>open AI provider configuration</i>, the base URL is mandatory (there is no sensible default). The API key is optional since some services use different authentication mechanisms. </p>
com.top_logic.tl.ai.core.provider.openai.OpenAIProviderConfig = Open AI provider configuration
com.top_logic.tl.ai.core.provider.openai.OpenAIProviderConfig.Config.api-key = Api key
com.top_logic.tl.ai.core.provider.openai.OpenAIProviderConfig.Config.api-key.tooltip = The API key for OpenAI authentication.
com.top_logic.tl.ai.core.provider.openai.OpenAIProviderConfig.Config.base-url = Base URL
com.top_logic.tl.ai.core.provider.openai.OpenAIProviderConfig.Config.base-url.tooltip = The base URL for the OpenAI API.
com.top_logic.tl.ai.core.provider.openai.OpenAIProviderConfig.tooltip = <i>LLM provider configuration</i> for the OpenAI cloud API.
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig = XAI provider configuration
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Config.api-key = Api key
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Config.api-key.tooltip = The API key for xAI authentication.
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Config.base-url = Base URL
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.Config.base-url.tooltip = The base URL for the xAI API.
com.top_logic.tl.ai.core.provider.xai.XAIProviderConfig.tooltip = <i>LLM provider configuration</i> for the xAI (Grok) API. <p> The xAI inference API is OpenAI-compatible. This config produces an <i>XAI provider</i> (which extends <i>open AI provider</i>). </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChat = Agent chat
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChat.param.agentName.tooltip = The agent name as configured in the knowledge base.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChat.param.userMessage.tooltip = The user message to send to the agent.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChat.return = The agent's final text response.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.agentChat.tooltip = Runs a named agent from the <i>agent factory</i> registry with a single user message. <p> The agent is resolved by name from the tl.ai.core:Agent model instances. A fresh <i>conversation</i> is created for each call; no conversation history is retained between invocations. </p> <p> Example usage in TL-Script: </p> <pre> aiAgentChat("my-agent", "Summarize the latest changes.") </pre>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool = Call tool
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool.param.parameters.tooltip = A map of parameter names to values, or null if the tool has no parameters.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool.param.toolName.tooltip = The qualified name of the tool to invoke.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool.return = The result of the tool execution as a string.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool.tooltip = Invokes a tool manually with the given parameters. <p> This function allows direct invocation of registered tools from TL-Script. The tool is identified by its qualified name in the format factory-name.tool-name. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat = Chat
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.param.messages.tooltip = A list of messages. Each message can be: <ul> <li>String: Treated as user text message</li> <li>Map with "role" and "content": Explicit role (system/user/assistant). Content can be string, binary data, or a list of mixed content.</li> <li>Binary data: Treated as user image/document message</li> </ul>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.param.model.tooltip = The model name to use, or null to use the default model configured in <i>LLM provider registry</i>.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.param.responseFormat.tooltip = The response format specification. Can be: <ul> <li>null: No specific format requirement</li> <li>String "text" or "json": Simple format type</li> <li>Map with "name" and "schema" fields describing a JSON schema for structured output.</li> </ul>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.param.tools.tooltip = A collection of qualified tool names to make available to the AI agent (e.g., ["mytools.calculateSum", "texttools.formatText"]), or null to provide no tools.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.return = The assistant's response text.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.tooltip = Sends a multi-turn conversation to a chat completion provider. <p> Messages can be strings, maps with role/content, or lists. Content can be text strings or <i>binary data</i> for images and documents. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.models = Models
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.models.return = An immutable list of all configured model names.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.models.tooltip = Returns a list of all available model names from the <i>LLM provider registry</i>. <p> Model names can be passed to the <i>chat</i> function to select which AI model to use. The returned list maintains a consistent order across calls. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.toolInfo = Tool info
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.toolInfo.param.toolName.tooltip = The qualified name of the tool.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.toolInfo.return = A map containing the tool's metadata with the structure described above, or null if the tool is not found.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.toolInfo.tooltip = Retrieves detailed information about a registered tool. <p> This function returns metadata about a tool including its name, description, and parameter schema. The tool is identified by its qualified name in the format factory-name.tool-name. </p> <p> The returned map contains: </p> <ul> <li>name - The tool's name</li> <li>qualifiedName - The tool's fully qualified name</li> <li>description - A description of what the tool does</li> <li>inputSchemaJson - The JSON Schema string for tool parameters</li> </ul>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.tools = Tools
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.tools.return = A list of all registered tool names.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.tools.tooltip = Returns a list of all available tool names from the <i>tool registry service</i>. <p> Tool names are in the qualified format factory-name.tool-name. These names can be passed to the <i>chat</i> function to make tools available to the AI agent. </p>
com.top_logic.tl.ai.core.scripting.Converters.htmlToMarkdown = HTML to markdown
com.top_logic.tl.ai.core.scripting.Converters.htmlToMarkdown.param.html.tooltip = Text in HTML format.
com.top_logic.tl.ai.core.scripting.Converters.htmlToMarkdown.return = Markdown formatted text.
com.top_logic.tl.ai.core.scripting.Converters.htmlToMarkdown.tooltip = Converts HTML to <i>Markdown</i>.
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtml = Markdown to HTML
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtml.param.markdown.tooltip = Text in <i>Markdown</i> format.
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtml.return = HTML fragment that can be rendered.
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtml.tooltip = Converts <i>Markdown</i> to HTML.
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtmlString = Markdown to HTML string
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtmlString.param.markdown.tooltip = Text in <i>Markdown</i> format.
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtmlString.return = HTML string.
com.top_logic.tl.ai.core.scripting.Converters.markdownToHtmlString.tooltip = Converts <i>Markdown</i> to an HTML string.
com.top_logic.tl.ai.core.session.Part$ApprovalDecision = Approval decision
com.top_logic.tl.ai.core.session.Part$ApprovalDecision.tooltip = Approval decision made by the user.
com.top_logic.tl.ai.core.session.Part$SystemEventType = System event type
com.top_logic.tl.ai.core.session.Part$SystemEventType.tooltip = Types of system events.
com.top_logic.tl.ai.core.session.Part$ToolCallStatus = Tool call status
com.top_logic.tl.ai.core.session.Part$ToolCallStatus.tooltip = Status of a tool call through its lifecycle.
com.top_logic.tl.ai.core.session.Part$TransactionType = Transaction type
com.top_logic.tl.ai.core.session.Part$TransactionType.tooltip = KB transaction type.
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.APPROVED = Approved
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.APPROVED.tooltip = User approved this tool call.
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.APPROVED_FOR_SESSION = Approved for session
