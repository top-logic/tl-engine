model.LoginMessages = Login-Meldungen
model.LoginMessages.LoginMessage = Login-Meldung
model.LoginMessages.LoginMessage.active = Aktiv
model.LoginMessages.LoginMessage.active.tooltip = Nur eine aktive Login-Meldung wird einem Nutzer nach dem Login zur Bestätigung angezeigt. Statt eine Login-Meldung zu löschen, kann diese inaktiv geschaltet werden, um sie bei Bedarf später wieder zu aktivieren.
model.LoginMessages.LoginMessage.confirmDuration = Bestätigungsintervall (in Tagen)
model.LoginMessages.LoginMessage.confirmDuration.tooltip = Intervall in Tagen, nach dem eine Meldung einem Nutzer erneut angezeigt wird. Wenn kein Wert angegeben ist, handelt es sich um eine einmalige Bestätigung (wird jedem Nutzer nur einmal angezeigt). Der Wert 0 steht für eine Bestätigung, die nach jeder Anmeldung erneut angezeigt wird.
model.LoginMessages.LoginMessage.confirmExpirationDate = Bestätigungsverfall
model.LoginMessages.LoginMessage.confirmExpirationDate.tooltip = Zeitpunkt, zu dem alle bisher erteilten Bestätigungen ungültig gemacht wurden. Eine Bestätigung, die älter als dieser Zeitpunkt ist, gilt als abgelaufen, so dass die Meldung erneut angezeigt wird. Der Wert wird von dem Kommando gesetzt, das die Bestätigungen zurücksetzt, und nicht direkt bearbeitet.
model.LoginMessages.LoginMessage.endDate = Gültig bis
model.LoginMessages.LoginMessage.endDate.tooltip = Ablaufdatum der Login-Meldung. Wenn ein Datum gesetzt ist, dann wird die Login-Meldung nur dann angezeigt, wenn der Nutzer sich an diesem Datum oder früher anmeldet.
model.LoginMessages.LoginMessage.message = Meldung
model.LoginMessages.LoginMessage.message.tooltip = Der Inhalt der Meldung, die einem Nutzer nach dem Login angezeigt werden soll.
model.LoginMessages.LoginMessage.name = Bezeichnung
model.LoginMessages.LoginMessage.name.tooltip = Die Bezeichnung, unter der die Login-Meldung verwaltet wird. Sie wird dem Nutzer, der die Meldung bestätigen muss, nicht angezeigt, bestimmt aber die Reihenfolge, in der die Meldungen aufgelistet werden.
model.LoginMessages.LoginMessage.startDate = Gültig von
model.LoginMessages.LoginMessage.startDate.tooltip = Wenn ein Datum gesetzt ist, dann wird die Login-Meldung nur dann angezeigt, wenn der Nutzer sich an diesem Datum oder später anmeldet.
model.LoginMessages.LoginMessage.tooltip = Eine Meldung, die einem Nutzer nach dem Login zur Bestätigung angezeigt wird. Gültigkeitszeitraum und Bestätigungsintervall legen fest, wann und wie oft sie erscheint.
model.LoginMessages.LoginMessage.windowHeight = Fensterhöhe (px)
model.LoginMessages.LoginMessage.windowHeight.tooltip = Die Höhe des Dialogs, in dem die Login-Meldung angezeigt wird.
model.LoginMessages.LoginMessage.windowWidth = Fensterbreite (px)
model.LoginMessages.LoginMessage.windowWidth.tooltip = Die Breite des Dialogs, in dem die Login-Meldung angezeigt wird.
model.LoginMessages.tooltip = Modul mit dem Typ für die Meldungen, die ein Nutzer nach der Anmeldung bestätigen muss.
