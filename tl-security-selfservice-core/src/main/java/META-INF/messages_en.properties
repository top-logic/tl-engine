com.top_logic.security.selfservice.invitation.InvitationLink = Invitation link
com.top_logic.security.selfservice.invitation.InvitationLink.Config.page = Page
com.top_logic.security.selfservice.invitation.InvitationLink.Config.page.tooltip = The page the link leads to, a path below the context path of the application starting with <code>/</code>, e.g. <code>/servlet/LayoutServlet</code>. <p> The page receives the token of the invitation in the request parameter <code>"invitation"</code>. Without a value, the link leads to the layout servlet of the classic user interface, whose login accepts the invitation. </p>
com.top_logic.security.selfservice.invitation.InvitationLink.tooltip = The link of an <i>invitation</i>, the page of the application where the invited person accepts it. <p> The link is the public address of the application (<code>"%HOST%"</code>, variable <code>tl_host</code>, or without one the address of the current request), its context path (<code>"%APP_CONTEXT%"</code>), the page and the token of the invitation in the request parameter <code>"invitation"</code>, e.g. <code>https://app.example.com/app/servlet/LayoutServlet?invitation=0123abcd-...</code>. With a configured public address, the link does not depend on a current request and can be built in any context, e.g. from a scheduled script. </p>
com.top_logic.security.selfservice.invitation.InvitationModule = Service module for invitations
com.top_logic.security.selfservice.invitation.InvitationModule.Config.authentication-device = Authentication device
com.top_logic.security.selfservice.invitation.InvitationModule.Config.authentication-device.tooltip = The ID of the <i>authentication device</i> on which an accepted invitation creates the account.
com.top_logic.security.selfservice.invitation.InvitationModule.Config.code-validity = Code validity
com.top_logic.security.selfservice.invitation.InvitationModule.Config.code-validity.tooltip = How long a verification code remains valid after it was created.
com.top_logic.security.selfservice.invitation.InvitationModule.Config.invitation-link = Invitation link
com.top_logic.security.selfservice.invitation.InvitationModule.Config.invitation-link.tooltip = The link of an invitation, the page of the application where the invited person accepts it. <p> By default, the link leads to the login of the classic user interface. </p>
com.top_logic.security.selfservice.invitation.InvitationModule.Config.invitation-mail = Invitation mail
com.top_logic.security.selfservice.invitation.InvitationModule.Config.invitation-mail.tooltip = The TL-Script expression sending the invitation mail. <p> The expression is called with the <i>invitation</i> object as first argument, the application title as second argument, the invitation link as third argument, and the subject and the content of the mail as fourth and fifth argument. Subject and content are passed unfilled; the expression fills them with the application title and the link, and may add further information. </p> <p> The expression runs in the language of the recipient, see <code>InvitationModule#invitationLanguage(Invitation)</code>, so that <code>localize()</code> writes the texts in this language. </p>
com.top_logic.security.selfservice.invitation.InvitationModule.Config.invitation-text = Invitation text
com.top_logic.security.selfservice.invitation.InvitationModule.Config.invitation-text.tooltip = The subject and the content of the invitation mail. <p> In both texts, <code>{0}</code> stands for the title of the application and <code>{1}</code> for the link of the invitation. </p>
com.top_logic.security.selfservice.invitation.InvitationModule.Config.invitation-validity = Invitation validity
com.top_logic.security.selfservice.invitation.InvitationModule.Config.invitation-validity.tooltip = How long an invitation can be accepted after it was created or sent again.
com.top_logic.security.selfservice.invitation.InvitationModule.Config.password-reset-timeout = Password reset timeout
com.top_logic.security.selfservice.invitation.InvitationModule.Config.password-reset-timeout.tooltip = Time in milliseconds how long a password reset request is valid.
com.top_logic.security.selfservice.invitation.InvitationModule.Config.reset-mfa-mail = Reset multi-factor-authentication mail
com.top_logic.security.selfservice.invitation.InvitationModule.Config.reset-mfa-mail.tooltip = The TL-Script expression that sends an email when reset of the multi-factor authentication is requested. <p> The expression is called with the email as first argument, the application title as second argument, the reset code as third argument, and the subject and the content of the mail as fourth and fifth argument. Subject and content are passed unfilled; the expression fills them with the application title and the code, and may add further information. </p> <p> The expression runs in the language of the recipient, see <code>InvitationModule#accountLanguage(Person)</code>, so that <code>localize()</code> writes the texts in this language. </p>
com.top_logic.security.selfservice.invitation.InvitationModule.Config.reset-mfa-text = Reset multi-factor-authentication mail text
com.top_logic.security.selfservice.invitation.InvitationModule.Config.reset-mfa-text.tooltip = The subject and the content of the mail sent when the reset of the multi-factor authentication is requested. <p> In both texts, <code>{0}</code> stands for the title of the application and <code>{1}</code> for the reset code. </p>
com.top_logic.security.selfservice.invitation.InvitationModule.Config.reset-password-mail = Reset password mail
com.top_logic.security.selfservice.invitation.InvitationModule.Config.reset-password-mail.tooltip = The TL-Script expression that sends an email when a password reset is requested. <p> The expression is called with the email as first argument, the application title as second argument, the reset code as third argument, and the subject and the content of the mail as fourth and fifth argument. Subject and content are passed unfilled; the expression fills them with the application title and the code, and may add further information. </p> <p> The expression runs in the language of the recipient, see <code>InvitationModule#accountLanguage(Person)</code>, so that <code>localize()</code> writes the texts in this language. </p>
com.top_logic.security.selfservice.invitation.InvitationModule.Config.reset-password-text = Reset password text
com.top_logic.security.selfservice.invitation.InvitationModule.Config.reset-password-text.tooltip = The subject and the content of the mail sent when a password reset is requested. <p> In both texts, <code>{0}</code> stands for the title of the application and <code>{1}</code> for the reset code. </p>
com.top_logic.security.selfservice.invitation.InvitationModule.Config.verification-code-size = Verification code size
com.top_logic.security.selfservice.invitation.InvitationModule.Config.verification-code-size.tooltip = The number of digits that are used to create a verification code.
com.top_logic.security.selfservice.invitation.InvitationModule.Config.verification-mail = Verification mail
com.top_logic.security.selfservice.invitation.InvitationModule.Config.verification-mail.tooltip = The TL-Script expression sending the verification mail. <p> The expression is called with the <i>invitation</i> object as first argument, the application title as second argument, the verification code as third argument, and the subject and the content of the mail as fourth and fifth argument. Subject and content are passed unfilled; the expression fills them with the application title and the code, and may add further information. </p> <p> The expression runs in the language of the recipient, see <code>InvitationModule#invitationLanguage(Invitation)</code>, so that <code>localize()</code> writes the texts in this language. </p>
com.top_logic.security.selfservice.invitation.InvitationModule.Config.verification-text = Verification text
com.top_logic.security.selfservice.invitation.InvitationModule.Config.verification-text.tooltip = The subject and the content of the verification mail. <p> In both texts, <code>{0}</code> stands for the title of the application and <code>{1}</code> for the verification code. </p>
com.top_logic.security.selfservice.invitation.InvitationModule.tooltip = <i>Configured managed class</i> for elements in <code>"tl.security.selfservice"</code>. <p> Offers the UI-independent operations of the <i>invitation</i> lifecycle: an invitation is created and sent, it is open until it expires or is accepted, and an open or expired invitation can be renewed or sent again. An accepted invitation is kept as a record of the account created from it. </p>
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.refusal = Refusal of an invitation
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.refusal.param.token.tooltip = The token from the invitation link.
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.refusal.return = The message telling that there is no invitation with the token, or that it has expired or has been accepted; <code>null</code> if the invitation is open.
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.refusal.tooltip = The reason why the invitation of a link cannot be accepted. <p> The page an invitation link leads to shows the reason to the visitor, who is not logged in. The lookup does not depend on access rights: the token of the link is the proof. </p>
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.renew = Renew invitation
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.renew.param.invitation.tooltip = The invitation to renew.
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.renew.tooltip = Gives an open or expired invitation a new link and a new expiry date, without sending it. <p> The previous link of the invitation is no longer valid. An accepted invitation is refused. </p>
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.resend = Send invitation again
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.resend.param.invitation.tooltip = The invitation to send again.
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.resend.return = The result of the invitation mail script, by default whether the mail was sent.
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.resend.tooltip = Sends an open or expired invitation again. <p> An open invitation is sent with its link, an expired invitation is renewed first and sent with a new link and a new expiry date. An accepted invitation is refused. </p>
com.top_logic.security.selfservice.invitation.script.SendInvitation$Builder = Builder
com.top_logic.security.selfservice.invitation.script.SendInvitation$Builder.tooltip = <i>Method builder</i> for <i>send invitations</i>.
