model.tl.contact.external = Externe Kontakte
model.tl.contact.external.ExternalContact = Externer Kontakt
model.tl.contact.external.ExternalContact.tooltip = Ein einzelner Kontakt aus einem externen System. Der Wert ist kein Fachobjekt der Anwendung, sondern trägt die von jenem System gelieferten Daten wie Name, Bereich, Telefonnummer und E-Mail-Adresse.
model.tl.contact.external.ExternalContactSet = Sammlung externer Kontakte
model.tl.contact.external.ExternalContactSet.tooltip = Mehrere Kontakte aus einem externen System in einem Attribut. Abgesehen von der Anzahl der Werte verhält sich der Typ wie der Typ für einen einzelnen externen Kontakt.
model.tl.contact.external.tooltip = Modul mit den Datentypen für Kontakte, die nicht in der Anwendung verwaltet, sondern aus einem externen System gelesen werden.
