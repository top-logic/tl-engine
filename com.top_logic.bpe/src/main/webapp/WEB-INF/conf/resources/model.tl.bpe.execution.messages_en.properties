model.tl.bpe.execution = Workflow execution
model.tl.bpe.execution.ExecutionState = Execution state
model.tl.bpe.execution.ExecutionState.ABORTED = Aborted
model.tl.bpe.execution.ExecutionState.ABORTED.tooltip = The process instance was abandoned before its end and is not continued.
model.tl.bpe.execution.ExecutionState.FINISHED = Finished
model.tl.bpe.execution.ExecutionState.FINISHED.tooltip = The process instance has reached an end event. It has no active tasks any more.
model.tl.bpe.execution.ExecutionState.RUNNING = Active
model.tl.bpe.execution.ExecutionState.RUNNING.tooltip = The process instance has not reached an end event yet and still has tasks to be done.
model.tl.bpe.execution.ExecutionState.tooltip = The state a process instance is in.
model.tl.bpe.execution.Named = Named
model.tl.bpe.execution.Named.name = Name
model.tl.bpe.execution.ProcessExecution = Process instance
model.tl.bpe.execution.ProcessExecution.activeTokens = Active jobs
model.tl.bpe.execution.ProcessExecution.activeTokens.tooltip = The tasks that are currently to be done in this run. The value is maintained by the workflow execution.
model.tl.bpe.execution.ProcessExecution.allTokens = Journal
model.tl.bpe.execution.ProcessExecution.allTokens.tooltip = The sequence of all tasks created in this process run.
model.tl.bpe.execution.ProcessExecution.collaboration = Collaboration
model.tl.bpe.execution.ProcessExecution.collaboration.tooltip = The collaboration this run belongs to.
model.tl.bpe.execution.ProcessExecution.createdBy = Creator
model.tl.bpe.execution.ProcessExecution.createdBy.tooltip = The account that started the run. The value is computed.
model.tl.bpe.execution.ProcessExecution.createdByContact = Contact
model.tl.bpe.execution.ProcessExecution.createdByContact.tooltip = The person contact of the account that started the run. The value is computed.
model.tl.bpe.execution.ProcessExecution.durationInMinutes = Duration (min)
model.tl.bpe.execution.ProcessExecution.durationInMinutes.tooltip = The time in minutes the run has taken so far, and the total time it took once it is finished. The value is computed.
model.tl.bpe.execution.ProcessExecution.executionNumber = Number
model.tl.bpe.execution.ProcessExecution.executionNumber.tooltip = The consecutive number of the run. It is assigned automatically from the number range when the run is started.
model.tl.bpe.execution.ProcessExecution.executionState = State
model.tl.bpe.execution.ProcessExecution.executionState.tooltip = The state of the run. A new run is active; it is finished as soon as an end event is reached.
model.tl.bpe.execution.ProcessExecution.process = Process
model.tl.bpe.execution.ProcessExecution.process.tooltip = The process of the collaboration that is run here.
model.tl.bpe.execution.ProcessExecution.tooltip = A single run of a workflow. Its tasks are created at the process instance, and it is the object the forms of the workflow work on.
model.tl.bpe.execution.ProcessExecution.userRelevantTokens = Actual jobs
model.tl.bpe.execution.ProcessExecution.userRelevantTokens.tooltip = The active tasks that a user has to work on. Tasks the workflow execution passes through on its own are not contained. The value is computed.
model.tl.bpe.execution.Token = Token
model.tl.bpe.execution.Token.active = Active
model.tl.bpe.execution.Token.active.tooltip = Whether the task is still to be done. The value is computed.
model.tl.bpe.execution.Token.actor = Actor
model.tl.bpe.execution.Token.actor.tooltip = The role that has to work on the task. The value is the designation of the lane the node of the task lies in.
model.tl.bpe.execution.Token.durationInMinutes = Duration (min)
model.tl.bpe.execution.Token.durationInMinutes.tooltip = The time in minutes the task has been open, and the time it was open until it was completed. The value is computed.
model.tl.bpe.execution.Token.executionNumber = Number
model.tl.bpe.execution.Token.executionNumber.tooltip = The number of the run this task belongs to. The value is taken from the process instance.
model.tl.bpe.execution.Token.finishBy = Finish by
model.tl.bpe.execution.Token.finishBy.tooltip = The account that completed the task.
model.tl.bpe.execution.Token.finishDate = Finish date
model.tl.bpe.execution.Token.finishDate.tooltip = The point in time at which the task was completed. Empty as long as the task is still open.
model.tl.bpe.execution.Token.name = Name
model.tl.bpe.execution.Token.name.tooltip = The designation of the task. It is computed from the designation of the task description of the workflow, into which the data of the process instance are filled.
model.tl.bpe.execution.Token.next = Next job
model.tl.bpe.execution.Token.next.tooltip = The tasks the run continued with after this task.
model.tl.bpe.execution.Token.node = Task
model.tl.bpe.execution.Token.node.tooltip = The node of the process diagram this task was created for.
model.tl.bpe.execution.Token.previous = Previous job
model.tl.bpe.execution.Token.previous.tooltip = The tasks from which the run reached this task.
model.tl.bpe.execution.Token.processExecution = Process
model.tl.bpe.execution.Token.processExecution.tooltip = The run this task belongs to. A task is deleted together with its run.
model.tl.bpe.execution.Token.startDate = Start date
model.tl.bpe.execution.Token.startDate.tooltip = The point in time at which the task arose. The value is the creation time of the task.
model.tl.bpe.execution.Token.tooltip = A specific task within a process execution. The task is defined by the task description of a workflow and is displayed and executed with the data of the process execution object.
model.tl.bpe.execution.Token.userRelevant = User relevant
model.tl.bpe.execution.Token.userRelevant.tooltip = Whether the task has to be worked on by a user. Tasks the workflow execution passes through on its own are not relevant for a user. The value is computed.
model.tl.bpe.execution.tooltip = Module with the types that describe the run of a workflow: the process instance and the tasks arising in it.
