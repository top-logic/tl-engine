com.top_logic.tl.ai.core.tools.web.TavilySearchEngine.Config.include-answer.tooltip = Ob eine synthetische Antwort von Tavily angefordert werden soll.
com.top_logic.tl.ai.core.tools.web.TavilySearchEngine.Config.include-raw-content = Rohinhalte einbeziehen
com.top_logic.tl.ai.core.tools.web.TavilySearchEngine.Config.include-raw-content.tooltip = Ob der gesamte Rohseiteninhalt pro Ergebnis angefordert werden soll.
