com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.url.tooltip = Die URL des MCP-Server-Endpunkts (z. B. "https://mcp.example.com/mcp").
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.tooltip = <i>Mcp-Transportkonfiguration</i>, die einen MCP-HTTP-Transport (Streamable HTTP) erstellt. <p> Der MCP-Server läuft als externer HTTP-Dienst. Die Authentifizierung erfolgt über statische Header oder ein Bearer-Token, das zur Verbindungszeit aus einer Umgebungsvariablen aufgelöst wird. </p>
com.top_logic.tl.ai.core.mcp.McpServerRegistry = Mcp-Server-Register
