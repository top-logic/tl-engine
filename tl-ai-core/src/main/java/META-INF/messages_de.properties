class.com.top_logic.tl.ai.core.security.layout.I18NConstants.WARN_ROLE_UNREACHABLE_ON_ROOT__ROLE.help = Die schichtübergreifende Warnung bezüglich einer Rolle, die niemand innehaben kann, wenn der Zugriff auf Tools anhand von Rollen erfolgt.
class.com.top_logic.tl.ai.core.security.layout.I18NConstants.WARN_SCRIPT_WITHOUT_DATA_WRITE__ROLE = Die Rolle {0} darf TL-Script ausführen, aber keine Daten ändern. Das Persistieren von Skript-Änderungen wird verweigert.
class.com.top_logic.tl.ai.core.security.layout.I18NConstants.WARN_SCRIPT_WITHOUT_DATA_WRITE__ROLE.help = Hinweis: Eine Rolle darf TL-Script ausführen, aber keine Daten ändern, kann also nichts persistieren.
class.com.top_logic.tl.ai.core.security.layout.I18NConstants.WARN_SCRIPT_WITH_DATA_WRITE__ROLE = Die Rolle {0} darf TL-Script ausführen und Daten ändern: Per Skript ist jede Datenänderung ausdrückbar. Jede bleibt im Gespräch bestätigungspflichtig.
class.com.top_logic.tl.ai.core.security.layout.I18NConstants.WARN_SCRIPT_WITH_DATA_WRITE__ROLE.help = Hinweis: Eine Rolle darf TL-Script ausführen und Daten ändern, was zusammen jede Änderung ausdrückt.
class.com.top_logic.tl.ai.core.security.layout.I18NConstants.WHERE_BACKGROUND_ALLOWLIST = Hintergrund-Zulassungsliste
class.com.top_logic.tl.ai.core.security.layout.I18NConstants.WHERE_BACKGROUND_ALLOWLIST.help = Benennt die Obergrenze innerhalb einer Meldung über einen ihrer Einträge.
class.com.top_logic.tl.ai.core.security.layout.I18NConstants.WHERE_BASELINE = Grundberechtigungen
class.com.top_logic.tl.ai.core.security.layout.I18NConstants.WHERE_BASELINE.help = Benennt die Grundberechtigungen innerhalb einer Meldung über einen ihrer Einträge.
class.com.top_logic.tl.ai.core.security.layout.I18NConstants.WHERE_ROLE_DENIES__ROLE = Rolle {0}, Verbote
class.com.top_logic.tl.ai.core.security.layout.I18NConstants.WHERE_ROLE_DENIES__ROLE.help = Benennt die Verbote einer Rolle innerhalb einer Meldung über einen ihrer Einträge.
class.com.top_logic.tl.ai.core.security.layout.I18NConstants.WHERE_ROLE_GRANTS__ROLE = Rolle {0}, Berechtigungen
class.com.top_logic.tl.ai.core.security.layout.I18NConstants.WHERE_ROLE_GRANTS__ROLE.help = Benennt die Berechtigungen einer Rolle innerhalb einer Meldung über einen ihrer Einträge.
com.top_logic.tl.ai.core.access.AccessTokenAuthentication = Persönliches Zugriffstoken
com.top_logic.tl.ai.core.access.AccessTokenAuthentication.Config.separate-secret-needed.tooltip = Nie: Die Tokens erstellen die Personen, denen sie gehören; sie werden nicht konfiguriert.
com.top_logic.tl.ai.core.access.AccessTokenAuthentication.tooltip = Authentifiziert einen Aufrufer anhand eines persönlichen Zugriffstokens im Header "Authorization: Bearer", gefolgt vom Token. <p> Die Tokens werden nicht konfiguriert: Jede Person erstellt ihre eigenen in der Anwendung, und eine Anfrage handelt als diese Person. Dieses Verfahren braucht daher kein Secret - es zu konfigurieren ist die ganze Entscheidung, persönliche Zugriffstokens anzunehmen. Format und Speicherung beschreibt <i>Zugriffstokens</i>, das Einschalten der Entwicklerartikel ai/security/mcp-endpoint. </p>
com.top_logic.tl.ai.core.access.AccessTokenFunctions.accessTokenCreate = Zugriffstoken erstellen
com.top_logic.tl.ai.core.access.AccessTokenFunctions.accessTokenCreate.param.name.tooltip = Wie der Eigentümer das Token nennt, üblicherweise nach dem Client, für den es gedacht ist.
com.top_logic.tl.ai.core.access.AccessTokenFunctions.accessTokenCreate.param.validForDays.tooltip = Wie viele Tage ab jetzt das Token angenommen wird. Leer für ein Token, das nicht abläuft.
com.top_logic.tl.ai.core.access.AccessTokenFunctions.accessTokenCreate.return = Das Token, beginnend mit <code>tlpat_</code>.
com.top_logic.tl.ai.core.access.AccessTokenFunctions.accessTokenCreate.tooltip = Erstellt ein persönliches Zugriffstoken für das Konto, das das Skript ausführt, und gibt das Token zurück. <p> Das zurückgegebene Token ist die einzige Kopie: Gespeichert wird nur sein Hash. Zeigen Sie es seinem Eigentümer daher einmal und bewahren Sie es nirgends auf. </p> <p> Beispiel: <code>aiAccessTokenCreate("Claude Code laptop", 90)</code> </p>
com.top_logic.tl.ai.core.access.AccessTokenFunctions.accessTokenRevoke = Zugriffstoken widerrufen
com.top_logic.tl.ai.core.access.AccessTokenFunctions.accessTokenRevoke.param.token.tooltip = Das zu widerrufende <code>tl.ai.access:AccessToken</code>.
com.top_logic.tl.ai.core.access.AccessTokenFunctions.accessTokenRevoke.return = Immer <code>true</code>; eine Ablehnung ist ein Fehler, kein <code>false</code>.
com.top_logic.tl.ai.core.access.AccessTokenFunctions.accessTokenRevoke.tooltip = Widerruft ein persönliches Zugriffstoken: Die nächste Anfrage mit diesem Token wird abgewiesen. <p> Der Eigentümer widerruft seine eigenen Tokens, ein Administrator jedes Token. </p>
com.top_logic.tl.ai.core.access.EndpointSecret$ApiKey = API-Schlüssel
com.top_logic.tl.ai.core.access.EndpointSecret$ApiKey.tooltip = Ein API-Schlüssel und das Konto, als das eine Anfrage mit diesem Schlüssel handelt. <p> Eine &lt;api-key-authentication&gt; derselben Domain prüft den Schlüssel. </p>
com.top_logic.tl.ai.core.access.EndpointSecret$ClientCredentials = OpenID-Authentifizierung
com.top_logic.tl.ai.core.access.EndpointSecret$ClientCredentials.tooltip = Die Client-Zugangsdaten, mit denen der Endpunkt-Dienst OAuth-Bearer-Token prüft. <p> Eine &lt;client-credentials-authentication&gt; derselben Domain verwendet sie. </p>
com.top_logic.tl.ai.core.access.EndpointSecret.ApiKey.user-id = Benutzer-ID
com.top_logic.tl.ai.core.access.EndpointSecret.ApiKey.user-id.tooltip = Der Anmeldename des Kontos, als das eine Anfrage mit diesem Schlüssel handelt. <p> In der Praxis erforderlich: Für einen Schlüssel ohne Konto verarbeitet das Framework die Anfrage im Systemkontext, und ein Agenten-Endpunkt lehnt eine solche Anfrage ab. </p>
com.top_logic.tl.ai.core.access.EndpointSecret.owner = Eigentümer
com.top_logic.tl.ai.core.access.EndpointSecret.owner.tooltip = Die Konfiguration des Endpunkt-Dienstes, zu dem dieses Geheimnis gehört.
com.top_logic.tl.ai.core.agent.AgentApplicationService = Anwendungswissen der Agenten
com.top_logic.tl.ai.core.agent.AgentApplicationService.Config.environment = Umgebung
com.top_logic.tl.ai.core.agent.AgentApplicationService.Config.environment.tooltip = Was jedem ausgeführten Agenten über die Situation mitgeteilt wird, in der er ausgeführt wird: der Wortlaut des Umgebungsblocks und der Anwendungsname, der dem Modell zugewiesen wird.
com.top_logic.tl.ai.core.agent.AgentApplicationService.Config.object-ids = Objekt-IDs
com.top_logic.tl.ai.core.agent.AgentApplicationService.Config.object-ids.tooltip = Was diese Anwendung über die Identifikatoren weiß, die ein Modell an ein Tool übergibt: die Codes, die ihre eigenen Nutzer verwenden, und was einem Modell mitzuteilen ist, das einen solchen Code anstelle einer Objekt-ID übergeben hat.
com.top_logic.tl.ai.core.agent.AgentApplicationService.Config.prompt-contributors = Prompt-Beiträge
com.top_logic.tl.ai.core.agent.AgentApplicationService.Config.prompt-contributors.tooltip = Dauerhafte Anweisungen, die diese Anwendung bei jedem Agentenlauf zur Systemaufforderung hinzufügt. <p> Für Hausregeln, die zur Anwendung und nicht zu einem bestimmten Agenten gehören, damit sie nicht in jeden Agenten geschrieben und nicht bei jedem Zug wiederholt werden müssen. Jeder Eintrag wird einmal pro Durchlauf in der hier aufgeführten Reihenfolge abgefragt, und die Antwort ist Teil der zwischengespeicherten Eingabeaufforderung – daher muss sie während des gesamten Gesprächs immer gleich lauten. Der Anwendungskontext, den Alberts TL_init-Skill schreibt, ist einer davon. Eine Änderung wird wirksam, wenn dieser Dienst neu gestartet wird. </p>
com.top_logic.tl.ai.core.agent.AgentApplicationService.tooltip = Was ein Agent über diese Anwendung weiß: wie sie heißt, wie der Umgebungsblock formuliert ist, welche Bezeichner ihre Benutzer verwenden und welche festen Anweisungen bei jedem Durchlauf erteilt werden – darunter auch der Anwendungskontext von TL_init. <p> Entwicklungsmaterial: Es gehört in den Quellcode der Anwendung und wird von den Entwicklern verfasst, die die Anwendung erstellen; es wird in der Produktion nicht geändert. Eine Änderung wird wirksam, wenn dieser Dienst neu gestartet wird; nichts anderes wird dabei neu gestartet. </p> <p> Teil der Aufteilung des ehemaligen LLMService (Gitea #691). </p>
com.top_logic.tl.ai.core.agent.AgentCapabilities$Unusable$Cause = Ursache
com.top_logic.tl.ai.core.agent.AgentCapabilities$Unusable$Cause.tooltip = Warum ein Agent für das handelnde Konto eines Laufs nutzlos ist.
com.top_logic.tl.ai.core.agent.AgentCapabilities.Unusable.Cause.AGENTS_OWN_DENIED = Eigenes Modell oder eigener Server ausgeschlossen
com.top_logic.tl.ai.core.agent.AgentCapabilities.Unusable.Cause.AGENTS_OWN_DENIED.tooltip = Das dem Agenten zugewiesene Modell oder ein Server, den er angibt, ist für dieses Konto ausgeschlossen.
com.top_logic.tl.ai.core.agent.AgentCapabilities.Unusable.Cause.AGENT_WITHHELD = Agent nicht freigegeben
com.top_logic.tl.ai.core.agent.AgentCapabilities.Unusable.Cause.AGENT_WITHHELD.tooltip = Keine Rolle des handelnden Kontos ist für diesen Agenten freigegeben.
com.top_logic.tl.ai.core.agent.AgentCapabilities.Unusable.Cause.INFRASTRUCTURE = Infrastruktur
com.top_logic.tl.ai.core.agent.AgentCapabilities.Unusable.Cause.INFRASTRUCTURE.tooltip = Der Agent gehört zur Infrastruktur: Die Anwendung führt ihn für einen Benutzer aus, niemand delegiert an ihn.
com.top_logic.tl.ai.core.agent.AgentCapabilities.Unusable.Cause.NO_REACHABLE_TOOL = Kein erreichbares Tool
com.top_logic.tl.ai.core.agent.AgentCapabilities.Unusable.Cause.NO_REACHABLE_TOOL.tooltip = Das Konto darf den Agenten ausführen, aber keines der Tools, die der Agent erreicht, ist diesem Lauf erlaubt.
com.top_logic.tl.ai.core.agent.AgentCapabilities.Unusable.Cause.TYPE_UNREADABLE = Typ nicht lesbar
com.top_logic.tl.ai.core.agent.AgentCapabilities.Unusable.Cause.TYPE_UNREADABLE.tooltip = Jedes verbleibende Tool arbeitet auf Modelltypen, die dieses Konto nicht lesen darf.
com.top_logic.tl.ai.core.agent.AgentPolicyService = Agenten-Richtlinien
com.top_logic.tl.ai.core.agent.AgentPolicyService.Config.budget = Budget
com.top_logic.tl.ai.core.agent.AgentPolicyService.Config.budget.tooltip = Wie viele Token und wie viel Geld ein Konto in einem gleitenden Zeitfenster ausgeben darf, und die Währung, in der diese Installation die Kosten eines Laufs angibt.
com.top_logic.tl.ai.core.agent.AgentPolicyService.Config.max-preferences-length = Maximale Länge der Präferenzen
com.top_logic.tl.ai.core.agent.AgentPolicyService.Config.max-preferences-length.tooltip = Wie lang der Präferenztext eines Kontos sein darf, in Zeichen. <p> Der Text geht in jede einzelne Anfrage dieses Kontos, seine Länge wird also in jedem Turn jeder Konversation bezahlt. Ein längerer Text wird bei der Eingabe abgelehnt, mit einer Meldung, die die Grenze nennt. </p>
com.top_logic.tl.ai.core.agent.AgentPolicyService.Config.user-memory = Benutzerspeicher
com.top_logic.tl.ai.core.agent.AgentPolicyService.Config.user-memory.tooltip = Was sich ein Agent möglicherweise über die Konten dieser Installation merkt: ob er sich überhaupt daran erinnert, in welchem Umfang diese Informationen in ein Modell einfließen und nach welchen Begriffen der Vertragscheck sucht.
com.top_logic.tl.ai.core.agent.AgentPolicyService.Config.user-preferences = Benutzerpräferenzen
com.top_logic.tl.ai.core.agent.AgentPolicyService.Config.user-preferences.tooltip = Ob die eigenen Präferenztexte der Konten Teil des Umgebungsblocks sind. <p> Abgeschaltet erreicht kein Präferenztext ein Modell, gleich was die Konten geschrieben haben. Die Texte bleiben erhalten - dies ist ein Schalter darüber, was gesendet wird, nicht darüber, was gespeichert ist - so dass ein Wiedereinschalten sie zurückbringt. </p>
com.top_logic.tl.ai.core.agent.AgentPolicyService.tooltip = Was ein Agentenlauf kosten darf und was ein Agent über eine Person behalten darf: das Token- und Geldbudget eines Kontos, die Erinnerungen, die ein Agent über Unterhaltungen hinweg behält, und der Präferenztext, den ein Konto jedem Agenten mitgibt. <p> Wird von der Administration festgelegt - und, was über eine Person behalten wird, vom Datenschutz. Eine Änderung wirkt, wenn dieser Dienst neu gestartet wird; nichts anderes startet mit ihm neu. </p> <p> Teil der Aufteilung des früheren LLMService (Gitea #691). </p>
com.top_logic.tl.ai.core.agent.AgentRuntimeService = Agenten-Laufzeit
com.top_logic.tl.ai.core.agent.AgentRuntimeService$AgentOverride = Agenten-Überschreibung
com.top_logic.tl.ai.core.agent.AgentRuntimeService$AgentOverride.tooltip = Überschreibung pro Agent für Modellauswahl und Ausführungsparameter. <p> Jeder Eintrag setzt das Standardmodell für einen bestimmten Agenten außer Kraft und konfiguriert optional Ausführungsparameter (maximale Durchläufe, Timeouts, Tool-Auswahl) und modellspezifische Einstellungen (Temperatur, Reasoning-Aufwand). Parameter, die auf Null gesetzt werden, erben die Vorgaben aus dem Modellkatalog oder die Systemvorgaben. </p>
com.top_logic.tl.ai.core.agent.AgentRuntimeService.AgentOverride.context-window = Kontext-Fenster
com.top_logic.tl.ai.core.agent.AgentRuntimeService.AgentOverride.context-window.tooltip = Größe des Kontext-Fensters überschreiben, oder null für Katalogstandard.
com.top_logic.tl.ai.core.agent.AgentRuntimeService.AgentOverride.max-retries = Maximale Wiederholungsversuche
com.top_logic.tl.ai.core.agent.AgentRuntimeService.AgentOverride.max-retries.tooltip = Wie oft ein ratenbegrenztes oder überlastetes Modell erneut abgefragt wird, bevor der Lauf fehlschlägt oder auf das Fallback-Modell wechselt; standardmäßig „null“. Der Wert 0 deaktiviert die Wiederholungsversuche. <p> Ein ratenbegrenzter Lauf, für den kein Fallback-Modell mehr verfügbar ist, führt so lange Wiederholungsversuche durch, wie es die Wartezeit für die Ratenbegrenzung im Failover-Abschnitt der <i>LLM-Anbieter</i> zulässt. </p>
com.top_logic.tl.ai.core.agent.AgentRuntimeService.AgentOverride.max-tokens = Maximale Token
com.top_logic.tl.ai.core.agent.AgentRuntimeService.AgentOverride.max-tokens.tooltip = Maximale Ausgabe-Token pro LLM-Aufruf oder null für Katalogstandard.
com.top_logic.tl.ai.core.agent.AgentRuntimeService.AgentOverride.max-tool-result-chars = Maximale Zeichenanzahl für das Tool-Ergebnis
com.top_logic.tl.ai.core.agent.AgentRuntimeService.AgentOverride.max-tool-result-chars.tooltip = Maximale Anzahl von Zeichen pro Tool-Ergebnis oder null als Standard.
com.top_logic.tl.ai.core.agent.AgentRuntimeService.AgentOverride.max-turns = Maximale Durchläufe
com.top_logic.tl.ai.core.agent.AgentRuntimeService.AgentOverride.max-turns.tooltip = Maximale Durchläufe der Agentenschleife oder null als Standard.
com.top_logic.tl.ai.core.agent.AgentRuntimeService.AgentOverride.model = Modell
com.top_logic.tl.ai.core.agent.AgentRuntimeService.AgentOverride.model.tooltip = Das für diesen Agenten zu verwendende Modell.
com.top_logic.tl.ai.core.agent.AgentRuntimeService.AgentOverride.provider = Anbieter
com.top_logic.tl.ai.core.agent.AgentRuntimeService.AgentOverride.provider.tooltip = Der Anbieter, der das Modell dieses Agenten bedient, oder leer, wenn nur ein Anbieter es anbietet. <p> Einen Anbieter benennen, wenn zwei Anbietereinträge dasselbe Modell anbieten - getrennte Konten oder ein offizieller Endpunkt neben einem Gateway. Bleibt er bei einem doppelt angebotenen Modell leer, verweigert der Dienst den Start. Ein Agent, der das Standardmodell erbt, erbt auch den Standardanbieter. </p>
com.top_logic.tl.ai.core.agent.AgentRuntimeService.AgentOverride.reasoning-effort = Reasoning-Aufwand
com.top_logic.tl.ai.core.agent.AgentRuntimeService.AgentOverride.reasoning-effort.tooltip = <code>xAI</code> Begründungsaufwand (niedrig/mittel/hoch) oder Null.
com.top_logic.tl.ai.core.agent.AgentRuntimeService.AgentOverride.reasoning-summary = Reasoning-Zusammenfassung
com.top_logic.tl.ai.core.agent.AgentRuntimeService.AgentOverride.reasoning-summary.tooltip = <code>xAI</code> Zusammenfassung der Gründe (automatisch/ausführlich) oder Null.
com.top_logic.tl.ai.core.agent.AgentRuntimeService.AgentOverride.temperature = Temperatur
com.top_logic.tl.ai.core.agent.AgentRuntimeService.AgentOverride.temperature.tooltip = Sampling-Temperatur oder null als Standardwert.
com.top_logic.tl.ai.core.agent.AgentRuntimeService.AgentOverride.thinking-effort = Thinking-Aufwand
com.top_logic.tl.ai.core.agent.AgentRuntimeService.AgentOverride.thinking-effort.tooltip = Anthropic Thinking-Aufwand (low/medium/high/max) oder null.
com.top_logic.tl.ai.core.agent.AgentRuntimeService.AgentOverride.timeout-seconds = Zeitüberschreitung in Sekunden
com.top_logic.tl.ai.core.agent.AgentRuntimeService.AgentOverride.timeout-seconds.tooltip = Anfrage-Timeout in Sekunden oder null als Standard.
com.top_logic.tl.ai.core.agent.AgentRuntimeService.AgentOverride.tool-choice = Tool-Auswahl
com.top_logic.tl.ai.core.agent.AgentRuntimeService.AgentOverride.tool-choice.tooltip = Tool-Auswahl (AUTO/REQUIRED/NONE) oder null für den Standardwert des Anbieters.
com.top_logic.tl.ai.core.agent.AgentRuntimeService.AgentOverride.top-k = Top-K
com.top_logic.tl.ai.core.agent.AgentRuntimeService.AgentOverride.top-k.tooltip = Anthropic Top-K-Parameter oder null.
com.top_logic.tl.ai.core.agent.AgentRuntimeService.AgentOverride.top-p = Top-P
com.top_logic.tl.ai.core.agent.AgentRuntimeService.AgentOverride.top-p.tooltip = Top-p-Sampling-Parameter oder null als Standard.
com.top_logic.tl.ai.core.agent.AgentRuntimeService.Config.agent-overrides = Agenten-Überschreibungen
com.top_logic.tl.ai.core.agent.AgentRuntimeService.Config.agent-overrides.tooltip = Agentenspezifische Überschreibungen. Hier nicht aufgeführte Agenten verwenden das Standardmodell. Gilt für alle Agenten, unabhängig von ihrer Quelle (in der Konfiguration definiert oder aus der Wissensdatenbank).
com.top_logic.tl.ai.core.agent.AgentRuntimeService.Config.capacity = Kapazität
com.top_logic.tl.ai.core.agent.AgentRuntimeService.Config.capacity.tooltip = Wie viele Agent-Prozesse diese Installation gleichzeitig ausführt. <p> Die Anzahl der Chat-Mitarbeiter und die Länge ihrer Warteschlange werden bei jedem Anwendungsstart einmal ausgelesen; eine Änderung dieser beiden Werte wird erst nach einem Neustart der Anwendung wirksam. </p>
com.top_logic.tl.ai.core.agent.AgentRuntimeService.Config.chat-entry-point = Chat-Einstiegspunkt
com.top_logic.tl.ai.core.agent.AgentRuntimeService.Config.chat-entry-point.tooltip = Der Agent, der als Haupteinstiegspunkt dient, wenn ein Benutzer eine neue Chatsitzung eröffnet. <p> Dieser Agent empfängt die anfängliche Benutzernachricht und organisiert die Unterhaltung. Er kann über seine Delegationsliste an andere Agenten delegieren. </p>
com.top_logic.tl.ai.core.agent.AgentRuntimeService.Config.default-model = Standardmodell
com.top_logic.tl.ai.core.agent.AgentRuntimeService.Config.default-model.tooltip = Das Modell, auf dem jeder Agent läuft, der kein eigenes Modell im Agenten enthält, wird überschrieben. <p> Wird dieses Feld leer gelassen, kann ein Agent ohne eigenes Modell nicht ausgeführt werden und gibt dies beim Start bekannt. Ein hier angegebenes Modell muss von einem der LLM-Anbieter bereitgestellt werden – andernfalls startet dieser Dienst nicht. </p>
com.top_logic.tl.ai.core.agent.AgentRuntimeService.Config.default-provider = Standardanbieter
com.top_logic.tl.ai.core.agent.AgentRuntimeService.Config.default-provider.tooltip = Der Anbieter, der das Standardmodell bedient, oder leer, wenn nur ein Anbieter es anbietet. <p> Gilt für jeden Agenten ohne eigenen Anbieter. Bleibt er leer, während zwei Anbieter das Standardmodell anbieten, verweigert der Dienst den Start, anstatt einen nach Konfigurationsreihenfolge zu wählen. </p>
com.top_logic.tl.ai.core.agent.AgentRuntimeService.Config.max-turns = Maximale Durchläufe
com.top_logic.tl.ai.core.agent.AgentRuntimeService.Config.max-turns.tooltip = Wie viele Durchläufe ein Agentenlauf durchlaufen kann, wenn in seiner Überschreibung keine eigene Begrenzung angegeben ist. <p> Ein Durchlauf entspricht einem Aufruf des Modells, der mehrere Tool-Aufrufe umfassen kann. Ein Durchlauf, der das Limit erreicht, wird beendet; somit stellt dies die Obergrenze für ein Modell dar, das in einer Schleife läuft – und auch für eine lange Aufgabe, die dies nicht tut. </p>
com.top_logic.tl.ai.core.agent.AgentRuntimeService.Config.run-observers = Lauf-Beobachter
com.top_logic.tl.ai.core.agent.AgentRuntimeService.Config.run-observers.tooltip = Was von jedem Agentenlauf dieser Anwendung erfährt, von seinem Start bis zu seinem Ende. <p> Standardmäßig keiner. Ein Beobachter sieht, was der Lauf sieht; einer, der es aus der Anwendung hinausreicht, muss das selbst absichern - siehe <i>Lauf-Beobachter</i>. </p>
com.top_logic.tl.ai.core.agent.AgentRuntimeService.Config.security-context = Sicherheitskontext
com.top_logic.tl.ai.core.agent.AgentRuntimeService.Config.security-context.tooltip = Was für jeden Agentenlauf entscheidet, welche Tool-Aufrufe von einer Person bestätigt werden müssen. <p> Die ausgelieferte Voreinstellung fragt den Modus des Tools: ein Lesezugriff läuft, alles, was etwas ändert, wird bestätigt. Eine Anwendung, deren Antwort davon abhängt, was geändert wird - einen leeren Abschnitt zu überschreiben ist nicht dasselbe, wie zu überschreiben, was ein Kollege geschrieben hat -, benennt hier ihre eigene Implementierung. </p>
com.top_logic.tl.ai.core.agent.AgentRuntimeService.tooltip = Welcher Agent wie ausgeführt wird: das Modell, auf dem der jeweilige Agent läuft, seine Ausführungsparameter, wie viele Läufe die Installation gleichzeitig ausführt, mit welchem Agenten ein Chat beginnt und woran es abhängt, welche Tool-Aufrufe eine Person bestätigen muss. <p> Wird von Betrieb und Entwicklung festgelegt. Die darin genannten Modelle stammen von <i>LLM-Anbietern</i>, wobei angegeben ist, wie diese erreicht werden; dieser Dienst ist davon abhängig, prüft beim Start, ob jedes der genannten Modelle von genau einem seiner Anbieter (oder vom dafür angegebenen Anbieter) bereitgestellt wird, und wird mit diesem neu gestartet. Ein Neustart dieses Dienstes hat keine Auswirkungen auf die Anbieter: Es wird kein Katalog abgerufen, und die bekannten Informationen zum Zustand jedes Modells bleiben erhalten. </p> <p> Teil der Aufteilung des früheren LLMService (Gitea #691); was einem Agenten über die Anwendung mitgeteilt wird, ist <i>im Anwendungswissen des Agenten</i> enthalten, was eine Ausführung kosten darf und welche Informationen über eine Person gespeichert werden dürfen, ist in <i>der Agentenrichtlinie</i> festgelegt. </p>
com.top_logic.tl.ai.core.agent.AgentSource = Quelle: Agent
com.top_logic.tl.ai.core.agent.AgentSource.CONFIG = Konfiguration
com.top_logic.tl.ai.core.agent.AgentSource.CONFIG.tooltip = Definiert in der Dienstkonfigurations-XML (von TopLogic bereitgestellt, schreibgeschützt).
com.top_logic.tl.ai.core.agent.AgentSource.KB = Wissensbasis
com.top_logic.tl.ai.core.agent.AgentSource.KB.tooltip = Definiert in der Wissensbasis (anwendungsspezifisch).
com.top_logic.tl.ai.core.agent.AgentSource.KB_OVERRIDE = Überschreibung der Wissensbasis
com.top_logic.tl.ai.core.agent.AgentSource.KB_OVERRIDE.tooltip = KB-Agent, der einen konfigurationsdefinierten Agenten mit demselben Namen außer Kraft setzt.
com.top_logic.tl.ai.core.agent.AgentSource.tooltip = Ursprung einer Agenten- oder Skill-Definition.
com.top_logic.tl.ai.core.agent.AllAgentNamesGenerator = Generator für alle Agentennamen
com.top_logic.tl.ai.core.agent.AllAgentNamesGenerator.tooltip = <i>Listengenerator-Adapter</i>, der alle verfügbaren Agenten-Namen als Optionen bereitstellt. <p> Stellt die Optionen für das Attribut „delegations“ von tl.ai.core:Agent bereit. </p> <p> Ein Agent <code>AgentDefinition#infrastructure()</code> wird nicht angeboten: Die Anwendung führt ihn für einen Benutzer aus, und das Gate lehnt eine Delegation an ihn ab, sodass eine Option, die diesen Agent benennt, niemals funktionieren würde. </p>
com.top_logic.tl.ai.core.agent.AllMcpServerNamesGenerator = Generator für alle mcp-Servernamen
com.top_logic.tl.ai.core.agent.AllMcpServerNamesGenerator.tooltip = <i>Listengenerator-Adapter</i>, der alle konfigurierten MCP-Servernamen als Optionen bereitstellt. <p> Stellt die Optionen für das Attribut „mcpServers“ von tl.ai.core:Agent bereit. </p>
com.top_logic.tl.ai.core.agent.AllModelNamesGenerator = Generator für alle Modellnamen
com.top_logic.tl.ai.core.agent.AllModelNamesGenerator.tooltip = <i>Listengenerator-Adapter</i>, der explizit konfigurierte Namen von KI-Modellen als Optionen bereitstellt. <p> Gibt nur Modelle zurück, die ein Administrator zur Zulassungsliste eines Anbieters hinzugefügt hat, und schließt Modelle aus, die lediglich über die API des Anbieters erkannt wurden. Stellt die Optionen für das Attribut „model“ von tl.ai.core:Agent bereit. </p>
com.top_logic.tl.ai.core.agent.AllSkillNamesGenerator = Generator für alle Skill-Namen
com.top_logic.tl.ai.core.agent.AllSkillNamesGenerator.tooltip = <i>Listengenerator-Adapter</i>, der alle verfügbaren Skill-Namen als Optionen bereitstellt. <p> Stellt die Optionen für das Attribut „skills“ von tl.ai.core:Agent bereit. </p>
com.top_logic.tl.ai.core.agent.AllToolNamesGenerator = Generator für alle Toolnamen
com.top_logic.tl.ai.core.agent.AllToolNamesGenerator.tooltip = <i>Listengenerator-Adapter</i>, der alle verfügbaren Toolnamen als Optionen bereitstellt. <p> Stellt die Optionen für das Attribut „tools“ von tl.ai.core:Agent bereit. </p>
com.top_logic.tl.ai.core.agent.DelegationRef = Referenz der Delegation
com.top_logic.tl.ai.core.agent.DelegationRef.tooltip = <i>Namensreferenz-Subtyp</i>, der verfügbare Agentennamen als Delegationsoptionen bereitstellt.
com.top_logic.tl.ai.core.agent.ExecutionMode = Ausführungsmodus
com.top_logic.tl.ai.core.agent.ExecutionMode.DEVELOPMENT = Entwicklung
com.top_logic.tl.ai.core.agent.ExecutionMode.DEVELOPMENT.tooltip = Entwicklungsumgebung. Alle Toolmodi sind zulässig.
com.top_logic.tl.ai.core.agent.ExecutionMode.MAINTENANCE = Wartung
com.top_logic.tl.ai.core.agent.ExecutionMode.MAINTENANCE.tooltip = Wartungsfenster aktiv. Alle Toolmodi erlaubt.
com.top_logic.tl.ai.core.agent.ExecutionMode.PRODUCTION = Produktion
com.top_logic.tl.ai.core.agent.ExecutionMode.PRODUCTION.tooltip = Produktionsumgebung. STRUCTURAL Tools werden vom System verweigert.
com.top_logic.tl.ai.core.agent.ExecutionMode.tooltip = Der aktuelle Ausführungsmodus des Systems. <p>Beeinflusst, welche Tools das System zulässt. STRUCTURAL-Tools (Tools, die die Anwendungsstruktur verändern) sind nur im <i>Entwicklungs-</i> und <i>Wartungsmodus</i> erlaubt, niemals im <i>Produktionsmodus</i>.</p> <p>Das Bridge-Modul führt die beiden Betriebsachsen von TopLogic auf diese eine zusammen: das Wartungsfenster zur Laufzeit (MaintenanceWindowManager) und die beim Start festgelegte Umgebung, die der OperationModeService der Engine meldet.</p>
com.top_logic.tl.ai.core.agent.ExportToDataFolderCommand = Befehl "In Datenordner exportieren
com.top_logic.tl.ai.core.agent.ExportToDataFolderCommand.Config.file-name = Name der Datei
com.top_logic.tl.ai.core.agent.ExportToDataFolderCommand.Config.file-name.tooltip = Name der Ausgabedatei, z. B. <code>agents.objects.xml</code>.
com.top_logic.tl.ai.core.agent.ExportToDataFolderCommand.Config.type-name = Name des Typs
com.top_logic.tl.ai.core.agent.ExportToDataFolderCommand.Config.type-name.tooltip = Qualifizierter TL-Typ-Name in der Form <code>module:type</code>, z. B. <code>tl.ai.core:Agent</code>.
com.top_logic.tl.ai.core.agent.ExportToDataFolderCommand.tooltip = Befehlshandler, der alle Instanzen eines konfigurierten TL-Typs in eine XML-Datei im Ordner <code>WEB-INF/data/</code> der Anwendung exportiert. <p> Dies ist für Entwicklungsworkflows gedacht, bei denen persistente Objektdefinitionen zurück in den Quellbaum exportiert werden müssen. </p>
com.top_logic.tl.ai.core.agent.ImportFromDataFolderCommand = Befehl "Aus Datenordner importieren
com.top_logic.tl.ai.core.agent.ImportFromDataFolderCommand.Config.file-name = Name der Datei
com.top_logic.tl.ai.core.agent.ImportFromDataFolderCommand.Config.file-name.tooltip = Name der Quelldatei in WEB-INF/data/, z. B. agents.objects.xml.
com.top_logic.tl.ai.core.agent.ImportFromDataFolderCommand.tooltip = Befehlshandler, der eine *.objects.xml-Datei aus <code>WEB-INF/data/</code> erneut in die laufende Wissensdatenbank importiert, wobei alle Laufzeitänderungen an den betroffenen Instanzen verworfen und die im Quellbaum festgeschriebenen Werte wiederhergestellt werden. <p> Dies ist die Umkehrung des <i>Befehls „In Datenordner exportieren“</i>: Während die Schaltfläche „Exportieren“ den Laufzeitzustand zurück in die XML-Datei im Entwicklungsarbeitsbereich schreibt, übernimmt dieser Befehl die XML-Datei, die sich derzeit im Entwicklungsarbeitsbereich befindet, und speichert sie an Ort und Stelle wieder im persistenten Speicher, ohne dass ein Serverneustart erforderlich ist. </p> <p> Die Upsert-Semantik hängt vom Resolver ab, der im &lt;resolvers&gt;-Block der XML-Datei deklariert ist. Bei <i>einem namensbasierten Instanz-Resolver</i> wird eine vorhandene Instanz mit demselben Namen gelöscht und anhand der XML-Datei neu erstellt, wodurch die Datei zur maßgeblichen Quelle der Wahrheit wird. </p> <p> Ein Neustart nach dem Import führt nicht dazu, dass die Datei ein zweites Mal importiert wird. </p>
com.top_logic.tl.ai.core.agent.McpServerRef = Mcp-Server-Referenz
com.top_logic.tl.ai.core.agent.McpServerRef.tooltip = <i>Namensreferenz-Subtyp</i> mit verfügbaren MCP-Servernamen als Optionen.
com.top_logic.tl.ai.core.agent.ModelCapabilityModeSelector = Wahlschalter für den Modellfähigkeitsmodus
com.top_logic.tl.ai.core.agent.ModelCapabilityModeSelector.Config.capability = Fähigkeit
com.top_logic.tl.ai.core.agent.ModelCapabilityModeSelector.Config.capability.tooltip = Die Fähigkeit, die von dem Modell unterstützt werden muss (z. B. "reasoning", "temperature"). <p> Ist der Wert null, wird keine Überprüfung der Fähigkeit durchgeführt (nur der Anbieter wird überprüft). </p>
com.top_logic.tl.ai.core.agent.ModelCapabilityModeSelector.Config.providers = Anbieter
com.top_logic.tl.ai.core.agent.ModelCapabilityModeSelector.Config.providers.tooltip = Anbieter-IDs, für die dieses Feld/diese Gruppe gilt (z. B. "anthropic", "openai"). <p> Wenn das Feld leer ist, wird es für alle Anbieter angezeigt (nur die Fähigkeit ist markiert). </p>
com.top_logic.tl.ai.core.agent.ModelCapabilityModeSelector.tooltip = <i>Modusselektor</i>, der die Sichtbarkeit von Feldern/Gruppen auf der Grundlage des ausgewählten Modells des Agenten steuert. <p> Löst den Modellnamen in eine Anbieter-ID auf und überprüft die Modellfähigkeiten aus dem Katalog. Ein Feld oder eine Gruppe wird nur angezeigt, wenn der Anbieter übereinstimmt UND die erforderliche Fähigkeit vorhanden ist. </p>
com.top_logic.tl.ai.core.agent.NameBasedInstanceResolver = Namensbasierter Instanzauflöser
com.top_logic.tl.ai.core.agent.NameBasedInstanceResolver.tooltip = <i>Instanzauflöser</i>, der Instanzen nach ihrem name-Attribut auflöst. <p> Beim Export wird der Namenswert als globaler Bezeichner verwendet. Beim Import werden vorhandene Instanzen mit demselben Namen gelöscht und aus der XML-Datei neu erstellt, so dass die Datei objects.xml die maßgebliche Quelle der Wahrheit ist. </p>
com.top_logic.tl.ai.core.agent.NameRef = Hinweis auf den Namen
com.top_logic.tl.ai.core.agent.NameRef.tooltip = Benannte Referenz auf ein Tool, eine Fähigkeit, einen Agenten oder einen MCP-Server. <p> Wird als Eintragstyp für Schlüssellisten in der <i>Agentenkonfiguration</i> verwendet. Die Speicherung der Verweise als Keyed-List-Einträge (anstelle einer einzelnen kommagetrennten Zeichenkette) ermöglicht die Überlagerung der einzelnen Einträge über Konfigurationsschichten hinweg: Ein Anwendungsmodul kann einen einzelnen Eintrag hinzufügen oder entfernen, ohne die gesamte von der Plattform bereitgestellte Liste neu zu erstellen. </p>
com.top_logic.tl.ai.core.agent.SkillRef = Skill-Referenz
com.top_logic.tl.ai.core.agent.SkillRef.tooltip = <i>Namensreferenz-Subtyp</i>, der verfügbare Fähigkeitsnamen als Optionen bereitstellt.
com.top_logic.tl.ai.core.agent.StopReason = Stoppgrund
com.top_logic.tl.ai.core.agent.StopReason.ABORTED = Abgebrochen
com.top_logic.tl.ai.core.agent.StopReason.ABORTED.tooltip = Die Schleife wurde unterbrochen (Abbruch).
com.top_logic.tl.ai.core.agent.StopReason.BUDGET_EXHAUSTED = Budget ausgeschöpft
com.top_logic.tl.ai.core.agent.StopReason.BUDGET_EXHAUSTED.tooltip = Das Token- oder Geldbudget des Hauptbenutzers war aufgebraucht, während der Lauf arbeitete. <p> Ein geordneter Abbruch, kein Fehler: Der Lauf behält alles, was er bis zu dem Turn beantwortet hat, der den Rest des Budgets verbraucht hat, und die Oberfläche, die ihn gestartet hat, sagt, warum die Antwort unvollständig ist. Ein Lauf, dessen Budget schon beim Start aufgebraucht war, erreicht die Schleife gar nicht - er wird dort abgelehnt, wo jeder Lauf beginnt, mit demselben Satz. </p>
com.top_logic.tl.ai.core.agent.StopReason.COMPLETE = Vollständig
com.top_logic.tl.ai.core.agent.StopReason.COMPLETE.tooltip = Das LLM hat ohne Tool-Aufruf geendet, und seine letzte Nachricht ist eine Antwort.
com.top_logic.tl.ai.core.agent.StopReason.CONTEXT_OVERFLOW = Überlauf des Kontexts
com.top_logic.tl.ai.core.agent.StopReason.CONTEXT_OVERFLOW.tooltip = Kontext-Fenster überschritten, nachdem die Verdichtungswiederholungen erschöpft sind.
com.top_logic.tl.ai.core.agent.StopReason.ERROR = Fehler
com.top_logic.tl.ai.core.agent.StopReason.ERROR.tooltip = Unbehebbarer Anbieterfehler.
com.top_logic.tl.ai.core.agent.StopReason.MAX_TURNS = Maximale Durchläufe
com.top_logic.tl.ai.core.agent.StopReason.MAX_TURNS.tooltip = Die konfigurierte Höchstzahl an Schritten wurde erreicht. <p> Der letzte Schritt eines solchen Laufs bietet kein Tool an: Das Modell erfährt, dass die Grenze erreicht ist, und antwortet mit dem, was es hat. So endet der Lauf mit einer Antwort statt mit einem Aufruf, den niemand ausführt. </p>
com.top_logic.tl.ai.core.agent.StopReason.NO_ANSWER = Keine Antwort
com.top_logic.tl.ai.core.agent.StopReason.NO_ANSWER.tooltip = Das Modell beendete seinen Zug, ohne etwas zu sagen: Seine letzte Antwort enthielt keinen Text und rief kein Tool auf, und die Aufforderung, fortzufahren, änderte daran nichts (#677). <p> Eine Antwort dieser Art – in der Regel nichts als ein Denkblock – beendete den Durchlauf bisher als <i>abgeschlossen</i>, und der Chat zeigte eine beendete Runde ohne Antwort an. Die Schleife fordert das Modell nun einmal auf, fortzufahren; ein Durchlauf, der weiterhin keine Antwort liefert, endet mit dieser Begründung, die die Oberfläche, die ihn gestartet hat, dem Benutzer mitteilt. </p>
com.top_logic.tl.ai.core.agent.StopReason.OUTPUT_LIMIT = Ausgabegrenze erreicht
com.top_logic.tl.ai.core.agent.StopReason.OUTPUT_LIMIT.tooltip = Die letzte Antwort des Modells wurde an der Ausgabegrenze abgeschnitten, während es seine Antwort verfasste (#677). <p> Der verfasste Text wird zwar gespeichert, stellt jedoch nicht die vollständige Antwort dar, und eine Antwort, die an dieser Stelle endet, darf nicht so interpretiert werden, als hätte das Modell bewusst dort aufgehört. Die Schleife fragt nicht von selbst nach dem Rest: Der Rest wäre eine zweite Antwort, und nur die letzte Antwort eines Durchlaufs wird auf der Oberfläche angezeigt. </p>
com.top_logic.tl.ai.core.agent.StopReason.REJECTED = Abgelehnt
com.top_logic.tl.ai.core.agent.StopReason.REJECTED.tooltip = Der Antwort-Validator hat die Antwort des LLM abgelehnt.
com.top_logic.tl.ai.core.agent.StopReason.tooltip = Warum die Agentenschleife angehalten wurde.
com.top_logic.tl.ai.core.agent.TextPromptContributor = Text für den System-Prompt
com.top_logic.tl.ai.core.agent.TextPromptContributor.Config.agents = Agenten
com.top_logic.tl.ai.core.agent.TextPromptContributor.Config.agents.tooltip = Die Agenten, die den Text bekommen. <p> Die Auswahl bietet jeden Agenten der Anwendung an: die Agenten der Konfiguration und die Agenten, die in der laufenden Anwendung angelegt wurden. Leer bekommt jeder Agent den Text, auch die Agenten, die die Anwendung für einen Benutzer ausführt, etwa die Prompt-Verbesserung des Chats. Wählen Sie die Agenten aus, wenn der Text von den Daten der Anwendung handelt: Ein Agent, der nur einen Entwurf umformuliert, braucht ihn nicht und bezahlt ihn in jedem Lauf. </p>
com.top_logic.tl.ai.core.agent.TextPromptContributor.Config.name = Name
com.top_logic.tl.ai.core.agent.TextPromptContributor.Config.name.tooltip = Ein Name für diesen Eintrag, damit ein Tool ihn unter den anderen wiederfinden kann. <p><code>"application-context"</code> kennzeichnet den Anwendungskontext: den Text, den Alberts TL_init-Skill schreibt und überarbeitet. Für jeden anderen Text lassen Sie das Feld leer. </p>
com.top_logic.tl.ai.core.agent.TextPromptContributor.Config.text = Text
com.top_logic.tl.ai.core.agent.TextPromptContributor.Config.text.tooltip = Der Text, der an den System-Prompt angehängt wird, in der Sprache des Kontos, für das der Lauf handelt. <p> Gibt es keinen Text in dieser Sprache, wird der Text in der Rückfallsprache der Anwendung verwendet. Ein unbekannter Platzhalter wird beim Speichern der Konfiguration abgelehnt. Der Text darf diese Platzhalter verwenden: </p> <ul> <li>{{user}} - der Name des Kontos, für das der Lauf handelt.</li> <li>{{language}} - die Oberflächensprache dieses Kontos, in der der Agent antwortet.</li> <li>{{date}} - das heutige Datum in der Zeitzone dieses Kontos.</li> <li>{{agent}} - der Anzeigename des Agenten.</li> <li>{{model}} - das Sprachmodell, das der Lauf verwendet.</li> <li>{{application}} - der Name dieser Anwendung.</li> <li>{{context}} - die Fakten, die die Seite für die ganze Konversation angibt, einer pro Zeile.</li> <li>{{turn_context}} - die Erklärung des Kontextblocks pro Runde, für Läufe, die einen bekommen.</li> <li>{{preferences}} - der Präferenztext des Kontos.</li> <li>{{memories}} - was der Agent aus früheren Konversationen über das Konto behält.</li> <li>{{environment}} - der vollständige Umgebungsblock. Ohne diesen Platzhalter steht der Block am Ende des Prompts.</li> </ul> <p> Der Text ist Teil des gecachten System-Prompts und wird einmal pro Konversation bezahlt. Eine Änderung wirkt, wenn dieser Dienst neu gestartet wird. </p>
com.top_logic.tl.ai.core.agent.TextPromptContributor.tooltip = Hängt einen festen Text an den System-Prompt der genannten Agenten an, in der Sprache des Kontos, für das der Lauf handelt. <p> Für das, was ein Agent in jedem Lauf über die Anwendung wissen soll und das Modell nicht zeigt: was die Anwendung ist, ihre Fachbegriffe, ihre festen Geschäftsregeln. Der Text darf die {{...}}-Platzhalter des eigenen Prompts eines Agenten verwenden. </p> <p> Ein geänderter Text wirkt, wenn dieser Dienst neu gestartet wird, ab dem nächsten Lauf. </p>
com.top_logic.tl.ai.core.agent.ToolRef = Tool-Referenz
com.top_logic.tl.ai.core.agent.ToolRef.tooltip = <i>Namensreferenz-Subtyp</i> mit verfügbaren Tool-Namen als Optionen.
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions = TopLogic-Agenten und Skills
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions$AgentConfig = Konfiguration des Agenten
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions$AgentConfig.tooltip = Konfiguration für eine einzelne Agentendefinition. <p> Enthält nur Identität und Fähigkeiten. Tuning-Parameter gehören in AgentOverride. </p> <p> Hier benennt eine Installation einen ausgelieferten Agenten um oder beschreibt ihn mit eigenen Worten. Was hier gespeichert wird, erreicht die Benutzer erst, wenn dieser Dienst neu gestartet wird - über die Schaltfläche zum Neustart in der Liste der Dienste oder beim nächsten Start der Anwendung; das Speichern allein ändert nichts am Verhalten eines laufenden Agenten. </p> <p> Beim Speichern wird die Konfiguration aller Agenten so geschrieben, wie sie derzeit lautet. Diese Installation führt danach eine eigene Kopie davon, und Formulierungen, System-Prompts oder Tool-Listen späterer Auslieferungen wirken sich nicht mehr aus. Wer nur zwei Texte ändern und den Rest weiterhin übernehmen möchte, schreibt das Overlay von Hand und benennt darin nur die Eigenschaften, die er ersetzt. </p>
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions$FactConfig = Fakten-Konfiguration
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions$FactConfig.tooltip = Ein Fakt, den ein Agent über die Situation angibt, in der ein Lauf von ihm stattfindet.
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions$SkillConfig = Skill-Konfiguration
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions$SkillConfig.tooltip = Konfiguration für eine einzelne Skill-Definition.
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.delegations = Delegationen
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.delegations.tooltip = Agentennamen, an die dieser Agent delegieren darf. <p> Liste mit Schlüssel für jeden Eintrag: Anwendungs-Overlays können einzelne Delegierte hinzufügen oder entfernen, ohne die vollständige Plattformliste erneut anzugeben. Siehe <i>Namensreferenz</i>. </p>
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.description = Beschreibung
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.description.tooltip = Von Menschen lesbare Beschreibung des Agenten.
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.display-name = Anzeigename
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.display-name.tooltip = Wie dieser Agent gegenüber einem Benutzer in dessen Sprache heißt. <p> Das ist der Name, den das Agentenmenü des Chats anzeigt, und das eine Feld, das eine Installation ändert, um einen ausgelieferten Agenten umzubenennen. Lässt man es leer, wird der Agent unter dem technischen Namen darüber angeboten, der seine Kennung ist: Andere Konfigurationen, die Skills und jede bereits mit diesem Agenten geführte Unterhaltung beziehen sich auf diese Kennung, also bleibt sie, wie sie ist, auch wenn sie sich schlecht liest - stattdessen ist dieses Feld zu ändern. </p> <p> Die Änderung wird wirksam, sobald dieser Dienst neu gestartet wird. </p>
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.facts = Fakten
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.facts.tooltip = Was dieser Agent jedem Modell über die Situation mitteilt, in der er läuft. <p> Jeder Fakt ist TL-Script ohne Argumente, ausgewertet im Kontext des handelnden Benutzers beim Start eines Laufs und eingesetzt in den Abschnitt {{context}} des Umgebungsblocks. Das sind die Fakten, die keine Seite brauchen - sie sind also gleich, ob der Lauf aus dem Chat, aus aiAgentChat oder aus dem Scheduler kommt; ein Fakt, der braucht, was eine Seite gerade zeigt, wird stattdessen am Chat-Konversationselement angegeben. </p>
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.infrastructure = Infrastruktur
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.infrastructure.tooltip = Ob die Anwendung diesen Agenten <em>für</em> einen Nutzer ausführt, anstatt ihn direkt mit ihr kommunizieren zu lassen. <p> Der Prompt-Optimierer des Chats ist ein solcher Agent: Er überarbeitet den Entwurf, den ein Benutzer gerade senden möchte, und antwortet niemals als Persona. Ein hier markierter Agent wird in keinem Menü angeboten und wird überall dort abgelehnt, wo der eigene Lauf eines Benutzers ihn benennen würde, unabhängig davon, was die Zugriffsrichtlinie für den Agenten gewährt – siehe den Entwicklerartikel ai/security/run-access. Der produktinterne Aufrufpfad bleibt offen: Er erstellt seinen Lauf mit `SecurityContext.withoutAgentChoice()`, was im Code bedeutet, dass der Agent nicht vom Benutzer ausgewählt wurde. </p>
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.mcp-servers = Mcp-Server
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.mcp-servers.tooltip = Für diesen Agenten verfügbare MCP-Servernamen. <p> Pro Eintrag verschlüsselte Liste: Anwendungs-Overlays können einzelne Server hinzufügen oder entfernen, ohne die vollständige Plattformliste neu zu erstellen. Siehe <i>Namensreferenz</i>. </p>
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.removed-delegations = Entfernte Delegationen
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.removed-delegations.tooltip = Delegationen, die aus der effektiven Menge entfernt werden sollen. Siehe <i>„Entfernte Tools</i>“.
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.removed-skills = Entfernte Fähigkeiten
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.removed-skills.tooltip = Fähigkeiten, die aus der effektiven Auswahl entfernt werden sollen. Siehe <i>„Entfernte Tools</i>“.
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.removed-tools = Entfernte Tools
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.removed-tools.tooltip = Tools, die aus der effektiven Menge ausgeblendet werden sollen, selbst wenn eine untergeordnete Konfigurationsschicht (die Plattformbasis) sie deklariert. <p> Ein Merge-Overlay kann einen Marker vom Typ „config:operation="remove"“ für <i>„Tools“</i> nicht beibehalten: Solche Marker werden beim Zurücklesen der Overlay-Datei verarbeitet und würden daher den nächsten Lese-Änderungs-Schreib-Zyklus nicht überstehen. Entfernungen werden daher hier als einfache additive Einträge modelliert und bei der Berechnung der laufenden Definitionen von <i>„Tools“</i> abgezogen. </p>
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.skills = Skills
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.skills.tooltip = Für diesen Agenten verfügbare Skill-Namen. <p> Pro Eintrag verschlüsselte Liste: Anwendungs-Overlays können einzelne Fertigkeiten hinzufügen oder entfernen, ohne die vollständige Plattformliste neu zu erstellen. Siehe <i>Namensreferenz</i>. </p>
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.summary = Zusammenfassung
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.summary.tooltip = Eine Zeile, die in der Sprache des Lesers sagt, wozu dieser Agent da ist. <p> Das ist die Zeile unter dem Namen im Agentenmenü des Chats und das zweite Feld, in dem eine Installation einen ausgelieferten Agenten mit eigenen Worten beschreibt. Lässt man es leer, wird der Agent nur mit seinem Namen angeboten - was besser ist, als die Beschreibung darunter anzuzeigen, denn die ist für ein Modell geschrieben und nicht für eine Person. </p> <p> Die Änderung wird wirksam, sobald dieser Dienst neu gestartet wird. </p>
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.system-prompt = System-Prompt
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.system-prompt.tooltip = Der System-Prompt-Text des Agenten.
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.tools = Tools
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.tools.tooltip = Qualifizierte Tool-Namen, die für diesen Agenten verfügbar sind. <p> Pro Eintrag verschlüsselte Liste: Anwendungs-Overlays können einzelne Tools hinzufügen oder entfernen, ohne die vollständige Plattformliste neu zu erstellen. Siehe <i>Namensreferenz</i>. </p>
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.Config.agents = Agenten
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.Config.agents.tooltip = Karte der konfigurationsdefinierten Agentendefinitionen, indiziert nach Agentenname.
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.Config.skills = Skills
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.Config.skills.tooltip = Karte der konfigurationsdefinierten Skill-Definitionen, indiziert nach Skill-Namen.
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.FactConfig.stable = Stabil
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.FactConfig.stable.tooltip = Ob der Wert für die gesamte Konversation gilt. <p> Nur ein stabiler Fakt wird in den Umgebungsblock eingesetzt: Dieser Block steht vor jeder Anfrage der Konversation und muss Byte für Byte gleich bleiben, sonst verfehlt der Prompt-Cache des Anbieters jeden Turn. Ein Fakt, der sich während der Konversation ändert, wird stattdessen in den Turn-Kontextblock eingesetzt, der im Turn selbst mitgeführt wird. </p>
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.FactConfig.value = Wert
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.FactConfig.value.tooltip = TL-Script ohne Argumente, das den Wert berechnet, ausgewertet im Kontext des handelnden Benutzers beim Start eines Laufs.
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.SkillConfig.content = Inhalt
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.SkillConfig.content.tooltip = Der eigentliche Aufforderungstext für diesen Skill.
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.SkillConfig.description = Beschreibung
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.SkillConfig.description.tooltip = Von Menschen lesbare Beschreibung, die im Skill-Katalog angezeigt wird.
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.SkillConfig.removed-tools = Entfernte Tools
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.SkillConfig.removed-tools.tooltip = Tools, die aus dem Wirkungsbereich dieser Fertigkeit ausgeschlossen werden sollen. Siehe <i>„Entfernte Tools“</i> (<i>TopLogic-Agentendefinitionen, Agentenkonfiguration</i>).
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.SkillConfig.tools = Tools
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.SkillConfig.tools.tooltip = Qualifizierte Tool-Namen, die geliefert werden, wenn diese Fähigkeit geladen wird. <p> Pro Eintrag verschlüsselte Liste: Anwendungs-Overlays können einzelne Tools hinzufügen oder entfernen, ohne dass die vollständige Plattformliste erneut angezeigt wird. Siehe <i>Namensreferenz</i>. </p>
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.tooltip = Von TopLogic bereitgestellte Agenten- und Skill-Definitionen. <p> Hierbei handelt es sich um Definitionen auf Plattformebene, die im Lieferumfang von TopLogic enthalten sind. Anwendungsspezifische Agenten und Skills sollten über den Agent-Editor erstellt werden. </p> <p> Anwendungsmodule können die Schlüssellisten eines Plattform-Agenten (Tools, Skills, Delegationen, MCP-Server) über den standardmäßigen Konfigurations-Overlay-Mechanismus erweitern: Ein Overlay deklariert lediglich die Einträge, die es hinzufügt oder entfernt, während die übrigen Einträge der Plattform unverändert übernommen werden. Skalare Eigenschaften wie "description" und "system-prompt" werden bei einer Überschreibung weiterhin atomar ersetzt; daher sollten Overlays diese Eigenschaften ungesetzt lassen, sofern keine echte Ersetzung beabsichtigt ist. Die beiden Texte, die ein Benutzer liest - "display-name" und "summary" - werden auf dieselbe Weise überschrieben; so benennt eine Installation einen mit diesem Produkt ausgelieferten Agenten um. </p>
com.top_logic.tl.ai.core.agent.approval.ApprovalMode = Genehmigungsmodus
com.top_logic.tl.ai.core.agent.approval.ApprovalMode.AUTO_APPROVE = Automatisch genehmigen
com.top_logic.tl.ai.core.agent.approval.ApprovalMode.AUTO_APPROVE.tooltip = Alle Tool-Aufrufe werden automatisch und ohne Benutzerinteraktion genehmigt.
com.top_logic.tl.ai.core.agent.approval.ApprovalMode.MANUAL = Manuell
com.top_logic.tl.ai.core.agent.approval.ApprovalMode.MANUAL.tooltip = Jeder Tool-Aufruf erfordert eine manuelle Genehmigung durch den Benutzer.
com.top_logic.tl.ai.core.agent.approval.ApprovalMode.tooltip = Steuert, wie Tool-Aufrufe im Human-in-the-Loop-Workflow genehmigt werden.
com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome = Ergebnis der Genehmigung
com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome.APPROVED = Genehmigt
com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome.APPROVED.tooltip = Der Benutzer hat diesen einzigen Tool-Aufruf genehmigt.
com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome.APPROVED_FOR_SESSION = Genehmigt für die Sitzung
com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome.APPROVED_FOR_SESSION.tooltip = Der Benutzer hat dieses Tool für den Rest der Sitzung freigegeben.
com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome.REJECTED = Abgelehnt
com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome.REJECTED.tooltip = Der Benutzer hat den Aufruf abgelehnt.
com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome.TIMED_OUT = Zeitüberschreitung
com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome.TIMED_OUT.tooltip = Innerhalb der Genehmigungsfrist ist keine Antwort eingegangen.
com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome.tooltip = Endzustand eines Genehmigungsflusses, getragen vom <i>Genehmigungsergebnis</i>.
com.top_logic.tl.ai.core.agent.approval.InteractionTimeoutService = Zeitüberschreitungsdienst für Interaktionen
com.top_logic.tl.ai.core.agent.approval.InteractionTimeoutService.Config.approval-timeout-minutes = Zeitlimit für die Genehmigung in Minuten
com.top_logic.tl.ai.core.agent.approval.InteractionTimeoutService.Config.approval-timeout-minutes.tooltip = Wie lange ein Tool-Aufruf in Minuten darauf wartet, dass der Benutzer ihn genehmigt oder ablehnt. <p> Nach Ablauf der Frist gilt die Genehmigung als abgelehnt: Der Tool-Aufruf wird abgelehnt und dem Agenten wird mitgeteilt, dass die Genehmigungsfrist abgelaufen ist. </p>
com.top_logic.tl.ai.core.agent.approval.InteractionTimeoutService.Config.question-timeout-minutes = Zeitlimit für Fragen in Minuten
com.top_logic.tl.ai.core.agent.approval.InteractionTimeoutService.Config.question-timeout-minutes.tooltip = Wie lange eine vom Agenten gestellte Frage auf die Antwort des Benutzers wartet (in Minuten). <p> Wenn die Frist abgelaufen ist, wird dem Agenten mitgeteilt, dass niemand geantwortet hat, und er arbeitet mit einer Annahme weiter, die er in seiner Antwort nennt. Eine Chat-Anwendung setzt hier wenige Minuten. </p>
com.top_logic.tl.ai.core.agent.approval.InteractionTimeoutService.tooltip = Die Fristen, die einem Menschen für die Antwort an einen Agenten eingeräumt werden: Wie lange die Freigabe eines Tools dauert und wie lange eine über <i>das „Ask User“-Tool</i> gestellte Frage auf eine Antwort wartet. <p> Beide werden ab dem Zeitpunkt gemessen, zu dem die Anfrage gestellt wird, und beide sind auf Menschen und nicht auf Maschinen ausgerichtet: Ein Endnutzer, der gebeten wird, einen Schreibvorgang für gemeinsam genutzte Geschäftsdaten zu genehmigen, muss die Möglichkeit haben, kurz zu einem Kollegen zu gehen und wieder zurückzukommen. Eine Anwendung, die eine andere Frist benötigt – beispielsweise ein Kiosk, bei dem eine Sitzung nicht länger als eine halbe Stunde aktiv bleiben darf, oder eine Genehmigung, die ein Vorgesetzter erst erteilt, wenn er wieder an seinem Schreibtisch ist –, legt diese Frist hier fest. </p> <p> Was bei Ablauf <em>geschieht</em>, ist nicht konfigurierbar: Eine abgelaufene Genehmigung wird als <i>„Timeout“</i> gewertet (der Tool-Aufruf wird abgelehnt), und eine abgelaufene Frage gibt einen Hinweis zurück, der den Agenten auffordert, mit einer Annahme weiterzuarbeiten, die er in seiner Antwort nennt. Diese Einstellungen legen lediglich fest, wann dies geschieht. </p>
com.top_logic.tl.ai.core.agent.environment.EnvironmentConfig = Umgebungs-Konfiguration
com.top_logic.tl.ai.core.agent.environment.EnvironmentConfig.application = Anwendung
com.top_logic.tl.ai.core.agent.environment.EnvironmentConfig.application.tooltip = Wie diese Anwendung gegenüber dem Modell heißen soll. <p> Leer verwendet den eigenen Namen der Anwendung - den, der in der Titelleiste steht. Setzen Sie ihn, wenn dem Modell etwas anderes gesagt werden soll, etwa ein Produktname, unter dem ein Kunde die Installation kennt. </p>
com.top_logic.tl.ai.core.agent.environment.EnvironmentConfig.template = Vorlage
com.top_logic.tl.ai.core.agent.environment.EnvironmentConfig.template.tooltip = Der Text des Umgebungsblocks, in der Sprache des Kontos, für das der Lauf handelt. <p> Er darf jeden Platzhalter verwenden, den ein System-Prompt verwenden darf, außer {{environment}} - der Block kann sich nicht selbst enthalten. Leer wird die ausgelieferte englische Vorgabe verwendet, die Konstante EnvironmentTemplate.DEFAULT. </p>
com.top_logic.tl.ai.core.agent.environment.EnvironmentConfig.tooltip = Was jedem Agentenlauf über die Situation mitgeteilt wird, in der er ausgeführt wird. <p> Der Harness erstellt pro Durchlauf einen Umgebungsblock und fügt ihn in die System-Eingabeaufforderung ein. In diesem Abschnitt von `AgentApplicationService` passt eine Installation den Wortlaut an und benennt die Anwendung, in der das Modell laut Angabe arbeitet. </p>
com.top_logic.tl.ai.core.agent.environment.UserMemoryConfig = Konfiguration des Benutzerspeichers
com.top_logic.tl.ai.core.agent.environment.UserMemoryConfig.affirmative-words = Positive Wörter
com.top_logic.tl.ai.core.agent.environment.UserMemoryConfig.affirmative-words.tooltip = Die Worte, mit denen ein Nutzer einer vom Agenten gestellten Frage zustimmt. <p> Im Zusammenhang mit der Frage zu lesen: Eine Zustimmung gilt nur, wenn sich die vom Agenten gestellte Frage selbst auf das Erinnern an etwas bezog; ein „Ja“ auf eine andere Frage hat daher keine Bedeutung. Wird wie <i>Anforderungswörter</i> abgeglichen. </p>
com.top_logic.tl.ai.core.agent.environment.UserMemoryConfig.enabled = Aktiviert
com.top_logic.tl.ai.core.agent.environment.UserMemoryConfig.enabled.tooltip = Ob diese Installation überhaupt Erinnerungen an ihre Nutzer bewahrt. <p> Im ausgeschalteten Zustand stehen die Funktionen zum Speichern und Abrufen keinem Agenten zur Verfügung und lehnen einen ankommenden Aufruf ohnehin ab; außerdem wird kein Speicherinhalt in einen Umgebungsblock übertragen. Vorhandene Speicherinhalte bleiben erhalten – es handelt sich hierbei um einen Schalter, der regelt, was geschrieben und gesendet wird, nicht was gespeichert ist –, sodass sie beim erneuten Einschalten wiederhergestellt werden. </p>
com.top_logic.tl.ai.core.agent.environment.UserMemoryConfig.max-length = Maximale Speicherlänge
com.top_logic.tl.ai.core.agent.environment.UserMemoryConfig.max-length.tooltip = Wie lang der Text einer Erinnerung in Zeichen sein darf. <p> Ein längerer Text wird abgelehnt, wenn der Agent versucht, ihn zu schreiben, und es erscheint eine Meldung, in der die Begrenzung angegeben wird. Ein Speicher ist ein Satz über den Nutzer, kein Dokument. </p>
com.top_logic.tl.ai.core.agent.environment.UserMemoryConfig.max-loaded = Maximale Anzahl geladener Speicherplätze
com.top_logic.tl.ai.core.agent.environment.UserMemoryConfig.max-loaded.tooltip = Wie viele der neuesten Erinnerungen eines Kontos werden in den Umgebungsblock eingelesen? <p> Sie stehen vor jeder Anfrage der Konversation, sodass ihre Länge bei jedem Durchlauf berücksichtigt wird. Was nicht hineinpasst, wird weiterhin gespeichert und ist mit dem Abruf-Tool weiterhin auffindbar. </p>
com.top_logic.tl.ai.core.agent.environment.UserMemoryConfig.negative-words = Negative Wörter
com.top_logic.tl.ai.core.agent.environment.UserMemoryConfig.negative-words.tooltip = Die Worte, mit denen ein Nutzer ablehnt. <p> Sie haben Vorrang vor <i>bejahenden Wörtern</i>: Eine Antwort, die eine Verneinung enthält, gewährt nichts, selbst wenn sie gleichzeitig ein Wort enthält, das ansonsten als Zustimmung gelesen werden könnte – „Nein, das ist in Ordnung“ ist eine Ablehnung. Ablehnen ist die sichere Variante, daher geht der mehrdeutige Fall in diese Richtung. </p>
com.top_logic.tl.ai.core.agent.environment.UserMemoryConfig.request-words = Wörter anfordern
com.top_logic.tl.ai.core.agent.environment.UserMemoryConfig.request-words.tooltip = Die Wörter, die einen Satz zu einer Aufforderung machen, sich an etwas zu erinnern. <p> Die Übereinstimmungsprüfung ist eine Überprüfung dessen, was der <em>Benutzer</em> eingegeben hat; daher werden diese Wörter mit den eigenen Wörtern des Benutzers abgeglichen, unabhängig davon, in welcher Sprache er sie geschrieben hat. Die mitgelieferte Liste umfasst die beiden Sprachen, in denen dieses Produkt ausgeliefert wird; bei einer Installation, deren Benutzer eine dritte Sprache verwenden, werden deren Wörter hier hinzugefügt. Beim Abgleich werden Groß- und Kleinschreibung sowie diakritische Zeichen ignoriert, und der Abgleich erfolgt an Wortgrenzen, sodass „merken“ bei „anmerkenswert“ nicht ausgelöst wird. </p>
com.top_logic.tl.ai.core.agent.environment.UserMemoryConfig.tooltip = Was sich ein Agent über die Konten dieser Installation merken kann. <p> Ein Eintrag wird nur mit Zustimmung des Benutzers in dem Moment geschrieben, in dem er erstellt wird – siehe MemoryConsent – und die neuesten Einträge werden in den Umgebungsblock jeder folgenden Konversation zurückgeladen. In diesem Abschnitt kann ein Administrator die gesamte Funktion deaktivieren, festlegen, in welchem Umfang sie einem Modell zur Verfügung steht, und die Begriffe anpassen, nach denen bei der Einwilligungsprüfung gesucht wird. </p>
com.top_logic.tl.ai.core.agent.subagent.SubagentInbox$Sender = Absender
com.top_logic.tl.ai.core.agent.subagent.SubagentInbox$Sender.tooltip = Wer eine Nachricht geschrieben hat.
com.top_logic.tl.ai.core.agent.subagent.SubagentInbox.Sender.LEAD = Hauptagent
com.top_logic.tl.ai.core.agent.subagent.SubagentInbox.Sender.LEAD.tooltip = Der Agent, der den Subagenten gestartet hat; er schreibt über „send_to_subagent“.
com.top_logic.tl.ai.core.agent.subagent.SubagentInbox.Sender.USER = Benutzer
com.top_logic.tl.ai.core.agent.subagent.SubagentInbox.Sender.USER.tooltip = Der Benutzer, über die Karte des Subagenten im Chat.
com.top_logic.tl.ai.core.agent.subagent.SubagentJob$Waiting = Wartet auf
com.top_logic.tl.ai.core.agent.subagent.SubagentJob$Waiting.tooltip = Worauf ein laufender Unteragent gerade wartet.
com.top_logic.tl.ai.core.agent.subagent.SubagentJob.Waiting.APPROVAL = Genehmigung
com.top_logic.tl.ai.core.agent.subagent.SubagentJob.Waiting.APPROVAL.tooltip = Die Genehmigung eines Tool-Aufrufs.
com.top_logic.tl.ai.core.agent.subagent.SubagentJob.Waiting.LEAD_ANSWER = Antwort des Hauptagenten
com.top_logic.tl.ai.core.agent.subagent.SubagentJob.Waiting.LEAD_ANSWER.tooltip = Eine Frage an den Agenten, der ihn gestartet hat.
com.top_logic.tl.ai.core.agent.subagent.SubagentJob.Waiting.USER_ANSWER = Antwort des Benutzers
com.top_logic.tl.ai.core.agent.subagent.SubagentJob.Waiting.USER_ANSWER.tooltip = Eine Frage an den Benutzer.
com.top_logic.tl.ai.core.agent.subagent.SubagentJobStatus = Auftragsstatus des Unteragenten
com.top_logic.tl.ai.core.agent.subagent.SubagentJobStatus.CANCELLED = Abgesagt
com.top_logic.tl.ai.core.agent.subagent.SubagentJobStatus.CANCELLED.tooltip = Einvernehmlich vor Fertigstellung storniert.
com.top_logic.tl.ai.core.agent.subagent.SubagentJobStatus.DONE = Fertig
com.top_logic.tl.ai.core.agent.subagent.SubagentJobStatus.DONE.tooltip = Erfolgreich abgeschlossen; das Ergebnis des Auftrags befindet sich in der Hülle.
com.top_logic.tl.ai.core.agent.subagent.SubagentJobStatus.FAILED = Fehlgeschlagen
com.top_logic.tl.ai.core.agent.subagent.SubagentJobStatus.FAILED.tooltip = Mit einem Fehler abgeschlossen; der Umschlag enthält eine Fehlerübersicht.
com.top_logic.tl.ai.core.agent.subagent.SubagentJobStatus.QUEUED = In der Warteschlange
com.top_logic.tl.ai.core.agent.subagent.SubagentJobStatus.QUEUED.tooltip = Registriert, aber noch nicht gestartet (wartet auf einen Zeitfenster für die Parallelausführung).
com.top_logic.tl.ai.core.agent.subagent.SubagentJobStatus.RUNNING = Laufen
com.top_logic.tl.ai.core.agent.subagent.SubagentJobStatus.RUNNING.tooltip = Wird in einem Hintergrund-Thread ausgeführt.
com.top_logic.tl.ai.core.agent.subagent.SubagentJobStatus.tooltip = Lebenszyklusstatus eines asynchronen Subagent-Jobs.
com.top_logic.tl.ai.core.agent.subagent.SubagentNews$Reason = Grund
com.top_logic.tl.ai.core.agent.subagent.SubagentNews$Reason.tooltip = Warum sich ein Subagent gemeldet hat.
com.top_logic.tl.ai.core.agent.subagent.SubagentNews.Reason.ASKS = Fragt
com.top_logic.tl.ai.core.agent.subagent.SubagentNews.Reason.ASKS.tooltip = Er fragt den Hauptagenten über „ask_lead“ etwas.
com.top_logic.tl.ai.core.agent.subagent.SubagentNews.Reason.CANCELLED = Abgebrochen
com.top_logic.tl.ai.core.agent.subagent.SubagentNews.Reason.CANCELLED.tooltip = Er wurde gestoppt; sein Ergebnis wird mit den anderen Neuigkeiten übergeben.
com.top_logic.tl.ai.core.agent.subagent.SubagentNews.Reason.FAILED = Fehlgeschlagen
com.top_logic.tl.ai.core.agent.subagent.SubagentNews.Reason.FAILED.tooltip = Er endete mit einem Fehler.
com.top_logic.tl.ai.core.agent.subagent.SubagentNews.Reason.FINISHED = Fertig
com.top_logic.tl.ai.core.agent.subagent.SubagentNews.Reason.FINISHED.tooltip = Er hat seine Aufgabe erledigt.
com.top_logic.tl.ai.core.agent.subagent.SubagentNews.Reason.LIMIT = Limit erreicht
com.top_logic.tl.ai.core.agent.subagent.SubagentNews.Reason.LIMIT.tooltip = Der Vorgang wurde an einer Grenze abgebrochen – sei es aufgrund von Iterationen, des Budgets oder der Ausgabe; die Antwort ist möglicherweise unvollständig.
com.top_logic.tl.ai.core.agent.subagent.SubagentProgress$Outcome = Ergebnis
com.top_logic.tl.ai.core.agent.subagent.SubagentProgress$Outcome.tooltip = Wie ein Tool-Aufruf des Unteragenten bisher geendet hat.
com.top_logic.tl.ai.core.agent.subagent.SubagentProgress.Outcome.DENIED = Abgelehnt
com.top_logic.tl.ai.core.agent.subagent.SubagentProgress.Outcome.DENIED.tooltip = Der Aufruf wurde abgelehnt, bevor er lief.
com.top_logic.tl.ai.core.agent.subagent.SubagentProgress.Outcome.FAILED = Fehlgeschlagen
com.top_logic.tl.ai.core.agent.subagent.SubagentProgress.Outcome.FAILED.tooltip = Der Aufruf ist fehlgeschlagen.
com.top_logic.tl.ai.core.agent.subagent.SubagentProgress.Outcome.OK = Ok
com.top_logic.tl.ai.core.agent.subagent.SubagentProgress.Outcome.OK.tooltip = Der Aufruf hat ein Ergebnis zurückgegeben.
com.top_logic.tl.ai.core.agent.subagent.SubagentProgress.Outcome.RUNNING = Läuft
com.top_logic.tl.ai.core.agent.subagent.SubagentProgress.Outcome.RUNNING.tooltip = Der Aufruf hat begonnen und ist noch nicht beendet.
com.top_logic.tl.ai.core.citation.CitationKinds = Zitierbare Arten
com.top_logic.tl.ai.core.citation.CitationKinds$KindConfig = Zitierbare Art
com.top_logic.tl.ai.core.citation.CitationKinds$KindConfig.tooltip = Eine deklarierte Art.
com.top_logic.tl.ai.core.citation.CitationKinds.Config.kinds = Arten
com.top_logic.tl.ai.core.citation.CitationKinds.Config.kinds.tooltip = Was Antworten in dieser Anwendung zitieren dürfen, nach Art.
com.top_logic.tl.ai.core.citation.CitationKinds.Config.marker-syntaxes = Marker-Syntaxen
com.top_logic.tl.ai.core.citation.CitationKinds.Config.marker-syntaxes.tooltip = Eine Antwort in dieser Anwendung verweist neben dem Link noch auf weitere Quellen. <p> Der Link (<i>Link-Marker</i>) wird immer verstanden und wird hier nicht konfiguriert. </p>
com.top_logic.tl.ai.core.citation.CitationKinds.KindConfig.description = Beschreibung
com.top_logic.tl.ai.core.citation.CitationKinds.KindConfig.description.tooltip = Ein Satz, der erklärt, was eine solche Quelle ist – für denjenigen, der die Konfiguration pflegt.
com.top_logic.tl.ai.core.citation.CitationKinds.KindConfig.label = Bezeichnung
com.top_logic.tl.ai.core.citation.CitationKinds.KindConfig.label.tooltip = Wie soll man diesen Typ vor einem Leser in der Sprache des Lesers bezeichnen? <p> Der Name ist Teil des Vokabulars der Konfiguration und bleibt in jeder Sprache derselbe. Dies ist das Wort, das stattdessen in den Quellenzeilen und im Popover des Markers angezeigt wird; ohne dieses Wort wird der Name angezeigt. </p>
com.top_logic.tl.ai.core.citation.CitationKinds.KindConfig.passage = Passage
com.top_logic.tl.ai.core.citation.CitationKinds.KindConfig.passage.tooltip = Ob eine Quelle dieser Art einen Satz enthält, der zitiert werden kann. <p> Gilt für Text – eine Webseite, ein Dokument. Gilt nicht für ein strukturiertes Objekt wie beispielsweise eine Rechnung, die Felder statt Text enthält: Das Popover zeigt die vom Tool gelesenen Felder an, anstatt ein Textfenster um einen Satz herum. </p>
com.top_logic.tl.ai.core.citation.CitationKinds.KindConfig.types = Typen
com.top_logic.tl.ai.core.citation.CitationKinds.KindConfig.types.tooltip = Die qualifizierten Namen der Modelltypen, deren Objekte Quellen dieser Art sind, z. B. demo.events:Event. Ein Untertyp zählt als sein Typ. <p> Ein Objekt, das ein Lese-Tool dem Modell gezeigt hat, kommt mit der ersten deklarierten Art, die seinen Typ beansprucht, auf die Leseliste, und mit <code>"object"</code>, wenn keine es tut. Eine Art ohne Typen registriert nur ein Tool der Anwendung selbst. </p>
com.top_logic.tl.ai.core.citation.CitationKinds.tooltip = Was eine Antwort in dieser Anwendung zitieren darf, einmal deklariert. <p> Eine Art ist ein Vokabular der Anwendung. Das Framework kennt zwei, <code>"web"</code> und <code>"object"</code>; eine Anwendung deklariert hier ihre eigenen. Das Modell nennt nie eine Art: Das Tool, das eine Quelle gelesen hat, entscheidet sie - eine Seite ist "web", ein Objekt hat die erste Art, deren Typen seinen Typ abdecken, sonst "object" - und der Validator behält nur Zitate einer deklarierten Art. Wozu eine Art dient, ist der Leser: die Bezeichnung, die die Quellenliste und das Popover zeigen, und ob eine Quelle dieser Art einen zitierbaren Satz hat. </p> <p> Eine Anwendung, deren Agenten anders als mit einem Link auf Quellen verweisen, registriert die Syntax hier bei den Marker-Syntaxen - siehe <i>Zitiermarker-Syntax</i>. </p>
com.top_logic.tl.ai.core.citation.PageArchive = Seitenarchiv
com.top_logic.tl.ai.core.citation.PageArchive.Config.enabled = Aktiviert
com.top_logic.tl.ai.core.citation.PageArchive.Config.enabled.tooltip = Ob die von einem Agenten gelesenen Webseiten überhaupt archiviert werden. <p> Ohne diese Archivierung verweist ein Web-Zitat nur auf die Live-Seite. </p>
com.top_logic.tl.ai.core.citation.PageArchive.Config.max-chars = Höchstzahl Zeichen
com.top_logic.tl.ai.core.citation.PageArchive.Config.max-chars.tooltip = Wie viele Zeichen des Textes einer Seite werden gespeichert; der Rest wird abgeschnitten. <p> Gespeichert wird, was der Lauf von der Seite gelesen hat. Ein langes Dokument wird in Abschnitten gelesen, und die Kopie enthält jeden gelesenen Abschnitt; der Vorgabewert reicht für einen langen Bericht, der ganz gelesen wurde. </p>
com.top_logic.tl.ai.core.citation.PageArchive.Config.retention-days = Aufbewahrung in Tagen
com.top_logic.tl.ai.core.citation.PageArchive.Config.retention-days.tooltip = Nach wie vielen Tagen wird eine archivierte Kopie gelöscht; bei 0 werden alle Kopien aufbewahrt. <p> Ein Verweis auf eine gelöschte Kopie führt weiterhin zur aktuellen Seite. Eine Kopie, auf die eine gespeicherte Recherche verweist, bleibt so lange erhalten wie die Recherche. </p>
com.top_logic.tl.ai.core.citation.PageArchive.tooltip = Speichert eine Kopie jeder Webseite, die ein Agent bei einem Durchlauf gelesen hat, sodass ein Verweis darauf auch dann noch zeigt, was auf der Seite stand, nachdem sie geändert wurde oder verschwunden ist. <p> Eine Webquelle wird archiviert, sobald sie in die Leseliste eines Laufs aufgenommen wird: webFetch und der Browser übergeben den extrahierten Text an diesen Dienst, und der Verweis auf die Seite enthält die Adresse der Kopie. Eine zitierte Passage wird mit demselben Text abgeglichen. Die Kopie wird als „tl.ai.execution:ArchivedPage“ gespeichert, ihr Text als „tl.core:Binary“ – ein Attributtyp, den der Blob-Speicher der Engine übernimmt, sodass das Verschieben des Archivs dorthin eine Änderung des Speicherorts darstellt, nicht jedoch dieser Klasse. </p> <p><b>Eine eigene Transaktion in einem eigenen Thread.</b> Ein Lesetool läuft <b>,</b> während der Durchlauf möglicherweise noch eine offene Transaktion für die Schreibvorgänge eines früheren Aufrufs enthält; eine darin geschriebene Kopie würde mit diesem Durchlauf zurückgesetzt werden, und der Verweis würde ins Leere führen. Die Kopie wird daher vom eigenen Worker dieses Dienstes in einer Systeminteraktion geschrieben, und das Tool wartet darauf. </p> <p><b>Einmalig erweitert, nicht pro Fenster.</b> Ein langes Dokument wird fensterweise eingelesen, und seine Kopie soll jedes eingelesene Fenster enthalten. Würde die Kopie pro Fenster neu geschrieben, würde der bisher eingelesene Text für jedes Fenster erneut gespeichert – ein in <i>k</i> Fenstern eingelesenes Dokument würde <i>k</i> Commits und etwa <i>k²/2</i>Fenster an Bytes kosten. Das erste Fenster wird daher auf einmal gespeichert, sodass der Verweis eine Adresse hat, und was spätere Fenster hinzufügen, wird nur im Gedächtnis behalten: Die Kopie erhält den längeren Text, wenn der Durchlauf endet, wenn jemand sie öffnet, wenn ein Forschungsdurchlauf damit fortgesetzt wird, spätestens eine Minute nach der ersten Erweiterung und wenn der Dienst heruntergefahren wird. Die Kopie kann daher hinter dem zurückbleiben, was der Lauf gerade liest, während der Lauf noch liest; ein Prozess, der in der Zwischenzeit beendet wird, behält die bis dahin geschriebenen Fenster bei. </p> <p><b>Begrenzt.</b> Es werden höchstens <i>Maximum chars</i> Zeichen einer Seite aufbewahrt; dieselbe Seite, die zweimal mit demselben Text vom selben Konto gelesen wurde, wird einmal gespeichert (innerhalb der Lebensdauer des Prozesses), und Kopien, die älter als <i>Retention Tage</i> sind, werden einmal täglich gelöscht – mit Ausnahme einer Kopie, auf die ein gespeicherter Forschungslauf verweist, die so lange besteht wie der Lauf. </p>
com.top_logic.tl.ai.core.cookiepool.CookiePoolService = Cookie-Pool-Dienst
com.top_logic.tl.ai.core.cookiepool.CookiePoolService.tooltip = Dienst, der <i>Cookie-Pool-Geschäftsobjekte</i> verwaltet und auswählt: benannte, benutzerspezifische (oder explizit freigegebene) Browser-Anmeldepools, deren „storageState“-JSON-Daten <b>im Ruhezustand verschlüsselt</b> gespeichert werden. <p> Ein Cookie-Pool erfasst den authentifizierten Anmeldestatus einer Browsersitzung (storageState: Cookies + Ursprungsspeicher), sodass eine spätere Sitzung – einschließlich eines im Hintergrund laufenden oder unbeaufsichtigten Agenten – bereits im angemeldeten Zustand starten kann. Der Status ist ebenso sensibel wie ein Passwort; daher wird er stets mit dem Installationsschlüssel der Plattform verschlüsselt, bevor er in die Status-Binärdatei gelangt, und erst beim Lesen über den <i>Verschlüsselungsdienst</i> der Plattform (dessen <i>symmetrische Verschlüsselung</i>) entschlüsselt. Dieser Dienst speichert oder gibt den Status niemals im Klartext zurück; ist kein Verschlüsselungsschlüssel installiert, lehnt er den Vorgang ab, anstatt auf Klartext zurückzugreifen. </p> <p><b>Gültigkeitsbereich.</b> Ein von einem Benutzer erstellter Pool hat standardmäßig „owner = dieser Benutzer“ und „shared = false“ und kann nur von seinem Eigentümer ausgewählt werden. Ein Pool mit „shared = true“ – eine explizite Auswahl beim Speichern oder eine Bearbeitung durch einen Administrator, niemals ein Fallback – ist von jeder Sitzung aus auswählbar, einschließlich einer unbeaufsichtigten: der beabsichtigte Anwendungsfall für „shared-login“. Die Auswahl gibt daher die eigenen Pools des Aufrufers sowie die gemeinsam genutzten Pools zurück, und dieser Filter wird hier, auf dem Auswahlpfad, durchgesetzt, der niemals die Modellsicherheit abfragt: Die Auswahl eines Pools steuert einen Browser mit einer gespeicherten Anmeldung an; die gespeicherten Daten werden an niemanden weitergegeben. </p> <p><b>Das Lesen dieser Bytes ist eine andere Frage</b>, und die Modellschicht beantwortet sie. Die seit #227 ausgelieferte Standardeinstellung ist der Eigentümer plus Administratoren – die &lt;security-config&gt; von tl-ai-core.binarySecurity.config.xml, nach der „viewDocument“ über „ModelSecurity.canRead“ fragt. Das Teilen eines Login-Datensatzes macht den gespeicherten Sitzungsstatus daher nicht lesbar: Ein gemeinsam genutzter Pool, der durch einen unbeaufsichtigten Lauf gespeichert wurde, hat keinen Eigentümer und ist nur für Administratoren und das System lesbar. </p> <p><b>Jeder private Pool hat einen Eigentümer.</b> Beim Speichern eines privaten Pools wird ein null-Eigentümer abgelehnt, anstatt einen eigentümerlosen Pool zu speichern. Ein solcher Pool hätte „shared = false“, da es keine Übereinstimmung gäbe; somit könnte kein Aufrufer ihn jemals wieder auswählen, obwohl der Speichervorgang als erfolgreich gemeldet würde; und jeder eigentümerlose Aufrufer würde sich einen Bucket pro Poolnamen teilen, sodass ein unbeaufsichtigter Lauf stillschweigend die gespeicherten Anmeldedaten eines anderen überschreiben würde. Die stillschweigende Standardisierung einer eigentümerlosen Speicherung auf `shared = true` wird aus demselben Grund abgelehnt, aus dem dies auch nicht die Standardeinstellung ist: Es würde einen Anmeldedaten-Speicher in etwas verwandeln, das jede Sitzung hinter dem Rücken des Aufrufers lesen kann. </p> <p><b>Das Speichern eines gemeinsam genutzten Pools ist die zulässige Opt-in-Möglichkeit.</b> Ein Speichervorgang, der „shared = true“ übergibt, fordert diesen Geltungsbereich an und erhält ihn: Der Pool wird als „shared“ markiert, ist für jeden Benutzer und jede Agent-Sitzung der Installation auswählbar und kann <em>ohne</em> Eigentümer gespeichert werden – was es einem unbeaufsichtigten Lauf ermöglicht, die benötigten Anmeldedaten zu erstellen. Der aktuelle Benutzer wird, sofern er identifizierbar ist, weiterhin als Eigentümer eines neu erstellten gemeinsam genutzten Pools aufgezeichnet – als Prüfpfad; der Pool wird lediglich zusätzlich als „gemeinsam genutzt“ gekennzeichnet. Die Sicherheitsvorkehrung besteht darin, dass der weitreichende Geltungsbereich explizit angefordert und in der Bestätigung namentlich genannt werden muss, nicht darin, dass er unerreichbar ist. Zwei Regeln verhindern, dass diese Opt-in-Einstellung irgendetwas implizit erweitert: Ein bestehender Pool wird nur dann an Ort und Stelle aktualisiert, wenn er <em>bereits</em> gemeinsam genutzt wird – ein privater Pool wird niemals in einen gemeinsam genutzten umgewandelt – und eine gemeinsame Speicherung wird abgelehnt, wenn der Aufrufer bereits einen privaten Pool mit diesem Namen besitzt, da bei der Auswahl weiterhin dieser private Pool bevorzugt würde und der gemeinsam genutzte Pool genau vor dem Aufrufer verborgen bliebe, der ihn erstellt hat. </p> <p> Er entspricht in seiner Funktionsweise dem ScreenshotService: Er eröffnet <b>keine</b> eigene Transaktion. Der Pool-Up-Sert-Aufruf erfolgt über das Verb „browserSaveCookies“, ein DATA_WRITE-Tool, dessen Transaktion vom TransactionScope der Agent-Schleife eröffnet und bestätigt wird, sodass der Pool mit dem Durchlauf bestätigt wird. Programmatische Aufrufer (und Tests) stellen ihre eigene Transaktion bereit. </p>
com.top_logic.tl.ai.core.display.CollapsedDisplay = Zusammengeklappte Anzeige
com.top_logic.tl.ai.core.display.CollapsedDisplay.tooltip = Besagt, dass die Teile einer Komposition eingeklappt dargestellt werden, bis der Leser sie aufklappt. <p> Für Teile, die zu einem Objekt gehören, aber nicht das sind, worauf ein Leser zuerst achtet – beispielsweise die Quellen, die im Rahmen einer Recherche gelesen, aber nicht zitiert wurden. Ein Formular, das das Objekt anzeigt, ordnet eine solche Zusammensetzung einer eigenen, geschlossenen Gruppe zu; das Seitenfenster des Chats tut dies ebenfalls. </p><pre> &lt;reference name="alsoRead" composite="true" ...&gt; &lt;annotations&gt; &lt;collapsed/&gt; &lt;/annotations&gt; &lt;/reference&gt; </pre>
