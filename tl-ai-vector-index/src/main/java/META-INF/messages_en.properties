com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.embedding-model-type.tooltip = Embedding model type ("mistral" or "local")
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.local-store-path = Local store path
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.local-store-path.tooltip = File system path for local vector stores (e.g., JVector). Default is tmp/vector-store
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.mistral-api-key = Mistral api key
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.mistral-api-key.tooltip = The Mistral API key for the embedding service. <p> Recommended is a reference to the key by its secret name, so that the key is not part of the configuration: </p> <pre> &lt;mistral-api-key name="tl_mistral_api_key"/&gt; </pre> <p> An attribute value is an encrypted key, or a plain key with the prefix <code>unencrypted:</code>. The key is read when the service starts. Without a key - none configured, or the referenced secret not available - the vector index is disabled: the application starts, a warning is logged, nothing is indexed and a search reports that the vector index is not available. Not needed for the embedding model type <code>local</code>. </p>
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.mistral-embed-model = Mistral embed model
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.mistral-embed-model.tooltip = Mistral Embedding model ID
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.qdrant-db-collection-name = Qdrant database collection name
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.qdrant-db-collection-name.tooltip = Qdrant vector indexing collection. Objects with enabled vector indexing will be stored as points in this Qdrant collection.
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.should-reindexing-on-restart = Should reindexing on restart
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.should-reindexing-on-restart.tooltip = Whether to reindex all objects on system restart.
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.timeout-abort-indexing-for-shutdown = Timeout abort indexing for shutdown
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.timeout-abort-indexing-for-shutdown.tooltip = Number of millisecond to wait before aborting the indexing process after the <i>vector indexing service</i> was shut down. <p> <b>Warning:</b> The index will be incomplete when indexing is aborted! After a forced shutdown, the index must be administratively rebuilt. </p>
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.vector-index-models = Vector index models
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.vector-index-models.tooltip = Comma separated list of Fully Qualified Names (FQNs) of models to be serialized and stored in the Qdrant databse with vector index (Embedding service shall be used on the content of the object)
