com.top_logic.security.passkey.PasskeyRefusedException.Category.FAILED = Failed
com.top_logic.security.passkey.PasskeyRefusedException.Category.FAILED.tooltip = Another check of the relying party failed, see the cause.
com.top_logic.security.passkey.PasskeyRefusedException.Category.INVALID_DATA = Invalid data
com.top_logic.security.passkey.PasskeyRefusedException.Category.INVALID_DATA.tooltip = The credential could not be parsed.
com.top_logic.security.passkey.PasskeyRefusedException.Category.LABEL_MISSING = Label missing
com.top_logic.security.passkey.PasskeyRefusedException.Category.LABEL_MISSING.tooltip = The registration has no name for the passkey.
