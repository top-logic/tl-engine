com.top_logic.tl.ai.index.onnx.OnnxEmbedder.tooltip = An <i>embedder</i> that runs the model in this process, on the CPU: ONNX Runtime for the model, the Hugging Face tokenizer of DJL for the text. <p> The model files are not part of any jar. Operations puts the model's ONNX file and its tokenizer.json from the official model repository into <i>Model directory</i>; see tl-ai-index/README.md. </p> <h2>Rules of operation</h2> <ul> <li><b>Offline.</b> The tokenizer library downloads a GPU build of itself and reports telemetry unless ai.djl.offline is set; this class sets it before the tokenizer is loaded. The native library is then taken from the jar.</li> <li><b>Bounded CPU.</b> <i>Threads</i> threads per inference, no spinning between runs, and inference runs on the index worker, which has the lowest thread priority.</li> <li><b>Bounded memory.</b> A batch is split so that it holds at most <i>Maximum batch tokens</i> tokens: ONNX Runtime's memory arena keeps its largest peak.</li> <li><b>One text per inference</b> by default (<i>Rows per inference</i>). A dynamically quantized (int8) model computes the scale of its activations over the whole batch, so a text's vector would depend on the texts beside it.</li> <li><b>Restart on redeploy.</b> A native library loaded by a web application's class loader stays in memory until the JVM ends.</li> </ul>
