model.tl.model.search = TL-Script
model.tl.model.search.Code = Code
model.tl.model.search.Code.tooltip = A text that is edited in a code editor with syntax highlighting. The language is chosen with the annotation "Code editor language"; without it the value is treated as plain text.
model.tl.model.search.Expr = Gen. search literal
model.tl.model.search.Expr.tooltip = An attribute whose value is a TL-Script expression. The expression is displayed and edited as source code. It is never evaluated by the framework; its meaning is determined solely by the code that reads the attribute.
model.tl.model.search.Macro = Macro
model.tl.model.search.Macro.tooltip = A computed attribute whose value is the HTML produced by a TL-Script expression. The expression is not part of the value but is configured with the storage implementation "Macro attribute" and evaluated on the object owning the attribute.
model.tl.model.search.Report = Report
model.tl.model.search.Report.tooltip = Like the type "Template", but the content is evaluated automatically when the attribute is displayed. The object owning the attribute is passed as the variable "$model".
model.tl.model.search.Template = Template
model.tl.model.search.Template.tooltip = An HTML content with embedded TL-Script expressions. The expressions can access the object being displayed through the variable "$model". A template is not evaluated automatically; it is expanded only where the code reading the attribute asks for it.
model.tl.model.search.tooltip = Module with the data types whose values are TL-Script expressions or templates with embedded TL-Script expressions.
