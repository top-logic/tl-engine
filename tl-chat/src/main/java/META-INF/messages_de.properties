class.com.top_logic.ai.chat.view.I18NConstants.DISCARDED_CHAT_SUBJECT = Bezugsobjekt eines Chats gelöscht, der nicht angelegt werden konnte.
class.com.top_logic.ai.chat.view.I18NConstants.DISCARDED_CHAT_SUBJECT.help = Commit-Meldung der Transaktion, die das Bezugsobjekt löscht, das eine erste Nachricht für eine Unterhaltung angelegt hat, die nicht angelegt werden konnte.
class.com.top_logic.ai.chat.view.I18NConstants.ERROR_ATTACHMENT_TOO_LARGE__FILE = {0}: Größer als 10 MB.
class.com.top_logic.ai.chat.view.I18NConstants.ERROR_ATTACHMENT_TOO_LARGE__FILE.help = Eine Datei wurde nicht an eine Nachricht angehängt, weil sie größer ist, als eine Nachricht sie tragen darf.
