com.top_logic.factory.llm.LLMProxyService = LLM proxy service
com.top_logic.factory.llm.LLMProxyService.Config.provider = Provider
com.top_logic.factory.llm.LLMProxyService.Config.provider.tooltip = The name of the Anthropic provider of the <i>LLM providers</i> whose API key, base URL, version and timeouts the proxy uses.
com.top_logic.factory.llm.LLMProxyService.Config.proxy-url = Proxy URL
com.top_logic.factory.llm.LLMProxyService.Config.proxy-url.tooltip = The URL of the <i>LLM proxy servlet</i> as the workspace containers reach it, e.g. http://host.docker.internal:8080/tl-factory-app/llm-proxy. <p> It is passed to new workspaces in <code>"ANTHROPIC_BASE_URL"</code>. Empty switches the proxy off. </p>
com.top_logic.factory.llm.LLMProxyService.tooltip = Access of the workspaces to the Anthropic Messages API without an API key in the workspace. <p> A workspace container gets no API key. It gets the URL of the <i>LLM proxy servlet</i> of the control application in <code>"ANTHROPIC_BASE_URL"</code> and a token of its own in <code>"ANTHROPIC_AUTH_TOKEN"</code>; Claude Code sends the token as bearer token to that URL. The proxy accepts a request whose token belongs to an existing workspace, adds the API key of the configured provider of the <i>LLM providers</i> and forwards the request. </p> <p> A token is <code>"tlwst_"</code> followed by a random secret (see <i>secret tokens</i>). The workspace stores only its hash (<code>"llmTokenHash"</code>); removing the workspace invalidates the token. </p> <p> The proxy is switched on by its URL: without one, new workspaces get neither URL nor token, and the servlet answers every request with 404. </p>
