com.top_logic.tl.ai.core.agent.approval.ApprovalMode.AUTO_APPROVE.tooltip = Alle Tool-Aufrufe werden automatisch und ohne Benutzerinteraktion genehmigt.
com.top_logic.tl.ai.core.agent.approval.ApprovalMode.MANUAL = Manuell
com.top_logic.tl.ai.core.agent.approval.ApprovalMode.MANUAL.tooltip = Jeder Tool-Aufruf erfordert eine manuelle Genehmigung durch den Benutzer.
com.top_logic.tl.ai.core.agent.approval.ApprovalMode.tooltip = Steuert, wie Tool-Aufrufe im Human-in-the-Loop-Workflow genehmigt werden.
