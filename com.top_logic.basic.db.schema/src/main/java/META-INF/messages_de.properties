com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.key-attributes.tooltip = Wird nicht mehr verwendet: Alle nach Typ indizierten <i>Schlüsselattribute</i> für diese <i>Schemakonfiguration</i>.
