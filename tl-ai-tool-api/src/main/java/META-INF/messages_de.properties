com.top_logic.tl.ai.tool.api.registry.ToolRegistryService.tooltip = Registrierungsdienst zur Verwaltung der in der Anwendung verfügbaren Werkzeuge. <p> Die Werkzeuge sind nach Fabriken organisiert. Jede Fabrik produziert einen Satz von Werkzeugen, und jedes Werkzeug wird durch einen qualifizierten Namen im Format {factory-name}{tool-name} identifiziert. So können Werkzeuge aus verschiedenen Fabriken denselben einfachen Namen haben, ohne dass es zu Konflikten kommt. </p>
