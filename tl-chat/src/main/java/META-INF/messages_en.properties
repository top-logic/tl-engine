com.top_logic.ai.chat.view.AgentChatElement.Config.trace-mode = Trace mode
com.top_logic.ai.chat.view.AgentChatElement.Config.trace-mode.tooltip = Amount of agent execution detail shown in the chat.
com.top_logic.ai.chat.view.AgentChatElement.TraceMode.DETAILED = Detailed
com.top_logic.ai.chat.view.AgentChatElement.TraceMode.DETAILED.tooltip = Shows the detailed execution trace.
com.top_logic.ai.chat.view.AgentChatElement.TraceMode.NONE = None
com.top_logic.ai.chat.view.AgentChatElement.TraceMode.NONE.tooltip = Hides execution traces.
com.top_logic.ai.chat.view.AgentChatElement.TraceMode.OVERVIEW = Overview
com.top_logic.ai.chat.view.AgentChatElement.TraceMode.OVERVIEW.tooltip = Shows a compact execution overview.
com.top_logic.ai.chat.view.AgentChatElement.tooltip = Declarative <agent-chat/> element for the React view layer. <p> The shipped component is TLAgentChat. A host that composes the chat from the exported building blocks in tl-chat-seams.js registers its own element (register('MyChat', MyComposition)) and names it here as react-element. The control still binds the session and the tracker; the browser component still talks to /chat/*. </p>
com.top_logic.ai.chat.view.ChatConversationElement = Chat conversation element
com.top_logic.ai.chat.view.ChatConversationElement$Actions = Actions
com.top_logic.ai.chat.view.ChatConversationElement$Actions.tooltip = The copy / rate / regenerate row, plus named host actions.
com.top_logic.ai.chat.view.ChatConversationElement$Controls = Controls
com.top_logic.ai.chat.view.ChatConversationElement$Controls.tooltip = The pickers and footer switches on the composer.
com.top_logic.ai.chat.view.ChatConversationElement$Mention = Mention
com.top_logic.ai.chat.view.ChatConversationElement$Mention.tooltip = Declarative binding that lets @ mention any model object. <p> Bound with TL-Script the same way <data-list> is: rows computes the objects @ may offer; label and text compute what is shown and what quoted text the mention puts into the message. Each mention carries the object's stable id, so a host tool given that id can resolve it (the framework ships none). Candidates are pushed to the browser and filtered there as the user types, so keep the set modest via rows and limit. </p>
com.top_logic.ai.chat.view.ChatConversationElement$Trace = Trace
com.top_logic.ai.chat.view.ChatConversationElement$Trace.tooltip = How much of the agent's execution the transcript shows. <p> One knob: it replaces the former separate trace-mode and run-summary. <i>Summary</i> is the collapsed-but-expandable run summary the user clicks to open. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Actions.copy = Copy
com.top_logic.ai.chat.view.ChatConversationElement.Actions.copy.tooltip = Whether a finished answer can be copied.
com.top_logic.ai.chat.view.ChatConversationElement.Actions.host = Host
com.top_logic.ai.chat.view.ChatConversationElement.Actions.host.tooltip = Registered message-action names (names components set up in code). Unknown names are ignored with a debug line; they do not fail the view. Hidden in the layout editor: the values must match registrations in TypeScript.
com.top_logic.ai.chat.view.ChatConversationElement.Actions.rate = Rate
com.top_logic.ai.chat.view.ChatConversationElement.Actions.rate.tooltip = Whether a finished answer can be rated.
com.top_logic.ai.chat.view.ChatConversationElement.Actions.regenerate = Regenerate
com.top_logic.ai.chat.view.ChatConversationElement.Actions.regenerate.tooltip = Whether the last answer can be produced again.
com.top_logic.ai.chat.view.ChatConversationElement.Actions.timestamp = Timestamp
com.top_logic.ai.chat.view.ChatConversationElement.Actions.timestamp.tooltip = Whether the answer shows its timestamp.
com.top_logic.ai.chat.view.ChatConversationElement.Config.actions = Actions
com.top_logic.ai.chat.view.ChatConversationElement.Config.actions.tooltip = Which commands sit under a finished answer.
com.top_logic.ai.chat.view.ChatConversationElement.Config.busy = Busy
com.top_logic.ai.chat.view.ChatConversationElement.Config.busy.tooltip = Optional output channel written true while the agent is working.
com.top_logic.ai.chat.view.ChatConversationElement.Config.chat-id = Chat id
com.top_logic.ai.chat.view.ChatConversationElement.Config.chat-id.tooltip = Shared key that lets this conversation, a session list and a rail show one conversation. Defaults to default, so unconfigured pieces on one page find each other.
com.top_logic.ai.chat.view.ChatConversationElement.Config.citation-renderer = Citation renderer
com.top_logic.ai.chat.view.ChatConversationElement.Config.citation-renderer.tooltip = Registered citation-renderer name (names a component set up in code). Empty keeps the built-in citation popover. Hidden in the layout editor: the value must match a registration in TypeScript.
com.top_logic.ai.chat.view.ChatConversationElement.Config.citations = Citations
com.top_logic.ai.chat.view.ChatConversationElement.Config.citations.tooltip = Whether the answer shows its cited sources at all: the inline markers and the per-answer "sources" pill. Off removes the whole citation surface from the transcript.
com.top_logic.ai.chat.view.ChatConversationElement.Config.class.tooltip = The element implementation. Hidden in the layout editor: the tag already fixes it, and changing it gives an element that no longer matches the options shown beside it.
com.top_logic.ai.chat.view.ChatConversationElement.Config.controls = Controls
com.top_logic.ai.chat.view.ChatConversationElement.Config.controls.tooltip = Which pickers and footer controls the composer shows.
com.top_logic.ai.chat.view.ChatConversationElement.Config.input = Input
com.top_logic.ai.chat.view.ChatConversationElement.Config.input.tooltip = Optional channel holding the open AgentSession. The conversation follows a write. Leave empty when the conversation should only talk to the other chat elements through chat-id.
com.top_logic.ai.chat.view.ChatConversationElement.Config.mention = Mention
com.top_logic.ai.chat.view.ChatConversationElement.Config.mention.tooltip = Declarative @-mention binding: lets @ offer any model object, configured with TL-Script like <data-list>. When set, it supplies the @ candidates and takes precedence over <i>reference source</i>.
com.top_logic.ai.chat.view.ChatConversationElement.Config.menu-items = Menu items
com.top_logic.ai.chat.view.ChatConversationElement.Config.menu-items.tooltip = Registered composer-menu-item names. Hidden in the layout editor: the values must match registrations in TypeScript.
com.top_logic.ai.chat.view.ChatConversationElement.Config.personalization-key.tooltip = Optional override for the auto-derived personalization key. Hidden in the layout editor: the key derived from the view context is the right one, and a hand-written value silently moves what a user has personalized somewhere else.
com.top_logic.ai.chat.view.ChatConversationElement.Config.placeholder = Placeholder
com.top_logic.ai.chat.view.ChatConversationElement.Config.placeholder.tooltip = Optional placeholder for the draft field. Empty keeps the built-in wording.
com.top_logic.ai.chat.view.ChatConversationElement.Config.prompt-improver-agent = Prompt improver agent
com.top_logic.ai.chat.view.ChatConversationElement.Config.prompt-improver-agent.tooltip = Name of the agent that improves draft prompts. Leave empty to disable prompt improvement.
com.top_logic.ai.chat.view.ChatConversationElement.Config.react-element = React element
com.top_logic.ai.chat.view.ChatConversationElement.Config.react-element.tooltip = Registered React element that renders this conversation. Defaults to TLChatConversation. Hidden in the layout editor: the value must match a registration in TypeScript.
com.top_logic.ai.chat.view.ChatConversationElement.Config.reference-source = Reference source
com.top_logic.ai.chat.view.ChatConversationElement.Config.reference-source.tooltip = Registered reference-source name (names a component set up in code). Empty, and with no mention binding, hides the @ picker. A mention binding takes precedence over this name. Hidden in the layout editor: the value must match a registration in TypeScript; a designer binds @ with the mention group instead.
com.top_logic.ai.chat.view.ChatConversationElement.Config.trace = Trace
com.top_logic.ai.chat.view.ChatConversationElement.Config.trace.tooltip = How much of the agent's execution the transcript shows: nothing, a collapsed summary, or the full inline trace. The user can still change it live with the composer's trace picker.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.agent-picker = Agent picker
com.top_logic.ai.chat.view.ChatConversationElement.Controls.agent-picker.tooltip = Whether the agent picker is offered.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.attachments = Attachments
com.top_logic.ai.chat.view.ChatConversationElement.Controls.attachments.tooltip = Whether files can be attached.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.auto-approve = Auto approve
com.top_logic.ai.chat.view.ChatConversationElement.Controls.auto-approve.tooltip = Whether the auto-approve switch is shown.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.enter-hint = Enter hint
com.top_logic.ai.chat.view.ChatConversationElement.Controls.enter-hint.tooltip = Whether the footer shows the Enter hint.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.mcp = MCP
com.top_logic.ai.chat.view.ChatConversationElement.Controls.mcp.tooltip = Whether MCP servers can be toggled.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.model-picker = Model picker
com.top_logic.ai.chat.view.ChatConversationElement.Controls.model-picker.tooltip = Whether the model picker is offered.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.thinking = Thinking
com.top_logic.ai.chat.view.ChatConversationElement.Controls.thinking.tooltip = Whether effort levels are offered.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.trace-picker = Trace picker
com.top_logic.ai.chat.view.ChatConversationElement.Controls.trace-picker.tooltip = Whether the trace-mode picker is offered.
com.top_logic.ai.chat.view.ChatConversationElement.Mention.label = Label
com.top_logic.ai.chat.view.ChatConversationElement.Mention.label.tooltip = Optional TL-Script of one object computing its shown label and the mention's label. Empty uses the object's own label.
com.top_logic.ai.chat.view.ChatConversationElement.Mention.limit = Limit
com.top_logic.ai.chat.view.ChatConversationElement.Mention.limit.tooltip = Most candidates pushed to the browser. The list is filtered in the browser as the user types, so this bounds the payload rather than the search.
com.top_logic.ai.chat.view.ChatConversationElement.Mention.observed-types = Observed types
com.top_logic.ai.chat.view.ChatConversationElement.Mention.observed-types.tooltip = Types whose object changes (create / update / delete) re-run <i>Rows</i>, so the candidate set refreshes automatically.
com.top_logic.ai.chat.view.ChatConversationElement.Mention.rows = Rows
com.top_logic.ai.chat.view.ChatConversationElement.Mention.rows.tooltip = TL-Script function computing the objects @ may mention (a <i>collection</i>), the same way <data-list> and <table> bind rows.
com.top_logic.ai.chat.view.ChatConversationElement.Mention.text = Text
com.top_logic.ai.chat.view.ChatConversationElement.Mention.text.tooltip = Optional TL-Script of one object computing the quoted text the mention puts into the message - what the agent reads. Empty uses the label.
com.top_logic.ai.chat.view.ChatConversationElement.Trace.DETAILED = Detailed
com.top_logic.ai.chat.view.ChatConversationElement.Trace.DETAILED.tooltip = The full execution trace, inline.
com.top_logic.ai.chat.view.ChatConversationElement.Trace.NONE = None
com.top_logic.ai.chat.view.ChatConversationElement.Trace.NONE.tooltip = Only the answer; no execution detail.
com.top_logic.ai.chat.view.ChatConversationElement.Trace.SUMMARY = Summary
com.top_logic.ai.chat.view.ChatConversationElement.Trace.SUMMARY.tooltip = A collapsed one-line run summary the user can expand.
com.top_logic.ai.chat.view.ChatConversationElement.tooltip = Declarative <chat-conversation/> element: the transcript and the prompt field as one view element. <p> Merges what used to be the separate <chat-thread/> and <chat-composer/> elements. Transcript and input almost always sit together, so they are one placeable box; a session list (a <data-list> of AgentSessions) and a rail (<chat-rail/>) stay separate because those genuinely want independent placement. Several chat elements on one page join the same conversation through chat-id. The optional input channel carries the open AgentSession; the optional busy channel is written true while the agent works, so a host can disable its own commands. </p>
com.top_logic.ai.chat.view.ChatProgressElement = Chat progress element
com.top_logic.ai.chat.view.ChatProgressElement.Config.class.tooltip = The element implementation. Hidden in the layout editor: the tag already fixes it, and changing it gives an element that no longer matches the options shown beside it.
com.top_logic.ai.chat.view.ChatProgressElement.Config.react-element.tooltip = Registered React element that renders this section. Defaults to TLChatProgress. Hidden in the layout editor: the value must match a registration in TypeScript.
com.top_logic.ai.chat.view.ChatProgressElement.tooltip = Declarative <chat-progress/> element: what the agent is working on, as a rail section. <p> Lists the steps of the current (or last) run from the agent's own task store (createTask / updateTask), the one in progress by its active form. Open approvals are not shown here: they are cards above the prompt field, where the user answers them. The optional badge channel receives how many steps still want something. </p>
com.top_logic.ai.chat.view.ChatRailElement = Chat rail element
com.top_logic.ai.chat.view.ChatRailElement$PaneMode = Pane mode
com.top_logic.ai.chat.view.ChatRailElement$PaneMode.tooltip = How wide the pane opens.
com.top_logic.ai.chat.view.ChatRailElement$SectionConfig = Section configuration
com.top_logic.ai.chat.view.ChatRailElement$SectionConfig.tooltip = One collapsible block of the rail, holding one view element.
com.top_logic.ai.chat.view.ChatRailElement.Config.chat-id = Chat id
com.top_logic.ai.chat.view.ChatRailElement.Config.chat-id.tooltip = Shared key that lets this rail, a transcript and a session list show one conversation. Defaults to default, so unconfigured pieces on one page find each other.
com.top_logic.ai.chat.view.ChatRailElement.Config.class.tooltip = The element implementation. Hidden in the layout editor: the tag already fixes it, and changing it gives an element that no longer matches the options shown beside it.
com.top_logic.ai.chat.view.ChatRailElement.Config.input = Input
com.top_logic.ai.chat.view.ChatRailElement.Config.input.tooltip = Channel holding the object the pane shows, empty for the sections. The same input a <form> or a <switch> takes: while it holds an object the pane replaces the section column, and the pane's close button writes null back. Leave it empty for a rail without a pane.
com.top_logic.ai.chat.view.ChatRailElement.Config.open = Open
com.top_logic.ai.chat.view.ChatRailElement.Config.open.tooltip = Whether the rail starts open. <p> The state for a user who has never opened or closed this rail. Once the user has, their own choice is what every later page load and every new tab shows, and this flag no longer applies to them. </p>
com.top_logic.ai.chat.view.ChatRailElement.Config.pane = Pane
com.top_logic.ai.chat.view.ChatRailElement.Config.pane-mode = Pane mode
com.top_logic.ai.chat.view.ChatRailElement.Config.pane-mode.tooltip = How wide the pane opens: a record beside the transcript, or something to read.
com.top_logic.ai.chat.view.ChatRailElement.Config.pane-width = Pane width
com.top_logic.ai.chat.view.ChatRailElement.Config.pane-width.tooltip = Pane width in pixels. Zero keeps the automatic width. <p> The width for a user who has never dragged the splitter of this rail; a user who has keeps their own. Hidden in the layout editor, because a number here is a choice about somebody else's window that the user can make better themselves. </p>
com.top_logic.ai.chat.view.ChatRailElement.Config.pane.tooltip = What the pane shows while the input channel holds an object. Written as a <pane> child. The element inside binds to the same channel to learn which object it is showing, e.g. <pane><form input="selected"/></pane>. Several elements are stacked.
com.top_logic.ai.chat.view.ChatRailElement.Config.personalization-key.tooltip = Optional override for the auto-derived personalization key. Hidden in the layout editor: the key derived from the view context is the right one, and a hand-written value silently moves what a user has personalized somewhere else.
com.top_logic.ai.chat.view.ChatRailElement.Config.react-element = React element
com.top_logic.ai.chat.view.ChatRailElement.Config.react-element.tooltip = Registered React element that renders this rail. Defaults to TLChatRail. Hidden in the layout editor: the value must match a registration in TypeScript.
com.top_logic.ai.chat.view.ChatRailElement.Config.sections = Sections
com.top_logic.ai.chat.view.ChatRailElement.Config.sections.tooltip = The rail's sections, top to bottom in the order written. Written directly as <section> children of the <chat-rail>. An empty list is an empty rail; this element ships no sections of its own.
com.top_logic.ai.chat.view.ChatRailElement.Config.strip = Strip
com.top_logic.ai.chat.view.ChatRailElement.Config.strip.tooltip = Whether the strip of section icons is shown. The strip is what says what the rail holds while it is closed, and clicking an icon opens the rail on that section. Without it the only way in is the transcript's rail button.
com.top_logic.ai.chat.view.ChatRailElement.PaneMode.CARD = Card
com.top_logic.ai.chat.view.ChatRailElement.PaneMode.CARD.tooltip = A record beside the thread.
com.top_logic.ai.chat.view.ChatRailElement.PaneMode.DOCUMENT = Document
com.top_logic.ai.chat.view.ChatRailElement.PaneMode.DOCUMENT.tooltip = Something to read; the pane takes most of the column.
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.badge = Badge
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.badge.tooltip = Optional channel carrying how many things this section is showing. The number appears beside the section's title and on its strip icon, and the rail sums the sections into the total the transcript's rail button shows. The content element writes it - <chat-progress badge="…"/> does - or a derived channel computes it.
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.content = Content
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.content.tooltip = What this section shows: one view element, written as the <section>'s child. Several elements are stacked, as in a <tab>.
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.icon = Icon
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.icon.tooltip = The icon shown on the strip, e.g. css:bi bi-list-check. Sections without one share a generic glyph, which says nothing about what is inside; give every section an icon of its own where the strip is shown.
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.label = Label
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.label.tooltip = The title shown in the section's header.
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.name = Name
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.name.tooltip = Technical name of this section, unique within the rail. It is the key under which the section remembers whether the user collapsed it, so renaming a section forgets that.
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.open = Open
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.open.tooltip = Whether this section starts expanded. <p> The state for a user who has never collapsed or expanded this section. Once the user has, their own choice is what every later page load and every new tab shows. The choice is remembered per section name, so a section added to the rail later starts as configured even for a user who arranged the others long ago. </p>
com.top_logic.ai.chat.view.ChatRailElement.tooltip = Declarative <chat-rail/> element: the side rail beside a conversation, as a shell whose content is configured. <p> The rail extends the chat so it can show more beside the transcript - what the agent is doing, a proposed plan, the sources, a document it wrote. <b>Which</b> of those is the application's decision, so this element brings no content of its own: each <section> holds one view element, and any element will do - <chat-progress/>, a <data-list> of the application's own objects, or an element a host wrote. An empty <chat-rail/> renders an empty rail. </p> <p> The input channel is the rail's second face: while it holds an object, the <pane> child is shown in place of the sections, with that object available to it over the same channel (an <form input="…"/>, say). Closing the pane writes null back. </p> <p> Several chat elements on one page join the same conversation through chat-id. Two rails on one chat-id are not supported: the open state and the collapsed sections are one per conversation, and both rails would fight over them. </p> <p> <b>TEMPORARY FORK.</b> Nothing here is chat-specific except the chat-id binding and the remembered layout. <b>Upstream target:</b> a generic side-rail shell in tl-layout-view (engine hand-off E2), leaving tl-chat only the sections it contributes. </p>
com.top_logic.ai.chat.view.ChatSectionElement.Config.badge = Badge
com.top_logic.ai.chat.view.ChatSectionElement.Config.badge.tooltip = Optional channel this section writes its count to - how many of the things it shows there are right now. The rail reads the same channel to put the number beside the section's title and on its strip icon, and sums the sections to the total the conversation's rail button shows. Leave it empty for a section that has nothing to count.
com.top_logic.ai.chat.view.ChatSectionElement.Config.chat-id = Chat id
com.top_logic.ai.chat.view.ChatSectionElement.Config.chat-id.tooltip = Shared key that lets this section and the rest of the chat show one conversation. Defaults to default, so unconfigured pieces on one page find each other.
com.top_logic.ai.chat.view.ChatSectionElement.Config.personalization-key.tooltip = Optional override for the auto-derived personalization key. Hidden in the layout editor: the key derived from the view context is the right one, and a hand-written value silently moves what a user has personalized somewhere else.
com.top_logic.ai.chat.view.ChatSectionElement.Config.react-element = React element
com.top_logic.ai.chat.view.ChatSectionElement.Config.react-element.tooltip = Registered React element that renders this section. Hidden in the layout editor: the value must match a registration in TypeScript.
com.top_logic.ai.chat.view.ChatSourcesElement = Chat sources element
com.top_logic.ai.chat.view.ChatSourcesElement.Config.class.tooltip = The element implementation. Hidden in the layout editor: the tag already fixes it, and changing it gives an element that no longer matches the options shown beside it.
com.top_logic.ai.chat.view.ChatSourcesElement.Config.react-element.tooltip = Registered React element that renders this section. Defaults to TLChatSources. Hidden in the layout editor: the value must match a registration in TypeScript.
com.top_logic.ai.chat.view.ChatSourcesElement.tooltip = Declarative <chat-sources/> element: what this conversation has cited, as a rail section. <p> One row per source, in the order the answers first cited them, with the marker numbers that point at it - a number scrolls to its answer, the row opens the source. A long list gets a filter. The optional badge channel receives how many sources there are, so the rail's badge counts the ones cited since the user last looked. </p>
com.top_logic.ai.chat.view.list.DataListElement = Data list element
com.top_logic.ai.chat.view.list.DataListElement$Emphasis = Emphasis
com.top_logic.ai.chat.view.list.DataListElement$Emphasis.tooltip = How prominently a line is shown.
com.top_logic.ai.chat.view.list.DataListElement$LineConfig = Line configuration
com.top_logic.ai.chat.view.list.DataListElement$LineConfig.tooltip = Configuration for a single line of a row - like a table <column>, but stacked.
com.top_logic.ai.chat.view.list.DataListElement$LinesConfig = Lines configuration
com.top_logic.ai.chat.view.list.DataListElement$LinesConfig.tooltip = Container for the lines of a <i>data list element</i>.
com.top_logic.ai.chat.view.list.DataListElement.Config.class.tooltip = The element implementation. Hidden in the layout editor: the tag already fixes it, and changing it gives an element that no longer matches the options shown beside it.
com.top_logic.ai.chat.view.list.DataListElement.Config.collapsible = Collapsible
com.top_logic.ai.chat.view.list.DataListElement.Config.collapsible.tooltip = Whether the list can collapse to a narrow strip.
com.top_logic.ai.chat.view.list.DataListElement.Config.commands = Commands
com.top_logic.ai.chat.view.list.DataListElement.Config.commands.tooltip = Header buttons, rendered above the list. Each is a standard view command - a <generic-command> composing any actions (execute-script, open-dialog, write-channel, with-transaction, ...), with the usual label, image, tooltip, executability and input. A chat session list, for example, configures one command that clears the selection channel ("New chat").
com.top_logic.ai.chat.view.list.DataListElement.Config.empty-text = Empty text
com.top_logic.ai.chat.view.list.DataListElement.Config.empty-text.tooltip = The text shown when the list is empty.
com.top_logic.ai.chat.view.list.DataListElement.Config.group-by = Group by
com.top_logic.ai.chat.view.list.DataListElement.Config.group-by.tooltip = Optional TL-Script function of one row computing its group label. Rows sharing a label sit under one header, in first-appearance order. Empty means no grouping (a flat list).
com.top_logic.ai.chat.view.list.DataListElement.Config.inputs = Inputs
com.top_logic.ai.chat.view.list.DataListElement.Config.inputs.tooltip = References to channels whose values become positional arguments to <i>Rows</i>.
com.top_logic.ai.chat.view.list.DataListElement.Config.lines = Lines
com.top_logic.ai.chat.view.list.DataListElement.Config.lines.tooltip = The lines shown per row, top to bottom - the vertical counterpart of a table's columns.
com.top_logic.ai.chat.view.list.DataListElement.Config.observed-types = Observed types
com.top_logic.ai.chat.view.list.DataListElement.Config.observed-types.tooltip = Types whose object changes (create / update / delete) re-run <i>Rows</i>, so the list refreshes automatically.
com.top_logic.ai.chat.view.list.DataListElement.Config.personalization-key.tooltip = Optional override for the auto-derived personalization key. Hidden in the layout editor: the key derived from the view context is the right one, and a hand-written value silently moves what a user has personalized somewhere else.
com.top_logic.ai.chat.view.list.DataListElement.Config.react-element = React element
com.top_logic.ai.chat.view.list.DataListElement.Config.react-element.tooltip = Registered React element that renders this list. Defaults to TLDataList. Hidden in the layout editor: the value must match a registration in TypeScript.
com.top_logic.ai.chat.view.list.DataListElement.Config.rows = Rows
com.top_logic.ai.chat.view.list.DataListElement.Config.rows.tooltip = TL-Script function computing the row objects (a <i>collection</i>), same as <table>'s rows.
com.top_logic.ai.chat.view.list.DataListElement.Config.search = Search
com.top_logic.ai.chat.view.list.DataListElement.Config.search.tooltip = Whether the list shows a search field (client-side filter on the row text).
com.top_logic.ai.chat.view.list.DataListElement.Config.selection = Selection
com.top_logic.ai.chat.view.list.DataListElement.Config.selection.tooltip = Optional two-way channel holding the selected row object.
com.top_logic.ai.chat.view.list.DataListElement.Config.title = Title
com.top_logic.ai.chat.view.list.DataListElement.Config.title.tooltip = The header title shown above the list.
com.top_logic.ai.chat.view.list.DataListElement.Emphasis.PRIMARY = Primary
com.top_logic.ai.chat.view.list.DataListElement.Emphasis.PRIMARY.tooltip = The prominent line (title style).
com.top_logic.ai.chat.view.list.DataListElement.Emphasis.SECONDARY = Secondary
com.top_logic.ai.chat.view.list.DataListElement.Emphasis.SECONDARY.tooltip = A muted secondary line.
com.top_logic.ai.chat.view.list.DataListElement.LineConfig.attribute = Attribute
com.top_logic.ai.chat.view.list.DataListElement.LineConfig.attribute.tooltip = The model attribute shown on this line (the normal case). Use <i>Value</i> instead for a computed line.
com.top_logic.ai.chat.view.list.DataListElement.LineConfig.emphasis = Emphasis
com.top_logic.ai.chat.view.list.DataListElement.LineConfig.emphasis.tooltip = How prominently the line is shown. Unset means the first line is <i>primary</i> and the rest <i>secondary</i>.
com.top_logic.ai.chat.view.list.DataListElement.LineConfig.value = Value
com.top_logic.ai.chat.view.list.DataListElement.LineConfig.value.tooltip = A TL-Script function of one row computing this line's text - a computed line (a formatted value, a count) that a plain attribute cannot express.
com.top_logic.ai.chat.view.list.DataListElement.LinesConfig.lines = Lines
com.top_logic.ai.chat.view.list.DataListElement.LinesConfig.lines.tooltip = The lines to display, top to bottom.
com.top_logic.ai.chat.view.list.DataListElement.tooltip = Declarative <data-list> element: a model-bound, styled, grouped, searchable, selectable list - the presentation of a chat rail generalised to any model. <p> The rows come from a TL-Script rows expression, exactly as <table> binds its rows; an attribute line resolves against the row object's own type. Each row shows an ordered list of lines (the vertical counterpart of a table's columns); its group label is a further expression. A row click writes the row object to the two-way selection channel. Search and collapse are client-side. Unlike <table> this renders a styled list (the session-rail look), not a data grid; unlike <object-list> it is a selectable picker, not an in-place editor of composite items. </p> <p> <b>TEMPORARY FORK.</b> The engine has no data-bound list that renders like the navbar with selection + grouping + search. This element fills that gap in tl-ai, rendered by the TLDataList React component. <b>Upstream target:</b> a generic <data-list> in tl-layout-view; then delete this package. </p>
