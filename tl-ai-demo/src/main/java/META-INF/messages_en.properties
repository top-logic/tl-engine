com.top_logic.ai.demo.secdemo.SecDemoSetupService = Security demo setup service
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.component-access = Component access
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.component-access.tooltip = The views (layout components) the demo roles may open, in the format of the engine's WEB-INF/conf/security.xml. <p> Model access rights alone do not make an application usable: a role that may read a type still sees no tab until it holds a command group on the enclosing <i>compound security layout</i>. This is where the demo roles get that. </p> <p> In contrast to the engine's import, the entries here are applied <em>additively</em>: no access outside this configuration is touched, so the shipped demo is unaffected while the aspect is switched off. </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.initial-password = Initial password
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.initial-password.tooltip = Password given to the demo accounts when they are created. <p> Must satisfy the password policy of the configured authentication device (by default: at least 8 characters from at least two character classes). </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.tooltip = Seeds the fixtures for the agent security end-to-end test: two demo accounts, their group memberships, the role assignments on the security root, the component (layout) access the demo roles need to reach the agent chat, and a handful of example instances. <p> The service is only started when the opt-in aspect WEB-INF/conf/secdemo.config.xml is listed in WEB-INF/conf/metaConf.txt. All steps are idempotent, so restarting the application does not duplicate anything. </p> <p> The roles themselves are created by <i>initial roles</i>, the groups by <i>initial groups</i>; both are configured in the same aspect. What is left - assigning a role to a group <em>on the security root</em> and creating accounts - has no declarative counterpart in the engine, hence this service. </p> <p> The same is true for component access. The engine reads it declaratively from WEB-INF/conf/security.xml (<i>access configuration setup</i>), but that path is fixed and the import <em>resets</em> the access of every view in the application before applying the file. An opt-in aspect must not do that, so this service applies the very same <i>access configuration</i> format additively. </p>
