com.top_logic.basic.io.BasicFileLog.tooltip = Service for logging strings into files. There are two mechanisms for logging: <ul> <li><code> appendIntoLogFile(String aBasicFileName, String aText) </code> for appending </li><li><code> logIntoNewFile(String aBasicFileName, String aText) </code> for creating a new log file </li></ul> <code>aText</code> is the text to log. <code>aBasicFileName</code> describes the type of the log. Some adaptions of the log path can be mode in the configuration of the <code>BasicFileLog</code>. <ul> <li> The main log path can be set, all other paths are relative to this one</li> <li> for every <code>aBasicFileName</code> a path can be set</li> <li> for every <code>aBasicFileName</code> the usage of year and month folders is possible. Year and month folder do the following: If a new file is created, the file is automatically stored in a folder with the name of the actual month. This folder is stored in a folder with the name of the actual year.</li> </ul> This class ins intended for small amounts of logging. It maximum throughput on a developer machine is around 120 (new) Files per second. * When logging more than 500 Messages per day you need some other approach.
