com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.connect-timeout.tooltip = Timeout in seconds for establishing a connection to the daemon.
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.docker-host = Docker host
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.docker-host.tooltip = The URI of the Docker daemon. <p> Either the socket of a local daemon, e.g. unix:///var/run/docker.sock, or the address of a remote daemon or a socket proxy, e.g. tcp://docker-proxy:2375. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.extra-hosts = Extra hosts
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.extra-hosts.tooltip = Entries added to the host names a workspace container resolves, each a host name and an address separated by a colon. <p> The address host-gateway stands for the address of the daemon host as the containers see it: host.docker.internal:host-gateway lets a workspace reach a service on the daemon host, e.g. an application that runs there directly, under the name host.docker.internal. The entries apply to containers created afterwards. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.host-port-max = Host port maximum
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.host-port-max.tooltip = The highest port of the daemon host a workspace port is published on.
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.host-port-min = Host port minimum
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.host-port-min.tooltip = The lowest port of the daemon host a workspace port is published on.
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.label-namespace = Label namespace
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.label-namespace.tooltip = Prefix of the keys of the labels by which the provider recognizes its objects. <p> Two applications that use the same daemon must use different namespaces, otherwise each one regards the workspaces of the other as its own. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.name-prefix = Name prefix
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.name-prefix.tooltip = Prefix of the names of the containers and volumes the provider creates. <p> The name of a container is the prefix followed by the workspace identifier, the name of a volume additionally followed by the volume name. Names only have to be unique, the provider never recognizes an object by its name. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.network = Network
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.network.tooltip = Name of the Docker network the workspace containers join. <p> If the network does not exist, it is created. An application that itself runs in a container of the same daemon must be connected to this network to reach the workspaces by container name. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.public-host = Public host
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.public-host.tooltip = Host name of the daemon host under which a browser reaches the published ports. <p> The preview URL of a workspace is built from this name and the host port. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.stop-timeout = Stop timeout
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.stop-timeout.tooltip = Seconds a container gets to shut down when it is stopped, before it is killed.
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.terminate-timeout = Terminate timeout
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.terminate-timeout.tooltip = Seconds a command run in a workspace gets to finish when it is terminated, before it is killed.
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.tls-cert-path = TLS certificate directory
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.tls-cert-path.tooltip = Directory with the client certificate (cert.pem, key.pem) and the CA certificate (ca.pem) for a TLS connection to a tcp:// daemon. <p> If not set, the connection is not encrypted. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.tooltip = <i>Workspace provider</i> running each workspace in a container of a Docker daemon, accessed through the Docker Engine API. <p> The daemon is addressed by <i>Docker host</i>, so the application may run on the daemon host itself, in a container of that daemon (with access to its socket or to a socket proxy) or anywhere else (with a remote daemon). Because of that, the provider only ever creates named volumes and never bind-mounts a path: a host path would be resolved on the daemon host, not where the application runs. </p> <p> Everything the provider creates carries labels in the label namespace: containers and volumes the label <code>"workspace"</code> with the workspace identifier, shared volumes the label <code>"shared"</code> with their logical name, built images the label <code>"image"</code> with their repository, the network the label <code>"network"</code>. The provider finds its objects by these labels only, never by name. </p> <p> All workspace containers join the network <i>Network</i>, which is created if it does not exist. The container port of a workspace is published on a port of the range from <i>Host port minimum</i> to <i>Host port maximum</i>, which the daemon chooses anew on every start among the ports of the range that are free at that time. </p> <p> The extra hosts are added to the host names a workspace container resolves, e.g. to reach the application on the daemon host through the gateway of the daemon. </p> <p> A command run in a workspace needs a sh with kill in the image: the command is run under a shell script reporting its process ID, and terminating it sends signals to its process group by kill. </p>
