model.tl.ai.execution.AgentExecution.thinkingTokens = Denk-Tokens
model.tl.ai.execution.AgentExecution.thinkingTokens.tooltip = Tokens, die auf die Denkausgabe des Modells entfallen.
model.tl.ai.execution.AgentExecution.tooltip = Ein Durchlauf der Agentenschleife. Ein Subagenten-Lauf ist eine Ausführung mit gesetzter übergeordneter Ausführung; die Summe der Token-Zähler über den Teilbaum ergibt daher den Gesamtverbrauch eines Laufs samt Kindläufen.
