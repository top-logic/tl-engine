class.com.top_logic.security.auth.pac4j.provisioning.I18NConstants.ERROR_EMAIL_DOMAIN_NOT_ALLOWED__DOMAIN = An account is not created for e-mail addresses of the domain "{0}".
class.com.top_logic.security.auth.pac4j.provisioning.I18NConstants.ERROR_EMAIL_NOT_VERIFIED = The identity provider has not confirmed your e-mail address. An account is created only for a confirmed e-mail address.
class.com.top_logic.security.auth.pac4j.provisioning.I18NConstants.ERROR_NAME_TAKEN__NAME = The login name "{0}" is already taken by an account that is not connected with your login. Ask the administrator to connect it.
class.com.top_logic.security.auth.pac4j.provisioning.I18NConstants.ERROR_NO_EMAIL = The identity provider has not reported an e-mail address. An account is created only for a known e-mail address.
class.com.top_logic.security.auth.pac4j.provisioning.I18NConstants.ERROR_NO_LOGIN_NAME = The identity provider has not reported a login name.
class.com.top_logic.security.auth.pac4j.provisioning.I18NConstants.ERROR_OTHER_IDENTITY__NAME = The account "{0}" is already connected with another identity of this login.
class.com.top_logic.security.auth.pac4j.provisioning.I18NConstants.EXTERNAL_LOGIN = Login through an external identity provider.
com.top_logic.security.auth.pac4j.config.ClientConfigurator.Config.icon = Icon
