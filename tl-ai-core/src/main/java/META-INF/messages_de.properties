com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome.tooltip = Endzustand eines Genehmigungsflusses, getragen vom <i>Genehmigungsergebnis</i>.
com.top_logic.tl.ai.core.htmlpages.GeneratedHtmlPageService = Generierter HTML-Seitendienst
com.top_logic.tl.ai.core.htmlpages.GeneratedHtmlPageService.tooltip = Dienst, der <i>generierte HTML-Seitenentitäten</i> aufbewahrt und abruft.
