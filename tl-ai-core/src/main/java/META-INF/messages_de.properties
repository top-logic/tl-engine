com.top_logic.tl.ai.core.session.Part.ApprovalDecision.APPROVED.tooltip = Der Benutzer hat diesen Tool-Aufruf genehmigt.
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.APPROVED_FOR_SESSION = Genehmigt für die Sitzung
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.APPROVED_FOR_SESSION.tooltip = Der Benutzer hat dieses Tool für den Rest der Sitzung freigegeben.
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.DENIED = Verweigert
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.DENIED.tooltip = Der Benutzer hat den Aufruf dieses Tools abgelehnt.
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.TIMED_OUT = Zeitüberschreitung
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.TIMED_OUT.tooltip = Die Genehmigungsanfrage ist ohne Antwort verstrichen.
com.top_logic.tl.ai.core.session.Part.SystemEventType.APPROVAL_MODE_CHANGED = Genehmigungsmodus geändert
com.top_logic.tl.ai.core.session.Part.SystemEventType.APPROVAL_MODE_CHANGED.tooltip = Der Genehmigungsmodus wurde während des Laufs geändert.
com.top_logic.tl.ai.core.session.Part.SystemEventType.CANCELLED = Abgebrochen
com.top_logic.tl.ai.core.session.Part.SystemEventType.CANCELLED.tooltip = Der Agentenlauf wurde vom Benutzer abgebrochen.
com.top_logic.tl.ai.core.session.Part.SystemEventType.MODEL_CHANGED = Modell geändert
com.top_logic.tl.ai.core.session.Part.SystemEventType.MODEL_CHANGED.tooltip = Das LLM-Modell wurde während des Laufs gewechselt.
com.top_logic.tl.ai.core.session.Part.ToolCallStatus.COMPLETED = Abgeschlossen
com.top_logic.tl.ai.core.session.Part.ToolCallStatus.COMPLETED.tooltip = Das Tool wurde erfolgreich beendet.
com.top_logic.tl.ai.core.session.Part.ToolCallStatus.DENIED = Verweigert
com.top_logic.tl.ai.core.session.Part.ToolCallStatus.DENIED.tooltip = Tool wurde von der Sicherheit oder der Genehmigung verweigert.
com.top_logic.tl.ai.core.session.Part.ToolCallStatus.FAILED = Gescheitert
com.top_logic.tl.ai.core.session.Part.ToolCallStatus.FAILED.tooltip = Tool hat einen Fehler ausgelöst.
com.top_logic.tl.ai.core.session.Part.ToolCallStatus.RUNNING = Läuft
com.top_logic.tl.ai.core.session.Part.ToolCallStatus.RUNNING.tooltip = Das Tool wird gerade ausgeführt.
com.top_logic.tl.ai.core.session.Part.TransactionType.BEGAN = Begonnen
com.top_logic.tl.ai.core.session.Part.TransactionType.BEGAN.tooltip = Die Transaktion wurde gestartet.
com.top_logic.tl.ai.core.session.Part.TransactionType.COMMITTED = Bestätigt
com.top_logic.tl.ai.core.session.Part.TransactionType.COMMITTED.tooltip = Die Transaktion wurde erfolgreich abgeschlossen.
com.top_logic.tl.ai.core.session.Part.TransactionType.ROLLED_BACK = Zurückgerollt
com.top_logic.tl.ai.core.session.Part.TransactionType.ROLLED_BACK.tooltip = Die Transaktion wurde rückgängig gemacht.
com.top_logic.tl.ai.core.tools.interaction.TaskTool = Aufgabenwerkzeug
com.top_logic.tl.ai.core.tools.interaction.TaskTool.tooltip = Tool zur Verwaltung von Agentenaufgaben innerhalb einer Verarbeitungssitzung. <p> Bietet CRUD-Operationen für einen speicherinternen <i>Aufgabenspeicher</i>, der über die <i>Aufgabenspeicherbindung</i> an den aktuellen Thread gebunden ist. Aufgaben werden verwendet, um den Fortschritt zu verfolgen und mehrstufige Agentenarbeit zu organisieren. </p>
com.top_logic.tl.ai.core.tools.model.AnnotationDefinitionExplorerTool = Explorer-Tool für Anmerkungsdefinitionen
com.top_logic.tl.ai.core.tools.model.AnnotationDefinitionExplorerTool.tooltip = Tool zur Erkundung von Schemata für Anmerkungsdefinitionen. <p> Dieses Tool ermöglicht es KI-Agenten, Anmerkungsdefinitionen zu verstehen (was konfiguriert werden KANN), nicht Anmerkungsinstanzen (was konfiguriert ist). Es bietet Schemainformationen, einschließlich Metadaten zu Eigenschaften, Typen, Einschränkungen und Standardeinstellungen. </p> <h3>Beispiel für die Verwendung:</h3> <pre> // Untersuchen einer bestimmten Anmerkungsdefinition describeAnnotation("com.top_logic.model.annotate.Visibility") // Untersuchen einer Formulardefinitionsanmerkung describeAnnotation("com.top_logic.model.form.definition.FormDefinition") </pre> <h3>Integration</h3>: <p> Registrieren Sie dieses Tool über <i>annotierte Tools</i> und weisen Sie es einem Agenten über die <i>LLM-Provider-Registrierungskonfiguration</i> zu. </p>
com.top_logic.tl.ai.core.tools.model.InstanceBrowserTool = Instanz-Browser-Tool
com.top_logic.tl.ai.core.tools.model.InstanceBrowserTool.tooltip = Tool für den Zugriff auf TopLogic-Instanzdaten aus der Wissensdatenbank. <p> Dieses Tool bietet Methoden zum Auflisten von Instanzen eines Typs mit Paginierung und zum Abrufen detaillierter Informationen über einzelne Instanzen. Alle Methoden geben JSON-formatierte Zeichenketten für die Verwendung durch KI-Agenten zurück. </p>
com.top_logic.tl.ai.core.tools.model.LockTool = Werkzeug sperren
com.top_logic.tl.ai.core.tools.model.LockTool.tooltip = Werkzeug zur Überprüfung, ob ein Modellelement gerade von einem anderen Bearbeiter gesperrt ist.
com.top_logic.tl.ai.core.tools.model.ModelAnnotationBrowserTool = Browser-Tool für Modellkommentare
com.top_logic.tl.ai.core.tools.model.ModelAnnotationBrowserTool.tooltip = Tool zum Durchsuchen von Annotationen auf TopLogic-Modellelementen (Module, Typen, Teile, Aufzählungen, Klassifikatoren). <p> Mit diesem Tool können KI-Agenten die Metadaten von Annotationen auf Modellelementen mit optionaler Vererbungsunterstützung prüfen. Es liefert detaillierte Informationen über jede Anmerkung, einschließlich ihres Tag-Namens, der Konfigurationsschnittstelle und der Eigenschaftswerte. </p> <h3>Beispiel für die Verwendung:</h3> <pre> // Auflisten lokaler Anmerkungen zu einem Modul getCurrentAnnotations("tl.core", false) // Auflisten lokaler Anmerkungen zu einem Typ getCurrentAnnotations("tl.core:TLObject", false) // Auflisten aller Anmerkungen einschließlich vererbter getCurrentAnnotations("tl.core:TLObject", true) // Anmerkungen zu einer Enumeration auflisten getCurrentAnnotations("tl.core:TLScope", false) // Anmerkungen zu einem Typteil auflisten getCurrentAnnotations("tl.core:TLObject#name", false) // Anmerkungen zu einem Klassifikator (enum literal) auflisten getCurrentAnnotations("tl.core:TLScope#global", false) </pre> <h3>Integration</h3>: <p> Registrieren Sie dieses Tool über <i>annotierte Tools</i> und weisen Sie es einem Agenten über die <i>LLM-Provider-Registry-Konfiguration</i> zu. </p>
com.top_logic.tl.ai.core.tools.model.ModelAnnotationEditorTool = Editor für Modellbeschriftungen
com.top_logic.tl.ai.core.tools.model.ModelAnnotationEditorTool.tooltip = Tool zum Setzen und Entfernen von Annotationen auf TopLogic-Modellelementen. <p> Mit diesem Tool können KI-Agenten Metadaten zu Modellelementen (Module, Typen, Teile, Klassifikatoren) ändern. Annotationskonfigurationen werden als JSON akzeptiert, die dem Schema des <i>Konfigurationsschematools</i> entsprechen. </p>
com.top_logic.tl.ai.core.tools.model.ModelBrowserTool = Modell-Browser-Tool
com.top_logic.tl.ai.core.tools.model.ModelBrowserTool.tooltip = Tool zum Durchsuchen der TopLogic-Modellstruktur (Module, Typen, Teile). <p> Dieses Tool bietet drei Methoden, die die natürliche Hierarchie für die Modelluntersuchung bilden: Auflistung aller Module, Auflistung der Typen innerhalb eines Moduls und Auflistung der Eigenschaften/Referenzen eines Typs. Alle Methoden geben JSON-formatierte Strings zurück, die von KI-Agenten verwendet werden können. </p>
com.top_logic.tl.ai.core.tools.model.ModelEditorTool = Modell-Editor-Tool
com.top_logic.tl.ai.core.tools.model.ModelEditorTool.tooltip = Tool zum Erstellen und Aktualisieren von TopLogic-Modellelementen. <p> Dieses Tool bietet Methoden zum Erstellen und Aktualisieren von Modulen, Klassen, Eigenschaften, Referenzen, Rückwärtsreferenzen und Aufzählungen im TopLogic-Anwendungsmodell. </p> <p> Alle Methoden geben JSON-formatierte Zeichenketten zurück, die von KI-Agenten verwendet werden können. </p>
com.top_logic.tl.ai.core.tools.model.ModelSearchTool = Tool zur Modellsuche
com.top_logic.tl.ai.core.tools.model.ModelSearchTool.tooltip = Tool für die Suche im gesamten TopLogic-Anwendungsmodell. <p> Dieses Tool bietet eine intelligente Textsuche über Module, Typen (Klassen, Aufzählungen, Datentypen) und Eigenschaften/Referenzen. Es durchsucht technische Namen, qualifizierte Namen, Bezeichnungen und Beschreibungen und gibt die 10 relevantesten Treffer mit Kontextinformationen zurück. </p>
com.top_logic.tl.ai.core.tools.model.SearchAnnotationTool = Tool für Suchanmerkungen
com.top_logic.tl.ai.core.tools.model.SearchAnnotationTool.tooltip = Tool zur Auflistung der verfügbaren Annotationstypen für TopLogic-Modellelemente. <p> Mit diesem Tool können KI-Agenten herausfinden, welche Annotationstypen auf ein bestimmtes Modellelement angewendet werden können. Es listet alle @InApp-Annotationsarten auf, gefiltert nach Art und Typ des Zielelements. </p>
com.top_logic.tl.ai.core.tools.model.TypeAnalysisTool = Tool zur Typenanalyse
com.top_logic.tl.ai.core.tools.model.TypeAnalysisTool.tooltip = Tool zur Analyse von TopLogic-Typ-Abhängigkeiten und -Beziehungen. <p> Dieses Tool bietet Methoden, um zu verstehen, wie Typen im gesamten Modell verwendet werden: Finden aller Verwendungen eines Typs und Finden, wo ein Teil definiert und vererbt wird. Alle Methoden geben JSON-formatierte Strings zurück, die von KI-Agenten verwendet werden können. </p>
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory = Script-Tool-Fabrik
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.Config.tools = Tools
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.Config.tools.tooltip = Die zu erstellenden Tools. <p> Jedes Tool wird durch seine Spezifikation (Name, Beschreibung, Parameter) und eine TL-Script-Implementierung definiert. </p>
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.concurrency-safe = Gleichzeitigkeitssicher
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.concurrency-safe.tooltip = Gibt an, ob dieses Werkzeug sicher parallel zu anderen gleichlaufsicheren Werkzeugen ausgeführt werden kann. <p> Wenn null (Standardwert), ist der Standardwert true. Nur bei Werkzeugen mit externen Gleichzeitigkeitsbeschränkungen auf false überschreiben. </p>
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.description = Beschreibung
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.description.tooltip = Die Beschreibung dessen, was das Tool tut.
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.implementation = Umsetzung
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.implementation.tooltip = Die TL-Script-Implementierung des Tools. <p> Das Skript erhält die Parameter des Tools als Variablen und sollte das Ergebnis des Tools als String zurückgeben. </p>
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.mode = Modus
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.mode.tooltip = Welche Art von Zustandsänderung dieses Werkzeug vornimmt. <p> Standardmäßig <i>werden Daten geschrieben</i>. Für Werkzeuge, die nur Daten lesen, auf <i>"read"</i> gesetzt, oder für Werkzeuge, die nur den aktuellen Benutzer betreffen, auf <i>"user scoped"</i>. </p>
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.name = Name
