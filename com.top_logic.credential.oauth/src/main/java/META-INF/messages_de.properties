com.top_logic.credential.oauth.JwsAlgorithm.tooltip = Signaturalgorithmus einer Client-Assertion (RFC 7518 §3.1). <p> Die Namen der Konstanten sind die Algorithmusnamen der JSON-Web-Signatur. </p>
com.top_logic.credential.oauth.OAuthClient = OAuth-Client
com.top_logic.credential.oauth.OAuthClient.tooltip = Ein OAuth-2.0-Client bei einem Autorisierungsserver: Erzeugt die Token-Anfragen des Nimbus OAuth 2.0 SDK mit Identität, Zugangsdaten, Scope und Parametern des Clients und sendet sie. <p> Der Baustein von Zugangsdaten-Anbietern, die Tokens mit einem beliebigen Grant-Typ beziehen. Ein Anbieter fordert ein Token für seinen Grant an und hält es in einem <i>Token-Cache</i>. </p>
com.top_logic.credential.oauth.OAuthClientConfig.client-authentication = Client-Authentifizierung
com.top_logic.credential.oauth.OAuthClientConfig.client-authentication.tooltip = Wie der Client seine Identität gegenüber dem Autorisierungsserver nachweist. <p> Ist nichts angegeben, ist der Client ein öffentlicher Client, der nur seine Kennung sendet. </p>
com.top_logic.credential.oauth.OAuthClientConfig.client-id = Client-ID
com.top_logic.credential.oauth.OAuthClientConfig.client-id.tooltip = Kennung des Clients beim Autorisierungsserver.
com.top_logic.credential.oauth.OAuthClientConfig.default-token-lifetime = Standard-Token-Lebensdauer
com.top_logic.credential.oauth.OAuthClientConfig.default-token-lifetime.tooltip = Angenommene Lebensdauer eines Zugriffstokens, dessen Lebensdauer der Autorisierungsserver nicht angibt. <p> Lehnt ein Dienst ein solches Token früher ab, verwirft der Nutzer des Dienstes es und ein neues Token wird angefordert. </p>
com.top_logic.credential.oauth.OAuthClientConfig.parameters = Parameter
com.top_logic.credential.oauth.OAuthClientConfig.parameters.tooltip = Zusätzliche Parameter der Token-Anfrage, z. B. <code>audience</code> oder <code>resource</code> (RFC 8707), um den Dienst zu wählen, für den das Token bestimmt ist.
com.top_logic.credential.oauth.OAuthClientConfig.renewal-margin = Erneuerungsvorlauf
com.top_logic.credential.oauth.OAuthClientConfig.renewal-margin.tooltip = Zeit vor dem Ende der Lebensdauer eines Zugriffstokens, zu der es erneuert wird. <p> Als Vorlauf wird höchstens die halbe Lebensdauer des Tokens verwendet, sodass auch kurzlebige Tokens eine Weile genutzt werden. </p>
com.top_logic.credential.oauth.OAuthClientConfig.scope = Scope
com.top_logic.credential.oauth.OAuthClientConfig.scope.tooltip = Durch Leerzeichen getrennte Scopes, die für das Zugriffstoken angefordert werden, z. B. <code>https://cognitiveservices.azure.com/.default</code> für Azure. <p> Ist das Feld leer, gewährt der Autorisierungsserver seinen Standard-Scope. </p>
com.top_logic.credential.oauth.OAuthServer = OAuth-Server
com.top_logic.credential.oauth.OAuthServer.tooltip = Verbindung zu einem OAuth-2.0-Autorisierungsserver. <p> Ermittelt die Endpunkte des Servers, entweder aus der konfigurierten Token-URL oder aus dem Discovery-Dokument des Ausstellers (OIDC Discovery, RFC 8414), und sendet die Anfragen des Nimbus OAuth 2.0 SDK mit den konfigurierten Timeouts an sie. </p> <p> Das Discovery-Dokument wird bei der ersten Verwendung einmal abgerufen und behalten. Ein fehlgeschlagener Abruf wird nicht behalten, die nächste Verwendung versucht es erneut. </p> <p> Keine Exception dieser Klasse enthält einen Anfrageparameter oder den Inhalt einer Antwort, da diese Geheimnisse oder Tokens tragen können. Fehlerantworten werden mit ihrem HTTP-Status, ihrem Fehlercode und ihrer Beschreibung gemeldet. </p>
com.top_logic.credential.oauth.OAuthServerConfig.connect-timeout = Verbindungs-Timeout
com.top_logic.credential.oauth.OAuthServerConfig.connect-timeout.tooltip = Maximale Zeit für den Aufbau einer Verbindung zum Autorisierungsserver.
com.top_logic.credential.oauth.OAuthServerConfig.issuer = Aussteller
com.top_logic.credential.oauth.OAuthServerConfig.issuer.tooltip = Kennung (URL) des Autorisierungsservers, z. B. <code>https://login.example.com/realms/my-realm</code> für einen Keycloak-Realm. <p> Die Endpunkte des Servers werden aus seinem Discovery-Dokument unter <code>&lt;issuer&gt;/.well-known/openid-configuration</code> gelesen. Entweder der Aussteller oder die Token-URL muss angegeben werden. </p>
com.top_logic.credential.oauth.OAuthServerConfig.request-timeout = Anfrage-Timeout
com.top_logic.credential.oauth.OAuthServerConfig.request-timeout.tooltip = Maximale Wartezeit auf die Antwort des Autorisierungsservers, nachdem die Verbindung hergestellt ist.
com.top_logic.credential.oauth.OAuthServerConfig.token-url = Token-URL
com.top_logic.credential.oauth.OAuthServerConfig.token-url.tooltip = URL des Token-Endpunkts des Autorisierungsservers. <p> Entweder die Token-URL oder der Aussteller muss angegeben werden. </p>
com.top_logic.credential.oauth.PrivateKeyJwtAuthentication = Authentifizierung mit privatem Schlüssel (JWT)
com.top_logic.credential.oauth.PrivateKeyJwtAuthentication.Config.algorithm = Algorithmus
com.top_logic.credential.oauth.PrivateKeyJwtAuthentication.Config.algorithm.tooltip = Der Signaturalgorithmus, der auch den Typ des privaten Schlüssels festlegt.
com.top_logic.credential.oauth.PrivateKeyJwtAuthentication.Config.assertion-lifetime = Lebensdauer der Assertion
com.top_logic.credential.oauth.PrivateKeyJwtAuthentication.Config.assertion-lifetime.tooltip = Zeit, bis die Assertion abläuft.
com.top_logic.credential.oauth.PrivateKeyJwtAuthentication.Config.key-id = Schlüssel-ID
com.top_logic.credential.oauth.PrivateKeyJwtAuthentication.Config.key-id.tooltip = Kennung des Schlüssels, die im Header der Assertion gesendet wird. <p> Erlaubt dem Autorisierungsserver, den öffentlichen Schlüssel zu wählen, wenn für den Client mehrere Schlüssel registriert sind, z. B. während eines Schlüsselwechsels. Ist sie leer, wird die Kennung eines JSON Web Keys verwendet. </p>
com.top_logic.credential.oauth.PrivateKeyJwtAuthentication.Config.private-key = Privater Schlüssel
com.top_logic.credential.oauth.PrivateKeyJwtAuthentication.Config.private-key.tooltip = Der private Schlüssel des Clients im Format PKCS#8 PEM (<code>-----BEGIN PRIVATE KEY-----</code>) oder als JSON Web Key (JWK) mit seinem privaten Teil.
com.top_logic.credential.oauth.PrivateKeyJwtAuthentication.tooltip = <i>Client-Authentifizierung</i> mit einem JSON-Web-Token, das mit dem privaten Schlüssel des Clients signiert ist (<code>private_key_jwt</code>, RFC 7523 §2.2). <p> Für jede Anfrage wird eine neue Assertion erzeugt, mit der Client-ID als Aussteller und Subjekt, dem Token-Endpunkt als Zielgruppe, einer zufälligen Kennung und einer kurzen Lebensdauer. Der öffentliche Schlüssel ist für den Client beim Autorisierungsserver registriert, der private Schlüssel verlässt die Anwendung nie. </p> <pre> &lt;client-authentication class="com.top_logic.credential.oauth.PrivateKeyJwtAuthentication" algorithm="ES256" key-id="my-app-2026" &gt; &lt;private-key class="com.top_logic.basic.credential.FileSecretSource" path="/run/secrets/my-app-key.pem"/&gt; &lt;/client-authentication&gt; </pre> <p> Ein passendes Schlüsselpaar wird mit <code>openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out my-app-key.pem</code> (ES256) oder <code>openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out my-app-key.pem</code> (RS256) erzeugt, der zu registrierende öffentliche Schlüssel mit <code>openssl pkey -in my-app-key.pem -pubout</code>. Statt einer PEM-Datei kann der private Schlüssel als JSON Web Key (JWK) mit seinem privaten Teil angegeben werden, wie ihn z. B. ein Schlüsselverwaltungsdienst exportiert. </p>
