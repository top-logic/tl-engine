model.tl.model.i18n.I18NHtml = Internationalized HTML
model.tl.model.i18n.I18NHtml.tooltip = A formatted text that can be entered in several languages. It behaves like the type "HTML", but holds a separate content per language: every user sees the content in their own language, and if there is none for that language, the content of the fallback language configured for the application.
