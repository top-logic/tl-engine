class.com.top_logic.demo.react.temperature.I18NConstants.ERROR_BELOW_ABSOLUTE_ZERO__VALUE = „{0}“ liegt unterhalb des absoluten Nullpunkts.
class.com.top_logic.demo.react.temperature.I18NConstants.ERROR_INVALID_TEMPERATURE__VALUE = „{0}“ ist keine Temperatur. Geben Sie eine Zahl ein, optional gefolgt von einer Einheit: °C, °F oder K.
com.top_logic.demo.react.channel.DemoTickerSource = Quelle des Demo-Tickers
com.top_logic.demo.react.channel.DemoTickerSource.Config.period = Takt
com.top_logic.demo.react.channel.DemoTickerSource.Config.period.tooltip = Die Zeit in Millisekunden zwischen zwei Telegrammen.
com.top_logic.demo.react.channel.DemoTickerSource.tooltip = Demo einer <i>Kanalquelle</i>: ein simulierter serverseitiger Feed mit Temperaturtelegrammen. <p> Jede angezeigte View-Instanz, die diesen Feed abonniert, erhält einen eigenen Feed, der pro Periode ein Telegramm empfängt und den Status des Feeds veröffentlicht: die Anzahl der seit dem Abonnement empfangenen Telegramme, den Zeitpunkt des letzten Telegramms sowie die Texte der letzten paar Telegramme. Der Status vor dem ersten Telegramm wird direkt beim Abonnement veröffentlicht. </p><pre> &lt;source-channel name="ticker" update-interval="250"&gt; &lt;source class="com.top_logic.demo.react.channel.DemoTickerSource" period="100"/&gt; &lt;/source-channel&gt; </pre>
com.top_logic.demo.react.model.tickets.HeadlineStorage = Speicher für Überschriften
com.top_logic.demo.react.model.tickets.HeadlineStorage.tooltip = Abgeleitete Überschrift eines <i>Tickets</i>: sein Name, gefolgt von der Statusbezeichnung in Klammern. <p> Die Statusbezeichnung ist selbst ein abgeleitetes Attribut, das von einem Skript berechnet wird. Ein Formular berechnet die Überschrift des Tickets, das es bearbeitet, in einem <i>Tracing-Bereich</i>: Der Speicher empfängt das Ticket selbst, seine Lesezugriffe werden als Abhängigkeiten des Felds „Überschrift“ gemeldet und anhand der im Formular eingegebenen Werte beantwortet. Die Auswahl eines anderen Status ändert daher die Statusbezeichnung und damit auch die Überschrift, bevor irgendetwas gespeichert wird. </p>
com.top_logic.demo.react.script.TicketFunctions.isClosed = Ist geschlossen
com.top_logic.demo.react.script.TicketFunctions.isClosed.param.ticket.tooltip = Das zu prüfende Ticket.
com.top_logic.demo.react.script.TicketFunctions.isClosed.return = Ob das Ticket den Status „Geschlossen“ hat.
com.top_logic.demo.react.script.TicketFunctions.isClosed.tooltip = Ob das angegebene Ticket geschlossen ist. <p> Der Status des Tickets wird ohne Zugriffsprüfung ausgelesen. </p>
com.top_logic.demo.react.temperature.TemperatureMapping = Temperatur-Abbildung
com.top_logic.demo.react.temperature.TemperatureMapping.tooltip = <i>Speicherzuordnung</i> des Modelltyps <code>demo.temperature:Temperature</code>, bei der eine <i>Temperatur</i> als Wert in Grad Celsius gespeichert wird. <p> Die Zuordnung kennt keinen Kontext: Ein Wert, den sie aus der Datenbank liest, wird in Grad Celsius angezeigt. Die Einheit des Objekts, zu dem der Wert gehört, wird durch die <i>Temperaturspeicherung</i> hinzugefügt. </p> <p> Neben einer <i>Temperatur</i> wird auch eine reine <i>Zahl</i> als Wert akzeptiert und als Grad Celsius interpretiert, sodass ein Skript oder ein Import eine Temperatur festlegen kann, ohne die Wertklasse zu kennen. </p>
com.top_logic.demo.react.temperature.TemperatureStorage = Temperaturspeicherung
com.top_logic.demo.react.temperature.TemperatureStorage.tooltip = Speicherung eines Attributs vom Typ <code>demo.temperature:Temperature</code>, das die Einheit des zugehörigen Objekts an den gelesenen Wert anfügt. <p> Der Wert wird wie jeder andere primitive Wert gespeichert, und zwar gemäß der <i>Temperatur-Abbildung</i> des Typs. Beim Auslesen ermittelt der Speicher die Einheit des Objekts und gibt die in dieser Einheit angezeigte <i>Temperatur</i> aus. Die Einheit wird anhand der Funktion der <i>Annotation der Temperatureinheit</i> des Attributs berechnet. </p> <p> Die Speicherung wird für jedes Attribut des Typs durch die Speicher-Annotation des Typs selbst festgelegt: </p><pre> &lt;datatype name="Temperature" db_type="double" kind="Custom"&gt; &lt;annotations&gt; &lt;storage-algorithm&gt; &lt;temperature-storage/&gt; &lt;/storage-algorithm&gt; &lt;/annotations&gt; &lt;temperature-mapping/&gt; &lt;/datatype&gt; </pre>
com.top_logic.demo.react.temperature.TemperatureUnit = Temperatureinheit
com.top_logic.demo.react.temperature.TemperatureUnit.CELSIUS = Celsius
com.top_logic.demo.react.temperature.TemperatureUnit.CELSIUS.tooltip = Grad Celsius, die Einheit, in der die <i>Temperatur</i> gespeichert wird.
com.top_logic.demo.react.temperature.TemperatureUnit.FAHRENHEIT = Fahrenheit
com.top_logic.demo.react.temperature.TemperatureUnit.FAHRENHEIT.tooltip = Grad Fahrenheit.
com.top_logic.demo.react.temperature.TemperatureUnit.KELVIN = Kelvin
com.top_logic.demo.react.temperature.TemperatureUnit.KELVIN.tooltip = Kelvin.
com.top_logic.demo.react.temperature.TemperatureUnit.tooltip = Eine Einheit, in der eine <i>Temperatur</i> angezeigt und eingegeben wird. <p> Die Konstanten sind wie die Klassifikatoren der Modellaufzählung <code>demo.temperature:TemperatureUnit</code> benannt. </p>
com.top_logic.demo.react.temperature.TemperatureUnitAnnotation = Annotation der Temperatureinheit
com.top_logic.demo.react.temperature.TemperatureUnitAnnotation.tooltip = Annotation eines Attributs vom Typ <code>demo.temperature:Temperature</code>, die angibt, in welcher Einheit dessen Wert angezeigt und eingegeben wird. <pre> &lt;temperature-unit unit="s -&gt; $s.container().get(`demo.temperature:DemoSite#temperatureUnit`)"/&gt; </pre> <p> Ein Attribut ohne diese Annotation zeigt seinen Wert in Grad Celsius an. </p>
com.top_logic.demo.react.temperature.TemperatureUnitAnnotation.unit = Einheit
com.top_logic.demo.react.temperature.TemperatureUnitAnnotation.unit.tooltip = Funktion zur Berechnung der Einheit anhand des Objekts, das das Attribut besitzt. <p> Die Funktion erhält das Objekt und gibt einen Klassifikator der Aufzählung <code>demo.temperature:TemperatureUnit</code> zurück. Wenn sie nichts zurückgibt, wird der Wert in Grad Celsius angezeigt. Die Funktion wird ohne Zugriffsprüfungen ausgewertet: Die Einheit ist Teil der Anzeige, nicht Teil der Daten, die der Benutzer liest. </p>
com.top_logic.demo.react.view.DemoEditorConfig = Konfiguration des Demo-Editors
