admin.ai.tool.web-browser.browserBack = Goes back one step in the browser.
admin.ai.tool.web-browser.browserClick = Clicks an element on the browser's current page.
admin.ai.tool.web-browser.browserNavigate = Opens an address in a real browser of this session and returns the rendered page.
admin.ai.tool.web-browser.browserSaveCookies = Stores the browser's login state under a name for later sessions.
admin.ai.tool.web-browser.browserScreenshot = Captures an image of the browser's current page and stores it in the application.
admin.ai.tool.web-browser.browserSnapshot = Re-reads the browser's current page without navigating.
admin.ai.tool.web-browser.browserType = Types text into an input field on the browser's current page.
admin.ai.tool.web-browser.browserUseCookies = Starts the browser with a stored login state.
