com.top_logic.tl.ai.core.agent.ExecutionMode.tooltip = Der aktuelle Ausführungsmodus des Systems. <p>Beeinflusst, welche Werkzeuge das System zulässt. STRUCTURAL-Werkzeuge (Werkzeuge, die die Anwendungsstruktur verändern) sind nur im <i>Entwicklungs-</i> und <i>Wartungsmodus</i> erlaubt, niemals im <i>Produktionsmodus</i>.</p> <p>Das Bridge-Modul ordnet dies den Zuständen des MaintenanceWindowManager von TopLogic zu.</p>
com.top_logic.tl.ai.core.agent.ModelCapabilityModeSelector = Wahlschalter für den Modellfähigkeitsmodus
