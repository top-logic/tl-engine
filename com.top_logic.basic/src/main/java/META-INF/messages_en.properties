com.top_logic.basic.translation.TranslationService.Config.api-key = Api key
com.top_logic.basic.translation.TranslationService.Config.api-key.tooltip = The API key to authenticate the requests. <p> Recommended is a reference to the variable or file holding the key, so that the key is not part of the configuration: </p> <pre> &lt;api-key name="translation_api_key"/&gt; </pre> <p> An attribute value is an encrypted key, or a plain key with the prefix <code>unencrypted:</code>. Configuring both an API key and credentials is an error. </p>
com.top_logic.basic.translation.TranslationService.Config.credentials = Credentials
com.top_logic.basic.translation.TranslationService.Config.credentials.tooltip = How the requests to the translation API are authenticated, if not with an API key. <p> E.g. no credentials at all, when a gateway in between adds them. Configuring both credentials and an API key is an error. </p>
com.top_logic.basic.translation.TranslationService.Config.max-accumulated-translation-size = Maximum accumulated translation size
com.top_logic.basic.translation.TranslationService.Config.max-accumulated-translation-size.tooltip = The maximum accumulated size of translations. <p> Means of limiting the costs of translations. The size is accumulated while the application is running, and reset to zero when it is stopped or restarted. </p> <p> Don't use this property to disable the service. </p> <p> Use the value <code>0</code> to make the maximal size infinite. </p>
com.top_logic.basic.translation.TranslationService.tooltip = Service for translating texts between languages using an external translation API. <p> <b>Cautions:</b> <ul> <li>Every translation causes costs proportional to the number of translated characters and the total number is limited too.</li> <li>This service does no caching for translations, so for each call of translate, it establishes an <i>HTTPS URL connection</i> to access the translation (REST) API.</li> <li>Be advised to read the documentation for <i>configuration</i> and be careful with usage. For example, if API failed to translate, postpone the failed translation request instead of resending it again and again.</li> </ul> </p> <p> <b>Functionalities:</b> <ul> <li>In order to translate a (XML-structured) text, use: <ul> <li>translate(String, Locale)</li> <li>translate(String, Locale, Locale)</li> </ul> </li> <li>In order to determine, whether a language is supported, use isSupported(Locale).</li> </ul> </p>
