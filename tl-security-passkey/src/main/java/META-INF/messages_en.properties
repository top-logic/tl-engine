com.top_logic.security.passkey.PasskeyRefusedException.Category.OTHER_ACCOUNT = Other account
com.top_logic.security.passkey.PasskeyRefusedException.Category.OTHER_ACCOUNT.tooltip = The passkey belongs to another account than the one the login was started for.
com.top_logic.security.passkey.PasskeyRefusedException.Category.SIGNATURE_COUNTER = Signature counter
com.top_logic.security.passkey.PasskeyRefusedException.Category.SIGNATURE_COUNTER.tooltip = The signature counter of the passkey did not increase: a sign of a cloned authenticator.
com.top_logic.security.passkey.PasskeyRefusedException.Category.UNKNOWN_PASSKEY = Unknown passkey
