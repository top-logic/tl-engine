com.top_logic.tl.ai.core.tool.ToolMethod.tooltip = Markiert eine Methode als ein Werkzeug, das der Agent aufrufen kann. <p>Die mit Anmerkungen versehene Methode wird von <code>AnnotatedTools#from(Object)</code> entdeckt und als <i>Werkzeuginstanz</i> verpackt. Die Parameter der Methode m�ssen mit <i>p</i> annotiert werden, um Beschreibungen f�r den LLM bereitzustellen.</p> <p><b>Thread-Sicherheit:</b> Das Provider-Objekt (die an <code>AnnotatedTools#from(Object)</code> �bergebene Instanz) wird von allen Benutzern gemeinsam genutzt, wenn die <i>Werkzeugregistrierung</i> gemeinsam genutzt wird. Kommentierte Methoden <em>d�rfen</em> sich <em>nicht</em> auf ver�nderbare Instanzfelder st�tzen. Der benutzerspezifische Status sollte �ber einen <i>Werkzeugkontextparameter</i> empfangen und nicht im Anbieterobjekt gespeichert werden.</p>
