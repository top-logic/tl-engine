com.top_logic.presentation.script.PptTextFunctions.measureText.return = Das Wörterbuch, das die Ausdehnung des Textes beschreibt.
com.top_logic.presentation.script.PptTextFunctions.measureText.tooltip = Misst den Platz, den ein Text auf einer PowerPoint-Folie einnimmt. <p> Der Text wird genau so gesetzt wie in einem Textfeld ohne Innenränder, das als Bild gerendert wird. Jeder Zeilenumbruch im Text leitet einen neuen Absatz ein. Wenn eine Breite angegeben wird, wird der Text an Wortgrenzen umgebrochen, um in diese Breite zu passen, andernfalls nur an seinen Zeilenumbrüchen. </p> <p> Das Ergebnis ist ein Wörterbuch mit den folgenden Einträgen: </p> <ul> <li><code>"width"</code>: Die Breite der breitesten Zeile in Punkten.</li> <li><code>"lines"</code>: Die Anzahl der Zeilen nach dem Zeilenumbruch.</li> <li><code>"height"</code>: Die Höhe des Textes in Punkten. Ein Textfeld benötigt diese Höhe zuzüglich seines oberen und unteren Innenrands, um den gesamten Text anzuzeigen.</li> <li><code>"lineHeight"</code>: Der Abstand zwischen zwei Zeilen in Punkten.</li> <li><code>"fontAvailable"</code>: Gibt an, ob die Schriftart auf dem Server installiert ist. Eine nicht installierte Schriftart wird durch eine Standardschriftart ersetzt, sodass die Messung nicht mit dem Text übereinstimmt, den PowerPoint auf einem Computer anzeigt, auf dem die Schriftart vorhanden ist.</li> </ul>
