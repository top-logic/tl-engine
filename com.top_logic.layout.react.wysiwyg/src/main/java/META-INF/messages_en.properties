com.top_logic.layout.react.wysiwyg.ObjectLinkConfig = Object link configuration
com.top_logic.layout.react.wysiwyg.ObjectLinkConfig.dialog-view = Dialog view
com.top_logic.layout.react.wysiwyg.ObjectLinkConfig.dialog-view.tooltip = Path of the view the object is picked in, relative to the view base path.
com.top_logic.layout.react.wysiwyg.ObjectLinkConfig.result-channel = Result channel
com.top_logic.layout.react.wysiwyg.ObjectLinkConfig.result-channel.tooltip = Name of the channel the dialog publishes the picked object on. <p> The editor inserts a link as soon as an object appears on that channel, so the dialog writes it when the user has decided - not on every step of the way there. A dialog that does not close itself when it publishes its result is closed once the link is in the text. </p>
com.top_logic.layout.react.wysiwyg.ObjectLinkConfig.tooltip = Where the editor gets the object a link is inserted for. <p> The user picks the object in a dialog of the application's own making, which publishes the chosen object on a channel. Anything can be picked and in any way, as long as the dialog writes the object to that channel: a table of the objects in question, a search, a tree. </p>
com.top_logic.layout.react.wysiwyg.WysiwygControlProvider = Wysiwyg control provider
com.top_logic.layout.react.wysiwyg.WysiwygControlProvider.Config.object-link = Object link
com.top_logic.layout.react.wysiwyg.WysiwygControlProvider.Config.object-link.tooltip = Where the editor gets the object a link is inserted for. <p> Set to offer the button inserting a link to an application object. Without it, the editor has no such button. </p>
com.top_logic.layout.react.wysiwyg.WysiwygControlProvider.tooltip = <i>React field control provider</i> for tl.model.wysiwyg:Html attributes. <p> The editor offers a button inserting a link to an application object where an <i>object link configuration</i> says which dialog the object is picked in. Without that option, the editor formats text and nothing else. </p>
