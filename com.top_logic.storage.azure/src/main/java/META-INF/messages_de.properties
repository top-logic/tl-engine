com.top_logic.storage.azure.blob.CloudBasedRepository = Wolkenbasiertes Repository
com.top_logic.storage.azure.blob.CloudBasedRepository.Config.connect-string = Zeichenfolge verbinden
com.top_logic.storage.azure.blob.CloudBasedRepository.Config.connect-string.tooltip = String, der für die Verbindung mit dem Blob-Speicher verwendet wird. <p> Die Verbindungszeichenfolge enthält den Kontoschlüssel und ist daher ein Geheimnis. Empfohlen wird ein Verweis auf die Verbindungszeichenfolge über den Namen des Geheimnisses, damit sie nicht Teil der Konfiguration ist, z. B. <code>&lt;connect-string name="blob_connect"/&gt;</code>; die Standard-Geheimnisablage liest sie aus der gleichnamigen Umgebungsvariable, die die Verbindungszeichenfolge im Klartext enthält. Ein Attributwert ist eine verschlüsselte Verbindungszeichenfolge oder eine Verbindungszeichenfolge im Klartext mit dem Präfix <code>unencrypted:</code>. </p> <p> Die Verbindungszeichenfolge wird beim Anlegen des Repositorys beim Start gelesen. </p>
com.top_logic.storage.azure.blob.CloudBasedRepository.Config.container-name = Container-Name
com.top_logic.storage.azure.blob.CloudBasedRepository.Config.container-name.tooltip = Name des zu öffnenden Behälters.
com.top_logic.storage.azure.blob.CloudBasedRepository.Config.directory-name = Name des Verzeichnisses
com.top_logic.storage.azure.blob.CloudBasedRepository.Config.directory-name.tooltip = Name des Basisverzeichnisses, in dem sich dieses Repository befindet.
com.top_logic.storage.azure.blob.CloudBasedRepository.tooltip = Cloud-basierte Implementierung eines Top-Logik-Repositorys.
