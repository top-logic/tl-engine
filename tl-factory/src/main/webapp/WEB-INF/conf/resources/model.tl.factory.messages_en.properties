model.tl.factory.WorkspaceStatus.STOPPED = Stopped
model.tl.factory.WorkspaceStatus.STOPPED.tooltip = The container is stopped; its volumes are kept.
model.tl.factory.WorkspaceStatus.STOPPING = Stopping
