com.top_logic.tl.ai.core.mcp.McpServerRegistry.McpServerConfig.tool-timeout-seconds.tooltip = Timeout in Sekunden für einzelne Tool-Aufrufe.
com.top_logic.tl.ai.core.mcp.McpServerRegistry.McpServerConfig.transport = Transport
com.top_logic.tl.ai.core.mcp.McpServerRegistry.McpServerConfig.transport.tooltip = Transportkonfiguration (stdio oder HTTP).
com.top_logic.tl.ai.core.mcp.McpServerRegistry.tooltip = Dienst, der Verbindungen zu externen MCP-Servern verwaltet. <p> Wird über XML mit benannten MCP-Server-Einträgen konfiguriert. Jeder Server wird beim Start verbunden, und seine Tools werden über den Aufruf MCP tools/list ermittelt. Agenten referenzieren Server namentlich über ihr mcpServers-Attribut; die <i>Agentenfabrik</i> zieht die Tools des Servers in den <i>Tool-Katalog</i> des Agenten. </p>
com.top_logic.tl.ai.core.mcp.NamedValueConfig = Konfiguration von benannten Werten
com.top_logic.tl.ai.core.mcp.NamedValueConfig.tooltip = Ein benannter String-Wert zur Verwendung in Config-Maps. <p> Wird für Umgebungsvariablen und HTTP-Header in MCP-Transportkonfigurationen verwendet. In XML: <entry name="KEY" value="VALUE"/> </p>
com.top_logic.tl.ai.core.mcp.NamedValueConfig.value = Wert
com.top_logic.tl.ai.core.mcp.NamedValueConfig.value.tooltip = Der Wert.
com.top_logic.tl.ai.core.mcp.StdioMcpTransport = Stdio-MCP-Transport
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.args = Argumente
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.args.tooltip = Befehlszeilenargumente, die an den Befehl übergeben werden. <p> In der XML-Konfiguration als kommagetrennte Werte angeben: args="-y,@modelcontextprotocol/server-github" </p>
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.command = Befehl
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.command.tooltip = Der auszuführende Befehl (z. B. "npx" oder "python").
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.env = Env
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.env.tooltip = Umgebungsvariablen für den Unterprozess. <p> Verwenden Sie dies, um API-Schlüssel zu übergeben, ohne sie in die Konfiguration aufzunehmen: <entry name="GITHUB_TOKEN" value="${env:GITHUB_TOKEN}"/> </p>
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.tooltip = <i>Mcp-Transportkonfiguration</i>, die einen MCP-Stdio-Transport (Unterprozess) erzeugt. <p> Der MCP-Server wird als Kindprozess gestartet. Die Kommunikation erfolgt über stdin/stdout unter Verwendung von JSON-RPC. Umgebungsvariablen können verwendet werden, um API-Schlüssel oder andere Geheimnisse zu übergeben. </p>
com.top_logic.tl.ai.core.provider.AuthScheme = Auth-Schema
com.top_logic.tl.ai.core.provider.AuthScheme.API_KEY = Api-Schlüssel
com.top_logic.tl.ai.core.provider.AuthScheme.API_KEY.tooltip = Azure <code>OpenAI</code>: api-key: <key>. <p>Wird verwendet, wenn eine direkte Verbindung zu einem Azure <code>OpenAI</code> hergestellt wird, der den Abonnementschlüssel im api-key-Header anstelle eines Autorisierungstokens benötigt.</p>
com.top_logic.tl.ai.core.provider.AuthScheme.BEARER = Bearer
com.top_logic.tl.ai.core.provider.AuthScheme.BEARER.tooltip = Standard OAuth2-Inhaber-Token: Autorisierung: Bearer <key>. <p>Wird von <code>OpenAI</code>, Mistral, <code>xAI</code> und Azure-kompatiblen Gateways wie Nexus verwendet, die Bearer-Token im Standard-Header akzeptieren.</p>
com.top_logic.tl.ai.core.provider.AuthScheme.tooltip = HTTP-Authentifizierungsschema, das beim Senden von Anfragen an einen LLM-Anbieter-Endpunkt verwendet wird. <p><i>Bearer</i> deckt den Standard <code>OpenAI</code> Authorization: Bearer <key> Header. <i>Api key</i> deckt die <code>OpenAI</code> ab, den Schlüssel in einem einfachen api-key-Header ohne Schema-Präfix zu senden.</p>
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.base-url = Basis-URL
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.base-url.tooltip = Die Basis-URL des Anbieter-API-Endpunkts.
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.catalog-provider-id = Kataloganbieter-ID
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.catalog-provider-id.tooltip = Die Anbieter-ID, die zum Abrufen von Modell-Metadaten aus dem externen Katalog (models.dev) verwendet wird. <p> Jeder Anbieter liefert einen sinnvollen Standardwert, der seinem models.dev-Eintrag entspricht. Lassen Sie den Eintrag leer für Anbieter, die keinen Remote-Katalog haben (z. B. lokale Server) - ihre Modelle müssen manuell im Modellkatalog definiert werden. </p>
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.connect-timeout = Verbindungs-Timeout
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.connect-timeout.tooltip = TCP-Verbindungszeitlimit in Sekunden. <p> Legt fest, wie lange der HTTP-Client auf den Aufbau einer TCP-Verbindung zum Anbieter-Endpunkt wartet, bevor er aufgibt. </p>
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.custom-headers = Benutzerdefinierte Header
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.custom-headers.tooltip = Zusätzliche HTTP-Header, die bei jeder Anfrage an diesen Anbieter gesendet werden. <p> Nützlich für benutzerdefinierte Authentifizierungsschemata, Routing-Header oder anbieterspezifische Metadaten, die jeden API-Aufruf begleiten müssen. </p>
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.models = Modelle
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.models.tooltip = Für diesen Anbieter freigegebene Modellnamen. <p> Nur die hier aufgeführten Modelle können verwendet werden. Wenn leer, werden keine Modelle von diesem Anbieter bereitgestellt. </p>
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.request-timeout = Anfrage-Timeout
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.request-timeout.tooltip = Gesamt-Timeout für Streaming-Anfragen in Sekunden. <p> Maximale Wanduhrzeit, die für eine vollständige Streaming-Anfrage zulässig ist, einschließlich der Zeit für den Empfang von Streaming-Token. Eine großzügige Vorgabe trägt langlaufenden Agentenantworten Rechnung. </p>
com.top_logic.tl.ai.core.provider.LLMService = LLM-Dienst
com.top_logic.tl.ai.core.provider.LLMService$AgentExecutionConfig = Konfiguration der Agentenausführung
com.top_logic.tl.ai.core.provider.LLMService$AgentExecutionConfig.tooltip = Konfiguration der Agentenausführung: Chat-Einstiegspunkt, Standardmodell und Überschreibungen pro Agent. <p> Agentendefinitionen (Identität, System-Prompt, Tools, Delegationen) werden von <i>TopLogic-Agenten und Skills</i> und der Wissensbasis verwaltet. Dieser Abschnitt steuert die operative Seite: Welcher Agent als Chat-Einstiegspunkt dient, welches Modell standardmäßig verwendet wird und wie die Modellauswahl und die Ausführungsparameter von den einzelnen Agenten übersteuert werden. </p>
com.top_logic.tl.ai.core.provider.LLMService$AgentOverride = Agenten-Überschreibung
com.top_logic.tl.ai.core.provider.LLMService$AgentOverride.tooltip = Überschreibung pro Agent für Modellauswahl und Ausführungsparameter. <p> Jeder Eintrag setzt das Standardmodell für einen bestimmten Agenten außer Kraft und konfiguriert optional Ausführungsparameter (maximale Durchläufe, Timeouts, Tool-Auswahl) und modellspezifische Einstellungen (Temperatur, Reasoning-Aufwand). Parameter, die auf Null gesetzt werden, erben die Vorgaben aus dem Modellkatalog oder die Systemvorgaben. </p>
com.top_logic.tl.ai.core.provider.LLMService$ModelCatalogConfig = Konfiguration des Modellkatalogs
com.top_logic.tl.ai.core.provider.LLMService$ModelCatalogConfig.tooltip = Konfiguration für den Modell-Metadatenkatalog. <p> Enthält schreibgeschützte Metadaten über die Fähigkeiten der einzelnen Modelle (Tool-Aufrufe, Reasoning, Temperaturunterstützung) und deren Grenzen (Kontext-Fenster, maximale Ausgabe-Token). Der Katalog wird beim Start für alle im Abschnitt Anbieter konfigurierten Modelle aus <a href="https://models.dev">models.dev</a> geholt. Modelle, die nicht im Remote-Katalog gefunden werden (z. B. lokal gehostete Modelle), können manuell in den Modellüberschreibungen definiert werden. </p>
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.agent-overrides = Agenten-Überschreibungen
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.agent-overrides.tooltip = Überschreibungen pro Agent. Agenten, die hier nicht aufgeführt sind, verwenden das Standardmodell. Gilt für alle Agenten unabhängig von der Quelle (konfigurationsdefiniert oder KB).
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.chat-entry-point = Chat-Einstiegspunkt
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.chat-entry-point.tooltip = Der Agent, der als Haupteinstiegspunkt dient, wenn ein Benutzer eine neue Chatsitzung eröffnet. <p> Dieser Agent empfängt die anfängliche Benutzernachricht und organisiert die Unterhaltung. Er kann über seine Delegationsliste an andere Agenten delegieren. </p>
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.default-model = Standardmodell
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.default-model.tooltip = Das Fallback-Modell, das von Agenten verwendet wird, die keine explizite Überschreibung in <i>Agentenüberschreibungen</i> haben. <p> Um einem einzelnen Agenten ein bestimmtes Modell (und optionale Einstellungsparameter) zuzuweisen, fügen Sie stattdessen einen Eintrag in der Agentenüberschreibungszuordnung hinzu. </p>
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.owner = Eigentümer
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.owner.tooltip = Die umschließende <i>Dienstkonfiguration</i>, die verwendet wird, um konfigurierte Modelle aus ihrem Anbieterabschnitt innerhalb desselben Bearbeitungsformulars aufzulösen.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.context-window = Kontext-Fenster
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.context-window.tooltip = Größe des Kontext-Fensters überschreiben, oder null für Katalogstandard.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-retries = Maximale Wiederholungsversuche
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-retries.tooltip = Maximale Wiederholungsversuche bei vorübergehenden Fehlern oder null als Standard.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-tokens = Maximale Token
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-tokens.tooltip = Maximale Ausgabe-Token pro LLM-Aufruf oder null für Katalogstandard.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-tool-result-chars = Maximale Zeichenanzahl für das Tool-Ergebnis
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-tool-result-chars.tooltip = Maximale Anzahl von Zeichen pro Tool-Ergebnis oder null als Standard.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-turns = Maximale Durchläufe
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-turns.tooltip = Maximale Durchläufe der Agentenschleife oder null als Standard.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.model = Modell
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.model.tooltip = Das für diesen Agenten zu verwendende Modell.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.owner = Eigentümer
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.owner.tooltip = Die umschließende <i>Agentenausführungskonfiguration</i>, die verwendet wird, um konfigurierte Modelle aus dem Anbieterbereich desselben Bearbeitungsformulars aufzulösen.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.reasoning-effort = Reasoning-Aufwand
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.reasoning-effort.tooltip = <code>xAI</code> Begründungsaufwand (niedrig/mittel/hoch) oder Null.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.reasoning-summary = Reasoning-Zusammenfassung
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.reasoning-summary.tooltip = <code>xAI</code> Zusammenfassung der Gründe (automatisch/ausführlich) oder Null.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.temperature = Temperatur
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.temperature.tooltip = Sampling-Temperatur oder null als Standardwert.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.thinking-effort = Thinking-Aufwand
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.thinking-effort.tooltip = Anthropic Thinking-Aufwand (low/medium/high/max) oder null.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.timeout-seconds = Zeitüberschreitung in Sekunden
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.timeout-seconds.tooltip = Anfrage-Timeout in Sekunden oder null als Standard.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.tool-choice = Tool-Auswahl
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.tool-choice.tooltip = Tool-Auswahl (AUTO/REQUIRED/NONE) oder null für den Standardwert des Anbieters.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.top-k = Top-K
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.top-k.tooltip = Anthropic Top-K-Parameter oder null.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.top-p = Top-P
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.top-p.tooltip = Top-p-Sampling-Parameter oder null als Standard.
com.top_logic.tl.ai.core.provider.LLMService.Config.agent-execution = Agentenausführung
com.top_logic.tl.ai.core.provider.LLMService.Config.agent-execution.tooltip = Konfiguration der Agentenausführung: Chat-Einstiegspunkt, Standardmodell und Überschreibungen pro Agent für Modellauswahl und Ausführungsparameter.
com.top_logic.tl.ai.core.provider.LLMService.Config.model-catalog = Modellkatalog
com.top_logic.tl.ai.core.provider.LLMService.Config.model-catalog.tooltip = Modell-Metadatenkatalog mit einer Beschreibung der Fähigkeiten und Grenzen der einzelnen Modelle. <p> Wird beim Start automatisch aus dem externen <a href="https://models.dev">models.dev-Katalog</a> gefüllt. Für Modelle, die nicht im externen Katalog aufgeführt sind (z. B. lokale oder benutzerdefinierte Modelle), können manuelle Überschreibungen hinzugefügt werden. </p>
com.top_logic.tl.ai.core.provider.LLMService.Config.providers = Anbieter
com.top_logic.tl.ai.core.provider.LLMService.Config.providers.tooltip = Die konfigurierten LLM-Anbieter, indiziert nach Anbieternamen. <p> Jeder Eintrag enthält anbieterspezifische Eigenschaften. </p>
com.top_logic.tl.ai.core.provider.LLMService.ModelCatalogConfig.catalog-url = Katalog-URL
com.top_logic.tl.ai.core.provider.LLMService.ModelCatalogConfig.catalog-url.tooltip = Die URL des externen Modellkatalogs.
com.top_logic.tl.ai.core.provider.LLMService.ModelCatalogConfig.llm-configuration = Metadaten zum Modell
com.top_logic.tl.ai.core.provider.LLMService.ModelCatalogConfig.llm-configuration.tooltip = Metadaten pro Modell (Grenzen, Fähigkeiten). <p> Werden beim Starten automatisch aus dem externen Katalog geladen. Schreibgeschützt - nicht manuell ändern. </p>
com.top_logic.tl.ai.core.provider.LLMService.ModelCatalogConfig.model-overrides = Modell-Überschreibungen
com.top_logic.tl.ai.core.provider.LLMService.ModelCatalogConfig.model-overrides.tooltip = Manuell definierte Modell-Metadaten für Modelle, die nicht im Remote-Katalog enthalten sind. <p> Verwenden Sie dies für lokale Modelle oder <code>OpenAI</code> Endpunkte, deren Modelle nicht in models.dev aufgeführt sind. Diese Einträge haben Vorrang vor Katalogeinträgen mit demselben Namen. </p>
com.top_logic.tl.ai.core.provider.LLMService.tooltip = Zentraler Dienst für die LLM-Anbieterverwaltung, Modellauflösung und Konfiguration der Agentenausführung. <p> Die Konfiguration des Dienstes ist in drei Abschnitte unterteilt: </p> <ol> <li><b>Anbieter</b> - Verbindungsdetails für jeden LLM-Anbieter (API-Schlüssel, Basis-URLs, Modellzulassungslisten). Jeder Provider-Eintrag definiert, wie ein bestimmter LLM-API-Endpunkt erreicht werden kann und welche Modelle aktiviert sind.</li> <li><b>Agentenausführung</b> - konfiguriert den Chat-Entry-Point-Agent, das von allen Agenten verwendete Standardmodell und optionale Überschreibungen pro Agent für die Modellauswahl und Ausführungsparameter (Temperatur, maximale Token, Timeouts, Reasoning-Aufwand usw.).</li> <li><b>Modellkatalog</b> - Nur-Lese-Metadaten, die die Fähigkeiten jedes Modells (Tool-Aufrufe, Reasoning, Temperaturunterstützung) und die Grenzen (Kontext-Fenster, maximale Ausgabe-Token) beschreiben. Wird beim Start automatisch aus dem externen <a href="https://models.dev">models.dev-Katalog</a> befüllt, mit optionalen manuellen Überschreibungen für lokale oder nicht aufgelistete Modelle.</li> </ol>
com.top_logic.tl.ai.core.provider.ProviderException$Kind = Art
com.top_logic.tl.ai.core.provider.ProviderException$Kind.tooltip = Klassifizierung des Fehlers.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.AUTHENTICATION = Authentifizierung
com.top_logic.tl.ai.core.provider.ProviderException.Kind.AUTHENTICATION.tooltip = 401/403 - ungültiger oder abgelaufener API-Schlüssel.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.BILLING = Rechnungsstellung
com.top_logic.tl.ai.core.provider.ProviderException.Kind.BILLING.tooltip = 402 - Abrechnungs- oder Zahlungsproblem. Terminal, nicht wiederholbar.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.CONTEXT_WINDOW_EXCEEDED = Kontext-Fenster überschritten
com.top_logic.tl.ai.core.provider.ProviderException.Kind.CONTEXT_WINDOW_EXCEEDED.tooltip = Die Anfrage ist zu groß für das Kontext-Fenster des Modells.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.INVALID_REQUEST = Ungültige Anfrage
com.top_logic.tl.ai.core.provider.ProviderException.Kind.INVALID_REQUEST.tooltip = 400 - Falsch geformte Anfrage.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.OVERLOADED = Überlastet
com.top_logic.tl.ai.core.provider.ProviderException.Kind.OVERLOADED.tooltip = 529 oder 5xx - Anbieter überlastet oder vorübergehend nicht verfügbar.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.RATE_LIMITED = Ratenbegrenzt
com.top_logic.tl.ai.core.provider.ProviderException.Kind.RATE_LIMITED.tooltip = 429 - Ratenbegrenzt. Prüfen Sie <code>ProviderException#retryAfter()</code>.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.UNKNOWN = Unbekannt
com.top_logic.tl.ai.core.provider.ProviderException.Kind.UNKNOWN.tooltip = Nicht klassifizierter Fehler.
com.top_logic.tl.ai.core.provider.ResponseFormat = Antwortformat
com.top_logic.tl.ai.core.provider.ResponseFormat.JSON = JSON
com.top_logic.tl.ai.core.provider.ResponseFormat.JSON.tooltip = Strukturierte JSON-Objekt-Antwort.
com.top_logic.tl.ai.core.provider.ResponseFormat.TEXT = Text
com.top_logic.tl.ai.core.provider.ResponseFormat.TEXT.tooltip = Antwort im Klartext (Standard).
com.top_logic.tl.ai.core.provider.ResponseFormat.tooltip = Steuert das Format der LLM-Antwort.
com.top_logic.tl.ai.core.provider.ToolChoice = Auswahl der Tools
com.top_logic.tl.ai.core.provider.ToolChoice.AUTO = Auto
com.top_logic.tl.ai.core.provider.ToolChoice.AUTO.tooltip = Der LLM entscheidet, ob ein Tool aufgerufen werden soll (Standard).
com.top_logic.tl.ai.core.provider.ToolChoice.NONE = Keine
com.top_logic.tl.ai.core.provider.ToolChoice.NONE.tooltip = Das LLM darf kein Tool aufrufen.
com.top_logic.tl.ai.core.provider.ToolChoice.REQUIRED = Erforderlich
com.top_logic.tl.ai.core.provider.ToolChoice.REQUIRED.tooltip = Der LLM muss mindestens ein Tool aufrufen.
com.top_logic.tl.ai.core.provider.ToolChoice.tooltip = Steuert, wie der LLM die Tools während einer Anfrage auswählt.
com.top_logic.tl.ai.core.provider.anthropic.AnthropicProviderConfig = Anthropic
com.top_logic.tl.ai.core.provider.anthropic.AnthropicProviderConfig.Config.api-key = Api-Schlüssel
com.top_logic.tl.ai.core.provider.anthropic.AnthropicProviderConfig.Config.api-key.tooltip = Der API-Schlüssel für die Anthropic-Authentifizierung.
com.top_logic.tl.ai.core.provider.anthropic.AnthropicProviderConfig.Config.version = Version
com.top_logic.tl.ai.core.provider.anthropic.AnthropicProviderConfig.Config.version.tooltip = Die Zeichenkette der Anthropic-API-Version, die als anthropic-version-Header gesendet wird.
com.top_logic.tl.ai.core.provider.anthropic.AnthropicProviderConfig.tooltip = <i>LLM-Anbieterkonfiguration</i> für die Anthropic Messages API. <p> Stellt die Versions-Eigenschaft bereit, die spezifisch für die Anthropic-Header-Anforderung anthropic-version ist. </p>
com.top_logic.tl.ai.core.provider.bedrock.BedrockConverseProviderConfig = AWS-Bedrock
com.top_logic.tl.ai.core.provider.bedrock.BedrockConverseProviderConfig.Config.api-key = Api-Schlüssel
com.top_logic.tl.ai.core.provider.bedrock.BedrockConverseProviderConfig.Config.api-key.tooltip = Der API-Schlüssel, der als Authorization: Bearer. <p>Kann bei Endpunkten, die einen anderen Authentifizierungsmechanismus verwenden (z. B. IAM-Instanzrollen oder benutzerdefinierte Gateway-Injektion), null sein.</p>
com.top_logic.tl.ai.core.provider.bedrock.BedrockConverseProviderConfig.tooltip = <i>LLM-Anbieterkonfigurationsvoreinstellung</i> für die AWS Bedrock Converse-Streaming-API. <p> Konfiguriert einen <i>Bedrock Converse-Anbieter</i> für jeden Bedrock-kompatiblen Endpunkt, einschließlich Nexus-Claude-Gateways und direkte regionale AWS Bedrock-Endpunkte{region}. Die Authentifizierung verwendet ein Bearer-Token-Schema, das vom <i>Bedrock-Converse-Anbieter</i> übernommen wird. </p> <p> Auf Bedrock gibt es keinen Endpunkt für die Modellauflistung, daher müssen Modelle manuell zur Modellliste hinzugefügt werden und discoverModels() gibt immer eine leere Liste zurück. </p>
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry$Config = Konfiguration
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry$Config.tooltip = Konfiguration der Modell-Metadaten.
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry$OverrideConfig = Überschreibungskonfiguration
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry$OverrideConfig.tooltip = Bearbeitbare Modell-Metadaten für manuell konfigurierte Modelle (z. B. lokale oder <code>OpenAI</code> Endpunkte), die sich nicht im Remote-Katalog befinden. <p> Anders als bei der <i>Konfiguration</i> sind diese Eigenschaften in der Admin-UI beschreibbar und werden beim Start nicht gelöscht. </p>
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.attachment = Dateianhänge
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.attachment.tooltip = Ob das Modell Dateianhänge unterstützt.
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.context-window = Kontext-Fenster
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.context-window.tooltip = Maximale Größe des EingabeKontext-Fensters in Token.
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.knowledge-cutoff = Wissensstichtag
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.knowledge-cutoff.tooltip = Stichtag für das Wissen der Trainingsdaten (z. B. "2026-01-31").
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.last-updated = Zuletzt aktualisiert
