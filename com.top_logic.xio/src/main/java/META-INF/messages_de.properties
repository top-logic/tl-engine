com.top_logic.xio.importer.handlers.SkipDeep.Config.warn.tooltip = Warnungen über ignorierte Tags melden.
com.top_logic.xio.importer.handlers.SkipDeep.tooltip = <i>Handler</i>, der den gesamten XML-Inhalt bis zu einem passenden End-Tag überspringt.
