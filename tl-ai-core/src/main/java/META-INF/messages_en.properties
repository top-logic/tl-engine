class.com.top_logic.ai.service.agents.I18NConstants.ADAPTIVE_THINKING_NOT_SUPPORTED = Adaptive thinking is not supported by this model. Use 'ENABLED' instead.
class.com.top_logic.ai.service.agents.I18NConstants.MAX_TOKENS_MUST_EXCEED_THINKING_BUDGET = Maximum tokens must be greater than thinking budget tokens.
class.com.top_logic.ai.service.agents.I18NConstants.MAX_TOKENS_REQUIRED_WHEN_THINKING_ENABLED = Maximum tokens is required when thinking type is ENABLED.
class.com.top_logic.ai.service.agents.I18NConstants.THINKING_BUDGET_REQUIRED_WHEN_ENABLED = Thinking budget is required when thinking type is ENABLED.
class.com.top_logic.ai.service.agents.background.I18NConstants.CHAT_CONTEXT_INPUT_NOT_ALLOWED_FOR_APPLICATION = Chat context input requires chat scope. Use a custom message, TL-Script, or provider input for application-scoped agents.
class.com.top_logic.ai.service.agents.background.I18NConstants.CHAT_CONTEXT_INPUT_NOT_ALLOWED_FOR_PRE_TURN = Chat context input is not available for pre-turn triggers. Use a custom message, TL-Script, or provider input instead.
class.com.top_logic.ai.service.agents.background.I18NConstants.CHAT_TRIGGER_NOT_ALLOWED_FOR_APPLICATION = Pre-turn and post-turn triggers require chat scope. Use a scheduled trigger for application scope.
com.top_logic.ai.service.agents.AgentConfig$ResponseFormatOption = Response format option
com.top_logic.ai.service.agents.AgentConfig$ResponseFormatOption.tooltip = Response format options supported by OpenAI/Mistral builders.
com.top_logic.ai.service.agents.AgentConfig.ResponseFormatOption.DEFAULT = Default
com.top_logic.ai.service.agents.AgentConfig.ResponseFormatOption.DEFAULT.tooltip = Use the provider default response format.
com.top_logic.ai.service.agents.AgentConfig.ResponseFormatOption.JSON = JSON
com.top_logic.ai.service.agents.AgentConfig.ResponseFormatOption.JSON.tooltip = JSON response format.
com.top_logic.ai.service.agents.AgentConfig.ResponseFormatOption.TEXT = Text
com.top_logic.ai.service.agents.AgentConfig.ResponseFormatOption.TEXT.tooltip = Plain text response format.
com.top_logic.ai.service.agents.AgentConfig.description = Description
com.top_logic.ai.service.agents.AgentConfig.description.tooltip = Short description of this agent's purpose. <p> Used as the tool description when other agents delegate to this agent. For example: "Read-only model inspection: modules, types, parts, annotations, search". </p>
com.top_logic.ai.service.agents.AgentConfig.disable-parallel-tool-use = Disable parallel tool use
com.top_logic.ai.service.agents.AgentConfig.disable-parallel-tool-use.tooltip = Whether Anthropic may execute tool calls in parallel. <p> Only visible for Anthropic models. </p>
com.top_logic.ai.service.agents.AgentConfig.frequency-penalty = Frequency penalty
com.top_logic.ai.service.agents.AgentConfig.frequency-penalty.tooltip = Frequency penalty penalizes tokens proportionally to how often they have already appeared, reducing repetition (-2.0 to 2.0). <p> Positive values decrease the likelihood of the model repeating the same phrases verbatim. Only visible for OpenAI models. </p>
com.top_logic.ai.service.agents.AgentConfig.is-adaptive-thinking-capable = Is adaptive thinking capable
com.top_logic.ai.service.agents.AgentConfig.is-adaptive-thinking-capable.tooltip = Whether the selected model supports adaptive thinking.
com.top_logic.ai.service.agents.AgentConfig.is-anthropic-provider = Is anthropic provider
com.top_logic.ai.service.agents.AgentConfig.is-anthropic-provider.tooltip = Whether the selected model belongs to the Anthropic provider.
com.top_logic.ai.service.agents.AgentConfig.is-mistral-provider = Is mistral provider
com.top_logic.ai.service.agents.AgentConfig.is-mistral-provider.tooltip = Whether the selected model belongs to the Mistral provider.
com.top_logic.ai.service.agents.AgentConfig.is-openai-provider = Is openai provider
com.top_logic.ai.service.agents.AgentConfig.is-openai-provider.tooltip = Whether the selected model belongs to the OpenAI provider.
com.top_logic.ai.service.agents.AgentConfig.is-reasoning-effort-capable = Is reasoning effort capable
com.top_logic.ai.service.agents.AgentConfig.is-reasoning-effort-capable.tooltip = Whether the selected model supports reasoning effort.
com.top_logic.ai.service.agents.AgentConfig.is-thinking-capable = Is thinking capable
com.top_logic.ai.service.agents.AgentConfig.is-thinking-capable.tooltip = Whether the currently selected model supports extended thinking. <p> This derived property is true when the model supports <i>thinking enabled</i> or <i>thinking adaptive</i>. It controls the visibility of thinking-related fields. </p>
com.top_logic.ai.service.agents.AgentConfig.max-retries = Maximum retries
com.top_logic.ai.service.agents.AgentConfig.max-retries.tooltip = Maximum retries for transient provider/API failures.
com.top_logic.ai.service.agents.AgentConfig.max-tokens = Maximum tokens
com.top_logic.ai.service.agents.AgentConfig.max-tokens.tooltip = The maximum number of output tokens for the model response. <p> Required when <i>Thinking type</i> is <i>enabled</i>. </p>
com.top_logic.ai.service.agents.AgentConfig.model = Model
com.top_logic.ai.service.agents.AgentConfig.model.tooltip = The LLM model name to use for this agent (e.g. "claude-sonnet-4-20250514"). <p> Options are populated from the models listed in the <i>agent registry</i> provider configs. </p>
com.top_logic.ai.service.agents.AgentConfig.presence-penalty = Presence penalty
com.top_logic.ai.service.agents.AgentConfig.presence-penalty.tooltip = Presence penalty penalizes tokens that have already appeared in the text, encouraging the model to talk about new topics (-2.0 to 2.0). <p> Positive values increase the likelihood of exploring new subjects. Only visible for OpenAI models. </p>
com.top_logic.ai.service.agents.AgentConfig.reasoning-effort = Reasoning effort
com.top_logic.ai.service.agents.AgentConfig.reasoning-effort.tooltip = The reasoning effort level for OpenAI reasoning models. <p> Only visible for models that support reasoning effort (OpenAI o-series, GPT-5). </p>
com.top_logic.ai.service.agents.AgentConfig.response-format = Response format
com.top_logic.ai.service.agents.AgentConfig.response-format.tooltip = Response format preference. <p> Only visible for providers that support response-format control. </p>
com.top_logic.ai.service.agents.AgentConfig.return-thinking = Return thinking
com.top_logic.ai.service.agents.AgentConfig.return-thinking.tooltip = Whether to include the model's thinking in the response. <p> Only visible when the model supports thinking and a thinking type is selected. When true, the thinking content is included alongside the response text. </p>
com.top_logic.ai.service.agents.AgentConfig.seed = Seed
com.top_logic.ai.service.agents.AgentConfig.seed.tooltip = Seed for deterministic output. When set, repeated requests with the same seed and parameters should return similar results. <p> Useful for testing and debugging. Only visible for OpenAI models. </p>
com.top_logic.ai.service.agents.AgentConfig.send-thinking = Send thinking
com.top_logic.ai.service.agents.AgentConfig.send-thinking.tooltip = Whether to send previous thinking blocks in follow-up messages. <p> Only visible when the model supports thinking and a thinking type is selected. When true, the thinking content from previous turns is included in the conversation history sent to the model. </p>
com.top_logic.ai.service.agents.AgentConfig.skills = Skills
com.top_logic.ai.service.agents.AgentConfig.skills.tooltip = Comma-separated list of skill IDs available to this agent. <p> Skills are referenced by their registered name in the <i>agent registry</i> configuration. </p>
com.top_logic.ai.service.agents.AgentConfig.stop-sequences = Stop sequences
com.top_logic.ai.service.agents.AgentConfig.stop-sequences.tooltip = Optional stop sequences that terminate generation when encountered.
com.top_logic.ai.service.agents.AgentConfig.system-prompt = System prompt
com.top_logic.ai.service.agents.AgentConfig.system-prompt.tooltip = The system prompt that defines this agent's behavior and instructions.
com.top_logic.ai.service.agents.AgentConfig.temperature = Temperature
com.top_logic.ai.service.agents.AgentConfig.temperature.tooltip = The sampling temperature for the model (0.0 to 1.0). <p> Lower values make the output more deterministic, higher values make it more creative. </p>
com.top_logic.ai.service.agents.AgentConfig.thinking-budget-tokens = Thinking budget tokens
com.top_logic.ai.service.agents.AgentConfig.thinking-budget-tokens.tooltip = The maximum number of tokens the model may use for its internal thinking. <p> Required when <i>Thinking type</i> is <i>enabled</i>. Only visible when the model supports thinking and a thinking type is selected. </p>
com.top_logic.ai.service.agents.AgentConfig.thinking-type = Thinking type
com.top_logic.ai.service.agents.AgentConfig.thinking-type.tooltip = The thinking type for extended thinking support. <p> Only visible when the selected model supports thinking (Anthropic models). <i>Adaptive</i> lets the model decide when to think. <i>Enabled</i> forces thinking on every request and requires <i>Thinking budget tokens</i> to be set. </p>
com.top_logic.ai.service.agents.AgentConfig.timeout-seconds = Timeout seconds
com.top_logic.ai.service.agents.AgentConfig.timeout-seconds.tooltip = Request timeout in seconds.
com.top_logic.ai.service.agents.AgentConfig.tools = Tools
com.top_logic.ai.service.agents.AgentConfig.tools.tooltip = The standard tools available to this agent, selected by name. <p> Each name maps to a well-known tool class. Tools are instantiated at runtime by the <i>agent registry</i>. </p>
com.top_logic.ai.service.agents.AgentConfig.top-k = Top k
com.top_logic.ai.service.agents.AgentConfig.top-k.tooltip = Top-K sampling limits token selection to the K most likely next tokens. <p> Lower values (e.g. 10) make the output more focused, higher values (e.g. 100) allow more variety. Only visible for Anthropic models. </p>
com.top_logic.ai.service.agents.AgentConfig.top-p = Top p
com.top_logic.ai.service.agents.AgentConfig.top-p.tooltip = Top-P (nucleus sampling) limits token selection to the smallest set whose cumulative probability exceeds this threshold (0.0 to 1.0). <p> Lower values (e.g. 0.1) make the output more focused by considering only the most likely tokens. Higher values (e.g. 0.9) allow more diversity. Usually only one of <i>Temperature</i> or Top-P should be changed at a time. </p>
com.top_logic.ai.service.agents.AgentRegistry = Agent registry
com.top_logic.ai.service.agents.AgentRegistry$ProviderConfig = Provider configuration
com.top_logic.ai.service.agents.AgentRegistry$ProviderConfig.tooltip = Configuration for a single LLM provider. <p> Each provider has a name (e.g. "anthropic", "openai", "mistral"), API credentials, and a comma-separated list of model names it serves. </p>
com.top_logic.ai.service.agents.AgentRegistry.Config.agents = Agents
com.top_logic.ai.service.agents.AgentRegistry.Config.agents.tooltip = The configured agents, keyed by agent name. <p> Each entry defines one agent with its model, prompt, tools, and skills. </p>
com.top_logic.ai.service.agents.AgentRegistry.Config.default-model = Default model
com.top_logic.ai.service.agents.AgentRegistry.Config.default-model.tooltip = The default model name to use when no model is explicitly specified on an agent. <p> This should match a model listed in one of the providers. </p>
com.top_logic.ai.service.agents.AgentRegistry.Config.providers = Providers
com.top_logic.ai.service.agents.AgentRegistry.Config.providers.tooltip = The configured LLM providers, keyed by provider name. <p> Each provider entry specifies connection details (API key, base URL) and a comma-separated list of model names it serves. When building an agent, the registry matches the agent's model name against these lists to select the correct provider. </p>
com.top_logic.ai.service.agents.AgentRegistry.Config.skills = Skills
com.top_logic.ai.service.agents.AgentRegistry.Config.skills.tooltip = The configured skills, keyed by skill name. <p> Each entry defines a reusable skill with its description and prompt content. Skills are referenced by name from <i>Skills</i> (<i>agent configuration</i>). </p>
com.top_logic.ai.service.agents.AgentRegistry.ProviderConfig.api-key = Api key
com.top_logic.ai.service.agents.AgentRegistry.ProviderConfig.api-key.tooltip = The API key for authentication with the provider.
com.top_logic.ai.service.agents.AgentRegistry.ProviderConfig.base-url = Base URL
com.top_logic.ai.service.agents.AgentRegistry.ProviderConfig.base-url.tooltip = The base URL for the provider's API. <p> Optional. When not set, the default URL for the provider type is used. </p>
com.top_logic.ai.service.agents.AgentRegistry.ProviderConfig.models = Models
com.top_logic.ai.service.agents.AgentRegistry.ProviderConfig.models.tooltip = Comma-separated list of model names served by this provider. <p> Used to match agent model references to the correct provider. May be empty if the provider name alone is sufficient for matching. </p>
com.top_logic.ai.service.agents.AgentRegistry.ProviderConfig.version = Version
com.top_logic.ai.service.agents.AgentRegistry.ProviderConfig.version.tooltip = Provider-specific API version string. <p> Used by Anthropic to set the anthropic-version header. Ignored by other providers. </p>
com.top_logic.ai.service.agents.AgentRegistry.tooltip = Registry of runtime-configurable agents, skills, and LLM provider connections. <p> Each agent is declared in XML via <i>agent configuration</i> and holds its LLM model name, optional thinking parameters, system prompt, tools, and skills. Skills are declared via <i>skill configuration</i>. LLM provider connections are configured via <i>provider configuration</i>. </p> <p> This service validates all configurations at startup, builds provider connections, and provides the <code>#runAgent(String, Conversation, ConversationMemory, AgentEventListener)</code> method to run agents using the tl-ai-core <i>agent loop</i>. </p>
com.top_logic.ai.service.agents.AllModelNamesGenerator = All model names generator
com.top_logic.ai.service.agents.AllModelNamesGenerator.tooltip = <i>List generator adaptor</i> providing all available AI model names as options. <p> Used as <options> generator on the model attribute of tl.ai.core:Agent. </p>
com.top_logic.ai.service.agents.AllToolNamesGenerator = All tool names generator
com.top_logic.ai.service.agents.AllToolNamesGenerator.tooltip = <i>List generator adaptor</i> providing all available tool names as options. <p> Used as <options> generator on the tools attribute of tl.ai.core:Agent. </p>
com.top_logic.ai.service.agents.ChatAgentConfig = Chat agent configuration
com.top_logic.ai.service.agents.ChatAgentConfig.delegations = Delegations
com.top_logic.ai.service.agents.ChatAgentConfig.delegations.tooltip = Other agents this agent can delegate to, selected by name. <p> For each target agent name listed here, a dedicated delegate_to_<name> tool with a self-describing <i>tool schema</i> is created at runtime by the <i>agent registry</i>. </p>
com.top_logic.ai.service.agents.ChatAgentConfig.entry-point = Entry point
com.top_logic.ai.service.agents.ChatAgentConfig.entry-point.tooltip = Whether this agent is the chat entry point. <p> Exactly one agent in the <i>agent registry</i> must be marked as the entry point. The chat system uses this agent to handle incoming user messages. </p>
com.top_logic.ai.service.agents.ChatAgentConfig.tooltip = Configuration for an agent that participates in the chat orchestration chain. <p> A chat agent can serve as the entry point that receives user messages, or as a specialist that other agents delegate to. </p>
com.top_logic.ai.service.agents.ReasoningEffort = Reasoning effort
com.top_logic.ai.service.agents.ReasoningEffort.HIGH = High
com.top_logic.ai.service.agents.ReasoningEffort.HIGH.tooltip = High reasoning effort.
com.top_logic.ai.service.agents.ReasoningEffort.LOW = Low
com.top_logic.ai.service.agents.ReasoningEffort.LOW.tooltip = Low reasoning effort.
com.top_logic.ai.service.agents.ReasoningEffort.MEDIUM = Medium
com.top_logic.ai.service.agents.ReasoningEffort.MEDIUM.tooltip = Medium reasoning effort (default for most reasoning models).
com.top_logic.ai.service.agents.ReasoningEffort.MINIMAL = Minimal
com.top_logic.ai.service.agents.ReasoningEffort.MINIMAL.tooltip = Minimal reasoning effort (GPT-5 family).
com.top_logic.ai.service.agents.ReasoningEffort.NONE = None
com.top_logic.ai.service.agents.ReasoningEffort.NONE.tooltip = No reasoning.
com.top_logic.ai.service.agents.ReasoningEffort.XHIGH = Xhigh
com.top_logic.ai.service.agents.ReasoningEffort.XHIGH.tooltip = Extra-high reasoning effort (GPT-5.1-codex-max, GPT-5.2).
com.top_logic.ai.service.agents.ReasoningEffort.tooltip = Reasoning effort levels supported by OpenAI reasoning models (o-series, GPT-5). <p> This is a superset of all known values across model families. Not every model supports every level; the available options are filtered dynamically based on the selected model. </p>
com.top_logic.ai.service.agents.ThinkingType = Thinking type
com.top_logic.ai.service.agents.ThinkingType.ADAPTIVE = Adaptive
com.top_logic.ai.service.agents.ThinkingType.ADAPTIVE.tooltip = The model decides autonomously when and how much to think.
com.top_logic.ai.service.agents.ThinkingType.ENABLED = Enabled
com.top_logic.ai.service.agents.ThinkingType.ENABLED.tooltip = The model always uses extended thinking. Requires <i>Thinking budget tokens</i> (<i>agent configuration</i>) to be set.
com.top_logic.ai.service.agents.ThinkingType.tooltip = Extended thinking modes supported by LLM providers (currently Anthropic).
com.top_logic.ai.service.agents.background.BackgroundAgentConfig = Background agent configuration
com.top_logic.ai.service.agents.background.BackgroundAgentConfig$Scope = Scope
com.top_logic.ai.service.agents.background.BackgroundAgentConfig$Scope.tooltip = Defines the operational scope of the background agent.
com.top_logic.ai.service.agents.background.BackgroundAgentConfig.Scope.APPLICATION = Application
com.top_logic.ai.service.agents.background.BackgroundAgentConfig.Scope.APPLICATION.tooltip = Agent operates at the application level, independent of any chat session.
com.top_logic.ai.service.agents.background.BackgroundAgentConfig.Scope.CHAT = Chat
com.top_logic.ai.service.agents.background.BackgroundAgentConfig.Scope.CHAT.tooltip = Agent operates within the context of a specific chat session.
com.top_logic.ai.service.agents.background.BackgroundAgentConfig.input = Input
com.top_logic.ai.service.agents.background.BackgroundAgentConfig.input.tooltip = Optional additional input configuration for this background agent. <p> For pre-turn triggers, the pending user message is always wrapped in &lt;user-message&gt; tags. When an additional input source is configured here, it is appended in an &lt;additional-context&gt; block. </p> <p> For other trigger types, the input configuration is the sole data source for the agent. <i>Chat context</i> is not available for pre-turn triggers or application-scoped agents. </p>
com.top_logic.ai.service.agents.background.BackgroundAgentConfig.output-handlers = Output handlers
com.top_logic.ai.service.agents.background.BackgroundAgentConfig.output-handlers.tooltip = The output handlers that process the results of this background agent. <p> Handlers receive the raw LLM response and can perform arbitrary processing. Two handler types are available: <i>configuration</i> for custom Java classes and <i>TL-Script output handler</i> for inline TL-Script. </p>
com.top_logic.ai.service.agents.background.BackgroundAgentConfig.scope = Scope
com.top_logic.ai.service.agents.background.BackgroundAgentConfig.scope.tooltip = The operational scope of this background agent. <p> Defaults to <i>application</i>. </p>
com.top_logic.ai.service.agents.background.BackgroundAgentConfig.tooltip = Configuration for a background agent that runs automatically in response to certain triggers. <p> A background agent is defined by its <i>scope</i>, a <i>trigger</i> that determines when it runs, an <i>Input</i> that determines what data it processes, and <i>output handlers</i> that process the result. </p> <p> A background agent cannot be an entry point or a delegation target. It is triggered independently and runs outside the orchestration chain. </p>
com.top_logic.ai.service.agents.background.BackgroundAgentConfig.trigger = Trigger
com.top_logic.ai.service.agents.background.BackgroundAgentConfig.trigger.tooltip = The trigger configuration that determines when this background agent is activated. <p> When null, the background agent is effectively disabled and will not be triggered. This allows quickly disabling a background agent without removing its configuration. </p>
com.top_logic.ai.service.agents.background.input.ChatContextInput = Chat context
com.top_logic.ai.service.agents.background.input.ChatContextInput$Content = Content scope
com.top_logic.ai.service.agents.background.input.ChatContextInput$Content.tooltip = Defines how much of the chat context to include as input.
com.top_logic.ai.service.agents.background.input.ChatContextInput.Content.FULL_CHAT = Full chat
com.top_logic.ai.service.agents.background.input.ChatContextInput.Content.FULL_CHAT.tooltip = Include the entire chat conversation history.
com.top_logic.ai.service.agents.background.input.ChatContextInput.Content.LAST_TURN = Last turn
com.top_logic.ai.service.agents.background.input.ChatContextInput.Content.LAST_TURN.tooltip = Include only the last turn (user message and assistant response). <p> This is the default. </p>
com.top_logic.ai.service.agents.background.input.ChatContextInput.content = Content scope
com.top_logic.ai.service.agents.background.input.ChatContextInput.content.tooltip = The amount of chat context to include as input. <p> Defaults to <i>last turn</i>. </p>
com.top_logic.ai.service.agents.background.input.ChatContextInput.tooltip = Input configuration that uses the chat conversation context. <p> The background agent receives either the last turn or the full conversation history as input, depending on the <i>content scope</i> setting. </p>
com.top_logic.ai.service.agents.background.input.CustomInput = Custom message
com.top_logic.ai.service.agents.background.input.CustomInput.custom-message = Custom message
com.top_logic.ai.service.agents.background.input.CustomInput.custom-message.tooltip = The fixed message that is passed to the background agent as input.
com.top_logic.ai.service.agents.background.input.CustomInput.tooltip = Input configuration that uses a fixed custom message. <p> The background agent is invoked with a static message defined at configuration time. This is useful for autonomous agents that perform a predefined task without requiring dynamic context. </p>
com.top_logic.ai.service.agents.background.input.ProviderInput = Provider
com.top_logic.ai.service.agents.background.input.ProviderInput.provider = Provider
com.top_logic.ai.service.agents.background.input.ProviderInput.provider.tooltip = The provider that gathers input for the background agent.
com.top_logic.ai.service.agents.background.input.ProviderInput.tooltip = Input configuration that delegates to a pluggable <i>input provider</i>. <p> This allows custom input gathering logic to be implemented as a <i>input provider</i> and configured declaratively. </p>
com.top_logic.ai.service.agents.background.input.ScriptInput = TL-Script
com.top_logic.ai.service.agents.background.input.ScriptInput.script = Script
com.top_logic.ai.service.agents.background.input.ScriptInput.script.tooltip = The TL-Script expression that produces the agent's input. <p> The script is evaluated in the context of the background agent's execution and must return a string value. </p>
com.top_logic.ai.service.agents.background.input.ScriptInput.tooltip = Input configuration that uses a TL-Script expression to produce the agent's input. <p> The configured script is evaluated at runtime to generate the input string that is passed to the background agent. </p>
com.top_logic.ai.service.agents.background.output.OutputHandlerImplementation = Output handler implementation
com.top_logic.ai.service.agents.background.output.OutputHandlerImplementation.tooltip = Base class for custom Java output handler implementations. <p> Subclasses receive the raw LLM response and <i>background context</i> and can perform arbitrary processing (logging, notifications, persistence, etc.). </p>
com.top_logic.ai.service.agents.background.output.ScriptOutputHandler = TL-Script output handler
com.top_logic.ai.service.agents.background.output.ScriptOutputHandler.script = Script
com.top_logic.ai.service.agents.background.output.ScriptOutputHandler.script.tooltip = The TL-Script expression to evaluate. <p> The first argument is the raw LLM response string. Use log() to write to the application log. </p>
com.top_logic.ai.service.agents.background.output.ScriptOutputHandler.tooltip = Output handler that evaluates a TL-Script expression with the agent's response.
com.top_logic.ai.service.agents.background.scheduler.BackgroundAgentTask = Background agent task
com.top_logic.ai.service.agents.background.scheduler.BackgroundAgentTask.Config.agent-name = Agent name
com.top_logic.ai.service.agents.background.scheduler.BackgroundAgentTask.Config.agent-name.tooltip = The name of the background agent to execute.
com.top_logic.ai.service.agents.background.scheduler.BackgroundAgentTask.tooltip = TopLogic Scheduler task that executes a background agent and logs the result. <p> Configured with an agent name. When the scheduler fires according to the configured schedule, this task creates an <i>application context</i> and executes the background agent pipeline. </p>
com.top_logic.ai.service.agents.background.trigger.PostTurnTrigger = Post-turn
com.top_logic.ai.service.agents.background.trigger.PostTurnTrigger.tooltip = Trigger that fires after a chat turn completes. <p> The background agent runs asynchronously after the primary agent has finished its response. This is useful for quality monitoring, content review, or follow-up actions that should not delay the user's response. </p>
com.top_logic.ai.service.agents.background.trigger.PreTurnTrigger = Pre-turn
com.top_logic.ai.service.agents.background.trigger.PreTurnTrigger$FailPolicy = Fail policy
com.top_logic.ai.service.agents.background.trigger.PreTurnTrigger$FailPolicy.tooltip = Policy for handling pre-turn trigger timeouts.
com.top_logic.ai.service.agents.background.trigger.PreTurnTrigger.FailPolicy.CLOSED = Closed
com.top_logic.ai.service.agents.background.trigger.PreTurnTrigger.FailPolicy.CLOSED.tooltip = Block the turn when the background agent times out. <p> Use this policy for safety-critical checks that must complete before the turn proceeds. </p>
com.top_logic.ai.service.agents.background.trigger.PreTurnTrigger.FailPolicy.OPEN = Open
com.top_logic.ai.service.agents.background.trigger.PreTurnTrigger.FailPolicy.OPEN.tooltip = Allow the turn to proceed when the background agent times out. <p> This is the default policy, ensuring the user experience is not degraded by background agent failures. </p>
com.top_logic.ai.service.agents.background.trigger.PreTurnTrigger.fail-policy = Fail policy
com.top_logic.ai.service.agents.background.trigger.PreTurnTrigger.fail-policy.tooltip = The policy to apply when the background agent exceeds the <i>timeout</i>. <p> Defaults to <i>open</i>, allowing the turn to proceed even if the background agent has not completed. </p>
com.top_logic.ai.service.agents.background.trigger.PreTurnTrigger.timeout = Timeout
com.top_logic.ai.service.agents.background.trigger.PreTurnTrigger.timeout.tooltip = The maximum time in milliseconds to wait for the background agent to complete before applying the <i>fail policy</i>. <p> Defaults to 30000 (30 seconds). </p>
com.top_logic.ai.service.agents.background.trigger.PreTurnTrigger.tooltip = Trigger that fires before a chat turn is processed. <p> The background agent runs synchronously before the primary agent processes the user's message. This is useful for content filtering, safety checks, or input validation. A timeout ensures the user is not blocked indefinitely, and a fail policy determines behavior when the timeout is exceeded. </p> <p> The agent always receives the pending user message. When an additional input configuration is set, the input is structured with XML tags: </p> <pre> &lt;user-message&gt; The pending user message text &lt;/user-message&gt; &lt;additional-context&gt; The result from the configured input source &lt;/additional-context&gt; </pre> <p> When no input configuration is set, the agent receives the raw user message without XML tags. Design the agent's system prompt accordingly. </p>
com.top_logic.ai.service.agents.background.trigger.ScheduledTrigger = Scheduled
com.top_logic.ai.service.agents.background.trigger.ScheduledTrigger.schedules = Schedules
com.top_logic.ai.service.agents.background.trigger.ScheduledTrigger.schedules.tooltip = The scheduling algorithms that determine when this trigger fires. <p> Multiple schedules can be configured; the trigger fires whenever any of them is due. </p>
com.top_logic.ai.service.agents.background.trigger.ScheduledTrigger.tooltip = Trigger that fires on a time-based schedule. <p> The background agent runs periodically according to one or more <i>scheduling algorithm</i> configurations. This is useful for periodic reviews, report generation, or maintenance tasks. </p>
com.top_logic.ai.service.approval.ApprovalMode = Approval mode
com.top_logic.ai.service.approval.ApprovalMode.AUTO_APPROVE = Auto approve
com.top_logic.ai.service.approval.ApprovalMode.AUTO_APPROVE.tooltip = All tool calls are auto-approved without user interaction.
com.top_logic.ai.service.approval.ApprovalMode.MANUAL = Manual
com.top_logic.ai.service.approval.ApprovalMode.MANUAL.tooltip = Each tool call requires manual user approval.
com.top_logic.ai.service.approval.ApprovalMode.tooltip = Controls how tool calls are approved in the human-in-the-loop workflow.
com.top_logic.ai.service.providers.ModelCapability = Model capability
com.top_logic.ai.service.providers.ModelCapability.REASONING_EFFORT = Reasoning effort
com.top_logic.ai.service.providers.ModelCapability.REASONING_EFFORT.tooltip = Supports the reasoning effort parameter. <p> OpenAI reasoning_effort for o-series and GPT-5 models. </p>
com.top_logic.ai.service.providers.ModelCapability.THINKING_ADAPTIVE = Thinking adaptive
com.top_logic.ai.service.providers.ModelCapability.THINKING_ADAPTIVE.tooltip = Supports adaptive thinking where the model decides when and how much to think. <p> Anthropic thinking: {type: "adaptive"}. Only supported by newer Claude models (Opus 4.6, Sonnet 4.6). </p>
com.top_logic.ai.service.providers.ModelCapability.THINKING_ENABLED = Thinking enabled
com.top_logic.ai.service.providers.ModelCapability.THINKING_ENABLED.tooltip = Supports explicit extended thinking with a token budget. <p> Anthropic thinking: {type: "enabled", budget_tokens: N}. </p>
com.top_logic.ai.service.providers.ModelCapability.tooltip = Capabilities that an LLM model may support, beyond basic text generation. <p> The agent configuration UI uses these to control field visibility and validate parameter combinations. </p>
com.top_logic.ai.service.scripting.AIScriptFunctions.agentChat = Agent chat
com.top_logic.ai.service.scripting.AIScriptFunctions.agentChat.param.agentName.tooltip = The agent name from the Agent Registry.
com.top_logic.ai.service.scripting.AIScriptFunctions.agentChat.param.userMessage.tooltip = The user message to prompt the Agent with.
com.top_logic.ai.service.scripting.AIScriptFunctions.agentChat.return = The response from the AI Agent.
com.top_logic.ai.service.scripting.AIScriptFunctions.agentChat.tooltip = Call an AI Agent from the Registry.
com.top_logic.ai.service.scripting.AIScriptFunctions.callTool = Call tool
com.top_logic.ai.service.scripting.AIScriptFunctions.callTool.param.parameters.tooltip = A map of parameter names to values, or null if the tool has no parameters.
com.top_logic.ai.service.scripting.AIScriptFunctions.callTool.param.toolName.tooltip = The qualified name of the tool to invoke.
com.top_logic.ai.service.scripting.AIScriptFunctions.callTool.return = The result of the tool execution as a string.
com.top_logic.ai.service.scripting.AIScriptFunctions.callTool.tooltip = Invokes a tool manually with the given parameters. <p> This function allows direct invocation of registered tools from TL-Script. The tool is identified by its qualified name in the format factory-name.tool-name. </p>
com.top_logic.ai.service.scripting.AIScriptFunctions.chat = Chat
com.top_logic.ai.service.scripting.AIScriptFunctions.chat.param.messages.tooltip = A list of messages. Each message can be: <ul> <li>String: Treated as user text message</li> <li>Map with "role" and "content": Explicit role (system/user/assistant). Content can be string, binary data, or a list of mixed content.</li> <li>Binary data: Treated as user image/document message</li> </ul>
com.top_logic.ai.service.scripting.AIScriptFunctions.chat.param.model.tooltip = The model name to use, or null to use the default model configured in <i>agent registry</i>.
com.top_logic.ai.service.scripting.AIScriptFunctions.chat.param.responseFormat.tooltip = The response format specification. Can be: <ul> <li>null: No specific format requirement</li> <li>String "text" or "json": Simple format type</li> <li>Map with "name" and "schema" fields describing a JSON schema for structured output.</li> </ul>
com.top_logic.ai.service.scripting.AIScriptFunctions.chat.param.tools.tooltip = A collection of qualified tool names to make available to the AI agent (e.g., ["mytools.calculateSum", "texttools.formatText"]), or null to provide no tools.
com.top_logic.ai.service.scripting.AIScriptFunctions.chat.return = The assistant's response text.
com.top_logic.ai.service.scripting.AIScriptFunctions.chat.tooltip = Sends a multi-turn conversation to a chat completion provider. <p> Messages can be strings, maps with role/content, or lists. Content can be text strings or <i>binary data</i> for images and documents. </p>
com.top_logic.ai.service.scripting.AIScriptFunctions.models = Models
com.top_logic.ai.service.scripting.AIScriptFunctions.models.return = An immutable list of all configured model names.
com.top_logic.ai.service.scripting.AIScriptFunctions.models.tooltip = Returns a list of all available model names from the <i>agent registry</i>. <p> Model names can be passed to the <i>chat</i> function to select which AI model to use. The returned list maintains a consistent order across calls. </p>
com.top_logic.ai.service.scripting.AIScriptFunctions.runAgent = Run agent
com.top_logic.ai.service.scripting.AIScriptFunctions.runAgent.param.agentName.tooltip = The agent name as stored in the KB
com.top_logic.ai.service.scripting.AIScriptFunctions.runAgent.param.userMessage.tooltip = The user message to send to the agent
com.top_logic.ai.service.scripting.AIScriptFunctions.runAgent.return = The agent's final text response
com.top_logic.ai.service.scripting.AIScriptFunctions.runAgent.tooltip = Run an agent defined in the knowledge base via AgentFactory. <p> Builds an <i>agent loop</i> from a KB-defined agent and runs it with the given user message. The agent is resolved by name from the tl.ai.core:Agent model instances. </p>
com.top_logic.ai.service.scripting.AIScriptFunctions.toolInfo = Tool info
com.top_logic.ai.service.scripting.AIScriptFunctions.toolInfo.param.toolName.tooltip = The qualified name of the tool.
com.top_logic.ai.service.scripting.AIScriptFunctions.toolInfo.return = A map containing the tool's metadata with the structure described above, or null if the tool is not found.
com.top_logic.ai.service.scripting.AIScriptFunctions.toolInfo.tooltip = Retrieves detailed information about a registered tool. <p> This function returns metadata about a tool including its name, description, and parameter schema. The tool is identified by its qualified name in the format factory-name.tool-name. </p> <p> The returned map contains: </p> <ul> <li>name - The tool's name</li> <li>qualifiedName - The tool's fully qualified name</li> <li>description - A description of what the tool does</li> <li>inputSchemaJson - The JSON Schema string for tool parameters</li> </ul>
com.top_logic.ai.service.scripting.AIScriptFunctions.tools = Tools
com.top_logic.ai.service.scripting.AIScriptFunctions.tools.return = A list of all registered tool names.
com.top_logic.ai.service.scripting.AIScriptFunctions.tools.tooltip = Returns a list of all available tool names from the <i>tool registry</i>. <p> Tool names are in the qualified format factory-name.tool-name. These names can be passed to the <i>chat</i> function to make tools available to the AI agent. </p>
com.top_logic.ai.service.scripting.Converters.htmlToMarkdown = HTML to markdown
com.top_logic.ai.service.scripting.Converters.htmlToMarkdown.param.html.tooltip = Text in HTML format.
com.top_logic.ai.service.scripting.Converters.htmlToMarkdown.return = Markdown formatted text.
com.top_logic.ai.service.scripting.Converters.htmlToMarkdown.tooltip = Converts HTML to <i>Markdown</i>.
com.top_logic.ai.service.scripting.Converters.markdownToHtml = Markdown to HTML
com.top_logic.ai.service.scripting.Converters.markdownToHtml.param.markdown.tooltip = Text in <i>Markdown</i> format.
com.top_logic.ai.service.scripting.Converters.markdownToHtml.return = HTML fragment that can be rendered.
com.top_logic.ai.service.scripting.Converters.markdownToHtml.tooltip = Converts <i>Markdown</i> to HTML.
com.top_logic.ai.service.scripting.Converters.markdownToHtmlString = Markdown to HTML string
com.top_logic.ai.service.scripting.Converters.markdownToHtmlString.param.markdown.tooltip = Text in <i>Markdown</i> format.
com.top_logic.ai.service.scripting.Converters.markdownToHtmlString.return = HTML string.
com.top_logic.ai.service.scripting.Converters.markdownToHtmlString.tooltip = Converts <i>Markdown</i> to an HTML string.
com.top_logic.ai.service.skills.SkillConfig = Skill configuration
com.top_logic.ai.service.skills.SkillConfig.content = Content
com.top_logic.ai.service.skills.SkillConfig.content.tooltip = The actual prompt text of this skill.
com.top_logic.ai.service.skills.SkillConfig.description = Description
com.top_logic.ai.service.skills.SkillConfig.description.tooltip = Human-readable description of this skill's purpose.
com.top_logic.ai.service.skills.SkillConfig.tooltip = Configuration for a single skill in the <i>agent registry</i>. <p> A skill is an instruction fragment that agents can load on demand via loadSkill(id). The skill's id and description appear in the system prompt catalog so the agent knows when to load it. </p>
com.top_logic.ai.service.tools.TraceEventKind = Trace event kind
com.top_logic.ai.service.tools.TraceEventKind.AGENT_CALL = Agent call
com.top_logic.ai.service.tools.TraceEventKind.AGENT_CALL.tooltip = One agent delegated to another (fromAgent, toAgent, work order summary, result summary).
com.top_logic.ai.service.tools.TraceEventKind.TOOL_CALL = Tool call
com.top_logic.ai.service.tools.TraceEventKind.TOOL_CALL.tooltip = A tool was invoked (toolName, args, result).
com.top_logic.ai.service.tools.TraceEventKind.tooltip = Kind of entry in an execution trace timeline.
com.top_logic.ai.service.tools.help.TLScriptReferenceTool = Script reference tool
com.top_logic.ai.service.tools.help.TLScriptReferenceTool.tooltip = Tool for listing TLScript functions and retrieving documentation. <p> This tool provides access to the TLScript function registry, allowing AI agents to discover available functions and retrieve detailed documentation for them. It uses <i>search builder</i> to access the function metadata. </p>
com.top_logic.ai.service.tools.model.AnnotationDefinitionExplorerTool = Annotation definition explorer tool
com.top_logic.ai.service.tools.model.AnnotationDefinitionExplorerTool.tooltip = Tool for exploring annotation definition schemas. <p> This tool allows AI agents to understand annotation DEFINITIONS (what CAN be configured), not annotation INSTANCES (what IS configured). It provides schema information including property metadata, types, constraints, and defaults. </p> <h3>Example Usage:</h3> <pre> // Explore a specific annotation definition describeAnnotation("com.top_logic.model.annotate.Visibility") // Explore form-definition annotation describeAnnotation("com.top_logic.model.form.definition.FormDefinition") </pre> <h3>Integration:</h3> <p> Register this tool via <i>annotated tools</i> and assign it to an agent through the <i>agent registry</i> configuration. </p>
com.top_logic.ai.service.tools.model.InstanceBrowserTool = Instance browser tool
com.top_logic.ai.service.tools.model.InstanceBrowserTool.tooltip = Tool for accessing TopLogic instance data from the knowledge base. <p> This tool provides methods for listing instances of a type with pagination and retrieving detailed information about individual instances. All methods return JSON-formatted strings for consumption by AI agents. </p>
com.top_logic.ai.service.tools.model.ModelAnnotationBrowserTool = Model annotation browser tool
com.top_logic.ai.service.tools.model.ModelAnnotationBrowserTool.tooltip = Tool for browsing annotations on TopLogic model elements (modules, types, parts, enumerations, classifiers). <p> This tool allows AI agents to inspect annotation metadata on model elements with optional inheritance support. It provides detailed information about each annotation including its tag name, configuration interface, and property values. </p> <h3>Example Usage:</h3> <pre> // List local annotations on a module getCurrentAnnotations("tl.core", false) // List local annotations on a type getCurrentAnnotations("tl.core:TLObject", false) // List all annotations including inherited getCurrentAnnotations("tl.core:TLObject", true) // List annotations on an enumeration getCurrentAnnotations("tl.core:TLScope", false) // List annotations on a type part getCurrentAnnotations("tl.core:TLObject#name", false) // List annotations on a classifier (enum literal) getCurrentAnnotations("tl.core:TLScope#global", false) </pre> <h3>Integration:</h3> <p> Register this tool via <i>annotated tools</i> and assign it to an agent through the <i>agent registry</i> configuration. </p>
com.top_logic.ai.service.tools.model.ModelAnnotationEditorTool = Model annotation editor tool
com.top_logic.ai.service.tools.model.ModelAnnotationEditorTool.tooltip = Tool for setting and removing annotations on TopLogic model elements. <p> This tool allows AI agents to modify annotation metadata on model elements (modules, types, parts, classifiers). Annotation configurations are accepted as JSON matching the schema from <i>configuration schema tool</i>. </p>
com.top_logic.ai.service.tools.model.ModelBrowserTool = Model browser tool
com.top_logic.ai.service.tools.model.ModelBrowserTool.tooltip = Tool for browsing TopLogic model structure (modules, types, parts). <p> This tool provides three methods that form the natural hierarchy for model exploration: listing all modules, listing types within a module, and listing properties/references of a type. All methods return JSON-formatted strings for consumption by AI agents. </p>
com.top_logic.ai.service.tools.model.ModelEditorTool = Model editor tool
com.top_logic.ai.service.tools.model.ModelEditorTool.tooltip = Tool for creating and updating TopLogic model elements. <p> This tool provides methods for creating and updating modules, classes, properties, references, backward references, and enumerations in the TopLogic application model. </p> <p> All methods return JSON-formatted strings for consumption by AI agents. </p>
com.top_logic.ai.service.tools.model.ModelSearchTool = Model search tool
com.top_logic.ai.service.tools.model.ModelSearchTool.tooltip = Tool for searching across the TopLogic application model. <p> This tool provides intelligent text search across modules, types (classes, enumerations, datatypes), and properties/references. It searches technical names, qualified names, labels, and descriptions, returning the top 10 most relevant matches with contextual information. </p>
com.top_logic.ai.service.tools.model.SearchAnnotationTool = Search annotation tool
com.top_logic.ai.service.tools.model.SearchAnnotationTool.tooltip = Tool for listing available annotation types for TopLogic model elements. <p> This tool allows AI agents to discover which annotation types can be applied to a given model element. It enumerates all @InApp annotation types filtered by the target element's kind and type. </p>
com.top_logic.ai.service.tools.model.TypeAnalysisTool = Type analysis tool
com.top_logic.ai.service.tools.model.TypeAnalysisTool.tooltip = Tool for analyzing TopLogic type dependencies and relationships. <p> This tool provides methods for understanding how types are used throughout the model: finding all usages of a type and finding where a part is defined and inherited. All methods return JSON-formatted strings for consumption by AI agents. </p>
com.top_logic.ai.service.tools.registry.ReflectiveToolFactory = Reflective tool factory
com.top_logic.ai.service.tools.registry.ReflectiveToolFactory.Config.tool-class = Tool class
com.top_logic.ai.service.tools.registry.ReflectiveToolFactory.Config.tool-class.tooltip = The Java class containing @ToolMethod annotated methods. <p> This class will be scanned for tool definitions. All methods annotated with @ToolMethod will be exposed as AI tools. </p>
com.top_logic.ai.service.tools.registry.ReflectiveToolFactory.tooltip = A <i>tool factory</i> that reflectively discovers tools from a Java class with @ToolMethod annotated methods. <p> This factory extracts tool specifications from the configured class and creates corresponding <i>tool</i> instances for each annotated method. </p>
com.top_logic.ai.service.tools.registry.ScriptToolFactory = Script tool factory
com.top_logic.ai.service.tools.registry.ScriptToolFactory.Config.tools = Tools
com.top_logic.ai.service.tools.registry.ScriptToolFactory.Config.tools.tooltip = The tools to create. <p> Each tool is defined by its specification (name, description, parameters) and a TL-Script implementation. </p>
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.description = Description
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.description.tooltip = The description of what the tool does.
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.implementation = Implementation
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.implementation.tooltip = The TL-Script implementation of the tool. <p> The script receives the tool parameters as variables and should return the tool's result as a string. </p>
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.name = Name
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.name.tooltip = The name of the tool.
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.parameters = Parameters
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.parameters.tooltip = The parameters this tool accepts. <p> Each parameter is defined by its name and configuration (type, description, etc.). </p>
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ToolParameterConfig.description = Description
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ToolParameterConfig.description.tooltip = The description of the parameter.
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ToolParameterConfig.name = Name
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ToolParameterConfig.name.tooltip = The name of the parameter.
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ToolParameterConfig.type = Type
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ToolParameterConfig.type.tooltip = The JSON schema type of the parameter (e.g., "string", "number", "boolean", "object", "array").
com.top_logic.ai.service.tools.registry.ScriptToolFactory.tooltip = A <i>tool factory</i> that creates tools from TL-Script implementations. <p> This factory allows defining tools directly in configuration using TL-Script code. Each tool consists of a specification (name, description, parameters) and a TL-Script expression that implements the tool's logic. </p>
com.top_logic.ai.service.tools.registry.ToolRegistry = Tool registry
com.top_logic.ai.service.tools.registry.ToolRegistry$ToolFactoryConfig = Tool factory configuration
com.top_logic.ai.service.tools.registry.ToolRegistry$ToolFactoryConfig.tooltip = Configuration for a named tool factory.
com.top_logic.ai.service.tools.registry.ToolRegistry.Config.tool-factories = Tool factories
com.top_logic.ai.service.tools.registry.ToolRegistry.Config.tool-factories.tooltip = Map of named tool factories available in the application. <p> Each tool factory is identified by a unique name. The factory name becomes part of the qualified tool name (factory-name.tool-name) used to reference tools in TL-Script functions. </p>
com.top_logic.ai.service.tools.registry.ToolRegistry.ToolFactoryConfig.implementation = Implementation
com.top_logic.ai.service.tools.registry.ToolRegistry.ToolFactoryConfig.implementation.tooltip = The tool factory implementation.
com.top_logic.ai.service.tools.registry.ToolRegistry.tooltip = Registry service for managing tools available in the application. <p> Tools are organized by factory. Each factory produces a set of tools, and each tool is identified by a qualified name in the format {factory-name}.{tool-name}. This allows tools from different factories to have the same simple name without conflicts. </p>
com.top_logic.ai.service.tools.script.TLScriptTool = Script tool
com.top_logic.ai.service.tools.script.TLScriptTool.tooltip = Tool for validating and executing TLScript code. <p> This tool provides validation and execution of TLScript. Both methods use the shared <i>script executor</i> for core validation and execution logic. </p>
com.top_logic.ai.service.tools.script.messages.ErrorType = Error type
com.top_logic.ai.service.tools.script.messages.ErrorType.LEXICAL_ERROR = Lexical error
com.top_logic.ai.service.tools.script.messages.ErrorType.LEXICAL_ERROR.tooltip = Lexical error (invalid characters).
com.top_logic.ai.service.tools.script.messages.ErrorType.SYNTAX_ERROR = Syntax error
com.top_logic.ai.service.tools.script.messages.ErrorType.SYNTAX_ERROR.tooltip = Syntax error (parser error).
com.top_logic.ai.service.tools.script.messages.ErrorType.VALIDATION_ERROR = Validation error
com.top_logic.ai.service.tools.script.messages.ErrorType.VALIDATION_ERROR.tooltip = Validation error (model references, type checking).
com.top_logic.ai.service.tools.script.messages.ErrorType.tooltip = Type of validation error.
com.top_logic.ai.service.tools.task.TaskTool = Task tool
com.top_logic.ai.service.tools.task.TaskTool.tooltip = Tool for managing agent tasks within a processing session. <p> Provides CRUD operations on an in-memory <i>task store</i> that is bound to the current thread via <i>task store binding</i>. Tasks are used to track progress and organize multi-step agent work. </p>
com.top_logic.tl.ai.core.agent.ExecutionMode = Execution mode
com.top_logic.tl.ai.core.agent.ExecutionMode.DEVELOPMENT = Development
com.top_logic.tl.ai.core.agent.ExecutionMode.DEVELOPMENT.tooltip = Development environment. All tool modes permitted.
com.top_logic.tl.ai.core.agent.ExecutionMode.MAINTENANCE = Maintenance
com.top_logic.tl.ai.core.agent.ExecutionMode.MAINTENANCE.tooltip = Maintenance window active. All tool modes permitted.
com.top_logic.tl.ai.core.agent.ExecutionMode.PRODUCTION = Production
com.top_logic.tl.ai.core.agent.ExecutionMode.PRODUCTION.tooltip = Production environment. GLOBAL tools are denied by the system.
com.top_logic.tl.ai.core.agent.ExecutionMode.tooltip = The system's current execution mode. <p>Affects which tools the system allows. GLOBAL tools (those that modify shared application state) are only permitted in <i>development</i> and <i>maintenance</i> modes, never in <i>production</i>.</p> <p>The bridge module maps this to TopLogic's MaintenanceWindowManager states.</p>
com.top_logic.tl.ai.core.agent.StopReason = Stop reason
com.top_logic.tl.ai.core.agent.StopReason.ABORTED = Aborted
com.top_logic.tl.ai.core.agent.StopReason.ABORTED.tooltip = Loop was interrupted (cancellation).
com.top_logic.tl.ai.core.agent.StopReason.COMPLETE = Complete
com.top_logic.tl.ai.core.agent.StopReason.COMPLETE.tooltip = LLM finished without requesting tools.
com.top_logic.tl.ai.core.agent.StopReason.ERROR = Error
com.top_logic.tl.ai.core.agent.StopReason.ERROR.tooltip = Unrecoverable provider error.
com.top_logic.tl.ai.core.agent.StopReason.MAX_TURNS = Maximum turns
com.top_logic.tl.ai.core.agent.StopReason.MAX_TURNS.tooltip = Hit the configured maximum turns limit.
com.top_logic.tl.ai.core.agent.StopReason.tooltip = Why the agent loop stopped.
com.top_logic.tl.ai.core.agent.event.ApprovalOutcome = Approval outcome
com.top_logic.tl.ai.core.agent.event.ApprovalOutcome.APPROVED = Approved
com.top_logic.tl.ai.core.agent.event.ApprovalOutcome.APPROVED.tooltip = User approved this single tool call.
com.top_logic.tl.ai.core.agent.event.ApprovalOutcome.APPROVED_FOR_SESSION = Approved for session
com.top_logic.tl.ai.core.agent.event.ApprovalOutcome.APPROVED_FOR_SESSION.tooltip = User approved this tool for the remainder of the session.
com.top_logic.tl.ai.core.agent.event.ApprovalOutcome.REJECTED = Rejected
com.top_logic.tl.ai.core.agent.event.ApprovalOutcome.REJECTED.tooltip = User rejected the call.
com.top_logic.tl.ai.core.agent.event.ApprovalOutcome.TIMED_OUT = Timed out
com.top_logic.tl.ai.core.agent.event.ApprovalOutcome.TIMED_OUT.tooltip = No response arrived within the approval timeout.
com.top_logic.tl.ai.core.agent.event.ApprovalOutcome.tooltip = Terminal state of an approval flow, carried by <i>approval resolved</i>.
com.top_logic.tl.ai.core.provider.ProviderException$Kind = Kind
com.top_logic.tl.ai.core.provider.ProviderException$Kind.tooltip = Classification of the error.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.AUTHENTICATION = Authentication
com.top_logic.tl.ai.core.provider.ProviderException.Kind.AUTHENTICATION.tooltip = 401/403 \u2014 invalid or expired API key.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.CONTEXT_WINDOW_EXCEEDED = Context window exceeded
com.top_logic.tl.ai.core.provider.ProviderException.Kind.CONTEXT_WINDOW_EXCEEDED.tooltip = Request too large for the model's context window.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.INVALID_REQUEST = Invalid request
com.top_logic.tl.ai.core.provider.ProviderException.Kind.INVALID_REQUEST.tooltip = 400 \u2014 malformed request.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.OVERLOADED = Overloaded
com.top_logic.tl.ai.core.provider.ProviderException.Kind.OVERLOADED.tooltip = 529 or 5xx \u2014 provider overloaded or temporarily unavailable.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.RATE_LIMITED = Rate limited
com.top_logic.tl.ai.core.provider.ProviderException.Kind.RATE_LIMITED.tooltip = 429 \u2014 rate limited. Check <code>ProviderException#retryAfter()</code>.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.UNKNOWN = Unknown
com.top_logic.tl.ai.core.provider.ProviderException.Kind.UNKNOWN.tooltip = Unclassified error.
com.top_logic.tl.ai.core.provider.ResponseFormat = Response format
com.top_logic.tl.ai.core.provider.ResponseFormat.JSON = JSON
com.top_logic.tl.ai.core.provider.ResponseFormat.JSON.tooltip = Structured JSON object response.
com.top_logic.tl.ai.core.provider.ResponseFormat.TEXT = Text
com.top_logic.tl.ai.core.provider.ResponseFormat.TEXT.tooltip = Plain text response (default).
com.top_logic.tl.ai.core.provider.ResponseFormat.tooltip = Controls the format of the LLM response.
com.top_logic.tl.ai.core.provider.ToolChoice = Tool choice
com.top_logic.tl.ai.core.provider.ToolChoice.AUTO = Auto
com.top_logic.tl.ai.core.provider.ToolChoice.AUTO.tooltip = The LLM decides whether to call a tool (default).
com.top_logic.tl.ai.core.provider.ToolChoice.NONE = None
com.top_logic.tl.ai.core.provider.ToolChoice.NONE.tooltip = The LLM must not call any tool.
com.top_logic.tl.ai.core.provider.ToolChoice.REQUIRED = Required
com.top_logic.tl.ai.core.provider.ToolChoice.REQUIRED.tooltip = The LLM must call at least one tool.
com.top_logic.tl.ai.core.provider.ToolChoice.tooltip = Controls how the LLM selects tools during a request.
com.top_logic.tl.ai.core.tool.P = P
com.top_logic.tl.ai.core.tool.P.required = Required
com.top_logic.tl.ai.core.tool.P.required.tooltip = Whether this parameter is required. Defaults to true.
com.top_logic.tl.ai.core.tool.P.tooltip = Describes a parameter of a <i>tool method</i>-annotated method.
com.top_logic.tl.ai.core.tool.P.value = Value
com.top_logic.tl.ai.core.tool.P.value.tooltip = Description of the parameter. Sent to the LLM.
com.top_logic.tl.ai.core.tool.ToolMethod = Tool method
com.top_logic.tl.ai.core.tool.ToolMethod.concurrencySafe = Concurrency safe
com.top_logic.tl.ai.core.tool.ToolMethod.concurrencySafe.tooltip = Whether this tool can safely run in parallel with other concurrency-safe tools. Defaults to false (fail-closed).
com.top_logic.tl.ai.core.tool.ToolMethod.description = Description
com.top_logic.tl.ai.core.tool.ToolMethod.description.tooltip = Description of what this tool does. Sent to the LLM. Multiple values are joined with newline.
com.top_logic.tl.ai.core.tool.ToolMethod.mode = Mode
com.top_logic.tl.ai.core.tool.ToolMethod.mode.tooltip = What kind of state change this tool makes. Defaults to <i>global</i> (fail-closed).
com.top_logic.tl.ai.core.tool.ToolMethod.name = Name
com.top_logic.tl.ai.core.tool.ToolMethod.name.tooltip = Tool name. Defaults to the Java method name if empty.
com.top_logic.tl.ai.core.tool.ToolMethod.tooltip = Marks a method as a tool that the agent can invoke. <p>The annotated method is discovered by <code>AnnotatedTools#from(Object)</code> and wrapped as a <i>tool</i> instance. The method's parameters must be annotated with <i>p</i> to provide descriptions for the LLM.</p> <p><b>Thread safety:</b> The provider object (the instance passed to <code>AnnotatedTools#from(Object)</code>) is shared across all users when the <i>tool registry</i> is shared. Annotated methods <em>must not</em> rely on mutable instance fields. Per-user state should be received via a <i>tool context</i> parameter, not stored on the provider object.</p>
com.top_logic.tl.ai.core.tool.ToolMode = Tool mode
com.top_logic.tl.ai.core.tool.ToolMode.GLOBAL = Global
com.top_logic.tl.ai.core.tool.ToolMode.GLOBAL.tooltip = Tool makes changes to shared application state (model, layouts, workflows).
com.top_logic.tl.ai.core.tool.ToolMode.READ = Read
com.top_logic.tl.ai.core.tool.ToolMode.READ.tooltip = Tool only reads data. No changes, no approval needed.
com.top_logic.tl.ai.core.tool.ToolMode.USER_SCOPED = User scoped
com.top_logic.tl.ai.core.tool.ToolMode.USER_SCOPED.tooltip = Tool makes changes scoped to the current user only (temp views, personal dashboards).
com.top_logic.tl.ai.core.tool.ToolMode.tooltip = Categorizes what kind of state change a tool makes. <p>Used by the framework for spec filtering (hiding GLOBAL tools from non-privileged users), approval gating, and concurrency decisions.</p>
