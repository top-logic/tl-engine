<!doctype html>
<html lang="de" data-tl-mode="light" data-tl-density="normal">
<head>
<meta charset="utf-8">
<title>TopLogic Design System — Menu</title>
<link rel="stylesheet" href="/fonts/style/interFonts.css">
<link rel="stylesheet" href="/fonts/style/bootstrap-icons.css">
<link rel="stylesheet" href="/dist/primitives.css">
<link rel="stylesheet" href="/dist/tokens.css">
<link rel="stylesheet" href="/dist/base.css">
<link rel="stylesheet" href="/dist/components.css">
<link rel="stylesheet" href="/specimen/specimen.css">
<style>
  .specimen__anchor { display: grid; justify-items: start; gap: var(--tl-space-xs); }
  /* In der Anwendung setzt bridge/popover.ts die Lage (fixed); hier steht das Menü statisch geöffnet
     unter seinem Auslöser. */
  .specimen__anchor > .tl-popover { position: static; }
</style>
</head>
<body>
<main class="specimen">
  <div class="specimen__bar">
    <a class="tl-type-label" href="/">← Grundklassen</a>
    <span class="tl-type-heading-lg">Menu</span>
    <label class="tl-type-label"><input type="checkbox" id="mode"> dunkel</label>
    <label class="tl-type-label"><input type="checkbox" id="density"> kompakt</label>
  </div>

  <!-- Jede Zeile: eine Form, mit Beschriftung. Das Skript setzt die Zeilen auf jede Fläche. -->
  <template id="rows">
    <div class="specimen__row specimen__row--top">
      <span class="tl-type-label">Auslöser (click), Menü offen</span>
      <div class="specimen__anchor">
        <button type="button" class="tl-menu-region tl-button tl-button--ghost tl-type-body" data-tl-trigger="click"
          aria-haspopup="menu" aria-expanded="true"><span class="tl-button__label">Ansicht</span><i class="tl-icon-sm bi bi-chevron-down" aria-hidden="true"></i></button>
        <div class="tl-popover tl-menu" role="menu">
          <div class="tl-menu__header tl-type-label" role="presentation">Darstellung</div>
          <button type="button" class="tl-menu__item tl-type-body-strong" role="menuitem" tabindex="0" aria-current="true"><span class="tl-menu__label">Liste</span></button>
          <button type="button" class="tl-menu__item tl-type-body" role="menuitem" tabindex="-1"><span class="tl-menu__label">Kacheln</span></button>
          <button type="button" class="tl-menu__item tl-type-body" role="menuitem" tabindex="-1" disabled><span class="tl-menu__label">Zeitleiste (deaktiviert)</span></button>
          <hr class="tl-divider">
          <button type="button" class="tl-menu__item tl-type-body" role="menuitem" tabindex="-1"><i class="tl-menu__icon tl-icon-sm bi bi-download" aria-hidden="true"></i><span class="tl-menu__label">Exportieren</span></button>
          <button type="button" class="tl-menu__item tl-type-body" role="menuitem" tabindex="-1"><i class="tl-menu__icon tl-icon-sm bi bi-printer" aria-hidden="true"></i><span class="tl-menu__label">Drucken mit einem sehr langen Namen, der mit Ellipse abschneidet</span></button>
          <hr class="tl-divider">
          <button type="button" class="tl-menu__item tl-menu__item--danger tl-type-body" role="menuitem" tabindex="-1"><i class="tl-menu__icon tl-icon-sm bi bi-trash" aria-hidden="true"></i><span class="tl-menu__label">Löschen</span></button>
          <button type="button" class="tl-menu__item tl-menu__item--danger tl-type-body" role="menuitem" tabindex="-1" disabled><i class="tl-menu__icon tl-icon-sm bi bi-trash" aria-hidden="true"></i><span class="tl-menu__label">Löschen (deaktiviert)</span></button>
          <button type="button" class="tl-menu__item tl-menu__item--danger tl-type-body-strong" role="menuitem" tabindex="-1" aria-current="true"><i class="tl-menu__icon tl-icon-sm bi bi-trash" aria-hidden="true"></i><span class="tl-menu__label">Löschen (in Kraft)</span></button>
        </div>
      </div>
    </div>
  </template>

  <section class="specimen__panel" id="on-layer"><p class="tl-type-heading-sm">Auf surface-layer</p></section>
  <section class="specimen__base" id="on-base"><p class="tl-type-heading-sm">Auf surface-base</p></section>
  <section class="specimen__overlay" id="on-overlay"><p class="tl-type-heading-sm">Auf surface-overlay</p></section>
</main>
<script>
  const tpl = document.getElementById('rows');
  for (const id of ['on-layer', 'on-base', 'on-overlay']) {
    const rows = tpl.content.cloneNode(true);
    document.getElementById(id).append(rows);
  }
  const html = document.documentElement;
  document.getElementById('mode').addEventListener('change', (e) => html.setAttribute('data-tl-mode', e.target.checked ? 'dark' : 'light'));
  document.getElementById('density').addEventListener('change', (e) => html.setAttribute('data-tl-density', e.target.checked ? 'compact' : 'normal'));
</script>
</body>
</html>
