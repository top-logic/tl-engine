com.top_logic.ai.service.agents.AgentConfig.tooltip = Konfiguration f�r einen einzelnen Agenten in der <i>Agentenregistrierung</i>. <p> Jeder Agent wird durch einen eindeutigen Namen identifiziert (durch <i>benannte Konfiguration obligatorisch</i>) und definiert das LLM-Modell, optionale Denkparameter, die Systemaufforderung und verf�gbare Werkzeuge und F�higkeiten. </p> <p> Denk-Parameter<i>(Denk-Typ</i>, <i>Denk-Budget-Token</i>, <i>Return Thinking</i>, <i>Send Thinking</i>) sind nur sichtbar, wenn das ausgew�hlte Modell erweitertes Denken unterst�tzt (derzeit Anthropic-Modelle). Wenn die Option <i>aktiviert</i> ist, werden die <i>Denkbudget-Token</i> und <i>Maximum-Token</i> obligatorisch. </p>
