com.top_logic.tl.ai.core.session.Part.SystemEventType.SUBAGENT_RESULT = Subagent result
com.top_logic.tl.ai.core.session.Part.SystemEventType.SUBAGENT_RESULT.tooltip = Results of background subagents were handed to the model at the start of a turn. <p> The odd one out: the other three record something that happened <em>around</em> the conversation, while this one records conversation content. Its details are verbatim the text the model was shown, which is why ConversationLogReplay rebuilds a user message from it instead of skipping it like every other system event - a reloaded session has to tell the model the same thing the live run did. </p>
