class.com.top_logic.factory.project.I18NConstants.ERROR_ARTIFACT_ID_EMPTY_PART__VALUE = „{0}“ ist keine gültige Artefakt-ID: Sie enthält einen leeren Teil zwischen den Bindestrichen oder endet mit einem Bindestrich. Jeder Teil zwischen den Bindestrichen wird zum Namen des Java-Pakets der Anwendung.
