com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.qdrant-db-collection-name = Qdrant-Datenbank-Sammlungsname
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.qdrant-db-collection-name.tooltip = Standard-Sammlungsname nur im Falle des Qdrant-Speichers
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.should-reindexing-on-restart = Sollte beim Neustart eine Neuindizierung erfolgen?
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.should-reindexing-on-restart.tooltip = Ob alle Objekte beim Systemneustart neu indiziert werden sollen.
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.timeout-abort-indexing-for-shutdown = Zeitüberschreitung beim Abbruch der Indizierung für Herunterfahren
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.timeout-abort-indexing-for-shutdown.tooltip = Wartezeit in Millisekunden vor dem Abbruch des Indizierungsprozesses nach dem Herunterfahren des <i>Vektor-Indizierungsdienstes</i>. <p> <b>Warnung:</b> Der Index ist unvollständig, wenn die Indizierung abgebrochen wird! Nach einem erzwungenen Herunterfahren muss der Index administrativ neu erstellt werden.</p>
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.vector-index-models = Vektor-Index-Modelle
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.vector-index-models.tooltip = Kommagetrennte Liste der vollqualifizierten Namen (FANs) der zu serialisierenden und in der Qdrant-Datenbank mit Vektorindex zu speichernden Modelle (Der Einbettungsdienst soll auf den Inhalt des Objekts angewendet werden).
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.vector-store-host = Vektorspeicher-Host
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.vector-store-host.tooltip = Hostname für entfernte Vektorspeicher (z. B. Qdrant, Pinecone)
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.vector-store-port = Vektorspeicher-Port
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.vector-store-port.tooltip = Port für entfernte Vektorspeicher
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.vector-store-type = Vektorspeicher-Typ
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.vector-store-type.tooltip = Typ der zu verwendenden Vektordatenbank (z.B. "qdrant", "jvector")
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.warn-queue-size = Warnwarteschlangengröße
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.warn-queue-size.tooltip = Ist die Warteschlange länger, sollte der Administrator gewarnt werden.
com.top_logic.ai.vector.index.VectorIndex.tooltip = Darstellung des Vektorindex. <p> Diese Klasse enthält Methoden zum Erstellen eines Vektorindex sowie zum Abrufen von Vektorindexlesern, -schreibern und -suchern. </p>
com.top_logic.ai.vector.index.VectorIndexSearchTool = Vector index Suchtool
com.top_logic.ai.vector.index.VectorIndexSearchTool.tooltip = KI-Tool zur semantischen Suche im Vektorindex. Dieses Tool stellt KI-Agenten die Suchfunktionalität des Vektorindex zur Verfügung. Es akzeptiert eine Anfrage in natürlicher Sprache, bettet sie mithilfe des konfigurierten Einbettungsmodells ein und gibt die semantisch ähnlichsten im Vektorindex gespeicherten Dokumente zurück. Das Tool ist in der ToolRegistry registriert, aber standardmäßig keinem Agenten zugewiesen.
com.top_logic.ai.vector.index.VectorIndexTLScriptFunctions.search = Suche nach einer Zeichenkette
com.top_logic.ai.vector.index.VectorIndexTLScriptFunctions.search.param.limit.tooltip = Optionaler Parameter für die Anzahl der erwarteten zurückzugebenden Datensätze (Standardwert: Anzahl, konfiguriert in den Serviceeinstellungen).
com.top_logic.ai.vector.index.VectorIndexTLScriptFunctions.search.param.query.tooltip = Die Suchanfrage in der Vektordatenbank.
com.top_logic.ai.vector.index.VectorIndexTLScriptFunctions.search.param.scoreThreshold.tooltip = Minimaler scoreThreshold. Muss zwischen 0 und 1 liegen (Standardwert ist 0.8).
com.top_logic.ai.vector.index.VectorIndexTLScriptFunctions.search.param.type.tooltip = TL-Skripttyp, nach dem in der Vektorindexsuche gefiltert werden soll
com.top_logic.ai.vector.index.VectorIndexTLScriptFunctions.search.return = Gibt eine Liste von Datensatzwörterbüchern zurück, die der Abfrage und den Parametern entsprechen. Jedes Element der Liste besitzt die folgenden Eigenschaften: <pre> <i>$result:</i> <table class="tlDocTable" border="0"> <thead> <tr> <th>name</th> <th>type</th> <th>description</th> </tr> </thead> <tbody> <tr> <td>score</td> <td>Zahl zwischen 0 und 1</td> <td>Übereinstimmungs-Score des Elements</td> </tr> <td>embeddingId</td> <td>UUID</td> <td>ID des Punktes in der Vektordatenbank</td> <tr> <td>objectId</td> <td>String</td> <td>Die Objekt-ID in der TL-Anwendung (z. B. GenericObject:12002)</td> </tr> <tr> <td>TL-Instanz</td> <td>AttributedWrapper</td> <td>Die TL-Objektinstanz</td> </tr> <tr> <td>embedded</td> <td>Map</td> <td>Inhalt des Punktes in der Vektordatenbank</td> </tr> </tbody> </table> <i>$result["embedded"]:</i> <table class="tlDocTable" border="0"> <thead> <tr> <th>name</th> <th>type</th> <th>description</th> </tr> </thead> <tbody> <tr> <td>metadata</td> <td>Map</td> <td>In der Vektordatenbank gespeicherte Metadaten</td> </tr> </tbody> </table> <i>$result["embedded"]["metadata"]:</i> <table class="tlDocTable" border="0"> <thead> <tr> <th>name</th> <th>type</th> <th>description</th> </tr> </thead> <tbody> <tr> <td>TopLogic-type</td> <td>String</td> <td>TopLogic-Typ der gespeicherten Instanz</td> </tr> </tbody> </table> $result["embedded"]["text"]: <table class="tlDocTable" border="0"> <thead> <tr> <th>name</th> <th>type</th> <th>description</th> </tr> </thead> <tbody> <tr> <td>TLObject-creation-date</td> <td>String</td> <td>Datum der Erstellung der TL-Instanz</td> </tr> <tr> <td>TLObject-modification-date</td> <td>String</td> <td>Datum der letzten Änderung der TL-Instanz</td> </tr> <tr> <td>Alle anderen Instanzattribute</td> <td>Zeichenfolge</td> <td>Alle Schlüssel-Wert-Paare der Instanzattribute</td> </tr> </tbody> </table> </pre>
com.top_logic.ai.vector.index.VectorIndexTLScriptFunctions.search.tooltip = Gibt eine Ergebnisliste aus der Vektordatenbank zurück. <p> Beispielhafte Verwendung in TL-Script zum Auflösen von Objekten, die im Ergebnis des Vektorindex enthalten sind: </p> <pre> <code> vectorIndexSearch("all vacations in France",<br/> &nbsp;&nbsp;&nbsp;&nbsp;2,<br/> &nbsp;&nbsp;&nbsp;&nbsp;0.8,<br/> &nbsp;&nbsp;&nbsp;&nbsp;"test.indexingVector:Vacation").map(x -> {<br/> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"score": $x["score"],<br/> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"instance": $x["TL-instance"]<br/> })<br/> </code> </pre>
com.top_logic.ai.vector.index.VectorIndexUtils$Config = Konfiguration
