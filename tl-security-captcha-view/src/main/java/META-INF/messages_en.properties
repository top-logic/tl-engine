com.top_logic.security.captcha.view.CaptchaElement = Captcha element
com.top_logic.security.captcha.view.CaptchaElement.Config.payload = Payload
com.top_logic.security.captcha.view.CaptchaElement.Config.payload.tooltip = The channel receiving the solution of the captcha. <p> The value is the solution as the ALTCHA widget submits it, the text the <i>captcha service</i> checks; <code>null</code> while the captcha is not solved. Clearing the channel issues a new challenge. </p>
com.top_logic.security.captcha.view.CaptchaElement.Config.start = Start
com.top_logic.security.captcha.view.CaptchaElement.Config.start.tooltip = When the browser starts to solve the challenge.
com.top_logic.security.captcha.view.CaptchaElement.tooltip = <i>UI element</i> showing the proof-of-work captcha of the <i>captcha service</i> (ALTCHA) in a form an anonymous visitor submits. <p> The browser solves a challenge of the service and the element writes the solution into the payload channel. The action submitting the form reads the channel and lets the <i>captcha service</i> check the solution. An action clearing the channel after the check gets a new challenge in the element, since a solution is accepted once only. </p> <pre> &lt;channels&gt; &lt;channel name="captcha"/&gt; &lt;/channels&gt; ... &lt;captcha payload="captcha"/&gt; </pre>
com.top_logic.security.captcha.view.CaptchaSolvedArguments = Solve the captcha '{target}'
com.top_logic.security.captcha.view.CaptchaSolvedArguments.payload = Payload
com.top_logic.security.captcha.view.CaptchaSolvedArguments.payload.tooltip = The solution as the ALTCHA widget submits it, the Base64 encoded JSON of the challenge and its solution; <code>null</code> when the widget no longer holds a solution.
com.top_logic.security.captcha.view.CaptchaSolvedArguments.tooltip = Typed arguments of the <code>"solved"</code> command: the solution of the challenge.
