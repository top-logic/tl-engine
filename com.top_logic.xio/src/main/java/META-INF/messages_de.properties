com.top_logic.xio.importer.handlers.ReferenceImport.Config.format.tooltip = Formatkonverter des ID-Attributwerts.
com.top_logic.xio.importer.handlers.ReferenceImport.tooltip = <i>Handler</i>, der den Wert eines <i>ID-Attributs</i> in eine Modellreferenz umwandelt.
com.top_logic.xio.importer.handlers.ResKeyUpdate = Aktualisierung eines Ressourcenschlüssels
com.top_logic.xio.importer.handlers.ResKeyUpdate.Config.default-language = Standardsprache
com.top_logic.xio.importer.handlers.ResKeyUpdate.Config.default-language.tooltip = Das Sprach-Tag der zuzuweisenden Sprache, falls das Sprachattribut oder die Sprachvariable keine Sprache enthält. <p> Wird kein Wert angegeben, wird ein Wert ohne Sprache als Fehler gemeldet und nicht gespeichert. Darf nicht zusammen mit einer festen Sprache angegeben werden. </p>
com.top_logic.xio.importer.handlers.ResKeyUpdate.Config.fill-fallback = Rückfallsprache ergänzen
com.top_logic.xio.importer.handlers.ResKeyUpdate.Config.fill-fallback.tooltip = Ob der Wert auch für die Rückfallsprache der Anwendung gespeichert wird, falls die Eigenschaft noch keine Übersetzung in dieser Sprache hat.
com.top_logic.xio.importer.handlers.ResKeyUpdate.Config.language = Sprache
com.top_logic.xio.importer.handlers.ResKeyUpdate.Config.language-attribute = Sprachattribut
com.top_logic.xio.importer.handlers.ResKeyUpdate.Config.language-attribute.tooltip = Das XML-Attribut des aktuellen Elements, das das Sprach-Tag der zuzuweisenden Sprache enthält. <p> Genau eine der Optionen <i>Sprache</i>, <i>Sprachattribut</i> und <i>Sprachvariable</i> muss angegeben werden. </p>
com.top_logic.xio.importer.handlers.ResKeyUpdate.Config.language-var = Sprachvariable
com.top_logic.xio.importer.handlers.ResKeyUpdate.Config.language-var.tooltip = Die Variable, die die zuzuweisende Sprache enthält. <p> Die Variable enthält entweder ein Sprach-Tag oder ein <i>Locale</i>. Genau eine der Optionen <i>Sprache</i>, <i>Sprachattribut</i> und <i>Sprachvariable</i> muss angegeben werden. </p>
com.top_logic.xio.importer.handlers.ResKeyUpdate.Config.language.tooltip = Das Sprach-Tag der zuzuweisenden Sprache. <p> Genau eine der Optionen <i>Sprache</i>, <i>Sprachattribut</i> und <i>Sprachvariable</i> muss angegeben werden. </p>
com.top_logic.xio.importer.handlers.ResKeyUpdate.Config.xml-attribute = XML-Attribut
com.top_logic.xio.importer.handlers.ResKeyUpdate.Config.xml-attribute.tooltip = Das zu lesende XML-Attribut. <p> Wird es nicht angegeben, wird stattdessen der Textinhalt des aktuellen Elements gelesen. </p>
com.top_logic.xio.importer.handlers.ResKeyUpdate.tooltip = <i>Handler</i>, der einer Eigenschaft des Modells vom Typ <i>Ressourcenschlüssel</i> eine Übersetzung einer bestimmten Sprache hinzufügt. <p> Die Sprache wird entweder als feste <i>Sprache</i>, über ein <i>Sprachattribut</i> des aktuellen Elements oder über eine <i>Sprachvariable</i> des Imports angegeben. Genau eine dieser Optionen muss gesetzt sein. Es wird nur der Sprachteil eines angegebenen Sprach-Tags verwendet, d. h. eine Übersetzung für <code>de-DE</code> wird für <code>de</code> gespeichert. Wird die Sprache aus der Eingabe gelesen und enthält die Eingabe keine, wird die <i>Standardsprache</i> verwendet. </p> <p> Ein leerer Wert (ein leeres oder nur aus Leerzeichen bestehendes XML-Attribut bzw. Elementtext) wird nicht gespeichert. </p>
com.top_logic.xio.importer.handlers.ResolveExisting = Vorhandene Objekte auflösen
com.top_logic.xio.importer.handlers.ResolveExisting.Config.argument-var = Argumentvariable
com.top_logic.xio.importer.handlers.ResolveExisting.Config.argument-var.tooltip = Variable, die als Argument an den Ausdruck <i>Objekte</i> übergeben werden soll.
com.top_logic.xio.importer.handlers.ResolveExisting.Config.key = Schlüssel
com.top_logic.xio.importer.handlers.ResolveExisting.Config.key.tooltip = Funktion zur Berechnung des Schlüssels eines vorhandenen Objekts, mit dem die Kennungen des Imports abgeglichen werden. <p> Die Funktion erhält ein von <i>Objekte</i> berechnetes Objekt als Argument, z. B. <code>obj -> $obj.get(`my.module:MyType#extId`)</code>. Ein Schlüssel, der kein String ist, wird in seine String-Darstellung konvertiert. Ein Objekt mit einem leeren Schlüssel wird nicht gefunden. Wenn mehrere Objekte denselben Schlüssel haben, wird das erste verwendet und eine Warnung ausgegeben. </p>
com.top_logic.xio.importer.handlers.ResolveExisting.Config.objects = Objekte
com.top_logic.xio.importer.handlers.ResolveExisting.Config.objects.tooltip = Ausdruck, der die vorhandenen Objekte berechnet, anhand derer Kennungen aufgelöst werden. <p> Der Ausdruck erhält den Wert der Argumentvariablen als erstes Argument. Ein Ausdruck, der diesen Wert nicht benötigt, kann ihn ignorieren, z. B. <code>all(`my.module:MyType`)</code>; ein Ausdruck, der ihn benötigt, ist eine Funktion, z. B. <code>scope -> $scope.get(`my.module:Container#items`)</code>. </p> <p> Ohne <i>Partition</i> wird der Ausdruck nur einmal pro Import ausgewertet, und zwar dann, wenn eine Kennung innerhalb des Inhalts dieses Handlers zum ersten Mal nicht gefunden wird. </p> <p> Mit einer <i>Partition</i> erhält der Ausdruck den Partitionsschlüssel als zweites Argument und berechnet nur die vorhandenen Objekte dieser Partition, z. B. <code>scope -> program -> $scope.get(`my.module:Container#programs`).filter(p -> $p.get(`my.module:Program#name`) == $program).get(`my.module:Program#parts`)</code>. Er wird nur einmal pro Import und Partition ausgewertet, und zwar dann, wenn eine Kennung dieser Partition zum ersten Mal nicht gefunden wird. </p> <p> Das erste Argument ist der Wert der Argumentvariablen bei der Anwendung dieses Handlers, in der die Auswertung geschieht. </p>
com.top_logic.xio.importer.handlers.ResolveExisting.Config.partition = Partition
com.top_logic.xio.importer.handlers.ResolveExisting.Config.partition.tooltip = Optionale Funktion zur Berechnung des Partitionsschlüssels einer Kennung. <p> Die Funktion erhält eine Kennung, die dem Import nicht bekannt ist, als Argument, z. B. <code>id -> $id.split("_", limit: 2).firstElement()</code> für Kennungen der Form <code>&lt;partition&gt;_&lt;local-id&gt;</code>. Ein Partitionsschlüssel, der kein String ist, wird in seine String-Darstellung konvertiert. Eine Kennung mit einem leeren Partitionsschlüssel wird nicht gefunden. </p> <p> Mit dieser Funktion wird eine Kennung nur unter den vorhandenen Objekten ihrer Partition gesucht, die <i>Objekte</i> aus dem Partitionsschlüssel berechnet. Die Objekte von Partitionen, auf die der Import nicht verweist, werden nie berechnet. Ohne diese Funktion bilden alle vorhandenen Objekte eine einzige Partition. </p>
com.top_logic.xio.importer.handlers.ResolveExisting.tooltip = <i>Verschachtelter Import-Handler</i>, der Kennungen in seinem Inhalt zu Objekten auflöst, die bereits vor dem Import existierten. <p> Innerhalb des Inhalts dieses Handlers wird zu einer Kennung, die dem Import unbekannt ist, das vorhandene Objekt mit diesem Schlüssel gesucht. Über eine solche Kennung werden Referenzen aufgelöst (z. B. <i>Objektreferenz</i>, <i>Referenzimport</i>), und eine <i>Objekterzeugung</i> mit <i>Bestehendes Objekt verwenden</i> aktualisiert das vorhandene Objekt, anstatt ein neues zu erstellen. </p> <p> Ohne <i>Partition</i> werden alle vorhandenen Objekte auf einmal berechnet und indiziert. Mit einer <i>Partition</i> werden nur die vorhandenen Objekte der Partition berechnet und indiziert, zu der eine Kennung gehört, und zwar dann, wenn eine Kennung dieser Partition zum ersten Mal nicht gefunden wird. </p> <p> Wenn Handler dieser Art verschachtelt sind, wird zuerst der innerste abgefragt. </p>
com.top_logic.xio.importer.handlers.ScopedImportHandler = Wechsel des Kontexts
