com.top_logic.ai.vector.index.VectorIndexSearchTool = Vector index Suchtool
com.top_logic.ai.vector.index.VectorIndexSearchTool.tooltip = KI-Tool, das eine semantische Suche im <i>Vektorindex</i> durchführt. <p> Dieses Tool stellt die Vektorindex-Suchfunktionalität für KI-Agenten bereit. Es nimmt eine Abfrage in natürlicher Sprache entgegen, wandelt diese mithilfe des konfigurierten Embedding-Modells um und gibt die semantisch ähnlichsten Dokumente zurück, die im Vektorindex gespeichert sind. </p> <p> Das Tool ist in der ToolRegistry registriert, wird jedoch standardmäßig keinem Agenten zugewiesen. </p>

