com.top_logic.security.passkey.PasskeyRefusedException.Category.USER_NOT_VERIFIED = User not verified
com.top_logic.security.passkey.PasskeyRefusedException.Category.USER_NOT_VERIFIED.tooltip = The authenticator did not verify its user, although required.
com.top_logic.security.passkey.PasskeyRefusedException.Category.WRONG_ORIGIN = Wrong origin
com.top_logic.security.passkey.PasskeyRefusedException.Category.WRONG_ORIGIN.tooltip = The ceremony ran on a page whose origin the relying party does not accept.
com.top_logic.security.passkey.PasskeyService = Passkey service
com.top_logic.security.passkey.PasskeyService.Config.origins = Origins
com.top_logic.security.passkey.PasskeyService.Config.origins.tooltip = The origins the browser may run a ceremony on, e.g. <code>https://app.example.com</code>. <p> Set, they replace the origin of the public address of the application, so list that address too if passkeys are to work there. Empty: the origin of the public address of the application (%HOST%, variable <code>tl_host</code>). </p>
com.top_logic.security.passkey.PasskeyService.Config.rp-id = Relying party ID
com.top_logic.security.passkey.PasskeyService.Config.rp-id.tooltip = The relying party ID: the domain the passkeys are bound to, e.g. <code>example.com</code>. <p> A passkey can only be used on this domain and its subdomains, so changing it makes all registered passkeys unusable. It must be the host of every accepted origin or a parent domain of it. Empty: the host of the public address of the application (%HOST%, variable <code>tl_host</code>), or, without one, the host of the first of the origins. </p>
com.top_logic.security.passkey.PasskeyService.Config.rp-name = Relying party name
com.top_logic.security.passkey.PasskeyService.Config.rp-name.tooltip = The name of the relying party, shown by an authenticator when a passkey is created. <p> Empty: the application title. </p>
com.top_logic.security.passkey.PasskeyService.Config.timeout = Timeout
com.top_logic.security.passkey.PasskeyService.Config.timeout.tooltip = How long the browser waits for the user to answer a ceremony, and how long a started ceremony is accepted.
com.top_logic.security.passkey.PasskeyService.Config.usage = Usage
com.top_logic.security.passkey.PasskeyService.Config.usage.tooltip = What the passkeys of the application are for: a login with a passkey alone, or a passkey as second factor after the password. <p> The passkeys serve one of both, never both at once. Passkeys registered for a login with a passkey alone are discoverable, passkeys registered as second factor are not, where the authenticator allows it; a change of the usage applies to the registered passkeys as they are. </p>
com.top_logic.security.passkey.PasskeyService.Config.user-verification = User verification
com.top_logic.security.passkey.PasskeyService.Config.user-verification.tooltip = Whether an authenticator must verify its user (PIN, biometrics) when a passkey is registered or used as second factor. <p> Applies to the usage <i>second factor</i>. With the usage <i>login</i>, the passkey is the only proof of a login, so user verification is always required. </p>
com.top_logic.security.passkey.PasskeyService.tooltip = The relying party of the passkeys (Web Authentication credentials) of the accounts: registers passkeys and checks logins with them. <h2>Address of the relying party</h2> <p> The relying party ID and the accepted origins are taken from the public address of the application, the alias %HOST% (set from the variable <code>tl_host</code>), when the service starts: the origin of that address is the accepted origin, its host the relying party ID. The options rp-id and origins override them, see the resolution. Nothing is taken from a request: a reverse proxy decides what a request says, and the relying party ID binds every passkey for good. If no origin can be resolved, the service logs an error and stays up without passkeys: every <code>start</code> method refuses with the message that passkeys are not set up. </p> <h2>Refusals</h2> <p> A <code>finish</code> method refuses a credential with a <i>passkey refused exception</i> that names the category of the refusal and the refused credential, and logs the refusal as warning with the category, the reason, the credential ID, the accounts involved and the origin the browser reported. The categories are decided by the checks of this service before the library runs its own; a refusal of the library is <i>failed</i> with its reason. </p> <h2>Usage of the passkeys</h2> <p> The option usage decides what the passkeys of the application are for, one of: </p> <ul> <li><i>login</i>: a passkey alone logs its account in. Registered passkeys are discoverable, so they log in without a user name, and registrations and logins always require that the authenticator verifies its user (PIN, biometrics), because the passkey is the only proof. A login with a passkey after the password is refused.</li> <li><i>Second factor</i>: a passkey confirms the login of an account after its password. Registered passkeys are non-discoverable where the authenticator allows it, and registrations and logins require the configured user verification. A login with a passkey alone is refused.</li> </ul>
com.top_logic.security.passkey.PasskeyUsage = Passkey usage
com.top_logic.security.passkey.PasskeyUsage.LOGIN = Login
com.top_logic.security.passkey.PasskeyUsage.LOGIN.tooltip = A passkey alone logs its account in, without the password. <p> Passkeys are created discoverable, so that the user picks one without giving a user name, and the authenticator always verifies its user (PIN, biometrics), since the passkey is the only proof of the login. Passkeys are no second factor. </p>
com.top_logic.security.passkey.PasskeyUsage.SECOND_FACTOR = Second factor
com.top_logic.security.passkey.PasskeyUsage.SECOND_FACTOR.tooltip = A passkey confirms the login of an account after its password, as second factor. <p> Passkeys are created non-discoverable where the authenticator allows it, and the authenticator verifies its user as configured. No login with a passkey alone is offered. </p>
com.top_logic.security.passkey.PasskeyUsage.tooltip = What the passkeys of an application are for, see <i>Usage</i> (<i>passkey service configuration</i>). <p> An application uses its passkeys either for a login with a passkey alone or as second factor after the password, never for both: a passkey that logs in by itself would otherwise also be demanded after the password, and the second factor would not add a second proof. </p>
com.top_logic.security.passkey.view.DeletePasskeyAction = Delete passkey action
com.top_logic.security.passkey.view.DeletePasskeyAction.tooltip = <i>Delete object action</i> deleting a <i>passkey</i> on behalf of the account it belongs to, which keeps an account required to use a second factor from deleting its last one. <p> An account whose <i>mfa requirement</i> is <i>required</i> cannot switch its second factor off (see <i>disable mfa action</i>), so it cannot delete the passkey that is its only second factor either: the deletion is refused unless the account keeps another passkey or another configured method of the login it has set up, e.g. an authenticator app. A command with this action is disabled for such a passkey and tells why. If the passkeys of the application log in by themselves (<i>login</i>), they are no second factor, and every passkey may be deleted. </p> <p> An administrator removing a passkey of somebody else deletes it with <i>delete object action</i>: a required account without a second factor sets one up at its next login. </p> <p> Example: delete the selected passkey of the current user. </p> <pre> &lt;generic-command inputs="selectedPasskey"&gt; &lt;executability&gt; &lt;null-input-disabled/&gt; &lt;/executability&gt; &lt;confirm expr="..."/&gt; &lt;verify-identity/&gt; &lt;delete-passkey/&gt; &lt;write-channel name="selectedPasskey" clear="true"/&gt; &lt;/generic-command&gt; </pre>
com.top_logic.security.passkey.view.PasskeyCeremonyElement = Passkey ceremony element
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.account = Account
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.account.tooltip = Channel holding the account the passkey ceremony is run for. <p> The channel must be filled by the server, e.g. the login, not by an input of the user. While it holds no account, the button is disabled. </p>
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.appearance = Appearance
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.appearance.tooltip = The appearance of the button, e.g. <i>Link</i> for an inline link.
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.auto-start = Auto start
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.auto-start.tooltip = Whether the browser asks for the passkey as soon as the element is displayed, without a click on the button. <p> A browser that only accepts the request after a click of the user refuses the automatic start silently; the button stays available. </p>
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.image = Image
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.image.tooltip = The icon of the button.
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.label = Label
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.label.tooltip = The label of the button.
com.top_logic.security.passkey.view.PasskeyCeremonyElement.tooltip = Base class of a <i>UI element</i> showing a button that runs a <i>passkey ceremony</i> in the browser, for the account on an optional channel.
com.top_logic.security.passkey.view.PasskeyFunctions.mayUse = Account may use passkeys
com.top_logic.security.passkey.view.PasskeyFunctions.mayUse.param.account.tooltip = The account to test.
com.top_logic.security.passkey.view.PasskeyFunctions.mayUse.return = Whether the account may create passkeys.
com.top_logic.security.passkey.view.PasskeyFunctions.mayUse.tooltip = Whether the given account may create passkeys. <p> This is how a view offers the creation of a passkey only to an account that may have one: <code>passkeyMayUse(currentUser())</code>. The anonymous account never may create one. If the passkeys of the application log in by themselves, every other account may; if they are second factors, an account whose second factor is switched off for good may not. </p>
com.top_logic.security.passkey.view.PasskeyLoginElement = Passkey login element
com.top_logic.security.passkey.view.PasskeyLoginElement.tooltip = <i>UI element</i> showing a button that logs in with a passkey. <p> Without an account channel, the user picks a passkey of any account, and the passkey alone logs its account in (the authenticator always verifies its user). With an account channel, only the passkeys of the account on the channel are accepted: the passkey as second factor, e.g. in the login dialog that the login opens with the account whose password it checked. </p> <p> The usage of the passkeys decides which of both is offered: the element without account channel only for <i>login</i>, the element with account channel only for <i>second factor</i>. An element whose kind of login the usage does not allow offers no ceremony and is hidden. </p> <p> The login continues for the account the passkey belongs to, as the check of the passkey established it: the passwordless login begins the <i>login flow</i> of the account, with the <i>second factor login step</i> marked as proven; the passkey as second factor finishes the <i>second factor login step</i> of the login in progress. Either way the further login steps run before the session starts. </p>
com.top_logic.security.passkey.view.PasskeyRegistrationElement = Passkey registration element
com.top_logic.security.passkey.view.PasskeyRegistrationElement.Config.complete-login = Complete login
com.top_logic.security.passkey.view.PasskeyRegistrationElement.Config.complete-login.tooltip = Whether a stored passkey continues the login of the account on the account channel, which sets up its second factor during the login. <p> Requires the account channel, and excludes the actions after a registration. </p>
com.top_logic.security.passkey.view.PasskeyRegistrationElement.Config.on-success = On success
com.top_logic.security.passkey.view.PasskeyRegistrationElement.Config.on-success.tooltip = Actions run after a passkey has been stored, with the passkey as argument <code>"passkey"</code>.
com.top_logic.security.passkey.view.PasskeyRegistrationElement.tooltip = <i>UI element</i> showing a button that creates a passkey for an account. <p> The element serves two situations: </p> <ul> <li>An account that is logged in creates a passkey of its own, e.g. in its settings. The account is the one logged in, or the one on the account channel, which then must be the one logged in. After the passkey is stored, the actions run with it as argument <code>"passkey"</code>, e.g. to update a list of the passkeys.</li> <li>The login sets up a passkey as second factor (<i>Complete login</i>): the account on the account channel, put there by the login after it checked the password, is required to use a second factor and has none set up. The registration runs with the verification of the user by the authenticator, so the stored passkey confirms the account and finishes the second-factor step of its login.</li> </ul> <p> An account that does not fit the situation gets no passkey: the button is disabled and tells why. </p>
com.top_logic.security.passkey.view.PasskeySecondFactor = Passkey second factor
com.top_logic.security.passkey.view.PasskeySecondFactor.tooltip = <i>Second factor</i> confirming a login with a passkey of the account. <p> The method is available only if the passkeys of the application are second factors, the usage <i>second factor</i>. With the usage <i>login</i>, a passkey logs in by itself and no account has this method set up or may set it up. </p> <p> An account has it set up when it has a passkey, and may set it up when it may use passkeys. The verification is the passkey dialog with a <i>passkey login element</i> for the account, the set-up the set-up dialog with a <i>passkey registration element</i> completing the login; both receive the account on the dialog channel <code>"account"</code>. </p>
com.top_logic.security.passkey.view.PasskeyUsageElement = Passkey usage element
com.top_logic.security.passkey.view.PasskeyUsageElement.Config.usage = Usage
com.top_logic.security.passkey.view.PasskeyUsageElement.Config.usage.tooltip = The usage of the passkeys in which the content is shown.
com.top_logic.security.passkey.view.PasskeyUsageElement.tooltip = <i>UI element</i> that shows its content only when the passkeys of the application are used as configured, the usage set in the configuration of the <i>passkey service</i>. <p> A view offers what belongs to one usage of the passkeys - a passkey that logs in by itself, or a passkey as second factor - inside an element for that usage, so that the application shows only the offers of the usage it is configured with: </p> <pre> &lt;if-passkey-usage usage="login"&gt; &lt;text&gt; &lt;label&gt;&lt;en&gt;A passkey signs you in without user name and password.&lt;/en&gt;&lt;/label&gt; &lt;/text&gt; ... &lt;/if-passkey-usage&gt; </pre> <p> The usage is part of the configuration of the <i>passkey service</i>, so it is decided once, when the control of the element is created. In another usage, the element shows an empty, hidden content, which takes no place in its container (no gap of the enclosing stack on either side of it), as a conditional element whose condition does not hold. </p>
