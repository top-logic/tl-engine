com.top_logic.layout.wysiwyg.ui.HtmlFunctions.images.tooltip = The images of the given structured text. <p> Together with <i>HTML source of structured text</i>, this gives the parts that <i>structured text with HTML source</i> puts together again, e.g. to store a changed source with the images of the original text. </p>
com.top_logic.layout.wysiwyg.ui.HtmlFunctions.objectLink = Link to an object
com.top_logic.layout.wysiwyg.ui.HtmlFunctions.objectLink.param.label.tooltip = The text the link is displayed with. Empty uses the object's own label.
com.top_logic.layout.wysiwyg.ui.HtmlFunctions.objectLink.param.object.tooltip = The object the link leads to.
com.top_logic.layout.wysiwyg.ui.HtmlFunctions.objectLink.return = The link as an HTML anchor element.
com.top_logic.layout.wysiwyg.ui.HtmlFunctions.objectLink.tooltip = A link leading to the given object, as HTML source to embed into structured text. <p> Displayed structured text offers such a link as a link to the object: following it leads to the place the application shows objects of that kind. </p>
com.top_logic.layout.wysiwyg.ui.HtmlFunctions.source = HTML source of structured text
com.top_logic.layout.wysiwyg.ui.HtmlFunctions.source.param.content.tooltip = The value of an HTML attribute.
