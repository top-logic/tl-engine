com.top_logic.layout.react.wysiwyg.HtmlConfigProvider = HTML-Editor für Konfigurationen
com.top_logic.layout.react.wysiwyg.HtmlConfigProvider.Config.source-feature-sets = Funktionsumfänge mit Quelltextbearbeitung
com.top_logic.layout.react.wysiwyg.HtmlConfigProvider.Config.source-feature-sets.tooltip = Die Funktionsumfänge, für die der Editor die Bearbeitung des HTML-Quelltexts anbietet. <p> Ein Funktionsumfang wird durch die <i>HTML</i>-Annotation der Eigenschaft benannt. </p>
com.top_logic.layout.react.wysiwyg.HtmlConfigProvider.tooltip = <i>Konfigurations-Annotations-Control-Provider</i>, der eine Eigenschaft, deren Text <i>HTML</i> ist, in einem <i>React-WYSIWYG-Control</i> bearbeitet. <p> Solange die Eigenschaft bearbeitet werden kann, wird der formatierte Text im WYSIWYG-Editor bearbeitet. Für einen unter <i>„Funktionsumfänge mit Quelltextbearbeitung“</i> aufgeführten Funktionsumfang bietet der Editor zusätzlich die Bearbeitung des HTML-Quelltexts an. Solange die Eigenschaft nicht bearbeitet werden kann, wird der formatierte Text angezeigt. </p> <p> Ein bearbeiteter Text wird nur gespeichert, wenn er die HTML-Sicherheitsprüfung der Anwendung besteht. Ein Text, den die Prüfung zurückweist, wird am Feld gemeldet, das seinen zuletzt akzeptierten Wert behält. </p> <p> Ein als Text vorliegender Wert – ein reiner Text oder der Text eines formatierten Werts, wie beispielsweise ein TL-Script-Ausdruck, der als HTML mit eingebetteten Ausdrücken geschrieben ist – wird als ein einziger Text bearbeitet. Ein internationalisierter Text wird pro Sprache bearbeitet: der Text in der Sprache des Benutzers direkt im Formular, die anderen Sprachen in einem Dialog. Alle anderen Eigenschaften werden dem Control überlassen, das <i>der Konfigurations-Control-Dienst</i> ohne die Annotation auswählt. </p>
com.top_logic.layout.react.wysiwyg.WysiwygControlProvider = WYSIWYG-Editor
com.top_logic.layout.react.wysiwyg.WysiwygControlProvider.Config.commands = Befehle
com.top_logic.layout.react.wysiwyg.WysiwygControlProvider.Config.commands.tooltip = Befehle, die die Symbolleiste des Editors zusätzlich zu den Formatierungsschaltflächen bietet. <p> Sofern nicht anders angegeben, wird ein Befehl in die Symbolleiste aufgenommen, wie es bei jedem Befehl der Fall ist, der in einer Symbolleiste platziert wird. Die Befehle erkennen die Kanäle der Ansicht, in der das bearbeitete Feld angezeigt wird, beziehen ihre Eingaben daher von dort und leiten sie an die von ihnen geöffneten Dialoge weiter; den Zugriff auf den Text erhalten sie über den Einfügekanal. </p>
com.top_logic.layout.react.wysiwyg.WysiwygControlProvider.Config.insert-channel = Einfügekanal
com.top_logic.layout.react.wysiwyg.WysiwygControlProvider.Config.insert-channel.tooltip = Name des Kanals, dessen Text der Editor an der Cursorposition einfügt. <p> Wird dort deklariert, wo die Befehle des Editors einen Ort benötigen, an den sie ihr Ergebnis schreiben können; der Kanal existiert dann ausschließlich für sie, neben den Kanälen der umgebenden Ansicht. Eine Ansicht benennt die Kanäle, mit denen sie arbeitet, und dies ist einer davon. </p> <p> Wird dieser Parameter nicht festgelegt, verfügt der Editor über keinen solchen Kanal, und seine Befehle wirken sich ausschließlich auf die Ansicht aus. </p>
com.top_logic.layout.react.wysiwyg.WysiwygControlProvider.tooltip = <i>React-Feldcontrol-Provider</i> für Attribute vom Typ tl.model.wysiwyg:Html. <p> Die Symbolleiste des Editors enthält neben den Formatierungsschaltflächen des Editors selbst die Befehle, die durch die Konfiguration vorgegeben sind. Ein solcher Befehl führt dieselben Aktionen aus wie ein Befehl der umgebenden Ansicht – einen Dialog öffnen, ein Skript ausführen, einen Kanal schreiben – und greift über den Einfügekanal auf den Text zu: Was dort geschrieben wird, wird an der Cursorposition eingefügt. </p>
