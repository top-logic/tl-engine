com.top_logic.tl.ai.index.AiIndexConfig = Konfiguration des KI-Index
com.top_logic.tl.ai.index.AiIndexConfig.batch-size = Stapelgröße
com.top_logic.tl.ai.index.AiIndexConfig.batch-size.tooltip = Wie viele Objekte gemeinsam indiziert werden, mit einem einzigen Aufruf des Embedders.
com.top_logic.tl.ai.index.AiIndexConfig.build-step-millis = Dauer eines Aufbauschritts in Millisekunden
com.top_logic.tl.ai.index.AiIndexConfig.build-step-millis.tooltip = Wie lange ein Schritt eines vollständigen Aufbaus arbeitet, bevor er festschreibt und der Worker nach neuen Commits sieht.
com.top_logic.tl.ai.index.AiIndexConfig.chunking = Zerlegung in Abschnitte
com.top_logic.tl.ai.index.AiIndexConfig.chunking.tooltip = Wie Texte in Abschnitte unterteilt werden.
com.top_logic.tl.ai.index.AiIndexConfig.embedder = Embedder
com.top_logic.tl.ai.index.AiIndexConfig.embedder.tooltip = Wie Texte in Vektoren umgewandelt werden; keine Umwandlung bei einem reinen Wortindex.
com.top_logic.tl.ai.index.AiIndexConfig.location = Verzeichnis
com.top_logic.tl.ai.index.AiIndexConfig.location.tooltip = Das Verzeichnis des Index, unter dem jede Generation ein eigenes Verzeichnis besitzt. <p> Der Index enthält den Text jedes indizierten Objekts, daher muss das Verzeichnis denselben Schutz genießen wie die Datenbankdateien. Jeder Knoten eines Clusters verwaltet seinen eigenen Index; das Verzeichnis darf nicht gemeinsam genutzt werden. </p>
com.top_logic.tl.ai.index.AiIndexConfig.max-candidates = Höchstzahl der Kandidaten
com.top_logic.tl.ai.index.AiIndexConfig.max-candidates.tooltip = Wie viele Abschnitte jede Seite einer Suche höchstens liest, wenn sie tiefer sucht, weil der Leser die besten Treffer nicht lesen darf.
com.top_logic.tl.ai.index.AiIndexConfig.readable-scopes = Lesbare Bereiche
com.top_logic.tl.ai.index.AiIndexConfig.readable-scopes.tooltip = TL-Script ohne Argumente, das jedes Scope-Objekt zurückgibt, in dem ein Leser suchen kann, z. B. all(`my:Project`). <p> Wird bei jeder Suche in der eigenen Interaktion des Lesers ausgeführt, und das Ergebnis wird erneut anhand der Leserechte des Lesers gefiltert. Die Suche filtert dann innerhalb des Indexes nach diesen Bereichen, sodass ein Leser eines von tausend Projekten eine vollständige Seite aus diesem Projekt erhält. Ohne diese Funktion werden Blöcke von typgebundenen Bereichen nur nach Typ gefiltert und einzeln überprüft, was dazu führen kann, dass ein Leser mit eingeschränkten Zugriffsrechten nur eine kurze Seite erhält. </p>
com.top_logic.tl.ai.index.AiIndexConfig.revision-slice = Revisionen je Schritt
com.top_logic.tl.ai.index.AiIndexConfig.revision-slice.tooltip = Wie viele Revisionen der Historie auf einmal gelesen und festgeschrieben werden.
com.top_logic.tl.ai.index.AiIndexConfig.tooltip = Was ein Index enthält und wie er geführt wird.
com.top_logic.tl.ai.index.AiIndexConfig.types = Typen
com.top_logic.tl.ai.index.AiIndexConfig.types.tooltip = Die indizierten Typen.
com.top_logic.tl.ai.index.AiIndexService = KI-Index
com.top_logic.tl.ai.index.AiIndexService.tooltip = Der Hybridindex der Anwendung: Wörter und Bedeutungen der konfigurierten Typen, die mit der Wissensdatenbank synchronisiert werden und im Rahmen der Leserechte durchsucht werden können. <p> Konfigurieren Sie die indizierten Typen und einen Embedder; ohne Typen enthält der Index nichts, ohne Embedder werden nur Wörter durchsucht. Siehe tl-ai-index/README.md. </p>
com.top_logic.tl.ai.index.config.ChunkingConfig = Zerlegung in Abschnitte
com.top_logic.tl.ai.index.config.ChunkingConfig.max-chars = Maximale Zeichenanzahl
com.top_logic.tl.ai.index.config.ChunkingConfig.max-chars.tooltip = Der größte Abschnitt in Zeichen. <p> 1.200 Zeichen sind etwa 300 Tokens deutschen Textes, unter den 512 Tokens der kleineren Modelle, auch mit dem Objektnamen davor. </p>
com.top_logic.tl.ai.index.config.ChunkingConfig.max-text-chars = Höchstzahl der Zeichen je Text
com.top_logic.tl.ai.index.config.ChunkingConfig.max-text-chars.tooltip = Die maximale Anzahl an Zeichen eines Textes, die indexiert werden; der Rest eines längeren Textes wird weggelassen.
com.top_logic.tl.ai.index.config.ChunkingConfig.overlap-sentences = Überlappende Sätze
com.top_logic.tl.ai.index.config.ChunkingConfig.overlap-sentences.tooltip = Wie viele Sätze ein Abschnitt vom vorhergehenden wiederholt.
com.top_logic.tl.ai.index.config.ChunkingConfig.page-marker = Seitenmarke
com.top_logic.tl.ai.index.config.ChunkingConfig.page-marker.tooltip = Ein regulärer Ausdruck für eine Zeile, die eine Seite einleitet, wobei die Seitenzahl die erste Gruppe bildet, z. B. ^\\[p\\.(\\d+)\\]$. Ein Abschnitt erstreckt sich nie über eine Seite hinweg, sodass ein Treffer die Seite benennen kann.
com.top_logic.tl.ai.index.config.ChunkingConfig.tooltip = Wie die Texte der indizierten Objekte in Abschnitte unterteilt werden.
com.top_logic.tl.ai.index.config.IndexedTypeConfig = Indizierter Typ
com.top_logic.tl.ai.index.config.IndexedTypeConfig$Keyword = Schlüsselwort
com.top_logic.tl.ai.index.config.IndexedTypeConfig$Keyword.tooltip = Ein Wert, nach dem bei einer Suche gefiltert werden kann.
com.top_logic.tl.ai.index.config.IndexedTypeConfig$TextPart = Textabschnitt
com.top_logic.tl.ai.index.config.IndexedTypeConfig$TextPart.tooltip = Ein Text eines indizierten Objekts: der Wert eines Attributs oder das, was ein Skript daraus ableitet.
com.top_logic.tl.ai.index.config.IndexedTypeConfig.Keyword.name = Name
com.top_logic.tl.ai.index.config.IndexedTypeConfig.Keyword.name.tooltip = Der Name, mit dem eine Suche das Schlüsselwort anspricht.
com.top_logic.tl.ai.index.config.IndexedTypeConfig.Keyword.script = Skript
com.top_logic.tl.ai.index.config.IndexedTypeConfig.Keyword.script.tooltip = TL-Skript mit einem Argument, dem Objekt, das den Wert oder die Werte zurückgibt: Ein Objekt wird anhand seiner Kennung gezählt, ein Aufzählungswert anhand seines Namens, alles andere anhand seines Textes.
com.top_logic.tl.ai.index.config.IndexedTypeConfig.TextPart.attribute = Attribut
com.top_logic.tl.ai.index.config.IndexedTypeConfig.TextPart.attribute.tooltip = Das Attribut, dessen Wert der Text ist: eine Zeichenkette, ein internationalisierter Text, ein Binärwert, dessen Inhalt in Text umgewandelt wird, oder eine Liste dieser Elemente.
com.top_logic.tl.ai.index.config.IndexedTypeConfig.TextPart.name = Name
com.top_logic.tl.ai.index.config.IndexedTypeConfig.TextPart.name.tooltip = Der Name des Textes, der mit jedem Abschnitt gespeichert wird; der Name des Attributs, wenn keiner angegeben ist.
com.top_logic.tl.ai.index.config.IndexedTypeConfig.TextPart.reads = Gelesene Attribute
com.top_logic.tl.ai.index.config.IndexedTypeConfig.TextPart.reads.tooltip = Die Attribute des Objekts, das das Skript ausliest. <p> Ein Treffer zeigt einen Abschnitt nur einem Leser an, der jedes dieser Attribute lesen darf. Ein Skriptteil ohne diese Liste zeigt seinen Text niemandem an. </p>
com.top_logic.tl.ai.index.config.IndexedTypeConfig.TextPart.script = Skript
com.top_logic.tl.ai.index.config.IndexedTypeConfig.TextPart.script.tooltip = TL-Skript mit einem Argument, dem Objekt, das anstelle eines Attributs den Text angibt.
com.top_logic.tl.ai.index.config.IndexedTypeConfig.keywords = Schlüsselwörter
com.top_logic.tl.ai.index.config.IndexedTypeConfig.keywords.tooltip = Werte, nach denen bei einer Suche gefiltert werden kann, z. B. eine Datensatzart oder ein Status.
com.top_logic.tl.ai.index.config.IndexedTypeConfig.label-prefix = Objektname voranstellen
com.top_logic.tl.ai.index.config.IndexedTypeConfig.label-prefix.tooltip = Ob die Bezeichnung des Objekts jedem Chunk vorangestellt wird, bevor dieser eingebettet wird. <p> Ein Chunk von Seite 40 enthält also weiterhin den Titel des Dokuments in seinem Vektor. Die Bezeichnung ist nicht Teil des Chunk-Textes, den die Wortfelder analysieren und der bei einem Treffer angezeigt wird. </p>
com.top_logic.tl.ai.index.config.IndexedTypeConfig.name = Name
com.top_logic.tl.ai.index.config.IndexedTypeConfig.name.tooltip = Der qualifizierte Name des Typs, z. B. pietro:Statement.
com.top_logic.tl.ai.index.config.IndexedTypeConfig.scope = Bereich
com.top_logic.tl.ai.index.config.IndexedTypeConfig.scope.tooltip = TL-Skript mit einem Argument, dem Objekt, das das Objekt oder die Objekte zurückgibt, die es umfassen, z. B. sein Projekt. <p> Eine Suche filtert nach den Bereichen, auf die der Leser innerhalb des Index Zugriff hat; so erhält ein Leser, der auf ein Projekt von tausend Projekten zugreifen darf, eine vollständige Seite aus diesem Projekt. Ohne Angabe eines Bereichs filtert die Suche ausschließlich nach Typ und prüft erst anschließend die Zugriffsrechte für jeden Treffer, was dazu führen kann, dass ein Leser mit eingeschränkten Zugriffsrechten nur eine kurze Seite erhält. </p>
com.top_logic.tl.ai.index.config.IndexedTypeConfig.texts = Texte
com.top_logic.tl.ai.index.config.IndexedTypeConfig.texts.tooltip = Die Texte eines Objekts des Typs, nach dem gesucht wird.
com.top_logic.tl.ai.index.config.IndexedTypeConfig.tooltip = Welche Objekte eines Typs werden indiziert, mit welchem Text, welchem Geltungsbereich und welchen Schlüsselwörtern? <pre> &lt;type name="pietro:Statement" scope="s -&gt; $s.get(`pietro:Statement#project`)"&gt; &lt;text attribute="text"/&gt; &lt;text name="context" script="s -&gt; $s.get(`pietro:Statement#title`)" reads="title"/&gt; &lt;keywords&gt; &lt;keyword name="kind" script="s -&gt; $s.get(`pietro:Statement#kind`).get(`name`)"/&gt; &lt;/keywords&gt; &lt;/type&gt; </pre> <p> Die Konfiguration gilt für den Typ und für jeden Untertyp, der keine eigene Konfiguration besitzt. Die Skripte werden während des Schreibvorgangs des Indexes in einer Systeminteraktion ausgeführt, sodass sie jedes Objekt sehen können; sie dürfen jedoch nur lesen. </p>
com.top_logic.tl.ai.index.embed.AbstractEmbedder = Embedder
com.top_logic.tl.ai.index.embed.AbstractEmbedder.Config.batch-size = Stapelgröße
com.top_logic.tl.ai.index.embed.AbstractEmbedder.Config.batch-size.tooltip = Wie viele Texte in einen Aufruf des Modells gehen.
com.top_logic.tl.ai.index.embed.AbstractEmbedder.Config.dimensions = Dimensionen
com.top_logic.tl.ai.index.embed.AbstractEmbedder.Config.dimensions.tooltip = Die Anzahl der Komponenten jedes Vektors. <p> Die eigene Länge des Modells, oder weniger bei einem Modell, das dafür trainiert ist, gekürzt zu werden (Matryoshka). </p>
com.top_logic.tl.ai.index.embed.AbstractEmbedder.Config.passage-prefix = Passage-Präfix
com.top_logic.tl.ai.index.embed.AbstractEmbedder.Config.passage-prefix.tooltip = Text, der vor jeder Passage eingefügt wird, bevor diese eingebettet wird, z. B. „passage: “ bei den e5-Modellen; leer bei arctic-embed v2.
com.top_logic.tl.ai.index.embed.AbstractEmbedder.Config.query-prefix = Abfragepräfix
com.top_logic.tl.ai.index.embed.AbstractEmbedder.Config.query-prefix.tooltip = Text, der jeder Abfrage vorangestellt wird, bevor diese eingebettet wird, z. B. „query: “ bei den Modellen „e5“ und „arctic-embed“.
com.top_logic.tl.ai.index.embed.AbstractEmbedder.tooltip = Was alle <i>Embedder</i> auf die gleiche Weise tun: Präfixe, Batches, die Anzahl der Dimensionen und Normalisierung. <p> Ein Modell, das mit Matryoshka-Repräsentationslernen trainiert wurde (arctic-embed v2, Qwen3-Embedding), behält den Großteil seiner Qualität bei, wenn sein Vektor auf weniger Dimensionen gekürzt wird. <i>Dimensionen</i>, die kleiner sind als die Ausgabe des Modells, kürzen jeden Vektor auf diese Länge und normalisieren ihn erneut; dadurch wird der Index kleiner. Ein Modell ohne dieses Training muss mit einer eigenen Länge konfiguriert werden. </p>
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder = OpenAI-kompatibler Endpunkt
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.Config.api-key = API-Schlüssel
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.Config.api-key.tooltip = Der Schlüssel wird als Bearer-Token gesendet; bei einem Server ohne Authentifizierung entfällt dies.
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.Config.base-url = Basis-URL
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.Config.base-url.tooltip = Die Adresse des Servers, z. B. https://embed.example.eu; ein abschließendes „/v1“ kann angegeben werden oder auch nicht.
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.Config.model = Modell
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.Config.model.tooltip = Der Modellname, unter dem der Server das Modell kennt.
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.Config.retries = Wiederholungsversuche
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.Config.retries.tooltip = Wie oft eine fehlgeschlagene Anfrage wiederholt wird.
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.Config.retry-delay-millis = Wartezeit bis zum erneuten Versuch in Millisekunden
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.Config.retry-delay-millis.tooltip = Die Verzögerung vor der ersten Wiederholung; sie verdoppelt sich mit jeder weiteren Wiederholung.
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.Config.send-dimensions = Dimensionen mitsenden
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.Config.send-dimensions.tooltip = Ob die Anfrage die konfigurierte Anzahl von Dimensionen vom Server anfordert. <p> Die OpenAI-API kürzt den Vektor auf dem Server, wenn dies angefordert wird; viele andere Server lehnen den Parameter ab. Ohne diesen Parameter wird ein längerer Vektor hier gekürzt. </p>
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.Config.timeout-seconds = Timeout in Sekunden
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.Config.timeout-seconds.tooltip = Wie lange eine Anfrage dauern kann.
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.tooltip = Ein <i>Embedder</i>, der einen POST-Aufruf an <base-url>/v1/embeddings eines OpenAI-kompatiblen Servers sendet. <p> vLLM, text-embeddings-inference, der Server von llama.cpp und Ollama bieten alle diesen Weg an, sodass eine Klasse sowohl unseren eigenen GPU-Endpunkt als auch eine kostenpflichtige API bedient. Eine Anfrage überträgt einen ganzen Batch. Eine Anfrage, die mit einem Netzwerkfehler, einem 429- oder einem 5xx-Fehler fehlschlägt, wird mit einer sich verdoppelnden Verzögerung erneut versucht; jede andere Antwort führt sofort zum Abbruch. </p>
com.top_logic.tl.ai.index.query.SearchMode = Suchmodus
com.top_logic.tl.ai.index.query.SearchMode.HYBRID = Hybrid
com.top_logic.tl.ai.index.query.SearchMode.HYBRID.tooltip = Worte und Bedeutung – verschmolzen.
com.top_logic.tl.ai.index.query.SearchMode.MEANING = Bedeutung
com.top_logic.tl.ai.index.query.SearchMode.MEANING.tooltip = Nur Bedeutung: Umschreibungen, andere Sprachen.
com.top_logic.tl.ai.index.query.SearchMode.WORDS = Wörter
com.top_logic.tl.ai.index.query.SearchMode.WORDS.tooltip = Nur Wörter: genaue Begriffe, Codes, Namen.
com.top_logic.tl.ai.index.query.SearchMode.tooltip = Auf welcher Seite des Index eine Suche erfolgt.
com.top_logic.tl.ai.index.script.AiIndexScriptFunctions.search = Suche
com.top_logic.tl.ai.index.script.AiIndexScriptFunctions.search.param.options.tooltip = Optional: types (qualifizierte Typnamen), scopes (Bereichsobjekte), filters (Schlüsselwortname zu Wert oder Liste von Werten), mode ("hybrid", "words" oder "meaning"), limit (höchstens 50).
com.top_logic.tl.ai.index.script.AiIndexScriptFunctions.search.param.query.tooltip = Wonach gesucht wird.
com.top_logic.tl.ai.index.script.AiIndexScriptFunctions.search.return = Die gefundenen Objekte, die besten zuerst.
com.top_logic.tl.ai.index.script.AiIndexScriptFunctions.search.tooltip = Durchsucht den Index der Anwendung nach Wörtern und deren Bedeutung. <p> Liefert die Objekte, die der aktuelle Benutzer lesen darf, beginnend mit den relevantesten. Eine deutsche Suchanfrage findet einen englischen Text. Beispiel: <code>aiIndexSearch("Grundplatte", {"types": ["my:Statement"], "limit": 5})</code>. </p>
com.top_logic.tl.ai.index.script.AiIndexScriptFunctions.similar = Ähnlich
com.top_logic.tl.ai.index.script.AiIndexScriptFunctions.similar.param.object.tooltip = Das Objekt, von dem ausgegangen werden soll.
com.top_logic.tl.ai.index.script.AiIndexScriptFunctions.similar.param.options.tooltip = Optional, wie bei aiIndexSearch, ohne mode.
com.top_logic.tl.ai.index.script.AiIndexScriptFunctions.similar.return = Die gefundenen Objekte, beginnend mit dem besten, ohne das angegebene.
com.top_logic.tl.ai.index.script.AiIndexScriptFunctions.similar.tooltip = Sucht nach Objekten, deren Inhalt dem des angegebenen Objekts ähnelt. <p> Beispiel: <code>aiIndexSimilar($statement, {"types": ["my:Statement"], "limit": 10})</code>. </p>
com.top_logic.tl.ai.index.script.AiIndexScriptFunctions.status = Status
com.top_logic.tl.ai.index.script.AiIndexScriptFunctions.status.return = Ein Wörterbuch mit den Einträgen „ready“, „indexedRevision“, „headRevision“, „pendingRevisions“, „rebuilding“, „buildTotal“, „buildDone“, „meaning“ und „lastError“.
com.top_logic.tl.ai.index.script.AiIndexScriptFunctions.status.tooltip = Wie weit der Index ist.
