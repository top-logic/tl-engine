com.top_logic.security.passkey.PasskeyService = Passkey service
com.top_logic.security.passkey.PasskeyService.Config.origins = Origins
com.top_logic.security.passkey.PasskeyService.Config.origins.tooltip = The origins the browser may run a ceremony on, e.g. <code>https://app.example.com</code>. <p> Empty: the scheme, host and port of the request that starts a ceremony. </p>
com.top_logic.security.passkey.PasskeyService.Config.rp-id = Relying party ID
com.top_logic.security.passkey.PasskeyService.Config.rp-id.tooltip = The relying party ID: the domain the passkeys are bound to, e.g. <code>example.com</code>. <p> A passkey can only be used on this domain and its subdomains, so changing it makes all registered passkeys unusable. Empty: the host name of the request that starts a ceremony. </p>
com.top_logic.security.passkey.PasskeyService.Config.rp-name = Relying party name
com.top_logic.security.passkey.PasskeyService.Config.rp-name.tooltip = The name of the relying party, shown by an authenticator when a passkey is created. <p> Empty: the application title. </p>
com.top_logic.security.passkey.PasskeyService.Config.timeout = Timeout
com.top_logic.security.passkey.PasskeyService.Config.timeout.tooltip = How long the browser waits for the user to answer a ceremony, and how long a started ceremony is accepted.
com.top_logic.security.passkey.PasskeyService.Config.user-verification = User verification
com.top_logic.security.passkey.PasskeyService.Config.user-verification.tooltip = Whether an authenticator must verify its user (PIN, biometrics) when a passkey is registered or used as second factor. <p> A login with a passkey alone always requires user verification. </p>
com.top_logic.security.passkey.PasskeyService.tooltip = The relying party of the passkeys (Web Authentication credentials) of the accounts: registers passkeys and checks logins with them. <p> The relying party ID and the accepted origins are either configured or taken from the request that starts a registration or login: the host name of the request is then the relying party ID, its scheme, host and port the only accepted origin. A local installation therefore works without configuration; behind a reverse proxy that does not forward the original host, configure both. </p> <p> Registered passkeys are discoverable, so they can log in without a user name. Such a login with a passkey alone always requires that the authenticator verifies its user (PIN, biometrics), because the passkey is its only proof. Registrations and logins with a passkey as second factor after the password require the configured user verification. </p>
com.top_logic.security.passkey.view.DeletePasskeyAction = Delete passkey action
com.top_logic.security.passkey.view.DeletePasskeyAction.tooltip = <i>Delete object action</i> deleting a <i>passkey</i> on behalf of the account it belongs to, which keeps an account required to use a second factor from deleting its last one. <p> An account whose <i>mfa requirement</i> is <i>required</i> cannot switch its second factor off (see <i>disable mfa action</i>), so it cannot delete the passkey that is its only second factor either: the deletion is refused unless the account keeps another passkey or another configured method of the login it has set up, e.g. an authenticator app. A command with this action is disabled for such a passkey and tells why. </p> <p> An administrator removing a passkey of somebody else deletes it with <i>delete object action</i>: a required account without a second factor sets one up at its next login. </p> <p> Example: delete the selected passkey of the current user. </p> <pre> &lt;generic-command inputs="selectedPasskey"&gt; &lt;executability&gt; &lt;null-input-disabled/&gt; &lt;/executability&gt; &lt;confirm expr="..."/&gt; &lt;verify-identity/&gt; &lt;delete-passkey/&gt; &lt;write-channel name="selectedPasskey" clear="true"/&gt; &lt;/generic-command&gt; </pre>
com.top_logic.security.passkey.view.PasskeyCeremonyElement = Passkey ceremony element
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.account = Account
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.account.tooltip = Channel holding the account the passkey ceremony is run for. <p> The channel must be filled by the server, e.g. the login, not by an input of the user. While it holds no account, the button is disabled. </p>
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.appearance = Appearance
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.appearance.tooltip = The appearance of the button, e.g. <i>Link</i> for an inline link.
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.auto-start = Auto start
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.auto-start.tooltip = Whether the browser asks for the passkey as soon as the element is displayed, without a click on the button. <p> A browser that only accepts the request after a click of the user refuses the automatic start silently; the button stays available. </p>
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.image = Image
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.image.tooltip = The icon of the button.
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.label = Label
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.label.tooltip = The label of the button.
com.top_logic.security.passkey.view.PasskeyCeremonyElement.tooltip = Base class of a <i>UI element</i> showing a button that runs a <i>passkey ceremony</i> in the browser, for the account on an optional channel.
com.top_logic.security.passkey.view.PasskeyFunctions.mayUse = Account may use passkeys
com.top_logic.security.passkey.view.PasskeyFunctions.mayUse.param.account.tooltip = The account to test.
com.top_logic.security.passkey.view.PasskeyFunctions.mayUse.return = Whether the account may create passkeys.
com.top_logic.security.passkey.view.PasskeyFunctions.mayUse.tooltip = Whether the given account may create passkeys. <p> This is how a view offers the creation of a passkey only to an account that may have one: <code>passkeyMayUse(currentUser())</code>. Neither the anonymous account nor an account whose second factor is switched off for good may create one. </p>
com.top_logic.security.passkey.view.PasskeyLoginElement = Passkey login element
com.top_logic.security.passkey.view.PasskeyLoginElement.tooltip = <i>UI element</i> showing a button that logs in with a passkey. <p> Without an account channel, the user picks a passkey of any account, and the passkey alone logs its account in (the authenticator always verifies its user). With an account channel, only the passkeys of the account on the channel are accepted: the passkey as second factor, e.g. in the login dialog that the login opens with the account whose password it checked. </p> <p> The login is completed for the account the passkey belongs to, as the check of the passkey established it. </p>
com.top_logic.security.passkey.view.PasskeyRegistrationElement = Passkey registration element
com.top_logic.security.passkey.view.PasskeyRegistrationElement.Config.complete-login = Complete login
com.top_logic.security.passkey.view.PasskeyRegistrationElement.Config.complete-login.tooltip = Whether a stored passkey completes the login of the account on the account channel, which sets up its second factor during the login. <p> Requires the account channel, and excludes the actions after a registration. </p>
com.top_logic.security.passkey.view.PasskeyRegistrationElement.Config.on-success = On success
com.top_logic.security.passkey.view.PasskeyRegistrationElement.Config.on-success.tooltip = Actions run after a passkey has been stored, with the passkey as argument <code>"passkey"</code>.
com.top_logic.security.passkey.view.PasskeyRegistrationElement.tooltip = <i>UI element</i> showing a button that creates a passkey for an account. <p> The element serves two situations: </p> <ul> <li>An account that is logged in creates a passkey of its own, e.g. in its settings. The account is the one logged in, or the one on the account channel, which then must be the one logged in. After the passkey is stored, the actions run with it as argument <code>"passkey"</code>, e.g. to update a list of the passkeys.</li> <li>The login sets up a passkey as second factor (<i>Complete login</i>): the account on the account channel, put there by the login after it checked the password, is required to use a second factor and has none set up. The registration runs with the verification of the user by the authenticator, so the stored passkey confirms the account and the login is completed for it.</li> </ul> <p> An account that does not fit the situation gets no passkey: the button is disabled and tells why. </p>
com.top_logic.security.passkey.view.PasskeySecondFactor = Passkey second factor
com.top_logic.security.passkey.view.PasskeySecondFactor.tooltip = <i>Second factor</i> confirming a login with a passkey of the account. <p> An account has it set up when it has a passkey, and may set it up when it may use passkeys. The verification is the passkey dialog with a <i>passkey login element</i> for the account, the set-up the set-up dialog with a <i>passkey registration element</i> completing the login; both receive the account on the dialog channel <code>"account"</code>. </p>
