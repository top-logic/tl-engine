class.com.top_logic.layout.view.agent.I18NConstants.ERROR_ACCESS_TOKEN_NO_ACCOUNT = An access token can only be issued for a logged-in account.
class.com.top_logic.layout.view.agent.I18NConstants.ERROR_ACCESS_TOKEN_NO_INPUT = No access token request to issue a token for.
class.com.top_logic.layout.view.agent.I18NConstants.ERROR_ACCESS_TOKEN_NO_LABEL = Please name the access token, so that you can tell it apart when withdrawing it.
class.com.top_logic.layout.view.agent.I18NConstants.ERROR_ACCESS_TOKEN_NO_TOKEN = No access token to withdraw.
class.com.top_logic.layout.view.agent.I18NConstants.ERROR_ACCESS_TOKEN_NO_VALIDITY = Please state how long the access token remains valid.
com.top_logic.layout.view.agent.AccessTokenAuthenticator = Access token authenticator
com.top_logic.layout.view.agent.AccessTokenAuthenticator.tooltip = Admits an agent that presents an access token its owner issued. <p> The presented secret is matched against the stored hash; a revoked or expired token admits nobody. Every admission is recorded on the token, so its owner sees that an agent is using it. </p>
com.top_logic.layout.view.agent.AgentAccess = Agent access
com.top_logic.layout.view.agent.AgentAccess.Config.authenticators = Authenticators
com.top_logic.layout.view.agent.AgentAccess.Config.authenticators.tooltip = The authenticators recognizing the credentials of non-browser callers, asked in order.
com.top_logic.layout.view.agent.AgentAccess.tooltip = Admission of non-browser callers to the <i>agent servlet</i>. <p> A browser reaches the endpoint with its session cookie. An agent outside the browser presents a credential in the Authorization header instead, which the registered <i>agent authenticators</i> resolve to the account it acts as. </p> <p> A credential also names the session the agent works in: the user issues it from a running session and thereby lets the agent drive that session's windows. The session is registered here under a key the credential carries, and the registration ends with the session — an agent cannot outlive the session it was admitted to. </p> <p> With no authenticator registered, only browsers reach the endpoint. </p>
com.top_logic.layout.view.agent.IssueAccessTokenAction = Issue access token action
com.top_logic.layout.view.agent.IssueAccessTokenAction.tooltip = <i>View action</i> issuing an access token for the current account from the form input passed as its input. <p> The input is a tl.agent:NewAccessToken carrying the token's label, its validity in hours and whether the agent may act. The action returns a transient carrier of the invitation — the application's address together with the issued token — which the surrounding chain hands to the dialog displaying it, the one and only time the token is readable. The token admits the agent to the session it is issued from, which is registered with <i>agent access</i> here. </p>
com.top_logic.layout.view.agent.RevokeAccessTokenAction = Revoke access token action
com.top_logic.layout.view.agent.RevokeAccessTokenAction.tooltip = <i>View action</i> withdrawing the access token passed as its input: the token is deleted, and an agent presenting it is no longer admitted. <p> An account revokes its own tokens; revoking another account's token is an administrative operation and needs the permission the administrative view is guarded with. </p>
