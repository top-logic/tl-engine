com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.max-results = Maximale Ergebnisse
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.max-results.tooltip = Standardmäßig maximale Anzahl der von webSearch zurückgegebenen Ergebnisse.
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.search-engine = Suchmaschine
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.search-engine.tooltip = Die Suchmaschine, die webSearch unterstützt. Wenn nicht festgelegt, ist die Websuche nicht verfügbar.
com.top_logic.tl.ai.core.tools.web.WebToolsService.tooltip = Konfiguration für die Web-Tools (Web-Suche, Web-Abruf): die wählbare Suchmaschine und die Abruf-Limits.
