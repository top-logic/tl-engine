tl.security.selfservice.mail.registration.body = <p>Guten Tag,</p>\n<p>um einen Zugang für die Anwendung {0} zu registrieren, geben Sie bitte den folgenden Bestätigungscode in der Anwendung ein:<br/>\n<b>Bestätigungscode:</b> {1}</p>\n<p>Dieser Bestätigungscode ist nur für begrenzte Zeit gültig.</p>\n<p>Falls Sie keine Registrierung angefordert haben, können Sie diese E-Mail einfach ignorieren. Es wird dann kein Zugang angelegt.</p>\n<p>Mit freundlichen Grüßen<br/>\nIhr {0}-Team</p>
