model.tl.util = Additional core types
model.tl.util.Any = Unspecified
model.tl.util.Any.tooltip = Placeholder for a value whose type is not specified further. The type is used where the concrete type of a value is only known at runtime.
model.tl.util.Color = Color
model.tl.util.Color.tooltip = A color that is selected with a color picker and stored in hexadecimal notation.
model.tl.util.Country = Country
model.tl.util.Country.tooltip = A country from the list of countries known to the system. The value is stored as a country code and displayed in the language of the user.
model.tl.util.IconResource = Display value (only icon)
model.tl.util.IconResource.tooltip = Like the type "Display value", but only the icon is displayed. The label of the value is used as its tooltip.
model.tl.util.JSON = JSON
model.tl.util.JSON.tooltip = A structured value such as an object, a list, a number or a text. The value is stored in JSON notation.
model.tl.util.Language = Language
model.tl.util.Language.tooltip = A language from the list of languages known to the system. The value is stored as a language code and displayed in the language of the user.
model.tl.util.Resource = Display value
model.tl.util.Resource.tooltip = A display value that combines a label, an icon, a tooltip and an optional link. The type is used to display a value that is not itself a business object.
model.tl.util.TimeZone = Time zone
model.tl.util.TimeZone.tooltip = A time zone from the list of time zones known to the system.
model.tl.util.URL = URL
model.tl.util.URL.tooltip = A web address. The value is displayed as a link that can be opened directly.
model.tl.util.tooltip = Module with additional data types that are not among the technical core types, e.g. colors, languages, countries and structured values.
