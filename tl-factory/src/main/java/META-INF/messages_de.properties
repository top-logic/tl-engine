com.top_logic.factory.project.FactoryFunctions.checkGroupId = Group-ID prüfen
com.top_logic.factory.project.FactoryFunctions.checkGroupId.param.value.tooltip = Die Group-ID.
com.top_logic.factory.project.FactoryFunctions.checkGroupId.return = Die Meldung, was an dem Wert falsch ist, nichts, wenn er gültig ist.
com.top_logic.factory.project.FactoryFunctions.checkGroupId.tooltip = Prüft die Maven-Group-ID einer Anwendung.
com.top_logic.factory.project.FactoryFunctions.cleanup = Workspace eines Projekts entfernen
com.top_logic.factory.project.FactoryFunctions.cleanup.param.project.tooltip = Ein Projekt, auf dessen Workspace gerade keine Operation läuft.
com.top_logic.factory.project.FactoryFunctions.cleanup.tooltip = Entfernt den Workspace eines Projekts mit seinem Container und allen seinen Daten. Das Projekt bleibt erhalten und kann danach einen neuen Workspace anlegen.
com.top_logic.factory.project.FactoryFunctions.createWorkspace = Workspace eines Projekts anlegen
com.top_logic.factory.project.FactoryFunctions.createWorkspace.param.project.tooltip = Ein Projekt ohne Workspace.
com.top_logic.factory.project.FactoryFunctions.createWorkspace.return = Der Workspace, im Zustand „wird gebaut“, bis die Anwendung antwortet.
com.top_logic.factory.project.FactoryFunctions.createWorkspace.tooltip = Legt den Workspace eines Projekts an: einen Container, in dem eine leere Anwendung erzeugt, gebaut und gestartet wird.
com.top_logic.factory.project.FactoryFunctions.engineVersion = Standard-Engine-Version
com.top_logic.factory.project.FactoryFunctions.engineVersion.return = Die konfigurierte Engine-Version.
com.top_logic.factory.project.FactoryFunctions.engineVersion.tooltip = Die TopLogic-Version, auf der ein neues Projekt seine Anwendung aufbaut, sofern es keine andere wählt.
com.top_logic.factory.project.FactoryFunctions.imageOutdated = Workspace-Image veraltet
com.top_logic.factory.project.FactoryFunctions.imageOutdated.param.workspace.tooltip = Der Workspace eines Projekts.
com.top_logic.factory.project.FactoryFunctions.imageOutdated.return = Ob der Workspace veraltet ist.
com.top_logic.factory.project.FactoryFunctions.imageOutdated.tooltip = Ob der Container eines Workspaces auf einem anderen als dem aktuellen Workspace-Image läuft, sodass ihm Änderungen an den Werkzeugen des Images fehlen, bis er aktualisiert wird.
com.top_logic.factory.project.FactoryFunctions.start = Workspace eines Projekts starten
com.top_logic.factory.project.FactoryFunctions.start.param.project.tooltip = Ein Projekt, dessen Workspace gestoppt ist.
com.top_logic.factory.project.FactoryFunctions.start.tooltip = Startet den Workspace eines Projekts und damit seine Anwendung.
com.top_logic.factory.project.FactoryFunctions.stop = Workspace eines Projekts stoppen
com.top_logic.factory.project.FactoryFunctions.stop.param.project.tooltip = Ein Projekt, dessen Workspace läuft.
com.top_logic.factory.project.FactoryFunctions.stop.tooltip = Stoppt den Workspace eines Projekts und damit seine Anwendung. Quellen, Maven-Repository und Datenbank des Workspaces bleiben erhalten.
com.top_logic.factory.project.FactoryFunctions.update = Workspace eines Projekts aktualisieren
com.top_logic.factory.project.FactoryFunctions.update.param.project.tooltip = Ein Projekt, auf dessen Workspace keine Operation läuft.
com.top_logic.factory.project.FactoryFunctions.update.tooltip = Legt den Container des Workspaces eines Projekts auf dem aktuellen Workspace-Image neu an. Quellen, Maven-Repository, Datenbank und initiales Passwort des Workspaces bleiben erhalten; ein laufender Workspace wird wieder gestartet.
com.top_logic.factory.project.ProjectWorkspaces = Projekt-Workspaces
com.top_logic.factory.project.ProjectWorkspaces.Config.log-flush-interval = Speicherintervall der Ausgabe
com.top_logic.factory.project.ProjectWorkspaces.Config.log-flush-interval.tooltip = Millisekunden zwischen zwei Commits der Ausgabe einer laufenden Operation.
com.top_logic.factory.project.ProjectWorkspaces.Config.max-log-size = Maximale Größe der Ausgabe
com.top_logic.factory.project.ProjectWorkspaces.Config.max-log-size.tooltip = Anzahl der Zeichen der Ausgabe einer Operation, die gespeichert werden; ältere Ausgaben werden verworfen.
com.top_logic.factory.project.ProjectWorkspaces.tooltip = Dienst, der die Operationen auf den Workspaces der Projekte im Hintergrund ausführt und die Workspace-Objekte dabei aktuell hält. <p> Anlegen, Starten, Stoppen und Entfernen eines Workspaces dauert Sekunden bis Minuten. Eine Operation wird daher aus einer Anfrage heraus gestartet, die nur den Zustand speichert, in dem die Operation ist (z. B. <i>„wird gebaut“</i>), und läuft auf einem Worker-Thread dieses Dienstes in einem Systemkontext. Die Ausgabe der Operation wird in einem <i>Workspace-Log</i> gesammelt, das sie in jedem Speicherintervall in einer eigenen Transaktion speichert; der Endzustand wird gespeichert, wenn die Operation endet. Eine Ansicht, die diesen Commits folgt, zeigt den Fortschritt, während die Operation läuft. </p> <p> Auf einem Workspace läuft immer nur eine Operation. Nach einem Neustart vergleicht der Dienst die gespeicherten Zustände mit den vorhandenen Containern (siehe <i>Workspace-Abgleich</i>). Auch das geschieht auf einem Worker-Thread, sodass die Anwendung auch dann startet, wenn die Container-Plattform nicht erreichbar ist. </p>
com.top_logic.factory.project.WorkspaceStatus = Workspace-Status
com.top_logic.factory.project.WorkspaceStatus.BUILDING = Wird gebaut
com.top_logic.factory.project.WorkspaceStatus.BUILDING.tooltip = Der Container wird angelegt, die Anwendung wird erzeugt und gebaut.
com.top_logic.factory.project.WorkspaceStatus.CREATED = Angelegt
com.top_logic.factory.project.WorkspaceStatus.CREATED.tooltip = Der Container existiert, wurde jedoch noch nie gestartet.
com.top_logic.factory.project.WorkspaceStatus.ERROR = Fehler
com.top_logic.factory.project.WorkspaceStatus.ERROR.tooltip = Die letzte Operation ist fehlgeschlagen oder der Container ist verloren gegangen; die Ausgabe nennt den Grund.
com.top_logic.factory.project.WorkspaceStatus.REMOVING = Wird aufgeräumt
com.top_logic.factory.project.WorkspaceStatus.REMOVING.tooltip = Der Container und die Volumes werden entfernt.
com.top_logic.factory.project.WorkspaceStatus.RUNNING = Läuft
com.top_logic.factory.project.WorkspaceStatus.RUNNING.tooltip = Die Anwendung läuft und antwortet unter dem Vorschau-Link.
com.top_logic.factory.project.WorkspaceStatus.STARTING = Wird gestartet
com.top_logic.factory.project.WorkspaceStatus.STARTING.tooltip = Die Anwendung startet; der Zustand wechselt zu <i>„läuft“</i>, sobald sie antwortet.
com.top_logic.factory.project.WorkspaceStatus.STOPPED = Gestoppt
com.top_logic.factory.project.WorkspaceStatus.STOPPED.tooltip = Der Container ist angehalten, seine Volumes bleiben erhalten.
com.top_logic.factory.project.WorkspaceStatus.STOPPING = Wird gestoppt
com.top_logic.factory.project.WorkspaceStatus.STOPPING.tooltip = Der Container wird angehalten.
com.top_logic.factory.project.WorkspaceStatus.UNKNOWN = Unbekannt
com.top_logic.factory.project.WorkspaceStatus.UNKNOWN.tooltip = Die Container-Plattform hat den Zustand nicht mitgeteilt, z. B. weil sie nicht erreichbar war.
com.top_logic.factory.project.WorkspaceStatus.UPDATING = Wird aktualisiert
com.top_logic.factory.project.WorkspaceStatus.UPDATING.tooltip = Der Container wird auf dem aktuellen Workspace-Image neu angelegt, seine Volumes bleiben erhalten.
com.top_logic.factory.project.WorkspaceStatus.tooltip = Der gespeicherte Zustand des Workspaces eines Projekts, das Java-Gegenstück der Klassifikatoren der Aufzählung <code>"WorkspaceStatus"</code>. <p> Neben den Zuständen des Containers, die ein <i>Workspace-Provider</i> meldet (siehe <i>Workspace-Zustand</i>), ist ein Workspace in einem beschäftigten Zustand, solange eine Operation auf ihm läuft, und im Zustand <i>„Fehler“</i>, nachdem eine Operation fehlgeschlagen ist. </p>
com.top_logic.factory.workspace.WorkspaceService = Workspace-Dienst
com.top_logic.factory.workspace.WorkspaceService.Config.applications = Anwendungs-Workspaces
com.top_logic.factory.workspace.WorkspaceService.Config.applications.tooltip = Wie Workspaces eingerichtet werden, die eine TopLogic-Anwendung enthalten.
com.top_logic.factory.workspace.WorkspaceService.Config.provider = Anbieter
com.top_logic.factory.workspace.WorkspaceService.Config.provider.tooltip = Die Container-Plattform, in der die Workspaces angelegt werden.
com.top_logic.factory.workspace.WorkspaceService.tooltip = Dienst, der den <i>Workspace-Anbieter</i> hält, der die Workspaces der Anwendung verwaltet. <p> Beim Start des Dienstes wird die Container-Plattform nicht kontaktiert, sodass die Anwendung auch dann startet, wenn die Plattform nicht erreichbar ist; das meldet erst die erste Workspace-Operation. </p>
com.top_logic.factory.workspace.WorkspaceState = Workspace-Zustand
com.top_logic.factory.workspace.WorkspaceState.CREATED = Angelegt
com.top_logic.factory.workspace.WorkspaceState.CREATED.tooltip = Der Container existiert, wurde aber noch nie gestartet.
com.top_logic.factory.workspace.WorkspaceState.MISSING = Fehlt
com.top_logic.factory.workspace.WorkspaceState.MISSING.tooltip = Der Workspace hat keinen Container. Volumes des Workspaces können noch vorhanden sein.
com.top_logic.factory.workspace.WorkspaceState.RUNNING = Läuft
com.top_logic.factory.workspace.WorkspaceState.RUNNING.tooltip = Der Container läuft.
com.top_logic.factory.workspace.WorkspaceState.STOPPED = Gestoppt
com.top_logic.factory.workspace.WorkspaceState.STOPPED.tooltip = Der Container wurde schon einmal gestartet und läuft gerade nicht. Seine Volumes bleiben erhalten.
com.top_logic.factory.workspace.WorkspaceState.UNKNOWN = Unbekannt
com.top_logic.factory.workspace.WorkspaceState.UNKNOWN.tooltip = Der Container ist in einem Zustand, den der Anbieter nicht verwaltet, z. B. pausiert, wird entfernt oder abgestürzt.
com.top_logic.factory.workspace.WorkspaceState.tooltip = Der Zustand des Containers eines Workspaces, wie ihn ein <i>Workspace-Anbieter</i> meldet.
com.top_logic.factory.workspace.app.ApplicationWorkspaces$Config = Anwendungs-Workspaces
com.top_logic.factory.workspace.app.ApplicationWorkspaces$Config.tooltip = Konfiguration der <i>Anwendungs-Workspaces</i>.
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.build-timeout = Build-Timeout
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.build-timeout.tooltip = Sekunden, die ein Maven-Lauf dauern darf: das Erzeugen einer Anwendung, ihr Build, das Befüllen eines Release-Repositorys. <p> Ein Lauf, der länger dauert, wird abgebrochen und lässt die Operation fehlschlagen. </p>
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.engine-version = Engine-Version
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.engine-version.tooltip = Die TopLogic-Version, auf der eine Anwendung aufgebaut wird, die keine eigene Version wählt.
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.image-repository = Image-Name
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.image-repository.tooltip = Name des Workspace-Images ohne Tag. <p> Das Tag ist der Inhalts-Hash der Dateien, aus denen das Image erstellt wurde. </p>
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.repository-url = URL des Repositorys
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.repository-url.tooltip = URL des Maven-Repositorys, aus dem die TopLogic-Versionen bezogen werden.
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.start-timeout = Start-Timeout
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.start-timeout.tooltip = Sekunden, die auf die Antwort einer gestarteten Anwendung gewartet wird.
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider = Docker-Workspace-Anbieter
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.connect-timeout = Verbindungs-Timeout
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.connect-timeout.tooltip = Timeout in Sekunden für den Aufbau einer Verbindung zum Daemon.
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.docker-host = Docker-Host
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.docker-host.tooltip = Die URI des Docker-Daemons. <p> Entweder der Socket eines lokalen Daemons, z. B. unix:///var/run/docker.sock, oder die Adresse eines entfernten Daemons oder eines Socket-Proxys, z. B. tcp://docker-proxy:2375. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.extra-hosts = Zusätzliche Hosts
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.extra-hosts.tooltip = Einträge, die zu den Host-Namen hinzugefügt werden, die ein Workspace-Container auflöst, jeder ein Host-Name und eine Adresse, getrennt durch einen Doppelpunkt. <p> Die Adresse host-gateway steht für die Adresse des Daemon-Hosts, wie die Container sie sehen: host.docker.internal:host-gateway lässt einen Workspace einen Dienst auf dem Daemon-Host, z. B. eine dort direkt laufende Anwendung, unter dem Namen host.docker.internal erreichen. Die Einträge gelten für Container, die danach angelegt werden. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.host-port-max = Höchster Host-Port
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.host-port-max.tooltip = Der höchste Port des Daemon-Hosts, auf dem ein Workspace-Port veröffentlicht wird.
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.host-port-min = Niedrigster Host-Port
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.host-port-min.tooltip = Der niedrigste Port des Daemon-Hosts, auf dem ein Workspace-Port veröffentlicht wird.
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.label-namespace = Label-Namensraum
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.label-namespace.tooltip = Präfix der Schlüssel der Labels, an denen der Anbieter seine Objekte erkennt. <p> Zwei Anwendungen, die denselben Daemon nutzen, müssen verschiedene Namensräume verwenden, sonst hält jede die Workspaces der anderen für ihre eigenen. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.name-prefix = Namenspräfix
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.name-prefix.tooltip = Präfix der Namen der Container und Volumes, die der Anbieter anlegt. <p> Der Name eines Containers ist das Präfix gefolgt von der Workspace-Kennung, der Name eines Volumes zusätzlich gefolgt vom Volume-Namen. Namen müssen nur eindeutig sein, der Anbieter erkennt ein Objekt nie an seinem Namen. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.network = Netzwerk
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.network.tooltip = Name des Docker-Netzwerks, dem die Workspace-Container beitreten. <p> Existiert das Netzwerk nicht, wird es angelegt. Eine Anwendung, die selbst in einem Container desselben Daemons läuft, muss mit diesem Netzwerk verbunden sein, um die Workspaces über den Container-Namen zu erreichen. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.public-host = Öffentlicher Host
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.public-host.tooltip = Host-Name des Daemon-Hosts, unter dem ein Browser die veröffentlichten Ports erreicht. <p> Die Vorschau-URL eines Workspaces wird aus diesem Namen und dem Host-Port gebildet. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.stop-timeout = Stopp-Timeout
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.stop-timeout.tooltip = Sekunden, die ein Container beim Stoppen zum Herunterfahren bekommt, bevor er beendet wird.
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.terminate-timeout = Abbruch-Timeout
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.terminate-timeout.tooltip = Sekunden, die ein in einem Workspace laufender Befehl beim Abbrechen bekommt, um sich zu beenden, bevor er hart beendet wird.
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.tls-cert-path = TLS-Zertifikatsverzeichnis
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.tls-cert-path.tooltip = Verzeichnis mit dem Client-Zertifikat (cert.pem, key.pem) und dem CA-Zertifikat (ca.pem) für eine TLS-Verbindung zu einem tcp://-Daemon. <p> Ist es nicht gesetzt, ist die Verbindung unverschlüsselt. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.tooltip = <i>Workspace-Anbieter</i>, der jeden Workspace in einem Container eines Docker-Daemons ausführt, angesprochen über die Docker-Engine-API. <p> Der Daemon wird über <i>Docker-Host</i> adressiert, sodass die Anwendung auf dem Daemon-Host selbst, in einem Container dieses Daemons (mit Zugriff auf dessen Socket oder einen Socket-Proxy) oder an beliebiger anderer Stelle (mit einem entfernten Daemon) laufen kann. Deshalb legt der Anbieter nur benannte Volumes an und bindet nie einen Pfad ein: Ein Host-Pfad würde auf dem Daemon-Host aufgelöst, nicht dort, wo die Anwendung läuft. </p> <p> Alles, was der Anbieter anlegt, trägt Labels im Label-Namensraum: Container und Volumes das Label <code>"workspace"</code> mit der Workspace-Kennung, gemeinsame Volumes das Label <code>"shared"</code> mit ihrem logischen Namen, gebaute Images das Label <code>"image"</code> mit ihrem Repository, das Netzwerk das Label <code>"network"</code>. Der Anbieter findet seine Objekte nur über diese Labels, nie über ihren Namen. </p> <p> Alle Workspace-Container treten dem Netzwerk <i>Netzwerk</i> bei, das angelegt wird, falls es nicht existiert. Der Container-Port eines Workspaces wird auf einem Port im Bereich von <i>Niedrigster Host-Port</i> bis <i>Höchster Host-Port</i> veröffentlicht, den der Daemon bei jedem Start neu unter den zu diesem Zeitpunkt freien Ports des Bereichs wählt. </p> <p> Die zusätzlichen Hosts werden zu den Host-Namen hinzugefügt, die ein Workspace-Container auflöst, z. B. um die Anwendung auf dem Daemon-Host über das Gateway des Daemons zu erreichen. </p> <p> Ein Befehl, der in einem Workspace läuft, braucht ein sh mit kill im Image: Der Befehl läuft unter einem Shell-Skript, das seine Prozess-ID meldet, und beim Abbrechen werden seiner Prozessgruppe mit kill Signale gesendet. </p>
