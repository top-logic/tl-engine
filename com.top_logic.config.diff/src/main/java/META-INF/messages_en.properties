com.top_logic.config.diff.google.diff_match_patch$Operation = Operation
com.top_logic.config.diff.google.diff_match_patch$Operation.tooltip = The data structure representing a diff is a Linked list of Diff objects: {Diff(Operation.DELETE, "Hello"), Diff(Operation.INSERT, "Goodbye"), Diff(Operation.EQUAL, " world.")} which means: delete "Hello", add "Goodbye" and keep " world."
com.top_logic.config.diff.google.diff_match_patch.Operation.DELETE = Delete
com.top_logic.config.diff.google.diff_match_patch.Operation.DELETE.tooltip = The text is only contained in the first text.
com.top_logic.config.diff.google.diff_match_patch.Operation.EQUAL = Equal
com.top_logic.config.diff.google.diff_match_patch.Operation.EQUAL.tooltip = The text is contained in both texts.
com.top_logic.config.diff.google.diff_match_patch.Operation.INSERT = Insert
com.top_logic.config.diff.google.diff_match_patch.Operation.INSERT.tooltip = The text is only contained in the second text.
com.top_logic.config.diff.zip.ZipReader$EntryResult$State = State
com.top_logic.config.diff.zip.ZipReader$EntryResult$State.tooltip = The comparison state of an entry.
com.top_logic.config.diff.zip.ZipReader.EntryResult.State.CHANGE = Change
com.top_logic.config.diff.zip.ZipReader.EntryResult.State.CHANGE.tooltip = The entry exists in both archives with different contents.
com.top_logic.config.diff.zip.ZipReader.EntryResult.State.DELETED = Deleted
com.top_logic.config.diff.zip.ZipReader.EntryResult.State.DELETED.tooltip = The entry only exists in the source archive.
com.top_logic.config.diff.zip.ZipReader.EntryResult.State.NEW = New
com.top_logic.config.diff.zip.ZipReader.EntryResult.State.NEW.tooltip = The entry only exists in the destination archive.
com.top_logic.config.diff.zip.ZipReader.EntryResult.State.NO_CHANGE = No change
com.top_logic.config.diff.zip.ZipReader.EntryResult.State.NO_CHANGE.tooltip = The entry is equal in both archives.
