model.tl.accounts.Person.passkeys = Passkeys
model.tl.accounts.Person.passkeys.tooltip = The passkeys registered for this account. A passkey logs the account in without a password, or confirms a login with password as second factor.
model.tl.security.passkey = Passkeys
model.tl.security.passkey.Passkey = Passkey
model.tl.security.passkey.Passkey.backedUp = Backed up
model.tl.security.passkey.Passkey.backedUp.tooltip = Whether the passkey is currently synchronized to further devices of its owner, e.g. through a password manager.
model.tl.security.passkey.Passkey.backupEligible = Synchronizable
model.tl.security.passkey.Passkey.backupEligible.tooltip = Whether the authenticator may synchronize the passkey to further devices of its owner.
model.tl.security.passkey.Passkey.createdAt = Created
model.tl.security.passkey.Passkey.createdAt.tooltip = When the passkey was registered.
model.tl.security.passkey.Passkey.credentialId = Credential ID
model.tl.security.passkey.Passkey.credentialId.tooltip = The ID the authenticator identifies the passkey with, base64url-encoded.
model.tl.security.passkey.Passkey.label = Name
model.tl.security.passkey.Passkey.label.tooltip = The name the owner gave the passkey, e.g. the device it lives on.
model.tl.security.passkey.Passkey.lastUsed = Last used
model.tl.security.passkey.Passkey.lastUsed.tooltip = When the passkey was last used for a login.
model.tl.security.passkey.Passkey.publicKey = Public key
model.tl.security.passkey.Passkey.publicKey.tooltip = The public key of the passkey in COSE format, base64url-encoded. A login is verified with it.
model.tl.security.passkey.Passkey.signatureCount = Signature counter
model.tl.security.passkey.Passkey.signatureCount.tooltip = The signature counter the authenticator reported at the last login. A counter that does not increase indicates a cloned authenticator.
model.tl.security.passkey.Passkey.tooltip = A passkey (WebAuthn credential) of an account.
model.tl.security.passkey.Passkey.transports = Transports
model.tl.security.passkey.Passkey.transports.tooltip = How the browser reaches the authenticator, e.g. "internal" for the device itself or "hybrid" for a phone.
model.tl.security.passkey.tooltip = Module with the type for the passkeys of the accounts.
