com.top_logic.layout.view.selfservice.AcceptInvitationAction = Aktion „Einladung annehmen“
com.top_logic.layout.view.selfservice.AcceptInvitationAction.tooltip = <i>View-Aktion</i> des Kontodialogs einer Einladung: Sie legt das Konto an und meldet den neuen Benutzer an. <p> Die Eingabe ist das <code>"tl.login:AccountCreation"</code>, das der Dialog bearbeitet; die Einladung kommt aus dem Kanal <code>"invitation"</code>. Eine Ablehnung - fehlender Nachname, Passwörter, die voneinander abweichen oder gegen die Passwortregeln verstoßen, eine Einladung, die nicht mehr offen ist, der Rückruf der Einladung - wird gemeldet, und der Dialog bleibt offen. </p> <p> Das neue Konto durchläuft danach die <i>Anmeldeschritte</i> der React-Anmeldung in einem <i>Anmeldeablauf</i>, genau wie nach einer Anmeldung mit Passwort, richtet also z. B. einen zweiten Faktor ein, wenn die Einladung das verlangt. Nach dem letzten Schritt lädt das Fenster die Wurzel der View-Anwendung (<code>"/view/"</code>) und nicht erneut die Einladungsseite. </p>
com.top_logic.layout.view.selfservice.ApplyPasswordResetAction = Passwort zurücksetzen
com.top_logic.layout.view.selfservice.ApplyPasswordResetAction.tooltip = <i>Aktion anzeigen</i>, die die Selbstbedienungs-Passwortzurücksetzung abschließt: Dabei wird der im Zurücksetzungsdialog eingegebene Code mit dem bei <i>der Passwortzurücksetzungsanforderung</i> generierten <i>Code</i> (innerhalb dessen Gültigkeitsdauer) abgeglichen und anschließend das neue Passwort für das Konto übernommen. <p> Bei Erfolg wird der Dialog geschlossen und der Benutzer wird darüber informiert, dass er sich mit dem neuen Passwort anmelden kann – die Zurücksetzung führt <em>nicht</em> zur Anmeldung des Benutzers (im Gegensatz zu den regulären Folgeschritten der Anmeldung). </p>
com.top_logic.layout.view.selfservice.CheckInvitationCodeAction = Aktion „Einladungscode prüfen“
com.top_logic.layout.view.selfservice.CheckInvitationCodeAction.tooltip = <i>View-Aktion</i> des Code-Dialogs einer Einladung: Sie prüft den eingegebenen Code gegen den <i>Bestätigungscode</i>, den die <i>Aktion „Einladungscode anfordern“</i> per E-Mail verschickt hat, und ersetzt den Dialog durch den Dialog, der das Konto anlegt. <p> Der Kontodialog bearbeitet ein transientes <code>"tl.login:AccountCreation"</code>, dessen Benutzername die E-Mail-Adresse der Einladung ist. Er erhält die Einladung auf dem Kanal <code>"invitation"</code> und auf dem Kanal <code>"passwords"</code>, ob die Person ein Passwort wählt. </p>
com.top_logic.layout.view.selfservice.RequestInvitationCodeAction = Aktion „Einladungscode anfordern“
com.top_logic.layout.view.selfservice.RequestInvitationCodeAction.tooltip = <i>View-Aktion</i>, die die Annahme einer <i>Einladung</i> beginnt: Sie schickt einen <i>Bestätigungscode</i> an die Adresse der Einladung und öffnet den Dialog, in dem die eingeladene Person ihn eingibt. <p> Die Aktion verarbeitet das Token des Einladungslinks (siehe <code>"invitation"</code>) oder die Einladung selbst; ohne beides nimmt sie die Einladung aus dem Kanal <code>"invitation"</code> ihrer View, schickt also aus dem Code-Dialog einen neuen Code. Eine Einladung, die nicht offen ist, lehnt sie mit dem Grund ab, ebenso eine Anforderung, die zu kurz auf die vorige für dieselbe Einladung folgt. Ohne konfigurierten Mailserver wird die Anforderung abgelehnt, und es öffnet sich kein Dialog: Der Code wird ausschließlich per E-Mail verschickt. </p> <p> Der Dialog erhält die Einladung auf dem Kanal <code>"invitation"</code> und den Code auf dem Kanal <code>"verification"</code>; beide bleiben auf dem Server. Ein bereits geöffneter oberster Dialog, z. B. der Code-Dialog, aus dem ein neuer Code angefordert wird, wird ersetzt. </p>
com.top_logic.layout.view.selfservice.RequestPasswordResetAction = Passwort zurücksetzen
com.top_logic.layout.view.selfservice.RequestPasswordResetAction.tooltip = <i>Aktion anzeigen</i>, die die Selbstbedienungs-Passwortzurücksetzung startet: Sie generiert einen Bestätigungscode, sendet diesen per E-Mail an das identifizierte Konto und öffnet den Dialog zur Passwortzurücksetzung (wobei das Konto, der erwartete Code und dessen Erstellungszeit in den Dialogkanälen mitgeführt werden). <p> Um nicht preiszugeben, ob ein Benutzername existiert, ist das Verhalten unabhängig davon, ob das Konto gefunden wurde, identisch: Es wird immer ein Code generiert und der Dialog zum Zurücksetzen wird immer geöffnet; die E-Mail wird nur gesendet, wenn ein passendes, passwortänderbares Konto mit einer E-Mail-Adresse existiert. </p>
