com.top_logic.tl.ai.index.onnx.OnnxEmbedder.Config.rows-per-inference.tooltip = Texts in one inference at most. <p> A dynamically quantized (int8) model scales its activations over the whole batch, so with more than one text a vector depends on its neighbours: for arctic-embed-m-v2.0 int8 the cosine between a text's vector alone and in a batch was 0.976 to 0.985, for multilingual-e5-small int8 0.997. One text per inference cost arctic 11 % of its throughput and e5-small 40 % on a laptop CPU. Raise it for a model without dynamic quantization, or for e5-small when throughput matters more than reproducible vectors. </p>
