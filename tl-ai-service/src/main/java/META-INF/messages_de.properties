com.top_logic.ai.service.providers.AnthropicChatModelFactory.Config.api-key.tooltip = Der Anthropic-API-Schlï¿½ssel fï¿½r die Authentifizierung.
com.top_logic.ai.service.providers.AnthropicChatModelFactory.Config.base-url = Basis-URL
com.top_logic.ai.service.providers.AnthropicChatModelFactory.Config.base-url.tooltip = Die Basis-URL fï¿½r die Anthropic-API. <p> Standard: https://api.anthropic.com/v1 </p>
com.top_logic.ai.service.providers.AnthropicChatModelFactory.Config.version = Version
com.top_logic.ai.service.providers.AnthropicChatModelFactory.Config.version.tooltip = Die zu verwendende API-Version. <p> Optional. Anthropic verwendet versionierte APIs. Wenn nicht angegeben, wird der Standardwert von <i>LangChain4j</i> verwendet. </p>
com.top_logic.ai.service.providers.AnthropicChatModelFactory.tooltip = Fabrik zur Erstellung von Anthropic-Chatmodell-Instanzen. <p> Diese Fabrik erstellt <i>Chatmodell-Instanzen</i> unter Verwendung der Anthropic-API fï¿½r Claude-Modelle. </p>
com.top_logic.ai.service.providers.MistralChatModelFactory = Mistral Chat Modellfabrik
