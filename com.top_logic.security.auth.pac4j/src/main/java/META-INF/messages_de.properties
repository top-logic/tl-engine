com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.scope.tooltip = Die beim Identitätsanbieter angeforderten Scopes, getrennt durch Leerzeichen oder Kommas. <p> Wenn nicht festgelegt oder leer, fordert pac4j seine Standard-Scopes an. </p>
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.secret = Geheimnis
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.secret.tooltip = Das Client-Geheimnis zur Authentifizierung dieser Anwendung beim Identitätsanbieter. <p> Empfohlen wird ein Verweis auf das Geheimnis über seinen Namen, damit das Geheimnis nicht Teil der Konfiguration ist, z. B. <code>&lt;secret name="OIDC_CLIENT_SECRET"/&gt;</code>; die Standard-Geheimnisablage liest es aus der gleichnamigen Umgebungsvariable, die das unverschlüsselte Geheimnis enthält. Ein Attributwert ist entweder ein verschlüsseltes Geheimnis oder ein unverschlüsseltes Geheimnis mit dem Präfix <code>unencrypted:</code>. </p> <p> Das Geheimnis wird nicht beim Start gelesen, sodass die Anwendung auch ohne es startet. Es wird gelesen, wenn eine Anmeldung mit diesem Client beginnt, und vor jeder Token-Anfrage, sodass ein geändertes Geheimnis ohne Neustart verwendet wird. Solange das Geheimnis fehlt, bietet die Anmeldeseite diesen Client nicht an. </p>
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.state-generator = Zustandsgenerator
