com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.tools.tooltip = Qualifizierte Tool-Namen, die für diesen Agenten verfügbar sind. <p> Pro Eintrag verschlüsselte Liste: Anwendungs-Overlays können einzelne Tools hinzufügen oder entfernen, ohne die vollständige Plattformliste neu zu erstellen. Siehe <i>Namensreferenz</i>. </p>
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.Config.agents = Agenten
