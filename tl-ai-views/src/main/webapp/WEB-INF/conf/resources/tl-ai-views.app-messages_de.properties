admin.ai.tool.view-window.whereAmI = Liest die Seite, die der Benutzer geöffnet hat: ihre Teile, verschachtelt, mit der Ansicht, aus der jeder stammt.
admin.ai.tool.views.deleteView = Löscht eine Ansichtsdatei dieser Anwendung; die Änderung lässt sich rückgängig machen.
admin.ai.tool.views.editView = Ändert einzelne Elemente einer Ansicht und erhält Kommentare und Formatierung; die Änderung lässt sich rückgängig machen.
admin.ai.tool.views.listViews = Listet die Ansichtsdateien dieser Anwendung auf.
admin.ai.tool.views.readView = Liest eine Ansicht: die Gliederung ihrer Elemente und ihr XML.
admin.ai.tool.views.revertViewChange = Macht eine Ansichtsänderung rückgängig: Jede geänderte Ansicht erhält ihren früheren Text zurück, eine angelegte Ansicht wird gelöscht.
admin.ai.tool.views.viewElements = Listet die Tags auf, die eine Ansicht dieser Anwendung verwenden kann, oder die Eigenschaften und ein Beispiel eines Tags.
admin.ai.tool.views.writeView = Legt eine Ansicht aus XML an oder ersetzt eine, nachdem sie geprüft wurde; die Änderung lässt sich rückgängig machen.
