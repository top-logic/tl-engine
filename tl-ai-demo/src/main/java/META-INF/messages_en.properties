com.top_logic.ai.demo.secdemo.SecDemoSetupService = Security demo setup service
com.top_logic.ai.demo.secdemo.SecDemoSetupService$PersonaConfig = Persona configuration
com.top_logic.ai.demo.secdemo.SecDemoSetupService$PersonaConfig.tooltip = One persona of the test bed: an account, the group it joins, and the role that group carries.
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.component-access = Component access
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.component-access.tooltip = The views (layout components) the persona roles may open, in the format of the engine's WEB-INF/conf/security.xml. <p> Model access rights alone do not make an application usable: a role that may read a type still sees no tab until it holds a command group on the enclosing <i>compound security layout</i>. This is where the persona roles get that. </p> <p> A profile named "*" is applied to the role of every configured persona. That is how the test bed states that all personas see the same UI: the only thing distinguishing two of them is then the policy, never what they can reach, which is what makes an allow/deny pair on one prompt comparable. A profile named after a single role still works, for a persona that deliberately needs different views. </p> <p> In contrast to the engine's import, the entries here are applied <em>additively</em>: no access outside this configuration is touched, so the shipped demo is unaffected while the aspect is switched off. </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.initial-password = Initial password
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.initial-password.tooltip = Password given to the persona accounts when they are created. <p> Must satisfy the password policy of the configured authentication device (by default: at least 8 characters from at least two character classes). </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.personas = Personas
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.personas.tooltip = The accounts to seed, indexed by login. <p> One entry per persona of the test bed. Kept in configuration rather than in code so that the matrix a tester has to hold in their head - which login holds which role, and what each one demonstrates - is readable in one place, next to the <tool-access> policy and the <security-config> that give those roles their meaning. </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.group = Group
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.group.tooltip = Name of the group this account joins. <p> Must be declared on <i>initial groups</i> in the same aspect. </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.login = Login name
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.login.tooltip = Login name of the account to create.
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.purpose = Purpose
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.purpose.tooltip = One line saying what this persona is in the fixture to demonstrate. <p> Logged at boot, so the boot log doubles as an index of the test bed. </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.role = Role
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.role.tooltip = Name of the role the group is granted on the security root. <p> Must be declared on <i>initial roles</i> in the same aspect. This is the name the <security-config> and the <tool-access> policy are written against. </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.tooltip = Seeds the fixtures of the agent security test bed: one account per persona, its group membership, the role that group carries on the security root, the component (layout) access every persona needs to reach the agent chat, and a handful of example instances. <p> The service is only started when the opt-in aspect WEB-INF/conf/secdemo.config.xml is listed in WEB-INF/conf/metaConf.txt. All steps are idempotent, so restarting the application does not duplicate anything. </p> <p> The roles themselves are created by <i>initial roles</i>, the groups by <i>initial groups</i>; both are configured in the same aspect. What is left - assigning a role to a group <em>on the security root</em> and creating accounts - has no declarative counterpart in the engine, hence this service. It reads which accounts to create from <i>Personas</i>, so the whole persona matrix lives in the aspect file rather than half of it here. </p> <p> The same is true for component access. The engine's <i>access configuration setup</i> reads it declaratively, but only from one fixed path, and its import <em>resets</em> the access of every view in the application before applying that file. An opt-in aspect must not do either, so this service applies the very same <i>access configuration</i> format additively. </p>
