class.com.top_logic.ai.chat.sched.I18NConstants.RUN_SKIPPED_SESSION_BUSY.help = Der Lauf wurde nicht gestartet, da die Chat-Sitzung, die dafür verwendet worden wäre, gerade belegt ist.
class.com.top_logic.ai.chat.sched.I18NConstants.RUN_SKIPPED_STILL_RUNNING = Der vorherige Lauf dieser Aufgabe arbeitet noch; dieser Lauf wurde übersprungen.
