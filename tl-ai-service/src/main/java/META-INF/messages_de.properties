com.top_logic.ai.service.agents.ThinkingType.ENABLED.tooltip = Das Modell verwendet immer das erweiterte Denken. Erfordert das Setzen von <i>Denk-Budget-Token</i><i>(Agenten-Konfiguration</i>).
com.top_logic.ai.service.agents.ThinkingType.tooltip = Erweiterte Denkweisen werden von LLM-Anbietern unterstï¿½tzt (derzeit Anthropic).
com.top_logic.ai.service.agents.background.BackgroundConfig = Hintergrund-Konfiguration
