model.Contacts.PersonContact.tooltip = Der konkrete Typ eines Personenkontakts. Jeder gespeicherte Personenkontakt ist ein Objekt dieses Typs, und ihm kann ein Zugang zugeordnet werden.
model.Contacts.tooltip = Modul mit den Typen für die Kontaktdaten von Unternehmen und Personen.
