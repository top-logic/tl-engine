com.top_logic.layout.view.ContainerElement = Container element
com.top_logic.layout.view.ContainerElement.Config.children = Children
com.top_logic.layout.view.ContainerElement.Config.children.tooltip = The child elements. <p> Children are normally written directly using their own element tags (e.g. <card>, <table>). The explicit <child class="..."/> entry tag additionally allows referencing an element implementation that has no own tag name. </p>
com.top_logic.layout.view.ContainerElement.tooltip = Base class for UIElements that hold a list of child elements.
com.top_logic.layout.view.ReferenceElement = Reference element
com.top_logic.layout.view.ReferenceElement.Config.bindings = Bindings
com.top_logic.layout.view.ReferenceElement.Config.bindings.tooltip = Channel bindings from the parent scope to the referenced view's channels. <p> Each binding maps a channel declared in the referenced view to a channel in the parent's scope. At runtime, the parent's channel instance is registered directly in the child's context - both sides share the same object. </p>
com.top_logic.layout.view.ReferenceElement.Config.view = View
com.top_logic.layout.view.ReferenceElement.Config.view.tooltip = Path to the referenced .view.xml file, relative to /WEB-INF/views/.
com.top_logic.layout.view.ReferenceElement.tooltip = A <i>UI element</i> that embeds another view as an isolated component. <p> Each <view-ref> creates an independent instance of the referenced view with its own <i>view context</i> and channel namespace. Communication across the boundary is established via explicit <bind> elements that share the parent's channel instance with the child. </p> <p> The referenced view is loaded lazily at control creation time, not at config parse time. This naturally supports multiple instances and recursive usage. </p>
com.top_logic.layout.view.UIElement.Config.css-class = Css class
com.top_logic.layout.view.UIElement.Config.css-class.tooltip = CSS class the element is displayed with, beside the classes its kind brings itself. <p> The class is written on the element the display of this element is rooted in, so that a stylesheet of the application styles this one element - a card, a picture, a piece of text - without touching every element of its kind. </p> <p> Several classes are written separated by spaces, as in HTML. </p>
com.top_logic.layout.view.UIElement.Config.personalization-key = Personalization key
com.top_logic.layout.view.UIElement.Config.personalization-key.tooltip = Optional override for the auto-derived personalization key. <p> If set, stateful elements use this key instead of the auto-derived path from the view context. </p>
com.top_logic.layout.view.ViewConfig = View configuration
com.top_logic.layout.view.ViewConfig$EntryPoint = Entry point
com.top_logic.layout.view.ViewConfig$EntryPoint.tooltip = A view that a URL may name as the contents of a browser tab.
com.top_logic.layout.view.ViewConfig.EntryPoint.anonymous = Anonymous
com.top_logic.layout.view.ViewConfig.EntryPoint.anonymous.tooltip = Whether the view is shown to a session that belongs to no account as well. <p> An application with a login view shows that view to every anonymous session in place of whatever the URL names; an entry point marked here is the exception - a URL naming it shows it, e.g. a page that explains something to a visitor before they can log in. </p> <p> An application without a login view shows a visitor what the URL names anyway, so the setting says nothing there. </p>
com.top_logic.layout.view.ViewConfig.EntryPoint.view = View
com.top_logic.layout.view.ViewConfig.EntryPoint.view.tooltip = The view file, relative to /WEB-INF/views/ in the webapp, e.g. demo/pdf-demo.view.xml.
com.top_logic.layout.view.ViewConfig.default-view = Default view
com.top_logic.layout.view.ViewConfig.default-view.tooltip = The name of the default view file loaded when the <i>view servlet</i> is accessed without a path (e.g. /view/). <p> The file is resolved relative to /WEB-INF/views/ in the webapp. </p> <p> The default view is an entry point of the application, so it needs no entry in <i>Entry points</i>. </p>
com.top_logic.layout.view.ViewConfig.entry-points = Entry points
com.top_logic.layout.view.ViewConfig.entry-points.tooltip = The views that a URL may name as the contents of a browser tab, besides the <i>Default view</i>. <p> A view file is only part of the application's surface where it is listed here: a URL naming any other view is answered with "not found". Most view files are fragments of a display - a dialog, a menu, a page of a tab - which the enclosing view supplies with the channels they read, and which alone in a browser tab show nothing or fail. An entry point is a view that stands on its own. </p> <p> Keyed by <i>View</i> (<i>view configuration entry point</i>) so that the registrations of several modules merge into one list. </p>
com.top_logic.layout.view.ViewConfig.login-view = Login view
com.top_logic.layout.view.ViewConfig.login-view.tooltip = The view rendered for a session that belongs to no account, in place of whatever the URL names. <p> Every visitor reaches the application under an anonymous session. An application that has nothing to show a visitor names a login view here: a visitor then sees that view and nothing else, whether the URL names a route, the <i>Default view</i> or one of the <i>Entry points</i>. The requested URL is kept while it is displayed, so the page the visitor asked for is the one they reach once they are logged in. </p> <p> The exception is an entry point marked anonymous: a URL naming such a view shows it, because it is a page written for a visitor who has no account here. </p> <p> Unset for an application that shows itself to visitors, which then reaches its login through the display it renders for them. </p> <p> The file is resolved relative to /WEB-INF/views/ in the webapp. </p>
com.top_logic.layout.view.ViewConfig.tooltip = Application-level configuration for the view system. <p> Registered via <i>application configuration</i> and accessible from any module. Applications override properties in their .conf.config.xml files. </p>
com.top_logic.layout.view.ViewElement = View element
com.top_logic.layout.view.ViewElement.Config.channels = Channels
com.top_logic.layout.view.ViewElement.Config.channels.tooltip = Channel declarations for this view. <p> Channels are named reactive values that can be read and written by UI elements within this view. </p>
com.top_logic.layout.view.ViewElement.Config.content = Content
com.top_logic.layout.view.ViewElement.Config.content.tooltip = The root content element of this view.
com.top_logic.layout.view.ViewElement.Config.param-bindings = Parameter bindings
com.top_logic.layout.view.ViewElement.Config.param-bindings.tooltip = Bindings from URL route parameters to view channels. <p> Route parameters are values extracted from the URL path (e.g., /view/123 where 123 is a route parameter). </p>
com.top_logic.layout.view.ViewElement.Config.query-bindings = Query bindings
com.top_logic.layout.view.ViewElement.Config.query-bindings.tooltip = Bindings from URL query parameters to view channels. <p> Query parameters are values from the query string (e.g., ?type=foo&sort=name). Unlike a route parameter, a query parameter occupies no path segment: its name identifies it, so it appears and disappears without moving anything else in the URL, and changing it alone is no history entry. </p>
com.top_logic.layout.view.ViewElement.tooltip = The mandatory root element of every .view.xml file. <p> Establishes the scope boundary for a view: its channel declarations, the bindings of URL parameters to those channels, and the content displayed within them. </p>
com.top_logic.layout.view.admin.CreateAccountAction = Create account action
com.top_logic.layout.view.admin.CreateAccountAction.tooltip = <i>View action</i> that creates a new persistent account from a login name. <p> Expects its input to be a (transient) object carrying a login attribute and an optional password attribute (e.g. the model of the "new account" <form> after <store-form-state/>). The account is created with the default <i>authentication device</i>; when a password is given (and the device supports password change) it is set, so the account is immediately usable for login. Must run inside a transaction (wrap the action in <with-transaction>); the created <i>account</i> is returned as the action result. </p>
com.top_logic.layout.view.admin.SecurityMatrixElement = Security matrix element
com.top_logic.layout.view.admin.SecurityMatrixElement.tooltip = Permission matrix for the access-control administration: one row per scope and command group, one column per role, with a checkbox in each cell granting/revoking that role's command group on that scope. <p> App-specific admin widget (referenced by class=, not a reusable @TagName element). Rows and role columns come from the <i>security scopes</i> catalog and the persisted role assignments rather than from a model query, and the cells edit those assignments directly, so this is a distinct element rather than a configuration of the generic data table. It renders through the green-field <i>table view control</i> (like the <table> element), so the two leading label columns are sortable and text-filterable, the role checkbox cells are editable, and column width / order are personalized per user. </p>
com.top_logic.layout.view.admin.SetPasswordAction = Set password action
com.top_logic.layout.view.admin.SetPasswordAction.tooltip = <i>View action</i> that sets (resets) the password of an existing account. <p> Expects its input to be a (transient) object carrying an account reference (the <i>account</i> to update) and a password attribute (e.g. the model of the "reset password" <form> after <store-form-state/>). The password is set through the default <i>authentication device</i>. Must run inside a transaction (wrap the action in <with-transaction>); the updated <i>account</i> is returned as the action result. </p>
com.top_logic.layout.view.admin.monitor.ApplicationMonitorTable = Application monitor table
com.top_logic.layout.view.admin.monitor.ApplicationMonitorTable.tooltip = Read-only table of the application's runtime status: the registered application monitors and their messages, JVM heap usage, Java VM identity and basic system facts, grouped into sections. <p> App-specific admin widget (referenced by class=, not a reusable @TagName element). The heap figures are a live snapshot read from the <i>runtime</i> at render time; the historical memory chart is a separate, deferred concern. </p>
com.top_logic.layout.view.admin.monitor.FailedLoginTable = Failed login table
com.top_logic.layout.view.admin.monitor.FailedLoginTable.tooltip = Read-only table of the failed login attempts of the last <code>30</code> days, one row per <i>failed login</i> with the time, attempted user, client IP, server and failure reason. <p> App-specific admin widget (referenced by class=, not a reusable @TagName element). </p>
com.top_logic.layout.view.admin.monitor.SectionedTable = Sectioned table
com.top_logic.layout.view.admin.monitor.SectionedTable.tooltip = Base for read-only monitoring tables that present data as (section, name, value) rows in a sortable, text-filterable green-field table.
com.top_logic.layout.view.admin.monitor.SqlMonitorAction = Sql monitor action
com.top_logic.layout.view.admin.monitor.SqlMonitorAction$Mode = Mode
com.top_logic.layout.view.admin.monitor.SqlMonitorAction$Mode.tooltip = What a <i>sql monitor action</i> does to the monitoring state.
com.top_logic.layout.view.admin.monitor.SqlMonitorAction.Config.mode = Mode
com.top_logic.layout.view.admin.monitor.SqlMonitorAction.Config.mode.tooltip = What the action does to the monitoring state.
com.top_logic.layout.view.admin.monitor.SqlMonitorAction.Mode.REFRESH = Refresh
com.top_logic.layout.view.admin.monitor.SqlMonitorAction.Mode.REFRESH.tooltip = Return a snapshot of the running analyzer's statistics, leaving it installed.
com.top_logic.layout.view.admin.monitor.SqlMonitorAction.Mode.START = Start
com.top_logic.layout.view.admin.monitor.SqlMonitorAction.Mode.START.tooltip = Install a fresh analyzer and clear the pool; returns an empty list.
com.top_logic.layout.view.admin.monitor.SqlMonitorAction.Mode.STOP = Stop
com.top_logic.layout.view.admin.monitor.SqlMonitorAction.Mode.STOP.tooltip = Return the running analyzer's final statistics and uninstall it.
com.top_logic.layout.view.admin.monitor.SqlMonitorAction.tooltip = <i>View action</i> controlling SQL statement monitoring on the default connection pool and returning the current statistics (one entry per normalized statement) for display. <p> Monitoring works by installing a <i>aggregating analyzer</i> on the pool's <i>logging data source proxy</i>; the analyzer lives on the (shared) data source between commands, so each <i>mode</i> simply re-fetches it. The returned statistics list is meant to be written to a channel feeding a <i>sql statistics table</i>. </p>
com.top_logic.layout.view.admin.monitor.SqlStatisticsTable = Sql statistics table
com.top_logic.layout.view.admin.monitor.SqlStatisticsTable.Config.input = Input
com.top_logic.layout.view.admin.monitor.SqlStatisticsTable.Config.input.tooltip = Channel holding the captured statistics (List<Map.Entry<String, Statistics>>).
com.top_logic.layout.view.admin.monitor.SqlStatisticsTable.tooltip = Read-only table of captured SQL statement statistics, one row per normalized statement with its call count, total / average / maximum execution time (ms) and processed row count. The rows come from an input channel fed by <i>sql monitor action</i>, so the table updates when monitoring is started, refreshed or stopped. <p> App-specific admin widget (referenced by class=, not a reusable @TagName element). </p>
com.top_logic.layout.view.admin.monitor.SystemEnvironmentTable = System environment table
com.top_logic.layout.view.admin.monitor.SystemEnvironmentTable.tooltip = Read-only table of the runtime environment: Java system properties, JVM startup arguments and the application's configuration variables, one row per entry with the originating section, the entry name and its value. <p> App-specific admin widget (referenced by class=, not a reusable @TagName element). Values whose key matches a configured protected-alias pattern (see <i>global configuration</i>) are masked, so passwords and secrets carried in properties, VM arguments or configuration variables are not exposed. </p>
com.top_logic.layout.view.admin.monitor.ThreadStackTable = Thread stack table
com.top_logic.layout.view.admin.monitor.ThreadStackTable.Config.input = Input
com.top_logic.layout.view.admin.monitor.ThreadStackTable.Config.input.tooltip = Channel holding the <i>thread</i> whose stack trace is shown.
com.top_logic.layout.view.admin.monitor.ThreadStackTable.tooltip = Read-only table showing the current stack trace of the <i>thread</i> held by an input channel, one row per stack frame. It updates reactively when the channel selection changes. <p> App-specific admin widget (referenced by class=, not a reusable @TagName element), the detail companion of <i>thread table</i>. </p>
com.top_logic.layout.view.admin.monitor.ThreadTable = Thread table
com.top_logic.layout.view.admin.monitor.ThreadTable.Config.selection = Selection
com.top_logic.layout.view.admin.monitor.ThreadTable.Config.selection.tooltip = Channel the selected <i>thread</i> is written to (or null when the selection is cleared).
com.top_logic.layout.view.admin.monitor.ThreadTable.tooltip = Read-only table of the live JVM threads (a snapshot taken at render time), one row per <i>thread</i> with its name, state, priority, kind and thread group. <p> App-specific admin widget (referenced by class=, not a reusable @TagName element). When a selection channel is configured, the selected thread is written to it so a companion <i>thread stack table</i> can show its current stack trace. </p>
com.top_logic.layout.view.admin.monitor.UserSessionTable = User session table
com.top_logic.layout.view.admin.monitor.UserSessionTable.tooltip = Read-only table of the recorded user sessions of the last <code>30</code> days, one row per <i>user session</i> with the user, login and logout time, client and server. A session that is still active has no logout time. <p> App-specific admin widget (referenced by class=, not a reusable @TagName element). </p>
com.top_logic.layout.view.admin.system.LockListAction = Lock list action
com.top_logic.layout.view.admin.system.LockListAction$Mode = Mode
com.top_logic.layout.view.admin.system.LockListAction$Mode.tooltip = What a <i>lock list action</i> does before returning the lock list.
com.top_logic.layout.view.admin.system.LockListAction.Config.mode = Mode
com.top_logic.layout.view.admin.system.LockListAction.Config.mode.tooltip = What the action does before returning the lock list.
com.top_logic.layout.view.admin.system.LockListAction.Mode.REFRESH = Refresh
com.top_logic.layout.view.admin.system.LockListAction.Mode.REFRESH.tooltip = Just return the current lock snapshot.
com.top_logic.layout.view.admin.system.LockListAction.Mode.RELEASE = Release
com.top_logic.layout.view.admin.system.LockListAction.Mode.RELEASE.tooltip = Force-release the lock passed as input, then return the updated snapshot.
com.top_logic.layout.view.admin.system.LockListAction.tooltip = <i>View action</i> returning the current cluster locks for display in a <i>lock table</i>, and optionally force-releasing the selected lock first. <p> The returned List<LockInfo> is meant to be written to the channel feeding the <i>lock table</i>. Releasing a lock delegates to the <i>token service</i>, which handles its own transaction. </p>
com.top_logic.layout.view.admin.system.LockTable = Lock table
com.top_logic.layout.view.admin.system.LockTable.Config.input = Input
com.top_logic.layout.view.admin.system.LockTable.Config.input.tooltip = Channel holding the lock list (List<LockInfo>) to display; when unset, the table shows a live snapshot taken at render time.
com.top_logic.layout.view.admin.system.LockTable.Config.selection = Selection
com.top_logic.layout.view.admin.system.LockTable.Config.selection.tooltip = Channel the selected <i>lock info</i> is written to (or null when the selection is cleared).
com.top_logic.layout.view.admin.system.LockTable.tooltip = Table of the currently-held cluster locks, one row per <i>lock info</i> with its owner, the triggering operation, the locked objects and aspects, the timeout and the acquiring cluster node. <p> App-specific admin widget (referenced by class=, not a reusable @TagName element). The table shows a live snapshot of the held locks when opened. When an input channel is configured, a written lock list replaces the rows, so a release / refresh command can update the table. The selected lock is written to the configured selection channel so a release command can act on it. </p>
com.top_logic.layout.view.admin.system.LogFileTable = Log file table
com.top_logic.layout.view.admin.system.LogFileTable.Config.selection = Selection
com.top_logic.layout.view.admin.system.LogFileTable.Config.selection.tooltip = Channel the selected log file is written to (or null when the selection is cleared).
com.top_logic.layout.view.admin.system.LogFileTable.tooltip = Table of the files in the application log directory, one row per file with its name, size and last modification time; the selected file is written to the configured selection channel for a content view to tail. <p> App-specific admin widget (referenced by class=, not a reusable @TagName element). A live snapshot of the log directory is taken when the view opens. </p>
com.top_logic.layout.view.admin.system.LogLineTable = Log line table
com.top_logic.layout.view.admin.system.LogLineTable.Config.input = Input
com.top_logic.layout.view.admin.system.LogLineTable.Config.input.tooltip = Channel holding the selected log <i>file</i> whose entries are shown.
com.top_logic.layout.view.admin.system.LogLineTable.Config.reload = Reload
com.top_logic.layout.view.admin.system.LogLineTable.Config.reload.tooltip = Channel whose change (a refresh tick) re-parses the current file without changing the selection.
com.top_logic.layout.view.admin.system.LogLineTable.tooltip = Sortable, per-column filterable table of the parsed log entries of the file held by the configured input channel, re-parsing whenever the input or the reload channel changes. <p> App-specific admin widget (referenced by class=, not a reusable @TagName element). Entries are produced by the reusable <i>log parser</i> (one row per log entry, multi-line stack traces collapsed into the entry details); only the last <code>4194304</code> bytes are parsed so that large files stay cheap to view. Rows are ordered newest first. </p>
com.top_logic.layout.view.admin.system.LoggerLevelAction = Logger level action
com.top_logic.layout.view.admin.system.LoggerLevelAction$Mode = Mode
com.top_logic.layout.view.admin.system.LoggerLevelAction$Mode.tooltip = What a <i>logger level action</i> does before returning the logger list.
com.top_logic.layout.view.admin.system.LoggerLevelAction.Config.mode = Mode
com.top_logic.layout.view.admin.system.LoggerLevelAction.Config.mode.tooltip = What the action does before returning the logger list.
com.top_logic.layout.view.admin.system.LoggerLevelAction.Config.model = Model
com.top_logic.layout.view.admin.system.LoggerLevelAction.Config.model.tooltip = Name of the channel holding the transient tl.admin:NewLogger input; required for <i>add</i>.
com.top_logic.layout.view.admin.system.LoggerLevelAction.Config.selection = Selection
com.top_logic.layout.view.admin.system.LoggerLevelAction.Config.selection.tooltip = Name of the channel holding the selected logger name; required for <i>remove</i>.
com.top_logic.layout.view.admin.system.LoggerLevelAction.Mode.ADD = Add
com.top_logic.layout.view.admin.system.LoggerLevelAction.Mode.ADD.tooltip = Configure the logger named in the model channel at the default level.
com.top_logic.layout.view.admin.system.LoggerLevelAction.Mode.REFRESH = Refresh
com.top_logic.layout.view.admin.system.LoggerLevelAction.Mode.REFRESH.tooltip = Just return the current logger snapshot.
com.top_logic.layout.view.admin.system.LoggerLevelAction.Mode.REMOVE = Remove
com.top_logic.layout.view.admin.system.LoggerLevelAction.Mode.REMOVE.tooltip = Remove the explicit configuration of the selected logger.
com.top_logic.layout.view.admin.system.LoggerLevelAction.tooltip = <i>View action</i> returning the configured loggers and their levels for display in a <i>logger level table</i>, and optionally adding or removing a logger configuration first. <p> The returned List<Map.Entry<String, String>> (logger name to level name) is meant to be written to the channel feeding the <i>logger level table</i>. <i>Add</i> configures the logger named in the model channel (a transient tl.admin:NewLogger) at the default level so it can then be adjusted inline; <i>remove</i> drops the explicit configuration of the logger held by the selection channel, reverting it to its inherited level. </p>
com.top_logic.layout.view.admin.system.LoggerLevelTable = Logger level table
com.top_logic.layout.view.admin.system.LoggerLevelTable.Config.input = Input
com.top_logic.layout.view.admin.system.LoggerLevelTable.Config.input.tooltip = Channel holding the logger list (List<Map.Entry<String, String>>) to display; when unset or holding a non-list, a live snapshot is taken at render time.
com.top_logic.layout.view.admin.system.LoggerLevelTable.Config.selection = Selection
com.top_logic.layout.view.admin.system.LoggerLevelTable.Config.selection.tooltip = Channel the selected logger name is written to (or null when the selection is cleared).
com.top_logic.layout.view.admin.system.LoggerLevelTable.tooltip = Table of the configured loggers, one row per logger with its name and an inline level selector that changes the logger's level at runtime; the selected logger name is written to the configured selection channel so it can be removed.
com.top_logic.layout.view.admin.system.MaintenanceModeAction = Maintenance mode action
com.top_logic.layout.view.admin.system.MaintenanceModeAction$Mode = Mode
com.top_logic.layout.view.admin.system.MaintenanceModeAction$Mode.tooltip = What a <i>maintenance mode action</i> does before returning the state token.
com.top_logic.layout.view.admin.system.MaintenanceModeAction.Config.mode = Mode
com.top_logic.layout.view.admin.system.MaintenanceModeAction.Config.mode.tooltip = What the action does before returning the state token.
com.top_logic.layout.view.admin.system.MaintenanceModeAction.Config.model = Model
com.top_logic.layout.view.admin.system.MaintenanceModeAction.Config.model.tooltip = Name of the channel holding the transient tl.admin:MaintenanceMode input; required only for <i>enter</i>.
com.top_logic.layout.view.admin.system.MaintenanceModeAction.Mode.ABORT = Abort
com.top_logic.layout.view.admin.system.MaintenanceModeAction.Mode.ABORT.tooltip = Abort a scheduled, not-yet-active maintenance window.
com.top_logic.layout.view.admin.system.MaintenanceModeAction.Mode.ENTER = Enter
com.top_logic.layout.view.admin.system.MaintenanceModeAction.Mode.ENTER.tooltip = Enter (or schedule entering) maintenance mode using the model channel's input.
com.top_logic.layout.view.admin.system.MaintenanceModeAction.Mode.LEAVE = Leave
com.top_logic.layout.view.admin.system.MaintenanceModeAction.Mode.LEAVE.tooltip = Leave maintenance mode and return to normal operation.
com.top_logic.layout.view.admin.system.MaintenanceModeAction.Mode.REFRESH = Refresh
com.top_logic.layout.view.admin.system.MaintenanceModeAction.Mode.REFRESH.tooltip = Just return the current maintenance state.
com.top_logic.layout.view.admin.system.MaintenanceModeAction.tooltip = <i>View action</i> that switches the application maintenance mode and returns the resulting state as a <code>"NORMAL"</code> / <code>"PENDING"</code> / <code>"ACTIVE"</code> token for command gating and status display. <p> The token is meant to be written to the channel that the maintenance.view.xml commands gate on (via <visible-if>) and that the <i>maintenance status view</i> re-renders from. For <i>enter</i> the delay, the login decision and the message are read from the configured model channel (the transient tl.admin:MaintenanceMode bound to the enter dialog's form); an empty or zero delay enters maintenance mode immediately. </p>
com.top_logic.layout.view.admin.system.MaintenanceStatusView = Maintenance status view
com.top_logic.layout.view.admin.system.MaintenanceStatusView.Config.state = State
com.top_logic.layout.view.admin.system.MaintenanceStatusView.Config.state.tooltip = Channel seeded with the current state token on open and re-read on change; shared with the commands that gate on it.
com.top_logic.layout.view.admin.system.MaintenanceStatusView.tooltip = Displays the current application maintenance state as a text line and seeds the configured state channel with the matching token so the maintenance commands gate correctly from the moment the view opens. <p> App-specific admin widget (referenced by class=, not a reusable @TagName element). The status text reflects global, server-side state held by the <i>maintenance window</i> (and, while a window is scheduled or active, its message), which no generic value control can express. The view re-renders whenever the state channel changes, i.e. after each maintenance command. </p>
com.top_logic.layout.view.admin.system.ServiceLifecycleAction = Service lifecycle action
com.top_logic.layout.view.admin.system.ServiceLifecycleAction$Mode = Mode
com.top_logic.layout.view.admin.system.ServiceLifecycleAction$Mode.tooltip = What a <i>service lifecycle action</i> does before returning the service list.
com.top_logic.layout.view.admin.system.ServiceLifecycleAction.Config.mode = Mode
com.top_logic.layout.view.admin.system.ServiceLifecycleAction.Config.mode.tooltip = What the action does before returning the service list.
com.top_logic.layout.view.admin.system.ServiceLifecycleAction.Config.selection = Selection
com.top_logic.layout.view.admin.system.ServiceLifecycleAction.Config.selection.tooltip = Name of the channel holding the service to act on; required for all modes but <i>refresh</i>.
com.top_logic.layout.view.admin.system.ServiceLifecycleAction.Mode.REFRESH = Refresh
com.top_logic.layout.view.admin.system.ServiceLifecycleAction.Mode.REFRESH.tooltip = Just return the current service snapshot.
com.top_logic.layout.view.admin.system.ServiceLifecycleAction.Mode.RESTART = Restart
com.top_logic.layout.view.admin.system.ServiceLifecycleAction.Mode.RESTART.tooltip = Restart the selected service (and its dependents).
com.top_logic.layout.view.admin.system.ServiceLifecycleAction.Mode.START = Start
com.top_logic.layout.view.admin.system.ServiceLifecycleAction.Mode.START.tooltip = Start the selected service (and its dependencies).
com.top_logic.layout.view.admin.system.ServiceLifecycleAction.Mode.STOP = Stop
com.top_logic.layout.view.admin.system.ServiceLifecycleAction.Mode.STOP.tooltip = Stop the selected service (and its dependents).
com.top_logic.layout.view.admin.system.ServiceLifecycleAction.tooltip = <i>View action</i> returning the current application services for display in a <i>service table</i>, and optionally starting, stopping or restarting the selected service first. <p> The returned List<BasicRuntimeModule> is meant to be written to the channel feeding the <i>service table</i>. The service to act on is read from the configured selection channel (not the command input, which carries the running state used to gate the command). Dependent services are started / stopped / restarted automatically. </p>
com.top_logic.layout.view.admin.system.ServiceTable = Service table
com.top_logic.layout.view.admin.system.ServiceTable.Config.input = Input
com.top_logic.layout.view.admin.system.ServiceTable.Config.input.tooltip = Channel holding the module list (List<BasicRuntimeModule>) to display; when unset, the table shows a live snapshot taken at render time.
com.top_logic.layout.view.admin.system.ServiceTable.Config.selection = Selection
com.top_logic.layout.view.admin.system.ServiceTable.Config.selection.tooltip = Channel the selected module is written to (or null when the selection is cleared).
com.top_logic.layout.view.admin.system.ServiceTable.Config.state = State
com.top_logic.layout.view.admin.system.ServiceTable.Config.state.tooltip = Channel the selected module's running status is written to (<code>"ACTIVE"</code> / <code>"INACTIVE"</code>, or null when the selection is cleared).
com.top_logic.layout.view.admin.system.ServiceTable.tooltip = Table of the application services (runtime modules), one row per <i>service module</i> with its running status, label and implementation class name. <p> App-specific admin widget (referenced by class=, not a reusable @TagName element). The table shows a live snapshot of the known modules when opened and rebuilds from the configured input channel after a lifecycle command. The selected module is written to the selection channel (so a command can act on it) and its running status to the state channel as <code>"ACTIVE"</code> / <code>"INACTIVE"</code> (so start vs. stop / restart can be shown mutually exclusively); both are cleared to null when the selection is empty. </p>
com.top_logic.layout.view.channel.ChannelBindingConfig = Channel binding configuration
com.top_logic.layout.view.channel.ChannelBindingConfig.channel = Channel
com.top_logic.layout.view.channel.ChannelBindingConfig.channel.tooltip = Name of the channel in the referenced (child) view.
com.top_logic.layout.view.channel.ChannelBindingConfig.to = To
com.top_logic.layout.view.channel.ChannelBindingConfig.to.tooltip = Reference to a channel in the parent scope.
com.top_logic.layout.view.channel.ChannelBindingConfig.tooltip = Configuration for a channel binding between a parent view and a referenced child view. <p> Used inside <view-ref> to map a channel from the parent's scope to a channel declared in the referenced view. At runtime, the parent's channel instance is shared with the child - both sides read and write the same object. </p> <p> Example: </p> <pre> &lt;view-ref view="detail.view.xml"&gt; &lt;bind channel="item" to="selectedCustomer"/&gt; &lt;/view-ref&gt; </pre>
com.top_logic.layout.view.channel.ChannelConfig.name = Name
com.top_logic.layout.view.channel.ChannelConfig.name.tooltip = The unique name of this channel within the view.
com.top_logic.layout.view.channel.ChannelMappingConfig = Channel mapping configuration
com.top_logic.layout.view.channel.ChannelMappingConfig.from = From
com.top_logic.layout.view.channel.ChannelMappingConfig.from.tooltip = The source channel name (in the context providing the value).
com.top_logic.layout.view.channel.ChannelMappingConfig.to = To
com.top_logic.layout.view.channel.ChannelMappingConfig.to.tooltip = The target channel name (in the context receiving the value).
com.top_logic.layout.view.channel.ChannelMappingConfig.tooltip = Configuration for a single channel mapping between two scopes. <p> Used in <input> and <output> elements within dialog command configuration to map a channel from one context (parent) to another (dialog). </p>
com.top_logic.layout.view.channel.DerivedChannelConfig.expr = Expression
com.top_logic.layout.view.channel.DerivedChannelConfig.expr.tooltip = TL-Script expression computing the derived value. <p> The expression receives the input channel values as positional arguments. For example, with inputs="a,b" and expr="x -> y -> $x + $y", the expression is called with the current values of channels a and b. </p>
com.top_logic.layout.view.channel.DerivedChannelConfig.observed-types = Observed types
com.top_logic.layout.view.channel.DerivedChannelConfig.observed-types.tooltip = Types whose object changes (create / update / delete) recompute the expression, in addition to the objects the inputs hold, which are always observed. <p> Configure this only for an expression that navigates beyond the input objects, e.g. one reading an attribute of the input's container: a change of that other object is invisible to the inputs' own observation. Empty (default) observes just the input objects. </p>
com.top_logic.layout.view.channel.DerivedChannelConfig.reverse = Reverse
com.top_logic.layout.view.channel.DerivedChannelConfig.reverse.tooltip = Optional TL-Script expression for reverse (write-back) propagation. <p> When present, the derived channel becomes bidirectional: setting a value on it applies this expression to compute the source value, which is then written to the first input channel. </p> <p> The expression receives the derived value as its single argument and must return the corresponding value for the first input channel. For example, with expr="id -> 'id-' + $id" and reverse="s -> $s.substring(3)", writing "id-42" to the derived channel sets "42" on the source. </p>
com.top_logic.layout.view.channel.DerivedChannelFactory = Derived channel factory
com.top_logic.layout.view.channel.DerivedChannelFactory.tooltip = <i>Channel factory</i> for derived (computed, read-only) channels. <p> Compiles the TL-Script expression once at configuration parse time. Per-session, resolves the input channel references and the observed types, and creates a <i>derived view channel</i> that recomputes on input changes and, while displayed, on changes of the observed objects. </p>
com.top_logic.layout.view.channel.Inputs = Inputs
com.top_logic.layout.view.channel.Inputs.inputs = Inputs
com.top_logic.layout.view.channel.Inputs.inputs.tooltip = References to the <i>view channels</i> whose current values become the leading positional arguments of this configuration's TL-Script functions, in declaration order. <p> The channels are read whenever a function is applied, so what a function computes follows what the referenced channels currently hold. </p> <p> The references are written either as a comma-separated attribute: </p> <pre> inputs="selectedCustomer, editMode" </pre> <p> or as nested elements, one per channel: </p> <pre> &lt;inputs&gt; &lt;input channel="selectedCustomer"/&gt; &lt;input channel="editMode"/&gt; &lt;/inputs&gt; </pre>
com.top_logic.layout.view.channel.Inputs.tooltip = The channels a configured element or action reads the leading arguments of its functions from. <p> A function of a view computes its result from more than the value it is applied to: from what is selected elsewhere, from what a filter above it holds, from the object a dialog was opened for. Such a value comes from a <i>view channel</i> the configuration names as an input, and every function of that configuration receives the values of those channels ahead of the arguments it is called with. </p>
com.top_logic.layout.view.channel.ValueChannelFactory = Value channel factory
com.top_logic.layout.view.channel.ValueChannelFactory.tooltip = <i>Channel factory</i> that creates mutable <i>default view channel</i> instances.
com.top_logic.layout.view.command.CancelDialogCommand = Cancel dialog command
com.top_logic.layout.view.command.CancelDialogCommand.tooltip = A <i>view command</i> that closes the topmost open dialog without propagating any results. <p> This command is intended for "Cancel" or "Close" buttons inside dialog view XML files. It takes no configuration beyond the standard <i>configuration</i> properties (label, image, etc.). </p> <p> While a command of the dialog is still running, the dialog cannot be left and the button says so instead of doing nothing, see <i>suspended commands</i>. </p>
com.top_logic.layout.view.command.CloseDialogAction = Close dialog action
com.top_logic.layout.view.command.CloseDialogAction.tooltip = <i>View action</i> that closes the topmost dialog. <p> Passes the input through as output so it can be used in a chain where a subsequent action needs the result. </p>
com.top_logic.layout.view.command.CommandReference = Command reference
com.top_logic.layout.view.command.CommandReference.tooltip = A <i>view command</i> that delegates to a named command from the enclosing <i>command scope</i>. <p> Used in <button> elements to reference a command declared on the enclosing panel: </p> <pre> &lt;button&gt; &lt;command-ref name="approve"/&gt; &lt;/button&gt; </pre>
com.top_logic.layout.view.command.ConfirmAction = Confirm action
com.top_logic.layout.view.command.ConfirmAction.Config.cancel-label = Cancel label
com.top_logic.layout.view.command.ConfirmAction.Config.cancel-label.tooltip = The label of the declining (cancel) button. <p> Defaults to the standard "No" label when not set. </p>
com.top_logic.layout.view.command.ConfirmAction.Config.confirm-label = Confirm label
com.top_logic.layout.view.command.ConfirmAction.Config.confirm-label.tooltip = The label of the affirmative (confirm) button. <p> Defaults to the standard "Yes" label when not set. </p>
com.top_logic.layout.view.command.ConfirmAction.Config.expr = Expression
com.top_logic.layout.view.command.ConfirmAction.Config.expr.tooltip = TL-Script expression producing the confirmation message, or null/empty to skip the confirmation (proceed without asking). <p> Called with the input channel values as leading positional arguments (in declaration order), followed by the chain's current input value as the last argument. </p>
com.top_logic.layout.view.command.ConfirmAction.Config.title = Title
com.top_logic.layout.view.command.ConfirmAction.Config.title.tooltip = The confirmation dialog title. <p> Defaults to a generic confirmation title when not set. </p>
com.top_logic.layout.view.command.ConfirmAction.tooltip = Interruptible <i>view action</i> that asks the user to confirm before the chain continues. <p> Placed as a guard in a command chain - typically <em>after</em> <store-form-state/> (so it sees the validated, applied form values) and <em>before</em> <with-transaction> (so no transaction is held open during the dialog). The message is produced by a TL-Script expression evaluated like <i>execute script action</i>: the configured input channel values are passed as leading positional arguments, followed by the chain's current input value as the last argument. The expression returns the confirmation message (typically an i18n literal such as #('Replace?'@en, 'Ersetzen?'@de)) to prompt, or null/empty to proceed without asking - making the guard <em>conditional</em>. </p> <p> On confirm the chain resumes (the input passes through unchanged); on decline it aborts, running the compensations of any already-executed actions. </p>
com.top_logic.layout.view.command.DirtyCheckScope = Dirty check scope
com.top_logic.layout.view.command.DirtyCheckScope.NONE = None
com.top_logic.layout.view.command.DirtyCheckScope.NONE.tooltip = Skip dirty checking entirely.
com.top_logic.layout.view.command.DirtyCheckScope.SELF = Self
com.top_logic.layout.view.command.DirtyCheckScope.SELF.tooltip = Check only the element that owns this command for unsaved changes.
com.top_logic.layout.view.command.DirtyCheckScope.VIEW = View
com.top_logic.layout.view.command.DirtyCheckScope.VIEW.tooltip = Check the entire view for unsaved changes.
com.top_logic.layout.view.command.DirtyCheckScope.tooltip = Scope of the dirty check performed before executing a <i>view command</i>.
com.top_logic.layout.view.command.DisabledIf = Disabled if
com.top_logic.layout.view.command.DisabledIf.Config.expr = Expression
com.top_logic.layout.view.command.DisabledIf.Config.expr.tooltip = TL-Script function called with the command's current input value, computing the reason why the command must not be executed. <p> No value or <code>false</code> keeps the command executable. A resource key or a text is used as reason for disabling the command, <code>true</code> disables it with a generic reason. </p>
com.top_logic.layout.view.command.DisabledIf.tooltip = <i>View executability rule</i> that disables a command while a configured TL-Script function, evaluated on the command's input, reports a reason preventing the execution. <p> The result of the function decides: no value or <code>false</code> keeps the command executable, <code>true</code> disables it with a generic reason, a resource key or a text disables it with that reason. The reason is displayed as the tooltip of the disabled button, so that the user learns what is missing. </p> <p> Counterpart of <i>visible if</i>: A command that the user may not execute yet stays visible together with its reason, while a command that does not belong to the user at all is hidden. </p> <p> The rule is evaluated whenever the command's input changes. A function that inspects objects beyond the input object must announce their types in the command's <i>Observed types</i> (<i>view command configuration</i>), because a change of such an object is otherwise invisible to the command. </p> <p> Example - a command that requires a status to be assigned: </p> <pre> &lt;disabled-if expr="t -&gt; if($t.get(`demo.tickets:Ticket#status`) == null, #('Please assign a status first.'@en))"/&gt; </pre>
com.top_logic.layout.view.command.DiscardFormStateAction = Discard form state action
com.top_logic.layout.view.command.DiscardFormStateAction.tooltip = <i>View action</i> that discards the form overlay without applying changes. <p> Resets the form overlay and leaves edit mode. Useful in cancel action chains for dialog forms where the dialog needs to be closed after discarding changes. </p>
com.top_logic.layout.view.command.ExecuteScriptAction = Execute script action
com.top_logic.layout.view.command.ExecuteScriptAction.Config.function = Function
com.top_logic.layout.view.command.ExecuteScriptAction.Config.function.tooltip = TL-Script function expression. <p> Called with the input channel values as leading positional arguments (in declaration order), followed by the chain's current input value as the last argument. With no inputs, called with the chain's current input value as the single argument. </p>
com.top_logic.layout.view.command.ExecuteScriptAction.tooltip = <i>View action</i> that evaluates a configured TL-Script function. <p> Without inputs, the configured expression must be a function that takes one argument: the chain's current input value is passed as the argument and the function's return value becomes the output of this action. </p> <p> Example: Create a transient object: </p> <pre> &lt;execute-script function="x -&gt; new(`test.constraints:ConstraintTestType`, transient: true)"/&gt; </pre> <p> With inputs, the current values of the referenced <i>view channels</i> are passed as leading positional arguments, followed by the chain's current input value as the last argument. This allows an action to combine a separate channel value (e.g. a create context / container) with the chained value (e.g. the form object being created). Example: persist a transient form object into a container channel's composite reference: </p> <pre> &lt;execute-script function="container -&gt; obj -&gt; $container.add(`my.module:Container#children`, $obj.copy(transient: false))"&gt; &lt;inputs&gt; &lt;input channel="context"/&gt; &lt;/inputs&gt; &lt;/execute-script&gt; </pre>
com.top_logic.layout.view.command.FormValid = Form valid
com.top_logic.layout.view.command.FormValid.tooltip = <i>View executability rule</i> that disables a command while the enclosing form displays validation errors. <p> Guards commands that store the entered values: such a command is rejected by the form anyway, so offering it while the problems are on screen is misleading. Errors the user cannot see yet do not disable the command - the save attempt is what makes them visible in the first place. </p> <p> Applied automatically to a form command whose action chain contains a <i>store form state action</i>. Configure it explicitly for a command that applies form values through some other action. </p>
com.top_logic.layout.view.command.GenericViewCommand = Generic view command
com.top_logic.layout.view.command.GenericViewCommand.Config.actions = Actions
com.top_logic.layout.view.command.GenericViewCommand.Config.actions.tooltip = The chain of actions to execute sequentially.
com.top_logic.layout.view.command.GenericViewCommand.tooltip = A <i>view command</i> that executes a configured chain of <i>view actions</i>. <p> Each action's return value becomes the input of the next action. The first action receives the command's input (typically null for toolbar buttons). This allows composing complex behaviors from simple, reusable building blocks. </p> <p> Example: Create a transient object and open a dialog with it: </p> <pre> &lt;generic-command label="New"&gt; &lt;execute-script function="x -&gt; new(`my.module:MyType`, transient: true)"/&gt; &lt;open-dialog dialog-view="demo/create.view.xml" bind-input-to="model"/&gt; &lt;/generic-command&gt; </pre>
com.top_logic.layout.view.command.IfAction = If action
com.top_logic.layout.view.command.IfAction.Config.else = Else
com.top_logic.layout.view.command.IfAction.Config.else.tooltip = The actions to run when the condition does not hold; none to pass the chain's value through.
com.top_logic.layout.view.command.IfAction.Config.test = Test
com.top_logic.layout.view.command.IfAction.Config.test.tooltip = TL-Script condition deciding which branch runs. <p> Called with the inputs channel values as leading positional arguments, followed by the chain's current value as the last argument. Its result is taken as a condition in the fuzzy sense of TL-Script, so a plain object stands for a true condition and nothing - null, an empty list, an empty text - for a false one. </p>
com.top_logic.layout.view.command.IfAction.Config.then = Then
com.top_logic.layout.view.command.IfAction.Config.then.tooltip = The actions to run when the condition holds; none to pass the chain's value through.
com.top_logic.layout.view.command.IfAction.tooltip = <i>View action</i> that decides between two chains of actions by a TL-Script condition over the current value of the enclosing chain. <p> The chosen chain runs as a nested chain of the enclosing one: it starts with the current value and its last action's result becomes the value the enclosing chain continues with. The branch that is not chosen does not run, and a branch that is not configured passes the value through unchanged. An abort inside a branch - a declined <i>confirm action</i> - aborts the whole command, and a compensation registered inside a branch runs on the command's abort like one registered beside the branch. </p> <p> Example: select the ticket the chain found, or offer to create one when it found none: </p> <pre> &lt;if test="ticket -&gt; $ticket != null"&gt; &lt;then&gt; &lt;write-channel name="ticket"/&gt; &lt;/then&gt; &lt;else&gt; &lt;execute-script function="x -&gt; new(`demo.tickets:Ticket`, transient: true)"/&gt; &lt;open-dialog bind-input-to="model" dialog-view="tickets-create.view.xml"/&gt; &lt;/else&gt; &lt;/if&gt; </pre>
com.top_logic.layout.view.command.InspectEnabled = Inspect enabled
com.top_logic.layout.view.command.InspectEnabled.tooltip = <i>View executability rule</i> that shows a command only while the application runs with UI inspection switched on, hiding it otherwise. <p> The gate of developer tooling - the UI inspector, and anything else that exposes how the UI is built rather than what it shows. It is a deployment switch, not a permission: whoever works on a system that has it on sees the tooling regardless of their roles, and nobody sees it on a system that has it off. </p>
com.top_logic.layout.view.command.LanguageCommands = Language commands
com.top_logic.layout.view.command.LanguageCommands.tooltip = One command per language the application supports, each switching the current user to that language. <p> The set follows the supported locales of <i>internationalization resources</i>, and an entry is labelled with the language's own name in that language - "Deutsch", "English" - which is what a reader looking for their language recognises, and needs no translation of its own. The entry for the language currently in effect is marked as the active one, the way <i>theme commands</i> marks the theme in force; it stays executable and selecting it does nothing. </p> <p> Nothing is offered while the session is anonymous: the choice is stored on the account, and an anonymous session has none to store it on. A single supported language likewise yields no entries. </p>
com.top_logic.layout.view.command.MenuTrigger = Menu trigger
com.top_logic.layout.view.command.MenuTrigger.CLICK = Click
com.top_logic.layout.view.command.MenuTrigger.CLICK.tooltip = The menu opens on a click and appears anchored below the region, the way a drop-down does.
com.top_logic.layout.view.command.MenuTrigger.CONTEXT_MENU = Context menu
com.top_logic.layout.view.command.MenuTrigger.CONTEXT_MENU.tooltip = The menu opens on a contextmenu event - a right-click, or its touch and keyboard equivalents - and appears at the pointer.
com.top_logic.layout.view.command.MenuTrigger.tooltip = The gesture on a <i>menu region control</i> that opens its menu.
com.top_logic.layout.view.command.NotifyAction = Notify action
com.top_logic.layout.view.command.NotifyAction$Display = Display
com.top_logic.layout.view.command.NotifyAction$Display.tooltip = Where the user reads what they are told.
com.top_logic.layout.view.command.NotifyAction$Kind = Kind
com.top_logic.layout.view.command.NotifyAction$Kind.tooltip = How serious what the user is told is.
com.top_logic.layout.view.command.NotifyAction.Config.display = Display
com.top_logic.layout.view.command.NotifyAction.Config.display.tooltip = Where the user reads the message.
com.top_logic.layout.view.command.NotifyAction.Config.expr = Expression
com.top_logic.layout.view.command.NotifyAction.Config.expr.tooltip = TL-Script expression producing the message, or null/empty to say nothing (the chain continues untouched). <p> Called with the input channel values as leading positional arguments (in declaration order), followed by the chain's current input value as the last argument. </p>
com.top_logic.layout.view.command.NotifyAction.Config.kind = Kind
com.top_logic.layout.view.command.NotifyAction.Config.kind.tooltip = How serious the message is. <p> Decides how a <i>snackbar</i> message is marked, and which title a <i>dialog</i> carries when none is configured. </p>
com.top_logic.layout.view.command.NotifyAction.Config.stop = Stop
com.top_logic.layout.view.command.NotifyAction.Config.stop.tooltip = Whether the chain ends with the notice instead of continuing with its value unchanged. <p> An ending chain runs the compensations of the actions before it and reports nothing beyond the message itself. A message there was nothing to say ends no chain. </p>
com.top_logic.layout.view.command.NotifyAction.Config.title = Title
com.top_logic.layout.view.command.NotifyAction.Config.title.tooltip = The title of a <i>dialog</i>. <p> Defaults to a title matching the severity when not set. </p>
com.top_logic.layout.view.command.NotifyAction.Display.DIALOG = Dialog
com.top_logic.layout.view.command.NotifyAction.Display.DIALOG.tooltip = A dialog that stays until the user acknowledges it, and holds the chain while it is open.
com.top_logic.layout.view.command.NotifyAction.Display.SNACKBAR = Snackbar
com.top_logic.layout.view.command.NotifyAction.Display.SNACKBAR.tooltip = A message passing by beside the user's work, which they need not act on.
com.top_logic.layout.view.command.NotifyAction.Kind.ERROR = Error
com.top_logic.layout.view.command.NotifyAction.Kind.ERROR.tooltip = Something the user asked for did not happen.
com.top_logic.layout.view.command.NotifyAction.Kind.INFO = Info
com.top_logic.layout.view.command.NotifyAction.Kind.INFO.tooltip = Something has happened that the user asked for.
com.top_logic.layout.view.command.NotifyAction.Kind.WARNING = Warning
com.top_logic.layout.view.command.NotifyAction.Kind.WARNING.tooltip = Something the user should be aware of, without it having stopped them.
com.top_logic.layout.view.command.NotifyAction.tooltip = Action that tells the user something - why what they asked for was refused, or what has happened - and either lets the chain continue or ends it after the notice. <p> The message is produced by a TL-Script expression evaluated like <i>execute script action</i>: the configured input channel values are passed as leading positional arguments, followed by the chain's current input value as the last argument. The expression returns the message (typically an i18n literal such as #('Nothing selected.'@en, 'Nichts ausgewählt.'@de)), or null/empty when there is nothing to say - which makes the notice <em>conditional</em> and passes the chain's value on untouched. </p> <p> The notice appears as a passing message beside the user's work, or as a dialog they acknowledge; its severity decides how a passing message is marked and which title a dialog carries. A dialog holds the chain until it is closed. </p>
com.top_logic.layout.view.command.NullInputDisabled = Null input disabled
com.top_logic.layout.view.command.NullInputDisabled.tooltip = <i>View executability rule</i> that disables the command when the input is null. <p> Returns <code>NO_EXEC_NO_MODEL</code> for null input and <code>EXECUTABLE</code> otherwise. </p>
com.top_logic.layout.view.command.NullInputHidden = Null input hidden
com.top_logic.layout.view.command.NullInputHidden.tooltip = <i>View executability rule</i> that hides the command when the input is null. <p> Returns <code>NOT_EXEC_HIDDEN</code> for null input and <code>EXECUTABLE</code> otherwise. </p>
com.top_logic.layout.view.command.OpenDialogAction = Open dialog action
com.top_logic.layout.view.command.OpenDialogAction.Config.bind-input-to = Bind input to
com.top_logic.layout.view.command.OpenDialogAction.Config.bind-input-to.tooltip = Dialog channel name to receive the action's input object. <p> Defaults to "model" if not specified. </p>
com.top_logic.layout.view.command.OpenDialogAction.Config.bindings = Bindings
com.top_logic.layout.view.command.OpenDialogAction.Config.bindings.tooltip = Channel bindings from the parent scope to the dialog.
com.top_logic.layout.view.command.OpenDialogAction.Config.close-on-backdrop = Close on backdrop
com.top_logic.layout.view.command.OpenDialogAction.Config.close-on-backdrop.tooltip = Whether clicking the backdrop closes the dialog.
com.top_logic.layout.view.command.OpenDialogAction.Config.dialog-view = Dialog view
com.top_logic.layout.view.command.OpenDialogAction.Config.dialog-view.tooltip = Path to the dialog view file, relative to /WEB-INF/views/.
com.top_logic.layout.view.command.OpenDialogAction.tooltip = <i>View action</i> that opens a modal dialog. <p> The action's input is injected into a named dialog channel (<i>Bind input to</i>, default: "model"). Additional parent channels can be shared via live bindings. </p> <p> When a form bound to one of the shared parent channels holds unsaved changes, the user is asked what to do with them <em>before</em> the dialog opens: the dialog's own commands write those channels, so asking only then would force the user to sacrifice either the changes or everything just entered into the dialog. Declining the question aborts the chain and the dialog stays closed. </p> <p> This action contains the core dialog-opening logic. <i>Open dialog command</i> extends this with command presentation options (label, image, executability). </p>
com.top_logic.layout.view.command.OpenDialogCommand = Open dialog command
com.top_logic.layout.view.command.OpenDialogCommand.Config.bind-input-to = Bind input to
com.top_logic.layout.view.command.OpenDialogCommand.Config.bind-input-to.tooltip = Dialog channel name to receive the command's input parameter.
com.top_logic.layout.view.command.OpenDialogCommand.Config.bindings = Bindings
com.top_logic.layout.view.command.OpenDialogCommand.Config.bindings.tooltip = Channel bindings from the parent scope to the dialog view's channels. <p> Each binding shares the parent's channel instance with the dialog - both sides read and write the same object (live binding), identical to the mechanism used by <view-ref>. </p>
com.top_logic.layout.view.command.OpenDialogCommand.Config.close-on-backdrop = Close on backdrop
com.top_logic.layout.view.command.OpenDialogCommand.Config.close-on-backdrop.tooltip = Whether clicking the backdrop (outside the dialog) closes it.
com.top_logic.layout.view.command.OpenDialogCommand.Config.dialog-view = Dialog view
com.top_logic.layout.view.command.OpenDialogCommand.Config.dialog-view.tooltip = Path to the .view.xml file defining the dialog content, relative to /WEB-INF/views/.
com.top_logic.layout.view.command.OpenDialogCommand.Config.outputs = Outputs
com.top_logic.layout.view.command.OpenDialogCommand.Config.outputs.tooltip = Output channel mappings from the dialog back to the parent view. <p> Reserved for future use. </p>
com.top_logic.layout.view.command.OpenDialogCommand.tooltip = A <i>view command</i> that opens a modal dialog whose content is defined in a separate .view.xml file. <p> Delegates to <i>open dialog action</i> for the core dialog-opening logic. This command adds the standard <i>configuration</i> presentation options (label, image, executability). </p> <p> Example usage: </p> <pre> &lt;button&gt; &lt;action class="com.top_logic.layout.view.command.OpenDialogCommand" dialog-view="demo/show-details.view.xml" close-on-backdrop="true"&gt; &lt;bind channel="model" to="selection"/&gt; &lt;/action&gt; &lt;/button&gt; </pre>
com.top_logic.layout.view.command.OpenViewWindowCommand = Open view window command
com.top_logic.layout.view.command.OpenViewWindowCommand.Config.height = Height
com.top_logic.layout.view.command.OpenViewWindowCommand.Config.height.tooltip = The initial window height in pixels.
com.top_logic.layout.view.command.OpenViewWindowCommand.Config.resizable = Resizable
com.top_logic.layout.view.command.OpenViewWindowCommand.Config.resizable.tooltip = Whether the window may be resized.
com.top_logic.layout.view.command.OpenViewWindowCommand.Config.singleton-key = Singleton key
com.top_logic.layout.view.command.OpenViewWindowCommand.Config.singleton-key.tooltip = An optional key identifying this window as a singleton: opening it again focuses the existing window instead of creating a duplicate. Empty for a non-singleton window.
com.top_logic.layout.view.command.OpenViewWindowCommand.Config.title = Title
com.top_logic.layout.view.command.OpenViewWindowCommand.Config.title.tooltip = The window title shown in the browser window chrome (resolved in the user's locale when the window opens).
com.top_logic.layout.view.command.OpenViewWindowCommand.Config.view = View
com.top_logic.layout.view.command.OpenViewWindowCommand.Config.view.tooltip = The window content view, as a path relative to <code>"/WEB-INF/views/"</code> (e.g. demo/script-recorder.view.xml).
com.top_logic.layout.view.command.OpenViewWindowCommand.Config.width = Width
com.top_logic.layout.view.command.OpenViewWindowCommand.Config.width.tooltip = The initial window width in pixels.
com.top_logic.layout.view.command.OpenViewWindowCommand.tooltip = A <i>view command</i> that pops out a new browser window whose content is a configured .view.xml. <p> The generic "open a window showing a view" behavior — any feature that needs a side-window (a recorder panel, a help window, a detail pop-out) configures this command with the view and window geometry instead of writing a bespoke open command. A singleton key makes repeated invocations focus the existing window rather than open duplicates. </p>
com.top_logic.layout.view.command.ReadFormObjectAction = Read form object action
com.top_logic.layout.view.command.ReadFormObjectAction.tooltip = <i>View action</i> that reads the current object from the enclosing form. <p> Returns the form's current object, which in edit mode is the overlay containing the user's edits. The input is ignored. </p>
com.top_logic.layout.view.command.RememberStartPageAction = Remember start page action
com.top_logic.layout.view.command.RememberStartPageAction.tooltip = Remembers the page the user is looking at as the one they start on, or forgets it again when they are already there. <p> One entry serves both directions, because the question a user asks of it is the same either way - whether this page is where they begin. Invoked on the page that is already the start page it clears the choice, so nothing has to offer a second entry that is meaningless most of the time. </p>
com.top_logic.layout.view.command.ResetPersonalConfigurationAction = Reset personal configuration action
com.top_logic.layout.view.command.ResetPersonalConfigurationAction.tooltip = Discards everything the current user has adjusted about the presentation of the application, so it looks to them the way it looks to somebody who has never used it. <p> That is the chosen theme, the column widths of a table, the state of a collapsed panel - whatever has accumulated in the personal configuration. What the account carries as data of its own - the language, the country, the timezone - is not part of it and stays. </p> <p> The stored configuration and the copies the session holds are dropped together - one per browser tab, each of them a subsession of its own - because keeping any of them would restore the others as soon as the tab it belongs to writes it out. </p> <p> Every window of the session is then rebuilt, because what was just discarded is what the page it displays was built from. The transient display state of those pages goes with it: a table's selection, its scroll position, the input of a form. </p>
com.top_logic.layout.view.command.ScrollToAnchorAction = Scroll to anchor action
com.top_logic.layout.view.command.ScrollToAnchorAction.Config.target = Target
com.top_logic.layout.view.command.ScrollToAnchorAction.Config.target.tooltip = TL-Script function computing the scroll target from the chain's current input value: input -> target. <p> The result is a model object (scrolled to by its anchor id) or a string (a literal anchor name). When unset, the chain's input value is used as the target directly. </p>
com.top_logic.layout.view.command.ScrollToAnchorAction.tooltip = <i>View action</i> that scrolls the browser to an &lt;anchor&gt;, computing the target dynamically. <p> The target is a model object - scrolled to by its anchor id - or a string naming a fixed anchor. Placed in a command chain, e.g. a reply command that brings the new-element editor into view: </p> <pre> &lt;generic-command&gt; ... prepare the reply ... &lt;scroll-to-anchor target="'composer'"/&gt; &lt;/generic-command&gt; </pre>
com.top_logic.layout.view.command.SetThemeCommand = Set theme command
com.top_logic.layout.view.command.SetThemeCommand.Config.theme = Theme
com.top_logic.layout.view.command.SetThemeCommand.Config.theme.tooltip = Id of the theme to activate. <p> Without a theme, the command drops the theme the user has selected, so that the user's pages follow the appearance preference of the operating system. </p>
com.top_logic.layout.view.command.SetThemeCommand.tooltip = A <i>view command</i> that puts a UI theme into effect. <p> Stores the theme as the user's preference and applies it on the client instantly, without a page reload. A command naming no theme drops the preference, which leaves the user's pages following the appearance preference of the operating system. </p>
com.top_logic.layout.view.command.StoreFormStateAction = Store form state action
com.top_logic.layout.view.command.StoreFormStateAction.tooltip = <i>View action</i> that validates the form, reveals all errors, and applies edits to the base object. <p> On execution: </p> <ol> <li>Reveals all field validation errors (sets revealed = true on all fields).</li> <li>If the form has validation errors, throws a <i>TopLogic exception</i> to abort the action chain and display the error in the snackbar.</li> <li>Otherwise, applies overlay edits to the base object and returns it.</li> </ol>
com.top_logic.layout.view.command.SwitchAction = Switch action
com.top_logic.layout.view.command.SwitchAction$CaseConfig = Case configuration
com.top_logic.layout.view.command.SwitchAction$CaseConfig.tooltip = Configuration of a single <case> of a <i>switch action</i>. <p> A case configures exactly one of match and test. </p>
com.top_logic.layout.view.command.SwitchAction.CaseConfig.actions = Actions
com.top_logic.layout.view.command.SwitchAction.CaseConfig.actions.tooltip = The actions to run when this case matches; none to pass the chain's value through.
com.top_logic.layout.view.command.SwitchAction.CaseConfig.match = Match
com.top_logic.layout.view.command.SwitchAction.CaseConfig.match.tooltip = TL-Script expression without parameters computing the value this case stands for. <p> The case matches when the switch value is equal to this value in the sense of the TL-Script comparison, so a classifier is written as `module:Enumeration#literal`, a text as 'text' and a number as the number it is. The expression is evaluated whenever the switch decides, so it may also compute the value from the application's state. </p>
com.top_logic.layout.view.command.SwitchAction.CaseConfig.test = Test
com.top_logic.layout.view.command.SwitchAction.CaseConfig.test.tooltip = TL-Script predicate called with the switch value; this case matches when it holds. <p> The result is taken as a condition in the fuzzy sense of TL-Script, so a plain object stands for a true condition and nothing - null, an empty list, an empty text - for a false one. Use it for a case that cannot be written as a single value, such as a range or a test for emptiness; a case standing for one value is written as match. </p>
com.top_logic.layout.view.command.SwitchAction.Config.cases = Cases
com.top_logic.layout.view.command.SwitchAction.Config.cases.tooltip = The cases, compared in order; the first matching one runs.
com.top_logic.layout.view.command.SwitchAction.Config.default = Default
com.top_logic.layout.view.command.SwitchAction.Config.default.tooltip = The actions to run when no case matches; none to pass the chain's value through.
com.top_logic.layout.view.command.SwitchAction.Config.value = Value
com.top_logic.layout.view.command.SwitchAction.Config.value.tooltip = TL-Script function computing the value the cases decide on. <p> Called with the inputs channel values as leading positional arguments, followed by the chain's current value as the last argument. Without such a function, the chain's current value is the value the cases decide on. </p>
com.top_logic.layout.view.command.SwitchAction.tooltip = <i>View action</i> that chooses one of several chains of actions by a value computed from the current value of the enclosing chain. <p> The switch value is what the cases decide on: the result of the switch's value function, or the chain's current value itself when no such function is configured. A case either names the value it stands for with match - a TL-Script expression without parameters, compared to the switch value with the equality of TL-Script, so a classifier, a text and a number are all written as the literal they are - or decides with a predicate test called with the switch value and read as a condition in the fuzzy sense of TL-Script. Each case configures exactly one of the two. </p> <p> The cases are compared in configuration order and the first matching one runs; when none matches, the default runs. The chosen chain runs as a nested chain of the enclosing one: it starts with the current value and its last action's result becomes the value the enclosing chain continues with. A case without actions, a default without actions, and a value matching neither a case nor a configured default all pass the value through unchanged. An abort inside a case - a declined <i>confirm action</i> - aborts the whole command, and a compensation registered inside a case runs on the command's abort like one registered beside the switch. </p> <p> Example: close an open ticket and reopen a closed one, in one command: </p> <pre> &lt;switch value="t -&gt; $t.get(`demo.tickets:Ticket#status`)"&gt; &lt;case match="`demo.tickets:TicketStatus#closed`"&gt; &lt;with-transaction&gt; &lt;execute-script function="t -&gt; $t.set(`demo.tickets:Ticket#status`, `demo.tickets:TicketStatus#open`)"/&gt; &lt;/with-transaction&gt; &lt;/case&gt; &lt;default&gt; &lt;with-transaction&gt; &lt;execute-script function="t -&gt; $t.set(`demo.tickets:Ticket#status`, `demo.tickets:TicketStatus#closed`)"/&gt; &lt;/with-transaction&gt; &lt;/default&gt; &lt;/switch&gt; </pre> <p> Example: decide on the chain's own value with a literal and with a predicate: </p> <pre> &lt;switch&gt; &lt;case test="s -&gt; $s == null"&gt; &lt;execute-script function="x -&gt; new(`demo.tickets:Ticket`, transient: true)"/&gt; &lt;/case&gt; &lt;case match="'closed'"&gt; &lt;write-channel name="closedTicket"/&gt; &lt;/case&gt; &lt;/switch&gt; </pre>
com.top_logic.layout.view.command.ThemeCommands = Theme commands
com.top_logic.layout.view.command.ThemeCommands.tooltip = The commands offering the user a UI theme to switch to: one per configured theme, headed by an entry following the appearance preference of the operating system. <p> The set follows <i>UI themes</i>, so an application offers its own themes by configuring them and needs no view change; the label and icon of a theme entry are the ones the theme declares. The head entry appears wherever the light and the dark preference of the operating system are answered by different themes, and selects none of the themes: it drops the user's stored choice, leaving the appearance to the operating system. </p> <p> The entry describing what the user sees is marked as the active one, so the menu shows the current appearance among the alternatives on offer. It stays executable: applying the appearance already in force is a no-op the user cannot get wrong. An application with a single configured theme has nothing to switch to and gets no entries at all. </p> <p> This is what a single <i>set theme command</i> cannot do: that command names one static theme id, so a view using it has to spell out every theme it knows and can never tell which is active. </p>
com.top_logic.layout.view.command.UploadCommand = Upload command
com.top_logic.layout.view.command.UploadCommand.Config.accept = Accept
com.top_logic.layout.view.command.UploadCommand.Config.accept.tooltip = The accept filter for the native file input (e.g. "image/*,.pdf"). <p> Defaults to "*" (no restriction). Client-side hint only. </p>
com.top_logic.layout.view.command.UploadCommand.Config.actions = Actions
com.top_logic.layout.view.command.UploadCommand.Config.actions.tooltip = The chain of actions to execute once per uploaded file (the file is the chain input).
com.top_logic.layout.view.command.UploadCommand.Config.multiple = Multiple
com.top_logic.layout.view.command.UploadCommand.Config.multiple.tooltip = Whether multiple files may be selected at once.
com.top_logic.layout.view.command.UploadCommand.tooltip = A <i>view command</i> rendered as a toolbar button that, on click, opens a native file picker and uploads the selected file(s) directly - without an intermediate dialog. <p> The configured action chain (e.g. <confirm> + <with-transaction><execute-script>) runs <em>once per uploaded file</em>, sequentially, with the uploaded file (a <i>binary data</i>) as the chain's input value. Container/context values are threaded into the actions via their <inputs> channel references, exactly as for a <generic-command>. </p> <p> The per-file orchestration lives in <i>view upload command model</i>; the click itself does not dispatch a server command. </p>
com.top_logic.layout.view.command.ViewCommand.Config.check-dirty = Check dirty
com.top_logic.layout.view.command.ViewCommand.Config.check-dirty.tooltip = Scope of the dirty check to perform before executing this command.
com.top_logic.layout.view.command.ViewCommand.Config.clique = Clique
com.top_logic.layout.view.command.ViewCommand.Config.clique.tooltip = The clique name for grouping related commands.
com.top_logic.layout.view.command.ViewCommand.Config.css-classes = Css classes
com.top_logic.layout.view.command.ViewCommand.Config.css-classes.tooltip = Additional CSS classes to apply to the command's UI element.
com.top_logic.layout.view.command.ViewCommand.Config.display = Display
com.top_logic.layout.view.command.ViewCommand.Config.display.tooltip = How this command's button displays icon and label, e.g. icon-only for a compact icon button whose label becomes the tooltip. <p> If not set, the default of the enclosing command scope applies, and without one the button shows the icon (when configured) together with the label. </p>
com.top_logic.layout.view.command.ViewCommand.Config.executability = Executability
com.top_logic.layout.view.command.ViewCommand.Config.executability.tooltip = Rules that determine when this command is executable.
com.top_logic.layout.view.command.ViewCommand.Config.image = Image
com.top_logic.layout.view.command.ViewCommand.Config.image.tooltip = The icon displayed for this command.
com.top_logic.layout.view.command.ViewCommand.Config.input = Input
com.top_logic.layout.view.command.ViewCommand.Config.input.tooltip = Reference to a channel whose value is passed as input to the command.
com.top_logic.layout.view.command.ViewCommand.Config.key = Key
com.top_logic.layout.view.command.ViewCommand.Config.key.tooltip = The keyboard gesture that triggers this command, written as a key optionally prefixed with modifiers, e.g. "Enter", "Escape", "Ctrl+S" or "Shift+ArrowDown". <p> When unset, dialogs derive conventional defaults: the sole or primary button-bar command answers Enter, and the dialog's cancel action answers Escape. </p>
com.top_logic.layout.view.command.ViewCommand.Config.label = Label
com.top_logic.layout.view.command.ViewCommand.Config.label.tooltip = The user-visible label for this command.
com.top_logic.layout.view.command.ViewCommand.Config.name = Name
com.top_logic.layout.view.command.ViewCommand.Config.name.tooltip = The programmatic name of this command. <p> Used for referencing the command in scripts and tests. If not set, the command can only be invoked through the UI. </p>
com.top_logic.layout.view.command.ViewCommand.Config.observed-types = Observed types
com.top_logic.layout.view.command.ViewCommand.Config.observed-types.tooltip = Types whose object changes (create / update / delete) trigger a re-evaluation of the executability, in addition to the input object, which is always observed. <p> Configure this only for a rule that navigates beyond the input object, e.g. one deciding by an attribute of the input's container: a change of that other object is invisible to the input's own observation. Empty (default) observes just the input object. </p>
com.top_logic.layout.view.command.ViewCommand.Config.placement = Placement
com.top_logic.layout.view.command.ViewCommand.Config.placement.tooltip = Where to render this command in the UI.
com.top_logic.layout.view.command.ViewCommand.Config.tooltip = Tooltip
com.top_logic.layout.view.command.ViewCommand.Config.tooltip.tooltip = The tooltip shown on hover for this command's button.
com.top_logic.layout.view.command.ViewCommandSource.Config.label = Label
com.top_logic.layout.view.command.ViewCommandSource.Config.label.tooltip = The heading a menu shows above this source's entries. <p> Unset, the source's own heading applies - the one naming the kind of choice it offers. </p>
com.top_logic.layout.view.command.VisibleIf = Visible if
com.top_logic.layout.view.command.VisibleIf.Config.expr = Expression
com.top_logic.layout.view.command.VisibleIf.Config.expr.tooltip = TL-Script predicate function called with the command's current input value; the command is shown when it returns true.
com.top_logic.layout.view.command.VisibleIf.tooltip = <i>View executability rule</i> that shows a command only while a configured TL-Script predicate, evaluated on the command's input, returns true; otherwise the command is hidden. <p> A reusable, condition-driven alternative to the fixed <i>null input hidden</i> / <i>anonymous only</i> rules: bind the command's input to the channel the predicate inspects, so the toolbar re-evaluates the rule whenever that channel changes. Example - show only while a boolean running channel is set: <visible-if expr="x -> $x == true"/>. </p>
com.top_logic.layout.view.command.WithTransactionAction = With transaction action
com.top_logic.layout.view.command.WithTransactionAction.Config.actions = Actions
com.top_logic.layout.view.command.WithTransactionAction.Config.actions.tooltip = Inner actions to execute within the transaction.
com.top_logic.layout.view.command.WithTransactionAction.tooltip = <i>View action</i> that wraps inner actions in a KB transaction. <p> All inner actions execute within the same transaction. If any action throws, the transaction is rolled back. The result of the last inner action is returned. </p> <p> Inner actions must complete synchronously: an action may not suspend (e.g. a <i>confirm action</i>) inside a transaction, since that would hold the transaction open across an asynchronous wait. Such a configuration fails fast with a clear error - place the guard <em>before</em> the <with-transaction> instead. </p> <p> Example: Copy a transient object to persistent within a transaction: </p> <pre> &lt;with-transaction&gt; &lt;execute-script function="obj -&gt; $obj.copy(transient: false)"/&gt; &lt;/with-transaction&gt; </pre>
com.top_logic.layout.view.command.WriteChannelAction = Write channel action
com.top_logic.layout.view.command.WriteChannelAction.Config.name = Name
com.top_logic.layout.view.command.WriteChannelAction.Config.name.tooltip = Name of the channel to write to.
com.top_logic.layout.view.command.WriteChannelAction.tooltip = <i>View action</i> that writes the input value to a named channel. <p> Passes the input through as output so the chain can continue. </p> <p> A form displaying the channel value vetoes the write while it holds unsaved changes. The action then asks the user how to proceed and continues the chain with the answer: after saving or discarding those changes the write is retried, on cancel the channel keeps its value. Either way the chain runs on, so the actions following the write (e.g. closing the dialog whose command wrote the channel) still happen. </p>
com.top_logic.layout.view.designer.ConfigEditorElement = Configuration editor element
com.top_logic.layout.view.designer.ConfigEditorElement.Config.input = Input
com.top_logic.layout.view.designer.ConfigEditorElement.Config.input.tooltip = Reference to the channel providing the currently selected <i>design tree node</i>.
com.top_logic.layout.view.designer.ConfigEditorElement.tooltip = A <i>UI element</i> that renders a config-editor form for the selected <i>design tree node</i>. <p> Reads a <i>design tree node</i> from an input channel and renders a <i>configuration editor control</i> for its configuration properties. When the selection changes, the editor is rebuilt to reflect the newly selected node. </p>
com.top_logic.layout.view.designer.DesignerTreeElement = Designer tree element
com.top_logic.layout.view.designer.DesignerTreeElement.Config.input = Input
com.top_logic.layout.view.designer.DesignerTreeElement.Config.input.tooltip = Reference to the channel providing the root <i>design tree node</i>.
com.top_logic.layout.view.designer.DesignerTreeElement.Config.selection = Selection
com.top_logic.layout.view.designer.DesignerTreeElement.Config.selection.tooltip = Optional reference to a channel that receives the selected <i>design tree node</i>.
com.top_logic.layout.view.designer.DesignerTreeElement.tooltip = A <i>UI element</i> that builds a <i>react tree control</i> from a <i>design tree node</i> hierarchy. <p> Unlike <i>tree element</i>, which uses TL-Script expressions to compute children, this element reads the tree structure directly from the <i>design tree node</i> model. The input channel provides the root <i>design tree node</i>, and the selection channel receives the currently selected node. </p>
com.top_logic.layout.view.designer.MoveElementCommand$Direction = Direction
com.top_logic.layout.view.designer.MoveElementCommand$Direction.tooltip = Direction constants for moving a node.
com.top_logic.layout.view.designer.MoveElementCommand.Direction.DOWN = Down
com.top_logic.layout.view.designer.MoveElementCommand.Direction.DOWN.tooltip = Move the node one position later in its container.
com.top_logic.layout.view.designer.MoveElementCommand.Direction.UP = Up
com.top_logic.layout.view.designer.MoveElementCommand.Direction.UP.tooltip = Move the node one position earlier in its container.
com.top_logic.layout.view.designer.OpenDesignerCommand = Open designer command
com.top_logic.layout.view.designer.OpenDesignerCommand.tooltip = A <i>view command</i> that opens the View Designer in a new browser window. <p> Loads the designer view from /WEB-INF/views/designer.view.xml, builds the <i>design tree node</i> tree from the application's default root view, and opens it in a new window via the <i>react window registry</i>. </p>
com.top_logic.layout.view.designer.RevertDesignCommand = Revert design command
com.top_logic.layout.view.designer.RevertDesignCommand.Config.design-tree = Design tree
com.top_logic.layout.view.designer.RevertDesignCommand.Config.design-tree.tooltip = Reference to the channel containing the root <i>design tree node</i>. <p> After revert, the freshly built tree root is set on this channel, triggering a full rebuild of the designer tree UI. </p>
com.top_logic.layout.view.designer.RevertDesignCommand.Config.selection = Selection
com.top_logic.layout.view.designer.RevertDesignCommand.Config.selection.tooltip = Optional reference to a selection channel to clear on revert. <p> If configured, this channel is set to null so that any previously selected node (which no longer exists in the new tree) is deselected. </p>
com.top_logic.layout.view.designer.RevertDesignCommand.tooltip = A <i>view command</i> that discards all in-memory modifications to the design tree and reloads it from disk. <p> Reads the application's default view path from <i>view configuration</i>, rebuilds the <i>design tree node</i> tree using <i>design tree builder</i>, and sets it on the configured design-tree channel. This causes the <i>designer tree element</i> to rebuild its tree from the new root. Optionally clears the selection channel. </p>
com.top_logic.layout.view.designer.SaveDesignCommand = Save design command
com.top_logic.layout.view.designer.SaveDesignCommand.Config.design-tree = Design tree
com.top_logic.layout.view.designer.SaveDesignCommand.Config.design-tree.tooltip = Reference to the channel containing the root <i>design tree node</i>.
com.top_logic.layout.view.designer.SaveDesignCommand.tooltip = A <i>view command</i> that serializes modified <i>configuration</i> trees back to .view.xml files. <p> Reads the root <i>design tree node</i> from the configured channel, traverses the tree to collect all unique source files, and writes each modified <i>configuration</i> back to disk. The <i>view loader</i> cache auto-invalidates via timestamps on next access. </p>
com.top_logic.layout.view.designer.SelectViewCommand = Select view command
com.top_logic.layout.view.designer.SelectViewCommand.Config.design-tree = Design tree
com.top_logic.layout.view.designer.SelectViewCommand.Config.design-tree.tooltip = Reference to the channel containing the root <i>design tree node</i>.
com.top_logic.layout.view.designer.SelectViewCommand.Config.selection = Selection
com.top_logic.layout.view.designer.SelectViewCommand.Config.selection.tooltip = Reference to the channel receiving the selected <i>design tree node</i>.
com.top_logic.layout.view.designer.SelectViewCommand.tooltip = Toolbar command that starts "select view" mode in the main application window. The user then clicks a view there; the matching design-tree node is selected in the designer.
com.top_logic.layout.view.element.AbstractMenuElement = Menu element
com.top_logic.layout.view.element.AbstractMenuElement$Config$CommandGroup = Command group
com.top_logic.layout.view.element.AbstractMenuElement$Config$CommandGroup.tooltip = A group of menu entries, separated from the groups around it.
com.top_logic.layout.view.element.AbstractMenuElement.Config.CommandGroup.commands = Commands
com.top_logic.layout.view.element.AbstractMenuElement.Config.CommandGroup.commands.tooltip = The commands offered as this group's entries.
com.top_logic.layout.view.element.AbstractMenuElement.Config.CommandGroup.label = Label
com.top_logic.layout.view.element.AbstractMenuElement.Config.CommandGroup.label.tooltip = The heading shown above the group's entries; none when unset.
com.top_logic.layout.view.element.AbstractMenuElement.Config.command-sources = Command sources
com.top_logic.layout.view.element.AbstractMenuElement.Config.command-sources.tooltip = Sources of further entries, whose commands are not written in the view but derived at runtime. <p> Their entries follow the ones declared in <i>Commands</i>, each source's in the order it supplies them. </p>
com.top_logic.layout.view.element.AbstractMenuElement.Config.groups = Groups
com.top_logic.layout.view.element.AbstractMenuElement.Config.groups.tooltip = Further groups of entries, each set off from the one before it by a separator and headed by its label where it has one. <p> The entries declared in <i>Commands</i> are the first group; these follow it, and the sources follow them. A group none of whose entries are currently available is left out together with its separator and heading, so a menu never opens on a dividing line with nothing beneath it. </p>
com.top_logic.layout.view.element.AbstractMenuElement.Config.input = Input
com.top_logic.layout.view.element.AbstractMenuElement.Config.input.tooltip = Optional reference to an existing channel that carries the menu target value. <p> When unset, a new <code>"contextTarget"</code> channel is registered on the current context and used as the target channel of the built <i>context menu contribution</i>. </p>
com.top_logic.layout.view.element.AbstractMenuElement.tooltip = Base for <i>UI elements</i> that offer their commands as entries of a popup menu instead of buttons. <p> The element's children are its menu region: the DOM they render is what the user acts on to open the menu. The commands become a single <i>context menu contribution</i> bound to a target channel, and the enclosing frame's <i>context menu opener</i> renders and dispatches them. </p>
com.top_logic.layout.view.element.AdaptiveDetailElement = Adaptive detail element
com.top_logic.layout.view.element.AdaptiveDetailElement.Config.detail = Detail
com.top_logic.layout.view.element.AdaptiveDetailElement.Config.detail-display = Detail display
com.top_logic.layout.view.element.AdaptiveDetailElement.Config.detail-display.tooltip = How the detail is presented beside the selector on a wide viewport: dividing the width with it in a split, or overlaying it in a drawer that leaves the selector at full width. <p> On a narrow viewport the detail replaces the selector either way. </p>
com.top_logic.layout.view.element.AdaptiveDetailElement.Config.detail-size = Detail size
com.top_logic.layout.view.element.AdaptiveDetailElement.Config.detail-size.tooltip = The width in pixels of the drawer the detail is displayed in. <p> The drawer never grows wider than the element it overlays, so a value exceeding the available width yields a drawer covering the selector completely. Without a drawer display the value has no effect. </p>
com.top_logic.layout.view.element.AdaptiveDetailElement.Config.detail.tooltip = The detail content bound to the selection channel.
com.top_logic.layout.view.element.AdaptiveDetailElement.Config.home-label = Home label
com.top_logic.layout.view.element.AdaptiveDetailElement.Config.home-label.tooltip = Label of the breadcrumb's home crumb (the one that returns to the empty selector). <p> Only meaningful on the outermost <adaptive-detail>: in compact mode it renders a single breadcrumb spanning all nested levels (home > selected-master > selected-detail ...); tapping a crumb clears the selections from that level down. Nested elements contribute their selected object's label and do not render a breadcrumb of their own. </p>
com.top_logic.layout.view.element.AdaptiveDetailElement.Config.reset-on = Reset on
com.top_logic.layout.view.element.AdaptiveDetailElement.Config.reset-on.tooltip = Channels on which this element's selection depends; whenever one of them changes, the selection is reset to null. <p> Use this when the selectable rows derive from an upstream selection (the typical nested, cascading master-detail): e.g. a milestone selection is only meaningful within a project scope, so reset-on="selectedScope" clears the milestone when the scope changes - regardless of whether the milestone selector is currently displayed (in compact mode it is disposed once drilled past, so a value left in the channel would otherwise resurface under the new scope). </p>
com.top_logic.layout.view.element.AdaptiveDetailElement.Config.selection = Selection
com.top_logic.layout.view.element.AdaptiveDetailElement.Config.selection.tooltip = The channel carrying the object selected in the selector and displayed by the detail.
com.top_logic.layout.view.element.AdaptiveDetailElement.Config.selector = Selector
com.top_logic.layout.view.element.AdaptiveDetailElement.Config.selector.tooltip = The master content (e.g. a <table> or <tree>) that writes the selection channel.
com.top_logic.layout.view.element.AdaptiveDetailElement.tooltip = Responsive master-detail element that presents the same configuration differently depending on the client's display class. <p> The element holds a <selector> (the master, e.g. a table or tree that writes the selection channel) and a <detail> (bound to the same channel) exactly once, and presents the two in one of three ways: </p> <ul> <li>On a wide (REGULAR) viewport with a <i>split</i> display, both stand side by side in a draggable split.</li> <li>On a wide viewport with a <i>drawer</i> display, the selector keeps the full width and the detail overlays it from the right edge, in a panel as wide as <code>"detail-size"</code> says, appearing with the selection and dismissed by clearing it.</li> <li>On a narrow (COMPACT) viewport, whichever display is configured, the selector is shown full-bleed and is replaced by the detail once something is selected (with a back affordance to clear the selection).</li> </ul> <p> Because a <detail> may itself contain another <adaptive-detail>, multi-step selection paths compose: cascading columns on wide screens, step-by-step drill-in on narrow ones - all from a single configuration. </p>
com.top_logic.layout.view.element.AnchorElement = Anchor element
com.top_logic.layout.view.element.AnchorElement.Config.content = Content
com.top_logic.layout.view.element.AnchorElement.Config.content.tooltip = The wrapped content.
com.top_logic.layout.view.element.AnchorElement.Config.input = Input
com.top_logic.layout.view.element.AnchorElement.Config.input.tooltip = Channel providing the object this anchor marks; the anchor key is the object's anchor id. Mutually exclusive with <i>Name</i>.
com.top_logic.layout.view.element.AnchorElement.Config.name = Name
com.top_logic.layout.view.element.AnchorElement.Config.name.tooltip = Literal anchor key for a fixed region without a model object. Mutually exclusive with <i>Input</i>.
com.top_logic.layout.view.element.AnchorElement.tooltip = Declarative <i>UI element</i> that wraps its content in a scroll anchor. <p> The anchor is keyed either by an object from the input channel (its anchor id) or by a literal name for a fixed region without a model object. A &lt;scroll-link&gt; or a <scroll-to-anchor> action targeting the same key scrolls the browser here - e.g. wrap each comment card in <anchor input="comment"> to jump to a cited comment, or the new comment editor in <anchor name="composer"> to bring it into view on reply. </p>
com.top_logic.layout.view.element.AppBarElement = App bar element
com.top_logic.layout.view.element.AppBarElement.Config.children = Children
com.top_logic.layout.view.element.AppBarElement.Config.children.tooltip = Arbitrary inline children rendered between the title and the actions area. <p> Typically a single <slot> that lets deeper views project content into the app bar (e.g. a breadcrumb or a context-specific control group), but any UIElement can be placed here. </p>
com.top_logic.layout.view.element.AppBarElement.Config.commands = Commands
com.top_logic.layout.view.element.AppBarElement.Config.commands.tooltip = Commands to render in the app bar's actions area. <p> Commands with TOOLBAR placement become the buttons of the bar's actions toolbar, grouped by clique. The toolbar shows icon and label side by side while the bar is wide enough, drops the labels when it is not, and folds the commands that still do not fit into an overflow menu. </p>
com.top_logic.layout.view.element.AppBarElement.Config.leading = Leading
com.top_logic.layout.view.element.AppBarElement.Config.leading.tooltip = Elements rendered in the leading slot before the title (e.g. a mobile drawer-toggle button contributed via <slot name="appbar-leading"/>). <p> Typically a single <slot> placeholder; if multiple elements are configured, they render in the order given inside the leading area. </p>
com.top_logic.layout.view.element.AppBarElement.Config.title = Title
com.top_logic.layout.view.element.AppBarElement.Config.title.tooltip = The bar title.
com.top_logic.layout.view.element.AppBarElement.Config.trailing = Trailing
com.top_logic.layout.view.element.AppBarElement.Config.trailing.tooltip = Elements closing the bar, right of the actions area (e.g. the account area). <p> This is the right end of the bar, past the buttons of toolbar-placed commands. Several elements render side by side in the order given. </p>
com.top_logic.layout.view.element.AppBarElement.Config.variant = Variant
com.top_logic.layout.view.element.AppBarElement.Config.variant.tooltip = The visual variant.
com.top_logic.layout.view.element.AppBarElement.tooltip = UIElement that wraps <i>react app bar control</i>. <p> Renders a top-level application bar with a title and optional variant/color configuration. Commands configured in the <commands> section with TOOLBAR placement form the bar's actions toolbar, which folds the commands that do not fit into an overflow menu at its trailing end. </p>
com.top_logic.layout.view.element.AppShellElement = App shell element
com.top_logic.layout.view.element.AppShellElement.Config.content = Content
com.top_logic.layout.view.element.AppShellElement.Config.content.tooltip = The main content element.
com.top_logic.layout.view.element.AppShellElement.Config.footer = Footer
com.top_logic.layout.view.element.AppShellElement.Config.footer.tooltip = Optional footer element (e.g. a bottom bar).
com.top_logic.layout.view.element.AppShellElement.Config.header = Header
com.top_logic.layout.view.element.AppShellElement.Config.header.tooltip = Optional header element (e.g. an app bar).
com.top_logic.layout.view.element.AppShellElement.Config.notices = Notices
com.top_logic.layout.view.element.AppShellElement.Config.notices.tooltip = Optional system-wide notices displayed between header and content. <p> Holds elements that announce a state of the whole application rather than of any single view, e.g. a <maintenance-notice/>. Each of them decides for itself whether it has anything to say; the area occupies no space while all of them stay silent. </p>
com.top_logic.layout.view.element.AppShellElement.tooltip = UIElement that wraps <i>react app shell control</i>. <p> Provides four slots: an optional header, an optional notice area, a mandatory content area, and an optional footer. Slot properties use list types so that @TagName resolution works (e.g. <stack> inside <content>). If multiple elements are configured in a slot, they are wrapped in a <i>react stack control</i>. </p>
com.top_logic.layout.view.element.AvatarElement = Avatar element
com.top_logic.layout.view.element.AvatarElement.Config.image = Image
com.top_logic.layout.view.element.AvatarElement.Config.image.tooltip = Channel whose value is the picture shown instead of the initials. <p> The value is either picture data (content type "image/...") or a text naming the address the picture is loaded from. Any other value - a person without a photo, an unrelated object - leaves the initials. The picture follows the channel, so a photo replaced elsewhere is shown without the avatar being built anew. </p>
com.top_logic.layout.view.element.AvatarElement.Config.input = Input
com.top_logic.layout.view.element.AvatarElement.Config.input.tooltip = Channel whose value is displayed; the avatar derives initials and category color from the value's label.
com.top_logic.layout.view.element.AvatarElement.Config.size = Size
com.top_logic.layout.view.element.AvatarElement.Config.size.tooltip = Diameter of the circle: sm, md (the default), lg or xl.
com.top_logic.layout.view.element.AvatarElement.tooltip = Declarative <i>UI element</i> displaying a channel's value (e.g. a person) as a circular avatar. <p> The circle shows the picture of the one it represents. Where there is none, it is filled with the initials of the value's label over a background color derived from that label. </p>
com.top_logic.layout.view.element.BottomBarElement = Bottom bar element
com.top_logic.layout.view.element.BottomBarElement$ItemConfig = Item configuration
com.top_logic.layout.view.element.BottomBarElement$ItemConfig.tooltip = Configuration for a single bottom bar item.
com.top_logic.layout.view.element.BottomBarElement.Config.active-item = Active item
com.top_logic.layout.view.element.BottomBarElement.Config.active-item.tooltip = The ID of the initially active item.
com.top_logic.layout.view.element.BottomBarElement.Config.items = Items
com.top_logic.layout.view.element.BottomBarElement.Config.items.tooltip = The navigation items.
com.top_logic.layout.view.element.BottomBarElement.ItemConfig.icon = Icon
com.top_logic.layout.view.element.BottomBarElement.ItemConfig.icon.tooltip = The CSS icon class (e.g. "bi bi-speedometer2").
com.top_logic.layout.view.element.BottomBarElement.ItemConfig.id = ID
com.top_logic.layout.view.element.BottomBarElement.ItemConfig.id.tooltip = The item identifier.
com.top_logic.layout.view.element.BottomBarElement.ItemConfig.label = Label
com.top_logic.layout.view.element.BottomBarElement.ItemConfig.label.tooltip = The display label.
com.top_logic.layout.view.element.BottomBarElement.tooltip = UIElement that wraps <i>react bottom bar control</i>. <p> Renders a bottom navigation bar with icon items. Since this is a declarative element without server-side command handling, item selection is currently visual only. </p>
com.top_logic.layout.view.element.ButtonElement = Button element
com.top_logic.layout.view.element.ButtonElement.Config.action = Action
com.top_logic.layout.view.element.ButtonElement.Config.action.tooltip = The command this button executes. <p> Configured as <action class="..." .../> inside the <button> element. </p>
com.top_logic.layout.view.element.ButtonElement.Config.appearance = Appearance
com.top_logic.layout.view.element.ButtonElement.Config.appearance.tooltip = Button appearance (e.g. <i>Link</i> to render as an inline text link).
com.top_logic.layout.view.element.ButtonElement.Config.size = Size
com.top_logic.layout.view.element.ButtonElement.Config.size.tooltip = Button size.
com.top_logic.layout.view.element.ButtonElement.tooltip = A <i>UI element</i> that renders a button executing a <i>view command</i>. <p> The command is configured inline within the <button> element. The <i>view command model</i> bridging it to the UI - with the command's input channel resolved and its executability rules built - comes from the construction path every command-hosting element shares. </p>
com.top_logic.layout.view.element.CalendarElement = Calendar element
com.top_logic.layout.view.element.CalendarElement$EventConfig = Event configuration
com.top_logic.layout.view.element.CalendarElement$EventConfig.tooltip = The per-field expressions deriving a calendar event from a business object. Each is a single-argument function receiving the object.
com.top_logic.layout.view.element.CalendarElement.Config.day-end-hour = Day end hour
com.top_logic.layout.view.element.CalendarElement.Config.day-end-hour.tooltip = The hour after the last working hour highlighted in the time grid.
com.top_logic.layout.view.element.CalendarElement.Config.day-start-hour = Day start hour
com.top_logic.layout.view.element.CalendarElement.Config.day-start-hour.tooltip = The first working hour highlighted in the time grid.
com.top_logic.layout.view.element.CalendarElement.Config.editable = Editable
com.top_logic.layout.view.element.CalendarElement.Config.editable.tooltip = Whether the user may edit events by dragging.
com.top_logic.layout.view.element.CalendarElement.Config.event = Event
com.top_logic.layout.view.element.CalendarElement.Config.event.tooltip = The per-field expressions deriving a calendar event from a business object.
com.top_logic.layout.view.element.CalendarElement.Config.granularity = Granularity
com.top_logic.layout.view.element.CalendarElement.Config.granularity.tooltip = The initially displayed granularity.
com.top_logic.layout.view.element.CalendarElement.Config.objects = Objects
com.top_logic.layout.view.element.CalendarElement.Config.objects.tooltip = TL-Script function computing the business objects shown as events (a <i>collection</i>). <p> The values of the declared inputs come first, in declaration order. </p>
com.top_logic.layout.view.element.CalendarElement.Config.observed-types = Observed types
com.top_logic.layout.view.element.CalendarElement.Config.observed-types.tooltip = Types whose object changes (create / update / delete) trigger a re-evaluation of the objects, so the calendar refreshes automatically.
com.top_logic.layout.view.element.CalendarElement.Config.on-create = On create
com.top_logic.layout.view.element.CalendarElement.Config.on-create.tooltip = Write-back function <code>start, end, allDay, title -&gt; object</code> applied when the user selects an empty slot and confirms the title typed into the calendar. Without it, creation is disabled.
com.top_logic.layout.view.element.CalendarElement.Config.on-move = On move
com.top_logic.layout.view.element.CalendarElement.Config.on-move.tooltip = Write-back function <code>object, newStart, newEnd -&gt; …</code> applied when the user drag-moves an event. Without it, moving is disabled.
com.top_logic.layout.view.element.CalendarElement.Config.on-resize = On resize
com.top_logic.layout.view.element.CalendarElement.Config.on-resize.tooltip = Write-back function <code>object, newEnd -&gt; …</code> applied when the user resizes an event. Without it, resizing is disabled.
com.top_logic.layout.view.element.CalendarElement.Config.range-end = Range end
com.top_logic.layout.view.element.CalendarElement.Config.range-end.tooltip = Optional <i>view channel</i> the control writes the displayed interval's exclusive end to. Effective only together with <i>Range start</i>.
com.top_logic.layout.view.element.CalendarElement.Config.range-start = Range start
com.top_logic.layout.view.element.CalendarElement.Config.range-start.tooltip = Optional <i>view channel</i> the control writes the displayed interval's inclusive start to, so a supplier can load only the visible window's events. Effective only together with <i>Range end</i>.
com.top_logic.layout.view.element.CalendarElement.Config.selection = Selection
com.top_logic.layout.view.element.CalendarElement.Config.selection.tooltip = Optional <i>view channel</i> to write the selected event's business object to.
com.top_logic.layout.view.element.CalendarElement.EventConfig.all-day = All day
com.top_logic.layout.view.element.CalendarElement.EventConfig.all-day.tooltip = Function computing whether the event spans whole days. Without it, events are timed.
com.top_logic.layout.view.element.CalendarElement.EventConfig.category = Category
com.top_logic.layout.view.element.CalendarElement.EventConfig.category.tooltip = Function computing the event's category key, which selects its color.
com.top_logic.layout.view.element.CalendarElement.EventConfig.color = Color
com.top_logic.layout.view.element.CalendarElement.EventConfig.color.tooltip = Function computing the event's CSS color, taking precedence over the color that the category key selects. A value of the model type <code>tl.util:Color</code> is accepted directly.
com.top_logic.layout.view.element.CalendarElement.EventConfig.end = End
com.top_logic.layout.view.element.CalendarElement.EventConfig.end.tooltip = Function computing the event's end time (a date). Without it, events last one hour.
com.top_logic.layout.view.element.CalendarElement.EventConfig.movable = Movable
com.top_logic.layout.view.element.CalendarElement.EventConfig.movable.tooltip = Function computing whether the event may be moved. Without it, events are movable.
com.top_logic.layout.view.element.CalendarElement.EventConfig.resizable = Resizable
com.top_logic.layout.view.element.CalendarElement.EventConfig.resizable.tooltip = Function computing whether the event may be resized. Without it, events are resizable.
com.top_logic.layout.view.element.CalendarElement.EventConfig.start = Start
com.top_logic.layout.view.element.CalendarElement.EventConfig.start.tooltip = Function computing the event's start time (a date), required.
com.top_logic.layout.view.element.CalendarElement.EventConfig.title = Title
com.top_logic.layout.view.element.CalendarElement.EventConfig.title.tooltip = Function computing the event's title.
com.top_logic.layout.view.element.CalendarElement.EventConfig.tooltip = Tooltip
com.top_logic.layout.view.element.CalendarElement.EventConfig.tooltip.tooltip = Function computing the event's hover tooltip.
com.top_logic.layout.view.element.CalendarElement.tooltip = Declarative <i>UI element</i> rendering a model-defined calendar (the <calendar> tag) through a <i>calendar view control</i>. <p> The displayed business objects come from a TL-Script expression over the configured input <i>view channels</i>; each object's event fields (start, end, title, …) are derived by the per-field expressions of the <event> sub-element. Drag edits run the configured on-move / on-resize / on-create write-back expressions inside a transaction. The selected event's business object is written to the selection channel. </p>
com.top_logic.layout.view.element.CardElement = Card element
com.top_logic.layout.view.element.CardElement.Config.header-content = Header content
com.top_logic.layout.view.element.CardElement.Config.header-content.tooltip = Elements rendered at the right edge of the card header, after the title - an icon marking the card as an entry point, a badge, a button.
com.top_logic.layout.view.element.CardElement.Config.padding = Padding
com.top_logic.layout.view.element.CardElement.Config.padding.tooltip = The content padding.
com.top_logic.layout.view.element.CardElement.Config.title = Title
com.top_logic.layout.view.element.CardElement.Config.title.tooltip = The card title, or null for no header.
com.top_logic.layout.view.element.CardElement.Config.variant = Variant
com.top_logic.layout.view.element.CardElement.Config.variant.tooltip = The visual variant.
com.top_logic.layout.view.element.CardElement.tooltip = UIElement that wraps <i>react card control</i>. <p> Renders a lightweight content container with optional title and visual variant. </p>
com.top_logic.layout.view.element.ColumnElement = Column element
com.top_logic.layout.view.element.ColumnElement.Config.weight = Weight
com.top_logic.layout.view.element.ColumnElement.Config.weight.tooltip = The share of the width this column takes, relative to the weights of the other columns. <p> A column of weight 2 beside a column of weight 1 is twice as wide as that one. The weight decides nothing while the columns stack below the breakpoint, where each column takes the full width. </p>
com.top_logic.layout.view.element.ColumnElement.tooltip = One column of a <i>columns element</i>. <p> The content of a column stands below each other in the order it is written, each element over the full width of the column. A column is as tall as its content; it neither scrolls on its own nor is it stretched to the height of a taller neighbour, so a main column of text beside a short side column simply reaches further down the page. </p> <p> The weight says how much of the width this column takes while the columns stand next to each other: two columns of weight 2 and weight 1 share the width two thirds to one third, two columns of the same weight share it evenly. Below the breakpoint of the surrounding columns layout the weight has no effect, because every column then takes the full width. </p>
com.top_logic.layout.view.element.ColumnsElement = Columns element
com.top_logic.layout.view.element.ColumnsElement.Config.breakpoint = Breakpoint
com.top_logic.layout.view.element.ColumnsElement.Config.breakpoint.tooltip = The width below which the columns stack, as a CSS length such as "48rem". <p> Compared against the width this element is granted, not against the width of the browser window. The same layout therefore stacks inside a narrow pane of a wide window as well. </p>
com.top_logic.layout.view.element.ColumnsElement.Config.columns = Columns
com.top_logic.layout.view.element.ColumnsElement.Config.columns.tooltip = The columns, from left to right, and stacked in this order below the breakpoint. <p> At least one column is needed. </p>
com.top_logic.layout.view.element.ColumnsElement.Config.gap = Gap
com.top_logic.layout.view.element.ColumnsElement.Config.gap.tooltip = The space between the columns, and between the stacked columns below the breakpoint.
com.top_logic.layout.view.element.ColumnsElement.tooltip = A page laid out in columns of unequal width that reflows to a single column when the space gets narrow. <p> Each column takes a share of the width according to its weight: a main column of weight 2 beside a side column of weight 1 splits the width two thirds to one third. The columns keep the order they are written in, from left to right. </p> <p> Below the breakpoint the columns stack, each one over the full width, in the order they are written: the main column first, the side column below it. What decides is the width this element itself is granted, not the width of the browser window, so the same page reflows inside a narrow pane of a split panel just as it does on a phone. </p> <p> The columns are a page layout, not a set of panes: there are no splitters to drag, the layout is as tall as its tallest column, and a column is as tall as its own content. Content longer than the window is reached by scrolling the page, so a long main column and a short side column read as one page rather than as two boxes scrolling against each other. </p>
com.top_logic.layout.view.element.CommandCarrierElement = Command carrier element
com.top_logic.layout.view.element.CommandCarrierElement.Config.commands = Commands
com.top_logic.layout.view.element.CommandCarrierElement.Config.commands.tooltip = Commands declared on this element.
com.top_logic.layout.view.element.CommandCarrierElement.tooltip = Abstract base for <i>UI elements</i> that carry <i>view command</i> configurations. <p> Responsible for loading command configs, building <i>view command models</i>, merging child elements into a single content <i>react control</i>, and managing attach/detach lifecycle of the command models. </p> <p> Does NOT create a <i>command scope</i> or any chrome. Subclasses decide what to do with the resulting model list: <i>command scope element</i> wraps them in a shared scope and adds toolbar chrome; <i>context menu element</i> uses them to populate a context-menu region. </p>
com.top_logic.layout.view.element.CommandItemElement = Command item element
com.top_logic.layout.view.element.CommandItemElement.Config.action = Action
com.top_logic.layout.view.element.CommandItemElement.Config.action.tooltip = The command this item executes. <p> Configured as <action class="..." .../> inside the <command-item> element. Its label and icon are what the item displays, and its executability rules decide whether the item is offered. </p>
com.top_logic.layout.view.element.CommandItemElement.tooltip = An item of a <i>sidebar element</i> that runs a <i>view command</i> instead of leading somewhere. <p> Logging out, switching the language, opening a dialog: an action that belongs into the navigation although it displays no page of its own. Label and icon are the ones the command carries, so the item reads like the button of the same command elsewhere. </p> <p> The item shows what the command's executability rules decide, for as long as the sidebar stands: an item whose command is not offered right now is withheld or shown out of reach, and takes its place back as soon as the rules allow it again. The reason a rule gives for disabling the command is what the item says while the pointer rests on it. </p>
com.top_logic.layout.view.element.CommandScopeElement = Command scope element
com.top_logic.layout.view.element.CommandScopeElement.Config.command-display = Command display
com.top_logic.layout.view.element.CommandScopeElement.Config.command-display.tooltip = How this scope's buttons display icon and label, e.g. icon-only for compact icon buttons whose labels become tooltips. <p> Applies to every button rendered from this scope - explicitly configured commands as well as commands contributed by child elements (e.g. a form's edit and save buttons). A command's own display setting takes precedence. If not set, buttons show the icon (when configured) together with the label. </p>
com.top_logic.layout.view.element.CommandScopeElement.tooltip = Base class for <i>UI elements</i> that establish a <i>command scope</i> and render placed commands as structured toolbars. <p> Subclasses create their specific chrome (panel, window, etc.). This class adds, on top of <i>command carrier element</i>: </p> <ul> <li>Creating a <i>command scope</i> and derived <i>view context</i></li> <li>Building clique-grouped toolbars for <i>toolbar</i> and <i>button bar</i> placed commands via <i>toolbar builder</i></li> <li>Rebuilding the toolbars when the set of commands changes (implicit commands)</li> </ul>
com.top_logic.layout.view.element.CompositionTableElement = Composition table element
com.top_logic.layout.view.element.CompositionTableElement$DetailDialogConfig = Detail dialog configuration
com.top_logic.layout.view.element.CompositionTableElement$DetailDialogConfig.tooltip = Configuration for the detail dialog opened from a composition table row.
com.top_logic.layout.view.element.CompositionTableElement.Config.attribute = Attribute
com.top_logic.layout.view.element.CompositionTableElement.Config.attribute.tooltip = The name of the composition reference attribute on the parent object.
com.top_logic.layout.view.element.CompositionTableElement.Config.columns = Columns
com.top_logic.layout.view.element.CompositionTableElement.Config.columns.tooltip = The column definitions for this table.
com.top_logic.layout.view.element.CompositionTableElement.Config.detail-dialog = Detail dialog
com.top_logic.layout.view.element.CompositionTableElement.Config.detail-dialog.tooltip = Optional detail dialog configuration. <p> When set, each table row gets a "Detail" button that opens the configured dialog view with the row object injected into the specified channel. </p>
com.top_logic.layout.view.element.CompositionTableElement.DetailDialogConfig.edit-mode-channel = Edit mode channel
com.top_logic.layout.view.element.CompositionTableElement.DetailDialogConfig.edit-mode-channel.tooltip = Dialog channel name to receive the current edit mode state. <p> If not set, no edit-mode channel is injected into the dialog. </p>
com.top_logic.layout.view.element.CompositionTableElement.DetailDialogConfig.height = Height
com.top_logic.layout.view.element.CompositionTableElement.DetailDialogConfig.height.tooltip = Dialog height in pixels. Zero means use the default height.
com.top_logic.layout.view.element.CompositionTableElement.DetailDialogConfig.input-channel = Input channel
com.top_logic.layout.view.element.CompositionTableElement.DetailDialogConfig.input-channel.tooltip = Dialog channel name to receive the row object.
com.top_logic.layout.view.element.CompositionTableElement.DetailDialogConfig.layout = Layout
com.top_logic.layout.view.element.CompositionTableElement.DetailDialogConfig.layout.tooltip = Path to the dialog view file, relative to /WEB-INF/views/.
com.top_logic.layout.view.element.CompositionTableElement.DetailDialogConfig.width = Width
com.top_logic.layout.view.element.CompositionTableElement.DetailDialogConfig.width.tooltip = Dialog width in pixels. Zero means use the default width.
com.top_logic.layout.view.element.CompositionTableElement.tooltip = Declarative <i>UI element</i> that creates a <i>row set table control</i> for an inline composition table within a form. <p> Must be nested inside a <i>form element</i>. Parses a <composition-table> configuration element with an attribute reference and an optional <columns> child containing <column> elements. </p> <p> Example configuration: </p> <pre> &lt;composition-table attribute="items"&gt; &lt;columns&gt; &lt;column attribute="name"/&gt; &lt;column attribute="quantity"/&gt; &lt;column attribute="unitPrice" readonly="true"/&gt; &lt;/columns&gt; &lt;/composition-table&gt; </pre>
com.top_logic.layout.view.element.ConfigFormElement = Configuration form element
com.top_logic.layout.view.element.ConfigFormElement.Config.input = Input
com.top_logic.layout.view.element.ConfigFormElement.Config.input.tooltip = Channel carrying the <i>configuration item</i> to edit. <p> Optional: without it the element edits a fresh item of <i>Type</i>. </p>
com.top_logic.layout.view.element.ConfigFormElement.Config.noModelMessage = No model message
com.top_logic.layout.view.element.ConfigFormElement.Config.noModelMessage.tooltip = Shown in place of the form while there is nothing to edit.
com.top_logic.layout.view.element.ConfigFormElement.Config.type = Type
com.top_logic.layout.view.element.ConfigFormElement.Config.type.tooltip = The configuration interface to create an item of when <i>Input</i> has no value. <p> Without it, an empty channel means there is nothing to edit and <i>No model message</i> is shown instead. </p>
com.top_logic.layout.view.element.ConfigFormElement.Config.withEditMode = With edit mode
com.top_logic.layout.view.element.ConfigFormElement.Config.withEditMode.tooltip = Whether the item is edited through a working copy, with Edit, Apply and Cancel. <p> Off, the form writes every change straight into the item - for a caller that has its own save cycle, or an item that is nobody's persistent state. </p>
com.top_logic.layout.view.element.ConfigFormElement.tooltip = <i>UI element</i> editing a <i>configuration item</i> - the configuration counterpart of <i>form element</i>. <p> The item comes from the input channel, so a configuration selected elsewhere (a table row, a tree node) can be edited here. It may equally come from nowhere: with a type configured, the element edits a fresh item of that type whenever the channel has nothing to offer. That is the case an ordinary <form> cannot serve at all - there is no model object anywhere, only a configuration. </p> <p> Edit mode works as it does for <form withEditMode="true">: the item is read-only until Edit starts a working copy, Apply checks it and carries it over, Cancel drops it. Those three commands go to the enclosing panel's toolbar rather than among the fields, which is what makes a configuration form look like the rest of the application. </p> <p> A channel value that is not a <i>configuration item</i> is treated as no value: the channel is shared with whatever else is bound to it, and a form is not the place to complain about a selection that simply is not for it. </p>
com.top_logic.layout.view.element.ContextMenuElement = Context menu element
com.top_logic.layout.view.element.ContextMenuElement.tooltip = A menu over this element's children that opens on right-click. <p> Commands declared inside a <context-menu> element with placement="CONTEXT_MENU" are collected into a single <i>context menu contribution</i> bound to an implicit <code>"contextTarget"</code> channel (or to the channel referenced via the optional input attribute). The children are the region the user right-clicks, and they may carry commands of their own placements, which is why only the context-menu ones become entries. </p>
com.top_logic.layout.view.element.DashboardElement = Dashboard element
com.top_logic.layout.view.element.DashboardElement.Config.id = ID
com.top_logic.layout.view.element.DashboardElement.Config.id.tooltip = Stable id used as persistence key for personal tile ordering.
com.top_logic.layout.view.element.DashboardElement.Config.min-col-width = Minimum col width
com.top_logic.layout.view.element.DashboardElement.Config.min-col-width.tooltip = CSS length hint used by the client to decide the column count. Defaults to 16rem.
com.top_logic.layout.view.element.DashboardElement.Config.row-height = Row height
com.top_logic.layout.view.element.DashboardElement.Config.row-height.tooltip = The height of one grid row, as a CSS length. <p> A tile is as many rows tall as the row span of its <i>tile element</i>, plus the gaps between those rows. Content that fills the available height, a panel configured to fill or a table, resolves its height against the tile and scrolls inside it; content that does not fill and is taller than the tile scrolls inside the tile as well. </p>
com.top_logic.layout.view.element.DashboardElement.Config.tiles = Tiles
com.top_logic.layout.view.element.DashboardElement.Config.tiles.tooltip = The tiles. Represented as polymorphic configurations so that the default container (child elements) can hold <tile> entries.
com.top_logic.layout.view.element.DashboardElement.tooltip = A UI element that renders a responsive dashboard grid of tiles. <p> Tile order is personalized per user via <i>personal configuration</i>, keyed by this element's id. Unknown ids in the persisted order are ignored; tiles not mentioned are appended in their configured order. </p>
com.top_logic.layout.view.element.DetailDisplay = Detail display
com.top_logic.layout.view.element.DetailDisplay.DRAWER = Drawer
com.top_logic.layout.view.element.DetailDisplay.DRAWER.tooltip = The detail overlays the selector as a panel sliding in from the right edge, leaving the selector at full width underneath.
com.top_logic.layout.view.element.DetailDisplay.SPLIT = Split
com.top_logic.layout.view.element.DetailDisplay.SPLIT.tooltip = The detail divides the available width with the selector, in a split whose separator can be dragged.
com.top_logic.layout.view.element.DetailDisplay.tooltip = How an <i>adaptive detail element</i> presents its detail beside its selector on a wide viewport. <p> On a narrow viewport the detail always replaces the selector, whichever value is configured. </p>
com.top_logic.layout.view.element.FieldElement = Field element
com.top_logic.layout.view.element.FieldElement.Config.attribute = Attribute
com.top_logic.layout.view.element.FieldElement.Config.attribute.tooltip = The name of the model attribute to display.
com.top_logic.layout.view.element.FieldElement.Config.full-line = Full line
com.top_logic.layout.view.element.FieldElement.Config.full-line.tooltip = Whether the field takes a row of the form grid to itself instead of sharing one with the fields around it. <p> For a field whose input is not a single line - a collection of configurations, a text area, a table - a column of the grid is too narrow to read, and the fields beside it are dragged to its height. </p> <p> Three-valued on purpose: left unset, a <i>whole line</i> on the model attribute still decides, so a view says something here only where it wants to depart from what the model already says. </p>
com.top_logic.layout.view.element.FieldElement.Config.input-control = Input control
com.top_logic.layout.view.element.FieldElement.Config.input-control.tooltip = The control editing the attribute here, overriding the one the model implies. <p> The same choice as the <i>input control</i> annotation of a model attribute offers, made where the field is displayed instead of where the attribute is defined. A control that belongs to one place in the user interface - an editor whose toolbar opens a dialog of this view, say - is chosen here, so that the model keeps saying what the attribute is and the view says how it is presented. </p> <p> Left unset, the control is the one the attribute's own annotation, its type or the kind of value it holds leads to. </p>
com.top_logic.layout.view.element.FieldElement.Config.label = Label
com.top_logic.layout.view.element.FieldElement.Config.label-position = Label position
com.top_logic.layout.view.element.FieldElement.Config.label-position.tooltip = Where the field renders its label relative to the input, e.g. hide-label for a label-less field. <p> If not set, the position falls back to a <i>label position</i> on the model attribute, and without one to the responsive default of the enclosing form layout. </p>
com.top_logic.layout.view.element.FieldElement.Config.label.tooltip = Optional label override for the field. <p> If not set, the label is derived from the model attribute. </p>
com.top_logic.layout.view.element.FieldElement.Config.readonly = Readonly
com.top_logic.layout.view.element.FieldElement.Config.readonly.tooltip = Whether the field should always be read-only regardless of form edit mode.
com.top_logic.layout.view.element.FieldElement.tooltip = Declarative <i>UI element</i> that creates an <i>attribute field control</i> for a single model attribute. <p> Must be nested inside a <i>form element</i>. Resolves the enclosing <i>form model</i> from the <i>view context</i> and creates a chrome-wrapped field control for the configured attribute. </p>
com.top_logic.layout.view.element.FieldsElement = Fields element
com.top_logic.layout.view.element.FieldsElement.tooltip = <i>UI element</i> laying its content out as the fields of a form. <p> A form surrounds its fields with a grid: it insets them from the container border, distributes them over as many columns as the available width carries, and places each label beside its input or above it depending on how wide the column it landed in is. This element is that grid on its own. It serves two purposes: </p> <ul> <li>It lays out inputs that belong to the view rather than to an object and therefore stand outside a form: a <i>value input element</i> and everything else that displays the label-and-input chrome of a field.</li> <li>It lays out a part of the fields of a <i>form element</i>: the fields of one area of a form whose areas are panels or split panes. Such a form does not lay these fields out itself, being flush around the areas it spans. A grid inside a form displays the form's edit mode: its fields appear read-only while the form is not being edited.</li> </ul> <p> A <i>field element</i> needs a form in any case: this element lays fields out but carries no object for them to display. </p>
com.top_logic.layout.view.element.FileListElement = File list element
com.top_logic.layout.view.element.FileListElement.Config.attribute = Attribute
com.top_logic.layout.view.element.FileListElement.Config.attribute.tooltip = The name of the composition reference attribute on the parent object.
com.top_logic.layout.view.element.FileListElement.Config.data-attribute = Data attribute
com.top_logic.layout.view.element.FileListElement.Config.data-attribute.tooltip = The name of the binary attribute on the composed type that stores the file. <p> If not set, the single binary-typed property of the composition target type is used. </p>
com.top_logic.layout.view.element.FileListElement.Config.label-position = Label position
com.top_logic.layout.view.element.FileListElement.Config.label-position.tooltip = Where the file list renders its label relative to the chips, e.g. hide-label for a label-less file list.
com.top_logic.layout.view.element.FileListElement.tooltip = Declarative <i>UI element</i> that creates a <i>file list control</i> for a composition reference whose composed objects carry a file. <p> Must be nested inside a <i>form element</i>. Displays the composed objects as file chips (name, size, download); in edit mode, files can be added by upload and removed per chip. </p> <p> Example configuration: </p> <pre> &lt;file-list attribute="attachments"/&gt; </pre>
com.top_logic.layout.view.element.FormElement = Form element
com.top_logic.layout.view.element.FormElement.Config.cancel-action = Cancel action
com.top_logic.layout.view.element.FormElement.Config.cancel-action.tooltip = Optional action chain to execute on cancel instead of the default behavior. <p> When configured, the cancel button executes this <i>view action</i> chain instead of the default cancel behavior. </p>
com.top_logic.layout.view.element.FormElement.Config.commands = Commands
com.top_logic.layout.view.element.FormElement.Config.commands.tooltip = Commands to contribute to the enclosing command scope. <p> These commands execute in the form's context and have access to the form model via ReadFormObjectAction. They are contributed to the parent's <i>command scope</i> and rendered as toolbar buttons by the enclosing panel or window. </p>
com.top_logic.layout.view.element.FormElement.Config.dirty = Dirty
com.top_logic.layout.view.element.FormElement.Config.dirty.tooltip = Optional reference to a channel for publishing the dirty state.
com.top_logic.layout.view.element.FormElement.Config.edit-executability = Edit executability
com.top_logic.layout.view.element.FormElement.Config.edit-executability.tooltip = Rules deciding whether this form offers editing its object. <p> Guards the transition into edit mode, wherever it is triggered: the Edit button is disabled or hidden according to the rules, and the form refuses the transition when a client requests it nonetheless. The remaining lifecycle commands (apply, save, cancel) are reachable only from within an edit session and are therefore guarded through it. </p> <p> A <i>security rule</i> checks the user's roles for a command group on the enclosing security scope; a <i>visible if</i> evaluates a script predicate over the displayed object. Without a rule, every user who sees the form may edit it. </p>
com.top_logic.layout.view.element.FormElement.Config.editMode = Edit mode
com.top_logic.layout.view.element.FormElement.Config.editMode.tooltip = Optional reference to a channel for publishing edit mode state.
com.top_logic.layout.view.element.FormElement.Config.initial-edit-mode = Initial edit mode
com.top_logic.layout.view.element.FormElement.Config.initial-edit-mode.tooltip = Whether the form starts in edit mode immediately. <p> When true, the form enters edit mode as soon as an object is available, without requiring the user to click an Edit button. Useful for create dialogs where the object is always editable. </p>
com.top_logic.layout.view.element.FormElement.Config.input = Input
com.top_logic.layout.view.element.FormElement.Config.input.tooltip = Reference to the channel providing the object to display in the form.
com.top_logic.layout.view.element.FormElement.Config.lockHandler = Lock handler
com.top_logic.layout.view.element.FormElement.Config.lockHandler.tooltip = Algorithm for edit-mode token handling. <p> Defaults to <i>application-wide lock definition</i> which uses the application-wide LockService. To disable locking, configure NoTokenHandling. </p>
com.top_logic.layout.view.element.FormElement.Config.mode-switch = Mode switch
com.top_logic.layout.view.element.FormElement.Config.mode-switch.tooltip = Whether to show edit/save/cancel mode switching buttons. <p> When false, no command models for edit, save, and cancel are created. The form either stays in view mode or edit mode depending on <i>Initial edit mode</i>. Useful for create dialogs where the dialog's own buttons handle submission. </p>
com.top_logic.layout.view.element.FormElement.Config.noModelMessage = No model message
com.top_logic.layout.view.element.FormElement.Config.noModelMessage.tooltip = Message to display when no object is available. <p> Defaults to "No object selected." if not specified. </p>
com.top_logic.layout.view.element.FormElement.Config.save-action = Save action
com.top_logic.layout.view.element.FormElement.Config.save-action.tooltip = Optional action chain to execute on save instead of the default behavior. <p> When configured, the save button executes this <i>view action</i> chain (similar to GenericViewCommand) instead of the default save behavior. </p>
com.top_logic.layout.view.element.FormElement.Config.withEditMode = With edit mode
com.top_logic.layout.view.element.FormElement.Config.withEditMode.tooltip = Whether to create edit/save/cancel command models for this form. <p> When true, command models for edit, save, and cancel are created and contributed to the enclosing <i>command scope</i>. This allows a parent panel to render toolbar buttons for switching between view and edit mode without the <i>form control</i> knowing about UI elements. </p>
com.top_logic.layout.view.element.FormElement.tooltip = Declarative <i>UI element</i> that wraps a <i>form control</i>. <p> Establishes a form scope for child elements. Resolves an input channel to obtain the object to display, creates a <i>form control</i>, and makes it available to nested <i>field elements</i> via the <i>view context</i>. </p>
com.top_logic.layout.view.element.FormLayoutOptions = Form layout options
com.top_logic.layout.view.element.FormLayoutOptions.label-position = Label position
com.top_logic.layout.view.element.FormLayoutOptions.label-position.tooltip = Where the fields render their labels relative to their inputs. <p> With <i>auto</i>, each label stands beside its input where the column is wide enough for both and moves above it where it is not. <i>Side</i> and <i>top</i> fix the position whatever the width. </p> <p> A field stating a position of its own keeps it. </p>
com.top_logic.layout.view.element.FormLayoutOptions.max-columns = Maximum columns
com.top_logic.layout.view.element.FormLayoutOptions.max-columns.tooltip = The greatest number of columns the fields are laid out in. <p> How many of them are actually filled follows the available width: a narrow display shows fewer columns, and on a phone a single one. </p>
com.top_logic.layout.view.element.FormLayoutOptions.tooltip = The layout of a grid of form fields. <p> A form grid insets its fields from the container border, distributes them over as many columns as the available width carries, and places each label beside its input or above it depending on how wide the column it landed in is. What the configuration fixes is not the number of columns but the greatest number of them wanted, and where the labels stand. </p>
com.top_logic.layout.view.element.FullPageElement = Full page element
com.top_logic.layout.view.element.FullPageElement.tooltip = UIElement that fills its container with a single main content (typically a table), without any header chrome. <p> Use it as the root content of a view whose enclosing tab or navigation entry already names it: no panel title is rendered, so the label is not duplicated and no vertical space is wasted. The element always fills the available height, so a virtualized content control (a table) bounds its scroll viewport and scrolls internally. </p> <p> Unlike a panel, a full page renders no local toolbar: commands are projected to a slot higher in the tree (e.g. the application bar), not into a header bar of their own. </p>
com.top_logic.layout.view.element.GridElement = Grid element
com.top_logic.layout.view.element.GridElement.tooltip = UIElement that wraps <i>react grid control</i>. <p> Renders a CSS Grid container with responsive auto-fit columns. </p>
com.top_logic.layout.view.element.GridOptions = Grid options
com.top_logic.layout.view.element.GridOptions.gap = Gap
com.top_logic.layout.view.element.GridOptions.gap.tooltip = The space between the elements of the grid.
com.top_logic.layout.view.element.GridOptions.max-columns = Maximum columns
com.top_logic.layout.view.element.GridOptions.max-columns.tooltip = The largest number of columns to place, or nothing for as many as fit. <p> A bounded grid still drops columns as it gets narrower; it just does not grow beyond the given number however wide it gets, which keeps a handful of elements from spreading into a thin row on a wide screen. </p>
com.top_logic.layout.view.element.GridOptions.max-width = Maximum width
com.top_logic.layout.view.element.GridOptions.max-width.tooltip = The largest width the elements take together, as a CSS length such as "60rem". <p> Bounded this way, the arrangement is centered in the space it is given, the space left over split between its two sides, which keeps a handful of elements together in the middle of a wide screen instead of spreading them across it. Below the bound nothing changes, so the elements still fill a narrow screen. </p> <p> Unset, the elements take the width their container offers. </p>
com.top_logic.layout.view.element.GridOptions.min-column-width = Minimum column width
com.top_logic.layout.view.element.GridOptions.min-column-width.tooltip = The width a column must have at least, as a CSS length such as "16rem". <p> A column is never narrower than this, so the number of columns follows the available width: the wider the grid, the more columns it places. Where not even one column of this width fits, the elements are shown full-width instead of overflowing. </p>
com.top_logic.layout.view.element.GridOptions.tooltip = The layout of a grid of equally built elements. <p> A grid places its elements in as many columns as fit next to each other and reflows them as the available width changes, so that the same configuration serves a wide screen and a phone. What the configuration fixes is not the number of columns but how wide a column has to be at least, optionally how many columns are wanted at most, how much space separates them, and how wide the grid as a whole may grow. </p>
com.top_logic.layout.view.element.GroupElement = Group element
com.top_logic.layout.view.element.GroupElement.Config.border = Border
com.top_logic.layout.view.element.GroupElement.Config.border.tooltip = The frame drawn around the section.
com.top_logic.layout.view.element.GroupElement.Config.collapsed = Collapsed
com.top_logic.layout.view.element.GroupElement.Config.collapsed.tooltip = Whether the section starts folded away. <p> The user unfolds it from the heading, so this applies to a section that can be folded. </p>
com.top_logic.layout.view.element.GroupElement.Config.collapsible = Collapsible
com.top_logic.layout.view.element.GroupElement.Config.collapsible.tooltip = Whether the user can fold the section away.
com.top_logic.layout.view.element.GroupElement.Config.full-line = Full line
com.top_logic.layout.view.element.GroupElement.Config.full-line.tooltip = Whether the section spans the whole width of the form it stands in. <p> A section over the whole width distributes its fields over the columns of the form. One confined to a single column stacks its content in that column, one item below the other. </p>
com.top_logic.layout.view.element.GroupElement.Config.label = Label
com.top_logic.layout.view.element.GroupElement.Config.label.tooltip = The heading the section is displayed under. <p> A section without a label shows no heading, and is set apart by its frame alone. </p>
com.top_logic.layout.view.element.GroupElement.tooltip = <i>UI element</i> sectioning the fields of a form. <p> A group gathers the fields that belong together under a heading of its own - Name, Contact, Address - and can be framed and folded away. It takes part in the grid of the enclosing <i>form element</i> or <i>fields element</i> rather than opening a grid of its own: the fields inside a section line up with the fields outside it, column for column. </p> <p> A section spans the whole width of that grid. One that spans a single column instead confines its content to that column, where it stacks one item below the other. </p>
com.top_logic.layout.view.element.GroupItemElement = Group item element
com.top_logic.layout.view.element.GroupItemElement.Config.expanded = Expanded
com.top_logic.layout.view.element.GroupItemElement.Config.expanded.tooltip = Whether the group is unfolded for a user who has not folded it before.
com.top_logic.layout.view.element.GroupItemElement.Config.icon = Icon
com.top_logic.layout.view.element.GroupItemElement.Config.icon.tooltip = The CSS icon class shown beside the heading (e.g. "bi bi-gear").
com.top_logic.layout.view.element.GroupItemElement.Config.items = Items
com.top_logic.layout.view.element.GroupItemElement.Config.items.tooltip = The items gathered under the heading.
com.top_logic.layout.view.element.GroupItemElement.Config.label = Label
com.top_logic.layout.view.element.GroupItemElement.Config.label.tooltip = The heading the group is folded away under.
com.top_logic.layout.view.element.GroupItemElement.tooltip = A collapsible group of further items of a <i>sidebar element</i>. <p> The group gathers items under a heading the user folds away. Whether it is folded is remembered per user under the group's id, so the sidebar opens the way it was left. </p> <p> A group holds items, not content: the navigation items inside it lead to the same places they would lead to at the top level of the sidebar, and are addressed at the sidebar itself. A group therefore nests - a group within a group - without changing where anything is displayed. </p>
com.top_logic.layout.view.element.HeaderItemElement = Header item element
com.top_logic.layout.view.element.HeaderItemElement.Config.icon = Icon
com.top_logic.layout.view.element.HeaderItemElement.Config.icon.tooltip = The CSS icon class shown beside the caption (e.g. "bi bi-gear").
com.top_logic.layout.view.element.HeaderItemElement.Config.label = Label
com.top_logic.layout.view.element.HeaderItemElement.Config.label.tooltip = The caption naming the section.
com.top_logic.layout.view.element.HeaderItemElement.tooltip = A caption naming the items that follow it in a <i>sidebar element</i>. <p> The caption is a label, not a place to go: it leads nowhere and cannot be activated. It divides a long navigation into named sections that all stay visible, where a group would fold them away. </p>
com.top_logic.layout.view.element.HtmlDisplay = HTML display
com.top_logic.layout.view.element.HtmlDisplay.DOCUMENT = Document
com.top_logic.layout.view.element.HtmlDisplay.DOCUMENT.tooltip = A page of its own. <p> The content is shown as a document of its own, filling the space the element is given. It keeps the styles it brings along and takes none of the page's; scripts it carries are not executed. </p>
com.top_logic.layout.view.element.HtmlDisplay.INLINE = Inline
com.top_logic.layout.view.element.HtmlDisplay.INLINE.tooltip = Part of the page around it (the default). <p> The content is inserted where the element stands and is styled by the page it lands in, so it reads as a section of that page. Only content the safety check accepts is inserted; content it rejects is replaced by a message saying so. </p>
com.top_logic.layout.view.element.HtmlDisplay.THUMBNAIL = Thumbnail
com.top_logic.layout.view.element.HtmlDisplay.THUMBNAIL.tooltip = A scaled-down preview. <p> The content is shown as a document the reader looks at rather than reads: scaled to fit the space the element is given, the way a document list previews what it lists. </p>
com.top_logic.layout.view.element.HtmlDisplay.tooltip = How a <i>HTML element</i> displays its HTML content.
com.top_logic.layout.view.element.HtmlElement = HTML element
com.top_logic.layout.view.element.HtmlElement.Config.display = Display
com.top_logic.layout.view.element.HtmlElement.Config.display.tooltip = How the content is displayed.
com.top_logic.layout.view.element.HtmlElement.Config.input = Input
com.top_logic.layout.view.element.HtmlElement.Config.input.tooltip = Channel whose value is displayed as HTML. <p> The HTML source as text, a fragment produced by an HTML literal of a script expression, or a document of content type text/html. A value of another type is reported in place of the content. </p>
com.top_logic.layout.view.element.HtmlElement.Config.print = Print
com.top_logic.layout.view.element.HtmlElement.Config.print.tooltip = Whether content displayed as a document is shown with a button that prints it. <p> The button hands the document to the browser's print dialog, which also offers saving it as a PDF file. A thumbnail is a picture of a document rather than the document itself and carries no such button, so the setting has no effect there. </p>
com.top_logic.layout.view.element.HtmlElement.Config.thumbnail-height = Thumbnail height
com.top_logic.layout.view.element.HtmlElement.Config.thumbnail-height.tooltip = The height in CSS pixels a thumbnail lays its content out at. <p> The default is the height of a portrait page of the thumbnail width, so content written as a document appears in the proportions of the paper it is meant for. Content taller than this is cut off at the bottom of the preview, as a page is. </p>
com.top_logic.layout.view.element.HtmlElement.Config.thumbnail-width = Thumbnail width
com.top_logic.layout.view.element.HtmlElement.Config.thumbnail-width.tooltip = The width in CSS pixels a thumbnail lays its content out at. <p> A thumbnail shows the content as the page it is written for and scales that page down to the space the element is given, so this is the width the content sees rather than the width it is displayed at. Together with the thumbnail height it decides the proportions of the preview, which keeps the aspect ratio of the two. </p>
com.top_logic.layout.view.element.HtmlElement.tooltip = <i>UI element</i> that displays HTML content via the <i>react HTML control</i> (TLHtml). <p> The content is read from an input channel and kept in sync with it: a new value on the channel replaces what is displayed. The channel may carry the HTML source as text, an <i>HTML fragment</i> - what an HTML literal of a script expression evaluates to - or a <i>binary data</i> document of content type text/html. A value of any other type has no HTML representation, and a message saying so is displayed in its place. </p> <p> Content displayed as part of the page passes the application's HTML safety check first. Content the check rejects - a script, an attribute that carries one - is not displayed; its place is taken by the message the check reports. Content displayed as a document or as a thumbnail is not checked: it is isolated from the page in a frame of its own, in which no script is executed. </p>
com.top_logic.layout.view.element.IconElement = Icon element
com.top_logic.layout.view.element.IconElement.Config.css-class = Css class
com.top_logic.layout.view.element.IconElement.Config.css-class.tooltip = Optional additional CSS class appended to the size class of the icon.
com.top_logic.layout.view.element.IconElement.Config.image = Image
com.top_logic.layout.view.element.IconElement.Config.image.tooltip = The icon to show.
com.top_logic.layout.view.element.IconElement.Config.size = Size
com.top_logic.layout.view.element.IconElement.Config.size.tooltip = The size step of the icon by its role: sm beside a label (the default), md where the icon is the control, lg where it is a statement, glyph for a direction sign inside a control.
com.top_logic.layout.view.element.IconElement.Config.tooltip = Tooltip
com.top_logic.layout.view.element.IconElement.Config.tooltip.tooltip = The text shown on hover. <p> The text also names the icon for a reader who cannot see it. Left unset, the icon decorates what it sits beside and is not announced. </p>
com.top_logic.layout.view.element.IconElement.tooltip = A theme icon - a font icon such as css:bi bi-chevron-right or a picture resource - shown decoratively, or named by its tooltip.
com.top_logic.layout.view.element.ImageElement = Image element
com.top_logic.layout.view.element.ImageElement.Config.alt = Alt
com.top_logic.layout.view.element.ImageElement.Config.alt.tooltip = What the picture shows, for a reader who cannot see it. <p> Worth saying wherever the picture carries information rather than decoration - a QR code enrolling an authenticator, a chart, a scan. Left unset, it is announced as a picture and nothing more. </p>
com.top_logic.layout.view.element.ImageElement.Config.aspect-ratio = Aspect ratio
com.top_logic.layout.view.element.ImageElement.Config.aspect-ratio.tooltip = Proportions of the box the picture is shown in, as width and height separated by a slash, e.g. "16/9". <p> With proportions the box keeps its shape as the available width changes, so that a row of pictures of differing originals stays even. Left unset, the box takes its shape from the picture. </p>
com.top_logic.layout.view.element.ImageElement.Config.fit = Fit
com.top_logic.layout.view.element.ImageElement.Config.fit.tooltip = How a picture whose proportions differ from the box fills it. <p> Only of consequence where the box has a shape of its own, through <i>Aspect ratio</i>, <i>Width</i> or <i>Height</i>. </p>
com.top_logic.layout.view.element.ImageElement.Config.height = Height
com.top_logic.layout.view.element.ImageElement.Config.height.tooltip = Height of the box the picture is shown in, as a CSS length such as "12rem".
com.top_logic.layout.view.element.ImageElement.Config.input = Input
com.top_logic.layout.view.element.ImageElement.Config.input.tooltip = Channel whose value is displayed as a picture. <p> The value is either picture data (content type "image/...") or a text naming the address the picture is loaded from. Any other value - binary data the browser cannot render as a picture, or an unrelated object - shows the <i>Resource</i> instead, and nothing where there is none. </p>
com.top_logic.layout.view.element.ImageElement.Config.lazy = Lazy
com.top_logic.layout.view.element.ImageElement.Config.lazy.tooltip = Whether the browser may postpone loading the picture until it comes close to the visible part of the page. <p> Worth switching on for a picture far down a long page, and wrong for one the user sees at once, which then arrives later than it had to. </p>
com.top_logic.layout.view.element.ImageElement.Config.resource = Resource
com.top_logic.layout.view.element.ImageElement.Config.resource.tooltip = Path of a static resource of the web application, e.g. "/images/logo.svg". <p> On its own, this is the picture the element shows. Together with <i>Input</i> it is the placeholder shown as long as that channel holds no picture. </p>
com.top_logic.layout.view.element.ImageElement.Config.width = Width
com.top_logic.layout.view.element.ImageElement.Config.width.tooltip = Width of the box the picture is shown in, as a CSS length such as "12rem".
com.top_logic.layout.view.element.ImageElement.tooltip = <i>UI element</i> that displays a picture through the <i>react image control</i>. <p> The picture is either a resource of the web application, or it is read from an input channel (e.g. a QR-code PNG that a <i>view action</i> placed on a dialog channel) and kept in sync with that channel: when the channel value changes, the displayed picture is updated. Where both are configured, the resource is the placeholder shown while the channel holds no picture. </p> <p> The box the picture is shown in is described by the proportions, the width and the height; where none of them is given, the picture keeps its natural size, limited to the width available. </p>
com.top_logic.layout.view.element.InsetElement = Inset element
com.top_logic.layout.view.element.InsetElement.tooltip = UIElement that insets its content from the surrounding container border. <p> In the spacing model, containers are flush by default and content owns its breathing room. An <inset> is dropped into a view wherever content would otherwise glue to the border - e.g. around a stack/grid of cards, or around explanatory text in a dialog. </p>
com.top_logic.layout.view.element.JobStatusElement = Job status element
com.top_logic.layout.view.element.JobStatusElement.Config.input = Input
com.top_logic.layout.view.element.JobStatusElement.Config.input.tooltip = Channel the job reports on, holding the state of the job to display. <p> This is the channel a started job publishes its snapshots to. A channel holding no job displays nothing, so a view offering to start a job needs no case of its own for the time before the first start. </p>
com.top_logic.layout.view.element.JobStatusElement.tooltip = <i>UI element</i> displaying the long-running job its input channel reports about, via the <i>react job status control</i>. <p> The channel holds the <i>job state</i> snapshots the job publishes; a channel holding anything else - nothing at all before a job was started - displays no job. Every text is resolved for the reader here: the phases and the message by their <i>resource key</i>, what the job produced through the <i>default label</i>, which is how any other value of a channel becomes a text. </p> <p> The display follows the channel alone. A snapshot is immutable, so a job that has something new to report publishes a new one, and no object the display would have to observe changes. </p>
com.top_logic.layout.view.element.LayerElement = Layer element
com.top_logic.layout.view.element.LayerElement.Config.position = Position
com.top_logic.layout.view.element.LayerElement.Config.position.tooltip = Where the content sits over the base of the surrounding overlay: covering it as a whole, or anchored to one of its edges, corners or its middle.
com.top_logic.layout.view.element.LayerElement.tooltip = Content of an <i>overlay element</i> together with the position it takes over the base. <p> A layer is written inside an overlay wherever its content needs a position of its own - a caption at the bottom edge of a picture, a badge in a corner of an avatar. Content that covers the whole base needs no layer around it: an element written directly in the overlay is such a layer already. </p> <p> Elsewhere a layer is a plain group of its children: the position is what the surrounding overlay reads from it, and where there is none, there is nothing to position against. </p>
com.top_logic.layout.view.element.LoginCommandsElement = Login commands element
com.top_logic.layout.view.element.LoginCommandsElement.tooltip = <i>UI element</i> that renders the extra login-dialog commands contributed via <i>login commands configuration</i> (e.g. a self-service "Forgot password?" button or SSO providers). <p> Unlike <stack>, the children are not configured inline but taken from the application configuration, so optional feature modules can contribute buttons without the base view module depending on them. Renders nothing when no command is contributed. </p>
com.top_logic.layout.view.element.LoginMethodsElement = Login methods element
com.top_logic.layout.view.element.LoginMethodsElement.tooltip = <i>UI element</i> that renders one redirect button per external <i>login method</i> contributed through <i>login methods</i> (e.g. SSO providers). <p> Each button is a full-page browser redirect to the method's initiation URL, returning to the page the visitor asked for. Renders nothing when no login method is configured, so it can be placed in any login view unconditionally. </p>
com.top_logic.layout.view.element.MaintenanceNoticeElement = Maintenance notice element
com.top_logic.layout.view.element.MaintenanceNoticeElement.tooltip = Announces the application's maintenance window to the user. <p> Placed in the <notices> area of an <app-shell>, the element shows a bar while a maintenance window is announced or active, and nothing at all during normal operation. It therefore is the new-world counterpart of the old-world MaintenanceViewConfiguration, which contributes a MaintenanceControl to the classic UI's message area. </p> <p> The element registers a <i>maintenance state listener</i> on the <i>maintenance window</i>, so a user who is already logged in sees an announcement the moment an administrator makes it, without reloading. Because the manager is fed from the ClusterManager, this works across cluster nodes as well. </p>
com.top_logic.layout.view.element.MenuElement = Menu element
com.top_logic.layout.view.element.MenuElement.tooltip = A drop-down menu whose children are its trigger. <p> The children render the trigger - an avatar, an icon, a label, or any combination - and clicking them opens a menu of the commands declared on this element, anchored below. Use this instead of a row of buttons wherever a group of commands belongs to one thing rather than to the surface they sit on: the account menu of an app bar is the canonical case. </p> <p> Every declared command becomes an entry, whatever its placement: a command written inside a menu is an entry of that menu by construction. Entries the current user must not see drop out on their own, since a command hidden by its executability rule is not offered. </p> <p> Example: </p> <pre> &lt;menu&gt; &lt;avatar input="currentUser"/&gt; &lt;commands&gt; &lt;logout-command image="css:bi bi-box-arrow-right"&gt; &lt;label&gt;&lt;en&gt;Log out&lt;/en&gt;&lt;/label&gt; &lt;/logout-command&gt; &lt;/commands&gt; &lt;/menu&gt; </pre>
com.top_logic.layout.view.element.OverlayElement = Overlay element
com.top_logic.layout.view.element.OverlayElement.tooltip = <i>UI element</i> that stacks content over a base element. <p> The first child is the base; every further child is placed over it. A child that is a <i>layer element</i> brings the position it takes and a CSS class of its own; any other child covers the base as a whole. A caption over a picture, a badge in the corner of an avatar and a scrim over a card are all the same composition. </p> <p> The base gives the overlay its height; its width is what the surrounding layout grants, and a base sized relative to the overlay fills it. A base of fixed width wants a container that does not stretch its items, such as a stack aligned to its start: stretched past its base, the overlay anchors its layers to the free space beside the base rather than to the base. </p> <p> A layer passes the pointer through wherever it shows nothing, so that the base stays usable below the free space of a layer that only anchors a small element. </p>
com.top_logic.layout.view.element.PanelElement = Panel element
com.top_logic.layout.view.element.PanelElement.Config.appearance = Appearance
com.top_logic.layout.view.element.PanelElement.Config.appearance.tooltip = The panel's visual variant: card renders a bordered, rounded panel with compact content insets, e.g. for one entry of an item list.
com.top_logic.layout.view.element.PanelElement.Config.fill = Fill
com.top_logic.layout.view.element.PanelElement.Config.fill.tooltip = Whether the panel fills the bounded height of its container instead of growing with its content. <p> Enable this for a panel whose single child scrolls internally - in particular a table (<i>table view control</i>), which only bounds its scroll viewport (and virtualizes) when its container has a definite height. A plain (non-filling) panel grows with its content, so a large table would overflow and scroll the surrounding tab rather than itself. </p> <p> The containers between a filling panel and the next bounded box grow with it, so the panel fills the available height wherever it sits - nested in stacks, in a tab or in the frame of a drill-down stack. </p>
com.top_logic.layout.view.element.PanelElement.Config.hover-actions = Hover actions
com.top_logic.layout.view.element.PanelElement.Config.hover-actions.tooltip = Whether the header's toolbar buttons stay hidden until the pointer hovers over the panel or a button receives keyboard focus. <p> Reduces visual noise in repeated panels such as comment lists. Note that on touch devices there is no hover; the buttons appear there once a control inside the panel is focused. </p>
com.top_logic.layout.view.element.PanelElement.Config.title = Title
com.top_logic.layout.view.element.PanelElement.Config.title-content = Title content
com.top_logic.layout.view.element.PanelElement.Config.title-content.tooltip = Elements rendered in the header's title area, e.g. an avatar with a name and a timestamp. <p> Rendered after the <i>Title</i> text; multiple elements are laid out in a horizontal row. </p>
com.top_logic.layout.view.element.PanelElement.Config.title.tooltip = The panel title displayed in the toolbar header.
com.top_logic.layout.view.element.PanelElement.Config.width = Width
com.top_logic.layout.view.element.PanelElement.Config.width.tooltip = A width of the panel's own, as a CSS length, e.g. 380px. <p> A panel of its own width does not stretch across its container, so the container's alignment places it: inside a <stack align="center"> it is centered, which is how a form of fixed width is placed on an otherwise empty page. The width is a preference, not a minimum - the panel never grows beyond the space there is. </p> <p> Unset, the panel takes the width its container offers. </p>
com.top_logic.layout.view.element.PanelElement.tooltip = UIElement that wraps <i>react panel control</i>. <p> Renders a titled panel with a toolbar header. Commands configured in the <commands> section are available to child elements via the command scope and toolbar-placed commands are automatically rendered as clique-grouped toolbar buttons. </p>
com.top_logic.layout.view.element.PdfElement = Pdf element
com.top_logic.layout.view.element.PdfElement.Config.input = Input
com.top_logic.layout.view.element.PdfElement.Config.input.tooltip = Channel whose <i>binary data</i> value (a PDF document) is displayed.
com.top_logic.layout.view.element.PdfElement.tooltip = <i>UI element</i> that displays a <i>binary data</i> PDF document via the <i>react pdf viewer control</i> (TLPdfViewer). <p> The PDF is read from an input channel and kept in sync with that channel: when the channel value changes, the displayed document is updated. This element is the declarative rendering target for PDF content; a higher-level Office-document viewer can convert .docx/.xlsx/ .pptx to PDF and bind the result to the same channel. </p>
com.top_logic.layout.view.element.ProgressElement = Progress element
com.top_logic.layout.view.element.ProgressElement.Config.done = Done
com.top_logic.layout.view.element.ProgressElement.Config.done.tooltip = TL-Script expression answering how much is done, the numerator of the fraction. <p> Given together with the total, and never together with the fraction. </p>
com.top_logic.layout.view.element.ProgressElement.Config.fraction = Fraction
com.top_logic.layout.view.element.ProgressElement.Config.fraction.tooltip = TL-Script expression answering the filled part of the bar, a number between 0 and 1. <p> Excludes the two counts, which state the same thing as a ratio. An expression that answers nothing at all - a bar over an operation that does not know how far it has come - leaves the bar without a share, which the client sweeps rather than fills. </p>
com.top_logic.layout.view.element.ProgressElement.Config.input = Input
com.top_logic.layout.view.element.ProgressElement.Config.input.tooltip = Channel whose value every expression of this element is called with, and whose change recomputes the bar. <p> A bar computed from the model as a whole needs none; its expressions are then called with no value. </p>
com.top_logic.layout.view.element.ProgressElement.Config.label = Label
com.top_logic.layout.view.element.ProgressElement.Config.label.tooltip = TL-Script expression answering the text displayed beside the bar. <p> Without one, a bar stated as two counts is labelled with them ("3 / 7") and a bar stated as a fraction carries no label. </p>
com.top_logic.layout.view.element.ProgressElement.Config.observed-types = Observed types
com.top_logic.layout.view.element.ProgressElement.Config.observed-types.tooltip = Types whose object changes (create / update / delete) recompute the bar, in addition to the object on the input channel, which is always observed. <p> Configure this for a bar whose counts reach beyond the input object - one counting all objects of a type, or the members of a collection the input merely contains. </p>
com.top_logic.layout.view.element.ProgressElement.Config.total = Total
com.top_logic.layout.view.element.ProgressElement.Config.total.tooltip = TL-Script expression answering how much there is in all, the denominator of the fraction. <p> Given together with what is done, and never together with the fraction. A total of zero leaves the bar empty. </p>
com.top_logic.layout.view.element.ProgressElement.tooltip = <i>UI element</i> displaying a fraction as a bar with an optional label, via the <i>react progress control</i>. <p> The fraction is stated either directly, as a number between 0 and 1, or as the two counts it is the ratio of - a "3 of 7 done", which is also the label such a bar carries unless another one is given. The two forms exclude each other. </p> <p> A fraction that answers nothing at all is the indeterminate bar: it says that something is going on without saying how far it has come, and the client sweeps it instead of filling a share of it. A bar following an operation that learns its share only later therefore switches between the two displays as the operation reports. </p> <p> Every expression is called with the current value of the input channel, and the bar is recomputed whenever that value changes, whenever the object on it changes, and whenever an object of an observed type is created, changed or deleted - a bar counting the members of a collection follows a member joining or leaving it only through the latter. </p>
com.top_logic.layout.view.element.RelativeTimeElement = Relative time element
com.top_logic.layout.view.element.RelativeTimeElement.Config.input = Input
com.top_logic.layout.view.element.RelativeTimeElement.Config.input.tooltip = Channel whose date value is displayed.
com.top_logic.layout.view.element.RelativeTimeElement.tooltip = Declarative <i>UI element</i> displaying a channel's date value as relative time ("5 minutes ago"), with the exact timestamp as tooltip.
com.top_logic.layout.view.element.ScrollLinkElement = Scroll link element
com.top_logic.layout.view.element.ScrollLinkElement.Config.input = Input
com.top_logic.layout.view.element.ScrollLinkElement.Config.input.tooltip = Channel providing the object to scroll to; the link is hidden while it is null.
com.top_logic.layout.view.element.ScrollLinkElement.Config.label = Label
com.top_logic.layout.view.element.ScrollLinkElement.Config.label.tooltip = TL-Script function computing the link text from the target object: target -> text. <p> When unset, the target object's label is used. </p>
com.top_logic.layout.view.element.ScrollLinkElement.tooltip = Declarative <i>UI element</i> rendering a link that scrolls the view to the &lt;anchor&gt; of the object on the input channel. <p> The link is hidden while the input is null, so it can display a "cited"/"reply-to" reference only when set. The link text is the object's label, or the result of an optional label function. </p> <p> The link is also hidden once its target object is deleted: its anchor is then no longer rendered, so scrolling to it would go nowhere. This keeps a citation link consistent with the model when the cited object is removed, even while the channel still holds the now-deleted object. </p>
com.top_logic.layout.view.element.SessionTimeoutNoticeElement = Session timeout notice element
com.top_logic.layout.view.element.SessionTimeoutNoticeElement.Config.lead-seconds = Advance warning time (seconds)
com.top_logic.layout.view.element.SessionTimeoutNoticeElement.Config.lead-seconds.tooltip = How long before the end of the session the warning appears, in seconds.
com.top_logic.layout.view.element.SessionTimeoutNoticeElement.tooltip = Warns the user that the session is about to end. <p> Placed in the <notices> area of an <app-shell>, the element counts down to the moment the session times out and stays out of the way until the remaining time falls below <i>advance warning time (seconds)</i>. </p> <p> Clicking the notice continues the session: the request carrying the click restarts the inactivity timeout like any other, so the count-down starts over. </p> <p> What ends the session is left to the container - a browser whose timers were suspended, in a laptop that was closed, must not decide that a session is over just because its count-down reached zero. The container, however, discards a timed-out session only once a request arrives: while a window holds its SSE connection open, nothing scavenges it, so nobody would tell the browser that its session has ended. The client therefore asks, a grace period after the count-down passed zero, and the answer is the server's - the reload every window of an ended session receives, or a new deadline. </p>
com.top_logic.layout.view.element.SidebarElement = Sidebar element
com.top_logic.layout.view.element.SidebarElement$NavItemElement = Nav item element
com.top_logic.layout.view.element.SidebarElement$NavItemElement.tooltip = Implementation of a navigation sidebar item.
com.top_logic.layout.view.element.SidebarElement$SeparatorElement = Separator element
com.top_logic.layout.view.element.SidebarElement$SeparatorElement.tooltip = Implementation of a separator sidebar item.
com.top_logic.layout.view.element.SidebarElement.Config.active-item = Active item
com.top_logic.layout.view.element.SidebarElement.Config.active-item.tooltip = The ID of the initially active item, or empty for the first navigation item.
com.top_logic.layout.view.element.SidebarElement.Config.collapsed = Collapsed
com.top_logic.layout.view.element.SidebarElement.Config.collapsed.tooltip = Whether the sidebar starts collapsed.
com.top_logic.layout.view.element.SidebarElement.Config.drawer-open-slot-name = Drawer open slot name
com.top_logic.layout.view.element.SidebarElement.Config.drawer-open-slot-name.tooltip = Name of the slot into which the sidebar contributes a hamburger button that opens the mobile drawer. <p> If non-empty, the sidebar emits a SlotContentControl carrying a DrawerToggleControl addressed to <slot name="<this-value>"/>. By convention the placeholder is declared in the app bar's leading area (e.g. <leading><slot name="appbar-leading"/></leading>), so the button surfaces in the app bar at mobile breakpoints. Leave empty to suppress the contribution entirely — useful when the sidebar is used in a layout without an app bar or with a different mobile entry point. </p>
com.top_logic.layout.view.element.SidebarElement.Config.footer = Footer
com.top_logic.layout.view.element.SidebarElement.Config.footer-collapsed = Footer collapsed
com.top_logic.layout.view.element.SidebarElement.Config.footer-collapsed.tooltip = What the rail shows below its items while it is folded to a narrow strip. <p> A folded rail offers room for an avatar, not for a name beside it, so it shows this in place of the footer. Left empty, the folded rail has no footer. </p>
com.top_logic.layout.view.element.SidebarElement.Config.footer.tooltip = What the rail shows below its items: the account area, a version note, a help link. <p> The content stands at the bottom of the rail, outside the list of items, and is shown for as long as the sidebar is on screen. Left empty, the rail ends with its last item. </p>
com.top_logic.layout.view.element.SidebarElement.Config.header = Header
com.top_logic.layout.view.element.SidebarElement.Config.header-collapsed = Header collapsed
com.top_logic.layout.view.element.SidebarElement.Config.header-collapsed.tooltip = What the rail shows above its items while it is folded to a narrow strip. <p> A folded rail offers room for an icon, not for a name and a search field, so it shows this in place of the header. Left empty, the folded rail has no header. </p>
com.top_logic.layout.view.element.SidebarElement.Config.header.tooltip = What the rail shows above its items: a product logo, the name of the application, a search field. <p> The content stands at the top of the rail, outside the list of items, and is shown for as long as the sidebar is on screen. Left empty, the rail begins with its first item. </p>
com.top_logic.layout.view.element.SidebarElement.Config.items = Items
com.top_logic.layout.view.element.SidebarElement.Config.items.tooltip = The sidebar items.
com.top_logic.layout.view.element.SidebarElement.NavItemConfig.badge = Badge
com.top_logic.layout.view.element.SidebarElement.NavItemConfig.badge.tooltip = Channel whose value is displayed as a badge beside the item's label - the number of things waiting in the page the item leads to, say. <p> The value is named as the model names it, through the <i>default label</i>; no value and an empty text show no badge at all. The badge follows both a new value on the channel and a change of the object that value points to, so a count computed from an edited object is up to date without the channel being written anew. </p>
com.top_logic.layout.view.element.SidebarElement.NavItemConfig.children = Children
com.top_logic.layout.view.element.SidebarElement.NavItemConfig.children.tooltip = The content elements shown when this item is selected.
com.top_logic.layout.view.element.SidebarElement.NavItemConfig.hidden = Hidden
com.top_logic.layout.view.element.SidebarElement.NavItemConfig.hidden.tooltip = Whether the item is withheld from the sidebar. <p> A hidden item is not displayed, but stays reachable by its route: the page a URL leads to directly, which has no place of its own in the navigation. </p>
com.top_logic.layout.view.element.SidebarElement.NavItemConfig.icon = Icon
com.top_logic.layout.view.element.SidebarElement.NavItemConfig.icon.tooltip = The CSS icon class (e.g. "bi bi-speedometer2").
com.top_logic.layout.view.element.SidebarElement.NavItemConfig.label = Label
com.top_logic.layout.view.element.SidebarElement.NavItemConfig.label.tooltip = The display label.
com.top_logic.layout.view.element.SidebarElement.NavItemConfig.route = Route
com.top_logic.layout.view.element.SidebarElement.NavItemConfig.route.tooltip = The route segment for this item. <p> By default (not set), the item's ID is used as the route segment. Set to "none" to explicitly opt out of routing. Set to a custom value to use a route segment different from the ID. Routes are always relative (no leading slash). </p>
com.top_logic.layout.view.element.SidebarElement.SidebarItemConfig.id = ID
com.top_logic.layout.view.element.SidebarElement.SidebarItemConfig.id.tooltip = The unique item identifier.
com.top_logic.layout.view.element.SidebarElement.tooltip = UIElement that wraps <i>react sidebar control</i>. <p> Renders a sidebar of items: navigation items with content that is lazily created when the item is selected, collapsible groups of further items, headings, items executing a command, and separators. </p>
com.top_logic.layout.view.element.SplitPanelElement = Split panel element
com.top_logic.layout.view.element.SplitPanelElement$PaneConfig = Pane configuration
com.top_logic.layout.view.element.SplitPanelElement$PaneConfig.tooltip = Configuration for a single pane in the split panel.
com.top_logic.layout.view.element.SplitPanelElement.Config.orientation = Orientation
com.top_logic.layout.view.element.SplitPanelElement.Config.orientation.tooltip = The layout orientation.
com.top_logic.layout.view.element.SplitPanelElement.Config.panes = Panes
com.top_logic.layout.view.element.SplitPanelElement.Config.panes.tooltip = The child pane definitions.
com.top_logic.layout.view.element.SplitPanelElement.Config.resizable = Resizable
com.top_logic.layout.view.element.SplitPanelElement.Config.resizable.tooltip = Whether draggable splitters are shown between panes.
com.top_logic.layout.view.element.SplitPanelElement.PaneConfig.children = Children
com.top_logic.layout.view.element.SplitPanelElement.PaneConfig.children.tooltip = The content elements in this pane.
com.top_logic.layout.view.element.SplitPanelElement.PaneConfig.min-size = Minimum size
com.top_logic.layout.view.element.SplitPanelElement.PaneConfig.min-size.tooltip = The minimum size in pixels (0 for no minimum).
com.top_logic.layout.view.element.SplitPanelElement.PaneConfig.size = Size
com.top_logic.layout.view.element.SplitPanelElement.PaneConfig.size.tooltip = The pane size in the given unit.
com.top_logic.layout.view.element.SplitPanelElement.PaneConfig.unit = Unit
com.top_logic.layout.view.element.SplitPanelElement.PaneConfig.unit.tooltip = The size unit.
com.top_logic.layout.view.element.SplitPanelElement.tooltip = UIElement that wraps <i>react split panel control</i>. <p> Renders a split panel with draggable splitters between child panes. Each <pane> defines its size, unit, and content elements. </p>
com.top_logic.layout.view.element.StackElement = Stack element
com.top_logic.layout.view.element.StackElement.Config.align = Align
com.top_logic.layout.view.element.StackElement.Config.align.tooltip = The cross-axis alignment.
com.top_logic.layout.view.element.StackElement.Config.direction = Direction
com.top_logic.layout.view.element.StackElement.Config.direction.tooltip = The flex direction.
com.top_logic.layout.view.element.StackElement.Config.gap = Gap
com.top_logic.layout.view.element.StackElement.Config.gap.tooltip = The gap between children.
com.top_logic.layout.view.element.StackElement.Config.justify = Justify
com.top_logic.layout.view.element.StackElement.Config.justify.tooltip = How the children are distributed along the direction of the stack. <p> Where the children together are smaller than the stack, this decides what happens with the space left over: it stays behind them (the default), before them, on both sides, or it is divided between them - a title and the actions belonging to it pushed to the opposite ends of a row, a row of buttons centered under a form. </p>
com.top_logic.layout.view.element.StackElement.Config.max-width = Maximum width
com.top_logic.layout.view.element.StackElement.Config.max-width.tooltip = The largest width the stack takes, as a CSS length such as "60rem". <p> A stack of a bounded width is centered in the space it is given, the space left over split between its two sides, which is how a column of running text stays readable on a wide screen. Below the bound nothing changes, so the stack still fills a narrow screen. </p> <p> Unset, the stack takes the width its container offers. </p>
com.top_logic.layout.view.element.StackElement.Config.wrap = Wrap
com.top_logic.layout.view.element.StackElement.Config.wrap.tooltip = Whether the children flow into further lines once they no longer fit next to each other. <p> A wrapping row keeps the size of its children instead of shrinking them into one line, which is what a row of items that each need a readable width - chips, cards, filter buttons - does on a narrow screen. Unset, the children stay in one line. </p>
com.top_logic.layout.view.element.StackElement.tooltip = UIElement that wraps <i>react stack control</i>. <p> Renders a flexbox container that arranges its children along a configurable direction: with a configurable gap and alignment, with the space left over distributed as configured, flowing into further lines where asked to, and bounded to a width it is then centered in. </p>
com.top_logic.layout.view.element.SwitchElement = Switch element
com.top_logic.layout.view.element.SwitchElement$CaseConfig = Case configuration
com.top_logic.layout.view.element.SwitchElement$CaseConfig.tooltip = Configuration for a single <case> of a <i>switch element</i>.
com.top_logic.layout.view.element.SwitchElement.CaseConfig.content = Content
com.top_logic.layout.view.element.SwitchElement.CaseConfig.content.tooltip = The content elements shown when this case is chosen.
com.top_logic.layout.view.element.SwitchElement.CaseConfig.test = Test
com.top_logic.layout.view.element.SwitchElement.CaseConfig.test.tooltip = TL-Script predicate called with the current value of the switch's input channel; this case is chosen when it returns true.
com.top_logic.layout.view.element.SwitchElement.Config.cases = Cases
com.top_logic.layout.view.element.SwitchElement.Config.cases.tooltip = The cases, evaluated in order; the first matching case is shown.
com.top_logic.layout.view.element.SwitchElement.Config.default = Default
com.top_logic.layout.view.element.SwitchElement.Config.default.tooltip = Content shown when no <case> matches; empty for no fallback content.
com.top_logic.layout.view.element.SwitchElement.Config.input = Input
com.top_logic.layout.view.element.SwitchElement.Config.input.tooltip = The channel whose current value is passed to every <case> test predicate to choose the visible content.
com.top_logic.layout.view.element.SwitchElement.Config.observed-types = Observed types
com.top_logic.layout.view.element.SwitchElement.Config.observed-types.tooltip = Types whose object changes (create / update / delete) trigger a re-evaluation of the cases, in addition to the input object, which is always observed. <p> Configure this only for a test that navigates beyond the input object, e.g. one deciding by an attribute of the input's container: a change of that other object is invisible to the input's own observation. Empty (default) observes just the input object. </p>
com.top_logic.layout.view.element.SwitchElement.tooltip = UIElement that shows exactly one of several configured content views, chosen by evaluating a TL-Script predicate per <case> against the value of an input channel. <p> The cases are tested in configuration order; the first whose test returns true is shown. If none matches, the <default> content is shown (or nothing if no default is configured). The switch re-evaluates whenever the input channel changes, and also when the input object itself is changed (a test typically decides by an attribute of that object, which can be edited without the channel value changing) - see <i>Observed types</i> for tests reaching beyond the input object. It only swaps the visible view when the matching case actually changes - within a single case the content (bound to its own channels) updates itself. </p> <p> When the matching case changes, the previously shown content is disposed rather than cached, so a hidden case leaves no contributions (e.g. a form's edit/save/cancel commands) behind in the enclosing scope. </p>
com.top_logic.layout.view.element.TabBarElement = Tab bar element
com.top_logic.layout.view.element.TabBarElement$TabConfig = Tab configuration
com.top_logic.layout.view.element.TabBarElement$TabConfig.tooltip = Configuration for a single tab.
com.top_logic.layout.view.element.TabBarElement.Config.active-tab = Active tab
com.top_logic.layout.view.element.TabBarElement.Config.active-tab.tooltip = The ID of the initially active tab, or empty for the first tab.
com.top_logic.layout.view.element.TabBarElement.Config.tabs = Tabs
com.top_logic.layout.view.element.TabBarElement.Config.tabs.tooltip = The tab definitions.
com.top_logic.layout.view.element.TabBarElement.TabConfig.children = Children
com.top_logic.layout.view.element.TabBarElement.TabConfig.children.tooltip = The content elements shown when this tab is active.
com.top_logic.layout.view.element.TabBarElement.TabConfig.icon = Icon
com.top_logic.layout.view.element.TabBarElement.TabConfig.icon.tooltip = The CSS icon class shown next to the tab label (e.g. "css:fa-solid fa-tags"), or empty for no icon.
com.top_logic.layout.view.element.TabBarElement.TabConfig.id = ID
com.top_logic.layout.view.element.TabBarElement.TabConfig.id.tooltip = The unique tab identifier.
com.top_logic.layout.view.element.TabBarElement.TabConfig.label = Label
com.top_logic.layout.view.element.TabBarElement.TabConfig.label.tooltip = The tab display label.
com.top_logic.layout.view.element.TabBarElement.TabConfig.route = Route
com.top_logic.layout.view.element.TabBarElement.TabConfig.route.tooltip = The route segment for this tab. <p> By default (not set), the tab's ID is used as the route segment. Set to "none" to explicitly opt out of routing. Set to a custom value to use a route segment different from the ID. Routes are always relative (no leading slash). </p>
com.top_logic.layout.view.element.TabBarElement.tooltip = UIElement that wraps <i>react tab bar control</i>. <p> Renders a tab bar with lazily created content for each tab. Each <tab> child in the configuration defines a tab with an ID, label, and inline content elements. Selecting a tab creates the content controls on demand and caches them. </p>
com.top_logic.layout.view.element.TableElement = Table element
com.top_logic.layout.view.element.TableElement$CriterionConfig = Criterion configuration
com.top_logic.layout.view.element.TableElement$CriterionConfig.tooltip = What a <i>preset configuration</i> selects in one column. <p> A criterion says what it selects in one of two ways: as a value the column's own filter translates, or in the form of that filter itself. Exactly one of the two is declared. </p>
com.top_logic.layout.view.element.TableElement$DragConfig = Drag configuration
com.top_logic.layout.view.element.TableElement$DragConfig.tooltip = Configuration of the <drag> of a <i>table element</i>: that its rows may be dragged, and what they are announced as.
com.top_logic.layout.view.element.TableElement$DropConfig = Drop configuration
com.top_logic.layout.view.element.TableElement$DropConfig.tooltip = Configuration of one <drop> of a <i>table element</i>: what it accepts, what it targets, and what it does.
com.top_logic.layout.view.element.TableElement$PresetConfig = Preset configuration
com.top_logic.layout.view.element.TableElement$PresetConfig.tooltip = A filter criterion a <i>table element</i> offers under a name.
com.top_logic.layout.view.element.TableElement$PresetsConfig = Presets configuration
com.top_logic.layout.view.element.TableElement$PresetsConfig.tooltip = Container for the list of <i>preset configurations</i> of a <i>table element</i>.
com.top_logic.layout.view.element.TableElement.Config.activation-button = Activation button
com.top_logic.layout.view.element.TableElement.Config.activation-button.tooltip = Whether every row shows a button running the activation command for it. <p> The button sits in a column of its own at the right edge of the table, which stays there while the table is scrolled. It offers the row activation where the gestures running it - a double-click, Enter on the cursor row - are neither visible nor available: a touch device has neither. Each button follows the command's executability for its own row, so a row the rules reject shows a disabled button and a row they hide shows none. </p> <p> Switch it off for a table whose rows are opened another way - a link in a cell, a command of the surrounding toolbar. A table without an activation command shows no button in any case. </p>
com.top_logic.layout.view.element.TableElement.Config.active-preset = Active preset
com.top_logic.layout.view.element.TableElement.Config.active-preset.tooltip = Optional <i>view channel</i> holding the name of the named filter this table is filtered by, and nothing while it matches none of them. <p> It carries the name of a preset as well as the generated name of a filter the user saved, and it works in both directions: a name written to it filters the table by that filter, and a name nothing carries - a link that has outlived the preset it names - leaves the table unfiltered and is corrected to what the table shows. </p> <p> A preset says which rows are selected, not what is searched for, so the name stays on the channel while the user searches within the preset. </p> <p> Bound to a query parameter, this is what makes a filtered table linkable, together with the searched text. </p>
com.top_logic.layout.view.element.TableElement.Config.columns = Columns
com.top_logic.layout.view.element.TableElement.Config.columns.tooltip = The columns to display, in display order. <p> Unset, the table shows the main properties of its row type, and all of its non-hidden attributes when the type names none. </p>
com.top_logic.layout.view.element.TableElement.Config.create-type = Create type
com.top_logic.layout.view.element.TableElement.Config.create-type.tooltip = The concrete type instantiated when a new row is created in edit mode. <p> When unset, the table offers no row creation. </p>
com.top_logic.layout.view.element.TableElement.Config.drag = Drag
com.top_logic.layout.view.element.TableElement.Config.drag.tooltip = Makes the rows of this table draggable, so they can be dropped on a display that accepts their type. <p> Dragging a selected row drags the whole selection, an unselected row drags itself. Unset (default) leaves the rows undraggable. </p>
com.top_logic.layout.view.element.TableElement.Config.drops = Drops
com.top_logic.layout.view.element.TableElement.Config.drops.tooltip = What this table accepts a drop of, and what it does with the dropped objects. <p> A drop is applied by the first declared entry that accepts it, so a table can accept several kinds of object - and accept one of them on its rows and another as a whole. Empty (default) leaves the table accepting no drop. </p>
com.top_logic.layout.view.element.TableElement.Config.filter-bar = Filter bar
com.top_logic.layout.view.element.TableElement.Config.filter-bar.tooltip = Whether the table shows its filter bar: the named filters it offers as chips, a search field examining the displayed columns, and the option to save the current filter under a name of the user's own. <p> A table that declares presets shows the bar in any case - that is where the presets are offered. </p>
com.top_logic.layout.view.element.TableElement.Config.fixed-columns = Fixed columns
com.top_logic.layout.view.element.TableElement.Config.fixed-columns.tooltip = How many of the leading columns stay in place while the table is scrolled horizontally. <p> With a table wider than its viewport, the columns beyond these disappear behind them. The user can move the boundary (by dragging it, or through the column header's context menu); the value configured here is what a table starts with, until a personalization of its own exists. Zero (default) keeps no column in place. </p>
com.top_logic.layout.view.element.TableElement.Config.group-by = Group by
com.top_logic.layout.view.element.TableElement.Config.group-by.tooltip = The name of the column whose value the rows are initially grouped by: one collapsible header row per value, showing that value, how many rows it holds and what the other columns aggregate over them. <p> The user regroups the table from a column header or from the column selection, and that choice is kept under the table's personalization key, so this is the grouping a table starts with until a personalization of its own exists. Unset (default) starts ungrouped. Rows are grouped by one column at a time. </p>
com.top_logic.layout.view.element.TableElement.Config.observed-types = Observed types
com.top_logic.layout.view.element.TableElement.Config.observed-types.tooltip = Types whose object changes (create / update / delete) trigger a re-evaluation of the rows, so the table refreshes automatically. Empty (default) keeps the table static.
com.top_logic.layout.view.element.TableElement.Config.on-activate = On activate
com.top_logic.layout.view.element.TableElement.Config.on-activate.tooltip = The command a row activation runs - a double-click on the row, or Enter while the row carries the keyboard cursor. <p> The activated row becomes the table's selection first, then the command runs with that row as its input. The command's own executability rules decide over the row, so a row the rules reject activates nothing. Without a command, activating a row only selects it. </p> <p> Configured as <on-activate class="..." .../> inside the <table> element. </p>
com.top_logic.layout.view.element.TableElement.Config.on-remove = On remove
com.top_logic.layout.view.element.TableElement.Config.on-remove.tooltip = What removing a row means when the form is saved. <p> When unset, the table offers no row removal. </p>
com.top_logic.layout.view.element.TableElement.Config.presets = Presets
com.top_logic.layout.view.element.TableElement.Config.presets.tooltip = Filter criteria this table offers under a name, displayed as chips in the filter bar. <p> A preset is applied - and dropped again - in one click, and the bar marks the preset whose criteria the table currently filters by. The user's own saved filters are offered next to them; they are kept under the table's personalization key, so a table offering presets should configure personalization-key as well. </p>
com.top_logic.layout.view.element.TableElement.Config.row-edit = Row edit
com.top_logic.layout.view.element.TableElement.Config.row-edit.tooltip = Which rows are editable while the enclosing form is in edit mode. <p> When set, the table must be nested inside a form; cell edits buffer on row overlays and are committed together with the form's save. By default the table is read-only. </p>
com.top_logic.layout.view.element.TableElement.Config.rows = Rows
com.top_logic.layout.view.element.TableElement.Config.rows.tooltip = TL-Script function computing the row objects (a <i>collection</i>). <p> The values of the declared inputs come first, in declaration order. </p>
com.top_logic.layout.view.element.TableElement.Config.search-term = Search term
com.top_logic.layout.view.element.TableElement.Config.search-term.tooltip = Optional <i>view channel</i> holding the text this table searches its displayed columns for, and nothing while it searches for none. <p> It works in both directions: what the user types into the search field of the filter bar reaches the channel, and a text written to the channel is searched for - so a table without a bar of its own can be searched from an input elsewhere. </p> <p> The search narrows the rows within whatever the table is filtered by, so a preset the table matches goes on being the active preset while the text is searched for. Bound to query parameters, the two together are one address: the preset and the text the user sees the table under. A filter the user saved while searching is the exception - it carries the text it was saved with, and matches only while exactly that text is searched for. </p>
com.top_logic.layout.view.element.TableElement.Config.selection = Selection
com.top_logic.layout.view.element.TableElement.Config.selection-mode = Selection mode
com.top_logic.layout.view.element.TableElement.Config.selection-mode.tooltip = Whether the user may select one row at a time, or any number of them. <p> <i>Single</i> (the default) replaces the selection with every click, and a click on the selected row with Ctrl gives it up again. </p> <p> <i>Multiple</i> puts a checkbox in front of every row and one in the header selecting and deselecting all of them; a click with Ctrl adds a row to the selection or takes it out again, a click with Shift selects the range from the row selected last, and Ctrl+A selects every row. </p> <p> The selection channel holds the selected row object while exactly one row is selected, the set of the selected row objects while there are several, and nothing while there is none - so a display bound to the channel works with either mode, and only one that is to show several rows at once has to expect a set. </p>
com.top_logic.layout.view.element.TableElement.Config.selection.tooltip = Optional <i>view channel</i> to write the selected row object(s) to.
com.top_logic.layout.view.element.TableElement.Config.types = Types
com.top_logic.layout.view.element.TableElement.Config.types.tooltip = Optional qualified TL type name(s) of the row objects, used to resolve column labels from the model attributes. When unset, the type is derived from the first row.
com.top_logic.layout.view.element.TableElement.CriterionConfig.column = Column
com.top_logic.layout.view.element.TableElement.CriterionConfig.column.tooltip = The attribute of the column this criterion filters. <p> The table must have a column for that attribute, and that column must be filterable. </p>
com.top_logic.layout.view.element.TableElement.CriterionConfig.expr = Expression
com.top_logic.layout.view.element.TableElement.CriterionConfig.expr.tooltip = TL-Script expression computing the value the column is filtered by. <p> It is evaluated when the table is built and whenever one of its inputs changes, with the input values as its arguments - so an expression like currentUser() yields a preset that means something different to every user, and one over an input yields a preset that follows what is displayed elsewhere. Which value the expression may yield depends on the filter of the column: a text filter accepts any single value and matches its text, a selection filter accepts one of the values to select or a list of them, a boolean filter accepts true or false, and a range filter accepts a single value to match exactly or a list of two values as the inclusive bounds of a range. A value the column's filter cannot express is reported as a configuration error, and the preset is then not offered. </p> <p> Alternatively the criterion is written in the form of the column's filter, see <i>criterion form</i>; a criterion declares one of the two, not both. </p>
com.top_logic.layout.view.element.TableElement.CriterionConfig.inverted = Inverted
com.top_logic.layout.view.element.TableElement.CriterionConfig.inverted.tooltip = Whether the column accepts exactly the rows this criterion does <em>not</em> select. <p> Only a filter that offers the user to invert it can be inverted here, too; inverting one that does not is a configuration error. </p>
com.top_logic.layout.view.element.TableElement.CriterionConfig.states = Criterion form
com.top_logic.layout.view.element.TableElement.CriterionConfig.states.tooltip = The criterion written in the form of the column's filter, as an alternative to the value of <i>Expression</i>: a text pattern with its matching options, a comparison, a selection, or the accepted truth values. <p> This is the form for everything a single value cannot say - a case-sensitive pattern, a one-sided comparison, several accepted truth values at once. At most one criterion form is declared, and a criterion declaring none is a configuration error, just as one declaring both a form and a value is. </p>
com.top_logic.layout.view.element.TableElement.DragConfig.type = Type
com.top_logic.layout.view.element.TableElement.DragConfig.type.tooltip = The type the dragged rows are announced as, which a drop accepts them by. <p> Defaults to the first of the table's declared row types. A table declaring neither is a configuration error: nothing would say what its rows are. </p>
com.top_logic.layout.view.element.TableElement.DropConfig.accept = Accept
com.top_logic.layout.view.element.TableElement.DropConfig.accept.tooltip = The types of the objects this drop accepts. <p> A subtype of an accepted type is accepted as well. Acceptance is decided over the model on the server; the client is told the resulting set of type names, so a drag it cannot be applied to is not offered in the first place. </p>
com.top_logic.layout.view.element.TableElement.DropConfig.actions = Actions
com.top_logic.layout.view.element.TableElement.DropConfig.actions.tooltip = The chain of actions applying the drop, receiving the dropped objects as the input of its first action.
com.top_logic.layout.view.element.TableElement.DropConfig.target = Target
com.top_logic.layout.view.element.TableElement.DropConfig.target-channel = Target channel
com.top_logic.layout.view.element.TableElement.DropConfig.target-channel.tooltip = A <i>view channel</i> the target row is written to before the actions run, so they can read what was dropped on. <p> Unset (default) leaves the target unpublished, which is what a <i>table</i> drop needs - it has no target row, and writes null where a channel is declared anyway. </p>
com.top_logic.layout.view.element.TableElement.DropConfig.target.tooltip = Whether the table as a whole or a single row is the target of this drop.
com.top_logic.layout.view.element.TableElement.PresetConfig.criteria = Criteria
com.top_logic.layout.view.element.TableElement.PresetConfig.criteria.tooltip = What this preset filters by: one criterion per column. <p> A column not mentioned here is not filtered by this preset. </p>
com.top_logic.layout.view.element.TableElement.PresetConfig.label = Label
com.top_logic.layout.view.element.TableElement.PresetConfig.label.tooltip = The name displayed on this preset's chip. Without it, the technical name is displayed.
com.top_logic.layout.view.element.TableElement.PresetConfig.name = Name
com.top_logic.layout.view.element.TableElement.PresetConfig.name.tooltip = Technical name identifying this preset among the table's named filters. <p> It is what the user's choice of preset is remembered under, so it must not be changed once the table is in use. </p>
com.top_logic.layout.view.element.TableElement.PresetsConfig.initial = Initial
com.top_logic.layout.view.element.TableElement.PresetsConfig.initial.tooltip = The name of the preset the table is filtered by until the user decides about its filtering themselves. <p> This is what a user sees who opens the table for the first time - the open items, their own rows - instead of everything the table holds. It is part of the table's initial state, like its sort order and its grouping, so it takes effect only as long as no personalization of this table exists: a user who applied other criteria keeps them, and one who cleared the filter keeps the table unfiltered. </p> <p> Unset (default), the table starts out unfiltered. A name none of the declared presets carries is a configuration error. </p>
com.top_logic.layout.view.element.TableElement.PresetsConfig.presets = Presets
com.top_logic.layout.view.element.TableElement.PresetsConfig.presets.tooltip = The named filters the table offers, in the order they are displayed in.
com.top_logic.layout.view.element.TableElement.tooltip = Declarative <i>UI element</i> that renders a model-defined table (the <table> tag) through the green-field table model (<i>table view</i>) via a <i>table view control</i>. <p> Input data comes from <i>view channels</i>, rows are computed by a TL-Script expression, and each column is declared by an entry of the <columns> - over a model attribute of the rows, over a value computed from them, or over an object they point to. Columns are sortable and (per-column) filterable. </p> <p> What the user personalizes about a table - the column order, the column widths, which columns are displayed, the sort order - and the filters the user saves under a name are stored under the element's personalization key. Without a configured one, that key is the table's structural signature: its row types plus the names of its declared columns. That signature changes whenever a column is added or removed, and everything the users of the table personalized - their saved filters included - is then left behind. Setting personalization-key gives the table an identity of its own that survives such an edit of the view, so set it on every table whose personalization is meant to last. </p>
com.top_logic.layout.view.element.TextElement = Text element
com.top_logic.layout.view.element.TextElement.Config.appearance = Appearance
com.top_logic.layout.view.element.TextElement.Config.appearance.tooltip = The shape the text is drawn in: plain text (the default), or a pill whether or not the displayed value carries a color of its own.
com.top_logic.layout.view.element.TextElement.Config.input = Input
com.top_logic.layout.view.element.TextElement.Config.input.tooltip = Channel whose value is displayed (rendered via <i>default label</i>).
com.top_logic.layout.view.element.TextElement.Config.label = Label
com.top_logic.layout.view.element.TextElement.Config.label.tooltip = Static text to display. Ignored when an input channel is set.
com.top_logic.layout.view.element.TextElement.Config.overflow = Overflow
com.top_logic.layout.view.element.TextElement.Config.overflow.tooltip = How text longer than the available width is handled: wrapped onto multiple lines (the default) or truncated on a single line with an ellipsis.
com.top_logic.layout.view.element.TextElement.Config.tone = Tone
com.top_logic.layout.view.element.TextElement.Config.tone.tooltip = What the color of the text means: the color it is read in (the default), a lesser weight, an explaining hint, an accent, or an outcome (success, warning, error); on-color for text on a filled surface. <p> The color of the role comes from the design tokens of the active theme. </p>
com.top_logic.layout.view.element.TextElement.Config.variant = Variant
com.top_logic.layout.view.element.TextElement.Config.variant.tooltip = What the text is for: running text (the default), a title, a headline, a display statement, the label of a value or a caption. <p> The font family, size, line height and weight of the role come from the design tokens of the active theme. </p>
com.top_logic.layout.view.element.TextElement.tooltip = <i>UI element</i> that displays a text value via the <i>react text control</i> (TLText). <p> Either a static label or the value of an input channel (rendered through <i>default label</i>, updating reactively when the channel changes). </p> <p> A channel value the model gives a color - an enumeration literal, an object whose type computes the color of its instances - is displayed as a pill in that color. </p> <p> How the text is drawn is stated as roles: a typographic role, a color role and the shape it takes. Each role is filled from the design tokens of the active theme, so an application theme restyles every text of a role at once. </p> <p> The display follows a new value on the channel and a change of the object the channel holds: the label and the color are recomputed together, so the pill of an object whose state was edited follows that edit without the object being selected anew. </p>
com.top_logic.layout.view.element.TileElement = Tile element
com.top_logic.layout.view.element.TileElement.Config.action = Action
com.top_logic.layout.view.element.TileElement.Config.action.tooltip = The command that an activation of the tile runs. <p> With a command configured, the whole tile is the surface the user activates - the tile is what a dashboard offers as the entry point to what it shows. The command's own executability rules decide, so a tile whose command is refused says so instead of leading nowhere, and one whose command is hidden is a tile that only displays its content. </p> <p> A visible mark is placed by the tile's content, e.g. in the header of a card. </p> <p> Configured as <action class="..." .../> inside the <tile> element. </p>
com.top_logic.layout.view.element.TileElement.Config.content = Content
com.top_logic.layout.view.element.TileElement.Config.content.tooltip = The <i>UI element</i> rendered inside this tile.
com.top_logic.layout.view.element.TileElement.Config.id = ID
com.top_logic.layout.view.element.TileElement.Config.id.tooltip = Stable id identifying this tile. Used as the persistence key when users reorder tiles via drag-and-drop.
com.top_logic.layout.view.element.TileElement.Config.row-span = Row span
com.top_logic.layout.view.element.TileElement.Config.row-span.tooltip = The number of grid rows this tile spans. Defaults to 1.
com.top_logic.layout.view.element.TileElement.Config.width = Width
com.top_logic.layout.view.element.TileElement.Config.width.tooltip = The tile's relative width as a fraction of available columns.
com.top_logic.layout.view.element.TileElement.tooltip = A single tile in a dashboard. <p> Exactly one inner <i>UI element</i> is rendered inside the tile. The tile carries layout metadata: a stable id (used as persistence key for reordering), a relative width fraction and an optional row span. </p> <p> A tile with an action is an entry point: the whole tile is the surface the user activates, and the tile is announced by the action's label, or by the title of its content where the action carries no label of its own. The tile is marked as an entry point by how it answers the user - the pointer, the raise under it, the focus ring around it - and by its name. </p>
com.top_logic.layout.view.element.TreeElement = Tree element
com.top_logic.layout.view.element.TreeElement.Config.canExpandAll = Can expand all
com.top_logic.layout.view.element.TreeElement.Config.canExpandAll.tooltip = Whether the tree supports expand-all.
com.top_logic.layout.view.element.TreeElement.Config.children = Children
com.top_logic.layout.view.element.TreeElement.Config.children.tooltip = TL-Script function computing the children of a node. <p> Takes the input channel values followed by the parent business object as last argument. Returns a <i>collection</i> of child business objects. </p>
com.top_logic.layout.view.element.TreeElement.Config.nodeContent = Node content
com.top_logic.layout.view.element.TreeElement.Config.nodeContent.tooltip = How a node of the tree is displayed. <p> By default, a node shows the icon and the label of the object it stands for and a click on it selects that node, see <i>node display</i>. A node content configured explicitly is the general display of an object, which leads to the place the application shows that object at: </p> <pre> &lt;nodeContent class="com.top_logic.layout.react.controlprovider.MetaResourceControlProvider"/&gt; </pre>
com.top_logic.layout.view.element.TreeElement.Config.observed-types = Observed types
com.top_logic.layout.view.element.TreeElement.Config.observed-types.tooltip = Types to observe for object creation events. <p> When configured, the tree re-evaluates its root function when objects of these types are created. This enables automatic node insertion for trees that query all instances of a type. </p> <p> When empty (default), only updates and deletes of currently displayed nodes are observed. This is correct for trees whose nodes come directly from a channel. </p>
com.top_logic.layout.view.element.TreeElement.Config.on-activate = On activate
com.top_logic.layout.view.element.TreeElement.Config.on-activate.tooltip = The command a node activation runs - a double-click on the node, or Enter while the node carries the keyboard focus. <p> The activated node becomes the tree's selection first, then the command runs with that node's business object as its input. The command's own executability rules decide over that object, so a node the rules reject activates nothing. Without a command, activating a node only selects it. </p> <p> Configured as <on-activate class="..." .../> inside the <tree> element. </p>
com.top_logic.layout.view.element.TreeElement.Config.parents = Parents
com.top_logic.layout.view.element.TreeElement.Config.parents.tooltip = Optional TL-Script function computing what holds an object in the tree. <p> Takes the input channel values followed by an object as last argument, and returns the object whose child list holds it - nothing for the object the tree is built from, and for an object belonging to no tree at all. </p> <p> It is how the node of an object written to the selection channel is found: the tree walks from the object up to the one it is built from and descends along that chain, computing only the child lists on the way. Without it the node is searched for, which computes the child list of every node passed on the way - affordable for a tree of small extent, not for a large or an unbounded one. </p>
com.top_logic.layout.view.element.TreeElement.Config.root = Root
com.top_logic.layout.view.element.TreeElement.Config.root.tooltip = TL-Script function computing the root object of the tree. <p> Takes the input channel values as positional arguments and returns a single object to be used as the tree root. </p>
com.top_logic.layout.view.element.TreeElement.Config.selection = Selection
com.top_logic.layout.view.element.TreeElement.Config.selection-mode = Selection mode
com.top_logic.layout.view.element.TreeElement.Config.selection-mode.tooltip = Whether the user may select one node at a time, or any number of them. <p> <i>Single</i> (the default) replaces the selection with every click, and the arrow keys move the selection from node to node. </p> <p> <i>Multiple</i> keeps a plain click replacing the selection, but a click with Ctrl adds a node to it or takes it out again, and a click with Shift selects the range from the node the selection started at. The arrow keys then move the keyboard cursor alone, leaving the selection where it is; Space adds the node the cursor is on to the selection or takes it out again, and an arrow with Shift grows the range from the node the selection started at. </p> <p> The selection channel holds the business object of the selected node while exactly one node is selected, the set of those objects while there are several, and nothing while there is none - so a display bound to the channel works with either mode, and only one that is to show several objects at once has to expect a set. </p>
com.top_logic.layout.view.element.TreeElement.Config.selection.tooltip = Optional reference to the <i>view channel</i> holding the selection. <p> The business object of the selected node is written to it, and an object another writer puts on it is revealed and selected in the tree - an object the tree has no node for leaves both the channel and the selection alone. </p>
com.top_logic.layout.view.element.TreeElement.NodeDisplay.link.tooltip = Whether the node leads to the place the application shows its object at. <p> A node is the object's own place in the view, and a click on it selects the object. A link leaving the tree on that click is in the way, so a node is plain unless the tree asks for the link. Opening the object a node stands for is what <i>On activate</i> (<i>tree element configuration</i>) is for. </p>
com.top_logic.layout.view.element.TreeElement.tooltip = Declarative <i>UI element</i> that wraps a <i>react tree control</i>. <p> The object the tree is built from and the children of a node are computed by TL-Script functions over the values of the <i>view channels</i> the tree reads. A node's children are computed when somebody opens it, so a tree of any extent costs no more than what is displayed of it, and a node whose child list is empty is a leaf. </p> <p> The tree follows the model it displays: a deleted object loses its node, an object that appeared in a child list gets one, and the subtrees the user opened stay open through it. An input naming another object to build the tree from builds it anew, opening the subtrees that were open again wherever the new tree holds their objects. See <i>observable tree model</i>. </p> <p> The selection channel is read as well as written, see <i>tree selection binding</i>: the tree reveals and selects the node of an object another writer puts on it - the object a create command just made, for instance - and writes what the user selects back. </p>
com.top_logic.layout.view.element.ValueInputElement = Value input element
com.top_logic.layout.view.element.ValueInputElement.Config.clearable = Clearable
com.top_logic.layout.view.element.ValueInputElement.Config.clearable.tooltip = Whether the input offers a button that empties it. <p> For a value that is taken back as often as it is given - the term a table is searched by, the text a list is narrowed to - where emptying the input is a step of its own rather than the accident of deleting every character. The button is shown only while the input holds something and while it can be changed, and it writes the empty value at once rather than after the delay. </p> <p> Offered by an input over a text; an input over a number, a date, a truth value or a selection ignores it. </p>
com.top_logic.layout.view.element.ValueInputElement.Config.debounce = Debounce
com.top_logic.layout.view.element.ValueInputElement.Config.debounce.tooltip = How long the input waits after the last keystroke before the typed value reaches the channel, written as a duration (300ms, 1s). <p> A shorter wait makes whatever is computed from the value - the rows a search narrows to - follow the typing more closely, at the price of one round-trip per pause; a longer one waits for the user to stop. Empty for the wait a typed input uses by default. </p> <p> Only a value that is typed waits at all; a value that is picked - from a dropdown, a date picker, a checkbox - reaches the channel with the choice. An input whose value the server rewrites as it is stored, a number for instance, holds the value back until the input is left and ignores the wait altogether. </p>
com.top_logic.layout.view.element.ValueInputElement.Config.icon = Icon
com.top_logic.layout.view.element.ValueInputElement.Config.icon.tooltip = The icon shown inside the input, ahead of what is typed. <p> What kind of input this is, said as a picture: the magnifier of a search box, the envelope of a mail address. The icon is decoration - nothing happens when it is clicked, and a screen reader passes over it - so the input is still named by its label or its placeholder. </p> <p> An icon font class such as css:fa-solid fa-magnifying-glass or a path to an image. Shown by an input over a text; an input over a number, a date, a truth value or a selection ignores it. </p>
com.top_logic.layout.view.element.ValueInputElement.Config.input-control = Input control
com.top_logic.layout.view.element.ValueInputElement.Config.input-control.tooltip = The control the value is entered in, overriding the one its type implies. <p> The same choice a <field> makes for the attribute it displays, made for a value that belongs to the view instead: a selection offered as a cloud of toggles rather than as a list that opens on demand, a number dragged along a track rather than typed, a truth value flipped on a switch rather than ticked in a box. </p> <p> Left unset, the control is the one the type of the value leads to. </p>
com.top_logic.layout.view.element.ValueInputElement.Config.label = Label
com.top_logic.layout.view.element.ValueInputElement.Config.label-position = Label position
com.top_logic.layout.view.element.ValueInputElement.Config.label-position.tooltip = Where the input renders its label relative to itself, e.g. hide-label for a label-less input. <p> If not set, the position falls back to the responsive default of the enclosing layout. </p>
com.top_logic.layout.view.element.ValueInputElement.Config.label.tooltip = The label shown beside the input. <p> Without one, the input stands alone, which is what an input in a toolbar or above a list does, where the surrounding display says what it is for. </p>
com.top_logic.layout.view.element.ValueInputElement.Config.multiple = Multiple
com.top_logic.layout.view.element.ValueInputElement.Config.multiple.tooltip = Whether the channel holds a collection of values rather than a single one.
com.top_logic.layout.view.element.ValueInputElement.Config.on-submit = On submit
com.top_logic.layout.view.element.ValueInputElement.Config.on-submit.tooltip = The command run on the value the user submits. <p> A value the user finishes entering is written to the value channel and then handed to this command as its input. In a field the user types in - a text, a number - the value is finished by pressing Enter; in a field that is picked from - a dropdown, a date, a checkbox - every choice finishes it. </p> <p> A <i>generic view command</i> unless another command is named, so the actions to run on the value stand directly inside this element. </p>
com.top_logic.layout.view.element.ValueInputElement.Config.options = Options
com.top_logic.layout.view.element.ValueInputElement.Config.options.tooltip = The values to choose from. <p> Called with the values of the input channels as its arguments, so that the options can depend on what the rest of the view shows; without inputs, an expression computing the options directly. </p> <p> Without an expression, the options are those the type itself offers: the classifiers of an enumeration, the instances of a class. A value of a primitive type is then entered rather than chosen. </p> <p> The options are computed again whenever one of the input channels changes. </p>
com.top_logic.layout.view.element.ValueInputElement.Config.placeholder = Placeholder
com.top_logic.layout.view.element.ValueInputElement.Config.placeholder.tooltip = The text shown in the input while it is empty. <p> What the user is expected to enter, said inside the input itself: "Search" in a search box, "name@example.com" in a mail address. It states the purpose of an input that stands without a visible label - in a toolbar, above a list - and it disappears as soon as a value is entered. </p>
com.top_logic.layout.view.element.ValueInputElement.Config.readonly = Readonly
com.top_logic.layout.view.element.ValueInputElement.Config.readonly.tooltip = Whether the value is displayed but cannot be changed here.
com.top_logic.layout.view.element.ValueInputElement.Config.type = Type
com.top_logic.layout.view.element.ValueInputElement.Config.type.tooltip = The type of the value, deciding how it is entered. <p> A primitive type such as tl.core:String, tl.core:Integer, tl.core:Date or tl.core:Boolean is entered, an enumeration or a class is chosen from options. </p>
com.top_logic.layout.view.element.ValueInputElement.Config.value = Value
com.top_logic.layout.view.element.ValueInputElement.Config.value.tooltip = The channel carrying the value the user enters.
com.top_logic.layout.view.element.ValueInputElement.tooltip = <i>UI element</i> that lets the user enter the value of a channel. <p> The input is bound to the value channel in both directions: what the user enters becomes the value of the channel, and a value the channel receives from elsewhere appears in the input. It is the counterpart of a <field> for a value that belongs to the view rather than to a model object - the term a table filters by, the state a list is narrowed to - and needs no form and no object to hold it. Standing outside a form, it is placed in a <i>fields element</i> for the grid a form gives its fields. </p> <p> The type of the value decides the input: a text field for a text, a number field for a number, a date picker for a point in time, a checkbox for a boolean, a dropdown for an enumeration or a class. It is resolved by the same <i>form field controls</i> that picks the control for an attribute, so a value of a given type is entered the same way wherever it appears. </p> <p> A value of an enumeration or a class is chosen from options: the classifiers respectively the instances of the type, or whatever the options expression computes. With multiple set, the channel holds a collection of such values instead of a single one. </p> <p> A submit command turns the input into an action: the value the user finishes entering is written to the channel and then run through the command, which is what a search field or a jump-to box is - one input and one command over what was entered. </p>
com.top_logic.layout.view.element.VisibleIfElement = Visible if element
com.top_logic.layout.view.element.VisibleIfElement.Config.content = Content
com.top_logic.layout.view.element.VisibleIfElement.Config.content.tooltip = The content elements shown while the condition holds.
com.top_logic.layout.view.element.VisibleIfElement.Config.expr = Expression
com.top_logic.layout.view.element.VisibleIfElement.Config.expr.tooltip = TL-Script predicate called with the current value of the input channel; the content is shown while it returns true.
com.top_logic.layout.view.element.VisibleIfElement.Config.input = Input
com.top_logic.layout.view.element.VisibleIfElement.Config.input.tooltip = The channel whose current value is passed to the condition.
com.top_logic.layout.view.element.VisibleIfElement.Config.observed-types = Observed types
com.top_logic.layout.view.element.VisibleIfElement.Config.observed-types.tooltip = Types whose object changes (create / update / delete) trigger a re-evaluation of the condition, in addition to the input object, which is always observed. <p> Configure this only for a condition that navigates beyond the input object, e.g. one deciding by an attribute of the input's container: a change of that other object is invisible to the input's own observation. Empty (default) observes just the input object. </p>
com.top_logic.layout.view.element.VisibleIfElement.tooltip = UIElement that shows its content while a TL-Script condition over the value of an input channel holds, and nothing while it does not. <p> The condition is re-evaluated whenever the input channel changes, and also when the input object itself is changed - a condition typically decides by an attribute of that object, which can be edited without the channel value changing. A condition reaching beyond the input object states the types it navigates to in <i>Observed types</i>. </p> <p> Content that is hidden is disposed rather than kept alive, so it leaves no contributions (e.g. a form's edit/save/cancel commands) behind in the enclosing scope. While the condition keeps holding, the content stays as it is - bound to its own channels, it updates itself. </p> <p> This is the short form of a <i>switch element</i> with a single case and no default. A <i>switch element</i> is what several alternatives are written with, where one of them is shown at a time. </p> <p> The condition of an element is not to be confused with the condition of a command: whether a command can be executed on its input is decided by the executability rule <i>visible if</i>, which carries the same tag name inside a command's <executability>. </p>
com.top_logic.layout.view.element.WindowElement = Window element
com.top_logic.layout.view.element.WindowElement.Config.actions = Actions
com.top_logic.layout.view.element.WindowElement.Config.actions.tooltip = Footer action elements (typically buttons). <p> These are rendered in the window's footer bar below the body content. </p>
com.top_logic.layout.view.element.WindowElement.Config.resizable = Resizable
com.top_logic.layout.view.element.WindowElement.Config.resizable.tooltip = Whether the window can be resized by the user. <p> Defaults to true. When enabled, resize handles are shown at all edges and corners. </p>
com.top_logic.layout.view.element.WindowElement.Config.title = Title
com.top_logic.layout.view.element.WindowElement.Config.title.tooltip = The window title displayed in the title bar.
com.top_logic.layout.view.element.WindowElement.Config.width = Width
com.top_logic.layout.view.element.WindowElement.Config.width.tooltip = The window width as a CSS pixel value (e.g. "500px"). <p> Defaults to "500px" if not specified. </p>
com.top_logic.layout.view.element.WindowElement.tooltip = A <i>UI element</i> that provides dialog window chrome using <i>react window control</i>. <p> Renders a window with title bar (including close button and toolbar buttons), scrollable body, and optional footer action buttons. Intended for use as the root element inside dialog view XML files. </p> <p> The close button (X) in the title bar cancels the dialog via <i>dialog manager</i>. Footer actions are declared as child elements inside the <actions> section. Toolbar commands from child elements (e.g. form edit/save/cancel) are automatically rendered in the title bar. </p> <p> Example: </p> <pre> &lt;window title="Details" width="500px"&gt; &lt;form input="model"&gt; &lt;field attribute="name"/&gt; &lt;/form&gt; &lt;actions&gt; &lt;button&gt; &lt;action class="...CancelDialogCommand" label="Close"/&gt; &lt;/button&gt; &lt;/actions&gt; &lt;/window&gt; </pre>
com.top_logic.layout.view.form.BooleanControlProvider = Boolean control provider
com.top_logic.layout.view.form.BooleanControlProvider.Config.display = Display
com.top_logic.layout.view.form.BooleanControlProvider.Config.display.tooltip = How the value is displayed, or nothing to display it the way the edited attribute asks for. <p> A checkbox and a switch show the value in place and are named by the label beside them, while radio buttons and a select offer it as a choice between labelled values. Stated here, the display holds for this field alone; stated as the <i>boolean display</i> annotation of an attribute, it holds wherever that attribute is shown. </p> <p> A value that may also be unknown is displayed as a checkbox even where a switch is asked for, a switch having no third position for "no value". </p>
com.top_logic.layout.view.form.BooleanControlProvider.tooltip = <i>React field control provider</i> for boolean attributes. <p> A checkbox by default, a switch, radio buttons or a yes/no select when the field is displayed that way. What the field says decides, which for a model attribute is its <i>boolean display</i> annotation; a display configured here overrides it, so a single form field deviates from how the attribute is displayed elsewhere. </p> <p> A tri-state field keeps a state for "no value": the checkbox gets a third state, the choice a third option. A switch has no third position to show it in and stays a checkbox. </p>
com.top_logic.layout.view.form.FieldControlService = Form field controls
com.top_logic.layout.view.form.FieldControlService$ProviderMapping = Provider mapping
com.top_logic.layout.view.form.FieldControlService$ProviderMapping.tooltip = A single type-to-provider mapping entry.
com.top_logic.layout.view.form.FieldControlService$ValueTypeMapping = Value type mapping
com.top_logic.layout.view.form.FieldControlService$ValueTypeMapping.tooltip = A control editing the values of one Java type.
com.top_logic.layout.view.form.FieldControlService.Config.providers = Providers
com.top_logic.layout.view.form.FieldControlService.Config.providers.tooltip = Global type-to-provider mappings keyed by model type reference.
com.top_logic.layout.view.form.FieldControlService.Config.value-type-providers = Value type providers
com.top_logic.layout.view.form.FieldControlService.Config.value-type-providers.tooltip = The controls editing values of a plain Java type. <p> A configuration property may hold a kind of value that no model type describes, a TL-Script expression for instance. Such a value is edited by the control named here, so declaring it once covers every configuration property holding that kind of value. </p>
com.top_logic.layout.view.form.FieldControlService.ProviderMapping.impl = Implementation
com.top_logic.layout.view.form.FieldControlService.ProviderMapping.impl.tooltip = The control provider to use for attributes of this type.
com.top_logic.layout.view.form.FieldControlService.ProviderMapping.type = Type
com.top_logic.layout.view.form.FieldControlService.ProviderMapping.type.tooltip = The model type this mapping applies to.
com.top_logic.layout.view.form.FieldControlService.ValueTypeMapping.impl = Implementation
com.top_logic.layout.view.form.FieldControlService.ValueTypeMapping.impl.tooltip = The control editing values of the type.
com.top_logic.layout.view.form.FieldControlService.ValueTypeMapping.value-type = Value type
com.top_logic.layout.view.form.FieldControlService.ValueTypeMapping.value-type.tooltip = The type of the edited value.
com.top_logic.layout.view.form.FieldControlService.tooltip = Service that resolves the appropriate <i>react field control provider</i> for a model attribute. <p> Resolution chain: </p> <ol> <li>The control the display asks for.</li> <li><i>Input control</i> annotation on the attribute or its type (via <i>value type</i>).</li> <li>Global type-to-provider map configured in this service.</li> <li>Built-in fallback based on <i>kind</i>.</li> </ol> <p> Only <em>which</em> provider edits a value is decided here. How many values the field holds is realized by the <i>field control registry</i>, whichever step of the chain found the provider: a field holding several values whose provider edits one value at a time is displayed as a list of element controls, one per value. </p>
com.top_logic.layout.view.form.NumberInputControlProvider = Number input control provider
com.top_logic.layout.view.form.NumberInputControlProvider.Config.display = Display
com.top_logic.layout.view.form.NumberInputControlProvider.Config.display.tooltip = How the value is edited. <p> An input takes any number the format of the field reads, whatever its size. A slider offers the numbers of a range and is dragged rather than typed, which suits a value whose range is part of what it means; it needs the smallest and the largest value of that range. </p>
com.top_logic.layout.view.form.NumberInputControlProvider.Config.max = Maximum
com.top_logic.layout.view.form.NumberInputControlProvider.Config.max.tooltip = The largest value a slider can set, which it must be given. <p> The value the handle stands on at the right end of the track, above the smallest one. An input has no range to travel and ignores it. </p>
com.top_logic.layout.view.form.NumberInputControlProvider.Config.min = Minimum
com.top_logic.layout.view.form.NumberInputControlProvider.Config.min.tooltip = The smallest value a slider can set, which it must be given. <p> The value the handle stands on at the left end of the track. An input has no range to travel and ignores it. </p>
com.top_logic.layout.view.form.NumberInputControlProvider.Config.step = Step
com.top_logic.layout.view.form.NumberInputControlProvider.Config.step.tooltip = The distance between two values a slider can set, whole numbers where nothing is stated. <p> The grid the handle snaps to: a step of 0.5 offers every half, a step of 10 every tenth value of the range. An input has no grid and ignores it. </p>
com.top_logic.layout.view.form.NumberInputControlProvider.tooltip = <i>React field control provider</i> for integer and floating-point attributes. <p> The value is displayed in and entered in the format the field asks for - the attribute's format annotation, where it has one - so a German user reads and types 12,5 where an English user reads and types 12.5. </p> <p> The number is typed as text, unless the display asks for a handle travelling along a track between the smallest and the largest value. </p>
com.top_logic.layout.view.form.RowEditPolicy = Row edit policy
com.top_logic.layout.view.form.RowEditPolicy.ALL = All
com.top_logic.layout.view.form.RowEditPolicy.ALL.tooltip = All rows are editable.
com.top_logic.layout.view.form.RowEditPolicy.NONE = None
com.top_logic.layout.view.form.RowEditPolicy.NONE.tooltip = The table is read-only (the default).
com.top_logic.layout.view.form.RowEditPolicy.SELECTED = Selected
com.top_logic.layout.view.form.RowEditPolicy.SELECTED.tooltip = Exactly the selected row is editable. <p> Edits of previously selected rows stay buffered on their row overlays and are committed together when the form is saved. </p>
com.top_logic.layout.view.form.RowEditPolicy.tooltip = Which rows of a table edited within a form are editable while the form is in edit mode.
com.top_logic.layout.view.form.RowSetBinding$RemoveMode = Remove mode
com.top_logic.layout.view.form.RowSetBinding$RemoveMode.tooltip = How removing a row from the table affects the removed object when the form is saved.
com.top_logic.layout.view.form.RowSetBinding.RemoveMode.DELETE = Delete
com.top_logic.layout.view.form.RowSetBinding.RemoveMode.DELETE.tooltip = The removed object is deleted.
com.top_logic.layout.view.form.RowSetBinding.RemoveMode.NONE = None
com.top_logic.layout.view.form.RowSetBinding.RemoveMode.NONE.tooltip = Rows cannot be removed.
com.top_logic.layout.view.form.RowSetBinding.RemoveMode.UNLINK = Unlink
com.top_logic.layout.view.form.RowSetBinding.RemoveMode.UNLINK.tooltip = The removed object is only taken out of the row set; the object itself is kept.
com.top_logic.layout.view.form.SelectControlProvider = Select control provider
com.top_logic.layout.view.form.SelectControlProvider.Config.display = Display
com.top_logic.layout.view.form.SelectControlProvider.Config.display.tooltip = The shape the options are offered in. <p> A list that opens on demand takes the room of one field whatever the number of options and is searched by typing, which suits a list of any length. A cloud of toggles and a bar of segments show every option at all times, so the value and what else could be chosen are read without opening anything - at the price of the room all options take, which makes them a choice for a handful of options rather than for a long list. </p>
com.top_logic.layout.view.form.SelectControlProvider.Config.option-provider = Option provider
com.top_logic.layout.view.form.SelectControlProvider.Config.option-provider.tooltip = The option source for the selectable values. <p> If unset, options are derived from the attribute's type (enumeration, reference, enum datatype) or its TL-Script options annotation. </p>
com.top_logic.layout.view.form.SelectControlProvider.tooltip = <i>React field control provider</i> for attributes that are edited by selecting from a set of options. <p> Wraps a <i>select field model</i> (an <i>attribute select field model</i>) in a <i>react dropdown select control</i>, using <i>meta resource provider</i> so that options and the current selection are rendered with the label and the image their model registers, in both edit and display mode. </p> <p> When configured for a special model datatype (e.g. tl.util:Country) via the <i>form field controls</i> type map, an option provider supplies the selectable values. Without a configured option provider, options are derived from the attribute itself (enumeration, reference, enum datatype, or a TL-Script options annotation). </p> <p> The options are offered in a list that opens on demand, unless the display asks for a shape that shows them all. </p>
com.top_logic.layout.view.form.TLInputControl = Input control
com.top_logic.layout.view.form.TLInputControl.impl = Implementation
com.top_logic.layout.view.form.TLInputControl.impl.tooltip = The control provider implementation.
com.top_logic.layout.view.form.TLInputControl.tooltip = <i>Attribute annotation</i> configuring the React input control for a model attribute or type. <p> When set on an attribute, it overrides the default control selection. When set on a type, it provides the default control for all attributes of that type (via <i>value type</i>). </p>
com.top_logic.layout.view.form.TextInputControlProvider = Text input control provider
com.top_logic.layout.view.form.TextInputControlProvider.Config.input-type = Input type
com.top_logic.layout.view.form.TextInputControlProvider.Config.input-type.tooltip = The kind of value the field edits. <p> A plain text is edited in a text box, while a web address, an e-mail address and a phone number are also offered as a link that opens the value. </p>
com.top_logic.layout.view.form.TextInputControlProvider.tooltip = <i>React field control provider</i> for string, tristate, binary, and other text-representable attributes. <p> The input type says what the entered text means: a plain text, a web address, an e-mail address, a phone number, or a search term. The browser edits the value with the input of that kind - offering the matching on-screen keyboard and completion - and the field displays an address as a link opening it. Configured for a model type in the <i>form field controls</i> type map, the input type reaches every attribute of that type. </p> <p> Also serves as the ultimate fallback when no other provider matches, where the text is a plain one. </p>
com.top_logic.layout.view.inspector.InspectNodeAction = Inspect node action
com.top_logic.layout.view.inspector.InspectNodeAction$Mode = Mode
com.top_logic.layout.view.inspector.InspectNodeAction$Mode.tooltip = Which element a <i>inspect node action</i> inspects.
com.top_logic.layout.view.inspector.InspectNodeAction.Config.mode = Mode
com.top_logic.layout.view.inspector.InspectNodeAction.Config.mode.tooltip = Which element to inspect.
com.top_logic.layout.view.inspector.InspectNodeAction.Config.node = Node
com.top_logic.layout.view.inspector.InspectNodeAction.Config.node.tooltip = The channel holding the <i>inspected node</i>, read and written by this action.
com.top_logic.layout.view.inspector.InspectNodeAction.Mode.PARENT = Parent
com.top_logic.layout.view.inspector.InspectNodeAction.Mode.PARENT.tooltip = The element enclosing the inspected one.
com.top_logic.layout.view.inspector.InspectNodeAction.Mode.REFRESH = Refresh
com.top_logic.layout.view.inspector.InspectNodeAction.Mode.REFRESH.tooltip = The inspected element itself, as it is now.
com.top_logic.layout.view.inspector.InspectNodeAction.tooltip = Takes the inspected node anew, either at its own address or at the address of the element enclosing it. <p> Both moves are the same step - resolve an address in the inspected window and project what sits there now - and differ only in the address they start from, which the <i>mode</i> names. The projection is a snapshot, so taking it again is what shows a state that has changed meanwhile. </p> <p> App-specific action, referenced by class= in the inspector view rather than claiming a global @TagName. </p>
com.top_logic.layout.view.inspector.InspectedNodeElement = Inspected node element
com.top_logic.layout.view.inspector.InspectedNodeElement.Config.node = Node
com.top_logic.layout.view.inspector.InspectedNodeElement.Config.node.tooltip = The channel holding the <i>inspected node</i> to show.
com.top_logic.layout.view.inspector.InspectedNodeElement.Config.selection = Selection
com.top_logic.layout.view.inspector.InspectedNodeElement.Config.selection.tooltip = Optional channel holding the selected state paths: one path as that path, several as the set of them, none as null.
com.top_logic.layout.view.inspector.InspectedNodeElement.tooltip = Shows what the inspected control holds: its identity, its state entry by entry, and the actions it offers. <p> The state is shown flattened to one row per leaf value, addressed by the dotted path an assertion names it by, so a grouped observation - what a table hid because the user may not read it, for instance - is as selectable as a plain state key. The selected paths are written to the selection channel, from which a command can take what to assert on. </p> <p> The element follows the node channel and updates the controls it has built: the identity texts take new values, the tables take new rows. Nothing is disposed and rebuilt, so a control that listens to the same channel is never torn down while that channel is still notifying. </p> <p> App-specific widget, referenced by class= in the inspector view rather than claiming a global @TagName. </p>
com.top_logic.layout.view.inspector.RecordAssertionAction = Record assertion action
com.top_logic.layout.view.inspector.RecordAssertionAction.Config.node = Node
com.top_logic.layout.view.inspector.RecordAssertionAction.Config.node.tooltip = The channel holding the <i>inspected node</i> the assertion is recorded for.
com.top_logic.layout.view.inspector.RecordAssertionAction.tooltip = Turns the state entries selected in the UI inspector into an assertion step of the running script recording. <p> The action's input is the selection of the state table - the paths the user ticked - and the configured channel holds the inspected element they were taken from. What is recorded is the part of that element's state the paths address, so the assertion checks the observations the user chose and stays indifferent to everything else the element displays. The step goes to the recorder of the inspected window, the same recorder the user's own interactions are captured in, so the check lands between the steps it belongs between. Without a running recording nothing is recorded, since a script the assertion could be part of is what makes it a step. </p> <p> App-specific action, referenced by class= in the inspector view rather than claiming a global @TagName. </p>
com.top_logic.layout.view.inspector.SelectElementAction = Select element action
com.top_logic.layout.view.inspector.SelectElementAction.Config.node = Node
com.top_logic.layout.view.inspector.SelectElementAction.Config.node.tooltip = The channel receiving the <i>inspected node</i> of the picked element.
com.top_logic.layout.view.inspector.SelectElementAction.tooltip = Lets the user click an element in the inspected window and puts what was hit onto the inspector's node channel. <p> The inspected window is the one that opened this side-window. The click is reported back asynchronously, so the action does not return the inspected node: it writes the channel itself, from the callback the picker runs once the user has clicked. The inspector window is brought back to the front then, since the user was looking at the application window to click in it. </p> <p> App-specific action, referenced by class= in the inspector view rather than claiming a global @TagName. </p>
com.top_logic.layout.view.job.ChunkedScriptJobBody = Chunked script job body
com.top_logic.layout.view.job.ChunkedScriptJobBody$Config$Step = Step
com.top_logic.layout.view.job.ChunkedScriptJobBody$Config$Step.tooltip = One pass over the work items.
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.Step.expr = Expression
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.Step.expr.tooltip = The script of the pass, called with the monitor of the job, the chunk of work items it is to process and the state. <p> It runs in a transaction that is committed once it returns, and it runs again on a single item while a failed chunk is retried, so what it does must be repeatable for an item it already saw. </p>
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.Step.label = Label
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.Step.label.tooltip = What the reader sees for this pass; its number where none is given.
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.chunk-size = Chunk size
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.chunk-size.tooltip = How many work items one transaction takes.
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.elements = Elements
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.elements.tooltip = Script producing the work items, evaluated once against the state, read-only and outside any transaction. <p> Called with the monitor of the job and the state. A collection is the list of items, any other value is the single item it stands for. </p>
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.finish = Finish
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.finish-label = Finish label
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.finish-label.tooltip = What the reader sees for the completion, the step the job ends with.
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.finish.tooltip = Script run once after every pass has committed, in a transaction of its own, against the state. <p> Called with the monitor of the job and the state. The one-shot finalizer that has to see everything committed - resetting a sequence past what was imported, computing an aggregate - and what it produces is the result of the job. Work spanning the items belongs in a later pass, not here. </p>
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.init = Init
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.init-label = Init label
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.init-label.tooltip = What the reader sees for the preparation, the step the job begins with.
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.init.tooltip = Script producing the state the later scripts work against, run once in a transaction of its own. <p> Called with the monitor of the job followed by the values the job was started with. It yields whatever the passes have to reach - typically the container the work items are created in, which has to be persistent before them. Where it is unset, the first value the job was started with is the state. </p>
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.steps = Steps
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.steps.tooltip = The passes over the work items, worked through in order. <p> Each pass is applied to successive chunks of <i>Chunk size</i> items, every chunk committing on its own. A chunk that fails is retried item by item, so that only the items that genuinely cannot be processed are skipped, each of them reported and counted, instead of the whole pass being given up. </p> <p> A pass begins once the pass before it has committed every chunk. Work that has to see all the items an earlier pass produced - resolving cross references between them, for instance - therefore belongs in a later pass, where it is chunked and resilient as well. </p>
com.top_logic.layout.view.job.ChunkedScriptJobBody.tooltip = The work of a long-running job, written as TL-Script and committed in chunks. <p> A job body runs outside any transaction, and TL-Script opens none. This is the transactional frame around scripted work that produces persistent objects: the work items are walked in chunks of <i>Chunk size</i> items, each chunk committing on its own, so memory stays bounded, a failure late in the run keeps what the earlier chunks produced, and a single item that cannot be processed costs only itself. </p> <p> Every script is called with the monitor of the job as its first argument - the opaque value the reporting functions are called on, so a script says what it is doing with <code>$job.jobMessage('…')</code>: </p> <ul> <li><i>Init</i> as <code>job -&gt; a -&gt; b -&gt; …</code>, the monitor followed by the values the job was started with,</li> <li><i>Elements</i> as <code>job -&gt; state -&gt; …</code>,</li> <li><i>Expression</i> (<i>chunked script job body configuration step</i>) as <code>job -&gt; chunk -&gt; state -&gt; …</code>,</li> <li><i>Finish</i> as <code>job -&gt; state -&gt; …</code>.</li> </ul> <p> The <em>state</em> is what ties the scripts together: it is the value <i>Init</i> produced, and every later script receives it. Where there is no preparation, the state is the first value the job was started with. A state that has to change while the job runs is a transient object, <code>new(`my:State`, transient: true)</code>, whose attributes the passes set; several objects the passes need are a map literal. </p> <pre> &lt;body class="com.top_logic.layout.view.job.ChunkedScriptJobBody" chunk-size="100"&gt; &lt;init-label&gt;&lt;en&gt;Reading the file&lt;/en&gt;&lt;/init-label&gt; &lt;init&gt;job -&gt; file -&gt; $file.parse()&lt;/init&gt; &lt;elements&gt;job -&gt; state -&gt; $state.get(`my:Import#rows`)&lt;/elements&gt; &lt;steps&gt; &lt;step&gt; &lt;label&gt;&lt;en&gt;Creating the records&lt;/en&gt;&lt;/label&gt; &lt;expr&gt;job -&gt; chunk -&gt; state -&gt; $chunk.foreach(r -&gt; $state.create($r))&lt;/expr&gt; &lt;/step&gt; &lt;/steps&gt; &lt;finish&gt;job -&gt; state -&gt; $state.get(`my:Import#created`)&lt;/finish&gt; &lt;/body&gt; </pre> <p> The result of the job is what <i>Finish</i> produced; a body without a completion ends with the text saying how many items it processed and how many it skipped. </p>
com.top_logic.layout.view.job.JobFunctions.error = Error of the job
com.top_logic.layout.view.job.JobFunctions.error.param.job.tooltip = The state of a job, as its channel holds it.
com.top_logic.layout.view.job.JobFunctions.error.return = The message of the failure, or nothing at all for a job that has not failed.
com.top_logic.layout.view.job.JobFunctions.error.tooltip = Why the given job failed.
com.top_logic.layout.view.job.JobFunctions.indeterminate = Report an unknown progress
com.top_logic.layout.view.job.JobFunctions.indeterminate.param.job.tooltip = The job giving up its progress, the first argument of the function doing its work.
com.top_logic.layout.view.job.JobFunctions.indeterminate.tooltip = States that the job does not know how much of its work is done. <p> The display then shows that something is going on without showing how far it has come, until the job reports a progress again. </p>
com.top_logic.layout.view.job.JobFunctions.isFinished = Job is finished
com.top_logic.layout.view.job.JobFunctions.isFinished.param.job.tooltip = The state of a job, as its channel holds it; no job at all has not ended.
com.top_logic.layout.view.job.JobFunctions.isFinished.return = Whether the job has ended.
com.top_logic.layout.view.job.JobFunctions.isFinished.tooltip = Whether the given job has ended, however it ended.
com.top_logic.layout.view.job.JobFunctions.isRunning = Job is running
com.top_logic.layout.view.job.JobFunctions.isRunning.param.job.tooltip = The state of a job, as its channel holds it; no job at all is not running.
com.top_logic.layout.view.job.JobFunctions.isRunning.return = Whether the job is still working.
com.top_logic.layout.view.job.JobFunctions.isRunning.tooltip = Whether the given job is still working, so what it reports still changes.
com.top_logic.layout.view.job.JobFunctions.message = Report what the job is doing
com.top_logic.layout.view.job.JobFunctions.message.param.job.tooltip = The job reporting what it does, the first argument of the function doing its work.
com.top_logic.layout.view.job.JobFunctions.message.param.message.tooltip = What the reader sees - a text, or an internationalized one written as <code>#('Reading'@en, 'Lesen'@de)</code>; nothing at all says nothing.
com.top_logic.layout.view.job.JobFunctions.message.tooltip = States what the job is doing right now.
com.top_logic.layout.view.job.JobFunctions.phase = Enter a step of the job
com.top_logic.layout.view.job.JobFunctions.phase.param.job.tooltip = The job that enters the step, the first argument of the function doing its work.
com.top_logic.layout.view.job.JobFunctions.phase.param.name.tooltip = The name of the step to enter.
com.top_logic.layout.view.job.JobFunctions.phase.tooltip = Enters the named step of the job, marking the steps passed over as done. <p> The step is one of those the job announced, either in its configuration or with <code>jobPhases</code>; naming any other step ends the job with an error. A job that has nothing to do in a step simply does not enter it. </p>
com.top_logic.layout.view.job.JobFunctions.phases = Announce the steps of the job
com.top_logic.layout.view.job.JobFunctions.phases.param.job.tooltip = The job announcing its steps, the first argument of the function doing its work.
com.top_logic.layout.view.job.JobFunctions.phases.param.phases.tooltip = The steps, as a list of names or as a map from a name to what the reader sees.
com.top_logic.layout.view.job.JobFunctions.phases.tooltip = Replaces the steps the job announces it goes through. <p> For a job that learns only while running what it has to do. The steps are given either as a list of names, which are then what the reader sees as well, or as a map from the name of a step to what the reader sees for it - a text or an internationalized one, written as <code>#('Reading'@en, 'Lesen'@de)</code>. They are announced in the order the list or the map gives them. </p> <pre> $job.jobPhases({'read': #('Reading'@en), 'write': #('Writing'@en)}); </pre>
com.top_logic.layout.view.job.JobFunctions.progress = Report the progress of the job
com.top_logic.layout.view.job.JobFunctions.progress.param.done.tooltip = How much is done.
com.top_logic.layout.view.job.JobFunctions.progress.param.job.tooltip = The job reporting its progress, the first argument of the function doing its work.
com.top_logic.layout.view.job.JobFunctions.progress.param.total.tooltip = How much there is in all; nothing at all leaves an empty progress rather than a division by it.
com.top_logic.layout.view.job.JobFunctions.progress.tooltip = States how much of the work is done, as the two counts the progress is the ratio of.
com.top_logic.layout.view.job.JobFunctions.result = Result of the job
com.top_logic.layout.view.job.JobFunctions.result.param.job.tooltip = The state of a job, as its channel holds it.
com.top_logic.layout.view.job.JobFunctions.result.return = The result of the job, or nothing at all for a job that has not completed.
com.top_logic.layout.view.job.JobFunctions.result.tooltip = What the given job produced.
com.top_logic.layout.view.job.JobFunctions.status = Status of the job
com.top_logic.layout.view.job.JobFunctions.status.param.job.tooltip = The state of a job, as its channel holds it.
com.top_logic.layout.view.job.JobFunctions.status.return = How the job stands, or nothing at all when there is no job.
com.top_logic.layout.view.job.JobFunctions.status.tooltip = How the given job stands, as one of the texts <code>running</code>, <code>completed</code>, <code>failed</code> and <code>cancelled</code>. <p> A text, so that a display switches over it: <code>&lt;case match="'completed'"&gt;</code>. </p>
com.top_logic.layout.view.job.JobStatus = Job status
com.top_logic.layout.view.job.JobStatus.CANCELLED = Cancelled
com.top_logic.layout.view.job.JobStatus.CANCELLED.tooltip = The job was cancelled, so it produced neither a result nor an error.
com.top_logic.layout.view.job.JobStatus.COMPLETED = Completed
com.top_logic.layout.view.job.JobStatus.COMPLETED.tooltip = The job ran to its end and produced its result.
com.top_logic.layout.view.job.JobStatus.FAILED = Failed
com.top_logic.layout.view.job.JobStatus.FAILED.tooltip = The job stopped with an error, which the state names.
com.top_logic.layout.view.job.JobStatus.RUNNING = Running
com.top_logic.layout.view.job.JobStatus.RUNNING.tooltip = The job is still working; its progress and phase still change.
com.top_logic.layout.view.job.JobStatus.tooltip = How a long-running job ended, or that it has not ended yet. <p> A job passes from <i>running</i> to exactly one of the three terminal values and stays there: what the display shows about a finished job - the result, the error, the phase it stopped in - does not change any more. </p>
com.top_logic.layout.view.job.PhaseStatus = Phase status
com.top_logic.layout.view.job.PhaseStatus.ACTIVE = Active
com.top_logic.layout.view.job.PhaseStatus.ACTIVE.tooltip = The phase the job is at.
com.top_logic.layout.view.job.PhaseStatus.DONE = Done
com.top_logic.layout.view.job.PhaseStatus.DONE.tooltip = The job has passed this phase - it ran, or it was skipped.
com.top_logic.layout.view.job.PhaseStatus.PENDING = Pending
com.top_logic.layout.view.job.PhaseStatus.PENDING.tooltip = The job has not reached this phase.
com.top_logic.layout.view.job.PhaseStatus.tooltip = Where a single phase of a job stands relative to the phase the job is in. <p> Positional: it says whether the job has passed a phase, is at it, or has not reached it. Whether the phase the job is at is still being worked on is what the <i>job status</i> of the job says - the phase a failed job stopped in is the <i>active</i> one. </p>
com.top_logic.layout.view.job.ScriptJobBody = Script job body
com.top_logic.layout.view.job.ScriptJobBody.Config.function = Function
com.top_logic.layout.view.job.ScriptJobBody.Config.function.tooltip = TL-Script function doing the work of the job. <p> Called with the monitor of the job as its first argument, followed by the values the job was started with. </p>
com.top_logic.layout.view.job.ScriptJobBody.tooltip = The work of a job written as a TL-Script function. <p> The function is called with the <i>job monitor</i> of the job as its first argument, followed by the values the job was started with, in the order the caller declared them. The monitor is an opaque object to the script: it is handed to the functions that report a phase, a progress or a message, and is not otherwise looked into. </p> <pre> job -&gt; customers -&gt; x -&gt; { $customers.forEach(c -&gt; $c.doSomething()); $customers.size(); } </pre> <p> What the function returns is the result of the job. </p>
com.top_logic.layout.view.job.StartJobAction = Start job action
com.top_logic.layout.view.job.StartJobAction$PhaseConfig = Phase configuration
com.top_logic.layout.view.job.StartJobAction$PhaseConfig.tooltip = Configuration of one step a job announces it goes through.
com.top_logic.layout.view.job.StartJobAction.Config.body = Body
com.top_logic.layout.view.job.StartJobAction.Config.body.tooltip = The work of the job, written in Java. <p> The alternative to a TL-Script function for work that is not expressed as an expression. Exactly one of this and a function states what the job does. </p>
com.top_logic.layout.view.job.StartJobAction.Config.cancelable = Cancelable
com.top_logic.layout.view.job.StartJobAction.Config.cancelable.tooltip = Whether the reader may ask this job to stop. <p> Only for work that may be given up half-done: the job is asked to stop and ends at the next point it reports from, having done part of what it was started for. </p>
com.top_logic.layout.view.job.StartJobAction.Config.function = Function
com.top_logic.layout.view.job.StartJobAction.Config.function.tooltip = TL-Script function doing the work of the job. <p> Called with the monitor of the job as its first argument, followed by the values of the input channels in declaration order and the command's current value as the last argument. </p> <p> Exactly one of this and a body of its own states what the job does. </p>
com.top_logic.layout.view.job.StartJobAction.Config.job = Job
com.top_logic.layout.view.job.StartJobAction.Config.job.tooltip = The channel the job publishes its state on. <p> It holds a <i>job state</i> from the moment the job starts, and a new one on every report of the job. Whatever displays the job reads it from there. </p>
com.top_logic.layout.view.job.StartJobAction.Config.phases = Phases
com.top_logic.layout.view.job.StartJobAction.Config.phases.tooltip = The steps the job goes through, in order. <p> Declared here so the display knows the whole way before the job has walked it. The job marks the step it enters by its name; a job that does not name its steps declares none. </p>
com.top_logic.layout.view.job.StartJobAction.Config.update-interval = Update interval
com.top_logic.layout.view.job.StartJobAction.Config.update-interval.tooltip = The shortest time in milliseconds between two states published by a job. <p> A job reporting faster than this is followed at this pace, so that a job counting thousands of items does not flood the browser with updates. </p>
com.top_logic.layout.view.job.StartJobAction.PhaseConfig.label = Label
com.top_logic.layout.view.job.StartJobAction.PhaseConfig.label.tooltip = What the reader sees for this step; its name where none is given.
com.top_logic.layout.view.job.StartJobAction.PhaseConfig.name = Name
com.top_logic.layout.view.job.StartJobAction.PhaseConfig.name.tooltip = The identifier the job names this step by; unique among the steps of one job.
com.top_logic.layout.view.job.StartJobAction.tooltip = <i>View action</i> that hands its work to a worker thread and lets the command wait for it. <p> Work that takes longer than a request may take does not belong in the request: the action starts it, publishes what it reports as a <i>job state</i> on the configured channel, and suspends the command until the work has ended. A display bound to that channel follows the job while it runs - the step it is in, how far it has come, what it is doing right now - and may ask it to stop. </p> <p> The command continues where it left off once the job has completed, with the job's result as its value; a job that fails or is cancelled aborts the command, so the compensations of the actions before it run and the failure stays visible in the last state of the job. The work runs outside any transaction: persisting its result is the business of the actions that follow it. </p> <pre> &lt;start-job job="importState" cancelable="true"&gt; &lt;phases&gt; &lt;phase name="read"&gt;&lt;label&gt;&lt;en&gt;Reading&lt;/en&gt;&lt;/label&gt;&lt;/phase&gt; &lt;phase name="check"&gt;&lt;label&gt;&lt;en&gt;Checking&lt;/en&gt;&lt;/label&gt;&lt;/phase&gt; &lt;/phases&gt; &lt;body class="com.acme.ImportJob"/&gt; &lt;/start-job&gt; </pre>
com.top_logic.layout.view.list.LinkElementAction = Link element action
com.top_logic.layout.view.list.LinkElementAction.tooltip = <i>View action</i> that attaches the chain's current input value through the enclosing &lt;object-list&gt;. <p> Runs the list's configured link function with the values of the list's inputs and the element in a transaction, then resets the list's new-element channel to a fresh transient element. Typical usage in a new-element template, after the entered field values have been written to the transient element: </p> <pre> &lt;generic-command placement="TOOLBAR"&gt; &lt;store-form-state/&gt; &lt;link-element/&gt; &lt;/generic-command&gt; </pre>
com.top_logic.layout.view.list.ObjectListElement = Object list element
com.top_logic.layout.view.list.ObjectListElement$Layout = Layout
com.top_logic.layout.view.list.ObjectListElement$Layout.tooltip = How an <i>object list element</i> arranges its elements.
com.top_logic.layout.view.list.ObjectListElement.Config.element-channel = Element channel
com.top_logic.layout.view.list.ObjectListElement.Config.element-channel.tooltip = Name of the channel publishing the current element to the item template.
com.top_logic.layout.view.list.ObjectListElement.Config.element-type = Element type
com.top_logic.layout.view.list.ObjectListElement.Config.element-type.tooltip = The type of the transient element created for the new-element template.
com.top_logic.layout.view.list.ObjectListElement.Config.empty-text = Empty text
com.top_logic.layout.view.list.ObjectListElement.Config.empty-text.tooltip = Text displayed instead of items when the list is empty.
com.top_logic.layout.view.list.ObjectListElement.Config.item = Item
com.top_logic.layout.view.list.ObjectListElement.Config.item.tooltip = The content instantiated once per list element, with the element published on the element channel. <p> Ordinary view content: typically a single &lt;view-ref&gt; binding the element channel, or elements written inline. Multiple entries are stacked vertically. </p>
com.top_logic.layout.view.list.ObjectListElement.Config.items = Items
com.top_logic.layout.view.list.ObjectListElement.Config.items.tooltip = TL-Script function computing the displayed elements from the values of the inputs: ...inputs -> elements. <p> Applied again whenever an input changes, so the displayed elements follow what the inputs hold. An input whose object was deleted meanwhile is passed as nothing. </p>
com.top_logic.layout.view.list.ObjectListElement.Config.layout = Layout
com.top_logic.layout.view.list.ObjectListElement.Config.layout.tooltip = How the elements are arranged. <p> A list places one element below the other, a grid places as many next to each other as fit. The grid options apply to a grid only, except for the space between the elements, which separates them in either arrangement. </p>
com.top_logic.layout.view.list.ObjectListElement.Config.link = Link
com.top_logic.layout.view.list.ObjectListElement.Config.link.tooltip = TL-Script function attaching a newly composed element: ...inputs -> element -> .... <p> Run by &lt;link-element&gt; in a transaction. The element passed behind the input values is the new-element template's transient object; the function is responsible for making it persistent (e.g. via a non-transient copy) and attaching it where it belongs. </p>
com.top_logic.layout.view.list.ObjectListElement.Config.new-element = New element
com.top_logic.layout.view.list.ObjectListElement.Config.new-element-channel = New element channel
com.top_logic.layout.view.list.ObjectListElement.Config.new-element-channel.tooltip = Name of the channel publishing the transient element to the new-element template.
com.top_logic.layout.view.list.ObjectListElement.Config.new-element.tooltip = The content instantiated once behind the items for entering a new element, with the fresh transient element published on the new-element channel; omitted for a read-only list. <p> Displayed while every input holds a value, because an element is composed to be attached somewhere. Ordinary view content, like <i>Item</i>. </p>
com.top_logic.layout.view.list.ObjectListElement.Config.observed-types = Observed types
com.top_logic.layout.view.list.ObjectListElement.Config.observed-types.tooltip = Types whose object changes (create / update / delete) trigger a re-evaluation of the element lookup, so the list refreshes automatically. <p> When empty, the element type is observed. </p>
com.top_logic.layout.view.list.ObjectListElement.Config.remove = Remove
com.top_logic.layout.view.list.ObjectListElement.Config.remove.tooltip = TL-Script function detaching an element: ...inputs -> element -> .... <p> Run by &lt;remove-element&gt; in a transaction, with the element passed behind the input values. </p>
com.top_logic.layout.view.list.ObjectListElement.Layout.GRID = Grid
com.top_logic.layout.view.list.ObjectListElement.Layout.GRID.tooltip = As many elements next to each other as fit, reflowing with the available width.
com.top_logic.layout.view.list.ObjectListElement.Layout.LIST = List
com.top_logic.layout.view.list.ObjectListElement.Layout.LIST.tooltip = One element below the other, each of them as wide as the list.
com.top_logic.layout.view.list.ObjectListElement.tooltip = Declarative <i>UI element</i> repeating a content template over a computed list of model objects (the <object-list> tag) - e.g. the comments of a ticket rendered as a conversation, or the products of a catalogue rendered as a card grid. <p> The element is model-agnostic: it is bound to any number of inputs plus three functions over their values - the element lookup, the link function that attaches a newly created element, and the remove function that detaches an element. Any containment style works: a composite reference, a back-reference on the element, an association, or a plain query - the functions decide. </p> <p> For each element, the item content is instantiated with the element published on a local channel (<i>Element channel</i>), so the content typically binds a <form input="..."> over the element. Behind the items, the new-element content is instantiated once, bound to a channel (<i>New element channel</i>) holding a fresh transient element of <i>Element type</i>; a command chain with <store-form-state/> and &lt;link-element&gt; persists it. Inside the item content, &lt;remove-element&gt; detaches the item. </p> <p> Both slots hold ordinary view content, so the per-element layout is not a bespoke template but a regular <i>UI element</i>: typically a &lt;view-ref&gt; to an external .view.xml that binds the element channel and declares its own display channels (e.g. author, date), or any element inline. </p> <p> The elements are arranged as the layout says, a column by default and a responsive grid where a card per element is wanted. The arrangement covers the elements alone: the empty text and the new-element content follow it as a whole, rather than taking a place among the elements. </p> <pre> &lt;object-list inputs="catalogue" items="catalogue -&gt; $catalogue.get(`demo:Catalogue#products`)" layout="grid" max-columns="4" min-column-width="18rem" &gt; &lt;item&gt; &lt;view-ref view="catalogue/product-card.view.xml"&gt; &lt;bind channel="product" to="element"/&gt; &lt;/view-ref&gt; &lt;/item&gt; &lt;/object-list&gt; </pre> <p> The displayed list follows the model: changes to an input, to displayed elements, or to objects of the observed types re-run the element lookup; unchanged elements keep their controls (including edit state). </p>
com.top_logic.layout.view.list.RemoveElementAction = Remove element action
com.top_logic.layout.view.list.RemoveElementAction.tooltip = <i>View action</i> that removes the chain's current input value through the enclosing &lt;object-list&gt;. <p> Runs the list's configured remove function with the values of the list's inputs and the element in a transaction. Typical usage in an item template, with the item channel as command input: </p> <pre> &lt;generic-command placement="TOOLBAR" input="comment"&gt; &lt;remove-element/&gt; &lt;/generic-command&gt; </pre>
com.top_logic.layout.view.login.AnonymousOnly = Anonymous only
com.top_logic.layout.view.login.AnonymousOnly.tooltip = <i>View executability rule</i> that shows a command only for the anonymous user (e.g. a "Login" action), hiding it once authenticated.
com.top_logic.layout.view.login.AuthenticatedOnly = Authenticated only
com.top_logic.layout.view.login.AuthenticatedOnly.tooltip = <i>View executability rule</i> that shows a command only for an authenticated (non-anonymous) user (e.g. a "Logout" action), hiding it for the anonymous user.
com.top_logic.layout.view.login.ChangePasswordApplyAction = Change password apply action
com.top_logic.layout.view.login.ChangePasswordApplyAction.tooltip = <i>View action</i> that applies a newly chosen password to an account. <p> Serves both ways a password is changed. A login with an expired password forces the change before the session exists: <i>login action</i> opens the dialog with the authenticated account on its <code>"account"</code> channel, and the deferred login continues once the new password is stored. A user changing their password voluntarily has a session already; no such channel is in scope, the current account is the one changed, and nothing continues afterwards. </p> <p> Expects its input to be the transient <code>"tl.login:PasswordChange"</code> model (carrying newPassword and newPasswordConfirm), e.g. after <store-form-state/>. Password policy validation and the actual change are delegated to the <i>authentication device</i>, which also clears the expiry flag and maintains the password history. On a policy violation or mismatch a <i>TopLogic exception</i> is raised so the form shows the error. </p> <p> An account whose device keeps the password elsewhere - a directory service, an identity provider - is refused before the device is asked to store anything, whichever way the dialog was reached. A view decides by the same condition whether to offer the change at all, with the TL-Script function <code>accountPasswordChangeAllowed()</code>. </p>
com.top_logic.layout.view.login.DisableMfaAction = Disable mfa action
com.top_logic.layout.view.login.DisableMfaAction.tooltip = Takes multi-factor authentication off the account passed as its input, so its next login needs the password alone. <p> Clears the stored secret and the requirement together: a requirement kept without a secret is the state that sends the next login into enrollment, which is the opposite of switching the second factor off. </p> <p> An account whose second factor is demanded of it - <i>required</i> imposed rather than chosen - cannot switch it off. Whether that is the case is a question about the account, so it is answered here rather than left to the view offering the action. </p>
com.top_logic.layout.view.login.EnableMfaAction = Enable mfa action
com.top_logic.layout.view.login.EnableMfaAction.Config.secret = Secret
com.top_logic.layout.view.login.EnableMfaAction.Config.secret.tooltip = A fixed Base32 TOTP secret to store on the account (for testing the OTP-login path). <p> When empty, the account is instead marked as MFA-required with no secret, so the next login triggers enrollment. </p>
com.top_logic.layout.view.login.EnableMfaAction.tooltip = Administrative / demo <i>view action</i> that configures multi-factor authentication on the account passed as its input, to exercise the OTP / enrollment login steps. <p> With a configured secret it stores that TOTP secret on the account, so the next login goes through OTP verification against a known secret. Without one it clears any stored secret and marks MFA required, so the next login goes through enrollment. </p>
com.top_logic.layout.view.login.EnrollMfaAction = Enroll mfa action
com.top_logic.layout.view.login.EnrollMfaAction.tooltip = Sets a second factor up for the current user there and then, by opening the enrollment dialog on a freshly generated secret. <p> This is how a user takes a second factor into use themselves. The secret is stored only once a code generated from it has been verified, which the dialog does, and the account's <i>mfa requirement</i> is left as it is: a second factor the user chose is one they may also drop again, which is what <i>optional</i> means. Only an administrator imposes <i>required</i>, and an account carrying that keeps it. </p> <p> The counterpart in the login flow is <i>login action</i>, which opens the same dialog for an account that is required to use a second factor and has none yet. The difference is only who asked: there the application insists before letting the user in, here the user asked for it while already logged in. </p>
com.top_logic.layout.view.login.ExpirePasswordAction = Expire password action
com.top_logic.layout.view.login.ExpirePasswordAction.tooltip = <i>View action</i> that expires the password of the account passed as its input, forcing a password change on the account's next login. <p> Expiry lives in the authentication device's internal credential store (not as a model attribute), so it cannot be set from TL-Script; this action delegates to the <i>authentication device</i>. It is primarily an administrative / demo affordance to exercise the forced change-password login flow. </p>
com.top_logic.layout.view.login.LoginAction = Login action
com.top_logic.layout.view.login.LoginAction.tooltip = <i>View action</i> that authenticates the credentials held by its input object and switches the session to the resulting user. <p> Expects its input to be a (transient) object carrying name and password attributes, e.g. the model of the login <form> after <store-form-state/>. On success the actual session swap is deferred to the reload via <i>pending session action</i>; on failure a <i>TopLogic exception</i> is raised so the form shows the error. </p> <p> Before the session swap, follow-up steps may be interposed (each composed as its own dialog view, with the account carried on the <code>"account"</code> channel): </p> <ul> <li>An expired password forces a change-password dialog (<i>change password apply action</i>).</li> <li>An account with a TOTP secret must pass an OTP-verification dialog (<i>verify otp action</i>).</li> <li>An account for which MFA is required but has no secret yet is sent through an enrollment dialog that generates a secret, shows its QR code and confirms it via <i>verify otp action</i>.</li> </ul> <p> The actual session swap (via <i>pending session action</i>) happens only once the final step completes the login. </p>
com.top_logic.layout.view.login.LoginCommandsConfig = Login commands configuration
com.top_logic.layout.view.login.LoginCommandsConfig.commands = Commands
com.top_logic.layout.view.login.LoginCommandsConfig.commands.tooltip = The contributed login-dialog elements (typically <button>s opening a dialog).
com.top_logic.layout.view.login.LoginCommandsConfig.tooltip = Application-configured registry of extra commands contributed to the React login dialog. <p> The login view renders these through the <login-commands> element (<i>login commands element</i>). Optional feature modules (e.g. self-service password reset, SSO providers) contribute their buttons here via an application configuration fragment, without the base view module depending on them. </p>
com.top_logic.layout.view.login.LogoutCommand = Logout command
com.top_logic.layout.view.login.LogoutCommand.tooltip = <i>View command</i> that switches the session back to the anonymous user. <p> The session swap is deferred to the next request of the view servlet via <i>pending session action</i>. The browser is sent to the root of the view application: the page the departing user was on is theirs, not the landing page of whoever sits down at the browser next. </p>
com.top_logic.layout.view.login.VerifyIdentityAction = Verify identity action
com.top_logic.layout.view.login.VerifyIdentityAction.Config.message = Message
com.top_logic.layout.view.login.VerifyIdentityAction.Config.message.tooltip = The explanation shown above the password input, saying what the password is asked for. <p> Worth setting wherever the action being guarded is not obvious from the dialog the user is standing in. Defaults to a generic request when not set. A session confirmed at an external identity provider is not asked for a password and states its own message. </p>
com.top_logic.layout.view.login.VerifyIdentityAction.Config.title = Title
com.top_logic.layout.view.login.VerifyIdentityAction.Config.title.tooltip = The title of the dialog asking for the confirmation. <p> Defaults to a generic title when not set. </p>
com.top_logic.layout.view.login.VerifyIdentityAction.tooltip = Interruptible <i>view action</i> that lets the chain continue only after the user has proven again that they are the holder of the account the session belongs to. <p> The guard for a step whose consequences outlive the session that took it - handing a deputy the right to act in the user's name, changing the password itself - where the question is not what the session may do but whether the person at the keyboard is the account holder. Placed in a command chain like <confirm>, typically after <store-form-state/> and before the action it protects, so that no transaction is held open while the dialog is on screen. </p> <p> The proof is given the way the session was established. A session established through an external identity provider is confirmed there: the browser opens a window of its own, walks through the provider's authentication once more and returns to the application, and the dialog the user left behind closes itself once the confirmation has arrived. Every other session is confirmed with the password of its own account, which the account's <i>authentication device</i> checks. </p> <p> The account to confirm is always the session's own; nothing the view passes in can name another one. On the confirmation the chain resumes with its input unchanged; a cancelled dialog aborts it, running the compensations of the actions already executed. </p> <p> The guard fails closed. Where it cannot ask - no session account, the anonymous account, an account that neither an identity provider nor an <i>authentication device</i> can confirm, or a headless context without a dialog manager - the chain aborts rather than passing, and a password the device does not accept is a password not confirmed, whether it was mistyped or the device authenticates elsewhere and accepts none. </p>
com.top_logic.layout.view.login.VerifyOtpAction = Verify otp action
com.top_logic.layout.view.login.VerifyOtpAction.Config.persist = Persist
com.top_logic.layout.view.login.VerifyOtpAction.Config.persist.tooltip = Whether the verified secret should be stored on the account (the MFA-enrollment case). <p> When false (plain OTP login) the account already carries the secret, so nothing is persisted. </p>
com.top_logic.layout.view.login.VerifyOtpAction.tooltip = <i>View action</i> that verifies the one-time code entered in the MFA step of the login flow and, on success, completes the deferred login. <p> Reads the code from its input (the transient <code>"tl.login:OtpEntry"</code> form model), the TOTP secret from the dialog's <code>"secret"</code> channel and the account from its <code>"account"</code> channel. When persist is set (the enrollment case) the just-confirmed secret is stored on the account before the login proceeds. </p>
com.top_logic.layout.view.navigation.DisplayTargetService = Display targets
com.top_logic.layout.view.navigation.DisplayTargetService$BindConfig = Bind configuration
com.top_logic.layout.view.navigation.DisplayTargetService$BindConfig.tooltip = The value one channel of a displayed view receives.
com.top_logic.layout.view.navigation.DisplayTargetService$ShowConfig = Show configuration
com.top_logic.layout.view.navigation.DisplayTargetService$ShowConfig.tooltip = One view displaying the object, and the values its channels receive.
com.top_logic.layout.view.navigation.DisplayTargetService$TargetConfig = Target configuration
com.top_logic.layout.view.navigation.DisplayTargetService$TargetConfig.tooltip = Where the objects of one model type are displayed.
com.top_logic.layout.view.navigation.DisplayTargetService.BindConfig.channel = Channel
com.top_logic.layout.view.navigation.DisplayTargetService.BindConfig.channel.tooltip = Name of the channel in the displayed view that receives the value.
com.top_logic.layout.view.navigation.DisplayTargetService.BindConfig.expr = Expression
com.top_logic.layout.view.navigation.DisplayTargetService.BindConfig.expr.tooltip = Function computing the channel value from the object being displayed. <p> Empty passes the displayed object itself. </p>
com.top_logic.layout.view.navigation.DisplayTargetService.Config.targets = Targets
com.top_logic.layout.view.navigation.DisplayTargetService.Config.targets.tooltip = The types whose objects can be displayed, and where. <p> Several entries may declare the same type. The one that is displayed nearest to the place the object is offered at wins, and among equally near ones the entry marked as default, then the first declared. </p>
com.top_logic.layout.view.navigation.DisplayTargetService.ShowConfig.bindings = Bindings
com.top_logic.layout.view.navigation.DisplayTargetService.ShowConfig.bindings.tooltip = The values the channels of the displayed view receive.
com.top_logic.layout.view.navigation.DisplayTargetService.ShowConfig.dialog = Dialog
com.top_logic.layout.view.navigation.DisplayTargetService.ShowConfig.dialog.tooltip = Whether to display the view as a dialog on top of the current display, rather than within it.
com.top_logic.layout.view.navigation.DisplayTargetService.ShowConfig.label = Label
com.top_logic.layout.view.navigation.DisplayTargetService.ShowConfig.label-expr = Label expression
com.top_logic.layout.view.navigation.DisplayTargetService.ShowConfig.label-expr.tooltip = Function computing the label of the displayed view from the object being displayed. <p> Takes precedence over the fixed label. A view that the user reaches by drilling down is announced with the name of the object it shows, so a target leading to the same place must compute the same label to arrive at the drill-down the user already has. </p>
com.top_logic.layout.view.navigation.DisplayTargetService.ShowConfig.label.tooltip = The label the displayed view is announced with, e.g. in a breadcrumb or as a dialog title. <p> Empty leaves the naming to the display itself. </p>
com.top_logic.layout.view.navigation.DisplayTargetService.ShowConfig.view = View
com.top_logic.layout.view.navigation.DisplayTargetService.ShowConfig.view.tooltip = Path of the view file to display, relative to the application's view directory.
com.top_logic.layout.view.navigation.DisplayTargetService.TargetConfig.default = Default
com.top_logic.layout.view.navigation.DisplayTargetService.TargetConfig.default.tooltip = Whether to prefer this target over the other targets declared for the same type.
com.top_logic.layout.view.navigation.DisplayTargetService.TargetConfig.shows = Shows
com.top_logic.layout.view.navigation.DisplayTargetService.TargetConfig.shows.tooltip = The views displaying the object, the enclosing ones first, the one holding the object itself last.
com.top_logic.layout.view.navigation.DisplayTargetService.TargetConfig.type = Type
com.top_logic.layout.view.navigation.DisplayTargetService.TargetConfig.type.tooltip = The type whose objects are displayed here. <p> An object is displayed by the target of its own type; if there is none, by the target of its nearest generalization. </p>
com.top_logic.layout.view.navigation.DisplayTargetService.tooltip = The catalog of places the application displays its business objects at. <p> A target names a model type and the views that display an object of that type: the enclosing displays first, the one holding the object itself last. Each view receives the values its bindings compute from the object being displayed. </p> <pre> &lt;config service-class="com.top_logic.layout.view.navigation.DisplayTargetService"&gt; &lt;instance&gt; &lt;targets&gt; &lt;target type="demo.tickets:Ticket"&gt; &lt;show view="milestones.view.xml"&gt; &lt;bind channel="milestone" expr="t -&gt; $t.get(`demo.tickets:Ticket#milestone`)" /&gt; &lt;/show&gt; &lt;show view="ticket-detail.view.xml"&gt; &lt;bind channel="ticket"/&gt; &lt;/show&gt; &lt;/target&gt; &lt;/targets&gt; &lt;/instance&gt; &lt;/config&gt; </pre> <p> Declaring the targets in one place rather than at the views displaying the objects lets an object be displayed from anywhere: whoever holds an object asks this service where its type belongs, and offers the object as a link exactly when a target answers. </p>
com.top_logic.layout.view.navigation.ShowObjectAction = Show object
com.top_logic.layout.view.navigation.ShowObjectAction.tooltip = <i>View action</i> displaying its input object where the application shows objects of its type. <p> Where that is, is declared per model type by the display targets of the application, so a command ending in this action leads to the object wherever it belongs - without naming a view: </p> <pre> &lt;generic-command input="selection"&gt; &lt;show-object/&gt; &lt;/generic-command&gt; </pre> <p> Nothing to display (no input) passes the chain on unchanged. A selection of exactly one object displays that object, so the action can follow a selection directly. </p>
com.top_logic.layout.view.navigation.ShowViewAction = Show view
com.top_logic.layout.view.navigation.ShowViewAction.tooltip = <i>View action</i> bringing one view into view and writing the values its channels receive. <p> The view is named by its file, so a command leads to a place of the application without a business object being involved: </p> <pre> &lt;show-view view="tickets.view.xml"&gt; &lt;bind channel="activeFilter" expr="term -&gt; 'all'"/&gt; &lt;bind channel="searchTerm" expr="term -&gt; $term"/&gt; &lt;/show-view&gt; </pre> <p> The view is reached wherever it is displayed: the containers on the way to it are opened, or it is drilled down to as a frame of the surrounding stack, or - with dialog - opened as a dialog. Each binding is a function of the chain's current value; a binding without an expression receives that value itself. The chain continues with the value it had, so what a command does after displaying the view is unaffected. </p>
com.top_logic.layout.view.navigation.ShowViewsAction = Show views
com.top_logic.layout.view.navigation.ShowViewsAction.Config.shows = Shows
com.top_logic.layout.view.navigation.ShowViewsAction.Config.shows.tooltip = The views to display, the enclosing ones first, the innermost one last.
com.top_logic.layout.view.navigation.ShowViewsAction.tooltip = <i>View action</i> bringing several views into view in turn, each with the values its channels receive. <p> The views are displayed the way a display target's views are: the enclosing displays first, the innermost one last, and each view is looked for within the view displayed before it, so a view sitting on a tab of a frame the step before it pushed is revealed there. </p> <pre> &lt;show-views&gt; &lt;show view="projects/overview.view.xml"&gt; &lt;bind channel="project" expr="t -&gt; $t.container()"/&gt; &lt;/show&gt; &lt;show view="projects/ticket-detail.view.xml"&gt; &lt;bind channel="ticket"/&gt; &lt;/show&gt; &lt;/show-views&gt; </pre> <p> Each binding is a function of the chain's current value; a binding without an expression receives that value itself. The chain continues with the value it had, so what a command does after displaying the views is unaffected. </p>
com.top_logic.layout.view.recorder.RecordedStepsTable = Recorded steps table
com.top_logic.layout.view.recorder.RecordedStepsTable.Config.selection = Selection
com.top_logic.layout.view.recorder.RecordedStepsTable.Config.selection.tooltip = Optional channel synchronised with the selected step's 1-based row key: the table writes it when the user selects a row, and selects the row named by it when it changes (so a step action can advance the selection).
com.top_logic.layout.view.recorder.RecordedStepsTable.tooltip = Read-only table of captured recorder steps, one row per step with its 1-based number, target address, command and arguments. <p> The table reflects the <i>script recorder</i> of the window that opened this side-window (resolved through <i>recorder access</i>) and listens to it, so a step captured in the main window appears here live over the side-window's SSE connection — no manual refresh. </p> <p> App-specific widget (referenced by class=, not a reusable @TagName element). </p>
com.top_logic.layout.view.recorder.RecorderAction = Recorder action
com.top_logic.layout.view.recorder.RecorderAction$Mode = Mode
com.top_logic.layout.view.recorder.RecorderAction$Mode.tooltip = What a <i>recorder action</i> does to the recording state.
com.top_logic.layout.view.recorder.RecorderAction.Config.mode = Mode
com.top_logic.layout.view.recorder.RecorderAction.Config.mode.tooltip = What the action does to the recording state.
com.top_logic.layout.view.recorder.RecorderAction.Mode.START = Start
com.top_logic.layout.view.recorder.RecorderAction.Mode.START.tooltip = Begin a fresh recording, discarding previous steps.
com.top_logic.layout.view.recorder.RecorderAction.Mode.STOP = Stop
com.top_logic.layout.view.recorder.RecorderAction.Mode.STOP.tooltip = Stop recording. The captured steps remain shown until the next start.
com.top_logic.layout.view.recorder.RecorderAction.tooltip = <i>View action</i> starting and stopping the <i>script recorder</i> of the window that opened this side-window. <p> The start/stop chain flips a boolean recording channel via the reusable <execute-script> + <write-channel> actions (driving the start/stop button visibility). The captured steps themselves are shown live by <i>recorded steps table</i>, which listens to the recorder directly. The recorder lives on the opener window's queue (see <i>recorder access</i>), so this side-window's own commands are never captured. </p>
com.top_logic.layout.view.recorder.StepReplayAction = Step replay action
com.top_logic.layout.view.recorder.StepReplayAction.tooltip = <i>View action</i> replaying the currently selected recorded step on the opener window — the "step" button of the recorder side-window's step debugger. <p> Its input is the selected step's 1-based row key (written by the steps table to a selection channel). It replays that step on the recorded (opener) window through <i>react window replay</i>, so the effect appears in the main browser window, and returns the <em>next</em> step's row key so the chained <write-channel> advances the selection. When the last step has been replayed the selection is left unchanged. A step that fails to replay (e.g. its address does not resolve in the opener window's current state) reports the failure through the window's <i>error sink</i> and keeps the selection on the failed step, so the debugger stops where the script does. </p>
com.top_logic.layout.view.routing.ParamBindingConfig = Parameter binding configuration
com.top_logic.layout.view.routing.ParamBindingConfig.channel = Channel
com.top_logic.layout.view.routing.ParamBindingConfig.channel.tooltip = The name of the channel to bind to.
com.top_logic.layout.view.routing.ParamBindingConfig.prefix = Prefix
com.top_logic.layout.view.routing.ParamBindingConfig.prefix.tooltip = Static path segments placed in front of the value. <p> A prefix of detail makes the binding occupy detail/&lt;value&gt; instead of a bare value segment, which distinguishes it from the other segments of the URL and names what the value identifies. The prefix appears exactly when the value does: a URL that carries the prefix without a value behind it describes no value, and the channel keeps what it holds. </p> <p> Without a prefix, the binding occupies the value segment alone, and its position in the URL is what identifies it. </p>
com.top_logic.layout.view.routing.ParamBindingConfig.route-param = Route parameter
com.top_logic.layout.view.routing.ParamBindingConfig.route-param.tooltip = The name of the URL route parameter to bind from.
com.top_logic.layout.view.routing.ParamBindingConfig.tooltip = Binds a view channel to a URL route parameter. <p> Example: <bind channel="estateId" route-param="estateId"/> </p> <p> The binding works in both directions: the value of the channel becomes the URL path segment, and the segment of an opened URL becomes the value of the channel. A URL without the segment leaves the channel as it is - it says nothing about the value, rather than saying that there is none - so a view opened that way keeps what it establishes itself, the element a table selects by default for instance, and the address bar then names that value. </p> <p> The value fills one path segment and is percent-encoded, so a value of any shape - one containing a slash or a space - stays the single segment the binding reads it back from. A <i>Prefix</i> puts static segments in front of it, which name what the value stands for. </p>
com.top_logic.layout.view.routing.QueryBindingConfig = Query binding configuration
com.top_logic.layout.view.routing.QueryBindingConfig.channel = Channel
com.top_logic.layout.view.routing.QueryBindingConfig.channel.tooltip = The name of the channel to bind to.
com.top_logic.layout.view.routing.QueryBindingConfig.query-param = Query parameter
com.top_logic.layout.view.routing.QueryBindingConfig.query-param.tooltip = The name of the URL query parameter to bind from.
com.top_logic.layout.view.routing.QueryBindingConfig.tooltip = Binds a view channel to a URL query parameter. <p> Example: <bind channel="typeFilter" query-param="type"/> </p>
com.top_logic.layout.view.security.AccessControl = Access control
com.top_logic.layout.view.security.AccessControl.scope = Scope
com.top_logic.layout.view.security.AccessControl.scope.tooltip = The id of the <i>security scope</i> (defined in the <i>security scopes</i>) that guards the enclosing UI unit.
com.top_logic.layout.view.security.AccessControl.tooltip = Reference from a removable UI unit to a <i>security scope</i>. <p> Authored as an <access-control scope="..."/> property on a securable element (nav-item, tab, tile). The element is only built when the referenced scope grants access to the current user; otherwise it is omitted entirely. Elements without an <i>access control</i> are always shown. </p>
com.top_logic.layout.view.security.SecurityRule = Security rule
com.top_logic.layout.view.security.SecurityRule.Config.group = Group
com.top_logic.layout.view.security.SecurityRule.Config.group.tooltip = The command group required to execute the command. <p> The group (e.g. Write, Delete) must be declared on the referenced scope so that roles can be assigned to it. </p>
com.top_logic.layout.view.security.SecurityRule.Config.scope = Scope
com.top_logic.layout.view.security.SecurityRule.Config.scope.tooltip = The id of the security scope providing the role mapping for this command. <p> When unset, the scope of the nearest enclosing removable unit (the access-control gating the surrounding nav-item, tab or tile) is used, so the command shares the role mapping that already gates its visibility. A guarded command that is neither given a scope nor enclosed by one denies access to everyone. </p>
com.top_logic.layout.view.security.SecurityRule.Config.security-object = Security object
com.top_logic.layout.view.security.SecurityRule.Config.security-object.tooltip = Channel whose value is the object the access is checked on. <p> When unset, the access is checked on the security root (a structure-level "may this user run this action here" check). When set, the channel's current value is used as the security object, enabling per-object access checks. A channel value that is not a security object falls back to the security root. </p>
com.top_logic.layout.view.security.SecurityRule.tooltip = <i>View executability rule</i> that hides a command unless the current user is granted its command group on a <i>security scope</i>. <p> The command-level counterpart of the visibility <i>access control</i> on removable units: where visibility asks "may this user see this part of the app", this rule asks "may this user run <em>this action</em> here". The decision goes through the same <i>security scope</i> (and thus the same persistent role assignment) as visibility, so the new UI agrees with legacy semantics. Since a command's server-side dispatch re-evaluates its executability rule, this rule is enforced both on the button (disabled/hidden) and at execution time. </p> <p> Two things are resolved when the rule is bound: </p> <ul> <li>The <i>security scope</i> providing the role mapping: the explicitly configured scope if set, otherwise the enclosing unit's scope. A guarded command that resolves to no scope fails closed.</li> <li>The security object the roles are checked on: the value of the configured security-object channel if it is a <i>bound object</i>, otherwise the security root (structure-level check).</li> </ul>
com.top_logic.layout.view.security.SecurityScopeService = Security scopes
com.top_logic.layout.view.security.SecurityScopeService$GroupConfig = Group configuration
com.top_logic.layout.view.security.SecurityScopeService$GroupConfig.tooltip = A command group declared on a <i>scope configuration</i>.
com.top_logic.layout.view.security.SecurityScopeService$ScopeConfig = Scope configuration
com.top_logic.layout.view.security.SecurityScopeService$ScopeConfig.tooltip = A node in the security scope catalog tree. <p> A node with an id is a referenceable <i>security scope</i>. Nesting via <i>Scopes</i> provides grouping; a node's label doubles as the grouping label for its children in the security administration UI. </p>
com.top_logic.layout.view.security.SecurityScopeService.Config.scopes = Scopes
com.top_logic.layout.view.security.SecurityScopeService.Config.scopes.tooltip = The top-level nodes of the security scope catalog. <p> Keyed by id so that an application including this module can <em>override or adjust</em> an inherited scope (e.g. the framework's administration scope) by re-declaring an entry with the same id, in addition to appending its own scopes. </p>
com.top_logic.layout.view.security.SecurityScopeService.GroupConfig.name = Name
com.top_logic.layout.view.security.SecurityScopeService.GroupConfig.name.tooltip = Reference to the <i>command group</i> (e.g. Write, Delete) that may be checked against the enclosing scope.
com.top_logic.layout.view.security.SecurityScopeService.ScopeConfig.groups = Groups
com.top_logic.layout.view.security.SecurityScopeService.ScopeConfig.groups.tooltip = The non-default command groups that command-level access rules may check against this scope. <p> The default (visibility) command group is always available and need not be listed here; only additional groups (e.g. Write, Delete) used by a command security rule need to be declared, so that the materialized security object carries them for role assignment. </p>
com.top_logic.layout.view.security.SecurityScopeService.ScopeConfig.id = ID
com.top_logic.layout.view.security.SecurityScopeService.ScopeConfig.id.tooltip = The unique scope id. <p> When set, this node is a <i>security scope</i> that can be referenced from a view's <access-control>. When unset, the node is a pure grouping node. </p>
com.top_logic.layout.view.security.SecurityScopeService.ScopeConfig.label = Label
com.top_logic.layout.view.security.SecurityScopeService.ScopeConfig.label.tooltip = Human-readable label for the security administration UI.
com.top_logic.layout.view.security.SecurityScopeService.ScopeConfig.scopes = Scopes
com.top_logic.layout.view.security.SecurityScopeService.ScopeConfig.scopes.tooltip = Nested scope nodes (sub-groups or sub-scopes). <p> Keyed by id so a nested scope can likewise be overridden by id from an including application's configuration. </p>
com.top_logic.layout.view.security.SecurityScopeService.tooltip = Central catalog of <i>security scopes</i> available to the declarative view system. <p> Scopes are defined once here as a tree of id/label entries (nesting provides grouping for the security administration UI) and referenced from removable UI units via <i>access control</i>. Defining scopes centrally — rather than inline in the view — lets several UI units share one scope by referencing the same id without duplicating its label. </p> <p> At startup the service materializes a persistent <i>pers bound component</i> for every configured scope (keyed by its id), so the existing security administration tooling can assign roles to view security scopes just like to legacy components. </p>
com.top_logic.layout.view.security.WithAccessControl = With access control
com.top_logic.layout.view.security.WithAccessControl.access-control = Access control
com.top_logic.layout.view.security.WithAccessControl.access-control.tooltip = The access control guarding this UI unit.
com.top_logic.layout.view.security.WithAccessControl.tooltip = Configuration mixin adding an optional <i>access control</i> reference to a removable UI unit. <p> Securable element configurations (nav-item, tab, tile) extend this interface so that the same <access-control> declaration and the same enforcement code (<i>access checks</i>) apply uniformly across all of them. </p>
com.top_logic.layout.view.slot.SlotContentElement = Slot content element
com.top_logic.layout.view.slot.SlotContentElement.Config.children = Children
com.top_logic.layout.view.slot.SlotContentElement.Config.children.tooltip = The contributed child elements.
com.top_logic.layout.view.slot.SlotContentElement.Config.to = To
com.top_logic.layout.view.slot.SlotContentElement.Config.to.tooltip = Name of the target <slot>. Contribution is routed to the nearest such slot in the tree. <p> Attribute is called to (not slot) to avoid ambiguity with the <slot> child tag name inside the default container. </p>
com.top_logic.layout.view.slot.SlotContentElement.tooltip = UIElement that contributes its children to the nearest matching <i>slot element</i>. <p> The contribution renders nothing at its declared position; instead, the children are rendered by the matched <slot> placeholder. The children are constructed in the declaring view's <i>view context</i>, so their channel references resolve locally. </p>
com.top_logic.layout.view.slot.SlotElement = Slot element
com.top_logic.layout.view.slot.SlotElement.Config.name = Name
com.top_logic.layout.view.slot.SlotElement.Config.name.tooltip = The slot name. <slot-content to="X"> contributions are routed here when this is the nearest matching <slot name="X"/> in the tree.
com.top_logic.layout.view.slot.SlotElement.tooltip = UIElement that declares a named placeholder for <slot-content> contributions. <p> The placeholder renders all contributions whose target slot name matches and whose tree-nearest matching <slot> is this one. Routing is performed by the shared <i>slot registry</i>. </p>
com.top_logic.layout.view.table.AbstractColumnDeclaration = Column declaration
com.top_logic.layout.view.table.AbstractColumnDeclaration.Config.aggregate = Aggregate
com.top_logic.layout.view.table.AbstractColumnDeclaration.Config.aggregate.tooltip = What this column shows for a group of rows: a function over the member rows of the group, whose result is displayed in the group's header row. <p> The function receives the list of the rows in the group and yields one value of the kind the column holds - the sum of a number column, the earliest of a date column - which is then displayed exactly as a cell of that column is. Unset (the default) leaves the column's group cell empty. </p>
com.top_logic.layout.view.table.AbstractColumnDeclaration.Config.filter = Filter
com.top_logic.layout.view.table.AbstractColumnDeclaration.Config.filter.tooltip = An application-defined filter for this column, overriding the type-derived default. The filter matches against the cell's display text.
com.top_logic.layout.view.table.AbstractColumnDeclaration.Config.label = Label
com.top_logic.layout.view.table.AbstractColumnDeclaration.Config.label.tooltip = The column header label, or unset to keep the label the column derives - the label of the attribute it shows, and the column's name where no attribute says it.
com.top_logic.layout.view.table.AbstractColumnDeclaration.Config.readonly = Readonly
com.top_logic.layout.view.table.AbstractColumnDeclaration.Config.readonly.tooltip = Whether this column stays read-only while the rows of the table are edited.
com.top_logic.layout.view.table.AbstractColumnDeclaration.Config.sort = Sort
com.top_logic.layout.view.table.AbstractColumnDeclaration.Config.sort.tooltip = The direction this column is sorted in when the table is first shown, or unset to leave it unsorted. <p> Sorting by several columns is expressed by setting this on more than one of them; the declaration order decides which one sorts first. The default only applies until the user sorts the table themselves, from then on their own order is remembered. </p>
com.top_logic.layout.view.table.AbstractColumnDeclaration.Config.width = Width
com.top_logic.layout.view.table.AbstractColumnDeclaration.Config.width.tooltip = The column's default display width in pixels. <p> This is the width the user sees until they resize the column themselves; from then on their own width is remembered. 0 - the default - keeps the width the column's type derives. </p>
com.top_logic.layout.view.table.AbstractColumnDeclaration.tooltip = Base of the <i>column declarations</i> that describe a single column, with the properties every such column has: its label, its filter, its width, whether it can be edited, the order it sorts the table in, and what it aggregates over a group of rows. <p> A subclass says what the column is named and what its cells hold; everything the table does with those values is described here and reaches the column through the descriptor this class builds. </p>
com.top_logic.layout.view.table.AttributeColumn = Attribute column
com.top_logic.layout.view.table.AttributeColumn.Config.attribute = Attribute
com.top_logic.layout.view.table.AttributeColumn.Config.attribute.tooltip = The name of the attribute to display, which is the name of the column.
com.top_logic.layout.view.table.AttributeColumn.tooltip = The <column> of a table: one column showing a model attribute of its rows. <p> The attribute says everything about the column - what its cells hold, how they are displayed, sorted, filtered and searched, how wide the column is and what its header says - so declaring the attribute is all such a column needs. Where the rows of the table are edited, an edited cell writes its value to that attribute. </p>
com.top_logic.layout.view.table.ColumnProviderService = Table columns
com.top_logic.layout.view.table.ColumnProviderService$ProviderMapping = Provider mapping
com.top_logic.layout.view.table.ColumnProviderService$ProviderMapping.tooltip = A single type-to-<i>column provider</i> mapping.
com.top_logic.layout.view.table.ColumnProviderService.Config.boolean-width = Boolean width
com.top_logic.layout.view.table.ColumnProviderService.Config.boolean-width.tooltip = The width in pixels of a column showing a truth value, used when the column configures none. <p> A truth value is displayed as a check mark, so the header label decides how much room the column needs. </p>
com.top_logic.layout.view.table.ColumnProviderService.Config.date-time-width = Date time width
com.top_logic.layout.view.table.ColumnProviderService.Config.date-time-width.tooltip = The width in pixels of a column showing a date with a time of day, used when the column configures none.
com.top_logic.layout.view.table.ColumnProviderService.Config.date-width = Date width
com.top_logic.layout.view.table.ColumnProviderService.Config.date-width.tooltip = The width in pixels of a column showing a date, used when the column configures none.
com.top_logic.layout.view.table.ColumnProviderService.Config.enumeration-width = Enumeration width
com.top_logic.layout.view.table.ColumnProviderService.Config.enumeration-width.tooltip = The width in pixels of a column showing a classifier of an enumeration, used when the column configures none.
com.top_logic.layout.view.table.ColumnProviderService.Config.label-width = Label width
com.top_logic.layout.view.table.ColumnProviderService.Config.label-width.tooltip = The width in pixels of a column showing its values by their display label, used when the column configures none. <p> The width of every column not covered by one of the other widths: a reference, a multi-valued attribute, a value of an application-defined datatype, and one whose type could not be resolved. </p>
com.top_logic.layout.view.table.ColumnProviderService.Config.number-width = Number width
com.top_logic.layout.view.table.ColumnProviderService.Config.number-width.tooltip = The width in pixels of a column showing a number, used when the column configures none.
com.top_logic.layout.view.table.ColumnProviderService.Config.providers = Providers
com.top_logic.layout.view.table.ColumnProviderService.Config.providers.tooltip = Provider mappings keyed by model type reference.
com.top_logic.layout.view.table.ColumnProviderService.Config.string-width = String width
com.top_logic.layout.view.table.ColumnProviderService.Config.string-width.tooltip = The width in pixels of a column showing a text, used when the column configures none.
com.top_logic.layout.view.table.ColumnProviderService.Config.time-width = Time width
com.top_logic.layout.view.table.ColumnProviderService.Config.time-width.tooltip = The width in pixels of a column showing a time of day, used when the column configures none.
com.top_logic.layout.view.table.ColumnProviderService.ProviderMapping.impl = Implementation
com.top_logic.layout.view.table.ColumnProviderService.ProviderMapping.impl.tooltip = The provider used for values of this type.
com.top_logic.layout.view.table.ColumnProviderService.ProviderMapping.type = Type
com.top_logic.layout.view.table.ColumnProviderService.ProviderMapping.type.tooltip = The model type this mapping applies to.
com.top_logic.layout.view.table.ColumnProviderService.tooltip = Resolves the <i>column provider</i> for a kind of value, turning a datatype into a green-field table <i>column</i> (accessor + renderer + comparator + filter). <p> A column is described by a <i>column type</i> - the model type of its values, whether a cell holds several of them, and where their display annotations come from - and a function reading the cell value from a row. A model attribute is one such description, not the only one, so a column over a computed value gets the same affordances as one over an attribute. </p> <p> Cells display their values through <i>form field controls</i>: a cell shows a value exactly as a view-mode form field does (color swatch, icon, checkbox, selection labels), so forms and tables share a single type-to-display mechanism. </p> <p> Comparator and filter are resolved per value type (mirrors <i>form field controls</i>): </p> <ol> <li>A provider configured in this service for the <i>type</i> of the values (app-extensible).</li> <li>A built-in default derived from the type's structure: enumeration → options filter, INT/FLOAT → numeric range, DATE → date range, BOOLEAN/TRISTATE → boolean, STRING → text; anything else (custom primitives, references, multi-valued or unresolved descriptors) → a display-label text filter.</li> </ol> <p> The built-in default is the only place a type is inspected, and it is fully overridable per type through <i>Providers</i> - so a new datatype plugs in a column affordance without editing this layer. </p> <p> The same classification decides how wide a column starts out, one configured width per kind of value: a truth value is narrow, a date with a time of day wide. A column configuring a width of its own is shown in that width instead. </p>
com.top_logic.layout.view.table.ColumnsConfig = Columns configuration
com.top_logic.layout.view.table.ColumnsConfig.columns = Columns
com.top_logic.layout.view.table.ColumnsConfig.columns.tooltip = The declarations contributing the columns to display, in display order.
com.top_logic.layout.view.table.ColumnsConfig.tooltip = The <columns> of a table: what it displays, in display order. <p> An entry declares a column - <column attribute="..."/> for one over a model attribute, <computed-column .../> for one over a computed value - or a whole set of them, as <embedded-columns reference="..."/> does for the columns of an object the row points to. Every table describing its columns uses this one configuration, so a kind of column added here is offered by all of them. </p>
com.top_logic.layout.view.table.ComputedColumn = Computed column
com.top_logic.layout.view.table.ComputedColumn.Config.can-update = Can update
com.top_logic.layout.view.table.ComputedColumn.Config.can-update.tooltip = Whether the cell of a row can be edited: a function of the row yielding whether the edit is offered there. <p> The values of the declared inputs come first, in declaration order, exactly as they do for the value function. Unset, every row of a column that declares an update is edited. </p>
com.top_logic.layout.view.table.ComputedColumn.Config.multiple = Multiple
com.top_logic.layout.view.table.ComputedColumn.Config.multiple.tooltip = Whether a cell holds a collection of values of the declared type rather than a single one.
com.top_logic.layout.view.table.ComputedColumn.Config.name = Name
com.top_logic.layout.view.table.ComputedColumn.Config.name.tooltip = The name of the column, under which the user's arrangement of it is remembered. <p> It is the name the rest of the table refers to the column by - a grouping, a filter criterion - and no two columns of a table may share it. </p>
com.top_logic.layout.view.table.ComputedColumn.Config.type = Type
com.top_logic.layout.view.table.ComputedColumn.Config.type.tooltip = The type of the computed values, deciding how the column displays, sorts and filters them. <p> Unset, nothing is known about the values and the column shows them by their display label. </p>
com.top_logic.layout.view.table.ComputedColumn.Config.update = Update
com.top_logic.layout.view.table.ComputedColumn.Config.update.tooltip = The function writing an edited cell value, receiving the row and the entered value as its last two arguments. <p> The values of the declared inputs come first, in declaration order, exactly as they do for the value function. What the update does with the value is up to it - assign an attribute, create an object, distribute it over several attributes. </p> <p> Unset, the column is displayed but not edited. </p>
com.top_logic.layout.view.table.ComputedColumn.Config.value = Value
com.top_logic.layout.view.table.ComputedColumn.Config.value.tooltip = The function computing the cell value, receiving the row as its last argument. <p> The values of the declared inputs come first, in declaration order, so a column can show something that depends on what is displayed elsewhere. </p>
com.top_logic.layout.view.table.ComputedColumn.tooltip = The <computed-column> of a table: one column showing a value computed from the row. <p> The value function is evaluated per row and yields what the cell holds. The declared type says what kind of value that is, and with it how the column is displayed, sorted, filtered, searched and how wide it starts out - so a computed column gets everything a column over a model attribute gets. A column declaring no type shows its values by their display label. </p> <p> Such a column shows what the row does not hold: a total over the values of an attribute, a difference between two dates, a value read through a chain of references. </p> <p> A column declaring an update function is edited where the rows of the table are: what an edited value means for the row is what that function does with it, and which rows offer the edit is what the predicate says. The control the value is entered with follows from the declared type, so a column that is edited declares one. </p>
com.top_logic.layout.view.table.DropTargetMode = Drop target mode
com.top_logic.layout.view.table.DropTargetMode.ROW = Row
com.top_logic.layout.view.table.DropTargetMode.ROW.tooltip = A single row is the target. <p> A drop applies to the row it was made on, which is what the drop's target-channel carries into the action chain; a drop beside the rows applies to nothing. The rows are highlighted individually while such a drag moves over the table. </p>
com.top_logic.layout.view.table.DropTargetMode.TABLE = Table
com.top_logic.layout.view.table.DropTargetMode.TABLE.tooltip = The table as a whole is the target. <p> A drop anywhere on the table applies, and the action chain is told nothing beyond the dropped objects - what the drop means is the same wherever it was made. </p>
com.top_logic.layout.view.table.DropTargetMode.tooltip = What a declared drop of a table targets: the table as a whole, or a single row of it.
com.top_logic.layout.view.table.DynamicColumns = Dynamic columns
com.top_logic.layout.view.table.DynamicColumns.Config.aggregate = Aggregate
com.top_logic.layout.view.table.DynamicColumns.Config.aggregate.tooltip = What a column shows for a group of rows: a function of the member rows of the group and the object the column stands for, whose result is displayed in the group's header row. <p> The values of the declared inputs come first, in declaration order. The result is one value of the kind the column holds, displayed exactly as a cell of that column is. Unset, the group cells stay empty. </p>
com.top_logic.layout.view.table.DynamicColumns.Config.can-update = Can update
com.top_logic.layout.view.table.DynamicColumns.Config.can-update.tooltip = Whether the cell of a row can be edited: a function of the row and the object the column stands for, yielding whether the edit is offered there. <p> The values of the declared inputs come first, in declaration order. Unset, every row of columns declaring an update is edited. </p>
com.top_logic.layout.view.table.DynamicColumns.Config.column-label = Column label
com.top_logic.layout.view.table.DynamicColumns.Config.column-label.tooltip = The function computing the header label of one column, receiving the object that column stands for. <p> The values of the declared inputs come first, in declaration order. The result is an internationalized text, a string, or any object shown by its display label. Unset, the object itself labels its column. </p>
com.top_logic.layout.view.table.DynamicColumns.Config.column-name = Column name
com.top_logic.layout.view.table.DynamicColumns.Config.column-name.tooltip = The function computing the name of one column, receiving the object that column stands for. <p> The values of the declared inputs come first, in declaration order. The result is a text that stays the same across sessions, as the user's arrangement of a column is remembered under its name. Unset, the display label of the object names its column. </p>
com.top_logic.layout.view.table.DynamicColumns.Config.column-type = Column type
com.top_logic.layout.view.table.DynamicColumns.Config.column-type.tooltip = The function computing the type of the values of one column, receiving the object that column stands for. <p> The values of the declared inputs come first, in declaration order. The result is a reference to a model type, e.g. <code>`tl.core:Integer`</code>. A declaration whose columns all show values of the same type names that type instead of computing it. </p>
com.top_logic.layout.view.table.DynamicColumns.Config.columns = Columns
com.top_logic.layout.view.table.DynamicColumns.Config.columns.tooltip = The function computing the objects the columns stand for, one column per object and in that order. <p> The values of the declared inputs come first, in declaration order, so that the columns follow what is displayed elsewhere. An object is anything the other functions of this declaration can work with - a model object, a date, a string. </p>
com.top_logic.layout.view.table.DynamicColumns.Config.multiple = Multiple
com.top_logic.layout.view.table.DynamicColumns.Config.multiple.tooltip = Whether a cell holds a collection of values of the declared type rather than a single one.
com.top_logic.layout.view.table.DynamicColumns.Config.name = Name
com.top_logic.layout.view.table.DynamicColumns.Config.name.tooltip = The name every column of this declaration is named after. <p> The name of a column is this name, a dot, and the name of the object the column stands for - so the columns of this declaration stay apart from the other columns of the table, whichever objects they are built for. </p>
com.top_logic.layout.view.table.DynamicColumns.Config.readonly = Readonly
com.top_logic.layout.view.table.DynamicColumns.Config.readonly.tooltip = Whether the columns of this declaration stay read-only while the rows of the table are edited.
com.top_logic.layout.view.table.DynamicColumns.Config.type = Type
com.top_logic.layout.view.table.DynamicColumns.Config.type.tooltip = The type of the computed values, deciding how the columns display, sort and filter them. <p> All columns of this declaration show values of this type. Where they do not, the type is computed per column instead. Unset, and with no function computing it either, nothing is known about the values and the columns show them by their display label. </p>
com.top_logic.layout.view.table.DynamicColumns.Config.update = Update
com.top_logic.layout.view.table.DynamicColumns.Config.update.tooltip = The function writing an edited cell value, receiving the row, the object the column stands for and the entered value as its last three arguments. <p> The values of the declared inputs come first, in declaration order. Unset, the columns are displayed but not edited. </p>
com.top_logic.layout.view.table.DynamicColumns.Config.value = Value
com.top_logic.layout.view.table.DynamicColumns.Config.value.tooltip = The function computing the cell value, receiving the row and the object the column stands for as its last two arguments. <p> The values of the declared inputs come first, in declaration order. </p>
com.top_logic.layout.view.table.DynamicColumns.Config.width = Width
com.top_logic.layout.view.table.DynamicColumns.Config.width.tooltip = The default display width of every column of this declaration, in pixels. <p> This is the width the user sees until they resize a column themselves; from then on their own width is remembered. 0 - the default - keeps the width the type of the values derives. </p>
com.top_logic.layout.view.table.DynamicColumns.tooltip = The <dynamic-columns> of a table: one column per element of a computed set of objects. <p> A table of employees showing one column per month, a table of tasks showing one column per milestone: which columns there are is decided by data, not by the configuration. Each of those columns stands for one object - a month, a milestone - and shows what the row holds for it, which the value function computes from the row and that object. </p> <p> The columns are named after the declaration and the object each of them stands for, so that the user's arrangement of a column is remembered under a name that stays with it. They share what the declaration says about all of them: the type of their values (or a function computing it per column), their display width and whether they stay read-only while the rows are edited. Their filter is the one their type derives; a filter of their own is not declared, as there is no single column to declare it for. </p> <p> The columns are those the function yields when the table is built. A table whose rows follow an input reads its rows again whenever that input changes; its columns are the ones it was built with. </p>
com.top_logic.layout.view.table.EmbeddedColumns = Embedded columns
com.top_logic.layout.view.table.EmbeddedColumns.Config.label = Label
com.top_logic.layout.view.table.EmbeddedColumns.Config.label.tooltip = What the header of every embedded column starts with, or unset to take it from the labels of the references leading to the embedded object. <p> The label of an embedded column is this prefix and the column's own label, so that the name of the row and the name of the assignee read differently. A computed embedding has no reference to take the prefix from and declares it. </p>
com.top_logic.layout.view.table.EmbeddedColumns.Config.multiple = Multiple
com.top_logic.layout.view.table.EmbeddedColumns.Config.multiple.tooltip = Whether the <i>Object</i> function yields a collection of objects rather than a single one. <p> Every embedded column then shows the value of each of them, exactly as it does where a reference on the path holds several objects. An embedding naming a reference takes this from the path. </p>
com.top_logic.layout.view.table.EmbeddedColumns.Config.name = Name
com.top_logic.layout.view.table.EmbeddedColumns.Config.name.tooltip = The name the embedded columns are named after, or unset to name them after the reference leading to them. <p> It is what the names of the embedded columns start with, so that a column of the embedded object and one of the row itself stay apart. A computed embedding has no reference to take it from and declares it. </p>
com.top_logic.layout.view.table.EmbeddedColumns.Config.object = Object
com.top_logic.layout.view.table.EmbeddedColumns.Config.object.tooltip = The function computing the embedded object, receiving the row as its last argument. <p> The values of the declared inputs come first, in declaration order. The function yields the one object whose columns are embedded, of the declared type. </p>
com.top_logic.layout.view.table.EmbeddedColumns.Config.reference = Reference
com.top_logic.layout.view.table.EmbeddedColumns.Config.reference.tooltip = The reference leading from the row to the embedded object. <p> A path of reference names separated by dots reaches an object further away, each step resolved in the type the step before it leads to. A step holding several objects makes every embedded column show the value of each of them. </p> <p> Either the reference leading to the embedded object is named here, or the object is computed by a function and its type declared. </p>
com.top_logic.layout.view.table.EmbeddedColumns.Config.type = Type
com.top_logic.layout.view.table.EmbeddedColumns.Config.type.tooltip = The type of the computed object, deciding which columns it is embedded with. <p> Declared together with the function computing the object; an embedding naming a reference takes the type from that reference. </p>
com.top_logic.layout.view.table.EmbeddedColumns.tooltip = The <embedded-columns> of a table: the columns of an object the row points to, shown as columns of the row. <p> A table of tickets shows the name and the mail address of the assignee without saying a second time how a person is displayed: it embeds the columns of the assignee, and each of them reads its value from the person the row points to. The embedded object is reached either by naming the reference leading to it - a whole path of references, where it is further away - or by a function computing it, for an object no single reference leads to. </p> <p> What is embedded are column declarations of any kind, resolved against the type of the embedded object exactly as the columns of a table over that object would be - including the columns the embedded type offers in addition, and another embedding one step further. An embedding declaring nothing shows the main properties of the embedded type, so naming the reference is all it takes. </p> <p> The embedded columns are named and labelled after the path leading to them, so that the name of the row and the name of the assignee stay apart in the header and in the column selection. Where a row reaches several objects - over a reference holding more than one, or through a function yielding a collection of them - a cell shows the value of each of them. </p>
com.top_logic.layout.view.table.FilterStateConfig$BooleanConfig = Boolean configuration
com.top_logic.layout.view.table.FilterStateConfig$BooleanConfig.tooltip = A criterion for a column filtered by a truth value.
com.top_logic.layout.view.table.FilterStateConfig$OptionsConfig = Options configuration
com.top_logic.layout.view.table.FilterStateConfig$OptionsConfig.tooltip = A criterion for a column filtered by selecting among its values.
com.top_logic.layout.view.table.FilterStateConfig$RangeConfig = Range configuration
com.top_logic.layout.view.table.FilterStateConfig$RangeConfig.tooltip = A criterion for a column filtered by comparing its values.
com.top_logic.layout.view.table.FilterStateConfig$TextConfig = Text configuration
com.top_logic.layout.view.table.FilterStateConfig$TextConfig.tooltip = A criterion for a column filtered by a text pattern. <p> The matching options are the ones the filter of the column offers the user, and they mean the same here: a pattern matches a part of the cell text, case-insensitively, unless declared otherwise. </p>
com.top_logic.layout.view.table.FilterStateConfig.BooleanConfig.accept = Accept
com.top_logic.layout.view.table.FilterStateConfig.BooleanConfig.accept.tooltip = TL-Script expression computing which truth values are accepted: one of them, or a collection of several. <p> Nothing stands for the cells without a value, which are accepted only by a column that has such cells; everything else is read as a truth value the way TL-Script reads one. A criterion accepting all the values a column has filters nothing. </p>
com.top_logic.layout.view.table.FilterStateConfig.OptionsConfig.selected = Selected
com.top_logic.layout.view.table.FilterStateConfig.OptionsConfig.selected.tooltip = TL-Script expression computing the value, or the collection of values, to select. <p> Each computed value has to be one the column offers as an option; a value it does not offer is a configuration error, and the preset is then not offered - a selection missing one of its values matches other rows than the declaration says. A value that is not there selects nothing, so a criterion selecting what is displayed elsewhere leaves the column unfiltered while nothing is selected there. </p>
com.top_logic.layout.view.table.FilterStateConfig.RangeConfig.operator = Operator
com.top_logic.layout.view.table.FilterStateConfig.RangeConfig.operator.tooltip = How the cell value is compared to the declared bounds.
com.top_logic.layout.view.table.FilterStateConfig.RangeConfig.primary = Primary
com.top_logic.layout.view.table.FilterStateConfig.RangeConfig.primary.tooltip = TL-Script expression computing the value the cell value is compared to - the lower bound of a comparison against a range. <p> An expression yielding nothing filters nothing. </p>
com.top_logic.layout.view.table.FilterStateConfig.RangeConfig.secondary = Secondary
com.top_logic.layout.view.table.FilterStateConfig.RangeConfig.secondary.tooltip = TL-Script expression computing the upper bound of a comparison against a range, which is the only comparison using a second bound.
com.top_logic.layout.view.table.FilterStateConfig.TextConfig.case-sensitive = Case sensitive
com.top_logic.layout.view.table.FilterStateConfig.TextConfig.case-sensitive.tooltip = Whether upper and lower case have to match, too.
com.top_logic.layout.view.table.FilterStateConfig.TextConfig.pattern = Pattern
com.top_logic.layout.view.table.FilterStateConfig.TextConfig.pattern.tooltip = TL-Script expression computing the pattern to match. <p> The text the expression yields is the pattern; an expression yielding nothing filters nothing, so that a criterion matching what is selected elsewhere leaves the column unfiltered while nothing is selected. </p>
com.top_logic.layout.view.table.FilterStateConfig.TextConfig.regexp = Regular expression
com.top_logic.layout.view.table.FilterStateConfig.TextConfig.regexp.tooltip = Whether the pattern is a regular expression rather than a piece of text to be found.
com.top_logic.layout.view.table.FilterStateConfig.TextConfig.whole-field = Whole field
com.top_logic.layout.view.table.FilterStateConfig.TextConfig.whole-field.tooltip = Whether the whole cell text has to match, rather than a part of it.
com.top_logic.layout.view.table.ScriptedFilter = Scripted filter
com.top_logic.layout.view.table.ScriptedFilter.Config.label = Label
com.top_logic.layout.view.table.ScriptedFilter.Config.label.tooltip = The dialog title / column-filter label.
com.top_logic.layout.view.table.ScriptedFilter.Config.match = Match
com.top_logic.layout.view.table.ScriptedFilter.Config.match.tooltip = The closure-building match function (params [, ...inputs]) -> ((value, row) -> Boolean).
com.top_logic.layout.view.table.ScriptedFilter.Config.model = Model
com.top_logic.layout.view.table.ScriptedFilter.Config.model.tooltip = The model type whose attributes are the filter parameters (rendered as the filter form).
com.top_logic.layout.view.table.ScriptedFilter.tooltip = A fully model- and script-defined column filter: the filter UI is a form over a transient instance of a configured parameter type, and the filter logic is a TL-Script match function. <p> The match function is a <em>closure builder</em>: </p> <pre> match : (params [, ...inputs]) -&gt; ( (value, row) -&gt; Boolean ) </pre> <p> It is evaluated <em>once</em> per filter application (binding the form's parameter object and any configured extra inputs) to produce a predicate closure, which is then applied per row with the column's cell value and the whole row as context - so expensive parameter-derived setup happens once, not per row. </p> <p> The filter integrates its own column and dialog by implementing <i>column binding</i>: the column cell carries a <i>scripted cell</i> (value + row), so the filter sees both without knowing where the value comes from, and the filter registers its own <i>scripted filter UI</i> form. </p>
com.top_logic.layout.view.tiles.FrameParamConfig = Frame parameter configuration
com.top_logic.layout.view.tiles.FrameParamConfig.expr = Expression
com.top_logic.layout.view.tiles.FrameParamConfig.expr.tooltip = Expression mapping the value of the parameter onto the text the URL carries. <p> Receives the value the frame holds and returns the text naming it. An expression yielding nothing means the value has no name in a URL - a transient object, for instance - and the frame then contributes no segment: an address that cannot be opened again is better left unwritten. </p>
com.top_logic.layout.view.tiles.FrameParamConfig.name = Name
com.top_logic.layout.view.tiles.FrameParamConfig.name.tooltip = The parameter this conversion applies to. <p> The name of a parameter placeholder of the route, which is at the same time the name of the channel the frame receives the value on. </p>
com.top_logic.layout.view.tiles.FrameParamConfig.reverse = Reverse
com.top_logic.layout.view.tiles.FrameParamConfig.reverse.tooltip = Expression mapping the text the URL carries back onto the value of the parameter. <p> Receives the text of the URL and returns the value the frame is mounted with. An expression yielding nothing means the URL names something the display cannot show - an object that is deleted, an identifier that was mistyped - and the frame is then not restored at all. </p>
com.top_logic.layout.view.tiles.FrameParamConfig.tooltip = Conversion of one parameter of a frame route between the value the frame holds and the text the URL carries. <p> A URL carries text, a frame parameter typically a business object. The two expressions convert between them: expr maps the value onto the text that names it, reverse maps the text back onto the value. For an object identified by its technical identifier this is expr="p -> objectId($p)" and reverse="id -> objectResolve(`tl.accounts:Person`, $id)"; a readable URL uses a business key instead, at the price of the uniqueness the key then has to have. </p> <p> A parameter of the route without an entry of its own is carried as text: the value names itself in the URL and the text of the URL is the value, which is what a parameter holding a string needs. </p>
com.top_logic.layout.view.tiles.FrameRouteConfig = Frame route configuration
com.top_logic.layout.view.tiles.FrameRouteConfig.label = Label
com.top_logic.layout.view.tiles.FrameRouteConfig.label.tooltip = Provider for the label naming a frame of this view. <p> Evaluated over the parameters of the frame, which the provider reads as channels of their names: &lt;scripted&gt; with inputs="person" expr="p -&gt; $p.get(`tl.accounts:Person#name`)" names a frame by the object it displays, &lt;static&gt; by fixed text. </p> <p> The declaration names every frame of this view: the one a URL restores, and the one a &lt;navigate-push&gt; pushes without a frame label of its own - which is what lets a frame be named once, at the stack, for every place that pushes it. </p>
com.top_logic.layout.view.tiles.FrameRouteConfig.params = Parameters
com.top_logic.layout.view.tiles.FrameRouteConfig.params.tooltip = Conversions between the parameter values of the frame and the texts the URL carries. <p> One entry per parameter of the route that is not a text already. A parameter without an entry is carried as text. </p>
com.top_logic.layout.view.tiles.FrameRouteConfig.route = Route
com.top_logic.layout.view.tiles.FrameRouteConfig.route.tooltip = Pattern of the URL segments the frame occupies. <p> A pattern of static segments and parameter placeholders, person/:person for instance. Each placeholder names a parameter of the frame, and the static segments in front of it give the address a readable prefix that says what the frame shows. </p>
com.top_logic.layout.view.tiles.FrameRouteConfig.tooltip = The route in the URL that one frame of a &lt;tile-stack&gt; occupies. <p> A drill-down path is part of the address of the page: each frame on the path contributes the route declared for its view, so that the URL names the path the user drilled down and opening it again restores exactly those frames. A frame view without a declaration is displayed like any other but has no address, and neither has anything drilled into from it. </p> <p> The route is a pattern of static segments and parameter placeholders such as person/:person: the static segments name what the frame shows, the placeholders carry its parameters. The declaration also carries the label of the frame, which every frame of that view is named by - the one restored from a URL as well as the one a &lt;navigate-push&gt; pushes without a label of its own. </p> <p> Example: </p> <pre> &lt;tile-stack initial="accounts/overview.view.xml" path="navPath"&gt; &lt;frame route="person/:person" view="accounts/person-detail.view.xml"&gt; &lt;param name="person" expr="p -&gt; objectId($p)" reverse="id -&gt; objectResolve(`tl.accounts:Person`, $id)"/&gt; &lt;label class="com.top_logic.layout.view.tiles.ScriptedTileLabel" expr="p -&gt; $p.get(`tl.accounts:Person#name`)" inputs="person"/&gt; &lt;/frame&gt; &lt;/tile-stack&gt; </pre>
com.top_logic.layout.view.tiles.FrameRouteConfig.view = View
com.top_logic.layout.view.tiles.FrameRouteConfig.view.tooltip = Path of the frame view this route describes, relative to /WEB-INF/views/. <p> The same reference a frame of that view is pushed with, so that a frame on the path finds the route describing it. </p>
com.top_logic.layout.view.tiles.NavigatePopAction = Navigate pop action
com.top_logic.layout.view.tiles.NavigatePopAction.tooltip = <i>View action</i> that pops the topmost frame from the enclosing tile stack. <p> Passes the input through as output, so an action following it in the chain still sees the object the chain works on - which is what makes "delete the object, then leave the frame that displayed it" one command. </p>
com.top_logic.layout.view.tiles.NavigatePopCommand = Navigate pop command
com.top_logic.layout.view.tiles.NavigatePopCommand.tooltip = <i>View command</i> that pops the topmost frame from the enclosing tile stack. <p> Resolves the target stack from the <i>view context</i> - typically used by a "Back" button inside a pushed frame. For breadcrumb-driven navigation, prefer letting the &lt;tile-breadcrumb&gt; write directly to the path channel. To pop as one step of a longer command, use the action of the same tag inside a &lt;generic-command&gt;. </p>
com.top_logic.layout.view.tiles.NavigatePopToAction = Navigate pop to action
com.top_logic.layout.view.tiles.NavigatePopToAction.Config.depth = Depth
com.top_logic.layout.view.tiles.NavigatePopToAction.Config.depth.tooltip = Number of frames to keep on the stack.
com.top_logic.layout.view.tiles.NavigatePopToAction.tooltip = <i>View action</i> that truncates the enclosing tile stack to a fixed depth. <p> After execution exactly <i>Depth</i> frames remain on the stack. depth=0 empties the stack (the initial view is shown again). Values larger than the current depth are no-ops. </p> <p> Passes the input through as output, so an action following it in the chain still sees the object the chain works on. </p>
com.top_logic.layout.view.tiles.NavigatePopToCommand = Navigate pop to command
com.top_logic.layout.view.tiles.NavigatePopToCommand.Config.depth = Depth
com.top_logic.layout.view.tiles.NavigatePopToCommand.Config.depth.tooltip = Number of frames to keep on the stack after the command runs.
com.top_logic.layout.view.tiles.NavigatePopToCommand.tooltip = <i>View command</i> that truncates the tile stack path to a fixed depth. <p> After execution exactly <i>Depth</i> frames remain on the stack. depth=0 empties the stack (the initial view is shown again). Values larger than the current depth are no-ops. To truncate as one step of a longer command, use the action of the same tag inside a &lt;generic-command&gt;. </p>
com.top_logic.layout.view.tiles.NavigatePushCommand = Navigate push command
com.top_logic.layout.view.tiles.NavigatePushCommand.Config.bind-input-to = Bind input to
com.top_logic.layout.view.tiles.NavigatePushCommand.Config.bind-input-to.tooltip = Name of the channel in the pushed view that should receive the command's input value. <p> Convenience for the common case where the drill-down target is a single business object (e.g. the row selected in a table). If null, the input is not propagated - use explicit <bind>s instead. </p>
com.top_logic.layout.view.tiles.NavigatePushCommand.Config.bindings = Bindings
com.top_logic.layout.view.tiles.NavigatePushCommand.Config.bindings.tooltip = Channel bindings from the calling scope to the new frame's channels. <p> Each binding captures the <em>current value</em> of the referenced parent channel at push time and stores it under <i>Channel</i> (<i>channel binding configuration</i>) in the pushed frame params. The mounted view's channel of that name receives the captured value as its initial state. </p>
com.top_logic.layout.view.tiles.NavigatePushCommand.Config.frame-label = Frame label
com.top_logic.layout.view.tiles.NavigatePushCommand.Config.frame-label.tooltip = Provider for the pushed frame's breadcrumb label. <p> Resolved exactly once at push time; the resulting <i>resource key</i> is captured as the pushed frame's label. Use &lt;static&gt; for fixed text, &lt;scripted&gt; for a label derived from caller-scope channels at the push moment. </p>
com.top_logic.layout.view.tiles.NavigatePushCommand.Config.view = View
com.top_logic.layout.view.tiles.NavigatePushCommand.Config.view.tooltip = Path of the view file to mount as the new frame, relative to /WEB-INF/views/.
com.top_logic.layout.view.tiles.NavigatePushCommand.tooltip = <i>View command</i> that pushes a new <i>tile frame</i> onto the enclosing tile stack. <p> Resolves the target stack from the <i>view context</i> - the command must be executed from within a frame that was mounted by a &lt;tile-stack&gt;. Captured at execution time: the command's input (mapped onto a named channel of the new frame, if bind-input-to is set) and the current value of every channel referenced by a <bind>. </p> <p> Example - drilling into a product detail view from a button next to a product table: </p> <pre> &lt;button&gt; &lt;action class="com.top_logic.layout.view.tiles.NavigatePushCommand" view="products/detail.view.xml" input="selectedProduct" bind-input-to="product" frame-label="product.detail.crumb"/&gt; &lt;label&gt;&lt;en&gt;Open&lt;/en&gt;&lt;/label&gt; &lt;/button&gt; </pre>
com.top_logic.layout.view.tiles.ScriptedTileLabel = Scripted tile label
com.top_logic.layout.view.tiles.ScriptedTileLabel.Config.expr = Expression
com.top_logic.layout.view.tiles.ScriptedTileLabel.Config.expr.tooltip = TL-Script expression returning the label string. <p> The values of the declared inputs come first, in declaration order. </p>
com.top_logic.layout.view.tiles.ScriptedTileLabel.tooltip = <i>Tile label provider</i> that computes the label from current channel values using a TL-Script expression. <p> Resolves all inputs to channels at compute time, reads their current values and passes them as positional arguments to the compiled expression. The expression's result is converted to a <i>resource key</i> according to its runtime type - intended for labels derived from business object names. </p>
com.top_logic.layout.view.tiles.StaticTileLabel = Static tile label
com.top_logic.layout.view.tiles.StaticTileLabel.Config.value = Value
com.top_logic.layout.view.tiles.StaticTileLabel.Config.value.tooltip = The label to use for the pushed frame.
com.top_logic.layout.view.tiles.StaticTileLabel.tooltip = <i>Tile label provider</i> that always returns a configured <i>resource key</i>.
com.top_logic.layout.view.tiles.TileBreadcrumbElement = Tile breadcrumb element
com.top_logic.layout.view.tiles.TileBreadcrumbElement.Config.home-label = Home label
com.top_logic.layout.view.tiles.TileBreadcrumbElement.Config.home-label.tooltip = Label of the home crumb (rendered as the first entry, always navigates to an empty path).
com.top_logic.layout.view.tiles.TileBreadcrumbElement.Config.path = Path
com.top_logic.layout.view.tiles.TileBreadcrumbElement.Config.path.tooltip = Reference to the channel holding the List<TileFrame> path.
com.top_logic.layout.view.tiles.TileBreadcrumbElement.tooltip = UIElement that renders an outward navigation trail for a tile stack. <p> Reads the same path channel as the stack. The trail consists of the home entry followed by one crumb per frame on the path; the last crumb represents the currently displayed view. </p> <p> The breadcrumb writes a truncated path back to the channel when the user clicks a crumb - it does not need access to a <i>tile stack scope</i>, so it can be placed freely (sibling, header, sidebar, dedicated view linked via <bind>). </p>
com.top_logic.layout.view.tiles.TileStackElement = Tile stack element
com.top_logic.layout.view.tiles.TileStackElement.Config.bind-path-to = Bind path to
com.top_logic.layout.view.tiles.TileStackElement.Config.bind-path-to.tooltip = Name under which every mounted frame sees the path channel of this stack. <p> The frame gets the stack's own channel, not a copy: a frame view declaring a <channel name="..."/> of that name reads the live path. It thereby knows how deep it sits - a <derived-channel name="depth" inputs="navPath" expr="p -&gt; $p.size()"/> turns the path into a number a command's &lt;visible-if&gt; rule can test, so a "Back" button hides itself on the initial frame. </p> <p> Without a name, a frame sees only the parameters it was pushed with. </p>
com.top_logic.layout.view.tiles.TileStackElement.Config.frames = Frames
com.top_logic.layout.view.tiles.TileStackElement.Config.frames.tooltip = The routes in the URL that the frames of this stack occupy. <p> One entry per frame view whose frames are part of the address of the page. A path of such frames is written into the URL, and opening that URL again restores the path frame by frame; a frame view without an entry is displayed like any other but has no address. </p>
com.top_logic.layout.view.tiles.TileStackElement.Config.initial = Initial
com.top_logic.layout.view.tiles.TileStackElement.Config.initial.tooltip = Path of the view file shown when the stack is empty (the home frame), relative to /WEB-INF/views/.
com.top_logic.layout.view.tiles.TileStackElement.Config.path = Path
com.top_logic.layout.view.tiles.TileStackElement.Config.path.tooltip = Reference to the channel holding the List<TileFrame> path. <p> The channel must be declared in an enclosing view. The breadcrumb and any URL persistence use the same channel as their source of truth. </p>
com.top_logic.layout.view.tiles.TileStackElement.tooltip = UIElement that renders a stack of drilled-down views. <p> The stack maintains a path of <i>tile frames</i> in the channel referenced by <i>Path</i>. The path is the single source of truth: both push (from a &lt;navigate-push&gt; via the installed <i>tile stack scope</i>) and pop (e.g. from a &lt;tile-breadcrumb&gt; writing a shorter prefix to the channel) work by mutating the channel value. </p> <p> The frame at the end of the path is the one displayed; when the path is empty, that is the initial view. The frames it covers stay as the user left them, so navigating back to one displays it again instead of building it anew. Each frame gets its own isolated channel namespace and a <i>tile stack scope</i> reachable for descendants so that nested commands can push further frames without explicit configuration. Under the name bind-path-to, a frame additionally sees the path it sits on. </p> <p> The drill-down path is part of the address of the page, for every frame view the stack declares a &lt;frame&gt; route for: the URL names the frames of the path one route each, and opening that URL again restores exactly those frames. </p> <p> Example: </p> <pre> &lt;view&gt; &lt;channels&gt;&lt;channel name="navPath"/&gt;&lt;/channels&gt; &lt;tile-stack path="navPath" initial="products/overview.view.xml"&gt; &lt;frame route="product/:product" view="products/detail.view.xml"&gt; &lt;param name="product" expr="p -&gt; objectId($p)" reverse="id -&gt; objectResolve(`my:Product`, $id)"/&gt; &lt;/frame&gt; &lt;/tile-stack&gt; &lt;/view&gt; </pre>
com.top_logic.layout.view.wizard.AdvanceStepArguments = Wizard step '{stepId}' ran out of time
com.top_logic.layout.view.wizard.AdvanceStepArguments.stepId = Step ID
com.top_logic.layout.view.wizard.AdvanceStepArguments.stepId.tooltip = The client-side identifier of the step the timer was started for, as the wizard published it in its step list.
com.top_logic.layout.view.wizard.AdvanceStepArguments.tooltip = Typed arguments of the <code>"advanceStep"</code> command: the step whose own time is up. <p> The step is named rather than assumed, because the user may have moved on themselves while the timer ran: the wizard moves only while the step the timer belongs to is still the one displayed. </p>
com.top_logic.layout.view.wizard.DynamicStepsSource = Dynamic steps source
com.top_logic.layout.view.wizard.DynamicStepsSource.Config.auto-advance = Auto advance
com.top_logic.layout.view.wizard.DynamicStepsSource.Config.auto-advance.tooltip = TL-Script function saying how long a step is displayed before the wizard moves on by itself: element -> millis. <p> An element the function answers nothing for is a step the user leaves; without a function that is every step. </p> <p> The time runs while the flow leads through the step. A step the user came back to waits for them, whatever the function answers for its element. </p>
com.top_logic.layout.view.wizard.DynamicStepsSource.Config.content = Content
com.top_logic.layout.view.wizard.DynamicStepsSource.Config.content.tooltip = The content displayed while one of these steps is the current one, with that step's element published on the element channel.
com.top_logic.layout.view.wizard.DynamicStepsSource.Config.element-channel = Element channel
com.top_logic.layout.view.wizard.DynamicStepsSource.Config.element-channel.tooltip = Name of the channel publishing the element of a step to the content template.
com.top_logic.layout.view.wizard.DynamicStepsSource.Config.icon = Icon
com.top_logic.layout.view.wizard.DynamicStepsSource.Config.icon.tooltip = TL-Script function choosing the icon shown beside the label: element -> "css:fa-solid fa-user". <p> Without one, the steps carry no icon. </p>
com.top_logic.layout.view.wizard.DynamicStepsSource.Config.label = Label
com.top_logic.layout.view.wizard.DynamicStepsSource.Config.label.tooltip = TL-Script function naming a step in the step indicator: element -> text. <p> Without one, the element is named as it is named everywhere else in the application. </p>
com.top_logic.layout.view.wizard.DynamicStepsSource.Config.steps = Steps
com.top_logic.layout.view.wizard.DynamicStepsSource.Config.steps.tooltip = Reference to the channel holding the elements, one step each, in the order of the list. <p> A channel holding nothing contributes no step at all; a channel holding a single object that is no list contributes one. </p>
com.top_logic.layout.view.wizard.DynamicStepsSource.tooltip = One step of a &lt;wizard&gt; per element of a list a channel holds. <p> The step sequence follows that channel: appending an element adds a step behind the ones already there, removing one takes its step away, and the wizard is re-expanded in the same breath - so a command that appends an element and then moves on lands on the step it just created. </p> <p> The element itself is the key of its step, which is what the wizard's step channel holds while that step is displayed. The content is a template instantiated per displayed step, with the element published on the element channel - typically a &lt;switch&gt; choosing the display by the kind of element. </p> <p> Sources are mixable, so a flow can open with a written-out &lt;step&gt;, continue over as many elements as the channel holds, and close with another written-out step. </p> <p> Example: </p> <pre> &lt;wizard current-step="currentStep"&gt; &lt;step id="welcome" label="wizard.welcome"&gt;...&lt;/step&gt; &lt;dynamic-steps steps="questions" label="q -&gt; $q.get(`demo:Question#title`)" &gt; &lt;switch input="element"&gt;...&lt;/switch&gt; &lt;/dynamic-steps&gt; &lt;step id="summary" label="wizard.summary"&gt;...&lt;/step&gt; &lt;/wizard&gt; </pre>
com.top_logic.layout.view.wizard.GotoStepArguments = Go to wizard step '{stepId}'
com.top_logic.layout.view.wizard.GotoStepArguments.stepId = Step ID
com.top_logic.layout.view.wizard.GotoStepArguments.stepId.tooltip = The client-side identifier of the step to display, as the wizard published it in its step list.
com.top_logic.layout.view.wizard.GotoStepArguments.tooltip = Typed arguments of the <code>"gotoStep"</code> command: which step to display. <p> The <i>label</i> doubles as the <i>configuration label provider</i> template that renders a recorded step for humans. </p>
com.top_logic.layout.view.wizard.StaticStepSource = Static step source
com.top_logic.layout.view.wizard.StaticStepSource.Config.auto-advance = Auto advance
com.top_logic.layout.view.wizard.StaticStepSource.Config.auto-advance.tooltip = How long this step is displayed before the wizard moves on by itself, written as a duration (2s, 500ms). <p> For an interstitial the user only watches. Empty for a step the user leaves. </p> <p> The time runs while the flow leads through the step. A step the user came back to waits for them, so a Back out of the step behind an interstitial is not answered by being sent forward again. </p>
com.top_logic.layout.view.wizard.StaticStepSource.Config.children = Children
com.top_logic.layout.view.wizard.StaticStepSource.Config.children.tooltip = The content displayed while this step is the current one.
com.top_logic.layout.view.wizard.StaticStepSource.Config.icon = Icon
com.top_logic.layout.view.wizard.StaticStepSource.Config.icon.tooltip = The icon shown beside the label in the step indicator (e.g. "css:fa-solid fa-user"), or empty for a step without one.
com.top_logic.layout.view.wizard.StaticStepSource.Config.id = ID
com.top_logic.layout.view.wizard.StaticStepSource.Config.id.tooltip = Identifies this step within its wizard. <p> The wizard's step channel holds this value while the step is displayed, and a jump to the step names it. </p>
com.top_logic.layout.view.wizard.StaticStepSource.Config.label = Label
com.top_logic.layout.view.wizard.StaticStepSource.Config.label.tooltip = Name of the step in the step indicator.
com.top_logic.layout.view.wizard.StaticStepSource.tooltip = A single step of a &lt;wizard&gt;, written out in the view. <p> The step is identified by its id: that is the value the wizard's step channel holds while the step is displayed, and the value a &lt;wizard-goto&gt; names to jump to it. </p> <p> Example: </p> <pre> &lt;wizard current-step="currentStep"&gt; &lt;step id="contact" label="wizard.contact" icon="css:fa-solid fa-user"&gt; &lt;form input="order"&gt;...&lt;/form&gt; &lt;/step&gt; &lt;step id="summary" label="wizard.summary"&gt;...&lt;/step&gt; &lt;/wizard&gt; </pre>
com.top_logic.layout.view.wizard.WizardBackAction = Wizard back action
com.top_logic.layout.view.wizard.WizardBackAction.tooltip = <i>View action</i> that moves the enclosing wizard to the preceding step. <p> On the first step, nothing happens. Pair the action with a &lt;wizard-has-back&gt; rule to hide the button on that step instead of offering one that does nothing. </p> <p> Passes the input through as output, so an action following it in the chain still sees the object the chain works on - which is what makes "discard what was entered, then step back" one command. </p>
com.top_logic.layout.view.wizard.WizardBackCommand = Wizard back command
com.top_logic.layout.view.wizard.WizardBackCommand.tooltip = <i>View command</i> that moves the enclosing wizard to the preceding step. <p> Resolves the wizard from the <i>view context</i>, so the command works wherever it sits inside a step. Guard it with a &lt;wizard-has-back&gt; rule so that the button disappears on the first step. To step back as one step of a longer command, use the action of the same tag inside a &lt;generic-command&gt;. </p>
com.top_logic.layout.view.wizard.WizardElement = Wizard element
com.top_logic.layout.view.wizard.WizardElement.Config.counter = Counter
com.top_logic.layout.view.wizard.WizardElement.Config.counter.tooltip = Whether the indicator counts the step displayed against the number of steps.
com.top_logic.layout.view.wizard.WizardElement.Config.current-step = Current step
com.top_logic.layout.view.wizard.WizardElement.Config.current-step.tooltip = Reference to the channel holding the key of the step displayed. <p> The channel must be declared in an enclosing view. A value no step carries, null included, displays the first step. </p>
com.top_logic.layout.view.wizard.WizardElement.Config.progress = Progress
com.top_logic.layout.view.wizard.WizardElement.Config.progress.tooltip = Whether the indicator shows how far through the wizard the step displayed is, as a bar.
com.top_logic.layout.view.wizard.WizardElement.Config.step-list = Step list
com.top_logic.layout.view.wizard.WizardElement.Config.step-list.tooltip = Whether the indicator lists the steps by name, marking each one as done, current or still ahead. <p> A step already done is offered for a jump back to it; a step still ahead is not, because the way there leads through the steps in between. </p>
com.top_logic.layout.view.wizard.WizardElement.Config.steps = Steps
com.top_logic.layout.view.wizard.WizardElement.Config.steps.tooltip = The sources contributing the steps, in the order the wizard walks them.
com.top_logic.layout.view.wizard.WizardElement.tooltip = UIElement that leads through a sequence of steps, displaying one of them at a time. <p> The key of the step displayed lives in the channel referenced by <i>Current step</i>, and that channel is the single source of truth: moving through the wizard is a write to it, whether the move comes from a &lt;wizard-next&gt;, a &lt;wizard-back&gt;, a &lt;wizard-goto&gt; or from the step indicator. A value no step carries, null included, displays the first step, so a wizard starts at its beginning without anyone writing the channel first. Binding the channel to the address of the page through <param-bindings> makes a step a deep link. </p> <p> The step sequence is the concatenation of what the wizard's sources contribute; a &lt;step&gt; contributes exactly the one step it is written as, a &lt;dynamic-steps&gt; one per element of a list a channel holds, and the two mix in one wizard. The sequence is expanded anew whenever a channel a source decides by takes a new value. The content of the step displayed is built when the step is reached and disposed when it is left, so a step leaves nothing behind in the enclosing scope - a form's Save button included. </p> <p> The wizard displays the step indicator and the content of the step, and no navigation buttons of its own: what moves through the wizard is composed in the view from the commands above, inside a step or raised out of it through a <slot-content>. Every step's content sees a <i>wizard scope</i>, so those commands need no configuration to find the wizard they move. </p> <p> Example: </p> <pre> &lt;view&gt; &lt;channels&gt;&lt;channel name="currentStep"/&gt;&lt;/channels&gt; &lt;wizard current-step="currentStep" step-list="true"&gt; &lt;step id="contact" label="wizard.contact"&gt;...&lt;/step&gt; &lt;step id="payment" label="wizard.payment"&gt;...&lt;/step&gt; &lt;step id="summary" label="wizard.summary"&gt;...&lt;/step&gt; &lt;/wizard&gt; &lt;/view&gt; </pre>
com.top_logic.layout.view.wizard.WizardGotoAction = Wizard goto action
com.top_logic.layout.view.wizard.WizardGotoAction.Config.step = Step
com.top_logic.layout.view.wizard.WizardGotoAction.Config.step.tooltip = The id of the step to display. <p> Without one, the value the chain carries names the step, which is how a step computed beforehand is jumped to. </p>
com.top_logic.layout.view.wizard.WizardGotoAction.tooltip = <i>View action</i> that displays a named step of the enclosing wizard. <p> The step is the one <i>Step</i> names, or - where the configuration names none - the value the chain carries, so that a jump target computed by an earlier action is followed. A key no step of the wizard carries leaves the wizard where it is. </p> <p> Passes the input through as output, so an action following it in the chain still sees the object the chain works on. </p>
com.top_logic.layout.view.wizard.WizardGotoCommand = Wizard goto command
com.top_logic.layout.view.wizard.WizardGotoCommand.Config.step = Step
com.top_logic.layout.view.wizard.WizardGotoCommand.Config.step.tooltip = The id of the step to display. <p> Without one, the command's input value names the step. </p>
com.top_logic.layout.view.wizard.WizardGotoCommand.tooltip = <i>View command</i> that displays a named step of the enclosing wizard. <p> Resolves the wizard from the <i>view context</i>, so the command works wherever it sits inside a step. The step is the one <i>Step</i> names, or - where the configuration names none - the command's input value. To jump as one step of a longer command, use the action of the same tag inside a &lt;generic-command&gt;. </p>
com.top_logic.layout.view.wizard.WizardHasBack = Wizard has back
com.top_logic.layout.view.wizard.WizardHasBack.tooltip = <i>View executability rule</i> that shows a command only while a step precedes the one the enclosing wizard displays. <p> Guards the command that steps back, so that it is offered on every step but the first, where stepping back would do nothing. Outside a wizard the command stays hidden. </p>
com.top_logic.layout.view.wizard.WizardHasNext = Wizard has next
com.top_logic.layout.view.wizard.WizardHasNext.tooltip = <i>View executability rule</i> that shows a command only while a step follows the one the enclosing wizard displays. <p> Guards the command that moves on, so that it is offered on every step but the last, where moving on would do nothing. Outside a wizard the command stays hidden. </p>
com.top_logic.layout.view.wizard.WizardNextAction = Wizard next action
com.top_logic.layout.view.wizard.WizardNextAction.tooltip = <i>View action</i> that moves the enclosing wizard to the following step. <p> On the last step, nothing happens. Pair the action with a &lt;wizard-has-next&gt; rule to hide the button on that step instead of offering one that does nothing. </p> <p> Passes the input through as output, so an action following it in the chain still sees the object the chain works on - which is what makes "store what was entered, then move on" one command. </p>
com.top_logic.layout.view.wizard.WizardNextCommand = Wizard next command
com.top_logic.layout.view.wizard.WizardNextCommand.tooltip = <i>View command</i> that moves the enclosing wizard to the following step. <p> Resolves the wizard from the <i>view context</i>, so the command works wherever it sits inside a step. Guard it with a &lt;wizard-has-next&gt; rule so that the button disappears on the last step. To move on as one step of a longer command, use the action of the same tag inside a &lt;generic-command&gt;. </p>
