com.top_logic.xio.importer.handlers.UnknownElements.ERROR = Fehler
com.top_logic.xio.importer.handlers.UnknownElements.ERROR.tooltip = Der Tag-Name des Elements und seine Position im Dokument werden als Fehler gemeldet; das Element und sein Teilbaum werden übersprungen.
com.top_logic.xio.importer.handlers.UnknownElements.SKIP = Überspringen
com.top_logic.xio.importer.handlers.UnknownElements.SKIP.tooltip = Das Element und sein Teilbaum werden ohne Meldung übersprungen.
com.top_logic.xio.importer.handlers.UnknownElements.WARN = Warnung
com.top_logic.xio.importer.handlers.UnknownElements.WARN.tooltip = Der Tag-Name des Elements und seine Position im Dokument werden als Warnung gemeldet; das Element und sein Teilbaum werden übersprungen.
com.top_logic.xio.importer.handlers.UnknownElements.tooltip = Wie ein <i>Dispatching-Importer</i> ein Element behandelt, für das er keinen Handler hat. <p> In jedem Fall wird das Element zusammen mit seinem gesamten Teilbaum übersprungen. </p>
com.top_logic.xio.importer.handlers.UnlessKnown = Nur falls unbekannt
com.top_logic.xio.importer.handlers.UnlessKnown$UpdateConfig = Aktualisierung eines bekannten Objekts
com.top_logic.xio.importer.handlers.UnlessKnown$UpdateConfig.tooltip = Import eines Elements, dessen ID bereits bekannt ist, siehe <i>Aktualisierung</i> (<i>Nur falls unbekannt</i>). <p> Die Handler werden angewendet, wobei das bekannte Objekt an <code>"this"</code> und an die Variable gebunden ist. Es wird nichts erstellt und nichts verknüpft, es sei denn, die Handler tun dies ausdrücklich. Der Inhalt des Elements, der nicht von den Handlern verarbeitet wird, wird übersprungen. </p>
com.top_logic.xio.importer.handlers.UnlessKnown.Config.id-attribute = ID-Attribut
com.top_logic.xio.importer.handlers.UnlessKnown.Config.id-attribute.tooltip = Das XML-Attribut des aktuellen Elements, das die zu prüfende ID enthält. <p> Ein Element ohne dieses Attribut oder mit einem leeren Wert wird importiert. </p>
com.top_logic.xio.importer.handlers.UnlessKnown.Config.update = Aktualisierung
com.top_logic.xio.importer.handlers.UnlessKnown.Config.update.tooltip = Handler, die auf ein Element angewendet werden, dessen ID bereits bekannt ist. <p> Ohne diese Option wird ein Element mit bekannter ID mitsamt seinem gesamten Inhalt übersprungen. </p>
com.top_logic.xio.importer.handlers.UnlessKnown.UpdateConfig.arguments = Argumente
com.top_logic.xio.importer.handlers.UnlessKnown.UpdateConfig.arguments.tooltip = Namen der Variablen, deren Werte nach dem bekannten Objekt an die Bedingung übergeben werden.
com.top_logic.xio.importer.handlers.UnlessKnown.UpdateConfig.condition = Bedingung
com.top_logic.xio.importer.handlers.UnlessKnown.UpdateConfig.condition.tooltip = Bedingung (Funktion, die einen booleschen Wert zurückgibt), die entscheidet, ob das bekannte Objekt aktualisiert wird. <p> Die Funktion erhält das bekannte Objekt als erstes Argument, gefolgt von den Werten der Argumente. Wenn die Bedingung nicht erfüllt ist, wird das Element mit seinem gesamten Inhalt übersprungen. Ohne Bedingung wird das bekannte Objekt immer aktualisiert. </p>
com.top_logic.xio.importer.handlers.UnlessKnown.UpdateConfig.content = Inhalt
com.top_logic.xio.importer.handlers.UnlessKnown.UpdateConfig.content.tooltip = Die Handler, die im Kontext des bekannten Objekts auf das Element angewendet werden sollen.
com.top_logic.xio.importer.handlers.UnlessKnown.UpdateConfig.var = Variable
com.top_logic.xio.importer.handlers.UnlessKnown.UpdateConfig.var.tooltip = Expliziter Variablenname im Kontext für das bekannte Objekt. <p> Innere Handler können mit diesem Namen auf das bekannte Objekt verweisen. </p>
com.top_logic.xio.importer.handlers.UnlessKnown.tooltip = <i>Verschachtelter Import-Handler</i>, der das aktuelle Element nur dann importiert, wenn dessen ID noch nicht bekannt ist. <p> Das ID-Attribut des aktuellen Elements ist bekannt, wenn es auf ein Objekt aufgelöst wird, das zuvor importiert wurde oder das durch ein umgebendes <i>Vorhandene Objekte auflösen</i> gefunden wird. </p> <ul> <li>Ist die ID nicht bekannt, werden die enthaltenen <i>Handler</i> angewendet.</li> <li>Ist die ID bekannt und ist keine Aktualisierung konfiguriert, wird das Element mit seinem gesamten Inhalt übersprungen.</li> <li>Ist die ID bekannt und eine Aktualisierung konfiguriert, werden die entsprechenden Handler im Kontext des bekannten Objekts auf das Element angewendet, sofern deren Bedingung erfüllt ist. Andernfalls wird das Element mit seinem gesamten Inhalt übersprungen.</li> </ul>
com.top_logic.xio.importer.handlers.UnresolvedIdConfig = Behandlung unaufgelöster IDs
com.top_logic.xio.importer.handlers.UnresolvedIdConfig.ignore-unresolved = Unaufgelöste ignorieren
com.top_logic.xio.importer.handlers.UnresolvedIdConfig.ignore-unresolved.tooltip = Ob eine ID, die am Ende des Imports noch nicht aufgelöst ist, ignoriert wird, anstatt als Fehler gemeldet zu werden. <p> Bei einer ignorierten ID bleibt die Referenz leer. Alles, was auf das referenzierte Objekt angewendet wird (z. B. der verschachtelte Inhalt einer Objektreferenz), wird verworfen. Eine ID, die später in den Importdaten definiert wird, wird wie gewohnt aufgelöst. </p> <p> Wenn eine andere Referenz auf dieselbe ID diese nicht ignoriert, wird die nicht aufgelöste ID dennoch gemeldet. </p>
com.top_logic.xio.importer.handlers.UnresolvedIdConfig.tooltip = Konfiguration eines <i>Handlers</i>, der IDs auflöst: Wie eine ID behandelt wird, die nie aufgelöst wird.
com.top_logic.xio.importer.handlers.WithResult = ID-Zuweisung
com.top_logic.xio.importer.handlers.WithResult.tooltip = Weist einem referenzierten Objekt eine zusätzliche ID zu.
com.top_logic.xio.importer.handlers.WithVar = Mit Variable
com.top_logic.xio.importer.handlers.WithVar.Config.var = Variable
com.top_logic.xio.importer.handlers.WithVar.Config.var.tooltip = Der Name der Variablen, die gebunden werden soll.
com.top_logic.xio.importer.handlers.WithVar.Config.xml-attribute = XML-Attribut
com.top_logic.xio.importer.handlers.WithVar.Config.xml-attribute.tooltip = Das XML-Attribut des aktuellen Elements, dessen Wert an die <i>Variable</i> gebunden wird.
com.top_logic.xio.importer.handlers.WithVar.tooltip = <i>Verschachtelter Import-Handler</i>, der für seinen Inhalt eine Variable an den Wert eines XML-Attributs des aktuellen Elements bindet. <p> Hat das aktuelle Element das <i>XML-Attribut</i> nicht (oder ist es leer), wird der Inhalt mit unveränderter <i>Variable</i> angewendet: Die Bindung eines umgebenden Elements bleibt bestehen. </p>
