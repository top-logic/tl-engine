com.top_logic.basic.credential.BasicCredentials = Basic credentials
com.top_logic.basic.credential.BasicCredentials.Config.password = Password
com.top_logic.basic.credential.BasicCredentials.Config.password.tooltip = The password of the user.
com.top_logic.basic.credential.BasicCredentials.Config.user = User
com.top_logic.basic.credential.BasicCredentials.Config.user.tooltip = The user name.
com.top_logic.basic.credential.BasicCredentials.tooltip = <i>Credential provider</i> sending a user name and password with HTTP basic authentication (RFC 7617). <p> The request gets the header <code>Authorization: Basic &lt;base64(user:password)&gt;</code>, encoded in UTF-8. The password is read from its <i>secret source</i> for each request. </p> <pre> &lt;credentials class="com.top_logic.basic.credential.BasicCredentials" user="service-user"&gt; &lt;password class="com.top_logic.basic.credential.FileSecretSource" path="/run/secrets/service-password"/&gt; &lt;/credentials&gt; </pre>
com.top_logic.basic.credential.EnvironmentSecretSource = Environment secret source
com.top_logic.basic.credential.EnvironmentSecretSource.Config.name = Name
com.top_logic.basic.credential.EnvironmentSecretSource.Config.name.tooltip = Name of the system property or environment variable holding the secret.
com.top_logic.basic.credential.EnvironmentSecretSource.tooltip = <i>Secret source</i> reading the secret from a system property or an environment variable. <p> The variable is looked up each time the secret is used, in the same order as the <code>env</code> aliases of the configuration: a JNDI value of the application context first, then a system property, then an environment variable. </p> <p> It is the default <i>secret source</i>: an element without <code>class</code> attribute names the variable: </p> <pre> &lt;api-key name="MY_API_KEY"/&gt; </pre>
com.top_logic.basic.credential.FileSecretSource = File secret source
com.top_logic.basic.credential.FileSecretSource.Config.path = Path
com.top_logic.basic.credential.FileSecretSource.Config.path.tooltip = Absolute path of the file containing the secret. <p> Like any configuration value, the path may contain aliases, e.g. <code>%SECRETS_DIR%/my-api-key</code>. An alias takes its value from an environment variable in its definition in the application configuration: <code>&lt;entry name="%SECRETS_DIR%" value="${env:SECRETS_DIR}"/&gt;</code>. </p>
com.top_logic.basic.credential.FileSecretSource.tooltip = <i>Secret source</i> reading the secret from a file, e.g. a Kubernetes or Docker secret mounted under <code>/run/secrets</code>. <pre> &lt;api-key class="com.top_logic.basic.credential.FileSecretSource" path="/run/secrets/my-api-key"/&gt; </pre> <p> The file is read as UTF-8 text. Leading and trailing white space, including the line break that tools like <code>echo</code> or an editor append, is not part of the secret. API keys, tokens and generated passwords never start or end with white space, while a stray line break in a secret file is a frequent cause of failing authentication. </p> <p> The content is cached and read again when the file has been replaced. The file is identified by its attributes (file key, last-modified time and size), read through symbolic links. Kubernetes updates a mounted secret by writing the new content to a fresh directory and swapping the <code>..data</code> symbolic link to it: the configured path then resolves to a different file with a different file key (inode) and last-modified time, so the change is detected with a single <code>stat</code> per use instead of reading the content each time. </p>
com.top_logic.basic.credential.HeaderCredentials = Header credentials
com.top_logic.basic.credential.HeaderCredentials.Config.header = Header
com.top_logic.basic.credential.HeaderCredentials.Config.header.tooltip = Name of the request header carrying the secret.
com.top_logic.basic.credential.HeaderCredentials.Config.scheme = Scheme
com.top_logic.basic.credential.HeaderCredentials.Config.scheme.tooltip = Authentication scheme written before the secret, e.g. <code>Bearer</code>. <p> If empty, the header value is the bare secret. </p>
com.top_logic.basic.credential.HeaderCredentials.Config.secret = Secret
com.top_logic.basic.credential.HeaderCredentials.Config.secret.tooltip = The secret sent in the header.
com.top_logic.basic.credential.HeaderCredentials.tooltip = <i>Credential provider</i> sending a static secret (API key, token) in a request header. <p> The header value is the secret, preceded by the configured scheme and a space, if a scheme is given. The secret is read from its <i>secret source</i> for each request. </p> <p> A bearer token from a mounted secret file (<code>Authorization: Bearer &lt;secret&gt;</code>): </p> <pre> &lt;credentials class="com.top_logic.basic.credential.HeaderCredentials" scheme="Bearer"&gt; &lt;secret class="com.top_logic.basic.credential.FileSecretSource" path="/run/secrets/openai-api-key"/&gt; &lt;/credentials&gt; </pre> <p> The same with the token from an environment variable, named by a secret element without <code>class</code> attribute: </p> <pre> &lt;credentials class="com.top_logic.basic.credential.HeaderCredentials" scheme="Bearer"&gt; &lt;secret name="OPENAI_API_KEY"/&gt; &lt;/credentials&gt; </pre> <p> An API key in a service-specific header (<code>x-api-key: &lt;secret&gt;</code>) from an environment variable: </p> <pre> &lt;credentials class="com.top_logic.basic.credential.HeaderCredentials" header="x-api-key"&gt; &lt;secret name="ANTHROPIC_API_KEY"/&gt; &lt;/credentials&gt; </pre> <p> Other examples are <code>scheme="DeepL-Auth-Key"</code>, <code>header="X-Subscription-Token"</code> and <code>header="api-key"</code>. </p>
com.top_logic.basic.credential.LiteralSecretSource = Literal secret source
com.top_logic.basic.credential.LiteralSecretSource.Config.value = Value
com.top_logic.basic.credential.LiteralSecretSource.Config.value.tooltip = The secret.
com.top_logic.basic.credential.LiteralSecretSource.tooltip = <i>Secret source</i> delivering a secret stored in the configuration itself. <p> The secret is an <i>encrypted</i> configuration value: it is written encrypted and accepts a plain value with the prefix <code>unencrypted:</code>. A property using the <i>secret source format</i> accepts this source as plain attribute: </p> <pre> &lt;my-service api-key="unencrypted:my-secret-key"/&gt; </pre> <p> A secret from the environment is referenced by an <i>environment secret source</i> instead, an element without <code>class</code> attribute: the configuration then holds the name of the variable, not the secret. </p> <pre> &lt;my-service&gt; &lt;api-key name="MY_API_KEY"/&gt; &lt;/my-service&gt; </pre>
com.top_logic.basic.credential.NoCredentials = No credentials
com.top_logic.basic.credential.NoCredentials.tooltip = <i>Credential provider</i> sending requests without credentials. <p> Used when the requests go through a gateway or proxy that adds the credentials of the external service, or when the service does not require authentication. </p> <pre> &lt;credentials class="com.top_logic.basic.credential.NoCredentials"/&gt; </pre>
com.top_logic.basic.credential.oauth.ClientAssertionAuthentication = Client assertion authentication
com.top_logic.basic.credential.oauth.ClientAssertionAuthentication.Config.assertion = Assertion
com.top_logic.basic.credential.oauth.ClientAssertionAuthentication.Config.assertion-type = Assertion type
com.top_logic.basic.credential.oauth.ClientAssertionAuthentication.Config.assertion-type.tooltip = The format of the assertion.
com.top_logic.basic.credential.oauth.ClientAssertionAuthentication.Config.assertion.tooltip = The assertion identifying the client, typically a file with a token issued by the platform.
com.top_logic.basic.credential.oauth.ClientAssertionAuthentication.tooltip = <i>Client authentication</i> with an assertion issued by a third party (RFC 7521 §4.2). <p> This is workload identity: the platform running the application issues a short-lived token identifying it, and the authorization server trusts that token issuer for the client. The application owns no secret. A Kubernetes pod gets such a token as projected service account token, refreshed by the kubelet in a file; with a <i>file secret source</i> the current content is sent with each token request: </p> <pre> &lt;client-authentication class="com.top_logic.basic.credential.oauth.ClientAssertionAuthentication"&gt; &lt;assertion class="com.top_logic.basic.credential.FileSecretSource" path="/var/run/secrets/tokens/keycloak"/&gt; &lt;/client-authentication&gt; </pre> <p> In Azure AKS with workload identity, the token file is named by the environment variable <code>AZURE_FEDERATED_TOKEN_FILE</code>, referenced through an alias (<code>path="%AZURE_FEDERATED_TOKEN_FILE%"</code>) defined in the application configuration as <code>&lt;entry name="%AZURE_FEDERATED_TOKEN_FILE%" value="${env:AZURE_FEDERATED_TOKEN_FILE}"/&gt;</code>. </p>
com.top_logic.basic.credential.oauth.ClientCredentialsProvider = Client credentials provider
com.top_logic.basic.credential.oauth.ClientCredentialsProvider.tooltip = <i>Credential provider</i> authenticating requests with an access token obtained by the OAuth 2.0 client credentials grant (RFC 6749 §4.4). <p> The application authenticates itself as client at an authorization server and receives a short-lived access token, which is sent as bearer token. The token is cached and renewed before it expires (see <i>token cache</i>). A typical setup lets the application call a central API gateway with such a token, while the gateway holds the keys of the external services. </p> <p> Workload identity in Kubernetes: the client authenticates with the projected service account token of its pod, so the application owns no secret at all. The authorization server (here a Keycloak realm) trusts the cluster's token issuer for this client: </p> <pre> &lt;credentials class="com.top_logic.basic.credential.oauth.ClientCredentialsProvider" issuer="https://login.example.com/realms/my-realm" client-id="my-app" &gt; &lt;client-authentication class="com.top_logic.basic.credential.oauth.ClientAssertionAuthentication"&gt; &lt;assertion class="com.top_logic.basic.credential.FileSecretSource" path="/var/run/secrets/tokens/keycloak"/&gt; &lt;/client-authentication&gt; &lt;/credentials&gt; </pre> <p> Azure AKS workload identity is the same setup against <code>token-url="https://login.microsoftonline.com/&lt;tenant&gt;/oauth2/v2.0/token"</code> with <code>scope="&lt;resource&gt;/.default"</code>, the assertion read from the file named by the environment variable <code>AZURE_FEDERATED_TOKEN_FILE</code> through an alias (<code>path="%AZURE_FEDERATED_TOKEN_FILE%"</code>, defined as <code>&lt;entry name="%AZURE_FEDERATED_TOKEN_FILE%" value="${env:AZURE_FEDERATED_TOKEN_FILE}"/&gt;</code>). </p> <p> Authentication with a private key (<code>private_key_jwt</code>), whose public key is registered for the client: </p> <pre> &lt;credentials class="com.top_logic.basic.credential.oauth.ClientCredentialsProvider" issuer="https://login.example.com/realms/my-realm" client-id="my-app" &gt; &lt;client-authentication class="com.top_logic.basic.credential.oauth.PrivateKeyJwtAuthentication" algorithm="ES256" key-id="my-app-2026" &gt; &lt;private-key class="com.top_logic.basic.credential.FileSecretSource" path="/run/secrets/my-app-key.pem"/&gt; &lt;/client-authentication&gt; &lt;/credentials&gt; </pre> <p> Authentication with a client secret, requesting a token for a specific audience: </p> <pre> &lt;credentials class="com.top_logic.basic.credential.oauth.ClientCredentialsProvider" token-url="https://login.example.com/realms/my-realm/protocol/openid-connect/token" client-id="my-app" scope="llm" &gt; &lt;client-authentication class="com.top_logic.basic.credential.oauth.ClientSecretAuthentication" method="basic"&gt; &lt;secret name="MY_APP_CLIENT_SECRET"/&gt; &lt;/client-authentication&gt; &lt;parameters&gt; &lt;parameter name="audience" value="llm-gateway"/&gt; &lt;/parameters&gt; &lt;/credentials&gt; </pre>
com.top_logic.basic.credential.oauth.ClientSecretAuthentication = Client secret authentication
com.top_logic.basic.credential.oauth.ClientSecretAuthentication$Method = Method
com.top_logic.basic.credential.oauth.ClientSecretAuthentication$Method.tooltip = How the client secret is sent to the authorization server.
