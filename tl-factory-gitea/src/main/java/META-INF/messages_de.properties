com.top_logic.factory.gitea.GiteaHostingProvider.tooltip = <i>Git-Hosting-Anbieter</i> eines <a href="https://about.gitea.com/">Gitea</a>-Servers. <p> Die Repositorys werden in der Organisation <i>Eigentümer</i> des Gitea unter der <i>Basis-URL</i> angelegt. Die Anfragen werden mit den konfigurierten Anmeldedaten authentifiziert; ohne diese mit dem Zugriffstoken aus dem Secret <code>"tl_factory_gitea_token"</code>, gesendet mit dem Schema <code>"token"</code>. </p> <h2>Das Zugriffstoken</h2> <p> Das Token benötigt die Scopes write:organization (Anlegen eines Repositorys in der Organisation) und write:repository (Lesen von Repositorys, Schützen von Branches). Sein Benutzer muss Repositorys in der Organisation anlegen und verwalten dürfen, z. B. als Mitglied ihres Teams <i>Owners</i>. </p> <h2>Branch-Schutz</h2> <p> Das Schützen eines Branches legt eine Branch-Schutzregel mit dem Namen des Branches an: Pushen dürfen alle Benutzer mit Schreibzugriff (enable_push, keine Push-Allowlist), Force-Push niemand (enable_force_push aus), die geschützten Dateimuster sind die übergebenen Muster, durch Semikolons verbunden (protected_file_patterns), ungeschützte Dateimuster gibt es keine. Gitea setzt dann durch: </p> <ul> <li>Ein geschützter Branch kann nicht gelöscht werden, und ein Push, der seine Historie umschreibt, wird abgelehnt, auch für Administratoren.</li> <li>Ein Push, der eine geschützte Datei ändert, wird abgelehnt, auch für Administratoren. Gitea vergleicht die Muster mit dem Pfad in Kleinbuchstaben; * passt weder auf / noch auf ., ** auf jede Zeichenfolge.</li> <li>Ein Pull-Request, der eine geschützte Datei ändert, kann nur von einem Benutzer gemergt werden, der den Branch-Schutz umgehen darf: einem Administrator des Repositorys (block_admin_merge_override aus). Ein solcher Merge übergeht die erforderlichen Freigaben; allen anderen Benutzern meldet Giteas Prüfung des Pull-Requests die geänderten geschützten Dateien.</li> <li>Jeder andere Pull-Request benötigt <i>Erforderliche Freigaben</i> Freigaben und kein ablehnendes Review (block_on_rejected_reviews); ein neuer Commit verwirft die Freigaben (dismiss_stale_approvals).</li> </ul> <p> Eine Regel, die der Branch bereits hat, wird durch diese Einstellungen ersetzt. Ein Branch wird nach dem Push geschützt, der ihn anlegt: Gitea lehnt den Push ab, der einen Branch anlegt, dessen Regel geschützte Dateimuster hat („cannot find the start commit“), der erste Push in ein leeres Repository muss also vorher erfolgen. </p>
