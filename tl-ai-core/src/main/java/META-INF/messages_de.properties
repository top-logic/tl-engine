com.top_logic.tl.ai.core.scripting.AIScriptFunctions.callTool.tooltip = Ruft ein Tool manuell mit den angegebenen Parametern auf. <p> Diese Funktion ermï¿½glicht den direkten Aufruf von registrierten Werkzeugen aus TL-Script. Das Werkzeug wird durch seinen qualifizierten Namen im Format Fabrik-Name.Werkzeug-Name identifiziert. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat = Chat
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.param.messages.tooltip = Eine Liste von Nachrichten. Jede Nachricht kann sein: <ul> <li>Zeichenkette: Wird als Benutzertextnachricht behandelt</li> <li>Karte mit "Rolle" und "Inhalt": Explizite Rolle (System/Benutzer/Assistent). Der Inhalt kann eine Zeichenkette, binï¿½re Daten oder eine Liste mit gemischtem Inhalt sein.</li> <li>Binï¿½re Daten: Werden als Bild-/Dokumentennachricht des Benutzers behandelt</li> </ul>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.param.model.tooltip = Der zu verwendende Modellname oder null, um das in der <i>LLM-Anbieterregistrierung</i> konfigurierte Standardmodell zu verwenden.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.param.responseFormat.tooltip = Die Spezifikation des Antwortformats. Kann sein: <ul> <li>Null: Keine spezifische Formatanforderung</li> <li>Zeichenfolge "text" oder "json": Einfacher Formattyp</li> <li>Karte mit den Feldern "name" und "schema", die ein JSON-Schema fï¿½r eine strukturierte Ausgabe beschreiben.</li> </ul>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.param.tools.tooltip = Eine Sammlung qualifizierter Werkzeugnamen, die dem KI-Agenten zur Verfï¿½gung gestellt werden sollen (z. B. ["mytools.calculateSum", "texttools.formatText"]), oder null, um keine Werkzeuge bereitzustellen.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.return = Der Antworttext des Assistenten.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.chat.tooltip = Sendet eine Multiturn-Konversation an einen Chat-Abschlussanbieter. <p> Nachrichten kï¿½nnen Strings, Maps mit Rolle/Inhalt oder Listen sein. Der Inhalt kann aus Textstrings oder <i>binï¿½ren Daten</i> fï¿½r Bilder und Dokumente bestehen. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.models = Modelle
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.models.return = Eine unverï¿½nderliche Liste mit allen konfigurierten Modellnamen.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.models.tooltip = Gibt eine Liste aller verfï¿½gbaren Modellnamen aus der <i>LLM-Anbieterregistrierung</i> zurï¿½ck. <p> Die Modellnamen kï¿½nnen an die <i>Chat-Funktion</i> ï¿½bergeben werden, um das zu verwendende KI-Modell auszuwï¿½hlen. Die zurï¿½ckgegebene Liste sorgt fï¿½r eine konsistente Reihenfolge bei Aufrufen. </p>
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.toolInfo = Werkzeug-Infos
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.toolInfo.param.toolName.tooltip = Der qualifizierte Name des Werkzeugs.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.toolInfo.return = Eine Karte, die die Metadaten des Werkzeugs mit der oben beschriebenen Struktur enthï¿½lt, oder null, wenn das Werkzeug nicht gefunden wird.
com.top_logic.tl.ai.core.scripting.AIScriptFunctions.toolInfo.tooltip = Ruft detaillierte Informationen ï¿½ber ein registriertes Werkzeug ab. <p> Diese Funktion gibt Metadaten ï¿½ber ein Werkzeug zurï¿½ck, einschlieï¿½lich seines Namens, seiner Beschreibung und seines Parameterschemas. Das Werkzeug wird durch seinen qualifizierten Namen im Format Fabrik-Name.Werkzeug-Name identifiziert. </p> <p> Die zurï¿½ckgegebene Karte enthï¿½lt: </p> <ul> <li>name - Der Name des Werkzeugs</li> <li>qualifiedName - Der vollstï¿½ndig qualifizierte Name des Werkzeugs</li> <li>description - Eine Beschreibung der Funktion des Werkzeugs</li> <li>inputSchemaJson - Die JSON-Schemazeichenkette fï¿½r Werkzeugparameter</li> </ul>
