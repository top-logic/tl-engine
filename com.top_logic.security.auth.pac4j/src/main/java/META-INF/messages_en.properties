com.top_logic.security.auth.pac4j.config.ClientConfigurator.Config.user-name-extractor.tooltip = Strategy for extracting a local user name from the authentication result.
com.top_logic.security.auth.pac4j.config.ConfigurableUserNameExtractor = Configurable user name extractor
com.top_logic.security.auth.pac4j.config.ConfigurableUserNameExtractor.Config.user-name-attribute = User name attribute
com.top_logic.security.auth.pac4j.config.ConfigurableUserNameExtractor.Config.user-name-attribute.tooltip = Attribute name to retrieve from a <i>common profile</i> for using as local user name.
com.top_logic.security.auth.pac4j.config.ConfigurableUserNameExtractor.tooltip = Configurable <i>user name extractor</i>.
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator = Default oidc client configurator
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.client-authentication-method = Client authentication method
