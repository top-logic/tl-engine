com.top_logic.xio.importer.linkings.ListLinking.Config.name.tooltip = Die Mehrfachreferenz des Kontextobjekts, dem der Wert hinzugefügt werden soll.
com.top_logic.xio.importer.linkings.ListLinking.tooltip = <i>Objektverknüpfung</i>, die ein Objekt zu einer Mehrfachreferenz ihres Kontextes hinzufügt.
