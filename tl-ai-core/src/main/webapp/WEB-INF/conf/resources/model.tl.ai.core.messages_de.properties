model.tl.accounts.Person.aiPreferences = KI-Präferenzen
model.tl.accounts.Person.aiPreferences.tooltip = Was dieses Konto jedem Agenten über sich selbst mitteilt: wie der Benutzer angesprochen werden soll, wie lang eine Antwort sein soll, welche Sprache zu bevorzugen ist, wenn mehrere in Frage kämen. Der Text wird mit jeder Anfrage dieses Kontos gesendet, im Umgebungsblock des System-Prompts, unterhalb dessen, was die Anwendung selbst angibt - und bei Widerspruch gilt die Anwendung.
model.tl.ai.core = TL-AI-Core
model.tl.ai.core.Agent = KI-Agent
model.tl.ai.core.Agent.contextWindow = Kontext-Fenster
model.tl.ai.core.Agent.contextWindow.tooltip = Maximale Anzahl an Tokens, die das Modell in einer einzelnen Konversation verarbeiten kann, einschließlich Ein- und Ausgabe. Überschreibt die Standard-Kontextgröße des Modells.
model.tl.ai.core.Agent.delegations = Delegationen
model.tl.ai.core.Agent.delegations.tooltip = Andere Agenten, an die dieser Agent Aufgaben weitergeben kann. Der Agent entscheidet anhand der Beschreibung des Sub-Agenten, wann er delegiert.
model.tl.ai.core.Agent.description = Beschreibung
model.tl.ai.core.Agent.description.tooltip = Eine kurze Zusammenfassung der Aufgabe dieses Agenten. Wird anderen Agenten angezeigt, wenn diese entscheiden, an wen sie delegieren.
model.tl.ai.core.Agent.displayName = Anzeigename
model.tl.ai.core.Agent.displayName.tooltip = Wie dieser Agent gegenüber dem Benutzer heißt. Bleibt das Feld leer, wird der Name oben verwendet; der ist der Bezeichner und wird an anderer Stelle referenziert.
model.tl.ai.core.Agent.entryPoint = Einstiegspunkt
model.tl.ai.core.Agent.entryPoint.tooltip = Wenn aktiviert, steht dieser Agent als Startpunkt für neue Konversationen zur Verfügung. Agenten ohne diese Option sind nur über Delegation erreichbar.
model.tl.ai.core.Agent.infrastructure = Infrastruktur-Agent
model.tl.ai.core.Agent.infrastructure.tooltip = Die Anwendung führt diesen Agenten für den Benutzer aus, statt ihn mit dem Benutzer sprechen zu lassen - die Prompt-Verbesserung ist ein solcher Agent. Ein solcher Agent wird in keinem Menü angeboten und wird überall dort abgelehnt, wo ein Lauf des Benutzers ihn benennt - unabhängig davon, was die Agenten-Zugriffsrichtlinie erlaubt.
model.tl.ai.core.Agent.maxRetries = Max. Wiederholungen
model.tl.ai.core.Agent.maxRetries.tooltip = Maximale Anzahl an Wiederholungsversuchen nach einem Fehler, bevor der Agent aufgibt.
model.tl.ai.core.Agent.maxTokens = Max. Tokens
model.tl.ai.core.Agent.maxTokens.tooltip = Obergrenze für die Anzahl an Tokens, die das Modell in einer einzelnen Antwort erzeugen darf.
model.tl.ai.core.Agent.maxToolResultChars = Max. Tool-Ergebnislänge
model.tl.ai.core.Agent.maxToolResultChars.tooltip = Maximale Zeichenanzahl, die ein einzelner Tool-Aufruf zurückgeben darf. Längere Ergebnisse werden abgeschnitten.
model.tl.ai.core.Agent.maxTurns = Max. Durchläufe
model.tl.ai.core.Agent.maxTurns.tooltip = Maximale Anzahl an Iterationen der Agentenschleife, bevor der Lauf beendet wird. Jeder Durchlauf besteht aus einer Modellantwort und deren Tool-Aufrufen. Verhindert unkontrollierte Agenten.
model.tl.ai.core.Agent.mcpServers = MCP-Server
model.tl.ai.core.Agent.mcpServers.tooltip = Namen der MCP-Server, die dieser Agent für Tool-Aufrufe verwenden darf.
model.tl.ai.core.Agent.model = Modell
model.tl.ai.core.Agent.model.tooltip = Das von diesem Agenten verwendete Sprachmodell (z.B. Claude, GPT). Wenn leer, wird der Systemstandard verwendet.
model.tl.ai.core.Agent.name = Name
model.tl.ai.core.Agent.name.tooltip = Der eindeutige Name zur Identifikation dieses Agenten.
model.tl.ai.core.Agent.reasoningEffort = Reasoning-Aufwand
model.tl.ai.core.Agent.reasoningEffort.tooltip = Steuert, wie viel Reasoning-Aufwand das Modell für eine Anfrage aufwendet (nur OpenAI- und xAI-Modelle). Höhere Werte verbessern die Genauigkeit bei komplexen Aufgaben, erhöhen aber Latenz und Kosten.
model.tl.ai.core.Agent.reasoningSummary = Reasoning-Zusammenfassung
model.tl.ai.core.Agent.reasoningSummary.tooltip = Steuert, ob das Modell eine Zusammenfassung seines internen Reasonings zurückgibt (nur OpenAI-Modelle). „Automatisch" lässt das Modell entscheiden, „Detailliert" liefert immer eine vollständige Zusammenfassung.
model.tl.ai.core.Agent.skills = Skills
model.tl.ai.core.Agent.skills.tooltip = Wiederverwendbare Anweisungen, die diesem Agenten zugewiesen sind. Skills liefern Fachwissen oder Verhaltensrichtlinien für bestimmte Aufgaben.
model.tl.ai.core.Agent.summary = Kurzbeschreibung
model.tl.ai.core.Agent.summary.tooltip = Eine Zeile, die sagt, wofür dieser Agent da ist; sie wird dem Benutzer bei der Auswahl angezeigt. Bleibt sie leer, wird der Agent nur mit seinem Namen angeboten.
model.tl.ai.core.Agent.systemPrompt = System-Prompt
model.tl.ai.core.Agent.systemPrompt.tooltip = Anweisungen, die das Verhalten, die Rolle und den Antwortstil des Agenten festlegen. Werden dem Sprachmodell zu Beginn jeder Konversation mitgegeben.
model.tl.ai.core.Agent.temperature = Temperatur
model.tl.ai.core.Agent.temperature.tooltip = Steuert, wie kreativ oder zufällig die Antworten des Modells ausfallen. Niedrige Werte (z.B. 0.0) erzeugen vorhersagbarere Ausgaben, höhere Werte (z.B. 1.0) abwechslungsreichere.
model.tl.ai.core.Agent.thinkingEffort = Thinking-Aufwand
model.tl.ai.core.Agent.thinkingEffort.tooltip = Steuert, wie viel internes Reasoning das Modell vor der Antwort durchführt (nur Anthropic-Modelle). Höhere Werte erzeugen gründlichere Analysen, erhöhen aber Latenz und Token-Verbrauch.
model.tl.ai.core.Agent.timeoutSeconds = Timeout (s)
model.tl.ai.core.Agent.timeoutSeconds.tooltip = Maximale Laufzeit in Sekunden, bevor die Anfrage abgebrochen wird.
model.tl.ai.core.Agent.toolChoice = Tool-Auswahl
model.tl.ai.core.Agent.toolChoice.tooltip = Steuert, wie das Modell Tools auswählt. „Automatisch" lässt das Modell frei entscheiden, „Erforderlich" erzwingt mindestens einen Tool-Aufruf pro Durchlauf, „Keine" deaktiviert die Tool-Nutzung vollständig.
model.tl.ai.core.Agent.tools = Tools
model.tl.ai.core.Agent.tools.tooltip = Die Tools, die dieser Agent verwenden darf (z.B. Suche, Datenbankabfragen). Nur ausgewählte Tools stehen bei der Ausführung zur Verfügung.
model.tl.ai.core.Agent.tooltip = Ein KI-Agent, der Benutzeranfragen mithilfe eines Sprachmodells, Tools und Skills verarbeitet.
model.tl.ai.core.Agent.topK = Top-K
model.tl.ai.core.Agent.topK.tooltip = Begrenzt die Wortwahl des Modells auf die K wahrscheinlichsten nächsten Tokens pro Schritt (nur Anthropic-Modelle). Niedrigere Werte erzeugen fokussiertere Ausgaben, höhere Werte erlauben mehr Vielfalt.
model.tl.ai.core.Agent.topP = Top-P
model.tl.ai.core.Agent.topP.tooltip = Begrenzt die Wortwahl des Modells auf die wahrscheinlichsten Optionen, deren kumulierte Wahrscheinlichkeit diesen Schwellenwert erreicht. Niedrigere Werte erzeugen fokussiertere Ausgaben.
model.tl.ai.core.ReasoningEffort = Reasoning-Aufwand
model.tl.ai.core.ReasoningEffort.HIGH = Hoch
model.tl.ai.core.ReasoningEffort.HIGH.tooltip = Maximales Reasoning. Beste Genauigkeit für komplexe Aufgaben.
model.tl.ai.core.ReasoningEffort.LOW = Niedrig
model.tl.ai.core.ReasoningEffort.LOW.tooltip = Minimales Reasoning. Schnellste Antworten, geeignet für einfache Aufgaben.
model.tl.ai.core.ReasoningEffort.MEDIUM = Mittel
model.tl.ai.core.ReasoningEffort.MEDIUM.tooltip = Moderates Reasoning. Gute Balance für die meisten Aufgaben.
model.tl.ai.core.ReasoningEffort.tooltip = Die Stufe des Reasoning-Aufwands für OpenAI- und xAI-Modelle.
model.tl.ai.core.ReasoningSummary = Reasoning-Zusammenfassung
model.tl.ai.core.ReasoningSummary.AUTO = Automatisch
model.tl.ai.core.ReasoningSummary.AUTO.tooltip = Das Modell entscheidet, ob eine Reasoning-Zusammenfassung beigefügt wird.
model.tl.ai.core.ReasoningSummary.DETAILED = Detailliert
model.tl.ai.core.ReasoningSummary.DETAILED.tooltip = Immer eine detaillierte Zusammenfassung des Reasonings des Modells beifügen.
model.tl.ai.core.ReasoningSummary.tooltip = Steuert, ob das interne Reasoning des Modells in der Antwort zusammengefasst wird.
model.tl.ai.core.Skill = Skill
model.tl.ai.core.Skill.agents = Agenten
model.tl.ai.core.Skill.agents.tooltip = Die Agenten, denen dieser Skill zugewiesen ist.
model.tl.ai.core.Skill.content = Inhalt
model.tl.ai.core.Skill.content.tooltip = Der vollständige Anweisungstext des Skills. Wird in den Kontext des Agenten eingefügt, wenn der Skill aktiviert wird.
model.tl.ai.core.Skill.description = Beschreibung
model.tl.ai.core.Skill.description.tooltip = Eine kurze Zusammenfassung dessen, was dieser Skill bereitstellt. Hilft dem Agenten zu entscheiden, wann er ihn einsetzt.
model.tl.ai.core.Skill.name = Name
model.tl.ai.core.Skill.name.tooltip = Der eindeutige Name dieses Skills.
model.tl.ai.core.Skill.tools = Tools
model.tl.ai.core.Skill.tools.tooltip = Die Tools, die dieser Skill mitbringt. Sie kommen zu den eigenen Tools des Agenten hinzu, solange der Skill aktiv ist.
model.tl.ai.core.Skill.tooltip = Eine wiederverwendbare Anweisung, die Agenten zugewiesen werden kann, um ihr Verhalten in bestimmten Situationen zu steuern.\n
model.tl.ai.core.ThinkingEffort = Thinking-Aufwand
model.tl.ai.core.ThinkingEffort.HIGH = Hoch
model.tl.ai.core.ThinkingEffort.HIGH.tooltip = Umfangreiches Thinking. Gründliches Reasoning auf Kosten höherer Latenz.
model.tl.ai.core.ThinkingEffort.LOW = Niedrig
model.tl.ai.core.ThinkingEffort.LOW.tooltip = Minimales Thinking. Schnelle Antworten mit weniger Überlegung.
model.tl.ai.core.ThinkingEffort.MAX = Maximum
model.tl.ai.core.ThinkingEffort.MAX.tooltip = Maximaler Thinking-Aufwand. Gründlichstes verfügbares Reasoning.
model.tl.ai.core.ThinkingEffort.MEDIUM = Mittel
model.tl.ai.core.ThinkingEffort.MEDIUM.tooltip = Moderates Thinking. Ausgewogen zwischen Geschwindigkeit und Gründlichkeit.
model.tl.ai.core.ThinkingEffort.tooltip = Die Stufe des internen Reasoning-Aufwands für Anthropic-Modelle mit erweitertem Thinking.
model.tl.ai.core.ToolChoice = Tool-Auswahl
model.tl.ai.core.ToolChoice.AUTO = Automatisch
model.tl.ai.core.ToolChoice.AUTO.tooltip = Das Modell entscheidet, ob und welche Tools aufgerufen werden.
model.tl.ai.core.ToolChoice.NONE = Keine
model.tl.ai.core.ToolChoice.NONE.tooltip = Tool-Nutzung ist deaktiviert. Das Modell antwortet nur mit Text.
model.tl.ai.core.ToolChoice.REQUIRED = Erforderlich
model.tl.ai.core.ToolChoice.REQUIRED.tooltip = Das Modell muss in jedem Durchlauf mindestens ein Tool aufrufen.
model.tl.ai.core.ToolChoice.tooltip = Strategie, wie das Modell Tools während der Ausführung auswählt.
