model.orgStructure = Organizational structure
model.orgStructure.OrgHead = Central division
model.orgStructure.OrgHead.tooltip = A central division. It can only be created directly below the organization and contains organizational units.
model.orgStructure.OrgHeadChild = Child of Central division
model.orgStructure.OrgHeadChild.tooltip = Base type for the types whose objects can be created below a central division.
model.orgStructure.OrgRoot = Organization
model.orgStructure.OrgRoot.tooltip = The root of the organizational structure. It is created automatically as the root object of its module and cannot be deleted.
model.orgStructure.OrgRootChild = Child of Organization
model.orgStructure.OrgRootChild.tooltip = Base type for the types whose objects can be created directly below the organization.
model.orgStructure.OrgUnit = Organizational unit
model.orgStructure.OrgUnit.all = Organizational structure
model.orgStructure.OrgUnit.all.name = Name
model.orgStructure.OrgUnit.all.name.tooltip = The designation of the organizational unit. It is displayed in the tree of the organizational structure.
model.orgStructure.OrgUnit.all.tooltip = Common base type of all nodes of the organizational structure. It defines the designation and the position of a node in the tree.
model.orgStructure.OrgUnit.base = Organization (all)
model.orgStructure.OrgUnit.base.boss = Head
model.orgStructure.OrgUnit.base.boss.tooltip = The person contact of the person leading this organizational unit.
model.orgStructure.OrgUnit.base.member = Members
model.orgStructure.OrgUnit.base.member.tooltip = The person contacts of the persons working in this organizational unit.
model.orgStructure.OrgUnit.base.orgID = ID
model.orgStructure.OrgUnit.base.orgID.tooltip = Identifier of the organizational unit. It is assigned automatically from the number range when the unit is created and cannot be changed afterwards.
model.orgStructure.OrgUnit.base.tooltip = Base type of the organizational units below the root. In addition to the designation, they have an identifier, a head and members.
model.orgStructure.OrgUnit.head = Central division
model.orgStructure.OrgUnit.head.tooltip = Base type of the organizational units on the level directly below the organization.
model.orgStructure.OrgUnit.root = Organization root
model.orgStructure.OrgUnit.root.tooltip = Base type of the root of the organizational structure. In contrast to the units below it, the root has neither an identifier nor a head.
model.orgStructure.OrgUnit.tooltip = An organizational unit. It can be created below a central division or below another organizational unit and thus be nested to an arbitrary depth.
model.orgStructure.OrgUnit.unit = Organizational unit
model.orgStructure.OrgUnit.unit.tooltip = Base type of the organizational units below a central division.
model.orgStructure.OrgUnitChild = Child of Organizational unit
model.orgStructure.OrgUnitChild.tooltip = Base type for the types whose objects can be created below an organizational unit.
model.orgStructure.tooltip = Module with the types of the organizational structure. The organizational units form a tree with the organization at its root.
