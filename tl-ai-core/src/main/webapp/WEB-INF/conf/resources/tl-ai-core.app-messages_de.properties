role.description.AccessTokenOwner = Der Eigentümer eines persönlichen Zugriffstokens der Agenten-Endpunkte. Die Rolle wird je Token aus dessen Eigentümer abgeleitet und erlaubt den Lesezugriff auf genau dieses Token; global hält sie niemand.
role.description.AiBinaryOwner = Der Eigentümer eines wahrnehmbaren Binärobjekts des KI-Moduls: eines aufgenommenen Screenshots, eines gespeicherten Cookie-Pools oder einer gespeicherten Recherche mit ihren Teilen. Die Rolle wird je Objekt aus dessen Eigentümer abgeleitet und erlaubt den Lesezugriff auf genau dieses Objekt; global hält sie niemand, und ein Objekt ohne Eigentümer hat keinen Rolleninhaber.
tl.ai.environment.template = <environment>\nSie laufen in der TopLogic-Anwendung "{{application}}" als Assistent eines einzelnen Benutzers.\nBenutzer: {{user}}. Sprechen Sie den Benutzer so an, wie er es in seinen Präferenzen wünscht.\nSprache: {{language}}. Schreiben Sie jeden Text, den der Benutzer sieht, in dieser Sprache: die Notizen zwischen Tool-Aufrufen, die Fragen und die abschließende Antwort.\nDatum: {{date}}.\nAgent: {{agent}}. Modell: {{model}}.\nWas die Anwendung unten angibt, ist maßgeblich. Wenn Anwendungskontext und Benutzerpräferenzen sich widersprechen, gilt der Anwendungskontext.\n{{context}}\n{{turn_context}}\n{{preferences}}\n{{memories}}\n</environment>
tl.ai.environment.turn-context = Aktueller Zustand: Jeder Benutzernachricht geht ein <turn-context>-Block voraus. Er gibt an, was diese Anwendung über diesen Moment aussagt - darunter das vom Benutzer ausgewählte Objekt. Der neueste Block beschreibt den jetzigen Stand; ein älterer beschreibt einen vergangenen Moment.
