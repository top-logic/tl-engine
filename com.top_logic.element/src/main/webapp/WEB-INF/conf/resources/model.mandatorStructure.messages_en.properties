model.mandatorStructure = Mandator structure
model.mandatorStructure.Mandator = Mandator
model.mandatorStructure.Mandator.all = Mandator (all)
model.mandatorStructure.Mandator.all.allowContracts = Allow contracts
model.mandatorStructure.Mandator.all.allowContracts.tooltip = Whether contracts may be managed for this mandator.
model.mandatorStructure.Mandator.all.contractGuidelines = Contract Guidelines
model.mandatorStructure.Mandator.all.contractGuidelines.tooltip = The guidelines that apply to the contracts of this mandator.
model.mandatorStructure.Mandator.all.description = Description
model.mandatorStructure.Mandator.all.description.tooltip = A free-text description of the mandator.
model.mandatorStructure.Mandator.all.documents = Documents
model.mandatorStructure.Mandator.all.documents.tooltip = The document folder in which the documents belonging to the mandator are stored. The folder is deleted together with the mandator.
model.mandatorStructure.Mandator.all.name = Name
model.mandatorStructure.Mandator.all.name.tooltip = The name of the mandator. It is displayed in the mandator tree.
model.mandatorStructure.Mandator.all.numberHandlerID = ID
model.mandatorStructure.Mandator.all.numberHandlerID.tooltip = Identifier of the number generator that creates the numbers for the objects of this mandator. The identifier is also used as short label of the mandator.
model.mandatorStructure.Mandator.all.tooltip = Common base type of all nodes of the mandator structure. It defines the properties that both the root node and the mandators below it have.
model.mandatorStructure.Mandator.tooltip = A mandator, i.e. an organizational unit of the mandator structure. Mandators can be nested to an arbitrary depth.
model.mandatorStructure.MandatorChild = Child of Mandator
model.mandatorStructure.MandatorChild.tooltip = Base type for the types whose objects can be created below a mandator.
model.mandatorStructure.RootElement = Mandator structure
model.mandatorStructure.RootElement.tooltip = The root node of the mandator structure. It is created automatically as the root object of its module and cannot be deleted.
model.mandatorStructure.RootElementChild = Mandator (top-level)
model.mandatorStructure.RootElementChild.tooltip = Base type for the types whose objects can be created directly below the root of the mandator structure.
model.mandatorStructure.tooltip = Module of the mandator structure. The mandators form a tree of organizational units to which business objects can be assigned.
