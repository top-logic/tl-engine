package com.top_logic.ai.chat.api.messages;

option NoBinary;
option NoVisit;
option NoListener;
option NoInterfaces;
option NoXml;

/**
 * One message in the chat.
 */
message MessageDto {
	/**
	 * Message ID.
	 */
	string id;

	/**
	 * "user", "agent", or "system".
	 */
	string role;

	/**
	 * Display name of the user who sent this message.
	 */
	string userName;

	/**
	 * Message text content.
	 */
	string content;

	/**
	 * Pre-rendered HTML for the message content (agent messages only; null for user/system).
	 */
	string contentHtml;

	/**
	 * Formatted timestamp string.
	 */
	string time;

	/**
	 * Attachment metadata (file name, type, size). Binary data is NOT persisted.
	 */
	repeated AttachmentDto attachments;
}

/**
 * Response body for GET /chat/updates.
 */
message ChatUpdatesResponse {
	/**
	 * Whether an AI task is currently in progress.
	 */
	boolean processing;

	/**
	 * All messages in the chat.
	 */
	repeated MessageDto messages;

}

/**
 * File attachment metadata and optional binary data.
 */
message AttachmentDto {
	/**
	 * Original file name.
	 */
	string fileName;

	/**
	 * MIME type (e.g. "image/png", "application/pdf").
	 */
	string mimeType;

	/**
	 * Base64-encoded file content. Present in ChatSendRequest (upload); null in persisted MessageDto.
	 */
	string base64Data;

	/**
	 * File size in bytes.
	 */
	int size;
}

/**
 * Request body for POST /chat/send.
 */
message ChatSendRequest {
	/**
	 * User message text.
	 */
	string text;

	/**
	 * Active session ID; if set, messages will be persisted to this session.
	 */
	string sessionId;

	/**
	 * File attachments (images, PDFs). Max 5, each max 10 MB.
	 */
	repeated AttachmentDto attachments;

	/**
	 * Agent to run for this turn. Empty uses the configured chat entry-point agent.
	 */
	string agent;

	/**
	 * Model override for this turn. Empty keeps the agent's assigned model.
	 */
	string model;

	/**
	 * When true, {@link #mcpServers} replaces the agent's configured MCP servers for this turn
	 * (an empty list means no MCP tools). When false, the agent's defaults are used.
	 */
	boolean mcpOverride;

	/**
	 * MCP servers to attach when {@link #mcpOverride} is true.
	 */
	repeated string mcpServers;

	/**
	 * How hard the model may think for this turn, one of the selected model's
	 * <code>effortLevels</code>. Empty keeps the agent's assignment; a level the model does not
	 * offer is ignored with a logged warning rather than failing the run.
	 */
	string effort;
}

/**
 * Response body for POST /chat/send.
 */
message ChatSendResponse {
	/**
	 * Task ID for polling updates.
	 */
	string taskId;

	/**
	 * e.g. "processing".
	 */
	string status;
}

/**
 * Request body for POST /chat/improve-prompt.
 */
message ImprovePromptRequest {
	/**
	 * Draft text to improve.
	 */
	string draft;

	/**
	 * Browser-generated correlation ID.
	 */
	string requestId;
}

/**
 * Response body for POST /chat/improve-prompt.
 */
message ImprovePromptResponse {
	/**
	 * Correlation ID from the request.
	 */
	string requestId;

	/**
	 * Improved draft text. Empty unless {@link #status} is "completed".
	 */
	string improvedText;

	/**
	 * Result status: "completed", "cancelled", or "stale".
	 */
	string status;
}

/**
 * Request body for POST /chat/improve-prompt/cancel.
 */
message CancelPromptImprovementRequest {
	/**
	 * Correlation ID of the request to cancel.
	 */
	string requestId;
}

/**
 * Request body for POST /chat/regenerate: answer the same message again.
 */
message RegenerateRequest {
	/** Session whose last turn is to be answered again. */
	string sessionId;

	/** Agent for the new run; empty keeps the chat entry point. */
	string agent;

	/** Model for the new run; empty keeps the agent's assignment. */
	string model;

	/** Whether the named MCP servers replace the agent's configured ones. */
	boolean mcpOverride;

	/** MCP servers for the new run. */
	repeated string mcpServers;

	/** How hard the model may think for the new run. */
	string effort;
}

/**
 * Request body for POST /chat/truncate: drop a turn and everything after it.
 */
message TruncateRequest {
	/** Session to truncate. */
	string sessionId;

	/**
	 * Zero-based index of the first turn to remove. Everything from it to the end goes with it,
	 * because a conversation is a sequence: what followed was said in reply to what is being
	 * removed and cannot stand without it.
	 */
	int fromTurn;
}

/**
 * Response body for POST /chat/truncate and POST /chat/regenerate.
 */
message TruncateResponse {
	/** "ok", "busy" or "error". */
	string status;

	/** Number of turns removed. */
	int removedTurns;

	/** The user text of the first removed turn, so the client can offer it for editing. */
	string text;

	/** Task ID of the run started by a regenerate; empty for a plain truncate. */
	string taskId;
}

/**
 * One answer the user rated.
 */
message MessageFeedbackDto {
	/** Zero-based index of the turn whose answer was rated. */
	int turnIndex;

	/** "up" or "down". */
	string rating;

	/** Free text the user added; empty when they added none. */
	string note;

	/** ISO-8601 timestamp of when the rating was given. */
	string recordedAt;
}

/**
 * Request body for POST /chat/feedback.
 */
message MessageFeedbackRequest {
	/** Session the rated answer belongs to. */
	string sessionId;

	/** Zero-based index of the turn whose answer was rated. */
	int turnIndex;

	/** "up", "down", or empty to withdraw an earlier rating. */
	string rating;

	/** Free text the user added; optional. */
	string note;
}

/**
 * SSE connected event payload.
 */
message ConnectedEvent {
	/**
	 * Current message sequence number.
	 */
	int messageSeq;

	/**
	 * Current timeline sequence number.
	 */
	int timelineSeq;

	/**
	 * Whether an AI task is currently in progress.
	 */
	boolean processing;

	/**
	 * Current task ID, or null if none.
	 */
	string taskId;
}

/**
 * SSE heartbeat event payload.
 */
message HeartbeatEvent {
	/**
	 * Current server timestamp in milliseconds.
	 */
	long ts;
}

/**
 * Summary of a chat session for the history panel.
 */
message ChatSessionDto {
	/**
	 * Session ID (KnowledgeObject ID).
	 */
	string id;

	/**
	 * User-editable session title.
	 */
	string title;

	/**
	 * ISO-8601 timestamp of last update.
	 */
	string lastUpdated;
}

/**
 * Response body for GET /chat/sessions.
 */
message ChatSessionListResponse {
	/**
	 * All sessions for the current user, sorted by lastUpdated descending.
	 */
	repeated ChatSessionDto sessions;
}

/**
 * A pending human-in-the-loop request (approval/question/choice) awaiting the current user,
 * with the chat session it belongs to so the client can link to it.
 */
message PendingInteractionDto {
	/**
	 * Correlation ID of the underlying <code>InteractionRequest</code> (used for /chat/respond).
	 */
	string requestId;

	/**
	 * Request kind: "approval", "question", or "choice".
	 */
	string type;

	/**
	 * Short label (e.g. "Approval").
	 */
	string header;

	/**
	 * The prompt presented to the responder (raw markdown). For approvals this is the display
	 * reason.
	 */
	string prompt;

	/**
	 * Structured request data. For approvals this is the tool call's argument JSON, so the client
	 * can rebuild the approval prompt when the user re-opens the chat.
	 */
	string payload;

	/**
	 * ID of the chat session that raised this request.
	 */
	string sessionId;

	/**
	 * Title of the chat session that raised this request.
	 */
	string sessionTitle;

	/**
	 * ISO-8601 timestamp of when the request was created.
	 */
	string createdAt;

	/**
	 * Milliseconds left for the user to respond, counted from the moment this response was
	 * written. Zero when the request's deadline has already passed, so a client can tell a
	 * request it can still answer from one that is only waiting to be cleaned up.
	 */
	long remainingMs;
}

/**
 * Response body for GET /chat/interactions: pending requests across all of the current
 * user's chat sessions, oldest first.
 */
message PendingInteractionsResponse {
	/**
	 * All pending requests awaiting the current user.
	 */
	repeated PendingInteractionDto interactions;
}

/**
 * Request body for POST /chat/sessions.
 */
message CreateSessionRequest {
	/**
	 * Title for the new session.
	 */
	string title;
}

/**
 * Request body for PUT /chat/sessions/{id}/title.
 */
message UpdateTitleRequest {
	/**
	 * New title for the session.
	 */
	string title;
}

/**
 * Response body for GET /chat/sessions/{id} (full session load).
 */
message ChatSessionDetailResponse {
	/**
	 * Session ID.
	 */
	string id;

	/**
	 * Session title.
	 */
	string title;

	/**
	 * Messages JSON blob (raw string, parsed by client).
	 */
	string messagesJson;

	/**
	 * Turn-based entries (V2 format) as a JSON array of <code>PersistedTurn</code> objects
	 * (see <code>com.top_logic.tl.ai.core.session.persist</code>). When present, takes
	 * precedence over entries.
	 */
	string turnsJson;

	/**
	 * Token usage of the last agent-loop iteration of the session's last turn.
	 *
	 * <p>
	 * Its prompt size (input + cache read + cache write) is the exact context the model saw when
	 * the session was last active, so re-opening a session restores the context ring to a measured
	 * number rather than an estimate. Absent for a session whose transcript predates the field, and
	 * for a session that has not run a turn yet.
	 * </p>
	 */
	TokenUsageDto lastPromptUsage;

	/**
	 * Context window in tokens of the model that ran the session's last turn, or zero when that
	 * model is no longer configured.
	 */
	int contextWindow;

	/**
	 * Model that ran the session's last turn, empty when the session has not run one.
	 */
	string lastModel;

	/** Answer ratings recorded in this session, so a reopened chat shows them again. */
	repeated MessageFeedbackDto feedback;

	/** Effort level last used in this session; empty when none was chosen. */
	string lastEffort;
}

/**
 * Request body for PUT /chat/sessions/{id}/messages.
 */
message SaveMessagesRequest {
	/**
	 * Messages JSON blob to save.
	 */
	string messagesJson;
}

/**
 * SSE user interaction event payload.
 */
message UserInteractionEvent {
	/**
	 * Unique interaction request identifier (e.g. "interaction-1").
	 */
	string requestId;

	/**
	 * The question to present to the user (raw markdown).
	 */
	string question;

	/**
	 * Pre-rendered HTML for the question.
	 */
	string questionHtml;

	/**
	 * Short label (e.g. "Approval", "Clarify", "Choose").
	 */
	string header;

	/**
	 * Interaction type: "approval", "text", or "choice".
	 */
	string type;

	/**
	 * Available options for "choice" interactions.
	 */
	repeated InteractionOptionDto options;

	/**
	 * Whether multiple selections are allowed (for "choice" type).
	 */
	boolean multiSelect;

	/**
	 * Milliseconds left for the user to answer, counted from the moment this event was sent.
	 * Zero when the request has no time left. A re-emitted question (the chat was reopened)
	 * carries what is left of its deadline, not the full one.
	 */
	long remainingMs;
}

/**
 * One selectable option in a user interaction.
 */
message InteractionOptionDto {
	/**
	 * Display label for the option.
	 */
	string label;

	/**
	 * Optional description / tooltip text.
	 */
	string description;
}

/** SSE event for streaming text delta. */
message TextDeltaEvent {
	/** The text chunk. */
	string text;
}

/** SSE event for streaming thinking delta. */
message ThinkingDeltaEvent {
	/** The thinking text chunk. */
	string text;
}

/** SSE event for run started. */
message RunStartedEvent {
	/** The run ID. */
	string runId;

	/** The model being used. */
	string model;

	/** Estimated tokens already in the conversation. */
	int usedTokens;

	/** Model context window in tokens. */
	int contextWindow;
}

/** SSE event for run completed. */
message RunCompletedEvent {
	/** The run ID. */
	string runId;

	/** Stop reason: COMPLETE, MAX_TURNS, ERROR, ABORTED. */
	string reason;

	/** Total token usage for the run. */
	TokenUsageDto totalUsage;
}

/** SSE event for turn started. */
message TurnStartedEvent {
	/** 1-based turn number. */
	int turnNumber;

	/** Estimated tokens already in the conversation. */
	int usedTokens;

	/** Model context window in tokens. */
	int contextWindow;
}

/** SSE event for turn completed. */
message TurnCompletedEvent {
	/** 1-based turn number. */
	int turnNumber;

	/** Token usage for this turn. */
	TokenUsageDto turnUsage;

	/**
	 * Model context window in tokens, repeated here so the client can size the context ring from
	 * the same event that carries the provider-reported prompt size.
	 */
	int contextWindow;
}

/**
 * SSE event describing what the prompt of the request just sent is made of.
 *
 * <p>
 * Every figure is an estimate produced by the agent loop's token estimator, not a provider count:
 * the provider reports one prompt total and never splits it. A client showing these next to the
 * measured total must mark them as estimated.
 * </p>
 */
message ContextCompositionEvent {
	/** Estimated tokens of the system prompt. */
	int systemPromptTokens;

	/** Estimated tokens of the tool schemas sent with the request. */
	int toolDefinitionTokens;

	/** Estimated tokens of the conversation messages. */
	int messageTokens;

	/** Number of tool schemas sent with the request. */
	int toolCount;
}

/** SSE event for tool call started. */
message ToolStartedEvent {
	/** Unique tool call ID. */
	string toolCallId;

	/** Tool name. */
	string toolName;

	/** Arguments as JSON string. */
	string argsJson;
}

/** SSE event for tool call completed. */
message ToolCompletedEvent {
	/** Unique tool call ID. */
	string toolCallId;

	/** Tool name. */
	string toolName;

	/** Result text. */
	string result;

	/** Duration in milliseconds. */
	long durationMs;
}

/** SSE event for tool call failed. */
message ToolFailedEvent {
	/** Unique tool call ID. */
	string toolCallId;

	/** Tool name. */
	string toolName;

	/** Error message. */
	string errorMessage;

	/** Duration in milliseconds. */
	long durationMs;
}

/** SSE event for tool call denied. */
message ToolDeniedEvent {
	/** Unique tool call ID. */
	string toolCallId;

	/** Tool name. */
	string toolName;

	/** Denial reason. */
	string reason;
}

/** SSE event for approval required. */
message ApprovalRequiredEvent {
	/** Unique tool call ID. */
	string toolCallId;

	/** Approval request ID for responding. */
	string approvalRequestId;

	/** Tool name needing approval. */
	string toolName;

	/** Arguments as JSON string. */
	string argsJson;

	/** Human-readable reason for approval. */
	string displayReason;

	/**
	 * Milliseconds left for the user to decide, counted from the moment this event was sent.
	 * Zero when the request has no time left; the client shows the remaining time so the user
	 * knows there is a clock.
	 */
	long remainingMs;
}

/** SSE event for approval resolved. */
message ApprovalResolvedEvent {
	/** Unique tool call ID. */
	string toolCallId;

	/** Approval request ID. */
	string approvalRequestId;

	/** Outcome: APPROVED, APPROVED_FOR_SESSION, REJECTED, TIMED_OUT. */
	string outcome;
}

/**
 * SSE wrapper for child-agent events forwarded during delegation.
 *
 * <p>
 * Carries the parent delegation's tool call ID so the browser can route child events
 * (tool calls, text deltas, token usage) to the correct delegation container.
 * </p>
 */
message DelegationEventWrapper {
	/** The subagent job id (empty for synchronous delegation). */
	string subagentId;

	/** The parent agent's tool call ID for the delegate_to_* tool. */
	string delegationToolCallId;

	/** The inner SSE event type (e.g. "tool_started", "text_delta", "run_completed"). */
	string eventType;

	/** The inner event data as JSON string. */
	string eventData;
}

/**
 * SSE event carrying subagent lifecycle status.
 *
 * <p>
 * Emitted for {@code subagent_started}, {@code subagent_completed}, {@code subagent_failed},
 * and {@code subagent_cancelled} events.
 * </p>
 */
message SubagentStatusEvent {
	/** The subagent job id within the session. */
	string subagentId;

	/** The delegated-to agent name. */
	string targetAgentName;

	/** The task brief (on start) or final text / error summary (on completion/failure). */
	string detail;

	/** Total tokens the subagent used (0 until completion). */
	int32 totalTokens;

	/** Run duration in milliseconds (0 until completion). */
	int64 durationMs;
}

/** SSE event for transaction committed. */
message TransactionCommittedEvent {
	/** Revision number, -1 if no changes. */
	long revisionNumber;
}

/** SSE event for transaction rolled back. */
message TransactionRolledBackEvent {
	/** Rollback reason. */
	string reason;
}

/** SSE event for provider error. */
message ProviderErrorEvent {
	/** Machine-readable error kind: RATE_LIMITED, OVERLOADED, CONTEXT_WINDOW_EXCEEDED, AUTHENTICATION, INVALID_REQUEST, UNKNOWN. */
	string kind;

	/** Human-readable error message. */
	string errorMessage;
}

/** SSE event for compaction started. */
message CompactionStartedEvent {
	/** Token count before compaction. */
	int tokensBefore;

	/** Trigger: reactive or proactive. */
	string trigger;

	/** Model context window in tokens. */
	int contextWindow;
}

/** SSE event for task list update. Carries the full task list snapshot. */
message TaskUpdateEvent {
	/** Full task list as JSON (<code>PersistedTaskStore</code> format from <code>TaskStore.toJson()</code>). */
	string tasksJson;
}

/** SSE event for completed assistant message with server-rendered HTML. */
message MessageCompleteEvent {
	/** Server-rendered markdown-to-HTML content. */
	string contentHtml;

	/** Raw markdown text for persistence. */
	string contentText;
}

/** Token usage breakdown. */
message TokenUsageDto {
	/** Input tokens. */
	int inputTokens;

	/** Output tokens. */
	int outputTokens;

	/** Thinking tokens. */
	int thinkingTokens;

	/** Cache read tokens. */
	int cacheReadTokens;

	/** Cache write tokens. */
	int cacheWriteTokens;
}

/** Session metadata for persistence. */
message SessionMetadata {
	/** Tool names approved for this session. */
	repeated string approvedTools;

	/** Cumulative token usage. */
	TokenUsageDto cumulativeUsage;

	/** Last model used. */
	string lastModel;

	/** Current approval mode (e.g. AUTO_APPROVE, ALWAYS_ASK). */
	string approvalMode;

	/** Serialized <code>TaskStore</code> JSON (<code>PersistedTaskStore</code> format). */
	string tasksJson;

	/** Skill IDs loaded in this session, for replay on restore. */
	repeated string loadedSkills;

	/**
	 * Answer ratings the user gave in this session.
	 *
	 * <p>
	 * Kept here rather than in the transcript because a transcript is written per run and a rating
	 * arrives after it: this bag is the session's own, is rewritten whole, and is therefore also
	 * where an evaluation reads the ratings back from.
	 * </p>
	 */
	repeated MessageFeedbackDto feedback;

	/** Effort level last chosen in this session. */
	string lastEffort;
}

/** Catalog of agents, models and MCP servers the chat UI can offer. */
message ChatCapabilitiesResponse {
	/** Configured chat entry-point agent name. */
	string entryPointAgent;

	/** Agents the current user may start a chat with. */
	repeated AgentOptionDto agents;

	/** Models configured on LLM providers. */
	repeated ModelOptionDto models;

	/** MCP servers known to the registry. */
	repeated McpServerOptionDto mcpServers;
}

/** One selectable agent. */
message AgentOptionDto {
	/** Unique agent name. */
	string name;

	/** Short description. */
	string description;

	/** MCP servers bound on the agent definition. */
	repeated string mcpServers;

	/** Resolved default model for this agent. */
	string model;
}

/** One selectable model. */
message ModelOptionDto {
	/** Model identifier. */
	string id;

	/** Provider key (anthropic, openai, ...). */
	string provider;

	/** Context window in tokens. */
	int contextWindow;

	/** Maximum output tokens. */
	int maxOutput;

	/**
	 * How hard this model may be asked to think, in increasing order.
	 *
	 * <p>
	 * Empty when the model offers no such setting, which is what a UI must check before offering
	 * one: the providers reject a level their model does not know.
	 * </p>
	 */
	repeated string effortLevels;

	/** The level in force when the caller names none; empty when the model has no levels. */
	string defaultEffort;
}

/** One selectable MCP server. */
message McpServerOptionDto {
	/** Configured server name. */
	string name;

	/** "connected" or "disconnected". */
	string status;
}
