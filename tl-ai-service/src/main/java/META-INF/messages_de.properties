com.top_logic.ai.service.agents.AgentConfig.system-prompt = System-Prompt
com.top_logic.ai.service.agents.AgentConfig.system-prompt.tooltip = Die System-Prompt, die das Verhalten und die Anweisungen dieses Agenten definiert.
com.top_logic.ai.service.agents.AgentConfig.temperature = Temperatur
com.top_logic.ai.service.agents.AgentConfig.temperature.tooltip = Die Abtasttemperatur fï¿½r das Modell (0,0 bis 1,0). <p> Niedrigere Werte machen die Ausgabe deterministischer, hï¿½here Werte machen sie kreativer. </p>
com.top_logic.ai.service.agents.AgentConfig.thinking-budget-tokens = Denkbudget (Token)
com.top_logic.ai.service.agents.AgentConfig.thinking-budget-tokens.tooltip = Die maximale Anzahl von Token, die das Modell fï¿½r sein internes Denken verwenden darf. <p> Erforderlich, wenn <i>der Denktyp</i> <i>aktiviert</i> ist. Nur sichtbar, wenn das Modell Denken unterstï¿½tzt und ein Denktyp ausgewï¿½hlt ist. </p>
com.top_logic.ai.service.agents.AgentConfig.thinking-type = Denktyp
com.top_logic.ai.service.agents.AgentConfig.thinking-type.tooltip = Der Denktyp fï¿½r die erweiterte Denkunterstï¿½tzung. <p> Nur sichtbar, wenn das ausgewï¿½hlte Modell Denken unterstï¿½tzt (Anthropic-Modelle). <i>Adaptiv</i> lï¿½sst das Modell entscheiden, wann es denkt. <i>Aktiviert</i> erzwingt das Denken bei jeder Anfrage und erfordert das Setzen von <i>Denk-Budget-Token</i>. </p>
com.top_logic.ai.service.agents.AgentConfig.timeout-seconds = Zeitï¿½berschreitung
com.top_logic.ai.service.agents.AgentConfig.timeout-seconds.tooltip = Anfrage-Timeout in Sekunden.
com.top_logic.ai.service.agents.AgentConfig.tools = Werkzeuge
com.top_logic.ai.service.agents.AgentConfig.tools.tooltip = Die fï¿½r diesen Agenten verfï¿½gbaren Standardwerkzeuge, ausgewï¿½hlt nach Namen. <p> Jeder Name steht fï¿½r eine bekannte Werkzeugklasse. Die Werkzeuge werden zur Laufzeit von der <i>Agentenregistrierung</i> instanziiert. </p>
com.top_logic.ai.service.agents.AgentConfig.tooltip = Konfiguration fï¿½r einen einzelnen Agenten in der <i>Agentenregistrierung</i>. <p> Jeder Agent wird durch einen eindeutigen Namen identifiziert (durch <i>benannte Konfiguration obligatorisch</i>) und definiert das LLM-Modell, optionale Denkparameter, die Systemaufforderung und verfï¿½gbare Werkzeuge und Fï¿½higkeiten. </p> <p> Denk-Parameter<i>(Denk-Typ</i>, <i>Denk-Budget-Token</i>, <i>Return Thinking</i>, <i>Send Thinking</i>) sind nur sichtbar, wenn das ausgewï¿½hlte Modell erweitertes Denken unterstï¿½tzt (derzeit Anthropic-Modelle). Wenn die Option <i>aktiviert</i> ist, werden die <i>Denkbudget-Token</i> und <i>Maximum-Token</i> obligatorisch. </p>
com.top_logic.ai.service.agents.AgentConfig.top-k = Top-K
com.top_logic.ai.service.agents.AgentConfig.top-k.tooltip = Top-k-Sampling-Parameter. <p> Nur sichtbar fï¿½r Anthropic-Modelle. </p>
com.top_logic.ai.service.agents.AgentConfig.top-p = Top-P
com.top_logic.ai.service.agents.AgentConfig.top-p.tooltip = Top-P (Nucleus-Sampling) begrenzt die Token-Auswahl auf die kleinste Menge, deren kumulative Wahrscheinlichkeit diesen Schwellenwert ï¿½berschreitet (0,0 bis 1,0). <p> Niedrigere Werte (z. B. 0,1) machen die Ausgabe fokussierter, hï¿½here Werte (z. B. 0,9) erlauben mehr Vielfalt. </p>
com.top_logic.ai.service.agents.AgentRegistry = Agenten-Registrierung
com.top_logic.ai.service.agents.AgentRegistry.Config.agents = Agenten
com.top_logic.ai.service.agents.AgentRegistry.Config.agents.tooltip = Die konfigurierten Agenten, geordnet nach Agentennamen. <p> Jeder Eintrag definiert einen Agenten mit seinem Modell, seiner Eingabeaufforderung, seinen Werkzeugen und Fï¿½higkeiten. </p>
com.top_logic.ai.service.agents.AgentRegistry.Config.skills = Skills
com.top_logic.ai.service.agents.AgentRegistry.Config.skills.tooltip = Die konfigurierten Fertigkeiten, geordnet nach dem Namen der Fertigkeit. <p> Jeder Eintrag definiert einen wiederverwendbaren Skill mit seiner Beschreibung und seinem Prompt-Inhalt. Skills werden ï¿½ber den Namen von <i>Skills</i><i>(Agentenkonfiguration</i>) referenziert. </p>
com.top_logic.ai.service.agents.AgentRegistry.tooltip = Register der zur Laufzeit konfigurierbaren Agenten und Fï¿½higkeiten. <p> Jeder Agent wird in XML ï¿½ber die <i>Agentenkonfiguration</i> deklariert und enthï¿½lt seinen LLM-Modellnamen, optionale Denkparameter, Systemaufforderung, Werkzeuge und Fï¿½higkeiten. Skills werden ï¿½ber die <i>Skill-Konfiguration</i> deklariert. Dieser Dienst validiert die Konfigurationen beim Start und bietet Factory-Methoden, um daraus vollstï¿½ndig verdrahtete <i>LangChain4j-Agenten</i> zu erstellen. </p> <p> Die Modellbildung ist anbieterabhï¿½ngig: Wenn das referenzierte Modell von einem bekannten Anbieter bereitgestellt wird<i>(anthropic chat model factory</i>, <i>mistral chat model factory</i>, <i>open AI chat model factory</i>), werden die Parameter des Agenten (Denken, Temperatur, maximale Token) auf eine neue, ungepoolte Modellinstanz angewendet. Andernfalls wird das gepoolte Modell des <i>KI-Dienstes</i> als Fallback zurï¿½ckgegeben. </p>
com.top_logic.ai.service.agents.ReasoningEffort = Reasoning-Aufwand
com.top_logic.ai.service.agents.ReasoningEffort.HIGH = Hoch
com.top_logic.ai.service.agents.ReasoningEffort.HIGH.tooltip = Hoher Reasoning-Aufwand.
com.top_logic.ai.service.agents.ReasoningEffort.LOW = Niedrig
com.top_logic.ai.service.agents.ReasoningEffort.LOW.tooltip = Geringer Reasoning-Aufwand.
com.top_logic.ai.service.agents.ReasoningEffort.MEDIUM = Mittel
com.top_logic.ai.service.agents.ReasoningEffort.MEDIUM.tooltip = Mittlerer Reasoning-Aufwand (Standard fï¿½r die meisten Reasoning-Modelle).
com.top_logic.ai.service.agents.ReasoningEffort.MINIMAL = Minimal
com.top_logic.ai.service.agents.ReasoningEffort.MINIMAL.tooltip = Minimaler Reasoning-Aufwand (GPT-5-Familie).
com.top_logic.ai.service.agents.ReasoningEffort.NONE = Kein Reasoning
com.top_logic.ai.service.agents.ReasoningEffort.NONE.tooltip = Keine Argumentation.
com.top_logic.ai.service.agents.ReasoningEffort.XHIGH = Extra hoch
com.top_logic.ai.service.agents.ReasoningEffort.XHIGH.tooltip = Besonders hohe Denkleistung (GPT-5.1-codex-max, GPT-5.2).
com.top_logic.ai.service.agents.ReasoningEffort.tooltip = Von OpenAI-Schlussfolgermodellen (o-Serie, GPT-5) unterstï¿½tzte Reasoning-Aufwand-Stufen. <p> Dies ist eine Obermenge aller bekannten Werte in den Modellfamilien. Nicht jedes Modell unterstï¿½tzt jede Stufe; die verfï¿½gbaren Optionen werden dynamisch auf der Grundlage des ausgewï¿½hlten Modells gefiltert. </p>
com.top_logic.ai.service.agents.ThinkingType = Denktyp
