model.tl.ai.monitor = Agent monitor
model.tl.ai.monitor.Period = Period
model.tl.ai.monitor.Period.firstDay = First day of the axis
model.tl.ai.monitor.Period.firstDay.tooltip = Left edge of a time-series chart, as a whole day. Empty for "All" - the day of the oldest run is then used.
model.tl.ai.monitor.Period.fromDay = From
model.tl.ai.monitor.Period.fromDay.tooltip = First day of the period. This day counts in full.
model.tl.ai.monitor.Period.label = Name
model.tl.ai.monitor.Period.label.tooltip = What the period is called where a number has to state its period - in the label of a tile, for instance.
model.tl.ai.monitor.Period.lastDay = Last day of the axis
model.tl.ai.monitor.Period.lastDay.tooltip = Right edge of a time-series chart, as a whole day. For a preset period this is today.
model.tl.ai.monitor.Period.preset = Preset
model.tl.ai.monitor.Period.preset.tooltip = The option chosen in the period control: a number of days, 0 for "All", -1 for a custom range.
model.tl.ai.monitor.Period.toDay = To
model.tl.ai.monitor.Period.toDay.tooltip = Last day of the period. This day counts in full.
model.tl.ai.monitor.Period.windowEnd = End of the time window
model.tl.ai.monitor.Period.windowEnd.tooltip = Upper bound, exclusive: the midnight after the last day. Empty when the period is unbounded above.
model.tl.ai.monitor.Period.windowStart = Start of the time window
model.tl.ai.monitor.Period.windowStart.tooltip = Lower bound, inclusive. Empty when the period is unbounded below.
