class.com.top_logic.monitoring.view.I18NConstants.ERROR_TOO_MANY_PERIODS__MAX = Der Zeitraum umfasst mehr als {0} Abschnitte. Wählen Sie längere Abschnitte oder einen kürzeren Zeitraum.
class.com.top_logic.monitoring.view.I18NConstants.ERROR_UNKNOWN_PERIOD__PERIOD = Unbekannter Abschnitt „{0}“. Gültig sind hour, day, week, month und year.
com.top_logic.monitoring.view.MonitorFunctions.memoryUsage = Speicherverbrauch im Zeitverlauf
com.top_logic.monitoring.view.MonitorFunctions.memoryUsage.return = Die aufgezeichneten Einträge in der Reihenfolge ihrer Aufzeichnung, der älteste zuerst. Leer, wenn die <i>Speicherprotokollierung</i> nicht läuft oder keine Einträge vorhält.
com.top_logic.monitoring.view.MonitorFunctions.memoryUsage.tooltip = Der Speicherverbrauch, den die <i>Speicherprotokollierung</i> aufgezeichnet hat. <p> Jeder Eintrag ist ein Dictionary, in dem unter <code>"date"</code> der Zeitpunkt der Aufzeichnung, unter <code>"used"</code> die von Objekten belegten Bytes, unter <code>"total"</code> die von der VM reservierten Bytes, unter <code>"max"</code> die der VM maximal zur Verfügung stehenden Bytes und unter <code>"free"</code> die reservierten, aber ungenutzten Bytes angegeben sind. Die Anzahl der Garbage Collections seit dem Start der VM und die darin verbrachten Millisekunden, summiert über alle Garbage Collectors, stehen unter <code>"gcCount"</code> und <code>"gcTime"</code>; die Differenz zweier Einträge gibt an, wie viel Garbage Collection zwischen ihnen stattgefunden hat. </p>
com.top_logic.monitoring.view.MonitorFunctions.sessionLogins = Anmeldungen je Abschnitt
com.top_logic.monitoring.view.MonitorFunctions.sessionLogins.param.from.tooltip = Der Anfang des Zeitraums (inklusiv), <code>null</code>, um mit der ersten aufgezeichneten Anmeldung zu beginnen.
com.top_logic.monitoring.view.MonitorFunctions.sessionLogins.param.period.tooltip = Die Länge eines Abschnitts: <code>"hour"</code>, <code>"day"</code>, <code>"week"</code>, <code>"month"</code> oder <code>"year"</code>.
com.top_logic.monitoring.view.MonitorFunctions.sessionLogins.param.to.tooltip = Das Ende des Zeitraums (exklusiv), <code>null</code>, um jetzt zu enden.
com.top_logic.monitoring.view.MonitorFunctions.sessionLogins.return = Die Abschnitte in ihrer zeitlichen Reihenfolge; leer, wenn der Zeitraum keinen Anfang hat und keine Anmeldung enthält.
com.top_logic.monitoring.view.MonitorFunctions.sessionLogins.tooltip = Die Anzahl der Benutzersitzungen, die in jedem Abschnitt eines Zeitraums begonnen wurden. <p> Die Abschnitte sind Stunden, Tage, Wochen, Monate oder Jahre in der Zeitzone des aktuellen Benutzers, der erste ist derjenige, der den Anfang des Zeitraums enthält. Jeder Abschnitt ist ein Dictionary mit seinem Anfang unter <code>"start"</code> und der Anzahl der Anmeldungen darin unter <code>"count"</code>; ein Abschnitt ohne Anmeldung wird mit der Anzahl null geliefert. </p>
