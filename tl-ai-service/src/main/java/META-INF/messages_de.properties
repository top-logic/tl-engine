com.top_logic.ai.service.agents.AgentConfig.max-tokens.tooltip = Die maximale Anzahl der Ausgabe-Token fï¿½r die Modellantwort. <p> Erforderlich, wenn der <i>Typ Thinking</i> <i>aktiviert</i> ist. </p>
com.top_logic.ai.service.agents.AgentConfig.model = Modell
com.top_logic.ai.service.agents.AgentConfig.model.tooltip = Der LLM-Modellname, der fï¿½r diesen Agenten verwendet werden soll (z. B. "claude-sonnet-4-20250514"). <p> Die Optionen werden aus den im <i>AI-Dienst</i> registrierten Modellen ausgefï¿½llt. </p>
