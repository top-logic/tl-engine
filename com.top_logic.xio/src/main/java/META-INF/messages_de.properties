com.top_logic.xio.importer.linkings.CustomLinking.Config.expr.tooltip = <i>Operation</i> wird für jedes Objekt ausgeführt, um es mit seinem Kontext zu verknüpfen. <p> Es wird erwartet, dass der Ausdruck eine Funktion mit zwei Argumenten ist: Das Kontextobjekt und das neu angelegte Objekt. </p>
com.top_logic.xio.importer.linkings.CustomLinking.tooltip = <i>Objektverknüpfung</i>, die an einen Scriptausdruck delegiert.
