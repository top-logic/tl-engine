model.tl.ai.execution = Agent execution
model.tl.ai.execution.AgentExecution = Agent execution
model.tl.ai.execution.AgentExecution.agentName = Agent name
model.tl.ai.execution.AgentExecution.agentName.tooltip = Name of the agent definition that was run.
model.tl.ai.execution.AgentExecution.cacheReadTokens = Cache read tokens
model.tl.ai.execution.AgentExecution.cacheReadTokens.tooltip = Prompt tokens served from the provider's prompt cache.
model.tl.ai.execution.AgentExecution.cacheWriteTokens = Cache write tokens
model.tl.ai.execution.AgentExecution.cacheWriteTokens.tooltip = Prompt tokens written to the provider's prompt cache.
model.tl.ai.execution.AgentExecution.cancelRequested = Cancel requested
model.tl.ai.execution.AgentExecution.cancelRequested.tooltip = Set when cancellation of a running run has been requested.
model.tl.ai.execution.AgentExecution.displayName = Name
model.tl.ai.execution.AgentExecution.displayName.tooltip = Readable identity: agent name, start time and a short run-ID suffix. The suffix keeps the label a discriminator, because parallel sub-agent runs can start within the same second. Computed, not editable.
model.tl.ai.execution.AgentExecution.endedAt = Ended at
model.tl.ai.execution.AgentExecution.endedAt.tooltip = When the run reached a terminal state. Empty while it is still running.
model.tl.ai.execution.AgentExecution.environment = Environment
model.tl.ai.execution.AgentExecution.environment.tooltip = What this run told the model about the situation it happened in: the filled environment block of the system prompt, written when the run started.
model.tl.ai.execution.AgentExecution.errorMessage = Error message
model.tl.ai.execution.AgentExecution.errorMessage.tooltip = Error text of a failed run.
model.tl.ai.execution.AgentExecution.inputTokens = Input tokens
model.tl.ai.execution.AgentExecution.inputTokens.tooltip = Prompt tokens billed for this run.
model.tl.ai.execution.AgentExecution.model = Model
model.tl.ai.execution.AgentExecution.model.tooltip = LLM model the run used.
model.tl.ai.execution.AgentExecution.outputTokens = Output tokens
model.tl.ai.execution.AgentExecution.outputTokens.tooltip = Completion tokens billed for this run.
model.tl.ai.execution.AgentExecution.parentExecution = Parent execution
model.tl.ai.execution.AgentExecution.parentExecution.tooltip = Run that spawned this one. Set for a sub-agent run, empty for a top-level run.
model.tl.ai.execution.AgentExecution.provider = Provider
model.tl.ai.execution.AgentExecution.provider.tooltip = LLM provider that served the model.
model.tl.ai.execution.AgentExecution.response = Response
model.tl.ai.execution.AgentExecution.response.tooltip = Final answer the run produced.
model.tl.ai.execution.AgentExecution.runId = Run ID
model.tl.ai.execution.AgentExecution.runId.tooltip = Technical identifier of the run. Correlates the run with its event stream and its log entries.
model.tl.ai.execution.AgentExecution.session = Session
model.tl.ai.execution.AgentExecution.session.tooltip = Session this run belongs to.
model.tl.ai.execution.AgentExecution.startedAt = Started at
model.tl.ai.execution.AgentExecution.startedAt.tooltip = When the run started.
model.tl.ai.execution.AgentExecution.status = Status
model.tl.ai.execution.AgentExecution.status.tooltip = Lifecycle state of the run.
model.tl.ai.execution.AgentExecution.stopReason = Stop reason
model.tl.ai.execution.AgentExecution.stopReason.tooltip = Why the agent loop stopped.
model.tl.ai.execution.AgentExecution.thinkingTokens = Thinking tokens
model.tl.ai.execution.AgentExecution.thinkingTokens.tooltip = Tokens spent on the model's reasoning output.
model.tl.ai.execution.AgentExecution.tooltip = One invocation of the agent loop. A sub-agent run is an execution with a parent execution set, so summing token counts over the parent subtree yields the true total of a run and its children.
model.tl.ai.execution.AgentExecution.transcript = Transcript
model.tl.ai.execution.AgentExecution.transcript.tooltip = Full message transcript of the run as JSON.
model.tl.ai.execution.AgentExecution.transcriptHtml = Transcript (rendered)
model.tl.ai.execution.AgentExecution.transcriptHtml.tooltip = The transcript of the run as a readable history: one section per turn, holding one block per text, thinking, tool call, approval, question, transaction, compaction, error and delegation part. Computed from the raw transcript, not stored.
model.tl.ai.execution.AgentSession = Agent session
model.tl.ai.execution.AgentSession.createdAt = Created at
model.tl.ai.execution.AgentSession.createdAt.tooltip = When the session was created.
model.tl.ai.execution.AgentSession.displayName = Name
model.tl.ai.execution.AgentSession.displayName.tooltip = Readable identity: the title of the session, or the owner and the creation time when it has no title. Computed, not editable.
model.tl.ai.execution.AgentSession.kind = Kind
model.tl.ai.execution.AgentSession.kind.tooltip = How the session was started.
model.tl.ai.execution.AgentSession.lastUpdated = Last updated
model.tl.ai.execution.AgentSession.lastUpdated.tooltip = When the session was last written to.
model.tl.ai.execution.AgentSession.memory = Memory
model.tl.ai.execution.AgentSession.memory.tooltip = Persisted conversation memory: the compacted history the agent is given on its next turn.
model.tl.ai.execution.AgentSession.metadata = Metadata
model.tl.ai.execution.AgentSession.metadata.tooltip = Additional session state as JSON, for example the agent's todo plan.
model.tl.ai.execution.AgentSession.owner = Owner
model.tl.ai.execution.AgentSession.owner.tooltip = Account the session belongs to. Empty for a run started under a system principal.
model.tl.ai.execution.AgentSession.status = Status
model.tl.ai.execution.AgentSession.status.tooltip = Free-text status of the session, maintained by the running agent.
model.tl.ai.execution.AgentSession.title = Title
model.tl.ai.execution.AgentSession.title.tooltip = Title of the session. Set for interactive chats; background, scheduled and script sessions have none.
model.tl.ai.execution.AgentSession.tooltip = Durable context of one agent conversation: cumulative memory, working state and presentation. An interactive chat is a session owned by a person; a background job is a session run under a system principal.
model.tl.ai.execution.AgentTask = Agent task
model.tl.ai.execution.AgentTask.content = Content
model.tl.ai.execution.AgentTask.content.tooltip = Full description of the task.
model.tl.ai.execution.AgentTask.displayName = Name
model.tl.ai.execution.AgentTask.displayName.tooltip = Readable identity: the position of the task in the plan and its subject. Computed, not editable.
model.tl.ai.execution.AgentTask.lastTouchedByExecution = Last touched by execution
model.tl.ai.execution.AgentTask.lastTouchedByExecution.tooltip = Run that last changed the task. Attribution only; the task belongs to the session, not to a run.
model.tl.ai.execution.AgentTask.ordinal = Ordinal
model.tl.ai.execution.AgentTask.ordinal.tooltip = Position of the task in the plan.
model.tl.ai.execution.AgentTask.session = Session
model.tl.ai.execution.AgentTask.session.tooltip = Session whose plan this task belongs to.
model.tl.ai.execution.AgentTask.status = Status
model.tl.ai.execution.AgentTask.status.tooltip = Progress of the task within the plan.
model.tl.ai.execution.AgentTask.subject = Subject
model.tl.ai.execution.AgentTask.subject.tooltip = One-line summary of what is to be done.
model.tl.ai.execution.AgentTask.taskId = Task ID
model.tl.ai.execution.AgentTask.taskId.tooltip = Technical identifier of the task within the plan.
model.tl.ai.execution.AgentTask.tooltip = One entry of the agent todo plan. Session-scoped: the plan is cumulative across every execution in the conversation, a sibling of the session memory.
model.tl.ai.execution.ExecutionStatus = Execution status
model.tl.ai.execution.ExecutionStatus.CANCELLED = Cancelled
model.tl.ai.execution.ExecutionStatus.CANCELLED.tooltip = The run was cancelled or aborted.
model.tl.ai.execution.ExecutionStatus.COMPLETE = Complete
model.tl.ai.execution.ExecutionStatus.COMPLETE.tooltip = The run finished normally.
model.tl.ai.execution.ExecutionStatus.ERROR = Error
model.tl.ai.execution.ExecutionStatus.ERROR.tooltip = The run failed.
model.tl.ai.execution.ExecutionStatus.REJECTED = Rejected
model.tl.ai.execution.ExecutionStatus.REJECTED.tooltip = The run was rejected by an approval decision.
model.tl.ai.execution.ExecutionStatus.RUNNING = Running
model.tl.ai.execution.ExecutionStatus.RUNNING.tooltip = The agent loop is currently running, or crashed without reaching a terminal state.
model.tl.ai.execution.ExecutionStatus.tooltip = Lifecycle state of an agent execution.
model.tl.ai.execution.InteractionRequest = Interaction request
model.tl.ai.execution.InteractionRequest.createdAt = Created at
model.tl.ai.execution.InteractionRequest.createdAt.tooltip = When the request was raised.
model.tl.ai.execution.InteractionRequest.displayName = Name
model.tl.ai.execution.InteractionRequest.displayName.tooltip = Readable identity: what is being asked, about what, and when. Computed, not editable.
model.tl.ai.execution.InteractionRequest.execution = Execution
model.tl.ai.execution.InteractionRequest.execution.tooltip = Run that raised the request.
model.tl.ai.execution.InteractionRequest.header = Header
model.tl.ai.execution.InteractionRequest.header.tooltip = Short summary of what is being asked.
model.tl.ai.execution.InteractionRequest.payload = Payload
model.tl.ai.execution.InteractionRequest.payload.tooltip = Type-specific detail as JSON, for example the tool call to approve or the options to choose from.
model.tl.ai.execution.InteractionRequest.prompt = Prompt
model.tl.ai.execution.InteractionRequest.prompt.tooltip = Full question text presented to the responder.
model.tl.ai.execution.InteractionRequest.requestId = Request ID
model.tl.ai.execution.InteractionRequest.requestId.tooltip = Technical identifier of the request. Correlates the answer with the run waiting for it.
model.tl.ai.execution.InteractionRequest.resolution = Resolution
model.tl.ai.execution.InteractionRequest.resolution.tooltip = The answer that was given.
model.tl.ai.execution.InteractionRequest.resolvedAt = Resolved at
model.tl.ai.execution.InteractionRequest.resolvedAt.tooltip = When the request was answered. Empty while it is pending.
model.tl.ai.execution.InteractionRequest.responder = Responder
model.tl.ai.execution.InteractionRequest.responder.tooltip = Account that answered, or is expected to answer.
model.tl.ai.execution.InteractionRequest.state = State
model.tl.ai.execution.InteractionRequest.state.tooltip = Lifecycle state of the request.
model.tl.ai.execution.InteractionRequest.tooltip = One human-in-the-loop request raised by a run: an approval, a question or a choice. Querying by responder and state PENDING yields an approval inbox across chats and background jobs.
model.tl.ai.execution.InteractionRequest.type = Type
model.tl.ai.execution.InteractionRequest.type.tooltip = What kind of answer the run is waiting for.
model.tl.ai.execution.InteractionState = Interaction state
model.tl.ai.execution.InteractionState.CANCELLED = Cancelled
model.tl.ai.execution.InteractionState.CANCELLED.tooltip = Withdrawn, for example because the run was aborted.
model.tl.ai.execution.InteractionState.PENDING = Pending
model.tl.ai.execution.InteractionState.PENDING.tooltip = Waiting for a response.
model.tl.ai.execution.InteractionState.RESOLVED = Resolved
model.tl.ai.execution.InteractionState.RESOLVED.tooltip = Answered by the responder.
model.tl.ai.execution.InteractionState.TIMED_OUT = Timed out
model.tl.ai.execution.InteractionState.TIMED_OUT.tooltip = No response within the allowed time.
model.tl.ai.execution.InteractionState.tooltip = Lifecycle state of an interaction request.
model.tl.ai.execution.InteractionType = Interaction type
model.tl.ai.execution.InteractionType.APPROVAL = Approval
model.tl.ai.execution.InteractionType.APPROVAL.tooltip = Approval of a tool call.
model.tl.ai.execution.InteractionType.CHOICE = Choice
model.tl.ai.execution.InteractionType.CHOICE.tooltip = Selection from a set of options.
model.tl.ai.execution.InteractionType.QUESTION = Question
model.tl.ai.execution.InteractionType.QUESTION.tooltip = Free-text question.
model.tl.ai.execution.InteractionType.tooltip = Kind of human-in-the-loop request.
model.tl.ai.execution.MemoryKind = Memory kind
model.tl.ai.execution.MemoryKind.FACT = Fact
model.tl.ai.execution.MemoryKind.FACT.tooltip = Something that is the case about this user or their work.
model.tl.ai.execution.MemoryKind.FEEDBACK = Feedback
model.tl.ai.execution.MemoryKind.FEEDBACK.tooltip = A judgement this user passed on the work, to be honoured next time.
model.tl.ai.execution.MemoryKind.PREFERENCE = Preference
model.tl.ai.execution.MemoryKind.PREFERENCE.tooltip = How this user wants to be served.
model.tl.ai.execution.MemoryKind.tooltip = What kind of thing the agent kept about the user.
model.tl.ai.execution.SessionKind = Session kind
model.tl.ai.execution.SessionKind.BACKGROUND = Background
model.tl.ai.execution.SessionKind.BACKGROUND.tooltip = Background job without an interactive surface.
model.tl.ai.execution.SessionKind.CHAT = Chat
model.tl.ai.execution.SessionKind.CHAT.tooltip = Interactive chat with a person as owner.
model.tl.ai.execution.SessionKind.SCHEDULED = Scheduled
model.tl.ai.execution.SessionKind.SCHEDULED.tooltip = Run triggered by a scheduler.
model.tl.ai.execution.SessionKind.SCRIPT = Script
model.tl.ai.execution.SessionKind.SCRIPT.tooltip = Run started from a TL-Script function.
model.tl.ai.execution.SessionKind.tooltip = How an agent session was started.
model.tl.ai.execution.UserMemory = User memory
model.tl.ai.execution.UserMemory.createdAt = Created at
model.tl.ai.execution.UserMemory.createdAt.tooltip = When the memory was kept.
model.tl.ai.execution.UserMemory.displayName = Name
model.tl.ai.execution.UserMemory.displayName.tooltip = Readable identity: the kind and the beginning of the text. Computed, not editable.
model.tl.ai.execution.UserMemory.kind = Kind
model.tl.ai.execution.UserMemory.kind.tooltip = Whether this is a preference, a fact or feedback.
model.tl.ai.execution.UserMemory.owner = Owner
model.tl.ai.execution.UserMemory.owner.tooltip = The account this memory is about. No other account's agent reads it.
model.tl.ai.execution.UserMemory.runId = Run ID
model.tl.ai.execution.UserMemory.runId.tooltip = The agent run that wrote the memory.
model.tl.ai.execution.UserMemory.session = Session
model.tl.ai.execution.UserMemory.session.tooltip = The chat the memory came out of. Empty for a memory written by a headless run.
model.tl.ai.execution.UserMemory.text = Text
model.tl.ai.execution.UserMemory.text.tooltip = What is kept, in the words the agent stored it in.
model.tl.ai.execution.UserMemory.tooltip = One thing the agent keeps about one user, across conversations. Private to its owner, who sees it in a list and can delete it.
