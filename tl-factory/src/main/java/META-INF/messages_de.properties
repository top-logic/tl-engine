class.com.top_logic.factory.project.I18NConstants.ERROR_INVALID_GROUP_ID__VALUE = „{0}“ ist keine gültige Group-ID: Erwartet werden durch Punkte getrennte Namen aus Buchstaben, Ziffern und „_“, z. B. „com.example“.
