com.top_logic.tl.ai.core.tools.P.required = Erforderlich
com.top_logic.tl.ai.core.tools.P.required.tooltip = Ob dieser Parameter erforderlich ist. Der Standardwert ist true.
com.top_logic.tl.ai.core.tools.P.tooltip = Beschreibt einen Parameter einer <i>mit einer Werkzeugmethode kommentierten</i> Methode.
com.top_logic.tl.ai.core.tools.P.value = Wert
com.top_logic.tl.ai.core.tools.P.value.tooltip = Beschreibung des Parameters. Wird an das LLM gesendet.
com.top_logic.tl.ai.core.tools.ToolMethod = Werkzeug-Methode
com.top_logic.tl.ai.core.tools.ToolMethod.concurrencySafe = Gleichzeitigkeitssicher
com.top_logic.tl.ai.core.tools.ToolMethod.concurrencySafe.tooltip = Gibt an, ob dieses Werkzeug sicher parallel zu anderen parallelitätssicheren Werkzeugen ausgeführt werden kann. Der Standardwert ist false (fail-closed).
com.top_logic.tl.ai.core.tools.ToolMethod.description = Beschreibung
com.top_logic.tl.ai.core.tools.ToolMethod.description.tooltip = Beschreibung, was dieses Tool tut. Wird an das LLM gesendet. Mehrere Werte werden mit einem Zeilenumbruch verbunden.
com.top_logic.tl.ai.core.tools.ToolMethod.mode = Modus
com.top_logic.tl.ai.core.tools.ToolMethod.mode.tooltip = Welche Art von Zustandsänderung dieses Werkzeug vornimmt. Der Standardwert ist <i>global</i> (fail-closed).
com.top_logic.tl.ai.core.tools.ToolMethod.name = Name
com.top_logic.tl.ai.core.tools.ToolMethod.name.tooltip = Name des Werkzeugs. Standardmäßig wird der Name der Java-Methode verwendet, wenn er leer ist.
com.top_logic.tl.ai.core.tools.ToolMethod.tooltip = Markiert eine Methode als ein Werkzeug, das der Agent aufrufen kann.
com.top_logic.tl.ai.core.tools.ToolMode = Werkzeug-Modus
com.top_logic.tl.ai.core.tools.ToolMode.GLOBAL = Global
com.top_logic.tl.ai.core.tools.ToolMode.GLOBAL.tooltip = Das Tool nimmt Änderungen am gemeinsamen Anwendungsstatus vor (Modell, Layouts, Workflows).
com.top_logic.tl.ai.core.tools.ToolMode.READ = Lesen Sie
com.top_logic.tl.ai.core.tools.ToolMode.READ.tooltip = Das Tool liest nur Daten. Keine Änderungen, keine Genehmigung erforderlich.
com.top_logic.tl.ai.core.tools.ToolMode.USER_SCOPED = Benutzerdefiniert
com.top_logic.tl.ai.core.tools.ToolMode.USER_SCOPED.tooltip = Das Tool nimmt Änderungen vor, die nur für den aktuellen Benutzer gelten (temporäre Ansichten, persönliche Dashboards).
com.top_logic.tl.ai.core.tools.ToolMode.tooltip = Kategorisiert, welche Art von Zustandsänderung ein Werkzeug vornimmt.
