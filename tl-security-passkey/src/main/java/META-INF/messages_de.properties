class.com.top_logic.security.passkey.I18NConstants.ERROR_ALREADY_REGISTERED = Der Passkey ist bereits registriert.
class.com.top_logic.security.passkey.I18NConstants.ERROR_AUTHENTICATION_FAILED = Die Anmeldung mit dem Passkey ist fehlgeschlagen.
class.com.top_logic.security.passkey.I18NConstants.ERROR_INVALID_CEREMONY_DATA = Die Daten der Passwortanforderung konnten nicht verarbeitet werden.
class.com.top_logic.security.passkey.I18NConstants.ERROR_LABEL_MISSING = Der Passkey benötigt einen Namen.
class.com.top_logic.security.passkey.I18NConstants.ERROR_NO_RELYING_PARTY = Die vertrauende Partei der Passkeys kann nicht ermittelt werden: Sie ist weder konfiguriert, noch liegt eine Anfrage vor, aus der sie abgeleitet werden könnte.
class.com.top_logic.security.passkey.I18NConstants.ERROR_PASSKEYS_NOT_ALLOWED__ACCOUNT = Für den Zugang "{0}" sind Passkeys nicht zulässig.
class.com.top_logic.security.passkey.I18NConstants.ERROR_REGISTRATION_FAILED = Der Passkey konnte nicht registriert werden.
class.com.top_logic.security.passkey.I18NConstants.ERROR_REQUEST_EXPIRED = Die Anfrage nach dem Passkey ist abgelaufen oder wurde bereits beantwortet. Bitte versuchen Sie es erneut.
com.top_logic.security.passkey.PasskeyService = Passkey-Dienst
com.top_logic.security.passkey.PasskeyService.Config.origins = Ursprünge
com.top_logic.security.passkey.PasskeyService.Config.origins.tooltip = Die Ursprünge, auf denen der Browser eine Registrierung oder Anmeldung ausführen darf, z. B. <code>https://app.example.com</code>. <p> Leer: Das Schema, der Host und der Port der Anfrage, die eine Registrierung oder Anmeldung startet. </p>
com.top_logic.security.passkey.PasskeyService.Config.rp-id = ID der vertrauenden Partei
com.top_logic.security.passkey.PasskeyService.Config.rp-id.tooltip = Die ID der vertrauenden Partei: die Domäne, an die die Passkeys gebunden sind, z. B. <code>example.com</code>. <p> Ein Passkey kann nur auf dieser Domäne und ihren Subdomänen verwendet werden; eine Änderung macht daher alle registrierten Passkeys unbrauchbar. Leer: Der Hostname der Anfrage, die eine Registrierung oder Anmeldung startet. </p>
com.top_logic.security.passkey.PasskeyService.Config.rp-name = Name der vertrauenden Partei
com.top_logic.security.passkey.PasskeyService.Config.rp-name.tooltip = Der Name der vertrauenden Partei, der bei der Erstellung eines Passkeys von einem Authentifikator angezeigt wird. <p> Leer: Der Titel der Anwendung. </p>
com.top_logic.security.passkey.PasskeyService.Config.timeout = Zeitlimit
com.top_logic.security.passkey.PasskeyService.Config.timeout.tooltip = Wie lange der Browser darauf wartet, dass der Benutzer eine Registrierung oder Anmeldung bestätigt, und wie lange eine gestartete Registrierung oder Anmeldung angenommen wird.
com.top_logic.security.passkey.PasskeyService.Config.user-verification = Benutzerüberprüfung
com.top_logic.security.passkey.PasskeyService.Config.user-verification.tooltip = Ob ein Authentifikator seinen Benutzer (PIN, biometrische Daten) verifizieren muss, wenn ein Passkey registriert oder als zweiter Faktor verwendet wird. <p> Eine Anmeldung nur mit einem Passkey erfordert immer eine Benutzerüberprüfung. </p>
com.top_logic.security.passkey.PasskeyService.tooltip = Die vertrauende Partei der Passkeys (Web-Authentication-Credentials) der Zugänge: Sie registriert Passkeys und überprüft Anmeldungen anhand dieser. <p> Die ID der vertrauenden Partei und die akzeptierten Ursprünge werden entweder konfiguriert oder aus der Anfrage übernommen, die eine Registrierung oder Anmeldung startet: Der Hostname der Anfrage ist dann die ID der vertrauenden Partei, ihr Schema, Host und Port der einzig akzeptierte Ursprung. Eine lokale Installation funktioniert daher ohne Konfiguration; hinter einem Reverse-Proxy, der den ursprünglichen Host nicht weiterleitet, müssen beide konfiguriert werden. </p> <p> Registrierte Passkeys sind auffindbar, sodass eine Anmeldung ohne Benutzernamen möglich ist. Eine solche Anmeldung allein mit einem Passkey erfordert immer, dass der Authentifikator seinen Benutzer verifiziert (PIN, biometrische Daten), da der Passkey der einzige Nachweis ist. Registrierungen und Anmeldungen mit einem Passkey als zweitem Faktor nach dem Passwort erfordern die konfigurierte Benutzerüberprüfung. </p>
