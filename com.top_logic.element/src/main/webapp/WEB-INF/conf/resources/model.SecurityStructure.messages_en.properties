model.SecurityStructure = Central security
model.SecurityStructure.Root = Central security
model.SecurityStructure.Root.tooltip = The root object of the central security structure. It is created automatically as the root object of its module and cannot be deleted.
model.SecurityStructure.SecurityStructure.Root = Central security
model.SecurityStructure.SecurityStructure.Root.Hauptbenutzer = Main users
model.SecurityStructure.SecurityStructure.Root.Hauptbenutzer.tooltip = Accounts that are granted an extended global role by a role rule starting at the central security root. Typically used to give selected users additional permissions.
model.SecurityStructure.SecurityStructure.Root.Nutzer = Users
model.SecurityStructure.SecurityStructure.Root.Nutzer.tooltip = Accounts that are granted a global role by a role rule starting at the central security root. Typically used to give all users general access to the application.
model.SecurityStructure.SecurityStructure.Root.name = Name
model.SecurityStructure.SecurityStructure.Root.name.tooltip = Technical name of the security root object. Since the object is created automatically as root object of its module, the name is fixed.
model.SecurityStructure.SecurityStructure.Root.tooltip = Type of the root object of the central security structure. Role rules that grant permissions for the whole application start at this object.
model.SecurityStructure.tooltip = Module of the central security structure. Its root object is the anchor for permissions that are granted for the whole application and not for a single business object.
