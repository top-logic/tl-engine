com.top_logic.security.selfservice.invitation.InvitationLink = Invitation link
com.top_logic.security.selfservice.invitation.InvitationLink.Config.page = Page
com.top_logic.security.selfservice.invitation.InvitationLink.Config.page.tooltip = The page the link leads to, a path below the context path of the application starting with <code>/</code>, e.g. <code>/servlet/LayoutServlet</code>. <p> The page receives the token of the invitation in the request parameter <code>"invitation"</code>. Without a value, the link leads to the layout servlet of the classic user interface, whose login accepts the invitation. </p>
com.top_logic.security.selfservice.invitation.InvitationLink.tooltip = The link of an <i>invitation</i>, the page of the application where the invited person accepts it. <p> The link is the address of the application (the public address <code>"%HOST%"</code>, variable <code>tl_host</code>, or without one the address of the current request, and its context path <code>"%APP_CONTEXT%"</code>), the page and the token of the invitation in the request parameter <code>"invitation"</code>, e.g. <code>https://app.example.com/app/servlet/LayoutServlet?invitation=0123abcd-...</code>. With a configured public address, the link does not depend on a current request and can be built in any context, e.g. from a scheduled script. </p>
com.top_logic.security.selfservice.invitation.InvitationModule = Service module for invitations
com.top_logic.security.selfservice.invitation.InvitationModule.Config.authentication-device = Authentication device
com.top_logic.security.selfservice.invitation.InvitationModule.Config.authentication-device.tooltip = The ID of the <i>authentication device</i> on which an accepted invitation or a registration creates the account.
com.top_logic.security.selfservice.invitation.InvitationModule.Config.code-validity = Code validity
com.top_logic.security.selfservice.invitation.InvitationModule.Config.code-validity.tooltip = How long a verification code remains valid after it was created.
com.top_logic.security.selfservice.invitation.InvitationModule.Config.invitation-link = Invitation link
com.top_logic.security.selfservice.invitation.InvitationModule.Config.invitation-link.tooltip = The link of an invitation, the page of the application where the invited person accepts it. <p> By default, the link leads to the login of the classic user interface. </p>
com.top_logic.security.selfservice.invitation.InvitationModule.Config.invitation-mail = Invitation mail
com.top_logic.security.selfservice.invitation.InvitationModule.Config.invitation-mail.tooltip = The TL-Script expression sending the invitation mail. <p> The expression is called with the <i>invitation</i> object as first argument, the application title as second argument, and the invitation link as third argument. </p>
com.top_logic.security.selfservice.invitation.InvitationModule.Config.invitation-validity = Invitation validity
com.top_logic.security.selfservice.invitation.InvitationModule.Config.invitation-validity.tooltip = How long an invitation can be accepted after it was created or sent again.
com.top_logic.security.selfservice.invitation.InvitationModule.Config.password-reset-timeout = Password reset timeout
com.top_logic.security.selfservice.invitation.InvitationModule.Config.password-reset-timeout.tooltip = Time in milliseconds how long a password reset request is valid.
com.top_logic.security.selfservice.invitation.InvitationModule.Config.reset-mfa-mail = Reset multi-factor-authentication mail
com.top_logic.security.selfservice.invitation.InvitationModule.Config.reset-mfa-mail.tooltip = The TL-Script expression that sends an email when reset of the multi-factor authentication is requested. <p> The expression is called with the email as first argument, the application title as second argument, and the reset code as third argument. </p>
com.top_logic.security.selfservice.invitation.InvitationModule.Config.reset-password-mail = Reset password mail
com.top_logic.security.selfservice.invitation.InvitationModule.Config.reset-password-mail.tooltip = The TL-Script expression that sends an email when a password reset is requested. <p> The expression is called with the email as first argument, the application title as second argument, and the reset code as third argument. </p>
com.top_logic.security.selfservice.invitation.InvitationModule.Config.self-registration = Self registration
com.top_logic.security.selfservice.invitation.InvitationModule.Config.self-registration.tooltip = Whether and how visitors register an account of their own without an invitation.
com.top_logic.security.selfservice.invitation.InvitationModule.Config.verification-code-size = Verification code size
com.top_logic.security.selfservice.invitation.InvitationModule.Config.verification-code-size.tooltip = The number of digits that are used to create a verification code.
com.top_logic.security.selfservice.invitation.InvitationModule.Config.verification-mail = Verification mail
com.top_logic.security.selfservice.invitation.InvitationModule.Config.verification-mail.tooltip = The TL-Script expression sending the verification mail. <p> The expression is called with the <i>invitation</i> object as first argument, the application title as second argument, and the verification code as third argument. </p>
com.top_logic.security.selfservice.invitation.InvitationModule.tooltip = <i>Configured managed class</i> for elements in <code>"tl.security.selfservice"</code>. <p> Offers the UI-independent operations of the <i>invitation</i> lifecycle: an invitation is created and sent, it is open until it expires or is accepted, and an open or expired invitation can be renewed or sent again. An accepted invitation is kept as a record of the account created from it. </p> <p> Visitors register an account without an invitation through the self-registration. </p>
com.top_logic.security.selfservice.invitation.SelfRegistration$Config = Configuration
com.top_logic.security.selfservice.invitation.SelfRegistration$Config.tooltip = Configuration of the <i>self registration</i>, the option <i>Self registration</i> (<i>invitation module configuration</i>).
com.top_logic.security.selfservice.invitation.SelfRegistration.Config.approval-mail = Approval mail
com.top_logic.security.selfservice.invitation.SelfRegistration.Config.approval-mail.tooltip = The TL-Script expression telling a registered person that the registration has been approved. <p> The expression is called with the e-mail address of the registration as first argument, the application title as second argument, and the address of the login page of the application as third argument. It runs without access checks: the recipient is fixed by the registration. Without a value, no mail is sent. </p>
com.top_logic.security.selfservice.invitation.SelfRegistration.Config.callback = Callback
com.top_logic.security.selfservice.invitation.SelfRegistration.Config.callback.tooltip = Function called with each registered account before the registration is stored. <p> The function assigns e.g. roles or groups to the account. It answers <code>null</code> to accept the account, or an internationalizable value as the reason to refuse it, which rolls the registration back. It runs without access checks, since nobody is logged in. </p>
com.top_logic.security.selfservice.invitation.SelfRegistration.Config.captcha = Captcha
com.top_logic.security.selfservice.invitation.SelfRegistration.Config.captcha.tooltip = Whether a visitor must solve a captcha to request a verification code. <p> The captcha is checked by the <i>captcha service</i> of the module <code>tl-security-captcha</code>, which must be active then. </p>
com.top_logic.security.selfservice.invitation.SelfRegistration.Config.mode = Mode
com.top_logic.security.selfservice.invitation.SelfRegistration.Config.mode.tooltip = Whether visitors register an account of their own, and whether an administrator must approve it before it can log in.
com.top_logic.security.selfservice.invitation.SelfRegistration.Config.registration-exists-mail = Registration exists mail
com.top_logic.security.selfservice.invitation.SelfRegistration.Config.registration-exists-mail.tooltip = The TL-Script expression sent instead of the verification code when an account with the address exists already. <p> The expression is called with the e-mail address as first argument and the application title as second argument. It runs without access checks, since nobody is logged in. An answer <code>false</code> means that the mail was not sent. </p>
com.top_logic.security.selfservice.invitation.SelfRegistration.Config.registration-mail = Registration mail
com.top_logic.security.selfservice.invitation.SelfRegistration.Config.registration-mail.tooltip = The TL-Script expression sending the verification code of a registration. <p> The expression is called with the e-mail address as first argument, the application title as second argument, and the verification code as third argument. It runs without access checks, since nobody is logged in. An answer <code>false</code> means that the mail was not sent. </p>
com.top_logic.security.selfservice.invitation.SelfRegistrationMode = Self registration mode
com.top_logic.security.selfservice.invitation.SelfRegistrationMode.APPROVAL = Approval
com.top_logic.security.selfservice.invitation.SelfRegistrationMode.APPROVAL.tooltip = A registered account is locked until an administrator approves the registration.
com.top_logic.security.selfservice.invitation.SelfRegistrationMode.DIRECT = Direct
com.top_logic.security.selfservice.invitation.SelfRegistrationMode.DIRECT.tooltip = A registered account can log in right away.
com.top_logic.security.selfservice.invitation.SelfRegistrationMode.OFF = Off
com.top_logic.security.selfservice.invitation.SelfRegistrationMode.OFF.tooltip = Visitors cannot register an account.
com.top_logic.security.selfservice.invitation.SelfRegistrationMode.tooltip = Whether and how visitors register an account of their own without an invitation.
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.emailRefusal = Refusal of an e-mail address
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.emailRefusal.param.email.tooltip = The address to check.
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.emailRefusal.return = The message telling that the address is invalid; <code>null</code> if it is valid.
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.emailRefusal.tooltip = Why a value is not accepted as e-mail address of an invitation or a registration.
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.refusal = Refusal of an invitation
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.refusal.param.token.tooltip = The token from the invitation link.
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.refusal.return = The message telling that there is no invitation with the token, or that it has expired or has been accepted; <code>null</code> if the invitation is open.
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.refusal.tooltip = The reason why the invitation of a link cannot be accepted. <p> The page an invitation link leads to shows the reason to the visitor, who is not logged in. The lookup does not depend on access rights: the token of the link is the proof. </p>
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.renew = Renew invitation
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.renew.param.invitation.tooltip = The invitation to renew.
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.renew.tooltip = Gives an open or expired invitation a new link and a new expiry date, without sending it. <p> The previous link of the invitation is no longer valid. An accepted invitation is refused. </p>
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.resend = Send invitation again
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.resend.param.invitation.tooltip = The invitation to send again.
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.resend.return = The result of the invitation mail script, by default whether the mail was sent.
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.resend.tooltip = Sends an open or expired invitation again. <p> An open invitation is sent with its link, an expired invitation is renewed first and sent with a new link and a new expiry date. An accepted invitation is refused. </p>
com.top_logic.security.selfservice.invitation.script.RegistrationFunctions.approve = Approve registration
com.top_logic.security.selfservice.invitation.script.RegistrationFunctions.approve.param.registration.tooltip = The registration to approve.
com.top_logic.security.selfservice.invitation.script.RegistrationFunctions.approve.return = The result of the approval mail script, by default whether the mail was sent; <code>null</code> if no approval mail is configured.
com.top_logic.security.selfservice.invitation.script.RegistrationFunctions.approve.tooltip = Approves a pending registration: unlocks the registered account and sends the approval mail. <p> An approved registration is refused. </p>
com.top_logic.security.selfservice.invitation.script.RegistrationFunctions.enabled = Registration enabled
com.top_logic.security.selfservice.invitation.script.RegistrationFunctions.enabled.return = <code>true</code> if registration is switched on and the application can send mails.
com.top_logic.security.selfservice.invitation.script.RegistrationFunctions.enabled.tooltip = Whether visitors can register an account of their own in this application.
com.top_logic.security.selfservice.invitation.script.RegistrationFunctions.pending = Pending registration
com.top_logic.security.selfservice.invitation.script.RegistrationFunctions.pending.param.account.tooltip = The account.
com.top_logic.security.selfservice.invitation.script.RegistrationFunctions.pending.return = The pending registration of the account; <code>null</code> if the account was not registered by its owner or its registration is approved.
com.top_logic.security.selfservice.invitation.script.RegistrationFunctions.pending.tooltip = The registration of an account that waits for its approval.
com.top_logic.security.selfservice.invitation.script.SendInvitation$Builder = Builder
com.top_logic.security.selfservice.invitation.script.SendInvitation$Builder.tooltip = <i>Method builder</i> for <i>send invitations</i>.
