com.top_logic.credential.oauth.ClientAssertionAuthentication = Client assertion authentication
com.top_logic.credential.oauth.ClientAssertionAuthentication.Config.assertion = Assertion
com.top_logic.credential.oauth.ClientAssertionAuthentication.Config.assertion-type = Assertion type
com.top_logic.credential.oauth.ClientAssertionAuthentication.Config.assertion-type.tooltip = The format of the assertion.
com.top_logic.credential.oauth.ClientAssertionAuthentication.Config.assertion.tooltip = The assertion identifying the client, typically a file with a token issued by the platform.
com.top_logic.credential.oauth.ClientAssertionAuthentication.tooltip = <i>Client authentication</i> with an assertion issued by a third party (RFC 7521 §4.2). <p> This is workload identity: the platform running the application issues a short-lived token identifying it, and the authorization server trusts that token issuer for the client. The application owns no secret. A Kubernetes pod gets such a token as projected service account token, refreshed by the kubelet in a file; with a <i>file secret source</i> the current content is sent with each token request: </p> <pre> &lt;client-authentication class="com.top_logic.credential.oauth.ClientAssertionAuthentication"&gt; &lt;assertion class="com.top_logic.basic.credential.FileSecretSource" path="/var/run/secrets/tokens/keycloak"/&gt; &lt;/client-authentication&gt; </pre> <p> In Azure AKS with workload identity, the token file is named by the environment variable <code>AZURE_FEDERATED_TOKEN_FILE</code>, referenced through an alias (<code>path="%AZURE_FEDERATED_TOKEN_FILE%"</code>) defined in the application configuration as <code>&lt;entry name="%AZURE_FEDERATED_TOKEN_FILE%" value="${env:AZURE_FEDERATED_TOKEN_FILE}"/&gt;</code>. </p>
com.top_logic.credential.oauth.ClientAuthentication.createAuthentication = Create authentication
com.top_logic.credential.oauth.ClientAuthentication.createAuthentication.param.clientId.tooltip = The identifier of the client at the authorization server.
com.top_logic.credential.oauth.ClientAuthentication.createAuthentication.param.tokenEndpoint.tooltip = The token endpoint of the authorization server, the audience of a signed assertion.
com.top_logic.credential.oauth.ClientAuthentication.createAuthentication.return = The authentication to add to the request.
com.top_logic.credential.oauth.ClientAuthentication.createAuthentication.tooltip = Creates the authentication of the client with the given identifier for one request. <p> Called for each request, so that a rotated secret takes effect and a signed assertion is fresh. </p>
com.top_logic.credential.oauth.ClientCredentialsProvider = Client credentials provider
com.top_logic.credential.oauth.ClientCredentialsProvider.tooltip = <i>Credential provider</i> authenticating requests with an access token obtained by the OAuth 2.0 client credentials grant (RFC 6749 §4.4). <p> The application authenticates itself as client at an authorization server and receives a short-lived access token, which is sent as bearer token. The token is cached and renewed before it expires (see <i>token cache</i>). A typical setup lets the application call a central API gateway with such a token, while the gateway holds the keys of the external services. </p> <p> The grant is only available to confidential clients, so a client authentication is required. </p> <p> Workload identity in Kubernetes: the client authenticates with the projected service account token of its pod, so the application owns no secret at all. The authorization server (here a Keycloak realm) trusts the cluster's token issuer for this client: </p> <pre> &lt;credentials class="com.top_logic.credential.oauth.ClientCredentialsProvider" issuer="https://login.example.com/realms/my-realm" client-id="my-app" &gt; &lt;client-authentication class="com.top_logic.credential.oauth.ClientAssertionAuthentication"&gt; &lt;assertion class="com.top_logic.basic.credential.FileSecretSource" path="/var/run/secrets/tokens/keycloak"/&gt; &lt;/client-authentication&gt; &lt;/credentials&gt; </pre> <p> Azure AKS workload identity is the same setup against <code>token-url="https://login.microsoftonline.com/&lt;tenant&gt;/oauth2/v2.0/token"</code> with <code>scope="&lt;resource&gt;/.default"</code>, the assertion read from the file named by the environment variable <code>AZURE_FEDERATED_TOKEN_FILE</code> through an alias (<code>path="%AZURE_FEDERATED_TOKEN_FILE%"</code>, defined as <code>&lt;entry name="%AZURE_FEDERATED_TOKEN_FILE%" value="${env:AZURE_FEDERATED_TOKEN_FILE}"/&gt;</code>). </p> <p> Authentication with a private key (<code>private_key_jwt</code>), whose public key is registered for the client: </p> <pre> &lt;credentials class="com.top_logic.credential.oauth.ClientCredentialsProvider" issuer="https://login.example.com/realms/my-realm" client-id="my-app" &gt; &lt;client-authentication class="com.top_logic.credential.oauth.PrivateKeyJwtAuthentication" algorithm="ES256" key-id="my-app-2026" &gt; &lt;private-key class="com.top_logic.basic.credential.FileSecretSource" path="/run/secrets/my-app-key.pem"/&gt; &lt;/client-authentication&gt; &lt;/credentials&gt; </pre> <p> Authentication with a client secret, requesting a token for a specific audience: </p> <pre> &lt;credentials class="com.top_logic.credential.oauth.ClientCredentialsProvider" token-url="https://login.example.com/realms/my-realm/protocol/openid-connect/token" client-id="my-app" scope="llm" &gt; &lt;client-authentication class="com.top_logic.credential.oauth.ClientSecretAuthentication" method="basic"&gt; &lt;secret name="MY_APP_CLIENT_SECRET"/&gt; &lt;/client-authentication&gt; &lt;parameters&gt; &lt;parameter name="audience" value="llm-gateway"/&gt; &lt;/parameters&gt; &lt;/credentials&gt; </pre>
com.top_logic.credential.oauth.ClientSecretAuthentication = Client secret authentication
com.top_logic.credential.oauth.ClientSecretAuthentication$Method = Method
com.top_logic.credential.oauth.ClientSecretAuthentication$Method.tooltip = How the client secret is sent to the authorization server.
com.top_logic.credential.oauth.ClientSecretAuthentication.Config.method = Method
com.top_logic.credential.oauth.ClientSecretAuthentication.Config.method.tooltip = How the secret is sent to the authorization server.
com.top_logic.credential.oauth.ClientSecretAuthentication.Config.secret = Secret
com.top_logic.credential.oauth.ClientSecretAuthentication.Config.secret.tooltip = The client secret.
com.top_logic.credential.oauth.ClientSecretAuthentication.Method.BASIC = HTTP basic authentication
com.top_logic.credential.oauth.ClientSecretAuthentication.Method.BASIC.tooltip = HTTP basic authentication with the form-encoded client identifier and secret as user and password (<code>client_secret_basic</code>).
com.top_logic.credential.oauth.ClientSecretAuthentication.Method.POST = Request body
com.top_logic.credential.oauth.ClientSecretAuthentication.Method.POST.tooltip = The client identifier and secret as parameters <code>client_id</code> and <code>client_secret</code> of the request body (<code>client_secret_post</code>).
com.top_logic.credential.oauth.ClientSecretAuthentication.tooltip = <i>Client authentication</i> with a client secret (RFC 6749 §2.3.1). <pre> &lt;client-authentication class="com.top_logic.credential.oauth.ClientSecretAuthentication" method="basic"&gt; &lt;secret class="com.top_logic.basic.credential.FileSecretSource" path="/run/secrets/client-secret"/&gt; &lt;/client-authentication&gt; </pre>
com.top_logic.credential.oauth.DeviceLoginProvider = Device login provider
com.top_logic.credential.oauth.DeviceLoginProvider.Config.device-authorization-url = Device authorization URL
com.top_logic.credential.oauth.DeviceLoginProvider.Config.device-authorization-url.tooltip = URL of the device authorization endpoint of the authorization server. <p> If empty, the endpoint is read from the discovery document of the issuer. </p>
com.top_logic.credential.oauth.DeviceLoginProvider.Config.refresh-token-store = Refresh token store
com.top_logic.credential.oauth.DeviceLoginProvider.Config.refresh-token-store.tooltip = Storage of the refresh token, so that a restarted application needs no new login. <p> If not given, the refresh token is kept in memory only. </p>
com.top_logic.credential.oauth.DeviceLoginProvider.tooltip = <i>Credential provider</i> authenticating requests with a personal access token of a user, who confirms the login once in a browser (OAuth 2.0 device authorization grant, RFC 8628). <p> Meant for development: a developer's application calls an API gateway with a token of the developer instead of holding a key of the external service. The client is typically a public client without client authentication. </p> <p> A token is obtained in this order: </p> <ol> <li>The cached access token, while it is valid.</li> <li>A new access token for the refresh token received last, or the refresh token in the configured store after a restart.</li> <li>A device login: the first request without a usable token starts the login in the background and fails with a message naming the URL to open and the code to confirm. The same instruction is logged as warning. Further requests fail with the same message until the user has confirmed the login; then the next request is authenticated. A denied or expired login is followed by a new one on the next request.</li> </ol> <p> Each token response with a refresh token updates the store, since the authorization server may issue a new refresh token with each use. A refresh token rejected by the server is removed from the store and a new device login starts. </p> <p> The scope <code>offline_access</code> lets the authorization server issue an offline refresh token. A regular refresh token is bound to the user's login session at the server and becomes invalid with it, e.g. after a few hours or when the user logs out in the browser. An offline token stays valid until it is unused for a longer period or revoked, so restarts of the application need no new login for days or weeks. </p> <p> A developer's configuration against a Keycloak realm, keeping the refresh token in the home directory of the developer: </p> <pre> &lt;credentials class="com.top_logic.credential.oauth.DeviceLoginProvider" issuer="https://login.example.com/realms/my-realm" client-id="dev-gateway" scope="openid offline_access" &gt; &lt;refresh-token-store class="com.top_logic.credential.oauth.FileRefreshTokenStore"/&gt; &lt;/credentials&gt; </pre> <p> The device code, access token and refresh token never appear in a log message or exception message, only the URL to open and the code the user confirms there. </p>
com.top_logic.credential.oauth.FileRefreshTokenStore = File refresh token store
com.top_logic.credential.oauth.FileRefreshTokenStore.Config.path = Path
com.top_logic.credential.oauth.FileRefreshTokenStore.Config.path.tooltip = Path of the file holding the refresh token. <p> If empty, the file is located in the directory <code>.config/toplogic/oauth</code> of the user's home directory and named after the authorization server and the client. </p>
com.top_logic.credential.oauth.FileRefreshTokenStore.tooltip = <i>Refresh token store</i> keeping the refresh token of a client in a file readable only by its owner. <pre> &lt;refresh-token-store class="com.top_logic.credential.oauth.FileRefreshTokenStore"/&gt; </pre> <p> Without a configured path, the file is <code>~/.config/toplogic/oauth/&lt;server&gt;__&lt;client&gt;.json</code> in the home directory of the user running the application, where server and client are the identifier of the authorization server and the client identifier, with every character other than letters, digits, dot and hyphen replaced by an underscore. All applications of the user against the same client share the file, so that one login serves all of them. </p> <p> The file is a JSON object holding the token together with the server and client it belongs to. A file whose server or client does not match is ignored and overwritten by the next token. On file systems with POSIX permissions, the file is readable and writable only by its owner (0600), and directories created for it are accessible only by their owner (0700). The file is replaced atomically, so that a concurrent reader never sees a partially written token. </p>
com.top_logic.credential.oauth.JwsAlgorithm = JWS algorithm
com.top_logic.credential.oauth.JwsAlgorithm.ES256 = ES256
com.top_logic.credential.oauth.JwsAlgorithm.ES256.tooltip = ECDSA with the curve P-256 and SHA-256.
com.top_logic.credential.oauth.JwsAlgorithm.ES384 = ES384
com.top_logic.credential.oauth.JwsAlgorithm.ES384.tooltip = ECDSA with the curve P-384 and SHA-384.
com.top_logic.credential.oauth.JwsAlgorithm.ES512 = ES512
com.top_logic.credential.oauth.JwsAlgorithm.ES512.tooltip = ECDSA with the curve P-521 and SHA-512.
com.top_logic.credential.oauth.JwsAlgorithm.PS256 = PS256
com.top_logic.credential.oauth.JwsAlgorithm.PS256.tooltip = RSASSA-PSS with SHA-256, signed with an RSA key.
com.top_logic.credential.oauth.JwsAlgorithm.PS384 = PS384
com.top_logic.credential.oauth.JwsAlgorithm.PS384.tooltip = RSASSA-PSS with SHA-384, signed with an RSA key.
com.top_logic.credential.oauth.JwsAlgorithm.PS512 = PS512
com.top_logic.credential.oauth.JwsAlgorithm.PS512.tooltip = RSASSA-PSS with SHA-512, signed with an RSA key.
com.top_logic.credential.oauth.JwsAlgorithm.RS256 = RS256
com.top_logic.credential.oauth.JwsAlgorithm.RS256.tooltip = RSASSA-PKCS1-v1_5 with SHA-256, signed with an RSA key.
com.top_logic.credential.oauth.JwsAlgorithm.RS384 = RS384
com.top_logic.credential.oauth.JwsAlgorithm.RS384.tooltip = RSASSA-PKCS1-v1_5 with SHA-384, signed with an RSA key.
com.top_logic.credential.oauth.JwsAlgorithm.RS512 = RS512
com.top_logic.credential.oauth.JwsAlgorithm.RS512.tooltip = RSASSA-PKCS1-v1_5 with SHA-512, signed with an RSA key.
com.top_logic.credential.oauth.JwsAlgorithm.tooltip = Signature algorithm of a client assertion (RFC 7518 §3.1). <p> The constant names are the algorithm names of the JSON web signature. </p>
com.top_logic.credential.oauth.OAuthClient = OAuth client
com.top_logic.credential.oauth.OAuthClient.tooltip = An OAuth 2.0 client at an authorization server: creates the token requests of the Nimbus OAuth 2.0 SDK with the client's identity, credentials, scope and parameters, and sends them. <p> The building block of credential providers that obtain tokens with any grant type. A provider requests a token for its grant and keeps it in a <i>token cache</i>. </p>
com.top_logic.credential.oauth.OAuthClientConfig.client-authentication = Client authentication
com.top_logic.credential.oauth.OAuthClientConfig.client-authentication.tooltip = How the client proves its identity to the authorization server. <p> If not given, the client is a public client that sends only its identifier. </p>
com.top_logic.credential.oauth.OAuthClientConfig.client-id = Client ID
com.top_logic.credential.oauth.OAuthClientConfig.client-id.tooltip = Identifier of the client at the authorization server.
com.top_logic.credential.oauth.OAuthClientConfig.default-token-lifetime = Default token lifetime
com.top_logic.credential.oauth.OAuthClientConfig.default-token-lifetime.tooltip = Assumed lifetime of an access token whose lifetime the authorization server does not specify. <p> When a service rejects such a token earlier, the consumer invalidates it and a new token is requested. </p>
com.top_logic.credential.oauth.OAuthClientConfig.parameters = Parameters
com.top_logic.credential.oauth.OAuthClientConfig.parameters.tooltip = Additional parameters of the token request, e.g. <code>audience</code> or <code>resource</code> (RFC 8707) to select the service the token is meant for.
com.top_logic.credential.oauth.OAuthClientConfig.renewal-margin = Renewal margin
com.top_logic.credential.oauth.OAuthClientConfig.renewal-margin.tooltip = Time before the end of the lifetime of an access token when it is renewed. <p> At most half of the token's lifetime is used as margin, so that short-lived tokens are still used for a while. </p>
com.top_logic.credential.oauth.OAuthClientConfig.scope = Scope
com.top_logic.credential.oauth.OAuthClientConfig.scope.tooltip = Space-separated scopes requested for the access token, e.g. <code>https://cognitiveservices.azure.com/.default</code> for Azure. <p> If empty, the authorization server grants its default scope. </p>
com.top_logic.credential.oauth.OAuthServer = OAuth server
com.top_logic.credential.oauth.OAuthServer.tooltip = Connection to an OAuth 2.0 authorization server. <p> Locates the endpoints of the server, either from the configured token URL or from the discovery document of the issuer (OIDC Discovery, RFC 8414), and sends the requests of the Nimbus OAuth 2.0 SDK to them with the configured timeouts. </p> <p> The discovery document is fetched once on first use and kept. A failed fetch is not kept, the next use tries again. </p> <p> No exception thrown by this class contains a request parameter or the content of a response, since these may carry secrets or tokens. Error responses are reported with their HTTP status and their error code and description. </p>
com.top_logic.credential.oauth.OAuthServerConfig.connect-timeout = Connect timeout
com.top_logic.credential.oauth.OAuthServerConfig.connect-timeout.tooltip = Maximum time for establishing a connection to the authorization server.
com.top_logic.credential.oauth.OAuthServerConfig.issuer = Issuer
com.top_logic.credential.oauth.OAuthServerConfig.issuer.tooltip = Identifier (URL) of the authorization server, e.g. <code>https://login.example.com/realms/my-realm</code> for a Keycloak realm. <p> The endpoints of the server are read from its discovery document at <code>&lt;issuer&gt;/.well-known/openid-configuration</code>. Either the issuer or the token URL must be given. </p>
com.top_logic.credential.oauth.OAuthServerConfig.request-timeout = Request timeout
com.top_logic.credential.oauth.OAuthServerConfig.request-timeout.tooltip = Maximum time to wait for the response of the authorization server, after the connection has been established.
com.top_logic.credential.oauth.OAuthServerConfig.token-url = Token URL
com.top_logic.credential.oauth.OAuthServerConfig.token-url.tooltip = URL of the token endpoint of the authorization server. <p> Either the token URL or the issuer must be given. </p>
com.top_logic.credential.oauth.PrivateKeyJwtAuthentication = Private key JWT authentication
com.top_logic.credential.oauth.PrivateKeyJwtAuthentication.Config.algorithm = Algorithm
com.top_logic.credential.oauth.PrivateKeyJwtAuthentication.Config.algorithm.tooltip = The signature algorithm, which determines the type of the private key.
com.top_logic.credential.oauth.PrivateKeyJwtAuthentication.Config.assertion-lifetime = Assertion lifetime
com.top_logic.credential.oauth.PrivateKeyJwtAuthentication.Config.assertion-lifetime.tooltip = Time until the assertion expires.
com.top_logic.credential.oauth.PrivateKeyJwtAuthentication.Config.key-id = Key ID
com.top_logic.credential.oauth.PrivateKeyJwtAuthentication.Config.key-id.tooltip = Identifier of the key, sent in the header of the assertion. <p> Allows the authorization server to select the public key when several keys are registered for the client, e.g. during a key rotation. If empty, the identifier of a JSON web key is used. </p>
com.top_logic.credential.oauth.PrivateKeyJwtAuthentication.Config.private-key = Private key
com.top_logic.credential.oauth.PrivateKeyJwtAuthentication.Config.private-key.tooltip = The private key of the client in PKCS#8 PEM format (<code>-----BEGIN PRIVATE KEY-----</code>) or as JSON web key (JWK) including its private part.
com.top_logic.credential.oauth.PrivateKeyJwtAuthentication.tooltip = <i>Client authentication</i> with a JSON web token signed by the client's private key (<code>private_key_jwt</code>, RFC 7523 §2.2). <p> For each request a new assertion is created with the client identifier as issuer and subject, the token endpoint as audience, a random identifier and a short lifetime. The public key is registered for the client at the authorization server, the private key never leaves the application. </p> <pre> &lt;client-authentication class="com.top_logic.credential.oauth.PrivateKeyJwtAuthentication" algorithm="ES256" key-id="my-app-2026" &gt; &lt;private-key class="com.top_logic.basic.credential.FileSecretSource" path="/run/secrets/my-app-key.pem"/&gt; &lt;/client-authentication&gt; </pre> <p> A matching key pair is created with <code>openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out my-app-key.pem</code> (ES256) or <code>openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out my-app-key.pem</code> (RS256), the public key to register with <code>openssl pkey -in my-app-key.pem -pubout</code>. Instead of a PEM file, the private key can be given as JSON web key (JWK) with its private part, as exported e.g. by a key management service. </p>
com.top_logic.credential.oauth.RefreshTokenStore.clear = Clear
com.top_logic.credential.oauth.RefreshTokenStore.clear.param.clientId.tooltip = The identifier of the client at the server.
com.top_logic.credential.oauth.RefreshTokenStore.clear.param.server.tooltip = The identifier of the authorization server.
com.top_logic.credential.oauth.RefreshTokenStore.clear.tooltip = Removes the stored refresh token of the given client.
com.top_logic.credential.oauth.RefreshTokenStore.load = Load
com.top_logic.credential.oauth.RefreshTokenStore.load.param.clientId.tooltip = The identifier of the client at the server.
com.top_logic.credential.oauth.RefreshTokenStore.load.param.server.tooltip = The identifier of the authorization server.
com.top_logic.credential.oauth.RefreshTokenStore.load.return = The refresh token, or <code>null</code> if none is stored.
com.top_logic.credential.oauth.RefreshTokenStore.load.tooltip = The stored refresh token of the given client.
com.top_logic.credential.oauth.RefreshTokenStore.store = Store
com.top_logic.credential.oauth.RefreshTokenStore.store.param.clientId.tooltip = The identifier of the client at the server.
com.top_logic.credential.oauth.RefreshTokenStore.store.param.refreshToken.tooltip = The refresh token.
com.top_logic.credential.oauth.RefreshTokenStore.store.param.server.tooltip = The identifier of the authorization server.
com.top_logic.credential.oauth.RefreshTokenStore.store.tooltip = Stores the refresh token of the given client, replacing the token stored before.
