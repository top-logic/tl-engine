com.top_logic.bpe.view.BpmnEditorElement = Bpmn editor element
com.top_logic.bpe.view.BpmnEditorElement.Config.diagram = Diagram
com.top_logic.bpe.view.BpmnEditorElement.Config.diagram.tooltip = Optional channel receiving the changed diagram as BPMN XML. <p> The channel holds <code>null</code> while the diagram shows the stored model, and the BPMN XML of the whole diagram after the user changed it in an editable diagram. A view saves the change with <code>bpmlUpdateFromDiagram($workflow, $diagram)</code> in a <code>&lt;with-transaction&gt;</code> of an action chain. The element resets the channel to <code>null</code> when another workflow is shown or the shown one was changed in the knowledge base in a way the diagram shows; a change of an application specific extension of an element (its form, its step view, ...) keeps the change. A <code>null</code> written from outside discards the change. </p>
com.top_logic.bpe.view.BpmnEditorElement.Config.editable = Editable
com.top_logic.bpe.view.BpmnEditorElement.Config.editable.tooltip = Whether the user may change the diagram. <p> The expression sees the workflow of the input as a variable named after the channel, or by its <code>as</code> name, and is evaluated again whenever another workflow is shown or the shown one is changed. An editable diagram is shown in the bpmn-js modeler with its palette and context pad, any other one in a viewer that can be moved and zoomed only. </p> <pre> editable="$workflow.get(`tl.bpe.bpml:Collaboration#state`) == `tl.bpe.bpml:ApprovalState#Development`" </pre>
com.top_logic.bpe.view.BpmnEditorElement.Config.input.tooltip = The channel holding the workflow definition (<code>tl.bpe.bpml:Collaboration</code>) whose diagram is shown. <p> Another value than a collaboration shows an empty canvas. </p>
com.top_logic.bpe.view.BpmnEditorElement.Config.selection = Selection
com.top_logic.bpe.view.BpmnEditorElement.Config.selection.tooltip = Optional channel holding the selected element of the diagram. <p> The element the user clicks is written there as the model element of the workflow (a task, a gateway, an event, a lane, a sequence flow, ...), a click on the empty canvas as the collaboration itself. A model element of the shown workflow written there by another element of the view is shown selected; any other value shows no selection and is left alone. When another workflow is shown, a selected element of the previous one is replaced with <code>null</code>. </p>
com.top_logic.bpe.view.BpmnEditorElement.tooltip = <i>UI element</i> showing the BPMN diagram of a workflow definition (a <i>collaboration</i>), drawn with bpmn-js, and editing it where the view allows it. <p> The element shows the collaboration of its input channel and follows that collaboration being changed in the knowledge base: the diagram is then drawn anew from the model. The element of the diagram the user clicks is written to the selection channel, and an element written there by someone else is shown selected. </p> <p> An editable diagram is shown in the bpmn-js modeler. Every change the user makes is published as the BPMN XML of the whole diagram on the diagram channel, which holds <code>null</code> while the diagram shows the model as it is stored. The element does not store a change itself: a view saves the diagram with an action chain calling <code>bpmlUpdateFromDiagram($workflow, $diagram)</code> inside a <code>&lt;with-transaction&gt;</code>. The update changes the collaboration in the knowledge base, upon which the element draws the stored model and resets the diagram channel. Writing <code>null</code> to the diagram channel from outside discards the changes. </p> <p> While a change is not saved, the element blocks the write of its input channel like a form with unsaved input does: the user is asked whether to discard the change before another collaboration is shown, and so is the user leaving the enclosing dirty-tracked scope. The question offers no "save", because saving is the business of the view's action chain. </p>
com.top_logic.bpe.view.StepViewFunctions.defaultStepView = Default step view
com.top_logic.bpe.view.StepViewFunctions.defaultStepView.param.task.tooltip = The task node of a workflow.
com.top_logic.bpe.view.StepViewFunctions.defaultStepView.return = The view configuration, the value of a <code>tl.view:ViewDefinition</code> attribute.
com.top_logic.bpe.view.StepViewFunctions.defaultStepView.tooltip = The step view of a task that has none of its own. <p> The view declares the channels of a step view and shows a form on the process execution with a field for each attribute the model type of the task's participant declares itself. The task screen shows it for a task without a step view, and the workflow administration stores it as the initial step view of a task about to be designed. </p>
