com.top_logic.reporting.report.view.component.AbstractFilterChartComponent.Config.postCreationClassName.tooltip = Handler, der nach dem Erzeugen des Diagramms zusätzliche Operationen ausführt.
com.top_logic.reporting.report.view.component.AbstractFilterChartComponent.tooltip = Diese abstrakte Diagrammkomponente arbeitet mit der <i>Filterkomponente</i> zusammen. Verwenden Sie eine <i>Filterkomponente</i> als Master dieser Komponente und die Ereignisbehandlung wird für Sie verwaltet. Im Filterwertobjekt werden alle notwendigen Informationen zur Erzeugung des Charts gespeichert.
com.top_logic.reporting.report.view.component.AbstractFilterComponent = Filter-Bauteil
com.top_logic.reporting.report.view.component.AbstractFilterComponent.tooltip = Diese abstrakte Filterkomponente arbeitet mit der <i>Filterdiagramm-Komponente</i> zusammen. Verwenden Sie diese Komponente als Master einer Unterklasse der <i>Filtergrafik-Komponente</i>.
