class.com.top_logic.layout.view.agent.I18NConstants.ERROR_ACCESS_TOKEN_NO_ACCOUNT = Ein Zugriffstoken kann nur für ein angemeldetes Konto ausgestellt werden.
class.com.top_logic.layout.view.agent.I18NConstants.ERROR_ACCESS_TOKEN_NO_INPUT = Es liegt keine Anfrage zur Ausstellung einer Sperre vor.
class.com.top_logic.layout.view.agent.I18NConstants.ERROR_ACCESS_TOKEN_NO_LABEL = Bitte geben Sie dem Zugriffstoken einen Namen, damit Sie ihn beim Abrufen wiedererkennen können.
class.com.top_logic.layout.view.agent.I18NConstants.ERROR_ACCESS_TOKEN_NO_TOKEN = Es ist keine Sperre zum Abheben vorhanden.
class.com.top_logic.layout.view.agent.I18NConstants.ERROR_ACCESS_TOKEN_NO_VALIDITY = Bitte geben Sie an, wie lange die Sperre gültig bleibt.
com.top_logic.layout.view.agent.AccessTokenAuthenticator = Authentifizierer für Zugriffstoken
com.top_logic.layout.view.agent.AccessTokenAuthenticator.tooltip = Gewährt einem Agenten Zutritt, der eine von seinem Besitzer ausgestellte Sperre vorlegt. <p> Das vorgelegte Geheimnis wird mit dem gespeicherten Hash abgeglichen; eine widerrufene oder abgelaufene Sperre gewährt niemandem Zutritt. Jeder Zutritt wird auf der Sperre protokolliert, sodass deren Besitzer sehen kann, dass ein Agent sie verwendet. </p>
com.top_logic.layout.view.agent.AgentAccess = Agentenzugriff
com.top_logic.layout.view.agent.AgentAccess.Config.authenticators = Authentifikatoren
com.top_logic.layout.view.agent.AgentAccess.Config.authenticators.tooltip = Die Authentifizierungsmodule, die die Anmeldedaten von Aufrufern außerhalb des Browsers erkennen, wurden der Reihe nach abgefragt.
com.top_logic.layout.view.agent.AgentAccess.tooltip = Zugriff von Aufrufern außerhalb des Browsers auf das <i>Agent-Servlet</i>. <p> Ein Browser erreicht den Endpunkt mit seinem Sitzungs-Cookie. Ein Agent außerhalb des Browsers übermittelt stattdessen im „Authorization“-Header eine Berechtigungsangabe, die von den registrierten <i>Agenten-Authentifizierern</i> dem Konto zugeordnet wird, für das er auftritt. </p> <p> Ein Anmeldenachweis benennt zudem die Sitzung, in der der Agent arbeitet: Der Benutzer stellt ihn aus einer laufenden Sitzung heraus aus und ermöglicht es dem Agenten damit, die Fenster dieser Sitzung zu steuern. Die Sitzung wird hier unter einem Schlüssel registriert, den der Anmeldenachweis enthält, und die Registrierung endet mit der Sitzung – ein Agent kann die Sitzung, zu der er zugelassen wurde, nicht überdauern. </p> <p> Ist kein Authentifikator registriert, erreichen nur Browser den Endpunkt. </p>
com.top_logic.layout.view.agent.IssueAccessTokenAction = Aktion „Sperre ausstellen“
com.top_logic.layout.view.agent.IssueAccessTokenAction.tooltip = <i>Aktion, die</i> anhand der als Eingabe übergebenen Formularwerte ein Zugriffstoken für das aktuelle Konto ausstellt. <p> Die Eingabe ist ein tl.agent:NewAccessToken, das die Bezeichnung der Sperre, deren Gültigkeitsdauer in Stunden und die Angabe enthält, ob der Agent handeln darf. Die Aktion gibt einen vorübergehenden Träger der Einladung zurück – die Adresse der Anwendung zusammen mit der ausgestellten Sperre –, den die umgebende Kette an den Dialog übergibt, der ihn anzeigt; dies ist der einzige Moment, in dem die Sperre lesbar ist. Die Sperre gewährt dem Agenten Zugriff auf die Sitzung, aus der sie ausgestellt wurde, die hier unter <i>„Agentenzugriff“</i> registriert ist. </p>
com.top_logic.layout.view.agent.RevokeAccessTokenAction = Aktion „Sperre widerrufen“
com.top_logic.layout.view.agent.RevokeAccessTokenAction.tooltip = <i>Aktion</i> zum Entzug der als Eingabe übergebenen Sperre <i>anzeigen</i>: Die Sperre wird gelöscht, und ein Agent, der sie vorlegt, erhält keinen Zugriff mehr. <p> Ein Konto widerruft seine eigenen Sperren; der Widerruf der Sperre eines anderen Kontos ist ein administrativer Vorgang und erfordert die Berechtigung, mit der die administrative Ansicht geschützt ist. </p>
