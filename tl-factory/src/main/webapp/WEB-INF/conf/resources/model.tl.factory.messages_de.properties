model.tl.factory = Factory
model.tl.factory.AgentConversation = Agenten-Unterhaltung
model.tl.factory.AgentConversation.createdAt = Angelegt
model.tl.factory.AgentConversation.createdAt.tooltip = Wann die Unterhaltung begonnen wurde.
model.tl.factory.AgentConversation.sessionId = Session-ID
model.tl.factory.AgentConversation.sessionId.tooltip = Die Kennung, unter der der Agent die Unterhaltung führt; leer vor seiner ersten Antwort.
model.tl.factory.AgentConversation.task = Auftrag
model.tl.factory.AgentConversation.task.tooltip = Der Auftrag, mit dem die Unterhaltung begonnen wurde: ihre erste Nachricht an den Agenten.
model.tl.factory.AgentConversation.tooltip = Eine Unterhaltung mit dem Coding-Agenten, der in einem Workspace arbeitet.
model.tl.factory.AgentConversation.workspace = Workspace
model.tl.factory.AgentConversation.workspace.tooltip = Der Workspace, mit dessen Agent die Unterhaltung geführt wird.
model.tl.factory.Project = Projekt
model.tl.factory.Project.artifactId = Artifact-ID
model.tl.factory.Project.artifactId.tooltip = Maven-Artefakt der Anwendung, z. B. "my-app". Unter diesem Namen ist die Anwendung auch erreichbar (Kontextpfad).
model.tl.factory.Project.ciJob = CI-Job
model.tl.factory.Project.ciJob.tooltip = Der Job des Projekts auf dem CI-Server, der den Default-Branch seines Repositorys baut. Die Steueranwendung setzt ihn, wenn sie den Job einrichtet.
model.tl.factory.Project.ciJobUrl = CI-Job-Seite
model.tl.factory.Project.ciJobUrl.tooltip = Die Seite des CI-Jobs in der Weboberfläche des CI-Servers.
model.tl.factory.Project.engineVersion = Engine-Version
model.tl.factory.Project.engineVersion.tooltip = Das stabile TopLogic-Release, auf dem die Anwendung aufbaut.
model.tl.factory.Project.groupId = Group-ID
model.tl.factory.Project.groupId.tooltip = Maven-Gruppe der Anwendung, z. B. "com.example".
model.tl.factory.Project.name = Name
model.tl.factory.Project.name.tooltip = Name des Projekts.
model.tl.factory.Project.repository = Repository
model.tl.factory.Project.repository.tooltip = Das Repository des Projekts beim Git-Hosting-Dienst, als Besitzer/Name; die Anwendung im Workspace ist ein Klon davon, Änderungen erreichen sie nur über Commit und Push. Beim Anlegen eines Projekts ein bestehendes Repository (Besitzer/Name oder Klon-URL) eintragen, um es zu übernehmen, oder das Feld für ein neues Repository leer lassen.
model.tl.factory.Project.repositoryUrl = Repository-Seite
model.tl.factory.Project.repositoryUrl.tooltip = Die Seite des Repositorys in der Weboberfläche des Git-Hosting-Dienstes.
model.tl.factory.Project.tenant = Mandant
model.tl.factory.Project.tenant.tooltip = Der Mandant, dem das Projekt gehört. Ein neues Projekt gehört dem Mandanten des Benutzers, der es anlegt.
model.tl.factory.Project.tooltip = Eine TopLogic-Anwendung, die die Steueranwendung verwaltet.
model.tl.factory.Project.workspace = Workspace
model.tl.factory.Project.workspace.tooltip = Der Container, in dem die Anwendung gebaut wird und läuft. Leer, nachdem der Workspace aufgeräumt wurde.
model.tl.factory.Tenant = Mandant
model.tl.factory.Tenant.administrators = Verwalter
model.tl.factory.Tenant.administrators.tooltip = Die Benutzer, die die Mitglieder des Mandanten verwalten.
model.tl.factory.Tenant.developers = Entwickler
model.tl.factory.Tenant.developers.tooltip = Die Benutzer, die an den Projekten des Mandanten arbeiten.
model.tl.factory.Tenant.name = Name
model.tl.factory.Tenant.name.tooltip = Name des Mandanten, eindeutig unter den Mandanten.
model.tl.factory.Tenant.readers = Leser
model.tl.factory.Tenant.readers.tooltip = Die Benutzer, die die Projekte des Mandanten lesen.
model.tl.factory.Tenant.tooltip = Ein Unternehmen, das seine Anwendungen in der Steueranwendung entwickelt. Ein Benutzer ist Mitglied höchstens eines Mandanten.
model.tl.factory.TenantRole = Rolle im Mandanten
model.tl.factory.TenantRole.ADMINISTRATOR = Verwalter
model.tl.factory.TenantRole.ADMINISTRATOR.tooltip = Verwaltet die Mitglieder des Mandanten und arbeitet an seinen Projekten.
model.tl.factory.TenantRole.DEVELOPER = Entwickler
model.tl.factory.TenantRole.DEVELOPER.tooltip = Arbeitet an den Projekten des Mandanten.
model.tl.factory.TenantRole.READER = Leser
model.tl.factory.TenantRole.READER.tooltip = Liest die Projekte des Mandanten.
model.tl.factory.TenantRole.tooltip = Die Rolle eines Mitglieds in einem Mandanten.
model.tl.factory.Workspace = Workspace
model.tl.factory.Workspace.conversations = Agenten-Unterhaltungen
model.tl.factory.Workspace.conversations.tooltip = Die Unterhaltungen mit dem Coding-Agenten, der im Workspace arbeitet.
model.tl.factory.Workspace.hostPort = Host-Port
model.tl.factory.Workspace.hostPort.tooltip = Der Port des Hosts, auf dem die laufende Anwendung veröffentlicht ist.
model.tl.factory.Workspace.image = Image
model.tl.factory.Workspace.image.tooltip = Das Image, aus dem der Container des Workspaces angelegt wurde.
model.tl.factory.Workspace.initialPassword = Initiales root-Passwort
model.tl.factory.Workspace.initialPassword.tooltip = Das Passwort, das das Konto root der Anwendung beim Anlegen ihrer Datenbank erhält. Es ist das initiale Passwort eines Entwicklungs-Workspaces und gilt nicht mehr, sobald es in der Anwendung geändert wurde.
model.tl.factory.Workspace.log = Ausgabe
model.tl.factory.Workspace.log.tooltip = Die Ausgabe der letzten Operation auf dem Workspace.
model.tl.factory.Workspace.previewUrl = Vorschau
model.tl.factory.Workspace.previewUrl.tooltip = Die URL, unter der ein Browser die laufende Anwendung erreicht.
model.tl.factory.Workspace.status = Status
model.tl.factory.Workspace.status.tooltip = Der Zustand des Workspaces.
model.tl.factory.Workspace.tooltip = Der Container, in dem die Anwendung eines Projekts gebaut wird und läuft, mit seinen Volumes für Quellen, Maven-Repository, Datenbank und die Unterhaltungen des Agenten.
model.tl.factory.Workspace.workspaceId = Workspace-ID
model.tl.factory.Workspace.workspaceId.tooltip = Die Kennung des Workspaces in der Container-Plattform.
model.tl.factory.WorkspaceStatus = Workspace-Status
model.tl.factory.WorkspaceStatus.APP_STOPPED = Anwendung gestoppt
model.tl.factory.WorkspaceStatus.APP_STOPPED.tooltip = Der Container läuft, die Anwendung nicht: Sie wurde gestoppt oder ist beim Start fehlgeschlagen; die Ausgabe nennt den Grund. Der Agent kann in dem Workspace arbeiten.
model.tl.factory.WorkspaceStatus.BUILDING = Wird gebaut
model.tl.factory.WorkspaceStatus.BUILDING.tooltip = Der Container wird angelegt, die Anwendung wird erzeugt und gebaut.
model.tl.factory.WorkspaceStatus.CREATED = Angelegt
model.tl.factory.WorkspaceStatus.CREATED.tooltip = Der Container existiert, wurde aber noch nie gestartet.
model.tl.factory.WorkspaceStatus.ERROR = Fehler
model.tl.factory.WorkspaceStatus.ERROR.tooltip = Die letzte Operation ist fehlgeschlagen oder der Container ist verloren gegangen; die Ausgabe nennt den Grund.
model.tl.factory.WorkspaceStatus.REMOVING = Wird aufgeräumt
model.tl.factory.WorkspaceStatus.REMOVING.tooltip = Container und Volumes werden entfernt.
model.tl.factory.WorkspaceStatus.RUNNING = Läuft
model.tl.factory.WorkspaceStatus.RUNNING.tooltip = Die Anwendung läuft und antwortet unter dem Vorschau-Link.
model.tl.factory.WorkspaceStatus.STARTING = Wird gestartet
model.tl.factory.WorkspaceStatus.STARTING.tooltip = Die Anwendung startet.
model.tl.factory.WorkspaceStatus.STOPPED = Gestoppt
model.tl.factory.WorkspaceStatus.STOPPED.tooltip = Der Container ist angehalten, seine Volumes bleiben erhalten.
model.tl.factory.WorkspaceStatus.STOPPING = Wird gestoppt
model.tl.factory.WorkspaceStatus.STOPPING.tooltip = Der Container wird angehalten.
model.tl.factory.WorkspaceStatus.UNKNOWN = Unbekannt
model.tl.factory.WorkspaceStatus.UNKNOWN.tooltip = Die Container-Plattform hat den Zustand nicht mitgeteilt, z. B. weil sie nicht erreichbar war.
model.tl.factory.WorkspaceStatus.UPDATING = Wird aktualisiert
model.tl.factory.WorkspaceStatus.UPDATING.tooltip = Der Container wird auf dem aktuellen Workspace-Image neu angelegt; Quellen, Maven-Repository, Datenbank und die Unterhaltungen des Agenten bleiben erhalten.
model.tl.factory.input = Factory-Eingaben
model.tl.factory.input.Account = Konto
model.tl.factory.input.Account.email = E-Mail
model.tl.factory.input.Account.email.tooltip = Die E-Mail-Adresse des Benutzers.
model.tl.factory.input.Account.firstName = Vorname
model.tl.factory.input.Account.firstName.tooltip = Der Vorname des Benutzers.
model.tl.factory.input.Account.lastName = Nachname
model.tl.factory.input.Account.lastName.tooltip = Der Nachname des Benutzers.
model.tl.factory.input.Account.login = Anmeldename
model.tl.factory.input.Account.login.tooltip = Der Name, mit dem sich der Benutzer anmeldet; kein anderes Konto darf ihn haben.
model.tl.factory.input.Account.password = Initiales Passwort
model.tl.factory.input.Account.password.tooltip = Das Passwort, mit dem sich der Benutzer zum ersten Mal anmeldet.
model.tl.factory.input.Account.tooltip = Die Anmeldedaten und der Name eines anzulegenden Kontos.
model.tl.factory.input.MemberRole = Rolle eines Mitglieds
model.tl.factory.input.MemberRole.member = Mitglied
model.tl.factory.input.MemberRole.member.tooltip = Das Mitglied, dessen Rolle geändert wird.
model.tl.factory.input.MemberRole.role = Rolle
model.tl.factory.input.MemberRole.role.tooltip = Die neue Rolle des Mitglieds im Mandanten; sie ersetzt die Rollen, die das Mitglied hatte.
model.tl.factory.input.MemberRole.tooltip = Die neue Rolle eines Mitglieds eines Mandanten.
model.tl.factory.input.NewMember = Neues Mitglied
model.tl.factory.input.NewMember.role = Rolle
model.tl.factory.input.NewMember.role.tooltip = Die Rolle des Mitglieds im Mandanten.
model.tl.factory.input.NewMember.tooltip = Ein neues Mitglied eines Mandanten: sein Konto und seine Rolle im Mandanten.
model.tl.factory.input.NewTenant = Neuer Mandant
model.tl.factory.input.NewTenant.tenantName = Mandant
model.tl.factory.input.NewTenant.tenantName.tooltip = Der Name des Mandanten, eindeutig unter den Mandanten.
model.tl.factory.input.NewTenant.tooltip = Ein neuer Mandant: sein Name und das Konto seines ersten Verwalters.
