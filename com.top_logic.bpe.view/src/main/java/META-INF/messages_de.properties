com.top_logic.bpe.view.BpmnEditorElement = BPMN-Editor
com.top_logic.bpe.view.BpmnEditorElement.Config.diagram = Diagramm
com.top_logic.bpe.view.BpmnEditorElement.Config.diagram.tooltip = Optionaler Kanal, der das geänderte Diagramm als BPMN-XML empfängt. <p> Der Kanal enthält <code>null</code>, solange das Diagramm das gespeicherte Modell anzeigt, und das BPMN-XML des gesamten Diagramms, nachdem der Benutzer es in einem bearbeitbaren Diagramm geändert hat. Eine Ansicht speichert die Änderung mit <code>bpmlUpdateFromDiagram($workflow, $diagram)</code> in einer <code>&lt;with-transaction&gt;</code> einer Aktionskette. Das Element setzt den Kanal auf <code>null</code> zurück, wenn ein anderer Workflow angezeigt wird oder der angezeigte Workflow in der Wissensdatenbank in einer Weise geändert wurde, die das Diagramm zeigt; eine Änderung einer anwendungsspezifischen Erweiterung eines Elements (sein Formular, seine Schrittansicht, ...) behält die Änderung bei. Ein von außen geschriebenes <code>null</code> verwirft die Änderung. </p>
com.top_logic.bpe.view.BpmnEditorElement.Config.editable = Bearbeitbar
com.top_logic.bpe.view.BpmnEditorElement.Config.editable.tooltip = Ob der Benutzer das Diagramm ändern darf. <p> Der Ausdruck sieht den Workflow der Eingabe als Variable, die nach dem Kanal oder mit ihrem <code>as</code>-Namen benannt ist, und wird neu ausgewertet, sobald ein anderer Workflow gezeigt oder der gezeigte geändert wird. Ein bearbeitbares Diagramm wird im bpmn-js-Modeler mit Palette und Kontextmenü gezeigt, jedes andere in einem Betrachter, der sich nur verschieben und zoomen lässt. </p> <pre> editable="$workflow.get(`tl.bpe.bpml:Collaboration#state`) == `tl.bpe.bpml:ApprovalState#Development`" </pre>
com.top_logic.bpe.view.BpmnEditorElement.Config.input.tooltip = Der Kanal mit der Workflow-Definition (<code>tl.bpe.bpml:Collaboration</code>), deren Diagramm gezeigt wird. <p> Ein anderer Wert als ein Workflow zeigt eine leere Zeichenfläche. </p>
com.top_logic.bpe.view.BpmnEditorElement.Config.selection = Auswahl
com.top_logic.bpe.view.BpmnEditorElement.Config.selection.tooltip = Optionaler Kanal mit dem ausgewählten Element des Diagramms. <p> Das Element, das der Benutzer anklickt, wird dort als Modellelement des Workflows eingetragen (eine Aufgabe, ein Gateway, ein Ereignis, eine Lane, ein Sequenzfluss, ...), ein Klick auf die leere Zeichenfläche als der Workflow selbst. Ein Modellelement des gezeigten Workflows, das ein anderes Element der Ansicht dort einträgt, wird ausgewählt gezeigt; jeder andere Wert zeigt keine Auswahl und bleibt unverändert. Wird ein anderer Workflow gezeigt, wird ein ausgewähltes Element des vorigen durch <code>null</code> ersetzt. </p>
com.top_logic.bpe.view.BpmnEditorElement.tooltip = <i>UI-Element</i>, das das BPMN-Diagramm einer Workflow-Definition (einer <i>Kollaboration</i>) mit bpmn-js zeichnet und es bearbeitet, wo die Ansicht das erlaubt. <p> Das Element zeigt die Kollaboration seines Eingabekanals und folgt deren Änderungen in der Datenbank: Das Diagramm wird dann neu aus dem Modell gezeichnet. Das Element des Diagramms, das der Benutzer anklickt, wird in den Auswahlkanal geschrieben, und ein Element, das ein anderer dort einträgt, wird ausgewählt gezeigt. </p> <p> Ein bearbeitbares Diagramm wird im bpmn-js-Modeler gezeigt. Jede Änderung des Benutzers wird als BPMN-XML des ganzen Diagramms im Diagrammkanal veröffentlicht, der <code>null</code> enthält, solange das Diagramm das gespeicherte Modell zeigt. Das Element speichert eine Änderung nicht selbst: Eine Ansicht speichert das Diagramm mit einer Aktionskette, die <code>bpmlUpdateFromDiagram($workflow, $diagram)</code> in einer <code>&lt;with-transaction&gt;</code> aufruft. Die Aktualisierung ändert die Kollaboration in der Datenbank, worauf das Element das gespeicherte Modell zeichnet und den Diagrammkanal zurücksetzt. Ein von außen in den Diagrammkanal geschriebenes <code>null</code> verwirft die Änderungen. </p> <p> Solange eine Änderung nicht gespeichert ist, blockiert das Element das Schreiben seines Eingabekanals wie ein Formular mit ungespeicherten Eingaben: Der Benutzer wird gefragt, ob er die Änderung verwerfen will, bevor eine andere Kollaboration gezeigt wird, ebenso beim Verlassen des umgebenden Bereichs mit Änderungsverfolgung. Die Frage bietet kein „Speichern“ an, denn Speichern ist Sache der Aktionskette der Ansicht. </p>
