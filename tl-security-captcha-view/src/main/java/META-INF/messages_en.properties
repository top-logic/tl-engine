com.top_logic.security.captcha.view.CaptchaStart.FOCUS = Focus
com.top_logic.security.captcha.view.CaptchaStart.FOCUS.tooltip = When the visitor focuses a field of the form the captcha belongs to.
com.top_logic.security.captcha.view.CaptchaStart.LOAD = Load
com.top_logic.security.captcha.view.CaptchaStart.LOAD.tooltip = As soon as the captcha is displayed, without any action of the visitor.
com.top_logic.security.captcha.view.CaptchaStart.tooltip = When the browser starts to solve the challenge of a <i>captcha element</i>.
