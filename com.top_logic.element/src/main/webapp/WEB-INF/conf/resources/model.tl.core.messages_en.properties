model.tl.core = Core types
model.tl.core.Author = Author
model.tl.core.Author.name = Name
model.tl.core.Author.name.tooltip = The name that identifies the author.
model.tl.core.Author.tooltip = Base type for objects that can appear as author of a change. An author is identified by their name.
model.tl.core.Binary = Binary
model.tl.core.Binary.tooltip = Binary data such as a file or an image. The value is stored in the database and is offered for download in the user interface.
model.tl.core.Boolean = Boolean
model.tl.core.Boolean.tooltip = Truth value with the states "yes" and "no". A value of this type is never empty; a value that has not been set is interpreted as "no".
model.tl.core.Byte = Byte
model.tl.core.Byte.tooltip = Integer number that is stored in a single byte and can therefore only hold values from -128 to 127.
model.tl.core.Date = Date
model.tl.core.Date.tooltip = A date without a time. The value is stored as a point in time, but only the date is entered and displayed.
model.tl.core.DateTime = Date with time
model.tl.core.DateTime.tooltip = A point in time consisting of date and time. Both parts are entered and displayed.
model.tl.core.Day = Day
model.tl.core.Day.tooltip = A calendar day. In contrast to the type "Date", the value is stored as a pure date and is therefore independent of the time zone of the user.
model.tl.core.Double = Double
model.tl.core.Double.tooltip = Floating-point number with double precision. This is the type to be used for decimal numbers such as amounts, factors and measured values.
model.tl.core.Duration = Duration
model.tl.core.Duration.tooltip = A time duration in milliseconds, which is displayed to the user as days, hours, minutes, seconds and milliseconds and can also be entered in this format.
model.tl.core.Float = Float
model.tl.core.Float.tooltip = Floating-point number with single precision. For decimal numbers the type "Double" should be preferred, because it can represent values more precisely.
model.tl.core.Icon = Icon
model.tl.core.Icon.tooltip = Reference to an image or a font icon that is displayed as a symbol in the user interface.
model.tl.core.Integer = Integer
model.tl.core.Integer.tooltip = Integer number that is stored in four bytes. This is the type to be used for counters and quantities.
model.tl.core.Key = Key
model.tl.core.Key.tooltip = Text of at most 255 characters that is compared byte by byte and therefore distinguishes upper and lower case. The type is intended for technical keys and identifiers.
model.tl.core.Long = Long
model.tl.core.Long.tooltip = Integer number that is stored in eight bytes. The type is suitable for very large numbers such as technical identifiers or data sizes.
model.tl.core.Name = Name
model.tl.core.Name.tooltip = Type for a name attribute that ensures that no leading or trailing space can be entered. The type is otherwise equivalent to the "String" type.
model.tl.core.Password = Password
model.tl.core.Password.tooltip = Text that is stored in encrypted form and is never displayed in plain text in the user interface.
model.tl.core.Revision = Revision
model.tl.core.Revision.author = Author
model.tl.core.Revision.author.tooltip = The author who created the revision.
model.tl.core.Revision.date = Date
model.tl.core.Revision.date.tooltip = The point in time at which the revision was written to the database.
model.tl.core.Revision.log = Log
model.tl.core.Revision.log.tooltip = The change description that was given when the revision was written to the database.
model.tl.core.Revision.revision = Revision
model.tl.core.Revision.revision.tooltip = The consecutive commit number that identifies the revision.
model.tl.core.Revision.tooltip = A revision of the database. Every change creates a new revision, so that the state of an object can be inspected for each revision.
model.tl.core.Short = Short
model.tl.core.Short.tooltip = Integer number that is stored in two bytes and can therefore only hold values from -32768 to 32767.
model.tl.core.String = String
model.tl.core.String.tooltip = Single-line text of at most 1333 characters. For longer texts the type "Text" is to be used.
model.tl.core.Text = Text
model.tl.core.Text.tooltip = Multi-line text whose length is practically unlimited. The value is stored in a separate database column for large texts.
model.tl.core.Time = Time
model.tl.core.Time.tooltip = A time of day without a date.
model.tl.core.Tristate = Tristate
model.tl.core.Tristate.tooltip = Truth value with the three states "yes", "no" and "not set". In contrast to the type "Boolean", a value that has not been set is kept as a state of its own.
model.tl.core.tooltip = Module with the primitive data types that are available in every application: truth values, numbers, texts, dates and binary data.
