com.top_logic.layout.view.selfservice.ApplyPasswordResetAction = Apply password reset action
com.top_logic.layout.view.selfservice.ApplyPasswordResetAction.tooltip = <i>View action</i> that completes the self-service password reset: it verifies the code entered in the reset dialog against the one <i>request password reset action</i> generated (and within its validity), then applies the new password to the account. <p> On success the dialog closes and the user is told they can log in with the new password - the reset does <em>not</em> log the user in (unlike the regular login follow-up steps). </p>
com.top_logic.layout.view.selfservice.CheckVerificationCodeAction = Check verification code action
com.top_logic.layout.view.selfservice.CheckVerificationCodeAction.tooltip = <i>View action</i> of the code dialog of an <i>account request</i>: it checks the entered code against the <i>verification code</i> that was mailed and replaces the dialog with the dialog creating the account. <p> The code dialog (<code>"verification-code.view.xml"</code>) edits a transient <code>"tl.login:OtpEntry"</code>. It carries the request on the channel <code>"request"</code> and the code on the channel <code>"verification"</code>. </p> <p> The account dialog edits a transient <code>"tl.login:AccountCreation"</code> whose user name is the e-mail address of the request. It receives the request on the channel <code>"request"</code> and, on the channel <code>"passwords"</code>, whether the person chooses a password; <i>create own account action</i> creates the account. </p>
com.top_logic.layout.view.selfservice.CreateOwnAccountAction = Create own account action
com.top_logic.layout.view.selfservice.CreateOwnAccountAction.tooltip = <i>View action</i> of the account dialog of an <i>account request</i>: it creates the account and lets the request continue, e.g. log the new user in. <p> The input is the <code>"tl.login:AccountCreation"</code> the dialog edits, the request comes from the <code>"request"</code> channel. A refusal - missing surname, passwords that differ or violate the password rules, a request that can no longer be continued, a callback refusing the account - is reported and leaves the dialog open. </p>
com.top_logic.layout.view.selfservice.RequestInvitationCodeAction = Request invitation code action
com.top_logic.layout.view.selfservice.RequestInvitationCodeAction.tooltip = <i>View action</i> that starts the acceptance of an <i>invitation</i>: it mails a <i>verification code</i> to the address of the invitation and opens the code dialog in which the invited person enters it (see <i>check verification code action</i>). <p> The action processes the token of the invitation link (see <code>"invitation"</code>) or the invitation itself. It refuses an invitation that is not open with the reason, and a request that follows the previous one for the same invitation too soon. Without a configured mail server, the request is refused and no dialog opens: the code is only ever sent by mail. </p> <p> The dialog carries the invitation as <i>invitation request</i> and the code on its channels; both stay on the server. The top dialog open already, e.g. the code dialog asking for a new code, is replaced. </p>
com.top_logic.layout.view.selfservice.RequestPasswordResetAction = Request password reset action
com.top_logic.layout.view.selfservice.RequestPasswordResetAction.tooltip = <i>View action</i> that starts the self-service password reset: it generates a verification code, emails it to the identified account, and opens the reset-password dialog (carrying the account, the expected code and its creation time on dialog channels). <p> To avoid disclosing whether a user name exists, the behaviour is identical regardless of whether the account was found: a code is always generated and the reset dialog always opens; the mail is sent only when a matching, password-changeable account with an email address exists. </p>
com.top_logic.layout.view.selfservice.RequestRegistrationCodeAction = Request registration code action
com.top_logic.layout.view.selfservice.RequestRegistrationCodeAction.Config.captcha = Captcha
com.top_logic.layout.view.selfservice.RequestRegistrationCodeAction.Config.captcha.tooltip = The name of the channel of the view holding the solution of the captcha, the channel the captcha element writes to.
com.top_logic.layout.view.selfservice.RequestRegistrationCodeAction.tooltip = <i>View action</i> of the registration dialog: it requests a <i>verification code</i> for the entered e-mail address from the <i>self registration</i> and opens the code dialog in which the visitor enters it (see <i>check verification code action</i>). <p> The input is the transient <code>"tl.login:RegistrationRequest"</code> the dialog edits. The solution of the captcha, if the self-registration requires one, comes from the channel named by <i>Captcha</i>. A solution is accepted once only, so the action clears that channel after every request, which gives the captcha a new challenge. </p> <p> The visitor is told the same in every case, whether the address has an account or not, so the dialog does not reveal which addresses have one. A refusal - registration switched off, captcha not solved, invalid address, a request that follows the previous one too soon - is reported and leaves the dialog open. </p> <p> The code dialog carries the address as <i>registration request</i>, which creates the account. </p>
com.top_logic.layout.view.selfservice.SendNewCodeAction = Send new code action
com.top_logic.layout.view.selfservice.SendNewCodeAction.tooltip = <i>View action</i> of the code dialog of an <i>account request</i> asking for a new <i>verification code</i>. <p> The request on the <code>"request"</code> channel decides what happens: an invitation mails a new code to its address, a registration leads back to the dialog requesting the code, since a new code needs a new captcha. </p>
