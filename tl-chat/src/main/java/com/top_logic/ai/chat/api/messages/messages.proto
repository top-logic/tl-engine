package com.top_logic.ai.chat.api.messages;

option NoBinary;
option NoVisit;
option NoListener;
option NoInterfaces;
option NoXml;

/**
 * One message in the chat.
 */
message MessageDto {
	/**
	 * Message ID.
	 */
	string id;

	/**
	 * "user", "agent", or "system".
	 */
	string role;

	/**
	 * Display name of the user who sent this message.
	 */
	string userName;

	/**
	 * Message text content.
	 */
	string content;

	/**
	 * Pre-rendered HTML for the message content (agent messages only; null for user/system).
	 */
	string contentHtml;

	/**
	 * Formatted timestamp string.
	 */
	string time;

	/**
	 * Attachment metadata (file name, type, size). Binary data is NOT persisted.
	 */
	repeated AttachmentDto attachments;
}

/**
 * One timeline event (tool call or agent call).
 */
message TimelineEventDto {
	/**
	 * Event identifier.
	 */
	string id;

	/**
	 * Event type: "tool_call" or "agent_call".
	 */
	string type;

	/**
	 * Tool name (for tool_call events).
	 */
	string toolName;

	/**
	 * Event name.
	 */
	string name;

	/**
	 * Tool arguments as JSON string (for tool_call events).
	 */
	string argsJson;

	/**
	 * Tool result (for tool_call events).
	 */
	string result;

	/**
	 * Source agent name (for agent_call events).
	 */
	string fromAgent;

	/**
	 * Target agent name (for agent_call events).
	 */
	string toAgent;

	/**
	 * Input summary (for agent_call events).
	 */
	string inputSummary;

	/**
	 * Result summary (for agent_call events).
	 */
	string resultSummary;

	/**
	 * Duration in milliseconds (for tool_call events).
	 */
	long durationMs;

	/**
	 * Tool call status: "success" or "error" (for tool_call events).
	 */
	string status;
}

/**
 * Current (in-progress or just-finished) task.
 */
message CurrentTaskDto {
	/**
	 * Unique task identifier.
	 */
	string taskId;

	/**
	 * "in_progress", "completed", "error".
	 */
	string status;

	/**
	 * Human-readable task description.
	 */
	string description;

	/**
	 * Error message if status is "error"; null otherwise.
	 */
	string errorMessage;

	/**
	 * List of timeline events (tool calls and agent calls) for this task.
	 */
	repeated TimelineEventDto timeline;

	/**
	 * Total token usage for this task's run.
	 */
	TokenUsageDto totalUsage;

	/**
	 * Accumulated extended-thinking text from the LLM.
	 */
	string thinkingText;
}

/**
 * Response body for GET /chat/updates.
 */
message ChatUpdatesResponse {
	/**
	 * Whether an AI task is currently in progress.
	 */
	boolean processing;

	/**
	 * All messages in the chat.
	 */
	repeated MessageDto messages;

	/**
	 * Current or most recent task; null if no task.
	 */
	CurrentTaskDto currentTask;
}

/**
 * File attachment metadata and optional binary data.
 */
message AttachmentDto {
	/**
	 * Original file name.
	 */
	string fileName;

	/**
	 * MIME type (e.g. "image/png", "application/pdf").
	 */
	string mimeType;

	/**
	 * Base64-encoded file content. Present in ChatSendRequest (upload); null in persisted MessageDto.
	 */
	string base64Data;

	/**
	 * File size in bytes.
	 */
	int size;
}

/**
 * Request body for POST /chat/send.
 */
message ChatSendRequest {
	/**
	 * User message text.
	 */
	string text;

	/**
	 * Active session ID; if set, messages will be persisted to this session.
	 */
	string sessionId;

	/**
	 * File attachments (images, PDFs). Max 5, each max 10 MB.
	 */
	repeated AttachmentDto attachments;
}

/**
 * Response body for POST /chat/send.
 */
message ChatSendResponse {
	/**
	 * Task ID for polling updates.
	 */
	string taskId;

	/**
	 * e.g. "processing".
	 */
	string status;
}

/**
 * SSE connected event payload.
 */
message ConnectedEvent {
	/**
	 * Current message sequence number.
	 */
	int messageSeq;

	/**
	 * Current timeline sequence number.
	 */
	int timelineSeq;

	/**
	 * Whether an AI task is currently in progress.
	 */
	boolean processing;

	/**
	 * Current task ID, or null if none.
	 */
	string taskId;
}

/**
 * SSE heartbeat event payload.
 */
message HeartbeatEvent {
	/**
	 * Current server timestamp in milliseconds.
	 */
	long ts;
}

/**
 * Summary of a chat session for the history panel.
 */
message ChatSessionDto {
	/**
	 * Session ID (KnowledgeObject ID).
	 */
	string id;

	/**
	 * User-editable session title.
	 */
	string title;

	/**
	 * ISO-8601 timestamp of last update.
	 */
	string lastUpdated;
}

/**
 * Response body for GET /chat/sessions.
 */
message ChatSessionListResponse {
	/**
	 * All sessions for the current user, sorted by lastUpdated descending.
	 */
	repeated ChatSessionDto sessions;
}

/**
 * Request body for POST /chat/sessions.
 */
message CreateSessionRequest {
	/**
	 * Title for the new session.
	 */
	string title;
}

/**
 * Request body for PUT /chat/sessions/{id}/title.
 */
message UpdateTitleRequest {
	/**
	 * New title for the session.
	 */
	string title;
}

/**
 * Response body for GET /chat/sessions/{id} (full session load).
 */
message ChatSessionDetailResponse {
	/**
	 * Session ID.
	 */
	string id;

	/**
	 * Session title.
	 */
	string title;

	/**
	 * Messages JSON blob (raw string, parsed by client).
	 */
	string messagesJson;

	/**
	 * Structured entries (messages + task snapshots). V1 format.
	 */
	repeated PersistedChatEntry entries;

	/**
	 * Turn-based entries (V2 format). When present, takes precedence over entries.
	 */
	repeated PersistedTurn turns;
}

/**
 * Request body for PUT /chat/sessions/{id}/messages.
 */
message SaveMessagesRequest {
	/**
	 * Messages JSON blob to save.
	 */
	string messagesJson;
}

/**
 * One entry in a persisted chat: either a message or a completed task snapshot.
 */
message PersistedChatEntry {
	/**
	 * Entry type: "message" or "task_snapshot".
	 */
	string type;

	/**
	 * The message data (populated when type="message").
	 */
	MessageDto messageData;

	/**
	 * The task snapshot data (populated when type="task_snapshot").
	 */
	CurrentTaskDto taskData;
}

/**
 * Full persisted chat state: ordered list of entries (messages interleaved with task snapshots).
 */
message PersistedChat {
	/**
	 * All entries in display order.
	 */
	repeated PersistedChatEntry entries;
}

/**
 * SSE user interaction event payload.
 */
message UserInteractionEvent {
	/**
	 * Unique interaction request identifier (e.g. "interaction-1").
	 */
	string requestId;

	/**
	 * The question to present to the user (raw markdown).
	 */
	string question;

	/**
	 * Pre-rendered HTML for the question.
	 */
	string questionHtml;

	/**
	 * Short label (e.g. "Approval", "Clarify", "Choose").
	 */
	string header;

	/**
	 * Interaction type: "approval", "text", or "choice".
	 */
	string type;

	/**
	 * Available options for "choice" interactions.
	 */
	repeated InteractionOptionDto options;

	/**
	 * Whether multiple selections are allowed (for "choice" type).
	 */
	boolean multiSelect;
}

/**
 * One selectable option in a user interaction.
 */
message InteractionOptionDto {
	/**
	 * Display label for the option.
	 */
	string label;

	/**
	 * Optional description / tooltip text.
	 */
	string description;
}

/** SSE event for streaming text delta. */
message TextDeltaEvent {
	/** The text chunk. */
	string text;
}

/** SSE event for streaming thinking delta. */
message ThinkingDeltaEvent {
	/** The thinking text chunk. */
	string text;
}

/** SSE event for run started. */
message RunStartedEvent {
	/** The run ID. */
	string runId;

	/** The model being used. */
	string model;
}

/** SSE event for run completed. */
message RunCompletedEvent {
	/** The run ID. */
	string runId;

	/** Stop reason: COMPLETE, MAX_TURNS, ERROR, ABORTED. */
	string reason;

	/** Total token usage for the run. */
	TokenUsageDto totalUsage;
}

/** SSE event for turn started. */
message TurnStartedEvent {
	/** 1-based turn number. */
	int turnNumber;
}

/** SSE event for turn completed. */
message TurnCompletedEvent {
	/** 1-based turn number. */
	int turnNumber;

	/** Token usage for this turn. */
	TokenUsageDto turnUsage;
}

/** SSE event for tool call started. */
message ToolStartedEvent {
	/** Unique tool call ID. */
	string toolCallId;

	/** Tool name. */
	string toolName;

	/** Arguments as JSON string. */
	string argsJson;
}

/** SSE event for tool call completed. */
message ToolCompletedEvent {
	/** Unique tool call ID. */
	string toolCallId;

	/** Tool name. */
	string toolName;

	/** Result text. */
	string result;

	/** Duration in milliseconds. */
	long durationMs;
}

/** SSE event for tool call failed. */
message ToolFailedEvent {
	/** Unique tool call ID. */
	string toolCallId;

	/** Tool name. */
	string toolName;

	/** Error message. */
	string errorMessage;

	/** Duration in milliseconds. */
	long durationMs;
}

/** SSE event for tool call denied. */
message ToolDeniedEvent {
	/** Unique tool call ID. */
	string toolCallId;

	/** Tool name. */
	string toolName;

	/** Denial reason. */
	string reason;
}

/** SSE event for approval required. */
message ApprovalRequiredEvent {
	/** Unique tool call ID. */
	string toolCallId;

	/** Approval request ID for responding. */
	string approvalRequestId;

	/** Tool name needing approval. */
	string toolName;

	/** Arguments as JSON string. */
	string argsJson;

	/** Human-readable reason for approval. */
	string displayReason;
}

/** SSE event for approval resolved. */
message ApprovalResolvedEvent {
	/** Unique tool call ID. */
	string toolCallId;

	/** Approval request ID. */
	string approvalRequestId;

	/** Outcome: APPROVED, APPROVED_FOR_SESSION, REJECTED, TIMED_OUT. */
	string outcome;
}

/** SSE event for transaction committed. */
message TransactionCommittedEvent {
	/** Revision number, -1 if no changes. */
	long revisionNumber;
}

/** SSE event for transaction rolled back. */
message TransactionRolledBackEvent {
	/** Rollback reason. */
	string reason;
}

/** SSE event for provider error. */
message ProviderErrorEvent {
	/** Machine-readable error kind: RATE_LIMITED, OVERLOADED, CONTEXT_WINDOW_EXCEEDED, AUTHENTICATION, INVALID_REQUEST, UNKNOWN. */
	string kind;

	/** Human-readable error message. */
	string errorMessage;
}

/** SSE event for compaction started. */
message CompactionStartedEvent {
	/** Token count before compaction. */
	int tokensBefore;

	/** Trigger: reactive or proactive. */
	string trigger;
}

/** SSE event for completed assistant message with server-rendered HTML. */
message MessageCompleteEvent {
	/** Server-rendered markdown-to-HTML content. */
	string contentHtml;

	/** Raw markdown text for persistence. */
	string contentText;
}

/** Token usage breakdown. */
message TokenUsageDto {
	/** Input tokens. */
	int inputTokens;

	/** Output tokens. */
	int outputTokens;

	/** Thinking tokens. */
	int thinkingTokens;

	/** Cache read tokens. */
	int cacheReadTokens;

	/** Cache write tokens. */
	int cacheWriteTokens;
}

/** Session metadata for persistence. */
message SessionMetadata {
	/** Tool names approved for this session. */
	repeated string approvedTools;

	/** Cumulative token usage. */
	TokenUsageDto cumulativeUsage;

	/** Last model used. */
	string lastModel;

	/** Current approval mode (e.g. AUTO_APPROVE, ALWAYS_ASK). */
	string approvalMode;
}

// ---- New turn-based persistence format (v2) ----

/** A complete conversation in the turn-based persistence format. */
message PersistedConversationV2 {
	/** The turns in this conversation. */
	repeated PersistedTurn turns;

	/** Session metadata. */
	SessionMetadataV2 metadata;
}

/** A single turn in a conversation, representing one user-assistant exchange. */
message PersistedTurn {
	/** Unique turn identifier. */
	string id;

	/** Sequential turn number within the conversation. */
	int turnNumber;

	/** Timestamp when this turn started. */
	long timestamp;

	/** The model used for this turn. */
	string model;

	/** The provider used for this turn. */
	string provider;

	/** Token usage for this turn. */
	TokenUsageDto usage;

	/** Parts contributed by the user in this turn. */
	repeated PersistedPart userParts;

	/** Parts contributed by the assistant in this turn. */
	repeated PersistedPart assistantParts;
}

/** A single part within a turn, representing one atomic piece of content. */
message PersistedPart {
	/** Unique part identifier. */
	string id;

	/** Timestamp when this part was created. */
	long timestamp;

	/** Discriminator for the part type. */
	string type;

	/** Text content data. */
	TextPartDto textData;

	/** Thinking/reasoning data. */
	ThinkingPartDto thinkingData;

	/** Tool call data. */
	ToolCallPartDto toolCallData;

	/** Approval request data. */
	ApprovalPartDto approvalData;

	/** User interaction data. */
	InteractionPartDto interactionData;

	/** Context compaction data. */
	CompactionPartDto compactionData;

	/** Error data. */
	ErrorPartDto errorData;

	/** Transaction data. */
	TransactionPartDto transactionData;

	/** Agent delegation data. */
	DelegationPartDto delegationData;

	/** System event data. */
	SystemPartDto systemData;
}

/** Text content part. */
message TextPartDto {
	/** The text content. */
	string text;
}

/** Thinking/reasoning content part. */
message ThinkingPartDto {
	/** The thinking text. */
	string text;
}

/** Tool call part with invocation details and result. */
message ToolCallPartDto {
	/** Name of the tool that was called. */
	string toolName;

	/** JSON-encoded arguments passed to the tool. */
	string argsJson;

	/** Execution status of the tool call. */
	string status;

	/** The result returned by the tool. */
	string result;

	/** Reference to an externally stored result. */
	string resultRef;

	/** Error message if the tool call failed. */
	string errorMessage;

	/** Reason the tool call was denied. */
	string denyReason;

	/** Duration of the tool call in milliseconds. */
	long durationMs;
}

/** Approval request part for tool calls requiring user confirmation. */
message ApprovalPartDto {
	/** ID of the tool call requiring approval. */
	string toolCallId;

	/** Name of the tool requiring approval. */
	string toolName;

	/** JSON-encoded arguments for the tool call. */
	string argsJson;

	/** Reason displayed to the user for the approval request. */
	string displayReason;

	/** The user's decision. */
	string decision;

	/** Optional comment from the user. */
	string userComment;

	/** Timestamp when the approval was resolved. */
	long resolvedAt;
}

/** User interaction part for questions posed to the user. */
message InteractionPartDto {
	/** Type of interaction. */
	string interactionType;

	/** The question posed to the user. */
	string question;

	/** Optional header text. */
	string header;

	/** Available options for the user to choose from. */
	repeated string options;

	/** Whether multiple options can be selected. */
	boolean multiSelect;

	/** The user's response. */
	string userResponse;

	/** Timestamp when the interaction was resolved. */
	long resolvedAt;
}

/** Context compaction event part. */
message CompactionPartDto {
	/** Token count before compaction. */
	int tokensBefore;

	/** Token count after compaction. */
	int tokensAfter;

	/** What triggered the compaction. */
	string trigger;
}

/** Error event part. */
message ErrorPartDto {
	/** The kind of error. */
	string kind;

	/** The error message text. */
	string errorMessage;
}

/** Transaction event part. */
message TransactionPartDto {
	/** The transaction type. */
	string type;

	/** The revision number. */
	long revisionNumber;

	/** Optional reason for the transaction. */
	string reason;
}

/** Agent delegation part. */
message DelegationPartDto {
	/** The agent delegating the task. */
	string fromAgent;

	/** The agent receiving the task. */
	string toAgent;

	/** Summary of the input given to the delegate. */
	string inputSummary;

	/** Summary of the result from the delegate. */
	string resultSummary;

	/** Session ID of the child agent session. */
	string childSessionId;

	/** Duration of the delegation in milliseconds. */
	long durationMs;

	/** Nested child parts from the sub-agent's execution. */
	repeated PersistedPart childParts;
}

/** System event part. */
message SystemPartDto {
	/** The type of system event. */
	string eventType;

	/** Optional details about the event. */
	string details;
}

/** Session metadata for the turn-based persistence format. */
message SessionMetadataV2 {
	/** Tool names approved for this session. */
	repeated string approvedTools;

	/** Cumulative token usage across all turns. */
	TokenUsageDto cumulativeUsage;

	/** Last model used. */
	string lastModel;

	/** Last provider used. */
	string lastProvider;

	/** The approval mode for the session. */
	string approvalMode;
}
