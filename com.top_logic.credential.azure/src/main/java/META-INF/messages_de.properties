class.com.top_logic.credential.azure.I18NConstants.ERROR_IDENTITY_ENDPOINT_UNREACHABLE__URL = Der Endpunkt der verwalteten Identität „{0}“ ist nicht erreichbar. Die Anwendung läuft nicht in Azure, oder der Endpunkt ist von ihr aus nicht zugänglich.
class.com.top_logic.credential.azure.I18NConstants.ERROR_INVALID_SECRET_NAME__NAME = „{0}“ ist kein gültiger Name eines Geheimnisses in Azure Key Vault. Ein Name besteht aus 1 bis 127 Buchstaben, Ziffern und Bindestrichen; ein Unterstrich im Namen des Geheimnisses steht für einen Bindestrich.
class.com.top_logic.credential.azure.I18NConstants.ERROR_INVALID_URL__URL = Die URL „{0}“ ist ungültig.
class.com.top_logic.credential.azure.I18NConstants.ERROR_MALFORMED_RESPONSE__URL = Die Antwort von „{0}“ ist fehlerhaft.
class.com.top_logic.credential.azure.I18NConstants.ERROR_SECRET_EMPTY__NAME_VAULT = Das Geheimnis „{0}“ im Key Vault „{1}“ hat keinen Wert.
class.com.top_logic.credential.azure.I18NConstants.ERROR_SECRET_NOT_FOUND__NAME_VAULT = Das Geheimnis „{0}“ existiert nicht im Key Vault „{1}“.
class.com.top_logic.credential.azure.I18NConstants.ERROR_SECRET_REQUEST_FAILED__NAME_VAULT_STATUS_DETAIL = Das Lesen des Geheimnisses „{0}“ aus dem Key Vault „{1}“ ist fehlgeschlagen (HTTP-Status {2}). {3}
class.com.top_logic.credential.azure.I18NConstants.ERROR_TOKEN_REQUEST_FAILED__RESOURCE_URL_STATUS_DETAIL = Der Endpunkt der verwalteten Identität „{1}“ hat kein Zugriffstoken für die Ressource „{0}“ ausgestellt (HTTP-Status {2}). {3}
class.com.top_logic.credential.azure.I18NConstants.ERROR_TOKEN_UNAVAILABLE__RESOURCE_DETAIL = Für die Ressource „{0}“ ist kein Zugriffstoken der verwalteten Identität verfügbar. {1}
class.com.top_logic.credential.azure.I18NConstants.ERROR_VAULT_UNREACHABLE__URL = Der Key Vault „{0}“ ist nicht erreichbar.
com.top_logic.credential.azure.AzureRestConfig.connect-timeout = Verbindungs-Timeout
com.top_logic.credential.azure.AzureRestConfig.connect-timeout.tooltip = Maximale Zeit für den Aufbau einer Verbindung zum Endpunkt.
com.top_logic.credential.azure.AzureRestConfig.request-timeout = Anfrage-Timeout
com.top_logic.credential.azure.AzureRestConfig.request-timeout.tooltip = Maximale Zeit für eine Anfrage an den Endpunkt, bis die Antwort empfangen ist.
com.top_logic.credential.azure.KeyVaultClient = Key-Vault-Client
com.top_logic.credential.azure.KeyVaultClient.tooltip = Liest Geheimnisse aus einem Azure Key Vault und behält sie für die konfigurierte Cache-Dauer. <p> Die Geheimnisse werden mit dem <code>SecretClient</code> der Azure-Key-Vault-Bibliothek gelesen. Dessen Anfragen authentifiziert der konfigurierte <i>Zugangsdaten-Anbieter</i> (siehe <i>Credential Provider Policy</i>), standardmäßig die verwaltete Identität der Maschine oder App für die Ressource <code>"https://vault.azure.net"</code>. Ein Geheimnis wird für die Cache-Dauer behalten und danach erneut gelesen, sodass ein im Key Vault rotiertes Geheimnis ohne Neustart der Anwendung wirksam wird. Ein fehlgeschlagener Lesevorgang wird nicht behalten. </p>
com.top_logic.credential.azure.KeyVaultConfig.cache-time = Cache-Dauer
com.top_logic.credential.azure.KeyVaultConfig.cache-time.tooltip = Zeit, die ein aus dem Key Vault gelesenes Geheimnis verwendet wird, bevor es erneut gelesen wird. <p> Ein im Key Vault rotiertes Geheimnis wird spätestens nach dieser Zeit wirksam. </p>
com.top_logic.credential.azure.KeyVaultConfig.credentials = Zugangsdaten
com.top_logic.credential.azure.KeyVaultConfig.credentials.tooltip = Zugangsdaten für die Anfragen an den Key Vault. <p> Ohne Angabe wird die verwaltete Identität der Maschine oder App verwendet, siehe <i>Azure Managed Identity</i>. </p>
com.top_logic.credential.azure.KeyVaultConfig.vault-url = Key-Vault-URL
com.top_logic.credential.azure.KeyVaultConfig.vault-url.tooltip = URL des Key Vaults, z. B. <code>https://my-vault.vault.azure.net</code>.
com.top_logic.credential.azure.KeyVaultSecretSource = Geheimnis aus Azure Key Vault
com.top_logic.credential.azure.KeyVaultSecretSource.Config.secret-name = Name des Geheimnisses
com.top_logic.credential.azure.KeyVaultSecretSource.Config.secret-name.tooltip = Name des Geheimnisses im Key Vault.
com.top_logic.credential.azure.KeyVaultSecretSource.Config.secret-version = Version des Geheimnisses
com.top_logic.credential.azure.KeyVaultSecretSource.Config.secret-version.tooltip = Version des Geheimnisses. <p> Ohne Angabe wird die aktuelle Version gelesen, sodass eine neue Version nach Ablauf der Cache-Dauer wirksam wird. </p>
com.top_logic.credential.azure.KeyVaultSecretSource.tooltip = <i>Geheimnisquelle</i>, die ein Geheimnis aus Azure Key Vault liest. <p> Die Anwendung authentifiziert sich beim Key Vault mit einem Zugriffstoken, standardmäßig mit ihrer verwalteten Identität (siehe <i>Azure Managed Identity</i>), sodass die Konfiguration nur angibt, wo das Geheimnis liegt. Die Identität benötigt die Rolle „Key Vault Secrets User“ auf dem Key Vault oder dem Geheimnis. </p> <p> Das Geheimnis wird mit dem <code>SecretClient</code> der Azure-Key-Vault-Bibliothek gelesen. Dessen Anfragen authentifiziert der konfigurierte <i>Zugangsdaten-Anbieter</i> (siehe <i>Credential Provider Policy</i>), sodass jeder Anbieter verwendet werden kann, z. B. auch die OAuth-Client-Credentials eines Service Principals. </p> <p> Sie liest ein in ihrer Konfiguration benanntes Geheimnis. Die benannten Geheimnisse einer Installation, die alle ihre Geheimnisse in einem Key Vault hält, werden stattdessen über die Geheimnisablage <code>KeyVaultSecretStore</code> gelesen. </p> <p> Das Geheimnis wird für die konfigurierte Cache-Dauer behalten und danach erneut gelesen, sodass ein im Key Vault rotiertes Geheimnis ohne Neustart der Anwendung wirksam wird. </p> <p> Ein API-Schlüssel, gelesen aus dem Key Vault mit der systemseitig zugewiesenen verwalteten Identität: </p><pre> &lt;secret class="com.top_logic.credential.azure.KeyVaultSecretSource" vault-url="https://my-vault.vault.azure.net" secret-name="openai-api-key" /&gt; </pre> <p> Mit einer benutzerseitig zugewiesenen verwalteten Identität werden die Zugangsdaten explizit angegeben: </p><pre> &lt;secret class="com.top_logic.credential.azure.KeyVaultSecretSource" vault-url="https://my-vault.vault.azure.net" secret-name="openai-api-key" &gt; &lt;credentials class="com.top_logic.credential.azure.ManagedIdentityCredentials" resource="https://vault.azure.net" client-id="00000000-0000-0000-0000-000000000000" /&gt; &lt;/secret&gt; </pre>
com.top_logic.credential.azure.KeyVaultSecretStore = Azure Key Vault
com.top_logic.credential.azure.KeyVaultSecretStore.tooltip = <i>Geheimnisablage</i>, die alle benannten Geheimnisse der Installation in einem Azure Key Vault hält. <p> Die Namen der Geheimnisse werden in Snake Case geschrieben (<code>db_password</code>), Azure Key Vault erlaubt dagegen nur Buchstaben, Ziffern und Bindestriche. Die Ablage sucht den Namen deshalb mit dem konfigurierten Präfix und mit Bindestrichen statt Unterstrichen: Das Geheimnis <code>&lt;api-key name="tl_openai_api_key"/&gt;</code> wird aus dem Vault-Geheimnis <code>tl-openai-api-key</code> gelesen. Ein Geheimnis, das im Key Vault nicht existiert, führt die Ablage nicht, sodass eine Kette von Ablagen die nächste Ablage fragt. </p> <p> Die Anwendung authentifiziert sich beim Key Vault mit einem Zugriffstoken, standardmäßig mit ihrer verwalteten Identität (siehe <i>Azure Managed Identity</i>); die Identität benötigt die Rolle „Key Vault Secrets User“ auf dem Key Vault. Ein Geheimnis (und das Fehlen eines Geheimnisses) wird für die Cache-Dauer behalten und danach erneut gelesen, sodass ein im Key Vault rotiertes Geheimnis ohne Neustart der Anwendung wirksam wird. </p> <p> Die Ablage der Installation wird im globalen Konfigurationsabschnitt <code>SecretStores$Config</code> konfiguriert: </p><pre> &lt;config config:interface="com.top_logic.basic.credential.SecretStores$Config"&gt; &lt;store class="com.top_logic.credential.azure.KeyVaultSecretStore" vault-url="https://my-vault.vault.azure.net" /&gt; &lt;/config&gt; </pre> <p> Mit einer benutzerseitig zugewiesenen verwalteten Identität und den Geheimnissen mehrerer Installationen in einem Key Vault, unterschieden durch ein Präfix (<code>prod-db-password</code> für das Geheimnis <code>db_password</code>): </p><pre> &lt;config config:interface="com.top_logic.basic.credential.SecretStores$Config"&gt; &lt;store class="com.top_logic.credential.azure.KeyVaultSecretStore" vault-url="https://my-vault.vault.azure.net" prefix="prod_" &gt; &lt;credentials class="com.top_logic.credential.azure.ManagedIdentityCredentials" resource="https://vault.azure.net" client-id="00000000-0000-0000-0000-000000000000" /&gt; &lt;/store&gt; &lt;/config&gt; </pre>
com.top_logic.credential.azure.ManagedIdentityCredentials = Azure Managed Identity
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.client-id = Client-ID
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.client-id.tooltip = Client-ID der zu verwendenden benutzerseitig zugewiesenen verwalteten Identität. <p> Ohne Angabe wird die systemseitig zugewiesene Identität verwendet, oder die einzige benutzerseitig zugewiesene Identität, wenn es keine systemseitig zugewiesene gibt. In AKS wird die Client-ID der Workload Identity aus der Umgebungsvariable <code>AZURE_CLIENT_ID</code> übernommen. </p>
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.max-attempts = Maximale Versuche
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.max-attempts.tooltip = Maximale Anzahl an Versuchen einer Token-Anfrage, die mit einem vorübergehenden Fehler beantwortet wird.
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.resource = Ressource
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.resource.tooltip = Kennung des Azure-Dienstes, für den das Token angefordert wird, z. B. <code>https://cognitiveservices.azure.com</code> für Azure AI Services oder <code>https://vault.azure.net</code> für Azure Key Vault.
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.retry-delay = Wartezeit vor Wiederholung
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.retry-delay.tooltip = Wartezeit vor dem zweiten Versuch einer Token-Anfrage. Die Zeit verdoppelt sich mit jedem weiteren Versuch.
com.top_logic.credential.azure.ManagedIdentityCredentials.tooltip = <i>Zugangsdaten-Anbieter</i>, der Anfragen mit einem Zugriffstoken der verwalteten Identität (Managed Identity) der Azure-Maschine, -App oder des Pods authentifiziert, auf der die Anwendung läuft. <p> Azure stellt das Token für die Identität aus, die der virtuellen Maschine, dem App Service, der Function, der Container App oder dem Kubernetes-Workload zugewiesen ist, sodass die Anwendung selbst keinerlei Geheimnis besitzt. Der Zugriff wird der Identität in Azure gewährt (Rollenzuweisung), z. B. die Rolle <code>Cognitive Services OpenAI User</code> für ein in Azure AI Services bereitgestelltes Sprachmodell. </p> <p> Das Token wird mit dem <code>ManagedIdentityCredential</code> der Azure-Identity-Bibliothek angefordert, die den Identitäts-Endpunkt der Plattform aus den Umgebungsvariablen bestimmt, die Azure setzt: <code>IDENTITY_ENDPOINT</code> und <code>IDENTITY_HEADER</code> in einem App Service, einer Function oder einer Container App; <code>AZURE_TENANT_ID</code>, <code>AZURE_CLIENT_ID</code> und <code>AZURE_FEDERATED_TOKEN_FILE</code> in einem Pod des Azure Kubernetes Service (AKS) mit Workload Identity, dessen Service-Account-Token bei Microsoft Entra ID getauscht wird; sonst, z. B. auf einer virtuellen Maschine oder in einem Scale Set, den Instance Metadata Service (IMDS) unter <code>http://169.254.169.254</code> oder den in <code>AZURE_POD_IDENTITY_AUTHORITY_HOST</code> angegebenen Host. Die Bibliothek speichert das Token zwischen und erneuert es kurz vor seinem Ablauf. </p> <p> Ein Sprachmodell in Azure AI Services mit der systemseitig zugewiesenen Identität oder in AKS mit der Workload Identity des Pods: </p><pre> &lt;credentials class="com.top_logic.credential.azure.ManagedIdentityCredentials" resource="https://cognitiveservices.azure.com" /&gt; </pre> <p> Bei einer benutzerseitig zugewiesenen Identität wählt deren Client-ID sie aus: </p><pre> &lt;credentials class="com.top_logic.credential.azure.ManagedIdentityCredentials" resource="https://cognitiveservices.azure.com" client-id="00000000-0000-0000-0000-000000000000" /&gt; </pre> <p> Eine Token-Anfrage, die mit einem Status beantwortet wird, den Azure als vorübergehend dokumentiert (404 und 410 während der Metadata Service aktualisiert wird, 429 bei Drosselung, 5xx), wird einige Male mit wachsendem Abstand wiederholt. Ein überhaupt nicht erreichbarer Endpunkt wird sofort gemeldet, da die Anwendung dann nicht in Azure läuft. </p>
