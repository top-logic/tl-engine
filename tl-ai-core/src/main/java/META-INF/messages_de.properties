com.top_logic.tl.ai.core.scripting.AIScriptFunctions.tools.tooltip = Gibt eine Liste aller verfügbaren Werkzeugnamen aus dem <i>Werkzeugregistrierungsdienst</i> zurück. <p> Die Werkzeugnamen haben das qualifizierte Format Fabrikname.Werkzeugname. Diese Namen können an die <i>Chat-Funktion</i> übergeben werden, um dem KI-Agenten Werkzeuge zur Verfügung zu stellen. </p>
