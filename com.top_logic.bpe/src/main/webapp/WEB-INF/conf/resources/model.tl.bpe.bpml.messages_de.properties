model.tl.bpe = Business Process Engine
model.tl.bpe.bpml = BPML Model
model.tl.bpe.bpml.Annotated = Annotated
model.tl.bpe.bpml.Annotated.annotationAssociations = Annotationslinks
model.tl.bpe.bpml.Annotated.annotationAssociations.tooltip = Die Verknüpfungen zu den Textanmerkungen, die im Diagramm an dieses Element angehängt sind.
model.tl.bpe.bpml.Annotated.tooltip = Basistyp für die Elemente eines Diagramms, an die eine Textanmerkung angehängt werden kann.
model.tl.bpe.bpml.AnnotationAssociation = AnnotationAssociation
model.tl.bpe.bpml.AnnotationAssociation.source = Annotiertes Element
model.tl.bpe.bpml.AnnotationAssociation.source.tooltip = Das Diagrammelement, an dem die Textanmerkung hängt.
model.tl.bpe.bpml.AnnotationAssociation.target = Annotation
model.tl.bpe.bpml.AnnotationAssociation.target.tooltip = Die Textanmerkung, die an dem Element hängt.
model.tl.bpe.bpml.AnnotationAssociation.tooltip = Die Verknüpfung zwischen einem Diagrammelement und einer daran angehängten Textanmerkung.
model.tl.bpe.bpml.AnnotationContainer = AnnotationContainer
model.tl.bpe.bpml.AnnotationContainer.annotationDefinitions = Annotationen
model.tl.bpe.bpml.AnnotationContainer.annotationDefinitions.tooltip = Die in diesem Element enthaltenen Textanmerkungen. Sie werden aus dem Diagramm gelesen und gemeinsam mit ihrem Container gelöscht.
model.tl.bpe.bpml.AnnotationContainer.tooltip = Basistyp für die Elemente eines Diagramms, die Textanmerkungen enthalten können: die Collaboration und einen Prozess.
model.tl.bpe.bpml.ApprovalState = Workflow-Status
model.tl.bpe.bpml.ApprovalState.Development = In Arbeit
model.tl.bpe.bpml.ApprovalState.Development.tooltip = Der Workflow wird bearbeitet und kann noch nicht gestartet werden.
model.tl.bpe.bpml.ApprovalState.Released = Aktiv
model.tl.bpe.bpml.ApprovalState.Released.tooltip = Der Workflow ist freigegeben. Nur ein freigegebener Workflow kann gestartet werden.
model.tl.bpe.bpml.ApprovalState.Retired = Abgekündigt
model.tl.bpe.bpml.ApprovalState.Retired.tooltip = Der Workflow soll nicht mehr verwendet werden. Bereits gestartete Durchläufe laufen weiter, es kann aber kein neuer Durchlauf gestartet werden.
model.tl.bpe.bpml.ApprovalState.tooltip = Der Zustand eines Workflows in seinem Lebenszyklus: er wird bearbeitet, er ist zur Nutzung freigegeben, oder er ist abgekündigt.
model.tl.bpe.bpml.BPTimeGranularity = Zeit-Granularität
model.tl.bpe.bpml.BPTimeGranularity.tooltip = Die Einheit, in der die Wartezeit eines Zeit-Ereignisses angegeben wird: Tag, Stunde, Minute oder Sekunde.
model.tl.bpe.bpml.BoundaryEvent = BoundaryEvent
model.tl.bpe.bpml.BoundaryEvent.attachedTo = Gebunden an
model.tl.bpe.bpml.BoundaryEvent.attachedTo.tooltip = Die Aufgabenbeschreibung, an der dieses Ereignis hängt.
model.tl.bpe.bpml.BoundaryEvent.cancelActivity = Stoppt die Aktivität
model.tl.bpe.bpml.BoundaryEvent.cancelActivity.tooltip = Ob die Aufgabe, an der das Ereignis hängt, beendet wird, wenn das Ereignis eintritt. Andernfalls bleibt die Aufgabe offen und der Prozess läuft über beide Wege weiter.
model.tl.bpe.bpml.BoundaryEvent.tooltip = Ein Ereignis, das am Rand einer Aufgabenbeschreibung hängt. Es tritt ein, während die Aufgabe bearbeitet wird, und führt den Prozess über einen anderen Weg weiter.
model.tl.bpe.bpml.BusinessRuleTask = BusinessRuleTask
model.tl.bpe.bpml.BusinessRuleTask.tooltip = Eine Aufgabe, deren Ergebnis von einer fachlichen Regel bestimmt wird.
model.tl.bpe.bpml.CallActivity = CallActivity
model.tl.bpe.bpml.CallActivity.tooltip = Eine Aufgabe, die einen anderen Prozess aufruft und auf dessen Ergebnis wartet.
model.tl.bpe.bpml.CancelEventDefinition = Abbrechen
model.tl.bpe.bpml.CancelEventDefinition.tooltip = Das Ereignis bricht eine bereits durchgeführte Transaktion ab.
model.tl.bpe.bpml.Collaboration = Collaboration
model.tl.bpe.bpml.Collaboration.diagram = Diagramm
model.tl.bpe.bpml.Collaboration.diagram.tooltip = Das BPMN-Diagramm des Workflows in seiner Quellform. Alle anderen Elemente des Workflows werden beim Import daraus abgeleitet.
model.tl.bpe.bpml.Collaboration.messageFlows = Nachrichten
model.tl.bpe.bpml.Collaboration.messageFlows.tooltip = Die Nachrichten zwischen den Teilnehmern des Workflows. Sie werden aus dem Diagramm gelesen und gemeinsam mit dem Workflow gelöscht.
model.tl.bpe.bpml.Collaboration.myProcessesDescriptionI18N = "Meine Prozesse" Beschreibung
model.tl.bpe.bpml.Collaboration.myProcessesDescriptionI18N.tooltip = Beschreibung, die auf der Kachel "Meine Prozesse" in der generischen Workflow-Ansicht dargestellt werden soll.
model.tl.bpe.bpml.Collaboration.myProcessesIcon = "Meine Prozesse" Icon
model.tl.bpe.bpml.Collaboration.myProcessesIcon.tooltip = Bild, das auf der Kachel "Meine Prozesse" in der generischen Workflow-Ansicht dargestellt werden soll.
model.tl.bpe.bpml.Collaboration.myProcessesTitleI18N = "Meine Prozesse" Titel
model.tl.bpe.bpml.Collaboration.myProcessesTitleI18N.tooltip = Alternativer Titel for die Kachel "Meine Prozesse" in der generischen Workflow-Ansicht.
model.tl.bpe.bpml.Collaboration.myTasksDescriptionI18N = "Meine Aufgaben" Beschreibung
model.tl.bpe.bpml.Collaboration.myTasksDescriptionI18N.tooltip = Beschreibung, die auf der Kachel "Meine Aufgaben" in der generischen Workflow-Ansicht angezeigt werden soll.
model.tl.bpe.bpml.Collaboration.myTasksIcon = "Meine Aufgaben" Icon
model.tl.bpe.bpml.Collaboration.myTasksIcon.tooltip = Bild, das auf der Kachel "Meine Aufgaben" in der generischen Workflow-Ansicht dargestellt werden soll.
model.tl.bpe.bpml.Collaboration.myTasksTitleI18N = "Meine Aufgaben" Titel
model.tl.bpe.bpml.Collaboration.myTasksTitleI18N.tooltip = Alternativer Titel for die Kachel "Meine Aufgaben" in der generischen Workflow-Ansicht.
model.tl.bpe.bpml.Collaboration.participants = Teilnehmer
model.tl.bpe.bpml.Collaboration.participants.tooltip = Die Teilnehmer des Workflows, einer je Pool des Diagramms. Sie werden aus dem Diagramm gelesen und gemeinsam mit dem Workflow gelöscht.
model.tl.bpe.bpml.Collaboration.processes = Prozesse
model.tl.bpe.bpml.Collaboration.processes.tooltip = Die Prozesse des Workflows, einer je Teilnehmer. Sie werden aus dem Diagramm gelesen und gemeinsam mit dem Workflow gelöscht.
model.tl.bpe.bpml.Collaboration.state = Status
model.tl.bpe.bpml.Collaboration.state.tooltip = Der Zustand des Workflows in seinem Lebenszyklus. Nur ein freigegebener Workflow kann gestartet werden.
model.tl.bpe.bpml.Collaboration.tooltip = Ein Workflow als Ganzes. Die Collaboration enthält das Diagramm, die darin dargestellten Teilnehmer und deren Prozesse.
model.tl.bpe.bpml.CompensateEventDefinition = Ausgleich
model.tl.bpe.bpml.CompensateEventDefinition.tooltip = Das Ereignis gleicht bereits geleistete Arbeit aus.
model.tl.bpe.bpml.ComplexGateway = ComplexGateway
model.tl.bpe.bpml.ComplexGateway.tooltip = Ein Gateway, dessen Verzweigung sich nicht mit den anderen Gateways ausdrücken lässt.
model.tl.bpe.bpml.ConditionalEventDefinition = Bedingt
model.tl.bpe.bpml.ConditionalEventDefinition.tooltip = Das Ereignis tritt ein, sobald eine Bedingung erfüllt ist.
model.tl.bpe.bpml.DefaultGateway = DefaultGateway
model.tl.bpe.bpml.DefaultGateway.defaultFlow = Standardweg
model.tl.bpe.bpml.DefaultGateway.defaultFlow.tooltip = Der Weg, den der Prozess nimmt, wenn die Bedingung keines anderen ausgehenden Weges erfüllt ist.
model.tl.bpe.bpml.DefaultGateway.tooltip = Basistyp der Gateways, bei denen einer der ausgehenden Wege als Standardweg gekennzeichnet werden kann.
model.tl.bpe.bpml.Described = Mit Beschreibung
model.tl.bpe.bpml.Described.descriptionI18N = Beschreibung
model.tl.bpe.bpml.Described.descriptionI18N.tooltip = Eine Beschreibung dieses Elements, die dem Nutzer angezeigt wird, der den Workflow bearbeitet.
model.tl.bpe.bpml.Described.tooltip = Abstrakter Obertyp für alle Bestandteile eines Workflows, die eine Beschreibung enthalten können.
model.tl.bpe.bpml.DisplayDescription = DisplayDescription
model.tl.bpe.bpml.DisplayDescription.tooltip = Eine Formulardefinition. Der Wert beschreibt, welche Attribute des Prozessobjektes angezeigt und wie sie angeordnet werden.
model.tl.bpe.bpml.Edge = Edge
model.tl.bpe.bpml.Edge.label = Bezeichnung
model.tl.bpe.bpml.Edge.label.tooltip = Bezeichnung der Kante, wie sie einem Benutzer während der Workflow-Bearbeitung angezeigt werden soll (z. B. bei der Entscheidungsfindung oder als Text auf einer Schaltfläche).
model.tl.bpe.bpml.Edge.process = Prozess
model.tl.bpe.bpml.Edge.process.tooltip = Der Prozess, zu dem diese Kante gehört. Eine Kante wird gemeinsam mit ihrem Prozess gelöscht.
model.tl.bpe.bpml.Edge.source = Von
model.tl.bpe.bpml.Edge.source.tooltip = Der Knoten, an dem diese Kante beginnt.
model.tl.bpe.bpml.Edge.target = Nach
model.tl.bpe.bpml.Edge.target.tooltip = Der Knoten, zu dem diese Kante führt.
model.tl.bpe.bpml.Edge.title = Bezeichnung
model.tl.bpe.bpml.Edge.title.tooltip = Bezeichnung der Kannte, wie sie einem Nutzer bei der Workflow-Bearbeitung angezeigt werden soll (z.B. beim Treffen einer Entscheidung oder als Text auf einem Knopf).
model.tl.bpe.bpml.Edge.tooltip = Tooltip
model.tl.bpe.bpml.Edge.tooltip.tooltip = Weitergehende Anleitung, die dem Nutzer des Workflows für diesen Übergang angezeigt werden soll. Die Anleitung sollte dem Nutzer die Konsequenzen einer eventuell zu treffenden Entscheidung klarmachen.
model.tl.bpe.bpml.Edge.weight = Gewicht
model.tl.bpe.bpml.Edge.weight.tooltip = Ein Gewicht, das die Ordnung der Kante in einem Auswahldialog für eine Nutzerentscheidung bestimmt. Je größer die Zahl, desto weiter unten wird die Kante in die Entscheidungsliste einsortiert. Alle Kanten, die ein Gewicht haben werden vor Kanten ohne Gewicht angezeigt.
model.tl.bpe.bpml.EndEvent = EndEvent
model.tl.bpe.bpml.EndEvent.tooltip = Das Ereignis, an dem ein Durchlauf des Prozesses endet. Wird es erreicht, gilt die Prozess-Instanz als beendet.
model.tl.bpe.bpml.ErrorEventDefinition = Fehler
model.tl.bpe.bpml.ErrorEventDefinition.tooltip = Das Ereignis signalisiert einen Fehler, der den normalen Verlauf des Prozesses verhindert.
model.tl.bpe.bpml.EscalationEventDefinition = Eskalation
model.tl.bpe.bpml.EscalationEventDefinition.tooltip = Das Ereignis eskaliert den Prozess, so dass er auf einer höheren Ebene behandelt wird.
model.tl.bpe.bpml.Event = Event
model.tl.bpe.bpml.Event.definition = Definition
model.tl.bpe.bpml.Event.definition.tooltip = Die Definition, die die Art dieses Ereignisses festlegt. Sie wird aus dem Diagramm gelesen und gemeinsam mit dem Ereignis gelöscht.
model.tl.bpe.bpml.Event.tooltip = Basistyp aller Ereignisse eines Prozesses. Was ein Ereignis tut, legt seine Definition fest.
model.tl.bpe.bpml.EventBasedGateway = EventBasedGateway
model.tl.bpe.bpml.EventBasedGateway.tooltip = Ein Gateway, an dem der Prozess auf mehrere Ereignisse wartet und über den Weg des Ereignisses weiterläuft, das zuerst eintritt.
model.tl.bpe.bpml.EventDefinition = EventDefinition
model.tl.bpe.bpml.EventDefinition.event = Ereignis
model.tl.bpe.bpml.EventDefinition.event.tooltip = Das Ereignis, zu dem diese Definition gehört.
model.tl.bpe.bpml.EventDefinition.tooltip = Basistyp aller Ereignisdefinitionen. Die Definition legt fest, um welche Art von Ereignis es sich bei dem Ereignis handelt, an dem sie hängt.
model.tl.bpe.bpml.ExclusiveGateway = ExclusiveGateway
model.tl.bpe.bpml.ExclusiveGateway.automatic = Automatisch
model.tl.bpe.bpml.ExclusiveGateway.automatic.tooltip = Ob der Weg ohne Rückfrage gewählt wird. Ist die Option gesetzt, nimmt die Workflow-Durchführung den ersten Weg, dessen Bedingung erfüllt ist; andernfalls entscheidet der Nutzer, der die vorangehende Aufgabe abschließt.
model.tl.bpe.bpml.ExclusiveGateway.tooltip = Ein Gateway, an dem der Prozess über genau einen der ausgehenden Wege weiterläuft.
model.tl.bpe.bpml.Externalized = Externalized
model.tl.bpe.bpml.Externalized.extId = Diagramm-ID
model.tl.bpe.bpml.Externalized.extId.tooltip = Die Kennung des Elements im BPMN-Diagramm. Über sie wird das Element beim erneuten Import des Diagramms wiedergefunden, so dass seine zusätzliche Konfiguration erhalten bleibt.
model.tl.bpe.bpml.Externalized.tooltip = Basistyp für alle Elemente, die aus einem BPMN-Diagramm stammen und daher einem Element dieses Diagramms zugeordnet werden können.
model.tl.bpe.bpml.FlowSource = FlowSource
model.tl.bpe.bpml.FlowSource.tooltip = Basistyp für die Elemente, von denen eine Nachricht ausgehen kann.
model.tl.bpe.bpml.FlowTarget = FlowTarget
model.tl.bpe.bpml.FlowTarget.tooltip = Basistyp für die Elemente, auf die eine Nachricht gerichtet sein kann.
model.tl.bpe.bpml.Gateway = Gateway
model.tl.bpe.bpml.Gateway.tooltip = Basistyp aller Gateways. Ein Gateway verzweigt den Verlauf des Prozesses in mehrere Wege oder führt mehrere Wege wieder zusammen.
model.tl.bpe.bpml.Iconified = Mit Icon
model.tl.bpe.bpml.Iconified.icon = Symbol
model.tl.bpe.bpml.Iconified.icon.tooltip = Das Icon, mit dem dieses Element in den Workflow-Ansichten dargestellt wird.
model.tl.bpe.bpml.Iconified.tooltip = Abstrakter Obertyp für alle Bestandteile eines Workflows, die mit einem Icon dargestellt werden können.
model.tl.bpe.bpml.InclusiveGateway = InclusiveGateway
model.tl.bpe.bpml.InclusiveGateway.tooltip = Ein Gateway, an dem der Prozess über jeden ausgehenden Weg weiterläuft, dessen Bedingung erfüllt ist.
model.tl.bpe.bpml.IntermediateCatchEvent = IntermediateCatchEvent
model.tl.bpe.bpml.IntermediateCatchEvent.tooltip = Ein Ereignis, an dem der Prozess wartet, bis das Ereignis eintritt.
model.tl.bpe.bpml.IntermediateEvent = IntermediateEvent
model.tl.bpe.bpml.IntermediateEvent.tooltip = Basistyp der Ereignisse, die zwischen dem Start und dem Ende eines Prozesses liegen.
model.tl.bpe.bpml.IntermediateMessageThrowEvent = IntermediateMessageThrowEvent
model.tl.bpe.bpml.IntermediateMessageThrowEvent.tooltip = Ein Ereignis, das beim Durchlaufen eine Nachricht versendet.
model.tl.bpe.bpml.IntermediateThrowEvent = IntermediateThrowEvent
model.tl.bpe.bpml.IntermediateThrowEvent.tooltip = Ein Ereignis, das der Prozess beim Durchlaufen selbst auslöst.
model.tl.bpe.bpml.Lane = Lane
model.tl.bpe.bpml.Lane.nodes = Knoten
model.tl.bpe.bpml.Lane.nodes.tooltip = Die Knoten des Diagramms, die in dieser Bahn liegen.
model.tl.bpe.bpml.Lane.owner = Eigner
model.tl.bpe.bpml.Lane.owner.tooltip = Der Prozess oder die Bahn, in der diese Bahn liegt. Eine Bahn wird gemeinsam mit ihrem Container gelöscht.
model.tl.bpe.bpml.Lane.title = Bezeichnung
model.tl.bpe.bpml.Lane.title.tooltip = Bezeichnung der Lane, wie sie einem Nutzer bei der Workflow-Bearbeitung angezeigt werden soll.
model.tl.bpe.bpml.Lane.tooltip = Eine Bahn des Diagramms. Sie legt fest, wer die darin liegenden Knoten bearbeiten muss.
model.tl.bpe.bpml.LaneSet = LaneSet
model.tl.bpe.bpml.LaneSet.actorGroups = Gruppe der Akteure
model.tl.bpe.bpml.LaneSet.actorGroups.tooltip = Die Gruppen, deren Mitglieder die Aufgaben in dieser Bahn bearbeiten dürfen. Alternativ lassen sich die möglichen Akteure über die Akteur-Funktion berechnen.
model.tl.bpe.bpml.LaneSet.actorRule = Akteur-Funktion
model.tl.bpe.bpml.LaneSet.actorRule.tooltip = Funktion welche aus der Prozess-Instanz (übergeben als einziges Argument) die Menge der möglichen Aktoren (Personen oder Gruppen) berechnet.
model.tl.bpe.bpml.LaneSet.lanes = Bahnen
model.tl.bpe.bpml.LaneSet.lanes.tooltip = Die in diesem Element enthaltenen Bahnen, in der Reihenfolge des Diagramms. Sie werden gemeinsam mit ihrem Container gelöscht.
model.tl.bpe.bpml.LaneSet.tooltip = Basistyp für die Elemente, die Bahnen enthalten können: einen Prozess und eine Bahn selbst, so dass Bahnen geschachtelt werden können.
model.tl.bpe.bpml.ManualTask = ManualTask
model.tl.bpe.bpml.ManualTask.canEdit = Bearbeitbar
model.tl.bpe.bpml.ManualTask.canEdit.tooltip = Ob das Formular in diesem Prozesschritt bearbeitet werden kann. Wenn nicht, dann dient es nur der Anzeige des Zustandes des aktuellen Prozessobjektes.
model.tl.bpe.bpml.ManualTask.displayDescription = Darstellung
model.tl.bpe.bpml.ManualTask.formDefinition = Formular
model.tl.bpe.bpml.ManualTask.formDefinition.tooltip = Formular für diesen Prozesschritt. Dieses Formular wird einem Nutzer angezeigt, der für diesen Prozesschritt als Bearbeiter zugeordnet ist.
model.tl.bpe.bpml.ManualTask.tooltip = Eine Aufgabe, die ein Nutzer in einem Formular bearbeitet. Das Formular legt fest, welche Daten des Prozessobjektes angezeigt werden und ob sie bearbeitet werden dürfen.
model.tl.bpe.bpml.MessageEventDefinition = Nachricht
model.tl.bpe.bpml.MessageEventDefinition.tooltip = Das Ereignis sendet oder empfängt eine Nachricht.
model.tl.bpe.bpml.MessageFlow = MessageFlow
model.tl.bpe.bpml.MessageFlow.collaboration = Collaboration
model.tl.bpe.bpml.MessageFlow.collaboration.tooltip = Der Workflow, zu dem diese Nachricht gehört. Eine Nachricht wird gemeinsam mit ihrem Workflow gelöscht.
model.tl.bpe.bpml.MessageFlow.connectExpession = Prozessverbindung
model.tl.bpe.bpml.MessageFlow.connectExpession.tooltip = Funktion mit zwei Argumenten (sendende Prozessinstanz und empfangende Prozessinstanz), welche als Seiteneffekt eine Verknüpfung der beiden Prozessinstanzen herstellt.
model.tl.bpe.bpml.MessageFlow.source = Von
model.tl.bpe.bpml.MessageFlow.source.tooltip = Das Element, von dem die Nachricht ausgeht.
model.tl.bpe.bpml.MessageFlow.target = Nach
model.tl.bpe.bpml.MessageFlow.target.tooltip = Das Element, an das die Nachricht gerichtet ist.
model.tl.bpe.bpml.MessageFlow.tooltip = Eine Nachricht zwischen zwei Teilnehmern des Workflows. Sie verbindet die Durchläufe ihrer Prozesse miteinander.
model.tl.bpe.bpml.Named = Named
model.tl.bpe.bpml.Named.name = Name
model.tl.bpe.bpml.Named.name.tooltip = Technische Bezeichnung des Diagramm-Elements.
model.tl.bpe.bpml.Named.tooltip = Basistyp für alle Diagrammelemente, die einen technischen Namen tragen.
model.tl.bpe.bpml.Node = Node
model.tl.bpe.bpml.Node.incomming = Eingänge
model.tl.bpe.bpml.Node.incomming.tooltip = Die Kanten, die zu diesem Knoten führen.
model.tl.bpe.bpml.Node.lane = Bahn
model.tl.bpe.bpml.Node.lane.tooltip = Die Bahn des Diagramms, in der dieser Knoten liegt. Sie legt fest, wer den Knoten bearbeiten muss.
model.tl.bpe.bpml.Node.outgoing = Ausgänge
model.tl.bpe.bpml.Node.outgoing.tooltip = Die Kanten, die von diesem Knoten ausgehen.
model.tl.bpe.bpml.Node.process = Prozess
model.tl.bpe.bpml.Node.process.tooltip = Der Prozess, zu dem dieser Knoten gehört. Ein Knoten wird gemeinsam mit seinem Prozess gelöscht.
model.tl.bpe.bpml.Node.tooltip = Basistyp aller Knoten eines Prozessdiagramms: Ereignisse, Gateways, Aufgabenbeschreibungen und Teilnehmer.
model.tl.bpe.bpml.ParallelGateway = ParallelGateway
model.tl.bpe.bpml.ParallelGateway.tooltip = Ein Gateway, das den Prozess auf alle ausgehenden Wege gleichzeitig verzweigt beziehungsweise wartet, bis alle eingehenden Wege eingetroffen sind.
model.tl.bpe.bpml.Participant = Participant
model.tl.bpe.bpml.Participant.collaboration = Collaboration
model.tl.bpe.bpml.Participant.collaboration.tooltip = Der Workflow, zu dem dieser Teilnehmer gehört. Ein Teilnehmer wird gemeinsam mit dem Workflow gelöscht.
model.tl.bpe.bpml.Participant.defaultOperation = Standardoperation
model.tl.bpe.bpml.Participant.defaultOperation.tooltip = Operation, die bei jedem Schritt im Workflow zusätzlich ausgeführt wird.\n\nDie Funktion erhält vier Argumente, das Prozessobjekt, die alte Aufgabe, die neue Aufgabe (sofern vorhanden) und die Formulardaten des Auswahldialogs für die nächste Aufgabe. Ist für den Übergang kein Formulartyp definiert, ist das letzte Argument null. Werden mehrere parallele Aufgaben gestartet, ist das dritte Argument eine Menge mit allen Folgeaufgaben.\n\nWenn die Prozessdurchführung auf einen End-Event trifft, wird keine neue Aufgabe angelegt.
model.tl.bpe.bpml.Participant.displayDescription = Darstellung
model.tl.bpe.bpml.Participant.displayDescription.tooltip = Das Formular, in dem das Prozessobjekt angezeigt wird, wo für die Aufgabe kein eigenes Formular konfiguriert ist.
model.tl.bpe.bpml.Participant.dynamicName = Test-ID
model.tl.bpe.bpml.Participant.dynamicName.tooltip = Funktion, welche für automatisierte Tests eine ID für eine Aufgabe berechnet.
model.tl.bpe.bpml.Participant.edgeFormType = Formularmodell
model.tl.bpe.bpml.Participant.edgeFormType.tooltip = Der Typ, der das Formular beschreibt, das bei einem Zustandsübergang aus einer manuellen Aufgabe heraus dem Nutzer angezeigt werden soll. Für Attribute dieses Typs werden Eingabefelder in dem Forumar angezeigt, das sonst nur die nächste Aufgabe zur Auswahl stellt.
model.tl.bpe.bpml.Participant.exportDescription = Exportbeschreibung
model.tl.bpe.bpml.Participant.exportDescription.tooltip = Das Formular, das festlegt, welche Daten des Prozessobjektes beim Export eines Durchlaufs geschrieben werden.
model.tl.bpe.bpml.Participant.modelType = Modell-Typ
model.tl.bpe.bpml.Participant.modelType.tooltip = Typ des prozessgesteuerten Objektes (der Prozessdurchführung). Eine Instanz dieses Typs wird beim Starten eines Prozesses angelegt.
model.tl.bpe.bpml.Participant.process = Prozess
model.tl.bpe.bpml.Participant.process.tooltip = Der Prozess, den dieser Teilnehmer durchführt.
model.tl.bpe.bpml.Participant.taskLabel = Dynamische Aufgabenbezeichnung
model.tl.bpe.bpml.Participant.taskLabel.tooltip = Funktion, die den Namen einer Aufgabe in Workflow-Ansichten berechnet, wenn für die Aufgabe selbst kein Name konfiguriert ist. Die Funktion erhält zwei Argumente: die Prozessausführung und die aktuelle Aufgabe.
model.tl.bpe.bpml.Participant.tokenType = Zustandstyp
model.tl.bpe.bpml.Participant.tokenType.tooltip = Der Typ des Objektes, das den Zustand einer Prozessdurchführung in der aktuellen Aufgabe beschreibt.\n\nDer Verlauf einer Prozessdurchführung setzt sich aus der Liste aller Zustandsobjekte zusammen, die im Laufe der Prozessdurchführung angelegt wurden. In jedem dieser Objekte wird mindestens die Verweildauer des Prozesses in dieser Aufgabe und der Bearbeiter der Aufgabe gespeichert.\n\nDurch Angabe eines eigenen Typs für das Zustandsobjekt können weitere Informationen im Verlauf des Prozesses gesammelt werden, die nicht direkt mit dem Prozessobjekt selbst verknüpft sind.
model.tl.bpe.bpml.Participant.tooltip = Ein Teilnehmer des Workflows, einer je Pool des Diagramms. Der Teilnehmer legt den Typ des Prozessobjektes und dessen Darstellung fest.
model.tl.bpe.bpml.Process = Process
model.tl.bpe.bpml.Process.collaboration = Collaboration
model.tl.bpe.bpml.Process.collaboration.tooltip = Der Workflow, zu dem dieser Prozess gehört. Ein Prozess wird gemeinsam mit dem Workflow gelöscht.
model.tl.bpe.bpml.Process.edges = Kanten
model.tl.bpe.bpml.Process.edges.tooltip = Die Kanten dieses Prozesses. Sie werden aus dem Diagramm gelesen und gemeinsam mit dem Prozess gelöscht.
model.tl.bpe.bpml.Process.isExecutable = Ausführbar
model.tl.bpe.bpml.Process.isExecutable.tooltip = Ob der Prozess im Diagramm als ausführbar gekennzeichnet ist. Nur ein solcher Prozess wird von der Anwendung durchgeführt.
model.tl.bpe.bpml.Process.nodes = Knoten
model.tl.bpe.bpml.Process.nodes.tooltip = Die Knoten dieses Prozesses. Sie werden aus dem Diagramm gelesen und gemeinsam mit dem Prozess gelöscht.
model.tl.bpe.bpml.Process.participant = Teilnehmer
model.tl.bpe.bpml.Process.participant.tooltip = Der Teilnehmer, der diesen Prozess durchführt.
model.tl.bpe.bpml.Process.tooltip = Der Prozess eines Teilnehmers. Er enthält die Knoten und Kanten, die der Durchlauf durchläuft.
model.tl.bpe.bpml.ProcessFormDefinition = Prozessformular
model.tl.bpe.bpml.ProcessFormDefinition.tooltip = Eine Formulardefinition für eine Aufgabe eines Workflows. Neben der Anordnung der Attribute kann sie festlegen, welche davon in dieser Aufgabe bearbeitet werden dürfen.
model.tl.bpe.bpml.ReceiveTask = ReceiveTask
model.tl.bpe.bpml.ReceiveTask.tooltip = Eine Aufgabe, an der der Prozess auf eine Nachricht eines anderen Teilnehmers wartet.
model.tl.bpe.bpml.ScriptTask = ScriptTask
model.tl.bpe.bpml.ScriptTask.tooltip = Eine Aufgabe, die von einem Skript erledigt wird, ohne dass ein Nutzer beteiligt ist.
model.tl.bpe.bpml.SendTask = SendTask
model.tl.bpe.bpml.SendTask.contentTemplate = Inhalt
model.tl.bpe.bpml.SendTask.contentTemplate.tooltip = Text mit eingebetteten Ausdrücken. Über die Variable $model kann auf die aktuelle Aufgabe zugegriffen werden.
model.tl.bpe.bpml.SendTask.receiverGroups = Empfänger Gruppen
model.tl.bpe.bpml.SendTask.receiverGroups.tooltip = Die Gruppen, deren Mitglieder die Mail erhalten. Weitere Empfänger lassen sich über die Empfänger-Regel berechnen.
model.tl.bpe.bpml.SendTask.receiverRule = Empfänger Regel
model.tl.bpe.bpml.SendTask.receiverRule.tooltip = Funktion, welche die Empfänger (Personen) berechnet. Die Funktion erhält als einziges Argument die aktuelle Prozess-Instanz.
model.tl.bpe.bpml.SendTask.subjectTemplate = Betreff
model.tl.bpe.bpml.SendTask.subjectTemplate.tooltip = Text mit eingebetteten Ausdrücken. Über die Variable $model kann auf die aktuelle Aufgabe zugegriffen werden.
model.tl.bpe.bpml.SendTask.tooltip = Eine Aufgabe, die eine Mail versendet. Empfänger, Betreff und Inhalt werden an der Aufgabe konfiguriert.
model.tl.bpe.bpml.SequenceFlow = SequenceFlow
model.tl.bpe.bpml.SequenceFlow.formType = Formulartyp
model.tl.bpe.bpml.SequenceFlow.formType.tooltip = Modell für das Formular, das beim Zustandsübergang aus einer manuellen Aufgabe angezeigt wird. Die zugehörige Operation erhält dieses Formular, um die eingegebenen Werte weiterzuverarbeiten. \n\nBei Angabe eines Formulartyps muss zwingend auch eine Operation angegeben werden, da die eingegebenen Werte ansonsten unberücksichtigt bleiben.
model.tl.bpe.bpml.SequenceFlow.operation = Operation
model.tl.bpe.bpml.SequenceFlow.operation.tooltip = Auszuführende Operation, wenn der Workflow über diese Kante läuft. \n\nDie Angabe einer Operation kann nur an Kanten angegeben werden, die von einer manuellen Aufgabe beginnen. Die Angabe einer Operation ist gleichbedeutend mit der Modellierung eines Service-Tasks. Eine Operation an einer Kante vereinfacht das Diagramm und erzeugt keine zusätzlichen Einträge in der Historie der Prozessdurchführung.\n\nDie Funktion erhält vier Argumente, das Prozessobjekt, die alte Aufgabe, die neue Aufgabe (sofern vorhanden) und die Formulardaten des Auswahldialogs für die nächste Aufgabe. Ist für den Übergang kein Formulartyp definiert, ist das letzte Argument null. Werden mehrere parallele Aufgaben gestartet, ist das dritte Argument eine Menge mit allen Folgeaufgaben.
model.tl.bpe.bpml.SequenceFlow.rule = Bedingung
model.tl.bpe.bpml.SequenceFlow.rule.tooltip = Prädikatsfunktion, die bei gegebener Prozess-Instanz (als einziges Argument) testet, ob der Weg gegangen werden kann. Die Funktion muss hierfür entweder einen Wahrheitswert oder einen (internationalisierten) Fehlertext, der den Fehler beschreibt, liefern.
model.tl.bpe.bpml.SequenceFlow.skipStandardOperation = Standardoperation überspringen
model.tl.bpe.bpml.SequenceFlow.skipStandardOperation.tooltip = Wenn gesetzt, wird die am Prozess definierte Standardoperation für diesen Zustandsübergang nicht ausgeführt.
model.tl.bpe.bpml.SequenceFlow.tooltip = Eine Kante, über die der Workflow von einem Knoten zum nächsten übergeht. Eine Bedingung kann entscheiden, ob dieser Weg gegangen werden darf, und beim Übergang kann eine Operation ausgeführt werden.
model.tl.bpe.bpml.SequenceFlowRule = Kantenbedingung
model.tl.bpe.bpml.SequenceFlowRule.tooltip = Die Bedingung einer Kante. Sie entscheidet, ob der Workflow diesen Weg gehen darf, und kann eine Meldung angeben, die erklärt, warum nicht.
model.tl.bpe.bpml.ServiceTask = ServiceTask
model.tl.bpe.bpml.ServiceTask.action = Aktion
model.tl.bpe.bpml.ServiceTask.action.tooltip = Operation, die ausgeführt werden soll. Der Funktion wird als einziges Argument die aktuelle Prozess-Instanz übergeben.
model.tl.bpe.bpml.ServiceTask.tooltip = Eine Aufgabe, die die Anwendung selbst erledigt, indem sie die konfigurierte Operation ausführt.
model.tl.bpe.bpml.SignalEventDefinition = Signal
model.tl.bpe.bpml.SignalEventDefinition.tooltip = Das Ereignis sendet oder empfängt ein Signal. Im Gegensatz zu einer Nachricht ist ein Signal nicht an einen einzelnen Empfänger gerichtet.
model.tl.bpe.bpml.StartEvent = StartEvent
model.tl.bpe.bpml.StartEvent.requireReview = Prüfung erforderlich
model.tl.bpe.bpml.StartEvent.requireReview.tooltip = Steuert, was passiert, nachdem ein Benutzer das Anfangsformular ausgefüllt hat, wenn er einen neuen Prozess startet:\n\nWenn aktiviert (true): Der Prozess beginnt mit der ersten Aufgabe, so dass die Benutzer die soeben eingegebenen Daten überprüfen und ändern können.\n\nWenn deaktiviert (false): Der Prozess überspringt die erste Aufgabe und fährt direkt mit der zweiten Aufgabe fort.
model.tl.bpe.bpml.StartEvent.title = Bezeichnung
model.tl.bpe.bpml.StartEvent.title.tooltip = Bezeichnung des Start Events, wie sie einem Benutzer während der Workflow-Bearbeitung angezeigt werden soll.
model.tl.bpe.bpml.StartEvent.tooltip = Das Ereignis, mit dem ein Durchlauf des Prozesses beginnt. An ihm kann ein Nutzer mit passender Berechtigung den Workflow starten.
model.tl.bpe.bpml.SubProcess = SubProcess
model.tl.bpe.bpml.SubProcess.tooltip = Eine Aufgabe, die selbst ein Prozess ist. Sie enthält eigene Knoten und Kanten, die durchlaufen werden, wenn die Aufgabe erreicht wird.
model.tl.bpe.bpml.Task = Aufgabenbeschreibung
model.tl.bpe.bpml.Task.boundaryEvents = Boundary Events
model.tl.bpe.bpml.Task.boundaryEvents.tooltip = Die Ereignisse, die am Rand dieser Aufgabenbeschreibung hängen.
model.tl.bpe.bpml.Task.label = Label
model.tl.bpe.bpml.Task.label.tooltip = Bezeichnung der Aufgabe, wie sie einem Benutzer angezeigt wird, wenn eine abstrakte Aufgabe ohne einen Kontext (eine konkrete Prozessdurchführung) angezeigt wird. Normalerweise wird aber nicht eine abstrakte Aufgabe des Workflows, sondern eine konkrete Aufgabe in einer konkreten Prozessdurchführung angezeigt (z.B. in einer Überschrift oder einer Kachel).
model.tl.bpe.bpml.Task.labelFunction = Dynamische Bezeichnung
model.tl.bpe.bpml.Task.labelFunction.tooltip = Dynamische Berechnung des Aufgabennamens, wie er einem Benutzer während der Workflow-Bearbeitung angezeigt werden soll. Das Prozessmodell und die aktuelle Aufgabe können in die Berechnung einbezogen werden. Es wird eine Funktion mit drei Argumenten erwartet. Die aktuelle Prozessausführung (Instanz von `tl.bpe.execution:ProcessExecution`) wird als erstes Argument, die aktuell bearbeitete Aufgabe (`tl.bpe.bpml:Task`) als zweites Argument und der aktuelle Prozessschritt (`tl.bpe.execution:Token`) als drittes Argument übergeben.
model.tl.bpe.bpml.Task.titleFunction = Dynamische Bezeichnung
model.tl.bpe.bpml.Task.titleFunction.tooltip = Funktion, um die Bezeichnung einer Aufgabe zu berechnen. In die Berechnung kann das Prozessmodell und die aktuelle Aufgabe einfließen.\n\nErwartet wird eine Funktion mit bis zu vier Argumenten: Die angegebene statische Bezeichnung steht als erstes Argument zur Verfügung. Darauf folgen die aktuelle Prozessdurchführung (Instanz von `tl.bpe.execution:ProcessExecution`), die aktuell bearbeitete Aufgabenstellung (`tl.bpe.bpml:Task`) und als letztes Argument der aktuelle Prozesschritt (`tl.bpe.execution:Token`).\n\nIst keine dynamische Bezeichnung angegeben, so ist der Effekt derselbe, wie wenn die folgende Funktion angegeben wäre: i18n -> execution -> task -> token -> $i18n.localize($execution, $task, $token).
model.tl.bpe.bpml.Task.titleI18N = Bezeichnung
model.tl.bpe.bpml.Task.titleI18N.tooltip = Bezeichnung der Aufgabe, wie sie einem Nutzer bei der Workflow-Bearbeitung angezeigt werden soll (z.B. in einer Überschrift).\n\nWenn keine dynamische Bezeichnung angegeben ist, wird ein Platzhalter ({0}) im Text mit der zugrundeliegenden Prozessinstanz gefüllt.
model.tl.bpe.bpml.Task.tokenType = Zustandstyp
model.tl.bpe.bpml.Task.tokenType.tooltip = Der Typ des Objektes, das den Zustand einer Prozessdurchführung in der aktuellen Aufgabe beschreibt.\n\nDer Verlauf einer Prozessdurchführung setzt sich aus der Liste aller Zustandsobjekte zusammen, die im Laufe der Prozessdurchführung angelegt wurden. In jedem dieser Objekte wird mindestens die Verweildauer des Prozesses in dieser Aufgabe und der Bearbeiter der Aufgabe gespeichert.\n\nDurch Angabe eines eigenen Typs für das Zustandsobjekt können weitere Informationen im Verlauf des Prozesses gesammelt werden, die nicht direkt mit dem Prozessobjekt selbst verknüpft sind.
model.tl.bpe.bpml.Task.tooltip = Abstrakter Obertyp für alle Zustände in einer Workflow-Beschreibung. Eine aktive Prozessdurchführung befindet sich in einem oder mehreren solchen Zuständen. Die Kombination aus abstrakter Aufgabenbeschreibung und Prozessdurchführungsobjekt ergibt die konkrete Aufgabe. Eine solche konkrete Aufgabe muss je nach konkreter Aufgabenbeschreibung entweder von einem Nutzer des Systems in der Anwendung durchgeführt werden, oder sie wird automatisch oder zeitgesteuert vom System durchgeführt.
model.tl.bpe.bpml.TerminateEventDefinition = Beenden
model.tl.bpe.bpml.TerminateEventDefinition.tooltip = Das Ereignis beendet den gesamten Prozess unmittelbar, einschließlich aller darin noch offenen Aufgaben.
model.tl.bpe.bpml.TextAnnotation = TextAnnotation
model.tl.bpe.bpml.TextAnnotation.annotationAssociations = Annotationslinks
model.tl.bpe.bpml.TextAnnotation.annotationAssociations.tooltip = Die Verknüpfungen zu den Diagrammelementen, an denen diese Anmerkung hängt.
model.tl.bpe.bpml.TextAnnotation.text = Text
model.tl.bpe.bpml.TextAnnotation.text.tooltip = Der Text der Anmerkung, wie er im Diagramm eingetragen wurde.
model.tl.bpe.bpml.TextAnnotation.tooltip = Eine Textanmerkung des Diagramms. Sie dokumentiert das Element, an dem sie hängt, und hat keine Wirkung auf den Durchlauf.
model.tl.bpe.bpml.TimerEventDefinition = Zeit
model.tl.bpe.bpml.TimerEventDefinition.delayInMillis = Wartezeit
model.tl.bpe.bpml.TimerEventDefinition.delayInMillis.tooltip = Die Wartezeit, nach der das Ereignis eintritt. Der Wert ergibt sich aus der am Ereignis konfigurierten Wartezeit und deren Einheit.
model.tl.bpe.bpml.TimerEventDefinition.delayInUnit = Wartezeit
model.tl.bpe.bpml.TimerEventDefinition.timeUnit = Einheit
model.tl.bpe.bpml.TimerEventDefinition.tooltip = Das Ereignis tritt ein, nachdem eine Wartezeit abgelaufen ist.
model.tl.bpe.bpml.UserTask = UserTask
model.tl.bpe.bpml.UserTask.tooltip = Eine Aufgabe, die ein Nutzer außerhalb der Anwendung erledigt. Die Workflow-Durchführung wartet nur, bis die Aufgabe als erledigt gemeldet wird.
model.tl.bpe.bpml.tooltip = Modul mit den Typen, die einen Workflow beschreiben. Sie spiegeln die Elemente eines BPMN-Diagramms und halten die zusätzliche Konfiguration, die das Diagramm ausführbar macht.
