class.com.top_logic.ai.mcp.server.authentication.I18NConstants.ERROR_AUTHENTICATION_UNAVAILABLE__DOMAIN = Die MCP-Authentifizierung "{0}" konnte nicht erzeugt werden und authentifiziert daher niemanden. Prüfen Sie deren Konfiguration und deren Secret an MCPServerService.
class.com.top_logic.ai.mcp.server.authentication.I18NConstants.ERROR_AUTHENTICATION_UNAVAILABLE__DOMAIN.help = Eine konfigurierte Authentifizierung konnte nicht erzeugt werden und authentifiziert daher niemanden.
class.com.top_logic.ai.mcp.server.authentication.I18NConstants.ERROR_INTERACTION_ALREADY_BOUND = Diese Anfrage wird abgewiesen: Ihr Thread trägt bereits eine TopLogic-Interaktion, so dass das authentifizierte Konto nicht gebunden werden konnte und die Anfrage als jemand anderes gehandelt hätte.
class.com.top_logic.ai.mcp.server.authentication.I18NConstants.ERROR_INTERACTION_ALREADY_BOUND.help = Die Anfrage traf auf einem Thread ein, der bereits eine TopLogic-Interaktion trägt.
class.com.top_logic.ai.mcp.server.authentication.I18NConstants.ERROR_NO_ACCOUNT_FOR_CREDENTIAL = Authentifiziert, aber diese Zugangsdaten benennen kein Anwendungskonto. Der MCP-Endpunkt handelt als das authentifizierte Konto und niemals im Systemkontext. Vergeben Sie daher eine user-id für das Secret - am besten ein eigenes Dienstkonto.
class.com.top_logic.ai.mcp.server.authentication.I18NConstants.ERROR_NO_ACCOUNT_FOR_CREDENTIAL.help = Der Aufrufer hat sich authentifiziert, aber die Zugangsdaten sind keinem Anwendungskonto zugeordnet.
class.com.top_logic.ai.mcp.server.authentication.I18NConstants.ERROR_NO_AUTHENTICATION_CONFIGURED = Der MCP-Endpunkt /mcp/* ist nicht verfügbar: Diese Anwendung konfiguriert keine Authentifizierung dafür, und der Endpunkt bedient keine Anfrage, die er keinem Konto zuordnen kann. Konfigurieren Sie eine Authentifizierung und ein Secret an MCPServerService - siehe doc/security/mcp-endpoint.md.
class.com.top_logic.ai.mcp.server.authentication.I18NConstants.ERROR_NO_AUTHENTICATION_CONFIGURED.help = Der Endpunkt bedient niemanden, weil keine Authentifizierung dafür konfiguriert ist.
class.com.top_logic.ai.mcp.server.authentication.I18NConstants.ERROR_SESSION_BELONGS_TO_ANOTHER_ACCOUNT = Diese mcp-session-id gehört zu einem anderen Konto. Eine MCP-Sitzung bleibt bei dem Konto, das sie eröffnet hat. Eröffnen Sie mit einer initialize-Anfrage eine eigene Sitzung.
class.com.top_logic.ai.mcp.server.authentication.I18NConstants.ERROR_SESSION_BELONGS_TO_ANOTHER_ACCOUNT.help = Ein zweites Konto hat versucht, eine MCP-Sitzung zu verwenden, die ein anderes Konto eröffnet hat.
com.top_logic.ai.mcp.server.MCPServerService = MCP-Serverdienst
com.top_logic.ai.mcp.server.MCPServerService.Config.authentications = Authentifizierungen
com.top_logic.ai.mcp.server.MCPServerService.Config.authentications.tooltip = Wie ein Aufrufer des MCP-Endpunkts nachweist, wer er ist. <p> Konfigurieren Sie mindestens eine, sonst weist der Endpunkt jede Anfrage ab: Er bedient nichts, was er keinem Konto zuordnen kann. HTTP Basic authentifiziert gegen die Passwortdatenbank des Kontos selbst, ein API-Key ordnet einen Schlüssel einem benannten Konto zu, und ein Bearer-Token wird gegen den Autorisierungsserver geprüft, den die Installation betreibt. Ein Aufrufer darf eines der konfigurierten Verfahren verwenden. </p> <p> Bevorzugen Sie einen API-Key für ein Dienstkonto gegenüber dem Passwort einer echten Person: Er ist einzeln widerrufbar, und er hält einen Login aus einer Client-Konfigurationsdatei heraus. </p>
com.top_logic.ai.mcp.server.MCPServerService.Config.dynamic-resources = Dynamische Ressourcen
com.top_logic.ai.mcp.server.MCPServerService.Config.dynamic-resources.tooltip = Liste der konfigurierbaren dynamischen Ressourcen. <p> Jede Ressource wird nach dem polymorphen Konfigurationsmuster konfiguriert, so dass verschiedene Implementierungen MCP-Ressourcen auf unterschiedliche Weise bereitstellen können: </p> <ul> <li><i>Konfigurierbare Ressourcenvorlage</i> - Verwendet TL-Script-Ausdrücke zur Berechnung des Inhalts</li> <li>Zukünftige Implementierungen können weitere Ressourcentypen hinzufügen (statisch, datenbankgesteuert usw.)</li> </ul>
com.top_logic.ai.mcp.server.MCPServerService.Config.keep-alive-interval = Keep-alive-Intervall
com.top_logic.ai.mcp.server.MCPServerService.Config.keep-alive-interval.tooltip = Keep-alive-Intervall in Sekunden für SSE-Verbindungen. <p>Standard: 30 Sekunden</p>
com.top_logic.ai.mcp.server.MCPServerService.Config.secrets = Secrets
com.top_logic.ai.mcp.server.MCPServerService.Config.secrets.tooltip = Die Secrets, gegen die die konfigurierten Authentifizierungen einen Aufrufer prüfen. <p> Jedes Secret benennt die Domain der Authentifizierung, zu der es gehört. Ein Secret muss das Konto benennen, als das die Anfrage dann handelt: Dieser Endpunkt verarbeitet keine Anfrage im Systemkontext, daher wird ein Secret ohne Konto zur Laufzeit abgewiesen. </p>
com.top_logic.ai.mcp.server.MCPServerService.Config.server-name = Name des Servers
com.top_logic.ai.mcp.server.MCPServerService.Config.server-name.tooltip = Der Name des MCP-Servers.
com.top_logic.ai.mcp.server.MCPServerService.Config.server-version = Server-Version
com.top_logic.ai.mcp.server.MCPServerService.Config.server-version.tooltip = Die Version des MCP-Servers.
com.top_logic.ai.mcp.server.MCPServerService.tooltip = TopLogic-Dienst, der einen MCP-Server (Model Context Protocol) bereitstellt, um anwendungsspezifische APIs über den HTTP-Transport für KI-Modelle zugänglich zu machen. <p> Dieser Dienst initialisiert beim Start der Anwendung einen MCP-Server unter Verwendung des MCP-Protokolls über HTTP und sorgt beim Herunterfahren für eine ordnungsgemäße Bereinigung. Der Server kann über die TopLogic-Anwendungskonfiguration konfiguriert werden. </p> <p> Der Dienst stellt HTTP-Endpunkte bereit (registriert in der Datei „web-fragment.xml“ unter „/mcp/*“), die das MCP-Protokoll für die bidirektionale Kommunikation zwischen KI-Clients und der TopLogic-Anwendung implementieren. Der <i>MCP-Authentifizierungsfilter</i> schützt diesen Pfad: Er authentifiziert jede Anfrage und öffnet den TLContext des ermittelten Kontos, in dem die Protokoll-Handler dann laufen. </p> <p> <b>Dieser Dienst ist in der mitgelieferten Konfiguration dieses Moduls deaktiviert</b>, und eine Anwendung, die ihn einschaltet, muss festlegen, wer ihn erreichen darf: /mcp/* bedient keine Anfrage, die es keinem Konto zuordnen kann, und akzeptiert nur die <i>Authentifizierungen</i>, die die Anwendung konfiguriert. Wird keine konfiguriert, wird jede Anfrage abgewiesen. Siehe doc/security/mcp-endpoint.md und Issue #261. Solange der Dienst deaktiviert ist, beantwortet das MCPTransportServlet den gesamten Pfad /mcp/* mit dem Status 503. </p> <p> Der Dienst nutzt <i>den Servlet-Kontext</i>, um beim Start den Kontextpfad der Anwendung abzurufen, und stellt so sicher, dass an Clients gesendete Endpunkt-URLs unabhängig von der Bereitstellungskonfiguration den korrekten Kontextpfad enthalten. </p>
com.top_logic.ai.mcp.server.dynamic.ConfigurableResourceTemplate = Konfigurierbare Ressourcenvorlage
com.top_logic.ai.mcp.server.dynamic.ConfigurableResourceTemplate.tooltip = Implementierung einer <i>dynamischen Ressource</i>, die TL-Script-Ausdrücke zur dynamischen Erzeugung von Ressourceninhalten verwendet. <p> Diese Klasse überbrückt die konfigurationsbasierte Definition der Ressourcenvorlage<i>(Konfiguration der Ressourcenvorlage</i>) mit dem Mechanismus des MCP-Servers zur Handhabung von Ressourcen. Sie extrahiert Parameter aus dem URI, übergibt sie an den TL-Script-Ausdruck und gibt den berechneten Inhalt als MCP-Ressource zurück. </p>
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.content = Inhalt
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.content.tooltip = TL-Script-Ausdruck, um den Inhalt der Ressource zu berechnen. <p> Der Ausdruck hat Zugriff auf Parameter, die aus der URI-Vorlage als implizite Variablen extrahiert wurden. Der Ausdruck wird automatisch in eine Funktion verpackt, die Parameter deklariert, die mit den Parameternamen der URI-Vorlage übereinstimmen, so dass sie innerhalb des Ausdrucks verfügbar sind. </p> <p> Wenn die URI-Vorlage beispielsweise "myapp:{version}" lautet und eine Anfrage für "myapp://item/12345/version/v2" eingeht, wird der Ausdruck so ausgeführt, als wäre er eingeschlossen in: itemId -&gt; version -&gt; yourExpression, wobei $itemId den Wert "12345" und $version den Wert "v2" hat. </p> <p> Der Ausdruck kann verschiedene Typen zurückgeben, die wie folgt behandelt werden: </p> <ul> <li><i>Sammlung</i> - Jedes Element wird in ein separates Element <i>des Ressourceninhalts</i> in der Ergebnisliste umgewandelt, so dass eine einzige Ressourcenvorlage mehrere Ressourceninhalte zurückgeben kann</li> <li><i>binäre Daten</i> - Der Inhaltstyp wird geprüft: textbasierte Typen (z. B. text/*, application/json, application/xml) werden als Text ausgegeben, während binäre Typen (z. B. application/pdf, image/*) base64-kodiert und als Blob ausgegeben werden</li> <li><i>map</i> - Serialisiert als JSON mit dem Inhaltstyp application/json</li> <li><i>HTML-Fragment</i> - Wird in einen HTML-String mit dem Inhaltstyp text/html umgewandelt.</li> <li>Jeder andere Wert - wird mit toString() in einen String mit dem Inhaltstyp text/plain umgewandelt</li> </ul> <p> Wenn ein MIME-Typ explizit über <i>MIME-Typ</i> konfiguriert wird, überschreibt er den Standard-Inhaltstyp für den Rückgabetyp. </p> <p> Beispiel für einen einzelnen Parameter (URI-Vorlage: "myapp:{itemId}"): </p> <pre> $myService.getItem($itemId).toJson() </pre> <p> Beispiel für mehrere Parameter (URI-Vorlage: "myapp:{version}"): </p> <pre> $myService.getItem($itemId, $version).toJson() </pre> <p> Beispiel, das eine Map zurückgibt (wird als JSON serialisiert): </p> <pre> map("id" -&gt; $itemId, "data" -&gt; $myService.getItem($itemId)) </pre>
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.description = Beschreibung
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.description.tooltip = Beschreibung dessen, was diese Ressource bietet. <p> Sollte erklären, welche Daten die Ressource zurückgibt und welche Parameter sie erwartet. </p>
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.mime-type = MIME-Typ
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.mime-type.tooltip = MIME-Typ des Ressourceninhalts. <p> Übliche Werte: </p> <ul> <li>"application/json" - JSON-Daten</li> <li>"text/plain" - Einfacher Text</li> <li>"text/html" - HTML-Inhalt</li> <li>"text/markdown" - Markdown-Inhalt</li> </ul>
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.name = Name
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.name.tooltip = Vorlage für Ressourcennamen. <p> Kann Parameterplatzhalter wie "{itemId}" enthalten, die durch tatsächliche Werte aus dem URI ersetzt werden. </p>
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.title = Titel
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.title.tooltip = Von Menschen lesbarer Titel für die Ressource. <p> Dieser wird den Benutzern/Agenten angezeigt, die die verfügbaren Ressourcen durchsuchen. </p>
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.uri-template = URI-Vorlage
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.uri-template.tooltip = URI-Vorlage mit Parameterplatzhaltern. <p> Die Vorlage verwendet das Format scheme:{param2}, wobei die Parameter in geschweifte Klammern eingeschlossen sind. Diese Parameter werden aus dem URI extrahiert und an den TL-Script-Ausdruck übergeben. </p> <p> Beispiel: "myapp:{itemId}" </p>
