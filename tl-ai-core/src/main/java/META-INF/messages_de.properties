com.top_logic.tl.ai.core.tools.web.TavilySearchEngine.Config.search-depth.tooltip = Suchtiefe: einfach (schneller) oder erweitert (gründlicher).
com.top_logic.tl.ai.core.tools.web.TavilySearchEngine.tooltip = <i>Websuchmaschine</i>, die von der Tavily Search API (POST /search) unterstützt wird.
com.top_logic.tl.ai.core.tools.web.WebToolsService = Webtools-Dienst
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.fetch-max-bytes = Maximale Bytes pro Abruf
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.fetch-max-bytes.tooltip = Maximale Anzahl von Bytes, die webFetch von einer Seite liest, bevor es anhält.
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.fetch-max-chars = Maximale Zeichen pro Abruf
