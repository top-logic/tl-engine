class.com.top_logic.security.captcha.I18NConstants.ERROR_CAPTCHA_INVALID = The security check was not completed or has expired. Please confirm it again.
com.top_logic.security.captcha.CaptchaService = Captcha service
com.top_logic.security.captcha.CaptchaService.Config.cost = Cost
com.top_logic.security.captcha.CaptchaService.Config.cost.tooltip = The work of one attempt to solve a challenge: the number of iterations of the key derivation function.
com.top_logic.security.captcha.CaptchaService.Config.expires = Expires
com.top_logic.security.captcha.CaptchaService.Config.expires.tooltip = How long a created challenge can be solved and submitted.
com.top_logic.security.captcha.CaptchaService.Config.hmac-key = HMAC key
com.top_logic.security.captcha.CaptchaService.Config.hmac-key.tooltip = The secret key signing the challenges. <p> Recommended is a reference to the key by its secret name, e.g. <code>&lt;hmac-key name="tl_captcha_hmac_key"/&gt;</code>. An attribute value is an encrypted key, or a plain key with the prefix <code>unencrypted:</code>. The key is read whenever a challenge is created or checked; changing it invalidates the challenges created before. </p> <p> Empty: the service creates a random key when it starts. A challenge is then only accepted by the node that created it, and only until this node restarts. A production installation, at least one with several nodes, configures the key. </p>
com.top_logic.security.captcha.CaptchaService.Config.max-number = Maximum number
com.top_logic.security.captcha.CaptchaService.Config.max-number.tooltip = The maximum number of attempts the browser needs to solve a challenge. <p> The number of attempts of each challenge is drawn at random from the upper half of this value. Together with the cost of one attempt, it decides how long a browser computes, usually a few seconds. </p>
com.top_logic.security.captcha.CaptchaService.tooltip = Proof-of-work captcha (ALTCHA) protecting a form an anonymous visitor submits. <p> The service creates signed challenges for the ALTCHA widget in the browser. The widget solves the challenge by computation, without any interaction of the visitor, and submits its solution with the form. The service accepts a solution only if it solves a challenge the service has signed, the challenge has not expired, and the solution has not been accepted before. No external service is involved. </p> <p> The challenges are signed with the key of the installation. Without one, the service signs with a random key it creates when it starts: a challenge is then accepted only by the node that created it, and only until that node restarts. </p> <p> The difficulty is the cost of one attempt times the number of attempts, which is drawn for each challenge from the upper half of the maximum number. A challenge is valid for the time given by <i>Expires</i>. </p>
