com.top_logic.tl.ai.core.provider.openai.OpenAICompatibleProviderConfig.Config.base-url.tooltip = Die Basis-URL des OpenAI-kompatiblen Dienstes. <p> Obligatorisch - es gibt keinen sinnvollen Standard für Dienste von Drittanbietern. </p>
com.top_logic.tl.ai.core.provider.openai.OpenAICompatibleProviderConfig.tooltip = <i>LLM-Anbieterkonfiguration</i> für Drittanbieterdienste, die das OpenAI-Protokoll implementieren. <p> Im Gegensatz zur <i>OpenAI-Anbieterkonfiguration</i> ist die Basis-URL obligatorisch (es gibt keinen sinnvollen Standard). Der API-Schlüssel ist optional, da einige Dienste unterschiedliche Authentifizierungsmechanismen verwenden. </p>
