model.mandatorStructure.Mandator.all.description = Beschreibung
model.mandatorStructure.Mandator.all.description.tooltip = Eine frei formulierte Beschreibung des Mandanten.
model.mandatorStructure.Mandator.all.documents = Dokumente
model.mandatorStructure.Mandator.all.documents.tooltip = Der Dokumentenordner, in dem die zum Mandanten gehörenden Dokumente abgelegt werden. Der Ordner wird gemeinsam mit dem Mandanten gelöscht.
model.mandatorStructure.Mandator.all.name = Name
