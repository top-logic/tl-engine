com.top_logic.tl.ai.core.execution.AgentExecutionStore.SessionKind.CHAT = Chat
com.top_logic.tl.ai.core.execution.AgentExecutionStore.SessionKind.CHAT.tooltip = Interactive chat with a person as owner.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.SessionKind.SCHEDULED = Scheduled
com.top_logic.tl.ai.core.execution.AgentExecutionStore.SessionKind.SCHEDULED.tooltip = Run triggered by a scheduler.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.SessionKind.SCRIPT = Script
com.top_logic.tl.ai.core.execution.AgentExecutionStore.SessionKind.SCRIPT.tooltip = Run started from a TL-Script function.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.tooltip = Service that persists and retrieves the <code>tl.ai.agent</code> execution model: <i>agent session</i>, <i>agent execution</i>, <i>interaction request</i> and <i>agent task</i>. <p> This is the single write path for agent-run persistence. Any entry point that runs an agent (chat, TL-Script, delegation, background jobs) records its run through this service, so all executions are uniformly queryable regardless of how they were started. </p> <p> All mutating methods run on a dedicated writer thread inside a fresh system interaction with their own <i>transaction</i>. Callers therefore need neither a transaction nor a committable KB context — recording works from any caller context, including read-only ones such as TL-Script evaluation during rendering (whose ImmutableDBContext cannot commit). Queries run on the calling thread and require a bound TopLogic context. </p> <p> <b>Invariant:</b> nothing reachable from a KnowledgeBase UpdateListener (or any other synchronous commit hook) may call a mutating method of this service — the caller blocks on the single writer thread, whose commit synchronously notifies those listeners, so such a call closes a deadlock cycle. </p> <p> Callers do <em>not</em> automatically see their own writes: writer commits happen in a separate session, and a subsession's stable view only advances at sanctioned points. The chat servlet advances the session revision at request begin, which covers all HTTP read-back paths. </p>
com.top_logic.tl.ai.core.htmlpages.GeneratedHtmlPageService = Generated HTML page service
com.top_logic.tl.ai.core.htmlpages.GeneratedHtmlPageService.tooltip = Service that persists and retrieves <i>generated HTML page</i> entities.
com.top_logic.tl.ai.core.mcp.HttpMcpTransport = HTTP mcp transport
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.bearer-token-env-var = Bearer token env var
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.bearer-token-env-var.tooltip = Name of an environment variable holding a bearer token. <p> The variable is read from the server's environment at connect time and its value is sent in the Authorization header using the Bearer scheme. This keeps the secret itself out of the configuration. </p>
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.headers = Headers
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.headers.tooltip = Static HTTP headers sent with every request. <p> Each entry is a header name and the value to send under it, e.g. an API key header the server expects in addition to the bearer token. </p>
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.url = URL
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.url.tooltip = The URL of the MCP server endpoint (e.g., "https://mcp.example.com/mcp").
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.tooltip = <i>Mcp transport configuration</i> creating an MCP HTTP transport (Streamable HTTP). <p> The MCP server runs as an external HTTP service. Authentication is handled via static headers or a bearer token resolved from an environment variable at connect time. </p>
com.top_logic.tl.ai.core.mcp.McpServerRegistry = Mcp server registry
com.top_logic.tl.ai.core.mcp.McpServerRegistry$McpServerConfig = Mcp server configuration
com.top_logic.tl.ai.core.mcp.McpServerRegistry$McpServerConfig.tooltip = Configuration for a single MCP server.
com.top_logic.tl.ai.core.mcp.McpServerRegistry.Config.servers = Servers
com.top_logic.tl.ai.core.mcp.McpServerRegistry.Config.servers.tooltip = Map of named MCP server configurations.
com.top_logic.tl.ai.core.mcp.McpServerRegistry.McpServerConfig.tool-timeout-seconds = Tool timeout seconds
com.top_logic.tl.ai.core.mcp.McpServerRegistry.McpServerConfig.tool-timeout-seconds.tooltip = Timeout in seconds for individual tool calls.
com.top_logic.tl.ai.core.mcp.McpServerRegistry.McpServerConfig.transport = Transport
com.top_logic.tl.ai.core.mcp.McpServerRegistry.McpServerConfig.transport.tooltip = Transport configuration (stdio or HTTP).
com.top_logic.tl.ai.core.mcp.McpServerRegistry.tooltip = Service managing connections to external MCP servers. <p> Configured via XML with named MCP server entries. Each server is connected at startup, and its tools are discovered via the MCP tools/list call. Agents reference servers by name via their mcpServers attribute; <i>agent factory</i> pulls the server's tools into the agent's <i>tool catalog</i>. </p>
com.top_logic.tl.ai.core.mcp.NamedValueConfig = Named value configuration
com.top_logic.tl.ai.core.mcp.NamedValueConfig.tooltip = A named string value for use in config maps. <p> Used for the environment variables and HTTP headers of an MCP transport: one entry carries the name to set and the value to set it to. </p>
com.top_logic.tl.ai.core.mcp.NamedValueConfig.value = Value
com.top_logic.tl.ai.core.mcp.NamedValueConfig.value.tooltip = The value.
com.top_logic.tl.ai.core.mcp.StdioMcpTransport = Stdio mcp transport
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.args = Arguments
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.args.tooltip = Command-line arguments passed to the command. <p> In XML config, provide as comma-separated values: args="-y,@modelcontextprotocol/server-github" </p>
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.command = Command
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.command.tooltip = The command to execute (e.g., "npx" or "python").
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.env = Env
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.env.tooltip = Environment variables for the subprocess. <p> Use this to pass API keys without writing them into the configuration: an entry value of ${env:GITHUB_TOKEN} is resolved from the server's own environment. </p>
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.tooltip = <i>Mcp transport configuration</i> creating an MCP stdio transport (subprocess). <p> The MCP server is started as a child process. Communication happens via stdin/stdout using JSON-RPC. Environment variables can be used to pass API keys or other secrets. </p>
com.top_logic.tl.ai.core.provider.AuthScheme = Auth scheme
com.top_logic.tl.ai.core.provider.AuthScheme.API_KEY = Api key
com.top_logic.tl.ai.core.provider.AuthScheme.API_KEY.tooltip = Azure <code>OpenAI</code> subscription key, sent as the value of the api-key header. <p>Used when connecting directly to an Azure <code>OpenAI</code> resource endpoint that requires the subscription key in the api-key header rather than an Authorization bearer token.</p>
com.top_logic.tl.ai.core.provider.AuthScheme.BEARER = Bearer
com.top_logic.tl.ai.core.provider.AuthScheme.BEARER.tooltip = Standard OAuth2 bearer token, sent as the Authorization header with the Bearer scheme. <p>Used by <code>OpenAI</code>, Mistral, <code>xAI</code>, and Azure-compatible gateways such as Nexus that accept bearer tokens in the standard header.</p>
com.top_logic.tl.ai.core.provider.AuthScheme.tooltip = HTTP authentication scheme used when sending requests to an LLM provider endpoint. <p><i>Bearer</i> covers the standard <code>OpenAI</code> style: the key follows the Bearer scheme in the Authorization header. <i>Api key</i> covers the Azure <code>OpenAI</code> convention of sending the key in a plain api-key header without a scheme prefix.</p>
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.base-url = Base URL
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.base-url.tooltip = The base URL of the provider API endpoint.
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.catalog-provider-id = Catalog provider ID
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.catalog-provider-id.tooltip = The provider ID used to look up model metadata from the remote catalog (models.dev). <p> Each provider supplies a sensible default matching its models.dev entry. Leave empty for providers that have no remote catalog (e.g. local servers) — their models must be defined in the model catalog manually. </p>
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.connect-timeout = Connect timeout
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.connect-timeout.tooltip = TCP connection timeout in seconds. <p> Controls how long the HTTP client waits to establish a TCP connection to the provider endpoint before giving up. </p>
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.custom-headers = Custom headers
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.custom-headers.tooltip = Extra HTTP headers sent on every request to this provider. <p> Useful for custom authentication schemes, routing headers, or provider-specific metadata that must accompany each API call. </p>
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.models = Models
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.models.tooltip = Model names enabled for this provider. <p> Only models listed here are available for use. If empty, no models are exposed from this provider. </p>
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.request-timeout = Request timeout
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.request-timeout.tooltip = Total streaming request timeout in seconds. <p> Maximum wall-clock time allowed for a complete streaming request, including the time spent receiving streamed tokens. A generous default accommodates long-running agent responses. </p>
com.top_logic.tl.ai.core.provider.LLMService = LLM service
com.top_logic.tl.ai.core.provider.LLMService$AgentExecutionConfig = Agent execution configuration
com.top_logic.tl.ai.core.provider.LLMService$AgentExecutionConfig.tooltip = Agent execution configuration: chat entry point, default model, and per-agent overrides. <p> Agent definitions (identity, system prompt, tools, delegations) are managed by <i>TopLogic-Agents and Skills</i> and the knowledge base. This section controls the operational side: which agent serves as the chat entry point, which model to use by default, and per-agent overrides for model selection and execution parameters. </p>
com.top_logic.tl.ai.core.provider.LLMService$AgentOverride = Agent override
com.top_logic.tl.ai.core.provider.LLMService$AgentOverride.tooltip = Per-agent override for model selection and execution parameters. <p> Each entry overrides the default model for a specific agent and optionally configures execution parameters (max turns, timeouts, tool choice) and model-specific settings (temperature, reasoning effort). Parameters left null inherit defaults from the model catalog or system defaults. </p>
com.top_logic.tl.ai.core.provider.LLMService$ModelCatalogConfig = Model catalog configuration
com.top_logic.tl.ai.core.provider.LLMService$ModelCatalogConfig.tooltip = Configuration for the model metadata catalog. <p> Provides read-only metadata about each model's capabilities (tool calling, reasoning, temperature support) and limits (context window, max output tokens). The catalog is fetched from <a href="https://models.dev">models.dev</a> on startup for all models configured in the provider section. Models not found in the remote catalog (e.g. locally hosted models) can be defined manually in the model overrides. </p>
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.agent-overrides = Agent overrides
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.agent-overrides.tooltip = Per-agent overrides. Agents not listed here use the default model. Applies to all agents regardless of source (config-defined or KB).
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.chat-entry-point = Chat entry point
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.chat-entry-point.tooltip = The agent that serves as the main entry point when a user opens a new chat session. <p> This agent receives the initial user message and orchestrates the conversation. It may delegate to other agents via its delegations list. </p>
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.default-model = Default model
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.default-model.tooltip = The fallback model used by agents that have no explicit override in <i>Agent overrides</i>. <p> To assign a specific model (and optional tuning parameters) to an individual agent, add an entry to the agent overrides map instead. </p>
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.owner = Owner
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.owner.tooltip = The enclosing service <i>configuration</i>, used to resolve configured models from its provider section within the same edit form.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.context-window = Context window
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.context-window.tooltip = Context window size override, or null for catalog default.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-retries = Maximum retries
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-retries.tooltip = Maximum retries on transient errors, or null for default.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-tokens = Maximum tokens
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-tokens.tooltip = Maximum output tokens per LLM call, or null for catalog default.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-tool-result-chars = Maximum tool result chars
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-tool-result-chars.tooltip = Maximum characters per tool result, or null for default.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-turns = Maximum turns
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-turns.tooltip = Maximum agent loop turns, or null for default.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.model = Model
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.model.tooltip = The model to use for this agent.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.reasoning-effort = Reasoning effort
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.reasoning-effort.tooltip = <code>OpenAI</code>/<code>xAI</code> reasoning effort (low/medium/high), or null.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.reasoning-summary = Reasoning summary
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.reasoning-summary.tooltip = <code>OpenAI</code>/<code>xAI</code> reasoning summary (auto/detailed), or null.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.temperature = Temperature
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.temperature.tooltip = Sampling temperature, or null for default.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.thinking-effort = Thinking effort
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.thinking-effort.tooltip = Anthropic thinking effort (low/medium/high/max), or null.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.timeout-seconds = Timeout seconds
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.timeout-seconds.tooltip = Request timeout in seconds, or null for default.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.tool-choice = Tool choice
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.tool-choice.tooltip = Tool choice (AUTO/REQUIRED/NONE), or null for provider default.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.top-k = Top-K
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.top-k.tooltip = Anthropic top-k parameter, or null.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.top-p = Top-P
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.top-p.tooltip = Top-p sampling parameter, or null for default.
com.top_logic.tl.ai.core.provider.LLMService.Config.agent-execution = Agent execution
com.top_logic.tl.ai.core.provider.LLMService.Config.agent-execution.tooltip = Agent execution configuration: chat entry point, default model, and per-agent overrides for model selection and execution parameters.
com.top_logic.tl.ai.core.provider.LLMService.Config.model-catalog = Model catalog
com.top_logic.tl.ai.core.provider.LLMService.Config.model-catalog.tooltip = Model metadata catalog describing each model's capabilities and limits. <p> Populated automatically from the remote <a href="https://models.dev">models.dev</a> catalog on startup. Manual overrides can be added for models not listed in the remote catalog (e.g. local or custom-hosted models). </p>
com.top_logic.tl.ai.core.provider.LLMService.Config.providers = Providers
com.top_logic.tl.ai.core.provider.LLMService.Config.providers.tooltip = The configured LLM providers, keyed by provider name. <p> Each entry carries provider-specific properties. </p>
com.top_logic.tl.ai.core.provider.LLMService.ModelCatalogConfig.catalog-url = Catalog URL
com.top_logic.tl.ai.core.provider.LLMService.ModelCatalogConfig.catalog-url.tooltip = The URL of the remote model catalog.
com.top_logic.tl.ai.core.provider.LLMService.ModelCatalogConfig.llm-configuration = Model metadata
com.top_logic.tl.ai.core.provider.LLMService.ModelCatalogConfig.llm-configuration.tooltip = Per-model metadata (limits, capabilities). <p> Populated automatically from the remote catalog on startup. Read-only — do not modify manually. </p>
com.top_logic.tl.ai.core.provider.LLMService.ModelCatalogConfig.model-overrides = Model overrides
com.top_logic.tl.ai.core.provider.LLMService.ModelCatalogConfig.model-overrides.tooltip = Manually defined model metadata for models not in the remote catalog. <p> Use this for local models or <code>OpenAI</code>-compatible endpoints whose models are not listed on models.dev. Entries here take precedence over catalog entries with the same name. </p>
com.top_logic.tl.ai.core.provider.LLMService.tooltip = Central service for LLM provider management, model resolution, and agent execution configuration. <p> The service configuration is organized into three sections: </p> <ol> <li><b>Providers</b> — connection details for each LLM provider (API keys, base URLs, model allowlists). Each provider entry defines how to reach a specific LLM API endpoint and which models are enabled.</li> <li><b>Agent Execution</b> — configures the chat entry-point agent, the default model used by all agents, and optional per-agent overrides for model selection and execution parameters (temperature, max tokens, timeouts, reasoning effort, etc.).</li> <li><b>Model Catalog</b> — read-only metadata describing each model's capabilities (tool calling, reasoning, temperature support) and limits (context window, max output tokens). Populated automatically from the <a href="https://models.dev">models.dev</a> remote catalog on startup, with optional manual overrides for local or unlisted models.</li> </ol>
com.top_logic.tl.ai.core.provider.ProviderException$Kind = Kind
com.top_logic.tl.ai.core.provider.ProviderException$Kind.tooltip = Classification of the error.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.AUTHENTICATION = Authentication
com.top_logic.tl.ai.core.provider.ProviderException.Kind.AUTHENTICATION.tooltip = 401/403 — invalid or expired API key.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.BILLING = Billing
com.top_logic.tl.ai.core.provider.ProviderException.Kind.BILLING.tooltip = 402 — billing or payment issue. Terminal, not retryable.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.CONTEXT_WINDOW_EXCEEDED = Context window exceeded
com.top_logic.tl.ai.core.provider.ProviderException.Kind.CONTEXT_WINDOW_EXCEEDED.tooltip = Request too large for the model's context window.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.INVALID_REQUEST = Invalid request
com.top_logic.tl.ai.core.provider.ProviderException.Kind.INVALID_REQUEST.tooltip = 400 — malformed request.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.OVERLOADED = Overloaded
com.top_logic.tl.ai.core.provider.ProviderException.Kind.OVERLOADED.tooltip = 529 or 5xx — provider overloaded or temporarily unavailable.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.RATE_LIMITED = Rate limited
com.top_logic.tl.ai.core.provider.ProviderException.Kind.RATE_LIMITED.tooltip = 429 — rate limited. Check retryAfter().
com.top_logic.tl.ai.core.provider.ProviderException.Kind.UNKNOWN = Unknown
com.top_logic.tl.ai.core.provider.ProviderException.Kind.UNKNOWN.tooltip = Unclassified error.
com.top_logic.tl.ai.core.provider.ResponseFormat = Response format
com.top_logic.tl.ai.core.provider.ResponseFormat.JSON = JSON
com.top_logic.tl.ai.core.provider.ResponseFormat.JSON.tooltip = Structured JSON object response.
com.top_logic.tl.ai.core.provider.ResponseFormat.TEXT = Text
com.top_logic.tl.ai.core.provider.ResponseFormat.TEXT.tooltip = Plain text response (default).
com.top_logic.tl.ai.core.provider.ResponseFormat.tooltip = Controls the format of the LLM response.
com.top_logic.tl.ai.core.provider.ToolChoice = Tool choice
com.top_logic.tl.ai.core.provider.ToolChoice.AUTO = Auto
com.top_logic.tl.ai.core.provider.ToolChoice.AUTO.tooltip = The LLM decides whether to call a tool (default).
com.top_logic.tl.ai.core.provider.ToolChoice.NONE = None
com.top_logic.tl.ai.core.provider.ToolChoice.NONE.tooltip = The LLM must not call any tool.
com.top_logic.tl.ai.core.provider.ToolChoice.REQUIRED = Required
com.top_logic.tl.ai.core.provider.ToolChoice.REQUIRED.tooltip = The LLM must call at least one tool.
com.top_logic.tl.ai.core.provider.ToolChoice.tooltip = Controls how the LLM selects tools during a request.
com.top_logic.tl.ai.core.provider.anthropic.AnthropicProviderConfig = Anthropic
com.top_logic.tl.ai.core.provider.anthropic.AnthropicProviderConfig.Config.api-key = Api key
com.top_logic.tl.ai.core.provider.anthropic.AnthropicProviderConfig.Config.api-key.tooltip = The API key for Anthropic authentication.
com.top_logic.tl.ai.core.provider.anthropic.AnthropicProviderConfig.Config.version = Version
com.top_logic.tl.ai.core.provider.anthropic.AnthropicProviderConfig.Config.version.tooltip = The Anthropic API version string sent as anthropic-version header.
com.top_logic.tl.ai.core.provider.anthropic.AnthropicProviderConfig.tooltip = <i>LLM provider configuration</i> for the Anthropic Messages API. <p> Provides the version property specific to Anthropic's anthropic-version header requirement. </p>
com.top_logic.tl.ai.core.provider.bedrock.BedrockConverseProviderConfig = AWS Bedrock
com.top_logic.tl.ai.core.provider.bedrock.BedrockConverseProviderConfig.Config.api-key = Api key
com.top_logic.tl.ai.core.provider.bedrock.BedrockConverseProviderConfig.Config.api-key.tooltip = The API key forwarded as Authorization: Bearer. <p>May be null for endpoints that use a different authentication mechanism (e.g. IAM instance roles or custom gateway injection).</p>
com.top_logic.tl.ai.core.provider.bedrock.BedrockConverseProviderConfig.tooltip = <i>LLM provider configuration</i> preset for the AWS Bedrock Converse streaming API. <p> Configures a <i>bedrock converse provider</i> against any Bedrock-compatible endpoint, including Nexus-Claude gateways and direct regional AWS Bedrock endpoints (https://bedrock-runtime.{region}.amazonaws.com). Authentication uses Bearer-token scheme inherited from <i>bedrock converse provider</i>. </p> <p> No model-listing endpoint exists on Bedrock, so models must be added to the models list manually and discoverModels() always returns an empty list. </p>
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry$Config = Configuration
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry$Config.tooltip = Model metadata configuration.
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry$OverrideConfig = Override configuration
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry$OverrideConfig.tooltip = Editable model metadata for manually configured models (e.g. local or <code>OpenAI</code>-compatible endpoints) that are not in the remote catalog. <p> Unlike <i>configuration</i>, these properties are writable in the admin UI and are not cleared on startup. </p>
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.attachment = File attachments
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.attachment.tooltip = Whether the model supports file attachments.
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.context-window = Context window
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.context-window.tooltip = Maximum input context window size in tokens.
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.knowledge-cutoff = Knowledge cutoff
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.knowledge-cutoff.tooltip = Training data knowledge cutoff date (e.g. "2026-01-31").
com.top_logic.tl.ai.core.provider.catalog.ModelCatalogEntry.Config.last-updated = Last updated
