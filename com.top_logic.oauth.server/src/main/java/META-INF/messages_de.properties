class.com.top_logic.oauth.server.I18NConstants.LLMS_CLIENT_ID_METADATA_DOCUMENTS = Clients können die https-URL ihres Client-ID-Metadatendokuments als Client-ID verwenden.
class.com.top_logic.oauth.server.I18NConstants.LLMS_INTRO = Die Anwendung ist ein OAuth-2.1-Autorisierungsserver für ihre eigenen Endpunkte (MCP, A2A, REST). Ein Client meldet seinen Benutzer mit dem Authorization-Code-Flow mit PKCE (S256) an und nennt den Endpunkt, den er aufrufen will, als Ressource (RFC 8707); das Access-Token, das er erhält, wird nur dort angenommen.
