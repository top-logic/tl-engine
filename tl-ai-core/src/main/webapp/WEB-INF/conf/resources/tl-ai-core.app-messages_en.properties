admin.ai.agentSecurity.catalog.description = Description (model, EN)
admin.ai.agentSecurity.catalog.description.tooltip = The first sentence of the description the language model is given for this tool. There is no separate administrator-facing description yet, so this is the model's own text - in English.
admin.ai.agentSecurity.catalog.group = Group
admin.ai.agentSecurity.catalog.group.tooltip = The capability group is the unit a role is granted. A tool without a group is denied to everyone.
admin.ai.agentSecurity.catalog.groupSource = Source of the group
admin.ai.agentSecurity.catalog.groupSource.tooltip = Whether the tool declares its group itself or the policy assigns it. Explains why removing one assignment de-classifies one tool and not the one next to it.
admin.ai.agentSecurity.catalog.reachableFor = Reachable for
admin.ai.agentSecurity.catalog.reachableFor.tooltip = The roles the policy configures that reach this tool. Administrators reach every tool and are deliberately not listed here.
admin.ai.agentSecurity.catalog.risk = Note
admin.ai.agentSecurity.catalog.risk.tooltip = What makes this group special: privileged (can express any other capability), sends data outward, or granted implicitly (every account holds it).
admin.ai.agentSecurity.catalog.tabber = Tool catalog
admin.ai.agentSecurity.catalog.title = Every tool of this application with its capability group and the roles that reach it
admin.ai.agentSecurity.catalog.tool = Tool
admin.ai.agentSecurity.catalog.tool.tooltip = The name the policy knows the tool by, and the name a denial prints in the log.
admin.ai.agentSecurity.effective.mode = Run mode
admin.ai.agentSecurity.effective.mode.tooltip = Interactive: a run with a user who can answer an approval prompt. Background: an unattended run, for which the background allowlist additionally applies.
admin.ai.agentSecurity.effective.rows = Effective permissions
admin.ai.agentSecurity.effective.rows.provenance = Deciding rule
admin.ai.agentSecurity.effective.rows.provenance.tooltip = Which rule of the policy decided - and which rule it overrode.
admin.ai.agentSecurity.effective.rows.risk = Note
admin.ai.agentSecurity.effective.rows.risk.tooltip = What makes this capability group special: privileged (can express any other capability), sends data outward, or granted implicitly (every account holds it).
admin.ai.agentSecurity.effective.rows.subject = Capability group / tool
admin.ai.agentSecurity.effective.rows.subject.tooltip = One row per capability group; expanding shows the individual tools. Tools without a group stand on their own, because no group grant can reach them.
admin.ai.agentSecurity.effective.rows.title = What an account or a role may call under the policy in effect, and why
admin.ai.agentSecurity.effective.rows.toolCount = Count
admin.ai.agentSecurity.effective.rows.toolCount.tooltip = How many registered tools belong to this group. Zero does not always mean "none": tools an agent carries only for itself - such as the listTools self-report - are in no registry and are not counted here.
admin.ai.agentSecurity.effective.rows.verdict = Verdict
admin.ai.agentSecurity.effective.rows.verdict.tooltip = Whether the account may call this group respectively this tool.
admin.ai.agentSecurity.effective.subject = Account / role
admin.ai.agentSecurity.effective.subject.tooltip = Whose effective permissions are shown: an account of the application, or - hypothetically - anybody holding a role the policy configures.
admin.ai.agentSecurity.effective.tabber = Effective permissions
admin.ai.agentSecurity.effective.title = Effective permissions
admin.ai.agentSecurity.tabber = Agent security
