com.top_logic.tl.ai.core.tool.ToolMethod = Werkzeug-Methode
com.top_logic.tl.ai.core.tool.ToolMethod.concurrencySafe = Gleichzeitigkeitssicher
com.top_logic.tl.ai.core.tool.ToolMethod.concurrencySafe.tooltip = Gibt an, ob dieses Werkzeug sicher parallel zu anderen parallelitätssicheren Werkzeugen ausgeführt werden kann. Der Standardwert ist false (fail-closed).
com.top_logic.tl.ai.core.tool.ToolMethod.description = Beschreibung
com.top_logic.tl.ai.core.tool.ToolMethod.description.tooltip = Beschreibung, was dieses Tool tut. Wird an das LLM gesendet. Mehrere Werte werden mit einem Zeilenumbruch verbunden.
com.top_logic.tl.ai.core.tool.ToolMethod.mode = Modus
com.top_logic.tl.ai.core.tool.ToolMethod.mode.tooltip = Welche Art von Zustandsänderung dieses Werkzeug vornimmt. Der Standardwert ist <i>global</i> (fail-closed).
com.top_logic.tl.ai.core.tool.ToolMethod.name = Name
com.top_logic.tl.ai.core.tool.ToolMethod.name.tooltip = Name des Werkzeugs. Standardmäßig wird der Name der Java-Methode verwendet, wenn er leer ist.
com.top_logic.tl.ai.core.tool.ToolMethod.tooltip = Markiert eine Methode als ein Werkzeug, das der Agent aufrufen kann. <p>Die mit Anmerkungen versehene Methode wird von <code>AnnotatedTools#from(Object)</code> entdeckt und als <i>Werkzeuginstanz</i> verpackt. Die Parameter der Methode müssen mit <i>p</i> annotiert werden, um Beschreibungen für den LLM bereitzustellen.</p> <p><b>Thread-Sicherheit:</b> Das Provider-Objekt (die an <code>AnnotatedTools#from(Object)</code> übergebene Instanz) wird von allen Benutzern gemeinsam genutzt, wenn die <i>Werkzeugregistrierung</i> gemeinsam genutzt wird. Kommentierte Methoden <em>dürfen</em> sich <em>nicht</em> auf veränderbare Instanzfelder stützen. Der benutzerspezifische Status sollte über einen <i>Werkzeugkontextparameter</i> empfangen und nicht im Anbieterobjekt gespeichert werden.</p>
com.top_logic.tl.ai.core.tool.ToolMode = Werkzeug-Modus
com.top_logic.tl.ai.core.tool.ToolMode.GLOBAL = Global
com.top_logic.tl.ai.core.tool.ToolMode.GLOBAL.tooltip = Das Tool nimmt Änderungen am gemeinsamen Anwendungsstatus vor (Modell, Layouts, Workflows).
com.top_logic.tl.ai.core.tool.ToolMode.READ = Lesen Sie
com.top_logic.tl.ai.core.tool.ToolMode.READ.tooltip = Das Tool liest nur Daten. Keine Änderungen, keine Genehmigung erforderlich.
com.top_logic.tl.ai.core.tool.ToolMode.USER_SCOPED = Benutzerdefiniert
com.top_logic.tl.ai.core.tool.ToolMode.USER_SCOPED.tooltip = Das Tool nimmt Änderungen vor, die nur für den aktuellen Benutzer gelten (temporäre Ansichten, persönliche Dashboards).
com.top_logic.tl.ai.core.tool.ToolMode.tooltip = Kategorisiert, welche Art von Zustandsänderung ein Werkzeug vornimmt. <p>Wird vom Framework für die Filterung von Spezifikationen (Ausblenden von GLOBAL-Tools vor nicht privilegierten Benutzern), die Freigabekontrolle und Gleichzeitigkeitsentscheidungen verwendet.</p>
