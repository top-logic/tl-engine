com.top_logic.tl.ai.core.agent.NameRef = Name reference
com.top_logic.tl.ai.core.agent.NameRef.tooltip = Named reference to a tool, skill, agent, or MCP server. <p> Used as the entry type for keyed lists in <i>agent configuration</i>. Storing the references as keyed list entries (rather than a single comma-separated string) enables per-entry overlay across configuration layers: an application module may add or remove a single entry without restating the entire platform-provided list. </p>
