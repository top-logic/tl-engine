model.mandatorStructure.Mandator.all.tooltip = Gemeinsamer Basistyp aller Knoten der Mandantenstruktur. Er definiert die Eigenschaften, die sowohl das Wurzelelement als auch die darunter liegenden Mandanten besitzen.
model.mandatorStructure.Mandator.tooltip = Ein Mandant, also eine Organisationseinheit der Mandantenstruktur. Mandanten können beliebig tief geschachtelt werden.
model.mandatorStructure.MandatorChild = Kind von Mandant
model.mandatorStructure.MandatorChild.tooltip = Basistyp für die Typen, deren Objekte unterhalb eines Mandanten angelegt werden können.
model.mandatorStructure.RootElement = Mandantenstruktur
model.mandatorStructure.RootElement.tooltip = Das Wurzelelement der Mandantenstruktur. Es wird automatisch als Wurzelobjekt seines Moduls angelegt und kann nicht gelöscht werden.
model.mandatorStructure.RootElementChild = Mandant (oberste Ebene)
model.mandatorStructure.RootElementChild.tooltip = Basistyp für die Typen, deren Objekte direkt unterhalb der Wurzel der Mandantenstruktur angelegt werden können.
model.mandatorStructure.tooltip = Modul der Mandantenstruktur. Die Mandanten bilden einen Baum von Organisationseinheiten, denen Fachobjekte zugeordnet werden können.
