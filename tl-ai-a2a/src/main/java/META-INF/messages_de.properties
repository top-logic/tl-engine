com.top_logic.ai.a2a.A2AService.Config.app.tooltip = Der Name dieser Anwendung in Artefaktreferenzen und in den Metadaten, die sie sendet. Leer: der Kontextpfad des Servlets ohne seinen Schrägstrich.
com.top_logic.ai.a2a.A2AService.Config.artifact-contributors = Artefakt-Lieferanten
