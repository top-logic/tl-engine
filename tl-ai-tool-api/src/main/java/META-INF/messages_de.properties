com.top_logic.tl.ai.tool.api.AICategory = KI
com.top_logic.tl.ai.tool.api.AICategory.tooltip = Dienste, die KI-Agenten ausführen, diese mit Sprachmodellen verbinden und ihnen Tools, Wissen sowie Zugriff auf die Anwendung bereitstellen.
com.top_logic.tl.ai.tool.api.AnswerMarking = Kennzeichnung der Antwort
com.top_logic.tl.ai.tool.api.AnswerMarking.FRAMEWORK = Rahmenwerk
com.top_logic.tl.ai.tool.api.AnswerMarking.FRAMEWORK.tooltip = Das Framework verpackt die Antwort in den MODEL_DATA-Umschlag. <p> Dies ist die Standardeinstellung, da die alternative Standardeinstellung genau den Fehler darstellt, den dieser Patch beheben soll: Ein von TL-Script nach Java portiertes Tool verlor früher stillschweigend seinen Umschlag – und zwar genau bei der Nutzlast, die ihn am dringendsten benötigte (Issue #478). Wenn man vergisst, etwas zu deklarieren, wird die Antwort daher markiert, anstatt sie ungeschützt zu lassen. </p> <p> Eine Antwort, die bereits aus einem vollständigen Umschlagblock besteht, wird unverändert gelassen – siehe UntrustedEnvelope.isMarked –, sodass ein Tool, das sich selbst vor dem Framework markiert hat – sei es hier oder in einer darauf aufbauenden Anwendung –, keine zweite Umschlaghülle erhält, die die erste neutralisieren würde. </p>
com.top_logic.tl.ai.tool.api.AnswerMarking.NONE = Keine
com.top_logic.tl.ai.tool.api.AnswerMarking.NONE.tooltip = Es ist nichts markiert, da nichts in der Antwort aus einer anderen Quelle stammt. <p> Bei einer Antwort, die ein eigener Satz dieser Anwendung ist: eine Bestätigung dessen, was das Tool getan hat, eine Ablehnung, ein berechneter Hilfetext, ein Schema, eine Liste von Namen, die die Anwendung definiert. Diese zu markieren, wäre falsch – und zwar in einer Weise, die mit hohem Aufwand verbunden wäre: Die geltende Regel besagt, dass ein markierter Block niemals eine Anweisung an das Modell darstellt; daher darf eine Framework-Antwort, die eine Anweisung <em>ist</em> (der Text einer Skill, der Bericht eines Delegierten, „rufe zuerst listTypes auf“), das Tag nicht tragen. </p>
com.top_logic.tl.ai.tool.api.AnswerMarking.TOOL = Tool
com.top_logic.tl.ai.tool.api.AnswerMarking.TOOL.tooltip = Das Tool kennzeichnet seine eigenen Inhalte, und das Framework fügt nichts hinzu. <p> Für die drei Fälle, die das Framework nicht von selbst richtig lösen kann: eine Antwort, deren Inhalt zu einer anderen, <i>nicht vertrauenswürdigen Umschlagart</i> gehört (eine abgerufene Seite, ein gespeichertes Dokument, die Antwort eines externen Servers), eine Antwort, bei der es sich um einen markierten Block handelt, der <em>von</em> den eigenen Sätzen des Tools <em>umgeben ist</em>, und eine Antwort, deren Markierung eine bessere Quelle angibt als den Namen des Tools – beispielsweise das Objekt, aus dem ein Eintrag stammt. </p> <p> Es ist ein Versprechen, keine Ausnahmeregelung: Ein Tool, das dies erklärt und nichts markiert, gibt Geschäftsdaten unverändert zurück. </p>
com.top_logic.tl.ai.tool.api.AnswerMarking.tooltip = Wer stuft die Antwort eines Tools als nicht vertrauenswürdigen Inhalt ein – das Framework, das Tool oder niemand? <p> Die Frage, die damit beantwortet wird, lautet nicht „Ist dieses Tool gefährlich?“, sondern „Wurde der Text in dieser Antwort von einer anderen Person verfasst als dem Nutzer, für den dieser Durchlauf bestimmt ist?“. Die Tools einer Unternehmensanwendung geben fast immer den Text wieder, den ihre Nutzer eingegeben haben; daher ist <i>„Framework“</i> die Standardeinstellung, und die beiden anderen Werte sind Aussagen, die ein Tool-Autor bewusst macht – und die ein Prüfer als solche erkennen kann. </p>
com.top_logic.tl.ai.tool.api.P = P
com.top_logic.tl.ai.tool.api.P.required = Erforderlich
com.top_logic.tl.ai.tool.api.P.required.tooltip = Ob dieser Parameter erforderlich ist. Der Standardwert ist true.
com.top_logic.tl.ai.tool.api.P.tooltip = Beschreibt einen Parameter einer <i>mit einer Tool-Methode kommentierten</i> Methode.
com.top_logic.tl.ai.tool.api.P.value = Wert
com.top_logic.tl.ai.tool.api.P.value.tooltip = Beschreibung des Parameters. Wird an das LLM gesendet.
com.top_logic.tl.ai.tool.api.ToolMethod = Tool-Methode
com.top_logic.tl.ai.tool.api.ToolMethod.check = Vorabprüfung
com.top_logic.tl.ai.tool.api.ToolMethod.check.tooltip = Der Name einer Methode derselben Klasse, die einen Aufruf ablehnt, bevor er ausgeführt wird. <p> Diese Methode nimmt genau die Parameter der Tool-Methode, erhält dieselben Argumente und gibt die für das Modell formulierte Ablehnung zurück oder <code>null</code>. Sie wird gefragt, bevor irgendjemand gebeten wird, den Aufruf zu genehmigen und darf deshalb nichts ändern. Die Tool-Methode muss dieselben Aufrufe selbst ablehnen: Nicht jeder Aufrufer fragt zuerst die Vorabprüfung. </p> <p> Leer, der Standard, bedeutet: Das Tool lehnt nichts vorab ab. </p>
com.top_logic.tl.ai.tool.api.ToolMethod.concurrencySafe = Gleichzeitigkeitssicher
com.top_logic.tl.ai.tool.api.ToolMethod.concurrencySafe.tooltip = Gibt an, ob dieses Tool sicher parallel zu anderen nebenläufigkeitssicheren Tools ausgeführt werden kann. Der Standardwert ist true. Nur für Tools mit externen Gleichzeitigkeitsbeschränkungen auf false überschreiben.
com.top_logic.tl.ai.tool.api.ToolMethod.description = Beschreibung
com.top_logic.tl.ai.tool.api.ToolMethod.description.tooltip = Beschreibung, was dieses Tool tut. Wird an das LLM gesendet. Mehrere Werte werden mit einem Zeilenumbruch verbunden.
com.top_logic.tl.ai.tool.api.ToolMethod.dryRun = Probelauf
com.top_logic.tl.ai.tool.api.ToolMethod.dryRun.tooltip = Der Name eines booleschen Parameters dieser Methode, der einen Aufruf zum Probelauf macht. <p> Ein Aufruf, bei dem dieser Parameter „true“ ist, ändert nichts und läuft deshalb als Lesezugriff, was auch immer <i>mode</i> angibt: ohne Genehmigungsabfrage und außerhalb der Transaktion der Runde. Die Methode muss dieses Versprechen halten, und es ist ein Versprechen über die Sicherheit: Was ein Probelauf änderte, wäre geändert, ohne dass der Benutzer gefragt wurde. </p> <p> Leer, der Standard, bedeutet: Das Tool hat keinen Probelauf. </p>
com.top_logic.tl.ai.tool.api.ToolMethod.group = Gruppe
com.top_logic.tl.ai.tool.api.ToolMethod.group.tooltip = Die Tool-Gruppe, zu der dieses Tool gehört - die Einheit, die ein Administrator einer Sicherheitsrolle zuweist. <p> Leer bedeutet nicht gruppiert, wodurch das Tool jeder Rolle verweigert wird: Bei „standardmäßig verweigern“ darf ein ohne Gruppe hinzugefügtes Tool nicht versehentlich in eine bestehende Freigabe geraten. Ein Administrator kann in der Zugriffsrichtlinie eine Gruppe zuweisen, die den hier angegebenen Wert auch überschreibt. </p> <p> Wird nur durchgesetzt, wo für eine Installation eine &lt;tool-access&gt;-Richtlinie konfiguriert ist; ohne eine solche bleibt die Tool-Autorisierung nicht durchgesetzt und dieser Wert ohne Wirkung. Siehe die Entwicklerartikel ai/security/tool-authorization und ai/security/tool-access-configuration für die Administratorsicht. </p>
com.top_logic.tl.ai.tool.api.ToolMethod.marking = Kennzeichnung
com.top_logic.tl.ai.tool.api.ToolMethod.marking.tooltip = Wer kennzeichnet die Antwort dieses Tools als nicht vertrauenswürdigen Inhalt? <p> Standardmäßig ist dies <i>das Framework</i>, das die Antwort in den MODEL_DATA-Umschlag einbindet – dieselbe Kennzeichnung, die die Antwort eines TL-Script-Tools erhält, damit beim Wechsel eines Tools von TL-Script zu Java der Umschlag nicht stillschweigend entfernt wird (Issue #478). Geben Sie <i>„none“</i> an, wenn die Antwort ein eigener Satz dieser Anwendung ist, und <i>„tool“</i>, wenn das Tool seinen Inhalt selbst kennzeichnet. </p>
com.top_logic.tl.ai.tool.api.ToolMethod.mode = Modus
com.top_logic.tl.ai.tool.api.ToolMethod.mode.tooltip = Welche Art von Zustandsänderung dieses Tool vornimmt. Der Standardwert ist <i>strukturell</i> (fail-closed).
com.top_logic.tl.ai.tool.api.ToolMethod.name = Name
com.top_logic.tl.ai.tool.api.ToolMethod.name.tooltip = Name des Tools. Standardmäßig wird der Name der Java-Methode verwendet, wenn er leer ist.
com.top_logic.tl.ai.tool.api.ToolMethod.tooltip = Markiert eine Methode als ein Tool, das der Agent aufrufen kann.
com.top_logic.tl.ai.tool.api.ToolMethod.truncationHint = Hinweis zur Trunkierung
com.top_logic.tl.ai.tool.api.ToolMethod.truncationHint.tooltip = Maximale Zeichenzahl pro Tool, bevor die Agentenschleife das Ergebnis abschneidet, oder -1, um den globalen Standard zu verwenden. Setzen Sie den Wert <code>2147483647</code>, um das Abschneiden ganz zu vermeiden.
com.top_logic.tl.ai.tool.api.ToolMethod.types = Typen
com.top_logic.tl.ai.tool.api.ToolMethod.types.tooltip = Die qualifizierten Namen der Modelltypen, mit denen dieses Tool arbeitet, z. B. „myapp:Customer“. <p> <b>Wird durchgesetzt.</b> Bevor ein Tool mit Deklaration läuft, werden für jeden deklarierten Typ die Leserechte des handelnden Prinzipals geprüft. Ein Tool, von dessen deklarierten Typen der Prinzipal keinen einzigen lesen darf, wird abgewiesen, bevor es läuft - mit einer Begründung, die den Typ nennt - und es fehlt in den Tool-Schemata, die das Modell erhält, damit es nicht mit einem Tool plant, das es nicht nutzen könnte. Ein Tool, das nichts deklariert, bleibt unberührt: Eine leere Deklaration heißt „dieses Tool erhebt keinen Anspruch“ und nie „dieses Tool berührt nichts“. </p> <p> Was das bringt, in dieser Reihenfolge: Das Modell erhält „Sie haben kein Leserecht auf Customer“ statt eines leeren Ergebnisses, das es dem Benutzer als „Es gibt keine Kunden“ meldet; die Anfrage trägt ein Tool weniger; und ein Prüfer kann ablesen, welches Tool welche Typen für sich beansprucht. </p> <p> <b>Deklarieren Sie einen Typ nur dort, wo sein Leserecht einer Rolle gewährt wird, die Konten auf der Sicherheitswurzel halten.</b> Die Prüfung ist eine L1-Prüfung und liest Rollen dort, wie jede andere auch - siehe den Entwicklerartikel ai/security/declared-types. Ein Typ, dessen Leserecht stattdessen <em>pro Objekt</em> abgeleitet wird - wie tl.ai.screenshots:Screenshot die Rolle AiBinaryOwner aus dem Eigentümer des Screenshots ableitet -, darf <b>nicht</b> deklariert werden: Niemand hält eine solche Rolle auf der Wurzel, eine Deklaration würde dem Eigentümer also sein eigenes Objekt verweigern. Wo Sie es nicht beurteilen können, deklarieren Sie nichts - die Prüfungen pro Objekt schützen die Daten ohnehin. </p> <p> <b>Nicht jedes Tool kann deklarieren, und keines muss es.</b> Das Durchsuchen von Instanzen, die Ausführung von TL-Script und die Suche entnehmen den Typ ihren Argumenten, es gibt also nichts Festes zu nennen; für sie gelten die Prüfungen pro Objekt, die ohnehin für jedes Tool gelten - ModelSecurity.canRead auf jedem berührten Objekt, die Lesefilterung der Ergebnisse und die Prüfung vor dem Commit. Eine Deklaration ist eine frühe, grobe Abweisung vor diesen Prüfungen und nie ein Ersatz für sie; ein Tool kann darüber lügen, was es berührt, die Prüfungen pro Objekt kann es nicht belügen. </p> <p> Ein Name, der zu keinem Typ des Anwendungsmodells auflöst, wird mit einer Warnung <em>übersprungen</em>: Ein Tippfehler ist eine fehlerhafte Deklaration und keine Aussage über Rechte, und ihn zu einer Abweisung zu machen, würde jedem Benutzer grundlos ein funktionierendes Tool wegnehmen. Ein Tool, dessen Deklarationen sich alle nicht auflösen lassen, wird behandelt, als deklariere es nichts. </p>
com.top_logic.tl.ai.tool.api.ToolMethod.unavailable = Verfügbarkeitsprüfung
com.top_logic.tl.ai.tool.api.ToolMethod.unavailable.tooltip = Der Name einer Methode derselben Klasse, die sagt, warum dieses Tool im aktuellen Lauf nichts tun kann. <p> Diese Methode nimmt genau einen Parameter, den <i>Ausführungskontext des Tools</i> des Laufs, und gibt den für das Modell formulierten Grund zurück oder <code>null</code>, wenn das Tool etwas tun kann. Ein Tool, das einen Grund nennt, wird dem Modell nicht angeboten, und ein Aufruf, der es trotzdem nennt, wird mit dem Grund beantwortet. Die Methode darf nichts ändern. </p> <p> Leer, der Standard, bedeutet: Das Tool kann in jedem Lauf etwas tun. </p>
com.top_logic.tl.ai.tool.api.ToolMode = Tool-Modus
com.top_logic.tl.ai.tool.api.ToolMode.DATA_WRITE = Daten schreiben
com.top_logic.tl.ai.tool.api.ToolMode.DATA_WRITE.tooltip = Das Tool schreibt gemeinsame Anwendungsdaten (Instanzen, Datensätze).
com.top_logic.tl.ai.tool.api.ToolMode.EXTERNAL = Extern
com.top_logic.tl.ai.tool.api.ToolMode.EXTERNAL.tooltip = Das Tool kommuniziert mit einem System außerhalb dieser Anwendung.
com.top_logic.tl.ai.tool.api.ToolMode.READ = Lesen
com.top_logic.tl.ai.tool.api.ToolMode.READ.tooltip = Das Tool ändert nichts am Zustand dieser Anwendung - was nichts darüber aussagt, ob es nach außen greift; diese Eigenschaft trägt seine Gruppe (<code>"egress"</code>).
com.top_logic.tl.ai.tool.api.ToolMode.STRUCTURAL = Strukturelle
com.top_logic.tl.ai.tool.api.ToolMode.STRUCTURAL.tooltip = Das Tool ändert die Anwendungsstruktur (Modell, Schema, Anmerkungen).
com.top_logic.tl.ai.tool.api.ToolMode.USER_SCOPED = Benutzerspezifisch
com.top_logic.tl.ai.tool.api.ToolMode.USER_SCOPED.tooltip = Das Tool nimmt Änderungen vor, die nur für den aktuellen Benutzer gelten (temporäre Ansichten, persönliche Dashboards).
com.top_logic.tl.ai.tool.api.ToolMode.tooltip = Kategorisiert, welche Art von Zustandsänderung ein Tool vornimmt.
com.top_logic.tl.ai.tool.api.registry.ReflectiveToolFactory = Reflektierende Tool-Fabrik
com.top_logic.tl.ai.tool.api.registry.ReflectiveToolFactory.Config.tool = Tool
com.top_logic.tl.ai.tool.api.registry.ReflectiveToolFactory.Config.tool-class = Toolklasse
com.top_logic.tl.ai.tool.api.registry.ReflectiveToolFactory.Config.tool-class.tooltip = Die Java-Klasse, die mit <i>Tool-Methode</i> annotierte Methoden enthält. <p> Diese Klasse wird nach Tool-Definitionen durchsucht. Alle mit @ToolMethod annotierten Methoden werden als KI-Tools angeboten. Die Klasse wird mit ihrem Konstruktor ohne Argumente instanziiert. </p> <p> Genau eines von Tool-Klasse und Tool muss angegeben werden. </p>
com.top_logic.tl.ai.tool.api.registry.ReflectiveToolFactory.Config.tool.tooltip = Konfiguration des Objekts, dessen mit <i>Tool-Methode</i> annotierte Methoden als KI-Tools angeboten werden. <p> Wird anstelle einer Tool-Klasse für ein Tool mit eigenen Konfigurationsoptionen verwendet. Genau eines von beiden muss angegeben werden. </p>
com.top_logic.tl.ai.tool.api.registry.ReflectiveToolFactory.tooltip = Eine <i>Tool-Fabrik</i>, die reflektiv Tools aus einer Java-Klasse mit annotierten <i>Tool-Methoden</i> entdeckt. <p> Diese Fabrik extrahiert Toolspezifikationen aus der konfigurierten Klasse und erstellt entsprechende <i>Toolinstanzen</i> für jede annotierte Methode. </p> <p> Das Objekt, dessen Methoden aufgerufen werden, wird entweder mit dem Konstruktor ohne Argumente der Tool-Klasse erzeugt oder aus der Tool-Konfiguration instanziiert, wenn das Tool eigene Konfigurationsoptionen hat: </p><pre> &lt;implementation class="com.top_logic.tl.ai.tool.api.registry.ReflectiveToolFactory" tool-class="com.example.MyTool"/&gt; &lt;implementation class="com.top_logic.tl.ai.tool.api.registry.ReflectiveToolFactory"&gt; &lt;tool class="com.example.MyConfiguredTool" my-option="..."/&gt; &lt;/implementation&gt; </pre>
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService = Tool-Registrierungsdienst
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService$ToolFactoryConfig = Tool-Factory-Konfiguration
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService$ToolFactoryConfig.tooltip = Konfiguration für eine benannte Tool-Fabrik.
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService.Config.tool-factories = Tool-Fabriken
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService.Config.tool-factories.tooltip = Karte der benannten Tool-Fabriken, die in der Anwendung verfügbar sind. <p> Jede Tool-Fabrik wird durch einen eindeutigen Namen identifiziert. Der Fabrikname wird Teil des qualifizierten Toolnamens (Fabrikname.Toolname), mit dem in TL-Script-Funktionen auf Tools verwiesen wird. </p>
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService.ToolFactoryConfig.implementation = Umsetzung
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService.ToolFactoryConfig.implementation.tooltip = Die Implementierung der Tool-Fabrik.
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService.tooltip = Tool-Registrierungsdienst zur Verwaltung der in der Anwendung verfügbaren Tools. <p> Die Tools sind nach Fabriken organisiert. Jede Fabrik produziert einen Satz von Tools, und jedes Tool wird durch einen qualifizierten Namen im Format {factory-name}.{tool-name} identifiziert. So können Tools aus verschiedenen Fabriken denselben einfachen Namen haben, ohne dass es zu Konflikten kommt. </p>
