com.top_logic.ai.service.agents.background.trigger.PreTurnTrigger.tooltip = Auslöser, der ausgelöst wird, bevor ein Chatverlauf verarbeitet wird. <p> Der Hintergrundagent läuft synchron, bevor der primäre Agent die Nachricht des Benutzers verarbeitet. Dies ist nützlich für Inhaltsfilterung, Sicherheitsprüfungen oder Eingabevalidierung. Eine Zeitüberschreitung stellt sicher, dass der Benutzer nicht auf unbestimmte Zeit blockiert wird, und eine Fehlerrichtlinie bestimmt das Verhalten, wenn die Zeitüberschreitung überschritten wird. </p> <p> Der Agent empfängt immer die anstehende Benutzernachricht. Wenn eine zusätzliche Eingabekonfiguration festgelegt ist, wird die Eingabe mit XML-Tags strukturiert: </p> <pre> <user-message> Der Text der anstehenden Benutzernachricht </user-message> <additional-context> Das Ergebnis der konfigurierten Eingabequelle </additional-context> </pre> <p> Wenn keine Eingabekonfiguration eingestellt ist, empfängt der Agent die rohe Benutzernachricht ohne XML-Tags. Gestalten Sie die Systemansage des Agenten entsprechend. </p>
