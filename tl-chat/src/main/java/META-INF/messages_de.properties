com.top_logic.ai.chat.layout.PromptImprovementProcessor.Failure.INVALID_REQUEST = Ungültige Anfrage
com.top_logic.ai.chat.layout.PromptImprovementProcessor.Failure.INVALID_REQUEST.tooltip = Die Browseranfrage ist fehlerhaft.
