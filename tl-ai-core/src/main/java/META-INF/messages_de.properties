com.top_logic.tl.ai.core.tools.web.Freshness.WEEK.tooltip = In den letzten 7 Tagen veröffentlicht.
com.top_logic.tl.ai.core.tools.web.Freshness.YEAR = Jahr
com.top_logic.tl.ai.core.tools.web.Freshness.YEAR.tooltip = In den letzten 365 Tagen veröffentlicht.
com.top_logic.tl.ai.core.tools.web.Freshness.tooltip = Wie aktuell müssen die Ergebnisse einer Websuche sein?
com.top_logic.tl.ai.core.tools.web.SearchDepth = Suchtiefe
com.top_logic.tl.ai.core.tools.web.SearchDepth.ADVANCED = Erweitert
com.top_logic.tl.ai.core.tools.web.SearchDepth.ADVANCED.tooltip = Langsamere, gründlichere Suche.
com.top_logic.tl.ai.core.tools.web.SearchDepth.BASIC = Einfach
com.top_logic.tl.ai.core.tools.web.SearchDepth.BASIC.tooltip = Schnellere, oberflächlichere Suche.
com.top_logic.tl.ai.core.tools.web.SearchDepth.tooltip = Wie gründlich eine Websuchmaschine suchen soll.
com.top_logic.tl.ai.core.tools.web.TavilySearchEngine = Tavily
com.top_logic.tl.ai.core.tools.web.TavilySearchEngine.Config.api-key = Api-Schlüssel
com.top_logic.tl.ai.core.tools.web.TavilySearchEngine.Config.api-key.tooltip = Der Tavily-API-Schlüssel. <p> Wird als Bearer-Token im Header <code>"Authorization"</code> gesendet. Empfohlen wird ein Verweis auf den Schlüssel über den Namen des Geheimnisses, damit der Schlüssel nicht Teil der Konfiguration ist: </p><pre> &lt;api-key name="tl_tavily_api_key"/&gt; </pre> <p> Ein Attributwert ist entweder ein verschlüsselter Schlüssel oder ein unverschlüsselter Schlüssel mit dem Präfix <code>unencrypted:</code>. Die gleichzeitige Konfiguration eines API-Schlüssels und von Zugangsdaten führt zu einem Fehler. </p>
com.top_logic.tl.ai.core.tools.web.TavilySearchEngine.Config.base-url = Basis-URL
com.top_logic.tl.ai.core.tools.web.TavilySearchEngine.Config.base-url.tooltip = Die Basis-URL der Tavily-API.
com.top_logic.tl.ai.core.tools.web.TavilySearchEngine.Config.credentials = Zugangsdaten
com.top_logic.tl.ai.core.tools.web.TavilySearchEngine.Config.credentials.tooltip = Wie die Anfragen an Tavily authentifiziert werden, wenn nicht mit einem API-Schlüssel. <p> Z. B. gar nicht, wenn ein dazwischenliegendes Gateway die Zugangsdaten hinzufügt. Zugangsdaten und einen API-Schlüssel gleichzeitig zu konfigurieren, ist ein Fehler. </p>
com.top_logic.tl.ai.core.tools.web.TavilySearchEngine.Config.include-answer = Antwort einschließen
com.top_logic.tl.ai.core.tools.web.TavilySearchEngine.Config.include-answer.tooltip = Ob eine synthetische Antwort von Tavily angefordert werden soll.
com.top_logic.tl.ai.core.tools.web.TavilySearchEngine.Config.include-raw-content = Rohinhalte einbeziehen
com.top_logic.tl.ai.core.tools.web.TavilySearchEngine.Config.include-raw-content.tooltip = Ob der gesamte Rohseiteninhalt pro Ergebnis angefordert werden soll.
com.top_logic.tl.ai.core.tools.web.TavilySearchEngine.Config.search-depth = Suchtiefe
com.top_logic.tl.ai.core.tools.web.TavilySearchEngine.Config.search-depth.tooltip = Suchtiefe: einfach (schneller) oder erweitert (gründlicher).
com.top_logic.tl.ai.core.tools.web.TavilySearchEngine.tooltip = <i>Web-Suchmaschine</i> auf Basis der Tavily-Such-API (POST /search). <p> Das Alter der Ergebnisse entspricht dem von Tavily angegebenen Zeitbereich („time_range“). Tavily kann die Ergebnisse nicht nach Sprache filtern. </p>
com.top_logic.tl.ai.core.tools.web.UrlProvenanceScope = Geltungsbereich der Herkunftsregel für Adressen
com.top_logic.tl.ai.core.tools.web.UrlProvenanceScope.ALL = Alle
com.top_logic.tl.ai.core.tools.web.UrlProvenanceScope.ALL.tooltip = Jeder Agent-Lauf darf nur die Adressen öffnen, die ihm gegeben wurden.
com.top_logic.tl.ai.core.tools.web.UrlProvenanceScope.OFF = Aus
com.top_logic.tl.ai.core.tools.web.UrlProvenanceScope.OFF.tooltip = Es gibt keine Einschränkungen: Ein Agent darf jede Adresse öffnen, die gemäß der Browserrichtlinie zulässig ist.
com.top_logic.tl.ai.core.tools.web.UrlProvenanceScope.SUBAGENTS = Subagenten
com.top_logic.tl.ai.core.tools.web.UrlProvenanceScope.SUBAGENTS.tooltip = Läufe, die ein anderer Lauf gestartet hat - ein delegierter Agent oder ein Subagent im Hintergrund, etwa ein Recherche-Agent -, dürfen nur die Adressen öffnen, die ihnen gegeben wurden. Der Agent des Chats selbst ist nicht eingeschränkt.
com.top_logic.tl.ai.core.tools.web.UrlProvenanceScope.tooltip = Welche Agent-Läufe nur die Webadressen öffnen dürfen, die ihnen gegeben wurden.
com.top_logic.tl.ai.core.tools.web.WebToolsService = Webtools-Dienst
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.browsing = Browsing-Richtlinie
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.browsing.tooltip = Welche Ursprünge die Agenten dieser Anwendung besuchen dürfen, je Sicherheitsrolle. <p> Leer gelassen - so wird ausgeliefert - ändert sich nichts: Jeder Ursprung, der die SSRF-Prüfung besteht, bleibt erreichbar. Es ist die Obergrenze für alle drei Wege aus der Anwendung heraus, also kann eine Domain-Liste, die ein Agent an webSearch übergibt, sie nur einschränken, nie erweitern. </p>
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.fetch-max-bytes = Maximale Bytes pro Abruf
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.fetch-max-bytes.tooltip = Maximale Anzahl von Bytes, die webFetch von einer Seite liest, bevor es anhält.
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.fetch-max-chars = Maximale Zeichen pro Abruf
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.fetch-max-chars.tooltip = Maximale Anzahl der Zeichen des extrahierten Textes, die webFetch zurückgibt.
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.fetch-timeout-seconds = Abruf-Timeout (Sekunden)
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.fetch-timeout-seconds.tooltip = Zeitüberschreitung pro Anfrage für webFetch, in Sekunden.
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.max-results = Maximale Ergebnisse
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.max-results.tooltip = Standardmäßig maximale Anzahl der von webSearch zurückgegebenen Ergebnisse.
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.search-engine = Suchmaschine
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.search-engine.tooltip = Die Suchmaschine, die webSearch unterstützt. Wenn nicht festgelegt, ist die Websuche nicht verfügbar.
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.url-provenance = Herkunftsregel für Adressen
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.url-provenance.tooltip = Welche Agent-Läufe nur die Webadressen öffnen dürfen, die ihnen gegeben wurden. <p> Ein Lauf, für den diese Regel gilt, öffnet mit webFetch oder dem Browser nur eine Adresse, die sein Benutzer oder sein Lead-Agent geschrieben hat, die eine Websuche zurückgegeben hat oder auf die eine von ihm gelesene Seite verweist. Eine Adresse, die der Agent selbst geschrieben hat, wird abgelehnt. Dies verhindert, dass eine eingeschleuste Seite den Agenten dazu bringt, Daten an eine vom Angreifer gewählte Adresse zu senden. Die Standardeinstellung schränkt die Läufe ein, die von einem anderen Lauf gestartet wurden, wie z. B. von Recherche-Agenten, die nicht vertrauenswürdige Seiten lesen und von niemandem überwacht werden. </p>
com.top_logic.tl.ai.core.tools.web.WebToolsService.tooltip = Dienst, der die Konfiguration der Web-Tools (<i>Web-Such-Tool</i>, <i>Web-Abruf-Tool</i>) hält: die austauschbare Suchmaschine, die Abrufgrenzen und die Browsing-Steuerung der Anwendung. <p> Die hier konfigurierte Browsing-Richtlinie ist die Antwort der Anwendung auf die Frage, welche Ursprünge der Agent dieses Benutzers erreichen darf, und sie bindet jeden Weg aus der Anwendung heraus: das Browser-Tool, webFetch und webSearch. Sie sitzt <em>über</em> <i>der URL-Sicherheit</i>, die die andere Frage beantwortet - ob eine Adresse überhaupt verbunden werden darf - und die unabhängig, bedingungslos und nicht konfigurierbar durchgesetzt wird. </p>
