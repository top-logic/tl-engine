com.top_logic.bpe.execution.engine.ExecutionEngine = Prozessausführung
com.top_logic.bpe.execution.engine.ExecutionEngine.tooltip = Dienst, der die automatischen Schritte von <i>Prozessausführungen</i> ausführt. <p> Der Dienst wertet Abfragen gegen die Wissensbasis und das Modell der laufenden Anwendung aus. Daher lebt er so lange wie diese Dienste und wird mit ihnen zusammen neu gestartet. </p>
com.top_logic.bpe.execution.export.GroupByNameBinding = Binding für Gruppenattribute
com.top_logic.bpe.execution.export.GroupByNameBinding.tooltip = <i>Attributwertbindung</i>, die in der Lage ist, Attribute des Typs <i>group</i> in XML zu serialisieren.
com.top_logic.bpe.execution.script.BPEFunctions.defaultOption = Vorausgewählte Option
com.top_logic.bpe.execution.script.BPEFunctions.defaultOption.param.token.tooltip = Die Aufgabe.
com.top_logic.bpe.execution.script.BPEFunctions.defaultOption.return = Die Kante, die für die Option steht; <code>null</code>, wenn keine Option vorausgewählt ist.
com.top_logic.bpe.execution.script.BPEFunctions.defaultOption.tooltip = Die beim Erledigen einer Aufgabe vorausgewählte Option: die einzige Option oder der Standardfluss des Gateways, an dem der Benutzer entscheidet.
com.top_logic.bpe.execution.script.BPEFunctions.errors = Fehler
com.top_logic.bpe.execution.script.BPEFunctions.errors.param.option.tooltip = Die Kante, die für die Option steht.
com.top_logic.bpe.execution.script.BPEFunctions.errors.param.token.tooltip = Die Aufgabe.
com.top_logic.bpe.execution.script.BPEFunctions.errors.return = Die Meldungen in der Sprache des aktuellen Benutzers; leer, wenn die Option gewählt werden kann.
com.top_logic.bpe.execution.script.BPEFunctions.errors.tooltip = Die Fehler, die das Erledigen einer Aufgabe mit einer Option verhindern.
com.top_logic.bpe.execution.script.BPEFunctions.finish = Aufgabe erledigen
com.top_logic.bpe.execution.script.BPEFunctions.finish.param.additional.tooltip = Zusätzliche Daten, die mit der Option eingegeben wurden, ein Objekt ihres Formulartyps, meist ein transientes, das ein Formular gefüllt hat. Es wird den Operationen auf dem Pfad der Option (der Standardoperation des Teilnehmers und den Operationen der Sequenzflüsse) als viertes Argument übergeben, die davon übernehmen, was der Prozess braucht.
com.top_logic.bpe.execution.script.BPEFunctions.finish.param.option.tooltip = Die Kante, die für die gewählte Option steht, siehe <i>Optionen</i>. Kann bei einer Aufgabe mit nur einer Option weggelassen werden.
com.top_logic.bpe.execution.script.BPEFunctions.finish.param.token.tooltip = Die Aufgabe.
com.top_logic.bpe.execution.script.BPEFunctions.finish.return = Die Aufgabe desselben Prozesses, mit der der aktuelle Benutzer weiterarbeitet; <code>null</code>, wenn es keine oder mehr als eine gibt.
com.top_logic.bpe.execution.script.BPEFunctions.finish.tooltip = Erledigt eine Aufgabe für den aktuellen Benutzer.
com.top_logic.bpe.execution.script.BPEFunctions.formType = Formulartyp
com.top_logic.bpe.execution.script.BPEFunctions.formType.param.option.tooltip = Die Kante, die für die Option steht.
com.top_logic.bpe.execution.script.BPEFunctions.formType.param.token.tooltip = Die Aufgabe.
com.top_logic.bpe.execution.script.BPEFunctions.formType.return = Der Typ; <code>null</code>, wenn keine zusätzlichen Daten eingegeben werden.
com.top_logic.bpe.execution.script.BPEFunctions.formType.tooltip = Der Typ der zusätzlichen Daten, die mit einer Option zum Erledigen einer Aufgabe eingegeben werden.
com.top_logic.bpe.execution.script.BPEFunctions.modelType = Modelltyp
com.top_logic.bpe.execution.script.BPEFunctions.modelType.param.startEvent.tooltip = Das Startereignis.
com.top_logic.bpe.execution.script.BPEFunctions.modelType.return = Der Modelltyp des Teilnehmers des Prozesses des Startereignisses; der Typ <code>tl.bpe.execution:ProcessExecution</code>, wenn der Teilnehmer keinen hat.
com.top_logic.bpe.execution.script.BPEFunctions.modelType.tooltip = Der Typ der Prozessausführung, die ein Startereignis startet. <p> Eine Ansicht legt ein transientes Objekt dieses Typs für das Anlageformular eines Prozesses an und startet den Prozess damit, siehe <i>start</i>. </p>
com.top_logic.bpe.execution.script.BPEFunctions.optionLabel = Beschriftung der Option
com.top_logic.bpe.execution.script.BPEFunctions.optionLabel.param.option.tooltip = Die Kante, die für die Option steht.
com.top_logic.bpe.execution.script.BPEFunctions.optionLabel.param.token.tooltip = Die Aufgabe.
com.top_logic.bpe.execution.script.BPEFunctions.optionLabel.return = Der Titel oder Name der Kante oder der Name ihres Ziels.
com.top_logic.bpe.execution.script.BPEFunctions.optionLabel.tooltip = Die Beschriftung einer Option zum Erledigen einer Aufgabe.
com.top_logic.bpe.execution.script.BPEFunctions.options = Optionen
com.top_logic.bpe.execution.script.BPEFunctions.options.param.token.tooltip = Die Aufgabe.
com.top_logic.bpe.execution.script.BPEFunctions.options.return = Die Kanten, die für die Optionen stehen, sortiert zuerst nach ihrem Gewicht, dann nach ihrer Beschriftung.
com.top_logic.bpe.execution.script.BPEFunctions.options.tooltip = Die Optionen zum Erledigen einer Aufgabe. <p> Optionen, die durch Fehler blockiert sind, sind enthalten, siehe <i>Fehler</i>. Optionen, die durch ihre Bedingungen ausgeblendet sind, nicht. </p>
com.top_logic.bpe.execution.script.BPEFunctions.start = Prozess starten
com.top_logic.bpe.execution.script.BPEFunctions.start.param.process.tooltip = Das Objekt, das zur Prozessausführung wird, eine Instanz des Modelltyps des Prozesses: ein transientes Objekt, das ein Anlageformular gefüllt hat und mit seinen Werten persistent gemacht wird, oder ein noch nicht gestartetes persistentes Objekt. Fehlt es, wird ein neues Objekt angelegt.
com.top_logic.bpe.execution.script.BPEFunctions.start.param.startEvent.tooltip = Das Startereignis, an dem der aktuelle Benutzer den Prozess startet.
com.top_logic.bpe.execution.script.BPEFunctions.start.return = Die neue Prozessausführung.
com.top_logic.bpe.execution.script.BPEFunctions.start.tooltip = Startet einen Prozess an einem Startereignis. <p> Der Prozess läuft bis zu seiner ersten Aufgabe, siehe <i>Startaufgabe</i>. </p>
com.top_logic.bpe.execution.script.BPEFunctions.startEvents = Startereignisse
com.top_logic.bpe.execution.script.BPEFunctions.startEvents.param.person.tooltip = Der Benutzer, der Prozesse startet; standardmäßig ist dies der aktuelle Benutzer.
com.top_logic.bpe.execution.script.BPEFunctions.startEvents.return = Die Startereignisse.
com.top_logic.bpe.execution.script.BPEFunctions.startEvents.tooltip = Die Startereignisse der freigegebenen Workflows, mit denen ein Benutzer einen Prozess starten kann.
com.top_logic.bpe.execution.script.BPEFunctions.startTask = Startaufgabe
com.top_logic.bpe.execution.script.BPEFunctions.startTask.param.execution.tooltip = Die Prozessausführung.
com.top_logic.bpe.execution.script.BPEFunctions.startTask.return = Das einzige aktive Token des Prozesses; <code>null</code>, wenn es keines oder mehr als eines gibt.
com.top_logic.bpe.execution.script.BPEFunctions.startTask.tooltip = Die erste Aufgabe eines gerade gestarteten Prozesses. <p> Erfordert das Startereignis keine Prüfung, zeigt der Startdialog das Formular dieser Aufgabe und erledigt sie direkt nach dem Start mit <i>Aufgabe erledigen</i>. </p>
com.top_logic.bpe.execution.script.BPEFunctions.tasks = Aufgaben
com.top_logic.bpe.execution.script.BPEFunctions.tasks.param.person.tooltip = Der Benutzer, dessen Aufgaben aufgelistet werden; standardmäßig der aktuelle Benutzer.
com.top_logic.bpe.execution.script.BPEFunctions.tasks.return = Die aktiven Token, für die der Benutzer Akteur ist.
com.top_logic.bpe.execution.script.BPEFunctions.tasks.tooltip = Die offenen Aufgaben eines Benutzers.
com.top_logic.bpe.execution.script.BPEFunctions.warnings = Warnungen
com.top_logic.bpe.execution.script.BPEFunctions.warnings.param.option.tooltip = Die Kante, die für die Option steht.
com.top_logic.bpe.execution.script.BPEFunctions.warnings.param.token.tooltip = Die Aufgabe.
com.top_logic.bpe.execution.script.BPEFunctions.warnings.return = Die Meldungen in der Sprache des aktuellen Benutzers; leer, wenn nichts zu bestätigen ist.
com.top_logic.bpe.execution.script.BPEFunctions.warnings.tooltip = Die Warnungen, die der Benutzer bestätigt, bevor er eine Aufgabe mit einer Option erledigt.
com.top_logic.bpe.execution.script.CreateProcessInstance$Builder = Erbauer
com.top_logic.bpe.execution.script.CreateProcessInstance$Builder.tooltip = <i>Einfacher Erbauer einer Methode</i> zur <i>Erstellung</i> einer <i>Prozessinstanzfunktion</i>.
com.top_logic.bpe.execution.script.ExecuteTransition$Builder = Erbauer
com.top_logic.bpe.execution.script.ExecuteTransition$Builder.tooltip = <i>Einfacher Erbauer einer Methode</i> zur Erstellung einer <i>Ausführungsübergangsfunktion</i>.
com.top_logic.bpe.execution.script.ForceTransition$Builder = Erbauer
com.top_logic.bpe.execution.script.ForceTransition$Builder.tooltip = <i>Einfacher Erbauer einer Methode</i> zur Erstellung einer <i>Kraftübergangsfunktion</i>.
com.top_logic.bpe.execution.script.ReachableNodes$Builder = Erbauer
com.top_logic.bpe.execution.script.ReachableNodes$Builder.tooltip = <i>Einfacher Erbauer einer Methode</i> zur Erstellung einer Funktion für <i>erreichbare Knoten</i>.
