com.top_logic.layout.configedit.ConfigControlService$FormatMapping.tooltip = Ein einzelner Eintrag der Zuordnung von Wertanbieter zu Kontroll-Anbieter.
com.top_logic.layout.configedit.ConfigControlService$ProviderMapping = Anbieter-Zuordnung
