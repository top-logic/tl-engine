com.top_logic.tl.ai.core.cookiepool.CookiePoolService = Cookie-Pool-Dienst
com.top_logic.tl.ai.core.cookiepool.CookiePoolService.tooltip = Dienst, der <i>Cookie-Pool-Geschäftsobjekte</i> verwaltet und auswählt: benannte, benutzerspezifische (oder explizit freigegebene) Browser-Anmeldepools, deren „storageState“-JSON-Daten <b>im Ruhezustand verschlüsselt</b> gespeichert werden. <p> Ein Cookie-Pool erfasst den authentifizierten Anmeldestatus einer Browsersitzung (storageState: Cookies + Ursprungsspeicher), sodass eine spätere Sitzung – einschließlich eines im Hintergrund laufenden oder unbeaufsichtigten Agenten – bereits im angemeldeten Zustand starten kann. Der Status ist ebenso sensibel wie ein Passwort; daher wird er stets mit dem Installationsschlüssel der Plattform verschlüsselt, bevor er in die Status-Binärdatei gelangt, und erst beim Lesen über den <i>Verschlüsselungsdienst</i> der Plattform (dessen <i>symmetrische Verschlüsselung</i>) entschlüsselt. Dieser Dienst speichert oder gibt den Status niemals im Klartext zurück; ist kein Verschlüsselungsschlüssel installiert, lehnt er den Vorgang ab, anstatt auf Klartext zurückzugreifen. </p> <p><b>Gültigkeitsbereich.</b> Ein von einem Benutzer erstellter Pool hat standardmäßig „owner = dieser Benutzer“, „shared = false“ und ist nur für seinen Eigentümer auswählbar. Ein Pool mit „shared = true“ (eine Entscheidung des Administrators bzw. eine explizite Wahl, nicht durch die Agent-Verben festgelegt) ist für jede Sitzung auswählbar, einschließlich einer unbeaufsichtigten – der beabsichtigte Anwendungsfall für die gemeinsame Anmeldung. Die Auswahl gibt daher die eigenen Pools des Aufrufers sowie gemeinsam genutzte Pools zurück; dieser Filter nach Eigentümer und Freigabe wird hier explizit durchgesetzt, anstatt ihn „SecurityContext.modelSecurity()“ zu überlassen, das in einem Durchlauf, dessen Modus keinen Modellzugriff erzwingt – was die Standardeinstellung ist –, alles zulässt und daher diese Isolation nicht gewährleisten kann. </p> <p> Entspricht in seiner Funktionsweise dem ScreenshotService: Es wird <b>keine</b> eigene Transaktion eröffnet. Der Aufruf von „pool-upsert“ erfolgt über das Verb „browserSaveCookies“, ein DATA_WRITE-Tool, dessen Transaktion vom TransactionScope der Agentenschleife eröffnet und bestätigt wird, sodass der Pool mit dem Durchlauf bestätigt wird. Programmatische Aufrufer (und Tests) stellen ihre eigene Transaktion bereit. </p>
