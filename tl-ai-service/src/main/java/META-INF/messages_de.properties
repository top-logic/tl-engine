com.top_logic.ai.service.scripting.OpenAIScriptFunctions.toolInfo.tooltip = Ruft detaillierte Informationen �ber ein registriertes Werkzeug ab. <p> Diese Funktion gibt Metadaten �ber ein Werkzeug zur�ck, einschlie�lich seines Namens, seiner Beschreibung und seiner Parameterspezifikationen. Das Werkzeug wird durch seinen qualifizierten Namen im Format Fabrik-Name.Werkzeug-Name identifiziert. </p> <p> Die zur�ckgegebene Karte enth�lt: </p> <ul> <li>name - Einfacher Name des Werkzeugs (ohne Fabrikpr�fix)</li> <li>qualifiedName - Der vollst�ndig qualifizierte Name des Werkzeugs</li> <li>description - Eine Beschreibung der Funktion des Werkzeugs (optional, kann fehlen)</li> <li>parameters - Eine Liste von Parameterspezifikationen, wobei jeder Parameter eine Karte mit Namen (String) und erforderlichen (booleschen) Feldern ist</li> </ul> <p> Beispiel f�r die Verwendung in TL-Script: </p> <pre> // Ermittelt Informationen f�r ein Werkzeug ohne Parameter aiToolInfo("tlscript.listTLScriptFunctions") // R�ckgabe: // { // "name": "listTLScriptFunctions", // "qualifiedName": "tlscript.listTLScriptFunctions", // "description": "List all available TLScript functions...", // "parameters": [] // } // Ermittelt Informationen zu einem Werkzeug mit Parametern aiToolInfo("tlscript.getTLScriptFunctionDocumentation") // R�ckgabe: // { // "name": "getTLScriptFunctionDocumentation", // "qualifiedName": "tlscript.getTLScriptFunctionDocumentation", // "description": "Get detailed documentation for a specific TLScript function...", // "parameters": [ // { // "name": "functionName", // "required": true // } // ] // } // Nicht existierendes Werkzeug aiToolInfo("nicht existierendes.Werkzeug") // R�ckgabe: null </pre>
