class.com.top_logic.security.passkey.I18NConstants.ERROR_SIGNATURE_COUNTER = Der Nutzungszähler des Passkeys hat sich nicht erhöht, was auf einen kopierten Authentifikator hindeutet. Die Anmeldung wird abgelehnt; bitte wenden Sie sich an Ihren Administrator.
class.com.top_logic.security.passkey.I18NConstants.ERROR_UNKNOWN_PASSKEY = Dieser Passkey ist bei dieser Anwendung nicht registriert. Möglicherweise wurde er nicht vollständig eingerichtet, gelöscht oder gehört zu einer anderen Installation. Wählen Sie einen anderen Passkey oder melden Sie sich mit Ihrem Passwort an.
class.com.top_logic.security.passkey.I18NConstants.ERROR_USER_NOT_VERIFIED = Der Authentifikator hat Sie nicht verifiziert (PIN, Fingerabdruck, Gesicht), was für Passkeys hier erforderlich ist. Erlauben Sie die Verifizierung und versuchen Sie es erneut.
class.com.top_logic.security.passkey.I18NConstants.ERROR_WRONG_ORIGIN__ORIGIN = Der Passkey wurde unter der Adresse {0} verwendet, für die in dieser Anwendung keine Passkeys eingerichtet sind. Öffnen Sie die Anwendung unter ihrer konfigurierten Adresse oder wenden Sie sich an Ihren Administrator.
