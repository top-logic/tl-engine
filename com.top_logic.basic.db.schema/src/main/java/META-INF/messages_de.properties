com.top_logic.basic.db.schema.setup.SchemaSetup = Schema-Einrichtung
com.top_logic.basic.db.schema.setup.SchemaSetup.tooltip = Helper-Klasse zum Einrichten der Tabellen einer <i>Schemakonfiguration</i>.
com.top_logic.basic.db.schema.setup.config.ApplicationTypes = Anwendungstypen
com.top_logic.basic.db.schema.setup.config.ApplicationTypes.tooltip = Konfiguration von Typensystemen.
com.top_logic.basic.db.schema.setup.config.ApplicationTypes.type-systems = Typen-Systeme
com.top_logic.basic.db.schema.setup.config.ApplicationTypes.type-systems.tooltip = Gibt alle bekannten <i>Schemakonfigurationen</i> zurück, die nach ihrem Namen indiziert sind.
com.top_logic.basic.db.schema.setup.config.KeyAttributes = Schlüsselattribute
com.top_logic.basic.db.schema.setup.config.KeyAttributes.attributes = Eigenschaften
com.top_logic.basic.db.schema.setup.config.KeyAttributes.attributes.tooltip = Alle Schlüsselattribute annotierten Typs.
com.top_logic.basic.db.schema.setup.config.KeyAttributes.tooltip = Konfiguration der Schlüsselattribute eines <i>Metaobjekts</i>. <p> Ein Schlüsselattribut ist in jedem Ereignis vorhanden, das eine Änderung eines Objekts des kommentierten Typs beschreibt, unabhängig davon, ob sich sein Wert geändert hat oder nicht. Die Kennzeichnung eines Attributs als Schlüsselattribut ist sinnvoll, wenn Listener des kommentierten Typs den Wert eines solchen Attributs für die Verarbeitung der Änderung benötigen. </p>
com.top_logic.basic.db.schema.setup.config.KeyAttributes.type = Typ
com.top_logic.basic.db.schema.setup.config.KeyAttributes.type.tooltip = Wird nicht mehr verwendet: Der Typ, für den die Schlüsselattribute definiert sind.
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.additional-tables = Zusätzliche Tabellen
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.additional-tables.tooltip = Die zusätzlichen Tabellendeklarationen für diese <i>Schemaeinrichtung</i>. <p> Dieser Wert wird während eines Auflösungsprozesses aus <i>Schemas</i> gefüllt. </p>
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.branch-last = Zweigspalte zuletzt
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.branch-last.tooltip = Ob die Zweigspalte hinter den identifizierenden Spalten in den Primärschlüsseln und Referenzindizes der Tabellen platziert wird. <p> Standardmäßig steht die Verzweigungsspalte an der Spitze jedes Indexes. Dadurch können Datenbanken mit Indexpräfixkomprimierung (Oracle) die Verzweigungsspalte nur einmal pro Indexblock speichern. Mit dieser Option wird die Zweigsäule stattdessen direkt vor die abschließende Revisionssäule gesetzt (oder am Ende eines Indexes ohne Revisionssäule), z. B. wird der Primärschlüssel einer Objekttabelle zu <code>(IDENTIFIER, BRANCH, REV_MAX)</code> und der Index einer Referenz zu <code>(&lt;REF&gt;_ID, BRANCH, REV_MAX)</code>. </p> <p> Dies ist für Datenbanksysteme gedacht, die einen Index für eine Bedingung mit einer <code>IN</code> nur dann verwenden, wenn die Listenwerte für die erste Spalte des Indexes (H2) angegeben sind. Befindet sich die Zweigspalte am Anfang, führt das Laden von Objekten anhand einer Liste von Identifikatoren und das Durchsuchen der Verweise einer Liste von Objekten auf einem solchen System zu einem vollständigen Durchlauf der gesamten Tabelle. </p> <p> Indizes, die mit einer expliziten Spaltenliste deklariert wurden (benutzerdefinierte Indizes), behalten ihre deklarierte Spaltenreihenfolge bei. Bei den anderen deklarierten Indizes folgt die Verzweigungsspalte auf die deklarierten Spalten. </p> <p> Das Ändern des Werts für eine bestehende Datenbank konvertiert die Primärschlüssel und Indizes ihrer Tabellen beim Start der Anwendung in das konfigurierte Layout. </p>
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.declarations = Erklärungen
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.declarations.tooltip = Liste der Ressourcen, die Tabellendeklarationen enthalten. <p> Diese Ressourcen werden intern verwendet, um die <i>Konfiguration der Metaobjekte</i> aufzulösen, die in <i>Metaobjekten</i> gespeichert ist. </p>
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.key-attributes = Schlüsselattribute
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.key-attributes.tooltip = Wird nicht mehr verwendet: Alle nach Typ indizierten <i>Schlüsselattribute</i> für diese <i>Schemakonfiguration</i>.
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.meta-objects = Meta-Objekte
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.meta-objects.tooltip = Die <i>Metaobjektdeklarationen</i> für dieses <i>Schema-Setup</i>. <p> Dieser Wert wird während eines Auflösungsprozesses aus den <i>Deklarationen</i> gefüllt. </p>
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.multiple-branches = Mehrere Zweige
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.multiple-branches.tooltip = Ob die Typen mehr Zweige als den Stamm unterstützen. <p> Das Ändern des Werts für eine bestehende Datenbank führt beim Start der Anwendung zu einer Konvertierung ihrer Tabellen: Die Zweigspalten werden hinzugefügt und mit den Daten des Hauptzweigs gefüllt oder entfernt. Das Entfernen der Zweigspalten setzt voraus, dass die Datenbank ausschließlich den Hauptzweig enthält. </p>
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.providers = Anbieter
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.providers.tooltip = Liste der Konfigurationen von <i>Typ-Anbietern</i> zur programmatischen Erstellung von Typen.
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.schemas = Schemata
com.top_logic.basic.db.schema.setup.config.SchemaConfiguration.schemas.tooltip = Deklaration von zusätzlichen Low-Level-Tabellen.
