com.top_logic.credential.oauth.ClientSecretAuthentication.Method.POST.tooltip = Client-ID und Secret als Parameter <code>client_id</code> und <code>client_secret</code> im Body der Anfrage (<code>client_secret_post</code>).
com.top_logic.credential.oauth.ClientSecretAuthentication.tooltip = <i>Client-Authentifizierung</i> mit einem Client-Secret (RFC 6749 §2.3.1). <pre> &lt;client-authentication class="com.top_logic.credential.oauth.ClientSecretAuthentication" method="basic"&gt; &lt;secret class="com.top_logic.basic.credential.FileSecretSource" path="/run/secrets/client-secret"/&gt; &lt;/client-authentication&gt; </pre>
com.top_logic.credential.oauth.DeviceLoginProvider = OAuth-Geräteanmeldung
com.top_logic.credential.oauth.DeviceLoginProvider.Config.device-authorization-url = URL der Geräteautorisierung
com.top_logic.credential.oauth.DeviceLoginProvider.Config.device-authorization-url.tooltip = URL des Endpunkts für die Geräteautorisierung des Autorisierungsservers. <p> Ist das Feld leer, wird der Endpunkt aus dem Discovery-Dokument des Ausstellers gelesen. </p>
com.top_logic.credential.oauth.DeviceLoginProvider.Config.refresh-token-store = Refresh-Token-Speicher
com.top_logic.credential.oauth.DeviceLoginProvider.Config.refresh-token-store.tooltip = Speicher für das Refresh-Token, damit eine neu gestartete Anwendung keine neue Anmeldung benötigt. <p> Ist keiner angegeben, wird das Refresh-Token nur im Arbeitsspeicher gehalten. </p>
com.top_logic.credential.oauth.DeviceLoginProvider.tooltip = <i>Zugangsdaten-Anbieter</i>, der Anfragen mit einem persönlichen Zugriffstoken eines Benutzers authentifiziert, der die Anmeldung einmalig in einem Browser bestätigt (OAuth 2.0 Device Authorization Grant, RFC 8628). <p> Gedacht für die Entwicklung: Die Anwendung eines Entwicklers ruft ein API-Gateway mit einem Token des Entwicklers auf, statt einen Schlüssel des externen Dienstes zu besitzen. Der Client ist in der Regel ein öffentlicher Client ohne Client-Authentifizierung. </p> <p> Ein Token wird in dieser Reihenfolge bezogen: </p> <ol> <li>Das zwischengespeicherte Zugriffstoken, solange es gültig ist.</li> <li>Ein neues Zugriffstoken für das zuletzt erhaltene Refresh-Token, oder nach einem Neustart für das Refresh-Token im konfigurierten Speicher.</li> <li>Eine Geräteanmeldung: Die erste Anfrage ohne verwendbares Token startet die Anmeldung im Hintergrund und schlägt mit einer Meldung fehl, die die zu öffnende URL und den zu bestätigenden Code nennt. Dieselbe Anweisung wird als Warnung protokolliert. Weitere Anfragen schlagen mit derselben Meldung fehl, bis der Benutzer die Anmeldung bestätigt hat; danach wird die nächste Anfrage authentifiziert. Auf eine abgelehnte oder abgelaufene Anmeldung folgt mit der nächsten Anfrage eine neue.</li> </ol> <p> Jede Token-Antwort mit einem Refresh-Token aktualisiert den Speicher, da der Autorisierungsserver bei jeder Verwendung ein neues Refresh-Token ausstellen kann. Ein vom Server abgelehntes Refresh-Token wird aus dem Speicher entfernt und eine neue Geräteanmeldung gestartet. </p> <p> Der Scope <code>offline_access</code> lässt den Autorisierungsserver ein Offline-Refresh-Token ausstellen. Ein gewöhnliches Refresh-Token ist an die Anmeldesitzung des Benutzers am Server gebunden und wird mit ihr ungültig, z. B. nach einigen Stunden oder wenn sich der Benutzer im Browser abmeldet. Ein Offline-Token bleibt gültig, bis es längere Zeit nicht verwendet oder widerrufen wird, sodass Neustarts der Anwendung tage- oder wochenlang keine neue Anmeldung benötigen. </p> <p> Konfiguration eines Entwicklers gegen einen Keycloak-Realm, die das Refresh-Token im Home-Verzeichnis des Entwicklers ablegt: </p> <pre> &lt;credentials class="com.top_logic.credential.oauth.DeviceLoginProvider" issuer="https://login.example.com/realms/my-realm" client-id="dev-gateway" scope="openid offline_access" &gt; &lt;refresh-token-store class="com.top_logic.credential.oauth.FileRefreshTokenStore"/&gt; &lt;/credentials&gt; </pre> <p> Gerätecode, Zugriffstoken und Refresh-Token erscheinen nie in einer Protokoll- oder Fehlermeldung, nur die zu öffnende URL und der Code, den der Benutzer dort bestätigt. </p>
com.top_logic.credential.oauth.FileRefreshTokenStore = Refresh-Token-Datei
com.top_logic.credential.oauth.FileRefreshTokenStore.Config.path = Pfad
com.top_logic.credential.oauth.FileRefreshTokenStore.Config.path.tooltip = Pfad der Datei mit dem Refresh-Token. <p> Ist das Feld leer, liegt die Datei im Verzeichnis <code>.config/toplogic/oauth</code> des Home-Verzeichnisses des Benutzers und ist nach dem Autorisierungsserver und dem Client benannt. </p>
com.top_logic.credential.oauth.FileRefreshTokenStore.tooltip = <i>Refresh-Token-Speicher</i>, der das Refresh-Token eines Clients in einer Datei ablegt, die nur ihr Eigentümer lesen kann. <pre> &lt;refresh-token-store class="com.top_logic.credential.oauth.FileRefreshTokenStore"/&gt; </pre> <p> Ohne konfigurierten Pfad ist die Datei <code>~/.config/toplogic/oauth/&lt;server&gt;__&lt;client&gt;.json</code> im Home-Verzeichnis des Benutzers, der die Anwendung ausführt. Dabei sind server und client die Kennung des Autorisierungsservers und die Client-Kennung, in denen jedes Zeichen außer Buchstaben, Ziffern, Punkt und Bindestrich durch einen Unterstrich ersetzt ist. Alle Anwendungen des Benutzers mit demselben Client teilen sich die Datei, sodass eine Anmeldung für alle genügt. </p> <p> Die Datei ist ein JSON-Objekt, das das Token zusammen mit dem Server und dem Client enthält, zu denen es gehört. Eine Datei, deren Server oder Client nicht passt, wird ignoriert und vom nächsten Token überschrieben. Auf Dateisystemen mit POSIX-Berechtigungen kann nur der Eigentümer die Datei lesen und schreiben (0600), und für sie angelegte Verzeichnisse sind nur für ihren Eigentümer zugänglich (0700). Die Datei wird atomar ersetzt, sodass ein gleichzeitiger Leser nie ein teilweise geschriebenes Token sieht. </p>
