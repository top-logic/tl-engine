com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.max-results = Maximum results
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.max-results.tooltip = Default maximum number of results returned by webSearch.
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.search-engine = Search engine
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.search-engine.tooltip = The search engine backing webSearch. If unset, web search is unavailable.
com.top_logic.tl.ai.core.tools.web.WebToolsService.tooltip = Service holding configuration for the web tools (<i>web search tool</i>, <i>web fetch tool</i>): the pluggable search engine and the fetch limits.
