com.top_logic.tl.ai.index.AiIndexConfig = Ai index configuration
com.top_logic.tl.ai.index.AiIndexConfig.batch-size = Batch size
com.top_logic.tl.ai.index.AiIndexConfig.batch-size.tooltip = How many objects are indexed together, with one call of the embedder.
com.top_logic.tl.ai.index.AiIndexConfig.build-step-millis = Build step millis
com.top_logic.tl.ai.index.AiIndexConfig.build-step-millis.tooltip = How long one step of a full build works before it commits and the worker looks at new commits.
com.top_logic.tl.ai.index.AiIndexConfig.chunking = Chunking
com.top_logic.tl.ai.index.AiIndexConfig.chunking.tooltip = How texts are cut into chunks.
com.top_logic.tl.ai.index.AiIndexConfig.embedder = Embedder
com.top_logic.tl.ai.index.AiIndexConfig.embedder.tooltip = How texts are turned into vectors; none for an index of words only.
com.top_logic.tl.ai.index.AiIndexConfig.location = Location
com.top_logic.tl.ai.index.AiIndexConfig.location.tooltip = The directory of the index, below which each generation has a directory of its own. <p> The index holds the text of every indexed object, so the directory needs the same protection as the database files. Each node of a cluster keeps its own index; the directory must not be shared. </p>
com.top_logic.tl.ai.index.AiIndexConfig.max-candidates = Maximum candidates
com.top_logic.tl.ai.index.AiIndexConfig.max-candidates.tooltip = How many chunks each side of a search reads at most, when it searches deeper because the reader may not read the best hits.
com.top_logic.tl.ai.index.AiIndexConfig.min-similarity = Minimum similarity
com.top_logic.tl.ai.index.AiIndexConfig.min-similarity.tooltip = The lowest cosine between the query and a chunk that finds the chunk by meaning. <p> Without it, a search answers the nearest chunks also when none of them is near: a query that nothing in the index means gets unrelated objects. The value depends on the model: measure the cosine of related and of unrelated texts of the application and put it between. 0 switches it off. </p>
com.top_logic.tl.ai.index.AiIndexConfig.readable-scopes = Readable scopes
com.top_logic.tl.ai.index.AiIndexConfig.readable-scopes.tooltip = TL-Script without arguments answering every scope object a reader may search in, e.g. all(`my:Project`). <p> Runs in the reader's own interaction for each search, and the result is filtered again by the reader's read rights. The search then filters by these scopes inside the index, so a reader of one project of a thousand gets a full page from that project. Without it, chunks of scoped types are filtered by type only and checked one by one, which can leave a narrow reader with a short page. </p>
com.top_logic.tl.ai.index.AiIndexConfig.revision-slice = Revision slice
com.top_logic.tl.ai.index.AiIndexConfig.revision-slice.tooltip = How many revisions of the history are read and committed at once.
com.top_logic.tl.ai.index.AiIndexConfig.tooltip = What an index holds and how it is kept.
com.top_logic.tl.ai.index.AiIndexConfig.types = Types
com.top_logic.tl.ai.index.AiIndexConfig.types.tooltip = The indexed types.
com.top_logic.tl.ai.index.AiIndexService = AI index
com.top_logic.tl.ai.index.AiIndexService.tooltip = The application's hybrid index: words and meaning of the configured types, kept in step with the knowledge base, searched under the reader's rights. <p> Configure the indexed types and an embedder; without types the index holds nothing, without an embedder it searches words only. See tl-ai-index/README.md. </p>
com.top_logic.tl.ai.index.config.ChunkingConfig = Chunking configuration
com.top_logic.tl.ai.index.config.ChunkingConfig.max-chars = Maximum chars
com.top_logic.tl.ai.index.config.ChunkingConfig.max-chars.tooltip = The largest chunk in characters. <p> 1,200 characters are about 300 tokens of German text, below the 512 tokens of the smaller models with the label in front. </p>
com.top_logic.tl.ai.index.config.ChunkingConfig.max-text-chars = Maximum text chars
com.top_logic.tl.ai.index.config.ChunkingConfig.max-text-chars.tooltip = The most characters of one text that are indexed; the rest of a longer text is left out.
com.top_logic.tl.ai.index.config.ChunkingConfig.overlap-sentences = Overlap sentences
com.top_logic.tl.ai.index.config.ChunkingConfig.overlap-sentences.tooltip = How many sentences a chunk repeats from the one before it.
com.top_logic.tl.ai.index.config.ChunkingConfig.page-marker = Page marker
com.top_logic.tl.ai.index.config.ChunkingConfig.page-marker.tooltip = A regular expression for a line that starts a page, with the page number as its first group, e.g. ^\\[p\\.(\\d+)\\]$. A chunk never crosses a page, so a hit can name its page.
com.top_logic.tl.ai.index.config.ChunkingConfig.tooltip = How the texts of indexed objects are cut into chunks.
com.top_logic.tl.ai.index.config.IndexedTypeConfig = Indexed type configuration
com.top_logic.tl.ai.index.config.IndexedTypeConfig$Keyword = Keyword
com.top_logic.tl.ai.index.config.IndexedTypeConfig$Keyword.tooltip = A value a search can filter by.
com.top_logic.tl.ai.index.config.IndexedTypeConfig$TextPart = Text part
com.top_logic.tl.ai.index.config.IndexedTypeConfig$TextPart.tooltip = One text of an indexed object: the value of an attribute, or what a script derives.
com.top_logic.tl.ai.index.config.IndexedTypeConfig.Keyword.name = Name
com.top_logic.tl.ai.index.config.IndexedTypeConfig.Keyword.name.tooltip = The name a search uses for the keyword.
com.top_logic.tl.ai.index.config.IndexedTypeConfig.Keyword.reads = Reads
com.top_logic.tl.ai.index.config.IndexedTypeConfig.Keyword.reads.tooltip = The attributes of the object the script reads. <p> A search that filters by the keyword shows an object only to a reader who may read each of these attributes. Otherwise a filter would tell a reader the value of an attribute the reader may not read. </p>
com.top_logic.tl.ai.index.config.IndexedTypeConfig.Keyword.script = Script
com.top_logic.tl.ai.index.config.IndexedTypeConfig.Keyword.script.tooltip = TL-Script of one argument, the object, answering the value or values: an object counts by its identifier, an enumeration value by its name, anything else by its text.
com.top_logic.tl.ai.index.config.IndexedTypeConfig.TextPart.attribute = Attribute
com.top_logic.tl.ai.index.config.IndexedTypeConfig.TextPart.attribute.tooltip = The attribute whose value is the text: a string, an internationalized text, a binary whose content is converted to text, or a list of those.
com.top_logic.tl.ai.index.config.IndexedTypeConfig.TextPart.name = Name
com.top_logic.tl.ai.index.config.IndexedTypeConfig.TextPart.name.tooltip = The name of the part, stored with each chunk; the attribute's name when none is given.
com.top_logic.tl.ai.index.config.IndexedTypeConfig.TextPart.reads = Reads
com.top_logic.tl.ai.index.config.IndexedTypeConfig.TextPart.reads.tooltip = The attributes of the object the script reads. <p> A hit shows a chunk only to a reader who may read each of these attributes. A script part without this list shows its text to nobody. </p>
com.top_logic.tl.ai.index.config.IndexedTypeConfig.TextPart.script = Script
com.top_logic.tl.ai.index.config.IndexedTypeConfig.TextPart.script.tooltip = TL-Script of one argument, the object, answering the text, instead of an attribute.
com.top_logic.tl.ai.index.config.IndexedTypeConfig.keywords = Keywords
com.top_logic.tl.ai.index.config.IndexedTypeConfig.keywords.tooltip = Values a search can filter by, e.g. a record kind or a status.
com.top_logic.tl.ai.index.config.IndexedTypeConfig.label-prefix = Label prefix
com.top_logic.tl.ai.index.config.IndexedTypeConfig.label-prefix.tooltip = Whether the object's label is put in front of every chunk before it is embedded. <p> So a chunk from page 40 still carries the document's title in its vector. The label is not part of the chunk's text that the word fields analyse and a hit shows. </p>
com.top_logic.tl.ai.index.config.IndexedTypeConfig.name = Name
com.top_logic.tl.ai.index.config.IndexedTypeConfig.name.tooltip = The qualified name of the type, e.g. pietro:Statement.
com.top_logic.tl.ai.index.config.IndexedTypeConfig.scope = Scope
com.top_logic.tl.ai.index.config.IndexedTypeConfig.scope.tooltip = TL-Script of one argument, the object, answering the object or objects that scope it, e.g. its project. <p> A search filters by the scopes the reader may read inside the index, so a reader who may read one project of a thousand gets a full page from that project. Without a scope the search filters by type only and checks the rights of each hit afterwards, which may leave a narrow reader with a short page. </p>
com.top_logic.tl.ai.index.config.IndexedTypeConfig.texts = Texts
com.top_logic.tl.ai.index.config.IndexedTypeConfig.texts.tooltip = The texts of an object of the type that are searched.
com.top_logic.tl.ai.index.config.IndexedTypeConfig.tooltip = Which objects of one type are indexed, with which text, scope and keywords. <pre> &lt;type name="pietro:Statement" scope="s -&gt; $s.get(`pietro:Statement#project`)"&gt; &lt;text attribute="text"/&gt; &lt;text name="context" script="s -&gt; $s.get(`pietro:Statement#title`)" reads="title"/&gt; &lt;keywords&gt; &lt;keyword name="kind" script="s -&gt; $s.get(`pietro:Statement#kind`)" reads="kind"/&gt; &lt;/keywords&gt; &lt;/type&gt; </pre> <p> The configuration applies to the type and to every sub type that has no configuration of its own. The scripts run in a system interaction while the index is written, so they see every object; they must only read. </p>
com.top_logic.tl.ai.index.embed.AbstractEmbedder = Embedder
com.top_logic.tl.ai.index.embed.AbstractEmbedder.Config.batch-size = Batch size
com.top_logic.tl.ai.index.embed.AbstractEmbedder.Config.batch-size.tooltip = How many texts go into one call of the model.
com.top_logic.tl.ai.index.embed.AbstractEmbedder.Config.dimensions = Dimensions
com.top_logic.tl.ai.index.embed.AbstractEmbedder.Config.dimensions.tooltip = The number of components of every vector. <p> The model's own length, or fewer for a model trained to be cut (Matryoshka). </p>
com.top_logic.tl.ai.index.embed.AbstractEmbedder.Config.passage-prefix = Passage prefix
com.top_logic.tl.ai.index.embed.AbstractEmbedder.Config.passage-prefix.tooltip = Text put in front of every passage before it is embedded, e.g. "passage: " for the e5 models; empty for arctic-embed v2.
com.top_logic.tl.ai.index.embed.AbstractEmbedder.Config.query-prefix = Query prefix
com.top_logic.tl.ai.index.embed.AbstractEmbedder.Config.query-prefix.tooltip = Text put in front of every query before it is embedded, e.g. "query: " for the e5 and arctic-embed models.
com.top_logic.tl.ai.index.embed.AbstractEmbedder.tooltip = What every <i>embedder</i> does the same way: prefixes, batches, the number of dimensions and normalization. <p> A model that is trained with Matryoshka representation learning (arctic-embed v2, Qwen3-Embedding) keeps most of its quality when its vector is cut to fewer dimensions. <i>Dimensions</i> smaller than the model's output cuts every vector to that length and normalizes it again; that makes the index smaller. A model without that training must be configured with its own length. </p>
com.top_logic.tl.ai.index.embed.Embedder.close = Close
com.top_logic.tl.ai.index.embed.Embedder.close.tooltip = Frees what the embedder holds - a native session, a connection pool.
com.top_logic.tl.ai.index.embed.Embedder.dimensions = Dimensions
com.top_logic.tl.ai.index.embed.Embedder.dimensions.tooltip = The number of components of every vector.
com.top_logic.tl.ai.index.embed.Embedder.embedPassages = Embed passages
com.top_logic.tl.ai.index.embed.Embedder.embedPassages.return = One normalized vector per text, in the order of the texts.
com.top_logic.tl.ai.index.embed.Embedder.embedPassages.tooltip = Embeds texts that are searched for, in one or more batches.
com.top_logic.tl.ai.index.embed.Embedder.embedQuery = Embed query
com.top_logic.tl.ai.index.embed.Embedder.embedQuery.return = The normalized vector.
com.top_logic.tl.ai.index.embed.Embedder.embedQuery.tooltip = Embeds a query.
com.top_logic.tl.ai.index.embed.Embedder.fingerprint = Fingerprint
com.top_logic.tl.ai.index.embed.Embedder.fingerprint.tooltip = Everything that makes two vectors of this embedder comparable: model, dimensions, prefixes, pooling.
com.top_logic.tl.ai.index.embed.Embedder.modelId = Model ID
com.top_logic.tl.ai.index.embed.Embedder.modelId.tooltip = The name of the model, as stored with each vector.
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder = HTTP embedding endpoint
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.Config.api-key = Api key
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.Config.api-key.tooltip = The API key, sent as bearer token in the header <code>"Authorization"</code>; none for a server without authentication. <p> Recommended is a reference to the key by its secret name, so that the key is not part of the configuration: </p> <pre> &lt;api-key name="tl_embed_api_key"/&gt; </pre> <p> An attribute value is an encrypted key, or a plain key with the prefix <code>unencrypted:</code>. Configuring both an API key and credentials is an error. </p>
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.Config.base-url = Base URL
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.Config.base-url.tooltip = The address of the server, e.g. https://embed.example.eu; a trailing /v1 may be given or not.
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.Config.credentials = Credentials
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.Config.credentials.tooltip = How the requests to the server are authenticated, if not with an API key. <p> E.g. with an access token from an OAuth2 authorization server. Without credentials and API key, the requests are sent without credentials. Configuring both credentials and an API key is an error. </p>
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.Config.model = Model
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.Config.model.tooltip = The model name the server knows the model by.
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.Config.retries = Retries
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.Config.retries.tooltip = How often a failed request is repeated.
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.Config.retry-delay-millis = Retry delay millis
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.Config.retry-delay-millis.tooltip = The delay before the first repetition; it doubles with each further one.
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.Config.send-dimensions = Send dimensions
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.Config.send-dimensions.tooltip = Whether the request asks the server for the configured number of dimensions. <p> The <code>OpenAI</code> API cuts the vector on the server when asked; many other servers refuse the parameter. Without it, a longer vector is cut here. </p>
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.Config.timeout-seconds = Timeout seconds
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.Config.timeout-seconds.tooltip = How long one request may take.
com.top_logic.tl.ai.index.embed.OpenAiCompatibleEmbedder.tooltip = An <i>embedder</i> that calls POST <base-url>/v1/embeddings of an <code>OpenAI</code>-compatible server. <p> <code>vLLM</code>, text-embeddings-inference, llama.cpp's server and Ollama all offer this route, so one class serves a GPU endpoint of our own as well as a paid API. One request carries a whole batch. A request that fails with a network error, 429 or a 5xx is retried with a doubling delay; any other answer fails at once. </p> <p> Each attempt is authenticated by the configured <i>credential provider</i> at the moment it is sent. An answer 401 Unauthorized invalidates the credentials - a cached access token may have expired or been revoked - and the request is sent once more with fresh ones. </p>
com.top_logic.tl.ai.index.query.SearchMode = Search mode
com.top_logic.tl.ai.index.query.SearchMode.HYBRID = Hybrid
com.top_logic.tl.ai.index.query.SearchMode.HYBRID.tooltip = Words and meaning, fused.
com.top_logic.tl.ai.index.query.SearchMode.MEANING = Meaning
com.top_logic.tl.ai.index.query.SearchMode.MEANING.tooltip = Meaning only: paraphrases, other languages.
com.top_logic.tl.ai.index.query.SearchMode.WORDS = Words
com.top_logic.tl.ai.index.query.SearchMode.WORDS.tooltip = Words only: exact terms, codes, names.
com.top_logic.tl.ai.index.query.SearchMode.tooltip = Which side of the index a search asks.
com.top_logic.tl.ai.index.script.AiIndexScriptFunctions.search = Search
com.top_logic.tl.ai.index.script.AiIndexScriptFunctions.search.param.options.tooltip = Optional: types (qualified type names), scopes (scope objects), filters (keyword name to value or list of values), mode ("hybrid", "words" or "meaning"), limit (at most 50).
com.top_logic.tl.ai.index.script.AiIndexScriptFunctions.search.param.query.tooltip = What to look for.
com.top_logic.tl.ai.index.script.AiIndexScriptFunctions.search.return = The objects found, best first.
com.top_logic.tl.ai.index.script.AiIndexScriptFunctions.search.tooltip = Searches the application's index by words and meaning. <p> Answers the objects the current user may read, best first. A German query finds an English text. Example: <code>aiIndexSearch("Grundplatte", {"types": ["my:Statement"], "limit": 5})</code>. </p>
com.top_logic.tl.ai.index.script.AiIndexScriptFunctions.similar = Similar
com.top_logic.tl.ai.index.script.AiIndexScriptFunctions.similar.param.object.tooltip = The object to start from.
com.top_logic.tl.ai.index.script.AiIndexScriptFunctions.similar.param.options.tooltip = Optional, as for aiIndexSearch, without mode.
com.top_logic.tl.ai.index.script.AiIndexScriptFunctions.similar.return = The objects found, best first, without the given one.
com.top_logic.tl.ai.index.script.AiIndexScriptFunctions.similar.tooltip = Finds objects whose content is close to the given object's. <p> Example: <code>aiIndexSimilar($statement, {"types": ["my:Statement"], "limit": 10})</code>. </p>
com.top_logic.tl.ai.index.script.AiIndexScriptFunctions.status = Status
com.top_logic.tl.ai.index.script.AiIndexScriptFunctions.status.return = A dictionary with ready, indexedRevision, headRevision, pendingRevisions, rebuilding, buildTotal, buildDone, meaning, lastError and embedderProblem.
com.top_logic.tl.ai.index.script.AiIndexScriptFunctions.status.tooltip = Where the index stands.
