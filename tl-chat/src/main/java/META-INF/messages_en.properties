class.com.top_logic.ai.chat.sched.I18NConstants.RUN_SKIPPED_SESSION_BUSY = The chat session of this task is already processing a message; this run was skipped.
class.com.top_logic.ai.chat.sched.I18NConstants.RUN_SKIPPED_SESSION_BUSY.help = The run was not started, because the chat session it would have used is busy.
class.com.top_logic.ai.chat.sched.I18NConstants.RUN_SKIPPED_STILL_RUNNING = The previous run of this task is still working; this run was skipped.
