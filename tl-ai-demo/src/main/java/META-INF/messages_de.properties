com.top_logic.ai.demo.secdemo.SecDemoSetupService = Service zur Einrichtung von Sicherheitsdemonstrationen
com.top_logic.ai.demo.secdemo.SecDemoSetupService$PersonaConfig = Persona-Konfiguration
com.top_logic.ai.demo.secdemo.SecDemoSetupService$PersonaConfig.tooltip = Eine Persona des Testumfelds: ein Konto, die Gruppe, der es angehört, und die Rolle, die diese Gruppe innehat.
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.component-access = Zugriff auf Komponenten
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.component-access.tooltip = Die Ansichten (Layout-Komponenten), die die Persona-Rollen öffnen dürfen, im Format der Datei „WEB-INF/conf/security.xml“ der Engine. <p> Zugriffsrechte allein reichen nicht aus, um eine Anwendung nutzbar zu machen: Eine Rolle, die einen Typ lesen darf, sieht dennoch keine Registerkarte, solange sie keine Befehlsgruppe im übergeordneten <i>zusammengesetzten Sicherheitslayout</i> besitzt. Genau hier kommen die Persona-Rollen ins Spiel. </p> <p> Ein Profil mit dem Namen „*“ wird auf die Rolle jeder konfigurierten Persona angewendet. Auf diese Weise stellt die Testumgebung sicher, dass alle Personas dieselbe Benutzeroberfläche sehen: Das einzige, was zwei von ihnen unterscheidet, ist dann die Richtlinie, niemals das, worauf sie zugreifen können – was ein „Zulassen/Verweigern“-Paar in einer Abfrage vergleichbar macht. Ein nach einer einzelnen Rolle benanntes Profil funktioniert weiterhin, wenn eine Persona bewusst unterschiedliche Ansichten benötigt. </p> <p> Im Gegensatz zum Import der Engine werden die Einträge hier <em>additiv</em> angewendet: Der Zugriff außerhalb dieser Konfiguration bleibt unberührt, sodass die mitgelieferte Demo unbeeinträchtigt bleibt, solange der Aspekt deaktiviert ist. </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.initial-password = Anfangspasswort
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.initial-password.tooltip = Passwort, das den Persona-Konten bei ihrer Erstellung zugewiesen wird. <p> Es muss den Passwortrichtlinien des konfigurierten Authentifizierungsgeräts entsprechen (standardmäßig: mindestens 8 Zeichen aus mindestens zwei Zeichenklassen). </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.personas = Personas
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.personas.tooltip = Die zu besetzenden Konten, indiziert nach Login. <p> Ein Eintrag pro Persona der Testumgebung. Sie stehen in der Konfiguration und nicht im Code, damit die Matrix, die ein Tester im Kopf behalten muss - welcher Login welche Rolle innehat und was jede Rolle demonstriert -, an einer Stelle lesbar ist, neben der &lt;tool-access&gt;-Richtlinie und der &lt;security-config&gt;, die diesen Rollen ihre Bedeutung geben. </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.group = Gruppe
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.group.tooltip = Name der Gruppe, der dieses Konto beitritt. <p> Muss in <i>den ursprünglichen Gruppen</i> desselben Aspekts deklariert sein. </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.login = Anmeldename
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.login.tooltip = Anmeldename des zu erstellenden Kontos.
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.purpose = Zweck
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.purpose.tooltip = Eine Zeile, in der beschrieben wird, welche Rolle diese Persona in der Testumgebung demonstrieren soll. <p> Wird beim Systemstart protokolliert, sodass das Boot-Protokoll gleichzeitig als Index der Testumgebung dient. </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.role = Rolle
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.role.tooltip = Name der Rolle, die der Gruppe an der Sicherheitswurzel zugewiesen wird. <p> Muss in <i>den Ausgangsrollen</i> desselben Aspekts deklariert sein. Dies ist der Name, auf den sich die &lt;security-config&gt; und die &lt;tool-access&gt;-Richtlinie beziehen. </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.tooltip = Richtet die Konfigurationen des Agent-Sicherheitstestumgebungs-Testbeds ein: ein Konto pro Persona, deren Gruppenzugehörigkeit, die Rolle, die diese Gruppe in der Sicherheitswurzel einnimmt, den Komponenten- (Layout-)Zugriff, den jede Persona benötigt, um auf den Agent-Chat zuzugreifen, sowie eine Handvoll Beispielinstanzen. <p> Der Dienst wird nur gestartet, wenn der Opt-in-Eintrag WEB-INF/conf/secdemo.config.xml in der Datei WEB-INF/conf/metaConf.txt aufgeführt ist. Alle Schritte sind idempotent, sodass ein Neustart der Anwendung keine Duplikate erzeugt. </p> <p> Die Rollen selbst werden durch <i>„initial roles“</i> erstellt, die Gruppen durch <i>„initial groups“</i>; beide werden im selben Aspekt konfiguriert. Was noch übrig bleibt – die Zuordnung einer Rolle zu einer Gruppe <em>in der Sicherheitswurzel</em> und die Erstellung von Konten – hat in der Engine kein deklaratives Pendant, daher dieser Dienst. Er liest aus <i>den Personas</i>, welche Konten erstellt werden sollen, sodass die gesamte Persona-Matrix in der Aspektdatei enthalten ist und nicht nur die Hälfte davon hier. </p> <p> Das Gleiche gilt für den Komponentenzugriff. Die <i>Zugriffskonfiguration</i> der Engine liest diese deklarativ <i>ein</i>, jedoch nur aus einem festen Pfad, und ihr Import <em>setzt</em> den Zugriff jeder Ansicht in der Anwendung <em>zurück</em>, bevor diese Datei angewendet wird. Ein Opt-in-Aspekt darf beides nicht tun, daher wendet dieser Dienst genau dasselbe <i>Zugriffskonfigurationsformat</i> additiv an. </p>
