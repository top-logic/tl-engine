com.top_logic.factory.agent.AgentHarness.newProtocol.tooltip = Ein neuer Übersetzer für das Protokoll eines Prozesses. <p> Ein Prozess erhält ein eigenes Protokoll, das den Zustand über die Nachrichten des Prozesses hinweg beibehalten kann. </p>
com.top_logic.factory.agent.WorkspaceAgentService = Dienst der Workspace-Agenten
com.top_logic.factory.agent.WorkspaceAgentService.Config.harness = Agent
com.top_logic.factory.agent.WorkspaceAgentService.Config.harness.tooltip = Der Coding-Agent, der in den Workspaces läuft.
com.top_logic.factory.agent.WorkspaceAgentService.Config.idle-timeout = Leerlauf-Timeout
com.top_logic.factory.agent.WorkspaceAgentService.Config.idle-timeout.tooltip = Wie lange der Prozess einer Unterhaltung nach seiner letzten Antwort behalten wird, z. B. 15min; die nächste Nachricht startet einen neuen Prozess, der die Unterhaltung fortsetzt.
com.top_logic.factory.agent.WorkspaceAgentService.Config.interrupt-timeout = Unterbrechungs-Timeout
com.top_logic.factory.agent.WorkspaceAgentService.Config.interrupt-timeout.tooltip = Wie lange ein Lauf nach dem Stopp durch den Benutzer darauf wartet, dass der Agent anhält, bevor sein Prozess beendet wird.
com.top_logic.factory.agent.WorkspaceAgentService.Config.stop-timeout = Stopp-Timeout
com.top_logic.factory.agent.WorkspaceAgentService.Config.stop-timeout.tooltip = Wie lange ein nicht mehr benötigter Prozess nach dem Schließen seiner Eingabe Zeit hat, sich zu beenden, bevor er beendet wird.
com.top_logic.factory.agent.WorkspaceAgentService.Config.token-lifetime = Token-Lebensdauer
com.top_logic.factory.agent.WorkspaceAgentService.Config.token-lifetime.tooltip = Die Lebensdauer des Tokens eines Agentenprozesses für den LLM-Proxy, z. B. 4h; höchstens die längste Lebensdauer des Proxys. <p> Ein Prozess, dessen Token weniger als die Hälfte seiner Lebensdauer übrig hat, wird vor seinem nächsten Lauf durch einen neuen ersetzt, so dass ein Lauf mindestens diese Hälfte hat. </p>
com.top_logic.factory.agent.WorkspaceAgentService.tooltip = Dienst, der die <i>Workspace-Agenten</i> der <code>"AgentConversation"</code>s hält: den Coding-Agenten, der in einem Workspace arbeitet, ein Prozess pro Unterhaltung. <p> Der <i>Resolver für Agenten-Unterhaltungen</i> lässt die Agenten die Chats beantworten, deren Gegenstand eine Unterhaltung ist. Das Aufräumen eines Workspaces stoppt seine Agenten, ein Herunterfahren alle. </p>
com.top_logic.factory.agent.claude.ClaudeCodeHarness = Claude Code
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.command = Befehl
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.command.tooltip = Das Programm von Claude Code im Workspace-Image.
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.extra-args = Weitere Argumente
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.extra-args.tooltip = Weitere Argumente, die an die Befehlszeile angehängt werden, z. B. --max-turns,50.
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.model = Modell
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.model.tooltip = Das Modell, mit dem Claude Code arbeitet, z. B. claude-sonnet-4-6 oder ein Alias wie sonnet; leer für die Voreinstellung von Claude Code.
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.thinking-display = Anzeige des Denkens
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.thinking-display.tooltip = Wie das Denken des Modells in der Ausgabe von Claude Code erscheint: <code>"summarized"</code> für eine Zusammenfassung, die der Chat anzeigt; <code>omitted</code> für keinen Text; leer für die Voreinstellung von Claude Code, die es im Print-Modus weglässt.
com.top_logic.factory.agent.claude.ClaudeCodeHarness.tooltip = <i>Agent</i>, der Claude Code im Print-Modus mit stream-json als Ein- und Ausgabe ausführt. <p> Der Prozess wird als </p> <pre> claude -p --input-format stream-json --output-format stream-json --verbose --include-partial-messages --permission-mode bypassPermissions [--thinking-display &lt;Anzeige&gt;] [--model &lt;Modell&gt;] [--resume &lt;Session-ID&gt;] [&lt;weitere Argumente&gt;] </pre> <p> als Workspace-Benutzer gestartet - Claude Code verweigert als root das Umgehen seiner Rückfragen - mit dem Token des Prozesses in <code>"ANTHROPIC_AUTH_TOKEN"</code>. Der Container hat die URL des LLM-Proxys in <code>"ANTHROPIC_BASE_URL"</code>. Die Ausgabe übersetzt das <i>Claude-Code-Protokoll</i>. </p>
com.top_logic.factory.llm.LLMAdmission$Status = Zulassung
com.top_logic.factory.llm.LLMAdmission$Status.tooltip = Ob eine Anfrage weitergeleitet wird, und warum nicht.
com.top_logic.factory.llm.LLMAdmission.Status.ADMITTED = Zugelassen
com.top_logic.factory.llm.LLMAdmission.Status.ADMITTED.tooltip = Das Token ist gültig; die Anfrage wird weitergeleitet.
com.top_logic.factory.llm.LLMAdmission.Status.FOREIGN_SOURCE = Fremde Quelle
com.top_logic.factory.llm.LLMAdmission.Status.FOREIGN_SOURCE.tooltip = Das Token ist gültig, wurde aber zuerst von einer anderen Adresse aus verwendet.
com.top_logic.factory.llm.LLMAdmission.Status.INVALID_TOKEN = Ungültiges Token
com.top_logic.factory.llm.LLMAdmission.Status.INVALID_TOKEN.tooltip = Das Token fehlt, ist unbekannt, widerrufen oder abgelaufen, oder sein Workspace existiert nicht mehr.
com.top_logic.factory.llm.LLMAdmission.Status.RATE_LIMITED = Ratenbegrenzt
com.top_logic.factory.llm.LLMAdmission.Status.RATE_LIMITED.tooltip = Das Token ist gültig, hat aber in der letzten Minute zu viele Anfragen gestellt.
com.top_logic.factory.llm.LLMProxyService = LLM-Proxy-Dienst
com.top_logic.factory.llm.LLMProxyService.Config.allowed-sources = Zulässige Quellen
com.top_logic.factory.llm.LLMProxyService.Config.allowed-sources.tooltip = Die Client-Adressen, von denen Anfragen angenommen werden: Bereiche in CIDR-Notation (IPv4 oder IPv6), einzelne Adressen oder <code>"workspace-network"</code> für das Netzwerk der Workspace-Container. <p> Leer nimmt jede Adresse an. Geprüft wird die Adresse der Verbindung, nie ein Header der Anfrage: Hinter einem Reverse-Proxy oder einem Gateway ist es die Adresse dieses Proxys. </p>
com.top_logic.factory.llm.LLMProxyService.Config.listen-address = Lauschadresse
com.top_logic.factory.llm.LLMProxyService.Config.listen-address.tooltip = Die Adresse, auf der der Proxy mit einem eigenen Port lauscht, siehe <i>Lauschport</i>. <p> Die Voreinstellung, die Loopback-Adresse, dient nur einem Reverse-Proxy oder Tunnel auf demselben Host. Läuft die Steueranwendung auf dem Host des Docker-Daemons, ist es die Adresse, für die host-gateway in den Workspaces steht - das Gateway der Standard-Bridge von Docker, z. B. 172.17.0.1 -, sodass die Workspaces ihn erreichen, aber kein anderer Host. In einem eigenen Container lauscht die Steueranwendung auf 0.0.0.0, und der Port wird nicht oder nur auf einer internen Adresse veröffentlicht. </p>
com.top_logic.factory.llm.LLMProxyService.Config.listen-port = Lauschport
com.top_logic.factory.llm.LLMProxyService.Config.listen-port.tooltip = Der Port, auf dem der Proxy neben dem Port der Steueranwendung lauscht; 0 für keinen eigenen Port. <p> Der Proxy ist dort unter <code>"/llm-proxy"</code> erreichbar. Der Port wird nur geöffnet, wenn der Proxy über seine URL eingeschaltet ist. </p>
com.top_logic.factory.llm.LLMProxyService.Config.max-token-lifetime = Maximale Token-Lebensdauer
com.top_logic.factory.llm.LLMProxyService.Config.max-token-lifetime.tooltip = Die längste Lebensdauer eines Tokens in Millisekunden, z. B. 4h; eine längere angeforderte Lebensdauer wird darauf gekürzt.
com.top_logic.factory.llm.LLMProxyService.Config.provider = Anbieter
com.top_logic.factory.llm.LLMProxyService.Config.provider.tooltip = Der Name des Anthropic-Anbieters unter den <i>LLM-Anbietern</i>, dessen API-Schlüssel, Basis-URL, Version und Timeouts der Proxy verwendet.
com.top_logic.factory.llm.LLMProxyService.Config.proxy-url = Proxy-URL
com.top_logic.factory.llm.LLMProxyService.Config.proxy-url.tooltip = Die URL des Proxys, wie die Workspace-Container sie erreichen: sein eigener Port, z. B. http://host.docker.internal:8091/llm-proxy, oder das <i>LLM-Proxy-Servlet</i>, z. B. http://host.docker.internal:8080/tl-factory-app/llm-proxy. <p> Sie wird den Workspace-Containern in <code>"ANTHROPIC_BASE_URL"</code> übergeben. Leer schaltet den Proxy aus. </p>
com.top_logic.factory.llm.LLMProxyService.Config.rate-limit = Ratenbegrenzung
com.top_logic.factory.llm.LLMProxyService.Config.rate-limit.tooltip = Die Anfragen pro Minute, die ein Token stellen darf, in Schüben bis zu dieser Zahl; 0 für keine Begrenzung. <p> Eine Anfrage darüber hinaus wird mit 429 und den zu wartenden Sekunden in Retry-After beantwortet, die Claude Code abwartet, bevor es die Anfrage wiederholt. Die Voreinstellung lässt einem Agenten, der mit voller Geschwindigkeit arbeitet - eine Anfrage pro Schritt und einige Nebenanfragen -, Spielraum und begrenzt ein Token, das aus dem Workspace gelangt ist. </p>
com.top_logic.factory.llm.LLMProxyService.Config.servlet-enabled = Servlet eingeschaltet
com.top_logic.factory.llm.LLMProxyService.Config.servlet-enabled.tooltip = Ob der Proxy auch unter <code>"/llm-proxy"</code> der Webanwendung antwortet, über den Port der Steueranwendung. <p> Standardmäßig aus: Den Port der Steueranwendung erreichen ihre Benutzer, und der Proxy muss dort nicht erreichbar sein. Ist es eingeschaltet, muss ein Reverse-Proxy vor der Steueranwendung Clients von außen von diesem Pfad fernhalten. </p>
com.top_logic.factory.llm.LLMProxyService.tooltip = Zugriff der Workspaces auf die Anthropic Messages API ohne API-Schlüssel im Workspace. <p> Ein Workspace-Container erhält in seiner Umgebung weder einen API-Schlüssel noch ein Token, nur die URL des <i>Proxys</i> der Steueranwendung in <code>"ANTHROPIC_BASE_URL"</code>. Ein Prozess, der die API nutzen darf - ein Agentenlauf -, erhält ein eigenes Token, das für seinen Workspace ausgestellt und nur diesem Prozess in <code>"ANTHROPIC_AUTH_TOKEN"</code> übergeben wird; Claude Code sendet es als Bearer-Token. Der Proxy nimmt eine Anfrage von einer zulässigen Adresse an, deren Token sie zulässt, fügt den API-Schlüssel des konfigurierten Anbieters der <i>LLM-Anbieter</i> hinzu und leitet die Anfrage weiter. </p> <p> Ein Token besteht aus <code>"tlwst_"</code>, gefolgt von einem zufälligen Geheimnis von etwa 256 Bit. Es ist gültig, bis es widerrufen wird - wenn sein Lauf endet -, bis seine Lebensdauer abläuft (höchstens <i>Maximale Token-Lebensdauer</i>) oder bis sein Workspace entfernt wird. Es ist an die Adresse seiner ersten Anfrage gebunden und auf <i>Ratenbegrenzung</i> Anfragen pro Minute begrenzt, siehe <i>Token-Zuteilungen</i>. Tokens werden nur im Speicher gehalten, als ihre Hashes; ein Neustart der Steueranwendung macht alle ungültig, zusammen mit den von ihr gestarteten Läufen. </p> <p> Der Proxy wird über seine URL eingeschaltet: Ohne sie erhalten Workspaces keine URL, es wird kein Token ausgestellt, und der Proxy beantwortet jede Anfrage mit 404. Er lauscht auf einem eigenen Port (<i>LLM-Proxy-Listener</i>, <i>Lauschadresse</i>, <i>Lauschport</i>); das <i>LLM-Proxy-Servlet</i> in der Webanwendung antwortet nur, wenn <i>Servlet eingeschaltet</i> gesetzt ist. </p>
com.top_logic.factory.project.FactoryFunctions.agentUnavailable = Agent nicht verfügbar
com.top_logic.factory.project.FactoryFunctions.agentUnavailable.param.workspace.tooltip = Der Workspace eines Projekts, leer bei einem Projekt ohne Workspace.
com.top_logic.factory.project.FactoryFunctions.agentUnavailable.return = Der Grund, nichts, wenn der Agent im Workspace arbeiten kann.
com.top_logic.factory.project.FactoryFunctions.agentUnavailable.tooltip = Warum der Coding-Agent jetzt nicht in einem Workspace arbeiten kann: Der Workspace läuft nicht, läuft auf einem veralteten Image ohne die Werkzeuge des Agenten, oder die Steueranwendung gibt den Workspaces keinen Zugang zu einem Sprachmodell.
