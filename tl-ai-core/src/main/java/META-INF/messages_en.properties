com.top_logic.tl.ai.core.agent.AgentCapabilities.Unusable.Cause.AGENTS_OWN_DENIED.tooltip = The model the agent is assigned, or a server it declares, is denied to this account.
com.top_logic.tl.ai.core.agent.AgentCapabilities.Unusable.Cause.AGENT_WITHHELD = Agent withheld
com.top_logic.tl.ai.core.agent.AgentCapabilities.Unusable.Cause.AGENT_WITHHELD.tooltip = No role of the acting account is granted this agent.
com.top_logic.tl.ai.core.agent.AgentCapabilities.Unusable.Cause.INFRASTRUCTURE = Infrastructure
com.top_logic.tl.ai.core.agent.AgentCapabilities.Unusable.Cause.INFRASTRUCTURE.tooltip = The agent is infrastructure: the application runs it for a user, nobody delegates to it.
com.top_logic.tl.ai.core.agent.AgentCapabilities.Unusable.Cause.NO_REACHABLE_TOOL = No reachable tool
com.top_logic.tl.ai.core.agent.AgentCapabilities.Unusable.Cause.NO_REACHABLE_TOOL.tooltip = The account may run the agent, but no tool the agent reaches is permitted to the run.
com.top_logic.tl.ai.core.agent.AgentCapabilities.Unusable.Cause.TYPE_UNREADABLE = Type unreadable
com.top_logic.tl.ai.core.agent.AgentCapabilities.Unusable.Cause.TYPE_UNREADABLE.tooltip = Every tool left works on model types this account may not read.
com.top_logic.tl.ai.core.agent.AgentSource = Agent source
com.top_logic.tl.ai.core.agent.AgentSource.CONFIG = Configuration
com.top_logic.tl.ai.core.agent.AgentSource.CONFIG.tooltip = Defined in service configuration XML (TopLogic-provided, read-only).
com.top_logic.tl.ai.core.agent.AgentSource.KB = Knowledge-base
com.top_logic.tl.ai.core.agent.AgentSource.KB.tooltip = Defined in the knowledge base (application-specific).
com.top_logic.tl.ai.core.agent.AgentSource.KB_OVERRIDE = Knowledge-base override
com.top_logic.tl.ai.core.agent.AgentSource.KB_OVERRIDE.tooltip = KB agent that overrides a config-defined agent with the same name.
com.top_logic.tl.ai.core.agent.AgentSource.tooltip = Origin of an agent or skill definition.
com.top_logic.tl.ai.core.agent.AllAgentNamesGenerator = All agent names generator
com.top_logic.tl.ai.core.agent.AllAgentNamesGenerator.tooltip = <i>List generator adaptor</i> providing all available agent names as options. <p> Provides the options for the delegations attribute of tl.ai.core:Agent. </p> <p> An agent marked as infrastructure is not offered: the application runs it for a user, and the gate refuses a delegation to it, so an option naming one would be an option that never works. </p>
com.top_logic.tl.ai.core.agent.AllMcpServerNamesGenerator = All mcp server names generator
com.top_logic.tl.ai.core.agent.AllMcpServerNamesGenerator.tooltip = <i>List generator adaptor</i> providing all configured MCP server names as options. <p> Provides the options for the mcpServers attribute of tl.ai.core:Agent. </p>
com.top_logic.tl.ai.core.agent.AllModelNamesGenerator = All model names generator
com.top_logic.tl.ai.core.agent.AllModelNamesGenerator.tooltip = <i>List generator adaptor</i> providing explicitly configured AI model names as options. <p> Returns only models that an admin has added to a provider's models allowlist, excluding models that were merely discovered via provider API. Provides the options for the model attribute of tl.ai.core:Agent. </p>
com.top_logic.tl.ai.core.agent.AllSkillNamesGenerator = All skill names generator
com.top_logic.tl.ai.core.agent.AllSkillNamesGenerator.tooltip = <i>List generator adaptor</i> providing all available skill names as options. <p> Provides the options for the skills attribute of tl.ai.core:Agent. </p>
com.top_logic.tl.ai.core.agent.AllToolNamesGenerator = All tool names generator
com.top_logic.tl.ai.core.agent.AllToolNamesGenerator.tooltip = <i>List generator adaptor</i> providing all available tool names as options. <p> Provides the options for the tools attribute of tl.ai.core:Agent. </p>
com.top_logic.tl.ai.core.agent.DelegationRef = Delegation reference
com.top_logic.tl.ai.core.agent.DelegationRef.tooltip = <i>Name reference</i> subtype providing available agent names as delegation options.
com.top_logic.tl.ai.core.agent.ExecutionMode = Execution mode
com.top_logic.tl.ai.core.agent.ExecutionMode.DEVELOPMENT = Development
com.top_logic.tl.ai.core.agent.ExecutionMode.DEVELOPMENT.tooltip = Development environment. All tool modes permitted.
com.top_logic.tl.ai.core.agent.ExecutionMode.MAINTENANCE = Maintenance
com.top_logic.tl.ai.core.agent.ExecutionMode.MAINTENANCE.tooltip = Maintenance window active. All tool modes permitted.
com.top_logic.tl.ai.core.agent.ExecutionMode.PRODUCTION = Production
com.top_logic.tl.ai.core.agent.ExecutionMode.PRODUCTION.tooltip = Production environment. STRUCTURAL tools are denied by the system.
com.top_logic.tl.ai.core.agent.ExecutionMode.tooltip = The system's current execution mode. <p>Affects which tools the system allows. STRUCTURAL tools (those that modify application structure) are only permitted in <i>development</i> and <i>maintenance</i> modes, never in <i>production</i>.</p> <p>The bridge module folds TopLogic's two operational axes onto this one: the runtime maintenance window (MaintenanceWindowManager) and the boot-time environment the engine's OperationModeService reports.</p>
com.top_logic.tl.ai.core.agent.ExportToDataFolderCommand = Export to data folder command
com.top_logic.tl.ai.core.agent.ExportToDataFolderCommand.Config.file-name = File name
com.top_logic.tl.ai.core.agent.ExportToDataFolderCommand.Config.file-name.tooltip = Output file name, e.g. <code>agents.objects.xml</code>.
com.top_logic.tl.ai.core.agent.ExportToDataFolderCommand.Config.type-name = Type name
com.top_logic.tl.ai.core.agent.ExportToDataFolderCommand.Config.type-name.tooltip = Qualified TL type name in the form <code>module:type</code>, e.g. <code>tl.ai.core:Agent</code>.
com.top_logic.tl.ai.core.agent.ExportToDataFolderCommand.tooltip = Command handler that exports all instances of a configured TL type to an XML file in the application's <code>WEB-INF/data/</code> folder. <p> This is intended for development workflows where persistent object definitions need to be exported back into the source tree. </p>
com.top_logic.tl.ai.core.agent.ImportFromDataFolderCommand = Import from data folder command
com.top_logic.tl.ai.core.agent.ImportFromDataFolderCommand.Config.file-name = File name
com.top_logic.tl.ai.core.agent.ImportFromDataFolderCommand.Config.file-name.tooltip = Source file name within WEB-INF/data/, e.g. agents.objects.xml.
com.top_logic.tl.ai.core.agent.ImportFromDataFolderCommand.tooltip = Command handler that re-imports an *.objects.xml file from <code>WEB-INF/data/</code> into the running knowledge base, discarding any runtime edits to the affected instances and restoring the values committed in the source tree. <p> This is the inverse of <i>export to data folder command</i>: where the export button writes runtime state back to the XML file in the dev workspace, this command takes the XML file the dev workspace currently holds and pushes it back into the persistent store, in place, without requiring a server restart. </p> <p> Upsert semantics depend on the resolver declared in the &lt;resolvers&gt; block of the XML file. With <i>name based instance resolver</i>, an existing instance with the same name is deleted and re-created from the XML, making the file the authoritative source of truth. </p> <p> A restart after the import does not import the file a second time. </p>
com.top_logic.tl.ai.core.agent.McpServerRef = Mcp server reference
com.top_logic.tl.ai.core.agent.McpServerRef.tooltip = <i>Name reference</i> subtype providing available MCP server names as options.
com.top_logic.tl.ai.core.agent.ModelCapabilityModeSelector = Model capability mode selector
com.top_logic.tl.ai.core.agent.ModelCapabilityModeSelector.Config.capability = Capability
com.top_logic.tl.ai.core.agent.ModelCapabilityModeSelector.Config.capability.tooltip = The capability that must be supported by the model (e.g. "reasoning", "temperature"). <p> When null, no capability check is performed (only provider is checked). </p>
com.top_logic.tl.ai.core.agent.ModelCapabilityModeSelector.Config.providers = Providers
com.top_logic.tl.ai.core.agent.ModelCapabilityModeSelector.Config.providers.tooltip = Provider IDs this field/group applies to (e.g. "anthropic", "openai"). <p> When empty, the field is shown for all providers (only capability is checked). </p>
com.top_logic.tl.ai.core.agent.ModelCapabilityModeSelector.tooltip = <i>Mode selector</i> that controls field/group visibility based on the agent's selected model. <p> Resolves the model name to a provider ID and checks model capabilities from the catalog. A field or group is shown only when the provider matches AND the required capability is present. </p>
com.top_logic.tl.ai.core.agent.NameBasedInstanceResolver = Name based instance resolver
com.top_logic.tl.ai.core.agent.NameBasedInstanceResolver.tooltip = <i>Instance resolver</i> that resolves instances by their name attribute. <p> During export, the name value is used as the global identifier. During import, existing instances with the same name are deleted and re-created from the XML, making the objects.xml the authoritative source of truth. </p>
com.top_logic.tl.ai.core.agent.NameRef = Name reference
com.top_logic.tl.ai.core.agent.NameRef.tooltip = Named reference to a tool, skill, agent, or MCP server. <p> Used as the entry type for keyed lists in <i>agent configuration</i>. Storing the references as keyed list entries (rather than a single comma-separated string) enables per-entry overlay across configuration layers: an application module may add or remove a single entry without restating the entire platform-provided list. </p>
com.top_logic.tl.ai.core.agent.SkillRef = Skill reference
com.top_logic.tl.ai.core.agent.SkillRef.tooltip = <i>Name reference</i> subtype providing available skill names as options.
com.top_logic.tl.ai.core.agent.StopReason = Stop reason
com.top_logic.tl.ai.core.agent.StopReason.ABORTED = Aborted
com.top_logic.tl.ai.core.agent.StopReason.ABORTED.tooltip = Loop was interrupted (cancellation).
com.top_logic.tl.ai.core.agent.StopReason.BUDGET_EXHAUSTED = Budget exhausted
com.top_logic.tl.ai.core.agent.StopReason.BUDGET_EXHAUSTED.tooltip = The principal's token budget ran out while the run was working. <p> An orderly stop, not a failure: the run keeps everything it had answered up to the turn that spent the last of the budget, and the surface that started it says why the answer is incomplete. A run whose budget was already spent when it started does not reach the loop at all - it is refused where every run enters, with the same sentence. </p>
com.top_logic.tl.ai.core.agent.StopReason.COMPLETE = Complete
com.top_logic.tl.ai.core.agent.StopReason.COMPLETE.tooltip = LLM finished without requesting tools.
com.top_logic.tl.ai.core.agent.StopReason.CONTEXT_OVERFLOW = Context overflow
com.top_logic.tl.ai.core.agent.StopReason.CONTEXT_OVERFLOW.tooltip = Context window exceeded after compaction retries exhausted.
com.top_logic.tl.ai.core.agent.StopReason.ERROR = Error
com.top_logic.tl.ai.core.agent.StopReason.ERROR.tooltip = Unrecoverable provider error.
com.top_logic.tl.ai.core.agent.StopReason.MAX_TURNS = Maximum turns
com.top_logic.tl.ai.core.agent.StopReason.MAX_TURNS.tooltip = Hit the configured maximum turns limit.
com.top_logic.tl.ai.core.agent.StopReason.REJECTED = Rejected
com.top_logic.tl.ai.core.agent.StopReason.REJECTED.tooltip = Response validator rejected the LLM's response.
com.top_logic.tl.ai.core.agent.StopReason.tooltip = Why the agent loop stopped.
com.top_logic.tl.ai.core.agent.TextPromptContributor = Text prompt contributor
com.top_logic.tl.ai.core.agent.TextPromptContributor.Config.agents = Agents
com.top_logic.tl.ai.core.agent.TextPromptContributor.Config.agents.tooltip = The agents that get the text. <p> The choice offers every agent of the application: the agents of the configuration and the agents created in the running application. Left empty, every agent gets the text, also the ones the application runs for a user, such as the chat's prompt improver. Pick the agents when the text is about the application's data: an agent that only rewrites a draft does not need it, and pays for it on every run. </p>
com.top_logic.tl.ai.core.agent.TextPromptContributor.Config.text = Text
com.top_logic.tl.ai.core.agent.TextPromptContributor.Config.text.tooltip = The text to add to the system prompt, in the language of the account the run acts for. <p> When there is no text in that language, the text in the application's fallback language is used. An unknown placeholder is refused when the configuration is saved. The text may use these placeholders: </p> <ul> <li>{{user}} - the name of the account the run acts for.</li> <li>{{language}} - the UI language of that account, in which the agent answers.</li> <li>{{date}} - today's date in the time zone of that account.</li> <li>{{agent}} - the display name of the agent.</li> <li>{{model}} - the language model the run uses.</li> <li>{{application}} - the name of this application.</li> <li>{{context}} - the facts the page states for the whole conversation, one per line.</li> <li>{{turn_context}} - the explanation of the per-turn context block, for runs that get one.</li> <li>{{preferences}} - the preference text of the account.</li> <li>{{memories}} - what the agent keeps about the account from earlier conversations.</li> <li>{{environment}} - the complete environment block. Without it, the block comes at the end of the prompt.</li> </ul> <p> The text is part of the cached system prompt and is paid for once per conversation. A change takes effect when this service is restarted. </p>
com.top_logic.tl.ai.core.agent.TextPromptContributor.tooltip = Adds a fixed text to the system prompt of the named agents, in the language of the account the run acts for. <p> For what an application wants an agent to know in every run and the model does not show: what the application is, its domain terms, its fixed business rules. The text may use the {{...}} placeholders of an agent's own prompt. </p> <p> A changed text takes effect when this service is restarted, from the next run on. </p>
com.top_logic.tl.ai.core.agent.ToolRef = Tool reference
com.top_logic.tl.ai.core.agent.ToolRef.tooltip = <i>Name reference</i> subtype providing available tool names as options.
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions = TopLogic-Agents and Skills
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions$AgentConfig = Agent configuration
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions$AgentConfig.tooltip = Configuration for a single agent definition. <p> Contains only identity and capabilities. Tuning parameters belong in AgentOverride. </p> <p> This is where an installation renames an agent it was shipped, or describes it in its own words. What is saved here reaches the users when this service is restarted - the restart button in the list of services, or the next start of the application; saving alone changes nothing a running agent does. </p> <p> Saving writes the configuration of every agent as it currently reads, so from then on this installation carries its own copy of them and a later release's wording, prompt or tool list no longer flows through. An installation that wants to change two texts and keep receiving the rest writes the overlay by hand instead, naming only the properties it replaces. </p>
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions$FactConfig = Fact configuration
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions$FactConfig.tooltip = One fact an agent states about the situation a run of it happens in.
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions$SkillConfig = Skill configuration
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions$SkillConfig.tooltip = Configuration for a single skill definition.
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.delegations = Delegations
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.delegations.tooltip = Agent names this agent may delegate to. <p> Per-entry keyed list: application overlays may add or remove individual delegates without restating the full platform list. See <i>name reference</i>. </p>
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.description = Description
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.description.tooltip = Human-readable description of the agent.
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.display-name = Display name
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.display-name.tooltip = What to call this agent in front of a user, in their language. <p> This is the name the chat's agent menu shows, and it is the one field an installation changes to rename an agent it was shipped. Leave it out and the agent is offered under the technical name above, which is its identifier: other configuration, the skills and every conversation already held with this agent refer to that identifier, so it stays as it is even when it reads badly - this is the field to change instead. </p> <p> Takes effect when this service is restarted. </p>
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.facts = Facts
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.facts.tooltip = What this agent tells every model about the situation it runs in. <p> Each fact is TL-Script of no arguments, evaluated in the acting user's context when a run starts, and rendered into the {{context}} section of the environment block. These are the facts that need no page, so they are the same whether the run comes from the chat, from aiAgentChat or from the scheduler; a fact that needs what a page is showing is declared on the chat conversation element instead. </p>
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.infrastructure = Infrastructure
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.infrastructure.tooltip = Whether the application runs this agent <em>for</em> a user instead of letting them talk to it. <p> The chat's prompt improver is such an agent: it rewrites the draft a user is about to send and never answers as a persona. An agent marked here is offered by no menu and is refused wherever a user's own run would name it, whatever the agent access policy grants - see doc/security/tool-access-configuration.md. The product's own call path stays open: it builds its run with SecurityContext.withoutAgentChoice(), which is what says in code that the agent is not the user's choice. </p>
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.mcp-servers = Mcp servers
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.mcp-servers.tooltip = MCP server names available to this agent. <p> Per-entry keyed list: application overlays may add or remove individual servers without restating the full platform list. See <i>name reference</i>. </p>
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.removed-delegations = Removed delegations
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.removed-delegations.tooltip = Delegations to suppress from the effective set. See <i>Removed tools</i>.
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.removed-skills = Removed skills
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.removed-skills.tooltip = Skills to suppress from the effective set. See <i>Removed tools</i>.
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.removed-tools = Removed tools
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.removed-tools.tooltip = Tools to suppress from the effective set, even if a lower config layer (the platform base) declares them. <p> A merge overlay cannot persist a config:operation="remove" marker on <i>Tools</i>: such markers are consumed when the overlay file is read back, so they would not survive the next read-modify-write cycle. Removals are therefore modeled as plain additive entries here and subtracted from <i>Tools</i> when the running definitions are computed. </p>
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.skills = Skills
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.skills.tooltip = Skill names available to this agent. <p> Per-entry keyed list: application overlays may add or remove individual skills without restating the full platform list. See <i>name reference</i>. </p>
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.summary = Summary
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.summary.tooltip = One line saying what this agent is for, in the language of whoever reads it. <p> This is the line under the name in the chat's agent menu, and the second field an installation changes to describe an agent it was shipped in its own words. Leave it out and the agent is offered by its name alone - which is better than showing the description below, because that one is written for a model rather than for a person. </p> <p> Takes effect when this service is restarted. </p>
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.system-prompt = System prompt
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.system-prompt.tooltip = The agent's system prompt text.
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.tools = Tools
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.AgentConfig.tools.tooltip = Qualified tool names available to this agent. <p> Per-entry keyed list: application overlays may add or remove individual tools without restating the full platform list. See <i>name reference</i>. </p>
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.Config.agents = Agents
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.Config.agents.tooltip = Map of config-defined agent definitions, keyed by agent name.
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.Config.skills = Skills
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.Config.skills.tooltip = Map of config-defined skill definitions, keyed by skill name.
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.FactConfig.stable = Stable
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.FactConfig.stable.tooltip = Whether the value holds for the whole conversation. <p> Only a stable fact is rendered into the environment block: that block sits in front of every request of the conversation and must stay byte-identical, or the provider's prompt cache misses on every turn. A fact that changes while the conversation runs is rendered into the per-turn block instead, which travels in the turn itself. </p>
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.FactConfig.value = Value
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.FactConfig.value.tooltip = TL-Script of no arguments computing the value, evaluated in the acting user's context when a run starts.
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.SkillConfig.content = Content
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.SkillConfig.content.tooltip = The actual prompt text for this skill.
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.SkillConfig.description = Description
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.SkillConfig.description.tooltip = Human-readable description shown in the skill catalog.
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.SkillConfig.removed-tools = Removed tools
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.SkillConfig.removed-tools.tooltip = Tools to suppress from this skill's effective set. See <i>Removed tools</i> (<i>TopLogic agent definitions agent configuration</i>).
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.SkillConfig.tools = Tools
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.SkillConfig.tools.tooltip = Qualified tool names delivered when this skill is loaded. <p> Per-entry keyed list: application overlays may add or remove individual tools without restating the full platform list. See <i>name reference</i>. </p>
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions.tooltip = TopLogic-provided agent and skill definitions. <p> These are platform-level definitions shipped with TopLogic. Application-specific agents and skills should be created via the Agent Editor. </p> <p> Application modules may extend a platform agent's keyed lists (tools, skills, delegations, mcp-servers) via the standard configuration overlay mechanism: an overlay only declares the entries it adds or removes, and the platform's remaining entries flow through unchanged. Scalar properties such as description and system-prompt are still atomically replaced when overridden, so overlays should leave them unset unless a true replacement is intended. The two texts a user reads - display-name and summary - are overridden the same way; that is how an installation renames an agent this product ships. </p>
com.top_logic.tl.ai.core.agent.approval.ApprovalMode = Approval mode
com.top_logic.tl.ai.core.agent.approval.ApprovalMode.AUTO_APPROVE = Auto approve
com.top_logic.tl.ai.core.agent.approval.ApprovalMode.AUTO_APPROVE.tooltip = All tool calls are auto-approved without user interaction.
com.top_logic.tl.ai.core.agent.approval.ApprovalMode.MANUAL = Manual
com.top_logic.tl.ai.core.agent.approval.ApprovalMode.MANUAL.tooltip = Each tool call requires manual user approval.
com.top_logic.tl.ai.core.agent.approval.ApprovalMode.tooltip = Controls how tool calls are approved in the human-in-the-loop workflow.
com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome = Approval outcome
com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome.APPROVED = Approved
com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome.APPROVED.tooltip = User approved this single tool call.
com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome.APPROVED_FOR_SESSION = Approved for session
com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome.APPROVED_FOR_SESSION.tooltip = User approved this tool for the remainder of the session.
com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome.REJECTED = Rejected
com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome.REJECTED.tooltip = User rejected the call.
com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome.TIMED_OUT = Timed out
com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome.TIMED_OUT.tooltip = No response arrived within the approval timeout.
com.top_logic.tl.ai.core.agent.approval.ApprovalOutcome.tooltip = Terminal state of an approval flow, carried by <i>approval result</i>.
com.top_logic.tl.ai.core.agent.approval.InteractionTimeoutService = Interaction timeout service
com.top_logic.tl.ai.core.agent.approval.InteractionTimeoutService.Config.approval-timeout-minutes = Approval timeout minutes
com.top_logic.tl.ai.core.agent.approval.InteractionTimeoutService.Config.approval-timeout-minutes.tooltip = How long a tool call waits for the user to approve or reject it, in minutes. <p> When the deadline passes, the approval is treated as refused: the tool call is denied and the agent is told the approval timed out. </p>
com.top_logic.tl.ai.core.agent.approval.InteractionTimeoutService.Config.question-timeout-minutes = Question timeout minutes
com.top_logic.tl.ai.core.agent.approval.InteractionTimeoutService.Config.question-timeout-minutes.tooltip = How long a question the agent asked waits for the user's answer, in minutes. <p> When the deadline passes, the agent is told the question was not answered and asked to write its final answer instead. </p>
com.top_logic.tl.ai.core.agent.approval.InteractionTimeoutService.tooltip = The deadlines a human gets to answer an agent: how long a tool approval and how long a question asked through <i>ask user tool</i> wait for a response. <p> Both are measured from the moment the request is raised, and both are chosen for a person, not for a machine: an end user who is asked to approve a write to shared business data has to be able to walk over to a colleague and come back. An application that wants a different deadline - a kiosk that must not park a session for half an hour, an approval that a supervisor answers only when they get back to their desk - sets it here. </p> <p> What expiry <em>does</em> is not configurable: an expired approval resolves as <i>timed out</i> (the tool call is denied), and an expired question returns a note telling the agent to write its final answer instead. These settings only decide when that happens. </p>
com.top_logic.tl.ai.core.agent.environment.EnvironmentConfig = Environment configuration
com.top_logic.tl.ai.core.agent.environment.EnvironmentConfig.application = Application
com.top_logic.tl.ai.core.agent.environment.EnvironmentConfig.application.tooltip = What to call this application in front of the model. <p> Left empty, the application's own name is used - the one the title bar shows. Set it when the model should be told something the title bar does not say, for example a product name a customer knows the installation by. </p>
com.top_logic.tl.ai.core.agent.environment.EnvironmentConfig.max-preferences-length = Maximum preferences length
com.top_logic.tl.ai.core.agent.environment.EnvironmentConfig.max-preferences-length.tooltip = How long an account's preference text may be, in characters. <p> The text goes into every single request of that account, so its length is paid for on every turn of every conversation. A longer text is refused when it is entered, with a message naming the limit. </p>
com.top_logic.tl.ai.core.agent.environment.EnvironmentConfig.template = Template
com.top_logic.tl.ai.core.agent.environment.EnvironmentConfig.template.tooltip = The text of the environment block, in the language of the account the run acts for. <p> It may use every placeholder a system prompt may use, except {{environment}} - the block cannot contain itself. Left empty, the shipped English default is used, which is the constant EnvironmentTemplate.DEFAULT. </p>
com.top_logic.tl.ai.core.agent.environment.EnvironmentConfig.tooltip = What every agent run is told about the situation it runs in. <p> The harness composes one environment block per run and puts it into the system prompt. This section is where an installation changes its wording, names the application the model is told it is working in, and decides whether the accounts' own preference texts are part of it at all. </p>
com.top_logic.tl.ai.core.agent.environment.EnvironmentConfig.user-preferences = User preferences
com.top_logic.tl.ai.core.agent.environment.EnvironmentConfig.user-preferences.tooltip = Whether the accounts' own preference texts are part of the environment block. <p> Switched off, no preference text reaches any model, whatever the accounts have written. The texts are kept - this is a switch about what is sent, not about what is stored - so switching it back on restores them. </p>
com.top_logic.tl.ai.core.agent.environment.UserMemoryConfig = User memory configuration
com.top_logic.tl.ai.core.agent.environment.UserMemoryConfig.affirmative-words = Affirmative words
com.top_logic.tl.ai.core.agent.environment.UserMemoryConfig.affirmative-words.tooltip = The words with which a user agrees to a question the agent asked. <p> Read together with the question: an agreement counts only when the question the agent asked was itself about remembering something, so a "yes" to some other question grants nothing. Matched like <i>request words</i>. </p>
com.top_logic.tl.ai.core.agent.environment.UserMemoryConfig.enabled = Enabled
com.top_logic.tl.ai.core.agent.environment.UserMemoryConfig.enabled.tooltip = Whether this installation keeps memories about its users at all. <p> Switched off, the remember and recall tools are not offered to any agent and refuse a call that reaches them anyway, and no memory is rendered into any environment block. Existing memories are kept - this is a switch about what is written and sent, not about what is stored - so switching it back on restores them. </p>
com.top_logic.tl.ai.core.agent.environment.UserMemoryConfig.max-length = Maximum memory length
com.top_logic.tl.ai.core.agent.environment.UserMemoryConfig.max-length.tooltip = How long one memory's text may be, in characters. <p> A longer text is refused when the agent tries to write it, with a message naming the limit. A memory is a sentence about the user, not a document. </p>
com.top_logic.tl.ai.core.agent.environment.UserMemoryConfig.max-loaded = Maximum memories loaded
com.top_logic.tl.ai.core.agent.environment.UserMemoryConfig.max-loaded.tooltip = How many of an account's newest memories are read into the environment block. <p> They sit in front of every request of the conversation, so their length is paid for on every turn. What does not fit is still stored and still findable with the recall tool. </p>
com.top_logic.tl.ai.core.agent.environment.UserMemoryConfig.negative-words = Negative words
com.top_logic.tl.ai.core.agent.environment.UserMemoryConfig.negative-words.tooltip = The words with which a user refuses. <p> They win over <i>affirmative words</i>: an answer that carries a negation grants nothing, even when it also carries a word that would otherwise read as agreement - "no, that is fine" is a refusal. Refusing is the safe direction, so the ambiguous case goes that way. </p>
com.top_logic.tl.ai.core.agent.environment.UserMemoryConfig.request-words = Request words
com.top_logic.tl.ai.core.agent.environment.UserMemoryConfig.request-words.tooltip = The words that make a sentence a request to remember something. <p> The agreement check is a check on what the <em>user</em> typed, so these are matched against the user's own words, in whatever language they wrote them. The shipped list covers the two languages this product ships; an installation whose users write a third adds its words here. Matching ignores case and diacritics and is on word boundaries, so "merken" does not fire on "anmerkenswert". </p>
com.top_logic.tl.ai.core.agent.environment.UserMemoryConfig.tooltip = What an agent may remember about the accounts of this installation. <p> A memory is written only with the user's agreement in the very turn it is written - see MemoryConsent - and the newest of them are read back into the environment block of every following conversation. This section is where an administrator switches the whole feature off, caps how much of it reaches a model, and adjusts the words the agreement check looks for. </p>
com.top_logic.tl.ai.core.agent.subagent.SubagentJobStatus = Subagent job status
com.top_logic.tl.ai.core.agent.subagent.SubagentJobStatus.CANCELLED = Cancelled
com.top_logic.tl.ai.core.agent.subagent.SubagentJobStatus.CANCELLED.tooltip = Cooperatively cancelled before completion.
com.top_logic.tl.ai.core.agent.subagent.SubagentJobStatus.DONE = Done
com.top_logic.tl.ai.core.agent.subagent.SubagentJobStatus.DONE.tooltip = Finished successfully; the job's result holds the envelope.
com.top_logic.tl.ai.core.agent.subagent.SubagentJobStatus.FAILED = Failed
com.top_logic.tl.ai.core.agent.subagent.SubagentJobStatus.FAILED.tooltip = Finished with an error; the envelope carries an error summary.
com.top_logic.tl.ai.core.agent.subagent.SubagentJobStatus.QUEUED = Queued
com.top_logic.tl.ai.core.agent.subagent.SubagentJobStatus.QUEUED.tooltip = Registered but not yet started (waiting for a concurrency slot).
com.top_logic.tl.ai.core.agent.subagent.SubagentJobStatus.RUNNING = Running
com.top_logic.tl.ai.core.agent.subagent.SubagentJobStatus.RUNNING.tooltip = Running on a background thread.
com.top_logic.tl.ai.core.agent.subagent.SubagentJobStatus.tooltip = Lifecycle state of an asynchronous subagent job.
com.top_logic.tl.ai.core.citation.CitationKinds = Citation kinds
com.top_logic.tl.ai.core.citation.CitationKinds$KindConfig = Kind configuration
com.top_logic.tl.ai.core.citation.CitationKinds$KindConfig.tooltip = One declared kind.
com.top_logic.tl.ai.core.citation.CitationKinds.Config.kinds = Kinds
com.top_logic.tl.ai.core.citation.CitationKinds.Config.kinds.tooltip = What answers in this application may cite, by kind.
com.top_logic.tl.ai.core.citation.CitationKinds.KindConfig.description = Description
com.top_logic.tl.ai.core.citation.CitationKinds.KindConfig.description.tooltip = One line saying what a source of this kind is, addressed to the model.
com.top_logic.tl.ai.core.citation.CitationKinds.KindConfig.id-source = ID source
com.top_logic.tl.ai.core.citation.CitationKinds.KindConfig.id-source.tooltip = Where the id of such a source comes from, e.g. "the id field an invoice tool returned".
com.top_logic.tl.ai.core.citation.CitationKinds.KindConfig.label = Label
com.top_logic.tl.ai.core.citation.CitationKinds.KindConfig.label.tooltip = What to call this kind in front of a reader, in the reader's language. <p> The name is the model's vocabulary and stays the same word in every language. This is the word the sources rail and the marker popover show instead; without it they show the name. </p>
com.top_logic.tl.ai.core.citation.CitationKinds.KindConfig.passage = Passage
com.top_logic.tl.ai.core.citation.CitationKinds.KindConfig.passage.tooltip = Whether a source of this kind has a sentence to quote. <p> True for text - a web page, a document. False for a structured object such as an invoice, which has fields rather than prose: asking for a verbatim sentence there made the model serialise the object as JSON, which no tool result then matched. </p>
com.top_logic.tl.ai.core.citation.CitationKinds.tooltip = What an answer may cite in this application, declared once. <p> kind used to be a free string on the cite tool, which named no kinds: asked to cite an invoice the model invented "model", nothing could resolve it, and its popover stayed empty. A kind is a vocabulary the application owns - the framework only knows web - so hosts declare theirs here, the framework tells the model what they are, and the validator refuses one it was never told about, exactly as it refuses an invented id. </p>
com.top_logic.tl.ai.core.cookiepool.CookiePoolService = Cookie pool service
com.top_logic.tl.ai.core.cookiepool.CookiePoolService.tooltip = Service that persists and selects <i>cookie pool</i> business objects: named, per-user (or explicitly shared) browser login pools whose storageState JSON is stored <b>encrypted at rest</b>. <p> A cookie pool captures a browser session's authenticated login state (storageState: cookies + origin storage) so a later session - including a background/unattended agent - can start already logged in. The state is as sensitive as a password, so it is always encrypted with the platform installation key before it touches the state Binary, and decrypted only on read, via the platform <i>encryption service</i> (its <i>symmetric encryption</i>). This service never stores or returns the state in plaintext; if no encryption key is installed it refuses the operation rather than falling back to plaintext. </p> <p> <b>Scoping.</b> A pool created by a user defaults to owner = that user, shared = false, and is selectable only by its owner. A pool with shared = true - an explicit choice at save time, or an administrator's edit, never a fallback - is selectable by any session, including an unattended one: the intended shared-login use case. Selection therefore returns the caller's own pools plus shared pools, and that filter is enforced here, on the selection path, which never asks model security: selecting a pool drives a browser with a stored login, it hands the stored bytes to nobody. </p> <p> <b>Reading those bytes is the other question</b>, and the model layer answers it. The shipped default since #227 is the owner plus administrators - the &lt;security-config&gt; of tl-ai-core.binarySecurity.config.xml, which viewDocument asks about through ModelSecurity.canRead. Sharing a login therefore does not make the stored session state readable: a shared pool saved by an unattended run has no owner and is readable by administrators and the system only. </p> <p> <b>Every private pool has an owner.</b> Saving a private pool refuses a null owner instead of storing an owner-less pool. Such a pool would be shared = false with nobody to match, so no caller could ever select it again, while the save reported success; and every owner-less caller would share one bucket per pool name, so one unattended run would silently overwrite another's stored login. Quietly defaulting an owner-less save to shared = true is rejected for the reason that is still why it is not the default: it would turn a credential store into something every session can read, behind the caller's back. </p> <p> <b>Saving a shared pool is the sanctioned opt-in.</b> A save that passes shared = true asks for that scope and gets it: the pool is marked shared, is selectable by every user and every agent session of the installation, and may be saved <em>without</em> an owner - which is what lets an unattended run create the login it needs. The current user, when one is resolvable, is still recorded as the owner of a newly created shared pool, as an audit trail; the pool is just additionally marked shared. The safeguard is that the wide scope must be asked for explicitly and is named in the confirmation, not that it is unreachable. Two rules keep that opt-in from widening anything implicitly: an existing pool is updated in place only if it is <em>already</em> shared - a private pool is never flipped - and a shared save is refused when the caller already owns a private pool of that name, because selection would keep preferring that private pool and hide the shared one from the very caller who created it. </p> <p> Mirrors ScreenshotService in shape: it does <b>not</b> open its own Transaction. The pool-upsert call happens from the browserSaveCookies verb, a DATA_WRITE tool whose transaction is opened and committed by the agent loop's TransactionScope, so the pool is committed with the turn. Programmatic callers (and tests) supply their own transaction. </p>
com.top_logic.tl.ai.core.execution.AgentExecutionStore = Agent execution store
com.top_logic.tl.ai.core.execution.AgentExecutionStore$ExecutionStatus = Execution status
com.top_logic.tl.ai.core.execution.AgentExecutionStore$ExecutionStatus.tooltip = Lifecycle state of an <i>agent execution</i>. Mirrors the <code>tl.ai.execution:ExecutionStatus</code> enumeration.
com.top_logic.tl.ai.core.execution.AgentExecutionStore$InteractionState = Interaction state
com.top_logic.tl.ai.core.execution.AgentExecutionStore$InteractionState.tooltip = Lifecycle state of an <i>interaction request</i>. Mirrors the <code>tl.ai.execution:InteractionState</code> enumeration.
com.top_logic.tl.ai.core.execution.AgentExecutionStore$InteractionType = Interaction type
com.top_logic.tl.ai.core.execution.AgentExecutionStore$InteractionType.tooltip = What a run asked a human for. Mirrors the <code>tl.ai.execution:InteractionType</code> enumeration.
com.top_logic.tl.ai.core.execution.AgentExecutionStore$MemoryKind = Memory kind
com.top_logic.tl.ai.core.execution.AgentExecutionStore$MemoryKind.tooltip = What kind of thing an agent kept about a user.
com.top_logic.tl.ai.core.execution.AgentExecutionStore$SessionKind = Session kind
com.top_logic.tl.ai.core.execution.AgentExecutionStore$SessionKind.tooltip = How an <i>agent session</i> was started. Mirrors the <code>tl.ai.execution:SessionKind</code> enumeration.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.ExecutionStatus.CANCELLED = Cancelled
com.top_logic.tl.ai.core.execution.AgentExecutionStore.ExecutionStatus.CANCELLED.tooltip = The run was cancelled/aborted.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.ExecutionStatus.COMPLETE = Complete
com.top_logic.tl.ai.core.execution.AgentExecutionStore.ExecutionStatus.COMPLETE.tooltip = The run finished normally.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.ExecutionStatus.ERROR = Error
com.top_logic.tl.ai.core.execution.AgentExecutionStore.ExecutionStatus.ERROR.tooltip = The run failed.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.ExecutionStatus.REJECTED = Rejected
com.top_logic.tl.ai.core.execution.AgentExecutionStore.ExecutionStatus.REJECTED.tooltip = The run was rejected by an approval decision.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.ExecutionStatus.RUNNING = Running
com.top_logic.tl.ai.core.execution.AgentExecutionStore.ExecutionStatus.RUNNING.tooltip = The agent loop is currently running (or crashed without reaching a terminal state).
com.top_logic.tl.ai.core.execution.AgentExecutionStore.InteractionState.CANCELLED = Cancelled
com.top_logic.tl.ai.core.execution.AgentExecutionStore.InteractionState.CANCELLED.tooltip = Withdrawn, e.g. because the run was aborted.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.InteractionState.PENDING = Pending
com.top_logic.tl.ai.core.execution.AgentExecutionStore.InteractionState.PENDING.tooltip = Waiting for a response.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.InteractionState.RESOLVED = Resolved
com.top_logic.tl.ai.core.execution.AgentExecutionStore.InteractionState.RESOLVED.tooltip = Answered by the responder.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.InteractionState.TIMED_OUT = Timed out
com.top_logic.tl.ai.core.execution.AgentExecutionStore.InteractionState.TIMED_OUT.tooltip = No response within the allowed time.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.InteractionType.APPROVAL = Approval
com.top_logic.tl.ai.core.execution.AgentExecutionStore.InteractionType.APPROVAL.tooltip = Tool-call approval.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.InteractionType.CHOICE = Choice
com.top_logic.tl.ai.core.execution.AgentExecutionStore.InteractionType.CHOICE.tooltip = Selection from options.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.InteractionType.QUESTION = Question
com.top_logic.tl.ai.core.execution.AgentExecutionStore.InteractionType.QUESTION.tooltip = Free-text question.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.MemoryKind.FACT = Fact
com.top_logic.tl.ai.core.execution.AgentExecutionStore.MemoryKind.FACT.tooltip = Something that is the case about the user or their work.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.MemoryKind.FEEDBACK = Feedback
com.top_logic.tl.ai.core.execution.AgentExecutionStore.MemoryKind.FEEDBACK.tooltip = A judgement the user passed on the work, to be honoured next time.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.MemoryKind.PREFERENCE = Preference
com.top_logic.tl.ai.core.execution.AgentExecutionStore.MemoryKind.PREFERENCE.tooltip = How the user wants to be served.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.SessionKind.BACKGROUND = Background
com.top_logic.tl.ai.core.execution.AgentExecutionStore.SessionKind.BACKGROUND.tooltip = Background job without an interactive surface.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.SessionKind.CHAT = Chat
com.top_logic.tl.ai.core.execution.AgentExecutionStore.SessionKind.CHAT.tooltip = Interactive chat with a person as owner.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.SessionKind.SCHEDULED = Scheduled
com.top_logic.tl.ai.core.execution.AgentExecutionStore.SessionKind.SCHEDULED.tooltip = Run triggered by a scheduler.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.SessionKind.SCRIPT = Script
com.top_logic.tl.ai.core.execution.AgentExecutionStore.SessionKind.SCRIPT.tooltip = Run started from a TL-Script function.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.tooltip = Service that persists and retrieves the <code>tl.ai.execution</code> model: <i>agent session</i>, <i>agent execution</i>, <i>interaction request</i>, <i>agent task</i> and <i>user memory</i>. <p> This is the single write path for agent-run persistence. Any entry point that runs an agent (chat, TL-Script, delegation, background jobs) records its run through this service, so all executions are uniformly queryable regardless of how they were started. </p> <p> All mutating methods run on a dedicated writer thread inside a fresh system interaction with their own <i>transaction</i>. Callers therefore need neither a transaction nor a committable KB context — recording works from any caller context, including read-only ones such as TL-Script evaluation during rendering (whose ImmutableDBContext cannot commit). Queries run on the calling thread and require a bound TopLogic context. </p> <p> <b>Invariant:</b> nothing reachable from a KnowledgeBase UpdateListener (or any other synchronous commit hook) may call a mutating method of this service — the caller blocks on the single writer thread, whose commit synchronously notifies those listeners, so such a call closes a deadlock cycle. </p> <p> Callers do <em>not</em> automatically see their own writes: writer commits happen in a separate session, and a subsession's stable view only advances at sanctioned points. The chat servlet advances the session revision at request begin, which covers all HTTP read-back paths. </p>
com.top_logic.tl.ai.core.execution.layout.RequestCancelCommand = Request cancel command
com.top_logic.tl.ai.core.execution.layout.RequestCancelCommand.tooltip = Requests cancellation of the selected <i>agent execution</i>. <p> Deliberately not a TL-Script transaction writing the run's cancel marker directly: the marker has to be written by the agent execution store, which runs on the store's writer thread and re-reads the run's status at the head revision first, so a run that is concurrently finishing on another cluster node is seen correctly. A plain UI transaction bypasses both. </p> <p> Cancellation is asynchronous. The node executing the run observes the committed marker at its next agent-loop turn; the run then finalizes as cancelled. The message shown here says so rather than pretending the run is already over. </p>
com.top_logic.tl.ai.core.htmlpages.GeneratedHtmlPageService = Generated HTML page service
com.top_logic.tl.ai.core.htmlpages.GeneratedHtmlPageService.tooltip = Service that persists and retrieves <i>generated HTML page</i> entities.
com.top_logic.tl.ai.core.limits.RunLimitsConfig = Run limits configuration
com.top_logic.tl.ai.core.limits.RunLimitsConfig$RoleBudget = Role budget
com.top_logic.tl.ai.core.limits.RunLimitsConfig$RoleBudget.tooltip = What the holders of one role may spend.
com.top_logic.tl.ai.core.limits.RunLimitsConfig.RoleBudget.name.tooltip = The name of the role, as it is held on the security root.
com.top_logic.tl.ai.core.limits.RunLimitsConfig.RoleBudget.tokens = Tokens
com.top_logic.tl.ai.core.limits.RunLimitsConfig.RoleBudget.tokens.tooltip = How many tokens the holders of this role may spend in the window. <p> 0 means unlimited, exactly as it does for <i>token budget per account</i> - which is how a role is exempted from a budget the installation otherwise has. </p>
com.top_logic.tl.ai.core.limits.RunLimitsConfig.budget-window-hours = Budget window (hours)
com.top_logic.tl.ai.core.limits.RunLimitsConfig.budget-window-hours.tooltip = How far back <i>token budget per account</i> counts, in hours. <p> A rolling window, not a calendar day: a run started now is measured against everything the account spent since this many hours ago. 24 hours is the default. </p>
com.top_logic.tl.ai.core.limits.RunLimitsConfig.chat-queue = Chat queue length
com.top_logic.tl.ai.core.limits.RunLimitsConfig.chat-queue.tooltip = How many chat runs may wait for a free worker, once <i>chat worker threads</i> has set a ceiling. <p> Without that ceiling this says nothing: an installation that carries every run as it arrives never has anybody waiting. </p> <p> Three readings: </p> <ul> <li>0, the default - <b>an unbounded queue</b>. A send that finds every worker busy waits for one and its answer arrives late. That is what somebody who asked a question wants; being told to ask again is not. What waits is one small task per send, so a backlog costs the server a fraction of what carrying those runs would.</li> <li>A positive number - a queue of that length. A send that arrives at a full queue is refused with a sentence it can act on.</li> <li>-1 - <b>no queue at all</b>. Every send that finds the workers busy is refused at once. For an installation that would rather say "not now" than have a user wait for an answer whose moment may have passed.</li> </ul>
com.top_logic.tl.ai.core.limits.RunLimitsConfig.chat-workers = Chat worker threads
com.top_logic.tl.ai.core.limits.RunLimitsConfig.chat-workers.tooltip = How many chat runs this installation carries at the same time. <p> 0, the default, means <b>no ceiling</b>: every send gets a worker of its own, which is what this installation did before this section existed. An application serving a thousand users is not served by a figure this product guessed, so the default is "as many as arrive" and the number is the administrator's to name. </p> <p> A positive number is the bound of the thread pool the chat's background runs execute on. A run thread spends nearly all of its life waiting on a provider, so the bound is not about CPU - it is about how much memory, how many open conversations and how much provider spend the installation is willing to have in flight at once. A send that finds every worker busy waits for one rather than being turned away. </p> <p> Read once, when the pool is first used. Changing it needs a restart. </p>
com.top_logic.tl.ai.core.limits.RunLimitsConfig.concurrent-runs-per-account = Concurrent runs per account
com.top_logic.tl.ai.core.limits.RunLimitsConfig.concurrent-runs-per-account.tooltip = How many runs one account may have going at the same time. <p> 0, the default, switches the cap off. A shared installation serving many users wants a small number here - 3 to 5 is a sensible range - so that one account cannot take every worker the pool has, or run up the provider bill on its own. </p> <p> Counted over <em>every</em> entry point - the chat, the scheduler, TL-Script - because they all start their runs through the same place. A delegated sub-agent is part of its parent run and is not counted again. </p>
com.top_logic.tl.ai.core.limits.RunLimitsConfig.role-budgets = Token budgets by role
com.top_logic.tl.ai.core.limits.RunLimitsConfig.role-budgets.tooltip = Token budgets that differ from <i>token budget per account</i> for the holders of a role. <p> An account that holds one of these roles gets the <em>largest</em> budget among them, and an account that holds none gets <i>token budget per account</i>. A role therefore grants headroom and never takes it away, which is the only reading under which holding one more role cannot make an account worse off. </p> <p> Deliberately this small. It is a table of numbers, not a place to express when a budget applies; a rule that needs more than "who gets how much" belongs in the roles themselves. </p>
com.top_logic.tl.ai.core.limits.RunLimitsConfig.token-budget = Token budget per account
com.top_logic.tl.ai.core.limits.RunLimitsConfig.token-budget.tooltip = How many tokens one account may spend within the window. <p> 0, the default, means unlimited. A run of an account that has already spent this much is refused before the first request is sent, and a run that reaches the ceiling while it is going stops between turns with the stop reason BUDGET_EXHAUSTED, keeping whatever it had answered so far. </p> <p> The figure counted is everything the provider was asked to read and write - prompt including its cached part, output and thinking - summed over the account's recorded runs. It therefore needs run recording to be on; an installation that records nothing has nothing to count and this limit does nothing. </p> <p> <b>What it costs.</b> The figure is read from the recorded runs at every run start, which is one pass over the execution rows. That is why it is off unless an administrator asks for it. </p>
com.top_logic.tl.ai.core.limits.RunLimitsConfig.tooltip = How many agent runs this installation carries at once, and how much they may spend. <p> The agent runs inside a shared application server on behalf of many users, against metered provider APIs. With nothing configured here, one account's long analysis is indistinguishable from a hundred: every run gets a thread, and no run is ever told to stop because the account it acts for has spent enough. This is where an administrator puts a ceiling on both. </p> <p> Three independent limits, in the order a run meets them: </p> <ol> <li><i>chat worker threads</i> - how many chat runs the installation carries at once.</li> <li><i>Concurrent runs per account</i> - how many runs one account may have going.</li> <li><i>Token budget per account</i> - how many tokens one account may spend in a rolling window.</li> </ol> <p> <b>All three are off until they are configured.</b> This product runs in applications with a thousand users, and a figure it picked for them would be wrong for most: an installation that upgrades must find exactly what it had, and the administrator who knows the machine and the provider contract is the one who names the numbers. Where a ceiling is set, a run that meets it waits where waiting is the better answer - see <i>chat queue length</i> - and is refused where it is not. </p> <p> Both per-account limits count the <em>principal's</em> runs. A delegated sub-agent is part of the run that delegated it, not a run of its own, and is therefore neither counted against the concurrency cap nor given a budget of its own - it spends its parent's. </p>
com.top_logic.tl.ai.core.mcp.HttpMcpTransport = HTTP mcp transport
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.bearer-token-env-var = Bearer token env var
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.bearer-token-env-var.tooltip = Name of an environment variable holding a bearer token. <p> The variable is read from the server's environment at connect time and its value is sent in the Authorization header using the Bearer scheme. This keeps the secret itself out of the configuration. </p>
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.headers = Headers
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.headers.tooltip = Static HTTP headers sent with every request. <p> Each entry is a header name and the value to send under it, e.g. an API key header the server expects in addition to the bearer token. </p>
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.url = URL
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.url.tooltip = The URL of the MCP server endpoint (e.g., "https://mcp.example.com/mcp").
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.tooltip = <i>Mcp transport configuration</i> creating an MCP HTTP transport (Streamable HTTP). <p> The MCP server runs as an external HTTP service. Authentication is handled via static headers or a bearer token resolved from an environment variable at connect time. </p>
com.top_logic.tl.ai.core.mcp.McpServerRegistry = Mcp server registry
com.top_logic.tl.ai.core.mcp.McpServerRegistry$McpServerConfig = Mcp server configuration
com.top_logic.tl.ai.core.mcp.McpServerRegistry$McpServerConfig.tooltip = Configuration for a single MCP server.
com.top_logic.tl.ai.core.mcp.McpServerRegistry.Config.servers = Servers
com.top_logic.tl.ai.core.mcp.McpServerRegistry.Config.servers.tooltip = Map of named MCP server configurations.
com.top_logic.tl.ai.core.mcp.McpServerRegistry.McpServerConfig.tool-timeout-seconds = Tool timeout seconds
com.top_logic.tl.ai.core.mcp.McpServerRegistry.McpServerConfig.tool-timeout-seconds.tooltip = Timeout in seconds for individual tool calls.
com.top_logic.tl.ai.core.mcp.McpServerRegistry.McpServerConfig.transport = Transport
com.top_logic.tl.ai.core.mcp.McpServerRegistry.McpServerConfig.transport.tooltip = Transport configuration (stdio or HTTP).
com.top_logic.tl.ai.core.mcp.McpServerRegistry.tooltip = Service managing connections to external MCP servers. <p> Configured via XML with named MCP server entries. Each server is connected at startup, and its tools are discovered via the MCP tools/list call. Agents reference servers by name via their mcpServers attribute; <i>agent factory</i> pulls the server's tools into the agent's <i>tool catalog</i>. </p>
com.top_logic.tl.ai.core.mcp.NamedValueConfig = Named value configuration
com.top_logic.tl.ai.core.mcp.NamedValueConfig.tooltip = A named string value for use in config maps. <p> Used for the environment variables and HTTP headers of an MCP transport: one entry carries the name to set and the value to set it to. </p>
com.top_logic.tl.ai.core.mcp.NamedValueConfig.value = Value
com.top_logic.tl.ai.core.mcp.NamedValueConfig.value.tooltip = The value.
com.top_logic.tl.ai.core.mcp.StdioMcpTransport = Stdio mcp transport
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.args = Arguments
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.args.tooltip = Command-line arguments passed to the command. <p> In XML config, provide as comma-separated values: args="-y,@modelcontextprotocol/server-github" </p>
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.command = Command
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.command.tooltip = The command to execute (e.g., "npx" or "python").
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.env = Env
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.Config.env.tooltip = Environment variables for the subprocess. <p> Use this to pass API keys without writing them into the configuration: an entry value of ${env:GITHUB_TOKEN} is resolved from the server's own environment. </p>
com.top_logic.tl.ai.core.mcp.StdioMcpTransport.tooltip = <i>Mcp transport configuration</i> creating an MCP stdio transport (subprocess). <p> The MCP server is started as a child process. Communication happens via stdin/stdout using JSON-RPC. Environment variables can be used to pass API keys or other secrets. </p>
com.top_logic.tl.ai.core.migration.DropOrphanedColumnProcessor = Drop orphaned column processor
com.top_logic.tl.ai.core.migration.DropOrphanedColumnProcessor.Config.column = Column
com.top_logic.tl.ai.core.migration.DropOrphanedColumnProcessor.Config.column.tooltip = Name of the attribute the column stored, as in the schema definition it was removed from. <p> The column name is derived from it the way the schema derives it. </p>
com.top_logic.tl.ai.core.migration.DropOrphanedColumnProcessor.Config.table = Table
com.top_logic.tl.ai.core.migration.DropOrphanedColumnProcessor.Config.table.tooltip = Name of the table type the column belongs to.
com.top_logic.tl.ai.core.migration.DropOrphanedColumnProcessor.tooltip = <i>Migration processor</i> that drops a column the database still has although the persistent schema no longer declares it. <p> <i>Drop column processor</i> finds the column through the persistent schema, and skips it when the schema has no such attribute. The schema stored in the database is replaced by the application's own whenever a migration runs, so an application that dropped an attribute from its schema definition without the migration that drops the column, and then ran any migration, is left with a column that nothing declares and <i>drop column processor</i> cannot reach. This processor asks the database itself whether the column is there. </p> <p> It belongs behind a <i>drop column processor</i> for the same attribute: while the schema still declares the attribute, the column is left to that processor, which also updates the schema. A table or column that does not exist is reported and accepted. </p>
com.top_logic.tl.ai.core.migration.RequireEmptyTableProcessor = Require empty table processor
com.top_logic.tl.ai.core.migration.RequireEmptyTableProcessor.Config.hint = Hint
com.top_logic.tl.ai.core.migration.RequireEmptyTableProcessor.Config.hint.tooltip = Explains how to get the table emptied, appended to the error message.
com.top_logic.tl.ai.core.migration.RequireEmptyTableProcessor.Config.table = Table
com.top_logic.tl.ai.core.migration.RequireEmptyTableProcessor.Config.table.tooltip = Name of the table type that must no longer contain rows.
com.top_logic.tl.ai.core.migration.RequireEmptyTableProcessor.tooltip = <i>Migration processor</i> that fails the migration when a table still holds live rows. <p> Guards a following <i>delete table processor</i>: dropping a table that still has rows destroys those rows without a trace. Placing this processor in front turns that into a refused startup with an actionable message, so the data is still there to be rescued. </p> <p> A non-empty table is reported as a <i>table not empty</i> error rather than as a logged error. That is deliberate, see <i>table not empty</i>. </p> <p> Only the current rows are counted. A versioned KnowledgeBase keeps the historic versions of already deleted objects in the same table, and those must not block the drop. </p> <p> A table that the database does not know at all is reported and accepted: an application that never deployed the module owning the table has nothing to lose. </p>
com.top_logic.tl.ai.core.provider.AuthScheme = Auth scheme
com.top_logic.tl.ai.core.provider.AuthScheme.API_KEY = Api key
com.top_logic.tl.ai.core.provider.AuthScheme.API_KEY.tooltip = Azure <code>OpenAI</code> subscription key, sent as the value of the api-key header. <p>Used when connecting directly to an Azure <code>OpenAI</code> resource endpoint that requires the subscription key in the api-key header rather than an Authorization bearer token.</p>
com.top_logic.tl.ai.core.provider.AuthScheme.BEARER = Bearer
com.top_logic.tl.ai.core.provider.AuthScheme.BEARER.tooltip = Standard OAuth2 bearer token, sent as the Authorization header with the Bearer scheme. <p>Used by <code>OpenAI</code>, Mistral, <code>xAI</code>, and Azure-compatible gateways such as Nexus that accept bearer tokens in the standard header.</p>
com.top_logic.tl.ai.core.provider.AuthScheme.tooltip = HTTP authentication scheme used when sending requests to an LLM provider endpoint. <p><i>Bearer</i> covers the standard <code>OpenAI</code> style: the key follows the Bearer scheme in the Authorization header. <i>Api key</i> covers the Azure <code>OpenAI</code> convention of sending the key in a plain api-key header without a scheme prefix.</p>
com.top_logic.tl.ai.core.provider.EffortLevels$Kind = Kind
com.top_logic.tl.ai.core.provider.EffortLevels$Kind.tooltip = Which of the two assignment fields a level belongs in.
com.top_logic.tl.ai.core.provider.EffortLevels.Kind.NONE = None
com.top_logic.tl.ai.core.provider.EffortLevels.Kind.NONE.tooltip = The model offers no effort setting.
com.top_logic.tl.ai.core.provider.EffortLevels.Kind.REASONING_EFFORT = Reasoning effort
com.top_logic.tl.ai.core.provider.EffortLevels.Kind.REASONING_EFFORT.tooltip = The model spends effort on reasoning before it answers, as OpenAI and xAI models do.
com.top_logic.tl.ai.core.provider.EffortLevels.Kind.THINKING_EFFORT = Thinking effort
com.top_logic.tl.ai.core.provider.EffortLevels.Kind.THINKING_EFFORT.tooltip = The model spends effort on thinking before it answers, as Anthropic models do.
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.base-url = Base URL
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.base-url.tooltip = The base URL of the provider API endpoint.
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.catalog-provider-id = Catalog provider ID
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.catalog-provider-id.tooltip = The provider ID used to look up model metadata from the remote catalog (models.dev). <p> Each provider supplies a sensible default matching its models.dev entry. Leave empty for providers that have no remote catalog (e.g. local servers) — their models must be defined in the model catalog manually. </p>
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.connect-timeout = Connect timeout
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.connect-timeout.tooltip = TCP connection timeout in seconds. <p> Controls how long the HTTP client waits to establish a TCP connection to the provider endpoint before giving up. </p>
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.custom-headers = Custom headers
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.custom-headers.tooltip = Extra HTTP headers sent on every request to this provider. <p> Useful for custom authentication schemes, routing headers, or provider-specific metadata that must accompany each API call. </p>
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.models = Models
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.models.tooltip = Model names enabled for this provider. <p> Only models listed here are available for use. If empty, no models are exposed from this provider. </p>
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.request-timeout = Request timeout
com.top_logic.tl.ai.core.provider.LLMProviderConfig.Config.request-timeout.tooltip = Total streaming request timeout in seconds. <p> Maximum wall-clock time allowed for a complete streaming request, including the time spent receiving streamed tokens. A generous default accommodates long-running agent responses. </p>
com.top_logic.tl.ai.core.provider.LLMService = LLM service
com.top_logic.tl.ai.core.provider.LLMService$AgentExecutionConfig = Agent execution configuration
com.top_logic.tl.ai.core.provider.LLMService$AgentExecutionConfig.tooltip = Agent execution configuration: chat entry point, default model, and per-agent overrides. <p> Agent definitions (identity, system prompt, tools, delegations) are managed by <i>TopLogic-Agents and Skills</i> and the knowledge base. This section controls the operational side: which agent serves as the chat entry point, which model to use by default, and per-agent overrides for model selection and execution parameters. </p>
com.top_logic.tl.ai.core.provider.LLMService$AgentOverride = Agent override
com.top_logic.tl.ai.core.provider.LLMService$AgentOverride.tooltip = Per-agent override for model selection and execution parameters. <p> Each entry overrides the default model for a specific agent and optionally configures execution parameters (max turns, timeouts, tool choice) and model-specific settings (temperature, reasoning effort). Parameters left null inherit defaults from the model catalog or system defaults. </p>
com.top_logic.tl.ai.core.provider.LLMService$ModelCatalogConfig = Model catalog configuration
com.top_logic.tl.ai.core.provider.LLMService$ModelCatalogConfig.tooltip = Configuration for the model metadata catalog. <p> Provides read-only metadata about each model's capabilities (tool calling, reasoning, temperature support) and limits (context window, max output tokens). The catalog is fetched from <a href="https://models.dev">models.dev</a> on startup for all models configured in the provider section. Models not found in the remote catalog (e.g. locally hosted models) can be defined manually in the model overrides. </p>
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.agent-overrides = Agent overrides
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.agent-overrides.tooltip = Per-agent overrides. Agents not listed here use the default model. Applies to all agents regardless of source (config-defined or KB).
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.chat-entry-point = Chat entry point
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.chat-entry-point.tooltip = The agent that serves as the main entry point when a user opens a new chat session. <p> This agent receives the initial user message and orchestrates the conversation. It may delegate to other agents via its delegations list. </p>
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.default-model = Default model
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.default-model.tooltip = The fallback model used by agents that have no explicit override in <i>Agent overrides</i>. <p> To assign a specific model (and optional tuning parameters) to an individual agent, add an entry to the agent overrides map instead. </p>
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.default-provider = Default provider
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.default-provider.tooltip = The provider serving the default model, or empty when only one provider exposes it. <p> Applies to every agent that has no provider of its own. Left empty for a default model exposed by two providers, the service refuses to start rather than pick one by configuration order. </p>
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.owner = Owner
com.top_logic.tl.ai.core.provider.LLMService.AgentExecutionConfig.owner.tooltip = The enclosing service <i>configuration</i>, used to resolve configured models from its provider section within the same edit form.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.context-window = Context window
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.context-window.tooltip = Context window size override, or null for catalog default.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-retries = Maximum retries
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-retries.tooltip = Maximum retries on transient errors, or null for default.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-tokens = Maximum tokens
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-tokens.tooltip = Maximum output tokens per LLM call, or null for catalog default.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-tool-result-chars = Maximum tool result chars
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-tool-result-chars.tooltip = Maximum characters per tool result, or null for default.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-turns = Maximum turns
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.max-turns.tooltip = Maximum agent loop turns, or null for default.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.model = Model
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.model.tooltip = The model to use for this agent.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.provider = Provider
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.provider.tooltip = The provider serving this agent's model, or empty when only one provider exposes it. <p> Name a provider when two provider entries expose the same model - separate accounts, or an official endpoint next to a gateway. Left empty for a model exposed twice, the service refuses to start. An agent inheriting the default model inherits the default provider. </p>
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.reasoning-effort = Reasoning effort
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.reasoning-effort.tooltip = <code>OpenAI</code>/<code>xAI</code> reasoning effort (low/medium/high), or null.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.reasoning-summary = Reasoning summary
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.reasoning-summary.tooltip = <code>OpenAI</code>/<code>xAI</code> reasoning summary (auto/detailed), or null.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.temperature = Temperature
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.temperature.tooltip = Sampling temperature, or null for default.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.thinking-effort = Thinking effort
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.thinking-effort.tooltip = Anthropic thinking effort (low/medium/high/max), or null.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.timeout-seconds = Timeout seconds
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.timeout-seconds.tooltip = Request timeout in seconds, or null for default.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.tool-choice = Tool choice
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.tool-choice.tooltip = Tool choice (AUTO/REQUIRED/NONE), or null for provider default.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.top-k = Top-K
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.top-k.tooltip = Anthropic top-k parameter, or null.
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.top-p = Top-P
com.top_logic.tl.ai.core.provider.LLMService.AgentOverride.top-p.tooltip = Top-p sampling parameter, or null for default.
com.top_logic.tl.ai.core.provider.LLMService.Config.agent-execution = Agent execution
com.top_logic.tl.ai.core.provider.LLMService.Config.agent-execution.tooltip = Agent execution configuration: chat entry point, default model, and per-agent overrides for model selection and execution parameters.
com.top_logic.tl.ai.core.provider.LLMService.Config.environment = Environment
com.top_logic.tl.ai.core.provider.LLMService.Config.environment.tooltip = What every agent run is told about the situation it runs in: the wording of the environment block, the application name the model is given, and whether the accounts' own preference texts are part of it.
com.top_logic.tl.ai.core.provider.LLMService.Config.failover = Failover
com.top_logic.tl.ai.core.provider.LLMService.Config.failover.tooltip = Where a run goes when the model it was configured with cannot answer, and how long this installation remembers that a model could not. <p> Empty by default, and an empty section changes nothing. </p>
com.top_logic.tl.ai.core.provider.LLMService.Config.model-catalog = Model catalog
com.top_logic.tl.ai.core.provider.LLMService.Config.model-catalog.tooltip = Model metadata catalog describing each model's capabilities and limits. <p> Populated automatically from the remote <a href="https://models.dev">models.dev</a> catalog on startup. Manual overrides can be added for models not listed in the remote catalog (e.g. local or custom-hosted models). </p>
com.top_logic.tl.ai.core.provider.LLMService.Config.object-ids = Object ids
com.top_logic.tl.ai.core.provider.LLMService.Config.object-ids.tooltip = What this application knows about the identifiers a model passes to a tool: the codes its own users speak, and what to tell a model that passed one instead of an object id.
com.top_logic.tl.ai.core.provider.LLMService.Config.prompt-contributors = Prompt contributors
com.top_logic.tl.ai.core.provider.LLMService.Config.prompt-contributors.tooltip = Standing instructions this installation adds to the system prompt of every agent run. <p> For house rules that belong to the application rather than to one agent, so that they do not have to be written into every agent and do not have to be repeated on every turn. Each entry is asked once per run, in the order they are listed here, and what it answers is part of the cached prompt - so it must say the same thing throughout a conversation. </p>
com.top_logic.tl.ai.core.provider.LLMService.Config.providers = Providers
com.top_logic.tl.ai.core.provider.LLMService.Config.providers.tooltip = The configured LLM providers, keyed by provider name. <p> Each entry carries provider-specific properties. </p>
com.top_logic.tl.ai.core.provider.LLMService.Config.run-limits = Run limits
com.top_logic.tl.ai.core.provider.LLMService.Config.run-limits.tooltip = How many agent runs this installation carries at once, and how much one account may spend.
com.top_logic.tl.ai.core.provider.LLMService.Config.security-context = Security context
com.top_logic.tl.ai.core.provider.LLMService.Config.security-context.tooltip = What decides, for every agent run, which tool calls need a person to confirm them. <p> The shipped default asks the tool's mode: a read runs, everything that changes something is confirmed. An application whose answer depends on what is being changed - overwriting an empty section is not overwriting what a colleague wrote - names its own implementation here. </p>
com.top_logic.tl.ai.core.provider.LLMService.Config.user-memory = User memory
com.top_logic.tl.ai.core.provider.LLMService.Config.user-memory.tooltip = What an agent may remember about the accounts of this installation: whether it may at all, how much of it reaches a model, and the words the agreement check looks for.
com.top_logic.tl.ai.core.provider.LLMService.ModelCatalogConfig.catalog-url = Catalog URL
com.top_logic.tl.ai.core.provider.LLMService.ModelCatalogConfig.catalog-url.tooltip = The URL of the remote model catalog.
com.top_logic.tl.ai.core.provider.LLMService.ModelCatalogConfig.llm-configuration = Model metadata
com.top_logic.tl.ai.core.provider.LLMService.ModelCatalogConfig.llm-configuration.tooltip = Per-model metadata (limits, capabilities). <p> Populated automatically from the remote catalog on startup. Read-only — do not modify manually. </p>
com.top_logic.tl.ai.core.provider.LLMService.ModelCatalogConfig.model-overrides = Model overrides
com.top_logic.tl.ai.core.provider.LLMService.ModelCatalogConfig.model-overrides.tooltip = Manually defined model metadata for models not in the remote catalog. <p> Use this for local models or <code>OpenAI</code>-compatible endpoints whose models are not listed on models.dev. Entries here take precedence over catalog entries with the same name. </p>
com.top_logic.tl.ai.core.provider.LLMService.tooltip = Central service for LLM provider management, model resolution, and agent execution configuration. <p> The service configuration is organized into three sections: </p> <ol> <li><b>Providers</b> — connection details for each LLM provider (API keys, base URLs, model allowlists). Each provider entry defines how to reach a specific LLM API endpoint and which models are enabled.</li> <li><b>Agent Execution</b> — configures the chat entry-point agent, the default model used by all agents, and optional per-agent overrides for model selection and execution parameters (temperature, max tokens, timeouts, reasoning effort, etc.).</li> <li><b>Model Catalog</b> — read-only metadata describing each model's capabilities (tool calling, reasoning, temperature support) and limits (context window, max output tokens). Populated automatically from the <a href="https://models.dev">models.dev</a> remote catalog on startup, with optional manual overrides for local or unlisted models.</li> </ol>
com.top_logic.tl.ai.core.provider.ProviderException$Kind = Kind
com.top_logic.tl.ai.core.provider.ProviderException$Kind.tooltip = Classification of the error.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.AUTHENTICATION = Authentication
com.top_logic.tl.ai.core.provider.ProviderException.Kind.AUTHENTICATION.tooltip = 401/403 — invalid or expired API key.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.BILLING = Billing
com.top_logic.tl.ai.core.provider.ProviderException.Kind.BILLING.tooltip = 402 — billing or payment issue. Terminal, not retryable.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.CONTEXT_WINDOW_EXCEEDED = Context window exceeded
com.top_logic.tl.ai.core.provider.ProviderException.Kind.CONTEXT_WINDOW_EXCEEDED.tooltip = Request too large for the model's context window.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.INVALID_REQUEST = Invalid request
com.top_logic.tl.ai.core.provider.ProviderException.Kind.INVALID_REQUEST.tooltip = 400 — malformed request.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.OVERLOADED = Overloaded
com.top_logic.tl.ai.core.provider.ProviderException.Kind.OVERLOADED.tooltip = 529 or 5xx — provider overloaded or temporarily unavailable.
com.top_logic.tl.ai.core.provider.ProviderException.Kind.RATE_LIMITED = Rate limited
com.top_logic.tl.ai.core.provider.ProviderException.Kind.RATE_LIMITED.tooltip = 429 — rate limited. Check retryAfter().
com.top_logic.tl.ai.core.provider.ProviderException.Kind.UNKNOWN = Unknown
com.top_logic.tl.ai.core.provider.ProviderException.Kind.UNKNOWN.tooltip = Unclassified error.
com.top_logic.tl.ai.core.provider.ResponseFormat$Kind = Kind
com.top_logic.tl.ai.core.provider.ResponseFormat$Kind.tooltip = The shape of a <i>response format</i>.
com.top_logic.tl.ai.core.provider.ResponseFormat.Kind.JSON = JSON
com.top_logic.tl.ai.core.provider.ResponseFormat.Kind.JSON.tooltip = Some JSON object, with no schema saying which.
com.top_logic.tl.ai.core.provider.ResponseFormat.Kind.JSON_SCHEMA = JSON schema
com.top_logic.tl.ai.core.provider.ResponseFormat.Kind.JSON_SCHEMA.tooltip = A JSON object satisfying the schema this format carries.
com.top_logic.tl.ai.core.provider.ResponseFormat.Kind.TEXT = Text
com.top_logic.tl.ai.core.provider.ResponseFormat.Kind.TEXT.tooltip = Plain text response (default).
com.top_logic.tl.ai.core.provider.ToolChoice = Tool choice
com.top_logic.tl.ai.core.provider.ToolChoice.AUTO = Auto
com.top_logic.tl.ai.core.provider.ToolChoice.AUTO.tooltip = The LLM decides whether to call a tool (default).
com.top_logic.tl.ai.core.provider.ToolChoice.NONE = None
com.top_logic.tl.ai.core.provider.ToolChoice.NONE.tooltip = The LLM must not call any tool.
com.top_logic.tl.ai.core.provider.ToolChoice.REQUIRED = Required
com.top_logic.tl.ai.core.provider.ToolChoice.REQUIRED.tooltip = The LLM must call at least one tool.
com.top_logic.tl.ai.core.provider.ToolChoice.tooltip = Controls how the LLM selects tools during a request.
com.top_logic.tl.ai.core.provider.anthropic.AnthropicProviderConfig = Anthropic
com.top_logic.tl.ai.core.provider.anthropic.AnthropicProviderConfig.Config.api-key = Api key
com.top_logic.tl.ai.core.provider.anthropic.AnthropicProviderConfig.Config.api-key.tooltip = The API key for Anthropic authentication.
com.top_logic.tl.ai.core.provider.anthropic.AnthropicProviderConfig.Config.version = Version
