com.top_logic.ai.service.tools.help.TLScriptReferenceTool.tooltip = Werkzeug zum Auflisten von TLScript-Funktionen und zum Abrufen der Dokumentation. <p> Dieses Tool erm�glicht den Zugriff auf die TLScript-Funktionsregistrierung, so dass KI-Agenten verf�gbare Funktionen entdecken und detaillierte Dokumentationen zu ihnen abrufen k�nnen. Es verwendet den <i>Search Builder</i>, um auf die Metadaten der Funktionen zuzugreifen. </p>
com.top_logic.ai.service.tools.model.AnnotationDefinitionExplorerTool = Explorer-Tool f�r Anmerkungsdefinitionen
com.top_logic.ai.service.tools.model.AnnotationDefinitionExplorerTool.tooltip = Werkzeug zur Erkundung von Schemata f�r Anmerkungsdefinitionen. <p> Dieses Tool erm�glicht es KI-Agenten, Anmerkungsdefinitionen zu verstehen (was konfiguriert werden KANN), nicht Anmerkungsinstanzen (was konfiguriert ist). Es bietet Schemainformationen, einschlie�lich Metadaten zu Eigenschaften, Typen, Einschr�nkungen und Standardeinstellungen. </p> <h3>Beispiel f�r die Verwendung:</h3> <pre> // Untersuchen einer bestimmten Anmerkungsdefinition describeAnnotation("com.top_logic.model.annotate.Visibility") // Untersuchen einer Formulardefinitionsanmerkung describeAnnotation("com.top_logic.model.form.definition.FormDefinition") </pre> <h3>Integration</h3>: <p> Um dieses Tool mit einem KI-Agenten zu verwenden, instanziieren Sie es und f�gen Sie es zu den Tools des Agenten hinzu: </p> <pre> AnnotationDefinitionExplorerTool definitionTool = new AnnotationDefinitionExplorerTool(); ModelExplorer explorer = AgenticServices.agentBuilder(ModelExplorer.class) .chatModel(explorationModel) .tools(browserTool, instanceTool, analysisTool, searchTool, annotationTool, definitionTool) .build(); </pre>
