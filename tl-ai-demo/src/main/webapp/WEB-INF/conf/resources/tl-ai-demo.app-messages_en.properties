tl.title = TL AI Demo

# The declared-types pair of the security test bed (issue #258). Described here rather than in
# tl-ai-core's bundle, because they belong to the secdemo aspect and not to the framework.
admin.ai.tool.secdemo-projects.listProjects = Lists the projects the account may read, and declares the type pm:Project, so an account without read access to it is refused before the tool runs.
admin.ai.tool.secdemo-projects.listProjectsUndeclared = Lists the projects the account may read, declaring no type, so an account without read access to pm:Project gets an empty list instead of a refusal.
