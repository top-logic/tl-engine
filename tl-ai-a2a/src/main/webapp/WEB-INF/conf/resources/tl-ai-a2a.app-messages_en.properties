admin.ai.tool.a2a.askAgent = Asks a remote agent of another application over the A2A protocol and waits for its answer.
admin.ai.tool.a2a.fetchArtifact = Reads an A2A artifact by its reference, whole or one section of it.
admin.ai.tool.a2a.getAgentTask = Waits for a task started at a remote agent that is still working and returns its answer.
admin.ai.tool.a2a.listAgentConversations = Lists the conversations this conversation has open with remote agents.
admin.ai.tool.a2a.listAgents = Lists the remote agents of other applications this application may ask over the A2A protocol.
admin.ai.tool.a2a.replyAgent = Answers a question a remote agent asked and waits for its next answer.
