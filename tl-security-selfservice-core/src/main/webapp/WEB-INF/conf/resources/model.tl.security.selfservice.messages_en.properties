model.tl.security.selfservice = Self Service
model.tl.security.selfservice.Invitation = Invitation
model.tl.security.selfservice.Invitation.accepted = Accepted
model.tl.security.selfservice.Invitation.accepted.tooltip = When the invited person created the account from the invitation. Empty as long as the invitation has not been accepted.
model.tl.security.selfservice.Invitation.account = Account
model.tl.security.selfservice.Invitation.account.tooltip = The account created from the invitation.
model.tl.security.selfservice.Invitation.createCallback = Creation callback
model.tl.security.selfservice.Invitation.createCallback.tooltip = The TL-Script function that is called when the invited person has successfully set up access.\n\nThe function expects the newly created user as the only argument.\n\nEither null or an internationalizable value is expected as the return value. A return value other than null is interpreted as an error and the creation of the account is aborted.
model.tl.security.selfservice.Invitation.createdAt = Created
model.tl.security.selfservice.Invitation.createdAt.tooltip = When the invitation was created.
model.tl.security.selfservice.Invitation.createdBy = Created by
model.tl.security.selfservice.Invitation.createdBy.tooltip = The account that created the invitation.
model.tl.security.selfservice.Invitation.email = E-mail address
model.tl.security.selfservice.Invitation.email.tooltip = The e-mail address of the person to be invited. The e-mail address also serves as the user name.
model.tl.security.selfservice.Invitation.expires = Valid until
model.tl.security.selfservice.Invitation.expires.tooltip = Until when the invitation can be accepted. Sending the invitation again renews the link and the validity.
model.tl.security.selfservice.Invitation.id = ID
model.tl.security.selfservice.Invitation.id.tooltip = Unique ID of the invitation. The ID is part of the invitation link sent to the invitee via e-mail.
model.tl.security.selfservice.Invitation.mfaRequirement = MFA requirement
model.tl.security.selfservice.Invitation.mfaRequirement.tooltip = Whether the new user is required to use multi-factor authentication.
model.tl.security.selfservice.Invitation.state = State
model.tl.security.selfservice.Invitation.state.tooltip = Whether the invitation is open, expired or accepted.
model.tl.security.selfservice.Invitation.tooltip = An invitation for a person to set up their own access to the application.
model.tl.security.selfservice.InvitationState = Invitation state
model.tl.security.selfservice.InvitationState.ACCEPTED = Accepted
model.tl.security.selfservice.InvitationState.ACCEPTED.tooltip = The invited person has created the account. The invitation is kept as a record and cannot be used again.
model.tl.security.selfservice.InvitationState.EXPIRED = Expired
model.tl.security.selfservice.InvitationState.EXPIRED.tooltip = The validity of the invitation has passed. It can no longer be accepted until it is sent again.
model.tl.security.selfservice.InvitationState.OPEN = Open
model.tl.security.selfservice.InvitationState.OPEN.tooltip = The invitation can be accepted.
model.tl.security.selfservice.InvitationState.tooltip = The state of an invitation.
model.tl.security.selfservice.tooltip = Module with the type for inviting a person to set up their own access to the application.
