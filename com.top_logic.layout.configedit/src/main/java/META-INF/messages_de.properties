com.top_logic.layout.configedit.ConfigControlService.AnnotationControlMapping.impl.tooltip = Der <i>Annotations-Kontroll-Anbieter</i>, der die Kontrolle für eine Eigenschaft mit der Annotation erstellt. <p> Der Anbieter muss den Annotationstyp dieses Eintrags akzeptieren. </p>
com.top_logic.layout.configedit.ConfigControlService.Config.annotation-controls = Annotations-Kontrollen
com.top_logic.layout.configedit.ConfigControlService.Config.annotation-controls.tooltip = Steuerelemente, die durch eine Annotation der bearbeiteten Eigenschaft ausgewählt werden. <p> Eine Eigenschaft, die eine der konfigurierten Annotationen trägt – entweder auf der Eigenschaft selbst oder auf ihrem Werttyp –, wird mit dem Steuerelement bearbeitet, das <i>der Annotations-Konfigurations-Annotations-Steuerelement-Anbieter</i> erstellt. Trägt eine Eigenschaft mehrere der konfigurierten Annotationen, so hat der erste Eintrag in dieser Liste Vorrang, dessen Annotation vorhanden ist und dessen Anbieter eine Berechnung durchführt. </p> <p> Ein hier ausgewähltes Steuerelement hat Vorrang vor jeder anderen Abbildung dieses Dienstes und vor einer Auswahl. Nur eine verschlüsselte Eigenschaft wird niemals mit einem hier ausgewählten Steuerelement bearbeitet. Eine Berechnung lehnt eine Eigenschaft ab, deren Wert sie nicht in der Form bearbeiten kann, die ihr die anderen Regeln vorgeben – ein Textfeld lehnt beispielsweise eine Eigenschaft ab, die durch Auswahl bearbeitet wird – und überlässt die Bearbeitung diesen Regeln. </p>
com.top_logic.layout.configedit.ConfigControlService.Config.formats = Formate
com.top_logic.layout.configedit.ConfigControlService.Config.formats.tooltip = Zuordnungen von Wertanbieter zu Kontroll-Anbieter, indiziert nach der Klasse des Wertanbieters der Eigenschaft. <p> Getrennt von <i>Anbieter</i>: Zwei Eigenschaften desselben Java-Typs (etwa Date) können verschiedene Wertanbieter tragen — ein reines Datum und eine Tageszeit sind beide ein Date —, so dass nur die Klasse des Wertanbieters sie unterscheiden kann, nicht der Java-Typ. Gesucht wird zuerst nach der konkreten Klasse des Wertanbieters, danach entlang seiner Oberklassen; eine für eine Basisklasse eingetragene Zuordnung gilt damit auch für deren Spezialisierungen. </p>
com.top_logic.layout.configedit.ConfigControlService.Config.providers = Anbieter
com.top_logic.layout.configedit.ConfigControlService.Config.providers.tooltip = Zuordnungen von Werttyp zu Anbieter, indiziert nach dem Java-Typ des Eigenschaftswerts.
com.top_logic.layout.configedit.ConfigControlService.FormatMapping.impl = Implementierung
com.top_logic.layout.configedit.ConfigControlService.FormatMapping.impl.tooltip = Der Kontroll-Anbieter, der für eine von dieser Zuordnung beanspruchte Eigenschaft verwendet wird.
com.top_logic.layout.configedit.ConfigControlService.FormatMapping.provider = Wertanbieter
com.top_logic.layout.configedit.ConfigControlService.FormatMapping.provider.tooltip = Die Klasse des <i>Konfigurations-Wertanbieters</i> (oder eine ihrer Oberklassen), von der der Wertanbieter einer Eigenschaft eine Instanz sein muss, damit diese Zuordnung greift.
com.top_logic.layout.configedit.ConfigControlService.ProviderMapping.impl = Implementierung
com.top_logic.layout.configedit.ConfigControlService.ProviderMapping.impl.tooltip = Der Kontroll-Anbieter, der für Eigenschaften dieses Werttyps verwendet wird.
com.top_logic.layout.configedit.ConfigControlService.ProviderMapping.type = Typ
com.top_logic.layout.configedit.ConfigControlService.ProviderMapping.type.tooltip = Der Java-Typ des Eigenschaftswerts, für den diese Zuordnung gilt.
com.top_logic.layout.configedit.ConfigControlService.tooltip = Dienst zur Auflösung des Eingabefelds für eine Konfigurationseigenschaft. <p> Eine Eigenschaft, deren Wert in ein einzelnes Widget passt, wird direkt bearbeitet: entsprechend ihrem Java-Typ (String, boolean, ein numerischer Typ oder Date), durch Auswahl aus einer festen Menge von Optionen (eine Optionsliste oder eine Enumeration) oder als Text über eine Berechnung, die den Wert in Text umwandeln und wieder zurückkonvertieren kann. Ob ein Format dazu in der Lage ist, wird für den Wert entschieden, den die Eigenschaft aktuell enthält: Ein Format, das den Wert nicht akzeptiert – ein reines Parsing-Format akzeptiert gar nichts –, lässt die Eigenschaft ohne Textdarstellung. Eine Eigenschaft, die in keine dieser Kategorien passt, wird sofort abgelehnt und nicht stillschweigend von einem Steuerelement dargestellt, das ihren Wert falsch verarbeiten würde. Eine solche Eigenschaft (eine Struktur, eine Auflistung, eine <i>komplexe</i> Eigenschaft mit nur einer Wertbindung und ohne Format oder eine, deren Format ihren Wert nicht ausdrücken kann) wird von einem speziellen verschachtelten Editor oder Typauswähler dargestellt, bevor dieser Dienst überhaupt angefragt wird. </p> <p> Das Widget für eine Eigenschaft wird in dieser Reihenfolge aufgelöst: </p> <ol> <li>Eine verschlüsselte Eigenschaft erhält immer das Passwortfeld, bewusst noch vor jedem anderen Schritt.</li> <li>Die Abbildung von einer Annotation der Eigenschaft oder ihres Werttyps zu einem Steuerelement dieses Dienstes (<i>Annotationssteuerelemente</i>) – eine Annotation gibt an, was der Wert bedeutet (z. B., dass sein Text sich über mehrere Zeilen erstreckt), und die Abbildung entscheidet, wie ein solcher Wert bearbeitet wird. Die erste konfigurierte Annotation, die die Eigenschaft trägt und deren Berechnung ein Steuerelement erstellt, hat Vorrang; eine Berechnung kann eine Eigenschaft ablehnen, deren Wert sie in der Form, die ihr die verbleibenden Regeln vorgeben, nicht bearbeiten kann, wodurch die Eigenschaft diesen Regeln unterliegt.</li> <li>Eine Eigenschaft, die durch Auswahl aus einer festen Reihe von Optionen bearbeitet wird, erhält ein durchsuchbares Dropdown-Menü – wie es die modellbasierten Formulare verwenden –, unabhängig davon, ob sie eine oder mehrere Optionen umfasst.</li> <li>Die in diesem Dienst (<i>Providers</i>) konfigurierte Abbildung von Werttypen zu Anbietern.</li> <li>Die in diesem Dienst (<i>Formate</i>) konfigurierte Abbildung von Wert-Anbieter zu Anbieter – beansprucht eine Eigenschaft, deren Wertanbieter (oder eine ihrer Oberklassen) abbildet, vor dem generischen Format-Textfeld. Dadurch erhält ein als Uhrzeit formatiertes Datum einen Zeitwähler anstelle von reinem Text: Die oben genannte Abbildung nach Java-Typen kann es nicht von einem reinen Datum unterscheiden, die eigene Klasse der Berechnung hingegen schon.</li> <li>Der integrierte Fallback: das direkte Widget für den Java-Typ der Eigenschaft – ein „Date“-Wert erhält eine Auswahl für ein Datum mit Uhrzeit, in der Form, in der sein Wert gespeichert ist – oder andernfalls Text, der über den eigenen „ConfigurationValueProvider“ der Eigenschaft geparst und formatiert wird.</li> </ol> <p> Die Annotations-Abbildung (<i>Annotation Controls</i>) wählt ein Steuerelement aus, jedoch nicht die Form des Werts, den es bearbeitet: Eine Annotation sagt etwas über den Wert aus, nicht darüber, dass der Wert in einer anderen Form vorliegt als der, in der die Eigenschaft ansonsten bearbeitet würde. Eine Wertabbildung hingegen weist der Eigenschaft ein Steuerelement zu, das ihren typisierten Wert bearbeitet (eine internationalisierte Zeichenkette in einem sprachspezifischen Editor, eine Farbe in einem Farbwähler). Ein durch eine Annotation ausgewähltes Steuerelement bearbeitet den Wert daher in der Form, die ihm die übrigen Regeln vorgeben: als typisierten Wert einer Eigenschaft, deren Java-Typ von einem der integrierten Widgets direkt verarbeitet wird oder die von einer Abbildung beansprucht wird; als ausgewählte Optionen einer Eigenschaft, die durch Auswahl bearbeitet wird; andernfalls als Text in ihrem Format. </p> <p> Die konfigurierten Abbildungen (<i>Annotation-Steuerelemente</i>, <i>Provider</i> und <i>Formate</i>) ermöglichen es einem übergeordneten Modul, ein Steuerelement beizusteuern – der TL-Script-Editor befindet sich beispielsweise in „tl-model-search-react“. </p>
com.top_logic.layout.configedit.ConfigFormControl$Commands = Befehle
com.top_logic.layout.configedit.ConfigFormControl$Commands.tooltip = Wo die Befehle Bearbeiten, Übernehmen und Abbrechen eines <i>Konfigurationsformulars</i> dargestellt werden.
