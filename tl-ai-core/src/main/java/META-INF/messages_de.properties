com.top_logic.tl.ai.core.mcp.HttpMcpTransport = HTTP-MCP-Transport
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.bearer-token-env-var = Bearer-Token-Umgebungsvariable
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.bearer-token-env-var.tooltip = Name einer Umgebungsvariablen, die ein Bearer-Token enthält. <p> Wird über System.getenv() zur Verbindungszeit aufgelöst. Das Token wird als Authorization: Bearer <token> Header gesendet. Dies vermeidet die Eingabe von Geheimnissen in Konfigurationsdateien. </p>
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.headers = Header
com.top_logic.tl.ai.core.mcp.HttpMcpTransport.Config.headers.tooltip = Statische HTTP-Header, die mit jeder Anfrage gesendet werden. <p> In XML: <entry name="X-Api-Key" value="secret"/> </p>
