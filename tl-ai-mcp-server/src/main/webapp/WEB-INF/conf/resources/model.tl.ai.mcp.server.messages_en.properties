model.tl.ai.mcp.server = TL MCP Server
model.tl.ai.mcp.server.AccessToken = Access token
model.tl.ai.mcp.server.AccessToken.createdAt = Created
model.tl.ai.mcp.server.AccessToken.createdAt.tooltip = When the token was created.
model.tl.ai.mcp.server.AccessToken.expiresAt = Expires
model.tl.ai.mcp.server.AccessToken.expiresAt.tooltip = From this moment on the token is refused. Empty if it does not expire.
model.tl.ai.mcp.server.AccessToken.hint = Token
model.tl.ai.mcp.server.AccessToken.hint.tooltip = The beginning of the token, to tell it apart from your other tokens. The whole token is shown only once, when it is created.
model.tl.ai.mcp.server.AccessToken.lastUsed = Last used
model.tl.ai.mcp.server.AccessToken.lastUsed.tooltip = When an MCP client last authenticated with the token, to the minute. Empty if it was never used.
model.tl.ai.mcp.server.AccessToken.name = Name
model.tl.ai.mcp.server.AccessToken.name.tooltip = What the token is for, for example the client it is used in.
model.tl.ai.mcp.server.AccessToken.owner = Account
model.tl.ai.mcp.server.AccessToken.owner.tooltip = The account the token acts as. A request with the token has exactly the rights of this account.
model.tl.ai.mcp.server.AccessToken.secretHash = Hash
model.tl.ai.mcp.server.AccessToken.secretHash.tooltip = The SHA-256 of the token. The token itself is not stored.
model.tl.ai.mcp.server.AccessToken.tooltip = A personal access token with which an MCP client such as Claude Code acts as the account that created it.
model.tl.ai.mcp.server.AccessTokenRequest = New access token
model.tl.ai.mcp.server.AccessTokenRequest.name = Name
model.tl.ai.mcp.server.AccessTokenRequest.name.tooltip = What the token is for, for example the client it is used in.
model.tl.ai.mcp.server.AccessTokenRequest.token = Token
model.tl.ai.mcp.server.AccessTokenRequest.token.tooltip = Copy the token now. It is not shown again, and it is not stored.
model.tl.ai.mcp.server.AccessTokenRequest.tooltip = What is asked for when an access token is created.
model.tl.ai.mcp.server.AccessTokenRequest.validForDays = Valid for (days)
model.tl.ai.mcp.server.AccessTokenRequest.validForDays.tooltip = How many days from now the token is accepted. Leave empty for a token that does not expire.
