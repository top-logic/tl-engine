model.tl.security.passkey.Passkey.createdAt = Erstellt
model.tl.security.passkey.Passkey.createdAt.tooltip = Wann der Passkey registriert wurde.
model.tl.security.passkey.Passkey.credentialId = Credential-ID
model.tl.security.passkey.Passkey.credentialId.tooltip = Die ID, mit der der Authentifikator den Passkey kennzeichnet, base64url-kodiert.
model.tl.security.passkey.Passkey.label = Name
model.tl.security.passkey.Passkey.label.tooltip = Der Name, den der Besitzer dem Passkey gegeben hat, z. B. das Gerät, auf dem er liegt.
model.tl.security.passkey.Passkey.lastUsed = Zuletzt verwendet
