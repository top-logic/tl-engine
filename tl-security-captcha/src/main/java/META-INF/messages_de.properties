class.com.top_logic.security.captcha.I18NConstants.ERROR_CAPTCHA_INVALID = Die Sicherheitsprüfung wurde nicht abgeschlossen oder ist abgelaufen. Bitte bestätigen Sie sie erneut.
com.top_logic.security.captcha.CaptchaService = Captcha-Dienst
com.top_logic.security.captcha.CaptchaService.Config.cost = Aufwand
com.top_logic.security.captcha.CaptchaService.Config.cost.tooltip = Der Aufwand eines Versuchs, eine Aufgabe zu lösen: die Anzahl der Iterationen der Schlüsselableitungsfunktion.
com.top_logic.security.captcha.CaptchaService.Config.expires = Gültigkeit
com.top_logic.security.captcha.CaptchaService.Config.expires.tooltip = Wie lange eine erstellte Aufgabe gelöst und abgeschickt werden kann.
com.top_logic.security.captcha.CaptchaService.Config.hmac-key = HMAC-Schlüssel
com.top_logic.security.captcha.CaptchaService.Config.hmac-key.tooltip = Der geheime Schlüssel, mit dem die Aufgaben signiert werden. <p> Empfohlen ist ein Verweis auf den Schlüssel über seinen Geheimnis-Namen, z. B. <code>&lt;hmac-key name="tl_captcha_hmac_key"/&gt;</code>. Ein Attributwert ist ein verschlüsselter Schlüssel oder ein unverschlüsselter Schlüssel mit dem Präfix <code>unencrypted:</code>. Der Schlüssel wird bei jedem Erstellen und Prüfen einer Aufgabe gelesen; ändert er sich, werden die zuvor erstellten Aufgaben ungültig. </p> <p> Leer: Der Dienst erzeugt beim Start einen zufälligen Schlüssel und protokolliert eine Warnung, wenn der Schlüssel zum ersten Mal verwendet wird. Eine Aufgabe wird dann nur von dem Knoten akzeptiert, der sie erstellt hat, und nur bis zu dessen Neustart. Eine Produktivinstallation, zumindest eine mit mehreren Knoten, konfiguriert den Schlüssel. </p>
com.top_logic.security.captcha.CaptchaService.Config.max-number = Maximale Anzahl
com.top_logic.security.captcha.CaptchaService.Config.max-number.tooltip = Die maximale Anzahl an Versuchen, die der Browser zum Lösen einer Aufgabe braucht. <p> Die Anzahl der Versuche jeder Aufgabe wird zufällig aus der oberen Hälfte dieses Werts gezogen. Zusammen mit dem Aufwand eines Versuchs bestimmt sie, wie lange ein Browser rechnet, in der Regel einige Sekunden. </p>
com.top_logic.security.captcha.CaptchaService.tooltip = Proof-of-Work-Captcha (ALTCHA) zum Schutz eines Formulars, das ein anonymer Besucher abschickt. <p> Der Dienst erstellt signierte Aufgaben für das ALTCHA-Widget im Browser. Das Widget löst die Aufgabe durch Rechnen, ohne Zutun des Besuchers, und schickt seine Lösung mit dem Formular ab. Der Dienst akzeptiert eine Lösung nur, wenn sie eine vom Dienst signierte Aufgabe löst, die Aufgabe nicht abgelaufen ist und die Lösung nicht schon einmal akzeptiert wurde. Es ist kein externer Dienst beteiligt. </p> <p> Die Aufgaben werden mit dem Schlüssel der Installation signiert. Ohne einen solchen signiert der Dienst mit einem zufälligen Schlüssel, den er beim Start erzeugt: Eine Aufgabe wird dann nur von dem Knoten akzeptiert, der sie erstellt hat, und nur bis zu dessen Neustart. </p> <p> Die Schwierigkeit ist der Aufwand eines Versuchs mal der Anzahl der Versuche, die für jede Aufgabe aus der oberen Hälfte der maximalen Anzahl gezogen wird. Eine Aufgabe ist für die unter <i>Gültigkeit</i> angegebene Zeit gültig. </p>
