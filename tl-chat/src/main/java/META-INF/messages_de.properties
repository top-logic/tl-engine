com.top_logic.ai.chat.view.ChatSessionBindingElement.Config.selection.tooltip = Der Auswahlkanal, in den die Sitzungsliste schreibt, und diese Verknüpfung halten mit dem laufenden Gespräch Schritt.
com.top_logic.ai.chat.view.ChatSessionBindingElement.tooltip = Deklaratives Element „ <chat-session-binding/> “: die kleine, chat-spezifische Verbindung, die eine generische Sitzungsliste (ein „ <grouped-table> “) allein über den Kanal nicht ausdrücken kann. <p> Eine generische Tabelle schreibt die ausgewählte „AgentSession“ in einen Auswahlkanal, und „ <chat-thread> “ bzw. „<chat-composer> “ lesen diese, um die laufende Konversation umzuschalten – daher benötigt die Auswahl keine Verknüpfung. Dieses Element stellt die beiden Elemente bereit, die dies tun: </p> <ol> <li>eine Schaltfläche „Neuer Chat“, die die Live-Konversation zurücksetzt (die Methode `newChat()` des Stores, die durch einen Kanal-Schreibvorgang nicht ausgelöst werden kann), und</li> <li>ein Zurückschreiben der eigenen Sitzungs-ID des Stores auf den Auswahlkanal, wenn der Store beim ersten Senden eine Sitzung erstellt oder beim Neuladen eine wiederherstellt, damit die Liste die aktive Zeile hervorhebt.</li> </ol> <p> Es tritt der Konversation über die Chat-ID bei, genau wie die anderen Chat-Elemente. </p>
