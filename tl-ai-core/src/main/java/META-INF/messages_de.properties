com.top_logic.tl.ai.core.provider.AuthScheme.API_KEY.tooltip = Azure-<code>OpenAI</code>-Abonnementschlüssel, der als Wert des api-key-Headers gesendet wird. <p>Wird verwendet, wenn eine direkte Verbindung zu einem Azure-<code>OpenAI</code>-Ressourcenendpunkt hergestellt wird, der den Abonnementschlüssel im api-key-Header anstelle eines Authorization-Bearer-Tokens erfordert.</p>
com.top_logic.tl.ai.core.provider.AuthScheme.BEARER = Bearer
com.top_logic.tl.ai.core.provider.AuthScheme.BEARER.tooltip = Standardmäßiges OAuth2-Bearer-Token, das im Authorization-Header mit dem Bearer-Schema gesendet wird. <p>Wird von <code>OpenAI</code>, Mistral, <code>xAI</code> und Azure-kompatiblen Gateways wie Nexus verwendet, die Bearer-Token im Standard-Header akzeptieren.</p>
com.top_logic.tl.ai.core.provider.AuthScheme.tooltip = HTTP-Authentifizierungsschema, das beim Senden von Anfragen an einen LLM-Anbieter-Endpunkt verwendet wird. <p><i>Bearer</i> umfasst den <code>OpenAI</code>-Standard: Der Schlüssel folgt dem Bearer-Schema im Authorization-Header. <i>Api key</i> umfasst die Azure-<code>OpenAI</code>-Konvention, den Schlüssel in einem einfachen api-key-Header ohne Schema-Präfix zu senden.</p>
