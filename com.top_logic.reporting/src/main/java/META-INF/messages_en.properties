com.top_logic.reporting.report.view.component.DefaultProducerFilterComponent.tooltip = Use this component together with the <i>default producer chart component</i> if you haven't additional filters. If you want to use the <i>default producer chart component</i> you need a <i>filter component</i> as parent. The <i>default producer filter component</i> can be used if the chart needs no additional information but the model of the parent. This component wraps only the model in <i>filter VO</i> which can be used for the <i>default producer chart component</i>. If you have additional filter, you must implement a new sub class of <i>filter component</i>.
