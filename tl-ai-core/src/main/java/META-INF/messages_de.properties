com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.parameters.tooltip = Die Parameter, die dieses Tool akzeptiert. <p> Jeder Parameter wird durch seinen Namen und seine Konfiguration (Typ, Beschreibung usw.) definiert. </p>
