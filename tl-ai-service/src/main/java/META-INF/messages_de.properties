com.top_logic.ai.service.agents.AgentConfig.presence-penalty.tooltip = OpenAI Presence Penalty. <p> Nur sichtbar fï¿½r OpenAI-Modelle. </p>
com.top_logic.ai.service.agents.AgentConfig.reasoning-effort = Reasoning-Aufwand
com.top_logic.ai.service.agents.AgentConfig.reasoning-effort.tooltip = Der Reasoning-Aufwand fï¿½r OpenAI Reasoning-Modelle. <p> Nur sichtbar fï¿½r Modelle, die Reasoning-Aufwand unterstï¿½tzen (OpenAI o-series, GPT-5). </p>
com.top_logic.ai.service.agents.AgentConfig.response-format = Antwortformat
com.top_logic.ai.service.agents.AgentConfig.response-format.tooltip = Prï¿½ferenz fï¿½r das Antwortformat. <p> Nur sichtbar fï¿½r Anbieter, die die Steuerung des Antwortformats unterstï¿½tzen. </p>
com.top_logic.ai.service.agents.AgentConfig.return-thinking = Denkinhalte zurï¿½ckgeben
com.top_logic.ai.service.agents.AgentConfig.return-thinking.tooltip = Ob das Denken des Modells in die Antwort einbezogen werden soll. <p> Nur sichtbar, wenn das Modell das Denken unterstï¿½tzt und ein Denktyp ausgewï¿½hlt ist. Bei "true" wird der Denkinhalt neben dem Antworttext eingefï¿½gt. </p>
com.top_logic.ai.service.agents.AgentConfig.seed = Seed
com.top_logic.ai.service.agents.AgentConfig.seed.tooltip = Seed fï¿½r deterministische Ausgabe. Wenn diese Option gesetzt ist, sollten wiederholte Anfragen mit demselben Seed und denselben Parametern ï¿½hnliche Ergebnisse liefern. <p> Nï¿½tzlich fï¿½r Tests und Fehlersuche. Nur fï¿½r OpenAI-Modelle sichtbar. </p>
com.top_logic.ai.service.agents.AgentConfig.send-thinking = Denkinhalte mitsenden
com.top_logic.ai.service.agents.AgentConfig.send-thinking.tooltip = Ob vorherige Denkblï¿½cke in Folgemeldungen gesendet werden sollen. <p> Nur sichtbar, wenn das Modell Denken unterstï¿½tzt und ein Denktyp ausgewï¿½hlt ist. Bei "true" wird der Denkinhalt aus frï¿½heren Runden in den an das Modell gesendeten Gesprï¿½chsverlauf aufgenommen. </p>
com.top_logic.ai.service.agents.AgentConfig.skills = Skills
com.top_logic.ai.service.agents.AgentConfig.skills.tooltip = Durch Kommata getrennte Liste von Skill-IDs, die fï¿½r diesen Agenten verfï¿½gbar sind. <p> Skills werden durch ihren registrierten Namen in der <i>Agentenregistrierungskonfiguration</i> referenziert. </p>
com.top_logic.ai.service.agents.AgentConfig.stop-sequences = Stopp-Sequenzen
