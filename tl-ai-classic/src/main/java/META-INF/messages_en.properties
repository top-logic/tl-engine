class.com.top_logic.tl.ai.core.security.layout.I18NConstants.WARN_DATA_ROLE_WITHOUT_MODEL_RIGHTS__ROLE_GROUPS = Role {0} holds {1}, but appears in no Read, Write or Create grant of the model access rights: its data tools will see nothing and change nothing, and a refused read comes back empty rather than as an error.
class.com.top_logic.tl.ai.core.security.layout.I18NConstants.WARN_DATA_ROLE_WITHOUT_MODEL_RIGHTS__ROLE_GROUPS.help = The cross-layer warning about a role with data capabilities and no model access rights.
class.com.top_logic.tl.ai.core.security.layout.I18NConstants.WARN_EVERY_ACCOUNT_ROLE__ROLE = Every logged-in account holds role {0}. These permissions apply to all users.
class.com.top_logic.tl.ai.core.security.layout.I18NConstants.WARN_EVERY_ACCOUNT_ROLE__ROLE.help = Warning: the policy grants something to the role every account holds.
class.com.top_logic.tl.ai.core.security.layout.I18NConstants.WARN_INTERNAL_ROLE__ROLE = Role {0} is a role of the framework's user interface. Its entry reaches nobody and is probably a mistake.
