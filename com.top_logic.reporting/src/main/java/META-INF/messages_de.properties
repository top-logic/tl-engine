com.top_logic.reporting.report.view.component.DefaultProducerChartComponent.Config.exportContextClassName.tooltip = Diagrammkontext mit zusätzlichen Werten für den Export. Werte dieses Kontexts überschreiben Werte des Kontexts der Komponente.
com.top_logic.reporting.report.view.component.DefaultProducerChartComponent.Config.exportHandlerId = Handler-ID exportieren
com.top_logic.reporting.report.view.component.DefaultProducerChartComponent.Config.exportHandlerId.tooltip = Die ID des Export-Kommandos.
com.top_logic.reporting.report.view.component.DefaultProducerChartComponent.Config.templateFile = Schablonen-Datei
com.top_logic.reporting.report.view.component.DefaultProducerChartComponent.Config.templateFile.tooltip = Die Vorlagendatei für den Export, relativ zu WEB-INF/reportTemplates/.
com.top_logic.reporting.report.view.component.DefaultProducerChartComponent.tooltip = Diese Komponente delegiert die Erstellung eines JFreeChart an den zugehörigen <i>Diagrammersteller</i>, der im Layout-Xml konfiguriert ist (siehe <code>"chartProducer"</code>). Der <i>Diagrammersteller</i> kann ohne eine Komponente zur Erstellung von <i>Diagrammen</i> verwendet werden. In der Vergangenheit war es ein Problem, wenn die Komponente den Erstellungscode für <i>Diagramme</i> enthält, denn wenn jemand anderes das Diagramm exportieren möchte, benötigt er die Komponente. Er muss das Modell auf die Komponente einstellen,... Jetzt können alle (die Komponente und der Export) den <i>Diagrammersteller</i> ohne diese Probleme verwenden.
com.top_logic.reporting.report.view.component.DefaultProducerFilterComponent = Standardfilterkomponente des Herstellers
com.top_logic.reporting.report.view.component.DefaultProducerFilterComponent.Config.chartContextClass = Diagramm-Kontext-Klasse
com.top_logic.reporting.report.view.component.DefaultProducerFilterComponent.Config.chartContextClass.tooltip = Name der Diagrammkontext-Klasse. Die Klasse muss einen Default-Konstruktor haben.
com.top_logic.reporting.report.view.component.DefaultProducerFilterComponent.Config.checkerClass = Checker-Klasse
com.top_logic.reporting.report.view.component.DefaultProducerFilterComponent.Config.checkerClass.tooltip = Name der Klasse, die prüft, ob ein Objekt vom Filter unterstützt wird.
com.top_logic.reporting.report.view.component.DefaultProducerFilterComponent.Config.configurationClass = Konfigurationsklasse
com.top_logic.reporting.report.view.component.DefaultProducerFilterComponent.Config.configurationClass.tooltip = Name der Klasse, die die Filterfelder definiert.
com.top_logic.reporting.report.view.component.DefaultProducerFilterComponent.tooltip = Verwenden Sie diese Komponente zusammen mit der <i>Standardkomponente für Herstellerdiagramme</i>, wenn Sie keine zusätzlichen Filter haben. Wenn Sie die <i>Standardkomponente für Herstellerdiagramme</i> verwenden möchten, benötigen Sie eine <i>Filterkomponente</i> als übergeordnete <i>Komponente</i>. Die <i>Standard-Erzeuger-Filterkomponente</i> kann verwendet werden, wenn das Diagramm keine zusätzlichen Informationen außer dem Modell des übergeordneten Diagramms benötigt. Diese Komponente umhüllt nur das Modell in <i>Filter-VO</i>, die für die <i>Standard-Produzentendiagrammkomponente</i> verwendet werden kann. Wenn Sie über einen zusätzlichen Filter verfügen, müssen Sie eine neue Unterklasse der <i>Filterkomponente</i> implementieren.
com.top_logic.reporting.report.view.component.ExtendedProducerChartComponent = Erweiterte Erzeugerdiagramm-Komponente
com.top_logic.reporting.report.view.component.ExtendedProducerChartComponent$ChartDisplayDetailCommandHandler = Chartanzeige-Detailbefehls-Handler
com.top_logic.reporting.report.view.component.ExtendedProducerChartComponent$ChartDisplayDetailCommandHandler.tooltip = Öffner für die Detailinformationen zu den Werten. <p> Wenn es nur ein Objekt in der Zielwertmenge gibt, versucht der Handler einen Sprung zu diesem Objekt. Schlägt dies fehl oder enthält das zurückgegebene Ergebnis mehr Objekte, wird die konfigurierte Tabelle in einem Dialog geöffnet. </p>
com.top_logic.reporting.report.view.component.ExtendedProducerChartComponent.Config.detailComponent = Detail Komponente
com.top_logic.reporting.report.view.component.ExtendedProducerChartComponent.Config.detailComponent.tooltip = Die Komponente, die die Details eines angeklickten Diagrammpunkts anzeigt.
com.top_logic.reporting.report.view.component.ExtendedProducerChartComponent.tooltip = Diagrammkomponente, die über die <i>Diagrammdaten</i> eine Behandlung von gehaltenen Geschäftsobjekten im <i>Diagramm</i> ermöglicht.
com.top_logic.reporting.report.view.component.ReportComponent = Berichtskomponente
com.top_logic.reporting.report.view.component.ReportComponent.tooltip = <i>Bildkomponente</i> zur Anzeige von <i>Berichten</i>.
com.top_logic.reporting.report.view.component.ReportConfComponent = Bericht Conf-Komponente
com.top_logic.reporting.report.view.component.ReportConfComponent.Config.report-description-file = Berichtsbeschreibungsdatei
com.top_logic.reporting.report.view.component.ReportConfComponent.Config.report-description-file.tooltip = Die XML-Datei, die den Bericht beschreibt.
com.top_logic.reporting.report.view.component.ReportConfComponent.tooltip = Diese <i>Berichtskomponente</i> zeigt <i>Berichte</i> an, die in Berichtsbeschreibungsdateien (xml) definiert sind. Welche Berichtsbeschreibungsdatei für diese Komponente verwendet wird, ist im Attribut 'report-description-file' definiert. Der Wurzelpfad der Berichtsbeschreibungsdateien ist das Verzeichnis 'WEB-INF/reports'. Bitte legen Sie alle Berichtsbeschreibungsdateien in diesem Verzeichnis oder in Unterverzeichnissen davon ab. Z.B. <code> <component class="com.top_logic.reporting.report.view.component.ReportConfComponent" name="ReportConfComponent" resPrefix="demo.reporting." buttonComponent="ReportComponentButtons" report-description-file="ReportExample.xml"/> </code>
com.top_logic.reporting.tool.ReportingHomepageImpl = Umsetzung der Berichtshomepage
com.top_logic.reporting.tool.ReportingHomepageImpl.tooltip = <i>Homepage-Implementierung</i>, die <i>Filter-VOs</i> extrahieren kann.
com.top_logic.reporting.view.component.AbstractProgressFilterComponent = Fortschrittsfilter-Komponente
com.top_logic.reporting.view.component.AbstractProgressFilterComponent.tooltip = Komponente, die <i>Filter VO-basierte</i> Filter verwendet und beim Filtern einen Fortschrittsdialog bereitstellt.
com.top_logic.reporting.view.component.ApplyFilterCommandHandler = Filter-Kommando-Handler anwenden
com.top_logic.reporting.view.component.ApplyFilterCommandHandler.tooltip = Kommando, das den Filter einer <i>Fortschritts-Filterkomponente</i> anwendet. Wenn viele Objekte durchsucht werden, wird der Benutzer gefragt, bevor der Filter mit einem Fortschrittsdialog angewendet wird.
com.top_logic.reporting.view.component.progress.ApplyFilterProgressCommandHandler = Filter-Fortschrittsbefehl-Handler anwenden
com.top_logic.reporting.view.component.progress.ApplyFilterProgressComponent = Filter-Fortschrittskomponente anwenden
com.top_logic.reporting.view.component.progress.ApplyFilterProgressComponent.tooltip = Fortschrittskomponente, die angezeigt wird, während ein Filter angewendet wird.
com.top_logic.reporting.view.component.table.FilterAwareGridComponent = Filter-bewusste Gitterkomponente
com.top_logic.reporting.view.component.table.FilterAwareGridComponent.tooltip = <i>Grid-Komponente</i>, die eine <i>filterfähige Komponente</i> implementiert.
