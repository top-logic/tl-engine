com.top_logic.dsa.repos.Repository.getEntries.param.aPathOfDirectory.tooltip = The path to the directory
com.top_logic.dsa.repos.Repository.getEntries.return = A Collection with the VersionInfo of all the top-Level entries or Directories.
com.top_logic.dsa.repos.Repository.getEntries.tooltip = Returns a Collection of EntryInfos for the given Directory.
