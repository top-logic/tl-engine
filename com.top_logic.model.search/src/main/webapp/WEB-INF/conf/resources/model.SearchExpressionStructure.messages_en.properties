model.SearchExpressionStructure = Search Expressions
model.SearchExpressionStructure.SearchExpression = Search Expression
model.SearchExpressionStructure.SearchExpression.expression = Expression
model.SearchExpressionStructure.SearchExpression.expression.tooltip = The stored search definition. The value is not entered directly but written by the search editor, which serializes the search together with its report configuration into it.
model.SearchExpressionStructure.SearchExpression.name = Name
model.SearchExpressionStructure.SearchExpression.name.tooltip = The name under which the search is offered for selection.
model.SearchExpressionStructure.SearchExpression.tooltip = A search definition stored under a name. It belongs to the account that created it and can be published to groups, so that other users can run it as well.
model.SearchExpressionStructure.SearchExpression.version = Version
model.SearchExpressionStructure.SearchExpression.version.tooltip = The format version of the stored definition. It allows a definition written by an earlier version of the application to be recognized.
model.SearchExpressionStructure.SearchExpressionNode = Search Expression
model.SearchExpressionStructure.SearchExpressionNode.tooltip = The concrete type of a stored search. Every stored search is an object of this type.
model.SearchExpressionStructure.tooltip = Module with the type in which the searches assembled with the graphical search are stored.
