admin.ai.tool.view-window.whereAmI = Reads the page the user has open: its parts, nested, with the view each one comes from.
admin.ai.tool.views.deleteView = Deletes a view file of this application; the change can be undone.
admin.ai.tool.views.editView = Changes single elements of a view and keeps comments and formatting; the change can be undone.
admin.ai.tool.views.listViews = Lists the view files of this application.
admin.ai.tool.views.readView = Reads one view: the outline of its elements and its XML.
admin.ai.tool.views.revertViewChange = Undoes a view change: every view it changed gets its earlier text back, a view it created is deleted.
admin.ai.tool.views.viewElements = Lists the tags a view of this application can use, or the properties and an example of one tag.
admin.ai.tool.views.writeView = Creates a view from XML or replaces one, after checking it; the change can be undone.
