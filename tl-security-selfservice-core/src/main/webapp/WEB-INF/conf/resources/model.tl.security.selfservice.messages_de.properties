model.tl.security.selfservice = Self Service
model.tl.security.selfservice.Invitation = Einladung
model.tl.security.selfservice.Invitation.accepted = Angenommen
model.tl.security.selfservice.Invitation.accepted.tooltip = Wann die eingeladene Person den Zugang aus der Einladung angelegt hat. Leer, solange die Einladung nicht angenommen wurde.
model.tl.security.selfservice.Invitation.account = Zugang
model.tl.security.selfservice.Invitation.account.tooltip = Der Zugang, der aus der Einladung angelegt wurde.
model.tl.security.selfservice.Invitation.createCallback = Anlage Callback
model.tl.security.selfservice.Invitation.createCallback.tooltip = Die TL-Script-Funktion, die aufgerufen wird, wenn die eingeladene Person den Zugang erfolgreich eingerichtet hat.\n\nDie Funktion erwartet den neu angelegten Nutzer als einziges Argument.\n\nAls Rückgabe wird entweder null oder ein internationalisierbarer Wert erwartet. Ein Rückgabewert ungleich null wird als Fehler interpretiert und die Erstellung des Zugangs wird abgebrochen.
model.tl.security.selfservice.Invitation.createdAt = Erstellt
model.tl.security.selfservice.Invitation.createdAt.tooltip = Wann die Einladung erstellt wurde.
model.tl.security.selfservice.Invitation.createdBy = Erstellt von
model.tl.security.selfservice.Invitation.createdBy.tooltip = Der Zugang, der die Einladung erstellt hat.
model.tl.security.selfservice.Invitation.email = E-Mail Adresse
model.tl.security.selfservice.Invitation.email.tooltip = Die E-Mail-Adresse der Person, die eingeladen werden soll. Die E-Mail-Adresse dient gleichzeitig als Nutzername.
model.tl.security.selfservice.Invitation.expires = Gültig bis
model.tl.security.selfservice.Invitation.expires.tooltip = Bis wann die Einladung angenommen werden kann. Wird die Einladung erneut verschickt, erhält sie einen neuen Link und eine neue Gültigkeit.
model.tl.security.selfservice.Invitation.id = ID
model.tl.security.selfservice.Invitation.id.tooltip = Eindeutige ID der Einladung. Die ID ist Bestandteil des Einladungslinks, der per E-Mail an den Eingeladenen verschickt wird.
model.tl.security.selfservice.Invitation.mfaRequirement = MFA Anforderung
model.tl.security.selfservice.Invitation.mfaRequirement.tooltip = Ob der neue Nutzer verpflichtet ist, die Multi-Faktor-Authentifizierung zu nutzen.
model.tl.security.selfservice.Invitation.state = Status
model.tl.security.selfservice.Invitation.state.tooltip = Ob die Einladung offen, abgelaufen oder angenommen ist.
model.tl.security.selfservice.Invitation.tooltip = Eine Einladung an eine Person, sich selbst einen Zugang zur Anwendung einzurichten.
model.tl.security.selfservice.InvitationState = Status der Einladung
model.tl.security.selfservice.InvitationState.ACCEPTED = Angenommen
model.tl.security.selfservice.InvitationState.ACCEPTED.tooltip = Die eingeladene Person hat den Zugang angelegt. Die Einladung bleibt als Nachweis erhalten und kann nicht erneut verwendet werden.
model.tl.security.selfservice.InvitationState.EXPIRED = Abgelaufen
model.tl.security.selfservice.InvitationState.EXPIRED.tooltip = Die Gültigkeit der Einladung ist abgelaufen. Sie kann erst wieder angenommen werden, wenn sie erneut verschickt wird.
model.tl.security.selfservice.InvitationState.OPEN = Offen
model.tl.security.selfservice.InvitationState.OPEN.tooltip = Die Einladung kann angenommen werden.
model.tl.security.selfservice.InvitationState.tooltip = Der Status einer Einladung.
model.tl.security.selfservice.Registration = Registrierung
model.tl.security.selfservice.Registration.account = Zugang
model.tl.security.selfservice.Registration.account.tooltip = Der Zugang, den der Besucher registriert hat.
model.tl.security.selfservice.Registration.approved = Freigegeben
model.tl.security.selfservice.Registration.approved.tooltip = Wann die Registrierung freigegeben wurde. Leer, solange die Registrierung auf ihre Freigabe wartet.
model.tl.security.selfservice.Registration.approvedBy = Freigegeben von
model.tl.security.selfservice.Registration.approvedBy.tooltip = Der Administrator, der die Registrierung freigegeben hat. Leer bei einer Registrierung, die keine Freigabe brauchte.
model.tl.security.selfservice.Registration.createdAt = Registriert
model.tl.security.selfservice.Registration.createdAt.tooltip = Wann der Besucher den Zugang registriert hat.
model.tl.security.selfservice.Registration.email = E-Mail-Adresse
model.tl.security.selfservice.Registration.email.tooltip = Die E-Mail-Adresse, mit der sich der Besucher registriert hat, zugleich der Benutzername des Zugangs.
model.tl.security.selfservice.Registration.state = Status
model.tl.security.selfservice.Registration.state.tooltip = Ob die Registrierung auf ihre Freigabe wartet oder freigegeben ist.
model.tl.security.selfservice.Registration.tooltip = Der Nachweis eines Zugangs, den ein Besucher ohne Einladung registriert hat.
model.tl.security.selfservice.RegistrationState = Registrierungsstatus
model.tl.security.selfservice.RegistrationState.APPROVED = Freigegeben
model.tl.security.selfservice.RegistrationState.APPROVED.tooltip = Der Zugang kann sich anmelden.
model.tl.security.selfservice.RegistrationState.PENDING = Wartet auf Freigabe
model.tl.security.selfservice.RegistrationState.PENDING.tooltip = Der Zugang ist gesperrt, bis ein Administrator die Registrierung freigibt.
model.tl.security.selfservice.RegistrationState.tooltip = Der Status einer Registrierung.
model.tl.security.selfservice.tooltip = Modul mit den Typen für Einladungen und Registrierungen, mit denen Personen sich selbst einen Zugang zur Anwendung einrichten.
