com.top_logic.xio.importer.handlers.StoreHandler.Config.name.tooltip = Der Name der zuzuweisenden Modelleigenschaft.
com.top_logic.xio.importer.handlers.StoreHandler.Config.target-var = Objekt-Variable
com.top_logic.xio.importer.handlers.StoreHandler.Config.target-var.tooltip = Name der Variablen, die das Objekt enthält, dessen Eigenschaft zugewiesen ist.
com.top_logic.xio.importer.handlers.StoreHandler.tooltip = Basisklasse für <i>Handler</i>, die einem Modellelement einen Wert zuweisen.
