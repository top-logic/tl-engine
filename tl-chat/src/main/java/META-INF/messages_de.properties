com.top_logic.ai.chat.view.ChatThreadElement.tooltip = Deklaratives „ <chat-thread/> “-Element: der Verlauf als eigenes View-Element. <p> Mehrere Chat-Elemente auf einer Seite treten über chat-id demselben Gespräch bei. Der optionale input-Kanal trägt das offene AgentSession-Objekt; der optionale busy-Kanal wird „true“ geschrieben, während der Agent arbeitet, damit ein Host seine eigenen Befehle abschalten kann. </p>
com.top_logic.ai.chat.view.list.DataListElement = Datenlistenelement
com.top_logic.ai.chat.view.list.DataListElement$Emphasis = Schwerpunkt
com.top_logic.ai.chat.view.list.DataListElement$Emphasis.tooltip = Wie deutlich eine Linie dargestellt wird.
com.top_logic.ai.chat.view.list.DataListElement$LineConfig = Leitungskonfiguration
com.top_logic.ai.chat.view.list.DataListElement$LineConfig.tooltip = Konfiguration für eine einzelne Zeile einer Reihe – ähnlich wie bei einer Tabelle <column>, jedoch gestapelt.
com.top_logic.ai.chat.view.list.DataListElement$LinesConfig = Konfiguration der Leitungen
com.top_logic.ai.chat.view.list.DataListElement$LinesConfig.tooltip = Behälter für die Zeilen eines <i>Datenlistenelements</i>.
com.top_logic.ai.chat.view.list.DataListElement.Config.collapsible = Zusammenklappbar
com.top_logic.ai.chat.view.list.DataListElement.Config.collapsible.tooltip = Ob sich die Liste auf einen schmalen Streifen zusammenklappen lässt.
com.top_logic.ai.chat.view.list.DataListElement.Config.create = Schaltfläche „Erstellen“
com.top_logic.ai.chat.view.list.DataListElement.Config.create-channel = Kanal erstellen
com.top_logic.ai.chat.view.list.DataListElement.Config.create-channel.tooltip = Optional sendet die Schaltfläche „Erstellen“ bei jedem Klick ein Signal, sodass ein Host-Befehl (z. B. „Neue Unterhaltung“ im Chat) darauf reagieren kann. Die Liste selbst führt keine Erstellung durch.
com.top_logic.ai.chat.view.list.DataListElement.Config.create-label = Etikett erstellen
com.top_logic.ai.chat.view.list.DataListElement.Config.create-label.tooltip = Beschriftung der Schaltfläche „Erstellen“. Wenn das Feld leer ist, wird standardmäßig die allgemeine Beschriftung „Neu“ angezeigt.
com.top_logic.ai.chat.view.list.DataListElement.Config.create.tooltip = Ob in der Listenüberschrift eine Schaltfläche für die Hauptaktion („Neu“) angezeigt wird.
com.top_logic.ai.chat.view.list.DataListElement.Config.empty-text = Leerer Text
com.top_logic.ai.chat.view.list.DataListElement.Config.empty-text.tooltip = Der Text, der angezeigt wird, wenn die Liste leer ist.
com.top_logic.ai.chat.view.list.DataListElement.Config.group-by = Nach... gruppieren
com.top_logic.ai.chat.view.list.DataListElement.Config.group-by.tooltip = Optionale TL-Script-Funktion, die für jede Zeile deren Gruppenbezeichnung berechnet. Zeilen mit derselben Bezeichnung werden unter einer Überschrift zusammengefasst, und zwar in der Reihenfolge ihres ersten Auftretens. „Leer“ bedeutet, dass keine Gruppierung erfolgt (eine flache Liste).
com.top_logic.ai.chat.view.list.DataListElement.Config.inputs = Eingaben
com.top_logic.ai.chat.view.list.DataListElement.Config.inputs.tooltip = Verweise auf Kanäle, deren Werte als Positionsargumente für <i>„Rows“</i> dienen.
com.top_logic.ai.chat.view.list.DataListElement.Config.lines = Zeilen
com.top_logic.ai.chat.view.list.DataListElement.Config.lines.tooltip = Die pro Zeile angezeigten Zeilen, von oben nach unten – das vertikale Pendant zu den Spalten einer Tabelle.
com.top_logic.ai.chat.view.list.DataListElement.Config.observed-types = Beobachtete Typen
com.top_logic.ai.chat.view.list.DataListElement.Config.observed-types.tooltip = Bei Typen, bei denen sich das Objekt ändert (Erstellen / Aktualisieren / Löschen), werden <i>die Zeilen</i> erneut ausgeführt, sodass die Liste automatisch aktualisiert wird.
com.top_logic.ai.chat.view.list.DataListElement.Config.react-element = React-Element
com.top_logic.ai.chat.view.list.DataListElement.Config.react-element.tooltip = Registriertes React-Element, das diese Liste rendert. Standardmäßig ist „TLDataList“ eingestellt.
com.top_logic.ai.chat.view.list.DataListElement.Config.rows = Zeilen
com.top_logic.ai.chat.view.list.DataListElement.Config.rows.tooltip = TL-Script-Funktion zur Berechnung der Zeilenobjekte (eine <i>Sammlung</i>), analog zu den Zeilen von <table>.
com.top_logic.ai.chat.view.list.DataListElement.Config.search = Suche
com.top_logic.ai.chat.view.list.DataListElement.Config.search.tooltip = Ob die Liste ein Suchfeld anzeigt (clientseitiger Filter für den Zeilentext).
com.top_logic.ai.chat.view.list.DataListElement.Config.selection = Auswahl
com.top_logic.ai.chat.view.list.DataListElement.Config.selection.tooltip = Optionaler Zweiwege-Kanal, der das ausgewählte Zeilenobjekt enthält.
com.top_logic.ai.chat.view.list.DataListElement.Config.title = Titel
com.top_logic.ai.chat.view.list.DataListElement.Config.title.tooltip = Der über der Liste angezeigte Titel.
com.top_logic.ai.chat.view.list.DataListElement.Config.types = Typen
com.top_logic.ai.chat.view.list.DataListElement.Config.types.tooltip = Optionale qualifizierte TL-Typnamen der Zeilenobjekte (zur Attributauflösung). Entspricht den Typen aus „ <table> “.
com.top_logic.ai.chat.view.list.DataListElement.Emphasis.PRIMARY = Grundschule
com.top_logic.ai.chat.view.list.DataListElement.Emphasis.PRIMARY.tooltip = Die hervorgehobene Zeile (Titelformat).
com.top_logic.ai.chat.view.list.DataListElement.Emphasis.SECONDARY = Sekundär
com.top_logic.ai.chat.view.list.DataListElement.Emphasis.SECONDARY.tooltip = Eine gedämpfte Nebenlinie.
com.top_logic.ai.chat.view.list.DataListElement.LineConfig.attribute = Attribut
com.top_logic.ai.chat.view.list.DataListElement.LineConfig.attribute.tooltip = Das in dieser Zeile angezeigte Modellattribut (Normalfall). Verwenden Sie stattdessen <i>„Wert“</i> für eine berechnete Zeile.
com.top_logic.ai.chat.view.list.DataListElement.LineConfig.emphasis = Schwerpunkt
com.top_logic.ai.chat.view.list.DataListElement.LineConfig.emphasis.tooltip = Wie deutlich die Zeile dargestellt wird. „Unset“ bedeutet, dass die erste Zeile <i>primär</i> und die übrigen <i>sekundär</i> sind.
com.top_logic.ai.chat.view.list.DataListElement.LineConfig.value = Wert
com.top_logic.ai.chat.view.list.DataListElement.LineConfig.value.tooltip = Eine TL-Script-Funktion, die den Text dieser Zeile berechnet – eine berechnete Zeile (ein formatierter Wert, eine Zählung), die mit einem einfachen Attribut nicht ausgedrückt werden kann.
com.top_logic.ai.chat.view.list.DataListElement.LinesConfig.lines = Zeilen
com.top_logic.ai.chat.view.list.DataListElement.LinesConfig.lines.tooltip = Die anzuzeigenden Zeilen, von oben nach unten.
com.top_logic.ai.chat.view.list.DataListElement.tooltip = Deklaratives <data-list> -Element: eine modellgebundene, formatierte, gruppierte, durchsuchbare und auswählbare Liste – die Darstellung einer Chat-Leiste, verallgemeinert auf beliebige Modelle. <p> Die Zeilen stammen aus einem TL-Script-Zeilenausdruck (über Typen), genau wie „ <table> “ seine Zeilen bindet. Jede Zeile zeigt eine geordnete Liste von Zeilen (das vertikale Gegenstück zu den Spalten einer Tabelle); ihre Gruppenbezeichnung ist ein weiterer Ausdruck. Ein Klick auf eine Zeile schreibt das Zeilenobjekt in den bidirektionalen Auswahlkanal. Suche und Ausblenden erfolgen clientseitig. Im Gegensatz zu <table> wird hier eine formatierte Liste (im „Session-Rail“-Look) und kein Datengitter gerendert; im Gegensatz zu <object-list> handelt es sich um einen auswählbaren Picker und nicht um einen In-Place-Editor für zusammengesetzte Elemente. </p> <p><b>VORLÄUFIGER FORK.</b> Die Engine verfügt über keine datengebundene Liste, die wie die Navigationsleiste mit Auswahl + Gruppierung + Suche gerendert wird. Dieses Element schließt diese Lücke in tl-ai und wird von der React-Komponente „TLDataList“ gerendert. <b>Vorgängersziel:</b> ein generisches „ <data-list> “ in tl-layout-view; anschließend soll dieses Paket gelöscht werden. </p>
com.top_logic.ai.chat.view.table.GroupedTableElement = Gruppiertes Tabellenelement
com.top_logic.ai.chat.view.table.GroupedTableElement$ColumnConfig = Spaltenkonfiguration
com.top_logic.ai.chat.view.table.GroupedTableElement$ColumnConfig.tooltip = Konfiguration für eine einzelne angezeigte Spalte eines <i>gruppierten Tabellenelements</i>.
com.top_logic.ai.chat.view.table.GroupedTableElement$ColumnsConfig = Konfiguration der Spalten
com.top_logic.ai.chat.view.table.GroupedTableElement$ColumnsConfig.tooltip = Container für die Liste der <i>Spaltenkonfigurationen</i> eines <i>gruppierten Tabellenelements</i>.
com.top_logic.ai.chat.view.table.GroupedTableElement.ColumnConfig.attribute = Attribut
com.top_logic.ai.chat.view.table.GroupedTableElement.ColumnConfig.attribute.tooltip = Der Name des Attributs (der Spalte), das/die angezeigt werden soll.
com.top_logic.ai.chat.view.table.GroupedTableElement.ColumnConfig.filter = Filter
com.top_logic.ai.chat.view.table.GroupedTableElement.ColumnConfig.filter.tooltip = Ein optionaler, anwendungsdefinierter Filter für diese Spalte, der die vom Typ abgeleitete Standardeinstellung überschreibt. Der Filter wird mit dem Anzeigetext der Zelle abgeglichen.
com.top_logic.ai.chat.view.table.GroupedTableElement.ColumnConfig.sort = Sortieren
com.top_logic.ai.chat.view.table.GroupedTableElement.ColumnConfig.sort.tooltip = Die Spalte, nach der die Tabelle beim ersten Anzeigen sortiert wird, oder „unset“, um sie unsortiert zu lassen. Werden mehrere Spalten festgelegt, erfolgt die Sortierung nach diesen Spalten in der Reihenfolge ihrer Angabe.
com.top_logic.ai.chat.view.table.GroupedTableElement.ColumnsConfig.columns = Spalten
com.top_logic.ai.chat.view.table.GroupedTableElement.ColumnsConfig.columns.tooltip = Die anzuzeigenden Spalten in der Reihenfolge ihrer Darstellung.
com.top_logic.ai.chat.view.table.GroupedTableElement.Config.columns = Spalten
com.top_logic.ai.chat.view.table.GroupedTableElement.Config.columns.tooltip = Die anzuzeigenden Spalten in der Reihenfolge ihrer Anzeige.
com.top_logic.ai.chat.view.table.GroupedTableElement.Config.fixed-columns = Feste Spalten
com.top_logic.ai.chat.view.table.GroupedTableElement.Config.fixed-columns.tooltip = Wie viele der führenden Spalten bleiben an ihrer Position, während der Tisch horizontal gescrollt wird? Bei dem Wert „0“ (Standard) bleibt keine Spalte an ihrer Position.
com.top_logic.ai.chat.view.table.GroupedTableElement.Config.group-by = Nach... gruppieren
com.top_logic.ai.chat.view.table.GroupedTableElement.Config.group-by.tooltip = TL-Script-Funktion für eine Zeile, die deren Gruppenschlüssel berechnet. Zeilen mit demselben Schlüssel werden unter einer ausklappbaren Überschrift zusammengefasst, deren Bezeichnung dem zurückgegebenen Wert entspricht. Der Wert „leer“ (Standard) bedeutet, dass keine Gruppierung erfolgt – die Tabelle wird dann genau wie unter <table> dargestellt. <p> Die Gruppen werden in der Reihenfolge des ersten Auftretens der (sortierten) Zeilen angezeigt. Sortieren Sie die Zeilen daher nach dem Attribut, nach dem die Gruppierung erfolgt. </p>
com.top_logic.ai.chat.view.table.GroupedTableElement.Config.inputs = Eingaben
com.top_logic.ai.chat.view.table.GroupedTableElement.Config.inputs.tooltip = Referenzen zum <i>Anzeigen von Kanälen</i>, deren Werte als Positionsargumente für <i>„Rows“</i> dienen.
com.top_logic.ai.chat.view.table.GroupedTableElement.Config.observed-types = Beobachtete Typen
com.top_logic.ai.chat.view.table.GroupedTableElement.Config.observed-types.tooltip = Typen, bei denen sich das Objekt ändert (Erstellen / Aktualisieren / Löschen), lösen eine Neubewertung der Zeilen aus, sodass die Tabelle automatisch aktualisiert wird. Bei der Einstellung „Leer“ (Standard) bleibt die Tabelle unverändert.
com.top_logic.ai.chat.view.table.GroupedTableElement.Config.rows = Zeilen
com.top_logic.ai.chat.view.table.GroupedTableElement.Config.rows.tooltip = TL-Script-Funktion zur Berechnung der Zeilenobjekte (eine <i>Sammlung</i>).
com.top_logic.ai.chat.view.table.GroupedTableElement.Config.selection = Auswahl
com.top_logic.ai.chat.view.table.GroupedTableElement.Config.selection.tooltip = Optionaler <i>Ansichtskanal</i>, in den die ausgewählten Zeilenobjekte geschrieben werden sollen.
com.top_logic.ai.chat.view.table.GroupedTableElement.Config.types = Typen
com.top_logic.ai.chat.view.table.GroupedTableElement.Config.types.tooltip = Optionale, qualifizierte TL-Typnamen der Zeilenobjekte, die zur Auflösung von Spaltenbezeichnungen aus den Modellattributen verwendet werden. Ist dieser Parameter nicht gesetzt, wird der Typ aus der ersten Zeile abgeleitet.
com.top_logic.ai.chat.view.table.GroupedTableElement.tooltip = Deklaratives <i>UI-Element</i>, das eine modelldefinierte Tabelle darstellt (das Tag „ <grouped-table> “), deren Zeilen anhand des Werts eines TL-Script-Gruppierungsausdrucks unter erweiterbaren Überschriften zusammengefasst werden. <p><b>VORLÄUFIGE ABZWEIGUNG.</b> Dieses Element ist eine Kopie des Lesepfads <i>des Tabellenelements</i> plus einem Gruppierungsblock (unten markiert). Die Gruppierung funktioniert bereits im „Green-Field“-Tabellenmodell (<code>DefaultTableView#group(GroupSpec)</code> Buckets nach einem beliebigen Wert <code>Column#value(Object)</code>), wird jedoch vom deklarativen „ <table> “ der Engine nicht bereitgestellt. Diese Abzweigung belegt die Funktionsfähigkeit in tl-ai, ohne auf eine Engine-Veröffentlichung warten zu müssen. </p> <p><b>Vorgeschlagenes Ziel:</b> Hinzufügen einer „group-by“-Eigenschaft (und des Gruppierungsblocks in „createControl“) zum <i>Tabellenelement</i>. <b>Entfernung:</b> Sobald eine TL-Engine-Version „group-by“ im „ <table> “ unterstützt, dieses Paket löschen und „ <grouped-table> “ in der Komposition in „ <table> “ ändern. </p> <p> Schreibgeschützt: Im Gegensatz zu <table> verzichtet dieser Fork auf die bearbeitbaren Varianten (row-edit, create-type, on-remove); create/delete gehören zu separaten Befehlen. </p>
