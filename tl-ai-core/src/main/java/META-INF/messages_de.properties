com.top_logic.tl.ai.core.execution.AgentExecutionStore.SessionKind.SCRIPT.tooltip = Der Lauf wurde von einer TL-Script-Funktion aus gestartet.
com.top_logic.tl.ai.core.execution.AgentExecutionStore.tooltip = Dienst, der das <code>tl.ai.execution</code> speichert und abruft: <i>Agentensitzung</i>, <i>Agentenausführung</i>, <i>Interaktionsanfrage</i> und <i>Agentenaufgabe</i>. <p> Dies ist der einzige Schreibpfad für die Persistenz bei der Agentenausführung. Jeder Einstiegspunkt, der einen Agenten ausführt (Chat, TL-Script, Delegation, Hintergrundjobs), protokolliert dessen Ausführung über diesen Dienst, sodass alle Ausführungen einheitlich abfragbar sind, unabhängig davon, wie sie gestartet wurden. </p> <p> Alle mutierenden Methoden werden in einem dedizierten Schreib-Thread innerhalb einer neuen Systeminteraktion mit eigener <i>Transaktion</i> ausgeführt. Aufrufer benötigen daher weder eine Transaktion noch einen commit-fähigen KB-Kontext – die Aufzeichnung funktioniert aus jedem Aufruferkontext heraus, einschließlich schreibgeschützter Kontexte wie der TL-Script-Auswertung während des Renderings (deren „ImmutableDBContext“ kein Commit durchführen kann). Abfragen werden auf dem aufrufenden Thread ausgeführt und erfordern einen gebundenen TopLogic-Kontext. </p> <p><b>Invariante:</b> Nichts, was von einem KnowledgeBase-UpdateListener (oder einem anderen synchronen Commit-Hook) erreichbar ist, darf eine mutierende Methode dieses Dienstes aufrufen – der Aufrufer blockiert auf dem einzigen Schreib-Thread, dessen Commit diese Listener synchron benachrichtigt, sodass ein solcher Aufruf einen Deadlock-Zyklus schließt. </p> <p> Aufrufer sehen ihre eigenen Schreibvorgänge <em>nicht</em> automatisch: Schreib-Commits erfolgen in einer separaten Sitzung, und die stabile Ansicht einer Untersitzung wird nur an festgelegten Punkten aktualisiert. Das Chat-Servlet erhöht die Sitzungsrevision zu Beginn der Anfrage, was alle HTTP-Rücklesepfade abdeckt. </p>
