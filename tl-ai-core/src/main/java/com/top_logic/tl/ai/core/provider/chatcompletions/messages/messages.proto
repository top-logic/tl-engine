package com.top_logic.tl.ai.core.provider.chatcompletions.messages;

option NoBinary;
option NoVisit;
option NoListener;
option NoInterfaces;
option NoXml;

/** Chat Completions API request body (<code>OpenAI</code>-compatible). */
message ChatCompletionsRequest {
	/** The model identifier. */
	string model [Name = "model"];
	/** Maximum number of output tokens (legacy field; used by Mistral, xAI, local servers). */
	json max_tokens [Name = "max_tokens"];
	/** Maximum number of output tokens for GPT-5/o-series reasoning models (Azure/OpenAI). */
	json max_completion_tokens [Name = "max_completion_tokens"];
	/** Whether to stream the response. */
	bool stream [Name = "stream"];
	/** Streaming options, e.g. {@code {"include_usage": true}} to receive a final usage chunk. */
	json stream_options [Name = "stream_options"];
	/** Sampling temperature. */
	json temperature [Name = "temperature"];
	/** Top-p sampling parameter. */
	json top_p [Name = "top_p"];
	/** The conversation messages. */
	json messages [Name = "messages"];
	/** Tool definitions. */
	json tools [Name = "tools"];
	/** Response format specification. */
	json response_format [Name = "response_format"];
	/** Tool choice configuration. */
	json tool_choice [Name = "tool_choice"];
}
