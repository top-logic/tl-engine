class.com.top_logic.security.selfservice.I18NConstants.ERROR_INVALID_EMAIL__ADDRESS = „{0}“ ist keine gültige E-Mail-Adresse.
class.com.top_logic.security.selfservice.I18NConstants.ERROR_INVITATION_ACCEPTED = Die Einladung wurde bereits zur Erstellung eines Kontos verwendet.
class.com.top_logic.security.selfservice.I18NConstants.ERROR_INVITATION_EXPIRED = Die Einladung ist abgelaufen. Bitte fordern Sie eine neue Einladung an.
class.com.top_logic.security.selfservice.I18NConstants.ERROR_MAIL_NOT_CONFIGURED = Der Bestätigungscode kann nicht gesendet werden, da die Anwendung keine E-Mails versenden kann. Bitte wenden Sie sich an den Administrator.
class.com.top_logic.security.selfservice.I18NConstants.ERROR_NO_AUTHENTICATION_DEVICE__ID = Das Authentifizierungsgerät „{0}“ für Konten, die über Einladungen oder Registrierungen erstellt wurden, existiert nicht.
class.com.top_logic.security.selfservice.I18NConstants.ERROR_NO_PUBLIC_ADDRESS = Die öffentliche Adresse der Anwendung ist nicht konfiguriert und es liegt keine aktuelle Anfrage vor, sodass kein Link in die Anwendung erstellt werden kann. Legen Sie diese mit der Variablen „tl_host“ (Alias %HOST%) fest, z. B. „https://app.example.com“.
class.com.top_logic.security.selfservice.I18NConstants.ERROR_PASSWORD_EMPTY = Es wurde kein Passwort eingegeben.
class.com.top_logic.security.selfservice.I18NConstants.ERROR_REGISTRATION_NOT_PENDING = Die Registrierung wartet nicht auf eine Freigabe.
class.com.top_logic.security.selfservice.I18NConstants.ERROR_SELF_REGISTRATION_DISABLED = In dieser Anwendung ist die Registrierung eines Kontos nicht möglich.
class.com.top_logic.security.selfservice.I18NConstants.ERROR_UNKNOWN_INVITATION = Für diesen Link liegt keine Einladung vor. Möglicherweise ist der Link unvollständig, oder die Einladung wurde mit einem neuen Link erneut versendet oder widerrufen.
class.com.top_logic.security.selfservice.I18NConstants.ERROR_VERIFICATION_CODE_EXPIRED = Der Bestätigungscode ist abgelaufen oder wurde zu oft falsch eingegeben. Bitte fordern Sie einen neuen Code an.
class.com.top_logic.security.selfservice.I18NConstants.ERROR_VERIFICATION_CODE_MISMATCH = Der Bestätigungscode ist falsch.
class.com.top_logic.security.selfservice.I18NConstants.ERROR_VERIFICATION_CODE_NOT_SENT = Der Bestätigungscode konnte nicht gesendet werden.
class.com.top_logic.security.selfservice.I18NConstants.ERROR_VERIFICATION_CODE_REQUESTED_TOO_OFTEN__SECONDS = Ein neuer Bestätigungscode kann in {0} Sekunden angefordert werden.
class.com.top_logic.security.selfservice.I18NConstants.ERROR_VERIFICATION_CODE_TOO_MANY_MISMATCHES = Der Bestätigungscode wurde zu oft falsch eingegeben. Bitte fordern Sie einen neuen Code an.
class.com.top_logic.security.selfservice.I18NConstants.REGISTERED_ACCOUNT__EMAIL = Konto {0} registriert.
class.com.top_logic.security.selfservice.I18NConstants.REGISTRATION_AWAITS_APPROVAL = Ihr Konto wurde angelegt und wartet auf die Freigabe durch einen Administrator.
class.com.top_logic.security.selfservice.I18NConstants.REGISTRATION_CODE_SENT__EMAIL = Falls für {0} noch kein Konto besteht, haben wir einen Bestätigungscode an diese Adresse gesendet.
class.com.top_logic.security.selfservice.I18NConstants.RENEWED_INVITATION__EMAIL = Einladung für {0} erneuert.
class.com.top_logic.security.selfservice.invitation.script.I18NConstants.ERROR_NOT_AN_INVITATION__VAL_EXPR = Der Wert "{0}" ist keine Einladung in {1}.
com.top_logic.security.selfservice.invitation.InvitationLink = Einladungslink
com.top_logic.security.selfservice.invitation.InvitationLink.Config.page = Seite
com.top_logic.security.selfservice.invitation.InvitationLink.Config.page.tooltip = Die Seite, zu der der Link führt, ein Pfad unterhalb des Kontextpfads der Anwendung, beginnend mit <code>/</code>, z. B. <code>/servlet/LayoutServlet</code>. <p> Die Seite erhält das Token der Einladung im Anfrageparameter <code>"invitation"</code>. Ohne Wert führt der Link zum Layout-Servlet der klassischen Benutzeroberfläche, dessen Anmeldefunktion die Einladung akzeptiert. </p>
com.top_logic.security.selfservice.invitation.InvitationLink.tooltip = Der Link einer <i>Einladung</i>, die Seite der Anwendung, auf der die eingeladene Person diese annimmt. <p> Der Link besteht aus der Adresse der Anwendung (der öffentlichen Adresse <code>"%HOST%"</code>, der Variablen <code>tl_host</code> oder, falls keine vorhanden ist, der Adresse der aktuellen Anfrage sowie deren Kontextpfad <code>"%APP_CONTEXT%"</code>), der Seite und der Sperre der Einladung im Anfrageparameter <code>"invitation"</code>, z. B. <code>https://app.example.com/app/servlet/LayoutServlet?invitation=0123abcd-...</code>. Bei einer konfigurierten öffentlichen Adresse ist der Link nicht von einer aktuellen Anfrage abhängig und kann in jedem Kontext erstellt werden, z. B. über ein zeitgesteuertes Skript. </p>
com.top_logic.security.selfservice.invitation.InvitationModule = Servicemodul für Einladungen
com.top_logic.security.selfservice.invitation.InvitationModule.Config.authentication-device = Authentifizierungsgerät
com.top_logic.security.selfservice.invitation.InvitationModule.Config.authentication-device.tooltip = Die ID des <i>Authentifizierungsgeräts</i>, auf dem durch eine angenommene Einladung oder eine Registrierung das Konto erstellt wird.
com.top_logic.security.selfservice.invitation.InvitationModule.Config.code-validity = Gültigkeit des Codes
com.top_logic.security.selfservice.invitation.InvitationModule.Config.code-validity.tooltip = Wie lange ein Verifizierungscode gültig bleibt, nachdem er erstellt wurde.
com.top_logic.security.selfservice.invitation.InvitationModule.Config.invitation-link = Einladungslink
com.top_logic.security.selfservice.invitation.InvitationModule.Config.invitation-link.tooltip = Der Link einer Einladung, die Seite der Anwendung, auf der die eingeladene Person die Einladung annimmt. <p> Standardmäßig führt der Link zur Anmeldung der klassischen Benutzeroberfläche. </p>
com.top_logic.security.selfservice.invitation.InvitationModule.Config.invitation-mail = Einladungsmail
com.top_logic.security.selfservice.invitation.InvitationModule.Config.invitation-mail.tooltip = Der TL-Script-Ausdruck, der die Einladungs-E-Mail versendet. <p> Der Ausdruck wird mit dem <i>Einladungsobjekt</i> als erstem Argument, dem Anwendungstitel als zweitem Argument, dem Einladungslink als drittem Argument sowie dem Betreff und dem Inhalt der E-Mail als viertem und fünftem Argument aufgerufen. Betreff und Inhalt werden ungefüllt übergeben; der Ausdruck füllt sie mit dem Anwendungstitel und dem Link und kann weitere Informationen hinzufügen. </p> <p> Der Ausdruck wird in der Sprache der Einladung ausgeführt, oder in der Standardsprache der Anwendung, wenn die Einladung keine hat, sodass <code>localize()</code> die Texte in dieser Sprache schreibt. </p>
com.top_logic.security.selfservice.invitation.InvitationModule.Config.invitation-text = Text der Einladungs-E-Mail
com.top_logic.security.selfservice.invitation.InvitationModule.Config.invitation-text.tooltip = Der Betreff und der Inhalt der Einladungs-E-Mail. <p> In beiden Texten steht <code>{0}</code> für den Titel der Anwendung und <code>{1}</code> für den Link zur Einladung. </p>
com.top_logic.security.selfservice.invitation.InvitationModule.Config.invitation-validity = Gültigkeitsdauer der Einladung
com.top_logic.security.selfservice.invitation.InvitationModule.Config.invitation-validity.tooltip = Wie lange eine Einladung nach ihrer Erstellung oder erneuten Versendung noch angenommen werden kann.
com.top_logic.security.selfservice.invitation.InvitationModule.Config.password-reset-timeout = Zeitüberschreitung beim Zurücksetzen des Passworts
com.top_logic.security.selfservice.invitation.InvitationModule.Config.password-reset-timeout.tooltip = Zeit in Millisekunden, wie lange eine Anforderung zum Zurücksetzen des Passworts gültig ist.
com.top_logic.security.selfservice.invitation.InvitationModule.Config.reset-mfa-mail = Multi-Faktor-Authentifizierung zurücksetzen Mail
com.top_logic.security.selfservice.invitation.InvitationModule.Config.reset-mfa-mail.tooltip = Der TL-Script-Ausdruck, der eine E-Mail versendet, wenn ein Zurücksetzen der Multi-Faktor-Authentifizierung angefordert wird. <p> Der Ausdruck wird mit der E-Mail-Adresse als erstem Argument, dem Anwendungstitel als zweitem Argument, dem Rücksetzcode als drittem Argument sowie dem Betreff und dem Inhalt der E-Mail als viertem und fünftem Argument aufgerufen. Betreff und Inhalt werden ungefüllt übergeben; der Ausdruck füllt sie mit dem Anwendungstitel und dem Code und kann weitere Informationen hinzufügen. </p> <p> Der Ausdruck wird in der Sprache des Zugangs ausgeführt, oder in der Standardsprache der Anwendung, wenn der Zugang keine hat, sodass <code>localize()</code> die Texte in dieser Sprache schreibt. </p>
com.top_logic.security.selfservice.invitation.InvitationModule.Config.reset-mfa-text = Text der E-Mail zum Zurücksetzen der Multi-Faktor-Authentifizierung
com.top_logic.security.selfservice.invitation.InvitationModule.Config.reset-mfa-text.tooltip = Betreff und Inhalt der E-Mail, die versendet wird, wenn das Zurücksetzen der Multi-Faktor-Authentifizierung angefordert wird. <p> In beiden Texten steht <code>{0}</code> für den Titel der Anwendung und <code>{1}</code> für den Rücksetzcode. </p>
com.top_logic.security.selfservice.invitation.InvitationModule.Config.reset-password-mail = Passwort zurücksetzen Mail
com.top_logic.security.selfservice.invitation.InvitationModule.Config.reset-password-mail.tooltip = Der TL-Script-Ausdruck, der eine E-Mail versendet, wenn eine Passwort-Zurücksetzung angefordert wird. <p> Der Ausdruck wird mit der E-Mail-Adresse als erstem Argument, dem Anwendungstitel als zweitem Argument, dem Rücksetzcode als drittem Argument sowie dem Betreff und dem Inhalt der E-Mail als viertem und fünftem Argument aufgerufen. Betreff und Inhalt werden ungefüllt übergeben; der Ausdruck füllt sie mit dem Anwendungstitel und dem Code und kann weitere Informationen hinzufügen. </p> <p> Der Ausdruck wird in der Sprache des Zugangs ausgeführt, oder in der Standardsprache der Anwendung, wenn der Zugang keine hat, sodass <code>localize()</code> die Texte in dieser Sprache schreibt. </p>
com.top_logic.security.selfservice.invitation.InvitationModule.Config.reset-password-text = Text der E-Mail zum Zurücksetzen des Passworts
com.top_logic.security.selfservice.invitation.InvitationModule.Config.reset-password-text.tooltip = Der Betreff und der Inhalt der E-Mail, die bei einer Anfrage zur Passwort-Zurücksetzung versendet wird. <p> In beiden Texten steht <code>{0}</code> für den Titel der Anwendung und <code>{1}</code> für den Rücksetzcode. </p>
com.top_logic.security.selfservice.invitation.InvitationModule.Config.self-registration = Selbstregistrierung
com.top_logic.security.selfservice.invitation.InvitationModule.Config.self-registration.tooltip = Ob und wie Besucher ohne Einladung ein eigenes Konto anlegen können.
com.top_logic.security.selfservice.invitation.InvitationModule.Config.verification-code-size = Größe des Verifizierungscodes
com.top_logic.security.selfservice.invitation.InvitationModule.Config.verification-code-size.tooltip = Die Anzahl der Ziffern, die zur Erstellung eines Prüfcodes verwendet werden.
com.top_logic.security.selfservice.invitation.InvitationModule.Config.verification-mail = Überprüfungsmail
com.top_logic.security.selfservice.invitation.InvitationModule.Config.verification-mail.tooltip = Der TL-Script-Ausdruck, der die Bestätigungs-E-Mail versendet. <p> Der Ausdruck wird mit dem <i>Einladungsobjekt</i> als erstem Argument, dem Anwendungstitel als zweitem Argument, dem Bestätigungscode als drittem Argument sowie dem Betreff und dem Inhalt der E-Mail als viertem und fünftem Argument aufgerufen. Betreff und Inhalt werden ungefüllt übergeben; der Ausdruck füllt sie mit dem Anwendungstitel und dem Code und kann weitere Informationen hinzufügen. </p> <p> Der Ausdruck wird in der Sprache der Einladung ausgeführt, oder in der Standardsprache der Anwendung, wenn die Einladung keine hat, sodass <code>localize()</code> die Texte in dieser Sprache schreibt. </p>
com.top_logic.security.selfservice.invitation.InvitationModule.Config.verification-text = Text der Bestätigungs-E-Mail
com.top_logic.security.selfservice.invitation.InvitationModule.Config.verification-text.tooltip = Der Betreff und der Inhalt der Bestätigungs-E-Mail. <p> In beiden Texten steht <code>{0}</code> für den Titel der Anwendung und <code>{1}</code> für den Bestätigungscode. </p>
com.top_logic.security.selfservice.invitation.InvitationModule.tooltip = <i>Konfigurierte verwaltete Klasse</i> für Elemente in <code>"tl.security.selfservice"</code>. <p> Bietet die UI-unabhängigen Vorgänge des <i>Einladungslebenszyklus</i>: Eine Einladung wird erstellt und versendet, sie bleibt offen, bis sie abläuft oder angenommen wird, und eine offene oder abgelaufene Einladung kann erneuert oder erneut versendet werden. Eine angenommene Einladung wird als Datensatz des daraus erstellten Kontos gespeichert. </p> <p> Besucher registrieren sich ohne Einladung über die Selbstregistrierung. </p>
com.top_logic.security.selfservice.invitation.SelfRegistration$Config = Selbstregistrierung
com.top_logic.security.selfservice.invitation.SelfRegistration$Config.tooltip = Konfiguration der <i>Selbstregistrierung</i>, die Option <i>„Selbstregistrierung“</i> (<i>Konfiguration des Einladungsmoduls</i>).
com.top_logic.security.selfservice.invitation.SelfRegistration.Config.approval-mail = Freigabe-Mail
com.top_logic.security.selfservice.invitation.SelfRegistration.Config.approval-mail.tooltip = Der TL-Script-Ausdruck, der einer registrierten Person mitteilt, dass die Registrierung freigegeben wurde. <p> Der Ausdruck wird mit der E-Mail-Adresse der Registrierung als erstem Argument, dem Titel der Anwendung als zweitem Argument und der Adresse der Anmeldeseite der Anwendung als drittem Argument aufgerufen. Er wird ohne Zugriffsprüfungen ausgeführt: Der Empfänger ist durch die Registrierung festgelegt. Ohne Wert wird keine E-Mail versendet. </p>
com.top_logic.security.selfservice.invitation.SelfRegistration.Config.callback = Rückruffunktion
com.top_logic.security.selfservice.invitation.SelfRegistration.Config.callback.tooltip = Funktion, die bei jedem registrierten Konto aufgerufen wird, bevor die Registrierung gespeichert wird. <p> Die Funktion weist dem Konto beispielsweise Rollen oder Gruppen zu. Sie gibt <code>null</code> zurück, um das Konto zu akzeptieren, oder einen internationalisierbaren Wert als Grund für die Ablehnung, wodurch die Registrierung rückgängig gemacht wird. Sie wird ohne Zugriffsprüfungen ausgeführt, da niemand angemeldet ist. </p>
com.top_logic.security.selfservice.invitation.SelfRegistration.Config.captcha = Captcha
com.top_logic.security.selfservice.invitation.SelfRegistration.Config.captcha.tooltip = Ob ein Besucher ein Captcha lösen muss, um einen Bestätigungscode anzufordern. <p> Das Captcha wird vom <i>Captcha-Dienst</i> des Moduls <code>tl-security-captcha</code> überprüft, der zu diesem Zeitpunkt aktiv sein muss. </p>
com.top_logic.security.selfservice.invitation.SelfRegistration.Config.mode = Modus
com.top_logic.security.selfservice.invitation.SelfRegistration.Config.mode.tooltip = Ob Besucher ein eigenes Konto anlegen können und ob ein Administrator es freigeben muss, bevor es sich anmelden kann.
com.top_logic.security.selfservice.invitation.SelfRegistration.Config.registration-exists-mail = Mail bei vorhandenem Konto
com.top_logic.security.selfservice.invitation.SelfRegistration.Config.registration-exists-mail.tooltip = Der TL-Script-Ausdruck, der anstelle des Bestätigungscodes gesendet wird, wenn bereits ein Konto mit dieser Adresse existiert. <p> Der Ausdruck wird mit der E-Mail-Adresse als erstem Argument und dem Anwendungstitel als zweitem Argument aufgerufen. Er wird ohne Zugriffsprüfung ausgeführt, da niemand angemeldet ist. Die Antwort <code>false</code> bedeutet, dass die E-Mail nicht gesendet wurde. </p>
com.top_logic.security.selfservice.invitation.SelfRegistration.Config.registration-mail = Registrierungs-Mail
com.top_logic.security.selfservice.invitation.SelfRegistration.Config.registration-mail.tooltip = Der TL-Script-Ausdruck zum Versenden des Bestätigungscodes bei einer Registrierung. <p> Der Ausdruck wird mit der E-Mail-Adresse als erstem Argument, dem Anwendungstitel als zweitem Argument und dem Bestätigungscode als drittem Argument aufgerufen. Er wird ohne Zugriffsprüfung ausgeführt, da niemand angemeldet ist. Die Antwort <code>false</code> bedeutet, dass die E-Mail nicht versendet wurde. </p>
com.top_logic.security.selfservice.invitation.SelfRegistrationMode = Modus zur Selbstregistrierung
com.top_logic.security.selfservice.invitation.SelfRegistrationMode.APPROVAL = Mit Freigabe
com.top_logic.security.selfservice.invitation.SelfRegistrationMode.APPROVAL.tooltip = Ein registriertes Konto ist gesperrt, bis ein Administrator die Registrierung freigibt.
com.top_logic.security.selfservice.invitation.SelfRegistrationMode.DIRECT = Direkt
com.top_logic.security.selfservice.invitation.SelfRegistrationMode.DIRECT.tooltip = Ein registriertes Konto kann sich sofort anmelden.
com.top_logic.security.selfservice.invitation.SelfRegistrationMode.OFF = Aus
com.top_logic.security.selfservice.invitation.SelfRegistrationMode.OFF.tooltip = Besucher können kein Konto registrieren.
com.top_logic.security.selfservice.invitation.SelfRegistrationMode.tooltip = Ob und wie Besucher ohne Einladung ein eigenes Konto anlegen können.
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.emailRefusal = Ablehnung einer E-Mail-Adresse
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.emailRefusal.param.email.tooltip = Die zu überprüfende Adresse.
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.emailRefusal.return = Die Meldung, dass die Adresse ungültig ist; <code>null</code>, wenn sie gültig ist.
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.emailRefusal.tooltip = Warum ein Wert nicht als E-Mail-Adresse einer Einladung oder einer Registrierung akzeptiert wird.
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.refusal = Ablehnung einer Einladung
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.refusal.param.token.tooltip = Das Token aus dem Einladungslink.
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.refusal.return = Die Meldung, dass es keine Einladung mit dem Token gibt oder dass sie abgelaufen ist oder angenommen wurde; <code>null</code>, wenn die Einladung offen ist.
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.refusal.tooltip = Der Grund, warum die Einladung eines Links nicht angenommen werden kann. <p> Die Seite, zu der ein Einladungslink führt, zeigt den Grund dem Besucher, der nicht angemeldet ist. Die Suche hängt nicht von Zugriffsrechten ab: Das Token des Links ist der Nachweis. </p>
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.renew = Einladung erneuern
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.renew.param.invitation.tooltip = Die zu erneuernde Einladung.
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.renew.tooltip = Gibt einer offenen oder abgelaufenen Einladung einen neuen Link und ein neues Ablaufdatum, ohne sie zu versenden. <p> Der bisherige Link der Einladung ist danach ungültig. Eine angenommene Einladung wird zurückgewiesen. </p>
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.resend = Einladung erneut versenden
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.resend.param.invitation.tooltip = Die erneut zu versendende Einladung.
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.resend.return = Das Ergebnis des Skripts für die Einladungs-E-Mail, standardmäßig ob die E-Mail versendet wurde.
com.top_logic.security.selfservice.invitation.script.InvitationFunctions.resend.tooltip = Versendet eine offene oder abgelaufene Einladung erneut. <p> Eine offene Einladung wird mit ihrem Link versendet, eine abgelaufene Einladung wird zuerst erneuert und dann mit einem neuen Link und einem neuen Ablaufdatum versendet. Eine angenommene Einladung wird zurückgewiesen. </p>
com.top_logic.security.selfservice.invitation.script.RegistrationFunctions.approve = Registrierung freigeben
com.top_logic.security.selfservice.invitation.script.RegistrationFunctions.approve.param.registration.tooltip = Die freizugebende Registrierung.
com.top_logic.security.selfservice.invitation.script.RegistrationFunctions.approve.return = Das Ergebnis des Skripts der Freigabe-Mail, standardmäßig ob die Mail versendet wurde; <code>null</code>, wenn keine Freigabe-Mail konfiguriert ist.
com.top_logic.security.selfservice.invitation.script.RegistrationFunctions.approve.tooltip = Gibt eine ausstehende Registrierung frei: Entsperrt das registrierte Konto und versendet die Freigabe-Mail. <p> Eine freigegebene Registrierung wird zurückgewiesen. </p>
com.top_logic.security.selfservice.invitation.script.RegistrationFunctions.captcha = Registrierung erfordert Captcha
com.top_logic.security.selfservice.invitation.script.RegistrationFunctions.captcha.return = <code>true</code>, wenn für die Selbstregistrierung ein Captcha erforderlich ist.
com.top_logic.security.selfservice.invitation.script.RegistrationFunctions.captcha.tooltip = Ob ein Besucher, der ein Konto registriert, ein Captcha lösen muss, bevor ein Bestätigungscode gesendet wird.
com.top_logic.security.selfservice.invitation.script.RegistrationFunctions.enabled = Registrierung aktiviert
com.top_logic.security.selfservice.invitation.script.RegistrationFunctions.enabled.return = <code>true</code>, wenn die Registrierung aktiviert ist und die Anwendung E-Mails versenden kann.
com.top_logic.security.selfservice.invitation.script.RegistrationFunctions.enabled.tooltip = Ob Besucher in dieser Anwendung ein eigenes Konto anlegen können.
com.top_logic.security.selfservice.invitation.script.RegistrationFunctions.pending = Ausstehende Registrierung
com.top_logic.security.selfservice.invitation.script.RegistrationFunctions.pending.param.account.tooltip = Das Konto.
com.top_logic.security.selfservice.invitation.script.RegistrationFunctions.pending.return = Die Registrierung des Kontos ist noch ausstehend; <code>null</code>, wenn das Konto nicht vom Eigentümer registriert wurde, die Registrierung genehmigt wurde oder es keine Sperre für das Konto gibt.
com.top_logic.security.selfservice.invitation.script.RegistrationFunctions.pending.tooltip = Die Registrierung eines Kontos, das auf seine Freigabe wartet.
com.top_logic.security.selfservice.invitation.script.SendInvitation$Builder = Erbauer
com.top_logic.security.selfservice.invitation.script.SendInvitation$Builder.tooltip = <i>Erbauer der Methode</i> zum <i>Versenden von Einladungen</i>.
