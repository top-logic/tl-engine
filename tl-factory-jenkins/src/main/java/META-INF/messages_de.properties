com.top_logic.factory.jenkins.JenkinsCIProvider = Jenkins-CI-Anbieter
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.base-url = Basis-URL
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.base-url.tooltip = Die URL des Jenkins-Servers, z. B. https://jenkins.example.com/. <p> Die URL, unter der seine Weboberfläche bereitgestellt wird, seine „Jenkins-URL“. Die Seiten der Jobs und Builds, die der Anbieter meldet, liegen darunter. </p>
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.credentials = Anmeldedaten
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.credentials.tooltip = Wie die Anfragen an Jenkins authentifiziert werden. <p> Falls nicht festgelegt, mit Basic-Authentifizierung des Benutzers und des API-Tokens aus dem Secret <code>"tl_factory_jenkins_token"</code>. </p>
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.folder = Ordner
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.folder.tooltip = Der Ordner der Jobs, verschachtelte Ordner durch Schrägstriche getrennt; leer für die oberste Ebene von Jenkins. <p> Der Ordner wird angelegt, falls er nicht existiert. </p>
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.job-template = Job-Vorlage
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.job-template.tooltip = Die Ressource der Webanwendung mit der Konfiguration eines Jobs mit den Platzhaltern <code>"@DESCRIPTION@"</code>, <code>"@REPOSITORY_URL@"</code>, <code>"@CREDENTIALS_ID@"</code>, <code>"@BRANCH@"</code> und <code>"@SCRIPT_PATH@"</code>. <p> Die Werte werden für XML-Text und Attributwerte maskiert eingesetzt. </p>
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.queue-wait = Wartezeit in der Warteschlange
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.queue-wait.tooltip = Wie lange der Start eines Builds darauf wartet, dass der Build die Warteschlange von Jenkins verlässt und seine Nummer erhält.
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.scm-credentials-id = SCM-Anmeldedaten-ID
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.scm-credentials-id.tooltip = Die ID der Jenkins-Anmeldedaten, mit denen die Jobs die Repositorys auschecken; leer für keine, z. B. für öffentliche Repositorys. <p> Anmeldedaten in Jenkins mit Lesezugriff auf die Repositorys des Git-Hosting-Dienstes, z. B. ein Benutzername mit einem Zugriffstoken. Sie werden in Jenkins eingerichtet; die Steueranwendung nennt nur ihre ID. </p>
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.script-path = Skriptpfad
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.script-path.tooltip = Der Pfad der Pipeline-Definition in einem Repository, die die Jobs ausführen.
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.timeout = Timeout
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.timeout.tooltip = Wie lange der Aufbau einer Verbindung zu Jenkins und jede Anfrage dauern dürfen.
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.user = Benutzer
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.user.tooltip = Der Jenkins-Benutzer, unter dem die Anfragen gestellt werden, sofern keine Anmeldedaten konfiguriert sind. <p> Die Anfragen werden dann mit diesem Benutzer und dem API-Token aus dem Secret <code>"tl_factory_jenkins_token"</code> authentifiziert. </p>
com.top_logic.factory.jenkins.JenkinsCIProvider.tooltip = <i>CI-Berechnung</i> eines <a href="https://www.jenkins.io/">Jenkins</a> -Servers. <p> Der Job eines Projekt-Repositorys ist ein Pipeline-Job („Pipeline-Skript aus SCM“) im Ordner <i>„Folder“</i>, unterhalb eines Ordners, der nach dem Eigentümer des Repositorys und nach dem Repository selbst benannt ist: folder/owner/name. Fehlende Ordner werden angelegt. Der Job wird anhand der Jobvorlage erstellt: Er checkt den Standard-Branch des Repositorys über dessen Klon-URL mit den Jenkins-Anmeldedaten <i>„Scm credentials ID“</i> aus und führt die Pipeline-Definition unter <i>„Script path“</i> aus. Die Steuerungsanwendung sendet niemals Git-Anmeldedaten an Jenkins; die Anmeldedaten mit Lesezugriff auf das Git-Hosting werden in Jenkins eingerichtet. </p> <p> Die Anfragen werden mit den konfigurierten Anmeldedaten authentifiziert; ohne diese erfolgt die Authentifizierung über die Basic-Authentifizierung des Benutzers <i>„User“</i> und des API-Tokens im Secret <code>"tl_factory_jenkins_token"</code>“. Jenkins fordert bei einer mit einem API-Token authentifizierten Anfrage keinen CSRF-Token an, sodass der Anbieter keinen abruft; Anmeldedaten mit einem Passwort anstelle eines API-Tokens werden von Jenkins bei den entsprechenden Anfragen abgelehnt. Eine mit 401 abgelehnte Anfrage wird einmal mit neuen Anmeldedaten wiederholt. </p><h2>Berechtigungen</h2> <p> Der Benutzer benötigt die Berechtigungen „Overall/Read“, „Job/Create“, „Job/Configure“, „Job/Read“ und „Job/Build“ im Ordner der Jobs (sowie „Job/Create“ im übergeordneten Ordner, um den Job zu erstellen) sowie das Recht, die SCM-Anmeldedaten in den Jobs zu verwenden. </p>
