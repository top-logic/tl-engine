class.com.top_logic.ai.mcp.server.authentication.I18NConstants.ERROR_INTERACTION_ALREADY_BOUND = Diese Anfrage wird abgewiesen: Ihr Thread trägt bereits eine TopLogic-Interaktion, so dass das authentifizierte Konto nicht gebunden werden konnte und die Anfrage als jemand anderes gehandelt hätte.
class.com.top_logic.ai.mcp.server.authentication.I18NConstants.ERROR_INTERACTION_ALREADY_BOUND.help = Die Anfrage traf auf einem Thread ein, der bereits eine TopLogic-Interaktion trägt.
class.com.top_logic.ai.mcp.server.authentication.I18NConstants.ERROR_NO_ACCOUNT_FOR_CREDENTIAL = Authentifiziert, aber diese Zugangsdaten benennen kein Anwendungskonto. Der MCP-Endpunkt handelt als das authentifizierte Konto und niemals im Systemkontext. Vergeben Sie daher eine user-id für das Secret - am besten ein eigenes Dienstkonto.
class.com.top_logic.ai.mcp.server.authentication.I18NConstants.ERROR_NO_ACCOUNT_FOR_CREDENTIAL.help = Der Aufrufer hat sich authentifiziert, aber die Zugangsdaten sind keinem Anwendungskonto zugeordnet.
class.com.top_logic.ai.mcp.server.authentication.I18NConstants.ERROR_SESSION_BELONGS_TO_ANOTHER_ACCOUNT = Diese mcp-session-id gehört zu einem anderen Konto. Eine MCP-Sitzung bleibt bei dem Konto, das sie eröffnet hat. Eröffnen Sie mit einer initialize-Anfrage eine eigene Sitzung.
class.com.top_logic.ai.mcp.server.authentication.I18NConstants.ERROR_SESSION_BELONGS_TO_ANOTHER_ACCOUNT.help = Ein zweites Konto hat versucht, eine MCP-Sitzung zu verwenden, die ein anderes Konto eröffnet hat.
com.top_logic.ai.mcp.server.MCPServerService = MCP-Serverdienst
com.top_logic.ai.mcp.server.MCPServerService.Config.allowed-hosts = Zulässige Hosts
com.top_logic.ai.mcp.server.MCPServerService.Config.allowed-hosts.tooltip = Die Hostnamen, auf die dieser Endpunkt reagiert, zum Beispiel mcp.example.com oder localhost:*. <p> Ist diese Option gesetzt, wird eine Anfrage, deren „Host“-Header nicht in dieser Liste enthalten ist, mit dem Status 421 abgelehnt. Leer prüft keinen „Host“. „:*“ passt auf jeden Port. </p>
com.top_logic.ai.mcp.server.MCPServerService.Config.allowed-origins = Zulässige Origins
com.top_logic.ai.mcp.server.MCPServerService.Config.allowed-origins.tooltip = Die Origins, von denen aus ein Browser diesen Endpunkt aufrufen darf, zum Beispiel https://app.example.com oder http://localhost:*. <p> Eine Anfrage, die einen „Origin“-Header enthält, der nicht in dieser Liste aufgeführt ist, wird mit dem Status 403 abgelehnt. Dadurch wird verhindert, dass eine Webseite den Endpunkt über DNS-Rebinding erreicht. Eine Anfrage ohne „Origin“-Header – wie bei jedem Befehlszeilen- und Desktop-Client – ist davon nicht betroffen. Leer lehnt jede Anfrage ab, die einen „Origin“-Header enthält. „:*“ passt auf jeden Port. </p>
com.top_logic.ai.mcp.server.MCPServerService.Config.authentications.tooltip = Wie ein Aufrufer des MCP-Endpunkts nachweist, wer er ist. <p> Konfigurieren Sie mindestens eine, sonst weist der Endpunkt jede Anfrage ab: Er bedient nichts, was er keinem Konto zuordnen kann. Ein persönliches Zugriffstoken hat eine Person für ihr eigenes Konto erstellt, HTTP Basic authentifiziert gegen die Passwortdatenbank des Kontos selbst, ein API-Key ordnet einen Schlüssel einem benannten Konto zu, und ein Bearer-Token wird gegen den Autorisierungsserver geprüft, den die Installation betreibt. Ein Aufrufer darf eines der konfigurierten Verfahren verwenden. </p> <p> Bevorzugen Sie persönliche Zugriffstokens, wo Personen ihren eigenen Client verbinden, und einen API-Key für ein Dienstkonto gegenüber dem Passwort einer echten Person: Beide sind einzeln widerrufbar, und sie halten einen Login aus einer Client-Konfigurationsdatei heraus. </p>
com.top_logic.ai.mcp.server.MCPServerService.Config.dynamic-resources = Dynamische Ressourcen
com.top_logic.ai.mcp.server.MCPServerService.Config.dynamic-resources.tooltip = Liste der konfigurierbaren dynamischen Ressourcen. <p> Jede Ressource wird nach dem polymorphen Konfigurationsmuster konfiguriert, so dass verschiedene Implementierungen MCP-Ressourcen auf unterschiedliche Weise bereitstellen können: </p> <ul> <li><i>Konfigurierbare Ressourcenvorlage</i> - Verwendet TL-Script-Ausdrücke zur Berechnung des Inhalts</li> <li>Zukünftige Implementierungen können weitere Ressourcentypen hinzufügen (statisch, datenbankgesteuert usw.)</li> </ul>
com.top_logic.ai.mcp.server.MCPServerService.Config.exposed-tools = Veröffentlichte Tools
com.top_logic.ai.mcp.server.MCPServerService.Config.exposed-tools.tooltip = Die Tools der Anwendung, die ein MCP-Client sieht und aufrufen kann. <p> Es wird nichts veröffentlicht, was hier nicht aufgeführt ist; eine leere Liste veröffentlicht also kein Tool. Ein Eintrag bezeichnet ein einzelnes Tool – und kann diesem den Namen, den Titel und die Beschreibung zuweisen, die ein externes Modell ausliest – oder eine ganze Tool-Gruppe. Ein nicht aufgeführtes Tool ist einem MCP-Client unbekannt. Ein aufgeführtes Tool wird weiterhin bei jedem Aufruf anhand der Rollen des Aufrufers und der Hintergrund-Zulassungsliste autorisiert. </p>
com.top_logic.ai.mcp.server.MCPServerService.Config.instructions = Anweisungen
com.top_logic.ai.mcp.server.MCPServerService.Config.instructions.tooltip = Was ein MCP-Client beim Verbinden über diesen Server erfährt. <p> Wird in der Antwort auf initialize gesendet; Clients stellen es ihrem Modell voran. Geben Sie an, um welche Anwendung es sich handelt, welches veröffentlichte Tool für welche Zwecke verwendet werden soll und wie dessen Bezeichner aussehen. Ein leerer Wert sendet keine Anweisungen. </p>
com.top_logic.ai.mcp.server.MCPServerService.Config.keep-alive-interval = Keep-alive-Intervall
com.top_logic.ai.mcp.server.MCPServerService.Config.keep-alive-interval.tooltip = Keep-Alive-Intervall in Sekunden: Wie oft jede MCP-Sitzung angepingt wird. <p> Der Ping hält den Ereignisstrom eines Clients über Proxys offen und ermittelt die Sitzungen, auf die kein Client mehr antwortet (siehe <i>„Timeout bei inaktiver Sitzung“</i>). Der Wert 0 deaktiviert beides. </p> <p>Standard: 30 Sekunden</p>
com.top_logic.ai.mcp.server.MCPServerService.Config.secrets = Secrets
com.top_logic.ai.mcp.server.MCPServerService.Config.secrets.tooltip = Die Secrets, gegen die die konfigurierten Authentifizierungen einen Aufrufer prüfen. <p> Jedes Secret benennt die Domain der Authentifizierung, zu der es gehört. Ein Secret muss das Konto benennen, als das die Anfrage dann handelt: Dieser Endpunkt verarbeitet keine Anfrage im Systemkontext, daher wird ein Secret ohne Konto zur Laufzeit abgewiesen. </p>
com.top_logic.ai.mcp.server.MCPServerService.Config.server-name = Name des Servers
com.top_logic.ai.mcp.server.MCPServerService.Config.server-name.tooltip = Der Name des MCP-Servers.
com.top_logic.ai.mcp.server.MCPServerService.Config.server-version = Server-Version
com.top_logic.ai.mcp.server.MCPServerService.Config.server-version.tooltip = Die Version des MCP-Servers.
com.top_logic.ai.mcp.server.MCPServerService.Config.session-idle-timeout = Zeitlimit für inaktive Sitzungen
com.top_logic.ai.mcp.server.MCPServerService.Config.session-idle-timeout.tooltip = Wie lange (in Sekunden) bleibt eine Sitzung, die nicht auf einen Ping antwortet, nach der letzten Anfrage bestehen, in der sie genannt wurde? <p> Ein Client, der seine Anfragen per POST sendet und den Ereignisstrom nie öffnet, kann nicht auf einen Ping antworten, und die meisten dieser Clients löschen ihre Sitzung nie. Eine solche Sitzung wird entfernt, sobald sie so lange nicht geantwortet hat und keine Anfrage sie in diesem Zeitraum aufgerufen hat; der Client erhält daraufhin einen 404-Fehler und startet eine neue Sitzung. </p> <p>Standardwert: 1800 Sekunden (30 Minuten)</p>
com.top_logic.ai.mcp.server.MCPServerService.tooltip = TopLogic-Dienst, der einen MCP-Server (Model Context Protocol) bereitstellt, um anwendungsspezifische APIs über den HTTP-Transport für KI-Modelle zugänglich zu machen. <p> Dieser Dienst initialisiert beim Start der Anwendung einen MCP-Server unter Verwendung des MCP-Protokolls über HTTP und sorgt beim Herunterfahren für eine ordnungsgemäße Bereinigung. Der Server kann über die TopLogic-Anwendungskonfiguration konfiguriert werden. </p> <p> Der Dienst stellt HTTP-Endpunkte bereit (registriert in „web-fragment.xml“ unter „/mcp/*“), die das MCP-Protokoll für die bidirektionale Kommunikation zwischen KI-Clients und der TopLogic-Anwendung implementieren. Der MCP-Authentifizierungsfilter schützt diesen Pfad: Er authentifiziert jede Anfrage und öffnet den TLContext des ermittelten Kontos, in dem die Protokoll-Handler anschließend ausgeführt werden. </p> <p><b>Dieser Dienst ist in der mit diesem Modul gelieferten Konfiguration deaktiviert</b>, und eine Anwendung, die ihn aktiviert, muss festlegen, wer darauf zugreifen darf: /mcp/* bedient keine Anfragen, die nicht einem Konto zugeordnet werden können, und akzeptiert nur die von der Anwendung konfigurierten Authentifizierungen. Werden keine konfiguriert, werden alle Anfragen abgelehnt. Siehe doc/security/mcp-endpoint.md und Issue #261. Solange der Dienst deaktiviert ist, antwortet das MCPTransportServlet auf den gesamten Pfad /mcp/* mit einem 503-Fehler. </p> <p> Der Dienst nutzt <i>den Servlet-Kontext</i>, um beim Start den Kontextpfad der Anwendung zu ermitteln, und stellt so sicher, dass die an Clients gesendeten Endpunkt-URLs unabhängig von der Bereitstellungskonfiguration den korrekten Kontextpfad enthalten. </p>
com.top_logic.ai.mcp.server.dynamic.ConfigurableResourceTemplate = Konfigurierbare Ressourcenvorlage
com.top_logic.ai.mcp.server.dynamic.ConfigurableResourceTemplate.tooltip = Implementierung einer <i>dynamischen Ressource</i>, die TL-Script-Ausdrücke zur dynamischen Erzeugung von Ressourceninhalten verwendet. <p> Diese Klasse überbrückt die konfigurationsbasierte Definition der Ressourcenvorlage<i>(Konfiguration der Ressourcenvorlage</i>) mit dem Mechanismus des MCP-Servers zur Handhabung von Ressourcen. Sie extrahiert Parameter aus dem URI, übergibt sie an den TL-Script-Ausdruck und gibt den berechneten Inhalt als MCP-Ressource zurück. </p>
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.content = Inhalt
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.content.tooltip = TL-Script-Ausdruck, um den Inhalt der Ressource zu berechnen. <p> Der Ausdruck hat Zugriff auf Parameter, die aus der URI-Vorlage als implizite Variablen extrahiert wurden. Der Ausdruck wird automatisch in eine Funktion verpackt, die Parameter deklariert, die mit den Parameternamen der URI-Vorlage übereinstimmen, so dass sie innerhalb des Ausdrucks verfügbar sind. </p> <p> Wenn die URI-Vorlage beispielsweise "myapp:{version}" lautet und eine Anfrage für "myapp://item/12345/version/v2" eingeht, wird der Ausdruck so ausgeführt, als wäre er eingeschlossen in: itemId -&gt; version -&gt; yourExpression, wobei $itemId den Wert "12345" und $version den Wert "v2" hat. </p> <p> Der Ausdruck kann verschiedene Typen zurückgeben, die wie folgt behandelt werden: </p> <ul> <li><i>Sammlung</i> - Jedes Element wird in ein separates Element <i>des Ressourceninhalts</i> in der Ergebnisliste umgewandelt, so dass eine einzige Ressourcenvorlage mehrere Ressourceninhalte zurückgeben kann</li> <li><i>binäre Daten</i> - Der Inhaltstyp wird geprüft: textbasierte Typen (z. B. text/*, application/json, application/xml) werden als Text ausgegeben, während binäre Typen (z. B. application/pdf, image/*) base64-kodiert und als Blob ausgegeben werden</li> <li><i>map</i> - Serialisiert als JSON mit dem Inhaltstyp application/json</li> <li><i>HTML-Fragment</i> - Wird in einen HTML-String mit dem Inhaltstyp text/html umgewandelt.</li> <li>Jeder andere Wert - wird mit toString() in einen String mit dem Inhaltstyp text/plain umgewandelt</li> </ul> <p> Wenn ein MIME-Typ explizit über <i>MIME-Typ</i> konfiguriert wird, überschreibt er den Standard-Inhaltstyp für den Rückgabetyp. </p> <p> Beispiel für einen einzelnen Parameter (URI-Vorlage: "myapp:{itemId}"): </p> <pre> $myService.getItem($itemId).toJson() </pre> <p> Beispiel für mehrere Parameter (URI-Vorlage: "myapp:{version}"): </p> <pre> $myService.getItem($itemId, $version).toJson() </pre> <p> Beispiel, das eine Map zurückgibt (wird als JSON serialisiert): </p> <pre> map("id" -&gt; $itemId, "data" -&gt; $myService.getItem($itemId)) </pre>
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.description = Beschreibung
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.description.tooltip = Beschreibung dessen, was diese Ressource bietet. <p> Sollte erklären, welche Daten die Ressource zurückgibt und welche Parameter sie erwartet. </p>
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.mime-type = MIME-Typ
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.mime-type.tooltip = MIME-Typ des Ressourceninhalts. <p> Übliche Werte: </p> <ul> <li>"application/json" - JSON-Daten</li> <li>"text/plain" - Einfacher Text</li> <li>"text/html" - HTML-Inhalt</li> <li>"text/markdown" - Markdown-Inhalt</li> </ul>
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.name = Name
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.name.tooltip = Vorlage für Ressourcennamen. <p> Kann Parameterplatzhalter wie "{itemId}" enthalten, die durch tatsächliche Werte aus dem URI ersetzt werden. </p>
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.title = Titel
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.title.tooltip = Von Menschen lesbarer Titel für die Ressource. <p> Dieser wird den Benutzern/Agenten angezeigt, die die verfügbaren Ressourcen durchsuchen. </p>
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.uri-template = URI-Vorlage
com.top_logic.ai.mcp.server.dynamic.ResourceTemplateConfig.uri-template.tooltip = URI-Vorlage mit Parameterplatzhaltern. <p> Die Vorlage verwendet das Format scheme:{param2}, wobei die Parameter in geschweifte Klammern eingeschlossen sind. Diese Parameter werden aus dem URI extrahiert und an den TL-Script-Ausdruck übergeben. </p> <p> Beispiel: "myapp:{itemId}" </p>
com.top_logic.ai.mcp.server.tools.ExposedTool = Veröffentlichtes Tool
com.top_logic.ai.mcp.server.tools.ExposedTool.description = Beschreibung
com.top_logic.ai.mcp.server.tools.ExposedTool.description.tooltip = Was das Tool tut, beschrieben für ein externes Modell. <p> Leer bedeutet die eigene Beschreibung des Tools, die für die anwendungsinternen Agenten verfasst ist und sich auf Elemente beziehen kann, die in einem externen Modell nicht vorhanden sind, wie beispielsweise die Auswahl in der Konversation oder andere Tools anhand ihrer internen Namen. </p>
com.top_logic.ai.mcp.server.tools.ExposedTool.group = Gruppe
com.top_logic.ai.mcp.server.tools.ExposedTool.group.tooltip = Die Tool-Gruppe, deren Tools veröffentlicht werden sollen – alle unter ihrem Standardnamen, -titel und ihrer Standardbeschreibung. <p> Ein Tool gehört zu der Gruppe, der es durch die Tool-Zugriffsrichtlinie der Agenten zugewiesen wird, oder zu der Gruppe, der es sich selbst zuordnet – dieselbe Gruppe, die einer Rolle gewährt wird. Lassen Sie dieses Feld leer, wenn der Eintrag stattdessen ein einzelnes Tool bezeichnet. </p>
com.top_logic.ai.mcp.server.tools.ExposedTool.name = Name
com.top_logic.ai.mcp.server.tools.ExposedTool.name.tooltip = Der Name, unter dem ein MCP-Client das Tool bezeichnet. <p> Maximal 64 Zeichen, bestehend aus Buchstaben, Ziffern, _ und -. Ist das Feld leer, wird der Registrierungsname des Tools verwendet: factory__tool. Verwenden Sie vorzugsweise einen kurzen Namen, der mit einem Verb beginnt und innerhalb der Anwendung eindeutig ist, zum Beispiel search_projects: Ein MCP-Client fügt diesem Namen sein eigenes Server-Präfix voran. </p>
com.top_logic.ai.mcp.server.tools.ExposedTool.title = Titel
com.top_logic.ai.mcp.server.tools.ExposedTool.title.tooltip = Der Name des Tools, den eine Person im MCP-Client sieht. <p> Leer bedeutet einen Titel, der aus dem Namen des Tools selbst abgeleitet wird (aus „listModules“ wird „List modules“). </p>
com.top_logic.ai.mcp.server.tools.ExposedTool.tool = Tool
com.top_logic.ai.mcp.server.tools.ExposedTool.tool.tooltip = Das zu veröffentlichende Tool mit seinem qualifizierten Namen (factory.tool). <p> Lassen Sie dieses Feld leer, wenn der Eintrag stattdessen eine Tool-Gruppe bezeichnet. </p>
com.top_logic.ai.mcp.server.tools.ExposedTool.tooltip = Ein Eintrag der vom MCP-Server veröffentlichten Tools: ein einzelnes Tool oder alle Tools einer Tool-Gruppe. <p> Ein Eintrag benennt entweder ein Tool oder eine Gruppe, niemals beides. Nur ein Tool-Eintrag darf Angaben dazu enthalten, wie das Tool veröffentlicht wird – seinen Namen, Titel und seine Beschreibung –, da diese ein einzelnes Tool beschreiben, während eine Gruppe viele Tools umfasst. Ein Tool, das durch einen eigenen Eintrag benannt wird und gleichzeitig Mitglied einer aufgeführten Gruppe ist, wird einmal veröffentlicht, wie es in seinem eigenen Eintrag angegeben ist. </p>
