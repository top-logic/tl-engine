com.top_logic.ai.chat.view.ChatConversationElement.tooltip = Deklaratives „ <chat-conversation/> “-Element: Das Transkript und das Eingabefeld als ein Anzeigeelement. <p> Führt die bisher getrennten Elemente „ <chat-thread/> “ und „ <chat-composer/> “ zusammen. Transkript und Eingabefeld befinden sich fast immer nebeneinander, daher bilden sie ein platzierbares Feld; eine Sitzungsliste (<chat-sessions/>) und eine Leiste (<chat-rail/>) bleiben getrennt, da diese tatsächlich unabhängig voneinander platziert werden sollen. Mehrere Chat-Elemente auf einer Seite nehmen über die „chat-id“ an derselben Unterhaltung teil. Der optionale Eingabekanal enthält die geöffnete „AgentSession“; der optionale „busy“-Kanal wird auf „true“ gesetzt, während der Agent arbeitet, sodass ein Host seine eigenen Befehle deaktivieren kann. </p>
