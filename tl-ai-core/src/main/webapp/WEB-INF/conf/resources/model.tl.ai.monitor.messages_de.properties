model.tl.ai.monitor = Agentenmonitor
model.tl.ai.monitor.Period = Zeitraum
model.tl.ai.monitor.Period.firstDay = Erster Tag der Achse
model.tl.ai.monitor.Period.firstDay.tooltip = Linker Rand eines Verlaufsdiagramms, als ganzer Tag: der Tag im Feld "Von".
model.tl.ai.monitor.Period.fromDay = Von
model.tl.ai.monitor.Period.fromDay.tooltip = Erster Tag des Zeitraums. Dieser Tag zählt vollständig mit. Eine Auswahl wie "30 Tage" trägt ihn ein; von Hand geändert, wird daraus ein benutzerdefinierter Zeitraum.
model.tl.ai.monitor.Period.label = Bezeichnung
model.tl.ai.monitor.Period.label.tooltip = Wie der Zeitraum heißt, wo eine Zahl ihren Zeitraum nennen muss - etwa in der Beschriftung einer Kachel. Der Name der gewählten Option, solange er stimmt, sonst die beiden Tage.
model.tl.ai.monitor.Period.lastDay = Letzter Tag der Achse
model.tl.ai.monitor.Period.lastDay.tooltip = Rechter Rand eines Verlaufsdiagramms, als ganzer Tag: der Tag im Feld "Bis".
model.tl.ai.monitor.Period.preset = Auswahl
model.tl.ai.monitor.Period.preset.tooltip = Woher die beiden Tage stammen: eine Tagesanzahl, 0 für "Alle", -1 für von Hand eingetragen.
model.tl.ai.monitor.Period.toDay = Bis
model.tl.ai.monitor.Period.toDay.tooltip = Letzter Tag des Zeitraums. Dieser Tag zählt vollständig mit. Eine Auswahl wie "30 Tage" trägt ihn ein; von Hand geändert, wird daraus ein benutzerdefinierter Zeitraum.
model.tl.ai.monitor.Period.windowEnd = Ende des Zeitfensters
model.tl.ai.monitor.Period.windowEnd.tooltip = Obere Grenze, exklusiv: die Mitternacht nach dem letzten Tag.
model.tl.ai.monitor.Period.windowStart = Anfang des Zeitfensters
model.tl.ai.monitor.Period.windowStart.tooltip = Untere Grenze, inklusiv: die Mitternacht des ersten Tages.
