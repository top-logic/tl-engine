class.com.top_logic.credential.azure.I18NConstants.ERROR_MALFORMED_RESPONSE__URL = The response of "{0}" is malformed.
class.com.top_logic.credential.azure.I18NConstants.ERROR_SECRET_EMPTY__NAME_VAULT = The secret "{0}" in the key vault "{1}" has no value.
class.com.top_logic.credential.azure.I18NConstants.ERROR_SECRET_REQUEST_FAILED__NAME_VAULT_STATUS_DETAIL = Reading the secret "{0}" from the key vault "{1}" failed (HTTP status {2}). {3}
class.com.top_logic.credential.azure.I18NConstants.ERROR_TOKEN_REQUEST_FAILED__RESOURCE_URL_STATUS_DETAIL = The managed identity endpoint "{1}" issued no access token for the resource "{0}" (HTTP status {2}). {3}
class.com.top_logic.credential.azure.I18NConstants.ERROR_VAULT_UNREACHABLE__URL = The key vault "{0}" cannot be reached.
com.top_logic.credential.azure.AzureRestConfig.connect-timeout = Connect timeout
com.top_logic.credential.azure.AzureRestConfig.connect-timeout.tooltip = Maximum time for establishing a connection to the endpoint.
com.top_logic.credential.azure.AzureRestConfig.request-timeout = Request timeout
com.top_logic.credential.azure.AzureRestConfig.request-timeout.tooltip = Maximum time for a request to the endpoint, until the response has been received.
com.top_logic.credential.azure.KeyVaultSecretSource = Key vault secret source
com.top_logic.credential.azure.KeyVaultSecretSource.Config.cache-time = Cache time
com.top_logic.credential.azure.KeyVaultSecretSource.Config.cache-time.tooltip = Time a secret read from the key vault is used before it is read again. <p> A secret rotated in the key vault takes effect after this time at the latest. </p>
com.top_logic.credential.azure.KeyVaultSecretSource.Config.credentials = Credentials
com.top_logic.credential.azure.KeyVaultSecretSource.Config.credentials.tooltip = Credentials for the requests to the key vault. <p> If not given, the managed identity of the machine or app is used, see <i>managed identity credentials</i>. </p>
com.top_logic.credential.azure.KeyVaultSecretSource.Config.secret-name = Secret name
com.top_logic.credential.azure.KeyVaultSecretSource.Config.secret-name.tooltip = Name of the secret in the key vault.
com.top_logic.credential.azure.KeyVaultSecretSource.Config.secret-version = Secret version
com.top_logic.credential.azure.KeyVaultSecretSource.Config.secret-version.tooltip = Version of the secret. <p> If empty, the current version is read, so that a new version takes effect after the cache time. </p>
com.top_logic.credential.azure.KeyVaultSecretSource.Config.vault-url = Vault URL
com.top_logic.credential.azure.KeyVaultSecretSource.Config.vault-url.tooltip = URL of the key vault, e.g. <code>https://my-vault.vault.azure.net</code>.
com.top_logic.credential.azure.KeyVaultSecretSource.tooltip = <i>Secret source</i> reading a secret from Azure Key Vault. <p> The application authenticates at the key vault with an access token, by default with its managed identity (see <i>managed identity credentials</i>), so the configuration names only where the secret is kept. The identity needs the role "Key Vault Secrets User" on the vault or the secret. </p> <p> The secret is kept for the configured cache time and read again afterwards, so that a secret rotated in the key vault takes effect without restarting the application. </p> <p> An API key read from the key vault with the system-assigned managed identity: </p> <pre> &lt;secret class="com.top_logic.credential.azure.KeyVaultSecretSource" vault-url="https://my-vault.vault.azure.net" secret-name="openai-api-key" /&gt; </pre> <p> With a user-assigned managed identity, the credentials are given explicitly: </p> <pre> &lt;secret class="com.top_logic.credential.azure.KeyVaultSecretSource" vault-url="https://my-vault.vault.azure.net" secret-name="openai-api-key" &gt; &lt;credentials class="com.top_logic.credential.azure.ManagedIdentityCredentials" resource="https://vault.azure.net" client-id="00000000-0000-0000-0000-000000000000" /&gt; &lt;/secret&gt; </pre>
com.top_logic.credential.azure.ManagedIdentityCredentials = Managed identity credentials
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.client-id = Client ID
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.client-id.tooltip = Client ID of the user-assigned managed identity to use. <p> If empty, the system-assigned identity is used, or the only user-assigned identity if there is no system-assigned one. </p>
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.endpoint = Endpoint
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.endpoint.tooltip = URL of a token endpoint answering like the instance metadata service. <p> If empty, the endpoint is found automatically: the endpoint announced in the environment of an App Service, a Function or a Container App, otherwise the instance metadata service. </p>
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.max-attempts = Maximum attempts
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.max-attempts.tooltip = Maximum number of attempts of a token request answered with a transient error.
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.renewal-margin = Renewal margin
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.renewal-margin.tooltip = Time before the end of the lifetime of an access token when it is renewed. <p> At most half of the token's lifetime is used as margin. </p>
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.resource = Resource
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.resource.tooltip = Identifier of the Azure service the token is requested for, e.g. <code>https://cognitiveservices.azure.com</code> for Azure AI services or <code>https://vault.azure.net</code> for Azure Key Vault.
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.retry-delay = Retry delay
com.top_logic.credential.azure.ManagedIdentityCredentials.Config.retry-delay.tooltip = Time to wait before the second attempt of a token request. The time doubles with each further attempt.
com.top_logic.credential.azure.ManagedIdentityCredentials.tooltip = <i>Credential provider</i> authenticating requests with an access token of the Azure managed identity of the machine or app the application runs on. <p> Azure issues the token to the identity assigned to the virtual machine, App Service, Function or Container App, so the application owns no secret at all. Access is granted to the identity in Azure (role assignment), e.g. the role <code>Cognitive Services OpenAI User</code> for a language model deployed in Azure AI services. </p> <p> The token is fetched from the identity endpoint of the platform: In an App Service, a Function or a Container App, the platform announces the endpoint in the environment variables <code>IDENTITY_ENDPOINT</code> and <code>IDENTITY_HEADER</code>. Elsewhere, e.g. on a virtual machine or a scale set, the token comes from the instance metadata service (IMDS) at <code>http://169.254.169.254</code>. The token is cached and renewed before it expires (see <i>token cache</i>). </p> <p> A language model in Azure AI services with the system-assigned identity: </p> <pre> &lt;credentials class="com.top_logic.credential.azure.ManagedIdentityCredentials" resource="https://cognitiveservices.azure.com" /&gt; </pre> <p> With a user-assigned identity, its client ID selects it: </p> <pre> &lt;credentials class="com.top_logic.credential.azure.ManagedIdentityCredentials" resource="https://cognitiveservices.azure.com" client-id="00000000-0000-0000-0000-000000000000" /&gt; </pre> <p> In Azure Kubernetes Service (AKS), a pod authenticates with workload identity instead: Its projected service account token is exchanged at Microsoft Entra ID for an access token with the <i>client credentials provider</i>, using the variables <code>AZURE_TENANT_ID</code>, <code>AZURE_CLIENT_ID</code> and <code>AZURE_FEDERATED_TOKEN_FILE</code> that the workload identity webhook sets in the pod. The configuration references them through aliases defined in the application configuration: </p> <pre> &lt;alias&gt; &lt;entry name="%AZURE_TENANT_ID%" value="${env:AZURE_TENANT_ID}"/&gt; &lt;entry name="%AZURE_CLIENT_ID%" value="${env:AZURE_CLIENT_ID}"/&gt; &lt;entry name="%AZURE_FEDERATED_TOKEN_FILE%" value="${env:AZURE_FEDERATED_TOKEN_FILE}"/&gt; &lt;/alias&gt; </pre> <pre> &lt;credentials class="com.top_logic.credential.oauth.ClientCredentialsProvider" token-url="https://login.microsoftonline.com/%AZURE_TENANT_ID%/oauth2/v2.0/token" client-id="%AZURE_CLIENT_ID%" scope="https://cognitiveservices.azure.com/.default" &gt; &lt;client-authentication class="com.top_logic.credential.oauth.ClientAssertionAuthentication"&gt; &lt;assertion class="com.top_logic.basic.credential.FileSecretSource" path="%AZURE_FEDERATED_TOKEN_FILE%"/&gt; &lt;/client-authentication&gt; &lt;/credentials&gt; </pre> <p> A request answered with a status that Azure documents as transient (404 and 410 while the metadata service is updating, 429 when throttling, 5xx) is repeated a few times with growing delay. An endpoint that cannot be reached at all is reported at once, since the application then does not run on Azure. </p>
