com.top_logic.tl.ai.core.agent.ExecutionMode.DEVELOPMENT = Entwicklung
com.top_logic.tl.ai.core.agent.ExecutionMode.DEVELOPMENT.tooltip = Entwicklungsumgebung. Alle Toolmodi sind zulässig.
com.top_logic.tl.ai.core.agent.ExecutionMode.MAINTENANCE = Wartung
com.top_logic.tl.ai.core.agent.ExecutionMode.MAINTENANCE.tooltip = Wartungsfenster aktiv. Alle Toolmodi erlaubt.
com.top_logic.tl.ai.core.agent.ExecutionMode.PRODUCTION = Produktion
com.top_logic.tl.ai.core.agent.ExecutionMode.PRODUCTION.tooltip = Produktionsumgebung. STRUCTURAL Tools werden vom System verweigert.
com.top_logic.tl.ai.core.agent.ExecutionMode.tooltip = Der aktuelle Ausführungsmodus des Systems. <p>Beeinflusst, welche Tools das System zulässt. STRUCTURAL-Tools (Tools, die die Anwendungsstruktur verändern) sind nur im <i>Entwicklungs-</i> und <i>Wartungsmodus</i> erlaubt, niemals im <i>Produktionsmodus</i>.</p> <p>Das Bridge-Modul ordnet dies den Zuständen des MaintenanceWindowManager von TopLogic zu.</p>
com.top_logic.tl.ai.core.agent.ExportToDataFolderCommand = Befehl "In Datenordner exportieren
com.top_logic.tl.ai.core.agent.ExportToDataFolderCommand.Config.file-name = Name der Datei
com.top_logic.tl.ai.core.agent.ExportToDataFolderCommand.Config.file-name.tooltip = Name der Ausgabedatei, z. B. <code>agents.objects.xml</code>.
com.top_logic.tl.ai.core.agent.ExportToDataFolderCommand.Config.type-name = Name des Typs
com.top_logic.tl.ai.core.agent.ExportToDataFolderCommand.Config.type-name.tooltip = Qualifizierter TL-Typ-Name in der Form <code>module:type</code>, z. B. <code>tl.ai.core:Agent</code>.
com.top_logic.tl.ai.core.agent.ExportToDataFolderCommand.tooltip = Befehlshandler, der alle Instanzen eines konfigurierten TL-Typs in eine XML-Datei im Ordner <code>WEB-INF/data/</code> der Anwendung exportiert. <p> Dies ist für Entwicklungsworkflows gedacht, bei denen persistente Objektdefinitionen zurück in den Quellbaum exportiert werden müssen. </p>
com.top_logic.tl.ai.core.agent.ImportFromDataFolderCommand = Befehl "Aus Datenordner importieren
com.top_logic.tl.ai.core.agent.ImportFromDataFolderCommand.Config.file-name = Name der Datei
com.top_logic.tl.ai.core.agent.ImportFromDataFolderCommand.Config.file-name.tooltip = Name der Quelldatei in WEB-INF/data/, z. B. agents.objects.xml.
com.top_logic.tl.ai.core.agent.ImportFromDataFolderCommand.tooltip = Befehlshandler, der eine *.objects.xml-Datei von <code>WEB-INF/data/</code> in die laufende Wissensbasis re-importiert, wobei alle Laufzeitbearbeitungen an den betroffenen Instanzen verworfen und die im Quellbaum festgelegten Werte wiederhergestellt werden. <p> Dies ist die Umkehrung des <i>Befehls "In Datenordner exportieren"</i>: Während die Schaltfläche "Exportieren" den Laufzeitstatus in die XML-Datei im Entwicklungsarbeitsbereich zurückschreibt, nimmt dieser Befehl die XML-Datei, die sich derzeit im Entwicklungsarbeitsbereich befindet, und schiebt sie an Ort und Stelle zurück in den persistenten Speicher, ohne dass ein Server-Neustart erforderlich ist. </p> <p> Die Semantik von Upsert hängt von dem Resolver ab, der im <resolvers> -Block der XML-Datei deklariert ist. Bei einem <i>namensbasierten Instanzauflöser</i> wird eine vorhandene Instanz mit demselben Namen gelöscht und aus der XML-Datei neu erstellt, wodurch die Datei zur maßgeblichen Quelle der Wahrheit wird. </p> <p> Nach einem erfolgreichen Import wird die Markierung initial-data.<fileName> in den <i>Datenbankeigenschaften</i> in ihrem aktuellen Zustand belassen. Wenn die Markierung bereits "geladen" war (typischer Fall), bleibt sie geladen, so dass ein Neustart nicht zu einem erneuten Import führt. Wurde die Markierung durch den Geschwister-Export-Befehl gelöscht, wird sie neu gesetzt, so dass das gleiche restart-sichere Verhalten gilt. </p>
com.top_logic.tl.ai.core.agent.ModelCapabilityModeSelector = Wahlschalter für den Modellfähigkeitsmodus
com.top_logic.tl.ai.core.agent.ModelCapabilityModeSelector.Config.capability = Fähigkeit
com.top_logic.tl.ai.core.agent.ModelCapabilityModeSelector.Config.capability.tooltip = Die Fähigkeit, die von dem Modell unterstützt werden muss (z. B. "reasoning", "temperature"). <p> Ist der Wert null, wird keine Überprüfung der Fähigkeit durchgeführt (nur der Anbieter wird überprüft). </p>
com.top_logic.tl.ai.core.agent.ModelCapabilityModeSelector.Config.providers = Anbieter
com.top_logic.tl.ai.core.agent.ModelCapabilityModeSelector.Config.providers.tooltip = Anbieter-IDs, für die dieses Feld/diese Gruppe gilt (z. B. "anthropic", "openai"). <p> Wenn das Feld leer ist, wird es für alle Anbieter angezeigt (nur die Fähigkeit ist markiert). </p>
com.top_logic.tl.ai.core.agent.ModelCapabilityModeSelector.tooltip = <i>Modusselektor</i>, der die Sichtbarkeit von Feldern/Gruppen auf der Grundlage des ausgewählten Modells des Agenten steuert. <p> Löst den Modellnamen in eine Anbieter-ID auf und überprüft die Modellfähigkeiten aus dem Katalog. Ein Feld oder eine Gruppe wird nur angezeigt, wenn der Anbieter übereinstimmt UND die erforderliche Fähigkeit vorhanden ist. </p>
com.top_logic.tl.ai.core.agent.NameBasedInstanceResolver = Namensbasierter Instanzauflöser
com.top_logic.tl.ai.core.agent.NameBasedInstanceResolver.tooltip = <i>Instanzauflöser</i>, der Instanzen nach ihrem name-Attribut auflöst. <p> Beim Export wird der Namenswert als globaler Bezeichner verwendet. Beim Import werden vorhandene Instanzen mit demselben Namen gelöscht und aus der XML-Datei neu erstellt, so dass die Datei objects.xml die maßgebliche Quelle der Wahrheit ist. </p>
com.top_logic.tl.ai.core.agent.NameRef = Hinweis auf den Namen
com.top_logic.tl.ai.core.agent.NameRef.tooltip = Benannte Referenz auf ein Tool, eine Fähigkeit, einen Agenten oder einen MCP-Server. <p> Wird als Eintragstyp für Schlüssellisten in der <i>Agentenkonfiguration</i> verwendet. Die Speicherung der Verweise als Keyed-List-Einträge (anstelle einer einzelnen kommagetrennten Zeichenkette) ermöglicht die Überlagerung der einzelnen Einträge über Konfigurationsschichten hinweg: Ein Anwendungsmodul kann einen einzelnen Eintrag hinzufügen oder entfernen, ohne die gesamte von der Plattform bereitgestellte Liste neu zu erstellen. </p>
