com.top_logic.tl.ai.tool.api.P = P
com.top_logic.tl.ai.tool.api.P.required = Erforderlich
com.top_logic.tl.ai.tool.api.P.required.tooltip = Ob dieser Parameter erforderlich ist. Der Standardwert ist true.
com.top_logic.tl.ai.tool.api.P.tooltip = Beschreibt einen Parameter einer <i>mit einer Werkzeugmethode kommentierten</i> Methode.
com.top_logic.tl.ai.tool.api.P.value = Wert
com.top_logic.tl.ai.tool.api.P.value.tooltip = Beschreibung des Parameters. Wird an das LLM gesendet.
com.top_logic.tl.ai.tool.api.ToolMethod = Werkzeug-Methode
com.top_logic.tl.ai.tool.api.ToolMethod.concurrencySafe = Gleichzeitigkeitssicher
com.top_logic.tl.ai.tool.api.ToolMethod.concurrencySafe.tooltip = Gibt an, ob dieses Werkzeug sicher parallel zu anderen parallelitätssicheren Werkzeugen ausgeführt werden kann. Der Standardwert ist false (fail-closed).
com.top_logic.tl.ai.tool.api.ToolMethod.description = Beschreibung
com.top_logic.tl.ai.tool.api.ToolMethod.description.tooltip = Beschreibung, was dieses Tool tut. Wird an das LLM gesendet. Mehrere Werte werden mit einem Zeilenumbruch verbunden.
com.top_logic.tl.ai.tool.api.ToolMethod.mode = Modus
com.top_logic.tl.ai.tool.api.ToolMethod.mode.tooltip = Welche Art von Zustandsänderung dieses Werkzeug vornimmt. Der Standardwert ist <i>global</i> (fail-closed).
com.top_logic.tl.ai.tool.api.ToolMethod.name = Name
com.top_logic.tl.ai.tool.api.ToolMethod.name.tooltip = Name des Werkzeugs. Standardmäßig wird der Name der Java-Methode verwendet, wenn er leer ist.
com.top_logic.tl.ai.tool.api.ToolMethod.tooltip = Markiert eine Methode als ein Werkzeug, das der Agent aufrufen kann.
com.top_logic.tl.ai.tool.api.ToolMode = Werkzeug-Modus
com.top_logic.tl.ai.tool.api.ToolMode.GLOBAL = Global
com.top_logic.tl.ai.tool.api.ToolMode.GLOBAL.tooltip = Das Tool nimmt Änderungen am gemeinsamen Anwendungsstatus vor (Modell, Layouts, Workflows).
com.top_logic.tl.ai.tool.api.ToolMode.READ = Lesen
com.top_logic.tl.ai.tool.api.ToolMode.READ.tooltip = Das Tool liest nur Daten. Keine Änderungen, keine Genehmigung erforderlich.
com.top_logic.tl.ai.tool.api.ToolMode.USER_SCOPED = Benutzerspezifisch
com.top_logic.tl.ai.tool.api.ToolMode.USER_SCOPED.tooltip = Das Tool nimmt Änderungen vor, die nur für den aktuellen Benutzer gelten (temporäre Ansichten, persönliche Dashboards).
com.top_logic.tl.ai.tool.api.ToolMode.tooltip = Kategorisiert, welche Art von Zustandsänderung ein Werkzeug vornimmt.
com.top_logic.tl.ai.tool.api.registry.ReflectiveToolFactory = Reflektierende Werkzeugfabrik
com.top_logic.tl.ai.tool.api.registry.ReflectiveToolFactory.Config.tool-class = Werkzeugklasse
com.top_logic.tl.ai.tool.api.registry.ReflectiveToolFactory.Config.tool-class.tooltip = Die Java-Klasse, die mit <i>Werkzeugmethoden</i> kommentierte Methoden enthält. <p> Diese Klasse wird nach Werkzeugdefinitionen durchsucht. Alle Methoden, die mit @ToolMethod gekennzeichnet sind, werden als AI-Tools angezeigt. </p>
com.top_logic.tl.ai.tool.api.registry.ReflectiveToolFactory.tooltip = Eine <i>Werkzeugfabrik</i>, die reflektiv Werkzeuge aus einer Java-Klasse mit annotierten <i>Werkzeugmethoden</i> entdeckt. <p> Diese Fabrik extrahiert Werkzeugspezifikationen aus der konfigurierten Klasse und erstellt entsprechende <i>Werkzeuginstanzen</i> für jede kommentierte Methode. </p>
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService = Tool-Registrierungsdienst
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService$ToolFactoryConfig = Tool-Factory-Konfiguration
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService$ToolFactoryConfig.tooltip = Konfiguration für eine benannte Tool-Fabrik.
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService.Config.tool-factories = Tool-Fabriken
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService.Config.tool-factories.tooltip = Karte der benannten Tool-Fabriken, die in der Anwendung verfügbar sind. <p> Jede Werkzeugfabrik wird durch einen eindeutigen Namen identifiziert. Der Fabrikname wird Teil des qualifizierten Werkzeugnamens (Fabrikname.Werkzeugname), mit dem in TL-Script-Funktionen auf Werkzeuge verwiesen wird. </p>
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService.ToolFactoryConfig.implementation = Umsetzung
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService.ToolFactoryConfig.implementation.tooltip = Die Implementierung der Tool-Fabrik.
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService.tooltip = Tool-Registrierungsdienst zur Verwaltung der in der Anwendung verfügbaren Tools. <p> Die Tools sind nach Fabriken organisiert. Jede Fabrik produziert einen Satz von Tools, und jedes Tool wird durch einen qualifizierten Namen im Format {factory-name}.{tool-name} identifiziert. So können Tools aus verschiedenen Fabriken denselben einfachen Namen haben, ohne dass es zu Konflikten kommt. </p>
