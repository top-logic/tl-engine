com.top_logic.tl.ai.core.tools.web.TavilySearchEngine.tooltip = <i>Web search engine</i> backed by the Tavily Search API (POST /search).
com.top_logic.tl.ai.core.tools.web.WebToolsService = Web tools service
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.browsing = Browsing
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.browsing.tooltip = Which origins the agents of this application may browse, per security role. <p> Left empty - which is what ships - nothing changes: every origin that passes the SSRF check stays reachable. It is the ceiling for all three routes out of the application, so a domain list an agent passes to webSearch can only narrow it, never widen it. </p>
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.fetch-max-bytes = Fetch maximum bytes
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.fetch-max-bytes.tooltip = Maximum number of bytes webFetch reads from a page before stopping.
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.fetch-max-chars = Fetch maximum chars
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.fetch-max-chars.tooltip = Maximum number of characters of extracted text webFetch returns.
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.fetch-timeout-seconds = Fetch timeout seconds
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.fetch-timeout-seconds.tooltip = Per-request timeout for webFetch, in seconds.
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.max-results = Maximum results
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.max-results.tooltip = Default maximum number of results returned by webSearch.
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.search-engine = Search engine
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.search-engine.tooltip = The search engine backing webSearch. If unset, web search is unavailable.
com.top_logic.tl.ai.core.tools.web.WebToolsService.tooltip = Service holding configuration for the web tools (<i>web search tool</i>, <i>web fetch tool</i>): the pluggable search engine, the fetch limits and the application's browsing governance. <p> The browsing policy configured here is the application's answer to "which origins may this user's agent reach", and it binds every route out of the application: the browser tool, webFetch and webSearch. It sits <em>above</em> <i>URL safety</i>, which answers the different question of whether an address may be connected to at all and is enforced independently, unconditionally and unconfigurably. </p>
