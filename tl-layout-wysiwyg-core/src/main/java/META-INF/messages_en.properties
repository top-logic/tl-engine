com.top_logic.layout.wysiwyg.ui.HtmlFunctions.text = Structured text with HTML source
com.top_logic.layout.wysiwyg.ui.HtmlFunctions.text.param.images.tooltip = The images the source shows: a single binary value or a list of binary values, each named by its file name, or a dictionary from the names used in the source to binary values. Empty for text without images.
com.top_logic.layout.wysiwyg.ui.HtmlFunctions.text.param.source.tooltip = The HTML source. Without images, it is taken as it is.
com.top_logic.layout.wysiwyg.ui.HtmlFunctions.text.return = The value to write to an HTML attribute.
com.top_logic.layout.wysiwyg.ui.HtmlFunctions.text.tooltip = Structured text with the given HTML source and the images it shows, to store in an HTML attribute. <p> An image element of the source shows one of the given images by naming it in its <code>src</code> attribute, e.g. <code>&lt;img src="logo.png"/&gt;</code>. Such a reference is stored as a link to the image of the structured text (the name with the prefix <code>"ref:"</code>). A source that already uses such a link, e.g. the source of a stored structured text, refers to the given image of that name as well. An image the source does not name is not stored, an image element naming no given image stays as it is. </p>
