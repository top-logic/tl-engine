com.top_logic.layout.react.wysiwyg.HtmlConfigProvider = HTML configuration provider
com.top_logic.layout.react.wysiwyg.HtmlConfigProvider.Config.source-feature-sets = Source feature sets
com.top_logic.layout.react.wysiwyg.HtmlConfigProvider.Config.source-feature-sets.tooltip = The feature sets for which the editor offers editing the HTML source. <p> A feature set is named by the <i>HTML</i> annotation of the property. </p>
com.top_logic.layout.react.wysiwyg.HtmlConfigProvider.tooltip = <i>Configuration annotation control provider</i> editing a property whose text is <i>HTML</i> in a <i>react wysiwyg control</i>. <p> While the property can be edited, the formatted text is edited in the WYSIWYG editor. For a feature set listed in <i>Source feature sets</i>, the editor additionally offers editing the HTML source. While the property cannot be edited, the formatted text is displayed. </p> <p> An edited text is stored only if it passes the application's HTML safety check. A text the check rejects is reported at the field, which keeps its last accepted value. </p> <p> A value held as text - a plain text, or the text of a value with a format, such as a TL-Script expression written as HTML with embedded expressions - is edited as one text. An internationalized text is edited per language: the text in the user's language inline, the other languages in a dialog. Any other property is left to the control the <i>configuration control service</i> chooses without the annotation. </p>
com.top_logic.layout.react.wysiwyg.WysiwygControlProvider = Wysiwyg control provider
com.top_logic.layout.react.wysiwyg.WysiwygControlProvider.Config.commands = Commands
com.top_logic.layout.react.wysiwyg.WysiwygControlProvider.Config.commands.tooltip = Commands the editor's toolbar offers beyond its formatting buttons. <p> A command goes to the toolbar unless it says otherwise, as every command placed in a toolbar does. The commands see the channels of the view the edited field is displayed in, so they take their input from it and hand it on to the dialogs they open, and they reach the text through the insertion channel. </p>
com.top_logic.layout.react.wysiwyg.WysiwygControlProvider.Config.insert-channel = Insert channel
com.top_logic.layout.react.wysiwyg.WysiwygControlProvider.Config.insert-channel.tooltip = Name of the channel whose text the editor inserts at the cursor. <p> Declared where the editor's commands need somewhere to write their result to; the channel then exists for them alone, beside the channels of the surrounding view. A view names the channels it works with, and this is one of them. </p> <p> Left unset, the editor has no such channel and its commands act on the view only. </p>
com.top_logic.layout.react.wysiwyg.WysiwygControlProvider.tooltip = <i>React field control provider</i> for tl.model.wysiwyg:Html attributes. <p> The editor's toolbar carries the commands the configuration gives it, next to the formatting buttons of the editor itself. Such a command does whatever a command of the surrounding view does - open a dialog, run a script, write a channel - and reaches the text through the insertion channel: what it writes there is inserted at the cursor. </p>
