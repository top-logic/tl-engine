com.top_logic.ai.views.ViewChangeAction.tooltip = Entscheidet über den übergebenen Änderungsvorschlag: übernimmt, lehnt ab oder nimmt ihn zurück, in einer eigenen Transaktion, und zeigt die geschriebenen Ansichten in dem Fenster, in dem der Befehl ausgeführt wurde. <pre> &lt;generic-command input="selectedSet"&gt; ... &lt;view-change action="APPLY"/&gt; &lt;/generic-command&gt; </pre>
