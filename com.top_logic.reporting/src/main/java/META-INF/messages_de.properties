com.top_logic.reporting.report.view.component.DefaultProducerChartComponent.Config.bgColor.tooltip = Die Hintergrundfarbe des exportierten Diagrammbilds.
com.top_logic.reporting.report.view.component.DefaultProducerChartComponent.Config.chartHeight = Höhe des Diagramms
com.top_logic.reporting.report.view.component.DefaultProducerChartComponent.Config.chartHeight.tooltip = Die Höhe des exportierten Diagrammbilds.
com.top_logic.reporting.report.view.component.DefaultProducerChartComponent.Config.chartProducer = Chart-Produzent
com.top_logic.reporting.report.view.component.DefaultProducerChartComponent.Config.chartProducer.tooltip = Der Algorithmus, der das Diagramm erzeugt.
com.top_logic.reporting.report.view.component.DefaultProducerChartComponent.Config.chartSizeClassName = Name der Diagrammgrößenklasse
com.top_logic.reporting.report.view.component.DefaultProducerChartComponent.Config.chartSizeClassName.tooltip = Algorithmus, der die Größe des Diagramms anpasst. Standardmäßig füllt das Diagramm den gesamten Bereich der Komponente.
com.top_logic.reporting.report.view.component.DefaultProducerChartComponent.Config.chartWidth = Breite des Diagramms
com.top_logic.reporting.report.view.component.DefaultProducerChartComponent.Config.chartWidth.tooltip = Die Breite des exportierten Diagrammbilds.
