com.top_logic.tl.ai.core.session.Part$ApprovalDecision = Genehmigungsentscheidung
com.top_logic.tl.ai.core.session.Part$ApprovalDecision.tooltip = Genehmigungsentscheidung durch den Nutzer.
com.top_logic.tl.ai.core.session.Part$SubagentStatus = Subagent-Status
com.top_logic.tl.ai.core.session.Part$SubagentStatus.tooltip = Der Status, den ein <i>Subagent-Teil</i> über seinen Subagenten aufzeichnet. <p> Die Zustände eines Unteragenten-Jobs sowie <i>die Grenze</i>: Der Job eines Unteragenten, der an einer Grenze ordnungsgemäß beendet wurde, ist abgeschlossen, doch auf seiner Karte steht, dass die Antwort möglicherweise unvollständig ist. Die Namen entsprechen dem Inhalt der aufgezeichneten Mitschrift und dem, was der Browser anzeigt, sodass eine Konstante niemals umbenannt wird. </p>
com.top_logic.tl.ai.core.session.Part$SystemEventType = System-Ereignis-Typ
com.top_logic.tl.ai.core.session.Part$SystemEventType.tooltip = Arten von Systemereignissen.
com.top_logic.tl.ai.core.session.Part$ToolCallStatus = Tool-Aufrufstatus
com.top_logic.tl.ai.core.session.Part$ToolCallStatus.tooltip = Status eines Tool-Aufrufs während seines Lebenszyklus.
com.top_logic.tl.ai.core.session.Part$TransactionType = Art des Vorgangs
com.top_logic.tl.ai.core.session.Part$TransactionType.tooltip = KB-Transaktionsart.
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.APPROVED = Genehmigt
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.APPROVED.tooltip = Der Benutzer hat diesen Tool-Aufruf genehmigt.
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.APPROVED_FOR_SESSION = Genehmigt für die Sitzung
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.APPROVED_FOR_SESSION.tooltip = Der Benutzer hat dieses Tool für den Rest der Sitzung freigegeben.
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.DENIED = Verweigert
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.DENIED.tooltip = Der Benutzer hat den Aufruf dieses Tools abgelehnt.
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.INTERRUPTED = Unterbrochen
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.INTERRUPTED.tooltip = Der Vorgang wurde beendet, während die Anfrage noch offen war (#598). <p> Verfasst vom Startup-Sweep, niemals von einer Person: Niemand kann die Anfrage mehr beantworten, da der Lauf, der sie gestellt hat, nicht mehr vorhanden ist. Dies unterscheidet sich von <i>einer Zeitüberschreitung</i>, bei der der Benutzer die Gelegenheit hatte, diese jedoch versäumt hat. </p>
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.TIMED_OUT = Zeitüberschreitung
com.top_logic.tl.ai.core.session.Part.ApprovalDecision.TIMED_OUT.tooltip = Die Genehmigungsanfrage ist ohne Antwort verstrichen.
com.top_logic.tl.ai.core.session.Part.SubagentStatus.CANCELLED = Abgebrochen
com.top_logic.tl.ai.core.session.Part.SubagentStatus.CANCELLED.tooltip = Abgebrochen, während er lief oder noch in der Warteschlange wartete.
com.top_logic.tl.ai.core.session.Part.SubagentStatus.DONE = Fertig
com.top_logic.tl.ai.core.session.Part.SubagentStatus.DONE.tooltip = Mit seiner Antwort beendet.
com.top_logic.tl.ai.core.session.Part.SubagentStatus.FAILED = Fehlgeschlagen
com.top_logic.tl.ai.core.session.Part.SubagentStatus.FAILED.tooltip = Mit einem Fehler beendet, oder durch das Ende des Prozesses unterbrochen, in dem er lief.
com.top_logic.tl.ai.core.session.Part.SubagentStatus.LIMIT = Am Limit
com.top_logic.tl.ai.core.session.Part.SubagentStatus.LIMIT.tooltip = Wurde der Reihe nach an einer Grenze gestoppt – Drehungen, Budget, Ausgabe – mit einer Antwort, die möglicherweise unvollständig ist.
com.top_logic.tl.ai.core.session.Part.SubagentStatus.QUEUED = In der Warteschlange
com.top_logic.tl.ai.core.session.Part.SubagentStatus.QUEUED.tooltip = Wartet in der Warteschlange auf einen freien Platz.
com.top_logic.tl.ai.core.session.Part.SubagentStatus.RUNNING = Läuft
com.top_logic.tl.ai.core.session.Part.SubagentStatus.RUNNING.tooltip = Arbeitet.
com.top_logic.tl.ai.core.session.Part.SystemEventType.APPROVAL_MODE_CHANGED = Genehmigungsmodus geändert
com.top_logic.tl.ai.core.session.Part.SystemEventType.APPROVAL_MODE_CHANGED.tooltip = Der Genehmigungsmodus wurde während des Laufs geändert.
com.top_logic.tl.ai.core.session.Part.SystemEventType.CANCELLED = Abgebrochen
com.top_logic.tl.ai.core.session.Part.SystemEventType.CANCELLED.tooltip = Der Agentenlauf wurde vom Benutzer abgebrochen.
com.top_logic.tl.ai.core.session.Part.SystemEventType.CONTINUATION_REQUESTED = Zum Weitermachen aufgefordert
com.top_logic.tl.ai.core.session.Part.SystemEventType.CONTINUATION_REQUESTED.tooltip = Die Antwort des Modells enthielt weder Text noch einen Tool-Aufruf, und der Lauf forderte es auf, fortzufahren. <p> Inhaltselemente der Konversation wie <i>das Ergebnis eines Unteragenten</i>: Dessen Details entsprechen wortwörtlich dem Text, der dem Modell angezeigt wurde, und „ConversationLogReplay“ rekonstruiert daraus dieselbe Benutzernachricht, sodass bei einer neu geladenen Sitzung die leere Antwort nicht mit der darauf folgenden zusammengeführt wird. </p>
com.top_logic.tl.ai.core.session.Part.SystemEventType.INTERRUPTED = Unterbrochen
com.top_logic.tl.ai.core.session.Part.SystemEventType.INTERRUPTED.tooltip = Der Prozess wurde beendet, bevor der Lauf abgeschlossen war (#598). <p> Verursacht durch den Startup-Sweep in der letzten Runde eines Laufs, der noch als aktiv erkannt wurde. Im Gegensatz zu <i>„cancelled“</i> wurde hierfür keine Anforderung gestellt, und der Lauf kann nicht fortgesetzt werden: Keine Agentenschleife überlebt einen Neustart. </p>
com.top_logic.tl.ai.core.session.Part.SystemEventType.LEAD_MESSAGE = Nachricht des Hauptagenten
com.top_logic.tl.ai.core.session.Part.SystemEventType.LEAD_MESSAGE.tooltip = Der Agent, der diesen Hintergrund-Unteragenten gestartet hat, hat ihm eine Nachricht geschickt, die zu Beginn einer Runde gelesen wurde. <p> Gesprächsinhalt wie <i>Ergebnis eines Unteragenten</i>: Die Details sind wörtlich der Text, den das Modell des Unteragenten erhielt, und ConversationLogReplay baut daraus dieselbe Benutzernachricht wieder auf. </p>
com.top_logic.tl.ai.core.session.Part.SystemEventType.LEAD_WOKEN = Hauptagent geweckt
com.top_logic.tl.ai.core.session.Part.SystemEventType.LEAD_WOKEN.tooltip = Die Runde wurde ohne Nachricht des Benutzers gestartet, weil sich Subagenten gemeldet haben. <p> Die Details nennen als JSON-Array, welche und warum; der Chat zeigt sie anstelle der Sprechblase des Benutzers. Kein Gesprächsinhalt: Was das Modell erfahren hat, ist der vorangehende Teil <i>Ergebnis des Unteragenten</i>. </p>
com.top_logic.tl.ai.core.session.Part.SystemEventType.MODEL_CHANGED = Modell geändert
com.top_logic.tl.ai.core.session.Part.SystemEventType.MODEL_CHANGED.tooltip = Das LLM-Modell wurde während des Laufs gewechselt.
com.top_logic.tl.ai.core.session.Part.SystemEventType.SUBAGENT_RESULT = Ergebnis des Unteragenten
com.top_logic.tl.ai.core.session.Part.SystemEventType.SUBAGENT_RESULT.tooltip = Die Ergebnisse der Hintergrund-Subagenten wurden dem Modell zu Beginn einer Runde übergeben. <p> Die Ausnahme: Während die anderen etwas aufzeichnen, das <em>rund um</em> das Gespräch <em>herum</em> passiert ist, zeichnet dieser hier den Gesprächsinhalt auf. Seine Details entsprechen wortwörtlich dem Text, der dem Modell gezeigt wurde. Deshalb rekonstruiert „ConversationLogReplay“ daraus eine Benutzernachricht, anstatt sie wie jedes andere Systemereignis zu überspringen – eine neu geladene Sitzung muss dem Modell dasselbe mitteilen wie der Live-Lauf. </p>
com.top_logic.tl.ai.core.session.Part.SystemEventType.USER_MESSAGE = Nachricht des Benutzers
com.top_logic.tl.ai.core.session.Part.SystemEventType.USER_MESSAGE.tooltip = Der Benutzer hat diesem Hintergrund-Subagenten über seine Karte im Chat geschrieben, und der Subagent hat es zu Beginn einer Runde gelesen. <p> Gesprächsinhalt wie <i>Nachricht des Hauptagenten</i>: Die Details sind wörtlich der Text, den das Modell des Subagenten erhielt, und das Wiedereinspielen des Protokolls baut daraus dieselbe Benutzernachricht wieder auf. Das Protokoll zeigt sie als Nachricht des Benutzers. </p>
com.top_logic.tl.ai.core.session.Part.ToolCallStatus.COMPLETED = Abgeschlossen
com.top_logic.tl.ai.core.session.Part.ToolCallStatus.COMPLETED.tooltip = Das Tool wurde erfolgreich beendet.
com.top_logic.tl.ai.core.session.Part.ToolCallStatus.DENIED = Verweigert
com.top_logic.tl.ai.core.session.Part.ToolCallStatus.DENIED.tooltip = Tool wurde von der Sicherheit oder der Genehmigung verweigert.
com.top_logic.tl.ai.core.session.Part.ToolCallStatus.FAILED = Gescheitert
com.top_logic.tl.ai.core.session.Part.ToolCallStatus.FAILED.tooltip = Tool hat einen Fehler ausgelöst.
com.top_logic.tl.ai.core.session.Part.ToolCallStatus.ROLLED_BACK = Zurückgesetzt
com.top_logic.tl.ai.core.session.Part.ToolCallStatus.ROLLED_BACK.tooltip = Das Tool meldete einen Erfolg, doch die Schreibvorgänge dieses Durchlaufs wurden rückgängig gemacht und sind ungültig.
com.top_logic.tl.ai.core.session.Part.ToolCallStatus.RUNNING = Läuft
com.top_logic.tl.ai.core.session.Part.ToolCallStatus.RUNNING.tooltip = Das Tool wird gerade ausgeführt.
com.top_logic.tl.ai.core.session.Part.TransactionType.BEGAN = Begonnen
com.top_logic.tl.ai.core.session.Part.TransactionType.BEGAN.tooltip = Die Transaktion wurde gestartet.
com.top_logic.tl.ai.core.session.Part.TransactionType.COMMITTED = Bestätigt
com.top_logic.tl.ai.core.session.Part.TransactionType.COMMITTED.tooltip = Die Transaktion wurde erfolgreich abgeschlossen.
com.top_logic.tl.ai.core.session.Part.TransactionType.ROLLED_BACK = Zurückgerollt
com.top_logic.tl.ai.core.session.Part.TransactionType.ROLLED_BACK.tooltip = Die Transaktion wurde rückgängig gemacht.
com.top_logic.tl.ai.core.text.TextEdits$Failure = Fehlschlag
com.top_logic.tl.ai.core.text.TextEdits$Failure.tooltip = Warum eine Bearbeitung abgelehnt wurde. <p> Jeder Wert steht für eine bestimmte Aktion, die der Aufrufer als Nächstes ausführen soll – und das ist der einzige Grund, warum es diesen Code überhaupt gibt: Die dazugehörige <code>Result#message()</code> gibt in Worten an, um welche Aktion es sich handelt. </p>
com.top_logic.tl.ai.core.text.TextEdits$Match = Treffer
com.top_logic.tl.ai.core.text.TextEdits$Match.tooltip = Wie der Anker gefunden wurde, in der Reihenfolge, in der die Kaskade versucht, ihn zu finden. <p> Zudem gilt die Normalisierungsstufe: Jede Stufe vergleicht einen normalisierten Anker mit einem normalisierten Text und ordnet den Treffer dann den Offsets des <em>Originals</em> zu, sodass immer ein Bereich des gespeicherten Textes ersetzt wird. </p>
com.top_logic.tl.ai.core.text.TextEdits$Matching = Abgleich
com.top_logic.tl.ai.core.text.TextEdits$Matching.tooltip = Wie weit die Übereinstimmungskaskade reichen kann.
com.top_logic.tl.ai.core.text.TextEdits.Failure.AMBIGUOUS = Mehrdeutig
com.top_logic.tl.ai.core.text.TextEdits.Failure.AMBIGUOUS.tooltip = Der Anker kommt mehrmals vor, und der Aufrufer hat um eine einmalige Ersetzung gebeten. <p> Es darf keinesfalls der erste Vorkommen ausgewählt werden: Es ist nicht erkennbar, welchen Vorkommen der Aufrufer gemeint hat, und die stillschweigende Bearbeitung eines davon ist genau der Fehlerfall, den diese gesamte Klasse verhindern soll. Die Zeilennummern aller Vorkommen werden zurückgegeben, damit der Aufrufer den Anker erweitern kann. </p>
com.top_logic.tl.ai.core.text.TextEdits.Failure.EMPTY_ANCHOR = Leerer Anker
com.top_logic.tl.ai.core.text.TextEdits.Failure.EMPTY_ANCHOR.tooltip = Der Anker ist leer, der Text hingegen nicht. <p> Ein leerer Anker kommt überall vor und bezieht sich daher auf nichts. Bei einem leeren Text wird er akzeptiert, da er sich dort auf die einzige vorhandene Position bezieht. </p>
com.top_logic.tl.ai.core.text.TextEdits.Failure.NOT_FOUND = Nicht gefunden
com.top_logic.tl.ai.core.text.TextEdits.Failure.NOT_FOUND.tooltip = Der Anker kommt auf keiner Ebene der Kaskade vor.
com.top_logic.tl.ai.core.text.TextEdits.Match.EXACT = Genau
com.top_logic.tl.ai.core.text.TextEdits.Match.EXACT.tooltip = Der Anker wird Zeichen für Zeichen abgeglichen.
com.top_logic.tl.ai.core.text.TextEdits.Match.LINE_ENDINGS = Zeilenenden
com.top_logic.tl.ai.core.text.TextEdits.Match.LINE_ENDINGS.tooltip = Der Anker tritt einmal auf, wobei \\r\\n und \\r auf beiden Seiten als \\n interpretiert werden.
com.top_logic.tl.ai.core.text.TextEdits.Match.WHITESPACE = Leerzeichen
com.top_logic.tl.ai.core.text.TextEdits.Match.WHITESPACE.tooltip = Der Anker tritt jeweils dann auf, wenn eine Folge von Leerzeichen auf beiden Seiten als ein Leerzeichen gelesen wird, wobei die führenden und nachfolgenden Leerzeichen des Ankers selbst entfernt werden. <p> „Leerzeichen“ umfasst hier auch die Zeichen, die Java nicht als Leerzeichen bezeichnet – das festes Leerzeichen, das schmale Leerzeichen und das ideografische Leerzeichen –, da ein Text, der durch ein Textverarbeitungsprogramm gelaufen ist, voll davon ist und keines davon einen vom Autor beabsichtigten Unterschied darstellt. </p>
com.top_logic.tl.ai.core.text.TextEdits.Matching.STRICT = Streng
com.top_logic.tl.ai.core.text.TextEdits.Matching.STRICT.tooltip = Der Anker muss Zeichen für Zeichen übereinstimmen. <p> Die ehrliche Einstellung für einen Aufrufer, der den Anker selbst erzeugt hat – eine Migration, eine Vorlagenerweiterung, die anwendungsinterne Adressierungsebene. Ein Fehltreffer ist dann ein Fehler im Aufrufer, und das Abgleichen mit etwas, das fast gleich ist, würde diesen Fehler verbergen. </p>
com.top_logic.tl.ai.core.text.TextEdits.Matching.TOLERANT = Tolerant
com.top_logic.tl.ai.core.text.TextEdits.Matching.TOLERANT.tooltip = Zuerst die exakte Übereinstimmung; falls dies nicht möglich ist, die Zeilenenden ignorieren; falls auch dies nicht möglich ist, die Schreibweise der Leerzeichen ignorieren. <p> Die Einstellung für einen Anker, den ein Sprachmodell zitiert hat. Die beiden Fallback-Optionen decken die Fehlerklassen ab, die nichts mit der Absicht des Autors zu tun haben – einen Wert, der mit CRLF gespeichert und mit LF zurückgegeben wurde, eine Einrückungsebene, die mit Leerzeichen statt mit einem Tabulator neu eingegeben wurde, oder ein geschützte Leerzeichen im Quelltext, das als normales Leerzeichen zurückgegeben wurde. Ein treffender Fallback wird immer gemeldet, sodass ein Aufrufer niemals annehmen muss, welche Ebene geantwortet hat. </p>
com.top_logic.tl.ai.core.tools.authoring.AgentAuthoringTool = Tool zur Erstellung von Agenten
com.top_logic.tl.ai.core.tools.authoring.AgentAuthoringTool.tooltip = Tool zum Erstellen, Überprüfen, Aktualisieren und Löschen von Anwendungsagenten und Skills. <p> Änderungsmethoden erben den standardmäßigen <i>Strukturmodus</i>, erfordern daher eine manuelle Freigabe und sind in der Produktionsumgebung gesperrt. Abfragemethoden sind <i>schreibgeschützt</i>. Dieses Tool zeigt nur Anwendungsagenten und -fähigkeiten an; diejenigen des Frameworks (von TopLogic bereitgestellt) sind hier weder sichtbar noch bearbeitbar. </p>
com.top_logic.tl.ai.core.tools.authoring.FrameworkWiringTool = Tool zur Verkabelung von Rahmen
com.top_logic.tl.ai.core.tools.authoring.FrameworkWiringTool.tooltip = Tool zum Hinzufügen und Entfernen von Tools, Fähigkeiten und Delegationen bei (von TopLogic bereitgestellten) Agenten und Fähigkeiten des Frameworks. <p> Bei der Konfiguration wird ein zusätzliches Konfigurations-Overlay geschrieben und <i>die TopLogic-Agenten sowie -Fähigkeiten</i> werden neu gestartet, sodass die Änderungen sofort wirksam werden. Abfragemethoden lesen den Status des laufenden Dienstes aus. </p>
com.top_logic.tl.ai.core.tools.authoring.ScriptToolAuthoringTool = Tool zur Erstellung von Skripten
com.top_logic.tl.ai.core.tools.authoring.ScriptToolAuthoringTool.tooltip = Tool zum Erstellen, Überprüfen, Aktualisieren und Löschen von TL-Script-Tools in der benutzerdefinierten Factory der Konfiguration <i>des Tool-Registry-Dienstes</i>. <p> Mutationsmethoden speichern eine Konfigurationsüberlagerung und starten den <i>Tool-Registrierungsdienst</i> neu, damit die Änderungen sofort wirksam werden; sie erben <i>strukturelle Eigenschaften</i> (Genehmigung erforderlich, in der Produktion gesperrt). Abfragemethoden <i>lesen</i> die gespeicherte Konfiguration <i>aus</i>. </p>
com.top_logic.tl.ai.core.tools.integration.GiteaIssueTool = Gitea-Issue-Tool
com.top_logic.tl.ai.core.tools.integration.GiteaIssueTool.Config.credentials = Zugangsdaten
com.top_logic.tl.ai.core.tools.integration.GiteaIssueTool.Config.credentials.tooltip = Wie die Anfragen an Gitea authentifiziert werden. <p> Ist nichts angegeben, mit dem Zugriffstoken im Geheimnis <code>"tl_gitea_token"</code>, gesendet mit dem Schema <code>"token"</code>. </p>
com.top_logic.tl.ai.core.tools.integration.GiteaIssueTool.tooltip = Tool zum Erstellen von Issues in einem Gitea-Repository über die REST-API. <p> Dieses Tool wird vom Review-Agenten verwendet, um Qualitätsprobleme zu melden, die bei der Konversationsanalyse festgestellt wurden. Die Issues werden mit strukturierten Markdown-Inhalten erstellt, die Kategorie, Schweregrad, Beschreibung und optionale Informationen zu vorgeschlagenen Korrekturen enthalten. </p> <p> Die Benennung des Repositorys erfolgt über Umgebungsvariablen (mit Fallback auf Systemeigenschaften): tl_gitea_url, tl_gitea_repo_owner, tl_gitea_repo_name. Die Anfragen werden mit den konfigurierten Zugangsdaten authentifiziert; fehlen diese, wird das Zugriffstoken im Geheimnis <code>"tl_gitea_token"</code> verwendet, das mit dem Schema <code>"token"</code> gesendet wird. Zugangsdaten aus einer anderen Quelle werden über die <i>reflektierende Tool-Factory</i> konfiguriert: </p><pre> &lt;implementation class="com.top_logic.tl.ai.tool.api.registry.ReflectiveToolFactory"&gt; &lt;tool class="com.top_logic.tl.ai.core.tools.integration.GiteaIssueTool"&gt; &lt;credentials class="com.top_logic.basic.credential.HeaderCredentials" scheme="token"&gt; &lt;secret class="com.top_logic.basic.credential.FileSecretSource" path="/run/secrets/gitea-token"/&gt; &lt;/credentials&gt; &lt;/tool&gt; &lt;/implementation&gt; </pre> <p> Das Tool ist <i>extern</i>: Es erstellt ein gemeinsames, öffentlich sichtbares Issue in einem anderen System, und nichts hier kann dies rückgängig machen. Es wurde <i>als benutzerspezifisch</i> deklariert, bevor es dafür einen Modus gab – „Änderungen, die nur für den aktuellen Benutzer gelten“ traf in diesem Fall nicht zu und wurde nur angegeben, um die Bestätigungsabfrage zu erhalten, die dieser Modus zufällig mit sich bringt. Nun stammen die tatsächliche Einstufung und die Abfrage aus derselben Anweisung. </p>
com.top_logic.tl.ai.core.tools.interaction.TaskTool = Aufgaben-Tool
com.top_logic.tl.ai.core.tools.interaction.TaskTool.tooltip = Tool zur Verwaltung von Agenten-Aufgaben innerhalb einer Verarbeitungssitzung. <p> Bietet CRUD-Operationen für einen im Arbeitsspeicher befindlichen <i>Aufgabenspeicher</i>, der über <i>eine Aufgabenspeicherbindung</i> an den aktuellen Thread gebunden ist. Aufgaben dienen dazu, den Fortschritt zu verfolgen und mehrstufige Agentenarbeiten zu organisieren. </p> <p><b>Warum der Plan keiner Genehmigung bedarf.</b> Die Aufgaben sind der eigene Plan der Konversation: Nur die Agenten der Konversation schreiben sie, es handelt sich nicht um Daten des Benutzers oder der Anwendung, und keine Transaktion des Gesprächsrundenabschnitts umfasst sie – der Speicher ist der Arbeitsspeicher, und seine Kopie in den AgentTask-Zeilen wird vom Ausführungsspeicher in einem eigenen Thread geschrieben, genau wie das Transkript. Daher sind `createTask` und `updateTask` für diese Anwendung <i>Leseaufrufe</i>: Ein Forschungsansatz, bei dem der Plan als Aufgaben geführt wird, die ihn aktualisieren, ohne den Nutzer bei jedem Schritt zu befragen, und bei dem eine zurückgesetzte Runde nicht beansprucht, bereits feststehende Planänderungen rückgängig gemacht zu haben. Sie sind nicht parallelitätssicher, sodass Aufgaben, die in einem Durchlauf erstellt wurden, in der Reihenfolge nummeriert werden, in der das Modell sie geschrieben hat. </p>
com.top_logic.tl.ai.core.tools.model.AnnotationDefinitionExplorerTool = Explorer-Tool für Anmerkungsdefinitionen
com.top_logic.tl.ai.core.tools.model.AnnotationDefinitionExplorerTool.tooltip = Tool zur Erkundung von Schemata für Anmerkungsdefinitionen. <p> Dieses Tool ermöglicht es KI-Agenten, Anmerkungsdefinitionen zu verstehen (was konfiguriert werden KANN), nicht Anmerkungsinstanzen (was konfiguriert ist). Es bietet Schemainformationen, einschließlich Metadaten zu Eigenschaften, Typen, Einschränkungen und Standardeinstellungen. </p> <h3>Beispiel für die Verwendung:</h3> <pre> // Untersuchen einer bestimmten Anmerkungsdefinition describeAnnotation("com.top_logic.model.annotate.Visibility") // Untersuchen einer Formulardefinitionsanmerkung describeAnnotation("com.top_logic.model.form.definition.FormDefinition") </pre> <h3>Integration</h3>: <p> Registrieren Sie dieses Tool über <i>annotierte Tools</i> und weisen Sie es einem Agenten über die Konfiguration von <i>TopLogic-Agenten und Skills</i> zu. </p>
com.top_logic.tl.ai.core.tools.model.InstanceBrowserTool = Instanz-Browser-Tool
com.top_logic.tl.ai.core.tools.model.InstanceBrowserTool.tooltip = Tool zum Abrufen von TopLogic-Instanzdaten aus der Wissensdatenbank. <p> Dieses Tool bietet Methoden zum Auflisten von Instanzen eines Typs mit Paginierung sowie zum Abrufen detaillierter Informationen zu einzelnen Instanzen. Alle Methoden geben JSON-formatierte Zeichenfolgen zurück, die von KI-Agenten verarbeitet werden können. </p> <p> Beide Methoden greifen mit der Identität des Laufs auf die Wissensbasis zu, sodass beide durch den <i>Lesefilter</i> des Laufs gefiltert werden: Eine Instanz, die der Prinzipal nicht lesen darf, fehlt in der Auflistung und wird bei der Gesamtanzahl nicht berücksichtigt, und ein nicht lesbares Attribut einer lesbaren Instanz fehlt in deren Beschreibung. Diese Klasse verfügt über keinen eigenen Serializer – früher waren es drei, was überhaupt erst dazu führte, dass die Filterung hier fehlte. </p> <p> Beide Ergebnisse werden zusätzlich als Geschäftsdaten gekennzeichnet. Ein Attributwert ist Freitext, den ein anderer Endbenutzer in einen gemeinsam genutzten Datensatz eingegeben hat; es handelt sich also um dieselbe Art von Eingabe wie bei einer abgerufenen Webseite und er trägt dieselben Tags. Die Kennzeichnung gilt nur für die Erfolgsmeldung – eine Ablehnung ist eine eigene Entscheidung dieser Anwendung und keine von ihr offengelegte Information. </p>
com.top_logic.tl.ai.core.tools.model.LockTool = Sperr-Tool
com.top_logic.tl.ai.core.tools.model.LockTool.tooltip = Tool zur Überprüfung, ob ein Modellelement gerade von einem anderen Bearbeiter gesperrt ist.
com.top_logic.tl.ai.core.tools.model.ModelAnnotationBrowserTool = Browser-Tool für Modellkommentare
com.top_logic.tl.ai.core.tools.model.ModelAnnotationBrowserTool.tooltip = Tool zum Durchsuchen von Annotationen auf TopLogic-Modellelementen (Module, Typen, Teile, Aufzählungen, Klassifikatoren). <p> Mit diesem Tool können KI-Agenten die Metadaten von Annotationen auf Modellelementen mit optionaler Vererbungsunterstützung prüfen. Es liefert detaillierte Informationen über jede Anmerkung, einschließlich ihres Tag-Namens, der Konfigurationsschnittstelle und der Eigenschaftswerte. </p> <h3>Beispiel für die Verwendung:</h3> <pre> // Auflisten lokaler Anmerkungen zu einem Modul getCurrentAnnotations("tl.core", false) // Auflisten lokaler Anmerkungen zu einem Typ getCurrentAnnotations("tl.core:TLObject", false) // Auflisten aller Anmerkungen einschließlich vererbter getCurrentAnnotations("tl.core:TLObject", true) // Anmerkungen zu einer Aufzählung auflisten getCurrentAnnotations("tl.core:TLScope", false) // Anmerkungen zu einem Typteil auflisten getCurrentAnnotations("tl.core:TLObject#name", false) // Anmerkungen zu einem Klassifikator (Enum-Literal) auflisten getCurrentAnnotations("tl.core:TLScope#global", false) </pre> <h3>Integration</h3>: <p> Registrieren Sie dieses Tool über <i>annotierte Tools</i> und weisen Sie es einem Agenten über die Konfiguration von <i>TopLogic-Agenten und Skills</i> zu. </p>
com.top_logic.tl.ai.core.tools.model.ModelAnnotationEditorTool = Editor für Modellbeschriftungen
com.top_logic.tl.ai.core.tools.model.ModelAnnotationEditorTool.tooltip = Tool zum Setzen und Entfernen von Annotationen auf TopLogic-Modellelementen. <p> Mit diesem Tool können KI-Agenten Metadaten zu Modellelementen (Module, Typen, Teile, Klassifikatoren) ändern. Annotationskonfigurationen werden als JSON akzeptiert, die dem Schema des <i>Konfigurationsschematools</i> entsprechen. </p>
com.top_logic.tl.ai.core.tools.model.ModelBrowserTool = Modell-Browser-Tool
com.top_logic.tl.ai.core.tools.model.ModelBrowserTool.tooltip = Tool zum Durchsuchen der TopLogic-Modellstruktur (Module, Typen, Teile). <p> Dieses Tool bietet drei Methoden, die die natürliche Hierarchie für die Modelluntersuchung bilden: Auflistung aller Module, Auflistung der Typen innerhalb eines Moduls und Auflistung der Eigenschaften/Referenzen eines Typs. Alle Methoden geben JSON-formatierte Strings zurück, die von KI-Agenten verwendet werden können. </p>
com.top_logic.tl.ai.core.tools.model.ModelEditorTool = Modell-Editor-Tool
com.top_logic.tl.ai.core.tools.model.ModelEditorTool.tooltip = Tool zum Erstellen und Aktualisieren von TopLogic-Modellelementen. <p> Dieses Tool bietet Methoden zum Erstellen und Aktualisieren von Modulen, Klassen, Eigenschaften, Referenzen, Rückwärtsreferenzen und Aufzählungen im TopLogic-Anwendungsmodell. </p> <p> Alle Methoden geben JSON-formatierte Zeichenketten zurück, die von KI-Agenten verwendet werden können. </p>
com.top_logic.tl.ai.core.tools.model.ModelSearchTool = Tool zur Modellsuche
com.top_logic.tl.ai.core.tools.model.ModelSearchTool.tooltip = Tool für die Suche im gesamten TopLogic-Anwendungsmodell. <p> Dieses Tool bietet eine intelligente Textsuche über Module, Typen (Klassen, Aufzählungen, Datentypen) und Eigenschaften/Referenzen. Es durchsucht technische Namen, qualifizierte Namen, Bezeichnungen und Beschreibungen und gibt die 10 relevantesten Treffer mit Kontextinformationen zurück. </p>
com.top_logic.tl.ai.core.tools.model.ObjectEditTool = Tool zur Objektbearbeitung
com.top_logic.tl.ai.core.tools.model.ObjectEditTool.tooltip = Ändert, erstellt und löscht einzelne Geschäftsobjekte jeweils in einem Aufruf. <p><b>Wozu es dient:</b> Das Ändern eines Wertes eines vom Benutzer geöffneten Objekts erforderte bisher einen Skill-Aufruf, einige Nachschläge in der TL-Script-Dokumentation und ein Skript – neun Schritte für „den Preis auf 450 setzen“ (Gitea #625). Diese Tools nehmen die Objekt-ID und die neuen Werte als strukturierte Eingabe entgegen, wandeln jeden Wert auf dem Server in den Typ seines Attributs um (<i>Attributwerte</i>), prüfen die Modellbeschränkungen (<i>Objektbeschränkungen</i>) und geben die alten und neuen Werte zurück, sodass die Änderung nicht durch ein zweites Lesen bestätigt werden muss. Eine durch eine Bedingung ausgewählte Gruppe von Objekten oder ein aus anderen Daten berechneter Wert bleibt ein einziges Skript, das von `changeData` ausgeführt wird. </p> <p><b>Ein Objekt mit seinen Teilen.</b> createObject nimmt die Teile des neuen Objekts – die Objekte seiner Zusammensetzungen, die bis zu <code>3</code> Ebenen tief verschachtelt sind – in seinen Werten entgegen und erstellt den gesamten Baum in einem einzigen Aufruf (#630). Das bedeutet eine einzige Genehmigung statt einer pro Objekt, und es ist die einzige Möglichkeit, ein Objekt mit einer <em>obligatorischen</em> Zusammensetzung hier überhaupt zu erstellen: Die Einschränkungen des Modells werden einmal abgefragt, nachdem der gesamte Baum bereits existiert, und ein Verstoß an irgendeiner Stelle darin macht alles rückgängig. Jedes Teil wird um die Erlaubnis gebeten, in seinem Container erstellt zu werden; diese Abfrage erfolgt durch einen `createObject`-Aufruf, der diesen Container benennt. Für einen im selben Aufruf erstellten Container antwortet die Engine mit der eigenen Erstellung des Containers, um die gebeten wurde – dieselbe Antwort, die ein Aufruf pro Teil erhalten hat, da die Aufrufe des Durchgangs eine gemeinsame Transaktion bilden. </p> <p><b>Die Rechte des Benutzers und nichts anderes.</b> Jeder Aufruf fungiert als Auftraggeber des Durchlaufs: </p> <ul> <li>Das Objekt wird über <i>den TID-Resolver</i> aufgelöst, sodass ein Objekt, auf das der Prinzipal keinen Lesezugriff hat, ebenso abgelehnt wird wie eines, das nicht existiert.</li> <li>Schreib-, Erstellungs- und Löschanfragen werden an die <i>Modellsicherheit</i> des Durchlaufs gerichtet – die „ModelAccessRights“ der Engine, die standardmäßig verweigern – pro Objekt und, im Falle einer Änderung, pro Attribut: Eine Teilberechtigung, die ein Attribut zurückhält, verweigert dieses Attribut namentlich. Jede Überprüfung erfolgt vor dem ersten Schreibvorgang, sodass eine Ablehnung nichts ändert und als fehlgeschlagener Aufruf gemeldet wird, den der Durchlauf nicht rückgängig machen muss.</li> <li>Ein Aufruf im <em>Systemkontext</em> wird sofort abgelehnt. Die Engine gewährt dort jedes Recht, unabhängig davon, wer der Prinzipal des Laufs ist, und dessen Commit würde unter dem Namen des Systems statt unter dem des Benutzers protokolliert; ein Schreibvorgang, der nicht überprüft oder einem Attribut zugeordnet werden kann, wird nicht ausgeführt.</li> <li>Die Bestätigungsabfrage eines <i>Daten-Schreibtools</i> kommt noch hinzu, und die Pre-Commit-Prüfung stellt dieselben Fragen erneut für alles, was der Durchlauf geändert hat.</li> <li>Die Antwort zeigt nur Werte an, die der Ausführende lesen darf.</li> </ul> <p><b>Die Attribute eines neuen Objekts.</b> Die Engine erlaubt jede Operation an einem Objekt, das noch nicht festgeschrieben ist, da die Rollen, die darüber entscheiden würden, erst zum Zeitpunkt der Festschreibung abgeleitet werden. Die Anfangswerte eines neuen Objekts werden daher so geprüft, wie sie auch in den anwendungsspezifischen Erstellungsdialogen geprüft werden: anhand der Frage der Engine zum Zeitpunkt der Erstellung, die eine Attributgewährung anwendet, wo dies vor der Existenz des Objekts entschieden werden kann – auf das Objekt, zu dem sein Zugriffsübergeordneter führt –, und den Rest durch das Recht zur Erstellung des Objekts abdeckt. </p>
com.top_logic.tl.ai.core.tools.model.ObjectIdConfig = Konfiguration der Objekt-ID
com.top_logic.tl.ai.core.tools.model.ObjectIdConfig$HintConfig = Konfiguration von Hinweisen
com.top_logic.tl.ai.core.tools.model.ObjectIdConfig$HintConfig.tooltip = Eine Sache, die diese Anwendung über eine Zeichenfolge aussagen kann, die keine Objekt-ID ist. <p> Der Satz richtet sich an ein Sprachmodell, nicht an eine Person, und es lohnt sich, ihn eher als Anweisung denn als Beschwerde zu formulieren: Was die Zeichenfolge ist und welches Tool sie in eine ID umwandelt. </p>
com.top_logic.tl.ai.core.tools.model.ObjectIdConfig.HintConfig.explanation = Erläuterung
com.top_logic.tl.ai.core.tools.model.ObjectIdConfig.HintConfig.explanation.tooltip = Was soll dem Modell mitgeteilt werden, um den Satz fortzusetzen, der mit der zitierten Kennung beginnt? <p> Das Framework schreibt die Kennung und setzt sie in Anführungszeichen, daher beginnt dieser Text dort, wo der vorherige endet: „ist ein Datensatzcode. Suchen Sie ihn mit sales__search und verwenden Sie die ID aus der Antwort.“ wird zu „LEAD-014“ ist ein Datensatzcode. Suchen Sie ihn mit sales__search und verwenden Sie die ID aus der Antwort. </p>
com.top_logic.tl.ai.core.tools.model.ObjectIdConfig.HintConfig.pattern = Muster
com.top_logic.tl.ai.core.tools.model.ObjectIdConfig.HintConfig.pattern.tooltip = Die Zeichenfolgen, um die es in diesem Hinweis geht, als regulärer Ausdruck. <p> Der Abgleich erfolgt mit dem <em>gesamten</em> Bezeichner, sodass [A-Z]+-[0-9]+ dem Code LEAD-014 entspricht und nicht nur Zeichenfolgen, die diesen enthalten. Ein Muster, das nicht kompiliert werden kann, wird einmal protokolliert und findet danach keine Übereinstimmungen mehr: Ein Tippfehler in einem Hinweis darf den Resolver, für den der Hinweis gilt, nicht beeinträchtigen. </p>
com.top_logic.tl.ai.core.tools.model.ObjectIdConfig.hints = Hinweise
com.top_logic.tl.ai.core.tools.model.ObjectIdConfig.hints.tooltip = Die anwendungsspezifischen Angaben werden vor den integrierten Angaben geprüft. <p> In der Reihenfolge der Deklaration entscheidet das erste Muster, das übereinstimmt, über die Meldung, und alles, was danach kommt, wird nicht mehr geprüft. Die Liste wird über alle Konfigurationsdateien hinweg additiv zusammengestellt, sodass eine Anwendung ihre Hinweise hinzufügt, ohne die von einem anderen Modul deklarierten erneut anzugeben. </p>
com.top_logic.tl.ai.core.tools.model.ObjectIdConfig.tooltip = Was diese Anwendung über die Identifikatoren weiß, die ein Modell an ein Tool übergibt. <p><i>Tid Diagnostics</i> erkennt die Fehler, die jede Anwendung sieht – eine UUID, ein gedrucktes Objekt, einen unbekannten Typ, eine ID mit falscher Form – von selbst. Die einzige Klasse, die es nicht erkennen kann, sind die Bezeichner, die die Benutzer der Anwendung selbst verwenden: eine Bestellnummer, ein Ticketcode, eine Teilenummer. Welche Zeichenfolge ein solcher Code ist und welches Tool ihn in eine Objekt-ID umwandelt, weiß nur die Anwendung selbst; daher gibt sie dies hier an. </p>
com.top_logic.tl.ai.core.tools.model.SearchAnnotationTool = Tool für Suchanmerkungen
com.top_logic.tl.ai.core.tools.model.SearchAnnotationTool.tooltip = Tool zur Auflistung der verfügbaren Annotationstypen für TopLogic-Modellelemente. <p> Mit diesem Tool können KI-Agenten herausfinden, welche Annotationstypen auf ein bestimmtes Modellelement angewendet werden können. Es listet alle @InApp-Annotationsarten auf, gefiltert nach Art und Typ des Zielelements. </p>
com.top_logic.tl.ai.core.tools.model.TidDiagnostics$TypeState = Typstatus
com.top_logic.tl.ai.core.tools.model.TidDiagnostics$TypeState.tooltip = Was ist über den Typnamen vor dem Doppelpunkt eines Bezeichners bekannt?
com.top_logic.tl.ai.core.tools.model.TidDiagnostics.TypeState.ABSTRACT = Abstrakt
com.top_logic.tl.ai.core.tools.model.TidDiagnostics.TypeState.ABSTRACT.tooltip = Der Typ existiert zwar, ist aber abstrakt, sodass unter ihm niemals etwas gespeichert wird.
com.top_logic.tl.ai.core.tools.model.TidDiagnostics.TypeState.INSTANTIABLE = Instanziierbar
com.top_logic.tl.ai.core.tools.model.TidDiagnostics.TypeState.INSTANTIABLE.tooltip = Der Typ existiert und hat Instanzen.
com.top_logic.tl.ai.core.tools.model.TidDiagnostics.TypeState.UNDECIDED = Unentschieden
com.top_logic.tl.ai.core.tools.model.TidDiagnostics.TypeState.UNDECIDED.tooltip = Niemand wurde gefragt – es steht kein Typ-Repository zur Verfügung.
com.top_logic.tl.ai.core.tools.model.TidDiagnostics.TypeState.UNKNOWN = Unbekannt
com.top_logic.tl.ai.core.tools.model.TidDiagnostics.TypeState.UNKNOWN.tooltip = Es gibt keinen Typ mit diesem Namen.
com.top_logic.tl.ai.core.tools.model.TypeAnalysisTool = Tool zur Typenanalyse
com.top_logic.tl.ai.core.tools.model.TypeAnalysisTool.tooltip = Tool zur Analyse von TopLogic-Typ-Abhängigkeiten und -Beziehungen. <p> Dieses Tool bietet Methoden, um zu verstehen, wie Typen im gesamten Modell verwendet werden: Finden aller Verwendungen eines Typs und Finden, wo ein Teil definiert und vererbt wird. Alle Methoden geben JSON-formatierte Strings zurück, die von KI-Agenten verwendet werden können. </p>
com.top_logic.tl.ai.core.tools.model.ViewDocumentTool = Dokument-Anzeige-Tool
com.top_logic.tl.ai.core.tools.model.ViewDocumentTool.tooltip = Ermöglicht es einem Agenten, die in einem Modellobjekt gespeicherten Inhalte wahrzunehmen. <p> Bei Angabe der TID eines beliebigen Objekts, das ein Attribut vom Typ tl.core:Binary besitzt, liest das Tool die gespeicherten Bytes und überträgt sie in der richtigen Modalität an das Modell: Bilder und PDFs werden im Tool-Ergebnis als multimodaler Inhalt mitgeliefert (sodass ein visuell fähiges Modell sie tatsächlich <em>sieht</em>), Text wird inline zurückgegeben und alles andere führt zu einer einfachen Erklärung. Es ist nicht an einen bestimmten Typ gebunden – ein Browser-Screenshot, eine hochgeladene Rechnung als PDF und eine angehängte CSV-Datei durchlaufen alle denselben Weg. </p> <p> Der Lesezugriff wird über die Modellsicherheit des Laufs geprüft, die die Modellzugriffsrechte der Engine für den Prinzipal des Laufs abfragt. Geprüft wird dort, wo die TID aufgelöst wird: Der <i>TID-Resolver</i> verweigert ein Objekt, das der Prinzipal nicht lesen darf, sodass dieses Tool nie eines erhält. </p>
com.top_logic.tl.ai.core.tools.perception.Modality = Modalität
com.top_logic.tl.ai.core.tools.perception.Modality.IMAGE = Bild
com.top_logic.tl.ai.core.tools.perception.Modality.IMAGE.tooltip = Ein Rasterbild (PNG, JPEG, GIF, WebP, ...).
com.top_logic.tl.ai.core.tools.perception.Modality.PDF = PDF
com.top_logic.tl.ai.core.tools.perception.Modality.PDF.tooltip = Ein PDF-Dokument.
com.top_logic.tl.ai.core.tools.perception.Modality.tooltip = Eine nicht-textuelle Eingabemodalität, die ein Modell wahrnehmen kann oder auch nicht.
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport = Wahrnehmungsunterstützung
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport.SUPPORTED = Unterstützt
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport.SUPPORTED.tooltip = Laut Katalog akzeptiert das Modell diese Modalität.
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport.UNKNOWN = Unbekannt
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport.UNKNOWN.tooltip = Der Katalog enthält keinen Eintrag zu diesem Modell, daher lässt sich nichts ableiten.
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport.UNSUPPORTED = Nicht unterstützt
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport.UNSUPPORTED.tooltip = Laut Katalog akzeptiert das Modell diese Modalität nicht.
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport.tooltip = Ob das aktive Modell eine bestimmte <i>Modalität</i> wahrnehmen kann. <p> Die Antwort wird aus dem Modellkatalog abgeleitet, der Best-Effort-Metadaten enthält: Bei lokal gehosteten oder benutzerdefinierten Modellen können diese Angaben vollständig fehlen. <i>Unbekannt</i> hält diesen Fall von einem Modell unterscheidbar, das als reines Textmodell dokumentiert ist. </p>
com.top_logic.tl.ai.core.tools.present.ChartKind = Diagrammtyp
com.top_logic.tl.ai.core.tools.present.ChartKind.BAR = Balken
com.top_logic.tl.ai.core.tools.present.ChartKind.BAR.tooltip = Balken, jeweils einer pro Objekt oder Beschriftung, nebeneinander pro Serie.
com.top_logic.tl.ai.core.tools.present.ChartKind.LINE = Linie
com.top_logic.tl.ai.core.tools.present.ChartKind.LINE.tooltip = Eine Linie durch die Werte, in der Reihenfolge der Zeilen; eine Linie pro Serie.
com.top_logic.tl.ai.core.tools.present.ChartKind.PIE = Kreis
com.top_logic.tl.ai.core.tools.present.ChartKind.PIE.tooltip = Segmente eines Ganzen.
com.top_logic.tl.ai.core.tools.present.ChartKind.tooltip = Die Art von Diagramm, die eine <i>Diagrammspezifikation</i> definiert. <p> Jede Konstante entspricht einem Chart.js-Diagrammtyp. Die Auswahl beschränkt sich auf die Typen, die für die Kurzformen benötigt werden – ein Wert pro Objekt, eine Zahl pro Beschriftung, einige Reihen nebeneinander. Jedes andere Diagramm – gestapelt, eine Linie über Balken, eine zweite Achse, ein Ringdiagramm – ist eine vollständige Chart.js-Konfiguration, die die Abfrage zurückgibt und deren Typ sich selbst benennt; siehe <i>Diagrammdaten</i>. </p>
com.top_logic.tl.ai.core.tools.present.PresentAs = Darstellen als
com.top_logic.tl.ai.core.tools.present.PresentAs.CHART = Diagramm
com.top_logic.tl.ai.core.tools.present.PresentAs.CHART.tooltip = Ein Balken, Punkt oder Segment pro Objekt, dessen Beschriftung und Wert aus dem Objekt – bzw. den Daten – berechnet werden.
com.top_logic.tl.ai.core.tools.present.PresentAs.FORM = Formular
com.top_logic.tl.ai.core.tools.present.PresentAs.FORM.tooltip = Die Felder von genau einem Objekt.
com.top_logic.tl.ai.core.tools.present.PresentAs.TABLE = Tabelle
com.top_logic.tl.ai.core.tools.present.PresentAs.TABLE.tooltip = Eine Zeile pro Objekt, mit Spalten entsprechend dem Typ der Objekte – oder eine Zeile pro Datenbezeichnung.
com.top_logic.tl.ai.core.tools.present.PresentAs.tooltip = Wie eine <i>Darstellung</i> ihre Objekte zeigt. <p> Die Namen der Konstanten schreibt das Modell: Das Schema des Tools „present“ listet sie auf. </p>
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory = Script-Tool-Fabrik
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory$ScriptToolConfig = Konfiguration des Skript-Tools
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory$ScriptToolConfig.tooltip = Konfiguration für ein einzelnes TL-Script-Tool. <p> Übernimmt Name, Parameter (mit vollständiger <i>Typauswahl</i> ), Bezeichnung, Beschreibung und Implementierungsausdruck aus der <i>Skriptkonfiguration</i>. Fügt den AI-spezifischen Modus und die Gleichzeitigkeitsflags hinzu. </p>
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.Config.tools = Tools
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.Config.tools.tooltip = Die Tools zum Erstellen.
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.concurrency-safe = Gleichzeitigkeitssicher
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.concurrency-safe.tooltip = Ob dieses Tool sicher parallel zu anderen parallelen Tools ausgeführt werden kann.
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.mode = Modus
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.mode.tooltip = Welche Art von Zustandsänderung dieses Tool vornimmt. Der Standardwert ist " <i>Daten schreiben"</i>.
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.summary = Zusammenfassung
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.summary.tooltip = Was vom Ergebnis dieses Tools bleibt, wenn das Gespräch verdichtet wird, berechnet aus dem Ergebnis. <p> Ein Argument, nämlich der Wert, den die Implementierung geantwortet hat; der Ausdruck nennt dessen Kurzform, zum Beispiel <code>rows -&gt; $rows.size() + " Rechnungen"</code>. Die Verdichtung behält diesen Text anstelle des vollständigen Ergebnisses, sodass eine lange Antwort nicht mehr kostet, was sie frisch gekostet hat. Nicht gesetzt behält den Anfang des Ergebnisses, wie bisher. </p> <p> Er wird unter denselben Leserechten offengelegt wie das Ergebnis selbst und darf daher Modellobjekte benennen. </p>
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.truncation-hint = Hinweis zur Kürzung
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.truncation-hint.tooltip = Wie viele Zeichen des Ergebnisses dieses Tools das Modell erreichen, bevor es gekürzt wird. <p> Ein Tool, das mit einem langen Dokument antwortet, braucht mehr Platz, als die Installation voreinstellt; eines, das mit einem Statuswort antwortet, braucht weit weniger, und das zu sagen hält ein ausuferndes Ergebnis aus dem Gespräch heraus. Nicht gesetzt - null oder weniger - verwendet die Voreinstellung der Installation. </p>
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.tooltip = Eine <i>Tool-Fabrik</i>, die Tools aus TL-Script-Implementierungen erstellt. <p> Jede Tool-Konfiguration verwendet den <i>Skriptkonfigurationsvertrag</i> der Engine wieder - dieselbe Parameterauswahl, obligatorische/mehrere Flags, Standardwerte und i18n-Beschreibungen, die von konfigurierten TL-Script-Funktionen verwendet werden - und fügt den AI-spezifischen Modus und das Gleichzeitigkeitsflag hinzu. </p>
com.top_logic.tl.ai.core.tools.registry.SubagentToolFactory = Tool-Fabrik für Subagenten
com.top_logic.tl.ai.core.tools.registry.SubagentToolFactory.tooltip = Eine <i>Tool-Factory</i>, die die generischen Tools zur Orchestrierung asynchroner Unteragenten bereitstellt: spawn_subagent (Start ohne Warten), list_agents, subagent_status (Stand ohne Warten), wait_for_subagent (Warten nur auf Wunsch), send_to_subagent (eine Nachricht, die ein laufender Unteragent in seiner nächsten Runde liest), cancel_subagent (einen Unteragenten anhalten) und reply_to_subagent (die Frage beantworten, die ein Unteragent mit ask_lead gestellt hat). <p> Diese Tools sind unabhängig vom vorgefertigten Delegationsablauf: Jeder Agent kann sie namentlich auswählen, um einen beliebigen, zum Zeitpunkt des Aufrufs ausgewählten, vordefinierten Agenten zu starten. Die <i>Ziel-Agenten-Factory</i> wird pro Aufruf verzögert aufgelöst, sodass die Factory erstellt werden kann, bevor die Agentendienste gestartet sind. </p>
com.top_logic.tl.ai.core.tools.script.ChangeDataTool = Datenänderungs-Tool
com.top_logic.tl.ai.core.tools.script.ChangeDataTool.tooltip = Ändert Daten mit einem Skript in der Abfragesprache der Anwendung (TL-Script), mit den Rechten des Benutzers: das Tool für eine Menge von Objekten, die eine Bedingung auswählt, für Werte, die aus anderen Daten berechnet werden, oder für mehrere Schritte, die zusammengehören. Ein bekanntes Objekt mit vorgegebenen Werten ändern stattdessen die Objekt-Tools (#625). <h2>Nur Änderungen</h2> <p> Ein Skript ohne jede Wirkung wird abgelehnt und an „query“ und „present“ verwiesen, die lesen, ohne dass jemand gefragt wird. Die Ablehnung kommt, bevor irgendjemand gebeten wird, den Aufruf zu genehmigen (<i>Vorabprüfung</i>), sodass ein Lesezugriff nie eine Genehmigungsabfrage zeigt und Lesen und Ändern je ein eigenes Tool haben (#630). Dieselbe Prüfung lehnt ein Skript ab, das sich nicht übersetzen lässt, und - für eine echte Änderung - ein Konto ohne <code>"data.write"</code>; jedes davon wäre sonst eine Abfrage, die der Benutzer vergeblich beantwortet. </p><h2>Der Probelauf</h2> <p> dryRun=true führt die Änderung aus und antwortet, was sie ändern würde - mit demselben Bericht, den ein echter Lauf liefert, Werte vorher und nachher - und speichert nichts. Er ist ein Lesezugriff (<i>Probelauf</i>): keine Genehmigung und kein Anteil an der Transaktion der Runde. Das gilt durch die Bauart, nicht durch Sorgfalt: </p> <ul> <li>Er läuft in einer eigenen Interaktion für denselben Benutzer, auf einem Worker-Thread, in einer Transaktion, die immer zurückgerollt wird. Die Transaktionen der Engine verschachteln sich nicht: Eine innerhalb der Transaktion der Runde geöffnete zurückzurollen, ließe die Runde scheitern, und eine eigene Interaktion hat einen eigenen Transaktionskontext.</li> <li>Er führt nur ein Skript aus, dessen jede Wirkung ein Schreibvorgang in die Wissensbasis ist (<i>Nebenwirkungen</i>), denn nur das nimmt ein Zurückrollen zurück. Ein Skript, das zusätzlich eine E-Mail sendet, eine Nummer zieht oder ein anderes System aufruft, wird geprüft und nicht ausgeführt.</li> <li>Er läuft mit den Rechten des Benutzers: Die Engine prüft sie innerhalb des Skripts, sodass ein Probelauf ablehnt, was der echte Lauf ablehnen würde.</li> </ul><h2>Rechte</h2> <p> Das Tool gehört zu <code>"script"</code>; eine Änderung zu machen kostet zusätzlich <code>"data.write"</code> (ein Probelauf nicht), entschieden von der Richtlinie des Laufs selbst - Hintergrund-Allowlist, Administrator-Ausnahme, Rollenfreigaben - genau wie für ein <code>"data.write"</code>-Tool. Ein Aufruf in einem Systemkontext wird abgelehnt: Die Engine prüft dort keine Rechte und vermerkt keinen Benutzer als Urheber. Was die Antwort zeigt, durchläuft den <i>Lesefilter</i>; die Pre-Commit-Prüfung fragt für alles, was die Runde geändert hat, erneut nach. </p>
com.top_logic.tl.ai.core.tools.script.TLScriptReferenceTool = Skript-Referenz-Tool
com.top_logic.tl.ai.core.tools.script.TLScriptReferenceTool.tooltip = Tool zum Auflisten von TLScript-Funktionen und zum Abrufen der Dokumentation. <p> Dieses Tool ermöglicht den Zugriff auf die TLScript-Funktionsregistrierung, so dass KI-Agenten verfügbare Funktionen entdecken und detaillierte Dokumentationen zu ihnen abrufen können. Es verwendet den <i>Search Builder</i>, um auf die Metadaten der Funktionen zuzugreifen. </p>
com.top_logic.tl.ai.core.tools.script.messages.ErrorType = Fehlerart
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.LEXICAL_ERROR = Lexikalischer Fehler
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.LEXICAL_ERROR.tooltip = Lexikalischer Fehler (ungültige Zeichen).
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.SYNTAX_ERROR = Syntax-Fehler
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.SYNTAX_ERROR.tooltip = Syntaxfehler (Parserfehler).
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.VALIDATION_ERROR = Validierungsfehler
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.VALIDATION_ERROR.tooltip = Validierungsfehler (Modellreferenzen, Typenprüfung).
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.tooltip = Art des Validierungsfehlers.
com.top_logic.tl.ai.core.tools.text.TextEditTool = Tool zur Textbearbeitung
com.top_logic.tl.ai.core.tools.text.TextEditTool.tooltip = Liest ein textbasiertes Attribut eines Objekts wörtlich aus und ändert einen benannten Abschnitt davon. <p><b>Wozu es dient:</b> Bislang war die einzige Möglichkeit, einen gespeicherten Text zu ändern, ein Schreibvorgang für den gesamten Wert – ein TL-Script-Befehl mit dem vollständigen neuen Wert. Bei einem Dokumenttext oder einer Systemaufforderung kostet dies pro Bearbeitung den gesamten Wert an Ausgabetoken, und jeder unveränderte Absatz wird erneut durch das Modell geleitet, wodurch er geringfügig verändert zurückkommen kann. <code>#editText</code> kostet nur den geänderten Ausschnitt und kann nichts außerhalb davon verändern, da nichts außerhalb davon jemals erneut ausgegeben wird. </p> <p><b>Erst lesen, dann verankern.</b> <code>#readText</code> gibt den Wert so aus, wie er gespeichert ist, mit Zeilennummern in einer Spalte, sodass eine Passage benannt werden kann; <code>#editText</code> entnimmt eine Passage daraus und setzt eine andere an ihre Stelle. Das Paar funktioniert nur, weil das Lesen wortgetreu erfolgt: Ein Anker, der aus einer Darstellung zitiert wird, die alles normalisiert hat, wäre nicht der Text. </p> <p><b>Nur Text- und String-Attribute.</b> Die meisten Attribute eines Modells sind kein Text – Referenzen, Zahlen, Datumsangaben, Aufzählungen, Boolesche Werte, Binärdaten, mehrwertige Eigenschaften – und keines davon lässt sich per Suchen-und-Ersetzen bearbeiten. Sie werden anhand ihres Namens abgelehnt, anstatt umgewandelt zu werden, siehe <code>#editableText(TLObject, String)</code>. </p> <p><b>Sicherheit.</b> Das Objekt wird über <i>den TID-Resolver</i> aufgelöst, sodass ein Objekt, das der Principal des Laufs nicht lesen darf, genauso abgelehnt wird wie eines, das nicht existiert; das Attribut wird vor der Offenlegung auf Lesezugriff und vor der Änderung auf Schreibzugriff geprüft. Die Änderung wird in die eigene Transaktion der Runde aufgenommen und durch die Agenten-Schleife festgeschrieben; dabei wird sie ein zweites Mal von der Pre-Commit-Prüfung erfasst, und eine Einschränkung, die die Festschreibung verhindert, wird an das Modell zurückgemeldet. </p>
com.top_logic.tl.ai.core.tools.web.BraveSearchEngine = Brave
com.top_logic.tl.ai.core.tools.web.BraveSearchEngine.Config.api-key = Api-Schlüssel
com.top_logic.tl.ai.core.tools.web.BraveSearchEngine.Config.api-key.tooltip = Der Brave-API-Schlüssel. <p> Wird im Header <code>"X-Subscription-Token"</code> gesendet. Empfohlen wird ein Verweis auf den Schlüssel über den Namen des Geheimnisses, damit der Schlüssel nicht Teil der Konfiguration ist: </p><pre> &lt;api-key name="tl_brave_api_key"/&gt; </pre> <p> Ein Attributwert ist entweder ein verschlüsselter Schlüssel oder ein unverschlüsselter Schlüssel mit dem Präfix <code>unencrypted:</code>. Die gleichzeitige Konfiguration eines API-Schlüssels und von Zugangsdaten führt zu einem Fehler. </p>
com.top_logic.tl.ai.core.tools.web.BraveSearchEngine.Config.base-url = Basis-URL
com.top_logic.tl.ai.core.tools.web.BraveSearchEngine.Config.base-url.tooltip = Die URL des Brave Search API-Endpunkts.
com.top_logic.tl.ai.core.tools.web.BraveSearchEngine.Config.credentials = Zugangsdaten
com.top_logic.tl.ai.core.tools.web.BraveSearchEngine.Config.credentials.tooltip = Wie die Anfragen an Brave authentifiziert werden, wenn nicht mit einem API-Schlüssel. <p> Z. B. gar nicht, wenn ein dazwischenliegendes Gateway die Zugangsdaten hinzufügt. Zugangsdaten und einen API-Schlüssel gleichzeitig zu konfigurieren, ist ein Fehler. </p>
com.top_logic.tl.ai.core.tools.web.BraveSearchEngine.tooltip = <i>Websuchmaschine, die</i> auf der Brave Web Search API basiert (GET /res/v1/web/search). <p> Da Brave keine nativen Anfrageparameter zum Ein- oder Ausschließen von Domains bietet, werden Domain-Filter durch das Anhängen der Suchoperatoren „site:/-site:“ an die Suchanfrage realisiert. Das Alter der Ergebnisse entspricht der Aktualität in Brave, ihre Sprache dem Parameter „search_lang“. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService = Browser-Tools-Dienst
com.top_logic.tl.ai.core.tools.web.BrowserToolsService$SandboxMode = Sandbox-Modus
com.top_logic.tl.ai.core.tools.web.BrowserToolsService$SandboxMode.tooltip = Ob für die Browsersitzungen die Sandbox von Chromium auf Betriebssystemebene verwendet wird.
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.acquire-timeout-seconds = Timeout für die Sitzungsanforderung in Sekunden
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.acquire-timeout-seconds.tooltip = Wie lange ein Tool-Aufruf in Sekunden auf einen freien Sitzungsplatz wartet, bevor er mit dem Fehler „Browser beschäftigt, bitte erneut versuchen“ vorzeitig abgebrochen wird. <p> Absichtlich kurz gehalten: Eine begrenzte Wartezeit kann den Servlet-Thread-Pool nicht so erschöpfen, wie es die frühere unbegrenzte Sperre konnte. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.action-timeout-seconds = Timeout für Elementaktionen in Sekunden
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.action-timeout-seconds.tooltip = Timeout in Sekunden für eine Aktion auf einem einzelnen <b>Element</b> - browserClick / browserType sowie das Lesen des Accessibility-Snapshots. <p> Bewusst deutlich kürzer als das Timeout für Seitenladevorgänge, denn beide warten auf völlig verschiedene Dinge. Ein Klick wartet darauf, dass das Element <em>bedienbar</em> wird (im DOM vorhanden, sichtbar, stabil, nicht verdeckt, aktiviert); wenn die Seite dieses Element inzwischen neu gerendert und dabei entfernt hat - der klassische Fall eines Suchfelds, dessen Vorschlagsliste das Bedienelement ersetzt, nachdem die Suchanfrage eingegeben wurde - kann kein weiteres Warten den Vorgang mehr erfolgreich machen; ein Zeitbudget in Größe eines Seitenladevorgangs macht aus einem aussichtslosen Klick lediglich eine halbminütige Blockade mit einer nichtssagenden Zeitüberschreitung am Ende. Die Begrenzung auf wenige Sekunden erlaubt es dem Tool, umgehend mit der umsetzbaren Anweisung „erneuten Snapshot erstellen und eine frische Referenz verwenden“ zu antworten (siehe <i>Ausnahme „Browser-Referenz nicht bedienbar“</i>), und fängt den normalen Fall eines Elements, das einen Moment zur Stabilisierung braucht, weiterhin ab. </p> <p> Erhöhen Sie den Wert für eine bewusst langsame oder stark animierte Anwendung; er wird auf höchstens das Timeout für Seitenladevorgänge begrenzt, da es niemals sinnvoll ist, auf ein einzelnes Element länger zu warten als auf einen vollständigen Seitenladevorgang. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.allow-any-domains = Alle Domains zulassen
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.allow-any-domains.tooltip = Gibt an, ob die Zulassungsliste für Domains im öffentlichen Bereich deaktiviert ist (Modus „allow-any-domains“). <p> Bei „false“ (der sichere Standardwert) ist eine Navigation nur zulässig, wenn die Top-Level-Domain auf der Zulassungsliste steht. Bei „true“ wird die Zulassungsliste ignoriert und jede öffentliche Domain ist erreichbar – <em>mit der Ausnahme</em>, dass der SSRF-Schutz und die Sperrliste weiterhin bedingungslos gelten. „Allow-any“ lockert lediglich die Zulassungsliste für öffentliche Domänen, niemals jedoch den SSRF-Schutz oder die Sperrliste. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.allowed-domains = Zulässige Domains
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.allowed-domains.tooltip = Vom Administrator verwaltete Zulassungsliste mit Domänen, zu denen der Browser navigieren darf. <p> Ein Aufruf ist nur zulässig, wenn der Zielhost mit einem dieser Einträge übereinstimmt oder eine Subdomain davon ist. Ist die Liste leer, lehnt der Browser jeden Aufruf ab (Fail-Closed). Hierbei handelt es sich um eine Richtlinienkonfiguration – nicht um das vom Modell bereitgestellte Argument „allowedDomains“ des <i>Web-Suchtools</i>. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.apply-allowlist-to-all-requests = Zulassungsliste auf alle Anfragen anwenden
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.apply-allowlist-to-all-requests.tooltip = Ob die Zulassungsliste <b>jede</b> Verbindung des Browsers regelt und nicht nur die Herkunft des Hauptdokuments. <p> Die Zulassungsliste war bisher stets eine Kontrolle auf Ebene der <em>Top-Level-Herkunft</em>: Eine zugelassene Seite darf Unterressourcen (Schriften, Skripte, Bilder von einem CDN) von überall dort nachladen, wo weder der SSRF-Schutz greift noch ein Eintrag auf der Sperrliste vorliegt - genau wie ein gewöhnlicher Browser. „false“ (der Standardwert) behält dieses Verhalten bei: Der filternde Proxy setzt SSRF-Schutz und Sperrliste für jede Verbindung durch, die Zulassungsliste wird weiterhin nur für die Top-Level-Herkunft geprüft. </p> <p> Setzen Sie den Wert auf „true“ für eine abgeschottete Installation nach dem Grundsatz „dieser Browser darf mit diesen Domains sprechen und mit sonst keinen“: Der Proxy lehnt dann <em>jede</em> Verbindung zu einem Host ab, der nicht auf der Zulassungsliste steht, Unterressourcen eingeschlossen. Das ist strikt sicherer - es verhindert auch, dass eine zugelassene Seite Daten an Dritte sendet -, aber eine Seite, deren Ressourcen auf anderen Domains liegen, wird ohne diese dargestellt; es ist daher eine bewusste Entscheidung des Betreibers und nicht der Standard. Die Option hat keine Wirkung, wenn „allow-any“ aktiviert ist (dann gibt es keine Zulassungsliste, die angewendet werden könnte), und sie kann niemals etwas lockern: SSRF-Schutz und Sperrliste gelten in beiden Einstellungen für jede Verbindung. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.blocked-domains = Gesperrte Domains
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.blocked-domains.tooltip = Vom Administrator verwaltete Sperrliste mit Domains, zu denen der Browser niemals navigieren darf. <p> Eine Top-Level-Quelle wird abgelehnt, wenn ihr Host mit einem dieser Einträge übereinstimmt oder eine Subdomain davon ist (gleiche Übereinstimmungsregeln wie bei <i>den zugelassenen Domänen</i>). Die Sperrliste hat Vorrang vor der Zulassungsliste und gilt in jedem Modus, einschließlich „allow-any“. Sie schränkt eine umfassende Zulassungsliste (oder den Modus „allow-any“) durch Ausnahmen ein. Der SSRF-Schutz wird unabhängig davon durchgesetzt und kann nicht gelockert werden. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.browser-sandbox = Browser-Sandbox
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.browser-sandbox.tooltip = Ob die Browsersitzungen innerhalb der Chromium-eigenen Sandbox auf Betriebssystemebene laufen. <p> Die Sandbox ist die Grenze zwischen einem Renderer, der <em>von Angreifern kontrolliertes Seiten-JavaScript</em> ausführt, und dem Host, auf dem die Anwendung läuft: Ohne sie ist ein Renderer-Exploit einfach Code, der mit den Berechtigungen der Anwendung selbst und innerhalb ihres Prozessbaums läuft. Sie ist daher überall aktiv, wo sie es sein kann, und sie ist kein Regler zur Leistungsoptimierung. </p> <p> <i>Auto</i> (der Standard) lässt sie aktiv und gibt sie nur innerhalb eines Containers auf, erkannt an den Markerdateien und dem cgroup-Layout, die eine Container-Laufzeitumgebung hinterlässt. Das ist die einzige Umgebung, in der sie nicht einfach aktiv bleiben kann: Das Standard-Seccomp-Profil von Docker/Podman verweigert die clone- und unshare-Aufrufe, die die Namespace-Sandbox von Chromium benötigt, sodass ein Start mit Sandbox dort sofort fehlschlägt. Die richtige Lösung für einen Container ist ein Laufzeitprofil, das diese Aufrufe zulässt (verfolgt im Ticket zum Deploy-Image); bis dahin wird die Sandbox in Containern und nur in Containern aufgegeben. </p> <p> <i>Aktiviert</i> und <i>Deaktiviert</i> sind die Ausweichoptionen: „Aktiviert“ behält die Sandbox auch in einem Container (richtig, sobald das Image ein Seccomp-Profil mitbringt, das sie zulässt; andernfalls startet der Browser nicht), „Deaktiviert“ gibt sie bedingungslos auf, was die Isolation jeder aufgerufenen Seite schwächt und daher immer nur eine vorübergehende Diagnosemaßnahme sein sollte. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.cookie-pools-enabled = Cookie-Pools aktiviert
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.cookie-pools-enabled.tooltip = Hauptschalter für Cookie-Pools: Legt fest, ob die Verben „browserSaveCookies“ und „browserUseCookies“ aktiv sind. <p> „true“ (Standard) aktiviert persistente, benannte, verschlüsselte Anmeldepools: Eine Sitzung kann ihren aktuellen Anmeldestatus in einem benannten Pool speichern, und eine spätere Sitzung kann mit den Daten aus diesem Pool beginnen (siehe CookiePoolService). Bei „false“ werden beide Befehle mit einer eindeutigen Meldung abgelehnt, und es wird kein Cookie-Status erfasst oder als Ausgangswert verwendet – nutzen Sie diese Option, um die gesamte Funktion für eine Installation zu deaktivieren, unabhängig davon, was das Modell versucht. Das Deaktivieren hat keine Auswirkungen auf die normale Navigation oder den isolierten Kontext pro Sitzung. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.evade-bot-detection = Bot-Erkennung umgehen
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.evade-bot-detection.tooltip = Ob der Browser seinen Automatisierungs-Fingerabdruck verschleiern soll, damit Bot-Schutzmechanismen ihm mit geringerer Wahrscheinlichkeit eine Seite mit Zugriffsverweigerung oder einer Sicherheitsabfrage anzeigen (standardmäßig deaktiviert). <p> Bei „false“ (Standardeinstellung) verhält sich der Browser wie ein unverändertes headless Chromium: keine User-Agent-Überschreibung, keine zusätzlichen Startargumente, kein Fingerabdruck-Initialisierungsskript. Bei „true“ wird der Kontext jeder Sitzung so gestaltet, dass er wie ein gewöhnlicher Desktop-Chrome aussieht: Der Startparameter --disable-blink-features=AutomationControlled wird hinzugefügt, ein realistischer Desktop-Chrome-User-Agent (und eine passende „Accept-Language“-Einstellung) wird gesetzt, und ein kleines Init-Skript maskiert die üblichen Automatisierungshinweise (navigator.webdriver, leere navigator.plugins, navigator.languages, fehlendes window.chrome). </p> <p> Der <b>vollständige</b> Chromium-Build (Playwright-Kanal „chromium“, neuer Headless-Modus - weiterhin fensterlos), auf den die Verschleierung ebenfalls angewiesen ist - die leichtgewichtige chrome-headless-shell ist selbst ein Erkennungsmerkmal, aufgrund dessen manche Bot-Schutzmechanismen Inhalte unterdrücken, selbst wenn der User-Agent und navigator.webdriver maskiert sind -, wird unabhängig von dieser Einstellung für jede Sitzung gestartet, denn nur er erlaubt es, die UDP-Kommunikation von WebRTC abzuschalten. Siehe BrowserSession.buildLaunchOptions, einschließlich der damit verbundenen Voraussetzung für die Bereitstellung. </p> <p> <b>Warnhinweis - nur für autorisierte Nutzung.</b> Die Aktivierung dieser Option umgeht bewusst den Schutz einer Website vor automatisiertem Zugriff und kann gegen die Nutzungsbedingungen dieser Website verstoßen. Es handelt sich um eine vom Betreiber aktivierbare Option für autorisierte Ziele (z. B. eine Website, bei der der Betreiber angemeldet ist und die ihm gehört oder für deren Automatisierung er die Erlaubnis besitzt); sie ist standardmäßig deaktiviert und darf nicht aktiviert werden, um auf Websites zuzugreifen, bei denen dies nicht gestattet ist. SSRF-Schutz, Sperrliste und Zulassungsliste bleiben davon unberührt und werden weiterhin unverändert durchgesetzt. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.headless = Headless-Modus
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.headless.tooltip = Ob Browsersitzungen im Headless-Modus (ohne sichtbares Fenster) gestartet werden. <p> „true“ (Standard) ist die produktionssichere Variante: Jede Sitzung führt ein fensterloses Chromium aus, sodass auf dem App-Host nichts angezeigt wird und kein lokaler Bildschirm erforderlich ist. Setzen Sie den Wert auf „false“, um ein Chromium-Fenster <b>mit Benutzeroberfläche</b> (sichtbar) auf dem Desktop des App-Hosts zu starten – eine Annehmlichkeit für die Entwicklung und den lokalen Einsatz, die einen lokalen Bildschirm erfordert und nicht in der Produktion oder auf Remote-/Headless-Hosts verwendet werden darf. Wenn auf einem Host ohne Bildschirm ein „headed“ Modus angefordert wird, bricht der Dienst beim Start sofort ab, anstatt bei einem Startvorgang zu hängen, der niemals erfolgreich sein kann. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.max-concurrent-sessions = Maximale Anzahl gleichzeitiger Sitzungen
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.max-concurrent-sessions.tooltip = Maximale Anzahl gleichzeitig zulässiger aktiver Browsersitzungen (isolierte Kontexte). <p> Dies begrenzt den Speicherbedarf: Jede aktive Sitzung läuft in einem eigenen Chromium-Prozess (ca. 200–400 MB einschließlich des Playwright-Treibers). Anfragen, die diese Obergrenze überschreiten, geben eine inaktive Sitzung nach dem LRU-Prinzip frei oder schlagen – falls keine Sitzung inaktiv ist – sofort mit einem wiederholbaren „Browser beschäftigt“-Fehler fehl. Der Standardwert von 4 hält den Spitzenwert des Browser-Speicherbedarfs bei etwa 1 GB; erhöhen Sie diesen Wert entsprechend dem verfügbaren RAM. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.max-page-bytes = Maximale Seitenbyteanzahl
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.max-page-bytes.tooltip = Maximale Anzahl an HTML-Bytes, die von einer Seite gelesen werden, bevor die Extraktion beendet wird.
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.max-page-chars = Maximale Zeichenanzahl pro Seite
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.max-page-chars.tooltip = Maximale Zeichenanzahl des extrahierten Textes, den ein Browser-Tool zurückgibt.
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.navigation-settle-millis = Navigations-Beruhigungszeit in Millisekunden
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.navigation-settle-millis.tooltip = Höchstgrenze (in Millisekunden) für die <b>Stabilisierungsphase</b> nach dem Laden: Nachdem ein Seitenladevorgang (browserNavigate, browserBack oder ein browserClick, der navigiert hat) das Laden der Seite abgewartet hat und bevor die Seite erfasst wird, wartet der Browser darauf, dass die Seite zur Ruhe kommt - und jede der drei Wartephasen wird einzeln durch diese eine Obergrenze begrenzt. <p> <b>Commit.</b> Nur für einen browserClick, und nur dann, wenn die Seite sich per Skript selbst weiterbewegt hat statt über den angeklickten Link: Der Browser wartet, bis das neue Dokument das alte tatsächlich ersetzt hat, bevor er überhaupt etwas stabilisieren lässt - denn bis dahin sind die Adresse der Seite und ihr Ladezustand noch die des alten Dokuments. Eine Navigation, die begonnen wird und nie ankommt - ein 204, ein Download, ein Handler, der es sich anders überlegt -, wird nach dieser Obergrenze aufgegeben. </p> <p> <b>Netzwerkruhe.</b> Eine kurze Gelegenheit für clientseitiges Rendern, das erst nach dem load-Ereignis beginnt: Die Wartezeit endet, sobald die Seite für die Dauer von Playwrights Leerlauffenster keine Anfrage mehr gestellt hat, oder wenn diese Obergrenze abläuft. Sie wird bewusst <em>nicht</em> durch das Timeout für Seitenladevorgänge begrenzt: Eine Seite, die pollt, streamt oder Beacons sendet - die meisten SSO-Anmeldeseiten und die meisten Single-Page-Anwendungen -, erreicht überhaupt nie Netzwerkruhe; ein Budget in der Größe eines Seitenladevorgangs brachte hier also nichts und kostete bei jedem Vorgang dieses gesamte Budget. </p> <p> <b>DOM-Ruhe.</b> Anschließend wartet der Browser, bis das DOM ruhig ist (keine Änderung während eines kurzen internen Entprellungsfensters, ~500 ms) und jede laufende, endliche CSS-Animation beendet ist, oder bis diese Obergrenze abläuft. Dies schließt die häufige Lücke, bei der eine Seite ein Cookie-Einwilligungsbanner, ein Lazy-Widget oder andere Inhalte erst einen Moment <em>nach</em> der Rückkehr von der Navigation einblendet: Ohne die Stabilisierungsphase wird der Snapshot zu früh aufgenommen und verpasst diesen Inhalt, was einen manuellen erneuten Snapshot erzwingt. Eine statische Seite kommt fast sofort zur Ruhe und wird höchstens um das Entprellungsfenster verzögert, sodass schnelle Seiten nicht nennenswert verlangsamt werden; eine Seite, die ständig Änderungen durchläuft (ständige Animationen/Abfragen), unterliegt dieser Obergrenze. </p> <p> Die drei Phasen summieren sich auf keinem gewöhnlichen Weg: Ein Klick, der nicht navigiert, durchläuft allein die DOM-Ruhe, und ein gewöhnlicher Link- oder Formular-Klick hat bereits committet, wenn die Commit-Phase erreicht wird. Die Obergrenze wird immer deutlich innerhalb der Frist pro Operation angewendet, sodass sie niemals zu einem Hängenbleiben führen kann. Setzen Sie den Wert auf 0, um die Stabilisierungsphase vollständig zu deaktivieren und die Seite zu erfassen, sobald sie geladen ist; die dann erfasste Seite ist immer noch in sich stimmig - Adresse, Inhalt und Element-Referenzen werden in einem Zug gelesen -, sie wird nur früher erfasst. Die Stabilisierungsphase gilt <em>nicht</em> für browserSnapshot (explizite erneute Erfassung), für browserType (Bearbeitung derselben Seite) und auch nicht für einen browserClick, der keine Navigation ausgelöst hat - dieser erhält allein die Wartezeit auf DOM-Ruhe, da es keinen Seitenladevorgang gibt, auf den zu warten wäre. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.navigation-timeout-seconds = Timeout für Seitenladevorgänge in Sekunden
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.navigation-timeout-seconds.tooltip = Timeout für einen <b>Seitenladevorgang</b> (browserNavigate, browserBack und ein browserClick, der eine Navigation ausgelöst hat) in Sekunden. <p> Dies begrenzt das Warten auf das Dokument: wie lange der Browser höchstens benötigen darf, um auf einer langsamen Seite domcontentloaded und anschließend das load-Ereignis zu erreichen. Es begrenzt <em>nicht</em> die Stabilisierungsphase, die auf einen Ladevorgang folgt - diese wird durch <i>Navigations-Beruhigungszeit in Millisekunden</i> wesentlich strenger begrenzt, denn eine Seite, die nie zur Ruhe kommt, darf nicht bei jedem Vorgang so viel Zeit kosten wie ein ganzer Seitenladevorgang. Aktionen auf einem <em>Element</em> werden noch einmal separat und deutlich strenger durch <i>Timeout für Elementaktionen in Sekunden</i> begrenzt. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.session-idle-timeout-seconds = Timeout für inaktive Sitzungen in Sekunden
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.session-idle-timeout-seconds.tooltip = Wie lange eine Sitzung inaktiv bleiben darf (kein Tool-Aufruf), bevor sie geschlossen und ihre Ressourcen freigegeben werden, in Sekunden.
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.SandboxMode.AUTO = Auto
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.SandboxMode.AUTO.tooltip = Der Standard: Die Sandbox wird überall verwendet, nur nicht innerhalb eines Containers, wo das Standard-Laufzeitprofil Chromium daran hindert, eine einzurichten.
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.SandboxMode.DISABLED = Deaktiviert
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.SandboxMode.DISABLED.tooltip = Die Sandbox wird nie verwendet, unabhängig von der Umgebung. Das schwächt die Isolation jeder aufgerufenen Seite.
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.SandboxMode.ENABLED = Aktiviert
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.SandboxMode.ENABLED.tooltip = Die Sandbox wird immer verwendet, auch in einem Container. Chromium startet nicht, wo es keine einrichten kann.
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.tooltip = Dienst, der den Pool isolierter, sitzungsspezifischer, headless Chromium-Browser verwaltet, die vom <i>Browser-Tool</i> verwendet werden. <p> Er verwaltet die Konfiguration (Timeout pro Navigation, Byte-/Zeichen-Obergrenzen pro Seite, die vom Administrator festgelegte Richtlinie für die Zulassungsliste, Sperrliste und „Alles zulassen“ sowie die Begrenzungen für die gleichzeitige Nutzung) und ist für den <i>Browser-Sitzungspool</i> verantwortlich. Jede Agentensitzung erhält eine <b>eigene</b> <i>Browsersitzung</i> – eine dedizierte <code>Playwright/Browser/BrowserContext</code> mit separaten Cookies und Speicher –, die über die vielen Tool-Aufrufe eines Durchlaufs hinweg wiederverwendet wird. Zwei gleichzeitig laufende Sitzungen können niemals die Cookies, Seiten oder Ergebnisse der jeweils anderen einsehen. </p> <p><b>Parallelitätsmodell (ersetzt die frühere einzelne globale Sperre).</b> Sitzungen laufen vollständig parallel. Ein <i>Browser-Sitzungspool</i> begrenzt die Anzahl der aktiven Sitzungen auf <i>die maximale Anzahl gleichzeitiger Sitzungen</i> (eine Speichergrenze, keine Durchsatzdrosselung). Beim Starten einer neuen Sitzung wird höchstens <i>„Acquire-Timeout“-Sekunden</i> lang auf einen freien Slot gewartet, wobei bei Bedarf die am längsten nicht genutzte inaktive Sitzung freigegeben wird; wenn kein Slot frei wird, schlägt der Vorgang schnell mit <i>einer „Browser-Busy“-Ausnahme</i> fehl, anstatt den aufrufenden Thread auf unbestimmte Zeit zu blockieren. Inaktive Sitzungen werden nach <i>„Session-Idle-Timeout“-Sekunden</i> entfernt. Jeder Browservorgang läuft unter einer festen äußeren Frist, sodass eine hängende Seite niemals einen Slot blockieren kann. </p> <p> Die Sicherheit ist mehrschichtig aufgebaut und wird bei jeder Navigation und jeder browserinternen Anfrage (Hauptdokument, Weiterleitungen und Unterressourcen) in einer festgelegten Prioritätsreihenfolge angewendet: </p> <ol> <li><b>SSRF hat immer Vorrang.</b> Jede Anfrage an eine private, Loopback-, Link-Local- oder anderweitig interne Adresse wird aufgrund <i>der URL-Sicherheit</i> bedingungslos abgelehnt. Diese Regelung kann durch keine Konfiguration gelockert werden.</li> <li><b>Die Sperrliste gilt immer.</b> Eine Top-Level-Quelle, die auf der vom Administrator geführten Sperrliste steht, wird in jedem Modus abgelehnt.</li> <li><b>Anschließend kommt die Zulassungsliste zum Tragen – es sei denn, „allow-any“ ist aktiviert.</b> Standardmäßig muss die Top-Level-Herkunftsquelle ebenfalls auf der Zulassungsliste stehen. Wenn „allow-any“ aktiviert ist, wird die Allowlist für die Public Domain übersprungen (jede Public Domain, die weder durch SSRF blockiert noch auf der Blockliste steht, ist erreichbar); „allow-any“ lockert <em>nur</em> die Allowlist, niemals die SSRF-Regeln oder die Blockliste.</li> </ol> <p> Die Zulassungsliste, die Sperrliste und das „allow-any“-Flag sind vom Administrator festgelegte Richtlinien – keine vom Modell vorgegebenen Argumente. Die Standardeinstellung („allowlist-enforced“, „allow-any“ deaktiviert) ist von Haus aus sicher: Eine leere Zulassungsliste bei deaktiviertem „allow-any“ lehnt jede Navigation ab. </p> <p><b>Über all dem steht die Navigationssteuerung durch <i>die Navigationsrichtlinie</i></b>, die im WebToolsService konfiguriert und pro Sicherheitsrolle aufgelöst wird: Welche Ursprünge <em>der User-</em> Agent <em>dieses Benutzers</em> erreichen darf und ob eine Seite dort ihm eine Datei übergeben darf. Sie wirkt sich auf die oben genannten Listen aus – beide müssen einen Ursprung zulassen – und eine Anwendung, die keine davon konfiguriert, unterliegt keinen zusätzlichen Einschränkungen. </p> <p><b>Wo die Richtlinie durchgesetzt wird.</b> Die maßgebliche Ebene ist ein <i>Filter-Proxy</i> auf der Loopback-Schnittstelle, an die <em>jede</em> Browsersitzung gebunden ist: Jede von Chromium hergestellte Verbindung – Navigation auf oberster Ebene, Weiterleitungssprung, Unterressource, Ziel mit IP-Literal – wird dort geprüft, bevor ein Paket den Rechner verlässt, und das Ziel ist per DNS festgebunden, sodass ein neu gebundener Host nicht durchschlüpfen kann. Die Zulassungsliste, die Sperrliste und das „allow-any“-Flag sind Teil <em>der Dienstkonfiguration</em> und für jede Sitzung identisch, sodass sich an dieser Hälfte der Entscheidung von Sitzung zu Sitzung nichts ändert; die Browserrichtlinie variiert hingegen je nach Rolle, weshalb pro <em>Richtlinie</em> ein eigener Proxy <em>verwendet</em> wird und nicht nur einer für den gesamten Dienst. Innerhalb jedes Browsers wird dieselbe Richtlinie erneut durch eine kontextbezogene Anforderungsweiterleitung sowie einen Umleitungsschutz und eine erneute Validierung der Ziel-URL angewendet – wodurch aus einer Ablehnung die klare Richtlinienmeldung des Tools wird. </p>
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig = Konfiguration der Browsing-Richtlinien
