com.top_logic.xio.command.XMLImportCommand.Config.transient = Transient
com.top_logic.xio.command.XMLImportCommand.Config.transient.tooltip = Ob Objekte vorübergehend instanziiert werden sollen. <p> Um eine Wirkung zu erzielen, muss das importierte Objekt in einer Nachbearbeitungsaktion weiterverarbeitet werden. </p>
