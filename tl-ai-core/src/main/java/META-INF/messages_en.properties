com.top_logic.tl.ai.core.security.layout.ToolCatalogComponent.tooltip = The tools of this application, with what the saved policy says about each of them.
com.top_logic.tl.ai.core.security.layout.ToolReachability = Tool reachability
com.top_logic.tl.ai.core.security.layout.ToolReachability.EVERYONE = Everyone
com.top_logic.tl.ai.core.security.layout.ToolReachability.EVERYONE.tooltip = Every account, because the baseline grants it.
