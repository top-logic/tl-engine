class.com.top_logic.tl.ai.core.security.layout.I18NConstants.WARN_DATA_ROLE_ONLY_WITHOUT_SECURITY__ROLE_GROUPS_PARTS = Role {0} holds {1}, but appears in no Read, Write or Create grant of the model access rights: its data tools reach only what is marked without security ({2}) and see nothing and change nothing elsewhere, and a refused read comes back empty rather than as an error.
