model.SecurityStructure = Zentrale Berechtigungen
model.SecurityStructure.Root = Zentrale Berechtigungen
model.SecurityStructure.Root.tooltip = Das Wurzelobjekt der zentralen Berechtigungsstruktur. Es wird automatisch als Wurzelobjekt seines Moduls angelegt und kann nicht gelöscht werden.
model.SecurityStructure.SecurityStructure.Root = Zentrale Berechtigungen
model.SecurityStructure.SecurityStructure.Root.Hauptbenutzer = Hauptbenutzer
model.SecurityStructure.SecurityStructure.Root.Hauptbenutzer.tooltip = Zugänge, denen über eine an der zentralen Berechtigungswurzel startende Regel eine erweiterte globale Rolle zugewiesen wird. Damit werden typischerweise ausgewählten Nutzern zusätzliche Berechtigungen gewährt.
model.SecurityStructure.SecurityStructure.Root.Nutzer = Nutzer
model.SecurityStructure.SecurityStructure.Root.Nutzer.tooltip = Zugänge, denen über eine an der zentralen Berechtigungswurzel startende Regel eine globale Rolle zugewiesen wird. Damit wird typischerweise allen Nutzern der allgemeine Zugriff auf die Anwendung gewährt.
model.SecurityStructure.SecurityStructure.Root.name = Name
model.SecurityStructure.SecurityStructure.Root.name.tooltip = Technischer Name des Wurzelobjekts der Berechtigungsstruktur. Da das Objekt automatisch als Wurzelobjekt seines Moduls angelegt wird, ist der Name fest vorgegeben.
model.SecurityStructure.SecurityStructure.Root.tooltip = Typ des Wurzelobjekts der zentralen Berechtigungsstruktur. Regeln, die Berechtigungen für die gesamte Anwendung vergeben, starten an diesem Objekt.
model.SecurityStructure.tooltip = Modul der zentralen Berechtigungsstruktur. Ihr Wurzelobjekt ist der Anker für Berechtigungen, die anwendungsweit und nicht für ein einzelnes Fachobjekt vergeben werden.
