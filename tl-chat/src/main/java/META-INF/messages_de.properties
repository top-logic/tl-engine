com.top_logic.ai.chat.view.AgentChatElement = Agenten-Chat-Element
com.top_logic.ai.chat.view.AgentChatElement$TraceMode = Trace-Modus
com.top_logic.ai.chat.view.AgentChatElement$TraceMode.tooltip = Umfang der im Chat angezeigten Details zur Ausführung durch den Agenten.
com.top_logic.ai.chat.view.AgentChatElement.Config.prompt-improver-agent = Agent zur Prompt-Verbesserung
com.top_logic.ai.chat.view.AgentChatElement.Config.prompt-improver-agent.tooltip = Name des Agenten, der Prompt-Entwürfe verbessert. Leer lassen, um die Prompt-Verbesserung abzuschalten.
com.top_logic.ai.chat.view.AgentChatElement.Config.react-element = React-Element
com.top_logic.ai.chat.view.AgentChatElement.Config.react-element.tooltip = Registriertes React-Element, das diesen Chat rendert. Standardmäßig ist hier „TLAgentChat“ eingestellt. Ein Host, der register('MyChat', MyComposition) aufgerufen hat, setzt diesen Wert auf „MyChat“.
com.top_logic.ai.chat.view.AgentChatElement.Config.trace-mode = Trace-Modus
com.top_logic.ai.chat.view.AgentChatElement.Config.trace-mode.tooltip = Umfang der im Chat angezeigten Details zur Ausführung des Agenten.
com.top_logic.ai.chat.view.AgentChatElement.TraceMode.DETAILED = Ausführlich
com.top_logic.ai.chat.view.AgentChatElement.TraceMode.DETAILED.tooltip = Zeigt den detaillierten Ausführungsverlauf an.
com.top_logic.ai.chat.view.AgentChatElement.TraceMode.NONE = Keine
com.top_logic.ai.chat.view.AgentChatElement.TraceMode.NONE.tooltip = Blendet Ausführungsspuren aus.
com.top_logic.ai.chat.view.AgentChatElement.TraceMode.OVERVIEW = Übersicht
com.top_logic.ai.chat.view.AgentChatElement.TraceMode.OVERVIEW.tooltip = Zeigt eine kompakte Übersicht über die Ausführung an.
com.top_logic.ai.chat.view.AgentChatElement.tooltip = Deklaratives „ <agent-chat/> “-Element für die React-Darstellungsschicht. <p> Die mitgelieferte Komponente ist TLAgentChat. Eine Anwendung, die den Chat aus den in tl-chat-seams.js exportierten Bausteinen zusammensetzt, registriert ihr eigenes Element (register('MyChat', MyComposition)) und nennt es hier als react-element. Das Control bindet weiterhin Sitzung und Tracker; die Browser-Komponente spricht weiterhin /chat/* an. </p>
com.top_logic.ai.chat.view.ChatConversationElement = Chat-Konversationselement
com.top_logic.ai.chat.view.ChatConversationElement$Actions = Aktionen
com.top_logic.ai.chat.view.ChatConversationElement$Actions.tooltip = Die Zeile mit Kopieren, Bewertung und Neu erzeugen sowie benannte Host-Aktionen.
com.top_logic.ai.chat.view.ChatConversationElement$Controls = Bedienelemente
com.top_logic.ai.chat.view.ChatConversationElement$Controls.tooltip = Die Picker- und Footer-Schalter am Composer.
com.top_logic.ai.chat.view.ChatConversationElement$Mention = Erwähnung
com.top_logic.ai.chat.view.ChatConversationElement$Mention.tooltip = Deklarative Bindung, mit der @ jedes beliebige Modellobjekt erwähnen kann. <p> Die Bindung erfolgt über TL-Script auf dieselbe Weise wie bei „ <data-list> “: „rows“ berechnet die Objekte, die @ anbieten kann; „label“ und „text“ berechnen, was angezeigt wird und welchen zitierten Text die Erwähnung in die Nachricht einfügt. Jede Erwähnung enthält die stabile ID des Objekts, sodass ein Host-Tool diese ID auflösen kann (das Framework enthält kein solches Tool). Vorschläge werden an den Browser übermittelt und dort während der Eingabe des Benutzers gefiltert; halten Sie die Auswahl daher mithilfe von „rows“ und „limit“ überschaubar. </p>
com.top_logic.ai.chat.view.ChatConversationElement$Trace = Detailgrad
com.top_logic.ai.chat.view.ChatConversationElement$Trace.tooltip = Wie viel von der Ausführung des Agenten das Transkript zeigt. Eine einzige Einstellung: sie ersetzt den früheren getrennten Trace-Modus und die Laufzusammenfassung. „Zusammenfassung“ ist die eingeklappte, aber aufklappbare Laufzusammenfassung, die der Benutzer per Klick öffnet.
com.top_logic.ai.chat.view.ChatConversationElement.Actions.copy = Kopieren
com.top_logic.ai.chat.view.ChatConversationElement.Actions.copy.tooltip = Ob eine fertige Antwort kopiert werden kann.
com.top_logic.ai.chat.view.ChatConversationElement.Actions.host = Host
com.top_logic.ai.chat.view.ChatConversationElement.Actions.host.tooltip = Registrierte Namen für Nachrichten-Aktionen (im Code definierte Namenskomponenten). Unbekannte Namen werden mit einer Debug-Zeile ignoriert; sie führen nicht zu einem Fehler in der Ansicht. Im Layout-Editor ausgeblendet: Die Werte müssen mit den Registrierungen in TypeScript übereinstimmen.
com.top_logic.ai.chat.view.ChatConversationElement.Actions.rate = Bewertung
com.top_logic.ai.chat.view.ChatConversationElement.Actions.rate.tooltip = Ob eine fertige Antwort bewertet werden kann.
com.top_logic.ai.chat.view.ChatConversationElement.Actions.regenerate = Neu erzeugen
com.top_logic.ai.chat.view.ChatConversationElement.Actions.regenerate.tooltip = Ob die letzte Antwort erneut erzeugt werden kann.
com.top_logic.ai.chat.view.ChatConversationElement.Actions.timestamp = Zeitstempel
com.top_logic.ai.chat.view.ChatConversationElement.Actions.timestamp.tooltip = Ob der Zeitstempel der Antwort angezeigt wird.
com.top_logic.ai.chat.view.ChatConversationElement.Config.actions = Aktionen
com.top_logic.ai.chat.view.ChatConversationElement.Config.actions.tooltip = Welche Befehle unter einer fertigen Antwort stehen.
com.top_logic.ai.chat.view.ChatConversationElement.Config.busy = Beschäftigt
com.top_logic.ai.chat.view.ChatConversationElement.Config.busy.tooltip = Der optionale Ausgabekanal wird auf „true“ gesetzt, während der Agent arbeitet.
com.top_logic.ai.chat.view.ChatConversationElement.Config.chat-id = Chat-ID
com.top_logic.ai.chat.view.ChatConversationElement.Config.chat-id.tooltip = Gemeinsamer Schlüssel, der es ermöglicht, dass diese Unterhaltung, eine Sitzungsliste und eine Leiste eine einzige Unterhaltung anzeigen. Die Standardeinstellung ist „default“, sodass nicht konfigurierte Elemente auf einer Seite einander finden können.
com.top_logic.ai.chat.view.ChatConversationElement.Config.citation-renderer = Zitier-Renderer
com.top_logic.ai.chat.view.ChatConversationElement.Config.citation-renderer.tooltip = Name des registrierten Zitier-Renderers (bezeichnet eine im Code eingerichtete Komponente). Bei leerem Wert wird das integrierte Zitier-Popover beibehalten. Im Layout-Editor ausgeblendet: Der Wert muss mit einer Registrierung in TypeScript übereinstimmen.
com.top_logic.ai.chat.view.ChatConversationElement.Config.citations = Quellenangaben
com.top_logic.ai.chat.view.ChatConversationElement.Config.citations.tooltip = Ob die Antwort ihre zitierten Quellen überhaupt anzeigt: die Inline-Markierungen und die „Quellen“-Spalte pro Antwort. Mit „Aus“ wird die gesamte Zitierfläche aus dem Transkript entfernt.
com.top_logic.ai.chat.view.ChatConversationElement.Config.class.tooltip = Die Implementierung des Elements. Im Layout-Editor ausgeblendet: Das Tag legt sie bereits fest, und eine Änderung ergibt ein Element, das nicht mehr zu den daneben angezeigten Optionen passt.
com.top_logic.ai.chat.view.ChatConversationElement.Config.controls = Bedienelemente
com.top_logic.ai.chat.view.ChatConversationElement.Config.controls.tooltip = Welche Auswahlfelder und Fußzeilenelemente der Composer anzeigt.
com.top_logic.ai.chat.view.ChatConversationElement.Config.input = Eingabe
com.top_logic.ai.chat.view.ChatConversationElement.Config.input.tooltip = Optionaler Kanal, der die geöffnete AgentSession enthält. Die Konversation erfolgt nach einem Schreibvorgang. Bitte leer lassen, wenn die Konversation ausschließlich über die Chat-ID mit den anderen Chat-Elementen kommunizieren soll.
com.top_logic.ai.chat.view.ChatConversationElement.Config.mention = Erwähnung
com.top_logic.ai.chat.view.ChatConversationElement.Config.mention.tooltip = Deklarative @-Erwähnungsbindung: Ermöglicht es, mit @ ein beliebiges Modellobjekt anzubieten, das mit TL-Script konfiguriert wurde, wie z. B. <data-list>. Wenn diese Option gesetzt ist, liefert sie die @-Kandidaten und hat Vorrang vor <i>der Referenzquelle</i>.
com.top_logic.ai.chat.view.ChatConversationElement.Config.menu-items = Menüeinträge
com.top_logic.ai.chat.view.ChatConversationElement.Config.menu-items.tooltip = Registrierte Namen von Composer-Menüeinträgen. Im Layout-Editor ausgeblendet: Die Werte müssen mit den Registrierungen in TypeScript übereinstimmen.
com.top_logic.ai.chat.view.ChatConversationElement.Config.personalization-key.tooltip = Optionale Überschreibung des automatisch abgeleiteten Personalisierungsschlüssels. Im Layout-Editor ausgeblendet: Der aus dem Ansichtskontext abgeleitete Schlüssel ist der richtige, und ein von Hand eingetragener Wert verschiebt stillschweigend, was ein Benutzer personalisiert hat.
com.top_logic.ai.chat.view.ChatConversationElement.Config.placeholder = Platzhalter
com.top_logic.ai.chat.view.ChatConversationElement.Config.placeholder.tooltip = Optionaler Platzhalter für das Entwurfsfeld. Leer lassen, um den eingebauten Text zu behalten.
com.top_logic.ai.chat.view.ChatConversationElement.Config.prompt-improver-agent = Agent zur Prompt-Verbesserung
com.top_logic.ai.chat.view.ChatConversationElement.Config.prompt-improver-agent.tooltip = Name des Agenten, der Prompt-Entwürfe verbessert. Leer lassen, um die Prompt-Verbesserung abzuschalten.
com.top_logic.ai.chat.view.ChatConversationElement.Config.react-element = React-Element
com.top_logic.ai.chat.view.ChatConversationElement.Config.react-element.tooltip = Registriertes React-Element, das diese Unterhaltung rendert. Standardmäßig ist „TLChatConversation“ eingestellt. Im Layout-Editor ausgeblendet: Der Wert muss mit einer Registrierung in TypeScript übereinstimmen.
com.top_logic.ai.chat.view.ChatConversationElement.Config.reference-source = Referenzquelle
com.top_logic.ai.chat.view.ChatConversationElement.Config.reference-source.tooltip = Name einer registrierten Referenzquelle (bezeichnet eine im Code eingerichtete Komponente). Ist dieser Name leer und es liegt keine Erwähnungsbindung vor, wird der @-Picker ausgeblendet. Eine Erwähnungsbindung hat Vorrang vor diesem Namen. Im Layout-Editor ausgeblendet: Der Wert muss mit einer Registrierung in TypeScript übereinstimmen; ein Designer verknüpft @ stattdessen mit der Erwähnungsgruppe.
com.top_logic.ai.chat.view.ChatConversationElement.Config.trace = Detailgrad
com.top_logic.ai.chat.view.ChatConversationElement.Config.trace.tooltip = Inwieweit die Ausführung des Agenten im Protokoll angezeigt wird: gar nicht, als zusammengefasste Übersicht oder als vollständiger Inline-Trace. Der Benutzer kann dies weiterhin live über die Trace-Auswahl des Composers ändern.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.agent-picker = Agentenauswahl
com.top_logic.ai.chat.view.ChatConversationElement.Controls.agent-picker.tooltip = Ob die Agentenauswahl angeboten wird.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.attachments = Anhänge
com.top_logic.ai.chat.view.ChatConversationElement.Controls.attachments.tooltip = Ob Dateien angehängt werden können.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.auto-approve = Automatisch genehmigen
com.top_logic.ai.chat.view.ChatConversationElement.Controls.auto-approve.tooltip = Ob der Schalter für die automatische Genehmigung angezeigt wird.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.enter-hint = Enter-Hinweis
com.top_logic.ai.chat.view.ChatConversationElement.Controls.enter-hint.tooltip = Ob die Fußzeile den Enter-Hinweis zeigt.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.mcp = MCP
com.top_logic.ai.chat.view.ChatConversationElement.Controls.mcp.tooltip = Ob MCP-Server umgeschaltet werden können.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.model-picker = Modellauswahl
com.top_logic.ai.chat.view.ChatConversationElement.Controls.model-picker.tooltip = Ob der Modellauswähler angeboten wird.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.thinking = Denkaufwand
com.top_logic.ai.chat.view.ChatConversationElement.Controls.thinking.tooltip = Ob Aufwandstufen angeboten werden.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.trace-picker = Trace-Auswahl
com.top_logic.ai.chat.view.ChatConversationElement.Controls.trace-picker.tooltip = Ob die Trace-Modus-Auswahl angeboten wird.
com.top_logic.ai.chat.view.ChatConversationElement.Mention.label = Bezeichnung
com.top_logic.ai.chat.view.ChatConversationElement.Mention.label.tooltip = Optionales TL-Skript für ein Objekt, das seine angezeigte Beschriftung und die Beschriftung der Erwähnung berechnet. Bei leerer Eingabe wird die eigene Beschriftung des Objekts verwendet.
com.top_logic.ai.chat.view.ChatConversationElement.Mention.limit = Höchstzahl
com.top_logic.ai.chat.view.ChatConversationElement.Mention.limit.tooltip = Höchstens so viele Kandidaten werden an den Browser übertragen. Die Liste wird im Browser während der Eingabe gefiltert; dies begrenzt also die Datenmenge, nicht die Suche.
com.top_logic.ai.chat.view.ChatConversationElement.Mention.observed-types = Beobachtete Typen
com.top_logic.ai.chat.view.ChatConversationElement.Mention.observed-types.tooltip = Typen, bei denen sich das Objekt ändert (Erstellen / Aktualisieren / Löschen), führen <i>die Zeilen</i> erneut aus, sodass die Kandidatenmenge automatisch aktualisiert wird.
com.top_logic.ai.chat.view.ChatConversationElement.Mention.rows = Zeilen
com.top_logic.ai.chat.view.ChatConversationElement.Mention.rows.tooltip = Eine TL-Script-Funktion, die die Objekte berechnet, die @ erwähnen kann (eine <i>Sammlung</i>), ähnlich wie bei der Bindung von Zeilen in „ <data-list> “ und „ <table> “.
com.top_logic.ai.chat.view.ChatConversationElement.Mention.text = Text
com.top_logic.ai.chat.view.ChatConversationElement.Mention.text.tooltip = Optionales TL-Skript für ein Objekt, das den Zitattext berechnet, den die Erwähnung in die Nachricht einfügt – das, was der Agent vorliest. Bei leerer Angabe wird die Bezeichnung verwendet.
com.top_logic.ai.chat.view.ChatConversationElement.Trace.DETAILED = Ausführlich
com.top_logic.ai.chat.view.ChatConversationElement.Trace.DETAILED.tooltip = Der vollständige Ausführungsablauf, inline.
com.top_logic.ai.chat.view.ChatConversationElement.Trace.NONE = Keine
com.top_logic.ai.chat.view.ChatConversationElement.Trace.NONE.tooltip = Nur die Antwort; keine Details zur Ausführung.
com.top_logic.ai.chat.view.ChatConversationElement.Trace.SUMMARY = Zusammenfassung
com.top_logic.ai.chat.view.ChatConversationElement.Trace.SUMMARY.tooltip = Eine zusammengeklappte, einzeilige Zusammenfassung des Laufs, die der Benutzer aufklappen kann.
com.top_logic.ai.chat.view.ChatConversationElement.tooltip = Deklaratives „ <chat-conversation/> “-Element: Das Transkript und das Eingabefeld als ein Anzeigeelement. <p> Führt die bisher getrennten Elemente „ <chat-thread/> “ und „ <chat-composer/> “ zusammen. Transkript und Eingabefeld befinden sich fast immer nebeneinander, daher bilden sie eine platzierbare Box; eine Sitzungsliste (ein „ <data-list> “ von „AgentSessions“) und eine Leiste (<chat-rail/>) bleiben getrennt, da diese tatsächlich unabhängig voneinander platziert werden sollen. Mehrere Chat-Elemente auf einer Seite nehmen über die Chat-ID an derselben Unterhaltung teil. Der optionale Eingabekanal überträgt die geöffnete AgentSession; der optionale „Busy“-Kanal wird auf „true“ gesetzt, während der Agent arbeitet, sodass ein Host seine eigenen Befehle deaktivieren kann. </p>
com.top_logic.ai.chat.view.ChatProgressElement = Chat-Fortschritt
com.top_logic.ai.chat.view.ChatProgressElement.Config.class.tooltip = Die Implementierung des Elements. Im Layout-Editor ausgeblendet: Das Tag legt sie bereits fest, und eine Änderung ergibt ein Element, das nicht mehr zu den daneben angezeigten Optionen passt.
com.top_logic.ai.chat.view.ChatProgressElement.Config.react-element.tooltip = Registriertes React-Element, das diesen Abschnitt rendert. Standardmäßig ist „TLChatProgress“ eingestellt. Im Layout-Editor ausgeblendet: Der Wert muss mit einer Registrierung in TypeScript übereinstimmen.
com.top_logic.ai.chat.view.ChatProgressElement.tooltip = Deklaratives „ <chat-progress/> “-Element: woran der Agent gerade arbeitet, als Abschnitt der Leiste. <p> Listet die Schritte des laufenden (oder letzten) Durchlaufs aus dem Aufgabenspeicher des Agenten (createTask / updateTask) auf, den gerade laufenden Schritt in seiner aktiven Form. Offene Freigaben stehen nicht hier: Sie sind Karten über dem Eingabefeld, wo der Benutzer sie beantwortet. Der optionale Kennzahl-Kanal erhält, wie viele Schritte noch etwas wollen. </p>
com.top_logic.ai.chat.view.ChatRailElement = Chat-Leiste
com.top_logic.ai.chat.view.ChatRailElement$PaneMode = Bereichsmodus
com.top_logic.ai.chat.view.ChatRailElement$PaneMode.tooltip = Wie weit sich der Bereich öffnet.
com.top_logic.ai.chat.view.ChatRailElement$SectionConfig = Abschnitt
com.top_logic.ai.chat.view.ChatRailElement$SectionConfig.tooltip = Ein zusammenklappbarer Block der Leiste, der ein Anzeigeelement enthält.
com.top_logic.ai.chat.view.ChatRailElement.Config.chat-id = Chat-ID
com.top_logic.ai.chat.view.ChatRailElement.Config.chat-id.tooltip = Gemeinsamer Schlüssel, über den diese Leiste, ein Gesprächsverlauf und eine Sitzungsliste eine Unterhaltung zeigen. Standard ist „default“, damit unkonfigurierte Teile auf einer Seite einander finden.
com.top_logic.ai.chat.view.ChatRailElement.Config.class.tooltip = Die Implementierung des Elements. Im Layout-Editor ausgeblendet: Das Tag legt sie bereits fest, und eine Änderung ergibt ein Element, das nicht mehr zu den daneben angezeigten Optionen passt.
com.top_logic.ai.chat.view.ChatRailElement.Config.input = Eingabe
com.top_logic.ai.chat.view.ChatRailElement.Config.input.tooltip = Kanal mit dem Objekt, das der Bereich zeigt; leer für die Abschnitte. Dieselbe Eingabe, die auch „ <form> “ oder „ <switch> “ nimmt: Solange sie ein Objekt enthält, ersetzt der Bereich die Spalte der Abschnitte, und die Schaltfläche zum Schließen schreibt „null“ zurück. Leer lassen für eine Leiste ohne Bereich.
com.top_logic.ai.chat.view.ChatRailElement.Config.open = Geöffnet
com.top_logic.ai.chat.view.ChatRailElement.Config.open.tooltip = Ob die Leiste geöffnet startet. Nur der Zustand beim ersten Laden: Danach steht die Leiste dort, wo der Benutzer sie zuletzt gelassen hat.
com.top_logic.ai.chat.view.ChatRailElement.Config.pane = Bereich
com.top_logic.ai.chat.view.ChatRailElement.Config.pane-mode = Bereichsmodus
com.top_logic.ai.chat.view.ChatRailElement.Config.pane-mode.tooltip = Wie weit sich der Bereich öffnet: eine Karte neben dem Gesprächsverlauf, oder etwas zum Lesen.
com.top_logic.ai.chat.view.ChatRailElement.Config.pane-width = Bereichsbreite
com.top_logic.ai.chat.view.ChatRailElement.Config.pane-width.tooltip = Breite des Bereichs in Pixeln. Null behält die gespeicherte oder automatische Breite. Im Layout-Editor ausgeblendet: Der Benutzer zieht den Bereich, und die Breite wird pro Benutzer gespeichert; ein fester Wert überschreibt daher, was der Benutzer gewählt hat.
com.top_logic.ai.chat.view.ChatRailElement.Config.pane.tooltip = Was der Bereich zeigt, solange der Eingabekanal ein Objekt enthält. Wird als „ <pane> “-Kind geschrieben. Das Element darin bindet sich an denselben Kanal, um zu erfahren, welches Objekt es zeigt, z. B. <pane><form input="selected"/></pane>. Mehrere Elemente werden gestapelt.
com.top_logic.ai.chat.view.ChatRailElement.Config.personalization-key.tooltip = Optionale Überschreibung des automatisch abgeleiteten Personalisierungsschlüssels. Im Layout-Editor ausgeblendet: Der aus dem Ansichtskontext abgeleitete Schlüssel ist der richtige, und ein von Hand eingetragener Wert verschiebt stillschweigend, was ein Benutzer personalisiert hat.
com.top_logic.ai.chat.view.ChatRailElement.Config.react-element = React-Element
com.top_logic.ai.chat.view.ChatRailElement.Config.react-element.tooltip = Registriertes React-Element, das diese Leiste rendert. Standardwert ist „TLChatRail“. Im Layout-Editor ausgeblendet: Der Wert muss mit einer Registrierung in TypeScript übereinstimmen.
com.top_logic.ai.chat.view.ChatRailElement.Config.sections = Abschnitte
com.top_logic.ai.chat.view.ChatRailElement.Config.sections.tooltip = Die Abschnitte der Leiste, von oben nach unten in der geschriebenen Reihenfolge. Werden direkt als „ <section> “-Kinder der „ <chat-rail> “ geschrieben. Eine leere Liste ist eine leere Leiste; dieses Element bringt keine eigenen Abschnitte mit.
com.top_logic.ai.chat.view.ChatRailElement.Config.strip = Symbolleiste
com.top_logic.ai.chat.view.ChatRailElement.Config.strip.tooltip = Ob die Symbolleiste mit den Abschnitts-Symbolen gezeigt wird. Sie ist es, die sagt, was die Leiste enthält, solange diese geschlossen ist, und ein Klick auf ein Symbol öffnet die Leiste auf diesem Abschnitt. Ohne sie führt nur noch die Leisten-Schaltfläche im Gesprächsverlauf hinein.
com.top_logic.ai.chat.view.ChatRailElement.PaneMode.CARD = Karte
com.top_logic.ai.chat.view.ChatRailElement.PaneMode.CARD.tooltip = Ein Eintrag neben dem Verlauf.
com.top_logic.ai.chat.view.ChatRailElement.PaneMode.DOCUMENT = Dokument
com.top_logic.ai.chat.view.ChatRailElement.PaneMode.DOCUMENT.tooltip = Etwas zum Lesen; der Bereich nimmt den größten Teil der Spalte ein.
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.badge = Kennzahl
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.badge.tooltip = Optionaler Kanal, der trägt, wie viele Dinge dieser Abschnitt zeigt. Die Zahl erscheint neben dem Titel des Abschnitts und auf seinem Symbol in der Symbolleiste, und die Leiste summiert die Abschnitte zu der Gesamtzahl, die die Leisten-Schaltfläche im Gesprächsverlauf zeigt. Das Inhaltselement schreibt sie - „ <chat-progress badge="…"/> “ tut das - oder ein abgeleiteter Kanal berechnet sie.
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.content = Inhalt
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.content.tooltip = Was dieser Abschnitt zeigt: ein Anzeigeelement, geschrieben als Kind der „ <section> “. Mehrere Elemente werden gestapelt, wie in einem „ <tab> “.
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.icon = Symbol
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.icon.tooltip = Das Symbol, das die Symbolleiste zeigt, z. B. css:bi bi-list-check. Abschnitte ohne eigenes Symbol teilen sich ein allgemeines, das nichts darüber sagt, was darin steht; gib jedem Abschnitt ein eigenes, wo die Symbolleiste gezeigt wird.
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.label = Bezeichnung
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.label.tooltip = Der Titel, der in der Kopfzeile des Abschnitts angezeigt wird.
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.name = Name
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.name.tooltip = Technischer Name dieses Abschnitts, eindeutig innerhalb der Leiste. Unter ihm merkt sich der Abschnitt, ob der Benutzer ihn zugeklappt hat; ein Abschnitt umzubenennen vergisst das also.
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.open = Offen
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.open.tooltip = Ob dieser Abschnitt aufgeklappt startet. Nur der Zustand beim ersten Laden: Danach steht der Abschnitt dort, wo der Benutzer ihn gelassen hat.
com.top_logic.ai.chat.view.ChatRailElement.tooltip = Deklaratives „ <chat-rail/> “-Element: die Leiste neben einer Unterhaltung, als Rahmen, dessen Inhalt konfiguriert wird. <p> Die Leiste erweitert den Chat, damit er neben dem Gesprächsverlauf mehr zeigen kann - woran der Agent arbeitet, einen vorgeschlagenen Plan, die Quellen, ein Dokument, das er geschrieben hat. <b>Welches davon</b>, entscheidet die Anwendung, und deshalb bringt dieses Element keinen eigenen Inhalt mit: Jede „ <section> “ enthält ein Anzeigeelement, und jedes Element taugt dafür - „ <chat-progress/> “, eine „ <data-list> “ der eigenen Objekte der Anwendung, oder ein Element, das ein Host geschrieben hat. Eine leere „ <chat-rail/> “ rendert eine leere Leiste. </p> <p> Der Eingabekanal ist das zweite Gesicht der Leiste: Solange er ein Objekt enthält, wird statt der Abschnitte das „ <pane> “-Kind gezeigt, dem dieses Objekt über denselben Kanal zur Verfügung steht (etwa ein „ <form input="…"/> “). Das Schließen des Bereichs schreibt „null“ zurück. </p> <p> Mehrere Chat-Elemente auf einer Seite treten über die „chat-id“ derselben Unterhaltung bei. Zwei Leisten auf einer „chat-id“ werden nicht unterstützt: Den geöffneten Zustand und die zugeklappten Abschnitte gibt es je Unterhaltung nur einmal, und beide Leisten würden sich darum streiten. </p> <p><b>VORLÄUFIGER FORK.</b> Nichts hier ist chat-spezifisch außer der Bindung über die „chat-id“ und dem gemerkten Layout. <b>Upstream-Ziel:</b> ein allgemeiner Leisten-Rahmen in „tl-layout-view“ (Engine-Übergabe E2), womit „tl-chat“ nur die Abschnitte behält, die es beisteuert. </p>
com.top_logic.ai.chat.view.ChatSectionElement.Config.badge = Kennzahl
com.top_logic.ai.chat.view.ChatSectionElement.Config.badge.tooltip = Optionaler Kanal, in den dieser Abschnitt seine Anzahl schreibt - wie viele der dort gezeigten Dinge es gerade gibt. Die Leiste liest denselben Kanal, um die Zahl neben den Titel des Abschnitts und auf sein Symbol in der Symbolleiste zu setzen, und summiert die Abschnitte zu der Gesamtzahl, die die Leisten-Schaltfläche im Gesprächsverlauf zeigt. Leer lassen für einen Abschnitt, der nichts zu zählen hat.
com.top_logic.ai.chat.view.ChatSectionElement.Config.chat-id = Chat-ID
com.top_logic.ai.chat.view.ChatSectionElement.Config.chat-id.tooltip = Gemeinsamer Schlüssel, der dafür sorgt, dass dieser Abschnitt und der Rest des Chats als eine einzige Unterhaltung angezeigt werden. Die Standardeinstellung ist „default“, sodass nicht konfigurierte Elemente auf einer Seite einander finden.
com.top_logic.ai.chat.view.ChatSectionElement.Config.personalization-key.tooltip = Optionale Überschreibung des automatisch abgeleiteten Personalisierungsschlüssels. Im Layout-Editor ausgeblendet: Der aus dem Ansichtskontext abgeleitete Schlüssel ist der richtige, und ein von Hand eingetragener Wert verschiebt stillschweigend, was ein Benutzer personalisiert hat.
com.top_logic.ai.chat.view.ChatSectionElement.Config.react-element = React-Element
com.top_logic.ai.chat.view.ChatSectionElement.Config.react-element.tooltip = Registriertes React-Element, das diesen Abschnitt rendert. Im Layout-Editor ausgeblendet: Der Wert muss mit einer Registrierung in TypeScript übereinstimmen.
com.top_logic.ai.chat.view.ChatSourcesElement = Chat-Quellen
com.top_logic.ai.chat.view.ChatSourcesElement.Config.class.tooltip = Die Implementierung des Elements. Im Layout-Editor ausgeblendet: Das Tag legt sie bereits fest, und eine Änderung ergibt ein Element, das nicht mehr zu den daneben angezeigten Optionen passt.
com.top_logic.ai.chat.view.ChatSourcesElement.Config.react-element.tooltip = Registriertes React-Element, das diesen Abschnitt rendert. Standardwert ist „TLChatSources“. Im Layout-Editor ausgeblendet: Der Wert muss mit einer Registrierung in TypeScript übereinstimmen.
com.top_logic.ai.chat.view.ChatSourcesElement.tooltip = Deklaratives „ <chat-sources/> “-Element: was diese Unterhaltung zitiert hat, als Abschnitt der Leiste. <p> Eine Zeile je Quelle, in der Reihenfolge, in der die Antworten sie zuerst zitiert haben, mit den Markierungsnummern, die auf sie zeigen - eine Nummer springt zu ihrer Antwort, die Zeile öffnet die Quelle. Eine lange Liste bekommt einen Filter. Der optionale Kennzahl-Kanal erhält, wie viele Quellen es gibt, sodass die Kennzahl der Leiste die seit dem letzten Hinsehen zitierten zählt. </p>
com.top_logic.ai.chat.view.list.DataListElement = Datenlistenelement
com.top_logic.ai.chat.view.list.DataListElement$Emphasis = Schwerpunkt
com.top_logic.ai.chat.view.list.DataListElement$Emphasis.tooltip = Wie deutlich eine Linie dargestellt wird.
com.top_logic.ai.chat.view.list.DataListElement$LineConfig = Leitungskonfiguration
com.top_logic.ai.chat.view.list.DataListElement$LineConfig.tooltip = Konfiguration für eine einzelne Zeile einer Reihe – ähnlich wie bei einer Tabelle <column>, jedoch gestapelt.
com.top_logic.ai.chat.view.list.DataListElement$LinesConfig = Konfiguration der Leitungen
com.top_logic.ai.chat.view.list.DataListElement$LinesConfig.tooltip = Behälter für die Zeilen eines <i>Datenlistenelements</i>.
com.top_logic.ai.chat.view.list.DataListElement.Config.class.tooltip = Die Implementierung des Elements. Im Layout-Editor ausgeblendet: Das Tag legt sie bereits fest, und eine Änderung ergibt ein Element, das nicht mehr zu den daneben angezeigten Optionen passt.
com.top_logic.ai.chat.view.list.DataListElement.Config.collapsible = Zusammenklappbar
com.top_logic.ai.chat.view.list.DataListElement.Config.collapsible.tooltip = Ob sich die Liste auf einen schmalen Streifen zusammenklappen lässt.
com.top_logic.ai.chat.view.list.DataListElement.Config.commands = Befehle
com.top_logic.ai.chat.view.list.DataListElement.Config.commands.tooltip = Kopfzeilen-Schaltflächen oberhalb der Liste. Jede ist ein Standard-Ansichtsbefehl - ein „generic-command“, der beliebige Aktionen zusammensetzt (execute-script, open-dialog, write-channel, with-transaction, …), mit der üblichen Beschriftung, dem Bild, dem Tooltip, der Ausführbarkeit und der Eingabe. Eine Chat-Sitzungsliste konfiguriert z. B. einen Befehl, der den Auswahlkanal leert („Neuer Chat“).
com.top_logic.ai.chat.view.list.DataListElement.Config.empty-text = Leerer Text
com.top_logic.ai.chat.view.list.DataListElement.Config.empty-text.tooltip = Der Text, der angezeigt wird, wenn die Liste leer ist.
com.top_logic.ai.chat.view.list.DataListElement.Config.group-by = Nach... gruppieren
com.top_logic.ai.chat.view.list.DataListElement.Config.group-by.tooltip = Optionale TL-Script-Funktion, die für jede Zeile deren Gruppenbezeichnung berechnet. Zeilen mit derselben Bezeichnung werden unter einer Überschrift zusammengefasst, und zwar in der Reihenfolge ihres ersten Auftretens. „Leer“ bedeutet, dass keine Gruppierung erfolgt (eine flache Liste).
com.top_logic.ai.chat.view.list.DataListElement.Config.inputs = Eingaben
com.top_logic.ai.chat.view.list.DataListElement.Config.inputs.tooltip = Verweise auf Kanäle, deren Werte als Positionsargumente für <i>„Rows“</i> dienen.
com.top_logic.ai.chat.view.list.DataListElement.Config.lines = Zeilen
com.top_logic.ai.chat.view.list.DataListElement.Config.lines.tooltip = Die pro Zeile angezeigten Zeilen, von oben nach unten – das vertikale Pendant zu den Spalten einer Tabelle.
com.top_logic.ai.chat.view.list.DataListElement.Config.observed-types = Beobachtete Typen
com.top_logic.ai.chat.view.list.DataListElement.Config.observed-types.tooltip = Bei Typen, bei denen sich das Objekt ändert (Erstellen / Aktualisieren / Löschen), werden <i>die Zeilen</i> erneut ausgeführt, sodass die Liste automatisch aktualisiert wird.
com.top_logic.ai.chat.view.list.DataListElement.Config.personalization-key.tooltip = Optionale Überschreibung des automatisch abgeleiteten Personalisierungsschlüssels. Im Layout-Editor ausgeblendet: Der aus dem Ansichtskontext abgeleitete Schlüssel ist der richtige, und ein von Hand eingetragener Wert verschiebt stillschweigend, was ein Benutzer personalisiert hat.
com.top_logic.ai.chat.view.list.DataListElement.Config.react-element = React-Element
com.top_logic.ai.chat.view.list.DataListElement.Config.react-element.tooltip = Registriertes React-Element, das diese Liste rendert. Standardwert ist „TLDataList“. Im Layout-Editor ausgeblendet: Der Wert muss mit einer Registrierung in TypeScript übereinstimmen.
com.top_logic.ai.chat.view.list.DataListElement.Config.rows = Zeilen
com.top_logic.ai.chat.view.list.DataListElement.Config.rows.tooltip = TL-Script-Funktion zur Berechnung der Zeilenobjekte (eine <i>Sammlung</i>), analog zu den Zeilen von <table>.
com.top_logic.ai.chat.view.list.DataListElement.Config.search = Suche
com.top_logic.ai.chat.view.list.DataListElement.Config.search.tooltip = Ob die Liste ein Suchfeld anzeigt (clientseitiger Filter für den Zeilentext).
com.top_logic.ai.chat.view.list.DataListElement.Config.selection = Auswahl
com.top_logic.ai.chat.view.list.DataListElement.Config.selection.tooltip = Optionaler Zweiwege-Kanal, der das ausgewählte Zeilenobjekt enthält.
com.top_logic.ai.chat.view.list.DataListElement.Config.title = Titel
com.top_logic.ai.chat.view.list.DataListElement.Config.title.tooltip = Der über der Liste angezeigte Titel.
com.top_logic.ai.chat.view.list.DataListElement.Emphasis.PRIMARY = Grundschule
com.top_logic.ai.chat.view.list.DataListElement.Emphasis.PRIMARY.tooltip = Die hervorgehobene Zeile (Titelformat).
com.top_logic.ai.chat.view.list.DataListElement.Emphasis.SECONDARY = Sekundär
com.top_logic.ai.chat.view.list.DataListElement.Emphasis.SECONDARY.tooltip = Eine gedämpfte Nebenlinie.
com.top_logic.ai.chat.view.list.DataListElement.LineConfig.attribute = Attribut
com.top_logic.ai.chat.view.list.DataListElement.LineConfig.attribute.tooltip = Das in dieser Zeile angezeigte Modellattribut (Normalfall). Verwenden Sie stattdessen <i>„Wert“</i> für eine berechnete Zeile.
com.top_logic.ai.chat.view.list.DataListElement.LineConfig.emphasis = Schwerpunkt
com.top_logic.ai.chat.view.list.DataListElement.LineConfig.emphasis.tooltip = Wie deutlich die Zeile dargestellt wird. „Unset“ bedeutet, dass die erste Zeile <i>primär</i> und die übrigen <i>sekundär</i> sind.
com.top_logic.ai.chat.view.list.DataListElement.LineConfig.value = Wert
com.top_logic.ai.chat.view.list.DataListElement.LineConfig.value.tooltip = Eine TL-Script-Funktion, die den Text dieser Zeile berechnet – eine berechnete Zeile (ein formatierter Wert, eine Zählung), die mit einem einfachen Attribut nicht ausgedrückt werden kann.
com.top_logic.ai.chat.view.list.DataListElement.LinesConfig.lines = Zeilen
com.top_logic.ai.chat.view.list.DataListElement.LinesConfig.lines.tooltip = Die anzuzeigenden Zeilen, von oben nach unten.
com.top_logic.ai.chat.view.list.DataListElement.tooltip = Deklaratives „ <data-list> “-Element: eine modellgebundene, formatierte, gruppierte, durchsuchbare und auswählbare Liste – die Darstellung einer Chat-Leiste, verallgemeinert auf beliebige Modelle. <p> Die Zeilen stammen aus einem TL-Script-Zeilenausdruck, genau wie „ <table> “ seine Zeilen bindet; eine Attributzeile wird anhand des Typs des Zeilenobjekts aufgelöst. Jede Zeile zeigt eine geordnete Liste von Zeilen (das vertikale Pendant zu den Spalten einer Tabelle); ihre Gruppenbezeichnung ist ein weiterer Ausdruck. Ein Klick auf eine Zeile schreibt das Zeilenobjekt in den bidirektionalen Auswahlkanal. Suche und Ein- und Ausblenden erfolgen clientseitig. Im Gegensatz zu <table> wird hier eine formatierte Liste (im „Session-Rail“-Look) und kein Datengitter gerendert; im Gegensatz zu <object-list> handelt es sich um einen auswählbaren Picker und nicht um einen In-Place-Editor für zusammengesetzte Elemente. </p> <p><b>VORLÄUFIGER FORK.</b> Die Engine verfügt über keine datengebundene Liste, die wie die Navigationsleiste mit Auswahl + Gruppierung + Suche gerendert wird. Dieses Element schließt diese Lücke in tl-ai und wird von der React-Komponente „TLDataList“ gerendert. <b>Upstream-Ziel:</b> ein generisches „ <data-list> “ in tl-layout-view; anschließend soll dieses Paket gelöscht werden. </p>
