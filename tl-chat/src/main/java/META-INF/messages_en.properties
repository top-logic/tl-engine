class.com.top_logic.ai.chat.sched.I18NConstants.SESSION_NOT_CREATED = The chat session for this run could not be created.
class.com.top_logic.ai.chat.sched.I18NConstants.SESSION_NOT_CREATED.help = The chat session the run would have been recorded in could not be created.
