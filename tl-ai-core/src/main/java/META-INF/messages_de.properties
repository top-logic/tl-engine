com.top_logic.tl.ai.core.agent.ModelCapabilityModeSelector.Config.capability.tooltip = Die Fähigkeit, die von dem Modell unterstützt werden muss (z. B. "Argumentation", "Temperatur"). <p> Ist der Wert null, wird keine Überprüfung der Fähigkeit durchgeführt (nur der Anbieter wird überprüft). </p>
com.top_logic.tl.ai.core.agent.ModelCapabilityModeSelector.Config.providers = Anbieter
