class.com.top_logic.ai.chat.layout.I18NConstants.WAITING_FOR_WORKER__POSITION = Waiting for a free worker - position {0}
class.com.top_logic.ai.chat.sched.I18NConstants.NO_SUCH_ACCOUNT__LOGIN = There is no account named "{0}" to run this task as.
class.com.top_logic.ai.chat.sched.I18NConstants.NO_SUCH_ACCOUNT__LOGIN.help = The configured run-as account does not exist.
class.com.top_logic.ai.chat.sched.I18NConstants.PROMPT_EMPTY = The prompt of this task is empty; there is nothing to ask the agent.
