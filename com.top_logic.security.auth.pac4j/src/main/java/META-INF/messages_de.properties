com.top_logic.security.auth.pac4j.provisioning.NameConflict.REFUSE.tooltip = Die Anmeldung wird mit einer Meldung abgelehnt, in der der Konflikt genannt wird.
com.top_logic.security.auth.pac4j.provisioning.NameConflict.RENAME = Umbenennen
com.top_logic.security.auth.pac4j.provisioning.NameConflict.RENAME.tooltip = Der Zugang wird unter dem Namen <code>&lt;name&gt;@&lt;client&gt;</code> angelegt, ist auch dieser vergeben, unter <code>&lt;name&gt;@&lt;client&gt;-2</code>, <code>&lt;name&gt;@&lt;client&gt;-3</code> und so weiter.
com.top_logic.security.auth.pac4j.provisioning.NameConflict.tooltip = Was <i>die OIDC-Kontoeinrichtung</i> tut, wenn der Anmeldename eines zu erstellenden Kontos bereits von einem Konto belegt ist, mit dem die Identität nicht verknüpft ist. <p> Ein solches Konto wird niemals mit der Identität verknüpft: Es könnte jemand anderem gehören. </p>
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping = OIDC-Zugangsanlage
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.allowed-email-domains = Zulässige E-Mail-Domains
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.allowed-email-domains.tooltip = Die Domains der E-Mail-Adressen, für die Zugänge angelegt werden, z. B. <code>example.com</code>. <p> Leer: Zugänge werden für jede E-Mail-Adresse angelegt, und für Identitäten ohne E-Mail-Adresse. Groß- und Kleinschreibung der Domains wird nicht unterschieden. </p>
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.authentication-device = Authentifizierungsgerät
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.authentication-device.tooltip = Die ID des Authentifizierungsgeräts eines angelegten Zugangs. <p> Leer: Der Zugang hat kein Authentifizierungsgerät und kann sich nur über eine externe Anmeldung anmelden. </p>
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.create-accounts = Zugänge anlegen
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.create-accounts.tooltip = Ob für eine Identität, für die kein Zugang gefunden wird, ein Zugang angelegt wird. <p> Der Zugang hat kein Passwort und meldet sich nur über die externe Anmeldung an. </p>
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.default-groups = Standardgruppen
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.default-groups.tooltip = Die Namen der Gruppen, denen ein Zugang angehört, solange die Identität keinen Claim <i>Claim der Gruppen</i> hat. <p> Sie werden wie die Gruppen des Claims abgeglichen: Sobald der Claim vorhanden ist, verliert der Zugang sie, wenn der Claim sie nicht ebenfalls ergibt. </p>
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.email-claim = Claim der E-Mail-Adresse
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.email-claim.tooltip = Der Claim mit der E-Mail-Adresse der Identität.
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.email-verified-claim = Claim der E-Mail-Bestätigung
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.email-verified-claim.tooltip = Der Claim, der angibt, ob der Identity-Provider die E-Mail-Adresse bestätigt hat.
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.first-name-claim = Claim des Vornamens
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.first-name-claim.tooltip = Der Claim mit dem Vornamen eines angelegten Zugangs.
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.group-claim = Claim der Gruppen
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.group-claim.tooltip = Der Claim mit den Gruppen des Benutzers beim Identity-Provider, z. B. <code>groups</code> (Keycloak, Entra ID) oder <code>roles</code>. <p> Der Claim enthält eine Liste von Werten oder einen einzelnen Wert. Die Werte werden über die <i>Gruppenzuordnung</i> in Gruppen der Anwendung übersetzt. Bei jeder Anmeldung wird der Zugang Mitglied der Gruppen, die der Claim ergibt, und verliert die Mitgliedschaften, die eine frühere Anmeldung zugewiesen hat und die der Claim nicht mehr ergibt. Von Hand in der Anwendung zugewiesene Mitgliedschaften bleiben unberührt. </p> <p> Leer: Nur die <i>Standardgruppen</i> werden abgeglichen. </p>
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.group-mapping = Gruppenzuordnung
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.group-mapping.tooltip = Die Gruppen der Anwendung zu den Werten des Claims <i>Claim der Gruppen</i>. <p> Ein Eintrag <code>&lt;group claim-value="admins" groups="Administrators,Editors"/&gt;</code> macht einen Zugang, dessen Claim den Wert <code>admins</code> enthält, zum Mitglied der Gruppen mit den Namen <code>Administrators</code> und <code>Editors</code>. Werte ohne Eintrag werden ignoriert, außer <i>Gruppen über Namen</i> ist gesetzt. </p>
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.groups-by-name = Gruppen über Namen
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.groups-by-name.tooltip = Ob ein Wert des Claims <i>Claim der Gruppen</i> ohne Eintrag in der <i>Gruppenzuordnung</i> die vorhandene Gruppe gleichen Namens bezeichnet.
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.last-name-claim = Claim des Nachnamens
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.last-name-claim.tooltip = Der Claim mit dem Nachnamen eines angelegten Zugangs.
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.link-by-email = Über E-Mail verbinden
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.link-by-email.tooltip = Ob eine Identität ohne Zugang mit dem Zugang ihrer E-Mail-Adresse verbunden wird. <p> Nur, wenn der Identity-Provider die Adresse bestätigt hat (Claim <i>Claim der E-Mail-Bestätigung</i>) und genau ein Zugang sie hat. Nur für einen Identity-Provider einschalten, dessen Bestätigung von E-Mail-Adressen vertraut wird: Wer dort über eine Adresse verfügt, erhält den Zugang mit dieser Adresse. </p>
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.link-by-name = Über Namen verbinden
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.link-by-name.tooltip = Ob eine Identität ohne Zugang mit dem Zugang ihres Anmeldenamens verbunden wird.
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.listeners = Listener
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.listeners.tooltip = Die <i>Listener externer Anmeldungen</i>, die bei jeder Anmeldung aufgerufen werden. <p> Sie werden in der Transaktion der Anmeldung aufgerufen, nachdem der Zugang gefunden oder angelegt wurde. </p>
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.login-name-claim = Claim des Anmeldenamens
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.login-name-claim.tooltip = Der Claim mit dem Anmeldenamen des Zugangs. <p> Der Name eines anzulegenden Zugangs und der Name, über den eine Identität verbunden wird (<i>Über Namen verbinden</i>). Ohne diesen Claim wird der Name verwendet, den der Client ermittelt. </p>
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.name-conflict = Namenskonflikt
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.name-conflict.tooltip = Was geschieht, wenn der Anmeldename eines anzulegenden Zugangs an einen Zugang vergeben ist, mit dem die Identität nicht verbunden ist.
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.require-verified-email = Bestätigte E-Mail-Adresse verlangen
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.Config.require-verified-email.tooltip = Ob ein Zugang nur für eine Identität angelegt wird, deren E-Mail-Adresse der Identity-Provider bestätigt hat (Claim <i>Claim der E-Mail-Bestätigung</i>).
com.top_logic.security.auth.pac4j.provisioning.OidcProvisioningUserMapping.tooltip = <i>Abbildung externer Benutzer</i> für das <code>user-mapping</code> eines pac4j-Clients, die die Zugänge mit den Identitäten des Identity-Providers verbindet und die Zugänge bei Bedarf anlegt. <p> Der Zugang einer <i>externen Identität</i> ist der erste, der in dieser Reihenfolge gefunden wird: </p> <ol> <li>der Zugang mit einer <i>OIDC-Identität</i> mit Client und Subjekt der Identität,</li> <li>mit <i>Über E-Mail verbinden</i>: der einzige Zugang mit der E-Mail-Adresse der Identität, wenn der Identity-Provider sie bestätigt hat,</li> <li>mit <i>Über Namen verbinden</i>: der Zugang mit dem Anmeldenamen der Identität,</li> <li>mit <i>Zugänge anlegen</i>: ein neuer Zugang.</li> </ol> <p> Ein über E-Mail oder Namen gefundener Zugang erhält die Identität, ein neuer ebenso. Hat der Zugang bereits eine andere Identität desselben Clients, wird die Anmeldung abgelehnt. Ohne Zugang wird die Anmeldung als unbekannter Zugang abgelehnt. </p> <p> Ist der Zugang bekannt, werden seine Gruppenmitgliedschaften mit dem Claim <i>Claim der Gruppen</i> abgeglichen (siehe <i>Gruppenzuordnung</i>), dann werden die Listener in derselben Transaktion aufgerufen. Eine Exception rollt die Transaktion zurück und lehnt die Anmeldung ab. Eine Anmeldung, die nichts ändert und keine Listener aufzurufen hat, öffnet keine Transaktion. </p> <p> Die E-Mail-Adresse eines Zugangs ist die E-Mail-Adresse seiner Benutzerdaten, die es nur mit dem Kontaktmodul gibt. Ohne es erhält ein angelegter Zugang nur Vor- und Nachnamen, und <i>Über E-Mail verbinden</i> findet keinen Zugang. </p>
