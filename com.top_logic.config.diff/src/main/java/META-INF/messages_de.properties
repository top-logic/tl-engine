com.top_logic.config.diff.google.diff_match_patch$Operation = Operation
com.top_logic.config.diff.google.diff_match_patch$Operation.tooltip = Die Datenstruktur, die ein Diff repräsentiert, ist eine verknüpfte Liste von Diff-Objekten: {Diff(Operation.DELETE, "Hello"), Diff(Operation.INSERT, "Goodbye"), Diff(Operation.EQUAL, " world.")}, was bedeutet: "Hallo" löschen, "Auf Wiedersehen" hinzufügen und "Welt" beibehalten.
