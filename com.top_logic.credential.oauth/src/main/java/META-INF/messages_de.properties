com.top_logic.credential.oauth.ClientAssertionAuthentication = Authentifizierung mit Client-Assertion
com.top_logic.credential.oauth.ClientAssertionAuthentication.Config.assertion = Assertion
com.top_logic.credential.oauth.ClientAssertionAuthentication.Config.assertion-type = Assertion-Typ
com.top_logic.credential.oauth.ClientAssertionAuthentication.Config.assertion-type.tooltip = Das Format der Assertion.
com.top_logic.credential.oauth.ClientAssertionAuthentication.Config.assertion.tooltip = Die Assertion, die den Client ausweist, typischerweise eine Datei mit einem von der Plattform ausgestellten Token.
com.top_logic.credential.oauth.ClientAssertionAuthentication.tooltip = <i>Client-Authentifizierung</i> mit einer von einem Dritten ausgestellten Assertion (RFC 7521 §4.2). <p> Das ist Workload-Identität: Die Plattform, auf der die Anwendung läuft, stellt ein kurzlebiges Token aus, das die Anwendung ausweist, und der Autorisierungsserver vertraut diesem Token-Aussteller für den Client. Die Anwendung besitzt kein Geheimnis. Ein Kubernetes-Pod erhält ein solches Token als projiziertes Service-Account-Token, das das Kubelet in einer Datei erneuert; mit einer <i>Geheimnisquelle aus Datei</i> wird bei jeder Token-Anfrage der aktuelle Inhalt gesendet: </p> <pre> &lt;client-authentication class="com.top_logic.credential.oauth.ClientAssertionAuthentication"&gt; &lt;assertion class="com.top_logic.basic.credential.FileSecretSource" path="/var/run/secrets/tokens/keycloak"/&gt; &lt;/client-authentication&gt; </pre> <p> In Azure AKS mit Workload-Identität nennt die Umgebungsvariable <code>AZURE_FEDERATED_TOKEN_FILE</code> die Token-Datei, referenziert über einen Alias (<code>path="%AZURE_FEDERATED_TOKEN_FILE%"</code>), der in der Anwendungskonfiguration als <code>&lt;entry name="%AZURE_FEDERATED_TOKEN_FILE%" value="${env:AZURE_FEDERATED_TOKEN_FILE}"/&gt;</code> definiert ist. </p>
com.top_logic.credential.oauth.ClientCredentialsProvider = OAuth-Client-Credentials
com.top_logic.credential.oauth.ClientCredentialsProvider.tooltip = <i>Zugangsdaten-Anbieter</i>, der Anfragen mit einem Zugriffstoken authentifiziert, das über den OAuth-2.0-Grant „Client Credentials“ (RFC 6749 §4.4) bezogen wird. <p> Die Anwendung authentifiziert sich als Client bei einem Autorisierungsserver und erhält ein kurzlebiges Zugriffstoken, das als Bearer-Token gesendet wird. Das Token wird zwischengespeichert und vor seinem Ablauf erneuert (siehe <i>Token-Cache</i>). Typischerweise ruft die Anwendung mit einem solchen Token ein zentrales API-Gateway auf, während das Gateway die Schlüssel der externen Dienste verwahrt. </p> <p> Der Grant steht nur vertraulichen Clients zur Verfügung, daher ist eine Client-Authentifizierung erforderlich. </p> <p> Workload-Identität in Kubernetes: Der Client authentifiziert sich mit dem projizierten Service-Account-Token seines Pods, sodass die Anwendung überhaupt kein Geheimnis besitzt. Der Autorisierungsserver (hier ein Keycloak-Realm) vertraut für diesen Client dem Token-Aussteller des Clusters: </p> <pre> &lt;credentials class="com.top_logic.credential.oauth.ClientCredentialsProvider" issuer="https://login.example.com/realms/my-realm" client-id="my-app" &gt; &lt;client-authentication class="com.top_logic.credential.oauth.ClientAssertionAuthentication"&gt; &lt;assertion class="com.top_logic.basic.credential.FileSecretSource" path="/var/run/secrets/tokens/keycloak"/&gt; &lt;/client-authentication&gt; &lt;/credentials&gt; </pre> <p> Workload-Identität in Azure AKS ist dieselbe Konfiguration mit <code>token-url="https://login.microsoftonline.com/&lt;tenant&gt;/oauth2/v2.0/token"</code> und <code>scope="&lt;resource&gt;/.default"</code>, wobei die Assertion aus der Datei gelesen wird, die die Umgebungsvariable <code>AZURE_FEDERATED_TOKEN_FILE</code> nennt, über einen Alias (<code>path="%AZURE_FEDERATED_TOKEN_FILE%"</code>, definiert als <code>&lt;entry name="%AZURE_FEDERATED_TOKEN_FILE%" value="${env:AZURE_FEDERATED_TOKEN_FILE}"/&gt;</code>). </p> <p> Authentifizierung mit einem privaten Schlüssel (<code>private_key_jwt</code>), dessen öffentlicher Schlüssel für den Client registriert ist: </p> <pre> &lt;credentials class="com.top_logic.credential.oauth.ClientCredentialsProvider" issuer="https://login.example.com/realms/my-realm" client-id="my-app" &gt; &lt;client-authentication class="com.top_logic.credential.oauth.PrivateKeyJwtAuthentication" algorithm="ES256" key-id="my-app-2026" &gt; &lt;private-key class="com.top_logic.basic.credential.FileSecretSource" path="/run/secrets/my-app-key.pem"/&gt; &lt;/client-authentication&gt; &lt;/credentials&gt; </pre> <p> Authentifizierung mit einem Client-Secret, wobei ein Token für eine bestimmte Zielgruppe angefordert wird: </p> <pre> &lt;credentials class="com.top_logic.credential.oauth.ClientCredentialsProvider" token-url="https://login.example.com/realms/my-realm/protocol/openid-connect/token" client-id="my-app" scope="llm" &gt; &lt;client-authentication class="com.top_logic.credential.oauth.ClientSecretAuthentication" method="basic"&gt; &lt;secret name="MY_APP_CLIENT_SECRET"/&gt; &lt;/client-authentication&gt; &lt;parameters&gt; &lt;parameter name="audience" value="llm-gateway"/&gt; &lt;/parameters&gt; &lt;/credentials&gt; </pre>
