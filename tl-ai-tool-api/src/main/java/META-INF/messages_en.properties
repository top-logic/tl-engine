com.top_logic.tl.ai.tool.api.P = P
com.top_logic.tl.ai.tool.api.P.required = Required
com.top_logic.tl.ai.tool.api.P.required.tooltip = Whether this parameter is required. Defaults to true.
com.top_logic.tl.ai.tool.api.P.tooltip = Describes a parameter of a <i>tool method</i>-annotated method.
com.top_logic.tl.ai.tool.api.P.value = Value
com.top_logic.tl.ai.tool.api.P.value.tooltip = Description of the parameter. Sent to the LLM.
com.top_logic.tl.ai.tool.api.ToolMethod = Tool method
com.top_logic.tl.ai.tool.api.ToolMethod.concurrencySafe = Concurrency safe
com.top_logic.tl.ai.tool.api.ToolMethod.concurrencySafe.tooltip = Whether this tool can safely run in parallel with other concurrency-safe tools. Defaults to false (fail-closed).
com.top_logic.tl.ai.tool.api.ToolMethod.description = Description
com.top_logic.tl.ai.tool.api.ToolMethod.description.tooltip = Description of what this tool does. Sent to the LLM. Multiple values are joined with newline.
com.top_logic.tl.ai.tool.api.ToolMethod.mode = Mode
com.top_logic.tl.ai.tool.api.ToolMethod.mode.tooltip = What kind of state change this tool makes. Defaults to <i>global</i> (fail-closed).
com.top_logic.tl.ai.tool.api.ToolMethod.name = Name
com.top_logic.tl.ai.tool.api.ToolMethod.name.tooltip = Tool name. Defaults to the Java method name if empty.
com.top_logic.tl.ai.tool.api.ToolMethod.tooltip = Marks a method as a tool that the agent can invoke.
com.top_logic.tl.ai.tool.api.ToolMode = Tool mode
com.top_logic.tl.ai.tool.api.ToolMode.GLOBAL = Global
com.top_logic.tl.ai.tool.api.ToolMode.GLOBAL.tooltip = Tool makes changes to shared application state (model, layouts, workflows).
com.top_logic.tl.ai.tool.api.ToolMode.READ = Read
com.top_logic.tl.ai.tool.api.ToolMode.READ.tooltip = Tool only reads data. No changes, no approval needed.
com.top_logic.tl.ai.tool.api.ToolMode.USER_SCOPED = User scoped
com.top_logic.tl.ai.tool.api.ToolMode.USER_SCOPED.tooltip = Tool makes changes scoped to the current user only (temp views, personal dashboards).
com.top_logic.tl.ai.tool.api.ToolMode.tooltip = Categorizes what kind of state change a tool makes.
com.top_logic.tl.ai.tool.api.registry.ReflectiveToolFactory = Reflective tool factory
com.top_logic.tl.ai.tool.api.registry.ReflectiveToolFactory.Config.tool-class = Tool class
com.top_logic.tl.ai.tool.api.registry.ReflectiveToolFactory.Config.tool-class.tooltip = The Java class containing <i>tool method</i> annotated methods. <p> This class will be scanned for tool definitions. All methods annotated with @ToolMethod will be exposed as AI tools. </p>
com.top_logic.tl.ai.tool.api.registry.ReflectiveToolFactory.tooltip = A <i>tool factory</i> that reflectively discovers tools from a Java class with <i>tool method</i> annotated methods. <p> This factory extracts tool specifications from the configured class and creates corresponding <i>tool</i> instances for each annotated method. </p>
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService = Tool registry service
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService$ToolFactoryConfig = Tool factory configuration
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService$ToolFactoryConfig.tooltip = Configuration for a named tool factory.
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService.Config.tool-factories = Tool factories
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService.Config.tool-factories.tooltip = Map of named tool factories available in the application. <p> Each tool factory is identified by a unique name. The factory name becomes part of the qualified tool name (factory-name.tool-name) used to reference tools in TL-Script functions. </p>
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService.ToolFactoryConfig.implementation = Implementation
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService.ToolFactoryConfig.implementation.tooltip = The tool factory implementation.
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService.tooltip = Registry service for managing tools available in the application. <p> Tools are organized by factory. Each factory produces a set of tools, and each tool is identified by a qualified name in the format {factory-name}.{tool-name}. This allows tools from different factories to have the same simple name without conflicts. </p>
