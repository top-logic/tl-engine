model.orgStructure = Organisationsstruktur
model.orgStructure.OrgHead = Vorstandsbereich
model.orgStructure.OrgHead.tooltip = Ein Vorstandsbereich. Er kann nur direkt unterhalb der Organisation angelegt werden und enthält Organisationseinheiten.
model.orgStructure.OrgHeadChild = Kind von Vorstandsbereich
model.orgStructure.OrgHeadChild.tooltip = Basistyp für die Typen, deren Objekte unterhalb eines Vorstandsbereichs angelegt werden können.
model.orgStructure.OrgRoot = Organisation
model.orgStructure.OrgRoot.tooltip = Die Wurzel der Organisationsstruktur. Sie wird automatisch als Wurzelobjekt ihres Moduls angelegt und kann nicht gelöscht werden.
model.orgStructure.OrgRootChild = Kind von Organisation
model.orgStructure.OrgRootChild.tooltip = Basistyp für die Typen, deren Objekte direkt unterhalb der Organisation angelegt werden können.
model.orgStructure.OrgUnit = Organisationseinheit
model.orgStructure.OrgUnit.all = Organisationsstruktur
model.orgStructure.OrgUnit.all.name = Bezeichnung
model.orgStructure.OrgUnit.all.name.tooltip = Die Bezeichnung der Organisationseinheit. Sie wird im Baum der Organisationsstruktur angezeigt.
model.orgStructure.OrgUnit.all.tooltip = Gemeinsamer Basistyp aller Knoten der Organisationsstruktur. Er definiert die Bezeichnung und die Position eines Knotens im Baum.
model.orgStructure.OrgUnit.base = Organisation (alle)
model.orgStructure.OrgUnit.base.boss = Leiter
model.orgStructure.OrgUnit.base.boss.tooltip = Der Personenkontakt der Person, die diese Organisationseinheit leitet.
model.orgStructure.OrgUnit.base.member = Mitarbeiter
model.orgStructure.OrgUnit.base.member.tooltip = Die Personenkontakte der Personen, die in dieser Organisationseinheit tätig sind.
model.orgStructure.OrgUnit.base.orgID = ID
model.orgStructure.OrgUnit.base.orgID.tooltip = Kennung der Organisationseinheit. Sie wird beim Anlegen der Einheit automatisch aus dem Nummernkreis vergeben und ist danach nicht mehr änderbar.
model.orgStructure.OrgUnit.base.tooltip = Basistyp der Organisationseinheiten unterhalb der Wurzel. Sie besitzen zusätzlich zur Bezeichnung eine Kennung, eine Leitung und Mitarbeiter.
model.orgStructure.OrgUnit.head = Vorstandsbereich
model.orgStructure.OrgUnit.head.tooltip = Basistyp der Organisationseinheiten auf der Ebene direkt unterhalb der Organisation.
model.orgStructure.OrgUnit.root = Organisationswurzel
model.orgStructure.OrgUnit.root.tooltip = Basistyp der Wurzel der Organisationsstruktur. Im Gegensatz zu den Einheiten darunter besitzt die Wurzel weder eine Kennung noch eine Leitung.
model.orgStructure.OrgUnit.tooltip = Eine Organisationseinheit. Sie kann unterhalb eines Vorstandsbereichs oder unterhalb einer anderen Organisationseinheit angelegt und damit beliebig tief geschachtelt werden.
model.orgStructure.OrgUnit.unit = Organisationseinheit
model.orgStructure.OrgUnit.unit.tooltip = Basistyp der Organisationseinheiten unterhalb eines Vorstandsbereichs.
model.orgStructure.OrgUnitChild = Kind von Organisationseinheit
model.orgStructure.OrgUnitChild.tooltip = Basistyp für die Typen, deren Objekte unterhalb einer Organisationseinheit angelegt werden können.
model.orgStructure.tooltip = Modul mit den Typen der Organisationsstruktur. Die Organisationseinheiten bilden einen Baum, an dessen Wurzel die Organisation steht.
