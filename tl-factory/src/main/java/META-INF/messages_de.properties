com.top_logic.factory.project.FactoryFunctions.checkRepository.return = Die Meldung, was am Wert falsch ist; nichts, wenn der Wert leer ist oder ein Repository nennt, das die Steuerungsanwendung lesen kann, wenn das Projekt sein Repository bereits festgehalten hat, oder wenn Git-Hosting ausgeschaltet ist oder der Workspace-Dienst nicht läuft.
com.top_logic.factory.project.FactoryFunctions.checkRepository.tooltip = Prüft das bestehende Repository, das für ein neues Projekt beim Git-Hosting-Dienst eingetragen ist.
