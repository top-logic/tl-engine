com.top_logic.security.passkey.PasskeyService = Passkey service
com.top_logic.security.passkey.PasskeyService.Config.origins = Origins
com.top_logic.security.passkey.PasskeyService.Config.origins.tooltip = The origins the browser may run a ceremony on, e.g. <code>https://app.example.com</code>. <p> Empty: the scheme, host and port of the request that starts a ceremony. </p>
com.top_logic.security.passkey.PasskeyService.Config.rp-id = Relying party ID
com.top_logic.security.passkey.PasskeyService.Config.rp-id.tooltip = The relying party ID: the domain the passkeys are bound to, e.g. <code>example.com</code>. <p> A passkey can only be used on this domain and its subdomains, so changing it makes all registered passkeys unusable. Empty: the host name of the request that starts a ceremony. </p>
com.top_logic.security.passkey.PasskeyService.Config.rp-name = Relying party name
com.top_logic.security.passkey.PasskeyService.Config.rp-name.tooltip = The name of the relying party, shown by an authenticator when a passkey is created. <p> Empty: the application title. </p>
com.top_logic.security.passkey.PasskeyService.Config.timeout = Timeout
com.top_logic.security.passkey.PasskeyService.Config.timeout.tooltip = How long the browser waits for the user to answer a ceremony, and how long a started ceremony is accepted.
com.top_logic.security.passkey.PasskeyService.Config.user-verification = User verification
com.top_logic.security.passkey.PasskeyService.Config.user-verification.tooltip = Whether an authenticator must verify its user (PIN, biometrics) when a passkey is registered or used as second factor. <p> A login with a passkey alone always requires user verification. </p>
com.top_logic.security.passkey.PasskeyService.tooltip = The relying party of the passkeys (Web Authentication credentials) of the accounts: registers passkeys and checks logins with them. <p> The relying party ID and the accepted origins are either configured or taken from the request that starts a registration or login: the host name of the request is then the relying party ID, its scheme, host and port the only accepted origin. A local installation therefore works without configuration; behind a reverse proxy that does not forward the original host, configure both. </p> <p> Registered passkeys are discoverable, so they can log in without a user name. Such a login with a passkey alone always requires that the authenticator verifies its user (PIN, biometrics), because the passkey is its only proof. Registrations and logins with a passkey as second factor after the password require the configured user verification. </p>
