com.top_logic.layout.codeedit.control.CodeEditorControl$WarnLevel = Warn level
com.top_logic.layout.codeedit.control.CodeEditorControl$WarnLevel.tooltip = Level defining which client side warnings and errors are reflected to the the underlying <i>form field</i>.
com.top_logic.layout.codeedit.control.CodeEditorControl.WarnLevel.ERROR = Error
com.top_logic.layout.codeedit.control.CodeEditorControl.WarnLevel.ERROR.tooltip = Client side warnings are shown as warnings and errors are shown as errors in the base form field.
com.top_logic.layout.codeedit.control.CodeEditorControl.WarnLevel.NONE = None
com.top_logic.layout.codeedit.control.CodeEditorControl.WarnLevel.NONE.tooltip = Client side warnings and errors do not effect the warning, or error state of the base form field.
com.top_logic.layout.codeedit.control.CodeEditorControl.WarnLevel.WARN = Warn
com.top_logic.layout.codeedit.control.CodeEditorControl.WarnLevel.WARN.tooltip = Client side warnings and errors are both displayed as warning in the base form field.
