com.top_logic.ai.chat.history.LegacyChatSessionMigration = Migration alter Chat-Sitzungen
com.top_logic.ai.chat.history.LegacyChatSessionMigration.tooltip = Einmalige, proaktive Migration von <code>tl.ai.chat:ChatSession</code> Legacy-Objekten in <i>Agentensitzungen</i> beim Anwendungsstart. <p> Jede Legacy-Sitzung wird zu einer <i>Agentensitzung</i> (Typ CHAT) mit demselben Titel, Eigentümer, denselben Zeitstempeln und Metadaten sowie einer synthetischen, abgeschlossenen <i>Agentenausführung</i>, die den alten V2-Nachrichten-Blob wortwörtlich als Transkript enthält. Legacy-Blobs im Pre-V2-Format können nicht wiedergegeben werden; ihr Konversationsinhalt wird mit einer Warnung verworfen (Titel und Zeitstempel bleiben erhalten). Jedes Legacy-Objekt wird nach der Migration gelöscht, sodass die Tabelle <code>ChatSession</code> nach einem Systemstart dieser Version leer ist und nachfolgende Starts einen geringen Aufwand darstellen (No-Op). </p> <p> Die Migration erfolgt nach dem Best-Effort-Prinzip: Ein Fehler wird protokolliert, verhindert jedoch niemals den Start der Anwendung; verbleibende alte Sitzungen werden beim nächsten Systemstart erneut versucht. </p> <p>
