com.top_logic.demo.react.view.DemoEditorConfig.tags = Schlagworte
com.top_logic.demo.react.view.DemoEditorConfig.tags.tooltip = Schlagworte, die diese Konfiguration beschreiben, als ein einziger kommaseparierter Text. <p> Eine <i>Liste</i> einfacher Werte mit einem eigenen <i>Format</i> ist keine Sammlung einzeln zu bearbeitender Einträge - das Format macht aus der ganzen Liste einen Text und wieder zurück, also ein einzelnes Eingabefeld statt des Sammlungseditors, den <i>Artikel</i> bekommt. Genau das leistet hier <i>Kommaseparierte Zeichenketten</i>: Die Eigenschaft wird als "rot, grün, blau" bearbeitet. </p>
com.top_logic.demo.react.view.DemoEditorConfig.title = Titel
com.top_logic.demo.react.view.DemoEditorConfig.title.tooltip = Ein frei wählbarer Titel.
com.top_logic.demo.react.view.DemoEditorConfig.tooltip = In sich geschlossene Beispielkonfiguration, bearbeitet mit der Demo des Konfigurationseditors. <p> Verwendet eine Reihe von Eigenschaftstypen (Text, Zahl, Boolescher Wert, Aufzählung, ein verschachteltes Element, eine Liste von Elementen, ein Array von Elementen, eine Map von Elementen und einen Ressourcenschlüssel), sodass der React-Konfigurationseditor jede Editorvariante rendert. </p>
