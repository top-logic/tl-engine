com.top_logic.addons.loginmessages.layout.LoginMessageNamingScheme.LoginMessageName.name.tooltip = Namensbeschaffer.
com.top_logic.addons.loginmessages.layout.LoginMessageResetHandler = Login-Nachrichten-Reset-Handler
com.top_logic.addons.loginmessages.layout.LoginMessageResetHandler.tooltip = <i>Befehl</i>, der den Bestätigungsstatus der ausgewählten Nachricht für alle Konten zurücksetzt. <p> Nach dem Zurücksetzen muss jedes Konto die ausgewählte Anmeldemeldung nach der Anmeldung erneut bestätigen. </p>
com.top_logic.addons.loginmessages.layout.LoginMessagesHook = Hook für Login-Nachrichten
com.top_logic.addons.loginmessages.layout.LoginMessagesHook.Config.showLoginMessages = Anmeldemeldungen anzeigen
com.top_logic.addons.loginmessages.layout.LoginMessagesHook.Config.showLoginMessages.tooltip = Ob beim Start der Anwendung <i>Anmeldemeldungen</i> angezeigt werden sollen.
com.top_logic.addons.loginmessages.layout.LoginMessagesHook.tooltip = Ein <i>Login-Hook</i> zur Anzeige von <i>Login-Meldungen</i>.
com.top_logic.addons.loginmessages.script.LoginMessagesFunctions.confirm = Login-Meldungen bestätigen
com.top_logic.addons.loginmessages.script.LoginMessagesFunctions.confirm.param.account.tooltip = Das Konto, das die Meldungen bestätigt hat.
com.top_logic.addons.loginmessages.script.LoginMessagesFunctions.confirm.param.messages.tooltip = Die bestätigten Meldungen, z. B. das Ergebnis von <code>loginMessagesDue($account)</code>.
com.top_logic.addons.loginmessages.script.LoginMessagesFunctions.confirm.tooltip = Hält fest, dass das angegebene Konto die angegebenen Login-Meldungen jetzt bestätigt hat. <p> Eine bestätigte Meldung wird erst wieder angezeigt, wenn ihre Bestätigung abgelaufen ist. </p>
com.top_logic.addons.loginmessages.script.LoginMessagesFunctions.due = Fällige Login-Meldungen
com.top_logic.addons.loginmessages.script.LoginMessagesFunctions.due.param.account.tooltip = Das Konto, das sich anmeldet.
com.top_logic.addons.loginmessages.script.LoginMessagesFunctions.due.return = Die anzuzeigenden Meldungen, absteigend nach Namen sortiert.
com.top_logic.addons.loginmessages.script.LoginMessagesFunctions.due.tooltip = Die Login-Meldungen, die dem angegebenen Konto bei seiner Anmeldung angezeigt werden. <p> Eine Meldung wird angezeigt, wenn sie aktiv ist, das heutige Datum zwischen ihrem Start- und Enddatum liegt und das Konto sie noch nicht bestätigt hat oder seine Bestätigung abgelaufen ist. Eine Ansicht zeigt sie mit <code>loginMessagesDue($account)</code> an und hält ihre Bestätigung mit <code>loginMessagesConfirm($account, $messages)</code> fest. </p>
