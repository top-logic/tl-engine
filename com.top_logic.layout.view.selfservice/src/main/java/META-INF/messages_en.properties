com.top_logic.layout.view.selfservice.AcceptInvitationAction = Accept invitation action
com.top_logic.layout.view.selfservice.AcceptInvitationAction.tooltip = <i>View action</i> of the account dialog of an invitation: it creates the account and logs the new user in. <p> The input is the <code>"tl.login:AccountCreation"</code> the dialog edits, the invitation comes from the <code>"invitation"</code> channel. A refusal - missing surname, passwords that differ or violate the password rules, an invitation that is no longer open, the callback of the invitation - is reported and leaves the dialog open. </p> <p> The new account then runs the <i>login steps</i> of the React login in a <i>login flow</i>, exactly as after a password login, e.g. sets a second factor up if the invitation requires one. After the last step the window loads the root of the view application (<code>"/view/"</code>), not the invitation page again. </p>
com.top_logic.layout.view.selfservice.ApplyPasswordResetAction = Apply password reset action
com.top_logic.layout.view.selfservice.ApplyPasswordResetAction.tooltip = <i>View action</i> that completes the self-service password reset: it verifies the code entered in the reset dialog against the one <i>request password reset action</i> generated (and within its validity), then applies the new password to the account. <p> On success the dialog closes and the user is told they can log in with the new password - the reset does <em>not</em> log the user in (unlike the regular login follow-up steps). </p>
com.top_logic.layout.view.selfservice.CheckInvitationCodeAction = Check invitation code action
com.top_logic.layout.view.selfservice.CheckInvitationCodeAction.tooltip = <i>View action</i> of the code dialog of an invitation: it checks the entered code against the <i>verification code</i> that <i>request invitation code action</i> mailed and replaces the dialog with the dialog creating the account. <p> The account dialog edits a transient <code>"tl.login:AccountCreation"</code> whose user name is the e-mail address of the invitation. It receives the invitation on the <code>"invitation"</code> channel and, on the <code>"passwords"</code> channel, whether the person chooses a password. </p>
com.top_logic.layout.view.selfservice.RequestInvitationCodeAction = Request invitation code action
com.top_logic.layout.view.selfservice.RequestInvitationCodeAction.tooltip = <i>View action</i> that starts the acceptance of an <i>invitation</i>: it mails a <i>verification code</i> to the address of the invitation and opens the dialog in which the invited person enters it. <p> The action processes the token of the invitation link (see <code>"invitation"</code>) or the invitation itself; without either, it takes the invitation from the <code>"invitation"</code> channel of its view, i.e. it sends a new code from the code dialog. It refuses an invitation that is not open with the reason, and a request that follows the previous one for the same invitation too soon. Without a configured mail server, the request is refused and no dialog opens: the code is only ever sent by mail. </p> <p> The dialog receives the invitation on the <code>"invitation"</code> channel and the code on the <code>"verification"</code> channel; both stay on the server. The top dialog open already, e.g. the code dialog asking for a new code, is replaced. </p>
com.top_logic.layout.view.selfservice.RequestPasswordResetAction = Request password reset action
com.top_logic.layout.view.selfservice.RequestPasswordResetAction.tooltip = <i>View action</i> that starts the self-service password reset: it generates a verification code, emails it to the identified account, and opens the reset-password dialog (carrying the account, the expected code and its creation time on dialog channels). <p> To avoid disclosing whether a user name exists, the behaviour is identical regardless of whether the account was found: a code is always generated and the reset dialog always opens; the mail is sent only when a matching, password-changeable account with an email address exists. </p>
