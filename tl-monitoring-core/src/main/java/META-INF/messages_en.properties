class.com.top_logic.monitoring.log.I18NConstants.FILE_IN_WRONG_ENCODING__NAME_ENCODING = Failed to read log file {0}. The encoding {1} failed to parse the characters. The file will be re-read with UTF-8 with unparseable characters being replaced by the Unicode Replacement Character.
class.com.top_logic.monitoring.log.I18NConstants.LOG_LINE_DUMPED_TO_CONSOLE = The log entry has been printed to the console.
class.com.top_logic.monitoring.log.I18NConstants.TABLE_COLUMN_DETAILS_DIALOG_TITLE = Stacktrace
class.com.top_logic.monitoring.log.I18NConstants.TABLE_FOOTER_ERRORS__DISPLAYED_ALL = {0} / {1} errors
