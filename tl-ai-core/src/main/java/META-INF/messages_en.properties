com.top_logic.tl.ai.core.text.TextEdits$Failure = Failure
com.top_logic.tl.ai.core.text.TextEdits$Failure.tooltip = Why an edit was refused. <p> Each value is a distinct thing for the caller to do next, which is the only reason to have a code at all: the message carried by the result says which one in words. </p>
com.top_logic.tl.ai.core.text.TextEdits$Match = Match
com.top_logic.tl.ai.core.text.TextEdits$Match.tooltip = How the anchor was found, in the order the cascade tries. <p> Also the level of the normalisation a level applies: every level compares a normalised anchor with a normalised text and then maps the hit back to the offsets of the <em>original</em>, so what gets replaced is always a range of the text as stored. </p>
com.top_logic.tl.ai.core.text.TextEdits$Matching = Matching
com.top_logic.tl.ai.core.text.TextEdits$Matching.tooltip = How far the match cascade may go.
com.top_logic.tl.ai.core.text.TextEdits.Failure.AMBIGUOUS = Ambiguous
com.top_logic.tl.ai.core.text.TextEdits.Failure.AMBIGUOUS.tooltip = The anchor occurs more than once and the caller asked for a single replacement. <p> Never resolved by taking the first one: which occurrence the caller meant is not knowable, and silently editing one of them is the failure mode this whole class exists to prevent. The line numbers of every occurrence come back so the caller can extend the anchor. </p>
com.top_logic.tl.ai.core.text.TextEdits.Failure.EMPTY_ANCHOR = Empty anchor
com.top_logic.tl.ai.core.text.TextEdits.Failure.EMPTY_ANCHOR.tooltip = The anchor is empty and the text is not. <p> An empty anchor occurs everywhere and therefore addresses nothing. It is accepted against an empty text, where it addresses the one position that exists. </p>
com.top_logic.tl.ai.core.text.TextEdits.Failure.NOT_FOUND = Not found
com.top_logic.tl.ai.core.text.TextEdits.Failure.NOT_FOUND.tooltip = The anchor does not occur, at any level of the cascade.
com.top_logic.tl.ai.core.text.TextEdits.Match.EXACT = Exact
com.top_logic.tl.ai.core.text.TextEdits.Match.EXACT.tooltip = The anchor occurs character for character.
com.top_logic.tl.ai.core.text.TextEdits.Match.LINE_ENDINGS = Line endings
com.top_logic.tl.ai.core.text.TextEdits.Match.LINE_ENDINGS.tooltip = The anchor occurs once \\r\\n and \\r are read as \\n on both sides.
com.top_logic.tl.ai.core.text.TextEdits.Match.WHITESPACE = Whitespace
com.top_logic.tl.ai.core.text.TextEdits.Match.WHITESPACE.tooltip = The anchor occurs once every run of whitespace is read as one space on both sides, and the anchor's own leading and trailing whitespace is dropped. <p> "Whitespace" here includes the space characters Java does not call whitespace - the non-breaking space, the thin space, the ideographic space - because a text that went through a word processor is full of them and none of them is a difference the author intended. </p>
com.top_logic.tl.ai.core.text.TextEdits.Matching.STRICT = Strict
com.top_logic.tl.ai.core.text.TextEdits.Matching.STRICT.tooltip = The anchor must occur character for character. <p> The honest setting for a caller that produced the anchor itself - a migration, a template expansion, an application's own addressing layer. A miss is then a bug in the caller, and matching something almost-equal instead would hide it. </p>
com.top_logic.tl.ai.core.text.TextEdits.Matching.TOLERANT = Tolerant
com.top_logic.tl.ai.core.text.TextEdits.Matching.TOLERANT.tooltip = Exact first; failing that, ignore the line endings; failing that, ignore how whitespace is spelled. <p> The setting for an anchor a language model quoted. The two fallbacks cover the miss classes that have nothing to do with the author's intent - a value stored with CRLF and quoted back with LF, an indentation level retyped with spaces instead of a tab, a non-breaking space in the source that came back as a plain one. A fallback that matched is always reported, so a caller never has to assume which level answered. </p>
com.top_logic.tl.ai.core.tools.authoring.AgentAuthoringTool = Agent authoring tool
com.top_logic.tl.ai.core.tools.authoring.AgentAuthoringTool.tooltip = Tool for creating, inspecting, updating, and deleting application Agents and Skills. <p> Mutating methods inherit the default <i>structural</i> mode, so they require human approval and are blocked in production. Query methods are <i>read</i>. This tool only sees application agents/skills; framework (TopLogic-provided) ones are not visible or editable here. </p>
com.top_logic.tl.ai.core.tools.authoring.FrameworkWiringTool = Framework wiring tool
com.top_logic.tl.ai.core.tools.authoring.FrameworkWiringTool.tooltip = Tool for adding and removing tools, skills, and delegations on framework (TopLogic-provided) agents and skills. <p> Wiring operations write an additive config overlay and restart <i>TopLogic-Agents and Skills</i> so changes take effect immediately. Query methods read the running service state. </p>
com.top_logic.tl.ai.core.tools.authoring.ScriptToolAuthoringTool = Script tool authoring tool
com.top_logic.tl.ai.core.tools.authoring.ScriptToolAuthoringTool.tooltip = Tool for creating, inspecting, updating, and deleting TL-Script tools in the custom factory of the <i>tool registry service</i> configuration. <p> Mutating methods persist a configuration overlay and restart the <i>tool registry service</i> so that changes take effect immediately; they inherit <i>structural</i> (approval required, blocked in production). Query methods are <i>read</i> and read the persisted configuration. </p>
com.top_logic.tl.ai.core.tools.interaction.TaskTool = Task tool
com.top_logic.tl.ai.core.tools.interaction.TaskTool.tooltip = Tool for managing agent tasks within a processing session. <p> Provides CRUD operations on an in-memory <i>task store</i> that is bound to the current thread via <i>task store binding</i>. Tasks are used to track progress and organize multi-step agent work. </p>
com.top_logic.tl.ai.core.tools.model.AnnotationDefinitionExplorerTool = Annotation definition explorer tool
com.top_logic.tl.ai.core.tools.model.AnnotationDefinitionExplorerTool.tooltip = Tool for exploring annotation definition schemas. <p> This tool allows AI agents to understand annotation DEFINITIONS (what CAN be configured), not annotation INSTANCES (what IS configured). It provides schema information including property metadata, types, constraints, and defaults. </p> <h3>Example Usage:</h3> <pre> // Explore a specific annotation definition describeAnnotation("com.top_logic.model.annotate.Visibility") // Explore form-definition annotation describeAnnotation("com.top_logic.model.form.definition.FormDefinition") </pre> <h3>Integration:</h3> <p> Register this tool via <i>annotated tools</i> and assign it to an agent through the <i>LLM service</i> configuration. </p>
com.top_logic.tl.ai.core.tools.model.InstanceBrowserTool = Instance browser tool
com.top_logic.tl.ai.core.tools.model.InstanceBrowserTool.tooltip = Tool for accessing TopLogic instance data from the knowledge base. <p> This tool provides methods for listing instances of a type with pagination and retrieving detailed information about individual instances. All methods return JSON-formatted strings for consumption by AI agents. </p> <p> Both methods reach the knowledge base with the run's identity, so both are filtered by the run's <i>read filter</i>: an instance the principal may not read is absent from the listing and absent from the total count, and an unreadable attribute of a readable instance is absent from its description. This class holds no serialiser of its own - it used to hold three, which is how the filtering came to be missing here in the first place. </p> <p> Both results are additionally marked as business data. An attribute value is free text some other end user typed into a shared record, so it is the same kind of input as a fetched web page and carries the same tags. The marking sits on the success response only - a refusal is this application's own sentence, not something it disclosed. </p>
com.top_logic.tl.ai.core.tools.model.LockTool = Lock tool
com.top_logic.tl.ai.core.tools.model.LockTool.tooltip = Tool for checking whether a model element is currently locked by another editor.
com.top_logic.tl.ai.core.tools.model.ModelAnnotationBrowserTool = Model annotation browser tool
com.top_logic.tl.ai.core.tools.model.ModelAnnotationBrowserTool.tooltip = Tool for browsing annotations on TopLogic model elements (modules, types, parts, enumerations, classifiers). <p> This tool allows AI agents to inspect annotation metadata on model elements with optional inheritance support. It provides detailed information about each annotation including its tag name, configuration interface, and property values. </p> <h3>Example Usage:</h3> <pre> // List local annotations on a module getCurrentAnnotations("tl.core", false) // List local annotations on a type getCurrentAnnotations("tl.core:TLObject", false) // List all annotations including inherited getCurrentAnnotations("tl.core:TLObject", true) // List annotations on an enumeration getCurrentAnnotations("tl.core:TLScope", false) // List annotations on a type part getCurrentAnnotations("tl.core:TLObject#name", false) // List annotations on a classifier (enum literal) getCurrentAnnotations("tl.core:TLScope#global", false) </pre> <h3>Integration:</h3> <p> Register this tool via <i>annotated tools</i> and assign it to an agent through the <i>LLM service</i> configuration. </p>
com.top_logic.tl.ai.core.tools.model.ModelAnnotationEditorTool = Model annotation editor tool
com.top_logic.tl.ai.core.tools.model.ModelAnnotationEditorTool.tooltip = Tool for setting and removing annotations on TopLogic model elements. <p> This tool allows AI agents to modify annotation metadata on model elements (modules, types, parts, classifiers). Annotation configurations are accepted as JSON matching the schema from <i>configuration schema tool</i>. </p>
com.top_logic.tl.ai.core.tools.model.ModelBrowserTool = Model browser tool
com.top_logic.tl.ai.core.tools.model.ModelBrowserTool.tooltip = Tool for browsing TopLogic model structure (modules, types, parts). <p> This tool provides three methods that form the natural hierarchy for model exploration: listing all modules, listing types within a module, and listing properties/references of a type. All methods return JSON-formatted strings for consumption by AI agents. </p>
com.top_logic.tl.ai.core.tools.model.ModelEditorTool = Model editor tool
com.top_logic.tl.ai.core.tools.model.ModelEditorTool.tooltip = Tool for creating and updating TopLogic model elements. <p> This tool provides methods for creating and updating modules, classes, properties, references, backward references, and enumerations in the TopLogic application model. </p> <p> All methods return JSON-formatted strings for consumption by AI agents. </p>
com.top_logic.tl.ai.core.tools.model.ModelSearchTool = Model search tool
com.top_logic.tl.ai.core.tools.model.ModelSearchTool.tooltip = Tool for searching across the TopLogic application model. <p> This tool provides intelligent text search across modules, types (classes, enumerations, datatypes), and properties/references. It searches technical names, qualified names, labels, and descriptions, returning the top 10 most relevant matches with contextual information. </p>
com.top_logic.tl.ai.core.tools.model.ObjectEditTool = Object edit tool
com.top_logic.tl.ai.core.tools.model.ObjectEditTool.tooltip = Changes, creates and deletes single business objects in one call each. <p> <b>What it is for.</b> Changing one value of an object the user has open used to cost a skill load, a handful of TL-Script documentation lookups and a script - nine steps for "set the price to 450" (Gitea #625). These tools take the object's identifier and the new values as structured input, convert each value to its attribute's type on the server (<i>attribute values</i>), check the model's constraints (<i>object constraints</i>) and answer with the old and the new values, so the change needs no second read to be confirmed. A set of objects chosen by a condition, or a value computed from other data, remains one script, run by changeData. </p> <p> <b>An object with its parts.</b> createObject takes the parts of the new object - the objects of its compositions, nested up to <code>3</code> levels - in its values, and creates the whole tree in one call (#630). That is one approval instead of one per object, and it is the only way an object with a <em>mandatory</em> composition can be created here at all: the model's constraints are asked once, after the whole tree exists, and a violation anywhere in it undoes all of it. Every part is asked for the right to be created in its container, the question a createObject call naming that container asks. For a container created in the same call the engine answers that by the container's own creation, which was asked - the same answer one call per part got, since the turn's calls share one transaction. </p> <p> <b>The user's rights, and nothing else.</b> Every call acts as the run's principal: </p> <ul> <li>The object is resolved through <i>tid resolver</i>, so one the principal may not read is refused like one that does not exist.</li> <li>Write, create and delete are asked of the run's <i>model security</i> - the engine's ModelAccessRights, deny by default - per object and, for a change, per attribute: a part grant that withholds one attribute refuses that attribute by name. Every check runs before the first write, so a refusal changes nothing and is reported as a failed call that the turn does not have to roll back.</li> <li>A call in a <em>system</em> context is refused outright. The engine grants every right there whoever the run's principal is, and its commit would be recorded under the system's name rather than the user's; a write that cannot be checked or attributed is not made.</li> <li>The approval prompt of a <i>data write</i> tool comes on top of all this, and the pre-commit guard asks the same questions again for whatever the turn changed.</li> <li>The answer shows only values the principal may read.</li> </ul> <p> <b>A new object's attributes.</b> The engine allows every operation on an object that is not yet committed, attribute grants included, because the roles that would decide them are derived at commit time. A new object's initial values are therefore checked the way the application's own create forms check them: the creation is, the attributes are not. </p>
com.top_logic.tl.ai.core.tools.model.ObjectIdConfig = Object ID configuration
com.top_logic.tl.ai.core.tools.model.ObjectIdConfig$HintConfig = Hint configuration
com.top_logic.tl.ai.core.tools.model.ObjectIdConfig$HintConfig.tooltip = One thing this application can say about a string that is not an object id. <p> The sentence reaches a language model, not a person, and it is worth writing as an instruction rather than as a complaint: what the string is, and which tool turns it into an id. </p>
com.top_logic.tl.ai.core.tools.model.ObjectIdConfig.HintConfig.explanation = Explanation
com.top_logic.tl.ai.core.tools.model.ObjectIdConfig.HintConfig.explanation.tooltip = What to tell the model, continuing the sentence that begins with the quoted identifier. <p> The framework writes the identifier and quotes it, so this text starts where that leaves off: "is a record code. Search for it with sales__search and use the id from the answer." becomes "LEAD-014" is a record code. Search for it with sales__search and use the id from the answer. </p>
com.top_logic.tl.ai.core.tools.model.ObjectIdConfig.HintConfig.pattern = Pattern
com.top_logic.tl.ai.core.tools.model.ObjectIdConfig.HintConfig.pattern.tooltip = The strings this hint is about, as a regular expression. <p> Matched against the <em>whole</em> identifier, so [A-Z]+-[0-9]+ is the code LEAD-014 and nothing that merely contains it. A pattern that does not compile is logged once and then matches nothing: a typo in a hint must not break the resolver it is a hint for. </p>
com.top_logic.tl.ai.core.tools.model.ObjectIdConfig.hints = Hints
com.top_logic.tl.ai.core.tools.model.ObjectIdConfig.hints.tooltip = The application's own explanations, tried before the built-in ones. <p> In declaration order; the first pattern that matches decides the message, and nothing after it is tried. The list composes additively across configuration files, so an application adds its hints without restating the ones another module declared. </p>
com.top_logic.tl.ai.core.tools.model.ObjectIdConfig.tooltip = What this application knows about the identifiers a model passes to a tool. <p> <i>Tid diagnostics</i> recognises the mistakes that every application sees - a uuid, a printed object, an unknown type, an id of the wrong shape - by itself. The one class it cannot recognise is the identifier an application's own users speak in: an order number, a ticket code, a part number. Which string is such a code, and which tool turns it into an object id, is knowledge only the application has, so it declares it here. </p>
com.top_logic.tl.ai.core.tools.model.SearchAnnotationTool = Search annotation tool
com.top_logic.tl.ai.core.tools.model.SearchAnnotationTool.tooltip = Tool for listing available annotation types for TopLogic model elements. <p> This tool allows AI agents to discover which annotation types can be applied to a given model element. It enumerates all @InApp annotation types filtered by the target element's kind and type. </p>
com.top_logic.tl.ai.core.tools.model.TidDiagnostics$TypeState = Type state
com.top_logic.tl.ai.core.tools.model.TidDiagnostics$TypeState.tooltip = What is known about the type name in front of the colon of an identifier.
com.top_logic.tl.ai.core.tools.model.TidDiagnostics.TypeState.ABSTRACT = ABSTRACT
com.top_logic.tl.ai.core.tools.model.TidDiagnostics.TypeState.ABSTRACT.tooltip = The type exists but is abstract, so nothing is ever stored under it.
com.top_logic.tl.ai.core.tools.model.TidDiagnostics.TypeState.INSTANTIABLE = Instantiable
com.top_logic.tl.ai.core.tools.model.TidDiagnostics.TypeState.INSTANTIABLE.tooltip = The type exists and has instances.
com.top_logic.tl.ai.core.tools.model.TidDiagnostics.TypeState.UNDECIDED = Undecided
com.top_logic.tl.ai.core.tools.model.TidDiagnostics.TypeState.UNDECIDED.tooltip = Nobody was asked - there is no type repository at hand.
com.top_logic.tl.ai.core.tools.model.TidDiagnostics.TypeState.UNKNOWN = Unknown
com.top_logic.tl.ai.core.tools.model.TidDiagnostics.TypeState.UNKNOWN.tooltip = No type of that name exists.
com.top_logic.tl.ai.core.tools.model.TypeAnalysisTool = Type analysis tool
com.top_logic.tl.ai.core.tools.model.TypeAnalysisTool.tooltip = Tool for analyzing TopLogic type dependencies and relationships. <p> This tool provides methods for understanding how types are used throughout the model: finding all usages of a type and finding where a part is defined and inherited. All methods return JSON-formatted strings for consumption by AI agents. </p>
com.top_logic.tl.ai.core.tools.model.ViewDocumentTool = View document tool
com.top_logic.tl.ai.core.tools.model.ViewDocumentTool.tooltip = Lets an agent perceive the content stored on a model object. <p> Given the TID of any object that holds a tl.core:Binary attribute, the tool reads the stored bytes and brings them to the model in the right modality: images and PDFs ride along in the tool result as multimodal content (so a vision-capable model actually <em>sees</em> them), text is returned inline, and anything else produces a plain explanation. It is not tied to any particular type - a browser screenshot, an uploaded invoice PDF and an attached CSV all go through the same path. </p> <p> Read access is checked through the run's model security, which consults the engine's model access rights for the run's principal. The check is where the TID is resolved: <i>tid resolver</i> refuses an object the principal may not read, so this tool never holds one. </p>
com.top_logic.tl.ai.core.tools.perception.Modality = Modality
com.top_logic.tl.ai.core.tools.perception.Modality.IMAGE = Image
com.top_logic.tl.ai.core.tools.perception.Modality.IMAGE.tooltip = A raster image (PNG, JPEG, GIF, WebP, ...).
com.top_logic.tl.ai.core.tools.perception.Modality.PDF = Pdf
com.top_logic.tl.ai.core.tools.perception.Modality.PDF.tooltip = A PDF document.
com.top_logic.tl.ai.core.tools.perception.Modality.tooltip = A non-text input modality that a model may or may not be able to perceive.
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport = Perception support
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport.SUPPORTED = Supported
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport.SUPPORTED.tooltip = The catalogue states the model accepts this modality.
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport.UNKNOWN = Unknown
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport.UNKNOWN.tooltip = The catalogue has no entry for the model, so nothing can be concluded.
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport.UNSUPPORTED = Unsupported
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport.UNSUPPORTED.tooltip = The catalogue states the model does not accept this modality.
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport.tooltip = Whether the active model can perceive a given <i>modality</i>. <p> The answer is derived from the model catalogue, which is best-effort metadata: it may be missing entirely for locally hosted or custom models. <i>Unknown</i> keeps that case distinguishable from a model that is documented as text-only. </p>
com.top_logic.tl.ai.core.tools.present.ChartKind = Chart kind
com.top_logic.tl.ai.core.tools.present.ChartKind.BAR = Bar
com.top_logic.tl.ai.core.tools.present.ChartKind.BAR.tooltip = Bars, one per object.
com.top_logic.tl.ai.core.tools.present.ChartKind.LINE = Line
com.top_logic.tl.ai.core.tools.present.ChartKind.LINE.tooltip = A line through the objects' values, in row order.
com.top_logic.tl.ai.core.tools.present.ChartKind.PIE = Pie
com.top_logic.tl.ai.core.tools.present.ChartKind.PIE.tooltip = Slices of a whole.
com.top_logic.tl.ai.core.tools.present.ChartKind.tooltip = The kind of chart a <i>chart spec</i> draws. <p> Each constant is a Chart.js chart type. The set is kept to the kinds that one value per object reads well in; anything that needs several series is out of reach of the one-label, one-value spec anyway. </p>
com.top_logic.tl.ai.core.tools.present.PresentAs = Present as
com.top_logic.tl.ai.core.tools.present.PresentAs.CHART = Chart
com.top_logic.tl.ai.core.tools.present.PresentAs.CHART.tooltip = One bar, point or slice per object, its label and value computed from the object.
com.top_logic.tl.ai.core.tools.present.PresentAs.FORM = Form
com.top_logic.tl.ai.core.tools.present.PresentAs.FORM.tooltip = The fields of exactly one object.
com.top_logic.tl.ai.core.tools.present.PresentAs.TABLE = Table
com.top_logic.tl.ai.core.tools.present.PresentAs.TABLE.tooltip = One row per object, with the columns of the objects' type.
com.top_logic.tl.ai.core.tools.present.PresentAs.tooltip = How a <i>presentation</i> shows its objects. <p> The constant names are what the model writes: the present tool's schema lists them. </p>
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory = Script tool factory
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory$ScriptToolConfig = Script tool configuration
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory$ScriptToolConfig.tooltip = Configuration for a single TL-Script tool. <p> Inherits name, parameters (with full <i>type</i> picker), label, description, and implementation expression from <i>script configuration</i>. Adds the AI-specific mode and concurrency flags. </p>
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.Config.tools = Tools
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.Config.tools.tooltip = The tools to create.
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.concurrency-safe = Concurrency safe
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.concurrency-safe.tooltip = Whether this tool can safely run in parallel with other concurrency-safe tools.
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.mode = Mode
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.mode.tooltip = What kind of state change this tool makes. Defaults to <i>data write</i>.
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.summary = Summary
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.summary.tooltip = What is kept of this tool's result when the conversation is compacted, computed from the result. <p> One argument, the value the implementation answered; the expression states the short form of it, for example <code>rows -&gt; $rows.size() + " invoices"</code>. Compaction keeps this instead of the full result, so a long answer stops costing what it cost when it was fresh. Unset keeps the beginning of the result, as before. </p> <p> It is disclosed under the same read rights as the result itself, so it may name model objects. </p>
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.truncation-hint = Truncation hint
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.truncation-hint.tooltip = How many characters of this tool's result reach the model before it is cut short. <p> A tool that answers with a long document needs more room than the installation grants by default; one that answers with a status word needs far less, and saying so keeps a runaway result from crowding the conversation. Unset - zero or less - uses the installation's default. </p>
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.tooltip = A <i>tool factory</i> that creates tools from TL-Script implementations. <p> Each tool configuration reuses the engine's <i>script configuration</i> contract — the same parameter type-picker, mandatory / multiple flags, default values, and i18n descriptions used by configured TL-Script functions — and adds the AI-specific mode and concurrency flag. </p>
com.top_logic.tl.ai.core.tools.registry.SubagentToolFactory = Subagent tool factory
com.top_logic.tl.ai.core.tools.registry.SubagentToolFactory.tooltip = A <i>tool factory</i> that provides the generic asynchronous-subagent orchestration tools: spawn_subagent (fire-and-forget spawn), list_agents, subagent_status (non-blocking status probe) and wait_for_subagent (opt-in blocking join). <p> These tools are independent of the pre-wired delegation flow: any agent can select them by name to spawn an arbitrary predefined agent chosen at call time. The target <i>agent factory</i> is resolved lazily per call so the factory can be created before the agent services have started. </p>
com.top_logic.tl.ai.core.tools.script.ChangeDataTool = Change data tool
com.top_logic.tl.ai.core.tools.script.ChangeDataTool.tooltip = Changes data with one script in the application's query language (TL-Script), with the user's rights: the tool for a set of objects chosen by a condition, values calculated from other data, or several steps that belong together. One known object with given values is changed by the object tools instead (#625). <h2>Only changes</h2> <p> A script without any effect is refused, and pointed to query and present, which read without anybody being asked. The refusal is given before anybody is asked to approve the call (<i>check</i>), so a read never shows an approval prompt, and reading and changing have one tool each (#630). The same check refuses a script that does not compile and, for a real change, an account without <code>"data.write"</code> - each of them a prompt the user would otherwise answer in vain. </p> <h2>The dry run</h2> <p> dryRun=true runs the change and answers what it would change - the same report a real run answers with, values before and after - and saves nothing. It is a read (<i>dry run</i>): no approval, and no part in the turn's transaction. That holds by construction rather than by care: </p> <ul> <li>It runs in an interaction of its own for the same user, on a worker thread, in a transaction that is always rolled back. The engine's transactions do not nest: rolling back one opened inside the turn's transaction would fail the turn, and a separate interaction has a transaction context of its own.</li> <li>It runs only a script whose every effect is a write to the knowledge base (<i>side effects</i>), because that is all a rollback takes back. A script that also sends a mail, draws a number or calls another system is checked and not run.</li> <li>It runs with the user's rights: the engine checks them inside the script, so a dry run refuses what the real run would refuse.</li> </ul> <h2>Rights</h2> <p> The tool is in <code>"script"</code>; making a change costs <code>"data.write"</code> on top (a dry run does not), decided by the run's own policy - background allowlist, administrator bypass, role grants - exactly as for a data.write tool. A call in a system context is refused: the engine checks no rights there and records no user as the author. What the answer shows passes <i>read filter</i>; the pre-commit guard asks again for whatever the turn changed. </p>
com.top_logic.tl.ai.core.tools.script.TLScriptReferenceTool = Script reference tool
com.top_logic.tl.ai.core.tools.script.TLScriptReferenceTool.tooltip = Tool for listing TLScript functions and retrieving documentation. <p> This tool provides access to the TLScript function registry, allowing AI agents to discover available functions and retrieve detailed documentation for them. It uses <i>search builder</i> to access the function metadata. </p>
com.top_logic.tl.ai.core.tools.script.messages.ErrorType = Error type
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.LEXICAL_ERROR = Lexical error
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.LEXICAL_ERROR.tooltip = Lexical error (invalid characters).
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.SYNTAX_ERROR = Syntax error
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.SYNTAX_ERROR.tooltip = Syntax error (parser error).
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.VALIDATION_ERROR = Validation error
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.VALIDATION_ERROR.tooltip = Validation error (model references, type checking).
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.tooltip = Type of validation error.
com.top_logic.tl.ai.core.tools.text.TextEditTool = Text edit tool
com.top_logic.tl.ai.core.tools.text.TextEditTool.tooltip = Reads one text-valued attribute of one object verbatim, and changes a named passage of it. <p> <b>What it is for.</b> The only way to change a stored text before this was a whole-value write - a TL-Script set with the complete new value. For a document body or a system prompt that costs the whole value in output tokens per edit, and it puts every untouched paragraph back through the model, where it can come back subtly different. Editing a named passage costs the changed snippet and cannot alter anything outside it, because nothing outside it is ever re-emitted. </p> <p> <b>Read first, then anchor.</b> Reading hands out the value as it is stored, with line numbers in a gutter so a passage can be named; editing takes that passage out of it and puts another one in its place. The pair only works because the read is verbatim: an anchor quoted back from a rendering that had normalised anything would not be the text. </p> <p> <b>Text and String attributes only.</b> Most attributes of a model are not text - references, numbers, dates, enumerations, booleans, binaries, multi-valued properties - and none of them is find-and-replaceable. They are refused by name rather than coerced, so a caller is told which attribute cannot be edited instead of being handed a value that was never text. </p> <p> <b>Security.</b> The object is resolved through <i>tid resolver</i>, so an object the run's principal may not read is refused exactly like one that does not exist; the attribute is checked for Read before it is disclosed and for Write before it is changed. The change enrols in the turn's own transaction and is committed by the agent loop, which is where the pre-commit guard sees it a second time and where a constraint that vetoes the commit is reported back to the model. </p>
com.top_logic.tl.ai.core.tools.web.BraveSearchEngine = Brave
com.top_logic.tl.ai.core.tools.web.BraveSearchEngine.Config.api-key = Api key
com.top_logic.tl.ai.core.tools.web.BraveSearchEngine.Config.api-key.tooltip = The Brave Search API subscription token (stored encrypted).
com.top_logic.tl.ai.core.tools.web.BraveSearchEngine.Config.base-url = Base URL
com.top_logic.tl.ai.core.tools.web.BraveSearchEngine.Config.base-url.tooltip = The Brave Search API endpoint URL.
com.top_logic.tl.ai.core.tools.web.BraveSearchEngine.tooltip = <i>Web search engine</i> backed by the Brave Web Search API (GET /res/v1/web/search). <p> Brave has no native include/exclude-domain request parameters, so domain filters are realised by appending site:/-site: search operators to the query. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService = Browser tools service
com.top_logic.tl.ai.core.tools.web.BrowserToolsService$SandboxMode = Sandbox mode
com.top_logic.tl.ai.core.tools.web.BrowserToolsService$SandboxMode.tooltip = Whether Chromium's OS-level sandbox is used for the browser sessions.
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.acquire-timeout-seconds = Acquire timeout seconds
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.acquire-timeout-seconds.tooltip = How long a tool call waits for a free session slot before failing fast with a "browser busy, retry" error, in seconds. <p> Kept short on purpose: a bounded wait cannot exhaust the servlet thread pool the way the former unbounded lock could. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.action-timeout-seconds = Action timeout seconds
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.action-timeout-seconds.tooltip = Timeout for acting on a single <b>element</b> - browserClick / browserType, and reading the accessibility snapshot - in seconds. <p> Deliberately much shorter than the page-load timeout, because the two wait for entirely different things. A click waits for the element to become <em>actionable</em> (attached, visible, stable, unobstructed, enabled); if the page has re-rendered that element away - the classic search box whose suggestion list replaces the control after the query is typed - no amount of further waiting can make the wait succeed, and a page-load-sized budget just turns a dead click into a half-minute stall followed by an opaque timeout. Bounding it to a few seconds lets the tool answer promptly with an actionable "re-snapshot and use a fresh ref" instruction (see <i>browser reference not actionable exception</i>) while still absorbing the ordinary case of an element that needs a moment to settle. </p> <p> Raise it for a deliberately slow or heavily animated application; it is clamped to at most the page-load timeout, since waiting longer for one element than for a whole page load is never useful. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.allow-any-domains = Allow any domains
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.allow-any-domains.tooltip = Whether the public-domain allowlist is disabled (allow-any-domains mode). <p> When false (the safe default), a navigation is permitted only if the top-level origin is on the allowlist. When true, the allowlist is ignored and any public domain is reachable - <em>except</em> that SSRF protection and the blocklist still apply unconditionally. Allow-any relaxes only the public-domain allowlist, never SSRF or the blocklist. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.allowed-domains = Allowed domains
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.allowed-domains.tooltip = Administrator-owned allowlist of domains the browser may navigate to. <p> A navigation is permitted only if the target host equals one of these entries or is a sub-domain of one. If empty, the browser refuses every navigation (fail-closed). This is policy configuration - it is not the model-supplied allowedDomains argument of <i>web search tool</i>. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.apply-allowlist-to-all-requests = Apply allowlist to all requests
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.apply-allowlist-to-all-requests.tooltip = Whether the allowlist governs <b>every</b> connection the browser makes, rather than only the top-level document origin. <p> The allowlist has always been a <em>top-level-origin</em> control: an allowlisted page may pull in sub-resources (fonts, scripts, images from a CDN) from anywhere that is neither SSRF-blocked nor blocklisted, exactly as an ordinary browser would. false (the default) preserves that: the filtering proxy enforces SSRF and the blocklist for every connection, and the allowlist keeps being enforced for the top-level origin only. </p> <p> Set to true for a locked-down installation whose intent is "this browser may talk to these domains and nothing else": the proxy then refuses <em>any</em> connection to a host that is not on the allowlist, sub-resources included. That is strictly safer - it also stops an allowlisted page from beaconing to a third party - but a page whose assets live on other domains will render without them, so it is an explicit operator decision rather than the default. It has no effect when allow-any is enabled (there is no allowlist to apply), and it can never relax anything: SSRF and the blocklist apply to every connection in both settings. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.blocked-domains = Blocked domains
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.blocked-domains.tooltip = Administrator-owned blocklist of domains the browser must never navigate to. <p> A top-level origin is refused if its host equals one of these entries or is a sub-domain of one (same matching as <i>Allowed domains</i>). The blocklist takes precedence over the allowlist and applies in every mode, including allow-any. It carves exceptions out of a broad allowlist (or out of allow-any). SSRF protection is enforced independently and cannot be relaxed. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.browser-sandbox = Browser sandbox
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.browser-sandbox.tooltip = Whether the browser sessions run inside Chromium's own OS-level sandbox. <p> The sandbox is the boundary between a renderer executing <em>attacker-controlled page JavaScript</em> and the host the application runs on: without it, a renderer exploit is simply code running with the application's own privileges, inside the application's process tree. It is therefore on wherever it can be, and it is not a performance knob. </p> <p> <i>Auto</i> (the default) keeps it on and gives it up only inside a container, recognised by the marker files and cgroup layout a container runtime leaves behind. That is the one environment where it cannot simply stay on: the default Docker/Podman seccomp profile denies the clone/unshare calls Chromium's namespace sandbox needs, so a sandboxed launch fails outright there. The right answer for a container is a runtime profile that permits those calls (tracked as the deploy-image ticket) - until then, the sandbox is dropped in containers and only in containers. </p> <p> <i>Enabled</i> and <i>disabled</i> are the escape hatches: ENABLED keeps the sandbox even in a container (correct once the image carries a seccomp profile that allows it; the browser will fail to start if it does not), and DISABLED gives it up unconditionally, which weakens the isolation of every browsed page and should only ever be a temporary diagnostic. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.cookie-pools-enabled = Cookie pools enabled
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.cookie-pools-enabled.tooltip = Master switch for cookie pools: whether the browserSaveCookies / browserUseCookies verbs are operative. <p> true (the default) enables persistent, named, encrypted login pools: a session can save its current login state into a named pool and a later session can start seeded from one (see CookiePoolService). When false, both verbs refuse with a clear message and no cookie state is captured or seeded - use this to switch the whole feature off for an installation regardless of what the model tries. Turning it off does not affect ordinary navigation or the per-session isolated context. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.evade-bot-detection = Evade bot detection
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.evade-bot-detection.tooltip = Whether the browser should disguise its automation fingerprint so bot-protection walls are less likely to serve it an access-denied / challenge page (off by default). <p> When false (the default) the browser behaves as an out-of-the-box headless Chromium: no user-agent override, no extra launch argument, no fingerprint init script. When true, each session's context is made to look like an ordinary desktop Chrome: the --disable-blink-features=AutomationControlled launch switch is added, a realistic desktop Chrome user-agent (and matching Accept-Language) is set, and a small init script masks the usual automation tells (navigator.webdriver, empty navigator.plugins, navigator.languages, missing window.chrome). </p> <p> The <b>full</b> Chromium build (Playwright channel "chromium", new headless - still windowless) that evasion also depends on - the light chrome-headless-shell is itself a fingerprint some bot walls suppress content for, even when the UA and navigator.webdriver are masked - is launched for every session regardless of this setting, because it is what allows the UDP egress of WebRTC to be turned off. See BrowserSession.buildLaunchOptions, including the deployment prerequisite that carries. </p> <p> <b>Caveat - authorised use only.</b> Enabling this deliberately circumvents a site's automated-access protection and may violate that site's Terms of Service. It is an operator opt-in for authorised targets (for example a logged-in site the operator owns or has permission to automate), off by default, and must not be enabled to access sites where doing so is not permitted. It does not touch SSRF, the blocklist or the allowlist, which stay enforced unchanged. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.headless = Headless
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.headless.tooltip = Whether browser sessions are launched headless (no visible window). <p> true (the default) is the production-safe path: every session runs a windowless Chromium, so nothing appears on the app host and no local display is required. Set to false to launch a <b>headed</b> (visible) Chromium window on the app host's desktop - a dev/local convenience that requires a local display and must not be used in production or on remote/headless hosts. When headed is requested on a host with no display, the service fails fast at startup rather than hanging on a launch that can never succeed. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.max-concurrent-sessions = Maximum concurrent sessions
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.max-concurrent-sessions.tooltip = Maximum number of live browser sessions (isolated contexts) allowed at once. <p> This bounds memory: each live session is its own Chromium process (roughly 200-400 MB incl. its Playwright driver). Requests beyond the cap reclaim an idle session by LRU or, if none is idle, fail fast with a retryable "browser busy" error. The default of 4 keeps peak browser memory around 1 GB; raise it in line with available RAM. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.max-page-bytes = Maximum page bytes
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.max-page-bytes.tooltip = Maximum number of HTML bytes read from a page before extraction stops.
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.max-page-chars = Maximum page chars
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.max-page-chars.tooltip = Maximum number of characters of extracted text a browser tool returns.
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.navigation-settle-millis = Navigation settle millis
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.navigation-settle-millis.tooltip = Hard cap, in milliseconds, of the post-load <b>settle</b>: after a page-loading operation (browserNavigate, browserBack, or a browserClick that navigated) has seen the page load, and before the page is captured, the browser waits for the page to calm down - and each of the three things it waits for is bounded by this one cap, separately. <p> <b>Commit.</b> Only for a browserClick, and only where the page navigated itself from a script rather than through the link that was clicked: the browser waits for the new document to actually replace the old one before it settles anything, because until then the page's address and its load state are still the old document's. A navigation that is begun and never lands - a 204, a download, a handler that changes its mind - gives up after this cap. </p> <p> <b>Network-quiet.</b> A brief chance for client-side rendering that only starts after the load event: the wait ends as soon as the page has issued no request for Playwright's idle window, or when this cap elapses. It is deliberately <em>not</em> bounded by the page-load timeout: a page that polls, streams or sends beacons - most SSO login pages, most single-page applications - never goes network-idle at all, so a page-load-sized budget here bought nothing and cost that whole budget on every operation. </p> <p> <b>DOM-quiet.</b> The browser then waits until the DOM goes quiet (no mutation for a short internal debounce window, ~500 ms) and any in-flight, finite CSS animation has finished, or until this cap elapses. This closes the common gap where a page injects a cookie-consent banner, lazy widget or other content a beat <em>after</em> navigation returns: without the settle the snapshot is taken too early and misses it, forcing a manual re-snapshot. A still page goes quiet almost immediately and is delayed by at most the debounce window, so fast pages are not meaningfully slowed; a page that never stops mutating (constant animation/polling) is bounded by this cap. </p> <p> The three stages do not add up on any ordinary path: a click that does not navigate runs the DOM-quiet stage alone, and an ordinary link or form-submit click has already committed by the time the commit stage is reached. The cap is always applied well inside the per-operation deadline, so it can never cause a hang. Set to 0 to disable the settle entirely and capture as soon as the page has loaded; the page that is then captured is still internally consistent - address, content and element references are read in one go - it is simply captured earlier. The settle does <em>not</em> apply to browserSnapshot (explicit re-capture), to browserType (same-page edit), or to a browserClick that started no navigation - that one gets the DOM-quiet wait alone, because there is no page load to wait for. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.navigation-timeout-seconds = Navigation timeout seconds
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.navigation-timeout-seconds.tooltip = Timeout for a <b>page load</b> (browserNavigate, browserBack, and a browserClick that started a navigation), in seconds. <p> This bounds waiting for the document: how long the browser may spend reaching domcontentloaded and then the load event on a slow site. It does <em>not</em> bound the settle that follows a load - that is capped much more tightly by <i>Navigation settle millis</i>, because a page that never falls quiet must not cost a page load per operation. Acting on an <em>element</em> is bounded separately and much more tightly again by <i>Action timeout seconds</i>. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.session-idle-timeout-seconds = Session idle timeout seconds
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.session-idle-timeout-seconds.tooltip = How long a session may stay idle (no tool call) before it is closed and its resources released, in seconds.
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.SandboxMode.AUTO = Auto
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.SandboxMode.AUTO.tooltip = The default: the sandbox is used everywhere except inside a container, where the default runtime profile prevents Chromium from setting one up.
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.SandboxMode.DISABLED = Disabled
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.SandboxMode.DISABLED.tooltip = The sandbox is never used, whatever the environment looks like. This weakens the isolation of every browsed page.
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.SandboxMode.ENABLED = Enabled
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.SandboxMode.ENABLED.tooltip = The sandbox is always used, containers included. Chromium refuses to start where it cannot set one up.
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.tooltip = Service owning the pool of isolated, per-session headless Chromium browsers used by <i>browser tool</i>. <p> It holds the configuration (per-navigation timeout, page byte/character caps, the administrator-owned domain allowlist/blocklist/allow-any policy, and the concurrency bounds) and owns the <i>browser session pool</i>. Each agent session gets its <b>own</b> <i>browser session</i> - a dedicated <code>Playwright/Browser/BrowserContext</code> with separate cookies/storage - reused across the many tool calls of a run. Two concurrent sessions can never see each other's cookies, pages or results. </p> <p> <b>Concurrency model (replaces the former single global lock).</b> Sessions run fully concurrently. A <i>browser session pool</i> caps the number of live sessions at <i>Maximum concurrent sessions</i> (a memory bound, not a throughput throttle). Starting a new session waits at most <i>Acquire timeout seconds</i> for a free slot, reclaiming the least-recently-used idle session if needed; if none frees up it fails fast with <i>browser busy exception</i> rather than blocking the caller thread indefinitely. Idle sessions are evicted after <i>Session idle timeout seconds</i>. Every browser operation runs under a hard outer deadline, so one hung page can never pin a slot. </p> <p> Security is layered and applied in a fixed order of precedence for every navigation and every in-browser request (main document, redirects and sub-resources): </p> <ol> <li><b>SSRF always wins.</b> Any request to a private, loopback, link-local or otherwise internal address is refused through <i>URL safety</i>, unconditionally. No configuration can relax this.</li> <li><b>The blocklist always applies.</b> A top-level origin on the administrator-owned blocklist is refused, in every mode.</li> <li><b>Then the allowlist - unless allow-any is enabled.</b> By default the top-level origin must also be on the allowlist. When allow-any is enabled, the public-domain allowlist is skipped (any public domain that is neither SSRF-blocked nor blocklisted is reachable); allow-any relaxes <em>only</em> the allowlist, never SSRF or the blocklist.</li> </ol> <p> The allowlist, blocklist and allow-any flag are policy configuration owned by the administrator - not model-supplied arguments. The default (allowlist-enforced, allow-any off) is safe-by-default: an empty allowlist with allow-any off refuses every navigation. </p> <p> <b>Above all of this sits the browsing governance of <i>browsing policy</i></b>, configured on WebToolsService and resolved per security role: which origins <em>this user's</em> agent may reach, and whether a page there may hand it a file. It composes with the lists above - both have to permit an origin - and an application that configures none is bound by nothing extra. </p> <p> <b>Where the policy is enforced.</b> The authoritative layer is a <i>filtering proxy</i> on the loopback interface that <em>every</em> browser session is pinned to: every connection Chromium makes - top-level navigation, redirect hop, sub-resource, IP-literal target - is checked there before a packet leaves the machine, and the destination is DNS-pinned so a rebinding host cannot slip through. The allowlist, blocklist and allow-any flag are <em>service</em> configuration, identical for every session, so nothing about that half of the decision varies per session; the browsing policy does vary, per role, which is why there is one proxy per <em>policy in use</em> rather than one for the whole service. Inside each browser the same policy is applied again by a per-context request route, plus a redirect guard and a final-URL re-validation, which is what turns a refusal into the tool's clean policy message. </p>
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig = Browsing policy configuration
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig$Access = Access
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig$Access.tooltip = Whether something is permitted or refused.
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig$DownloadAccess = Download access
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig$DownloadAccess.tooltip = Whether a file download is permitted, or left to whatever the access setting says.
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig$OriginRule = Origin rule
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig$OriginRule.tooltip = What one policy says about one origin.
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig$Policy = Policy
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig$Policy.tooltip = One named browsing policy: what it permits by default, and the origins it treats differently.
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig$RolePolicy = Role policy
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig$RolePolicy.tooltip = Which policy one security role browses under.
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.Access.ALLOW = Allow
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.Access.ALLOW.tooltip = Permitted.
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.Access.DENY = Deny
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.Access.DENY.tooltip = Refused.
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.DownloadAccess.ALLOW = Allow
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.DownloadAccess.ALLOW.tooltip = Permitted, as long as the origin may be reached at all.
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.DownloadAccess.AS_ACCESS = As access
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.DownloadAccess.AS_ACCESS.tooltip = Whatever the access setting next to this one says: an origin that may be browsed may download. This is what an entry that does not mention downloads means.
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.DownloadAccess.DENY = Deny
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.DownloadAccess.DENY.tooltip = Refused: the origin may be read, but a file from it is never saved.
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.OriginRule.access = Access
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.OriginRule.access.tooltip = Whether this origin may be reached at all.
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.OriginRule.downloads = Downloads
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.OriginRule.downloads.tooltip = Whether a page at this origin may start a file download. <p> Left out, it follows the setting above: an origin this rule permits may download. An origin this rule refuses never downloads, whatever is written here. </p>
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.OriginRule.host = Host
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.OriginRule.host.tooltip = The host this rule is about. <p> docs.example.com is that host and no other. *.example.com is every sub-domain of example.com but not example.com itself - write both entries to cover a domain and everything under it. </p>
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.Policy.access = Access
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.Policy.access.tooltip = What happens at an origin no rule below names. <p> allow makes the rules exceptions that forbid; deny makes them the only origins this policy reaches. </p>
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.Policy.downloads = Downloads
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.Policy.downloads.tooltip = Whether a page may start a file download at an origin no rule below names. <p> Left out, it follows the setting above: an origin that may be browsed may download. Set it to refused for a policy that reads the web but never saves a file from it. </p>
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.Policy.name.tooltip = The name roles refer to this policy by.
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.Policy.origins = Origins
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.Policy.origins.tooltip = The origins this policy treats differently from the settings above.
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.RolePolicy.name.tooltip = The security role this entry is about.
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.RolePolicy.policy = Policy
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.RolePolicy.policy.tooltip = The policy this role browses under. A name no policy above declares is a boot error.
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.default = Default
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.default.tooltip = The policy that applies to a user holding none of the roles named below. <p> Leave it out and such a user browses every origin the SSRF check permits - which is what an application that configures nothing here has always done. Name a policy to make it the floor for everybody. </p>
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.policies = Policies
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.policies.tooltip = The policies this application knows, each under the name a role refers to.
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.roles = Roles
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.roles.tooltip = Which security role browses under which policy. <p> A user holding several of these roles is bound by <b>all</b> of their policies at once: an origin is reachable only if every one of them permits it. Holding one more role can therefore never widen what a user reaches. </p>
com.top_logic.tl.ai.core.tools.web.BrowsingPolicyConfig.tooltip = Which origins the agents of this application may browse, per security role. <p> Configure nothing and nothing changes: every origin that passes the SSRF check is reachable, as before. Name a policy and its holders reach exactly the origins that policy permits. </p> <p> This governs all three routes out of the application - the browser, webFetch and webSearch. It is the ceiling, so a domain list an agent passes to webSearch can only narrow it further, never widen it. </p>
