com.top_logic.factory.ci.CIRoute = CI route
com.top_logic.factory.ci.CIRoute.Config.max-log-size = Maximum log size
com.top_logic.factory.ci.CIRoute.Config.max-log-size.tooltip = The largest part of the console output of a build the route answers with, in bytes: of a longer output, only its last lines.
com.top_logic.factory.ci.CIRoute.tooltip = <i>Proxy route</i> of the workspace proxy through which the coding agent of a workspace builds the application of its project on the CI server, without a credential of the CI server in the workspace. <p> The route offers an API of its own, independent of the CI server, on the CI job of the project of the workspace the token of the request was issued for. Below the path of the route (by default <code>"/ci"</code>): </p> <ul> <li>POST /<code>"builds"</code> starts a build and answers with a JSON object: the job, the number of the build (null while it is queued) and its page.</li> <li>GET /<code>"builds"</code>/<code>"last"</code> answers with the last build as a JSON object: job, number, state (a <i>CI build state</i>), page, start time (ISO 8601), duration in milliseconds; 404 if the job has no build.</li> <li>GET of <code>"builds"</code>, the number of the build and <code>"log"</code>, separated by slashes, answers with the end of the console output of the build as plain text, at most <i>Maximum log size</i> bytes; an output that is cut starts with the line <code>"[... earlier output omitted ...]"</code>.</li> </ul> <p> Every other request - another path or method -, every request of a workspace whose project has no CI job, and every request while no CI server is configured is answered with 404. A failure of the CI server is answered with 502 and a fixed text; the details go to the log of the control application. The requests are authenticated with the token of the workspace like those of every route, see <code>"TL_FACTORY_PROXY_TOKEN"</code>. </p>
com.top_logic.factory.ci.CIService = CI service
com.top_logic.factory.ci.CIService.Config.pipeline-template = Pipeline template
com.top_logic.factory.ci.CIService.Config.pipeline-template.tooltip = The web application resource whose content a repository gets as its pipeline definition, the pipeline file, when the CI of its project is set up and the repository has none. <p> An application overrides the default by a resource of the same path in its own web application, or names another resource here. </p>
com.top_logic.factory.ci.CIService.Config.provider = Provider
com.top_logic.factory.ci.CIService.Config.provider.tooltip = The CI server the jobs of the projects run on. <p> If not set, CI is switched off; so it is with a provider whose base URL is empty, which is not created then. </p>
com.top_logic.factory.ci.CIService.tooltip = Service holding the <i>CI provider</i> of the CI server building the applications of the projects. <p> CI is optional: without a provider, or with one switched off by an empty base URL, the service is disabled, the projects have no CI job, and creating and working in a workspace does not involve a CI server. With a provider, a project gets its CI job when a user sets up its CI, see <i>project CI</i>. </p> <p> Starting the service does not contact the CI server, so the application starts also when it is not reachable; the first operation reports that. </p>
com.top_logic.factory.git.GitHostingService = Git hosting service
com.top_logic.factory.git.GitHostingService$BuiltInConnection = Built in connection
com.top_logic.factory.git.GitHostingService$BuiltInConnection.tooltip = A git connection of the installation, offered to every tenant. <p> It authenticates with the credentials of the installation. Every tenant gets its own organization on the server, created on first use and named by the owner and the tenant (see <code>GitConnections#tenantOwner(String, com.top_logic.model.TLObject)</code>), so that the tenants never see the repositories of each other. </p>
com.top_logic.factory.git.GitHostingService.BuiltInConnection.credentials = Credentials
com.top_logic.factory.git.GitHostingService.BuiltInConnection.credentials.tooltip = How the requests to the server are authenticated, if not with the access token in the token secret.
com.top_logic.factory.git.GitHostingService.BuiltInConnection.owner = Owner
com.top_logic.factory.git.GitHostingService.BuiltInConnection.owner.tooltip = The start of the names of the organizations of the tenants on the server.
com.top_logic.factory.git.GitHostingService.BuiltInConnection.provider-type = Provider type
