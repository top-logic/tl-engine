com.top_logic.security.selfservice.invitation.InvitationModule.Config.verification-code-size = Größe des Verifizierungscodes
com.top_logic.security.selfservice.invitation.InvitationModule.Config.verification-code-size.tooltip = Die Anzahl der Ziffern, die zur Erstellung eines Prüfcodes verwendet werden.
com.top_logic.security.selfservice.invitation.InvitationModule.Config.verification-mail = Überprüfungsmail
com.top_logic.security.selfservice.invitation.InvitationModule.Config.verification-mail.tooltip = Der TL-Script-Ausdruck, der die Verifizierungsmail versendet. <p> Der Ausdruck wird mit dem <i>Einladungsobjekt</i> als erstem Argument, dem Anwendungstitel als zweitem Argument und dem Verifizierungscode als drittem Argument aufgerufen. </p>
com.top_logic.security.selfservice.invitation.InvitationModule.tooltip = <i>Konfigurierte verwaltete Klasse</i> für Elemente in <code>"tl.security.selfservice"</code>.
