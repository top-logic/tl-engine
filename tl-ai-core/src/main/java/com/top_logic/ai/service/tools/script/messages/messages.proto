package com.top_logic.ai.service.tools.script.messages;

option NoBinary;
option NoVisit;
option NoListener;
option NoInterfaces;
option NoXml;

/**
 * Type of validation error.
 */
enum ErrorType {
	/** Syntax error (parser error). */
	SYNTAX_ERROR;

	/** Lexical error (invalid characters). */
	LEXICAL_ERROR;

	/** Validation error (model references, type checking). */
	VALIDATION_ERROR;
}

/**
 * Result of TLScript validation.
 */
message ValidationResult {
	/**
	 * Whether the TLScript is valid.
	 */
	bool valid;

	/**
	 * Message describing validation success.
	 */
	string `message`;

	/**
	 * Validation error details (only present if valid is false).
	 */
	ValidationError error;

	/**
	 * The parsed expression (only available if validation succeeded).
	 *
	 * <p>
	 * This property is transient and not serialized to JSON.
	 * </p>
	 */
	transient com.top_logic.model.search.expr.config.dom.Expr expr;
}

/**
 * Details about a validation error.
 */
message ValidationError {
	/**
	 * Type of validation error.
	 */
	ErrorType type;

	/**
	 * The error message.
	 */
	string `message`;

	/**
	 * Line number where the error occurred (0 if not applicable).
	 */
	int line;

	/**
	 * Column number where the error occurred (0 if not applicable).
	 */
	int column;
}
