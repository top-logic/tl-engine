com.top_logic.basic.config.constraint.annotation.MandatoryIf.asWarning = As warning
com.top_logic.basic.config.constraint.annotation.MandatoryIf.asWarning.tooltip = Whether a potential constraint violation should be treated as warning (instead of as error).
com.top_logic.basic.config.constraint.annotation.MandatoryIf.other = Other
com.top_logic.basic.config.constraint.annotation.MandatoryIf.other.tooltip = Reference to the property whose value decides whether the annotated property must be set.
com.top_logic.basic.config.constraint.annotation.MandatoryIf.tooltip = Declares that the annotated property must be set as soon as another property has a certain value. <p> For a property that is required by one setting and meaningless under another: the bounds of a value that is displayed as a slider are needed exactly while the display is the slider, and are left out for a display that has no bounds to draw. </p> <p> The required value is the value as it is written in a configuration - the external name of an enumeration literal, true for a boolean - so that the annotation names the value the same way the configuration it guards does. It is compared with the value the other property effectively has, its default included, so a property left at a default that demands the annotated one is reported just as an explicitly written value is. </p>
com.top_logic.basic.config.constraint.annotation.MandatoryIf.value = Value
com.top_logic.basic.config.constraint.annotation.MandatoryIf.value.tooltip = The value of the other property that makes the annotated property mandatory, written as it would be in a configuration.
