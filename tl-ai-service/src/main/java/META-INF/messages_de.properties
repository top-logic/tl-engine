com.top_logic.ai.service.providers.MistralChatModelFactory.Config.base-url = Basis-URL
com.top_logic.ai.service.providers.MistralChatModelFactory.Config.base-url.tooltip = Die Basis-URL fï¿½r die Mistral AI API. <p> Standard: https://api.mistral.ai/v1 </p>
com.top_logic.ai.service.providers.MistralChatModelFactory.tooltip = Fabrik zur Erstellung von Mistral AI Chat-Modell-Instanzen. <p> Diese Fabrik erstellt <i>Chat-Modell-Instanzen</i> unter Verwendung der Mistral AI API fï¿½r Modelle wie Mistral Large, Mistral Medium, etc. </p>
com.top_logic.ai.service.providers.OpenAIChatModelFactory = OpenAI Chat-Modellfabrik
com.top_logic.ai.service.providers.OpenAIChatModelFactory.Config.api-key = API-Schlï¿½ssel
com.top_logic.ai.service.providers.OpenAIChatModelFactory.Config.api-key.tooltip = Der <i>OpenAI-API-Schlï¿½ssel</i> fï¿½r die Authentifizierung.
com.top_logic.ai.service.providers.OpenAIChatModelFactory.Config.base-url = Basis-URL
com.top_logic.ai.service.providers.OpenAIChatModelFactory.Config.base-url.tooltip = Die Basis-URL fï¿½r die <i>OpenAI-API</i>. <p> Standard: https://api.openai.com/v1 </p> <p> Sie kï¿½nnen diesen Wert ï¿½berschreiben, um einen anderen Endpunkt zu verwenden, z. B. einen Azure <i>OpenAI-Einsatz</i> oder einen lokalen Proxy-Server. </p>
com.top_logic.ai.service.providers.OpenAIChatModelFactory.Config.organization = Organisation
com.top_logic.ai.service.providers.OpenAIChatModelFactory.Config.organization.tooltip = Die <i>OpenAI-Organisations-ID</i>. <p> Optional. Fï¿½r Benutzer, die mehreren Organisationen angehï¿½ren, kï¿½nnen Sie angeben, welche Organisation fï¿½r eine API-Anfrage verwendet wird. </p>
com.top_logic.ai.service.providers.OpenAIChatModelFactory.tooltip = Fabrik zur Erstellung von <i>OpenAI-Chatmodell-Instanzen</i>. <p> Diese Fabrik erstellt <i>Chatmodell-Instanzen</i> unter Verwendung der <i>OpenAI-API</i> (oder kompatibler APIs wie Azure <i>OpenAI</i>). </p>
com.top_logic.ai.service.scripting.Converters.htmlToMarkdown = HTML zu Markdown
com.top_logic.ai.service.scripting.Converters.htmlToMarkdown.param.html.tooltip = Text im HTML-Format.
com.top_logic.ai.service.scripting.Converters.htmlToMarkdown.return = Markdown-formatierter Text.
