com.top_logic.oauth.server.ClientMetadataFetcher.fetch = Abrufen
com.top_logic.oauth.server.ClientMetadataFetcher.fetch.param.documentUrl.tooltip = Die Client-ID, eine <code>https</code>-URL.
com.top_logic.oauth.server.ClientMetadataFetcher.fetch.return = Das Dokument als Text, erwartet wird ein JSON-Objekt.
com.top_logic.oauth.server.ClientMetadataFetcher.fetch.tooltip = Der Inhalt des Dokuments unter documentUrl.
com.top_logic.oauth.server.HttpClientMetadataFetcher = HTTP-Abruf der Client-Metadaten
com.top_logic.oauth.server.HttpClientMetadataFetcher.Config.allow-private-network = Privates Netz erlauben
com.top_logic.oauth.server.HttpClientMetadataFetcher.Config.allow-private-network.tooltip = Ob ein Dokument von einem Host in einem privaten Netz abgerufen werden darf, die Loopback-Schnittstelle eingeschlossen. <p> Standardmäßig aus: Eine Client-ID wählt, wer eine Autorisierungsanfrage sendet, und mit dieser Option kann er die Anwendung Anfragen in ihr eigenes Netz senden lassen. </p>
com.top_logic.oauth.server.HttpClientMetadataFetcher.Config.max-size = Maximale Größe
com.top_logic.oauth.server.HttpClientMetadataFetcher.Config.max-size.tooltip = Das größte Dokument in Bytes, das angenommen wird.
com.top_logic.oauth.server.HttpClientMetadataFetcher.Config.timeout = Zeitlimit
com.top_logic.oauth.server.HttpClientMetadataFetcher.Config.timeout.tooltip = Wie lange Verbindungsaufbau und Lesen des Dokuments insgesamt dauern dürfen. <p> Der Verbindungsaufbau und jedes Lesen sind auf diese Zeit begrenzt; ein Dokument, das nach ihrem Ablauf nicht vollständig angekommen ist, wird aufgegeben. </p>
com.top_logic.oauth.server.HttpClientMetadataFetcher.tooltip = <i>Abruf der Client-Metadaten</i> über ein HTTP-<code>GET</code>. <p> Die URL stammt aus einer nicht authentifizierten Anfrage, ihr Abruf lässt also jeden die Anwendung eine Anfrage senden. Dieser Abruf daher: </p> <ul> <li>verbindet sich nur mit Adressen des öffentlichen Internets, außer <i>Privates Netz erlauben</i> ist gesetzt: Der Host wird einmal aufgelöst, abgewiesen, wenn eine seiner Adressen eine Loopback-, Link-Local-, private oder andere nicht öffentliche Adresse ist, und die Verbindung geht genau an die geprüften Adressen,</li> <li>folgt keiner Weiterleitung und verwendet keinen Proxy,</li> <li>gibt nach dem <i>Zeitlimit</i> auf,</li> <li>liest höchstens <i>Maximale Größe</i> Bytes.</li> </ul>
com.top_logic.oauth.server.OAuthAccessTokenAuthentication = OAuth-Access-Token dieser Anwendung
com.top_logic.oauth.server.OAuthAccessTokenAuthentication.Config.resource = Ressource
com.top_logic.oauth.server.OAuthAccessTokenAuthentication.Config.resource.tooltip = Die Ressource (RFC 8707), die der geschützte Endpunkt ist und für die ein Token ausgestellt sein muss. <p> Entweder eine absolute URI oder ein Pfad relativ zum Kontextpfad der Anwendung, der mit einem Schrägstrich beginnt, z. B. <code>/mcp</code>; er wird gegen die Anwendungs-URL aufgelöst, unter der die Anfrage sie erreicht. </p>
com.top_logic.oauth.server.OAuthAccessTokenAuthentication.Config.separate-secret-needed.tooltip = Nie: Die Tokens stellt die Anwendung selbst aus, sie werden nicht konfiguriert.
com.top_logic.oauth.server.OAuthAccessTokenAuthentication.tooltip = Authentifiziert einen Aufrufer anhand eines Zugriffstokens des anwendungsinternen <i>OAuth-Autorisierungsservers</i>, das im Header <code>Authorization: Bearer</code> gesendet wird. <p> Die Anfrage tritt an die Stelle der Person, die den Client autorisiert hat. Eine Sperre wird nur bei der Ressource akzeptiert, für die sie ausgestellt wurde, sodass eine Sperre, die ein Client für einen Endpunkt erhalten hat, nicht an einem anderen Endpunkt wiederverwendet werden kann. Siehe den Entwicklerartikel <code>oauth-server</code>. </p> <p> Ein Client benötigt keine konfigurierten Anmeldedaten: Bei einer Ablehnung werden die Metadaten der geschützten Ressourcen des Endpunkts (<i>geschützte Ressourcen</i>) genannt, woraus der Client den Autorisierungsserver ermittelt und die Person anmeldet. </p>
com.top_logic.oauth.server.OAuthAuthorizationServer = OAuth-Autorisierungsserver
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.abandoned-client-lifetime = Aufbewahrung verlassener Clients
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.abandoned-client-lifetime.tooltip = Wie lange ein dynamisch registrierter Client ohne verbleibende Autorisierung nach seiner letzten Verwendung (Autorisierung oder Erneuerung eines Tokens) aufbewahrt wird. <p> Eine Autorisierung endet, wenn sie widerrufen wird oder ihr letztes Refresh-Token abläuft, siehe <i>Gültigkeit des Refresh-Tokens</i>. </p>
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.access-token-lifetime = Gültigkeit des Access-Tokens
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.access-token-lifetime.tooltip = Wie lange ein Access-Token nach seiner Ausstellung angenommen wird.
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.authorization-code-lifetime = Gültigkeit des Autorisierungscodes
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.authorization-code-lifetime.tooltip = Wie lange ein Autorisierungscode nach seiner Ausstellung eingetauscht werden kann.
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.client-id-metadata-documents = Client-ID-Metadatendokumente
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.client-id-metadata-documents.tooltip = Ob sich Clients mit der <code>https</code>-URL eines Client-ID-Metadatendokuments ausweisen dürfen, das der <i>Abruf der Client-Metadaten</i> holt.
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.client-metadata-cache-lifetime = Gültigkeit abgerufener Client-Metadaten
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.client-metadata-cache-lifetime.tooltip = Wie lange ein abgerufenes Client-ID-Metadatendokument verwendet wird, bevor es erneut abgerufen wird.
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.client-metadata-cache-size = Anzahl gespeicherter Client-Metadaten
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.client-metadata-cache-size.tooltip = Die Zahl der Client-ID-Metadatendokumente, die im Speicher gehalten werden.
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.client-metadata-fetcher = Abruf der Client-Metadaten
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.client-metadata-fetcher.tooltip = Wie ein Client-ID-Metadatendokument abgerufen wird.
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.consent-page = Zustimmungsseite
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.consent-page.tooltip = Die Seite, auf der eine Person über eine Autorisierungsanfrage entscheidet, als Pfad relativ zum Kontextpfad der Anwendung, z. B. <code>/view/oauth-consent.view.xml</code>. <p> Der Autorisierungs-Endpunkt leitet den Browser dorthin weiter, wobei die Kennung der ausstehenden Autorisierung im Abfrageparameter <code>"pending"</code> enthalten ist. Die Seite wird vom Modul der Benutzeroberfläche bereitgestellt (<code>tl-oauth-server-view</code> für die React-Benutzeroberfläche); fehlt ein solches Modul, gibt der Autorisierungs-Endpunkt die Antwort <code>404</code> zurück. </p>
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.dynamic-client-registration = Dynamische Client-Registrierung
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.dynamic-client-registration.tooltip = Ob sich Clients am Endpunkt <code>"/oauth/register"</code> selbst registrieren dürfen (RFC 7591). <p> Ausgeschaltet antwortet der Endpunkt mit <code>404</code>, und die Metadaten nennen keinen Registrierungsendpunkt. Zuvor registrierte Clients bleiben nutzbar. </p>
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.max-registered-clients = Maximale Zahl registrierter Clients
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.max-registered-clients.tooltip = Die Zahl dynamisch registrierter Clients, ab der kein weiterer Client registriert wird. <p> Die Registrierung braucht keine Authentifizierung; dies begrenzt also, was ein anonymer Aufrufer speichern kann. Zusammen mit dem Aufräumen von Clients, die niemand autorisiert hat (<i>Aufbewahrung ungenutzter Clients</i>), macht es aus einer Flut von Registrierungen eine vorübergehende Ablehnung neuer Clients. </p>
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.pending-authorization-lifetime = Lebensdauer ausstehender Autorisierungen
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.pending-authorization-lifetime.tooltip = Wie lange eine Person Zeit hat, über eine Autorisierungsanfrage zu entscheiden, die Anmeldung eingeschlossen.
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.refresh-token-lifetime = Gültigkeit des Refresh-Tokens
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.refresh-token-lifetime.tooltip = Wie lange ein Refresh-Token nach seiner Ausstellung eingetauscht werden kann. <p> Jeder Tausch stellt ein neues Refresh-Token mit dieser Gültigkeit aus; ein Client, der innerhalb dieses Zeitraums mindestens einmal verwendet wird, bleibt also angemeldet. </p>
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.unused-client-lifetime = Aufbewahrung ungenutzter Clients
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.unused-client-lifetime.tooltip = Wie lange ein dynamisch registrierter Client, der nie autorisiert wurde, nach seiner Registrierung aufbewahrt wird. <p> Ein Client registriert sich unmittelbar bevor er eine Person um Autorisierung bittet; ein Client, den in dieser Zeit niemand autorisiert hat, ist also verlassen. </p>
com.top_logic.oauth.server.OAuthAuthorizationServer.tooltip = Der OAuth-2.1-Autorisierungsserver der Anwendung. <p> Stellt öffentlichen Clients Access-Tokens für die eigenen Endpunkte der Anwendung (MCP, A2A, REST-Dienste) aus, nach dem Autorisierungsprofil des Model Context Protocol: </p> <ul> <li>Authorization-Code-Grant mit PKCE, nur Methode <code>S256</code> (RFC 7636).</li> <li>Tokens, die an eine Ressource der Anwendung gebunden sind (RFC 8707).</li> <li>Rotierende Refresh-Tokens: Ein eingetauschtes Refresh-Token ist ungültig, und wird es erneut vorgelegt, ist die ganze Autorisierung widerrufen.</li> <li>Clients, die sich über die URL eines Client-ID-Metadatendokuments ausweisen oder dynamisch registriert sind (RFC 7591).</li> <li>Metadaten des Autorisierungsservers (RFC 8414).</li> </ul> <p> Tokens und Codes sind zufällige Zeichenketten ohne Bedeutung, siehe <i>Secret Tokens</i>; gespeichert wird nur ihr SHA-256. Die HTTP-Endpunkte bedient das <i>OAuth-Server-Servlet</i>; Access-Tokens nimmt das <i>OAuth-Access-Token dieser Anwendung</i> an. </p>
com.top_logic.oauth.server.OAuthCleanUpTask = OAuth-Autorisierungen bereinigen
com.top_logic.oauth.server.OAuthCleanUpTask.tooltip = Scheduler-Task, der abgelaufene Autorisierungscodes und Tokens, nicht mehr verwendbare Autorisierungen und dynamisch registrierte Clients, die niemand verwendet, entfernt. <p> Tut nichts, solange der <i>OAuth-Autorisierungsserver</i> nicht aktiv ist. </p>
com.top_logic.oauth.server.OAuthFunctions.approve = OAuth-Autorisierungsanfrage zulassen
com.top_logic.oauth.server.OAuthFunctions.approve.param.pending.tooltip = Die Kennung der ausstehenden Autorisierung.
com.top_logic.oauth.server.OAuthFunctions.approve.return = Die Adresse, an die der Browser weitergeleitet werden soll: die Weiterleitungs-URI des Clients mit dem Code und dem Status des Clients.
com.top_logic.oauth.server.OAuthFunctions.approve.tooltip = Der aktuelle Benutzer stimmt einer ausstehenden Autorisierung zu. <p> Stellt den Autorisierungscode für den Client aus und beendet die ausstehende Autorisierung; eine zweite Entscheidung darüber wird abgelehnt. </p>
com.top_logic.oauth.server.OAuthFunctions.deny = OAuth-Autorisierungsanfrage ablehnen
com.top_logic.oauth.server.OAuthFunctions.deny.param.pending.tooltip = Die Kennung der ausstehenden Autorisierung.
com.top_logic.oauth.server.OAuthFunctions.deny.return = Die Adresse, an die der Browser weitergeleitet werden soll: die Weiterleitungs-URI des Clients mit dem Fehlercode <code>access_denied</code> und dem Status des Clients.
com.top_logic.oauth.server.OAuthFunctions.deny.tooltip = Der aktuelle Benutzer lehnt eine ausstehende Autorisierung ab.
com.top_logic.oauth.server.OAuthFunctions.refusal = Ablehnung einer OAuth-Autorisierungsanfrage
com.top_logic.oauth.server.OAuthFunctions.refusal.param.pending.tooltip = Die Kennung der ausstehenden Autorisierung.
com.top_logic.oauth.server.OAuthFunctions.refusal.return = Die Meldung, dass es eine solche Anfrage nicht gibt – sie hat nie existiert oder wurde bereits beantwortet – oder dass sie abgelaufen ist; <code>null</code>, wenn die Person entscheiden kann.
com.top_logic.oauth.server.OAuthFunctions.refusal.tooltip = Der Grund, warum die Person nicht über eine ausstehende Autorisierung entscheiden kann.
com.top_logic.oauth.server.OAuthFunctions.request = OAuth-Autorisierungsanfrage
com.top_logic.oauth.server.OAuthFunctions.request.param.pending.tooltip = Die Kennung der ausstehenden Autorisierung.
com.top_logic.oauth.server.OAuthFunctions.request.return = Ein Wörterbuch mit dem Namen des Clients (<code>"client"</code>), seiner Client-ID (<code>"clientId"</code>), dem Host seines Metadaten-Dokuments zur Client-ID (<code>"clientHost"</code>, leer bei einem registrierten Client), der Umleitungs-URI (<code>"redirectUri"</code>) und deren Host (<code>"redirectHost"</code>), dem Endpunkt, den der Client aufrufen möchte (<code>"resource"</code>), sowie dem angeforderten Geltungsbereich (<code>"scope"</code>); <code>null</code>, wenn die Person keine Entscheidung treffen kann – siehe <i>Ablehnung einer OAuth-Autorisierungsanfrage</i>.
com.top_logic.oauth.server.OAuthFunctions.request.tooltip = Was eine ausstehende Autorisierung anfragt, zur Anzeige auf der Zustimmungsseite.
com.top_logic.oauth.server.OAuthFunctions.revoke = OAuth-Autorisierung widerrufen
com.top_logic.oauth.server.OAuthFunctions.revoke.param.grant.tooltip = Die Autorisierung (<i>O auth grant</i>) oder eine Auflistung, die genau eine davon enthält.
com.top_logic.oauth.server.OAuthFunctions.revoke.return = Immer <code>true</code>.
com.top_logic.oauth.server.OAuthFunctions.revoke.tooltip = Widerruft die Berechtigung, die eine Person einem Client erteilt hat: Dessen Zugriffs- und Aktualisierungstoken werden ab sofort abgelehnt.
