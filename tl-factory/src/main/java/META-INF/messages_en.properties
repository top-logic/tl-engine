com.top_logic.factory.git.GitHostingService.BuiltInConnection.url = URL
com.top_logic.factory.git.GitHostingService.BuiltInConnection.url.tooltip = The URL of the server, e.g. https://git.example.com/; empty switches the connection off, it is then offered to no tenant.
com.top_logic.factory.git.GitHostingService.Config.connections = Connections
com.top_logic.factory.git.GitHostingService.Config.connections.tooltip = The built-in connections offered to every tenant, by their name.
com.top_logic.factory.git.GitHostingService.Config.protected-files = Protected files
com.top_logic.factory.git.GitHostingService.Config.protected-files.tooltip = Glob patterns of the files of a project repository that no push may change, e.g. the build pipeline and the deployment of the application. <p> The default branch of every repository of a project is protected with these patterns when a workspace of the project has the sources in it and the credentials of its connection may administer the repository: a change of such a file reaches the branch only through a reviewed pull request, neither the agent nor the control application pushes one. Patterns are relative to the root of the repository, * matches within a path segment, ** across segments. </p> <p> The pipeline file of the CI server is protected in addition for a project whose CI is set up, and not before, even if it is listed here: setting up the CI commits it. </p>
com.top_logic.factory.git.GitHostingService.Config.provider-types = Provider types
com.top_logic.factory.git.GitHostingService.Config.provider-types.tooltip = The kinds of hosting services a git connection may name, by their name.
com.top_logic.factory.git.GitHostingService.tooltip = Service holding the kinds of git hosting services the control application works with, the built-in git connections of the installation, and the <i>git hosting provider</i> of each git connection in use. <p> A git connection is a server of a registered type, an owner on it the repositories live in, and credentials. The model holds the connections a project chooses from (see <i>git connections</i>); this service knows how to reach them: </p> <ul> <li>A module supporting a kind of hosting service registers its <i>git provider type</i> in <i>Provider types</i>, e.g. Gitea by the module tl-factory-gitea.</li> <li>The installation offers its built-in connections to all tenants. They authenticate with the credentials of the installation, and every tenant gets an organization of its own below the configured owner.</li> <li><code>#provider(GitConnectionKey)</code> hands out one provider per connection, created for the settings of the connection and kept until they change.</li> </ul> <p> Without provider types, or without a switched-on built-in connection and connections of the tenants, the projects have no repository on a hosting service. </p> <p> Starting the service does not contact a hosting service, so the application starts also when one is not reachable; the first operation reports that. </p>
com.top_logic.factory.git.GitRoute = Git route
com.top_logic.factory.git.GitRoute.Config.connect-timeout = Connect timeout
com.top_logic.factory.git.GitRoute.Config.connect-timeout.tooltip = How long connecting to the hosting service may take.
com.top_logic.factory.git.GitRoute.Config.response-timeout = Response timeout
com.top_logic.factory.git.GitRoute.Config.response-timeout.tooltip = How long the hosting service may take until the status of its answer, from the start of the request. <p> The hosting service answers a push only after it has received all of it, so this time includes the transfer of the largest push. </p>
com.top_logic.factory.git.GitRoute.Config.user-email = User email
com.top_logic.factory.git.GitRoute.Config.user-email.tooltip = The author and committer e-mail address of the commits made in a workspace; empty for none.
com.top_logic.factory.git.GitRoute.Config.user-name = User name
com.top_logic.factory.git.GitRoute.Config.user-name.tooltip = The author and committer name of the commits made in a workspace, by the agent and by the control application; empty for none. <p> Every git process in a workspace that gets the git configuration of the route has it as <code>"user.name"</code>, which takes precedence over the configuration files of the workspace. </p>
com.top_logic.factory.git.GitRoute.tooltip = <i>Proxy route</i> of the workspace proxy to the repository of the project of a workspace on the git hosting service of its git connection, without a credential of the hosting service in the workspace. <p> The route passes git's smart HTTP protocol through to the <i>git hosting provider</i>, unchanged and streamed in both directions. Below the path of the route (by default <code>"/git"</code>), a repository is addressed as /<owner>/<name>.git - the <code>".git"</code> may be missing -, and only the requests of the protocol are forwarded: </p> <ul> <li>GET of <code>"info/refs"</code> with the query <code>"service"</code>= <code>"git-upload-pack"</code> (fetch, clone) or <code>"git-receive-pack"</code> (push),</li> <li>POST of <code>"git-upload-pack"</code> and <code>"git-receive-pack"</code>.</li> </ul> <p> The repository must be the one of the project of the workspace the token of the request was issued for, compared without regard to case; the request goes to the provider of the git connection of the project (see <code>#workspaceTarget(String)</code>). Every other request - another path or method, the repository of another project, a workspace without repository or whose project has no available git connection - is answered with 404, not telling whether a repository exists. </p> <p> Of the request, only the headers of git's protocol are forwarded - <code>"Content-Type"</code>, <code>"Content-Encoding"</code> of a compressed request, <code>"Git-Protocol"</code> for protocol version 2, <code>"Accept"</code>, <code>"Accept-Encoding"</code>, <code>"Accept-Language"</code>, <code>"User-Agent"</code> -, never the token of the client, cookies, or headers the hosting service might trust from the address of the control application (e.g. the user header of an authenticating reverse proxy). The request is authenticated with the credentials of the git connection. Status, headers and body of the answer are passed back as they come, except cookies and hop-by-hop headers. </p> <p> If the hosting service rejects the credentials (401), they are invalidated; a <code>"info/refs"</code> request, which has no body, is repeated once with fresh ones. A request with body cannot be repeated - the body is streamed to the hosting service as it arrives and is gone -, it is answered with 502. Since git always starts with <code>"info/refs"</code>, rotated credentials are picked up there. </p> <p> A request without valid token is answered with 401 and <code>"WWW-Authenticate"</code> for basic authentication: git sends its first request without credentials and asks its credential helper only after such a challenge. The token is accepted as password of basic authentication (see <i>workspace proxy handler</i>); a process in a workspace gets the credential helper answering with it. </p>
com.top_logic.factory.llm.LLMRoute = LLM route
com.top_logic.factory.llm.LLMRoute.Config.provider = Provider
com.top_logic.factory.llm.LLMRoute.Config.provider.tooltip = The name of the Anthropic provider of the <i>LLM providers</i> whose API key, base URL, version and timeouts the route uses.
com.top_logic.factory.llm.LLMRoute.tooltip = <i>Proxy route</i> of the workspace proxy to the Anthropic Messages API, without an API key in the workspace. <p> A workspace container gets the URL of the route in <code>"ANTHROPIC_BASE_URL"</code>, a process the token of the proxy in <code>"ANTHROPIC_AUTH_TOKEN"</code>; Claude Code sends it as bearer token. </p> <p> Only POST of <code>"/v1/messages"</code> and <code>"/v1/messages/count_tokens"</code> (below the path of the route, by default <code>"/llm-proxy"</code>) is forwarded, with the query string; everything else is answered with 404. The refusals of the proxy are answered as errors of the Anthropic API, e.g. <code>"authentication_error"</code> for an invalid token. </p> <p> The forwarded request carries the headers of the client except the credentials (<code>"Authorization"</code>, <code>"x-api-key"</code>), cookies, Host, the hop-by-hop headers and <code>"accept-encoding"</code>, so that the answer comes uncompressed and can be streamed. The body is streamed to the API as it arrives. The route adds the credentials of the <i>LLM upstream</i> - the provider's API key in <code>"x-api-key"</code> -, and sets <code>"anthropic-version"</code> to its version if the client sent none; a client's <code>"anthropic-version"</code> and anthropic-beta are kept. Status, headers and body of the answer are passed back, the body flushed piece by piece as it arrives, so that a server-sent event stream reaches the client while it is produced. </p> <p> The API key appears neither in a log nor in an answer of the route. </p>
