class.com.top_logic.security.captcha.I18NConstants.ERROR_CAPTCHA_INVALID = Die Sicherheitsprüfung wurde nicht abgeschlossen oder ist abgelaufen. Bitte bestätigen Sie sie erneut.
com.top_logic.security.captcha.CaptchaService = Captcha-Dienst
com.top_logic.security.captcha.CaptchaService.Config.cost = Aufwand
com.top_logic.security.captcha.CaptchaService.Config.cost.tooltip = Der Aufwand eines Versuchs, eine Aufgabe zu lösen: die Anzahl der Iterationen der Schlüsselableitungsfunktion. <p> Der Aufwand einer Aufgabe ist dieser Wert mal die Anzahl der Versuche (siehe <i>Maximale Anzahl</i>). Der Standardwert 1000 mit der Standard-Höchstzahl 6000 ergibt 3 bis 6 Millionen Iterationen von PBKDF2/SHA-256, die ein aktueller Desktop-Browser in etwa einer Sekunde berechnet (gemessen: 0,7 s für 3,75 Millionen Iterationen in Chrome auf einem Desktop-Rechner), ein langsameres Gerät in wenigen Sekunden. Die ALTCHA-Beispiele verwenden 5000 und 10000, wofür derselbe Browser 6 bis 7 Sekunden brauchte. </p>
com.top_logic.security.captcha.CaptchaService.Config.expires = Gültigkeit
com.top_logic.security.captcha.CaptchaService.Config.expires.tooltip = Wie lange eine erstellte Aufgabe gelöst und abgeschickt werden kann.
com.top_logic.security.captcha.CaptchaService.Config.hmac-key = HMAC-Schlüssel
com.top_logic.security.captcha.CaptchaService.Config.hmac-key.tooltip = Der geheime Schlüssel, mit dem die Aufgaben signiert werden. <p> Empfohlen ist ein Verweis auf den Schlüssel über seinen Geheimnis-Namen, z. B. <code>&lt;hmac-key name="tl_captcha_hmac_key"/&gt;</code>. Ein Attributwert ist ein verschlüsselter Schlüssel oder ein unverschlüsselter Schlüssel mit dem Präfix <code>unencrypted:</code>. Der Schlüssel wird bei jedem Erstellen und Prüfen einer Aufgabe gelesen; ändert er sich, werden die zuvor erstellten Aufgaben ungültig. </p> <p> Leer: Der Dienst erzeugt beim Start einen zufälligen Schlüssel und protokolliert eine Warnung, wenn der Schlüssel zum ersten Mal verwendet wird. Eine Aufgabe wird dann nur von dem Knoten akzeptiert, der sie erstellt hat, und nur bis zu dessen Neustart. Eine Produktivinstallation, zumindest eine mit mehreren Knoten, konfiguriert den Schlüssel. </p>
com.top_logic.security.captcha.CaptchaService.Config.max-number = Maximale Anzahl
com.top_logic.security.captcha.CaptchaService.Config.max-number.tooltip = Die maximale Anzahl an Versuchen, die der Browser zum Lösen einer Aufgabe braucht. <p> Die Anzahl der Versuche jeder Aufgabe wird zufällig aus der oberen Hälfte dieses Wertes gezogen. Zusammen mit dem Aufwand eines Versuchs bestimmt sie, wie lange ein Browser rechnet, standardmäßig etwa eine Sekunde. </p>
com.top_logic.security.captcha.CaptchaService.tooltip = Proof-of-Work-Captcha (ALTCHA), das ein Formular schützt, das ein anonymer Besucher absendet. <p> Der Dienst erstellt signierte Aufgaben für das ALTCHA-Widget im Browser. Das Widget löst die Aufgabe durch Berechnung, ohne Zutun des Besuchers, und übermittelt seine Lösung mit dem Formular. Der Dienst akzeptiert eine Lösung nur, wenn sie eine vom Dienst signierte Aufgabe löst, die Aufgabe nicht abgelaufen ist und die Lösung nicht schon zuvor akzeptiert wurde. Es ist kein externer Dienst beteiligt. </p> <p> Die Aufgaben werden mit dem Schlüssel der Installation signiert. Ohne einen solchen signiert der Dienst mit einem zufälligen Schlüssel, den er beim Start erzeugt: Eine Aufgabe wird dann nur von dem Knoten akzeptiert, der sie erstellt hat, und nur bis zu dessen Neustart. </p> <p> Die Schwierigkeit ist der Aufwand eines Versuchs mal die Anzahl der Versuche, die für jede Aufgabe aus der oberen Hälfte der maximalen Anzahl gezogen wird. Mit den Standardwerten (Aufwand 1000, maximale Anzahl 6000) löst ein Desktop-Browser eine Aufgabe in etwa einer Sekunde: genug, um massenhafte Übermittlungen teuer zu machen, kurz genug, um einen Besucher nicht warten zu lassen. Eine Aufgabe ist für die unter <i>Gültigkeit</i> angegebene Zeit gültig. </p>
