com.top_logic.presentation.script.PptTemplateFunctions.analyze = Analyze presentation template
com.top_logic.presentation.script.PptTemplateFunctions.analyze.param.template.tooltip = The PowerPoint file (<code>.pptx</code> or <code>.potx</code>) to analyze.
com.top_logic.presentation.script.PptTemplateFunctions.analyze.return = The dictionary describing the template.
com.top_logic.presentation.script.PptTemplateFunctions.analyze.tooltip = Describes the structure and the style of a PowerPoint presentation or template. <p> The result tells which slide layouts a template offers, where their placeholders are and how their texts look, and which colors, fonts and shape styles the template uses. It consists of dictionaries, lists, texts, numbers and truth values only, so it can be converted to JSON. Entries without a value are left out. All lengths are given in points, colors as six hexadecimal digits <code>RRGGBB</code>. </p> <p> The result is a dictionary with the following entries: </p> <ul> <li><code>"slideSize"</code>: The width and height of a slide.</li> <li><code>"masters"</code>: The slide masters with their theme (theme colors and fonts), their background, their placeholders and their other shapes such as logos.</li> <li><code>"layouts"</code>: The slide layouts of all masters in the order PowerPoint shows them. Each layout has its position in this list, its name, its predefined type (e.g. <code>TITLE</code>, if it is no custom layout), its master, its background, its placeholders and its other shapes. A placeholder is described by its type (e.g. <code>title</code>, <code>body</code>), its index, its effective position and size, the style of its text and its prompt text.</li> <li><code>"slides"</code>: The slides of the presentation with their layout and their shapes. A shape is described by its kind, name, position and size, geometry, fill, outline, shadow and text. Shapes of a group are listed as its children.</li> </ul> <p> A color taken from the theme names the theme color it refers to together with the modifications applied to it (e.g. brightness or transparency), so that a shape can be created that follows the template's color scheme. </p>
com.top_logic.presentation.script.PptTextFunctions.measureText = Measure text on a slide
com.top_logic.presentation.script.PptTextFunctions.measureText.param.bold.tooltip = Whether the text is set in bold face.
com.top_logic.presentation.script.PptTextFunctions.measureText.param.font.tooltip = The name of the font family, e.g. <code>Arial</code>.
com.top_logic.presentation.script.PptTextFunctions.measureText.param.italic.tooltip = Whether the text is set in italics.
com.top_logic.presentation.script.PptTextFunctions.measureText.param.size.tooltip = The font size in points.
com.top_logic.presentation.script.PptTextFunctions.measureText.param.text.tooltip = The text to measure.
com.top_logic.presentation.script.PptTextFunctions.measureText.param.width.tooltip = The width in points available for the text. If not given, the text is not wrapped.
com.top_logic.presentation.script.PptTextFunctions.measureText.return = The dictionary describing the extent of the text.
com.top_logic.presentation.script.PptTextFunctions.measureText.tooltip = Measures the space a text takes on a PowerPoint slide. <p> The text is laid out exactly like in a text box without inner margins that is rendered into an image. Each line break in the text starts a new paragraph. If a width is given, the text is wrapped at word boundaries to fit this width, otherwise only at its line breaks. </p> <p> The result is a dictionary with the following entries: </p> <ul> <li><code>"width"</code>: The width of the widest line in points.</li> <li><code>"lines"</code>: The number of lines after wrapping.</li> <li><code>"height"</code>: The height of the text in points. A text box needs this height plus its inner top and bottom margins to show the whole text.</li> <li><code>"lineHeight"</code>: The distance between two lines in points.</li> <li><code>"fontAvailable"</code>: Whether the font is installed on the server. A font that is not installed is replaced by a standard font, so the measurement does not match the text shown by PowerPoint on a computer having the font.</li> </ul>
