com.top_logic.layout.configedit.ConfigControlService$FormatMapping = Format mapping
com.top_logic.layout.configedit.ConfigControlService$FormatMapping.tooltip = A single value-provider-to-provider mapping entry.
com.top_logic.layout.configedit.ConfigControlService$ProviderMapping = Provider mapping
com.top_logic.layout.configedit.ConfigControlService$ProviderMapping.tooltip = A single value-type-to-provider mapping entry.
com.top_logic.layout.configedit.ConfigControlService.AnnotationControlMapping.annotation = Annotation
com.top_logic.layout.configedit.ConfigControlService.AnnotationControlMapping.annotation.tooltip = The annotation type a property must carry for this entry to apply. <p> Only an annotation marked with <i>control annotation</i> can be given. </p>
com.top_logic.layout.configedit.ConfigControlService.AnnotationControlMapping.impl = Implementation
com.top_logic.layout.configedit.ConfigControlService.AnnotationControlMapping.impl.tooltip = The <i>configuration annotation control provider</i> that creates the control for a property with the annotation. <p> The provider must accept the annotation type of this entry. </p>
com.top_logic.layout.configedit.ConfigControlService.Config.annotation-controls = Annotation controls
com.top_logic.layout.configedit.ConfigControlService.Config.annotation-controls.tooltip = Controls chosen by an annotation of the edited property. <p> A property that carries one of the configured annotations, on the property itself or on its value type, is edited with the control the annotation's <i>configuration annotation control provider</i> creates. If a property carries several of the configured annotations, the first entry in this list whose annotation is present and whose provider creates a control wins. </p> <p> A control chosen here takes precedence over every other mapping of this service and over a select. Only an encrypted property is never edited with a control chosen here. A provider declines a property whose value it cannot edit in the form the other rules give it - a text area declines a property edited by selecting, for instance - and leaves it to those rules. </p>
com.top_logic.layout.configedit.ConfigControlService.Config.formats = Formats
com.top_logic.layout.configedit.ConfigControlService.Config.formats.tooltip = Value-provider-to-provider mappings, keyed by the <i>configuration value provider</i> class of the property's value provider. <p> Separate from <i>Providers</i>: two properties of the same Java value type (e.g. Date) can carry different value providers - a plain date and a time of day both use Date - so only the value provider's own class, not the Java type, can tell them apart. Looked up by a property's concrete value-provider class first, then by walking up its superclasses, so a mapping registered for a base provider also covers its specializations. </p>
com.top_logic.layout.configedit.ConfigControlService.Config.providers = Providers
com.top_logic.layout.configedit.ConfigControlService.Config.providers.tooltip = Value-type-to-provider mappings, keyed by the Java type of the property value.
com.top_logic.layout.configedit.ConfigControlService.FormatMapping.impl = Implementation
com.top_logic.layout.configedit.ConfigControlService.FormatMapping.impl.tooltip = The control provider to use for a property claimed by this mapping.
com.top_logic.layout.configedit.ConfigControlService.FormatMapping.provider = Provider
com.top_logic.layout.configedit.ConfigControlService.FormatMapping.provider.tooltip = The <i>configuration value provider</i> class (or a superclass of it) a property's value provider must be an instance of for this mapping to apply.
com.top_logic.layout.configedit.ConfigControlService.ProviderMapping.impl = Implementation
com.top_logic.layout.configedit.ConfigControlService.ProviderMapping.impl.tooltip = The control provider to use for properties of this value type.
com.top_logic.layout.configedit.ConfigControlService.ProviderMapping.type = Type
com.top_logic.layout.configedit.ConfigControlService.ProviderMapping.type.tooltip = The Java type of the property value this mapping applies to.
com.top_logic.layout.configedit.ConfigControlService.tooltip = Service resolving the input control for a configuration property. <p> A property whose value fits into a single widget is edited directly: by its Java type (String, boolean, a numeric type, or Date), by selecting from a fixed set of options (an option list, or an enum), or as text through a value provider that can turn the value into text and back. Whether a format can do that is decided for the value the property currently holds: a format that does not accept the value - a parsing-only one accepts nothing - leaves the property without a text form. A property that fits none of those is rejected outright, not silently rendered by a control that would mishandle its value. Such a property (a structure, a collection, a <i>complex</i> property with only a value binding and no format, or one whose format cannot express its value) is rendered by a dedicated nested editor or type selector before this service is ever asked. </p> <p> The widget for a property is resolved in this order: </p> <ol> <li>An encrypted property always gets the password field, deliberately ahead of every other step.</li> <li>The map from an annotation of the property or of its value type to a control of this service (<i>Annotation controls</i>) - an annotation states what the value means (e.g. that its text spans multiple lines), and the map decides how such a value is edited. The first configured annotation the property carries whose provider creates a control wins; a provider may decline a property whose value it cannot edit in the form the remaining rules give it, which leaves the property to those rules.</li> <li>A property edited by selecting from a fixed set of options gets a searchable dropdown - the select model-based forms use - whether it takes one option or several.</li> <li>The value-type-to-provider map configured in this service (<i>Providers</i>).</li> <li>The value-provider-to-provider map configured in this service (<i>Formats</i>) - claims a property whose value provider (or one of its superclasses) is mapped, ahead of the generic format text field. This is what lets a Date formatted as a time of day get a time picker instead of plain text: the Java-type map above cannot separate it from a plain date, but the value provider's own class can.</li> <li>The built-in fallback: the direct widget for the property's Java type - a Date gets a picker for a date with a time of day, the form its value is stored in - or otherwise text parsed and formatted through the property's own ConfigurationValueProvider.</li> </ol> <p> The annotation map (<i>Annotation controls</i>) chooses a control, but not the form of the value it edits: an annotation states something about the value, not that the value is held in a form other than the one the property would otherwise be edited in. A value map, in contrast, claims the property for a control that edits its typed value (an internationalized string in an editor per language, a color in a color chooser). A control chosen by an annotation therefore edits the value in the form the remaining rules give it: the typed value of a property whose Java type one of the built-in widgets handles directly or that a value map claims, the selected options of a property edited by selecting, otherwise its format's text. </p> <p> The configured maps (<i>Annotation controls</i>, <i>Providers</i> and <i>Formats</i>) are what let a module above this one contribute a control - the TL-Script editor, for instance, lives in tl-model-search-react. </p>
com.top_logic.layout.configedit.ConfigFormControl$Commands = Commands
com.top_logic.layout.configedit.ConfigFormControl$Commands.tooltip = Where a <i>configuration form control's</i> Edit, Apply and Cancel commands are rendered.
com.top_logic.layout.configedit.ConfigFormControl.Commands.INLINE = Inline
com.top_logic.layout.configedit.ConfigFormControl.Commands.INLINE.tooltip = As buttons of the form itself, beside its fields. <p> For a standalone use that has no toolbar to put them in. </p>
com.top_logic.layout.configedit.ConfigFormControl.Commands.NONE = None
com.top_logic.layout.configedit.ConfigFormControl.Commands.NONE.tooltip = Not at all - no edit mode, the editor writes straight through to the item it was given.
com.top_logic.layout.configedit.ConfigFormControl.Commands.TOOLBAR = Toolbar
com.top_logic.layout.configedit.ConfigFormControl.Commands.TOOLBAR.tooltip = Not by this control: they are handed out for an enclosing toolbar to render. <p> What a form generated from a model does, and therefore what a configuration form inside a panel should do - the commands sit in the panel's toolbar and the form fills the panel. </p>
com.top_logic.layout.configedit.DatePickerFormatProvider = Date picker format provider
com.top_logic.layout.configedit.DatePickerFormatProvider.Config.format = Format
com.top_logic.layout.configedit.DatePickerFormatProvider.Config.format.tooltip = The format the value is shown in, e.g. a short time format. <p> The format also decides whether the field edits seconds: it does if the format writes them. Without a format, the value is shown in the default format of the kind. </p>
com.top_logic.layout.configedit.DatePickerFormatProvider.Config.kind = Kind
com.top_logic.layout.configedit.DatePickerFormatProvider.Config.kind.tooltip = Which part of a point in time the claimed property's value represents.
com.top_logic.layout.configedit.DatePickerFormatProvider.tooltip = <i>Configuration control provider</i> that creates a <i>react date picker control</i> of a fixed <i>kind</i>, showing the value in the format of its configuration. <p> The impl for a <i>format mapping</i> entry that claims a property whose value provider narrows a Date to a specific part of a point in time, e.g. <i>Time of day as date value provider</i> to <i>time</i>. Registered per value-provider class (see <i>Formats</i> (<i>configuration control service configuration</i>)), not per Java type: a formatted Date reaches this control through that mapping, ahead of the generic format text field the built-in fallback would otherwise give it - the fallback cannot tell a time of day apart from a plain date, both being Date, but the value provider's own class can. </p> <p> The format decides the precision the field edits: a format that writes seconds edits seconds, one that does not edits minutes. A value provider that stores no seconds is therefore mapped with a format without seconds, so that the field never accepts a value the configuration cannot write. </p>
com.top_logic.layout.configedit.I18NStringFormatProvider = Internationalization string format provider
com.top_logic.layout.configedit.I18NStringFormatProvider.Config.rows = Rows
com.top_logic.layout.configedit.I18NStringFormatProvider.Config.rows.tooltip = The number of visible rows of the inline input, or 0 to render it as a single line. <p> Used for a property whose text is not stated to span several lines. The text of a property annotated with <i>multiple line</i>, <i>common mark</i>, or <i>HTML</i> is edited in inputs with the rows the annotation gives. </p>
com.top_logic.layout.configedit.I18NStringFormatProvider.tooltip = <i>Configuration control provider</i> that edits a <i>resource key</i> property the way an <i>internationalized string</i> model attribute is edited: an inline field in the user's own language, plus a button opening the editor for the other languages. <p> The impl for a <i>format mapping</i> entry that claims a property whose value provider produces a <i>resource key</i>, e.g. <i>Value format</i>. Without that claim, such a property would reach the built-in fallback, which can only offer the value's <em>encoded</em> form as text - a single string carrying every language at once, in the framework's own encoding. Nobody edits a translation that way; the same value in a model has an input per language and machine translation between them, and a configured one should be no different. </p> <p> A text spanning several lines - a property annotated with <i>multiple line</i>, <i>common mark</i>, or <i>HTML</i> - is edited in a multi-line input per language. A <i>common mark</i> or <i>HTML</i> text is displayed formatted while it cannot be edited. </p> <p> Claiming the property is also what gives this control the value it needs: the claim makes createModel hand out the typed <i>configuration field model</i> over the <i>resource key</i> itself, rather than the <i>configuration format field model</i> over its encoded text - and a <i>resource key</i> is exactly what <i>react internationalization string input control</i> reads and writes. </p>
