com.top_logic.xio.importer.handlers.SwitchImportHandler.Config.cases.tooltip = Bedingte <i>Handler</i>.
com.top_logic.xio.importer.handlers.SwitchImportHandler.Config.else = Standardfall
com.top_logic.xio.importer.handlers.SwitchImportHandler.Config.else.tooltip = Der <i>Standardhandler</i>, der ausgeführt wird, wenn keines der Prädikate zu <code>true</code> ausgewertet wird.
