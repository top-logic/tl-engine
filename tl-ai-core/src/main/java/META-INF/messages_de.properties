com.top_logic.tl.ai.core.security.layout.ToolAccessPolicyComponent.tooltip = Legt fest, welche Sicherheitsrollen welche Agenten, Modelle, MCP-Server oder Tool-Gruppen verwenden dürfen. <p> Eine Matrix aus Rollen und Namen. Schreibt die Richtlinie des Zugangsdienstes für KI-Tools. Das Gespeicherte wird wirksam, sobald dieser Dienst neu gestartet wird. Diese Ansicht bietet den Neustart an. </p>
