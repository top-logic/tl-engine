com.top_logic.ai.service.tools.model.ModelAnnotationBrowserTool = Browser-Tool f�r Modellkommentare
com.top_logic.ai.service.tools.model.ModelAnnotationBrowserTool.tooltip = Werkzeug zum Durchsuchen von Annotationen auf TopLogic-Modellelementen (Module, Typen, Teile, Aufz�hlungen, Klassifikatoren). <p> Mit diesem Tool k�nnen KI-Agenten die Metadaten von Annotationen auf Modellelementen mit optionaler Vererbungsunterst�tzung pr�fen. Es liefert detaillierte Informationen �ber jede Anmerkung, einschlie�lich ihres Tag-Namens, der Konfigurationsschnittstelle und der Eigenschaftswerte. </p> <h3>Beispiel f�r die Verwendung:</h3> <pre> // Auflisten lokaler Anmerkungen zu einem Modul listAnnotations("tl.core", false) // Auflisten lokaler Anmerkungen zu einem Typ listAnnotations("tl.core:TLObject", false) // Auflisten aller Anmerkungen einschlie�lich vererbter listAnnotations("tl.core:TLObject", true) // Auflisten von Anmerkungen zu einer Enumeration listAnnotations("tl.core:TLScope", false) // Anmerkungen zu einem Typteil auflisten listAnnotations("tl.core:TLObject#name", false) // Anmerkungen zu einem Klassifikator (Enum-Literal) auflisten listAnnotations("tl.core:TLScope#global", false) </pre> <h3>Integration</h3>: <p> Um dieses Tool mit einem KI-Agenten zu verwenden, instanziieren Sie es und f�gen Sie es zu den Tools des Agenten hinzu: </p> <pre> ModelAnnotationBrowserTool annotationTool = new ModelAnnotationBrowserTool(); ModelExplorer explorer = AgenticServices.agentBuilder(ModelExplorer.class) .chatModel(explorationModel) .tools(browserTool, instanceTool, analysisTool, searchTool, annotationTool) .build(); </pre>
