com.top_logic.tl.ai.core.tools.web.TavilySearchEngine.Config.api-key = Api-Schlüssel
com.top_logic.tl.ai.core.tools.web.TavilySearchEngine.Config.api-key.tooltip = Der Tavily-API-Schlüssel (verschlüsselt gespeichert).
