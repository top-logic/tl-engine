com.top_logic.factory.workspace.app.ApplicationWorkspaces.ApplicationState.STOPPED = Stopped
com.top_logic.factory.workspace.app.ApplicationWorkspaces.ApplicationState.STOPPED.tooltip = The application is stopped on request, or not built yet.
com.top_logic.factory.workspace.app.ApplicationWorkspaces.ApplicationState.UNKNOWN = Unknown
com.top_logic.factory.workspace.app.ApplicationWorkspaces.ApplicationState.UNKNOWN.tooltip = The workspace does not tell.
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.build-timeout = Build timeout
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.build-timeout.tooltip = Seconds a Maven run may take: generating an application, building it, filling a release repository. <p> A run that takes longer is terminated and fails the operation. </p>
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.engine-version = Engine version
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.engine-version.tooltip = The TopLogic version an application is built on that does not choose one.
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.image-repository = Image repository
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.image-repository.tooltip = Name of the workspace image without tag. <p> The tag is the content hash of the files the image is built from. </p>
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.repository-url = Repository URL
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.repository-url.tooltip = URL of the Maven repository the TopLogic releases are taken from.
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.start-timeout = Start timeout
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.start-timeout.tooltip = Seconds to wait for a started application to answer.
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider = Docker workspace provider
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.connect-timeout = Connect timeout
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.connect-timeout.tooltip = Timeout in seconds for establishing a connection to the daemon.
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.cpu-limit = CPU limit
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.cpu-limit.tooltip = The number of CPUs a workspace container may use, e.g. 4 or 1.5; 0 for no limit. <p> A limit above the CPUs of the daemon host is cut to them. Under a rootless daemon, the limit needs the CPU controller delegated to the user of the daemon, see the article factory/docker-server. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.docker-host = Docker host
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.docker-host.tooltip = The URI of the Docker daemon. <p> Either the socket of a local daemon, e.g. unix:///var/run/docker.sock, or the address of a remote daemon or a socket proxy, e.g. tcp://docker-proxy:2375. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.extra-hosts = Extra hosts
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.extra-hosts.tooltip = Entries added to the host names a workspace container resolves, each a host name and an address separated by a colon. <p> The address host-gateway stands for the address of the daemon host as the containers see it: host.docker.internal:host-gateway lets a workspace reach a service on the daemon host, e.g. an application that runs there directly, under the name host.docker.internal. The entries apply to containers created afterwards. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.host-ip = Host IP
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.host-ip.tooltip = The address of the daemon host the port of a workspace is published on. <p> The default, the loopback address, makes the applications of the workspaces reachable from the daemon host only. A server publishing them to the browsers of its users names the address of the interface they are to be reached on, e.g. the one a reverse proxy forwards to; empty publishes them on all addresses of the host. A rootful Docker daemon publishes ports past the firewall rules of the host (UFW), so the address is the restriction that holds. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.host-port-max = Host port maximum
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.host-port-max.tooltip = The highest port of the daemon host a workspace port is published on.
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.host-port-min = Host port minimum
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.host-port-min.tooltip = The lowest port of the daemon host a workspace port is published on.
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.isolate-workspaces = Isolate workspaces
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.isolate-workspaces.tooltip = Whether the workspace containers are kept from reaching each other on the network. <p> The network is created with <code>"com.docker.network.bridge.enable_icc"</code> switched off: a container reaches the daemon host - its gateway - and, through it, the outside, but not the ports of another container on the network. The option is set when the network is created; an existing network with another setting is not changed, the provider logs a warning, and the network has to be removed to be created anew. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.label-namespace = Label namespace
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.label-namespace.tooltip = Prefix of the keys of the labels by which the provider recognizes its objects. <p> Two applications that use the same daemon must use different namespaces, otherwise each one regards the workspaces of the other as its own. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.memory-limit = Memory limit
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.memory-limit.tooltip = The memory a workspace container may use, e.g. 8g; 0 for no limit. <p> The default of 8g holds the Java processes of a workspace - the application, a Maven build and the tl-mcp server of the agent, each taking a quarter of the limit as its default heap - beside Claude Code and the headless Chromium of the browser checks. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.name-prefix = Name prefix
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.name-prefix.tooltip = Prefix of the names of the containers and volumes the provider creates. <p> The name of a container is the prefix followed by the workspace identifier, the name of a volume additionally followed by the volume name. Names only have to be unique, the provider never recognizes an object by its name. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.network = Network
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.network.tooltip = Name of the Docker network the workspace containers join. <p> If the network does not exist, it is created. An application that itself runs in a container of the same daemon must be connected to this network to reach the workspaces by container name. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.pids-limit = PIDs limit
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.pids-limit.tooltip = The number of processes and threads a workspace container may run at once; 0 for no limit. <p> The limit stops a fork bomb; the default leaves room for the threads of several Java processes and the browser. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.public-host = Public host
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.public-host.tooltip = Host name of the daemon host under which a browser reaches the published ports. <p> The preview URL of a workspace is built from this name and the host port. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.stop-timeout = Stop timeout
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.stop-timeout.tooltip = Seconds a container gets to shut down when it is stopped, before it is killed.
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.terminate-timeout = Terminate timeout
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.terminate-timeout.tooltip = Seconds a command run in a workspace gets to finish when it is terminated, before it is killed.
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.tls-cert-path = TLS certificate directory
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.tls-cert-path.tooltip = Directory with the client certificate (cert.pem, key.pem) and the CA certificate (ca.pem) for a TLS connection to a tcp:// daemon. <p> If not set, the connection is not encrypted. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.tooltip = <i>Workspace provider</i> running each workspace in a container of a Docker daemon, accessed through the Docker Engine API. <p> The daemon is addressed by <i>Docker host</i>, so the application may run on the daemon host itself, in a container of that daemon (with access to its socket or to a socket proxy) or anywhere else (with a remote daemon). Because of that, the provider only ever creates named volumes and never bind-mounts a path: a host path would be resolved on the daemon host, not where the application runs. </p> <p> Everything the provider creates carries labels in the label namespace: containers and volumes the label <code>"workspace"</code> with the workspace identifier, shared volumes the label <code>"shared"</code> with their logical name, built images the label <code>"image"</code> with their repository, the network the label <code>"network"</code>. The provider finds its objects by these labels only, never by name. </p> <p> All workspace containers join the network <i>Network</i>, which is created if it does not exist. The container port of a workspace is published on a port of the range from <i>Host port minimum</i> to <i>Host port maximum</i>, which the daemon chooses anew on every start among the ports of the range that are free at that time. </p> <p> The network is created with <code>"com.docker.network.bridge.enable_icc"</code> switched off if <i>Isolate workspaces</i> is set, so that a workspace container cannot reach another one on it. The host port is bound to <i>host IP</i> only, by default the loopback address of the daemon host. </p> <p> Every workspace container is limited in memory, CPUs and processes, runs without any capability (<i>all</i> dropped) and with <code>"no-new-privileges"</code>: no process in it gains rights, not even one of the root user or a setuid program. The provider runs no command as root itself; a command is terminated by its own user. </p> <p> The extra hosts are added to the host names a workspace container resolves, e.g. to reach the application on the daemon host through the gateway of the daemon. </p> <p> A command run in a workspace needs a sh with kill in the image: the command is run under a shell script reporting its process ID, and terminating it sends signals to its process group by kill. </p>
