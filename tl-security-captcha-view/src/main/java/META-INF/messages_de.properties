com.top_logic.security.captcha.view.CaptchaElement = Captcha-Element
com.top_logic.security.captcha.view.CaptchaElement.Config.payload = Lösung
com.top_logic.security.captcha.view.CaptchaElement.Config.payload.tooltip = Der Kanal, der die Lösung des Captchas erhält. <p> Der Wert ist die Lösung, wie das ALTCHA-Widget sie übermittelt, der Text, den der <i>Captcha-Dienst</i> prüft; <code>null</code>, solange das Captcha nicht gelöst ist. Das Leeren des Kanals stellt eine neue Aufgabe. </p>
com.top_logic.security.captcha.view.CaptchaElement.Config.start = Start
com.top_logic.security.captcha.view.CaptchaElement.Config.start.tooltip = Wann der Browser beginnt, die Aufgabe zu lösen.
com.top_logic.security.captcha.view.CaptchaElement.tooltip = <i>UI-Element</i>, das das Proof-of-Work-Captcha des <i>Captcha-Dienstes</i> (ALTCHA) in einem Formular zeigt, das ein anonymer Besucher absendet. <p> Der Browser löst eine Aufgabe des Dienstes, und das Element schreibt die Lösung in den Lösungskanal. Die Aktion, die das Formular absendet, liest den Kanal und lässt den <i>Captcha-Dienst</i> die Lösung prüfen. Eine Aktion, die den Kanal nach der Prüfung leert, erhält im Element eine neue Aufgabe, da eine Lösung nur einmal akzeptiert wird. </p> <pre> &lt;channels&gt; &lt;channel name="captcha"/&gt; &lt;/channels&gt; ... &lt;captcha payload="captcha"/&gt; </pre>
com.top_logic.security.captcha.view.CaptchaSolvedArguments = Das Captcha „{target}“ lösen
com.top_logic.security.captcha.view.CaptchaSolvedArguments.payload = Lösung
com.top_logic.security.captcha.view.CaptchaSolvedArguments.payload.tooltip = Die Lösung, wie sie vom ALTCHA-Widget übermittelt wird, d. h. das Base64-kodierte JSON der Aufgabe und ihrer Lösung; <code>null</code>, wenn das Widget keine Lösung mehr enthält.
com.top_logic.security.captcha.view.CaptchaSolvedArguments.tooltip = Typisierte Argumente des Befehls <code>"solved"</code>: die Lösung der Aufgabe.
