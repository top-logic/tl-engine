class.com.top_logic.ai.chat.view.I18NConstants.PANE_TITLE_OBJECTS__COUNT.help = Title of the rail's pane while it shows several objects rather than one. <p> One object titles the pane with its own label; a set of them has no label of its own, and the count is the one true thing that can be said about it without reading the objects. </p>
class.com.top_logic.ai.chat.view.I18NConstants.PANE_TITLE_TYPE__TYPE_COUNT = {0} ({1})
class.com.top_logic.ai.chat.view.I18NConstants.PANE_TITLE_TYPE__TYPE_COUNT.help = Title of the rail's pane while it shows a table or a chart of objects of one type, and the agent named no title of its own.
com.top_logic.ai.chat.backend.ConversationBackendService = Conversation backend service
com.top_logic.ai.chat.backend.ConversationBackendService.Config.resolvers = Conversation backend resolvers
com.top_logic.ai.chat.backend.ConversationBackendService.Config.resolvers.tooltip = What decides which conversations an external backend answers. <p> Asked in this order before every run of a conversation; the first resolver that names a backend wins. Empty, every conversation is answered by the framework's own agent. </p>
com.top_logic.ai.chat.backend.ConversationBackendService.tooltip = Decides which conversations of the chat are answered by a <i>conversation backend</i> rather than by the framework's own agent. <p> The resolvers are asked in the order they are configured; the first that names a backend wins. A conversation no resolver claims - and every conversation while this service is not started - is answered by the framework's own agent. </p> <p> This module configures the service with no resolver. An application adds its own in its configuration: </p> <pre> &lt;config service-class="com.top_logic.ai.chat.backend.ConversationBackendService"&gt; &lt;instance&gt; &lt;resolvers&gt; &lt;resolver class="my.app.WorkspaceBackendResolver"/&gt; &lt;/resolvers&gt; &lt;/instance&gt; &lt;/config&gt; </pre>
com.top_logic.ai.chat.history.ChatScriptFunctions.activity = Activity
com.top_logic.ai.chat.history.ChatScriptFunctions.activity.param.session.tooltip = The chat, a tl.ai.execution:AgentSession.
com.top_logic.ai.chat.history.ChatScriptFunctions.activity.return = "waiting", "news" or "running"; <code>null</code> when none of them applies, or when the argument is no chat.
com.top_logic.ai.chat.history.ChatScriptFunctions.activity.tooltip = What goes on in a chat that the user may not see: whether something waits for them, a subagent has finished since they last looked, or an agent still works there. <p> Subagents outlive the window that started them, so a chat the user has left can still work, finish or need an answer. This is what a chat list shows about each chat. The answers are ranked: something that waits for the user comes first, then a result they have not seen, then work in progress. </p> <p> "Seen" means a window of the owner showed the chat: when the user opens it, leaves it, or has it open while the subagent ends. </p>
com.top_logic.ai.chat.history.ChatScriptFunctions.start = Start a chat with a message
com.top_logic.ai.chat.history.ChatScriptFunctions.start.param.chatId.tooltip = The chat of the window that sends the message, the chat-id of the chat elements that show it.
com.top_logic.ai.chat.history.ChatScriptFunctions.start.param.subject.tooltip = What the conversation is about, empty for nothing.
com.top_logic.ai.chat.history.ChatScriptFunctions.start.param.text.tooltip = The first message.
com.top_logic.ai.chat.history.ChatScriptFunctions.start.return = The new conversation, a tl.ai.execution:AgentSession.
com.top_logic.ai.chat.history.ChatScriptFunctions.start.tooltip = Starts a chat in the current window: a new conversation about the given object, whose first message is sent at once, as if the user had typed it into the chat. <p> For a command giving an order - "work on this" - rather than waiting for the user to type. The conversation is about the given object from its start, so that what answers conversations about such objects answers the first message too. The message is sent through the chat of the window named by chatId: write the result to the input channel of a <chat-conversation> of that chat, and it shows the answer as it is written. </p>
com.top_logic.ai.chat.layout.PromptImprovementProcessor$Failure = Failure
com.top_logic.ai.chat.layout.PromptImprovementProcessor$Failure.tooltip = Request or configuration failure category.
com.top_logic.ai.chat.layout.PromptImprovementProcessor.Failure.DISABLED = Disabled
com.top_logic.ai.chat.layout.PromptImprovementProcessor.Failure.DISABLED.tooltip = Prompt improvement is not configured.
com.top_logic.ai.chat.layout.PromptImprovementProcessor.Failure.INVALID_REQUEST = Invalid request
com.top_logic.ai.chat.layout.PromptImprovementProcessor.Failure.INVALID_REQUEST.tooltip = The browser request is malformed.
com.top_logic.ai.chat.layout.PromptImprovementProcessor.Failure.MISSING_AGENT = Missing agent
com.top_logic.ai.chat.layout.PromptImprovementProcessor.Failure.MISSING_AGENT.tooltip = The configured agent does not exist.
com.top_logic.ai.chat.sched.AgentTask = Agent task
com.top_logic.ai.chat.sched.AgentTask.Config.agent = Agent
com.top_logic.ai.chat.sched.AgentTask.Config.agent.tooltip = Name of the agent to run. <p> Leave empty to run the application's entry-point agent, which is what a chat message without an explicit choice runs. The account this task runs as must be allowed to run the named agent, exactly as in the chat. </p>
com.top_logic.ai.chat.sched.AgentTask.Config.approval-mode = Approval mode
com.top_logic.ai.chat.sched.AgentTask.Config.approval-mode.tooltip = How the tool calls of the run are approved. <p> <i>Auto approve</i>, the default, is the only mode that runs unattended: the agent confirms its own calls and is bounded by the tool-access policy's <background-allowlist> instead. <i>Manual</i> declares that a person will answer - any window of the run-as account can - and makes every approval-needing call wait for that answer, up to the interaction timeout of 30 minutes. </p>
com.top_logic.ai.chat.sched.AgentTask.Config.prompt = Prompt
com.top_logic.ai.chat.sched.AgentTask.Config.prompt-expression = Prompt expression
com.top_logic.ai.chat.sched.AgentTask.Config.prompt-expression.tooltip = TL-Script computing the message to put to the agent, evaluated at the start of every run. <p> The alternative to <i>Prompt</i>, for a task whose message depends on what the application holds at that moment - "these are the invoices already summarised, take the rest". The expression takes no arguments and its result is used as text. </p> <p> Configure either this or <i>Prompt</i>, not both and not neither. </p>
com.top_logic.ai.chat.sched.AgentTask.Config.prompt.tooltip = The message to put to the agent, as plain text. <p> Write it as an element, so a prompt of several lines stays readable: <prompt>Summarise the invoices recorded today.</prompt>. Use <i>Prompt expression</i> instead when the message has to name application data. </p>
com.top_logic.ai.chat.sched.AgentTask.Config.record-session = Record session
com.top_logic.ai.chat.sched.AgentTask.Config.record-session.tooltip = Whether the run is recorded as a chat session of the run-as account. <p> On by default, and the reason this task goes through the chat at all: the sitting appears in that account's chat history with the transcript of what the agent did. Switch it off for a task that is only wanted for its effects; the run then leaves no transcript behind, only what its tools wrote and what the log says. </p>
com.top_logic.ai.chat.sched.AgentTask.Config.run-as = Run as
com.top_logic.ai.chat.sched.AgentTask.Config.run-as.tooltip = Login name of the account the run acts as. <p> The run's principal: its roles decide which tools the agent may use and which agents it may run, and its access rights decide which objects those tools may touch. The recorded chat session belongs to this account and appears in its chat history. Defaults to the root account. </p>
com.top_logic.ai.chat.sched.AgentTask.Config.session-title = Session title
com.top_logic.ai.chat.sched.AgentTask.Config.session-title.tooltip = Title of the recorded chat session. <p> Defaults to the name of the task. Every run creates its own session, so the title is what tells the runs of one task apart from the rest of the account's chats, not one run from another - the session's timestamp does that. </p>
com.top_logic.ai.chat.sched.AgentTask.tooltip = A scheduler task that puts one prompt to a named agent and records the run as a chat session. <p> The point of running the agent <em>through the chat</em> rather than headlessly is the transcript: a scheduled run appears in the chat history of the account it ran as, next to that account's own conversations, and can be opened, read and continued there. AgentRunner would execute the same agent with less plumbing, but what it leaves behind is an execution row, not a sitting the user can open. Everything else this task does - the tracker, the approval mode, the sub-session - follows from taking that route. </p> <p> Configured in the Scheduler's service configuration like any other task: </p> <pre> &lt;task class="com.top_logic.ai.chat.sched.AgentTask" name="DailyInvoiceSummary" agent="Albert" run-as="root" &gt; &lt;prompt&gt;Summarise the invoices recorded today.&lt;/prompt&gt; &lt;schedules&gt; &lt;daily time-of-day="18:00"/&gt; &lt;/schedules&gt; &lt;/task&gt; </pre> <p> <b>Nobody is there.</b> A scheduled run has no browser window, so it cannot be asked anything. In the default <i>auto approve</i> mode the task marks its tracker unattended: the run is bounded by the policy's <background-allowlist> instead of by an approval prompt, and askUser answers the model at once rather than parking the run until the interaction timeout. See doc/scheduled-agent.md. </p> <p> Not to be confused with tl.ai.execution:AgentTask, which is one entry of the plan an agent writes while it works. This is a com.top_logic.util.sched.task.Task - a scheduled job. </p>
com.top_logic.ai.chat.view.AgentViewRefreshService = Agent view refresh service
com.top_logic.ai.chat.view.AgentViewRefreshService$WindowAccess = Window access
com.top_logic.ai.chat.view.AgentViewRefreshService$WindowAccess.tooltip = What became of a write a background thread asked to make in a browser window.
com.top_logic.ai.chat.view.AgentViewRefreshService.Config.lock-timeout-millis = Lock timeout millis
com.top_logic.ai.chat.view.AgentViewRefreshService.Config.lock-timeout-millis.tooltip = How long a refresh waits for a window's interaction, in milliseconds. <p> The interaction is held while that window runs a browser command, and such a command synthesizes the model events itself when it finishes - so giving up costs nothing but a little latency, whereas waiting would tie up a scheduler thread behind a slow command. </p>
com.top_logic.ai.chat.view.AgentViewRefreshService.Config.refresh-delay-millis = Refresh delay millis
com.top_logic.ai.chat.view.AgentViewRefreshService.Config.refresh-delay-millis.tooltip = How long changes are collected before the windows are refreshed, in milliseconds. <p> A turn that ticks off five tasks in a second must not cost five refreshes. Raise this to trade immediacy for load; it is the upper bound on how long a window lags behind the run. </p>
com.top_logic.ai.chat.view.AgentViewRefreshService.Config.write-timeout-millis = Write timeout millis
com.top_logic.ai.chat.view.AgentViewRefreshService.Config.write-timeout-millis.tooltip = How long a write into a window waits for that window's interaction, in milliseconds. <p> Longer than <i>Lock timeout millis</i>, and for the opposite reason: a refresh that gives up loses nothing, because the command holding the interaction synthesizes the same events when it finishes. A write has no such second chance - nobody else is going to put the agent's value on the channel - so giving up means telling the model that the page could not be reached. </p>
com.top_logic.ai.chat.view.AgentViewRefreshService.WindowAccess.BUSY = Busy
com.top_logic.ai.chat.view.AgentViewRefreshService.WindowAccess.BUSY.tooltip = The window is there but stayed busy with a browser command for longer than <i>Write timeout millis</i> (<i>agent view refresh service configuration</i>). Nothing was written; the same write can be tried again.
com.top_logic.ai.chat.view.AgentViewRefreshService.WindowAccess.DONE = Done
com.top_logic.ai.chat.view.AgentViewRefreshService.WindowAccess.DONE.tooltip = The window was reached and the write ran.
com.top_logic.ai.chat.view.AgentViewRefreshService.WindowAccess.NO_WINDOW = No window
com.top_logic.ai.chat.view.AgentViewRefreshService.WindowAccess.NO_WINDOW.tooltip = This run has no window: a headless run, a scheduled one, or one whose browser window is gone. Nothing was written, and nothing can be.
com.top_logic.ai.chat.view.AgentViewRefreshService.tooltip = Makes the model-bound view elements of an open chat window follow what a running agent writes. <p> An agent runs on a background thread and commits through the <i>agent execution store's</i> writer thread. A browser window only learns of such a commit when its GlobalModelEventForwarder is asked to synthesize the pending model events, and today that happens on a browser command or on the SSE heartbeat - so without this service a <data-list> over the agent's tasks would stand still for up to 30 seconds while the run ticks them off. </p> <p> The service listens for committed changes, coalesces them (many task updates within one turn cost one refresh, see <i>Refresh delay millis</i>) and then, for each registered window of the affected account, synthesizes the events in that window's sub-session and <em>within the window's interaction</em>, as the engine's own request handling does. The interaction is what makes this safe beside a browser command: a React control's state map is a plain HashMap, so pushing state from two threads at once would corrupt it. (The engine's SSE heartbeat synthesizes without it; this deliberately does not copy that.) It is entered with a time limit, see <i>window interaction</i>. </p> <p> <b>Coalescing never forgets a change.</b> A pass takes time - it enters every registered window's sub-session and waits for that window's interaction - and the agent writes throughout. A change that arrives while a pass is running is therefore carried into the next pass rather than folded into the running one, which has already taken its batch; <i>pending refreshes</i> is the whole of that rule. Without it such a change was dropped, and the row it was about stood still until an unrelated event happened to synthesize the window's model events - a browser command, or the 30 s heartbeat if the window still has one (#497). </p> <p> <b>TEMPORARY FORK.</b> Enumerating the live windows of an account is not something the engine offers, so this service keeps its own weak register, fed by <i>chat view binding</i> while a chat renders - which means only windows that have a chat element on them are refreshed. <b>Upstream target:</b> the engine should push model events to every live window by itself when a background thread commits, and offer a way to enumerate a session's windows; then delete this class. </p>
com.top_logic.ai.chat.view.ChatChannelsElement = Chat channels element
com.top_logic.ai.chat.view.ChatChannelsElement.Config.channels = Channels
com.top_logic.ai.chat.view.ChatChannelsElement.Config.channels.tooltip = Channels of this view that the pages of the browser window can write, comma-separated. <p> Each channel is reachable under its own name. A <page-selection to="..."> names one of them. Do not name a channel that tables of the pages share through <bind>: a page writes its selection into the channel, and the tables would get it as their selection. </p>
com.top_logic.ai.chat.view.ChatChannelsElement.Config.class.tooltip = The element implementation. Hidden in the layout editor: the tag already fixes it.
com.top_logic.ai.chat.view.ChatChannelsElement.tooltip = Declarative <chat-channels/> element: makes channels of the shell reachable from every page of the browser window. <p> Write it once, in the shell view, next to the <chat-dock>. It shows nothing. A <page-selection> on a page writes into a channel named here, also from a tile-stack frame, which a <bind> cannot reach. See <i>chat channels</i> for why. </p> <pre> &lt;channels&gt;&lt;channel name="pageSelection"/&gt;&lt;/channels&gt; ... &lt;chat-channels channels="pageSelection"/&gt; &lt;chat-dock ...&gt; ... &lt;selection channel="pageSelection"/&gt; ... &lt;/chat-dock&gt; </pre>
com.top_logic.ai.chat.view.ChatConversationElement = Chat conversation element
com.top_logic.ai.chat.view.ChatConversationElement$Actions = Actions
com.top_logic.ai.chat.view.ChatConversationElement$Actions.tooltip = The copy / rate / regenerate row, plus named host actions.
com.top_logic.ai.chat.view.ChatConversationElement$Context = Context
com.top_logic.ai.chat.view.ChatConversationElement$Context.tooltip = What a page tells the agent about the situation the user is asking in. <p> Bound with TL-Script the way <data-list> binds its rows: the inputs are channels of this page whose current values become the leading arguments of every fact's value expression. The expressions are evaluated on the server, in the acting user's context, and re-evaluated whenever an input changes - so what travels with a message is what the page was showing when it was sent. </p> <p> Facts that the application states once and that hold for the whole conversation are stable and are rendered into the system prompt. A fact that changes while the conversation runs must not be: the environment block sits in front of every request of that conversation and has to stay byte-identical, or the provider's prompt cache misses on every turn. Such a fact is rendered into the per-turn <turn-context> block instead, which travels in the turn itself, beside the user's text. </p>
com.top_logic.ai.chat.view.ChatConversationElement$Controls = Controls
com.top_logic.ai.chat.view.ChatConversationElement$Controls.tooltip = The pickers and footer switches on the composer.
com.top_logic.ai.chat.view.ChatConversationElement$Fact = Fact
com.top_logic.ai.chat.view.ChatConversationElement$Fact.tooltip = One fact a page states about the situation.
com.top_logic.ai.chat.view.ChatConversationElement$Mention = Mention
com.top_logic.ai.chat.view.ChatConversationElement$Mention.tooltip = Declarative binding that lets @ mention any model object. <p> Bound with TL-Script the same way <data-list> is: rows computes the objects @ may offer; label and text compute what is shown and what quoted text the mention puts into the message. Each mention carries the object's id as the agent's tools read it, so the agent can read the object with getInstance. Candidates are pushed to the browser and filtered there as the user types, so keep the set modest via rows and limit. </p>
com.top_logic.ai.chat.view.ChatConversationElement$PlaceholderBy = Placeholder by
com.top_logic.ai.chat.view.ChatConversationElement$PlaceholderBy.tooltip = The placeholder of the prompt field as a TL-Script over the page's channels.
com.top_logic.ai.chat.view.ChatConversationElement$Prompt = Prompt
com.top_logic.ai.chat.view.ChatConversationElement$Prompt.tooltip = One question this page offers the user.
com.top_logic.ai.chat.view.ChatConversationElement$Prompts = Prompts
com.top_logic.ai.chat.view.ChatConversationElement$Prompts.tooltip = The first questions this page offers, as cards standing under the greeting of a new chat. <p> A new chat is the one screen where a user has nothing to react to, and a page knows better than the chat what is worth asking on it. So a host names the questions here and the user clicks one instead of typing it. </p> <p> The cards stand between the greeting and the prompt field, and only there: a conversation the user opened from the list is not short of a first question, whether or not it holds a turn. That is the rule, not a default - there is nothing to switch off. </p> <p> Bound with TL-Script the way <i>context</i> binds its facts: the inputs are channels of this page whose current values become the leading arguments of every card's value expression, evaluated on the server in the acting user's context and re-evaluated whenever an input changes. A card can therefore name what the page is showing - "summarise <em>this</em> invoice" - rather than only a fixed sentence. </p> <p> Clicking one writes the evaluated text into the composer, exactly as a host writing the draft channel does, and the composer reports it back onto that channel. Nothing is sent. </p>
com.top_logic.ai.chat.view.ChatConversationElement$Selection = Selection
com.top_logic.ai.chat.view.ChatConversationElement$Selection.tooltip = The page's current selection, stated to the agent as one per-turn fact. <p> The one-line form of what <i>fact</i> can express the long way round. The value it produces names the selected object three times over - the label the user sees, the qualified type name and the identifier every tool reads back - so the agent can both answer "which one do I have open?" and act on it. See <i>chat selection</i> for the exact form. </p> <p> It is a fact of the <turn-context> block and never of the system prompt: a selection is the value that changes most often in a conversation, and the environment block has to stay byte-identical across its turns or every provider's prompt cache misses. </p>
com.top_logic.ai.chat.view.ChatConversationElement$Trace = Trace
com.top_logic.ai.chat.view.ChatConversationElement$Trace.tooltip = How much of the agent's execution the transcript shows. <p> One knob: it replaces the former separate trace-mode and run-summary. <i>Summary</i> is the collapsed-but-expandable run summary the user clicks to open. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Actions.copy = Copy
com.top_logic.ai.chat.view.ChatConversationElement.Actions.copy.tooltip = Whether a finished answer can be copied.
com.top_logic.ai.chat.view.ChatConversationElement.Actions.host = Host
com.top_logic.ai.chat.view.ChatConversationElement.Actions.host.tooltip = Registered message-action names (names components set up in code). Unknown names are ignored with a debug line; they do not fail the view. Hidden in the layout editor: the values must match registrations in TypeScript.
com.top_logic.ai.chat.view.ChatConversationElement.Actions.rate = Rate
com.top_logic.ai.chat.view.ChatConversationElement.Actions.rate.tooltip = Whether a finished answer can be rated.
com.top_logic.ai.chat.view.ChatConversationElement.Actions.regenerate = Regenerate
com.top_logic.ai.chat.view.ChatConversationElement.Actions.regenerate.tooltip = Whether the last answer can be produced again.
com.top_logic.ai.chat.view.ChatConversationElement.Actions.timestamp = Timestamp
com.top_logic.ai.chat.view.ChatConversationElement.Actions.timestamp.tooltip = Whether the answer shows its timestamp.
com.top_logic.ai.chat.view.ChatConversationElement.Config.actions = Actions
com.top_logic.ai.chat.view.ChatConversationElement.Config.actions.tooltip = Which commands sit under a finished answer.
com.top_logic.ai.chat.view.ChatConversationElement.Config.agent = Agent
com.top_logic.ai.chat.view.ChatConversationElement.Config.agent.tooltip = Optional two-way channel holding the name of the agent the composer is set to. The composer writes what the user picked, and follows a write from outside. An empty channel says nothing and leaves the picker alone. A name this account may not run is ignored, and the composer's own agent is written back.
com.top_logic.ai.chat.view.ChatConversationElement.Config.busy = Busy
com.top_logic.ai.chat.view.ChatConversationElement.Config.busy.tooltip = Optional output channel written true while the agent is working.
com.top_logic.ai.chat.view.ChatConversationElement.Config.chat-id = Chat id
com.top_logic.ai.chat.view.ChatConversationElement.Config.chat-id.tooltip = Which conversation this element shows, when it must not be the one the enclosing <chat> names. Leave it empty: an element inside a <chat> shows that chat, and an element outside every <chat> shows default, so the pieces of one page find each other without being told. Set it only to break out of the enclosing chat, e.g. for a second conversation beside the first.
com.top_logic.ai.chat.view.ChatConversationElement.Config.citation-renderer = Citation renderer
com.top_logic.ai.chat.view.ChatConversationElement.Config.citation-renderer.tooltip = Registered citation-renderer name (names a component set up in code). Empty keeps the built-in citation popover. Hidden in the layout editor: the value must match a registration in TypeScript.
com.top_logic.ai.chat.view.ChatConversationElement.Config.citations = Citations
com.top_logic.ai.chat.view.ChatConversationElement.Config.citations.tooltip = Whether the answer shows its cited sources at all: the inline markers and the per-answer "sources" pill. Off removes the whole citation surface from the transcript.
com.top_logic.ai.chat.view.ChatConversationElement.Config.class.tooltip = The element implementation. Hidden in the layout editor: the tag already fixes it, and changing it gives an element that no longer matches the options shown beside it.
com.top_logic.ai.chat.view.ChatConversationElement.Config.context = Context
com.top_logic.ai.chat.view.ChatConversationElement.Config.context.tooltip = What this page tells the agent about the situation the user is asking in. <p> The facts are computed from this page's channels and travel with every message the user sends, where the harness renders the stable ones into the environment block of the system prompt. The user's own message text is never touched - what the transcript shows is what the user wrote. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.controls = Controls
com.top_logic.ai.chat.view.ChatConversationElement.Config.controls.tooltip = Which pickers and footer controls the composer shows.
com.top_logic.ai.chat.view.ChatConversationElement.Config.draft = Draft
com.top_logic.ai.chat.view.ChatConversationElement.Config.draft.tooltip = Optional two-way channel holding the text standing in the composer, unsent. <p> The composer reports what the user has typed - when they pause, when the field loses the focus, and just before a send - and follows a write from outside: the written text replaces the draft, the composer takes the focus and the caret goes to the end. The user still presses send, so a host that writes a question can be read before it goes. </p> <p> An empty write clears the draft; null says nothing and leaves the composer alone, which is what an unwritten channel holds. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.effort = Effort
com.top_logic.ai.chat.view.ChatConversationElement.Config.effort.tooltip = Optional two-way channel holding how hard the model may be asked to think. One of the levels the selected model offers, empty for none. Written and followed like <i>agent</i>; a level the model does not know is dropped by the composer, as the thinking picker's own choice is.
com.top_logic.ai.chat.view.ChatConversationElement.Config.input = Input
com.top_logic.ai.chat.view.ChatConversationElement.Config.input.tooltip = Optional channel holding the open AgentSession. The conversation follows a write. Leave empty when the conversation should only talk to the other chat elements through chat-id.
com.top_logic.ai.chat.view.ChatConversationElement.Config.mcp-servers = MCP servers
com.top_logic.ai.chat.view.ChatConversationElement.Config.mcp-servers.tooltip = Optional two-way channel holding the names of the MCP servers attached to the next turn. A collection of names, or one name. Written and followed like <i>agent</i>; an empty channel says nothing, while an empty collection attaches no server at all.
com.top_logic.ai.chat.view.ChatConversationElement.Config.mention = Mention
com.top_logic.ai.chat.view.ChatConversationElement.Config.mention.tooltip = Declarative @-mention binding: lets @ offer any model object, configured with TL-Script like <data-list>. When set, it supplies the @ candidates and takes precedence over <i>reference source</i>.
com.top_logic.ai.chat.view.ChatConversationElement.Config.menu-items = Menu items
com.top_logic.ai.chat.view.ChatConversationElement.Config.menu-items.tooltip = Registered composer-menu-item names. Hidden in the layout editor: the values must match registrations in TypeScript.
com.top_logic.ai.chat.view.ChatConversationElement.Config.model = Model
com.top_logic.ai.chat.view.ChatConversationElement.Config.model.tooltip = Optional two-way channel holding the name of the model the next turn runs on. Written and followed like <i>agent</i>. Picking an agent sets this to the model that agent is assigned, so a host sees the model a turn would really use.
com.top_logic.ai.chat.view.ChatConversationElement.Config.personalization-key.tooltip = Optional override for the auto-derived personalization key. Hidden in the layout editor: the key derived from the view context is the right one, and a hand-written value silently moves what a user has personalized somewhere else.
com.top_logic.ai.chat.view.ChatConversationElement.Config.placeholder = Placeholder
com.top_logic.ai.chat.view.ChatConversationElement.Config.placeholder-by = Placeholder by
com.top_logic.ai.chat.view.ChatConversationElement.Config.placeholder-by.tooltip = The invitation standing in the empty prompt field, computed from the page. <p> For a chat whose subject the page decides: one chat element on every page of an application asks about the open project while there is one, and about everything else while there is none. A fixed placeholder then names a scope the conversation does not have. The text follows its inputs. When it is empty, the placeholder applies. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.placeholder.tooltip = The invitation standing in the empty prompt field, in this application's own words. <p> Written here as a text per language, or as the key of one. Empty keeps the chat's own wording, which is what every application got before this option existed. </p> <p> It is the <em>idle</em> invitation only. While the agent is working the field keeps saying "type your next message", because that sentence is about the run rather than about this application, and an application that replaced it would be telling the user to start something that is already under way. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.present = Present
com.top_logic.ai.chat.view.ChatConversationElement.Config.present.tooltip = The channels this page lets the agent write, comma-separated - the allow list of the present tool. <p> <b>Deny by default.</b> Empty means the agent may write no channel of this page at all, and a present call naming any other channel is refused with a message saying which names exist. Naming a channel here is a decision about how much of the page the agent may drive, so it is stated on the element rather than derived from what happens to be wired somewhere on the view. </p> <p> The channels count while this element is displayed. A run whose page displays no element naming one is not offered the present tool at all, so the agent answers a request to see objects in text instead of with a call that is refused. </p> <p> The agent writes the objects, not the rendering: what the value looks like is whatever element reads that channel - a <chat-rail>'s pane, a <form>, a <data-list>. Usually one channel, the one the pane reads: present="paneObject". </p> <p> A run without a browser window - headless, TL-Script, the scheduler - has no channels at all whatever this says; the tool reports that and does nothing. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.prompt-improver-agent = Prompt improver agent
com.top_logic.ai.chat.view.ChatConversationElement.Config.prompt-improver-agent.tooltip = Name of the agent that improves draft prompts. Leave empty to disable prompt improvement.
com.top_logic.ai.chat.view.ChatConversationElement.Config.prompts = Prompts
com.top_logic.ai.chat.view.ChatConversationElement.Config.prompts.tooltip = The first questions this page offers, as cards the user clicks instead of typing. <p> A click fills the composer; it does not send. The user reads the sentence and presses send - the same rule draft, reference and quote follow, and the reason a card may put a long, precise question there that nobody would type. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.quote = Quote
com.top_logic.ai.chat.view.ChatConversationElement.Config.quote.tooltip = Optional input channel: a marked passage of an object becomes one atomic reference token in the draft, written as a map of what the token carries. <p> What reference cannot say. That channel takes an object, whose quoted text is everything this element knows about it; a reader who marked one paragraph in the host's own viewer wants that paragraph quoted, and only the viewer that showed it knows which one. So this channel takes the token itself - the object the passage is from, the passage, and optionally a label, a location and a kind: </p> <pre> &lt;chat-conversation quote="chatQuote"/&gt; </pre> <p> A write is a map, which is what a TL-Script expression produces: </p> <pre> section -&gt; {"id": $section, "location": "02 Kontext", "text": $marked} </pre> <p> id is normally the model object itself rather than a printed identifier: the element then fills the kind, the stable id and the label from it - a nested <mention> having its say in the label - and the write only has to name the passage. A map with no text says nothing, because an object without a passage is what reference is for. Like it, this channel is read and never written. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.react-element = React element
com.top_logic.ai.chat.view.ChatConversationElement.Config.react-element.tooltip = Registered React element that renders this conversation. Defaults to TLChatConversation. Hidden in the layout editor: the value must match a registration in TypeScript.
com.top_logic.ai.chat.view.ChatConversationElement.Config.reference = Reference
com.top_logic.ai.chat.view.ChatConversationElement.Config.reference-source = Reference source
com.top_logic.ai.chat.view.ChatConversationElement.Config.reference-source.tooltip = Registered reference-source name (names a component set up in code). Empty, and with no mention binding, hides the @ picker. A mention binding takes precedence over this name. Hidden in the layout editor: the value must match a registration in TypeScript; a designer binds @ with the mention group instead.
com.top_logic.ai.chat.view.ChatConversationElement.Config.reference.tooltip = Optional input channel: a model object written to it becomes one atomic reference token in the draft, exactly as picking it from the @ menu would. <p> The token carries the object's label and its stable id, and the quoted text a nested <mention>'s text expression computes - without a <mention> the label is the quoted text as well, because the element has nothing else to say about the object. The token lands at the caret, so a host can write a sentence to draft and a reference into it. </p> <p> This channel is read, never written: the composer does not report its tokens back, because the draft they sit in is what draft already carries. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.selection = Selection
com.top_logic.ai.chat.view.ChatConversationElement.Config.selection.tooltip = The object the user has selected, stated to the agent in one line. <p> The question this answers is the one every user asks first - "what about the one I have open?" - and the shorthand for the <fact> nobody writes, because writing it means knowing how this product spells an object identifier. Name the page's selection channel and the conversation states the selected object, with its type and that identifier, as a per-turn fact of the <turn-context> block: </p> <pre> &lt;chat-conversation input="chatSession"&gt; &lt;selection channel="selectedInvoice"/&gt; &lt;/chat-conversation&gt; </pre> <p> Never stable: what the user has selected is the thing that changes most often in a conversation, so it travels in the turn and never in the system prompt. </p> <p> A <chat-dock/> states it the same way, on the <chat-conversation/> nested inside it - and should, because the dock is where a user asks about the page behind it. The dock's own channel has to be handed the page's selection for that: a <page-selection> in each page, and <chat-channels> in the shell. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.subject = Subject
com.top_logic.ai.chat.view.ChatConversationElement.Config.subject.tooltip = Optional channel naming the object a conversation started here is about. <p> What stands on this channel when the user's first message creates the conversation is written onto that session as tl.ai.execution:AgentSession#subject, and stays there. A page that is about one object at a time - a project, an invoice, a contract - thereby gets one conversation per object without remembering anything itself: </p> <pre> &lt;chat-conversation input="chatSession" subject="project"/&gt; </pre> <p> Only on the way out. Which conversation is shown stays the input channel's business, and which conversations a user may pick from stays the <data-list>'s - scoped by asking the object for the sessions that refer to it: </p> <pre> &lt;rows&gt;project -&gt; ifElse(isEmpty($project), list(), $project.referers(`tl.ai.execution:AgentSession#subject`) .filter(s -&gt; $s.get(`tl.ai.execution:AgentSession#owner`) == currentUser()))&lt;/rows&gt; </pre> <p> A conversation is stamped once, by the request that brings it into being - before its first message is sent, so that a <i>conversation backend resolver</i> deciding from the subject already answers that message. Opening an older one while another object stands here does not move it, and a conversation started while the channel was empty keeps no subject rather than being given one later. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.trace = Trace
com.top_logic.ai.chat.view.ChatConversationElement.Config.trace.tooltip = How much of the agent's execution the transcript shows: nothing, a collapsed summary, or the full inline trace. The user can still change it live with the composer's trace picker.
com.top_logic.ai.chat.view.ChatConversationElement.Config.working-indicator = Working indicator
com.top_logic.ai.chat.view.ChatConversationElement.Config.working-indicator.tooltip = What stands where the answer will appear while the agent works and has not written anything yet, in this application's own look - e.g. its logo, animated. <p> Empty keeps the chat's three pulsing dots. Otherwise one of three forms, sized to the height of the first text line (the --chat-working-indicator-size token): </p> <ul> <li>An SVG file, e.g. /images/app-working.svg. It is placed into the page itself rather than shown as a picture, so it can draw in currentColor or in the theme's colours (var(--text-secondary)) and then fits the light and the dark theme alike. The style sheet inside it therefore applies to the whole page: give its classes a prefix of the application's.</li> <li>An icon class, e.g. css:app-working, which the application's stylesheet draws and animates - the form for an image that differs per theme, because that stylesheet can choose it by [data-theme].</li> <li>Any other image, e.g. an animated .webp, shown as it is.</li> </ul> <p> Whoever asked the system for less motion sees the SVG and the icon class standing still: the chat stops their CSS animations and pauses an SVG's own ones. An animated raster image cannot be stopped from outside, which is the reason to prefer the other two. </p> <p> Decorative, like the dots: what the screen reader announces while the agent works is the chat's own status text, whatever is configured here. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Context.facts = Facts
com.top_logic.ai.chat.view.ChatConversationElement.Context.facts.tooltip = The facts themselves, in the order they reach the model. <p> The default container, so a fact is written as a direct child of the context rather than inside a wrapper element of its own. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Context.inputs = Inputs
com.top_logic.ai.chat.view.ChatConversationElement.Context.inputs.tooltip = References to channels whose values become the leading positional arguments of every fact expression, in the order they are listed.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.agent-picker = Agent picker
com.top_logic.ai.chat.view.ChatConversationElement.Controls.agent-picker.tooltip = Whether the agent picker is offered.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.attachments = Attachments
com.top_logic.ai.chat.view.ChatConversationElement.Controls.attachments.tooltip = Whether files can be attached.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.auto-approve = Auto approve
com.top_logic.ai.chat.view.ChatConversationElement.Controls.auto-approve.tooltip = Whether the auto-approve switch is shown.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.enter-hint = Enter hint
com.top_logic.ai.chat.view.ChatConversationElement.Controls.enter-hint.tooltip = Whether the footer shows the Enter hint.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.mcp = MCP
com.top_logic.ai.chat.view.ChatConversationElement.Controls.mcp.tooltip = Whether MCP servers can be toggled.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.model-picker = Model picker
com.top_logic.ai.chat.view.ChatConversationElement.Controls.model-picker.tooltip = Whether the model picker is offered.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.thinking = Thinking
com.top_logic.ai.chat.view.ChatConversationElement.Controls.thinking.tooltip = Whether effort levels are offered.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.trace-picker = Trace picker
com.top_logic.ai.chat.view.ChatConversationElement.Controls.trace-picker.tooltip = Whether the trace-mode picker is offered.
com.top_logic.ai.chat.view.ChatConversationElement.Fact.name = Name
com.top_logic.ai.chat.view.ChatConversationElement.Fact.name.tooltip = What the fact is called in front of the model, e.g. Project.
com.top_logic.ai.chat.view.ChatConversationElement.Fact.stable = Stable
com.top_logic.ai.chat.view.ChatConversationElement.Fact.stable.tooltip = Whether the value holds for the whole conversation. <p> Only a stable fact reaches the system prompt. Leave it on for something the page decides once - the project a chat belongs to - and switch it off for something that follows the user's clicks. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Fact.value = Value
com.top_logic.ai.chat.view.ChatConversationElement.Fact.value.tooltip = TL-Script computing the value, taking the enclosing inputs as its leading arguments.
com.top_logic.ai.chat.view.ChatConversationElement.Mention.label = Label
com.top_logic.ai.chat.view.ChatConversationElement.Mention.label.tooltip = Optional TL-Script of one object computing its shown label and the mention's label. Empty uses the object's own label.
com.top_logic.ai.chat.view.ChatConversationElement.Mention.limit = Limit
com.top_logic.ai.chat.view.ChatConversationElement.Mention.limit.tooltip = Most candidates pushed to the browser. The list is filtered in the browser as the user types, so this bounds the payload rather than the search.
com.top_logic.ai.chat.view.ChatConversationElement.Mention.observed-types = Observed types
com.top_logic.ai.chat.view.ChatConversationElement.Mention.observed-types.tooltip = Types whose object changes (create / update / delete) re-run <i>Rows</i>, so the candidate set refreshes automatically.
com.top_logic.ai.chat.view.ChatConversationElement.Mention.rows = Rows
com.top_logic.ai.chat.view.ChatConversationElement.Mention.rows.tooltip = TL-Script function computing the objects @ may mention (a <i>collection</i>), the same way <data-list> and <table> bind rows.
com.top_logic.ai.chat.view.ChatConversationElement.Mention.text = Text
com.top_logic.ai.chat.view.ChatConversationElement.Mention.text.tooltip = Optional TL-Script of one object computing the quoted text the mention puts into the message - what the agent reads. Empty uses the label.
com.top_logic.ai.chat.view.ChatConversationElement.PlaceholderBy.inputs = Inputs
com.top_logic.ai.chat.view.ChatConversationElement.PlaceholderBy.inputs.tooltip = References to channels whose values become the positional arguments of the value, in the order they are listed.
com.top_logic.ai.chat.view.ChatConversationElement.PlaceholderBy.value = Value
com.top_logic.ai.chat.view.ChatConversationElement.PlaceholderBy.value.tooltip = TL-Script computing the text, in the user's language, e.g. with #("..."@en, "..."@de). An empty result leaves the fixed placeholder in force.
com.top_logic.ai.chat.view.ChatConversationElement.Prompt.icon = Icon
com.top_logic.ai.chat.view.ChatConversationElement.Prompt.icon.tooltip = The icon on the card, e.g. css:bi bi-receipt. <p> Named the way a <chat-rail/> section names its icon. Cards without one show their label alone, which is what a set of cards that say nothing an icon could add should do. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Prompt.label = Label
com.top_logic.ai.chat.view.ChatConversationElement.Prompt.label.tooltip = What the card says, in the user's own language. <p> The short form of the question, not the question itself: the card has one line, while the value it fills in may be a paragraph. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Prompt.value = Value
com.top_logic.ai.chat.view.ChatConversationElement.Prompt.value.tooltip = TL-Script computing the text the click puts into the composer, taking the enclosing inputs as its leading arguments.
com.top_logic.ai.chat.view.ChatConversationElement.Prompts.cards = Cards
com.top_logic.ai.chat.view.ChatConversationElement.Prompts.cards.tooltip = The cards themselves, in the order they are shown. <p> The default container, so a card is written as a direct child of the section rather than inside a wrapper element of its own. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Prompts.inputs = Inputs
com.top_logic.ai.chat.view.ChatConversationElement.Prompts.inputs.tooltip = References to channels whose values become the leading positional arguments of every card expression, in the order they are listed.
com.top_logic.ai.chat.view.ChatConversationElement.Selection.channel = Channel
com.top_logic.ai.chat.view.ChatConversationElement.Selection.channel.tooltip = The channel holding what the user has selected - one object, several, or nothing. <p> Normally the selection channel of the table or list the user picks in. A channel of <em>this</em> view: a page of a shell hands its selection to a dock in the shell's footer with a <page-selection>, into a channel that <chat-channels> publishes. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Selection.label = Label
com.top_logic.ai.chat.view.ChatConversationElement.Selection.label.tooltip = TL-Script computing what to call one selected object, taking that object as its argument. <p> Left empty the application's own label is used - which is what the user sees on the screen, and therefore the right answer to a question about it. Configure an expression here when an object's label is not what makes it recognisable in a sentence. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Selection.name = Name
com.top_logic.ai.chat.view.ChatConversationElement.Selection.name.tooltip = What the fact is called in front of the model. <p> Read by the model, so it is English and not a resource, like every other text a tool puts in front of one. Name what the page holds - "Open invoice", "Selected task" - where that says more than the default does. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Trace.DETAILED = Detailed
com.top_logic.ai.chat.view.ChatConversationElement.Trace.DETAILED.tooltip = The full execution trace, inline.
com.top_logic.ai.chat.view.ChatConversationElement.Trace.NONE = None
com.top_logic.ai.chat.view.ChatConversationElement.Trace.NONE.tooltip = Only the answer; no execution detail.
com.top_logic.ai.chat.view.ChatConversationElement.Trace.SUMMARY = Summary
com.top_logic.ai.chat.view.ChatConversationElement.Trace.SUMMARY.tooltip = A collapsed one-line run summary the user can expand.
com.top_logic.ai.chat.view.ChatConversationElement.tooltip = Declarative <chat-conversation/> element: the transcript and the prompt field as one view element. <p> Merges what used to be the separate <chat-thread/> and <chat-composer/> elements. Transcript and input almost always sit together, so they are one placeable box; a session list (a <data-list> of AgentSessions) and a rail (<chat-rail/>) stay separate because those genuinely want independent placement. Several chat elements on one page join the same conversation through chat-id. The optional input channel carries the open AgentSession; the optional busy channel is written true while the agent works, so a host can disable its own commands. </p> <p> Four further channels carry what the user set up for the next turn: agent, model, effort and mcp-servers. Each is two-way - the composer writes the user's choice and follows a write from outside - so a host can show which agent answers, gate a button on the model, or pre-select an agent for a page. They carry the <em>names</em> these things are known by, because a name is what every request, and the security policy behind it, is written in: only an agent authored in the knowledge base is a model object at all, while the shipped agents, the models and the MCP servers are configuration. See <i>chat turn channels</i>. </p> <p> present is the other direction and the only one the <em>agent</em> drives: the channels named there are the ones a run may write with the present tool, and nothing else on the page is reachable from a run. <b>Deny by default</b> - an element that names none lets no agent write any channel, and a run on a page that names none is not offered the tool at all. See <i>present</i> and <i>chat present tool</i>. </p> <p> Three more carry the composer's unsent text: draft is the text itself, two-way; reference turns a written model object into one atomic reference token inside it; and quote does the same for a passage <em>of</em> an object, which only the viewer that showed it can name. Together they are what lets a button anywhere on the page put a question into the chat without a line of code - an <execute-script> that builds the sentence or the passage and a <write-channel> that writes it. </p>
com.top_logic.ai.chat.view.ChatDockElement = Chat dock element
com.top_logic.ai.chat.view.ChatDockElement.Config.chat-id = Chat id
com.top_logic.ai.chat.view.ChatDockElement.Config.chat-id.tooltip = Which conversation the launcher reports on. <p> Unlike every other chat element this one has to be told, because it <em>contains</em> the <chat> rather than sitting inside it, and a chat scope reaches descendants only. Write the same id here that the nested <chat> carries. Left empty the dock joins default, which is right for a page whose chat names no id either. </p>
com.top_logic.ai.chat.view.ChatDockElement.Config.class.tooltip = The element implementation. Hidden in the layout editor: the tag already fixes it, and changing it gives an element that no longer matches the options shown beside it.
com.top_logic.ai.chat.view.ChatDockElement.Config.content = Content
com.top_logic.ai.chat.view.ChatDockElement.Config.content.tooltip = What the panel shows, written as the <chat-dock>'s children. <p> Any view element; normally one <chat> holding the conversation and whatever else the application wants beside it. The content takes the height of the open panel, and a conversation inside scrolls there instead of growing with its transcript. Several children stand one below the other, and the ones that fill share the height the others leave. </p>
com.top_logic.ai.chat.view.ChatDockElement.Config.icon = Icon
com.top_logic.ai.chat.view.ChatDockElement.Config.icon.tooltip = The glyph on the launcher button, e.g. css:bi bi-stars. The same vocabulary a <nav-item> or a rail <section> uses. While the panel is open the button shows a close cross instead, so this is the closed state's icon.
com.top_logic.ai.chat.view.ChatDockElement.Config.label = Label
com.top_logic.ai.chat.view.ChatDockElement.Config.label.tooltip = What the launcher is called: its tooltip and its accessible name. The one word a user reads about the dock, so name the assistant rather than the mechanism - "Assistant", not "Open the chat panel". Left empty the chat's own wording is used.
com.top_logic.ai.chat.view.ChatDockElement.Config.open = Open
com.top_logic.ai.chat.view.ChatDockElement.Config.open.tooltip = Whether the panel is already open when the page is first shown. <p> The first-load state, and nothing more: the dock does not remember what the user did with it, so every page load starts here again. </p>
com.top_logic.ai.chat.view.ChatDockElement.Config.personalization-key.tooltip = Optional override for the auto-derived personalization key. Hidden in the layout editor: the key derived from the view context is the right one, and a hand-written value silently moves what a user has personalized somewhere else.
com.top_logic.ai.chat.view.ChatDockElement.Config.react-element = React element
com.top_logic.ai.chat.view.ChatDockElement.Config.react-element.tooltip = Registered React element that renders this dock. Defaults to TLChatDock. Hidden in the layout editor: the value must match a registration in TypeScript.
com.top_logic.ai.chat.view.ChatDockElement.tooltip = Declarative <chat-dock/> element: a floating launcher that opens the chat over the page. <p> The dock is a frame and nothing else. Closed it costs one button in the corner of the window; opened it shows, in a card over the page, whatever the application nested inside it - normally one <chat> holding a session list, a <chat-conversation/> and a <chat-rail/>, but any view element will do. What the assistant is <em>made of</em> stays the application's decision, exactly as it is on a page of its own. </p> <p> Nothing reflows when it opens: the panel is a fixed-position card over the work area, so no pane appears, no table gets narrower, and closing it puts the page back untouched. The page behind stays usable while the dock is open. </p> <p> <b>The dock contains the chat, so it cannot inherit from it.</b> Every other chat element takes its conversation from the enclosing <chat>, but a scope flows downward only and here the <chat> is the child. The dock therefore repeats the id: </p> <pre> &lt;chat-dock chat-id="assistant" icon="css:bi bi-stars"&gt; &lt;label&gt;&lt;en&gt;Assistant&lt;/en&gt;&lt;de&gt;Assistent&lt;/de&gt;&lt;/label&gt; &lt;chat chat-id="assistant" direction="row"&gt; &lt;panel fill="true"&gt;&lt;chat-conversation input="dockSession"/&gt;&lt;/panel&gt; &lt;chat-rail&gt;...&lt;/chat-rail&gt; &lt;/chat&gt; &lt;/chat-dock&gt; </pre> <p> The two ids must agree, and a mismatch is reported rather than silent: <i>chat join log</i> warns about a window whose chat ids do not line up, which is the shape a typo here produces. </p> <p> The dock needs the id for one thing only - the launcher's unseen count and its busy dot, which it reads from the browser store of that conversation, the same store the transcript's rail button reads. Neither gets a channel: they change many times a second while the agent works, and a command round trip for a dot is not what a channel is for. </p> <p> <b>TEMPORARY FORK.</b> Nothing about a floating launcher is chat-specific except where its badge comes from. <b>Upstream target:</b> a generic <dock> shell in tl-layout-view that hosts any element and takes its badge from a channel, leaving tl-chat the store-bound launcher only. </p>
com.top_logic.ai.chat.view.ChatRailElement = Chat rail element
com.top_logic.ai.chat.view.ChatRailElement$PaneMode = Pane mode
com.top_logic.ai.chat.view.ChatRailElement$PaneMode.tooltip = How wide the pane opens.
com.top_logic.ai.chat.view.ChatRailElement$SectionConfig = Section configuration
com.top_logic.ai.chat.view.ChatRailElement$SectionConfig.tooltip = One collapsible block of the rail, holding one view element.
com.top_logic.ai.chat.view.ChatRailElement.Config.chat-id = Chat id
com.top_logic.ai.chat.view.ChatRailElement.Config.chat-id.tooltip = Which conversation this rail belongs to, when it must not be the one the enclosing <chat> names. Leave it empty: a rail inside a <chat> belongs to that chat, and a rail outside every <chat> belongs to default, so the pieces of one page find each other without being told. Set it only to break out of the enclosing chat.
com.top_logic.ai.chat.view.ChatRailElement.Config.class.tooltip = The element implementation. Hidden in the layout editor: the tag already fixes it, and changing it gives an element that no longer matches the options shown beside it.
com.top_logic.ai.chat.view.ChatRailElement.Config.drawer-below = Drawer below
com.top_logic.ai.chat.view.ChatRailElement.Config.drawer-below.tooltip = Width of the surrounding container, in rem, below which the rail opens as a drawer. <p> Below it the rail keeps only its strip beside the conversation, and a section or the pane opens over the conversation instead of taking a column of its own. The default fits a rail beside a conversation and a chat list. Set it to what the rail's open column and its neighbours need side by side; 0 keeps a column at every width. </p>
com.top_logic.ai.chat.view.ChatRailElement.Config.input = Input
com.top_logic.ai.chat.view.ChatRailElement.Config.input.tooltip = Channel holding what the pane shows, empty for the sections. <p> While it holds something the pane replaces the section column: one object as its form, several as a table with the columns of their type, and what the agent presented as the table, chart or form it asked for - for any type, with nothing to configure. The pane's close button writes null back. Name the same channel as the <chat-conversation present="…"> so the agent can show things here. Leave it empty for a rail without a pane. </p>
com.top_logic.ai.chat.view.ChatRailElement.Config.open = Open
com.top_logic.ai.chat.view.ChatRailElement.Config.open.tooltip = Whether the rail starts open. <p> The state for a user who has never opened or closed this rail. Once the user has, their own choice is what every later page load and every new tab shows, and this flag no longer applies to them. </p>
com.top_logic.ai.chat.view.ChatRailElement.Config.pane-mode = Pane mode
com.top_logic.ai.chat.view.ChatRailElement.Config.pane-mode.tooltip = How wide the pane opens: a record beside the transcript, or something to read.
com.top_logic.ai.chat.view.ChatRailElement.Config.pane-width = Pane width
com.top_logic.ai.chat.view.ChatRailElement.Config.pane-width.tooltip = Pane width in pixels. Zero keeps the automatic width. <p> The width for a user who has never dragged the splitter of this rail; a user who has keeps their own. Hidden in the layout editor, because a number here is a choice about somebody else's window that the user can make better themselves. </p>
com.top_logic.ai.chat.view.ChatRailElement.Config.personalization-key.tooltip = Optional override for the auto-derived personalization key. Hidden in the layout editor: the key derived from the view context is the right one, and a hand-written value silently moves what a user has personalized somewhere else.
com.top_logic.ai.chat.view.ChatRailElement.Config.react-element = React element
com.top_logic.ai.chat.view.ChatRailElement.Config.react-element.tooltip = Registered React element that renders this rail. Defaults to TLChatRail. Hidden in the layout editor: the value must match a registration in TypeScript.
com.top_logic.ai.chat.view.ChatRailElement.Config.sections = Sections
com.top_logic.ai.chat.view.ChatRailElement.Config.sections.tooltip = The rail's sections, top to bottom in the order written. Written directly as <section> children of the <chat-rail>. An empty list is an empty rail; this element ships no sections of its own.
com.top_logic.ai.chat.view.ChatRailElement.Config.strip = Strip
com.top_logic.ai.chat.view.ChatRailElement.Config.strip.tooltip = Whether the strip of section icons is shown. The strip is what says what the rail holds while it is closed, and clicking an icon opens the rail on that section. Without it the only way in is the transcript's rail button.
com.top_logic.ai.chat.view.ChatRailElement.PaneMode.CARD = Card
com.top_logic.ai.chat.view.ChatRailElement.PaneMode.CARD.tooltip = A record beside the thread.
com.top_logic.ai.chat.view.ChatRailElement.PaneMode.DOCUMENT = Document
com.top_logic.ai.chat.view.ChatRailElement.PaneMode.DOCUMENT.tooltip = Something to read; the pane takes most of the column.
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.badge = Badge
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.badge.tooltip = Optional channel carrying how many things this section is showing. The number appears beside the section's title and on its strip icon, and the rail sums the sections into the total the transcript's rail button shows. The content element writes it - a <data-list count="…"/> does - or a derived channel computes it.
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.content = Content
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.content.tooltip = What this section shows: one view element, written as the <section>'s child. Several elements are stacked, as in a <tab>.
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.icon = Icon
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.icon.tooltip = The icon shown on the strip, e.g. css:bi bi-list-check. Sections without one share a generic glyph, which says nothing about what is inside; give every section an icon of its own where the strip is shown.
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.label = Label
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.label.tooltip = The title shown in the section's header.
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.name = Name
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.name.tooltip = Technical name of this section, unique within the rail. It is the key under which the section remembers whether the user collapsed it, so renaming a section forgets that.
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.open = Open
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.open.tooltip = Whether this section starts expanded. <p> The state for a user who has never collapsed or expanded this section. Once the user has, their own choice is what every later page load and every new tab shows. The choice is remembered per section name, so a section added to the rail later starts as configured even for a user who arranged the others long ago. </p>
com.top_logic.ai.chat.view.ChatRailElement.tooltip = Declarative <chat-rail/> element: the side rail beside a conversation, as a shell whose content is configured. <p> The rail extends the chat so it can show more beside the transcript - what the agent is doing, a proposed plan, the sources, a document it wrote. <b>Which</b> of those is the application's decision, so this element brings no content of its own: each <section> holds one view element, and any element will do - a <data-list> of the agent's tasks or of the application's own objects, or an element a host wrote. An empty <chat-rail/> renders an empty rail. </p> <p> The input channel is the rail's second face: while it holds something, the pane is shown in place of the sections - one object as its form, several as a table, and what the agent's present tool put there as the table, chart or form it asked for. The pane is the same for every type and every application (<i>presentation pane</i>); nothing is configured for it but the channel. It keeps a history: a row clicked in a table opens that object's form, and "back" returns to the table as it was. Closing the pane writes null back. </p> <p> Several chat elements on one page join the same conversation through chat-id. Two rails on one chat-id are not supported: the open state and the collapsed sections are one per conversation, and both rails would fight over them. </p> <p> <b>TEMPORARY FORK.</b> Nothing here is chat-specific except the chat-id binding and the remembered layout. <b>Upstream target:</b> a generic side-rail shell in tl-layout-view (engine hand-off E2), leaving tl-chat only the sections it contributes. </p>
com.top_logic.ai.chat.view.ChatScopeElement = Chat scope element
com.top_logic.ai.chat.view.ChatScopeElement.Config.chat-id = Chat id
com.top_logic.ai.chat.view.ChatScopeElement.Config.chat-id.tooltip = The conversation the chat elements inside this one show. Every nested element that names no chat-id of its own joins this one. Defaults to default, which is also what an element outside every <chat> joins, so a page with a single conversation needs no id at all. Give one where a page holds two chats, so that each says which is which.
com.top_logic.ai.chat.view.ChatScopeElement.Config.implementation-class.tooltip = The element implementation. Hidden in the layout editor: the tag already fixes it, and changing it gives an element that no longer matches the options shown beside it.
com.top_logic.ai.chat.view.ChatScopeElement.Config.personalization-key.tooltip = Optional override for the auto-derived personalization key. Hidden in the layout editor: the key derived from the view context is the right one, and a hand-written value silently moves what a user has personalized somewhere else.
com.top_logic.ai.chat.view.ChatScopeElement.tooltip = Declarative <chat> element: the conversation its nested chat elements show. <p> The elements a chat is built from - a <chat-conversation/>, a <chat-rail/> and the sections in it - show one conversation when they agree on a chat-id. Writing that id on every one of them makes the strongest coupling on the page the least visible thing about it: a typo in one attribute opens a second, empty conversation and nothing says so. Wrapping them in a <chat> writes the id once and every element inside inherits it, so the grouping is declared where it can be read: </p> <pre> &lt;chat chat-id="support" direction="row"&gt; &lt;panel fill="true"&gt;&lt;chat-conversation input="chatSession"/&gt;&lt;/panel&gt; &lt;chat-rail&gt;...&lt;/chat-rail&gt; &lt;/chat&gt; </pre> <p> An element inside may still name a chat-id of its own; that is the override, and an element outside every <chat> joins <code>"default"</code>. </p> <p> Visually this is a <stack> and nothing more: it lays its children out in a flexbox with the configured direction, gap and alignment, and draws no chrome of its own. Any element may sit inside, chat element or not - a <chat> around a whole page is as legitimate as one around two elements. </p>
com.top_logic.ai.chat.view.ChatSectionElement.Config.badge = Badge
com.top_logic.ai.chat.view.ChatSectionElement.Config.badge.tooltip = Optional channel this section writes its count to - how many of the things it shows there are right now. The rail reads the same channel to put the number beside the section's title and on its strip icon, and sums the sections to the total the conversation's rail button shows. Leave it empty for a section that has nothing to count.
com.top_logic.ai.chat.view.ChatSectionElement.Config.chat-id = Chat id
com.top_logic.ai.chat.view.ChatSectionElement.Config.chat-id.tooltip = Which conversation this section shows, when it must not be the one the enclosing <chat> names. Leave it empty: a section inside a <chat> shows that chat, and one outside every <chat> shows default, so the pieces of one page find each other without being told. Set it only to break out of the enclosing chat.
com.top_logic.ai.chat.view.ChatSectionElement.Config.personalization-key.tooltip = Optional override for the auto-derived personalization key. Hidden in the layout editor: the key derived from the view context is the right one, and a hand-written value silently moves what a user has personalized somewhere else.
com.top_logic.ai.chat.view.ChatSectionElement.Config.react-element = React element
com.top_logic.ai.chat.view.ChatSectionElement.Config.react-element.tooltip = Registered React element that renders this section. Hidden in the layout editor: the value must match a registration in TypeScript.
com.top_logic.ai.chat.view.ChatSourcesElement = Chat sources element
com.top_logic.ai.chat.view.ChatSourcesElement.Config.class.tooltip = The element implementation. Hidden in the layout editor: the tag already fixes it, and changing it gives an element that no longer matches the options shown beside it.
com.top_logic.ai.chat.view.ChatSourcesElement.Config.react-element.tooltip = Registered React element that renders this section. Defaults to TLChatSources. Hidden in the layout editor: the value must match a registration in TypeScript.
com.top_logic.ai.chat.view.ChatSourcesElement.tooltip = Declarative <chat-sources/> element: what this conversation has cited, as a rail section. <p> One row per source, in the order the answers first cited them, with the marker numbers that point at it - a number scrolls to its answer, the row opens the source. A long list gets a filter. The optional badge channel receives how many sources there are, so the rail's badge counts the ones cited since the user last looked. </p>
com.top_logic.ai.chat.view.PageSelectionElement = Page selection element
com.top_logic.ai.chat.view.PageSelectionElement.Config.class.tooltip = The element implementation. Hidden in the layout editor: the tag already fixes it.
com.top_logic.ai.chat.view.PageSelectionElement.Config.inputs = Inputs
com.top_logic.ai.chat.view.PageSelectionElement.Config.inputs.tooltip = The channels of this page that hold its selection, the most specific first. <p> The first channel that holds one object gives the value, for example the section before the document that contains it. A channel that holds a set of exactly one object gives that object. A channel that holds nothing or several objects is skipped. When no channel holds one object, the page has no selection. </p>
com.top_logic.ai.chat.view.PageSelectionElement.Config.to = Shell channel
com.top_logic.ai.chat.view.PageSelectionElement.Config.to.tooltip = The shell channel that gets the selection of this page. <p> One of the names in <chat-channels channels="..."> of the shell. It is not a channel of this view. </p>
com.top_logic.ai.chat.view.PageSelectionElement.tooltip = Declarative <page-selection/> element: tells the chat which object this page has selected. <p> Put it into the view of a page. It shows nothing. While the page is on screen, it writes the selection of the page into a shell channel that <chat-channels> names. The conversation states that channel with <selection>. When the page leaves the screen, the element removes what it wrote. </p> <pre> &lt;page-selection to="pageSelection"&gt; &lt;inputs&gt; &lt;input channel="selectedSection"/&gt; &lt;input channel="document"/&gt; &lt;/inputs&gt; &lt;/page-selection&gt; </pre> <p> It works where a <bind> on the page's <view-ref> cannot: in a tile-stack frame and in a page that a control builds itself. See <i>chat channels</i>. </p>
com.top_logic.ai.chat.view.list.DataListElement = Data list element
com.top_logic.ai.chat.view.list.DataListElement$Emphasis = Emphasis
com.top_logic.ai.chat.view.list.DataListElement$Emphasis.tooltip = How prominently a line is shown.
com.top_logic.ai.chat.view.list.DataListElement$LineConfig = Line configuration
com.top_logic.ai.chat.view.list.DataListElement$LineConfig.tooltip = Configuration for a single line of a row - like a table <column>, but stacked.
com.top_logic.ai.chat.view.list.DataListElement$LinesConfig = Lines configuration
com.top_logic.ai.chat.view.list.DataListElement$LinesConfig.tooltip = Container for the lines of a <i>data list element</i>.
com.top_logic.ai.chat.view.list.DataListElement$RowActions = Row actions
com.top_logic.ai.chat.view.list.DataListElement$RowActions.tooltip = When a row's action trigger is shown. <p> The same three answers - and the same touch caveat - as a <panel hover-actions="...">: a trigger on every row of a long list is visual noise, so it waits for the pointer or for keyboard focus. On a touch device there is no pointer, so <i>hover</i> shows the trigger there anyway. </p>
com.top_logic.ai.chat.view.list.DataListElement.Config.class.tooltip = The element implementation. Hidden in the layout editor: the tag already fixes it, and changing it gives an element that no longer matches the options shown beside it.
com.top_logic.ai.chat.view.list.DataListElement.Config.collapsed = Collapsed
com.top_logic.ai.chat.view.list.DataListElement.Config.collapsed.tooltip = Whether the list starts collapsed. <p> The first-load state, and nothing more: it applies to every page load, and a user who expands the list has it back to this on the next one. Needs <i>collapsible</i>, as a list that cannot collapse cannot start collapsed either. </p>
com.top_logic.ai.chat.view.list.DataListElement.Config.collapsible = Collapsible
com.top_logic.ai.chat.view.list.DataListElement.Config.collapsible.tooltip = Whether the list can collapse to a narrow strip.
com.top_logic.ai.chat.view.list.DataListElement.Config.commands = Commands
com.top_logic.ai.chat.view.list.DataListElement.Config.commands.tooltip = Header buttons, rendered above the list. Each is a standard view command - a <generic-command> composing any actions (execute-script, open-dialog, write-channel, with-transaction, ...), with the usual label, image, tooltip, executability and input. A chat session list, for example, configures one command that clears the selection channel ("New chat").
com.top_logic.ai.chat.view.list.DataListElement.Config.count = Count
com.top_logic.ai.chat.view.list.DataListElement.Config.count.tooltip = Optional channel receiving how many rows the list shows, written whenever the rows change. <p> What a <chat-rail/> section reads to put a number beside its title. Unlike the chat's own sections, which count in the browser and report the number back, a list counts what it already has on the server - no round trip, and the number is right before the first paint. </p>
com.top_logic.ai.chat.view.list.DataListElement.Config.drawer-below = Drawer below
com.top_logic.ai.chat.view.list.DataListElement.Config.drawer-below.tooltip = Width of the surrounding container, in rem, below which the list becomes a drawer. <p> Below it the list keeps only its narrow strip, and its expand arrow opens the list over its neighbour instead of taking a column. The default fits a list beside a conversation and a chat rail. Set it to what the list and its neighbours need side by side; 0 keeps a column at every width. Needs <i>collapsible</i>. </p>
com.top_logic.ai.chat.view.list.DataListElement.Config.empty-text = Empty text
com.top_logic.ai.chat.view.list.DataListElement.Config.empty-text.tooltip = The text shown when the list is empty.
com.top_logic.ai.chat.view.list.DataListElement.Config.group-by = Group by
com.top_logic.ai.chat.view.list.DataListElement.Config.group-by.tooltip = Optional TL-Script function of one row computing its group label. Rows sharing a label sit under one header, in first-appearance order. Empty means no grouping (a flat list).
com.top_logic.ai.chat.view.list.DataListElement.Config.inputs = Inputs
com.top_logic.ai.chat.view.list.DataListElement.Config.inputs.tooltip = References to channels whose values become positional arguments to <i>Rows</i>.
com.top_logic.ai.chat.view.list.DataListElement.Config.lines = Lines
com.top_logic.ai.chat.view.list.DataListElement.Config.lines.tooltip = The lines shown per row, top to bottom - the vertical counterpart of a table's columns.
com.top_logic.ai.chat.view.list.DataListElement.Config.observed-types = Observed types
com.top_logic.ai.chat.view.list.DataListElement.Config.observed-types.tooltip = Types whose object changes (create / update / delete) re-run <i>Rows</i>, so the list refreshes automatically.
com.top_logic.ai.chat.view.list.DataListElement.Config.personalization-key.tooltip = Optional override for the auto-derived personalization key. Hidden in the layout editor: the key derived from the view context is the right one, and a hand-written value silently moves what a user has personalized somewhere else.
com.top_logic.ai.chat.view.list.DataListElement.Config.react-element = React element
com.top_logic.ai.chat.view.list.DataListElement.Config.react-element.tooltip = Registered React element that renders this list. Defaults to TLDataList. Hidden in the layout editor: the value must match a registration in TypeScript.
com.top_logic.ai.chat.view.list.DataListElement.Config.row-actions = Row actions
com.top_logic.ai.chat.view.list.DataListElement.Config.row-actions.tooltip = When a row shows the trigger that opens its commands.
com.top_logic.ai.chat.view.list.DataListElement.Config.row-channel = Row channel
com.top_logic.ai.chat.view.list.DataListElement.Config.row-channel.tooltip = Name of the local channel a row command reads its row from. <p> Registered by this list and visible only inside it, the way <context-menu> registers its contextTarget. Rename it only to avoid a clash with a channel of the enclosing view. </p>
com.top_logic.ai.chat.view.list.DataListElement.Config.row-commands = Row commands
com.top_logic.ai.chat.view.list.DataListElement.Config.row-commands.tooltip = Commands offered on a single row, in a menu opened from the row itself. <p> Each is the same <generic-command> a header command is, with the same label, image, clique, tooltip, executability and action chain - a rename behind an <open-dialog>, a delete behind a <confirm>. The row it was opened on reaches the command through the row channel, which is what a command names in its inputs: the scripts of its chain and its <executability> rules see the row as a variable named after the channel, and the rules re-evaluate before the menu opens. </p> <p> Rendered by the application's own context menu, so the entries look like every other menu in it and answer the same keys. A list placed where there is no menu to open - outside an <app-shell> - renders no trigger rather than a broken one. </p>
com.top_logic.ai.chat.view.list.DataListElement.Config.row-css-class = Row CSS class
com.top_logic.ai.chat.view.list.DataListElement.Config.row-css-class.tooltip = Optional TL-Script function of one row computing extra CSS classes for its row element. <p> The hook a view needs to show a row's <em>state</em> rather than only its text - a done step, a failed import, an overdue item. The result is written onto the row as it comes, so several classes are a space-separated string; what they look like is the application theme's business. </p> <p> Not css-class, which every view element has and which is the one class of the list's root element. </p>
com.top_logic.ai.chat.view.list.DataListElement.Config.rows = Rows
com.top_logic.ai.chat.view.list.DataListElement.Config.rows.tooltip = TL-Script function computing the row objects (a <i>collection</i>), same as <table>'s rows.
com.top_logic.ai.chat.view.list.DataListElement.Config.search = Search
com.top_logic.ai.chat.view.list.DataListElement.Config.search.tooltip = Whether the list shows a search field (client-side filter on the row text).
com.top_logic.ai.chat.view.list.DataListElement.Config.selection = Selection
com.top_logic.ai.chat.view.list.DataListElement.Config.selection.tooltip = Optional two-way channel holding the selected row object.
com.top_logic.ai.chat.view.list.DataListElement.Config.title = Title
com.top_logic.ai.chat.view.list.DataListElement.Config.title.tooltip = The header title shown above the list.
com.top_logic.ai.chat.view.list.DataListElement.Emphasis.PRIMARY = Primary
com.top_logic.ai.chat.view.list.DataListElement.Emphasis.PRIMARY.tooltip = The prominent line (title style).
com.top_logic.ai.chat.view.list.DataListElement.Emphasis.SECONDARY = Secondary
com.top_logic.ai.chat.view.list.DataListElement.Emphasis.SECONDARY.tooltip = A muted secondary line.
com.top_logic.ai.chat.view.list.DataListElement.LineConfig.attribute = Attribute
com.top_logic.ai.chat.view.list.DataListElement.LineConfig.attribute.tooltip = The model attribute shown on this line (the normal case). Use <i>Value</i> instead for a computed line.
com.top_logic.ai.chat.view.list.DataListElement.LineConfig.emphasis = Emphasis
com.top_logic.ai.chat.view.list.DataListElement.LineConfig.emphasis.tooltip = How prominently the line is shown. Unset means the first line is <i>primary</i> and the rest <i>secondary</i>.
com.top_logic.ai.chat.view.list.DataListElement.LineConfig.value = Value
com.top_logic.ai.chat.view.list.DataListElement.LineConfig.value.tooltip = A TL-Script function of one row computing this line's text - a computed line (a formatted value, a count) that a plain attribute cannot express.
com.top_logic.ai.chat.view.list.DataListElement.LinesConfig.lines = Lines
com.top_logic.ai.chat.view.list.DataListElement.LinesConfig.lines.tooltip = The lines to display, top to bottom.
com.top_logic.ai.chat.view.list.DataListElement.RowActions.ALWAYS = Always
com.top_logic.ai.chat.view.list.DataListElement.RowActions.ALWAYS.tooltip = Always visible.
com.top_logic.ai.chat.view.list.DataListElement.RowActions.HOVER = Hover
com.top_logic.ai.chat.view.list.DataListElement.RowActions.HOVER.tooltip = Revealed when the pointer is over the row or something in it has focus.
com.top_logic.ai.chat.view.list.DataListElement.RowActions.NONE = None
com.top_logic.ai.chat.view.list.DataListElement.RowActions.NONE.tooltip = Never rendered, whatever is configured.
com.top_logic.ai.chat.view.list.DataListElement.tooltip = Declarative <data-list> element: a model-bound, styled, grouped, searchable, selectable list - the presentation of a chat rail generalised to any model. <p> The rows come from a TL-Script rows expression, exactly as <table> binds its rows; an attribute line resolves against the row object's own type. Each row shows an ordered list of lines (the vertical counterpart of a table's columns); its group label is a further expression. A row click writes the row object to the two-way selection channel. Search and collapse are client-side. Unlike <table> this renders a styled list (the session-rail look), not a data grid; unlike <object-list> it is a selectable picker, not an in-place editor of composite items. </p> <p> <b>TEMPORARY FORK.</b> The engine has no data-bound list that renders like the navbar with selection + grouping + search. This element fills that gap in tl-ai, rendered by the TLDataList React component. <b>Upstream target:</b> a generic <data-list> in tl-layout-view; then delete this package. </p>
