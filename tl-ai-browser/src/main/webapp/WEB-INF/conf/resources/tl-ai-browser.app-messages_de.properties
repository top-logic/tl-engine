admin.ai.tool.web-browser.browserBack = Geht im Browser einen Schritt zurück.
admin.ai.tool.web-browser.browserClick = Klickt ein Element der aktuellen Browser-Seite an.
admin.ai.tool.web-browser.browserNavigate = Öffnet eine Adresse in einem echten Browser dieser Sitzung und liefert die gerenderte Seite.
admin.ai.tool.web-browser.browserSaveCookies = Speichert den Anmeldezustand des Browsers unter einem Namen für spätere Sitzungen.
admin.ai.tool.web-browser.browserScreenshot = Nimmt ein Bild der aktuellen Browser-Seite auf und speichert es in der Anwendung.
admin.ai.tool.web-browser.browserSnapshot = Liest die aktuelle Browser-Seite erneut, ohne zu navigieren.
admin.ai.tool.web-browser.browserType = Schreibt Text in ein Eingabefeld der aktuellen Browser-Seite.
admin.ai.tool.web-browser.browserUseCookies = Startet den Browser mit einem gespeicherten Anmeldezustand.
