com.top_logic.presentation.script.PptDeckFunctions.deck = Präsentation erstellen
com.top_logic.presentation.script.PptDeckFunctions.deck.param.footer.tooltip = Der Fußzeilentext, der auf jeder Folie angezeigt wird, deren Layout einen Platzhalter für die Fußzeile enthält. Eine Folie legt ihre eigene Fußzeile fest, indem sie den Fußzeilenplatzhalter in ihrem Eintrag <code>placeholders</code> füllt.
com.top_logic.presentation.script.PptDeckFunctions.deck.param.name.tooltip = Der Dateiname des Ergebnisses.
com.top_logic.presentation.script.PptDeckFunctions.deck.param.profile.tooltip = Einträge, die das Vorlagenprofil überschreiben, wie es <code>pptProfile()</code> liefert, z. B. <code>{"layouts": {"content": 10}}</code>, um Inhaltsfolien im Layout mit dem Index 10 zu erstellen, oder <code>{"roles": {"risk": "#C00000"}}</code>, um die Farbe der Farbrolle <code>risk</code> festzulegen. Wörterbücher werden Eintrag für Eintrag zusammengeführt.
com.top_logic.presentation.script.PptDeckFunctions.deck.param.slides.tooltip = Die Folien, die jeweils durch <code>pptSlide()</code> oder ein entsprechendes Wörterbuch beschrieben werden.
com.top_logic.presentation.script.PptDeckFunctions.deck.param.template.tooltip = Die PowerPoint-Vorlage (<code>.pptx</code> oder <code>.potx</code>).
com.top_logic.presentation.script.PptDeckFunctions.deck.return = Die Präsentation als <code>.pptx</code>-Datei.
com.top_logic.presentation.script.PptDeckFunctions.deck.tooltip = Erstellt eine PowerPoint-Präsentation im Design einer Vorlage. <p> Jede Folie wird auf einem Folienlayout der Vorlage erstellt: entweder auf dem in der Folienbeschreibung angegebenen Layout oder auf dem Layout der Rolle <code>content</code>. Von den Platzhaltern des Layouts zeigt die Folie nur diejenigen an, die mit Text gefüllt sind: den Titel, den Untertitel, die Fußzeile und die explizit gefüllten Platzhalter. Platzhaltertexte übernehmen den Stil der Vorlage, sofern sie nicht durch die Beschreibung formatiert werden. Die Inhaltselemente werden an ihrer Position platziert; die Elemente ohne Position werden im Inhaltsbereich des Layouts untereinander angeordnet. Texte, die nicht in ihr Element passen, werden entsprechend den Vorgaben unter <code>overflow</code> verkleinert oder abgeschnitten. Eine Tabelle, die nicht auf die Folie passt, oder ein mit <code>split</code> gekennzeichneter Text wird auf den folgenden Folien fortgesetzt. Die Beispielfolien der Vorlage sind nicht Teil des Ergebnisses. </p> <p> Beispiel: </p><pre> pptDeck($template, [ pptSlide(layout: "title", title: "Quartalsbericht", subtitle: "Q3 2026"), pptSlide(title: "Zahlen", content: pptTable([["Region", "Umsatz"], ["Nord", 12]], headerRows: 1)) ], footer: "Vertraulich", profile: {"roles": {"risk": "#C00000"}}) </pre>
com.top_logic.presentation.script.PptDeckFunctions.profile = Vorlagenprofil
com.top_logic.presentation.script.PptDeckFunctions.profile.param.template.tooltip = Die PowerPoint-Vorlage (<code>.pptx</code> oder <code>.potx</code>).
com.top_logic.presentation.script.PptDeckFunctions.profile.return = Das Wörterbuch, das das Profil der Vorlage beschreibt.
com.top_logic.presentation.script.PptDeckFunctions.profile.tooltip = Beschreibt, welche Informationen über eine Vorlage über die Folienlayouts hinaus für die Erstellung einer Präsentation erforderlich sind. <p> Das Profil wird aus den Folienlayouts der Vorlage abgeleitet und kann für jede Präsentation durch das Argument <code>profile</code> von <code>pptDeck()</code> angepasst werden. Es handelt sich um ein Wörterbuch mit den folgenden Einträgen: </p> <ul> <li><code>layouts</code>: Der Index des Folienlayouts für jede Rolle: <code>title</code> (die Titelfolie), <code>content</code> (eine Folie mit Titel und Inhalt), <code>section</code> (die erste Folie eines Abschnitts), <code>closing</code> (die letzte Folie). Eine Rolle ohne passendes Layout hat keinen Eintrag. Eine Folie verweist über den Rollennamen auf diese Layouts.</li> <li><code>slideLayouts</code>: Für jedes Folienlayout entsprechend seinem Index: dessen <code>name</code>, der Index des Platzhalters, der die <code>subtitle</code> aufnimmt, der Index des Platzhalters, der die <code>footer</code> aufnimmt, sowie die <code>contentArea</code> (<code>x</code>, <code>y</code>, <code>width</code>, <code>height</code> in Punkten), in dem die Inhaltselemente ohne Position angeordnet werden.</li> <li><code>roles</code>: Die Farbe für jeden Farbrollennamen. Ein abgeleitetes Profil definiert keine Farbrollen.</li> <li><code>gap</code>: Der Abstand in Punkten zwischen den Elementen einer Zeile oder Spalte, die keinen eigenen angibt, sowie zwischen den untereinander angeordneten Inhaltselementen einer Folie (Standardwert 17).</li> <li><code>minFontSize</code>: Die kleinste Schriftgröße in Punkten, auf die ein Text verkleinert wird, um in sein Element zu passen (Standardwert 10).</li> <li><code>continuationSuffix</code>: Der Text, der an den Titel einer Folie angehängt wird, wenn eine Tabelle oder ein Text der vorherigen Folie fortgesetzt wird, getrennt durch ein Leerzeichen. Der Standardwert lautet „(Forts.)“ in der Sprache des aktuellen Benutzers.</li> </ul> <p> Das Inhaltslayout ist ein Layout mit einem Titel und einem einzigen großen Textplatzhalter, dessen Bereich zum Inhaltsbereich wird. Ein Layout ohne einen solchen Platzhalter bietet den Bereich zwischen Titel (oder Untertitel) und Fußzeile. Der Untertitel ist ein Platzhalter direkt unter dem Titel, die Fußzeile ein Platzhalter am unteren Rand der Folie. </p>
