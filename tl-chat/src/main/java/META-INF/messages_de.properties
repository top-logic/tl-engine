com.top_logic.ai.chat.layout.PromptImprovementProcessor.Failure.DISABLED.tooltip = Die Prompt-Verbesserung ist nicht konfiguriert.
com.top_logic.ai.chat.layout.PromptImprovementProcessor.Failure.INVALID_REQUEST = Ungültige Anfrage
com.top_logic.ai.chat.layout.PromptImprovementProcessor.Failure.INVALID_REQUEST.tooltip = Die Browseranfrage ist fehlerhaft.
com.top_logic.ai.chat.layout.PromptImprovementProcessor.Failure.MISSING_AGENT = Fehlender Agent
com.top_logic.ai.chat.layout.PromptImprovementProcessor.Failure.MISSING_AGENT.tooltip = Der konfigurierte Agent ist nicht vorhanden.
com.top_logic.ai.chat.sched.AgentTask = Agentenaufgabe
com.top_logic.ai.chat.sched.AgentTask.Config.agent = Agent
com.top_logic.ai.chat.sched.AgentTask.Config.agent.tooltip = Name des auszuführenden Agenten. <p> Lassen Sie das Feld leer, um den Einstiegs-Agenten der Anwendung auszuführen – genau das geschieht bei einer Chat-Nachricht ohne explizite Auswahl. Das Konto, unter dem diese Aufgabe ausgeführt wird, muss berechtigt sein, den genannten Agenten auszuführen, genau wie im Chat. </p>
com.top_logic.ai.chat.sched.AgentTask.Config.approval-mode = Genehmigungsmodus
com.top_logic.ai.chat.sched.AgentTask.Config.approval-mode.tooltip = Wie die Tool-Aufrufe des Laufs genehmigt werden. <p><i>Die automatische Genehmigung</i>, die Standardeinstellung, ist der einzige Modus, der unbeaufsichtigt abläuft: Der Agent bestätigt seine eigenen Aufrufe selbst und unterliegt stattdessen der <background-allowlist> der Tool-Zugriffsrichtlinie. <i>Im manuellen Modus</i> wird festgelegt, dass eine Person antworten muss – dies kann jedes Fenster des „Run-as“-Kontos tun – und jeder genehmigungsbedürftige Aufruf wartet auf diese Antwort, bis zum Ablauf des Interaktions-Timeouts von 30 Minuten. </p>
com.top_logic.ai.chat.sched.AgentTask.Config.prompt = Prompt
com.top_logic.ai.chat.sched.AgentTask.Config.prompt-expression = Prompt-Ausdruck
com.top_logic.ai.chat.sched.AgentTask.Config.prompt-expression.tooltip = TL-Script, das die an den Agenten zu übermittelnde Nachricht berechnet und zu Beginn jedes Durchlaufs ausgewertet wird. <p> Die Alternative zu <i>Prompt</i> für eine Aufgabe, deren Meldung davon abhängt, was die Anwendung zu diesem Zeitpunkt enthält – „das sind die bereits zusammengefassten Rechnungen, nimm den Rest“. Der Ausdruck nimmt keine Argumente entgegen und sein Ergebnis wird als Text verwendet. </p> <p> Konfigurieren Sie entweder dies oder <i>Prompt</i>, nicht beides und auch nicht keines von beiden. </p>
com.top_logic.ai.chat.sched.AgentTask.Config.prompt.tooltip = Die Nachricht, die an den Agenten gesendet werden soll, als Klartext. <p> Schreiben Sie sie als Element, damit ein mehrzeiliger Prompt lesbar bleibt: <prompt>Fassen Sie die heute erfassten Rechnungen zusammen.</prompt> Verwenden Sie stattdessen <i>den Prompt-Ausdruck</i>, wenn die Nachricht Anwendungsdaten benennen muss. </p>
com.top_logic.ai.chat.sched.AgentTask.Config.record-session = Sitzung aufzeichnen
com.top_logic.ai.chat.sched.AgentTask.Config.record-session.tooltip = Ob der Durchlauf als Chat-Sitzung des „Run-as“-Kontos aufgezeichnet wird. <p> Standardmäßig aktiviert – und der Grund, warum diese Aufgabe überhaupt über den Chat läuft: Die Sitzung erscheint im Chatverlauf dieses Kontos zusammen mit dem Protokoll der vom Agenten durchgeführten Aktionen. Deaktivieren Sie diese Option für eine Aufgabe, die ausschließlich wegen ihrer Auswirkungen ausgeführt werden soll; der Durchlauf hinterlässt dann kein Protokoll, sondern nur die von den Tools geschriebenen Daten und die Angaben im Protokoll. </p>
com.top_logic.ai.chat.sched.AgentTask.Config.run-as = Ausführen als
com.top_logic.ai.chat.sched.AgentTask.Config.run-as.tooltip = Anmeldename des Kontos, unter dem der Lauf ausgeführt wird. <p> Der Prinzipal des Laufs: Seine Rollen legen fest, welche Tools der Agent verwenden und welche Agenten er ausführen darf, und seine Zugriffsrechte bestimmen, auf welche Objekte diese Tools zugreifen dürfen. Die aufgezeichnete Chat-Sitzung gehört zu diesem Konto und erscheint in dessen Chat-Verlauf. Standardmäßig ist das Root-Konto eingestellt. </p>
com.top_logic.ai.chat.sched.AgentTask.Config.session-title = Titel der Sitzung
com.top_logic.ai.chat.sched.AgentTask.Config.session-title.tooltip = Titel der aufgezeichneten Chat-Sitzung. <p> Standardmäßig ist dies der Name der Aufgabe. Bei jedem Durchlauf wird eine eigene Sitzung erstellt, sodass der Titel dazu dient, die Durchläufe einer Aufgabe von den übrigen Chats des Kontos zu unterscheiden – nicht einzelne Durchläufe voneinander; dafür sorgt der Zeitstempel der Sitzung. </p>
com.top_logic.ai.chat.sched.AgentTask.tooltip = Eine Scheduler-Aufgabe, die einem benannten Agenten eine Prompt übermittelt und die Ausführung als Chat-Sitzung aufzeichnet. <p> Der Sinn darin, den Agenten <em>über den Chat</em> statt im Headless-Modus auszuführen, liegt im Transkript: Ein geplanter Lauf erscheint im Chat-Verlauf des Kontos, unter dem er ausgeführt wurde, direkt neben den eigenen Unterhaltungen dieses Kontos, und kann dort geöffnet, gelesen und fortgesetzt werden. AgentRunner würde denselben Agenten mit weniger Aufwand ausführen, hinterlässt jedoch lediglich einen Ausführungsdatensatz und keine Chat-Sitzung, die der Benutzer öffnen kann. Alles andere, was diese Aufgabe tut – der Tracker, der Genehmigungsmodus, die Untersitzung – ergibt sich aus dieser Vorgehensweise. </p> <p> Wird wie jede andere Aufgabe in der Dienstkonfiguration des Schedulers konfiguriert: </p><pre> &lt;task class="com.top_logic.ai.chat.sched.AgentTask" name="DailyInvoiceSummary" agent="Albert" run-as="root" run-on-startup="false" &gt; &lt;prompt&gt;Fasse die heute erfassten Rechnungen zusammen.&lt;/prompt&gt; &lt;schedules&gt; &lt;daily time-of-day="18:00"/&gt; &lt;/schedules&gt; &lt;/task&gt; </pre> <p><b>Es ist niemand anwesend.</b> Ein geplanter Lauf verfügt über kein Browserfenster, daher können keine Fragen gestellt werden. Im standardmäßigen Modus <i>zur automatischen Genehmigung</i> markiert die Aufgabe ihren Tracker als unbeaufsichtigt: Der Lauf wird durch die <background-allowlist> der Richtlinie begrenzt statt durch eine Genehmigungsabfrage, und „askUser“ antwortet dem Modell sofort, anstatt den Lauf bis zum Ablauf des Interaktions-Timeouts zu pausieren. Siehe doc/scheduled-agent.md. </p> <p> Nicht zu verwechseln mit tl.ai.execution:AgentTask, bei dem es sich um einen Eintrag im Plan handelt, den ein Agent während seiner Arbeit erstellt. Hier handelt es sich um ein com.top_logic.util.sched.task.Task – einen geplanten Auftrag. </p>
com.top_logic.ai.chat.view.AgentViewRefreshService = Aktualisierungsdienst für die Agentenansicht
com.top_logic.ai.chat.view.AgentViewRefreshService$WindowAccess = Zugang zum Fenster
com.top_logic.ai.chat.view.AgentViewRefreshService$WindowAccess.tooltip = Was ist aus dem Thread „Hintergrund schreiben“ geworden, um den in einem Browserfenster gebeten wurde?
com.top_logic.ai.chat.view.AgentViewRefreshService.Config.lock-timeout-millis = Sperr-Timeout in Millisekunden
com.top_logic.ai.chat.view.AgentViewRefreshService.Config.lock-timeout-millis.tooltip = Wie lange eine Aktualisierung in Millisekunden auf die Interaktion eines Fensters wartet. <p> Die Interaktion wird gehalten, während dieses Fenster einen Browserbefehl ausführt, und ein solcher Befehl generiert die Modellereignisse selbst, sobald er abgeschlossen ist – daher kostet das Aufgeben nichts außer einer geringen Latenz, während das Warten einen Scheduler-Thread hinter einem langsamen Befehl blockieren würde. </p>
com.top_logic.ai.chat.view.AgentViewRefreshService.Config.refresh-delay-millis = Aktualisierungsverzögerung in Millisekunden
com.top_logic.ai.chat.view.AgentViewRefreshService.Config.refresh-delay-millis.tooltip = Wie lange Änderungen gesammelt werden, bevor die Fenster aktualisiert werden (in Millisekunden). <p> Ein Durchgang, der fünf Aufgaben in einer Sekunde abhakt, darf nicht fünf Aktualisierungen kosten. Erhöhen Sie diesen Wert, um Unmittelbarkeit gegen eine höhere Belastung einzutauschen; dies ist die Obergrenze dafür, wie lange ein Fenster hinter dem Durchlauf zurückbleibt. </p>
com.top_logic.ai.chat.view.AgentViewRefreshService.Config.write-timeout-millis = Schreib-Timeout in Millisekunden
com.top_logic.ai.chat.view.AgentViewRefreshService.Config.write-timeout-millis.tooltip = Wie lange ein Schreibvorgang in ein Fenster auf die Interaktion dieses Fensters wartet, in Millisekunden. <p> Länger als <i>die „Lock-Timeout-Millisekunden“</i> und aus dem gegenteiligen Grund: Eine Aktualisierung, die abgebrochen wird, verliert nichts, da der Befehl, der die Interaktion hält, nach Abschluss dieselben Ereignisse synthetisiert. Ein Schreibvorgang hat keine solche zweite Chance – niemand sonst wird den Wert des Agenten auf den Kanal setzen –, daher bedeutet das Aufgeben, dem Modell mitzuteilen, dass die Seite nicht erreicht werden konnte. </p>
com.top_logic.ai.chat.view.AgentViewRefreshService.WindowAccess.BUSY = Beschäftigt
com.top_logic.ai.chat.view.AgentViewRefreshService.WindowAccess.BUSY.tooltip = Das Fenster ist zwar vorhanden, war jedoch länger mit einem Browserbefehl beschäftigt, als <i>die Schreib-Timeout-Dauer in Millisekunden</i> (<i>Konfiguration des Aktualisierungsdienstes für die Agentenansicht</i>) zulässt. Es wurde nichts geschrieben; der Schreibvorgang kann erneut versucht werden.
com.top_logic.ai.chat.view.AgentViewRefreshService.WindowAccess.DONE = Fertig
com.top_logic.ai.chat.view.AgentViewRefreshService.WindowAccess.DONE.tooltip = Das Fenster wurde erreicht und der Schreibvorgang wurde ausgeführt.
com.top_logic.ai.chat.view.AgentViewRefreshService.WindowAccess.NO_WINDOW = Kein Fenster
com.top_logic.ai.chat.view.AgentViewRefreshService.WindowAccess.NO_WINDOW.tooltip = Dieser Durchlauf hat kein Fenster: Es handelt sich um einen kopflosen Durchlauf, einen geplanten Durchlauf oder einen Durchlauf, dessen Browserfenster geschlossen wurde. Es wurde nichts geschrieben, und es kann auch nichts geschrieben werden.
com.top_logic.ai.chat.view.AgentViewRefreshService.tooltip = Sorgt dafür, dass die modellgebundenen Ansichtselemente eines geöffneten Chat-Fensters den Eingaben eines laufenden Agenten folgen. <p> Ein Agent läuft in einem Hintergrund-Thread und führt seine Änderungen über den Writer-Thread <i>des Agent-Ausführungsspeichers</i> durch. Ein Browserfenster erfährt erst dann von einem solchen Commit, wenn sein „GlobalModelEventForwarder“ aufgefordert wird, die ausstehenden Modellereignisse zu synthetisieren. Derzeit geschieht dies bei einem Browserbefehl oder beim SSE-Heartbeat – ohne diesen Dienst würde daher ein „ <data-list> “ über die Aufgaben des Agenten bis zu 30 Sekunden lang stillstehen, während der Lauf diese abarbeitet. </p> <p> Der Dienst wartet auf festgeschriebene Änderungen, fasst sie zusammen (viele Aufgabenaktualisierungen innerhalb eines Durchgangs erfordern eine Aktualisierung, siehe <i>„Refresh delay millis“</i>) und synthetisiert dann für jedes registrierte Fenster des betroffenen Kontos die Ereignisse in der Untersitzung dieses Fensters und <em>innerhalb der Interaktion des Fensters</em>, so wie es die eigene Anforderungsverarbeitung der Engine tut. Die Interaktion ist das, was dies neben einem Browserbefehl sicher macht: Die Zustandszuordnung eines React-Steuerelements ist eine einfache HashMap, sodass das gleichzeitige Einfügen von Zuständen aus zwei Threads diese beschädigen würde. (Der SSE-Heartbeat der Engine synthetisiert ohne sie; dieser Dienst übernimmt das bewusst nicht.) Sie wird mit einem Zeitlimit betreten, siehe <i>„Fensterinteraktion</i>“. </p> <p><b>Das Zusammenführen lässt keine Änderung außer Acht.</b> Ein Durchlauf dauert eine gewisse Zeit – er tritt in jede registrierte Untersitzung eines Fensters ein und wartet auf die Interaktion dieses Fensters – und der Agent schreibt währenddessen fortlaufend. Eine Änderung, die während eines laufenden Durchlaufs eintrifft, wird daher in den nächsten Durchlauf übernommen, anstatt in den laufenden integriert zu werden, der seinen Stapel bereits abgearbeitet hat; <i>ausstehende Aktualisierungen</i> sind der Kern dieser Regel. Ohne diese Funktion würde eine solche Änderung verworfen, und die betroffene Zeile bliebe unverändert, bis ein unabhängiges Ereignis die Modellereignisse des Fensters neu generiert – ein Browserbefehl oder der 30-Sekunden-Heartbeat, falls das Fenster noch über einen solchen verfügt (#497). </p> <p><b>TEMPORÄRE ABZWEIGUNG.</b> Das Aufzählen der aktiven Fenster eines Kontos wird von der Engine nicht angeboten, daher führt dieser Dienst ein eigenes schwaches Register, das während der Darstellung eines Chats durch <i>die Chat-Ansichtsbindung</i> gespeist wird – was bedeutet, dass nur Fenster aktualisiert werden, die ein Chat-Element enthalten. <b>Vorgeschlagenes Ziel:</b> Die Engine sollte Modellereignisse selbstständig an jedes aktive Fenster weiterleiten, wenn ein Hintergrund-Thread Änderungen festschreibt, und eine Möglichkeit bieten, die Fenster einer Sitzung aufzulisten; anschließend sollte diese Klasse gelöscht werden. </p>
com.top_logic.ai.chat.view.ChatConversationElement = Chat-Konversationselement
com.top_logic.ai.chat.view.ChatConversationElement$Actions = Aktionen
com.top_logic.ai.chat.view.ChatConversationElement$Actions.tooltip = Die Zeile mit Kopieren, Bewertung und Neu erzeugen sowie benannte Host-Aktionen.
com.top_logic.ai.chat.view.ChatConversationElement$Context = Kontext
com.top_logic.ai.chat.view.ChatConversationElement$Context.tooltip = Was eine Seite dem Agenten über die Situation mitteilt, in der sich der Benutzer befindet. <p> Verknüpft mit TL-Script, so wie <data-list> seine Zeilen verknüpft: Die Eingaben sind Kanäle dieser Seite, deren aktuelle Werte zu den führenden Argumenten des Wertausdrucks jeder Tatsache werden. Die Ausdrücke werden auf dem Server im Kontext des handelnden Nutzers ausgewertet und bei jeder Änderung eines Eingabewerts neu ausgewertet – was also mit einer Nachricht übertragen wird, ist das, was die Seite zum Zeitpunkt des Versendens anzeigte. </p> <p> Fakten, die die Anwendung einmal festlegt und die für die gesamte Konversation gelten, sind stabil und werden in die Systemaufforderung gerendert. Ein Fakt, der sich während der Konversation ändert, darf nicht stabil sein: Der Umgebungsblock steht vor jeder Anfrage dieser Konversation und muss byteweise identisch bleiben, sonst verfehlt der Prompt-Cache des Anbieters jeden Turn. Ein solcher Fakt wird stattdessen in den Turn-Kontextblock <turn-context> eingesetzt, der im Turn selbst neben dem Text des Benutzers mitgeführt wird. </p>
com.top_logic.ai.chat.view.ChatConversationElement$Controls = Bedienelemente
com.top_logic.ai.chat.view.ChatConversationElement$Controls.tooltip = Die Picker- und Footer-Schalter am Composer.
com.top_logic.ai.chat.view.ChatConversationElement$Fact = Fakt
com.top_logic.ai.chat.view.ChatConversationElement$Fact.tooltip = Auf jeder Seite wird eine Tatsache zur Situation dargelegt.
com.top_logic.ai.chat.view.ChatConversationElement$Mention = Erwähnung
com.top_logic.ai.chat.view.ChatConversationElement$Mention.tooltip = Deklarative Bindung, mit der @ jedes beliebige Modellobjekt erwähnen kann. <p> Die Bindung erfolgt mit TL-Script auf dieselbe Weise wie bei „ <data-list> “: „rows“ berechnet die Objekte, die @ anbieten kann; „label“ und „text“ berechnen, was angezeigt wird und welchen zitierten Text die Erwähnung in die Nachricht einfügt. Jede Erwähnung enthält die ID des Objekts, wie sie von den Tools des Agenten gelesen wird, sodass der Agent das Objekt mit „getInstance“ abrufen kann. Kandidaten werden an den Browser übermittelt und dort während der Eingabe des Nutzers gefiltert; halten Sie die Menge daher mithilfe von „rows“ und „limit“ überschaubar. </p>
com.top_logic.ai.chat.view.ChatConversationElement$Prompt = Fragenkarte
com.top_logic.ai.chat.view.ChatConversationElement$Prompt.tooltip = Eine Frage, die diese Seite dem Nutzer anbietet.
com.top_logic.ai.chat.view.ChatConversationElement$Prompts = Fragenkarten
com.top_logic.ai.chat.view.ChatConversationElement$Prompts.tooltip = Die ersten Fragen, die diese Seite anbietet, erscheinen als Karten unter der Begrüßung eines neuen Chats. <p> Ein neuer Chat ist der einzige Bildschirm, auf dem ein Nutzer nichts hat, worauf er reagieren kann, und eine Seite weiß besser als der Chat, welche Fragen dort gestellt werden sollten. Daher gibt die Anwendung hier die Fragen vor, und der Nutzer klickt auf eine davon, anstatt sie einzutippen. </p> <p> Die Karten befinden sich zwischen der Begrüßung und dem Eingabefeld und ausschließlich dort: Einem Gespräch, das der Nutzer aus der Liste geöffnet hat, fehlt es nicht an einer ersten Frage, unabhängig davon, ob es einen Gesprächszug enthält oder nicht. Das ist die Regel, keine Standardeinstellung – es gibt nichts, was man deaktivieren könnte. </p> <p> Verknüpft mit TL-Script, so wie <i>Context</i> seine Fakten verknüpft: Die Eingaben sind Kanäle dieser Seite, deren aktuelle Werte zu den führenden Argumenten des Wertausdrucks jeder Karte werden, die auf dem Server im Kontext des aktiven Nutzers ausgewertet und bei jeder Änderung einer Eingabe neu ausgewertet werden. Eine Karte kann daher benennen, was die Seite gerade anzeigt – „ <em>Diese</em> Rechnung zusammenfassen“ –, anstatt nur einen festen Satz wiederzugeben. </p> <p> Ein Klick darauf schreibt den ausgewerteten Text in den Composer, genau wie es eine Anwendung tut, die in den Entwurfskanal schreibt, und der Composer meldet ihn zurück an diesen Kanal. Es wird nichts gesendet. </p>
com.top_logic.ai.chat.view.ChatConversationElement$Selection = Auswahl
com.top_logic.ai.chat.view.ChatConversationElement$Selection.tooltip = Die aktuelle Auswahl der Seite, die dem Agenten als eine Tatsache pro Runde mitgeteilt wird. <p> Die einzeilige Form dessen, was <i>„fact“</i> auf umständliche Weise ausdrücken kann. Der dabei erzeugte Wert benennt das ausgewählte Objekt dreifach – die Bezeichnung, die der Benutzer sieht, den qualifizierten Typnamen und den Bezeichner, den jedes Tool zurückgibt –, sodass der Agent sowohl die Frage „Welches habe ich geöffnet?“ beantworten als auch entsprechend handeln kann. Die genaue Form finden Sie unter <i>„Chat-Auswahl</i> “. </p> <p> Es handelt sich um eine Angabe des Blocks „ <turn-context> “ und niemals um die Systemaufforderung: Eine Auswahl ist der Wert, der sich in einer Unterhaltung am häufigsten ändert, und der Umgebungsblock muss über alle Runden hinweg byteweise identisch bleiben, da sonst der Prompt-Cache jedes Anbieters fehlschlägt. </p>
com.top_logic.ai.chat.view.ChatConversationElement$Trace = Detailgrad
com.top_logic.ai.chat.view.ChatConversationElement$Trace.tooltip = Wie viel von der Ausführung des Agenten das Transkript zeigt. Eine einzige Einstellung: sie ersetzt den früheren getrennten Trace-Modus und die Laufzusammenfassung. „Zusammenfassung“ ist die eingeklappte, aber aufklappbare Laufzusammenfassung, die der Benutzer per Klick öffnet.
com.top_logic.ai.chat.view.ChatConversationElement.Actions.copy = Kopieren
com.top_logic.ai.chat.view.ChatConversationElement.Actions.copy.tooltip = Ob eine fertige Antwort kopiert werden kann.
com.top_logic.ai.chat.view.ChatConversationElement.Actions.host = Host
com.top_logic.ai.chat.view.ChatConversationElement.Actions.host.tooltip = Registrierte Namen für Nachrichten-Aktionen (im Code definierte Namenskomponenten). Unbekannte Namen werden mit einer Debug-Zeile ignoriert; sie führen nicht zu einem Fehler in der Ansicht. Im Layout-Editor ausgeblendet: Die Werte müssen mit den Registrierungen in TypeScript übereinstimmen.
com.top_logic.ai.chat.view.ChatConversationElement.Actions.rate = Bewertung
com.top_logic.ai.chat.view.ChatConversationElement.Actions.rate.tooltip = Ob eine fertige Antwort bewertet werden kann.
com.top_logic.ai.chat.view.ChatConversationElement.Actions.regenerate = Neu erzeugen
com.top_logic.ai.chat.view.ChatConversationElement.Actions.regenerate.tooltip = Ob die letzte Antwort erneut erzeugt werden kann.
com.top_logic.ai.chat.view.ChatConversationElement.Actions.timestamp = Zeitstempel
com.top_logic.ai.chat.view.ChatConversationElement.Actions.timestamp.tooltip = Ob der Zeitstempel der Antwort angezeigt wird.
com.top_logic.ai.chat.view.ChatConversationElement.Config.actions = Aktionen
com.top_logic.ai.chat.view.ChatConversationElement.Config.actions.tooltip = Welche Befehle unter einer fertigen Antwort stehen.
com.top_logic.ai.chat.view.ChatConversationElement.Config.agent = Agent
com.top_logic.ai.chat.view.ChatConversationElement.Config.agent.tooltip = Optionaler bidirektionaler Kanal, der den Namen des Agenten trägt, auf den der Composer eingestellt ist. Der Composer schreibt die Wahl des Benutzers und folgt einem Schreibvorgang von außen. Ein leerer Kanal sagt nichts und lässt die Auswahl unberührt. Ein Name, den dieses Konto nicht ausführen darf, wird ignoriert; der Agent des Composers wird dann zurückgeschrieben.
com.top_logic.ai.chat.view.ChatConversationElement.Config.busy = Beschäftigt
com.top_logic.ai.chat.view.ChatConversationElement.Config.busy.tooltip = Der optionale Ausgabekanal wird auf „true“ gesetzt, während der Agent arbeitet.
com.top_logic.ai.chat.view.ChatConversationElement.Config.chat-id = Chat-ID
com.top_logic.ai.chat.view.ChatConversationElement.Config.chat-id.tooltip = Welche Unterhaltung dieses Element zeigt, wenn es nicht die des umgebenden „ <chat> “ sein darf. Leer lassen: Ein Element in einem „ <chat> “ zeigt dessen Unterhaltung, ein Element außerhalb jedes „ <chat> “ die Unterhaltung „default“, sodass die Teile einer Seite einander finden, ohne dass es ihnen gesagt wird. Nur setzen, um aus dem umgebenden Chat auszubrechen, etwa für eine zweite Unterhaltung neben der ersten.
com.top_logic.ai.chat.view.ChatConversationElement.Config.citation-renderer = Zitier-Renderer
com.top_logic.ai.chat.view.ChatConversationElement.Config.citation-renderer.tooltip = Name des registrierten Zitier-Renderers (bezeichnet eine im Code eingerichtete Komponente). Bei leerem Wert wird das integrierte Zitier-Popover beibehalten. Im Layout-Editor ausgeblendet: Der Wert muss mit einer Registrierung in TypeScript übereinstimmen.
com.top_logic.ai.chat.view.ChatConversationElement.Config.citations = Quellenangaben
com.top_logic.ai.chat.view.ChatConversationElement.Config.citations.tooltip = Ob die Antwort ihre zitierten Quellen überhaupt anzeigt: die Inline-Markierungen und die „Quellen“-Spalte pro Antwort. Mit „Aus“ wird die gesamte Zitierfläche aus dem Transkript entfernt.
com.top_logic.ai.chat.view.ChatConversationElement.Config.class.tooltip = Die Implementierung des Elements. Im Layout-Editor ausgeblendet: Das Tag legt sie bereits fest, und eine Änderung ergibt ein Element, das nicht mehr zu den daneben angezeigten Optionen passt.
com.top_logic.ai.chat.view.ChatConversationElement.Config.context = Kontext
com.top_logic.ai.chat.view.ChatConversationElement.Config.context.tooltip = Was diese Seite dem Agenten über die Situation mitteilt, in der sich der Benutzer befindet. <p> Die Fakten werden aus den Kanälen dieser Seite berechnet und werden mit jeder Nachricht des Benutzers weitergeleitet, wobei das System die stabilen Fakten in den Umgebungsblock der System-Eingabeaufforderung überträgt. Der eigentliche Nachrichtentext des Benutzers wird dabei nie verändert – das Transkript zeigt genau das, was der Benutzer geschrieben hat. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.controls = Bedienelemente
com.top_logic.ai.chat.view.ChatConversationElement.Config.controls.tooltip = Welche Auswahlfelder und Fußzeilenelemente der Composer anzeigt.
com.top_logic.ai.chat.view.ChatConversationElement.Config.draft = Entwurf
com.top_logic.ai.chat.view.ChatConversationElement.Config.draft.tooltip = Optionaler bidirektionaler Kanal, der den noch nicht gesendeten Text des Composers trägt. <p> Der Composer meldet, was der Benutzer getippt hat - bei einer Tipppause, wenn das Feld den Fokus verliert und unmittelbar vor dem Senden - und folgt einem Schreibvorgang von außen: Der geschriebene Text ersetzt den Entwurf, der Composer erhält den Fokus, und der Cursor steht am Ende. Gesendet wird weiterhin vom Benutzer, sodass eine vom Host geschriebene Frage gelesen werden kann, bevor sie hinausgeht. </p> <p> Ein leerer Schreibvorgang löscht den Entwurf; „null“ sagt nichts und lässt den Composer in Ruhe - das ist es, was ein unbeschriebener Kanal trägt. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.effort = Aufwand
com.top_logic.ai.chat.view.ChatConversationElement.Config.effort.tooltip = Optionaler bidirektionaler Kanal, der trägt, wie angestrengt das Modell denken darf. Eine der Aufwandstufen, die das gewählte Modell anbietet, leer für keine. Wird geschrieben und befolgt wie <i>Agent</i>; eine Stufe, die das Modell nicht kennt, verwirft der Composer - genau wie die Wahl der Aufwandsauswahl selbst.
com.top_logic.ai.chat.view.ChatConversationElement.Config.input = Eingabe
com.top_logic.ai.chat.view.ChatConversationElement.Config.input.tooltip = Optionaler Kanal, der die geöffnete AgentSession enthält. Die Konversation erfolgt nach einem Schreibvorgang. Bitte leer lassen, wenn die Konversation ausschließlich über die Chat-ID mit den anderen Chat-Elementen kommunizieren soll.
com.top_logic.ai.chat.view.ChatConversationElement.Config.mcp-servers = MCP-Server
com.top_logic.ai.chat.view.ChatConversationElement.Config.mcp-servers.tooltip = Optionaler bidirektionaler Kanal, der die Namen der MCP-Server trägt, die der nächsten Runde beigegeben sind. Eine Sammlung von Namen oder ein einzelner Name. Wird geschrieben und befolgt wie <i>Agent</i>; ein leerer Kanal sagt nichts, eine leere Sammlung gibt dagegen gar keinen Server bei.
com.top_logic.ai.chat.view.ChatConversationElement.Config.mention = Erwähnung
com.top_logic.ai.chat.view.ChatConversationElement.Config.mention.tooltip = Deklarative @-Erwähnungsbindung: Ermöglicht es, mit @ ein beliebiges Modellobjekt anzubieten, das mit TL-Script konfiguriert wurde, wie z. B. <data-list>. Wenn diese Option gesetzt ist, liefert sie die @-Kandidaten und hat Vorrang vor <i>der Referenzquelle</i>.
com.top_logic.ai.chat.view.ChatConversationElement.Config.menu-items = Menüeinträge
com.top_logic.ai.chat.view.ChatConversationElement.Config.menu-items.tooltip = Registrierte Namen von Composer-Menüeinträgen. Im Layout-Editor ausgeblendet: Die Werte müssen mit den Registrierungen in TypeScript übereinstimmen.
com.top_logic.ai.chat.view.ChatConversationElement.Config.model = Modell
com.top_logic.ai.chat.view.ChatConversationElement.Config.model.tooltip = Optionaler bidirektionaler Kanal, der den Namen des Modells trägt, auf dem die nächste Runde läuft. Wird geschrieben und befolgt wie <i>Agent</i>. Die Wahl eines Agenten setzt hier das Modell, das diesem Agenten zugewiesen ist, sodass ein Host das Modell sieht, auf dem eine Runde tatsächlich liefe.
com.top_logic.ai.chat.view.ChatConversationElement.Config.personalization-key.tooltip = Optionale Überschreibung des automatisch abgeleiteten Personalisierungsschlüssels. Im Layout-Editor ausgeblendet: Der aus dem Ansichtskontext abgeleitete Schlüssel ist der richtige, und ein von Hand eingetragener Wert verschiebt stillschweigend, was ein Benutzer personalisiert hat.
com.top_logic.ai.chat.view.ChatConversationElement.Config.placeholder = Platzhalter
com.top_logic.ai.chat.view.ChatConversationElement.Config.placeholder.tooltip = Die Einladung, die im leeren Eingabefeld steht, in den Worten dieser Anwendung. <p> Hier als Text je Sprache geschrieben oder als Schlüssel eines solchen Textes. Leer behält den Wortlaut des Chats selbst bei - das, was jede Anwendung erhielt, bevor es diese Option gab. </p> <p> Es ist <em>nur</em> die Einladung im Ruhezustand. Während der Agent arbeitet, steht im Feld weiterhin „Nächste Nachricht schreiben …“, denn dieser Satz handelt vom laufenden Vorgang und nicht von dieser Anwendung; eine Anwendung, die ihn ersetzt, fordert den Nutzer auf, etwas zu beginnen, das bereits läuft. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.present = Präsentierbare Kanäle
com.top_logic.ai.chat.view.ChatConversationElement.Config.present.tooltip = Die Kanäle, in die der Agent auf dieser Seite schreiben darf, durch Kommas getrennt - die Zulassungsliste des "present"-Tools. <p><b>Standardmäßig wird der Zugriff verweigert.</b> Ein leerer Wert bedeutet, dass der Agent in keinen Kanal dieser Seite schreiben darf, und ein Aufruf, der einen anderen Kanal nennt, wird mit einer Meldung abgelehnt, in der die vorhandenen Namen aufgeführt werden. Die Nennung eines Kanals hier ist eine Entscheidung darüber, welchen Teil der Seite der Agent steuern darf; daher wird dies direkt im Element festgelegt und nicht aus der zufälligen Verkabelung an einer beliebigen Stelle in der Ansicht abgeleitet. </p> <p> Die Kanäle zählen, solange dieses Element angezeigt wird. Einem Lauf, dessen Seite kein Element anzeigt, das einen Kanal nennt, wird das "present"-Tool gar nicht erst angeboten: Der Agent beantwortet die Bitte, Objekte zu sehen, dann im Text statt mit einem Aufruf, der abgelehnt wird. </p> <p> Der Agent schreibt die Objekte, nicht die Darstellung: Wie der Wert aussieht, hängt davon ab, welches Element diesen Kanal ausliest – ein Fenster von <chat-rail>, ein <form> oder ein <data-list>. In der Regel ist es ein Kanal, nämlich der, den das Fenster ausliest: present="paneObject". </p> <p> Ein Lauf ohne Browserfenster – headless, TL-Script, der Scheduler – hat überhaupt keine Kanäle, unabhängig davon, was hier steht; das Tool meldet dies und unternimmt nichts. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.prompt-improver-agent = Agent zur Prompt-Verbesserung
com.top_logic.ai.chat.view.ChatConversationElement.Config.prompt-improver-agent.tooltip = Name des Agenten, der Prompt-Entwürfe verbessert. Leer lassen, um die Prompt-Verbesserung abzuschalten.
com.top_logic.ai.chat.view.ChatConversationElement.Config.prompts = Fragenkarten
com.top_logic.ai.chat.view.ChatConversationElement.Config.prompts.tooltip = Die ersten Fragen, die diese Seite anbietet, als Karten, auf die der Nutzer klickt, statt sie einzutippen. <p> Ein Klick füllt den Composer; gesendet wird nichts. Der Nutzer liest den Satz und drückt auf „Senden“ – es gilt dieselbe Regel wie für die Kanäle „Entwurf“, „Referenz“ und „Zitat“, und sie ist der Grund dafür, dass eine Karte dort eine lange, präzise Frage anbieten kann, die niemand eintippen würde. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.quote = Zitat
com.top_logic.ai.chat.view.ChatConversationElement.Config.quote.tooltip = Optionaler Eingabekanal: Eine markierte Passage eines Objekts wird im Entwurf zu einem atomaren Referenz-Token; geschrieben wird eine Map mit dem, was das Token trägt. <p> Das, was der Kanal „Referenz“ nicht ausdrücken kann. Jener Kanal nimmt ein Objekt, dessen zitierter Text alles ist, was dieses Element über es weiß; wer in der eigenen Ansicht des Hosts einen Absatz markiert hat, möchte genau diesen Absatz zitiert sehen, und nur die Ansicht, die ihn angezeigt hat, weiß, welcher es ist. Dieser Kanal nimmt daher das Token selbst - das Objekt, aus dem die Passage stammt, die Passage und wahlweise eine Bezeichnung, eine Fundstelle und eine Art: </p> <pre> &lt;chat-conversation quote="chatQuote"/&gt; </pre> <p> Geschrieben wird eine Map, also das, was ein TL-Script-Ausdruck liefert: </p> <pre> section -&gt; {"id": $section, "location": "02 Kontext", "text": $marked} </pre> <p> Unter „id“ steht normalerweise das Modellobjekt selbst und kein ausgeschriebener Bezeichner: Das Element füllt dann die Art, die stabile ID und die Bezeichnung daraus - wobei ein verschachteltes „<mention>“ über die Bezeichnung mitbestimmt -, und der Schreibvorgang muss nur noch die Passage benennen. Eine Map ohne „text“ sagt nichts, denn ein Objekt ohne Passage ist das, wofür es den Kanal „Referenz“ gibt. Wie dieser wird auch dieser Kanal nur gelesen und nie geschrieben. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.react-element = React-Element
com.top_logic.ai.chat.view.ChatConversationElement.Config.react-element.tooltip = Registriertes React-Element, das diese Unterhaltung rendert. Standardmäßig ist „TLChatConversation“ eingestellt. Im Layout-Editor ausgeblendet: Der Wert muss mit einer Registrierung in TypeScript übereinstimmen.
com.top_logic.ai.chat.view.ChatConversationElement.Config.reference = Referenz
com.top_logic.ai.chat.view.ChatConversationElement.Config.reference-source = Referenzquelle
com.top_logic.ai.chat.view.ChatConversationElement.Config.reference-source.tooltip = Name einer registrierten Referenzquelle (bezeichnet eine im Code eingerichtete Komponente). Ist dieser Name leer und es liegt keine Erwähnungsbindung vor, wird der @-Picker ausgeblendet. Eine Erwähnungsbindung hat Vorrang vor diesem Namen. Im Layout-Editor ausgeblendet: Der Wert muss mit einer Registrierung in TypeScript übereinstimmen; ein Designer verknüpft @ stattdessen mit der Erwähnungsgruppe.
com.top_logic.ai.chat.view.ChatConversationElement.Config.reference.tooltip = Optionaler Eingabekanal: Ein hierhin geschriebenes Modellobjekt wird im Entwurf zu einem atomaren Referenz-Token, genau so, als hätte man es im @-Menü ausgewählt. <p> Das Token trägt die Bezeichnung des Objekts, dessen stabile ID und den zitierten Text, den der „text“-Ausdruck eines verschachtelten „ <mention> “ berechnet - ohne „ <mention> “ ist die Bezeichnung zugleich der zitierte Text, da das Element sonst nichts über das Objekt weiß. Das Token landet an der Cursorposition, sodass ein Host einen Satz nach „draft“ schreiben und eine Referenz hineinsetzen kann. </p> <p> Dieser Kanal wird nur gelesen, nie geschrieben: Der Composer meldet seine Token nicht zurück, denn der Entwurf, in dem sie stehen, ist bereits das, was „draft“ trägt. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.selection = Auswahl
com.top_logic.ai.chat.view.ChatConversationElement.Config.selection.tooltip = Das vom Benutzer ausgewählte Objekt, dem Agenten in einer Zeile mitgeteilt. <p> Die Frage, die damit beantwortet wird, ist die, die jeder Benutzer als Erstes stellt – „Was ist mit dem, das ich gerade geöffnet habe?“ – und die Kurzform für den „ <fact> “, die niemand schreibt, da man dafür wissen müsste, wie dieses Produkt einen Objektbezeichner schreibt. Geben Sie den Auswahlkanal der Seite an, und die Konversation gibt das ausgewählte Objekt mit seinem Typ und diesem Bezeichner als turnbezogene Tatsache des Blocks „ <turn-context> “ an: </p><pre> &lt;chat-conversation input="chatSession"&gt; &lt;selection channel="selectedInvoice"/&gt; &lt;/chat-conversation&gt; </pre> <p> Nie stabil: Was der Benutzer ausgewählt hat, ändert sich in einer Konversation am häufigsten; daher wird es im Gesprächszug weitergegeben und niemals in der Systemaufforderung. </p> <p> Ein „ <chat-dock/> “ gibt dies auf dieselbe Weise an, und zwar über den darin verschachtelten „ <chat-conversation/> “ – und das sollte auch so sein, denn im Dock fragt der Benutzer nach der dahinterliegenden Seite. Dazu muss dem eigenen Kanal des Docks die Auswahl der Seite übergeben werden; bei einer Shell, deren Seiten „ <view-ref>“-Seiten sind, ist das ein „ <bind> “ pro Seite. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.subject = Bezugsobjekt
com.top_logic.ai.chat.view.ChatConversationElement.Config.subject.tooltip = Optionaler Kanal, der das Objekt benennt, um das es in einer hier begonnenen Unterhaltung geht. <p> Was in diesem Kanal steht, wenn die erste Nachricht des Benutzers die Unterhaltung entstehen lässt, wird auf dieser Sitzung als tl.ai.execution:AgentSession#subject festgehalten und bleibt dort. Eine Seite, auf der es jeweils um ein Objekt geht - ein Projekt, einen Beleg, einen Vertrag -, bekommt so eine Unterhaltung je Objekt, ohne sich selbst etwas merken zu müssen: </p> <pre> &lt;chat-conversation input="chatSession" subject="project"/&gt; </pre> <p> Nur nach außen. Welche Unterhaltung angezeigt wird, bleibt Sache des Kanals „Eingabe“, und aus welchen Unterhaltungen der Benutzer wählen kann, bleibt Sache der „ <data-list> “ - eingegrenzt, indem das Objekt nach den Sitzungen gefragt wird, die auf es verweisen: </p> <pre> &lt;rows&gt;project -&gt; ifElse(isEmpty($project), list(), $project.referers(`tl.ai.execution:AgentSession#subject`) .filter(s -&gt; $s.get(`tl.ai.execution:AgentSession#owner`) == currentUser()))&lt;/rows&gt; </pre> <p> Eine Unterhaltung wird einmal festgeschrieben, nämlich sobald sie entsteht: Wird eine ältere geöffnet, während hier ein anderes Objekt steht, wandert sie nicht dorthin, und eine Unterhaltung, die bei leerem Kanal begonnen wurde, behält kein Bezugsobjekt, statt später eines zu bekommen. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.trace = Detailgrad
com.top_logic.ai.chat.view.ChatConversationElement.Config.trace.tooltip = Inwieweit die Ausführung des Agenten im Protokoll angezeigt wird: gar nicht, als zusammengefasste Übersicht oder als vollständiger Inline-Trace. Der Benutzer kann dies weiterhin live über die Trace-Auswahl des Composers ändern.
com.top_logic.ai.chat.view.ChatConversationElement.Config.working-indicator = Arbeitsanzeige
com.top_logic.ai.chat.view.ChatConversationElement.Config.working-indicator.tooltip = Was dort steht, wo die Antwort erscheinen wird, solange der Agent arbeitet und noch nichts geschrieben hat - im eigenen Erscheinungsbild dieser Anwendung, z. B. ihr Logo als Animation. <p> Leer behält die drei pulsierenden Punkte des Chats bei. Andernfalls eine von drei Formen, in der Höhe der ersten Textzeile (das Token --chat-working-indicator-size): </p> <ul> <li>Eine SVG-Datei, z. B. /images/app-working.svg. Sie wird in die Seite selbst eingesetzt statt als Bild gezeigt, kann also in currentColor oder in den Farben des Designs (var(--text-secondary)) zeichnen und passt dann gleichermaßen zum hellen und zum dunklen Design. Das Stylesheet in ihr gilt deshalb für die ganze Seite: Ihre Klassen brauchen ein Präfix der Anwendung.</li> <li>Eine Icon-Klasse, z. B. css:app-working, die das Stylesheet der Anwendung zeichnet und animiert - die Form für ein Bild, das je Design verschieden ist, weil dieses Stylesheet es über [data-theme] wählen kann.</li> <li>Jedes andere Bild, z. B. ein animiertes .webp, so gezeigt, wie es ist.</li> </ul> <p> Wer beim System weniger Bewegung eingestellt hat, sieht das SVG und die Icon-Klasse stillstehen: Der Chat hält ihre CSS-Animationen an und pausiert die eigenen Animationen eines SVG. Ein animiertes Rasterbild lässt sich von außen nicht anhalten - der Grund, die anderen beiden Formen vorzuziehen. </p> <p> Rein dekorativ, wie die Punkte: Was der Screenreader ansagt, während der Agent arbeitet, ist der Statustext des Chats selbst, was immer hier eingestellt ist. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Context.facts = Fakten
com.top_logic.ai.chat.view.ChatConversationElement.Context.facts.tooltip = Die Fakten selbst, in der Reihenfolge, in der sie im Modell ankommen. <p> Der Standardcontainer, d. h., eine Tatsache wird als direktes untergeordnetes Element des Kontexts geschrieben und nicht innerhalb eines eigenen Wrapper-Elements. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Context.inputs = Eingaben
com.top_logic.ai.chat.view.ChatConversationElement.Context.inputs.tooltip = Verweise auf Kanäle, deren Werte in der Reihenfolge ihrer Auflistung zu den führenden Positionsargumenten jedes Faktenausdrucks werden.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.agent-picker = Agentenauswahl
com.top_logic.ai.chat.view.ChatConversationElement.Controls.agent-picker.tooltip = Ob die Agentenauswahl angeboten wird.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.attachments = Anhänge
com.top_logic.ai.chat.view.ChatConversationElement.Controls.attachments.tooltip = Ob Dateien angehängt werden können.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.auto-approve = Automatisch genehmigen
com.top_logic.ai.chat.view.ChatConversationElement.Controls.auto-approve.tooltip = Ob der Schalter für die automatische Genehmigung angezeigt wird.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.enter-hint = Enter-Hinweis
com.top_logic.ai.chat.view.ChatConversationElement.Controls.enter-hint.tooltip = Ob die Fußzeile den Enter-Hinweis zeigt.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.mcp = MCP
com.top_logic.ai.chat.view.ChatConversationElement.Controls.mcp.tooltip = Ob MCP-Server umgeschaltet werden können.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.model-picker = Modellauswahl
com.top_logic.ai.chat.view.ChatConversationElement.Controls.model-picker.tooltip = Ob der Modellauswähler angeboten wird.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.thinking = Denkaufwand
com.top_logic.ai.chat.view.ChatConversationElement.Controls.thinking.tooltip = Ob Aufwandstufen angeboten werden.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.trace-picker = Trace-Auswahl
com.top_logic.ai.chat.view.ChatConversationElement.Controls.trace-picker.tooltip = Ob die Trace-Modus-Auswahl angeboten wird.
com.top_logic.ai.chat.view.ChatConversationElement.Fact.name = Name
com.top_logic.ai.chat.view.ChatConversationElement.Fact.name.tooltip = Wie die Instanz vor dem Modell bezeichnet wird, z. B. „Projekt“.
com.top_logic.ai.chat.view.ChatConversationElement.Fact.stable = Stall
com.top_logic.ai.chat.view.ChatConversationElement.Fact.stable.tooltip = Ob der Wert für die gesamte Unterhaltung gilt. <p> Nur eine unveränderliche Angabe gelangt in die Systemaufforderung. Lassen Sie diese Option für etwas aktiviert, das die Seite einmalig festlegt – das Projekt, zu dem ein Chat gehört –, und deaktivieren Sie sie für etwas, das sich nach den Klicks des Nutzers richtet. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Fact.value = Wert
com.top_logic.ai.chat.view.ChatConversationElement.Fact.value.tooltip = TL-Script berechnet den Wert und verwendet dabei die umgebenden Eingaben als erste Argumente.
com.top_logic.ai.chat.view.ChatConversationElement.Mention.label = Bezeichnung
com.top_logic.ai.chat.view.ChatConversationElement.Mention.label.tooltip = Optionales TL-Skript für ein Objekt, das seine angezeigte Beschriftung und die Beschriftung der Erwähnung berechnet. Bei leerer Eingabe wird die eigene Beschriftung des Objekts verwendet.
com.top_logic.ai.chat.view.ChatConversationElement.Mention.limit = Höchstzahl
com.top_logic.ai.chat.view.ChatConversationElement.Mention.limit.tooltip = Höchstens so viele Kandidaten werden an den Browser übertragen. Die Liste wird im Browser während der Eingabe gefiltert; dies begrenzt also die Datenmenge, nicht die Suche.
com.top_logic.ai.chat.view.ChatConversationElement.Mention.observed-types = Beobachtete Typen
com.top_logic.ai.chat.view.ChatConversationElement.Mention.observed-types.tooltip = Typen, bei denen sich das Objekt ändert (Erstellen / Aktualisieren / Löschen), führen <i>die Zeilen</i> erneut aus, sodass die Kandidatenmenge automatisch aktualisiert wird.
com.top_logic.ai.chat.view.ChatConversationElement.Mention.rows = Zeilen
com.top_logic.ai.chat.view.ChatConversationElement.Mention.rows.tooltip = Eine TL-Script-Funktion, die die Objekte berechnet, die @ erwähnen kann (eine <i>Sammlung</i>), ähnlich wie bei der Bindung von Zeilen in „ <data-list> “ und „ <table> “.
com.top_logic.ai.chat.view.ChatConversationElement.Mention.text = Text
com.top_logic.ai.chat.view.ChatConversationElement.Mention.text.tooltip = Optionales TL-Skript für ein Objekt, das den Zitattext berechnet, den die Erwähnung in die Nachricht einfügt – das, was der Agent vorliest. Bei leerer Angabe wird die Bezeichnung verwendet.
com.top_logic.ai.chat.view.ChatConversationElement.Prompt.icon = Symbol
com.top_logic.ai.chat.view.ChatConversationElement.Prompt.icon.tooltip = Das Symbol auf der Karte, z. B. css:bi bi-receipt. <p> Benannt so, wie ein „ <chat-rail/> “-Abschnitt sein Symbol benennt. Karten ohne Symbol zeigen nur ihre Beschriftung an – genau so sollte es bei einem Kartensatz sein, bei dem ein Symbol keinen zusätzlichen Mehrwert bieten würde. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Prompt.label = Bezeichnung
com.top_logic.ai.chat.view.ChatConversationElement.Prompt.label.tooltip = Was auf der Karte steht, in der Sprache des Benutzers. <p> Die Kurzform der Frage, nicht die Frage selbst: Die Karte umfasst eine Zeile, während der Wert, der dort eingetragen wird, einen ganzen Absatz umfassen kann. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Prompt.value = Wert
com.top_logic.ai.chat.view.ChatConversationElement.Prompt.value.tooltip = TL-Script berechnet den Text, den der Klick in den Composer einfügt, wobei die umgebenden Eingaben als erste Argumente verwendet werden.
com.top_logic.ai.chat.view.ChatConversationElement.Prompts.cards = Karten
com.top_logic.ai.chat.view.ChatConversationElement.Prompts.cards.tooltip = Die Karten selbst, in der Reihenfolge, in der sie angezeigt werden. <p> Der Standard-Container, sodass eine Karte als direktes untergeordnetes Element des Abschnitts geschrieben wird und nicht innerhalb eines eigenen Wrapper-Elements. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Prompts.inputs = Eingaben
com.top_logic.ai.chat.view.ChatConversationElement.Prompts.inputs.tooltip = Verweise auf Kanäle, deren Werte in der Reihenfolge ihrer Auflistung zu den führenden Positionsargumenten jedes Kartenausdrucks werden.
com.top_logic.ai.chat.view.ChatConversationElement.Selection.channel = Kanal
com.top_logic.ai.chat.view.ChatConversationElement.Selection.channel.tooltip = Der Kanal, der die Auswahl des Benutzers enthält – ein Objekt, mehrere Objekte oder nichts. <p> Normalerweise ist dies der Auswahlkanal der Tabelle oder Liste, aus der der Benutzer eine Auswahl trifft. Ein Kanal <em>dieser</em> Ansicht: Eine Seite einer Shell übergibt ihre Auswahl an ein Dock in der Fußzeile der Shell mit einem „ <bind> “ auf dem „ <view-ref> “, so wie sie auch den Entwurf übergibt. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Selection.label = Bezeichnung
com.top_logic.ai.chat.view.ChatConversationElement.Selection.label.tooltip = TL-Script ermittelt, wie ein ausgewähltes Objekt heißt, wobei dieses Objekt als Argument verwendet wird. <p> Wird das Feld leer gelassen, wird die anwendungsinterne Bezeichnung verwendet – das ist das, was der Benutzer auf dem Bildschirm sieht, und somit die richtige Antwort auf eine Frage dazu. Konfigurieren Sie hier einen Ausdruck, wenn die Bezeichnung eines Objekts nicht das ist, woran es in einem Satz zu erkennen ist. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Selection.name = Name
com.top_logic.ai.chat.view.ChatConversationElement.Selection.name.tooltip = Wie die Angabe vor dem Modell heißt. <p> Vom Modell gelesen, also auf Englisch und keine Ressource, wie jeder andere Text, den ein Tool einem vorlegt. Benennen Sie, was die Seite enthält – „Offene Rechnung“, „Ausgewählte Aufgabe“ –, wenn dies aussagekräftiger ist als die Standardbezeichnung. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Trace.DETAILED = Ausführlich
com.top_logic.ai.chat.view.ChatConversationElement.Trace.DETAILED.tooltip = Der vollständige Ausführungsablauf, inline.
com.top_logic.ai.chat.view.ChatConversationElement.Trace.NONE = Keine
com.top_logic.ai.chat.view.ChatConversationElement.Trace.NONE.tooltip = Nur die Antwort; keine Details zur Ausführung.
com.top_logic.ai.chat.view.ChatConversationElement.Trace.SUMMARY = Zusammenfassung
com.top_logic.ai.chat.view.ChatConversationElement.Trace.SUMMARY.tooltip = Eine zusammengeklappte, einzeilige Zusammenfassung des Laufs, die der Benutzer aufklappen kann.
com.top_logic.ai.chat.view.ChatConversationElement.tooltip = Deklaratives „ <chat-conversation/> “-Element: Das Transkript und das Eingabefeld als ein Ansichtselement. <p> Führt die bisher getrennten Elemente „ <chat-thread/> “ und „ <chat-composer/> “ zusammen. Transkript und Eingabefeld befinden sich fast immer nebeneinander, daher bilden sie eine platzierbare Box; eine Sitzungsliste (ein „ <data-list> “ von „AgentSessions“) und eine Leiste (<chat-rail/>) bleiben getrennt, da diese tatsächlich unabhängig voneinander platziert werden sollen. Mehrere Chat-Elemente auf einer Seite nehmen über die „chat-id“ an derselben Unterhaltung teil. Der optionale Eingabekanal überträgt die geöffnete „AgentSession“; der optionale „busy“-Kanal wird auf „true“ gesetzt, während der Agent arbeitet, sodass ein Host seine eigenen Befehle deaktivieren kann. </p> <p> Vier weitere Kanäle übertragen die vom Benutzer für die nächste Runde festgelegten Einstellungen: „agent“, „model“, „effort“ und „mcp-servers“. Jeder dieser Kanäle ist bidirektional – der Composer schreibt die Auswahl des Benutzers und reagiert auf Schreibvorgänge von außen –, sodass ein Host anzeigen kann, welcher Agent antwortet, eine Schaltfläche im Modell sperren oder einen Agenten für eine Seite vorab auswählen kann. Sie tragen die <em>Namen</em>, unter denen diese Elemente bekannt sind, da jeder Aufruf – und die dahinterstehende Sicherheitsrichtlinie – auf einem Namen basiert: Nur ein in der Wissensdatenbank erstellter Agent ist überhaupt ein Modellobjekt, während die mitgelieferten Agenten, die Modelle und die MCP-Server zur Konfiguration gehören. Siehe <i>Kanäle für Chat-Runden</i>. </p> <p> „present“ ist die andere Richtung und die einzige, die der <em>Agent</em> steuert: Die dort genannten Kanäle sind diejenigen, in die ein Lauf mit dem „present“-Tool schreiben darf, und nichts anderes auf der Seite ist von einem Lauf aus erreichbar. <b>Standardmäßig verweigert</b> – ein Element, das keinen Namen angibt, lässt keinen Agenten in irgendeinen Kanal schreiben, und einem Lauf auf einer Seite, die keinen nennt, wird das Tool gar nicht erst angeboten. Siehe <i>„present“</i> und <i>Present-Tool des Chats</i>. </p> <p> Drei weitere Elemente enthalten den noch nicht gesendeten Text des Verfassers: „draft“ ist der Text selbst, bidirektional; „reference“ wandelt ein geschriebenes Modellobjekt in ein atomares Referenztoken innerhalb des Textes um; und „quote“ tut dasselbe für einen Auszug <em>aus</em> einem Objekt, den nur der Betrachter benennen kann, der ihn angezeigt hat. Zusammen ermöglichen sie es, dass eine Schaltfläche an beliebiger Stelle auf der Seite eine Frage in den Chat einfügt, ohne dass eine einzige Zeile Code erforderlich ist – ein „ <execute-script> “, das den Satz oder den Abschnitt aufbaut, und ein „ <write-channel> “, das ihn schreibt. </p>
com.top_logic.ai.chat.view.ChatDockElement = Chat-Dock
com.top_logic.ai.chat.view.ChatDockElement.Config.chat-id = Chat-ID
com.top_logic.ai.chat.view.ChatDockElement.Config.chat-id.tooltip = Über welches Gespräch der Starter berichtet. <p> Anders als jedes andere Chat-Element muss dieses die ID erfahren, denn es <em>enthält</em> den „ <chat> “, statt darin zu stehen, und ein Chat-Bereich reicht nur nach unten. Trage hier dieselbe ID ein, die der eingebettete „ <chat> “ trägt. Leer gelassen nimmt das Dock am Gespräch „default“ teil, was für eine Seite richtig ist, deren Chat ebenfalls keine ID nennt. </p>
com.top_logic.ai.chat.view.ChatDockElement.Config.class.tooltip = Die Implementierung des Elements. Im Layout-Editor ausgeblendet: Das Tag legt sie bereits fest, und eine Änderung ergibt ein Element, das nicht mehr zu den daneben angezeigten Optionen passt.
com.top_logic.ai.chat.view.ChatDockElement.Config.content = Inhalt
com.top_logic.ai.chat.view.ChatDockElement.Config.content.tooltip = Was das Panel zeigt, geschrieben als Kinder des „ <chat-dock> “. <p> Jedes Anzeigeelement; üblicherweise ein „ <chat> “ mit dem Gespräch und allem, was die Anwendung daneben zeigen will. Schreibe <b>ein</b> Element: Die Füllregel der Engine für einen Stapel mit einem füllenden Panel schaut nur eine Ebene tief, sodass ein zweites Kind einen umschließenden Stapel hinzufügt und das Gespräch die begrenzte Höhe verliert, in der es scrollt. </p>
com.top_logic.ai.chat.view.ChatDockElement.Config.icon = Symbol
com.top_logic.ai.chat.view.ChatDockElement.Config.icon.tooltip = Das Symbol auf der Starter-Schaltfläche, z. B. css:bi bi-stars. Dasselbe Vokabular, das auch ein „ <nav-item> “ oder ein „ <section> “ der Leiste verwendet. Solange das Panel offen ist, zeigt die Schaltfläche stattdessen ein Kreuz zum Schließen; dies ist also das Symbol des geschlossenen Zustands.
com.top_logic.ai.chat.view.ChatDockElement.Config.label = Bezeichnung
com.top_logic.ai.chat.view.ChatDockElement.Config.label.tooltip = Wie der Starter heißt: sein Tooltip und sein barrierefreier Name. Das einzige Wort, das ein Benutzer über das Dock liest; benenne also den Assistenten, nicht den Mechanismus - „Assistent“, nicht „Chat-Panel öffnen“. Leer gelassen wird die eigene Bezeichnung des Chats verwendet.
com.top_logic.ai.chat.view.ChatDockElement.Config.open = Geöffnet
com.top_logic.ai.chat.view.ChatDockElement.Config.open.tooltip = Ob das Panel bereits offen ist, wenn die Seite zum ersten Mal gezeigt wird. <p> Der Zustand beim ersten Laden und nicht mehr: Das Dock merkt sich nicht, was der Benutzer damit getan hat, also beginnt jedes Laden der Seite wieder hier. </p>
com.top_logic.ai.chat.view.ChatDockElement.Config.personalization-key.tooltip = Optionale Überschreibung des automatisch abgeleiteten Personalisierungsschlüssels. Im Layout-Editor ausgeblendet: Der aus dem Ansichtskontext abgeleitete Schlüssel ist der richtige, und ein von Hand eingetragener Wert verschiebt stillschweigend, was ein Benutzer personalisiert hat.
com.top_logic.ai.chat.view.ChatDockElement.Config.react-element = React-Element
com.top_logic.ai.chat.view.ChatDockElement.Config.react-element.tooltip = Registriertes React-Element, das dieses Dock rendert. Standardwert ist „TLChatDock“. Im Layout-Editor ausgeblendet: Der Wert muss mit einer Registrierung in TypeScript übereinstimmen.
com.top_logic.ai.chat.view.ChatDockElement.tooltip = Deklaratives „ <chat-dock/> “-Element: ein schwebender Starter, der den Chat über der Seite öffnet. <p> Das Dock ist ein Rahmen und sonst nichts. Geschlossen kostet es eine Schaltfläche in der Ecke des Fensters; geöffnet zeigt es in einer Karte über der Seite, was die Anwendung darin eingebettet hat - üblicherweise ein „ <chat> “ mit einer Sitzungsliste, einem „ <chat-conversation/> “ und einer „ <chat-rail/> “, aber jedes Anzeigeelement ist geeignet. Woraus der Assistent <em>besteht</em>, bleibt die Entscheidung der Anwendung, genau wie auf einer eigenen Seite. </p> <p> Beim Öffnen fließt nichts um: Das Panel ist eine Karte mit fester Position über dem Arbeitsbereich, also erscheint kein Bereich, wird keine Tabelle schmaler, und das Schließen gibt die Seite unverändert zurück. Die Seite dahinter bleibt benutzbar, solange das Dock offen ist. </p> <p> <b>Das Dock enthält den Chat und kann ihn deshalb nicht erben.</b> Jedes andere Chat-Element nimmt sein Gespräch vom umschließenden „ <chat> “, aber ein Bereich reicht nur nach unten, und hier ist der „ <chat> “ das Kind. Das Dock wiederholt die ID daher: </p> <pre> &lt;chat-dock chat-id="assistant" icon="css:bi bi-stars"&gt; &lt;label&gt;&lt;en&gt;Assistant&lt;/en&gt;&lt;de&gt;Assistent&lt;/de&gt;&lt;/label&gt; &lt;chat chat-id="assistant" direction="row"&gt; &lt;panel fill="true"&gt;&lt;chat-conversation input="dockSession"/&gt;&lt;/panel&gt; &lt;chat-rail&gt;...&lt;/chat-rail&gt; &lt;/chat&gt; &lt;/chat-dock&gt; </pre> <p> Die beiden IDs müssen übereinstimmen, und eine Abweichung wird gemeldet statt verschwiegen: Das Beitrittsprotokoll warnt vor einem Fenster, dessen Chat-IDs nicht zusammenpassen - genau die Gestalt, die ein Tippfehler hier erzeugt. </p> <p> Das Dock braucht die ID nur für eines: die Anzahl der ungesehenen Neuigkeiten auf dem Starter und dessen Punkt für „arbeitet gerade“, die es aus dem Browser-Speicher dieses Gesprächs liest - derselbe Speicher, aus dem auch die Leisten-Schaltfläche im Gesprächsverlauf liest. Keines von beiden bekommt einen Kanal: Sie ändern sich während der Arbeit des Agenten viele Male pro Sekunde, und ein Befehls-Roundtrip für einen Punkt ist nicht, wofür ein Kanal da ist. </p> <p> <b>VORLÄUFIGE ABSPALTUNG.</b> An einem schwebenden Starter ist nichts chatspezifisch außer der Herkunft seiner Anzahl. <b>Ziel der Übernahme:</b> eine generische „ <dock> “-Hülle in „tl-layout-view“, die jedes Element aufnimmt und ihre Anzahl aus einem Kanal bezieht, sodass „tl-chat“ nur der speichergebundene Starter bleibt. </p>
com.top_logic.ai.chat.view.ChatRailElement = Chat-Leiste
com.top_logic.ai.chat.view.ChatRailElement$PaneMode = Bereichsmodus
com.top_logic.ai.chat.view.ChatRailElement$PaneMode.tooltip = Wie weit sich der Bereich öffnet.
com.top_logic.ai.chat.view.ChatRailElement$SectionConfig = Abschnitt
com.top_logic.ai.chat.view.ChatRailElement$SectionConfig.tooltip = Ein zusammenklappbarer Block der Leiste, der ein Anzeigeelement enthält.
com.top_logic.ai.chat.view.ChatRailElement.Config.chat-id = Chat-ID
com.top_logic.ai.chat.view.ChatRailElement.Config.chat-id.tooltip = Zu welcher Unterhaltung diese Leiste gehört, wenn es nicht die des umgebenden „ <chat> “ sein darf. Leer lassen: Eine Leiste in einem „ <chat> “ gehört zu dessen Unterhaltung, eine Leiste außerhalb jedes „ <chat> “ zur Unterhaltung „default“, sodass die Teile einer Seite einander finden, ohne dass es ihnen gesagt wird. Nur setzen, um aus dem umgebenden Chat auszubrechen.
com.top_logic.ai.chat.view.ChatRailElement.Config.class.tooltip = Die Implementierung des Elements. Im Layout-Editor ausgeblendet: Das Tag legt sie bereits fest, und eine Änderung ergibt ein Element, das nicht mehr zu den daneben angezeigten Optionen passt.
com.top_logic.ai.chat.view.ChatRailElement.Config.drawer-below = Ausklappleiste unter
com.top_logic.ai.chat.view.ChatRailElement.Config.drawer-below.tooltip = Breite des umgebenden Containers in rem, unterhalb derer sich die Leiste als Ausklappleiste öffnet. <p> Darunter bleibt von der Leiste neben der Unterhaltung nur ihre Symbolleiste, und ein Abschnitt oder der Bereich öffnet sich über der Unterhaltung, statt eine eigene Spalte zu belegen. Der Standardwert passt für eine Leiste neben einer Unterhaltung und einer Chat-Liste. Setzen Sie den Wert auf die Breite, die die geöffnete Spalte der Leiste und ihre Nachbarn nebeneinander brauchen; 0 behält bei jeder Breite eine Spalte. </p>
com.top_logic.ai.chat.view.ChatRailElement.Config.input = Eingabe
com.top_logic.ai.chat.view.ChatRailElement.Config.input.tooltip = Kanal, der den Inhalt des Fensters enthält; leer für die Abschnitte. <p> Solange er etwas enthält, ersetzt der Bereich die Abschnittsspalte: ein Objekt als Formular, mehrere Objekte als Tabelle mit den Spalten ihres jeweiligen Typs sowie das, was der Agent als die angeforderte Tabelle, das Diagramm oder das Formular dargestellt hat – für jeden Typ, ohne dass etwas konfiguriert werden muss. Die Schaltfläche „Schließen“ des Bereichs schreibt „null“ zurück. Benennen Sie den Kanal genauso wie den „ <chat-conversation present="…"> “, damit der Agent hier Inhalte anzeigen kann. Lassen Sie ihn leer, wenn es sich um eine Leiste ohne Fenster handelt. </p>
com.top_logic.ai.chat.view.ChatRailElement.Config.open = Geöffnet
com.top_logic.ai.chat.view.ChatRailElement.Config.open.tooltip = Ob die Leiste geöffnet startet. <p> Der Zustand für einen Benutzer, der diese Leiste noch nie geöffnet oder geschlossen hat. Sobald er das getan hat, zeigt jedes spätere Laden der Seite und jeder neue Tab seine eigene Wahl, und diese Einstellung gilt für ihn nicht mehr. </p>
com.top_logic.ai.chat.view.ChatRailElement.Config.pane-mode = Bereichsmodus
com.top_logic.ai.chat.view.ChatRailElement.Config.pane-mode.tooltip = Wie weit sich der Bereich öffnet: eine Karte neben dem Gesprächsverlauf, oder etwas zum Lesen.
com.top_logic.ai.chat.view.ChatRailElement.Config.pane-width = Bereichsbreite
com.top_logic.ai.chat.view.ChatRailElement.Config.pane-width.tooltip = Breite des Bereichs in Pixeln. Null behält die automatische Breite. <p> Die Breite für einen Benutzer, der den Trenner dieser Leiste noch nie gezogen hat; wer das getan hat, behält seine eigene. Im Layout-Editor ausgeblendet, weil eine Zahl hier eine Entscheidung über das Fenster eines anderen ist, die der Benutzer selbst besser trifft. </p>
com.top_logic.ai.chat.view.ChatRailElement.Config.personalization-key.tooltip = Optionale Überschreibung des automatisch abgeleiteten Personalisierungsschlüssels. Im Layout-Editor ausgeblendet: Der aus dem Ansichtskontext abgeleitete Schlüssel ist der richtige, und ein von Hand eingetragener Wert verschiebt stillschweigend, was ein Benutzer personalisiert hat.
com.top_logic.ai.chat.view.ChatRailElement.Config.react-element = React-Element
com.top_logic.ai.chat.view.ChatRailElement.Config.react-element.tooltip = Registriertes React-Element, das diese Leiste rendert. Standardwert ist „TLChatRail“. Im Layout-Editor ausgeblendet: Der Wert muss mit einer Registrierung in TypeScript übereinstimmen.
com.top_logic.ai.chat.view.ChatRailElement.Config.sections = Abschnitte
com.top_logic.ai.chat.view.ChatRailElement.Config.sections.tooltip = Die Abschnitte der Leiste, von oben nach unten in der geschriebenen Reihenfolge. Werden direkt als „ <section> “-Kinder der „ <chat-rail> “ geschrieben. Eine leere Liste ist eine leere Leiste; dieses Element bringt keine eigenen Abschnitte mit.
com.top_logic.ai.chat.view.ChatRailElement.Config.strip = Symbolleiste
com.top_logic.ai.chat.view.ChatRailElement.Config.strip.tooltip = Ob die Symbolleiste mit den Abschnitts-Symbolen gezeigt wird. Sie ist es, die sagt, was die Leiste enthält, solange diese geschlossen ist, und ein Klick auf ein Symbol öffnet die Leiste auf diesem Abschnitt. Ohne sie führt nur noch die Leisten-Schaltfläche im Gesprächsverlauf hinein.
com.top_logic.ai.chat.view.ChatRailElement.PaneMode.CARD = Karte
com.top_logic.ai.chat.view.ChatRailElement.PaneMode.CARD.tooltip = Ein Eintrag neben dem Verlauf.
com.top_logic.ai.chat.view.ChatRailElement.PaneMode.DOCUMENT = Dokument
com.top_logic.ai.chat.view.ChatRailElement.PaneMode.DOCUMENT.tooltip = Etwas zum Lesen; der Bereich nimmt den größten Teil der Spalte ein.
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.badge = Kennzahl
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.badge.tooltip = Optionaler Kanal, der angibt, wie viele Elemente dieser Abschnitt enthält. Die Zahl erscheint neben dem Titel des Abschnitts und auf dessen Leisten-Symbol, und die Leiste summiert die Abschnitte zu der Gesamtzahl, die auf der Leisten-Schaltfläche des Transkripts angezeigt wird. Das Inhaltselement schreibt diese Zahl – dies übernimmt ein „ <data-list count="…"/> “ – oder ein abgeleiteter Kanal berechnet sie.
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.content = Inhalt
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.content.tooltip = Was dieser Abschnitt zeigt: ein Anzeigeelement, geschrieben als Kind der „ <section> “. Mehrere Elemente werden gestapelt, wie in einem „ <tab> “.
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.icon = Symbol
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.icon.tooltip = Das Symbol, das die Symbolleiste zeigt, z. B. css:bi bi-list-check. Abschnitte ohne eigenes Symbol teilen sich ein allgemeines, das nichts darüber sagt, was darin steht; gib jedem Abschnitt ein eigenes, wo die Symbolleiste gezeigt wird.
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.label = Bezeichnung
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.label.tooltip = Der Titel, der in der Kopfzeile des Abschnitts angezeigt wird.
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.name = Name
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.name.tooltip = Technischer Name dieses Abschnitts, eindeutig innerhalb der Leiste. Unter ihm merkt sich der Abschnitt, ob der Benutzer ihn zugeklappt hat; ein Abschnitt umzubenennen vergisst das also.
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.open = Offen
com.top_logic.ai.chat.view.ChatRailElement.SectionConfig.open.tooltip = Ob dieser Abschnitt aufgeklappt startet. <p> Der Zustand für einen Benutzer, der diesen Abschnitt noch nie zu- oder aufgeklappt hat. Sobald er das getan hat, zeigt jedes spätere Laden der Seite und jeder neue Tab seine eigene Wahl. Gemerkt wird sie je Abschnittsname, sodass ein später hinzugefügter Abschnitt auch für einen Benutzer, der die anderen längst eingerichtet hat, wie konfiguriert startet. </p>
com.top_logic.ai.chat.view.ChatRailElement.tooltip = Deklaratives „ <chat-rail/> “-Element: die Seitenleiste neben einer Unterhaltung, als Hülle, deren Inhalt konfiguriert wird. <p> Die Leiste erweitert den Chat, sodass neben dem Gesprächsprotokoll weitere Informationen angezeigt werden können – was der Mitarbeiter gerade tut, ein vorgeschlagener Plan, die Quellen, ein von ihm verfasstes Dokument. <b>Welche</b> dieser Optionen gewählt wird, entscheidet die Anwendung; daher enthält dieses Element keinen eigenen Inhalt: Jedes „ <section> “ enthält ein „view“-Element, und jedes beliebige Element ist dafür geeignet – ein „ <data-list> “ der Aufgaben des Agenten oder der anwendungsspezifischen Objekte oder ein vom Host verfasstes Element. Ein leeres „ <chat-rail/> “ rendert eine leere Seitenleiste. </p> <p> Der Eingabekanal ist die zweite Seite der Leiste: Solange er etwas enthält, wird anstelle der Abschnitte der Bereich angezeigt – ein Objekt als Formular, mehrere als Tabelle und das, was das aktuelle Tool des Agenten dort als die angeforderte Tabelle, das Diagramm oder das Formular abgelegt hat. Der Bereich ist für jeden Typ und jede Anwendung identisch (<i>Präsentationsbereich</i>); außer dem Kanal wird nichts dafür konfiguriert. Er speichert einen Verlauf: Ein Klick auf eine Zeile in einer Tabelle öffnet das Formular dieses Objekts, und mit „Zurück“ kehrt man zur Tabelle in ihrem ursprünglichen Zustand zurück. Beim Schließen des Bereichs wird „null“ zurückgeschrieben. </p> <p> Mehrere Chat-Elemente auf einer Seite nehmen über die Chat-ID an derselben Unterhaltung teil. Zwei Spalten mit derselben Chat-ID werden nicht unterstützt: Der geöffnete Zustand und die ausgeblendeten Abschnitte gibt es jeweils nur einmal pro Unterhaltung, und beide Spalten würden sich darum streiten. </p> <p><b>VORLÄUFIGE ABZWEIGUNG.</b> Hier ist nichts chatspezifisch, außer der „chat-id“-Bindung und dem gespeicherten Layout. <b>Übergeordnetes Ziel:</b> eine generische Side-Rail-Hülle in tl-layout-view (Engine-Übergabe E2), wobei tl-chat nur die Abschnitte behält, zu denen es beiträgt. </p>
com.top_logic.ai.chat.view.ChatScopeElement = Chat
com.top_logic.ai.chat.view.ChatScopeElement.Config.chat-id = Chat-ID
com.top_logic.ai.chat.view.ChatScopeElement.Config.chat-id.tooltip = Die Unterhaltung, die die Chat-Elemente in diesem Element zeigen. Jedes darin liegende Element, das keine eigene Chat-ID nennt, tritt dieser bei. Standard ist „default“ - dieselbe Unterhaltung, der ein Element außerhalb jedes „ <chat> “ beitritt, sodass eine Seite mit einer einzigen Unterhaltung gar keine ID braucht. Eine ID vergeben, wo eine Seite zwei Chats hält, damit jeder sagt, welcher er ist.
com.top_logic.ai.chat.view.ChatScopeElement.Config.implementation-class.tooltip = Die Implementierung des Elements. Im Layout-Editor ausgeblendet: Das Tag legt sie bereits fest, und eine Änderung ergibt ein Element, das nicht mehr zu den daneben angezeigten Optionen passt.
com.top_logic.ai.chat.view.ChatScopeElement.Config.personalization-key.tooltip = Optionale Überschreibung des automatisch abgeleiteten Personalisierungsschlüssels. Im Layout-Editor ausgeblendet: Der aus dem Ansichtskontext abgeleitete Schlüssel ist der richtige, und ein von Hand eingetragener Wert verschiebt stillschweigend, was ein Benutzer personalisiert hat.
com.top_logic.ai.chat.view.ChatScopeElement.tooltip = Deklaratives „ <chat> “-Element: die Unterhaltung, die die darin liegenden Chat-Elemente zeigen. <p> Die Elemente, aus denen ein Chat besteht - eine „ <chat-conversation/> “, eine „ <chat-rail/> “ und deren Abschnitte - zeigen dieselbe Unterhaltung, wenn sie sich auf eine „chat-id“ einigen. Diese ID auf jedes einzelne Element zu schreiben macht die stärkste Kopplung der Seite zu dem, was man ihr am wenigsten ansieht: Ein Tippfehler in einem Attribut öffnet eine zweite, leere Unterhaltung, und nichts sagt das. In ein „ <chat> “ eingefasst, steht die ID einmal da und jedes Element darin erbt sie, sodass die Gruppierung dort deklariert ist, wo man sie lesen kann: </p> <pre> &lt;chat chat-id="support" direction="row"&gt; &lt;panel fill="true"&gt;&lt;chat-conversation input="chatSession"/&gt;&lt;/panel&gt; &lt;chat-rail&gt;...&lt;/chat-rail&gt; &lt;/chat&gt; </pre> <p> Ein Element darin darf weiterhin eine eigene „chat-id“ nennen; das ist die Überschreibung. Ein Element außerhalb jedes „ <chat> “ tritt <code>"default"</code> bei. </p> <p> Optisch ist dies ein „ <stack> “ und nichts weiter: Es ordnet seine Kinder in einer Flexbox mit der konfigurierten Richtung, dem konfigurierten Abstand und der konfigurierten Ausrichtung an und zeichnet nichts Eigenes. Jedes Element darf darin stehen, Chat-Element oder nicht - ein „ <chat> “ um eine ganze Seite ist genauso legitim wie eines um zwei Elemente. </p>
com.top_logic.ai.chat.view.ChatSectionElement.Config.badge = Kennzahl
com.top_logic.ai.chat.view.ChatSectionElement.Config.badge.tooltip = Optionaler Kanal, in den dieser Abschnitt seine Anzahl schreibt - wie viele der dort gezeigten Dinge es gerade gibt. Die Leiste liest denselben Kanal, um die Zahl neben den Titel des Abschnitts und auf sein Symbol in der Symbolleiste zu setzen, und summiert die Abschnitte zu der Gesamtzahl, die die Leisten-Schaltfläche im Gesprächsverlauf zeigt. Leer lassen für einen Abschnitt, der nichts zu zählen hat.
com.top_logic.ai.chat.view.ChatSectionElement.Config.chat-id = Chat-ID
com.top_logic.ai.chat.view.ChatSectionElement.Config.chat-id.tooltip = Welche Unterhaltung dieser Abschnitt zeigt, wenn es nicht die des umgebenden „ <chat> “ sein darf. Leer lassen: Ein Abschnitt in einem „ <chat> “ zeigt dessen Unterhaltung, einer außerhalb jedes „ <chat> “ die Unterhaltung „default“, sodass die Teile einer Seite einander finden, ohne dass es ihnen gesagt wird. Nur setzen, um aus dem umgebenden Chat auszubrechen.
com.top_logic.ai.chat.view.ChatSectionElement.Config.personalization-key.tooltip = Optionale Überschreibung des automatisch abgeleiteten Personalisierungsschlüssels. Im Layout-Editor ausgeblendet: Der aus dem Ansichtskontext abgeleitete Schlüssel ist der richtige, und ein von Hand eingetragener Wert verschiebt stillschweigend, was ein Benutzer personalisiert hat.
com.top_logic.ai.chat.view.ChatSectionElement.Config.react-element = React-Element
com.top_logic.ai.chat.view.ChatSectionElement.Config.react-element.tooltip = Registriertes React-Element, das diesen Abschnitt rendert. Im Layout-Editor ausgeblendet: Der Wert muss mit einer Registrierung in TypeScript übereinstimmen.
com.top_logic.ai.chat.view.ChatSourcesElement = Chat-Quellen
com.top_logic.ai.chat.view.ChatSourcesElement.Config.class.tooltip = Die Implementierung des Elements. Im Layout-Editor ausgeblendet: Das Tag legt sie bereits fest, und eine Änderung ergibt ein Element, das nicht mehr zu den daneben angezeigten Optionen passt.
com.top_logic.ai.chat.view.ChatSourcesElement.Config.react-element.tooltip = Registriertes React-Element, das diesen Abschnitt rendert. Standardwert ist „TLChatSources“. Im Layout-Editor ausgeblendet: Der Wert muss mit einer Registrierung in TypeScript übereinstimmen.
com.top_logic.ai.chat.view.ChatSourcesElement.tooltip = Deklaratives „ <chat-sources/> “-Element: was diese Unterhaltung zitiert hat, als Abschnitt der Leiste. <p> Eine Zeile je Quelle, in der Reihenfolge, in der die Antworten sie zuerst zitiert haben, mit den Markierungsnummern, die auf sie zeigen - eine Nummer springt zu ihrer Antwort, die Zeile öffnet die Quelle. Eine lange Liste bekommt einen Filter. Der optionale Kennzahl-Kanal erhält, wie viele Quellen es gibt, sodass die Kennzahl der Leiste die seit dem letzten Hinsehen zitierten zählt. </p>
com.top_logic.ai.chat.view.list.DataListElement = Datenlistenelement
com.top_logic.ai.chat.view.list.DataListElement$Emphasis = Schwerpunkt
com.top_logic.ai.chat.view.list.DataListElement$Emphasis.tooltip = Wie deutlich eine Linie dargestellt wird.
com.top_logic.ai.chat.view.list.DataListElement$LineConfig = Leitungskonfiguration
com.top_logic.ai.chat.view.list.DataListElement$LineConfig.tooltip = Konfiguration für eine einzelne Zeile einer Reihe – ähnlich wie bei einer Tabelle <column>, jedoch gestapelt.
com.top_logic.ai.chat.view.list.DataListElement$LinesConfig = Konfiguration der Leitungen
com.top_logic.ai.chat.view.list.DataListElement$LinesConfig.tooltip = Behälter für die Zeilen eines <i>Datenlistenelements</i>.
com.top_logic.ai.chat.view.list.DataListElement$RowActions = Zeilenaktionen
com.top_logic.ai.chat.view.list.DataListElement$RowActions.tooltip = Wann der Aktionsauslöser einer Zeile angezeigt wird. <p> Es gelten dieselben drei Antworten – und derselbe Vorbehalt bezüglich Touch-Geräten – wie bei „ <panel hover-actions="..."> “: Ein Auslöser in jeder Zeile einer langen Liste stellt visuelles Rauschen dar, daher wartet das System auf den Mauszeiger oder den Tastaturfokus. Auf einem Touch-Gerät gibt es keinen Mauszeiger, daher wird der Auslöser dort ohnehin angezeigt, <i>wenn man mit dem Finger darüberfährt</i>. </p>
com.top_logic.ai.chat.view.list.DataListElement.Config.class.tooltip = Die Implementierung des Elements. Im Layout-Editor ausgeblendet: Das Tag legt sie bereits fest, und eine Änderung ergibt ein Element, das nicht mehr zu den daneben angezeigten Optionen passt.
com.top_logic.ai.chat.view.list.DataListElement.Config.collapsed = Eingeklappt
com.top_logic.ai.chat.view.list.DataListElement.Config.collapsed.tooltip = Ob die Liste eingeklappt startet. <p> Der Zustand beim ersten Laden, und nichts weiter: Dies gilt für jeden Seitenladevorgang, und ein Benutzer, der die Liste aufklappt, findet sie beim nächsten Laden wieder in diesem Zustand vor. Die Liste muss <i>zusammenklappbar</i> sein, da eine Liste, die sich nicht zusammenklappen lässt, auch nicht in zusammengeklapptem Zustand beginnen kann. </p>
com.top_logic.ai.chat.view.list.DataListElement.Config.collapsible = Zusammenklappbar
com.top_logic.ai.chat.view.list.DataListElement.Config.collapsible.tooltip = Ob sich die Liste auf einen schmalen Streifen zusammenklappen lässt.
com.top_logic.ai.chat.view.list.DataListElement.Config.commands = Befehle
com.top_logic.ai.chat.view.list.DataListElement.Config.commands.tooltip = Kopfzeilen-Schaltflächen oberhalb der Liste. Jede ist ein Standard-Ansichtsbefehl - ein „generic-command“, der beliebige Aktionen zusammensetzt (execute-script, open-dialog, write-channel, with-transaction, …), mit der üblichen Beschriftung, dem Bild, dem Tooltip, der Ausführbarkeit und der Eingabe. Eine Chat-Sitzungsliste konfiguriert z. B. einen Befehl, der den Auswahlkanal leert („Neuer Chat“).
com.top_logic.ai.chat.view.list.DataListElement.Config.count = Anzahl
com.top_logic.ai.chat.view.list.DataListElement.Config.count.tooltip = Optionaler Kanal, der angibt, wie viele Zeilen die Liste anzeigt; wird bei jeder Änderung der Zeilen geschrieben. <p> Was ein „ <chat-rail/> “-Abschnitt ausliest, um eine Zahl neben seinem Titel anzuzeigen. Im Gegensatz zu den Abschnitten des Chats selbst, die im Browser zählen und die Zahl zurückmelden, zählt eine Liste auf dem Server, was bereits vorhanden ist – ohne Hin- und Rückweg, und die Zahl steht bereits vor dem ersten Rendern bereit. </p>
com.top_logic.ai.chat.view.list.DataListElement.Config.drawer-below = Ausklappliste unter
com.top_logic.ai.chat.view.list.DataListElement.Config.drawer-below.tooltip = Breite des umgebenden Containers in rem, unterhalb derer die Liste zur Ausklappliste wird. <p> Darunter bleibt von der Liste nur ihr schmaler Streifen, und ihr Pfeil öffnet sie über ihrem Nachbarn, statt eine Spalte zu belegen. Der Standardwert passt für eine Liste neben einer Konversation und einer Chat-Leiste. Setzen Sie den Wert auf die Breite, die die Liste und ihre Nachbarn nebeneinander brauchen; 0 behält bei jeder Breite eine Spalte. Erfordert <i>Zusammenklappbar</i>. </p>
com.top_logic.ai.chat.view.list.DataListElement.Config.empty-text = Leerer Text
com.top_logic.ai.chat.view.list.DataListElement.Config.empty-text.tooltip = Der Text, der angezeigt wird, wenn die Liste leer ist.
com.top_logic.ai.chat.view.list.DataListElement.Config.group-by = Nach... gruppieren
com.top_logic.ai.chat.view.list.DataListElement.Config.group-by.tooltip = Optionale TL-Script-Funktion, die für jede Zeile deren Gruppenbezeichnung berechnet. Zeilen mit derselben Bezeichnung werden unter einer Überschrift zusammengefasst, und zwar in der Reihenfolge ihres ersten Auftretens. „Leer“ bedeutet, dass keine Gruppierung erfolgt (eine flache Liste).
com.top_logic.ai.chat.view.list.DataListElement.Config.inputs = Eingaben
com.top_logic.ai.chat.view.list.DataListElement.Config.inputs.tooltip = Verweise auf Kanäle, deren Werte als Positionsargumente für <i>„Rows“</i> dienen.
com.top_logic.ai.chat.view.list.DataListElement.Config.lines = Zeilen
com.top_logic.ai.chat.view.list.DataListElement.Config.lines.tooltip = Die pro Zeile angezeigten Zeilen, von oben nach unten – das vertikale Pendant zu den Spalten einer Tabelle.
com.top_logic.ai.chat.view.list.DataListElement.Config.observed-types = Beobachtete Typen
com.top_logic.ai.chat.view.list.DataListElement.Config.observed-types.tooltip = Bei Typen, bei denen sich das Objekt ändert (Erstellen / Aktualisieren / Löschen), werden <i>die Zeilen</i> erneut ausgeführt, sodass die Liste automatisch aktualisiert wird.
com.top_logic.ai.chat.view.list.DataListElement.Config.personalization-key.tooltip = Optionale Überschreibung des automatisch abgeleiteten Personalisierungsschlüssels. Im Layout-Editor ausgeblendet: Der aus dem Ansichtskontext abgeleitete Schlüssel ist der richtige, und ein von Hand eingetragener Wert verschiebt stillschweigend, was ein Benutzer personalisiert hat.
com.top_logic.ai.chat.view.list.DataListElement.Config.react-element = React-Element
com.top_logic.ai.chat.view.list.DataListElement.Config.react-element.tooltip = Registriertes React-Element, das diese Liste rendert. Standardwert ist „TLDataList“. Im Layout-Editor ausgeblendet: Der Wert muss mit einer Registrierung in TypeScript übereinstimmen.
com.top_logic.ai.chat.view.list.DataListElement.Config.row-actions = Zeilenaktionen
com.top_logic.ai.chat.view.list.DataListElement.Config.row-actions.tooltip = Wenn in einer Zeile der Trigger angezeigt wird, der die zugehörigen Befehle auslöst.
com.top_logic.ai.chat.view.list.DataListElement.Config.row-channel = Reihenkanal
com.top_logic.ai.chat.view.list.DataListElement.Config.row-channel.tooltip = Name des lokalen Kanals, aus dem ein Zeilenbefehl seine Zeile liest. <p> Wird von dieser Liste registriert und ist nur innerhalb dieser sichtbar, ähnlich wie „ <context-menu> “ sein „contextTarget“ registriert. Benennen Sie ihn nur um, um eine Kollision mit einem Kanal der übergeordneten Ansicht zu vermeiden. </p>
com.top_logic.ai.chat.view.list.DataListElement.Config.row-commands = Befehle für Zeilen
com.top_logic.ai.chat.view.list.DataListElement.Config.row-commands.tooltip = Befehle, die in einer einzigen Zeile angeboten werden, in einem Menü, das über die Zeile selbst geöffnet wird. <p> Jeder Befehl entspricht in seiner „ <generic-command> “ einem Kopfzeilenbefehl und verfügt über dieselbe Beschriftung, dasselbe Bild, dieselbe Clique, denselben Tooltip, dieselbe Ausführbarkeit und dieselbe Aktionskette – eine Umbenennung hinter „ <open-dialog> “, ein Löschen hinter „ <confirm> “. Die Zeile, in der das Menü geöffnet wurde, greift über den Zeilenkanal auf den Befehl zu; diesen gibt ein Befehl in seiner Eingabe an. Daher erkennt eine „ <executability> “-Regel die Zeile ebenfalls und wird neu ausgewertet, bevor sich das Menü öffnet. </p> <p> Die Darstellung erfolgt über das anwendungsinterne Kontextmenü, sodass die Einträge wie alle anderen Menüpunkte darin aussehen und auf dieselben Tasten reagieren. Eine Liste, die an einer Stelle platziert ist, an der kein Menü geöffnet werden kann – außerhalb eines „ <app-shell> “ –, löst keinen Trigger aus, anstatt einen fehlerhaften auszulösen. </p>
com.top_logic.ai.chat.view.list.DataListElement.Config.row-css-class = Zeilen-CSS-Klasse
com.top_logic.ai.chat.view.list.DataListElement.Config.row-css-class.tooltip = Optionale TL-Script-Funktion, bei der für eine Zeile zusätzliche CSS-Klassen für das entsprechende Zeilenelement berechnet werden. <p> Der Hook, den eine Ansicht benötigt, um <em>den Status</em> einer Zeile und nicht nur deren Text anzuzeigen – einen abgeschlossenen Schritt, einen fehlgeschlagenen Import, einen überfälligen Eintrag. Das Ergebnis wird bei der Ausgabe direkt in die Zeile geschrieben, sodass mehrere Klassen als durch Leerzeichen getrennte Zeichenfolge erscheinen; wie diese aussehen, ist Sache des Anwendungsthemas. </p> <p> Nicht „css-class“, die jedes View-Element besitzt und die die einzige Klasse des Stammelements der Liste ist. </p>
com.top_logic.ai.chat.view.list.DataListElement.Config.rows = Zeilen
com.top_logic.ai.chat.view.list.DataListElement.Config.rows.tooltip = TL-Script-Funktion zur Berechnung der Zeilenobjekte (eine <i>Sammlung</i>), analog zu den Zeilen von <table>.
com.top_logic.ai.chat.view.list.DataListElement.Config.search = Suche
com.top_logic.ai.chat.view.list.DataListElement.Config.search.tooltip = Ob die Liste ein Suchfeld anzeigt (clientseitiger Filter für den Zeilentext).
com.top_logic.ai.chat.view.list.DataListElement.Config.selection = Auswahl
com.top_logic.ai.chat.view.list.DataListElement.Config.selection.tooltip = Optionaler Zweiwege-Kanal, der das ausgewählte Zeilenobjekt enthält.
com.top_logic.ai.chat.view.list.DataListElement.Config.title = Titel
com.top_logic.ai.chat.view.list.DataListElement.Config.title.tooltip = Der über der Liste angezeigte Titel.
com.top_logic.ai.chat.view.list.DataListElement.Emphasis.PRIMARY = Grundschule
com.top_logic.ai.chat.view.list.DataListElement.Emphasis.PRIMARY.tooltip = Die hervorgehobene Zeile (Titelformat).
com.top_logic.ai.chat.view.list.DataListElement.Emphasis.SECONDARY = Sekundär
com.top_logic.ai.chat.view.list.DataListElement.Emphasis.SECONDARY.tooltip = Eine gedämpfte Nebenlinie.
com.top_logic.ai.chat.view.list.DataListElement.LineConfig.attribute = Attribut
com.top_logic.ai.chat.view.list.DataListElement.LineConfig.attribute.tooltip = Das in dieser Zeile angezeigte Modellattribut (Normalfall). Verwenden Sie stattdessen <i>„Wert“</i> für eine berechnete Zeile.
com.top_logic.ai.chat.view.list.DataListElement.LineConfig.emphasis = Schwerpunkt
com.top_logic.ai.chat.view.list.DataListElement.LineConfig.emphasis.tooltip = Wie deutlich die Zeile dargestellt wird. „Unset“ bedeutet, dass die erste Zeile <i>primär</i> und die übrigen <i>sekundär</i> sind.
com.top_logic.ai.chat.view.list.DataListElement.LineConfig.value = Wert
com.top_logic.ai.chat.view.list.DataListElement.LineConfig.value.tooltip = Eine TL-Script-Funktion, die den Text dieser Zeile berechnet – eine berechnete Zeile (ein formatierter Wert, eine Zählung), die mit einem einfachen Attribut nicht ausgedrückt werden kann.
com.top_logic.ai.chat.view.list.DataListElement.LinesConfig.lines = Zeilen
com.top_logic.ai.chat.view.list.DataListElement.LinesConfig.lines.tooltip = Die anzuzeigenden Zeilen, von oben nach unten.
com.top_logic.ai.chat.view.list.DataListElement.RowActions.ALWAYS = Immer
com.top_logic.ai.chat.view.list.DataListElement.RowActions.ALWAYS.tooltip = Immer sichtbar.
com.top_logic.ai.chat.view.list.DataListElement.RowActions.HOVER = Mit der Maus darüberfahren
com.top_logic.ai.chat.view.list.DataListElement.RowActions.HOVER.tooltip = Wird angezeigt, wenn sich der Mauszeiger über der Zeile befindet oder ein Element darin den Fokus hat.
com.top_logic.ai.chat.view.list.DataListElement.RowActions.NONE = Keine
com.top_logic.ai.chat.view.list.DataListElement.RowActions.NONE.tooltip = Wird niemals gerendert, unabhängig von den Einstellungen.
com.top_logic.ai.chat.view.list.DataListElement.tooltip = Deklaratives „ <data-list> “-Element: eine modellgebundene, formatierte, gruppierte, durchsuchbare und auswählbare Liste – die Darstellung einer Chat-Leiste, verallgemeinert auf beliebige Modelle. <p> Die Zeilen stammen aus einem TL-Script-Zeilenausdruck, genau wie „ <table> “ seine Zeilen bindet; eine Attributzeile wird anhand des Typs des Zeilenobjekts aufgelöst. Jede Zeile zeigt eine geordnete Liste von Zeilen (das vertikale Pendant zu den Spalten einer Tabelle); ihre Gruppenbezeichnung ist ein weiterer Ausdruck. Ein Klick auf eine Zeile schreibt das Zeilenobjekt in den bidirektionalen Auswahlkanal. Suche und Ein- und Ausblenden erfolgen clientseitig. Im Gegensatz zu <table> wird hier eine formatierte Liste (im „Session-Rail“-Look) und kein Datengitter gerendert; im Gegensatz zu <object-list> handelt es sich um einen auswählbaren Picker und nicht um einen In-Place-Editor für zusammengesetzte Elemente. </p> <p><b>VORLÄUFIGER FORK.</b> Die Engine verfügt über keine datengebundene Liste, die wie die Navigationsleiste mit Auswahl + Gruppierung + Suche gerendert wird. Dieses Element schließt diese Lücke in tl-ai und wird von der React-Komponente „TLDataList“ gerendert. <b>Upstream-Ziel:</b> ein generisches „ <data-list> “ in tl-layout-view; anschließend soll dieses Paket gelöscht werden. </p>
