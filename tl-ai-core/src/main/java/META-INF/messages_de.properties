com.top_logic.tl.ai.core.provider.chatcompletions.TokenLimitParam.MAX_COMPLETION_TOKENS.tooltip = Feld Max_completion_tokens, erforderlich für GPT-5/o-series reasoning models auf Azure <code>OpenAI</code> und real <code>OpenAI</code> Chat Completions Endpunkten.
