<!doctype html>
<html lang="de" data-tl-mode="light" data-tl-density="normal">
<head>
<meta charset="utf-8">
<title>TopLogic Design System — Filter-Werteliste</title>
<link rel="stylesheet" href="/fonts/style/interFonts.css">
<link rel="stylesheet" href="/fonts/style/bootstrap-icons.css">
<link rel="stylesheet" href="/dist/primitives.css">
<link rel="stylesheet" href="/dist/tokens.css">
<link rel="stylesheet" href="/dist/base.css">
<link rel="stylesheet" href="/dist/components.css">
<link rel="stylesheet" href="/specimen/specimen.css">
<style>
  /* In der Anwendung setzt bridge/popover.ts die Lage (fixed), usePopover die Höhe; hier steht das Popover statisch unter
     seinem Trichter, das zweite gedeckelt, damit der Rollbereich rollt. */
  .specimen__anchor { display: grid; justify-items: start; gap: var(--tl-space-xs); }
  .specimen__anchor > .tl-popover { position: static; }
  .specimen__capped { position: static; max-height: var(--tl-size-12); }
</style>
</head>
<body>
<main class="specimen">
  <div class="specimen__bar">
    <a class="tl-type-label" href="/">← Grundklassen</a>
    <span class="tl-type-heading-lg">Filter-Werteliste</span>
    <label class="tl-type-label"><input type="checkbox" id="mode"> dunkel</label>
    <label class="tl-type-label"><input type="checkbox" id="density"> kompakt</label>
  </div>

  <!-- Der Trichter bleibt sichtbar, solange sein Popover offen ist (aria-expanded). Links: Teilauswahl, „Alle“ gemischt,
       ein Wert ohne Treffer (leise). Rechts: viele Werte, Hülle gedeckelt — der Rollbereich rollt, Suche und Fuß stehen. -->
  <template id="rows">
    <div class="specimen__row specimen__row--narrow specimen__row--top">
      <span class="tl-type-label">Werteliste, Teilauswahl</span>
      <div class="specimen__anchor">
        <button type="button" class="tl-button tl-button--ghost tl-button--sm tl-button--icon tl-reveal-on-hover" aria-label="Filter aktiv" aria-haspopup="dialog" aria-expanded="true"><i class="tl-icon-sm bi bi-funnel-fill tl-button__icon" aria-hidden="true"></i></button>
        <div class="tl-popover tl-picker tl-filter-list" role="dialog" aria-label="Filter Status">
          <div class="tl-picker__scroll" role="menu" aria-label="Status">
            <button type="button" class="tl-menu__item tl-menu__item--check tl-filter-list__all tl-type-body" role="menuitemcheckbox" aria-checked="mixed" tabindex="0"><span class="tl-checkbox" aria-hidden="true"></span><span class="tl-menu__label">Alle</span></button>
            <button type="button" class="tl-menu__item tl-menu__item--check tl-type-body" role="menuitemcheckbox" aria-checked="true" tabindex="-1"><span class="tl-checkbox" aria-hidden="true"></span><span class="tl-menu__label">Offen</span><span class="tl-filter-list__count tl-type-label tl-nums">4</span></button>
            <button type="button" class="tl-menu__item tl-menu__item--check tl-type-body" role="menuitemcheckbox" aria-checked="true" tabindex="-1"><span class="tl-checkbox" aria-hidden="true"></span><span class="tl-menu__label">In Arbeit</span><span class="tl-filter-list__count tl-type-label tl-nums">12</span></button>
            <button type="button" class="tl-menu__item tl-menu__item--check tl-type-body" role="menuitemcheckbox" aria-checked="false" tabindex="-1"><span class="tl-checkbox" aria-hidden="true"></span><span class="tl-menu__label">Erledigt</span><span class="tl-filter-list__count tl-type-label tl-nums">230</span></button>
            <button type="button" class="tl-menu__item tl-menu__item--check tl-type-body" role="menuitemcheckbox" aria-checked="false" tabindex="-1" data-tl-state="empty"><span class="tl-checkbox" aria-hidden="true"></span><span class="tl-menu__label">Abgelehnt</span><span class="tl-filter-list__count tl-type-label tl-nums">0</span></button>
          </div>
          <div class="tl-filter-list__footer">
            <button type="button" class="tl-button tl-button--ghost tl-type-label">Filter entfernen</button>
            <button type="button" class="tl-button tl-button--ghost tl-type-label">Auswahl umkehren</button>
          </div>
        </div>
      </div>
    </div>
    <div class="specimen__row specimen__row--narrow specimen__row--top">
      <span class="tl-type-label">Viele Werte, mit Suche, Hülle gedeckelt</span>
      <div class="tl-popover tl-picker tl-filter-list specimen__capped" role="dialog" aria-label="Filter Verantwortlich">
        <span class="tl-field-group"><span class="tl-field-group__icon" aria-hidden="true"><i class="tl-icon-sm bi bi-search"></i></span>
          <input class="tl-field tl-type-body" aria-label="Werte suchen">
        </span>
        <div class="tl-picker__scroll" role="menu" aria-label="Verantwortlich">
          <button type="button" class="tl-menu__item tl-menu__item--check tl-filter-list__all tl-type-body" role="menuitemcheckbox" aria-checked="true" tabindex="0"><span class="tl-checkbox" aria-hidden="true"></span><span class="tl-menu__label">Alle</span></button>
          <button type="button" class="tl-menu__item tl-menu__item--check tl-type-body" role="menuitemcheckbox" aria-checked="true" tabindex="-1"><span class="tl-checkbox" aria-hidden="true"></span><span class="tl-menu__label">A. Brandt</span><span class="tl-filter-list__count tl-type-label tl-nums">31</span></button>
          <button type="button" class="tl-menu__item tl-menu__item--check tl-type-body" role="menuitemcheckbox" aria-checked="true" tabindex="-1"><span class="tl-checkbox" aria-hidden="true"></span><span class="tl-menu__label">K. Yilmaz</span><span class="tl-filter-list__count tl-type-label tl-nums">18</span></button>
          <button type="button" class="tl-menu__item tl-menu__item--check tl-type-body" role="menuitemcheckbox" aria-checked="true" tabindex="-1"><span class="tl-checkbox" aria-hidden="true"></span><span class="tl-menu__label">M. Novak</span><span class="tl-filter-list__count tl-type-label tl-nums">9</span></button>
          <button type="button" class="tl-menu__item tl-menu__item--check tl-type-body" role="menuitemcheckbox" aria-checked="true" tabindex="-1"><span class="tl-checkbox" aria-hidden="true"></span><span class="tl-menu__label">S. Weber</span><span class="tl-filter-list__count tl-type-label tl-nums">7</span></button>
          <button type="button" class="tl-menu__item tl-menu__item--check tl-type-body" role="menuitemcheckbox" aria-checked="true" tabindex="-1"><span class="tl-checkbox" aria-hidden="true"></span><span class="tl-menu__label">J. Lorenz</span><span class="tl-filter-list__count tl-type-label tl-nums">5</span></button>
          <button type="button" class="tl-menu__item tl-menu__item--check tl-type-body" role="menuitemcheckbox" aria-checked="true" tabindex="-1"><span class="tl-checkbox" aria-hidden="true"></span><span class="tl-menu__label">T. Krause</span><span class="tl-filter-list__count tl-type-label tl-nums">3</span></button>
          <button type="button" class="tl-menu__item tl-menu__item--check tl-type-body" role="menuitemcheckbox" aria-checked="true" tabindex="-1" data-tl-state="empty"><span class="tl-checkbox" aria-hidden="true"></span><span class="tl-menu__label">R. Hahn</span><span class="tl-filter-list__count tl-type-label tl-nums">0</span></button>
        </div>
        <div class="tl-filter-list__footer">
          <button type="button" class="tl-button tl-button--ghost tl-type-label" disabled>Filter entfernen</button>
          <button type="button" class="tl-button tl-button--ghost tl-type-label">Auswahl umkehren</button>
        </div>
      </div>
    </div>
  </template>

  <section class="specimen__panel" id="on-layer"><p class="tl-type-heading-sm">Auf surface-layer</p></section>
  <section class="specimen__base" id="on-base"><p class="tl-type-heading-sm">Auf surface-base</p></section>
  <section class="specimen__overlay" id="on-overlay"><p class="tl-type-heading-sm">Auf surface-overlay</p></section>
</main>
<script>
  const tpl = document.getElementById('rows');
  for (const id of ['on-layer', 'on-base', 'on-overlay'])
    document.getElementById(id).append(tpl.content.cloneNode(true));
  const html = document.documentElement;
  document.getElementById('mode').addEventListener('change', (e) => html.setAttribute('data-tl-mode', e.target.checked ? 'dark' : 'light'));
  document.getElementById('density').addEventListener('change', (e) => html.setAttribute('data-tl-density', e.target.checked ? 'compact' : 'normal'));
</script>
</body>
</html>
