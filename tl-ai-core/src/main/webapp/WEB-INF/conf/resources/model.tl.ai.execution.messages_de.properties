model.tl.ai.execution.AgentExecution.errorMessage.tooltip = Fehlertext eines fehlgeschlagenen Laufs.
model.tl.ai.execution.AgentExecution.inputTokens = Eingabe-Tokens
model.tl.ai.execution.AgentExecution.inputTokens.tooltip = Für diesen Lauf abgerechnete Prompt-Tokens.
