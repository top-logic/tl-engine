class.com.top_logic.oauth.server.I18NConstants.LLMS_INTRO = The application is an OAuth 2.1 authorization server for its own endpoints (MCP, A2A, REST). A client signs in its user with the authorization code flow with PKCE (S256) and names the endpoint it wants to call as resource (RFC 8707); the access token it receives is accepted only there.
