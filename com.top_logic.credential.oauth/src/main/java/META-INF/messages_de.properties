class.com.top_logic.credential.oauth.I18NConstants.ERROR_CLIENT_AUTHENTICATION_REQUIRED__CLIENT = Für den Client „{0}“ ist keine Client-Authentifizierung konfiguriert. Der Grant „Client Credentials“ steht nur Clients zur Verfügung, die sich beim Autorisierungsserver authentifizieren.
class.com.top_logic.credential.oauth.I18NConstants.ERROR_DEVICE_LOGIN_REQUIRED__URL_CODE_CLIENT = Anmeldung für „{2}“ erforderlich: Öffnen Sie {0} in einem Browser, bestätigen Sie den Code {1} und wiederholen Sie die Aktion.
class.com.top_logic.credential.oauth.I18NConstants.ERROR_DISCOVERY_FAILED__URL_STATUS = Das Abrufen des Discovery-Dokuments „{0}“ ist mit dem HTTP-Status {1} fehlgeschlagen.
class.com.top_logic.credential.oauth.I18NConstants.ERROR_ENDPOINT_NOT_ANNOUNCED__ISSUER_FIELD = Das Discovery-Dokument des Autorisierungsservers „{0}“ nennt den Endpunkt „{1}“ nicht.
class.com.top_logic.credential.oauth.I18NConstants.ERROR_INVALID_PRIVATE_KEY__ALGORITHM = Der private Schlüssel des Clients ist weder ein Schlüssel im Format PKCS#8 PEM noch ein JSON Web Key mit privatem Teil für den Algorithmus {0}.
class.com.top_logic.credential.oauth.I18NConstants.ERROR_INVALID_URL__URL = Die URL „{0}“ des Autorisierungsservers ist ungültig.
