model.tl.security.passkey.Passkey.tooltip = Ein Passkey (WebAuthn-Credential) eines Zugangs.
model.tl.security.passkey.Passkey.transports = Übertragungswege
model.tl.security.passkey.Passkey.transports.tooltip = Wie der Browser den Authentifikator erreicht, z. B. "internal" für das Gerät selbst oder "hybrid" für ein Smartphone.
model.tl.security.passkey.tooltip = Modul mit dem Typ für die Passkeys der Zugänge.
