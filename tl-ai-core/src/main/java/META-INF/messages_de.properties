com.top_logic.tl.ai.core.provider.chatcompletions.TokenLimitParam.MAX_TOKENS.tooltip = Veraltetes Feld max_tokens, verstanden von Mistral, <code>xAI</code> und lokalen Servern.
com.top_logic.tl.ai.core.provider.chatcompletions.TokenLimitParam.tooltip = JSON-Feldname, der das Output-Token-Limit in einem Chat Completions-Anfragekörper enthält. <p>Die Chat Completions API hat bisher max_tokens verwendet, aber GPT-5 und o-series reasoning models lehnen dies ab und verlangen max_completion_tokens (was auch versteckte reasoning tokens berücksichtigt). Andere <code>OpenAI</code> Backends (Mistral, <code>xAI</code>, lokale Server) verstehen nur max_tokens, so dass der Feldname per Anbietervoreinstellung wählbar ist.</p>
com.top_logic.tl.ai.core.provider.local.LocalProviderConfig = Lokal (OpenAI-kompatibel)
com.top_logic.tl.ai.core.provider.local.LocalProviderConfig.tooltip = <i>LLM-Anbieterkonfiguration</i> für lokale <code>OpenAI</code> Server (Ollama, LM Studio, <code>vLLM</code>). <p> Die Basis-URL ist obligatorisch und es ist kein API-Schlüssel erforderlich. Lokale Server sprechen das <code>OpenAI</code> Chat Completions-Protokoll (/v1/chat/completions), daher erzeugt diese Konfiguration einen <i>Chat Completions-Anbieter</i>. </p>
com.top_logic.tl.ai.core.provider.mistral.MistralProviderConfig = Mistral
