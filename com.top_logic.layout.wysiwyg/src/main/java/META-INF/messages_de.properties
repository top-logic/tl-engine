com.top_logic.layout.wysiwyg.ui.StructuredTextConfigService.Config.features.tooltip = Benannte <i>JSON-Objektfragmente</i>, die jeweils die Konfigurationsoptionen zur Aktivierung einer Editor-Funktion beschreiben. <p> Funktionen werden in einem Funktionssatz ausgewählt und mit der <i>Standardkonfiguration</i> kombiniert, um ein endgültiges JSON-Konfigurationsobjekt zu erstellen. </p>
