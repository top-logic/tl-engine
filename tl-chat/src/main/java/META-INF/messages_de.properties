com.top_logic.ai.chat.view.ChatRailElement.tooltip = Deklaratives „ <chat-rail/> “-Element: die rechte Leiste und ihr Bereich als ein View-Element. <p> Mehrere Chat-Elemente auf einer Seite treten über chat-id demselben Gespräch bei. Der optionale input-Kanal wählt die offene Agentensitzung. Eine leere Abschnittsliste ist die Framework-Reihenfolge (Fortschritt, Kontext, Quellen); benannte Host-Abschnitte stammen aus der Browser-Registrierung. Der Bereich ist Konfiguration dieses Elements, kein fünftes Tag. </p>
