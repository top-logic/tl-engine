com.top_logic.tl.ai.core.cookiepool.CookiePoolService = Cookie pool service
com.top_logic.tl.ai.core.cookiepool.CookiePoolService.tooltip = Service that persists and selects <i>cookie pool</i> business objects: named, per-user (or explicitly shared) browser login pools whose storageState JSON is stored <b>encrypted at rest</b>. <p> A cookie pool captures a browser session's authenticated login state (storageState: cookies + origin storage) so a later session - including a background/unattended agent - can start already logged in. The state is as sensitive as a password, so it is always encrypted with the platform installation key before it touches the state Binary, and decrypted only on read, via the platform <i>encryption service</i> (its <i>symmetric encryption</i>). This service never stores or returns the state in plaintext; if no encryption key is installed it refuses the operation rather than falling back to plaintext. </p> <p> <b>Scoping.</b> A pool created by a user defaults to owner = that user, shared = false, and is selectable only by its owner. A pool with shared = true (an admin/explicit choice, not something the agent verbs set) is selectable by any session, including an unattended one - the intended shared-login use case. Selection therefore returns the caller's own pools plus shared pools; this owner/shared filter is enforced explicitly here rather than left to SecurityContext.modelSecurity(), which grants everything in a run whose mode does not enforce model access - which is the default - and therefore cannot carry this isolation. </p> <p> Mirrors ScreenshotService in shape: it does <b>not</b> open its own Transaction. The pool-upsert call happens from the browserSaveCookies verb, a DATA_WRITE tool whose transaction is opened and committed by the agent loop's TransactionScope, so the pool is committed with the turn. Programmatic callers (and tests) supply their own transaction. </p>
