com.top_logic.storage.azure.AzureBlobStore = Azure blob store
com.top_logic.storage.azure.AzureBlobStore.Config.block-size = Block size
com.top_logic.storage.azure.AzureBlobStore.Config.block-size.tooltip = The size of the blocks of an upload in blocks. <p> One block is buffered in memory per running upload. The size is given in bytes, optionally with a unit, e.g. <code>8MB</code>. It must be at least 64 kB and must not exceed 2147483639 bytes (2 GB minus 8 bytes). Since a blob consists of at most 50,000 blocks, the block size limits the size of a blob: the default of 8 MB allows blobs of up to 400 GB. </p>
com.top_logic.storage.azure.AzureBlobStore.Config.class.tooltip = Implementation class of the store.
com.top_logic.storage.azure.AzureBlobStore.Config.container = Container
com.top_logic.storage.azure.AzureBlobStore.Config.container.tooltip = The name of the container holding the blobs. <p> The container must exist; it is not created by the store, so that a misspelled name is detected instead of silently storing the content in a new container. </p>
com.top_logic.storage.azure.AzureBlobStore.Config.direct-download = Direct download
com.top_logic.storage.azure.AzureBlobStore.Config.direct-download-lifetime = Direct download lifetime
com.top_logic.storage.azure.AzureBlobStore.Config.direct-download-lifetime.tooltip = The time a URL for a direct download stays valid, e.g. <code>60s</code>. <p> The storage checks the validity when the transfer starts, so a slow download of large content completes after the URL has expired. Anyone holding the URL can fetch the content within this time. At least one second, at most 7 days; the default is one minute. Only relevant if <i>Direct download</i> is enabled. </p>
com.top_logic.storage.azure.AzureBlobStore.Config.direct-download-min-size = Direct download minimum size
com.top_logic.storage.azure.AzureBlobStore.Config.direct-download-min-size.tooltip = The minimum size of content downloaded directly from the storage. <p> Smaller content is streamed through the application server, since the redirect would cost more than it saves. The size is given in bytes, optionally with a unit, e.g. <code>1MB</code>; the default is 1 MB. Only relevant if <i>Direct download</i> is enabled. </p>
com.top_logic.storage.azure.AzureBlobStore.Config.direct-download.tooltip = Whether browsers download content directly from the storage. <p> When enabled, a download in the React UI is answered with a redirect to a URL of the blob with a shared access signature instead of streaming the content through the application server. The browser must be able to reach the storage, see <i>Public endpoint</i>. The storage then also serves range requests, e.g. for seeking in audio or PDF content. The integrity check of the content against its stored hash is not applied to direct downloads. Signing the URL requires the account key; with a connection string that contains no account key, the content is streamed. </p>
com.top_logic.storage.azure.AzureBlobStore.Config.prefix = Prefix
com.top_logic.storage.azure.AzureBlobStore.Config.prefix.tooltip = Prefix of the names of the blobs inside the container, e.g. <code>blobs/</code>. <p> The name of a blob is this prefix directly followed by the key of the blob, so a prefix that is meant as directory must end with a slash. Several stores may share a container with different prefixes. Empty to store the blobs at the top level of the container. Blobs under the prefix that are not blobs of the store, and blobs in deeper directories below the prefix, are ignored. </p>
com.top_logic.storage.azure.AzureBlobStore.Config.public-endpoint = Public endpoint
com.top_logic.storage.azure.AzureBlobStore.Config.public-endpoint.tooltip = The URL under which browsers reach the blob service of the storage account, e.g. <code>https://files.example.com</code>. <p> URLs for direct downloads are issued for this address instead of the endpoint of the account. For the storage emulator Azurite, the address includes the account name as path, like the endpoint does. Empty if browsers reach the storage under the endpoint of the account. The value is an absolute URL with protocol and host. Only relevant if <i>Direct download</i> is enabled. </p>
com.top_logic.storage.azure.AzureBlobStore.Config.single-upload-threshold = Single upload threshold
com.top_logic.storage.azure.AzureBlobStore.Config.single-upload-threshold.tooltip = The maximum size of content uploaded in a single request. <p> Content up to this size is buffered in memory and uploaded in one request. Larger content is uploaded in blocks. The size is given in bytes, optionally with a unit, e.g. <code>16MB</code>, and must not exceed 2147483639 bytes (2 GB minus 8 bytes). The default is 16 MB. </p> <p> The threshold should be at least the <i>Block size</i>: a smaller threshold uploads content between both sizes as a single block, which takes two requests instead of one. </p>
com.top_logic.storage.azure.AzureBlobStore.tooltip = <i>Blob store</i> keeping each blob as block blob in a container of Azure Blob Storage. <p> The blob of a content is named by the configured prefix followed by the key of the blob. The container must exist. Content up to the single upload threshold is buffered in memory and uploaded in a single request; larger content and content of unknown size exceeding the threshold is streamed in blocks, buffering one block at a time, and committed when it is complete. Blocks of a failed upload are never committed; the storage discards them automatically after 7 days. A blob is never overwritten: storing fails if a blob with the chosen name exists. </p> <p> Optionally, browsers download content directly from the storage through short-lived URLs with a shared access signature instead of receiving it through the application server, see <i>Direct download</i>. </p>
com.top_logic.storage.azure.AzureRepositoryContentReader = Azure repository content reader
com.top_logic.storage.azure.AzureRepositoryContentReader.Config.attic = Attic
com.top_logic.storage.azure.AzureRepositoryContentReader.Config.attic.tooltip = The directory holding documents deleted from the repository, relative to the directory given by <i>Directory name</i>. <p> If not given, deleted documents are not looked up. </p>
com.top_logic.storage.azure.AzureRepositoryContentReader.Config.container-name = Container name
com.top_logic.storage.azure.AzureRepositoryContentReader.Config.container-name.tooltip = The name of the container holding the repository.
com.top_logic.storage.azure.AzureRepositoryContentReader.Config.directory-name = Directory name
com.top_logic.storage.azure.AzureRepositoryContentReader.Config.directory-name.tooltip = The directory in the container holding the repository and the attic.
com.top_logic.storage.azure.AzureRepositoryContentReader.Config.path = Path
com.top_logic.storage.azure.AzureRepositoryContentReader.Config.path.tooltip = The directory of the repository, relative to the directory given by <i>Directory name</i>.
com.top_logic.storage.azure.AzureRepositoryContentReader.tooltip = <i>Repository content reader</i> for a document repository of former versions that was stored in a container of Azure Blob Storage. <p> The repository is located in the configured container below the directory <code>&lt;directory-name&gt;/&lt;path&gt;/</code>, deleted documents below <code>&lt;directory-name&gt;/&lt;attic&gt;/</code>. Below these directories, the blobs follow the same naming as the files of a repository in the file system (see <i>file repository content reader</i>): the versions of a document are blobs named <code>_&lt;version&gt;_n_&lt;author&gt;</code> in the directory <code>_f&lt;name&gt;</code>, located in the (escaped) directories of the document path. </p> <p> To migrate the documents of such a repository, the application configures the reader as input of the <i>migrate document content processor</i> in its configuration, with the settings of the former repository: </p> <pre> &lt;config config:interface="com.top_logic.knowledge.service.migration.processors.DocumentRepositoryConfig"&gt; &lt;reader class="com.top_logic.storage.azure.AzureRepositoryContentReader" connection-string="%AZURE_BLOB_CONNECTION_SECRET%" container-name="..." directory-name="..." path="repository" attic="attic" /&gt; &lt;/config&gt; </pre>
com.top_logic.storage.azure.AzureStorageAccountConfig = Azure storage account configuration
com.top_logic.storage.azure.AzureStorageAccountConfig.account-key = Account key
com.top_logic.storage.azure.AzureStorageAccountConfig.account-key.tooltip = An access key of the storage account. <p> Required, if no <i>Connection string</i> is given. The value is given encrypted in the configuration, or as plain text with the prefix <code>unencrypted:</code>. </p>
com.top_logic.storage.azure.AzureStorageAccountConfig.account-name = Account name
com.top_logic.storage.azure.AzureStorageAccountConfig.account-name.tooltip = The name of the storage account. <p> Required, if no <i>Connection string</i> is given. </p>
com.top_logic.storage.azure.AzureStorageAccountConfig.connection-string = Connection string
com.top_logic.storage.azure.AzureStorageAccountConfig.connection-string.tooltip = The connection string of the storage account, as shown in the access keys of the account in the Azure portal, e.g. <code>DefaultEndpointsProtocol=https;AccountName=myaccount;AccountKey=...;EndpointSuffix=core.windows.net</code>. <p> The connection string contains the account key, so the value is given encrypted in the configuration, or as plain text with the prefix <code>unencrypted:</code>. Empty if the account is given by its account name and account key. A connection string with a shared access signature instead of an account key grants access as well, but allows no direct downloads. Must not be given together with <i>Account name</i>, <i>Account key</i> or <i>Endpoint</i>. </p>
com.top_logic.storage.azure.AzureStorageAccountConfig.endpoint = Endpoint
com.top_logic.storage.azure.AzureStorageAccountConfig.endpoint.tooltip = The URL of the blob service of the storage account, e.g. <code>https://myaccount.blob.core.windows.net</code>. <p> Empty for the default endpoint of an account in the Azure cloud, which is derived from the account name. Required for other clouds and for the storage emulator Azurite, where the account name is part of the path (<code>http://127.0.0.1:10000/devstoreaccount1</code>). Only used together with account name and account key. The value is an absolute URL with protocol and host. </p>
com.top_logic.storage.azure.AzureStorageAccountConfig.tooltip = Settings for accessing an Azure storage account. <p> The account is either given by a connection string, or by its account name and account key with an optional endpoint. Exactly one of both forms is used. </p>
