com.top_logic.ai.demo.secdemo.SecDemoSetupService = Service zur Einrichtung von Sicherheitsdemonstrationen
com.top_logic.ai.demo.secdemo.SecDemoSetupService$PersonaConfig = Persona-Konfiguration
com.top_logic.ai.demo.secdemo.SecDemoSetupService$PersonaConfig.tooltip = Eine Persona des Testbeds: ein Konto, die Gruppen, denen es beitritt, und die Rollen, die die Rollenregeln des Aspekts ihm geben sollen.
com.top_logic.ai.demo.secdemo.SecDemoSetupService$ProjectConfig = Projektkonfiguration
com.top_logic.ai.demo.secdemo.SecDemoSetupService$ProjectConfig.tooltip = Ein Beispielprojekt: sein Name, die Logins, die es als Partner aufführt, und die Tickets, die es enthält.
com.top_logic.ai.demo.secdemo.SecDemoSetupService$TicketConfig = Ticketkonfiguration
com.top_logic.ai.demo.secdemo.SecDemoSetupService$TicketConfig.tooltip = Ein Beispiel-Ticket.
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.component-access = Zugriff auf Komponenten
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.component-access.tooltip = Die Ansichten (Layout-Komponenten), die die Persona-Rollen öffnen dürfen, im Format der Datei „WEB-INF/conf/security.xml“ der Engine. <p> Zugriffsrechte allein reichen nicht aus, um eine Anwendung nutzbar zu machen: Eine Rolle, die einen Typ lesen darf, sieht dennoch keine Registerkarte, solange sie keine Befehlsgruppe im übergeordneten <i>zusammengesetzten Sicherheitslayout</i> besitzt. Genau hier kommen die Persona-Rollen ins Spiel. </p> <p> Ein Profil mit dem Namen „*“ wird auf jede Rolle angewendet, die eine konfigurierte Persona voraussichtlich innehaben wird. Auf diese Weise stellt die Testumgebung sicher, dass alle Personas dieselbe Benutzeroberfläche sehen: Das Einzige, was zwei von ihnen unterscheidet, ist dann die Richtlinie, niemals das, worauf sie zugreifen können – was ein „Zulassen/Verweigern“-Paar in einer Abfrage vergleichbar macht. Ein nach einer einzelnen Rolle benanntes Profil funktioniert weiterhin, wenn eine Persona bewusst unterschiedliche Ansichten benötigt. </p> <p> Im Gegensatz zum Import der Engine werden die Einträge hier <em>additiv</em> angewendet: Der Zugriff außerhalb dieser Konfiguration bleibt unberührt, sodass die mitgelieferte Demo unbeeinträchtigt bleibt, solange der Aspekt deaktiviert ist. </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.initial-password = Anfangspasswort
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.initial-password.tooltip = Passwort, das den Persona-Konten bei ihrer Erstellung zugewiesen wird. <p> Es muss den Passwortrichtlinien des konfigurierten Authentifizierungsgeräts entsprechen (standardmäßig: mindestens 8 Zeichen aus mindestens zwei Zeichenklassen). </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.personas = Personas
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.personas.tooltip = Die zu erzeugenden Konten, indiziert nach Login. <p> Ein Eintrag pro Persona des Testbeds. Die Einträge stehen in der Konfiguration und nicht im Code, damit die Matrix, die ein Tester im Kopf behalten muss – welcher Login welcher Gruppe beitritt, welche Rolle daraus folgen soll und was jede Persona zeigt -, an einer Stelle lesbar ist, neben den &lt;role-rules&gt;, der &lt;tool-access&gt;-Richtlinie und der &lt;security-config&gt;, die diesen Rollen ihre Bedeutung geben. </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.projects = Projekte
com.top_logic.ai.demo.secdemo.SecDemoSetupService.Config.projects.tooltip = Die Beispielprojekte und ihre Tickets. <p> Die Partner eines Projekts sind das, was die Rollenregel für den Geltungsbereich ausliest. Diese Liste ist damit der Ursprung der objektbezogenen Sicherheit dieser Fixture: gewöhnliche Geschäftsdaten, aus denen die Regel die Rolle ableitet. </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.groups = Gruppen
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.groups.tooltip = Namen der Gruppen, denen dieses Konto beitritt. <p> Müssen in <i>den ursprünglichen Gruppen</i> desselben Aspekts deklariert sein. Die Gruppenzugehörigkeit ist das Einzige, was ein Administrator hier von Hand pflegt; jede Rolle ergibt sich daraus über eine Regel. </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.login = Anmeldename
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.login.tooltip = Anmeldename des zu erstellenden Kontos.
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.partner-of = Partner von
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.partner-of.tooltip = Namen der Projekte, auf denen dieses Konto die Rolle für den Geltungsbereich innehaben soll. <p> Ebenfalls keine Zuweisung, sondern eine Folge davon, dass das Konto in den Partnern dieser Projekte aufgeführt ist, was unter <i>Projekte</i> (<i>Konfiguration des Sicherheits-Demo-Einrichtungsdienstes</i>) festgelegt wird. Steht hier aus demselben Grund wie <i>Rollen</i> – damit die Prüfung etwas hat, wogegen sie prüfen kann. </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.purpose = Zweck
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.purpose.tooltip = Eine Zeile, in der beschrieben wird, welche Rolle diese Persona in der Testumgebung demonstrieren soll. <p> Wird beim Systemstart protokolliert, sodass das Boot-Protokoll gleichzeitig als Index der Testumgebung dient. </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.roles = Rollen
com.top_logic.ai.demo.secdemo.SecDemoSetupService.PersonaConfig.roles.tooltip = Namen der Rollen, die die Tier-Regeln des Aspekts diesem Konto <b>an der Sicherheitswurzel</b> geben sollen. <p> Keine Zuweisung. Nichts in diesem Dienst gewährt eine Rolle – das tun die <singleton-rule>-Einträge des Aspekts, aus der Gruppenzugehörigkeit. Dies ist die Aussage der Matrix, und <i>der Sicherheits-Demo-Einrichtungsdienst</i> prüft sie nach dem Systemstart, sodass eine Regel, die nichts erzeugt, zu einer Warnung mit dem Namen der Persona führt und nicht zu einem stillschweigend eingeschränkten Agenten. </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.ProjectConfig.name = Name
com.top_logic.ai.demo.secdemo.SecDemoSetupService.ProjectConfig.name.tooltip = Name des Projekts.
com.top_logic.ai.demo.secdemo.SecDemoSetupService.ProjectConfig.partners = Partner
com.top_logic.ai.demo.secdemo.SecDemoSetupService.ProjectConfig.partners.tooltip = Logins der Konten, die dieses Projekt unter pm:Project#partners aufführt. <p> Die Eingabe der Rollenregel für den Geltungsbereich und damit die gesamte objektbezogene Sicherheit dieser Fixture. Es sind gewöhnliche Geschäftsdaten; die Regel leitet daraus die Rolle ab. </p>
com.top_logic.ai.demo.secdemo.SecDemoSetupService.ProjectConfig.tickets = Tickets
com.top_logic.ai.demo.secdemo.SecDemoSetupService.ProjectConfig.tickets.tooltip = Die in diesem Projekt enthaltenen Tickets.
com.top_logic.ai.demo.secdemo.SecDemoSetupService.TicketConfig.body = Inhalt
com.top_logic.ai.demo.secdemo.SecDemoSetupService.TicketConfig.body.tooltip = Der Inhalt des Tickets, nur für projectPartner lesbar – über eine <part>-Berechtigung.
com.top_logic.ai.demo.secdemo.SecDemoSetupService.TicketConfig.title = Titel
com.top_logic.ai.demo.secdemo.SecDemoSetupService.TicketConfig.title.tooltip = Der Titel des Tickets, lesbar für jeden, der das Ticket lesen darf.
com.top_logic.ai.demo.secdemo.SecDemoSetupService.tooltip = Richtet die Fixtures des Testbeds für Agentensicherheit ein: ein Konto pro Persona, dessen Gruppenzugehörigkeiten, die Beispielprojekte und Tickets, den Komponenten- (Layout-)Zugriff, den jede Persona braucht, um den Agenten-Chat zu erreichen – und eine Prüfung beim Systemstart, ob die deklarativen Rollenregeln die Rollen erzeugt haben, die die Persona-Matrix behauptet. <p> Der Dienst wird nur gestartet, wenn der Opt-in-Aspekt WEB-INF/conf/secdemo.config.xml in WEB-INF/conf/metaConf.txt aufgeführt ist. Alle Schritte sind idempotent, sodass ein Neustart der Anwendung nichts doppelt anlegt. </p> <p> <b>Er weist keine Rollen zu.</b> Das ist der Unterschied zu der Version dieser Fixture, die dem Issue #290 vorausging, und genau darum geht es: Rollen entstehen aus den <role-rules> desselben Aspekts – eine <singleton-rule> je Tier, die die Gruppenzugehörigkeit liest, und eine <rule type="reference">, die den Geltungsbereich aus pm:Project#partners ableitet. Die Zuweisung aus Java vermittelte kein Konfigurationsidiom und verbarg zudem den Fehler, den die Trennung von Tier und Geltungsbereich möglich macht: eine Rollenregel, die nichts erzeugt. Deshalb hält die Matrix fest, welche Rollen jede Persona innehaben <em>soll</em>, und dieser Dienst prüft nach dem Commit der Startdaten, ob die Regeln sie geliefert haben. </p> <p> Was in der Engine keine deklarative Entsprechung hat und deshalb hier bleibt: das Anlegen von Konten, ihre Aufnahme in Gruppen, das Erzeugen von Beispielinstanzen und das Anwenden des Komponentenzugriffs. Die <i>Einrichtung der Zugriffskonfiguration</i> der Engine liest Komponentenzugriff deklarativ, aber nur aus einem festen Pfad, und ihr Import <em>setzt</em> den Zugriff jeder Ansicht der Anwendung <em>zurück</em>, bevor sie diese Datei anwendet. Ein Opt-in-Aspekt darf beides nicht, deshalb wendet dieser Dienst genau dasselbe Format der <i>Zugriffskonfiguration</i> additiv an. </p>
