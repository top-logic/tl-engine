com.top_logic.tl.ai.tool.api.AICategory = AI
com.top_logic.tl.ai.tool.api.AICategory.tooltip = Services running AI agents, connecting them to language models and providing them with tools, knowledge and access to the application.
com.top_logic.tl.ai.tool.api.AnswerMarking = Answer marking
com.top_logic.tl.ai.tool.api.AnswerMarking.FRAMEWORK = Framework
com.top_logic.tl.ai.tool.api.AnswerMarking.FRAMEWORK.tooltip = The framework wraps the answer in the MODEL_DATA envelope. <p> The default, because the alternative default is the bug this exists to close: a tool moved from TL-Script to Java used to lose its envelope silently, on exactly the payload that needs it most (issue #478). Forgetting to declare anything therefore marks the answer rather than leaving it bare. </p> <p> An answer that already is one complete envelope block is left alone - see UntrustedEnvelope.isMarked - so a tool that marked itself before the framework did, here or in an application built on it, does not get a second wrap that would neutralise its first. </p>
com.top_logic.tl.ai.tool.api.AnswerMarking.NONE = None
com.top_logic.tl.ai.tool.api.AnswerMarking.NONE.tooltip = Nothing is marked, because nothing in the answer came from anywhere else. <p> For an answer that is this application's own sentence: a confirmation of what the tool did, a refusal, computed help text, a schema, a list of names the application defines. Marking those would be untrue, and untrue in the expensive direction - the standing rule tells the model that a marked block is never an instruction to it, so a framework answer that <em>is</em> an instruction (a skill's text, a delegate's report, "call listTypes first") must not carry the tag. </p>
com.top_logic.tl.ai.tool.api.AnswerMarking.TOOL = Tool
com.top_logic.tl.ai.tool.api.AnswerMarking.TOOL.tooltip = The tool marks its own content, and the framework adds nothing. <p> For the three cases the framework cannot get right by itself: an answer whose content belongs in another <i>untrusted envelope</i> kind (a fetched page, a stored document, an external server's answer), an answer that is a marked block with the tool's own sentences <em>around</em> it, and an answer whose marking carries a better source than the tool's name - the object a listing was taken from, say. </p> <p> It is a promise, not an exemption: a tool that declares this and marks nothing returns business data bare. </p>
com.top_logic.tl.ai.tool.api.AnswerMarking.tooltip = Who marks a tool's answer as untrusted content - the framework, the tool, or nobody. <p> The question this answers is not "is this tool dangerous" but "was the text in this answer written by somebody other than the user this run serves". A business application's tools almost always answer with text its users typed, so <i>framework</i> is the default and the other two values are statements a tool author makes on purpose - and that a reviewer can read as such. </p>
com.top_logic.tl.ai.tool.api.P = P
com.top_logic.tl.ai.tool.api.P.required = Required
com.top_logic.tl.ai.tool.api.P.required.tooltip = Whether this parameter is required. Defaults to true.
com.top_logic.tl.ai.tool.api.P.tooltip = Describes a parameter of a <i>tool method</i>-annotated method.
com.top_logic.tl.ai.tool.api.P.value = Value
com.top_logic.tl.ai.tool.api.P.value.tooltip = Description of the parameter. Sent to the LLM.
com.top_logic.tl.ai.tool.api.ToolMethod = Tool method
com.top_logic.tl.ai.tool.api.ToolMethod.check = Check
com.top_logic.tl.ai.tool.api.ToolMethod.check.tooltip = The name of a method of the same class that refuses a call before it runs. <p> That method takes exactly the parameters of the tool method, receives the same arguments and returns the refusal, phrased for the model, or <code>null</code>. It is asked before anybody is asked to approve the call, so it must not change anything. The tool method has to refuse the same calls itself: not every caller asks the check first. </p> <p> Empty, the default, means the tool refuses nothing early. </p>
com.top_logic.tl.ai.tool.api.ToolMethod.concurrencySafe = Concurrency safe
com.top_logic.tl.ai.tool.api.ToolMethod.concurrencySafe.tooltip = Whether this tool can safely run in parallel with other concurrency-safe tools. Defaults to true. Override to false only for tools with external concurrency constraints.
com.top_logic.tl.ai.tool.api.ToolMethod.description = Description
com.top_logic.tl.ai.tool.api.ToolMethod.description.tooltip = Description of what this tool does. Sent to the LLM. Multiple values are joined with newline.
com.top_logic.tl.ai.tool.api.ToolMethod.dryRun = Dry run
com.top_logic.tl.ai.tool.api.ToolMethod.dryRun.tooltip = The name of a boolean parameter of this method that makes a call a dry run. <p> A call with that parameter set to true changes nothing, so it runs as a read whatever <i>mode</i> declares: without an approval prompt and outside the transaction of the turn. The method has to keep that promise, and it is a promise about security: whatever a dry run changed would be changed without the user being asked. </p> <p> Empty, the default, means the tool has no dry run. </p>
com.top_logic.tl.ai.tool.api.ToolMethod.group = Group
com.top_logic.tl.ai.tool.api.ToolMethod.group.tooltip = The tool group this tool belongs to - the unit an administrator grants to a security role. <p> Empty means ungrouped, which denies the tool to every role: with deny-by-default, a tool added without a group must not slip into an existing grant by accident. An administrator can assign a group in the access policy, which also overrides the value declared here. </p> <p> Enforced only where a deployment has configured a &lt;tool-access&gt; policy; without one, tool authorization stays unenforced and this value is inert. See the developer articles ai/security/tool-authorization and ai/security/tool-access-configuration for the administrator's view. </p>
com.top_logic.tl.ai.tool.api.ToolMethod.marking = Marking
com.top_logic.tl.ai.tool.api.ToolMethod.marking.tooltip = Who marks this tool's answer as untrusted content. <p> Defaults to <i>framework</i>, which wraps the answer in the MODEL_DATA envelope - the same marking a TL-Script tool's answer gets, so that moving a tool from TL-Script to Java does not silently take the envelope off (issue #478). Declare <i>none</i> when the answer is this application's own sentence, and <i>tool</i> when the tool marks its content itself. </p>
com.top_logic.tl.ai.tool.api.ToolMethod.mode = Mode
com.top_logic.tl.ai.tool.api.ToolMethod.mode.tooltip = What kind of state change this tool makes. Defaults to <i>structural</i> (fail-closed).
com.top_logic.tl.ai.tool.api.ToolMethod.name = Name
com.top_logic.tl.ai.tool.api.ToolMethod.name.tooltip = Tool name. Defaults to the Java method name if empty.
com.top_logic.tl.ai.tool.api.ToolMethod.tooltip = Marks a method as a tool that the agent can invoke.
com.top_logic.tl.ai.tool.api.ToolMethod.truncationHint = Truncation hint
com.top_logic.tl.ai.tool.api.ToolMethod.truncationHint.tooltip = Per-tool maximum character count before the agent loop truncates the result, or -1 to use the global default. Set to <code>2147483647</code> to opt out of truncation entirely.
com.top_logic.tl.ai.tool.api.ToolMethod.types = Types
com.top_logic.tl.ai.tool.api.ToolMethod.types.tooltip = The qualified names of the model types this tool works on, e.g. "myapp:Customer". <p> <b>Enforced.</b> Before a declared tool runs, the acting principal's READ rights are asked for every declared type. A tool whose declared types the principal may read none of is refused before it runs - with a reason naming the type - and is left out of the tool schemas the model is sent, so it does not plan around a tool it could not use. A tool that declares nothing is unaffected: an empty declaration is "this tool makes no claim", never "this tool touches nothing". </p> <p> What it buys, and in this order: the model gets "you have no read access to Customer" instead of an empty result it reports to the user as "there are no customers"; the request carries one tool less; and a reviewer can read off which tools claim which types. </p> <p> <b>Declare a type only where its READ right is granted to a role held on the security root.</b> The check is an L1 check and reads roles there, like every other one - see the developer article ai/security/declared-types. A type whose read right is derived <em>per object</em> instead, as tl.ai.screenshots:Screenshot derives AiBinaryOwner from the screenshot's own owner, must <b>not</b> be declared: no account holds such a role on the root, so declaring it would refuse the owner their own object. Where you cannot tell, declare nothing - the per-object checks below are what protects the data either way. </p> <p> <b>Not every tool can declare, and none has to.</b> Instance browsing, TL-Script execution and search take the type from their arguments, so there is nothing fixed to name; they are governed by the per-object checks that apply to every tool regardless - ModelSecurity.canRead on each object touched, the read filtering of the results, and the pre-commit guard. A declaration is an early, coarse refusal in front of those checks, never a replacement for them, and a tool can lie about what it touches while the per-object checks cannot be lied to. </p> <p> A name that resolves to no type of the application model is <em>skipped</em>, with a warning: a typo is a broken declaration and not a statement about rights, and turning it into a denial would take a working tool away from every user for nothing. A tool all of whose declarations are unresolvable is treated as declaring nothing. </p>
com.top_logic.tl.ai.tool.api.ToolMethod.unavailable = Unavailable
com.top_logic.tl.ai.tool.api.ToolMethod.unavailable.tooltip = The name of a method of the same class that says why this tool can do nothing in the current run. <p> That method takes exactly one parameter, the <i>tool execution context</i> of the run, and returns the reason, phrased for the model, or <code>null</code> when the tool can act. A tool that answers is not offered to the model, and a call that names it anyway is answered with the reason. The method must not change anything. </p> <p> Empty, the default, means the tool can act in every run. </p>
com.top_logic.tl.ai.tool.api.ToolMode = Tool mode
com.top_logic.tl.ai.tool.api.ToolMode.DATA_WRITE = Data write
com.top_logic.tl.ai.tool.api.ToolMode.DATA_WRITE.tooltip = Tool writes shared application data (instances, records).
com.top_logic.tl.ai.tool.api.ToolMode.EXTERNAL = External
com.top_logic.tl.ai.tool.api.ToolMode.EXTERNAL.tooltip = Tool communicates with a system outside this application.
com.top_logic.tl.ai.tool.api.ToolMode.READ = Read
com.top_logic.tl.ai.tool.api.ToolMode.READ.tooltip = Tool changes nothing in this application's state - which says nothing about whether it reaches outside it, a property carried by its group (<code>"egress"</code>).
com.top_logic.tl.ai.tool.api.ToolMode.STRUCTURAL = Structural
com.top_logic.tl.ai.tool.api.ToolMode.STRUCTURAL.tooltip = Tool modifies application structure (model, schema, annotations).
com.top_logic.tl.ai.tool.api.ToolMode.USER_SCOPED = User scoped
com.top_logic.tl.ai.tool.api.ToolMode.USER_SCOPED.tooltip = Tool makes changes scoped to the current user only (temp views, personal dashboards).
com.top_logic.tl.ai.tool.api.ToolMode.tooltip = Categorizes what kind of state change a tool makes.
com.top_logic.tl.ai.tool.api.registry.ReflectiveToolFactory = Reflective tool factory
com.top_logic.tl.ai.tool.api.registry.ReflectiveToolFactory.Config.tool = Tool
com.top_logic.tl.ai.tool.api.registry.ReflectiveToolFactory.Config.tool-class = Tool class
com.top_logic.tl.ai.tool.api.registry.ReflectiveToolFactory.Config.tool-class.tooltip = The Java class containing <i>tool method</i> annotated methods. <p> This class will be scanned for tool definitions. All methods annotated with @ToolMethod will be exposed as AI tools. The class is instantiated with its no-argument constructor. </p> <p> Exactly one of the tool class and the tool must be given. </p>
com.top_logic.tl.ai.tool.api.registry.ReflectiveToolFactory.Config.tool.tooltip = Configuration of the object whose <i>tool method</i> annotated methods are exposed as AI tools. <p> Used instead of a tool class for a tool with configuration options of its own. Exactly one of the two must be given. </p>
com.top_logic.tl.ai.tool.api.registry.ReflectiveToolFactory.tooltip = A <i>tool factory</i> that reflectively discovers tools from a Java class with <i>tool method</i> annotated methods. <p> This factory extracts tool specifications from the configured class and creates corresponding <i>tool</i> instances for each annotated method. </p> <p> The object whose methods are called is either created by the no-argument constructor of the tool class, or instantiated from the tool configuration, when the tool has configuration options of its own: </p> <pre> &lt;implementation class="com.top_logic.tl.ai.tool.api.registry.ReflectiveToolFactory" tool-class="com.example.MyTool"/&gt; &lt;implementation class="com.top_logic.tl.ai.tool.api.registry.ReflectiveToolFactory"&gt; &lt;tool class="com.example.MyConfiguredTool" my-option="..."/&gt; &lt;/implementation&gt; </pre>
com.top_logic.tl.ai.tool.api.registry.ToolFactory.createTools = Create tools
com.top_logic.tl.ai.tool.api.registry.ToolFactory.createTools.return = A list of tools created by this factory. Must not be null.
com.top_logic.tl.ai.tool.api.registry.ToolFactory.createTools.tooltip = Creates the list of tools provided by this factory. <p> This method is typically called once during service initialization. The returned tools will be registered in the <i>tool registry service</i> and made available to AI agents. </p>
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService = Tool registry service
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService$ToolFactoryConfig = Tool factory configuration
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService$ToolFactoryConfig.tooltip = Configuration for a named tool factory.
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService.Config.tool-factories = Tool factories
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService.Config.tool-factories.tooltip = Map of named tool factories available in the application. <p> Each tool factory is identified by a unique name. The factory name becomes part of the qualified tool name (factory-name.tool-name) used to reference tools in TL-Script functions. </p>
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService.ToolFactoryConfig.implementation = Implementation
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService.ToolFactoryConfig.implementation.tooltip = The tool factory implementation.
com.top_logic.tl.ai.tool.api.registry.ToolRegistryService.tooltip = Registry service for managing tools available in the application. <p> Tools are organized by factory. Each factory produces a set of tools, and each tool is identified by a qualified name in the format {factory-name}.{tool-name}. This allows tools from different factories to have the same simple name without conflicts. </p>
