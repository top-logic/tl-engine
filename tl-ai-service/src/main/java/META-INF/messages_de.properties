com.top_logic.ai.service.AIService = AI-Dienst
com.top_logic.ai.service.AIService.Config.default-model = Standardmodell
com.top_logic.ai.service.AIService.Config.default-model.tooltip = Der Standardmodellname, der verwendet wird, wenn kein Modell explizit angegeben wird. <p> Dieser sollte mit einem der in <i>Factories</i> konfigurierten Modellnamen ï¿½bereinstimmen. Wird er nicht angegeben oder ist er null, wird das Modell der ersten Fabrik als Standard verwendet. </p>
com.top_logic.ai.service.AIService.Config.factories = Fabriken
com.top_logic.ai.service.AIService.Config.factories.tooltip = Die konfigurierten Modellfabriken. <p> Jede Fabrik wird durch den Modellnamen identifiziert, den sie produziert, und verwaltet einen Pool von Chat-Modell-Instanzen fï¿½r dieses spezifische Modell. </p>
com.top_logic.ai.service.AIService.tooltip = TopLogic-Dienst, der den Zugriff auf KI-Modelle ï¿½ber <i>LangChain4j</i> mit thread-sicherem Client-Pooling ermï¿½glicht. <p> Dieser Dienst verwaltet mehrere <i>Chat-Modell-Fabrik-Instanzen</i>, die jeweils fï¿½r ein bestimmtes KI-Modell konfiguriert sind. Die Modelle werden gepoolt und automatisch an den aktuellen <i>Interaktionskontext</i> gebunden und dann an den Pool zurï¿½ckgegeben, wenn der Kontext zerstï¿½rt wird. </p>
com.top_logic.ai.service.ChatModelFactory = Chat-Modellfabrik
com.top_logic.ai.service.ChatModelFactory.Config.max-idle-models = Maximale Modelle im Leerlauf
com.top_logic.ai.service.ChatModelFactory.Config.max-idle-models.tooltip = Die maximale Anzahl der inaktiven Chat-Modelle, die im Pool gehalten werden. <p> Voreinstellung: 5 </p>
com.top_logic.ai.service.ChatModelFactory.Config.max-pool-size = Maximale Poolgrï¿½ï¿½e
com.top_logic.ai.service.ChatModelFactory.Config.max-pool-size.tooltip = Die maximale Anzahl von Chatmodellen im Pool. <p> Standard: 10 </p>
com.top_logic.ai.service.ChatModelFactory.Config.models = Modelle
com.top_logic.ai.service.ChatModelFactory.Config.models.tooltip = Die Modellnamen (z. B. "gpt-4o, gpt-3.5-turbo" oder "claude-3-opus, claude-3-sonnet"). <p> Kommagetrennte Liste von Modellnamen. Jeder Modellname dient als eindeutiger Bezeichner und bestimmt, welche Modelle angefordert werden kï¿½nnen. Alle aufgelisteten Modelle verwenden dieselben API-Anmeldeinformationen von dieser Fabrik. </p>
com.top_logic.ai.service.ChatModelFactory.tooltip = Abstrakte Fabrik zum Erstellen und Verwalten von gepoolten <i>Chat-Modell-Instanzen</i>. <p> Diese Fabrik erstellt Objektpools fï¿½r <i>LangChain4j-Chatmodell-Instanzen</i>. Jede Fabrik ist fï¿½r einen bestimmten AI-Anbieter konfiguriert und kann Pools fï¿½r mehrere Modelle dieses Anbieters erstellen. </p> <p> Konkrete Implementierungen existieren fï¿½r verschiedene AI-Anbieter: </p> <ul> <li><i>OpenAI-Chatmodellfabrik</i>: Fï¿½r OpenAI-Modelle (GPT-4o, GPT-3.5-turbo, etc.)</li> <li><i>anthropische Chat-Modell-Fabrik</i>: Fï¿½r Anthropic-Modelle (Claude, etc.)</li> <li><i>mistral chat model factory</i>: Fï¿½r Mistral-KI-Modelle</li> </ul>
