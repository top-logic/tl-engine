model.tl.element = Basisklassen
model.tl.element.Attributed = Fachobjekt
model.tl.element.Attributed.tooltip = Gemeinsamer Basistyp für Fachobjekte, deren Eigenschaften durch das Anwendungsmodell beschrieben werden.
model.tl.element.StructuredElement = Strukturelement
model.tl.element.StructuredElement.parent = Elternelement
model.tl.element.StructuredElement.parent.tooltip = Der Knoten, der dieses Element enthält. Die Referenz ist die Umkehrung der Kind-Referenz des Containers. Sie ist abstrakt und muss in der davon abgeleiteten Struktur redeklariert werden; ohne diese Redeklaration schlägt jeder Zugriff darauf fehl.
model.tl.element.StructuredElement.tooltip = Basistyp für einen Knoten einer baumartigen Struktur. Ein Strukturelement kennt den Knoten, der es enthält. Der oberste Typ einer Struktur leitet von diesem Typ ab und muss die Referenz auf das Elternelement redeklarieren, verengt auf den Typ seiner Container.
model.tl.element.StructuredElementContainer = Strukturelement-Container
model.tl.element.StructuredElementContainer.children = Kinder
model.tl.element.StructuredElementContainer.children.tooltip = Die in diesem Knoten enthaltenen Knoten. Die Kinder sind geordnet und werden gemeinsam mit ihrem Container gelöscht. Die Referenz ist abstrakt und muss in jedem konkreten Typ der Struktur redeklariert werden, der Kinder besitzt; ohne diese Redeklaration schlägt jeder Zugriff darauf fehl.
model.tl.element.StructuredElementContainer.tooltip = Basistyp für einen Knoten einer baumartigen Struktur, der selbst weitere Knoten enthalten kann. Jeder Typ einer Struktur mit Unterstruktur leitet von diesem Typ ab, und jeder konkrete Typ darunter muss die Kind-Referenz redeklarieren, verengt auf die Typen, die er enthalten darf.
model.tl.element.tooltip = Modul mit den Basistypen, von denen die Fachtypen einer Anwendung abgeleitet werden. Insbesondere definiert es die Typen für baumartige Strukturen.
