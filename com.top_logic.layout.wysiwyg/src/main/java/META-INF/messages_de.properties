com.top_logic.layout.wysiwyg.ui.SetOpenLinkCommandModificator.CommandForTypeConfig.commandId = Befehls-ID
com.top_logic.layout.wysiwyg.ui.SetOpenLinkCommandModificator.CommandForTypeConfig.commandId.tooltip = Die ID des <i>Befehls</i>.
com.top_logic.layout.wysiwyg.ui.SetOpenLinkCommandModificator.CommandForTypeConfig.type = Typ
com.top_logic.layout.wysiwyg.ui.SetOpenLinkCommandModificator.CommandForTypeConfig.type.tooltip = Der qualifizierte Name des <i>Typs</i>.
com.top_logic.layout.wysiwyg.ui.SetOpenLinkCommandModificator.Config.commandMappings = Befehlszuordnungen
com.top_logic.layout.wysiwyg.ui.SetOpenLinkCommandModificator.Config.commandMappings.tooltip = Definiert eine Abbildung von <i>Typen</i> auf die ids des <i>Befehls</i>, der Instanzen des jeweiligen Typs anzeigen soll. <p> Die Typen werden mit "instance of" gegen die Instanzen abgeglichen, nicht mit Gleichheit. Das bedeutet, dass mehrere Einträge mit einer Instanz übereinstimmen können. Die Typen werden in der angegebenen Reihenfolge geprüft. Der erste übereinstimmende Typ gewinnt. </p>
com.top_logic.layout.wysiwyg.ui.SetOpenLinkCommandModificator.Config.field = Feld
com.top_logic.layout.wysiwyg.ui.SetOpenLinkCommandModificator.Config.field.tooltip = Der Name des Attributs, dessen <i>Formularfeld</i> geändert werden soll.
com.top_logic.layout.wysiwyg.ui.SetOpenLinkCommandModificator.tooltip = Ein <i>Formularkontext-Modifikator</i>, mit dem Sie ändern können, welcher <i>Befehl</i> zum Öffnen der Ansicht eines WYSIWYG-Feldes verwendet wird.
