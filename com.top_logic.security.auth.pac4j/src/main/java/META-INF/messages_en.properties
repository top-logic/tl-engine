com.top_logic.security.auth.pac4j.config.ClientConfigurator.Config.icon = Icon
com.top_logic.security.auth.pac4j.config.ClientConfigurator.Config.icon.tooltip = Optional icon for this login method's button, or none.
com.top_logic.security.auth.pac4j.config.ClientConfigurator.Config.label = Label
com.top_logic.security.auth.pac4j.config.ClientConfigurator.Config.label.tooltip = User-visible label for this login method, shown on a login UI's SSO button (e.g. "Login with Google"). Defaults to the client name if not set.
com.top_logic.security.auth.pac4j.config.ClientConfigurator.Config.name = Name
com.top_logic.security.auth.pac4j.config.ClientConfigurator.Config.name.tooltip = The name of the authentication client. <p> The client name is used to identify the authentication client among other configured clients. </p>
com.top_logic.security.auth.pac4j.config.ClientConfigurator.Config.user-mapping = User mapping
com.top_logic.security.auth.pac4j.config.ClientConfigurator.Config.user-mapping.tooltip = Algorithm retrieving the <i>account</i> for the user name in the authentication system.
com.top_logic.security.auth.pac4j.config.ClientConfigurator.Config.user-name-extractor = User name extractor
com.top_logic.security.auth.pac4j.config.ClientConfigurator.Config.user-name-extractor.tooltip = Strategy for extracting a local user name from the authentication result.
com.top_logic.security.auth.pac4j.config.ClientConfigurator.createClient = Create client
com.top_logic.security.auth.pac4j.config.ClientConfigurator.createClient.tooltip = Creates the pac4j <i>client</i> from application configuration.
com.top_logic.security.auth.pac4j.config.ClientConfigurator.createReauthenticationClient = Create reauthentication client
com.top_logic.security.auth.pac4j.config.ClientConfigurator.createReauthenticationClient.return = The client, or <code>null</code> if this authentication mechanism cannot authenticate the user of an established session again.
com.top_logic.security.auth.pac4j.config.ClientConfigurator.createReauthenticationClient.tooltip = Creates the pac4j <i>client</i> authenticating the user of an established session again. <p> The client carries the same settings as the one <i>Create client</i> builds, but demands a fresh authentication instead of accepting the single-sign-on session the user already has with the identity provider. It is registered under a name of its own and shares the callback URL with the client it is derived from, which pac4j tells apart by the client name it appends to that URL. </p>
com.top_logic.security.auth.pac4j.config.ClientConfigurator.isAvailable = Is available
com.top_logic.security.auth.pac4j.config.ClientConfigurator.isAvailable.tooltip = Whether a login with the client of this configurator can succeed now. <p> Asked each time the login page lists the clients, so that a client is offered as soon as its prerequisites, e.g. its secret, are provided. </p>
com.top_logic.security.auth.pac4j.config.ConfigurableUserNameExtractor = Configurable user name extractor
com.top_logic.security.auth.pac4j.config.ConfigurableUserNameExtractor.Config.user-name-attribute = User name attribute
com.top_logic.security.auth.pac4j.config.ConfigurableUserNameExtractor.Config.user-name-attribute.tooltip = Attribute name to retrieve from a <i>common profile</i> for using as local user name.
com.top_logic.security.auth.pac4j.config.ConfigurableUserNameExtractor.tooltip = Configurable <i>user name extractor</i>.
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator = Default oidc client configurator
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.client-authentication-method = Client authentication method
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.client-id = Client ID
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.connect-timeout = Connect timeout
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.custom-params = Custom parameters
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.discovery-uri = Discovery URI
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.discovery-uri.tooltip = URL to retrieve <i>Provider metadata</i> from. <p> If not set, <i>Provider metadata</i> must be configured explicitly. </p>
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.logout-url = Logout URL
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.max-age = Maximum age
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.max-clock-skew = Maximum clock skew
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.preferred-jws-algorithm = Preferred jws algorithm
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.provider-metadata = Provider metadata
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.provider-metadata.tooltip = The provider detail configuration in JSON format. <p> If not set, <i>Discovery URI</i> must be set to dynamically retrieve the provider configuration. </p>
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.read-timeout = Read timeout
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.resource-retriever = Resource retriever
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.response-mode = Response mode
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.response-type = Response type
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.scope = Scope
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.secret = Secret
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.secret.tooltip = The client secret to authenticate this application at the identity provider. <p> Recommended is a reference to the secret by its name, so that the secret is not part of the configuration, e.g. <code>&lt;secret name="OIDC_CLIENT_SECRET"/&gt;</code>, which the default secret store reads from the environment variable of that name holding the plain secret. An attribute value is an encrypted secret, or a plain secret with the prefix <code>unencrypted:</code>. </p> <p> The secret is not read at startup, so that the application starts without it. It is read when a login with this client starts and before each token request, so that a rotated secret is used without restart. While the secret is missing, the login page does not offer this client. </p>
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.state-generator = State generator
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.use-nonce = Use nonce
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.Config.with-state = With state
com.top_logic.security.auth.pac4j.config.DefaultOidcClientConfigurator.tooltip = Base class for <i>client configurators</i> allowing to configure common properties.
com.top_logic.security.auth.pac4j.config.HasCallbackUrl.callback-url = Callback URL
com.top_logic.security.auth.pac4j.config.HasCallbackUrl.callback-url-absolute = Callback URL absolute
com.top_logic.security.auth.pac4j.config.HasCallbackUrl.callback-url-absolute.tooltip = Whether the <i>Callback URL</i> is an absolute URL. <p> If <code>false</code>, the <i>Callback URL</i> is relative to the application's context path. </p>
com.top_logic.security.auth.pac4j.config.HasCallbackUrl.callback-url.tooltip = URL where the the <i>callback filter</i> is reachable.
