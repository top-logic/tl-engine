com.top_logic.ai.service.ChatModelFactory.tooltip = Abstrakte Fabrik zum Erstellen und Verwalten von gepoolten <i>Chat-Modell-Instanzen</i>. <p> Diese Fabrik erstellt Objektpools f�r <i>LangChain4j-Chatmodell-Instanzen</i>. Jede Fabrik ist f�r einen bestimmten AI-Anbieter konfiguriert und kann Pools f�r mehrere Modelle dieses Anbieters erstellen. </p> <p> Konkrete Implementierungen existieren f�r verschiedene AI-Anbieter: </p> <ul> <li><i>OpenAI-Chatmodellfabrik</i>: F�r OpenAI-Modelle (GPT-4o, GPT-3.5-turbo, etc.)</li> <li><i>anthropische Chat-Modell-Fabrik</i>: F�r Anthropic-Modelle (Claude, etc.)</li> <li><i>mistral chat model factory</i>: F�r Mistral-KI-Modelle</li> </ul>
