class.com.top_logic.tl.ai.core.security.layout.I18NConstants.WARN_ROLE_UNREACHABLE_ON_ROOT__ROLE = Role {0} is granted tools, but no role rule of this application can produce it on the security root. Its permissions reach nobody.
class.com.top_logic.tl.ai.core.security.layout.I18NConstants.WARN_ROLE_UNREACHABLE_ON_ROOT__ROLE.help = The cross-layer warning about a role nobody can hold where tool access reads roles.
class.com.top_logic.tl.ai.core.security.layout.I18NConstants.WARN_SCRIPT_WITHOUT_DATA_WRITE__ROLE = Role {0} may execute TL-Script but not change data. Persisting a change made by a script is refused.
