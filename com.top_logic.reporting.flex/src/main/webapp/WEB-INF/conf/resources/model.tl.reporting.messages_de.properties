model.tl.reporting = Reporting
model.tl.reporting.FlexReport = Gespeicherter Report
model.tl.reporting.FlexReport.name = Name
model.tl.reporting.FlexReport.name.tooltip = Der Name, unter dem der Report zur Auswahl angeboten wird.
model.tl.reporting.FlexReport.report = Report
model.tl.reporting.FlexReport.report.tooltip = Die gespeicherte Reportdefinition. Der Wert wird nicht direkt eingegeben, sondern vom Diagramm-Konfigurator geschrieben, der seine Konfiguration darin serialisiert.
model.tl.reporting.FlexReport.tooltip = Ein unter einem Namen gespeicherter Report. Er gehört dem Zugang, der ihn erstellt hat, und kann an Gruppen veröffentlicht werden, so dass auch andere Nutzer ihn verwenden können.
model.tl.reporting.FlexReport.types = Fachobjekttypen
model.tl.reporting.FlexReport.types.tooltip = Die Fachobjekttypen, für die der Report erstellt wurde. Angeboten wird er nur für ein Suchergebnis, das aus diesen Typen besteht.
model.tl.reporting.FlexReport.version = Version
model.tl.reporting.FlexReport.version.tooltip = Die Formatversion der gespeicherten Definition. Zur Auswahl angeboten wird nur ein Report der Formatversion, die die Anwendung aktuell schreibt.
model.tl.reporting.tooltip = Modul mit dem Typ, in dem die für ein Suchergebnis konfigurierten Diagramme gespeichert werden.
