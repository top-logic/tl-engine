model.mandatorStructure = Mandantenstruktur
model.mandatorStructure.Mandator = Mandant
model.mandatorStructure.Mandator.all = Mandanten (alle)
model.mandatorStructure.Mandator.all.allowContracts = Verträge erlauben
model.mandatorStructure.Mandator.all.allowContracts.tooltip = Ob für diesen Mandanten Verträge verwaltet werden dürfen.
model.mandatorStructure.Mandator.all.contractGuidelines = Vertragsrichtlinien
