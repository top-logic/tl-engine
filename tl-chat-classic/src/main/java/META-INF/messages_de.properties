com.top_logic.ai.chat.classic.ReactViewComponent = React-View-Komponente
com.top_logic.ai.chat.classic.ReactViewComponent.Config.view = Ansicht
com.top_logic.ai.chat.classic.ReactViewComponent.Config.view.tooltip = Die anzuzeigende Ansicht, als Pfad unterhalb von /WEB-INF/views/, z. B. tl-chat-classic/chat.view.xml.
com.top_logic.ai.chat.classic.ReactViewComponent.tooltip = Eine klassische <i>Komponente</i>, die eine React-Ansicht, z. B. den Agenten-Chat, in ihrer Layoutzelle anzeigt. <p> Ein React-Steuerelement ist wie jedes klassische Steuerelement ein <i>HTML-Fragment</i>: Es schreibt seinen Root-Tag, und die React-Brücke rendert den Rest auf dem Client. Diese Komponente erstellt einmal pro Fenster den Steuerelementbaum der konfigurierten Ansicht und schreibt ihn jedes Mal, wenn das klassische Layout die Komponente rendert. </p> <p><b>Das React-Fenster ist das klassische Fenster.</b> Der Baum wird in der <i>React-Fensterregistrierung</i> unter dem Namen der Untersitzung des klassischen Fensters registriert. Dadurch treffen die beiden Aktualisierungspfade auf einer Seite zusammen: Das React-Servlet löst den Fensternamen eines React-Befehls in die klassische Untersitzung und deren MainLayout auf, sodass die durch einen React-Befehl ausgelösten Neudarstellungen und InfoService-Meldungen über den React-Ereignisstrom die Seite erreichen, während klassische Befehle weiterhin das AJAX-Servlet nutzen. Es ist auch die Fenster-ID, mit der die /chat/*-API des Chats angesprochen wird. </p> <p> Fehler von React-Befehlen werden in der Fenster-Snackbar angezeigt, die diese Komponente dem Baum hinzufügt, genau wie auf einer React-Seite. </p>
