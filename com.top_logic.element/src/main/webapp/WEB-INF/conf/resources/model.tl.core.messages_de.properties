model.tl.core = Basistypen
model.tl.core.Author = Author
model.tl.core.Author.name = Name
model.tl.core.Author.name.tooltip = Der Name, der den Autor identifiziert.
model.tl.core.Author.tooltip = Basistyp für Objekte, die als Autor einer Änderung auftreten können. Ein Autor wird über seinen Namen identifiziert.
model.tl.core.Binary = Binär
model.tl.core.Binary.tooltip = Binärdaten wie eine Datei oder ein Bild. Der Wert wird in der Datenbank gespeichert und in der Oberfläche zum Download angeboten.
model.tl.core.Boolean = Boolean
model.tl.core.Boolean.tooltip = Wahrheitswert mit den Zuständen "ja" und "nein". Ein Wert dieses Typs ist niemals leer; ein nicht gesetzter Wert wird als "nein" interpretiert.
model.tl.core.Byte = Byte
model.tl.core.Byte.tooltip = Ganze Zahl, die in einem einzelnen Byte gespeichert wird und daher nur Werte von -128 bis 127 aufnehmen kann.
model.tl.core.Date = Datum
model.tl.core.Date.tooltip = Ein Datum ohne Uhrzeit. Der Wert wird als Zeitpunkt gespeichert, es wird aber nur das Datum eingegeben und angezeigt.
model.tl.core.DateTime = Datum mit Uhrzeit
model.tl.core.DateTime.tooltip = Ein Zeitpunkt, der aus Datum und Uhrzeit besteht. Beide Anteile werden eingegeben und angezeigt.
model.tl.core.Day = Tag
model.tl.core.Day.tooltip = Ein Kalendertag. Im Gegensatz zum Typ "Datum" wird der Wert als reines Datum gespeichert und ist daher unabhängig von der Zeitzone des Nutzers.
model.tl.core.Double = Double
model.tl.core.Double.tooltip = Gleitkommazahl mit doppelter Genauigkeit. Dies ist der Typ für Dezimalzahlen wie Beträge, Faktoren und Messwerte.
model.tl.core.Duration = Zeitdauer
model.tl.core.Duration.tooltip = Eine Zeitdauer in Millisekunden, die dem Nutzer aber als Tage, Stunden, Minuten, Sekunden und Millisekunden angezeigt wird und auch in diesem Format eingegeben werden kann.
model.tl.core.Float = Float
model.tl.core.Float.tooltip = Gleitkommazahl mit einfacher Genauigkeit. Für Dezimalzahlen sollte der Typ "Double" bevorzugt werden, da er Werte genauer darstellen kann.
model.tl.core.Icon = Bild
model.tl.core.Icon.tooltip = Verweis auf ein Bild oder ein Zeichensatz-Symbol, das in der Oberfläche als Icon angezeigt wird.
model.tl.core.Integer = Integer
model.tl.core.Integer.tooltip = Ganze Zahl, die in vier Byte gespeichert wird. Dies ist der Typ für Zähler und Stückzahlen.
model.tl.core.Key = Schlüssel
model.tl.core.Key.tooltip = Text mit höchstens 255 Zeichen, der byteweise verglichen wird und daher zwischen Groß- und Kleinschreibung unterscheidet. Der Typ ist für technische Schlüssel und Kennungen vorgesehen.
model.tl.core.Long = Long
model.tl.core.Long.tooltip = Ganze Zahl, die in acht Byte gespeichert wird. Der Typ eignet sich für sehr große Zahlen wie technische Kennungen oder Datengrößen.
model.tl.core.Name = Name
model.tl.core.Name.tooltip = Typ für ein Namens-Attribut, der sicherstellt, dass keine führenden oder abschließende Leerzeichen eingegeben werden können. Der Typ ist ansonsten äquivalent zu dem Typ "String".
model.tl.core.Password = Password
model.tl.core.Password.tooltip = Text, der verschlüsselt gespeichert und in der Oberfläche niemals im Klartext angezeigt wird.
model.tl.core.Revision = Revision
model.tl.core.Revision.author = Author
model.tl.core.Revision.author.tooltip = Der Autor, der die Revision erzeugt hat.
model.tl.core.Revision.date = Datum
model.tl.core.Revision.date.tooltip = Der Zeitpunkt, zu dem die Revision in die Datenbank geschrieben wurde.
model.tl.core.Revision.log = Nachricht
model.tl.core.Revision.log.tooltip = Die Änderungsbeschreibung, die beim Schreiben der Revision in die Datenbank angegeben wurde.
model.tl.core.Revision.revision = Revision
model.tl.core.Revision.revision.tooltip = Die fortlaufende Commit-Nummer, die die Revision identifiziert.
model.tl.core.Revision.tooltip = Eine Revision der Datenbank. Jede Änderung erzeugt eine neue Revision, so dass der Zustand eines Objekts zu jeder Revision betrachtet werden kann.
model.tl.core.Short = Short
model.tl.core.Short.tooltip = Ganze Zahl, die in zwei Byte gespeichert wird und daher nur Werte von -32768 bis 32767 aufnehmen kann.
model.tl.core.String = String
model.tl.core.String.tooltip = Einzeiliger Text mit höchstens 1333 Zeichen. Für längere Texte ist der Typ "Text" zu verwenden.
model.tl.core.Text = Text
model.tl.core.Text.tooltip = Mehrzeiliger Text, dessen Länge praktisch unbegrenzt ist. Der Wert wird in einer separaten Datenbankspalte für große Texte gespeichert.
model.tl.core.Time = Uhrzeit
model.tl.core.Time.tooltip = Eine Uhrzeit ohne Datum.
model.tl.core.Tristate = Tristate
model.tl.core.Tristate.tooltip = Wahrheitswert mit den drei Zuständen "ja", "nein" und "nicht gesetzt". Im Gegensatz zum Typ "Boolean" bleibt ein nicht gesetzter Wert als eigener Zustand erhalten.
model.tl.core.tooltip = Modul mit den primitiven Datentypen, die in jeder Anwendung zur Verfügung stehen: Wahrheitswerte, Zahlen, Texte, Datumsangaben und Binärdaten.
