com.top_logic.presentation.script.PptBlockFunctions.arrow.tooltip = Beschreibt einen Blockpfeil, z. B. zwischen den Schritten eines Ablaufs. <p> Beispiel: <code>pptRow([pptCard("Input"), pptArrow(), pptCard("Output")], align: "center")</code> </p> <p> Sofern keine Größe angegeben wird, ist der Pfeil 30 Punkte lang und 24 Punkte breit. Standardmäßig ist er mit der Farbe der Rolle <code>muted</code> (Stil <code>arrow</code> des Vorlagenprofils) gefüllt. </p>
