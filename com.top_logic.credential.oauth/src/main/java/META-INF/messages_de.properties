class.com.top_logic.credential.oauth.I18NConstants.ERROR_REQUEST_FAILED__URL_STATUS = Die Anfrage an den Autorisierungsserver „{0}“ ist mit dem HTTP-Status {1} fehlgeschlagen.
class.com.top_logic.credential.oauth.I18NConstants.ERROR_REQUEST_REJECTED__URL_STATUS_ERROR_DESCRIPTION = Der Autorisierungsserver „{0}“ hat die Anfrage mit dem HTTP-Status {1} und dem Fehler „{2}“ abgelehnt: {3}
