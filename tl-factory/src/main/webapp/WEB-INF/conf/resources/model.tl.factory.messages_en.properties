model.tl.factory = Factory
model.tl.factory.AgentConversation = Agent conversation
model.tl.factory.AgentConversation.createdAt = Created
model.tl.factory.AgentConversation.createdAt.tooltip = When the conversation was started.
model.tl.factory.AgentConversation.sessionId = Session ID
model.tl.factory.AgentConversation.sessionId.tooltip = The ID under which the agent keeps the conversation, empty before its first answer.
model.tl.factory.AgentConversation.task = Task
model.tl.factory.AgentConversation.task.tooltip = The task the conversation was started with, its first message to the agent.
model.tl.factory.AgentConversation.tooltip = A conversation with the coding agent working in a workspace.
model.tl.factory.AgentConversation.workspace = Workspace
model.tl.factory.AgentConversation.workspace.tooltip = The workspace whose agent the conversation is held with.
model.tl.factory.Project = Project
model.tl.factory.Project.artifactId = Artifact ID
model.tl.factory.Project.artifactId.tooltip = Maven artifact of the application, e.g. "my-app". It also names the context path the application is served under.
model.tl.factory.Project.engineVersion = Engine version
model.tl.factory.Project.engineVersion.tooltip = The released TopLogic version the application is built on.
model.tl.factory.Project.groupId = Group ID
model.tl.factory.Project.groupId.tooltip = Maven group of the application, e.g. "com.example".
model.tl.factory.Project.name = Name
model.tl.factory.Project.name.tooltip = Name of the project.
model.tl.factory.Project.tooltip = A TopLogic application managed by the control application.
model.tl.factory.Project.workspace = Workspace
model.tl.factory.Project.workspace.tooltip = The container the application is built and run in. Empty after the workspace has been cleaned up.
model.tl.factory.Workspace = Workspace
model.tl.factory.Workspace.conversations = Agent conversations
model.tl.factory.Workspace.conversations.tooltip = The conversations with the coding agent working in the workspace.
model.tl.factory.Workspace.hostPort = Host port
model.tl.factory.Workspace.hostPort.tooltip = The port of the host the application is published on while it runs.
model.tl.factory.Workspace.image = Image
model.tl.factory.Workspace.image.tooltip = The image the container of the workspace was created from.
model.tl.factory.Workspace.initialPassword = Initial root password
model.tl.factory.Workspace.initialPassword.tooltip = The password the account root of the application gets when the application creates its database. It is the initial password of a development workspace and is no longer valid once it has been changed in the application.
model.tl.factory.Workspace.log = Log
model.tl.factory.Workspace.log.tooltip = The output of the last operation on the workspace.
model.tl.factory.Workspace.previewUrl = Preview
model.tl.factory.Workspace.previewUrl.tooltip = The URL a browser reaches the running application with.
model.tl.factory.Workspace.status = Status
model.tl.factory.Workspace.status.tooltip = The state of the workspace.
model.tl.factory.Workspace.tooltip = The container the application of a project is built and run in, with its volumes holding the sources, the Maven repository, the database and the conversations of the agent.
model.tl.factory.Workspace.workspaceId = Workspace ID
model.tl.factory.Workspace.workspaceId.tooltip = The identifier of the workspace in the container platform.
model.tl.factory.WorkspaceStatus = Workspace status
model.tl.factory.WorkspaceStatus.APP_STOPPED = Application stopped
model.tl.factory.WorkspaceStatus.APP_STOPPED.tooltip = The container runs, the application does not: it was stopped or failed to start; the log tells why. The agent can work in the workspace.
model.tl.factory.WorkspaceStatus.BUILDING = Building
model.tl.factory.WorkspaceStatus.BUILDING.tooltip = The container is being created and the application is being generated and built.
model.tl.factory.WorkspaceStatus.CREATED = Created
model.tl.factory.WorkspaceStatus.CREATED.tooltip = The container exists but has never been started.
model.tl.factory.WorkspaceStatus.ERROR = Error
model.tl.factory.WorkspaceStatus.ERROR.tooltip = The last operation failed or the container got lost; the log tells why.
model.tl.factory.WorkspaceStatus.REMOVING = Cleaning up
model.tl.factory.WorkspaceStatus.REMOVING.tooltip = The container and the volumes are being removed.
model.tl.factory.WorkspaceStatus.RUNNING = Running
model.tl.factory.WorkspaceStatus.RUNNING.tooltip = The application runs and answers at the preview URL.
model.tl.factory.WorkspaceStatus.STARTING = Starting
model.tl.factory.WorkspaceStatus.STARTING.tooltip = The application is starting.
model.tl.factory.WorkspaceStatus.STOPPED = Stopped
model.tl.factory.WorkspaceStatus.STOPPED.tooltip = The container is stopped; its volumes are kept.
model.tl.factory.WorkspaceStatus.STOPPING = Stopping
model.tl.factory.WorkspaceStatus.STOPPING.tooltip = The container is being stopped.
model.tl.factory.WorkspaceStatus.UNKNOWN = Unknown
model.tl.factory.WorkspaceStatus.UNKNOWN.tooltip = The container platform did not tell the state, e.g. because it was not reachable.
model.tl.factory.WorkspaceStatus.UPDATING = Updating
model.tl.factory.WorkspaceStatus.UPDATING.tooltip = The container is being created anew on the current workspace image; sources, Maven repository, database and the conversations of the agent are kept.
