com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.vector-store-type.tooltip = Type of vector database to use (e.g., "qdrant", "jvector")
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.warn-queue-size = Warn queue size
com.top_logic.ai.vector.index.VectorIndex.VectorIndexingConfig.warn-queue-size.tooltip = If the queue is longer than that, the administrator should be warn.
com.top_logic.ai.vector.index.VectorIndex.tooltip = Representation of the Vector index. <p> This class contains methods for creating a Vector index, getting VEctor index readers, writers and searchers. </p>
com.top_logic.ai.vector.index.VectorIndexSearchTool = Vector index search tool
com.top_logic.ai.vector.index.VectorIndexSearchTool.tooltip = AI tool that performs semantic search against the <i>vector index</i>. <p> This tool exposes the vector index search functionality to AI agents. It accepts a natural language query, embeds it using the configured embedding model, and returns the most semantically similar objects stored in the vector index. </p> <p> <b>What it discloses.</b> The index is filled by a background daemon under system rights, so a hit says nothing on its own about whether the run's principal may see it. Two things therefore happen before a hit reaches the model, and neither is optional (issue #295): </p> <ul> <li><i>vector read filter</i> drops every hit whose source object the principal may not read, or cannot be attributed to one at all.</li> <li>What is then written is <b>not the indexed chunk</b> but the object as the read filter renders it now, attribute by attribute and under the principal's own rights. The chunk is a snapshot of every flex attribute at indexing time, so handing it over would disclose an attribute the principal may not read, and a value that has since changed. That is two defects for the price of one.</li> </ul> <p> The tool is registered in the ToolRegistryService but is not assigned to any agent by default. </p>
com.top_logic.ai.vector.index.VectorIndexTLScriptFunctions.search = Search for a string
com.top_logic.ai.vector.index.VectorIndexTLScriptFunctions.search.param.limit.tooltip = Optional parameter for number of expected records to return (default to number, configured in the Service Setting).
com.top_logic.ai.vector.index.VectorIndexTLScriptFunctions.search.param.query.tooltip = The string query to search inside the vector database.
com.top_logic.ai.vector.index.VectorIndexTLScriptFunctions.search.param.scoreThreshold.tooltip = Minimum score threshold. Must be between 0 and 1 (defaults to 0.8).
com.top_logic.ai.vector.index.VectorIndexTLScriptFunctions.search.param.type.tooltip = TL Script type to filter by in the Vector Index search
com.top_logic.ai.vector.index.VectorIndexTLScriptFunctions.search.return = Returns a list of record dictionaries matching the query and parameters. Each element of the list has the following properties: <pre> <i>$result:</i> <table class="tlDocTable" border="0"> <thead> <tr> <th>name</th> <th>type</th> <th>description</th> </tr> </thead> <tbody> <tr> <td>score</td> <td>Number between 0 and 1</td> <td>Matching score of the element</td> </tr> <td>embeddingId</td> <td>UUID</td> <td>ID of the point in the vector database</td> <tr> <td>objectId</td> <td>String</td> <td>The object id in the TL application (e.g. GenericObject:12002)</td> </tr> <tr> <td>TL-instance</td> <td>AttributedWrapper</td> <td>The TL Object instance</td> </tr> <tr> <td>embedded</td> <td>Map</td> <td>Content of the point in the vector database</td> </tr> </tbody> </table> <i>$result["embedded"]:</i> <table class="tlDocTable" border="0"> <thead> <tr> <th>name</th> <th>type</th> <th>description</th> </tr> </thead> <tbody> <tr> <td>metadata</td> <td>Map</td> <td>Metadata stored in the vector database</td> </tr> </tbody> </table> <i>$result["embedded"]["metadata"]:</i> <table class="tlDocTable" border="0"> <thead> <tr> <th>name</th> <th>type</th> <th>description</th> </tr> </thead> <tbody> <tr> <td>TopLogic-type</td> <td>String</td> <td>TopLogic type of the stored instance</td> </tr> </tbody> </table> $result["embedded"]["text"]: <table class="tlDocTable" border="0"> <thead> <tr> <th>name</th> <th>type</th> <th>description</th> </tr> </thead> <tbody> <tr> <td>TLObject-creation-date</td> <td>String</td> <td>Date of TL instance creation</td> </tr> <tr> <td>TLObject-modification-date</td> <td>String</td> <td>Date of TL instance last modification</td> </tr> <tr> <td>All other instance attributes</td> <td>String</td> <td>All instance attribute key/value pairs</td> </tr> </tbody> </table> </pre>
com.top_logic.ai.vector.index.VectorIndexTLScriptFunctions.search.tooltip = Returns a list of results from the Vector database <p> Only hits the executing account may read are returned. The index is filled by a background daemon under system rights, so it holds every object of a configured type whoever may read it; the account's own rights are applied here, at query time, and a hit that cannot be attributed to a readable object is dropped rather than reported (issue #295). </p> <p> Example usage in TL-Script to resolve objects, contained in the Vector Index result: </p> <pre> <code> vectorIndexSearch("all vacations in France",<br/> &#160;&#160;&#160;&#160;2,<br/> &#160;&#160;&#160;&#160;0.8,<br/> &#160;&#160;&#160;&#160;"test.indexingVector:Vacation").map(x -> {<br/> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;"score": $x["score"],<br/> &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;"instance": $x["TL-instance"]<br/> })<br/> </code> </pre>
