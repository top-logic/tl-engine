com.top_logic.presentation.script.PptBlockFunctions.agenda = Describe an agenda slide
com.top_logic.presentation.script.PptBlockFunctions.agenda.param.entries.tooltip = The entries, each a text.
com.top_logic.presentation.script.PptBlockFunctions.agenda.param.notes.tooltip = The speaker notes as text, or a list of lines.
com.top_logic.presentation.script.PptBlockFunctions.agenda.param.title.tooltip = The title. If not given, "Agenda" in the language of the current user.
com.top_logic.presentation.script.PptBlockFunctions.agenda.return = The dictionary describing the slide on the layout with the role <code>agenda</code>.
com.top_logic.presentation.script.PptBlockFunctions.agenda.tooltip = Describes an agenda slide. <p> Example: <code>pptAgenda(["Results", "Plans", "Questions"])</code> </p> <p> If the template profile names a slide layout for the number of entries (entry <code>agendaLayouts</code>, see <code>pptProfile()</code>), the entries fill the entry placeholders of this layout, e.g. next to numbered circles of the template. Otherwise, the slide is a content slide listing the entries one below the other, each with a badge showing its number. </p>
com.top_logic.presentation.script.PptBlockFunctions.arrow = Describe an arrow
com.top_logic.presentation.script.PptBlockFunctions.arrow.param.direction.tooltip = The direction: <code>right</code> (the default), <code>left</code>, <code>up</code> or <code>down</code>.
com.top_logic.presentation.script.PptBlockFunctions.arrow.param.height.tooltip = The height.
com.top_logic.presentation.script.PptBlockFunctions.arrow.param.role.tooltip = The color role, e.g. <code>topicA</code>. If not given, the role of the style.
com.top_logic.presentation.script.PptBlockFunctions.arrow.param.style.tooltip = The name of another style of the template profile to use instead of <code>arrow</code>.
com.top_logic.presentation.script.PptBlockFunctions.arrow.param.weight.tooltip = The share in the free space of a row or column, if no own size is given.
com.top_logic.presentation.script.PptBlockFunctions.arrow.param.width.tooltip = The width.
com.top_logic.presentation.script.PptBlockFunctions.arrow.param.x.tooltip = The horizontal position of the left border.
com.top_logic.presentation.script.PptBlockFunctions.arrow.param.y.tooltip = The vertical position of the top border.
com.top_logic.presentation.script.PptBlockFunctions.arrow.return = The dictionary describing the arrow.
com.top_logic.presentation.script.PptBlockFunctions.arrow.tooltip = Describes a block arrow, e.g. between the steps of a flow. <p> Example: <code>pptRow([pptCard("Input"), pptArrow(), pptCard("Output")], align: "center")</code> </p> <p> Unless a size is given, the arrow is 30 points long and 24 points broad. By default, it is filled with the color of the role <code>muted</code> (style <code>arrow</code> of the template profile). </p>
com.top_logic.presentation.script.PptBlockFunctions.badge = Describe a badge
com.top_logic.presentation.script.PptBlockFunctions.badge.param.height.tooltip = The height.
com.top_logic.presentation.script.PptBlockFunctions.badge.param.label.tooltip = The label.
com.top_logic.presentation.script.PptBlockFunctions.badge.param.role.tooltip = The color role, e.g. <code>topicA</code>. If not given, the role of the style or <code>accent</code>.
com.top_logic.presentation.script.PptBlockFunctions.badge.param.style.tooltip = The name of another style of the template profile to use instead of <code>badge</code>.
com.top_logic.presentation.script.PptBlockFunctions.badge.param.weight.tooltip = The share in the free space of a row or column, if no own size is given.
com.top_logic.presentation.script.PptBlockFunctions.badge.param.width.tooltip = The width.
com.top_logic.presentation.script.PptBlockFunctions.badge.param.x.tooltip = The horizontal position of the left border.
com.top_logic.presentation.script.PptBlockFunctions.badge.param.y.tooltip = The vertical position of the top border.
com.top_logic.presentation.script.PptBlockFunctions.badge.return = The dictionary describing the badge.
com.top_logic.presentation.script.PptBlockFunctions.badge.tooltip = Describes a badge: a filled circle with a short label, e.g. a number. <p> Example: <code>pptBadge(1, role: "topicA")</code> </p> <p> By default, the badge is a circle of 40 points filled with the color of the role, its label bold and centered (style <code>badge</code> of the template profile). If only the width or only the height is given, the badge is as high as wide. </p>
com.top_logic.presentation.script.PptBlockFunctions.banner = Describe a banner
com.top_logic.presentation.script.PptBlockFunctions.banner.param.height.tooltip = The height. If neither height nor weight is given, the height of the text.
com.top_logic.presentation.script.PptBlockFunctions.banner.param.role.tooltip = The color role, e.g. <code>topicA</code>. If not given, the role of the style or <code>accent</code>.
com.top_logic.presentation.script.PptBlockFunctions.banner.param.style.tooltip = The name of another style of the template profile to use instead of <code>banner</code>.
com.top_logic.presentation.script.PptBlockFunctions.banner.param.text.tooltip = The text: a string, a paragraph (<code>pptParagraph()</code>), e.g. with a lead-in in another formatting, or a list of paragraphs.
com.top_logic.presentation.script.PptBlockFunctions.banner.param.weight.tooltip = The share in the free space of a row or column, if no own size is given.
com.top_logic.presentation.script.PptBlockFunctions.banner.param.width.tooltip = The width.
com.top_logic.presentation.script.PptBlockFunctions.banner.param.x.tooltip = The horizontal position of the left border.
com.top_logic.presentation.script.PptBlockFunctions.banner.param.y.tooltip = The vertical position of the top border.
com.top_logic.presentation.script.PptBlockFunctions.banner.return = The dictionary describing the banner.
com.top_logic.presentation.script.PptBlockFunctions.banner.tooltip = Describes a banner: a filled box stating the key message of a slide. <p> Example: <code>pptBanner(pptParagraph(["Key message: ", pptRun("costs are falling", bold: false)]), role: "done")</code> </p> <p> By default, the box is filled with the color of the role, its text is bold and in the color of the role <code>inverse</code>, and its height is the height of the text (style <code>banner</code> of the template profile). </p>
com.top_logic.presentation.script.PptBlockFunctions.bullets = Describe a bullet list
