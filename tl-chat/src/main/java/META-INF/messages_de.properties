class.com.top_logic.ai.chat.view.I18NConstants.PANE_COLUMN_LABEL.help = Kopfzeile der Spalte einer Datentabelle, die jede Zeile benennt, bei Daten, deren Bezeichnungen keinen eigenen Namen tragen.
class.com.top_logic.ai.chat.view.I18NConstants.PANE_COLUMN_VALUE = Wert
class.com.top_logic.ai.chat.view.I18NConstants.PANE_COLUMN_VALUE.help = Überschrift der Spalte einer Datentabelle, die eine Zahlenreihe enthält, wenn diese keinen Namen hat.
class.com.top_logic.ai.chat.view.I18NConstants.PANE_TITLE_DATA = Auswertung
class.com.top_logic.ai.chat.view.I18NConstants.PANE_TITLE_DATA.help = Titel des Fensters in der Leiste, in dem ein Diagramm oder eine Tabelle mit Daten angezeigt wird, die der Agent berechnet hat, und für das der Agent keinen eigenen Titel vergeben hat.
class.com.top_logic.ai.chat.view.I18NConstants.PANE_TITLE_OBJECTS__COUNT = {0} Objekte
class.com.top_logic.ai.chat.view.I18NConstants.PANE_TITLE_OBJECTS__COUNT.help = Titel des Fensters in der Schienenleiste, wenn darin mehrere Objekte statt nur eines angezeigt werden. <p> Ein einzelnes Objekt gibt dem Fenster seinen eigenen Titel; eine Gruppe von Objekten hat keinen eigenen Titel, und die Anzahl ist die einzige aussagekräftige Information, die man darüber erhalten kann, ohne die Objekte zu lesen. </p>
class.com.top_logic.ai.chat.view.I18NConstants.PANE_TITLE_TYPE__TYPE_COUNT = {0} ({1})
class.com.top_logic.ai.chat.view.I18NConstants.PANE_TITLE_TYPE__TYPE_COUNT.help = Titel des Fensters in der Schienenleiste, wenn darin eine Tabelle oder ein Diagramm mit Objekten eines Typs angezeigt wird und der Agent keinen eigenen Titel hat.
com.top_logic.ai.chat.layout.PromptImprovementProcessor$Failure = Fehlerart
