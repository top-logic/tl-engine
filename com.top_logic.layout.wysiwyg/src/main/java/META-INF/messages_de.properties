class.com.top_logic.layout.wysiwyg.ui.I18NConstants.ERROR_INVALID_HTML_IMAGES__VALUE = Die Bilder eines HTML-Textes müssen als Binärdaten, als Liste von Binärdaten oder als Dictionary von Bildnamen auf Binärdaten angegeben werden, erhalten wurde aber: {0}
com.top_logic.layout.wysiwyg.ui.HtmlFunctions.images = Bilder eines strukturierten Textes
com.top_logic.layout.wysiwyg.ui.HtmlFunctions.images.param.content.tooltip = Der Wert eines HTML-Attributs.
com.top_logic.layout.wysiwyg.ui.HtmlFunctions.images.return = Ein Dictionary von den Namen, mit denen der Quellcode die Bilder benennt, auf die Bilddaten. Leer für Inhalt ohne Bilder.
com.top_logic.layout.wysiwyg.ui.HtmlFunctions.images.tooltip = Die Bilder des angegebenen strukturierten Textes. <p> Zusammen mit <i>HTML-Quellcode von strukturiertem Text</i> ergibt dies die Teile, die <i>Strukturierter Text mit HTML-Quellcode</i> wieder zusammensetzt, z. B. um einen geänderten Quellcode mit den Bildern des ursprünglichen Textes zu speichern. </p>
com.top_logic.layout.wysiwyg.ui.HtmlFunctions.objectLink = Link zu einem Objekt
com.top_logic.layout.wysiwyg.ui.HtmlFunctions.objectLink.param.label.tooltip = Der Text, mit dem der Link angezeigt wird. Bei leerem Wert wird die Bezeichnung des Objekts verwendet.
com.top_logic.layout.wysiwyg.ui.HtmlFunctions.objectLink.param.object.tooltip = Das Objekt, auf das der Link verweist.
com.top_logic.layout.wysiwyg.ui.HtmlFunctions.objectLink.return = Der Link als HTML-Ankerelement.
com.top_logic.layout.wysiwyg.ui.HtmlFunctions.objectLink.tooltip = Ein Link, der zu dem angegebenen Objekt führt, als HTML-Quellcode zum Einbetten in strukturierten Text. <p> Der angezeigte strukturierte Text enthält einen solchen Link als Verweis auf das Objekt: Wenn man ihm folgt, gelangt man zu der Stelle, an der die Anwendung Objekte dieser Art anzeigt. </p>
com.top_logic.layout.wysiwyg.ui.HtmlFunctions.source = HTML-Quellcode von strukturiertem Text
com.top_logic.layout.wysiwyg.ui.HtmlFunctions.source.param.content.tooltip = Der Wert eines HTML-Attributs.
com.top_logic.layout.wysiwyg.ui.HtmlFunctions.source.return = Der HTML-Quellcode, leer bei Inhalt ohne Quellcode.
com.top_logic.layout.wysiwyg.ui.HtmlFunctions.source.tooltip = Der HTML-Quellcode des angegebenen strukturierten Textes.
com.top_logic.layout.wysiwyg.ui.HtmlFunctions.text = Strukturierter Text mit HTML-Quellcode
com.top_logic.layout.wysiwyg.ui.HtmlFunctions.text.param.images.tooltip = Die Bilder, die der Quellcode anzeigt: ein einzelner Binärwert oder eine Liste von Binärwerten, jeweils über ihren Dateinamen benannt, oder ein Dictionary von den im Quellcode verwendeten Namen auf Binärwerte. Leer für Text ohne Bilder.
com.top_logic.layout.wysiwyg.ui.HtmlFunctions.text.param.source.tooltip = Der HTML-Quellcode. Ohne Bilder wird er unverändert übernommen.
com.top_logic.layout.wysiwyg.ui.HtmlFunctions.text.return = Der Wert, der in ein HTML-Attribut geschrieben werden soll.
com.top_logic.layout.wysiwyg.ui.HtmlFunctions.text.tooltip = Strukturierter Text mit dem angegebenen HTML-Quellcode und den darin angezeigten Bildern, zum Speichern in einem HTML-Attribut. <p> Ein Bildelement des Quellcodes zeigt eines der angegebenen Bilder an, indem es dessen Namen in seinem Attribut <code>src</code> angibt, z. B. <code>&lt;img src="logo.png"/&gt;</code>. Ein solcher Verweis wird als Link zum Bild des strukturierten Textes gespeichert (der Name mit dem Präfix <code>"ref:"</code>). Ein Quellcode, der bereits einen solchen Link verwendet, z. B. der Quellcode eines gespeicherten strukturierten Textes, verweist ebenso auf das angegebene Bild dieses Namens. Ein Bild, das der Quellcode nicht nennt, wird nicht gespeichert; ein Bildelement, das kein angegebenes Bild nennt, bleibt unverändert. </p>
com.top_logic.layout.wysiwyg.ui.SetOpenLinkCommandModificator = Modifikator für den Befehl "Open Link" einstellen
com.top_logic.layout.wysiwyg.ui.SetOpenLinkCommandModificator$CommandForTypeConfig = Befehl zur Typkonfiguration
