com.top_logic.tl.ai.index.onnx.OnnxEmbedder.Config.rows-per-inference = Texte je Inferenz
com.top_logic.tl.ai.index.onnx.OnnxEmbedder.Config.rows-per-inference.tooltip = Texte einer Inferenz höchstens. <p> Ein dynamisch quantisiertes (int8) Modell skaliert seine Aktivierungen über den ganzen Batch, sodass bei mehr als einem Text ein Vektor von seinen Nachbarn abhängt: Bei arctic-embed-m-v2.0 int8 lag der Kosinus zwischen dem Vektor eines Textes allein und im Batch bei 0,976 bis 0,985, bei multilingual-e5-small int8 bei 0,997. Ein Text je Inferenz kostete arctic 11 % und e5-small 40 % des Durchsatzes auf einer Laptop-CPU. Erhöhen Sie den Wert für ein Modell ohne dynamische Quantisierung, oder für e5-small, wenn der Durchsatz mehr zählt als reproduzierbare Vektoren. </p>
