com.top_logic.factory.llm.LLMProxyService = LLM-Proxy-Dienst
com.top_logic.factory.llm.LLMProxyService.Config.allowed-sources = Zulässige Quellen
com.top_logic.factory.llm.LLMProxyService.Config.allowed-sources.tooltip = Die Client-Adressen, von denen Anfragen angenommen werden: Bereiche in CIDR-Notation (IPv4 oder IPv6), einzelne Adressen oder <code>"workspace-network"</code> für das Netzwerk der Workspace-Container. <p> Leer nimmt jede Adresse an. Geprüft wird die Adresse der Verbindung, nie ein Header der Anfrage: Hinter einem Reverse-Proxy oder einem Gateway ist es die Adresse dieses Proxys. </p>
com.top_logic.factory.llm.LLMProxyService.Config.max-token-lifetime = Maximale Token-Lebensdauer
com.top_logic.factory.llm.LLMProxyService.Config.max-token-lifetime.tooltip = Die längste Lebensdauer eines Tokens in Millisekunden, z. B. 4h; eine längere angeforderte Lebensdauer wird darauf gekürzt.
com.top_logic.factory.llm.LLMProxyService.Config.provider = Anbieter
com.top_logic.factory.llm.LLMProxyService.Config.provider.tooltip = Der Name des Anthropic-Anbieters unter den <i>LLM-Anbietern</i>, dessen API-Schlüssel, Basis-URL, Version und Timeouts der Proxy verwendet.
com.top_logic.factory.llm.LLMProxyService.Config.proxy-url = Proxy-URL
com.top_logic.factory.llm.LLMProxyService.Config.proxy-url.tooltip = Die URL des <i>LLM-Proxy-Servlets</i>, wie die Workspace-Container sie erreichen, z. B. http://host.docker.internal:8080/tl-factory-app/llm-proxy. <p> Sie wird den Workspace-Containern in <code>"ANTHROPIC_BASE_URL"</code> übergeben. Leer schaltet den Proxy aus. </p>
com.top_logic.factory.llm.LLMProxyService.tooltip = Zugriff der Workspaces auf die Anthropic Messages API ohne API-Schlüssel im Workspace. <p> Ein Workspace-Container erhält in seiner Umgebung weder einen API-Schlüssel noch ein Token, nur die URL des <i>LLM-Proxy-Servlets</i> der Steueranwendung in <code>"ANTHROPIC_BASE_URL"</code>. Ein Prozess, der die API nutzen darf - ein Agentenlauf -, erhält ein eigenes Token, das für seinen Workspace ausgestellt und nur diesem Prozess in <code>"ANTHROPIC_AUTH_TOKEN"</code> übergeben wird; Claude Code sendet es als Bearer-Token. Der Proxy nimmt eine Anfrage von einer zulässigen Adresse an, deren Token gültig ist, fügt den API-Schlüssel des konfigurierten Anbieters der <i>LLM-Anbieter</i> hinzu und leitet die Anfrage weiter. </p> <p> Ein Token besteht aus <code>"tlwst_"</code>, gefolgt von einem zufälligen Geheimnis von etwa 256 Bit (siehe <i>geheime Tokens</i>). Es ist gültig, bis es widerrufen wird - wenn sein Lauf endet -, bis seine Lebensdauer abläuft (höchstens <i>Maximale Token-Lebensdauer</i>) oder bis sein Workspace entfernt wird. Tokens werden nur im Speicher gehalten, als ihre Hashes; ein Neustart der Steueranwendung macht alle ungültig, zusammen mit den von ihr gestarteten Läufen. </p> <p> Der Proxy wird über seine URL eingeschaltet: Ohne sie erhalten Workspaces keine URL, es wird kein Token ausgestellt, und das Servlet beantwortet jede Anfrage mit 404. </p>
com.top_logic.factory.project.FactoryFunctions.checkArtifactId = Artifact-ID prüfen
