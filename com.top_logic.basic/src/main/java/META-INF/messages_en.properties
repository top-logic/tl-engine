com.top_logic.basic.config.AbstractConfiguredInstance = Configured instance
com.top_logic.basic.config.AbstractConfiguredInstance.tooltip = Common base class for <i>configured instance</i> implementations. <p> A class built from a <i>polymorphic configuration</i> extends this class and hands its configuration on to the base constructor, which keeps the configuration reachable from the instance. A configuration constructor that accepts a configuration and drops it leaves the instance unable to say what it was configured with; extending this class is what avoids that. </p>
