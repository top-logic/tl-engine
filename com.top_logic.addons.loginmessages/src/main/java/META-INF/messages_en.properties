com.top_logic.addons.loginmessages.layout.LoginMessageNamingScheme$LoginMessageName = Login message name
com.top_logic.addons.loginmessages.layout.LoginMessageNamingScheme$LoginMessageName.tooltip = A <i>model name</i> for a <i>login message</i>.
com.top_logic.addons.loginmessages.layout.LoginMessageNamingScheme.LoginMessageName.name = Name
com.top_logic.addons.loginmessages.layout.LoginMessageNamingScheme.LoginMessageName.name.tooltip = Name getter.
com.top_logic.addons.loginmessages.layout.LoginMessageResetHandler = Login message reset handler
com.top_logic.addons.loginmessages.layout.LoginMessageResetHandler.tooltip = <i>Command</i> that resets the confirmation state of the selected message for all accounts. <p> After a reset, each account must acknowledge the selected login message again after login. </p>
com.top_logic.addons.loginmessages.layout.LoginMessagesHook = Login messages hook
com.top_logic.addons.loginmessages.layout.LoginMessagesHook.Config.showLoginMessages = Show login messages
com.top_logic.addons.loginmessages.layout.LoginMessagesHook.Config.showLoginMessages.tooltip = Whether to show <i>login messages</i> on application start.
com.top_logic.addons.loginmessages.layout.LoginMessagesHook.tooltip = A <i>login hook</i> to show <i>login messages</i>.
com.top_logic.addons.loginmessages.script.LoginMessagesFunctions.confirm = Confirm login messages
com.top_logic.addons.loginmessages.script.LoginMessagesFunctions.confirm.param.display.tooltip = The messages shown to the account, the result of <code>loginMessagesDisplay($account)</code>.
com.top_logic.addons.loginmessages.script.LoginMessagesFunctions.confirm.tooltip = Records that the account of the given display has confirmed the messages shown in it now. <p> A confirmed message is not shown again until its confirmation expires. </p>
com.top_logic.addons.loginmessages.script.LoginMessagesFunctions.display = Display of the due login messages
com.top_logic.addons.loginmessages.script.LoginMessagesFunctions.display.param.account.tooltip = The account logging in.
com.top_logic.addons.loginmessages.script.LoginMessagesFunctions.display.return = The display of the messages due for the account; empty when none is due.
com.top_logic.addons.loginmessages.script.LoginMessagesFunctions.display.tooltip = The login messages due for the given account, as the login shows them. <p> The result is displayed as HTML, e.g. with <code>&lt;html input="..."/&gt;</code>: the text of each due message in the current language with its images (as <code>data:</code> URIs), or its name where it has no text, one below the other. The result also says which messages were shown: <code>loginMessagesConfirm($display)</code> confirms exactly these, for the given account. </p> <p> The result is no model object, so a script of a login that has not completed - running for the anonymous user, who may not read the login messages - receives it as well. </p>
com.top_logic.addons.loginmessages.script.LoginMessagesFunctions.due = Due login messages
com.top_logic.addons.loginmessages.script.LoginMessagesFunctions.due.param.account.tooltip = The account logging in.
com.top_logic.addons.loginmessages.script.LoginMessagesFunctions.due.return = The messages to show, sorted by name in descending order.
com.top_logic.addons.loginmessages.script.LoginMessagesFunctions.due.tooltip = The login messages to show to the given account at its login. <p> A message is shown when it is active, today lies between its start and its end date, and the account has not confirmed it yet, or its confirmation has expired. A view shows them with <code>loginMessagesDisplay($account)</code> and records their confirmation with <code>loginMessagesConfirm($display)</code>. </p> <p> The messages are model objects: a script running for a user who may not read them - the anonymous user of a login that has not completed - does not receive them, see <i>display of the due login messages</i>. </p>
