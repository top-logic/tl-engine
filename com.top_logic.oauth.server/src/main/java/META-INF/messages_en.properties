com.top_logic.oauth.server.ClientMetadataFetcher.fetch = Fetch
com.top_logic.oauth.server.ClientMetadataFetcher.fetch.param.documentUrl.tooltip = The client ID, an <code>https</code> URL.
com.top_logic.oauth.server.ClientMetadataFetcher.fetch.return = The document as text, expected to be a JSON object.
com.top_logic.oauth.server.ClientMetadataFetcher.fetch.tooltip = The content of the document at documentUrl.
com.top_logic.oauth.server.HttpClientMetadataFetcher = HTTP client metadata fetcher
com.top_logic.oauth.server.HttpClientMetadataFetcher.Config.allow-private-network = Allow private network
com.top_logic.oauth.server.HttpClientMetadataFetcher.Config.allow-private-network.tooltip = Whether a document may be fetched from a host in a private network, the loopback interface included. <p> Off by default: a client ID is chosen by whoever sends an authorization request, and with this option on, it can make the application send requests into its own network. </p>
com.top_logic.oauth.server.HttpClientMetadataFetcher.Config.max-size = Maximum size
com.top_logic.oauth.server.HttpClientMetadataFetcher.Config.max-size.tooltip = The largest document in bytes that is accepted.
com.top_logic.oauth.server.HttpClientMetadataFetcher.Config.timeout = Timeout
com.top_logic.oauth.server.HttpClientMetadataFetcher.Config.timeout.tooltip = How long connecting and reading the document may take in all. <p> Connecting and each read are limited to this time; a document that has not arrived completely when it has passed is abandoned. </p>
com.top_logic.oauth.server.HttpClientMetadataFetcher.tooltip = <i>Client metadata fetcher</i> retrieving the document by an HTTP <code>GET</code>. <p> The URL comes from an unauthenticated request, so fetching it lets anyone make the application send a request. This fetcher therefore: </p> <ul> <li>connects only to addresses of the public internet, unless <i>Allow private network</i> is set: the host is resolved once, refused if one of its addresses is a loopback, link-local, private or other non-public address, and the connection goes to exactly the checked addresses,</li> <li>follows no redirect and uses no proxy,</li> <li>gives up after <i>Timeout</i>,</li> <li>reads at most <i>Maximum size</i> bytes.</li> </ul>
com.top_logic.oauth.server.OAuthAccessTokenAuthentication = OAuth access token of this application
com.top_logic.oauth.server.OAuthAccessTokenAuthentication.Config.resource = Resource
com.top_logic.oauth.server.OAuthAccessTokenAuthentication.Config.resource.tooltip = The resource (RFC 8707) the guarded endpoint is, which a token must have been issued for. <p> Either an absolute URI, or a path relative to the application's context path starting with a slash, e.g. <code>/mcp</code>, which is resolved against the application URL as the request reaches it. </p>
com.top_logic.oauth.server.OAuthAccessTokenAuthentication.Config.separate-secret-needed.tooltip = Never: the tokens are issued by the application itself, not configured.
com.top_logic.oauth.server.OAuthAccessTokenAuthentication.tooltip = Authenticates a caller by an access token of the application's own <i>oAuth authorization server</i>, sent in the header <code>Authorization: Bearer</code>. <p> The request acts as the person who authorized the client. A token is accepted only at the resource it was issued for, so that a token a client obtained for one endpoint cannot be replayed at another. See the developer article <code>oauth-server</code>. </p>
com.top_logic.oauth.server.OAuthAuthorizationServer = OAuth authorization server
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.abandoned-client-lifetime = Abandoned client lifetime
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.abandoned-client-lifetime.tooltip = How long a dynamically registered client without any remaining authorization is kept after it was last used (authorized, or a token refreshed). <p> An authorization ends when it is revoked or when its last refresh token expired, see <i>Refresh token lifetime</i>. </p>
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.access-token-lifetime = Access token lifetime
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.access-token-lifetime.tooltip = How long an access token is accepted after it was issued.
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.authorization-code-lifetime = Authorization code lifetime
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.authorization-code-lifetime.tooltip = How long an authorization code can be exchanged after it was issued.
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.client-id-metadata-documents = Client ID metadata documents
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.client-id-metadata-documents.tooltip = Whether clients may identify themselves by the <code>https</code> URL of a client ID metadata document, which is fetched by the <i>Client metadata fetcher</i>.
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.client-metadata-cache-lifetime = Client metadata cache lifetime
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.client-metadata-cache-lifetime.tooltip = How long a fetched client ID metadata document is used before it is fetched again.
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.client-metadata-cache-size = Client metadata cache size
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.client-metadata-cache-size.tooltip = The number of client ID metadata documents kept in memory.
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.client-metadata-fetcher = Client metadata fetcher
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.client-metadata-fetcher.tooltip = How a client ID metadata document is retrieved.
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.consent-page = Consent page
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.consent-page.tooltip = The page on which a person decides about an authorization request, as path relative to the context path of the application, e.g. <code>/view/oauth-consent.view.xml</code>. <p> The authorization endpoint sends the browser there with the identifier of the pending authorization in the query parameter <code>"pending"</code>. The page is contributed by the module of the user interface (<code>tl-oauth-server-view</code> for the React UI); without one, the authorization endpoint answers <code>404</code>. </p>
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.dynamic-client-registration = Dynamic client registration
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.dynamic-client-registration.tooltip = Whether clients may register themselves at the endpoint <code>"/oauth/register"</code> (RFC 7591). <p> Switched off, the endpoint answers <code>404</code> and the metadata names no registration endpoint. Clients registered before remain usable. </p>
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.max-registered-clients = Maximum registered clients
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.max-registered-clients.tooltip = The number of dynamically registered clients beyond which no further client is registered. <p> Registration needs no authentication, so this bounds what an anonymous caller can store. Together with the clean-up of clients nobody authorized (<i>Unused client lifetime</i>), it limits a flood of registrations to a temporary refusal of new clients. </p>
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.pending-authorization-lifetime = Pending authorization lifetime
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.pending-authorization-lifetime.tooltip = How long a person has to decide about an authorization request, logging in included.
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.refresh-token-lifetime = Refresh token lifetime
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.refresh-token-lifetime.tooltip = How long a refresh token can be exchanged after it was issued. <p> Every exchange issues a new refresh token with this lifetime, so a client that is used at least once within this period stays signed in. </p>
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.unused-client-lifetime = Unused client lifetime
com.top_logic.oauth.server.OAuthAuthorizationServer.Config.unused-client-lifetime.tooltip = How long a dynamically registered client that was never authorized is kept after its registration. <p> A client registers itself immediately before it asks a person for authorization, so a client nobody authorized within this time is abandoned. </p>
com.top_logic.oauth.server.OAuthAuthorizationServer.tooltip = The OAuth 2.1 authorization server of the application. <p> Issues access tokens for the application's own endpoints (MCP, A2A, REST services) to public clients, following the authorization profile of the Model Context Protocol: </p> <ul> <li>Authorization code grant with PKCE, method <code>S256</code> only (RFC 7636).</li> <li>Tokens bound to one resource of the application (RFC 8707).</li> <li>Refresh tokens that rotate: an exchanged refresh token is invalid, and presenting it again revokes the whole grant.</li> <li>Clients identified by the URL of a client ID metadata document, or registered dynamically (RFC 7591).</li> <li>Authorization server metadata (RFC 8414).</li> </ul> <p> Tokens and codes are opaque random strings, see <i>secret tokens</i>; only their SHA-256 is stored. The HTTP endpoints are served by <i>O auth server servlet</i>; access tokens are accepted by <i>oAuth access token of this application</i>. </p>
com.top_logic.oauth.server.OAuthCleanUpTask = Clean up OAuth authorizations
com.top_logic.oauth.server.OAuthCleanUpTask.tooltip = Scheduler task removing expired authorization codes and tokens, authorizations that can no longer be used, and dynamically registered clients nobody uses. <p> Does nothing while the <i>oAuth authorization server</i> is not active. </p>
com.top_logic.oauth.server.OAuthFunctions.approve = Allow OAuth authorization request
com.top_logic.oauth.server.OAuthFunctions.approve.param.pending.tooltip = The identifier of the pending authorization.
com.top_logic.oauth.server.OAuthFunctions.approve.return = The address to send the browser to: the redirect URI of the client with the code and the state of the client.
com.top_logic.oauth.server.OAuthFunctions.approve.tooltip = The current user agrees to a pending authorization. <p> Issues the authorization code for the client and ends the pending authorization; a second decision about it is refused. </p>
com.top_logic.oauth.server.OAuthFunctions.deny = Deny OAuth authorization request
com.top_logic.oauth.server.OAuthFunctions.deny.param.pending.tooltip = The identifier of the pending authorization.
com.top_logic.oauth.server.OAuthFunctions.deny.return = The address to send the browser to: the redirect URI of the client with the error <code>access_denied</code> and the state of the client.
com.top_logic.oauth.server.OAuthFunctions.deny.tooltip = The current user refuses a pending authorization.
com.top_logic.oauth.server.OAuthFunctions.refusal = Refusal of an OAuth authorization request
com.top_logic.oauth.server.OAuthFunctions.refusal.param.pending.tooltip = The identifier of the pending authorization.
com.top_logic.oauth.server.OAuthFunctions.refusal.return = The message telling that there is no such request - it never existed or has been answered - or that it has expired; <code>null</code> if the person can decide.
com.top_logic.oauth.server.OAuthFunctions.refusal.tooltip = The reason why the person cannot decide about a pending authorization.
com.top_logic.oauth.server.OAuthFunctions.request = OAuth authorization request
com.top_logic.oauth.server.OAuthFunctions.request.param.pending.tooltip = The identifier of the pending authorization.
com.top_logic.oauth.server.OAuthFunctions.request.return = A dictionary with the name of the client (<code>"client"</code>), its client ID (<code>"clientId"</code>), the host of its client ID metadata document (<code>"clientHost"</code>, empty for a registered client), the redirect URI (<code>"redirectUri"</code>) and its host (<code>"redirectHost"</code>), the endpoint the client wants to call (<code>"resource"</code>) and the requested scope (<code>"scope"</code>); <code>null</code> if the person cannot decide about it, see <i>refusal of an OAuth authorization request</i>.
com.top_logic.oauth.server.OAuthFunctions.request.tooltip = What a pending authorization asks for, for display on the consent page.
