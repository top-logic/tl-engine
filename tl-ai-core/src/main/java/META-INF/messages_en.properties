com.top_logic.tl.ai.core.security.AiToolAccessService = Ai tool access service
com.top_logic.tl.ai.core.security.AiToolAccessService.tooltip = Decides which security roles may use which agent tools. <p> Always applied. A role that is not configured here may use no tool; an application that configures nothing leaves its agents able to read the model and the data, and to change nothing. </p>
com.top_logic.tl.ai.core.security.RoleAccessPolicy$Cause = Cause
com.top_logic.tl.ai.core.security.RoleAccessPolicy$Cause.tooltip = Why a name was refused.
com.top_logic.tl.ai.core.security.RoleAccessPolicy$Dimension = Dimension
com.top_logic.tl.ai.core.security.RoleAccessPolicy$Dimension.tooltip = What a section is about.
com.top_logic.tl.ai.core.security.RoleAccessPolicy$Fallback = Fallback
com.top_logic.tl.ai.core.security.RoleAccessPolicy$Fallback.tooltip = What a section admits from a user none of whose roles it names.
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Cause.AGENTS_OWN_DENIED = Agents own denied
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Cause.AGENTS_OWN_DENIED.tooltip = The agent itself uses it and a role forbids it. <p> Nobody chose this: two settings of the application contradict each other - an agent is assigned a model, or declares a server, that a role of the acting account may never use. It therefore gets a sentence of its own, addressed to a user who can do nothing but report it. </p>
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Cause.NOT_GRANTED = Not granted
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Cause.NOT_GRANTED.tooltip = Nothing permits it: no role of the user, and not the section default.
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Cause.NOT_THE_AGENTS = Not the agents
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Cause.NOT_THE_AGENTS.tooltip = Only what the agent itself uses is permitted, and this is not that.
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Cause.ROLE_DENY = Role deny
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Cause.ROLE_DENY.tooltip = A role of the user forbids it by name.
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Dimension.AGENT = Agent
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Dimension.AGENT.tooltip = Which agents a user may run.
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Dimension.MCP_SERVER = Mcp server
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Dimension.MCP_SERVER.tooltip = Which MCP servers a user may attach to a single request.
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Dimension.MODEL = Model
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Dimension.MODEL.tooltip = Which language models a user may choose for a single request.
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Fallback.ALL = All
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Fallback.ALL.tooltip = Everything the application has.
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Fallback.BOUND = Bound
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Fallback.BOUND.tooltip = Only what the agent itself uses - its assigned model, its declared servers. <p> Which is what NONE refuses too: the two differ in what a client is offered, not in what it may do. </p>
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Fallback.NONE = None
com.top_logic.tl.ai.core.security.RoleAccessPolicy.Fallback.NONE.tooltip = Nothing, and nothing is offered either.
com.top_logic.tl.ai.core.security.RoleToolAccess$GroupSource = Group source
com.top_logic.tl.ai.core.security.RoleToolAccess$GroupSource.tooltip = Where the capability group of a tool comes from.
com.top_logic.tl.ai.core.security.RoleToolAccess.GroupSource.CONFIGURED = Configured
com.top_logic.tl.ai.core.security.RoleToolAccess.GroupSource.CONFIGURED.tooltip = A group assignment of the policy puts the tool into its group. Either the tool states none, or an administrator reclassified it.
com.top_logic.tl.ai.core.security.RoleToolAccess.GroupSource.DECLARED = Declared
com.top_logic.tl.ai.core.security.RoleToolAccess.GroupSource.DECLARED.tooltip = The tool states its own group, in its code.
com.top_logic.tl.ai.core.security.RoleToolAccess.GroupSource.NONE = None
com.top_logic.tl.ai.core.security.RoleToolAccess.GroupSource.NONE.tooltip = Neither: the tool belongs to no group and is therefore denied to everyone.
com.top_logic.tl.ai.core.security.ToolAccessPolicy = Tool access policy
com.top_logic.tl.ai.core.security.ToolAccessPolicy$AgentAccess = Agent access
com.top_logic.tl.ai.core.security.ToolAccessPolicy$AgentAccess.tooltip = Which security roles may run which agents. <p> Name no role and everybody may run every agent. Name a role and its holders may run exactly the agents it permits - a role entry that permits none lets its holders run no agent at all. Administrators are never restricted. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy$AgentDefault = Agent default
com.top_logic.tl.ai.core.security.ToolAccessPolicy$AgentDefault.tooltip = What a user may run who holds no role this section names.
com.top_logic.tl.ai.core.security.ToolAccessPolicy$AgentGrant = Agent grant
com.top_logic.tl.ai.core.security.ToolAccessPolicy$AgentGrant.tooltip = One entry of a list of permissions or refusals: the agents it names.
com.top_logic.tl.ai.core.security.ToolAccessPolicy$AgentRoleAccess = Agent role access
com.top_logic.tl.ai.core.security.ToolAccessPolicy$AgentRoleAccess.tooltip = Which agents one security role may and may not run.
com.top_logic.tl.ai.core.security.ToolAccessPolicy$BackgroundAllowlist = Background allowlist
com.top_logic.tl.ai.core.security.ToolAccessPolicy$BackgroundAllowlist.tooltip = The upper limit for agent runs that have nobody to confirm a tool call. <p> Either a list of capabilities, or <i>All</i> to accept such runs with no limit of their own. An entry without any capability is the strictest choice: those runs then reach nothing beyond conversing with the user and reporting the agent's own toolset. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy$Baseline = Baseline
com.top_logic.tl.ai.core.security.ToolAccessPolicy$Baseline.tooltip = The capabilities granted to every user, whatever their roles. <p> An entry without any capability is legal and grants nothing - which is how an application says that no capability at all is given to everyone. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy$Grant = Grant
com.top_logic.tl.ai.core.security.ToolAccessPolicy$Grant.tooltip = One entry of a list of permissions or refusals: either a whole capability group, or named single tools.
com.top_logic.tl.ai.core.security.ToolAccessPolicy$GroupMembership = Group membership
com.top_logic.tl.ai.core.security.ToolAccessPolicy$GroupMembership.tooltip = One capability group and the tools belonging to it. <p> For tools that do not state a group themselves. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy$McpAccess = Mcp access
com.top_logic.tl.ai.core.security.ToolAccessPolicy$McpAccess.tooltip = Which security roles may attach which MCP servers to a single request. <p> Name no role and every request reaches the servers its agent declares and no others. Name a role and its holders may additionally attach the servers it permits. Administrators are never restricted. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy$McpDefault = Mcp default
com.top_logic.tl.ai.core.security.ToolAccessPolicy$McpDefault.tooltip = What a user may attach who holds no role this section names.
com.top_logic.tl.ai.core.security.ToolAccessPolicy$McpGrant = Mcp grant
com.top_logic.tl.ai.core.security.ToolAccessPolicy$McpGrant.tooltip = One entry of a list of permissions or refusals: the MCP servers it names.
com.top_logic.tl.ai.core.security.ToolAccessPolicy$McpRoleAccess = Mcp role access
com.top_logic.tl.ai.core.security.ToolAccessPolicy$McpRoleAccess.tooltip = Which MCP servers one security role may and may not attach.
com.top_logic.tl.ai.core.security.ToolAccessPolicy$ModelAccess = Model access
com.top_logic.tl.ai.core.security.ToolAccessPolicy$ModelAccess.tooltip = Which security roles may choose which language model for a single request. <p> Name no role and every request runs on the model its agent is assigned. Name a role and its holders may additionally choose the models it permits. Administrators are never restricted. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy$ModelDefault = Model default
com.top_logic.tl.ai.core.security.ToolAccessPolicy$ModelDefault.tooltip = What a user may choose who holds no role this section names.
com.top_logic.tl.ai.core.security.ToolAccessPolicy$ModelGrant = Model grant
com.top_logic.tl.ai.core.security.ToolAccessPolicy$ModelGrant.tooltip = One entry of a list of permissions or refusals: the models it names.
com.top_logic.tl.ai.core.security.ToolAccessPolicy$ModelRoleAccess = Model role access
com.top_logic.tl.ai.core.security.ToolAccessPolicy$ModelRoleAccess.tooltip = Which models one security role may and may not choose.
com.top_logic.tl.ai.core.security.ToolAccessPolicy$RoleAccess = Role access
com.top_logic.tl.ai.core.security.ToolAccessPolicy$RoleAccess.tooltip = What one security role may and may not use.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.AgentAccess.default = Default
com.top_logic.tl.ai.core.security.ToolAccessPolicy.AgentAccess.default.tooltip = What a user may run whose roles are not named below.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.AgentAccess.roles = Roles
com.top_logic.tl.ai.core.security.ToolAccessPolicy.AgentAccess.roles.tooltip = The roles, and which agents each of them may run.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.AgentDefault.ALL = All
com.top_logic.tl.ai.core.security.ToolAccessPolicy.AgentDefault.ALL.tooltip = Every agent of the application.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.AgentDefault.NONE = None
com.top_logic.tl.ai.core.security.ToolAccessPolicy.AgentDefault.NONE.tooltip = No agent at all. Only the roles named below may run anything.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.AgentGrant.agents = Agents
com.top_logic.tl.ai.core.security.ToolAccessPolicy.AgentGrant.agents.tooltip = The agents this entry refers to, by name.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.AgentRoleAccess.denies = Denies
com.top_logic.tl.ai.core.security.ToolAccessPolicy.AgentRoleAccess.denies.tooltip = The agents this role may never run. <p> A refusal here always wins - over what this role is permitted, and over what every other role of the same user permits. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.AgentRoleAccess.grants = Grants
com.top_logic.tl.ai.core.security.ToolAccessPolicy.AgentRoleAccess.grants.tooltip = The agents this role may run. <p> Leave this empty to let the role run no agent at all. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.AgentRoleAccess.name.tooltip = The security role this entry is about.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.BackgroundAllowlist.all = All
com.top_logic.tl.ai.core.security.ToolAccessPolicy.BackgroundAllowlist.all.tooltip = Lets a run with nobody to ask use everything the acting user's roles allow. <p> Switch this on only if you deliberately want such runs without a limit of their own. It gives up the only safeguard that stands in for the confirmation nobody is there to give. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.BackgroundAllowlist.grants = Grants
com.top_logic.tl.ai.core.security.ToolAccessPolicy.BackgroundAllowlist.grants.tooltip = The capabilities and single tools a run with nobody to ask may use. <p> Ignored when <i>All</i> is switched on. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.Baseline.grants = Grants
com.top_logic.tl.ai.core.security.ToolAccessPolicy.Baseline.grants.tooltip = The capabilities and single tools every user may use.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.Grant.group = Group
com.top_logic.tl.ai.core.security.ToolAccessPolicy.Grant.group.tooltip = The capability group this entry refers to. <p> Leave this empty if the entry names single tools instead. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.Grant.tools = Tools
com.top_logic.tl.ai.core.security.ToolAccessPolicy.Grant.tools.tooltip = The single tools this entry refers to, by their qualified name. <p> Pick one or several. Leave this empty if the entry names a capability group instead: an entry says either a group or tools, never both. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.GroupMembership.name.tooltip = The capability group the tools listed here belong to.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.GroupMembership.tools = Tools
com.top_logic.tl.ai.core.security.ToolAccessPolicy.GroupMembership.tools.tooltip = The tools belonging to this group, by their qualified name. <p> Pick every tool that belongs here. A tool that is not listed keeps the group it declares itself, and has none at all if it declares none. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpAccess.default = Default
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpAccess.default.tooltip = What a user may attach whose roles are not named below.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpAccess.roles = Roles
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpAccess.roles.tooltip = The roles, and which MCP servers each of them may attach.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpDefault.AGENT = Agent
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpDefault.AGENT.tooltip = Only the servers the agent of the request declares itself. The choice is not offered.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpDefault.ALL = All
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpDefault.ALL.tooltip = Every server the application has configured.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpDefault.NONE = None
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpDefault.NONE.tooltip = No server at all, not even the ones the agent declares.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpGrant.servers = Servers
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpGrant.servers.tooltip = The MCP servers this entry refers to, by name.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpRoleAccess.denies = Denies
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpRoleAccess.denies.tooltip = The MCP servers this role may never attach. <p> A refusal here always wins - over what this role is permitted, over what every other role of the same user permits, and over the servers the agent declares itself. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpRoleAccess.grants = Grants
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpRoleAccess.grants.tooltip = The MCP servers this role may attach. <p> Leave this empty to let the role attach no server at all - not even the ones the agent declares itself. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.McpRoleAccess.name.tooltip = The security role this entry is about.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelAccess.default = Default
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelAccess.default.tooltip = What a user may choose whose roles are not named below.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelAccess.roles = Roles
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelAccess.roles.tooltip = The roles, and which models each of them may choose.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelDefault.ALL = All
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelDefault.ALL.tooltip = Every model the application has configured.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelDefault.ASSIGNED = Assigned
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelDefault.ASSIGNED.tooltip = Only the model the agent of the request is assigned. The choice is not offered.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelDefault.NONE = None
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelDefault.NONE.tooltip = Nothing, not even the agent's own model - which stops every request that names a model.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelGrant.models = Models
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelGrant.models.tooltip = The models this entry refers to, by name.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelRoleAccess.denies = Denies
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelRoleAccess.denies.tooltip = The models this role may never choose. <p> A refusal here always wins - over what this role is permitted, and over what every other role of the same user permits. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelRoleAccess.grants = Grants
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelRoleAccess.grants.tooltip = The models this role may choose. <p> The model an agent is assigned is always usable; this is about choosing another one for a single request. Leave this empty to take that choice away from the role. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.ModelRoleAccess.name.tooltip = The security role this entry is about.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.RoleAccess.denies = Denies
com.top_logic.tl.ai.core.security.ToolAccessPolicy.RoleAccess.denies.tooltip = The capabilities and single tools this role may never use. <p> A refusal here always wins - over what this role is granted, and over what every other role of the same user grants. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.RoleAccess.grants = Grants
com.top_logic.tl.ai.core.security.ToolAccessPolicy.RoleAccess.grants.tooltip = The capabilities and single tools this role may use.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.RoleAccess.name.tooltip = The security role this entry is about.
com.top_logic.tl.ai.core.security.ToolAccessPolicy.agent-access = Agent access
com.top_logic.tl.ai.core.security.ToolAccessPolicy.agent-access.tooltip = Which security roles may run which agents. <p> Everybody may run every agent until a role is named here. As soon as one of a user's roles is named, that user may run exactly the agents their named roles permit - see <i>agent access</i>. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.background-allowlist = Background allowlist
com.top_logic.tl.ai.core.security.ToolAccessPolicy.background-allowlist.tooltip = What an agent run with nobody to ask may use: a scheduled or asynchronous run, or a request from an external client. <p> Such a run confirms every tool call itself, so this is its upper limit; the acting user's roles apply on top. An application that lists any role above and leaves this out does not start. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.baseline = Baseline
com.top_logic.tl.ai.core.security.ToolAccessPolicy.baseline.tooltip = Capabilities every logged-in user gets in addition to the ones their roles grant. <p> Conversing with the user and reporting the agent's own toolset need no entry - both are granted anyway. Write nothing and everyone may also read the model and the business data. Write this element empty to grant nothing further. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.mcp-access = Mcp access
com.top_logic.tl.ai.core.security.ToolAccessPolicy.mcp-access.tooltip = Which security roles may attach which MCP servers to a single request. <p> Nobody attaches a server until this says so: by default a request reaches the servers the agent itself declares and no others - see <i>mcp access</i>. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.model-access = Model access
com.top_logic.tl.ai.core.security.ToolAccessPolicy.model-access.tooltip = Which security roles may choose which language models for a single request. <p> Nobody chooses a model until this says so: by default a request runs on the model the agent is assigned, whatever a client asks for - see <i>model access</i>. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.tool-access = Tool access
com.top_logic.tl.ai.core.security.ToolAccessPolicy.tool-access.tooltip = The roles, and what each of them may use. <p> A role that is not listed here may use no tool. An empty list therefore leaves every user with nothing but what <i>Baseline</i> grants. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.tool-groups = Tool groups
com.top_logic.tl.ai.core.security.ToolAccessPolicy.tool-groups.tooltip = Assigns tools to a capability group when the tool does not state its own. <p> Needed for tools that appear only while the application runs: those of a connected MCP server, and TL-Script tools. Such a tool is usable by nobody until it is listed here, and an entry here also overrides the group a tool states itself. </p>
com.top_logic.tl.ai.core.security.ToolAccessPolicy.tooltip = Which security roles may use which agent tools. <p> Nothing is allowed that is not granted here: a role that is not listed may use no tool at all, and so may a user who holds no listed role. This is always applied - there is no setting that switches it off. An application that lists nothing leaves its agents with the read-only capabilities below. </p>
com.top_logic.tl.ai.core.security.ToolAccessRule$Kind = Kind
com.top_logic.tl.ai.core.security.ToolAccessRule$Kind.tooltip = The mechanisms of a tool access policy a decision can come from.
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.ADMIN_BYPASS = Admin bypass
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.ADMIN_BYPASS.tooltip = The account is an administrator and therefore bypasses this layer entirely.
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.BACKGROUND_CEILING = Background ceiling
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.BACKGROUND_CEILING.tooltip = The ceiling for runs that have nobody to answer a confirmation prompt. Binds administrators too.
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.BASELINE = Baseline
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.BASELINE.tooltip = An entry of the policy's own baseline, which reaches every account.
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.DEFAULT_BASELINE = Default baseline
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.DEFAULT_BASELINE.tooltip = The read-only default that applies because the policy states no baseline of its own.
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.IMPLICIT_BASELINE = Implicit baseline
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.IMPLICIT_BASELINE.tooltip = Granted to everyone, in every run mode, without being configured.
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.NOT_GRANTED = Not granted
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.NOT_GRANTED.tooltip = Nothing in the policy reaches the capability: no baseline entry and no role of the account.
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.ROLE_DENY = Role deny
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.ROLE_DENY.tooltip = A prohibition of one of the account's roles. Wins over every permission.
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.ROLE_GRANT = Role grant
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.ROLE_GRANT.tooltip = A permission the account holds through one of its roles.
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.UNCLASSIFIED = Unclassified
com.top_logic.tl.ai.core.security.ToolAccessRule.Kind.UNCLASSIFIED.tooltip = The tool belongs to no capability group, so no group grant can reach it and only an explicit per-tool grant could.
com.top_logic.tl.ai.core.security.layout.ApplyToolAccessPolicyCommand = Apply tool access policy command
com.top_logic.tl.ai.core.security.layout.ApplyToolAccessPolicyCommand.tooltip = Checks the edited tool access policy and writes it if the next application start would accept it.
com.top_logic.tl.ai.core.security.layout.CapabilityRisk = Capability risk
com.top_logic.tl.ai.core.security.layout.CapabilityRisk.EGRESS = Egress
com.top_logic.tl.ai.core.security.layout.CapabilityRisk.EGRESS.tooltip = Its tools send data out of the application.
com.top_logic.tl.ai.core.security.layout.CapabilityRisk.IMPLICIT = Implicit
com.top_logic.tl.ai.core.security.layout.CapabilityRisk.IMPLICIT.tooltip = Every account holds it, configured or not.
com.top_logic.tl.ai.core.security.layout.CapabilityRisk.NONE = None
com.top_logic.tl.ai.core.security.layout.CapabilityRisk.NONE.tooltip = Nothing beyond what the group itself says.
com.top_logic.tl.ai.core.security.layout.CapabilityRisk.PRIVILEGED = Privileged
com.top_logic.tl.ai.core.security.layout.CapabilityRisk.PRIVILEGED.tooltip = Its tools can express any other capability, so granting it grants more than it names.
com.top_logic.tl.ai.core.security.layout.CapabilityRisk.tooltip = What makes a capability group worth looking at twice.
com.top_logic.tl.ai.core.security.layout.DiscardToolAccessPolicyCommand = Discard tool access policy command
com.top_logic.tl.ai.core.security.layout.DiscardToolAccessPolicyCommand.tooltip = Throws away the unsaved changes of the tool access policy and shows the saved one again.
com.top_logic.tl.ai.core.security.layout.EffectiveToolAccessComponent = Effective tool access component
com.top_logic.tl.ai.core.security.layout.EffectiveToolAccessComponent.tooltip = Shows what one account or role may call, and which rule of the policy decided. <p> Read-only, and the one view that answers for the <em>running</em> service: what is saved but not yet in effect is not shown here. The policy itself is written on the Richtlinie tab. </p>
com.top_logic.tl.ai.core.security.layout.PolicyDraft$BackgroundChoice = Background choice
com.top_logic.tl.ai.core.security.layout.PolicyDraft$BackgroundChoice.tooltip = The upper limit for runs that have nobody to confirm a tool call.
com.top_logic.tl.ai.core.security.layout.PolicyDraft$BaselineChoice = Baseline choice
com.top_logic.tl.ai.core.security.layout.PolicyDraft$BaselineChoice.tooltip = What every account gets in addition to what its roles grant.
com.top_logic.tl.ai.core.security.layout.PolicyDraft$CapabilityState = Capability state
com.top_logic.tl.ai.core.security.layout.PolicyDraft$CapabilityState.tooltip = What one role says about one capability.
