model.tl.ai.execution = Agentenausführung
model.tl.ai.execution.AgentExecution = Agentenausführung
model.tl.ai.execution.AgentExecution.agentName = Agentenname
model.tl.ai.execution.AgentExecution.agentName.tooltip = Name der Agentendefinition, die ausgeführt wurde.
model.tl.ai.execution.AgentExecution.cacheReadTokens = Cache-Lese-Tokens
model.tl.ai.execution.AgentExecution.cacheReadTokens.tooltip = Prompt-Tokens, die aus dem Prompt-Cache des Anbieters bedient wurden.
model.tl.ai.execution.AgentExecution.cacheWriteTokens = Cache-Schreib-Tokens
model.tl.ai.execution.AgentExecution.cacheWriteTokens.tooltip = Prompt-Tokens, die in den Prompt-Cache des Anbieters geschrieben wurden.
model.tl.ai.execution.AgentExecution.cancelRequested = Abbruch angefordert
model.tl.ai.execution.AgentExecution.cancelRequested.tooltip = Gesetzt, wenn der Abbruch eines laufenden Laufs angefordert wurde.
model.tl.ai.execution.AgentExecution.cost = Kosten
model.tl.ai.execution.AgentExecution.cost.tooltip = Was der Lauf gekostet hat: seine Tokens mal die Preise des Modells, das geantwortet hat, in der Währung daneben. Ein Modell ohne Preis kostet 0. Leer bei Läufen, die aufgezeichnet wurden, bevor Kosten erfasst wurden.
model.tl.ai.execution.AgentExecution.currency = Währung
model.tl.ai.execution.AgentExecution.currency.tooltip = Die Währung, in der die Kosten des Laufs angegeben sind.
model.tl.ai.execution.AgentExecution.displayName = Name
model.tl.ai.execution.AgentExecution.displayName.tooltip = Lesbare Identität: Agentenname, Startzeit und ein kurzes Suffix der Lauf-ID. Das Suffix hält die Bezeichnung unterscheidbar, da parallele Subagenten-Läufe in derselben Sekunde starten können. Berechnet, nicht änderbar.
model.tl.ai.execution.AgentExecution.endedAt = Beendet am
model.tl.ai.execution.AgentExecution.endedAt.tooltip = Wann der Lauf einen Endzustand erreicht hat. Leer, solange er noch läuft.
model.tl.ai.execution.AgentExecution.environment = Umgebung
model.tl.ai.execution.AgentExecution.environment.tooltip = Was dieser Lauf dem Modell über die Situation mitgeteilt hat, in der er stattfand: der ausgefüllte Umgebungsblock des System-Prompts, geschrieben beim Start des Laufs.
model.tl.ai.execution.AgentExecution.errorMessage = Fehlermeldung
model.tl.ai.execution.AgentExecution.errorMessage.tooltip = Fehlertext eines fehlgeschlagenen Laufs.
model.tl.ai.execution.AgentExecution.inputTokens = Eingabe-Tokens
model.tl.ai.execution.AgentExecution.inputTokens.tooltip = Für diesen Lauf abgerechnete Prompt-Tokens.
model.tl.ai.execution.AgentExecution.model = Modell
model.tl.ai.execution.AgentExecution.model.tooltip = LLM-Modell, das der Lauf verwendet hat.
model.tl.ai.execution.AgentExecution.outputTokens = Ausgabe-Tokens
model.tl.ai.execution.AgentExecution.outputTokens.tooltip = Für diesen Lauf abgerechnete Antwort-Tokens.
model.tl.ai.execution.AgentExecution.parentExecution = Übergeordnete Ausführung
model.tl.ai.execution.AgentExecution.parentExecution.tooltip = Lauf, der diesen gestartet hat. Bei einem Subagenten-Lauf gesetzt, bei einem Lauf der obersten Ebene leer.
model.tl.ai.execution.AgentExecution.provider = Anbieter
model.tl.ai.execution.AgentExecution.provider.tooltip = LLM-Anbieter, der das Modell bereitgestellt hat.
model.tl.ai.execution.AgentExecution.response = Antwort
model.tl.ai.execution.AgentExecution.response.tooltip = Endgültige Antwort, die der Lauf erzeugt hat.
model.tl.ai.execution.AgentExecution.runId = Lauf-ID
model.tl.ai.execution.AgentExecution.runId.tooltip = Technischer Bezeichner des Laufs. Verknüpft den Lauf mit seinem Ereignisstrom und seinen Log-Einträgen.
model.tl.ai.execution.AgentExecution.session = Sitzung
model.tl.ai.execution.AgentExecution.session.tooltip = Sitzung, zu der dieser Lauf gehört.
model.tl.ai.execution.AgentExecution.startedAt = Gestartet am
model.tl.ai.execution.AgentExecution.startedAt.tooltip = Wann der Lauf gestartet wurde.
model.tl.ai.execution.AgentExecution.status = Status
model.tl.ai.execution.AgentExecution.status.tooltip = Lebenszyklus-Zustand des Laufs.
model.tl.ai.execution.AgentExecution.stopReason = Abbruchgrund
model.tl.ai.execution.AgentExecution.stopReason.tooltip = Warum die Agentenschleife beendet wurde.
model.tl.ai.execution.AgentExecution.thinkingTokens = Denk-Tokens
model.tl.ai.execution.AgentExecution.thinkingTokens.tooltip = Tokens, die auf die Denkausgabe des Modells entfallen.
model.tl.ai.execution.AgentExecution.tooltip = Ein Durchlauf der Agentenschleife. Ein Subagenten-Lauf ist eine Ausführung mit gesetzter übergeordneter Ausführung; die Summe der Token-Zähler über den Teilbaum ergibt daher den Gesamtverbrauch eines Laufs samt Kindläufen.
model.tl.ai.execution.AgentExecution.transcript = Transkript
model.tl.ai.execution.AgentExecution.transcript.tooltip = Vollständiges Nachrichtentranskript des Laufs als JSON.
model.tl.ai.execution.AgentExecution.transcriptHtml = Transkript (dargestellt)
model.tl.ai.execution.AgentExecution.transcriptHtml.tooltip = Das Transkript des Laufs als lesbarer Verlauf: ein Abschnitt je Turn, darin je ein Block für Text, Denken, Tool-Aufruf, Freigabe, Rückfrage, Transaktion, Verdichtung, Fehler und Delegation. Berechnet aus dem Rohtranskript, nicht gespeichert.
model.tl.ai.execution.AgentSession = Agentensitzung
model.tl.ai.execution.AgentSession.createdAt = Erstellt am
model.tl.ai.execution.AgentSession.createdAt.tooltip = Wann die Sitzung erstellt wurde.
model.tl.ai.execution.AgentSession.displayName = Name
model.tl.ai.execution.AgentSession.displayName.tooltip = Lesbare Identität: der Titel der Sitzung, ersatzweise Eigentümer und Erstellungszeit. Berechnet, nicht änderbar.
model.tl.ai.execution.AgentSession.kind = Art
model.tl.ai.execution.AgentSession.kind.tooltip = Wie die Sitzung gestartet wurde.
model.tl.ai.execution.AgentSession.lastUpdated = Zuletzt aktualisiert
model.tl.ai.execution.AgentSession.lastUpdated.tooltip = Wann die Sitzung zuletzt geschrieben wurde.
model.tl.ai.execution.AgentSession.memory = Gedächtnis
model.tl.ai.execution.AgentSession.memory.tooltip = Persistiertes Konversationsgedächtnis: die komprimierte Historie, die der Agent in der nächsten Runde erhält.
model.tl.ai.execution.AgentSession.metadata = Metadaten
model.tl.ai.execution.AgentSession.metadata.tooltip = Zusätzlicher Sitzungszustand als JSON, zum Beispiel der Aufgabenplan des Agenten.
model.tl.ai.execution.AgentSession.owner = Eigentümer
model.tl.ai.execution.AgentSession.owner.tooltip = Benutzer, dem die Sitzung gehört. Leer bei einem Lauf unter einem Systemprinzipal.
model.tl.ai.execution.AgentSession.status = Status
model.tl.ai.execution.AgentSession.status.tooltip = Freitext-Status der Sitzung, gepflegt vom laufenden Agenten.
model.tl.ai.execution.AgentSession.subject = Bezugsobjekt
model.tl.ai.execution.AgentSession.subject.tooltip = Das Objekt, um das es in der Unterhaltung geht, zum Beispiel das Projekt oder der Beleg, den der Benutzer beim Start geöffnet hatte. Leer bei einer Unterhaltung, die ohne ein solches Objekt begonnen wurde; eine Seite schränkt ihre Sitzungsliste auf ein Objekt ein, indem sie nach den Sitzungen fragt, die darauf verweisen.
model.tl.ai.execution.AgentSession.title = Titel
model.tl.ai.execution.AgentSession.title.tooltip = Titel der Sitzung. Wird für interaktive Chats gesetzt; Hintergrund-, geplante und Skript-Sitzungen haben keinen.
model.tl.ai.execution.AgentSession.tooltip = Dauerhafter Kontext einer Agentenkonversation: kumuliertes Gedächtnis, Arbeitsstand und Darstellung. Ein interaktiver Chat ist eine Sitzung mit einem Benutzer als Eigentümer, ein Hintergrundauftrag eine Sitzung unter einem Systemprinzipal.
model.tl.ai.execution.AgentTask = Agentenaufgabe
model.tl.ai.execution.AgentTask.content = Inhalt
model.tl.ai.execution.AgentTask.content.tooltip = Vollständige Beschreibung der Aufgabe.
model.tl.ai.execution.AgentTask.displayName = Name
model.tl.ai.execution.AgentTask.displayName.tooltip = Lesbare Identität: die Position der Aufgabe im Plan und ihr Betreff. Berechnet, nicht änderbar.
model.tl.ai.execution.AgentTask.lastTouchedByExecution = Zuletzt geändert durch Ausführung
model.tl.ai.execution.AgentTask.lastTouchedByExecution.tooltip = Lauf, der die Aufgabe zuletzt geändert hat. Nur zur Zuordnung; die Aufgabe gehört zur Sitzung, nicht zu einem Lauf.
model.tl.ai.execution.AgentTask.ordinal = Reihenfolge
model.tl.ai.execution.AgentTask.ordinal.tooltip = Position der Aufgabe im Plan.
model.tl.ai.execution.AgentTask.session = Sitzung
model.tl.ai.execution.AgentTask.session.tooltip = Sitzung, zu deren Plan diese Aufgabe gehört.
model.tl.ai.execution.AgentTask.status = Status
model.tl.ai.execution.AgentTask.status.tooltip = Fortschritt der Aufgabe innerhalb des Plans.
model.tl.ai.execution.AgentTask.subject = Betreff
model.tl.ai.execution.AgentTask.subject.tooltip = Einzeilige Zusammenfassung der Aufgabe.
model.tl.ai.execution.AgentTask.taskId = Aufgaben-ID
model.tl.ai.execution.AgentTask.taskId.tooltip = Technischer Bezeichner der Aufgabe innerhalb des Plans.
model.tl.ai.execution.AgentTask.tooltip = Ein Eintrag im Aufgabenplan des Agenten. Sitzungsbezogen: der Plan ist über alle Ausführungen der Konversation kumulativ, ein Gegenstück zum Sitzungsgedächtnis.
model.tl.ai.execution.ArchivedPage = Archivierte Webseite
model.tl.ai.execution.ArchivedPage.content = Inhalt
model.tl.ai.execution.ArchivedPage.content.tooltip = Der Text, den der Agent gelesen hat, als Markdown.
model.tl.ai.execution.ArchivedPage.contentHash = Inhalts-Hash
model.tl.ai.execution.ArchivedPage.contentHash.tooltip = SHA-256 des Texts, damit dieselbe Seite nur einmal gespeichert wird.
model.tl.ai.execution.ArchivedPage.fetchedAt = Abgerufen am
model.tl.ai.execution.ArchivedPage.fetchedAt.tooltip = Wann der Agent die Seite gelesen hat.
model.tl.ai.execution.ArchivedPage.handle = Schlüssel
model.tl.ai.execution.ArchivedPage.handle.tooltip = Der nicht erratbare Schlüssel, unter dem die archivierte Kopie geöffnet wird.
model.tl.ai.execution.ArchivedPage.owner = Besitzer
model.tl.ai.execution.ArchivedPage.owner.tooltip = Das Konto, dessen Agentenlauf die Seite gelesen hat. Nur dieses Konto und Administratoren können die Kopie öffnen.
model.tl.ai.execution.ArchivedPage.title = Titel
model.tl.ai.execution.ArchivedPage.title.tooltip = Der Titel der Seite.
model.tl.ai.execution.ArchivedPage.url = Adresse
model.tl.ai.execution.ArchivedPage.url.tooltip = Die Adresse, von der die Seite gelesen wurde.
model.tl.ai.execution.ExecutionStatus = Ausführungsstatus
model.tl.ai.execution.ExecutionStatus.CANCELLED = Abgebrochen
model.tl.ai.execution.ExecutionStatus.CANCELLED.tooltip = Der Lauf wurde abgebrochen.
model.tl.ai.execution.ExecutionStatus.COMPLETE = Abgeschlossen
model.tl.ai.execution.ExecutionStatus.COMPLETE.tooltip = Der Lauf wurde normal beendet.
model.tl.ai.execution.ExecutionStatus.ERROR = Fehler
model.tl.ai.execution.ExecutionStatus.ERROR.tooltip = Der Lauf ist fehlgeschlagen.
model.tl.ai.execution.ExecutionStatus.REJECTED = Abgelehnt
model.tl.ai.execution.ExecutionStatus.REJECTED.tooltip = Der Lauf wurde durch eine Genehmigungsentscheidung abgelehnt.
model.tl.ai.execution.ExecutionStatus.RUNNING = Läuft
model.tl.ai.execution.ExecutionStatus.RUNNING.tooltip = Die Agentenschleife läuft, oder sie ist abgebrochen, ohne einen Endzustand zu erreichen.
model.tl.ai.execution.ExecutionStatus.tooltip = Lebenszyklus-Zustand einer Agentenausführung.
model.tl.ai.execution.InteractionRequest = Interaktionsanfrage
model.tl.ai.execution.InteractionRequest.createdAt = Erstellt am
model.tl.ai.execution.InteractionRequest.createdAt.tooltip = Wann die Anfrage gestellt wurde.
model.tl.ai.execution.InteractionRequest.displayName = Name
model.tl.ai.execution.InteractionRequest.displayName.tooltip = Lesbare Identität: was gefragt wird, wozu und wann. Berechnet, nicht änderbar.
model.tl.ai.execution.InteractionRequest.execution = Ausführung
model.tl.ai.execution.InteractionRequest.execution.tooltip = Lauf, der die Anfrage gestellt hat.
model.tl.ai.execution.InteractionRequest.header = Titel
model.tl.ai.execution.InteractionRequest.header.tooltip = Kurze Zusammenfassung der Frage.
model.tl.ai.execution.InteractionRequest.payload = Nutzdaten
model.tl.ai.execution.InteractionRequest.payload.tooltip = Typspezifische Details als JSON, zum Beispiel der zu genehmigende Tool-Aufruf oder die Auswahlmöglichkeiten.
model.tl.ai.execution.InteractionRequest.prompt = Frage
model.tl.ai.execution.InteractionRequest.prompt.tooltip = Vollständiger Fragetext, der dem Beantworter angezeigt wird.
model.tl.ai.execution.InteractionRequest.requestId = Anfrage-ID
model.tl.ai.execution.InteractionRequest.requestId.tooltip = Technischer Bezeichner der Anfrage. Verknüpft die Antwort mit dem darauf wartenden Lauf.
model.tl.ai.execution.InteractionRequest.resolution = Auflösung
model.tl.ai.execution.InteractionRequest.resolution.tooltip = Die gegebene Antwort.
model.tl.ai.execution.InteractionRequest.resolvedAt = Aufgelöst am
model.tl.ai.execution.InteractionRequest.resolvedAt.tooltip = Wann die Anfrage beantwortet wurde. Leer, solange sie aussteht.
model.tl.ai.execution.InteractionRequest.responder = Beantworter
model.tl.ai.execution.InteractionRequest.responder.tooltip = Benutzer, der geantwortet hat oder antworten soll.
model.tl.ai.execution.InteractionRequest.state = Zustand
model.tl.ai.execution.InteractionRequest.state.tooltip = Lebenszyklus-Zustand der Anfrage.
model.tl.ai.execution.InteractionRequest.tooltip = Eine Rückfrage eines Laufs an einen Menschen: Genehmigung, Frage oder Auswahl. Die Abfrage nach Beantworter und Zustand "Ausstehend" ergibt einen Genehmigungseingang über Chats und Hintergrundaufträge hinweg.
model.tl.ai.execution.InteractionRequest.type = Typ
model.tl.ai.execution.InteractionRequest.type.tooltip = Welche Art von Antwort der Lauf erwartet.
model.tl.ai.execution.InteractionState = Interaktionszustand
model.tl.ai.execution.InteractionState.CANCELLED = Abgebrochen
model.tl.ai.execution.InteractionState.CANCELLED.tooltip = Zurückgezogen, zum Beispiel weil der Lauf abgebrochen wurde.
model.tl.ai.execution.InteractionState.PENDING = Ausstehend
model.tl.ai.execution.InteractionState.PENDING.tooltip = Wartet auf eine Antwort.
model.tl.ai.execution.InteractionState.RESOLVED = Aufgelöst
model.tl.ai.execution.InteractionState.RESOLVED.tooltip = Vom Beantworter beantwortet.
model.tl.ai.execution.InteractionState.TIMED_OUT = Zeitüberschreitung
model.tl.ai.execution.InteractionState.TIMED_OUT.tooltip = Keine Antwort innerhalb der erlaubten Zeit.
model.tl.ai.execution.InteractionState.tooltip = Lebenszyklus-Zustand einer Interaktionsanfrage.
model.tl.ai.execution.InteractionType = Interaktionstyp
model.tl.ai.execution.InteractionType.APPROVAL = Genehmigung
model.tl.ai.execution.InteractionType.APPROVAL.tooltip = Genehmigung eines Tool-Aufrufs.
model.tl.ai.execution.InteractionType.CHOICE = Auswahl
model.tl.ai.execution.InteractionType.CHOICE.tooltip = Auswahl aus vorgegebenen Möglichkeiten.
model.tl.ai.execution.InteractionType.QUESTION = Frage
model.tl.ai.execution.InteractionType.QUESTION.tooltip = Freitext-Frage.
model.tl.ai.execution.InteractionType.tooltip = Art der Rückfrage an einen Menschen.
model.tl.ai.execution.MemoryKind = Art der Erinnerung
model.tl.ai.execution.MemoryKind.FACT = Tatsache
model.tl.ai.execution.MemoryKind.FACT.tooltip = Etwas, das über diesen Benutzer oder seine Arbeit zutrifft.
model.tl.ai.execution.MemoryKind.FEEDBACK = Rückmeldung
model.tl.ai.execution.MemoryKind.FEEDBACK.tooltip = Eine Bewertung, die dieser Benutzer zur Arbeit abgegeben hat und die beim nächsten Mal gelten soll.
model.tl.ai.execution.MemoryKind.PREFERENCE = Präferenz
model.tl.ai.execution.MemoryKind.PREFERENCE.tooltip = Wie dieser Benutzer bedient werden möchte.
model.tl.ai.execution.MemoryKind.tooltip = Welche Art von Sache sich der Agent über den Benutzer gemerkt hat.
model.tl.ai.execution.SessionKind = Sitzungsart
model.tl.ai.execution.SessionKind.BACKGROUND = Hintergrund
model.tl.ai.execution.SessionKind.BACKGROUND.tooltip = Hintergrundauftrag ohne interaktive Oberfläche.
model.tl.ai.execution.SessionKind.CHAT = Chat
model.tl.ai.execution.SessionKind.CHAT.tooltip = Interaktiver Chat mit einem Benutzer als Eigentümer.
model.tl.ai.execution.SessionKind.SCHEDULED = Geplant
model.tl.ai.execution.SessionKind.SCHEDULED.tooltip = Von einem Planer ausgelöster Lauf.
model.tl.ai.execution.SessionKind.SCRIPT = Skript
model.tl.ai.execution.SessionKind.SCRIPT.tooltip = Aus einer TL-Script-Funktion gestarteter Lauf.
model.tl.ai.execution.SessionKind.tooltip = Wie eine Agentensitzung gestartet wurde.
model.tl.ai.execution.UserMemory = Benutzererinnerung
model.tl.ai.execution.UserMemory.createdAt = Erstellt am
model.tl.ai.execution.UserMemory.createdAt.tooltip = Wann die Erinnerung gespeichert wurde.
model.tl.ai.execution.UserMemory.displayName = Name
model.tl.ai.execution.UserMemory.displayName.tooltip = Lesbare Identität: die Art und der Anfang des Textes. Berechnet, nicht editierbar.
model.tl.ai.execution.UserMemory.kind = Art
model.tl.ai.execution.UserMemory.kind.tooltip = Ob es sich um eine Präferenz, eine Tatsache oder eine Rückmeldung handelt.
model.tl.ai.execution.UserMemory.owner = Eigentümer
model.tl.ai.execution.UserMemory.owner.tooltip = Das Konto, um das es in dieser Erinnerung geht. Kein Agent eines anderen Kontos liest sie.
model.tl.ai.execution.UserMemory.runId = Lauf-ID
model.tl.ai.execution.UserMemory.runId.tooltip = Der Agentenlauf, der die Erinnerung geschrieben hat.
model.tl.ai.execution.UserMemory.session = Sitzung
model.tl.ai.execution.UserMemory.session.tooltip = Der Chat, aus dem die Erinnerung stammt. Leer bei einer Erinnerung aus einem Lauf ohne Oberfläche.
model.tl.ai.execution.UserMemory.text = Text
model.tl.ai.execution.UserMemory.text.tooltip = Was gespeichert ist, in den Worten, in denen der Agent es abgelegt hat.
model.tl.ai.execution.UserMemory.tooltip = Eine Sache, die sich der Agent über einen Benutzer merkt, über Unterhaltungen hinweg. Privat für den Eigentümer, der sie in einer Liste sieht und löschen kann.
