model.tl.reporting = Reporting
model.tl.reporting.FlexReport = Saved report
model.tl.reporting.FlexReport.name = Name
model.tl.reporting.FlexReport.name.tooltip = The name under which the report is offered for selection.
model.tl.reporting.FlexReport.report = Report
model.tl.reporting.FlexReport.report.tooltip = The stored report definition. The value is not entered directly but written by the chart configurator, which serializes its configuration into it.
model.tl.reporting.FlexReport.tooltip = A report stored under a name. It belongs to the account that created it and can be published to groups, so that other users can use it as well.
model.tl.reporting.FlexReport.types = Business object types
model.tl.reporting.FlexReport.types.tooltip = The business object types the report was created for. It is only offered for a search result that consists of those types.
model.tl.reporting.FlexReport.version = Version
model.tl.reporting.FlexReport.version.tooltip = The format version of the stored definition. Only a report of the format version that the application currently writes is offered for selection.
model.tl.reporting.tooltip = Module with the type in which the charts configured for a search result are stored.
