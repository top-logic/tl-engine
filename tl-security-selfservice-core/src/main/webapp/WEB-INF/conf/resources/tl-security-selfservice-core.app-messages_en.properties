tl.security.selfservice.mail.invitation.body = <p>Dear Recipient,</p>\n<p>You have been invited to create an account for the application {0}.</p>\n<p>To begin the setup process, please open the link and follow the instructions on the website:<br/>\n<a href="{1}">{1}</a></p>\n<p>If you did not expect this invitation, you can safely ignore this email.</p>\n<p>Kind regards,<br/>\nYour {0} Team</p>
tl.security.selfservice.mail.invitation.subject = Invitation to {0}
tl.security.selfservice.mail.resetMfa.body = <p>Dear Recipient,</p>\n<p>A request has been made to reset the multi-factor authentication for your {0} account.</p>\n<p>If you made this request, you can reset the multi-factor authentication using the following code.<br/>\n<b>Verification code:</b> {1}</p>\n<p>For security reasons, this code is only valid for a limited time and can be used once.</p>\n<p>If you have any questions or need assistance, please contact our support team.</p>\n<p>Kind regards,<br/>\nYour {0} Team</p>
tl.security.selfservice.mail.resetMfa.subject = Verification code for multi-factor authentication reset in {0}
tl.security.selfservice.mail.resetPassword.body = <p>Dear Recipient,</p>\n<p>A request has been made to reset the password for your {0} account.</p>\n<p>If you made this request, you can set a new password using the following code.<br/>\n<b>Verification code:</b> {1}</p>\n<p>For security reasons, this code is only valid for a limited time and can be used once.</p>\n<p>If you did <b>not</b> request a password reset, you can safely ignore this email. Your password will remain unchanged.</p>\n<p>For your security, we recommend using a strong and unique password and updating it regularly.</p>\n<p>If you have any questions or need assistance, please contact our support team.</p>\n<p>Kind regards,<br/>\nYour {0} Team</p>
tl.security.selfservice.mail.resetPassword.subject = Password reset request in {0}
tl.security.selfservice.mail.verification.body = <p>Dear Recipient,</p>\n<p>Please enter the following verification code in the application to continue:<br/>\n<b>Verification code:</b> {1}</p>\n<p>This verification code is only valid for a limited time.</p>\n<p>If you did not expect this invitation, you can safely ignore this email.</p>\n<p>Kind regards,<br/>\nYour {0} Team</p>
tl.security.selfservice.mail.verification.subject = Your verification code for {0}
