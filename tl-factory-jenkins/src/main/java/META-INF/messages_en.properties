com.top_logic.factory.jenkins.JenkinsCIProvider = Jenkins CI provider
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.base-url.tooltip = The URL of the Jenkins server, e.g. https://jenkins.example.com/. <p> The URL under which its web interface is served, its "Jenkins URL". The pages of the jobs and builds the provider reports are below it. </p> <p> Empty switches the provider off, see <i>server provider configuration</i>. </p>
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.credentials = Credentials
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.credentials.tooltip = How the requests to Jenkins are authenticated. <p> If not set, with basic authentication of the user and the API token in the secret <code>"tl_factory_jenkins_token"</code>. </p>
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.folder = Folder
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.folder.tooltip = The folder of the jobs, nested folders separated by slashes; empty for the top level of Jenkins. <p> The folder is created if it does not exist. </p>
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.job-template = Job template
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.job-template.tooltip = The web application resource holding the configuration of a job with the placeholders <code>"@DESCRIPTION@"</code>, <code>"@REPOSITORY_URL@"</code>, <code>"@CREDENTIALS_ID@"</code>, <code>"@BRANCH@"</code> and <code>"@SCRIPT_PATH@"</code>. <p> The values are inserted escaped for XML text and attribute values. </p>
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.queue-wait = Queue wait
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.queue-wait.tooltip = How long starting a build waits for the build to leave the queue of Jenkins and get its number.
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.scm-credentials-id = Scm credentials ID
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.scm-credentials-id.tooltip = The ID of the Jenkins credential the jobs check out the repositories with; empty for none, e.g. for public repositories. <p> A credential of Jenkins with read access to the repositories of the git hosting service, e.g. a user name with an access token. It is set up in Jenkins; the control application names it only. </p>
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.script-path = Script path
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.script-path.tooltip = The path of the pipeline definition in a repository the jobs run.
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.timeout = Timeout
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.timeout.tooltip = How long a connection to Jenkins and each request may take.
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.user = User
com.top_logic.factory.jenkins.JenkinsCIProvider.Config.user.tooltip = The Jenkins user the requests are made as, if no credentials are configured. <p> The requests then authenticate with this user and the API token in the secret <code>"tl_factory_jenkins_token"</code>. </p>
com.top_logic.factory.jenkins.JenkinsCIProvider.tooltip = <i>CI provider</i> of a <a href="https://www.jenkins.io/">Jenkins</a> server. <p> The job of a project repository is a pipeline job ("Pipeline script from SCM") in the folder <i>Folder</i>, below a folder named after the owner of the repository and named after the repository: folder/owner/name. Missing folders are created. The job is created from the job template: it checks out the default branch of the repository from its clone URL with the Jenkins credential <i>Scm credentials ID</i> and runs the pipeline definition <i>Script path</i>. The control application never sends a git credential to Jenkins; the credential with read access to the git hosting is set up in Jenkins. </p> <p> The requests are authenticated with the configured credentials; without them, with basic authentication of the user <i>User</i> and the API token in the secret <code>"tl_factory_jenkins_token"</code>. Jenkins does not ask a request authenticated with an API token for a CSRF crumb, so the provider fetches none; credentials with a password instead of an API token are rejected by Jenkins for the changing requests. A request rejected with 401 is repeated once with fresh credentials. </p> <h2>Permissions</h2> <p> The user needs the permissions Overall/Read, Job/Create, Job/Configure, Job/Read and Job/Build in the folder of the jobs (and Job/Create in its parent to create it), and the right to use the SCM credential in the jobs. </p>
