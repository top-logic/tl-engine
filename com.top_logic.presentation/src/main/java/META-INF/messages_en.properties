com.top_logic.presentation.model.Overflow = Overflow
com.top_logic.presentation.model.Overflow.ELLIPSIS = Ellipsis
com.top_logic.presentation.model.Overflow.ELLIPSIS.tooltip = The text keeps its size and is cut off after the last word that fits, followed by "…".
com.top_logic.presentation.model.Overflow.ERROR = Error
