com.top_logic.xio.importer.handlers.TextContentImport.Config.format.tooltip = Das Format, das den XML-Textwert in einen Modelleigenschaftswert konvertiert.
com.top_logic.xio.importer.handlers.TextContentImport.tooltip = <i>Handler</i>, der dem Textinhalt eines Elements einer Modelleigenschaft zuweist.
