com.top_logic.tl.ai.index.onnx.OnnxEmbedder.tooltip = Ein <i>Embedder</i>, der das Modell in diesem Prozess auf der CPU ausführt: ONNX Runtime für das Modell, der Hugging-Face-Tokenizer von DJL für den Text. <p> Die Modelldateien sind nicht Teil einer JAR-Datei. Der Betrieb legt die ONNX-Datei des Modells und seine tokenizer.json aus dem offiziellen Modell-Repository in das <i>Modellverzeichnis</i>; siehe tl-ai-index/README.md. </p><h2>Betriebsregeln</h2> <ul> <li><b>Offline.</b> Die Tokenizer-Bibliothek lädt eine GPU-Version ihrer selbst herunter und meldet Telemetrie, sofern ai.djl.offline nicht gesetzt ist; diese Klasse setzt es, bevor der Tokenizer geladen wird. Die native Bibliothek wird dann aus der JAR-Datei genommen.</li> <li><b>Begrenzte CPU.</b> <i>Threads</i> je Inferenz, kein Spinning zwischen den Läufen, und die Inferenz läuft auf dem Index-Worker, der die niedrigste Thread-Priorität hat.</li> <li><b>Begrenzter Speicher.</b> Ein Batch wird so geteilt, dass er höchstens <i>Höchstzahl der Token je Inferenz</i> enthält: Die Speicherarena von ONNX Runtime behält ihren größten Spitzenwert.</li> <li><b>Ein Text je Inferenz</b> als Standard (<i>Texte je Inferenz</i>). Ein dynamisch quantisiertes (int8) Modell berechnet die Skalierung seiner Aktivierungen über den ganzen Batch, sodass der Vektor eines Textes von den Texten daneben abhinge.</li> <li><b>Neustart bei erneutem Deployment.</b> Eine native Bibliothek, die der Klassenlader einer Webanwendung geladen hat, bleibt im Speicher, bis die JVM endet.</li> </ul>
