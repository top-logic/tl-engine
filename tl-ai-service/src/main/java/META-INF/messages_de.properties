com.top_logic.ai.service.agents.AgentConfig.is-thinking-capable.tooltip = Ob das aktuell ausgewï¿½hlte Modell erweitertes Denken unterstï¿½tzt. <p> Diese abgeleitete Eigenschaft ist wahr, wenn das Modell <i>"Denken aktiviert"</i> oder <i>"Denken adaptiv"</i> unterstï¿½tzt. Sie steuert die Sichtbarkeit von thinking-bezogenen Feldern. </p>
com.top_logic.ai.service.agents.AgentConfig.max-retries = Wiederholungsversuche
