com.top_logic.factory.agent.AgentConversationResolver = Agent conversation resolver
com.top_logic.factory.agent.AgentConversationResolver.tooltip = <i>Conversation backend resolver</i> letting the coding agent of a workspace answer the chats whose subject is an <code>"AgentConversation"</code>.
com.top_logic.factory.agent.WorkspaceAgentService = Workspace agent service
com.top_logic.factory.agent.WorkspaceAgentService.Config.harness = Harness
com.top_logic.factory.agent.WorkspaceAgentService.Config.harness.tooltip = The coding agent that runs in the workspaces.
com.top_logic.factory.agent.WorkspaceAgentService.Config.idle-timeout = Idle timeout
com.top_logic.factory.agent.WorkspaceAgentService.Config.idle-timeout.tooltip = How long the process of a conversation is kept after its last answer, e.g. 15min; the next message starts a new process continuing the conversation.
com.top_logic.factory.agent.WorkspaceAgentService.Config.interrupt-timeout = Interrupt timeout
com.top_logic.factory.agent.WorkspaceAgentService.Config.interrupt-timeout.tooltip = How long a run waits for the agent to stop after the user stopped it, before its process is terminated.
com.top_logic.factory.agent.WorkspaceAgentService.Config.stop-timeout = Stop timeout
com.top_logic.factory.agent.WorkspaceAgentService.Config.stop-timeout.tooltip = How long a process that is no longer needed has to end after its input was closed, before it is terminated.
com.top_logic.factory.agent.WorkspaceAgentService.Config.token-lifetime = Token lifetime
com.top_logic.factory.agent.WorkspaceAgentService.Config.token-lifetime.tooltip = The lifetime of the token of an agent process for the workspace proxy, e.g. 4h; at most the longest lifetime of the proxy. <p> A process whose token has less than half of its lifetime left is replaced by a new one before its next run, so that a run has at least that half. </p>
com.top_logic.factory.agent.WorkspaceAgentService.tooltip = Service holding the <i>workspace agents</i> of the <code>"AgentConversation"</code>s: the coding agent that works in a workspace, one process per conversation. <p> <i>Agent conversation resolver</i> lets the agents answer the chats whose subject is a conversation. Cleaning up a workspace stops its agents; a shutdown stops all of them. </p>
com.top_logic.factory.agent.claude.ClaudeCodeHarness = Claude code harness
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.command = Command
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.command.tooltip = The program of Claude Code in the workspace image.
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.extra-args = Extra arguments
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.extra-args.tooltip = Further arguments appended to the command line, e.g. --max-turns,50.
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.model = Model
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.model.tooltip = The model Claude Code works with, e.g. claude-sonnet-4-6 or an alias such as sonnet; empty for the default of Claude Code.
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.thinking-display = Thinking display
com.top_logic.factory.agent.claude.ClaudeCodeHarness.Config.thinking-display.tooltip = How the thinking of the model appears in the output of Claude Code: <code>"summarized"</code> for a summary of it, which the chat shows; omitted for no text; empty for the default of Claude Code, which omits it in print mode.
com.top_logic.factory.agent.claude.ClaudeCodeHarness.tooltip = <i>Agent harness</i> running Claude Code in print mode with stream-json input and output. <p> The process is started as </p> <pre> claude -p --input-format stream-json --output-format stream-json --verbose --include-partial-messages --permission-mode bypassPermissions [--thinking-display &lt;display&gt;] [--model &lt;model&gt;] [--resume &lt;session ID&gt;] [&lt;extra args&gt;] </pre> <p> as the workspace user - Claude Code refuses to bypass its permission prompts as root - with the environment of the process, e.g. its token for the workspace proxy in <code>"ANTHROPIC_AUTH_TOKEN"</code>. The container has the URL of the LLM route of the proxy in <code>"ANTHROPIC_BASE_URL"</code>. The output is translated by <i>claude code protocol</i>. </p>
com.top_logic.factory.llm.LLMRoute = LLM route
com.top_logic.factory.llm.LLMRoute.Config.provider = Provider
com.top_logic.factory.llm.LLMRoute.Config.provider.tooltip = The name of the Anthropic provider of the <i>LLM providers</i> whose API key, base URL, version and timeouts the route uses.
com.top_logic.factory.llm.LLMRoute.tooltip = <i>Proxy route</i> of the workspace proxy to the Anthropic Messages API, without an API key in the workspace. <p> A workspace container gets the URL of the route in <code>"ANTHROPIC_BASE_URL"</code>, a process the token of the proxy in <code>"ANTHROPIC_AUTH_TOKEN"</code>; Claude Code sends it as bearer token. </p> <p> Only POST of <code>"/v1/messages"</code> and <code>"/v1/messages/count_tokens"</code> (below the path of the route, by default <code>"/llm-proxy"</code>) is forwarded, with the query string; everything else is answered with 404. The refusals of the proxy are answered as errors of the Anthropic API, e.g. <code>"authentication_error"</code> for an invalid token. </p> <p> The forwarded request carries the headers of the client except the credentials (<code>"Authorization"</code>, <code>"x-api-key"</code>), cookies, Host, the hop-by-hop headers and <code>"accept-encoding"</code>, so that the answer comes uncompressed and can be streamed. The body is streamed to the API as it arrives. The route adds the credentials of the <i>LLM upstream</i> - the provider's API key in <code>"x-api-key"</code> -, and sets <code>"anthropic-version"</code> to its version if the client sent none; a client's <code>"anthropic-version"</code> and anthropic-beta are kept. Status, headers and body of the answer are passed back, the body flushed piece by piece as it arrives, so that a server-sent event stream reaches the client while it is produced. </p> <p> The API key appears neither in a log nor in an answer of the route. </p>
com.top_logic.factory.project.FactoryFunctions.agentUnavailable = Agent unavailable
com.top_logic.factory.project.FactoryFunctions.agentUnavailable.param.workspace.tooltip = The workspace of a project, empty for a project without one.
com.top_logic.factory.project.FactoryFunctions.agentUnavailable.return = The reason, nothing if the agent can work in the workspace.
com.top_logic.factory.project.FactoryFunctions.agentUnavailable.tooltip = Why the coding agent cannot work in a workspace now: the workspace is not running, runs an outdated image without the agent tools, or the control application gives workspaces no access to a language model.
com.top_logic.factory.project.FactoryFunctions.checkArtifactId = Check an artifact ID
com.top_logic.factory.project.FactoryFunctions.checkArtifactId.param.value.tooltip = The artifact ID.
com.top_logic.factory.project.FactoryFunctions.checkArtifactId.return = The message describing what is wrong with the value, nothing if it is valid.
com.top_logic.factory.project.FactoryFunctions.checkArtifactId.tooltip = Checks a Maven artifact ID for an application. <p> The artifact ID is also the context path the application is served under. </p>
com.top_logic.factory.project.FactoryFunctions.checkGroupId = Check a group ID
com.top_logic.factory.project.FactoryFunctions.checkGroupId.param.value.tooltip = The group ID.
com.top_logic.factory.project.FactoryFunctions.checkGroupId.return = The message describing what is wrong with the value, nothing if it is valid.
com.top_logic.factory.project.FactoryFunctions.checkGroupId.tooltip = Checks a Maven group ID for an application.
com.top_logic.factory.project.FactoryFunctions.cleanup = Remove the workspace of a project
com.top_logic.factory.project.FactoryFunctions.cleanup.param.project.tooltip = A project whose workspace is not busy.
com.top_logic.factory.project.FactoryFunctions.cleanup.tooltip = Removes the workspace of a project with its container and all its data. The project is kept and may create a new workspace afterwards.
com.top_logic.factory.project.FactoryFunctions.createConversation = Create an agent conversation
com.top_logic.factory.project.FactoryFunctions.createConversation.param.task.tooltip = What the agent is to do.
com.top_logic.factory.project.FactoryFunctions.createConversation.param.workspace.tooltip = The workspace whose agent is to work on the task; it must be running on the current image.
com.top_logic.factory.project.FactoryFunctions.createConversation.return = The new conversation, a <code>tl.factory:AgentConversation</code>.
com.top_logic.factory.project.FactoryFunctions.createConversation.tooltip = Creates a conversation with the coding agent of a workspace for a task. The conversation is the subject of the chat that sends the task to the agent as its first message, see <code>chatStart</code>.
com.top_logic.factory.project.FactoryFunctions.createWorkspace = Create the workspace of a project
com.top_logic.factory.project.FactoryFunctions.createWorkspace.param.project.tooltip = A project without workspace.
com.top_logic.factory.project.FactoryFunctions.createWorkspace.return = The workspace, in state "building" until the application answers.
com.top_logic.factory.project.FactoryFunctions.createWorkspace.tooltip = Creates the workspace of a project: a container in which an empty application is generated, built and started.
com.top_logic.factory.project.FactoryFunctions.engineVersion = Default engine version
com.top_logic.factory.project.FactoryFunctions.engineVersion.return = The configured engine version.
com.top_logic.factory.project.FactoryFunctions.engineVersion.tooltip = The TopLogic version a new project builds its application on, unless it chooses another one.
com.top_logic.factory.project.FactoryFunctions.imageOutdated = Workspace image outdated
com.top_logic.factory.project.FactoryFunctions.imageOutdated.param.workspace.tooltip = The workspace of a project.
com.top_logic.factory.project.FactoryFunctions.imageOutdated.return = Whether the workspace is outdated.
com.top_logic.factory.project.FactoryFunctions.imageOutdated.tooltip = Whether the container of a workspace runs another image than the current workspace image, so that it misses changes of the tools in the image until it is updated.
com.top_logic.factory.project.FactoryFunctions.start = Start the workspace of a project
com.top_logic.factory.project.FactoryFunctions.start.param.project.tooltip = A project whose workspace is stopped.
com.top_logic.factory.project.FactoryFunctions.start.tooltip = Starts the workspace of a project and with it its application.
com.top_logic.factory.project.FactoryFunctions.stop = Stop the workspace of a project
com.top_logic.factory.project.FactoryFunctions.stop.param.project.tooltip = A project whose workspace is running.
com.top_logic.factory.project.FactoryFunctions.stop.tooltip = Stops the workspace of a project and with it its application. The sources, the Maven repository and the database of the workspace are kept.
com.top_logic.factory.project.FactoryFunctions.update = Update the workspace of a project
com.top_logic.factory.project.FactoryFunctions.update.param.project.tooltip = A project whose workspace is not busy.
com.top_logic.factory.project.FactoryFunctions.update.tooltip = Creates the container of the workspace of a project anew on the current workspace image. The sources, the Maven repository, the database and the initial password of the workspace are kept; a running workspace is started again.
com.top_logic.factory.project.ProjectWorkspaces = Project workspaces
com.top_logic.factory.project.ProjectWorkspaces.Config.application-check-interval = Application check interval
com.top_logic.factory.project.ProjectWorkspaces.Config.application-check-interval.tooltip = Milliseconds between two checks of the applications of the workspaces whose container runs, 0 for no checks. <p> The application of a running container may stop or start without an operation of the control application, e.g. when the agent of the workspace restarts it. The check stores <i>app stopped</i> for a <i>running</i> workspace whose application stopped or failed, and <i>running</i> for an <i>app stopped</i> one whose application answers again. </p>
com.top_logic.factory.project.ProjectWorkspaces.Config.log-flush-interval = Log flush interval
com.top_logic.factory.project.ProjectWorkspaces.Config.log-flush-interval.tooltip = Milliseconds between two commits of the output of a running operation.
com.top_logic.factory.project.ProjectWorkspaces.Config.max-log-size = Maximum log size
com.top_logic.factory.project.ProjectWorkspaces.Config.max-log-size.tooltip = Number of characters of the output of an operation that are stored; older output is dropped.
com.top_logic.factory.project.ProjectWorkspaces.tooltip = Service running the operations on the workspaces of projects in the background and keeping the workspace objects up to date with them. <p> Creating, starting, stopping and removing a workspace takes from seconds to minutes. An operation is therefore started from a request, which only stores the state the operation is in (e.g. <i>Building</i>), and runs on a worker thread of this service in a system context. The output of the operation is collected in a <i>workspace log</i>, which stores it every flush interval in a transaction of its own; the final state is stored when the operation ends. A view following these commits displays the progress while the operation runs. </p> <p> Only one operation runs on a workspace at a time. After a restart, the service compares the stored states with the containers that exist, see <i>workspace reconciliation</i>. It does that on a worker thread as well, so that the application starts also when the container platform is not reachable. </p>
com.top_logic.factory.project.WorkspaceLogSource = Workspace log source
com.top_logic.factory.project.WorkspaceLogSource.Config.tail-lines = Tail lines
com.top_logic.factory.project.WorkspaceLogSource.Config.tail-lines.tooltip = The number of the last lines of the log that are published.
com.top_logic.factory.project.WorkspaceLogSource.Config.workspace = Workspace
com.top_logic.factory.project.WorkspaceLogSource.Config.workspace.tooltip = The channel of the view holding the tl.factory:Workspace whose log is published.
com.top_logic.factory.project.WorkspaceLogSource.tooltip = <i>Channel source</i> publishing the log of the application of a workspace while it is written: the last lines of the output of the main process of the workspace on the configured channel, as one text. <pre> &lt;source-channel name="appLog" update-interval="1000"&gt; &lt;source class="com.top_logic.factory.project.WorkspaceLogSource" workspace="workspace" tail-lines="500"/&gt; &lt;/source-channel&gt; </pre> <p> Each displayed view follows the log of the workspace its channel holds, and follows another one when the channel changes. A restart of the workspace ends the output of its main process; the next commit changing the workspace - its state - starts following the new output. The delivery ends when the view is no longer displayed. </p>
com.top_logic.factory.project.WorkspaceStatus = Workspace status
com.top_logic.factory.project.WorkspaceStatus.APP_STOPPED = App stopped
com.top_logic.factory.project.WorkspaceStatus.APP_STOPPED.tooltip = The container runs, its application does not: it was stopped, or it failed to start. <p> The agent of the workspace can work in this state, e.g. to repair the application. </p>
com.top_logic.factory.project.WorkspaceStatus.BUILDING = Building
com.top_logic.factory.project.WorkspaceStatus.BUILDING.tooltip = The container is being created and the application is being generated and built.
com.top_logic.factory.project.WorkspaceStatus.CREATED = Created
com.top_logic.factory.project.WorkspaceStatus.CREATED.tooltip = The container exists but has never been started.
com.top_logic.factory.project.WorkspaceStatus.ERROR = Error
com.top_logic.factory.project.WorkspaceStatus.ERROR.tooltip = The last operation failed, or the container got lost; the log tells why.
com.top_logic.factory.project.WorkspaceStatus.REMOVING = Removing
com.top_logic.factory.project.WorkspaceStatus.REMOVING.tooltip = The container and the volumes are being removed.
com.top_logic.factory.project.WorkspaceStatus.RUNNING = Running
com.top_logic.factory.project.WorkspaceStatus.RUNNING.tooltip = The application runs and answers at the preview URL.
com.top_logic.factory.project.WorkspaceStatus.STARTING = Starting
com.top_logic.factory.project.WorkspaceStatus.STARTING.tooltip = The application is starting; the state changes to <i>running</i> as soon as it answers.
com.top_logic.factory.project.WorkspaceStatus.STOPPED = Stopped
com.top_logic.factory.project.WorkspaceStatus.STOPPED.tooltip = The container is stopped, its volumes are kept.
com.top_logic.factory.project.WorkspaceStatus.STOPPING = Stopping
com.top_logic.factory.project.WorkspaceStatus.STOPPING.tooltip = The container is being stopped.
com.top_logic.factory.project.WorkspaceStatus.UNKNOWN = Unknown
com.top_logic.factory.project.WorkspaceStatus.UNKNOWN.tooltip = The container platform did not tell the state, e.g. because it was not reachable.
com.top_logic.factory.project.WorkspaceStatus.UPDATING = Updating
com.top_logic.factory.project.WorkspaceStatus.UPDATING.tooltip = The container is being created anew on the current workspace image, keeping the volumes.
com.top_logic.factory.project.WorkspaceStatus.tooltip = The stored state of the workspace of a project, the Java counterpart of the classifiers of the enumeration <code>"WorkspaceStatus"</code>. <p> Besides the states of the container a <i>workspace provider</i> reports (see <i>workspace state</i>), a workspace is in a busy state while an operation runs on it, and in state <i>error</i> after an operation failed. </p>
com.top_logic.factory.proxy.ProxyAdmission$Status = Status
com.top_logic.factory.proxy.ProxyAdmission$Status.tooltip = Whether a request is passed to its route, and why not.
com.top_logic.factory.proxy.ProxyAdmission.Status.ADMITTED = Admitted
com.top_logic.factory.proxy.ProxyAdmission.Status.ADMITTED.tooltip = The token is valid; the request is passed to its route.
com.top_logic.factory.proxy.ProxyAdmission.Status.FOREIGN_SOURCE = Foreign source
com.top_logic.factory.proxy.ProxyAdmission.Status.FOREIGN_SOURCE.tooltip = The token is valid but was first used from another address.
com.top_logic.factory.proxy.ProxyAdmission.Status.INVALID_TOKEN = Invalid token
com.top_logic.factory.proxy.ProxyAdmission.Status.INVALID_TOKEN.tooltip = The token is missing, unknown, revoked or expired, or its workspace no longer exists.
com.top_logic.factory.proxy.ProxyAdmission.Status.RATE_LIMITED = Rate limited
com.top_logic.factory.proxy.ProxyAdmission.Status.RATE_LIMITED.tooltip = The token is valid but has made too many requests in the last minute.
com.top_logic.factory.proxy.ProxyError = Proxy error
com.top_logic.factory.proxy.ProxyError.FOREIGN_SOURCE = Foreign source
com.top_logic.factory.proxy.ProxyError.FOREIGN_SOURCE.tooltip = The token of the request is bound to another address.
com.top_logic.factory.proxy.ProxyError.INVALID_TOKEN = Invalid token
com.top_logic.factory.proxy.ProxyError.INVALID_TOKEN.tooltip = The request carries no valid token.
com.top_logic.factory.proxy.ProxyError.NOT_FOUND = Not found
com.top_logic.factory.proxy.ProxyError.NOT_FOUND.tooltip = The request reaches no route, or the proxy is switched off.
com.top_logic.factory.proxy.ProxyError.RATE_LIMITED = Rate limited
com.top_logic.factory.proxy.ProxyError.RATE_LIMITED.tooltip = The token of the request is over its rate limit.
com.top_logic.factory.proxy.ProxyError.SOURCE_NOT_ALLOWED = Source not allowed
com.top_logic.factory.proxy.ProxyError.SOURCE_NOT_ALLOWED.tooltip = The request comes from an address the proxy does not accept.
com.top_logic.factory.proxy.ProxyError.tooltip = Why the <i>workspace proxy handler</i> refuses a request before its route handles it. <p> The route answers it in the format of its protocol. The message is a fixed text, never something of the request. </p>
com.top_logic.factory.proxy.ProxyRoute.Config.path = Path
com.top_logic.factory.proxy.ProxyRoute.Config.path.tooltip = The path of the route below the root of the proxy: starts with a slash, has none at its end, e.g. /llm-proxy.
com.top_logic.factory.proxy.WorkspaceProxyService = Workspace proxy service
com.top_logic.factory.proxy.WorkspaceProxyService.Config.allowed-sources = Allowed sources
com.top_logic.factory.proxy.WorkspaceProxyService.Config.allowed-sources.tooltip = The client addresses requests are accepted from: ranges in CIDR notation (IPv4 or IPv6), single addresses, or <code>"workspace-network"</code> for the network of the workspace containers. <p> Empty accepts every address. The address is the one of the connection, never a header of the request: behind a reverse proxy or a gateway it is the address of that proxy. </p>
com.top_logic.factory.proxy.WorkspaceProxyService.Config.listen-address = Listen address
com.top_logic.factory.proxy.WorkspaceProxyService.Config.listen-address.tooltip = The address the proxy listens on with a port of its own, see <i>Listen port</i>. <p> The default, the loopback address, serves a reverse proxy or a tunnel on the same host only. With the control application on the host of the Docker daemon, it is the address host-gateway stands for in the workspaces - the gateway of Docker's default bridge, e.g. 172.17.0.1 -, so that workspaces reach it but no other host does. In a container of its own, the control application listens on 0.0.0.0 and the port is not published, or published on an internal address only. </p>
com.top_logic.factory.proxy.WorkspaceProxyService.Config.listen-port = Listen port
com.top_logic.factory.proxy.WorkspaceProxyService.Config.listen-port.tooltip = The port the proxy listens on, apart from the port of the control application; 0 for no port of its own. <p> The routes are reached there at their paths. The port is opened only if the proxy is switched on by its URL. </p>
com.top_logic.factory.proxy.WorkspaceProxyService.Config.max-token-lifetime = Maximum token lifetime
com.top_logic.factory.proxy.WorkspaceProxyService.Config.max-token-lifetime.tooltip = The longest lifetime of a token in milliseconds, e.g. 4h; a longer one asked for is cut to it.
com.top_logic.factory.proxy.WorkspaceProxyService.Config.proxy-url = Proxy URL
com.top_logic.factory.proxy.WorkspaceProxyService.Config.proxy-url.tooltip = The URL of the root of the proxy as the workspace containers reach it, without the path of a route: the port of its own, e.g. http://host.docker.internal:8091, or the web application with the <i>workspace proxy servlet</i>, e.g. http://host.docker.internal:8080/tl-factory-app. <p> A route is reached at this URL followed by its path. Empty switches the proxy off. </p>
com.top_logic.factory.proxy.WorkspaceProxyService.Config.rate-limit = Rate limit
com.top_logic.factory.proxy.WorkspaceProxyService.Config.rate-limit.tooltip = The requests per minute a token may make, with bursts up to this number; 0 for no limit. <p> A request beyond is answered with 429 and the seconds to wait in Retry-After, which Claude Code waits for before it repeats the request. The default leaves an agent working at full speed - a request per step and a few side requests - room, and limits a token that got out of the workspace. </p>
com.top_logic.factory.proxy.WorkspaceProxyService.Config.routes = Routes
com.top_logic.factory.proxy.WorkspaceProxyService.Config.routes.tooltip = The services the proxy gives the workspaces access to, each below a path of its own.
com.top_logic.factory.proxy.WorkspaceProxyService.Config.servlet-enabled = Servlet enabled
com.top_logic.factory.proxy.WorkspaceProxyService.Config.servlet-enabled.tooltip = Whether the proxy also answers in the web application, through the port of the control application, at the paths the <i>workspace proxy servlet</i> is mapped to. <p> Off by default: the port of the control application is the one its users reach, and the proxy needs not be reachable there. Switched on, a reverse proxy in front of the control application must keep clients from outside from reaching these paths. </p>
com.top_logic.factory.proxy.WorkspaceProxyService.tooltip = Access of the workspaces to services of the control application's environment without a credential in the workspace. <p> A workspace container gets no credential and no token in its environment, only what its routes need to find the proxy, e.g. the URL of the LLM route - the URL of the proxy followed by the path of the route. A process that may use the proxy - an agent run - gets a token of its own, issued for its workspace and passed only to that process, in the environment of its command. The proxy accepts a request from an accepted address whose token admits it and passes it to the route of its path, which adds the credentials of its upstream and forwards it, see <i>workspace proxy handler</i>. </p> <p> A token is <code>"tlwst_"</code> followed by a random secret of about 256 bits. It is valid for all routes until it is revoked - when its run ends -, until its lifetime ends (at most <i>Maximum token lifetime</i>), or until its workspace is removed. It is bound to the address of its first request and limited to <i>Rate limit</i> requests per minute, see <i>token grants</i>. Tokens are kept in memory only, as their hashes; a restart of the control application invalidates all of them, together with the runs it started. </p> <p> The proxy is switched on by its URL: without one, workspaces get no URL, no token is issued, and the proxy answers every request with 404. It listens on a port of its own (<i>workspace proxy listener</i>, <i>Listen address</i>, <i>Listen port</i>); the <i>workspace proxy servlet</i> in the web application answers only if <i>Servlet enabled</i> is set. </p>
com.top_logic.factory.workspace.WorkspaceService = Workspace service
com.top_logic.factory.workspace.WorkspaceService.Config.applications = Applications
com.top_logic.factory.workspace.WorkspaceService.Config.applications.tooltip = How workspaces holding a TopLogic application are set up.
com.top_logic.factory.workspace.WorkspaceService.Config.provider = Provider
com.top_logic.factory.workspace.WorkspaceService.Config.provider.tooltip = The container platform the workspaces are created in.
com.top_logic.factory.workspace.WorkspaceService.tooltip = Service holding the <i>workspace provider</i> that manages the workspaces of the application. <p> Starting the service does not contact the container platform, so the application starts also when the platform is not reachable; the first workspace operation reports that. </p>
com.top_logic.factory.workspace.WorkspaceState = Workspace state
com.top_logic.factory.workspace.WorkspaceState.CREATED = Created
com.top_logic.factory.workspace.WorkspaceState.CREATED.tooltip = The container exists but has never been started.
com.top_logic.factory.workspace.WorkspaceState.MISSING = Missing
com.top_logic.factory.workspace.WorkspaceState.MISSING.tooltip = The workspace has no container. Volumes of the workspace may still exist.
com.top_logic.factory.workspace.WorkspaceState.RUNNING = Running
com.top_logic.factory.workspace.WorkspaceState.RUNNING.tooltip = The container is running.
com.top_logic.factory.workspace.WorkspaceState.STOPPED = Stopped
com.top_logic.factory.workspace.WorkspaceState.STOPPED.tooltip = The container has been started before and is not running now. Its volumes are kept.
com.top_logic.factory.workspace.WorkspaceState.UNKNOWN = Unknown
com.top_logic.factory.workspace.WorkspaceState.UNKNOWN.tooltip = The container is in a state the provider does not manage, e.g. paused, being removed or dead.
com.top_logic.factory.workspace.WorkspaceState.tooltip = The state of the container of a workspace, as reported by a <i>workspace provider</i>.
com.top_logic.factory.workspace.app.ApplicationWorkspaces$ApplicationState = Application state
com.top_logic.factory.workspace.app.ApplicationWorkspaces$ApplicationState.tooltip = The state of the application in a running workspace, as the <code>"tl-workspace-app"</code> reports it.
