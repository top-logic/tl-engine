model.tl.model.search = TL-Script
model.tl.model.search.Code = Code
model.tl.model.search.Code.tooltip = Ein Text, der in einem Code-Editor mit Syntaxhervorhebung bearbeitet wird. Die Sprache wird mit der Annotation "Sprache des Code-Editors" gewählt; ohne sie wird der Wert als reiner Text behandelt.
model.tl.model.search.Expr = Allg. Suchausdruck
model.tl.model.search.Expr.tooltip = Ein Attribut, dessen Wert ein TL-Script-Ausdruck ist. Der Ausdruck wird als Quelltext angezeigt und bearbeitet. Er wird vom Framework nie ausgewertet; seine Bedeutung legt allein der Code fest, der das Attribut liest.
model.tl.model.search.Macro = Macro
model.tl.model.search.Macro.tooltip = Ein berechnetes Attribut, dessen Wert das HTML ist, das ein TL-Script-Ausdruck erzeugt. Der Ausdruck steht nicht im Wert, sondern wird mit der Speicherimplementierung "Makro-Attribut" konfiguriert und auf dem Objekt ausgewertet, dem das Attribut gehört.
model.tl.model.search.Report = Report
model.tl.model.search.Report.tooltip = Wie der Typ "Vorlage", der Inhalt wird jedoch bei der Anzeige des Attributs automatisch ausgewertet. Das Objekt, dem das Attribut gehört, wird als Variable "$model" übergeben.
model.tl.model.search.Template = Vorlage
model.tl.model.search.Template.tooltip = Ein HTML-Inhalt mit eingebetteten TL-Script-Ausdrücken. Die Ausdrücke können über die Variable "$model" auf das angezeigte Objekt zugreifen. Eine Vorlage wird nicht automatisch ausgewertet, sondern nur dort expandiert, wo der Code sie anfordert, der das Attribut liest.
model.tl.model.search.tooltip = Modul mit den Datentypen, deren Werte TL-Script-Ausdrücke oder Vorlagen mit eingebetteten TL-Script-Ausdrücken sind.
