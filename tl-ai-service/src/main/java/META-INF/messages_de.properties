com.top_logic.ai.service.tools.task.TaskTool.tooltip = Werkzeug zur Verwaltung von Agentenaufgaben innerhalb einer Verarbeitungssitzung. <p> Bietet CRUD-Operationen fï¿½r einen speicherinternen <i>Aufgabenspeicher</i>, der ï¿½ber die <i>Aufgabenspeicherbindung</i> an den aktuellen Thread gebunden ist. Aufgaben werden verwendet, um den Fortschritt zu verfolgen und mehrstufige Agentenarbeit zu organisieren. </p>
