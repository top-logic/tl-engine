com.top_logic.tl.ai.browser.BrowserToolsService = Browser tools service
com.top_logic.tl.ai.browser.BrowserToolsService$SandboxMode = Sandbox mode
com.top_logic.tl.ai.browser.BrowserToolsService$SandboxMode.tooltip = Whether Chromium's OS-level sandbox is used for the browser sessions.
com.top_logic.tl.ai.browser.BrowserToolsService.Config.acquire-timeout-seconds = Acquire timeout seconds
com.top_logic.tl.ai.browser.BrowserToolsService.Config.acquire-timeout-seconds.tooltip = How long a tool call waits for a free session slot before failing fast with a "browser busy, retry" error, in seconds. <p> Kept short on purpose: a bounded wait cannot exhaust the servlet thread pool the way the former unbounded lock could. </p>
com.top_logic.tl.ai.browser.BrowserToolsService.Config.action-timeout-seconds = Action timeout seconds
com.top_logic.tl.ai.browser.BrowserToolsService.Config.action-timeout-seconds.tooltip = Timeout for acting on a single <b>element</b> - browserClick / browserType, and reading the accessibility snapshot - in seconds. <p> Deliberately much shorter than the page-load timeout, because the two wait for entirely different things. A click waits for the element to become <em>actionable</em> (attached, visible, stable, unobstructed, enabled); if the page has re-rendered that element away - the classic search box whose suggestion list replaces the control after the query is typed - no amount of further waiting can make the wait succeed, and a page-load-sized budget just turns a dead click into a half-minute stall followed by an opaque timeout. Bounding it to a few seconds lets the tool answer promptly with an actionable "re-snapshot and use a fresh ref" instruction (see <i>browser reference not actionable exception</i>) while still absorbing the ordinary case of an element that needs a moment to settle. </p> <p> Raise it for a deliberately slow or heavily animated application; it is clamped to at most the page-load timeout, since waiting longer for one element than for a whole page load is never useful. </p>
com.top_logic.tl.ai.browser.BrowserToolsService.Config.allow-any-domains = Allow any domains
com.top_logic.tl.ai.browser.BrowserToolsService.Config.allow-any-domains.tooltip = Whether the public-domain allowlist is disabled (allow-any-domains mode). <p> When false (the safe default), a navigation is permitted only if the top-level origin is on the allowlist. When true, the allowlist is ignored and any public domain is reachable - <em>except</em> that SSRF protection and the blocklist still apply unconditionally. Allow-any relaxes only the public-domain allowlist, never SSRF or the blocklist. </p>
com.top_logic.tl.ai.browser.BrowserToolsService.Config.allowed-domains = Allowed domains
com.top_logic.tl.ai.browser.BrowserToolsService.Config.allowed-domains.tooltip = Administrator-owned allowlist of domains the browser may navigate to. <p> A navigation is permitted only if the target host equals one of these entries or is a sub-domain of one. If empty, the browser refuses every navigation (fail-closed). This is policy configuration - it is not the model-supplied allowedDomains argument of <i>web search tool</i>. </p>
com.top_logic.tl.ai.browser.BrowserToolsService.Config.apply-allowlist-to-all-requests = Apply allowlist to all requests
com.top_logic.tl.ai.browser.BrowserToolsService.Config.apply-allowlist-to-all-requests.tooltip = Whether the allowlist governs <b>every</b> connection the browser makes, rather than only the top-level document origin. <p> The allowlist has always been a <em>top-level-origin</em> control: an allowlisted page may pull in sub-resources (fonts, scripts, images from a CDN) from anywhere that is neither SSRF-blocked nor blocklisted, exactly as an ordinary browser would. false (the default) preserves that: the filtering proxy enforces SSRF and the blocklist for every connection, and the allowlist keeps being enforced for the top-level origin only. </p> <p> Set to true for a locked-down installation whose intent is "this browser may talk to these domains and nothing else": the proxy then refuses <em>any</em> connection to a host that is not on the allowlist, sub-resources included. That is strictly safer - it also stops an allowlisted page from beaconing to a third party - but a page whose assets live on other domains will render without them, so it is an explicit operator decision rather than the default. It has no effect when allow-any is enabled (there is no allowlist to apply), and it can never relax anything: SSRF and the blocklist apply to every connection in both settings. </p>
com.top_logic.tl.ai.browser.BrowserToolsService.Config.blocked-domains = Blocked domains
com.top_logic.tl.ai.browser.BrowserToolsService.Config.blocked-domains.tooltip = Administrator-owned blocklist of domains the browser must never navigate to. <p> A top-level origin is refused if its host equals one of these entries or is a sub-domain of one (same matching as <i>Allowed domains</i>). The blocklist takes precedence over the allowlist and applies in every mode, including allow-any. It carves exceptions out of a broad allowlist (or out of allow-any). SSRF protection is enforced independently and cannot be relaxed. </p>
com.top_logic.tl.ai.browser.BrowserToolsService.Config.browser-sandbox = Browser sandbox
com.top_logic.tl.ai.browser.BrowserToolsService.Config.browser-sandbox.tooltip = Whether the browser sessions run inside Chromium's own OS-level sandbox. <p> The sandbox is the boundary between a renderer executing <em>attacker-controlled page JavaScript</em> and the host the application runs on: without it, a renderer exploit is simply code running with the application's own privileges, inside the application's process tree. It is therefore on wherever it can be, and it is not a performance knob. </p> <p> <i>Auto</i> (the default) keeps it on and gives it up only inside a container, recognised by the marker files and cgroup layout a container runtime leaves behind. That is the one environment where it cannot simply stay on: the default Docker/Podman seccomp profile denies the clone/unshare calls Chromium's namespace sandbox needs, so a sandboxed launch fails outright there. The right answer for a container is a runtime profile that permits those calls (tracked as the deploy-image ticket) - until then, the sandbox is dropped in containers and only in containers. </p> <p> <i>Enabled</i> and <i>disabled</i> are the escape hatches: ENABLED keeps the sandbox even in a container (correct once the image carries a seccomp profile that allows it; the browser will fail to start if it does not), and DISABLED gives it up unconditionally, which weakens the isolation of every browsed page and should only ever be a temporary diagnostic. </p>
com.top_logic.tl.ai.browser.BrowserToolsService.Config.cookie-pools-enabled = Cookie pools enabled
com.top_logic.tl.ai.browser.BrowserToolsService.Config.cookie-pools-enabled.tooltip = Master switch for cookie pools: whether the browserSaveCookies / browserUseCookies verbs are operative. <p> true (the default) enables persistent, named, encrypted login pools: a session can save its current login state into a named pool and a later session can start seeded from one (see CookiePoolService). When false, both verbs refuse with a clear message and no cookie state is captured or seeded - use this to switch the whole feature off for an installation regardless of what the model tries. Turning it off does not affect ordinary navigation or the per-session isolated context. </p>
com.top_logic.tl.ai.browser.BrowserToolsService.Config.evade-bot-detection = Evade bot detection
com.top_logic.tl.ai.browser.BrowserToolsService.Config.evade-bot-detection.tooltip = Whether the browser should disguise its automation fingerprint so bot-protection walls are less likely to serve it an access-denied / challenge page (off by default). <p> When false (the default) the browser behaves as an out-of-the-box headless Chromium: no user-agent override, no extra launch argument, no fingerprint init script. When true, each session's context is made to look like an ordinary desktop Chrome: the --disable-blink-features=AutomationControlled launch switch is added, a realistic desktop Chrome user-agent (and matching Accept-Language) is set, and a small init script masks the usual automation tells (navigator.webdriver, empty navigator.plugins, navigator.languages, missing window.chrome). </p> <p> The <b>full</b> Chromium build (Playwright channel "chromium", new headless - still windowless) that evasion also depends on - the light chrome-headless-shell is itself a fingerprint some bot walls suppress content for, even when the UA and navigator.webdriver are masked - is launched for every session regardless of this setting, because it is what allows the UDP egress of WebRTC to be turned off. See BrowserSession.buildLaunchOptions, including the deployment prerequisite that carries. </p> <p> <b>Caveat - authorised use only.</b> Enabling this deliberately circumvents a site's automated-access protection and may violate that site's Terms of Service. It is an operator opt-in for authorised targets (for example a logged-in site the operator owns or has permission to automate), off by default, and must not be enabled to access sites where doing so is not permitted. It does not touch SSRF, the blocklist or the allowlist, which stay enforced unchanged. </p>
com.top_logic.tl.ai.browser.BrowserToolsService.Config.headless = Headless
com.top_logic.tl.ai.browser.BrowserToolsService.Config.headless.tooltip = Whether browser sessions are launched headless (no visible window). <p> true (the default) is the production-safe path: every session runs a windowless Chromium, so nothing appears on the app host and no local display is required. Set to false to launch a <b>headed</b> (visible) Chromium window on the app host's desktop - a dev/local convenience that requires a local display and must not be used in production or on remote/headless hosts. When headed is requested on a host with no display, the service fails fast at startup rather than hanging on a launch that can never succeed. </p>
com.top_logic.tl.ai.browser.BrowserToolsService.Config.max-concurrent-sessions = Maximum concurrent sessions
com.top_logic.tl.ai.browser.BrowserToolsService.Config.max-concurrent-sessions.tooltip = Maximum number of live browser sessions (isolated contexts) allowed at once. <p> This bounds memory: each live session is its own Chromium process (roughly 200-400 MB incl. its Playwright driver). Requests beyond the cap reclaim an idle session by LRU or, if none is idle, fail fast with a retryable "browser busy" error. The default of 4 keeps peak browser memory around 1 GB; raise it in line with available RAM. </p>
com.top_logic.tl.ai.browser.BrowserToolsService.Config.max-page-bytes = Maximum page bytes
com.top_logic.tl.ai.browser.BrowserToolsService.Config.max-page-bytes.tooltip = Maximum number of HTML bytes read from a page before extraction stops.
com.top_logic.tl.ai.browser.BrowserToolsService.Config.max-page-chars = Maximum page chars
com.top_logic.tl.ai.browser.BrowserToolsService.Config.max-page-chars.tooltip = Maximum number of characters of extracted text a browser tool returns.
com.top_logic.tl.ai.browser.BrowserToolsService.Config.navigation-settle-millis = Navigation settle millis
com.top_logic.tl.ai.browser.BrowserToolsService.Config.navigation-settle-millis.tooltip = Hard cap, in milliseconds, of the post-load <b>settle</b>: after a page-loading operation (browserNavigate, browserBack, or a browserClick that navigated) has seen the page load, and before the page is captured, the browser waits for the page to calm down - and each of the three things it waits for is bounded by this one cap, separately. <p> <b>Commit.</b> Only for a browserClick, and only where the page navigated itself from a script rather than through the link that was clicked: the browser waits for the new document to actually replace the old one before it settles anything, because until then the page's address and its load state are still the old document's. A navigation that is begun and never lands - a 204, a download, a handler that changes its mind - gives up after this cap. </p> <p> <b>Network-quiet.</b> A brief chance for client-side rendering that only starts after the load event: the wait ends as soon as the page has issued no request for Playwright's idle window, or when this cap elapses. It is deliberately <em>not</em> bounded by the page-load timeout: a page that polls, streams or sends beacons - most SSO login pages, most single-page applications - never goes network-idle at all, so a page-load-sized budget here bought nothing and cost that whole budget on every operation. </p> <p> <b>DOM-quiet.</b> The browser then waits until the DOM goes quiet (no mutation for a short internal debounce window, ~500 ms) and any in-flight, finite CSS animation has finished, or until this cap elapses. This closes the common gap where a page injects a cookie-consent banner, lazy widget or other content a beat <em>after</em> navigation returns: without the settle the snapshot is taken too early and misses it, forcing a manual re-snapshot. A still page goes quiet almost immediately and is delayed by at most the debounce window, so fast pages are not meaningfully slowed; a page that never stops mutating (constant animation/polling) is bounded by this cap. </p> <p> The three stages do not add up on any ordinary path: a click that does not navigate runs the DOM-quiet stage alone, and an ordinary link or form-submit click has already committed by the time the commit stage is reached. The cap is always applied well inside the per-operation deadline, so it can never cause a hang. Set to 0 to disable the settle entirely and capture as soon as the page has loaded; the page that is then captured is still internally consistent - address, content and element references are read in one go - it is simply captured earlier. The settle does <em>not</em> apply to browserSnapshot (explicit re-capture), to browserType (same-page edit), or to a browserClick that started no navigation - that one gets the DOM-quiet wait alone, because there is no page load to wait for. </p>
com.top_logic.tl.ai.browser.BrowserToolsService.Config.navigation-timeout-seconds = Navigation timeout seconds
com.top_logic.tl.ai.browser.BrowserToolsService.Config.navigation-timeout-seconds.tooltip = Timeout for a <b>page load</b> (browserNavigate, browserBack, and a browserClick that started a navigation), in seconds. <p> This bounds waiting for the document: how long the browser may spend reaching domcontentloaded and then the load event on a slow site. It does <em>not</em> bound the settle that follows a load - that is capped much more tightly by <i>Navigation settle millis</i>, because a page that never falls quiet must not cost a page load per operation. Acting on an <em>element</em> is bounded separately and much more tightly again by <i>Action timeout seconds</i>. </p>
com.top_logic.tl.ai.browser.BrowserToolsService.Config.session-idle-timeout-seconds = Session idle timeout seconds
com.top_logic.tl.ai.browser.BrowserToolsService.Config.session-idle-timeout-seconds.tooltip = How long a session may stay idle (no tool call) before it is closed and its resources released, in seconds.
com.top_logic.tl.ai.browser.BrowserToolsService.SandboxMode.AUTO = Auto
com.top_logic.tl.ai.browser.BrowserToolsService.SandboxMode.AUTO.tooltip = The default: the sandbox is used everywhere except inside a container, where the default runtime profile prevents Chromium from setting one up.
com.top_logic.tl.ai.browser.BrowserToolsService.SandboxMode.DISABLED = Disabled
com.top_logic.tl.ai.browser.BrowserToolsService.SandboxMode.DISABLED.tooltip = The sandbox is never used, whatever the environment looks like. This weakens the isolation of every browsed page.
com.top_logic.tl.ai.browser.BrowserToolsService.SandboxMode.ENABLED = Enabled
com.top_logic.tl.ai.browser.BrowserToolsService.SandboxMode.ENABLED.tooltip = The sandbox is always used, containers included. Chromium refuses to start where it cannot set one up.
com.top_logic.tl.ai.browser.BrowserToolsService.tooltip = Service owning the pool of isolated, per-session headless Chromium browsers used by <i>browser tool</i>. <p> It holds the configuration (per-navigation timeout, page byte/character caps, the administrator-owned domain allowlist/blocklist/allow-any policy, and the concurrency bounds) and owns the <i>browser session pool</i>. Each agent session gets its <b>own</b> <i>browser session</i> - a dedicated <code>Playwright/Browser/BrowserContext</code> with separate cookies/storage - reused across the many tool calls of a run. Two concurrent sessions can never see each other's cookies, pages or results. </p> <p> <b>Concurrency model (replaces the former single global lock).</b> Sessions run fully concurrently. A <i>browser session pool</i> caps the number of live sessions at <i>Maximum concurrent sessions</i> (a memory bound, not a throughput throttle). Starting a new session waits at most <i>Acquire timeout seconds</i> for a free slot, reclaiming the least-recently-used idle session if needed; if none frees up it fails fast with <i>browser busy exception</i> rather than blocking the caller thread indefinitely. Idle sessions are evicted after <i>Session idle timeout seconds</i>. Every browser operation runs under a hard outer deadline, so one hung page can never pin a slot. </p> <p> Security is layered and applied in a fixed order of precedence for every navigation and every in-browser request (main document, redirects and sub-resources): </p> <ol> <li><b>SSRF always wins.</b> Any request to a private, loopback, link-local or otherwise internal address is refused through <i>URL safety</i>, unconditionally. No configuration can relax this.</li> <li><b>The blocklist always applies.</b> A top-level origin on the administrator-owned blocklist is refused, in every mode.</li> <li><b>Then the allowlist - unless allow-any is enabled.</b> By default the top-level origin must also be on the allowlist. When allow-any is enabled, the public-domain allowlist is skipped (any public domain that is neither SSRF-blocked nor blocklisted is reachable); allow-any relaxes <em>only</em> the allowlist, never SSRF or the blocklist.</li> </ol> <p> The allowlist, blocklist and allow-any flag are policy configuration owned by the administrator - not model-supplied arguments. The default (allowlist-enforced, allow-any off) is safe-by-default: an empty allowlist with allow-any off refuses every navigation. </p> <p> <b>Above all of this sits the browsing governance of <i>browsing policy</i></b>, configured on WebToolsService and resolved per security role: which origins <em>this user's</em> agent may reach, and whether a page there may hand it a file. It composes with the lists above - both have to permit an origin - and an application that configures none is bound by nothing extra. </p> <p> <b>Where the policy is enforced.</b> The authoritative layer is a <i>filtering proxy</i> on the loopback interface that <em>every</em> browser session is pinned to: every connection Chromium makes - top-level navigation, redirect hop, sub-resource, IP-literal target - is checked there before a packet leaves the machine, and the destination is DNS-pinned so a rebinding host cannot slip through. The allowlist, blocklist and allow-any flag are <em>service</em> configuration, identical for every session, so nothing about that half of the decision varies per session; the browsing policy does vary, per role, which is why there is one proxy per <em>policy in use</em> rather than one for the whole service. Inside each browser the same policy is applied again by a per-context request route, plus a redirect guard and a final-URL re-validation, which is what turns a refusal into the tool's clean policy message. </p>
com.top_logic.tl.ai.browser.cookiepool.CookiePoolService = Cookie pool service
com.top_logic.tl.ai.browser.cookiepool.CookiePoolService.tooltip = Service that persists and selects <i>cookie pool</i> business objects: named, per-user (or explicitly shared) browser login pools whose storageState JSON is stored <b>encrypted at rest</b>. <p> A cookie pool captures a browser session's authenticated login state (storageState: cookies + origin storage) so a later session - including a background/unattended agent - can start already logged in. The state is as sensitive as a password, so it is always encrypted with the platform installation key before it touches the state Binary, and decrypted only on read, via the platform <i>encryption service</i> (its <i>symmetric encryption</i>). This service never stores or returns the state in plaintext; if no encryption key is installed it refuses the operation rather than falling back to plaintext. </p> <p> <b>Scoping.</b> A pool created by a user defaults to owner = that user, shared = false, and is selectable only by its owner. A pool with shared = true - an explicit choice at save time, or an administrator's edit, never a fallback - is selectable by any session, including an unattended one: the intended shared-login use case. Selection therefore returns the caller's own pools plus shared pools, and that filter is enforced here, on the selection path, which never asks model security: selecting a pool drives a browser with a stored login, it hands the stored bytes to nobody. </p> <p> <b>Reading those bytes is the other question</b>, and the model layer answers it. The shipped default since #227 is the owner plus administrators - the &lt;security-config&gt; of tl-ai-browser.binarySecurity.config.xml, which viewDocument asks about through ModelSecurity.canRead. Sharing a login therefore does not make the stored session state readable: a shared pool saved by an unattended run has no owner and is readable by administrators and the system only. </p> <p> <b>Every private pool has an owner.</b> Saving a private pool refuses a null owner instead of storing an owner-less pool. Such a pool would be shared = false with nobody to match, so no caller could ever select it again, while the save reported success; and every owner-less caller would share one bucket per pool name, so one unattended run would silently overwrite another's stored login. Quietly defaulting an owner-less save to shared = true is rejected for the reason that is still why it is not the default: it would turn a credential store into something every session can read, behind the caller's back. </p> <p> <b>Saving a shared pool is the sanctioned opt-in.</b> A save that passes shared = true asks for that scope and gets it: the pool is marked shared, is selectable by every user and every agent session of the installation, and may be saved <em>without</em> an owner - which is what lets an unattended run create the login it needs. The current user, when one is resolvable, is still recorded as the owner of a newly created shared pool, as an audit trail; the pool is just additionally marked shared. The safeguard is that the wide scope must be asked for explicitly and is named in the confirmation, not that it is unreachable. Two rules keep that opt-in from widening anything implicitly: an existing pool is updated in place only if it is <em>already</em> shared - a private pool is never flipped - and a shared save is refused when the caller already owns a private pool of that name, because selection would keep preferring that private pool and hide the shared one from the very caller who created it. </p> <p> Mirrors ScreenshotService in shape: it does <b>not</b> open its own Transaction. The pool-upsert call happens from the browserSaveCookies verb, a DATA_WRITE tool whose transaction is opened and committed by the agent loop's TransactionScope, so the pool is committed with the turn. Programmatic callers (and tests) supply their own transaction. </p>
