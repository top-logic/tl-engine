class.com.top_logic.credential.oauth.I18NConstants.ERROR_NO_DEVICE_AUTHORIZATION_ENDPOINT = Weder der Aussteller des Autorisierungsservers noch die URL seines Endpunkts für die Geräteautorisierung ist konfiguriert.
class.com.top_logic.credential.oauth.I18NConstants.ERROR_NO_ISSUER = Es ist kein Aussteller des Autorisierungsservers konfiguriert, sein Discovery-Dokument ist daher nicht verfügbar.
class.com.top_logic.credential.oauth.I18NConstants.ERROR_NO_TOKEN_ENDPOINT = Weder der Aussteller noch die Token-URL des Autorisierungsservers ist konfiguriert.
class.com.top_logic.credential.oauth.I18NConstants.ERROR_REFRESH_TOKEN_NOT_WRITTEN__PATH = Die Refresh-Token-Datei „{0}“ kann nicht geschrieben werden.
