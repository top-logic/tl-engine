com.top_logic.credential.oauth.ClientSecretAuthentication.Config.secret.tooltip = Das Client-Secret.
com.top_logic.credential.oauth.ClientSecretAuthentication.Method.BASIC = HTTP-Basic-Authentifizierung
com.top_logic.credential.oauth.ClientSecretAuthentication.Method.BASIC.tooltip = HTTP-Basic-Authentifizierung mit der formularkodierten Client-ID und dem formularkodierten Secret als Benutzername und Passwort (<code>client_secret_basic</code>).
