tl.security.selfservice.mail.approval.body = <p>Dear Recipient,</p>\n<p>Your registration for the application {0} has been approved. You can now log in with your e-mail address and your password:<br/>\n<a href="{1}">{1}</a></p>\n<p>Kind regards,<br/>\nYour {0} Team</p>
tl.security.selfservice.mail.approval.subject = Your registration for {0} has been approved
tl.security.selfservice.mail.registration.body = <p>Dear Recipient,</p>\n<p>To register an account for the application {0}, please enter the following verification code in the application:<br/>\n<b>Verification code:</b> {1}</p>\n<p>This verification code is only valid for a limited time.</p>\n<p>If you did not request a registration, you can safely ignore this email. No account is created then.</p>\n<p>Kind regards,<br/>\nYour {0} Team</p>
tl.security.selfservice.mail.registration.subject = Your verification code for registering with {0}
tl.security.selfservice.mail.registrationExists.body = <p>Dear Recipient,</p>\n<p>Someone tried to register an account for the application {0} with this e-mail address. You already have an account with this address.</p>\n<p>If you have forgotten your password, please use the function "Forgot password" at the login of the application.</p>\n<p>If you did not try to register, you can safely ignore this email. Your account remains unchanged.</p>\n<p>Kind regards,<br/>\nYour {0} Team</p>
tl.security.selfservice.mail.registrationExists.subject = Registration with {0}
