class.com.top_logic.ai.a2a.discovery.I18NConstants.LLMS_INTRO = Diese Anwendung stellt Agenten über das Agent2Agent-Protokoll (A2A) in Version 1.0 bereit. Ein Agent beantwortet JSON-RPC-2.0-Anfragen an seinem Endpunkt. Seine Agent-Card ist ohne Zugangsdaten lesbar und nennt den Endpunkt, die Fähigkeiten und die Authentifizierung.
