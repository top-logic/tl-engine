model.Contacts = Contacts
model.Contacts.CompanyContact = Company
model.Contacts.CompanyContact.tooltip = The concrete type of a company contact. Every stored company contact is an object of this type.
model.Contacts.Contact.Company = Companies
model.Contacts.Contact.Company.FKey = DUNS-Nr.
model.Contacts.Contact.Company.FKey.tooltip = The Dun & Bradstreet number of the company. The value is indexed, so the company can be found by it.
model.Contacts.Contact.Company.FKey2 = SAP-Nr.
model.Contacts.Contact.Company.FKey2.tooltip = The SAP number of the company. The value is indexed, so the company can be found by it.
model.Contacts.Contact.Company.ZIPCode = ZIP code
model.Contacts.Contact.Company.ZIPCode.tooltip = The postal code of the company address.
model.Contacts.Contact.Company.city = City
model.Contacts.Contact.Company.city.tooltip = The place of the company address.
model.Contacts.Contact.Company.client = Client
model.Contacts.Contact.Company.client.tooltip = Whether the company appears as a client, that is, whether goods or services are supplied to it.
model.Contacts.Contact.Company.country = Country
model.Contacts.Contact.Company.country.tooltip = The country of the company address.
model.Contacts.Contact.Company.department = Department
model.Contacts.Contact.Company.department.tooltip = The department of the company that the contact data refer to.
model.Contacts.Contact.Company.sector = Sector
model.Contacts.Contact.Company.sector.tooltip = The economic sector the company operates in.
model.Contacts.Contact.Company.staff = Team
model.Contacts.Contact.Company.staff.tooltip = The person contacts that name this company as their employer. The value is computed from those contacts and cannot be edited here.
model.Contacts.Contact.Company.state = State
model.Contacts.Contact.Company.state.tooltip = The state or province of the company address.
model.Contacts.Contact.Company.street = Street
model.Contacts.Contact.Company.street.tooltip = Street and house number of the company address.
model.Contacts.Contact.Company.supplier = Supplier
model.Contacts.Contact.Company.supplier.tooltip = Whether the company appears as a supplier, that is, whether goods or services are purchased from it.
model.Contacts.Contact.Company.tooltip = Base type for the contact data of a company: its address, its role as supplier or client, and the persons working for it.
model.Contacts.Contact.Person = Persons
model.Contacts.Contact.Person.company = Company
model.Contacts.Contact.Person.company.tooltip = The company contact of the company the person works for.
model.Contacts.Contact.Person.fax = Fax
model.Contacts.Contact.Person.fax.tooltip = The fax number of the person.
model.Contacts.Contact.Person.firstname = Firstname
model.Contacts.Contact.Person.firstname.tooltip = The first name of the person.
model.Contacts.Contact.Person.fullName = Full name
model.Contacts.Contact.Person.fullName.tooltip = The full name of the person, assembled from title, first name and last name. The value is computed and cannot be edited.
model.Contacts.Contact.Person.phone_mobile = Phone, cellular
model.Contacts.Contact.Person.phone_mobile.tooltip = The mobile phone number of the person.
model.Contacts.Contact.Person.phone_private = Phone, private
model.Contacts.Contact.Person.phone_private.tooltip = The private telephone number of the person.
model.Contacts.Contact.Person.title = Title
model.Contacts.Contact.Person.title.tooltip = The title of the person, for example an academic degree.
model.Contacts.Contact.Person.tooltip = Base type for the contact data of a person: their name, their means of contact and the company they work for.
model.Contacts.Contact.all = Contacts
model.Contacts.Contact.all.email = Email
model.Contacts.Contact.all.email.tooltip = The e-mail address of the contact.
model.Contacts.Contact.all.name = Name
model.Contacts.Contact.all.name.tooltip = The name of the contact: the company name for a company, the last name for a person.
model.Contacts.Contact.all.phone = Phone
model.Contacts.Contact.all.phone.tooltip = The main telephone number of the contact.
model.Contacts.Contact.all.remarks = Remarks
model.Contacts.Contact.all.remarks.tooltip = Free-text notes about the contact.
model.Contacts.Contact.all.tooltip = Common base type of all contacts. It defines the properties that a company contact and a person contact have alike.
model.Contacts.PersonContact = Person
model.Contacts.PersonContact.account = Account
model.Contacts.PersonContact.account.tooltip = The account with which this person logs in to the application. The reference is the inverse of the contact reference of the account.
model.Contacts.PersonContact.loginName = Login name
model.Contacts.PersonContact.loginName.tooltip = The user name of the account last assigned to this contact. If that account is deleted and created again later, the contact can be found by this name and reused.
model.Contacts.PersonContact.tooltip = The concrete type of a person contact. Every stored person contact is an object of this type, and an account can be assigned to it.
model.Contacts.tooltip = Module with the types for the contact data of companies and persons.
