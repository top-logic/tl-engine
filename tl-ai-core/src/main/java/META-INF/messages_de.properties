com.top_logic.tl.ai.core.execution.AgentExecutionStore.tooltip = Dienst, der das <code>tl.ai.execution</code> persistiert und abruft: <i>Agentensitzung</i>, <i>Agentenausführung</i>, <i>Interaktionsanfrage</i>, <i>Agentenaufgabe</i> und <i>Benutzerspeicher</i>. <p> Dies ist der einzige Schreibpfad für die Persistenz bei der Agentenausführung. Jeder Einstiegspunkt, an dem ein Agent ausgeführt wird (Chat, TL-Script, Delegierung, Hintergrundaufträge), protokolliert dessen Ausführung über diesen Dienst, sodass alle Ausführungen einheitlich abfragbar sind, unabhängig davon, wie sie gestartet wurden. </p> <p> Alle mutierenden Methoden werden in einem dedizierten Schreib-Thread innerhalb einer neuen Systeminteraktion mit eigener <i>Transaktion</i> ausgeführt. Aufrufer benötigen daher weder eine Transaktion noch einen commit-fähigen KB-Kontext – die Aufzeichnung funktioniert aus jedem Aufruferkontext heraus, einschließlich schreibgeschützter Kontexte wie der TL-Script-Auswertung während des Renderings (deren „ImmutableDBContext“ kein Commit durchführen kann). Abfragen werden auf dem aufrufenden Thread ausgeführt und erfordern einen gebundenen TopLogic-Kontext. </p> <p><b>Invariante:</b> Nichts, was von einem KnowledgeBase-UpdateListener (oder einem anderen synchronen Commit-Hook) aus erreichbar ist, darf eine mutierende Methode dieses Dienstes aufrufen – der Aufrufer blockiert auf dem einzigen Schreib-Thread, dessen Commit diese Listener synchron benachrichtigt, sodass ein solcher Aufruf einen Deadlock-Zyklus schließt. </p> <p> Aufrufer sehen ihre eigenen Schreibvorgänge <em>nicht</em> automatisch: Schreib-Commits erfolgen in einer separaten Sitzung, und die stabile Ansicht einer Untersitzung wird nur an genehmigten Punkten aktualisiert. Das Chat-Servlet erhöht die Sitzungsrevision zu Beginn der Anfrage, was alle HTTP-Rücklesepfade abdeckt, sowie in der Agentenschleife vor den Aufrufen jeder Runde (Gitea #647), was das abdeckt, was die nächste Runde eines Durchlaufs liest – nicht den Rest der Runde, in der geschrieben wurde. </p>
com.top_logic.tl.ai.core.execution.layout.RequestCancelCommand = Befehl „Anfrage stornieren“
com.top_logic.tl.ai.core.execution.layout.RequestCancelCommand.tooltip = Fordert die Abbruch der <i>Ausführung</i> des ausgewählten <i>Agenten</i> an. <p> Absichtlich keine TL-Script-Transaktion mit der Einstellung <code>AgentExecution#getCancelRequested()</code>: Der Marker muss von <code>AgentExecutionStore#requestCancel(AgentExecution)</code> geschrieben werden, das auf dem Writer-Thread des Speichers läuft und zunächst den Status des Laufs am KB HEAD erneut liest, sodass ein Lauf, der gleichzeitig auf einem anderen Clusterknoten endet, korrekt erkannt wird. Eine einfache UI-Transaktion umgeht beides. </p> <p> Die Abbruchverarbeitung erfolgt asynchron. Der Knoten, der den Lauf ausführt, erkennt den festgeschriebenen Marker bei seinem nächsten Durchlauf der Agentenschleife; der Lauf wird dann mit dem Status „CANCELLED“ abgeschlossen. Die hier angezeigte Meldung weist darauf hin, anstatt so zu tun, als wäre der Lauf bereits beendet. </p>
