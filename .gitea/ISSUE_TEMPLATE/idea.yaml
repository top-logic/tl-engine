name: Idea
about: A decision is still open - decide it before anyone builds it
labels: ["type/idea"]
body:
  - type: markdown
    attributes:
      value: |
        For a question, not a task: nobody should start building while this is open.
        Once the answer is settled, the work is filed as a **Feature** (or fixed as a **Bug**).

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: >-
        Pick every part this decision touches. Gitea cannot turn this answer into a label,
        so a maintainer still has to set the matching `area/*` label by hand - this field is
        what tells them which one.
      multiple: true
      options:
        - area/agent-core
        - area/browser
        - area/security
        - area/model
        - area/ui
        - area/mcp
        - area/docs
        - area/build
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: >-
        How things work today and how the question came up: the PR that parked it, the
        design doc section, the code that is a stub. Enough that the reader does not have
        to reconstruct it.
    validations:
      required: true

  - type: textarea
    id: open-question
    attributes:
      label: The open question
      description: >-
        State it as a question, in a sentence or two. If there is more than one, list them
        separately - each may be settled on its own.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: Options considered
      description: >-
        Optional. Each option with what it buys and what it costs. An option already ruled
        out is worth listing with the reason - it stops the next reader proposing it again.
    validations:
      required: false

  - type: textarea
    id: what-settles-it
    attributes:
      label: What would settle it
      description: >-
        What is actually needed to decide: a measurement, a prototype, a rule someone has
        to choose, another issue landing first. Also say what stays blocked meanwhile, and
        what is safe to ship without the answer.
    validations:
      required: true

  - type: input
    id: related
    attributes:
      label: Related issues and PRs
      description: Optional. Issues this blocks or depends on, and the PR this was split out of.
      placeholder: "#220, PR #205"
    validations:
      required: false
