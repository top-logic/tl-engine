model.tl.doc = Dokumentation
model.tl.doc.Page = Seite
model.tl.doc.Page.content = Inhalt
model.tl.doc.Page.content.tooltip = Der Text der Seite. Er wird im WYSIWYG-Editor bearbeitet und kann in jeder Sprache erfasst werden, in der die Dokumentation angeboten wird.
model.tl.doc.Page.importSource = Import Quelle
model.tl.doc.Page.importSource.tooltip = Das Modul, aus dem die Seite importiert wurde. Beim Export wird die Seite wieder in dieses Modul geschrieben und nicht in das Standardverzeichnis.
model.tl.doc.Page.name = Hilfe ID
model.tl.doc.Page.name.tooltip = Der technische Name der Seite. Er wird beim Export der Dokumentation als Pfadbestandteil der Seite verwendet und identifiziert beim Import eine bestehende Seite, wenn für sie keine eindeutige Kennung angegeben ist.
model.tl.doc.Page.position = Position
model.tl.doc.Page.position.tooltip = Die Position der Seite unter ihren Geschwisterseiten. Der Wert stammt aus der Eigenschaftsdatei der importierten Dokumentation und bestimmt die Reihenfolge, in die die Seiten beim Import sortiert werden.
model.tl.doc.Page.title = Titel
model.tl.doc.Page.title.tooltip = Die Überschrift der Seite. Sie kann in jeder Sprache erfasst werden, in der die Dokumentation angeboten wird.
model.tl.doc.Page.tooltip = Eine Seite der Dokumentation. Eine Seite kann weitere Seiten enthalten, so dass die Dokumentation einen Baum bildet.
model.tl.doc.Page.uuid = UUID
model.tl.doc.Page.uuid.tooltip = Die eindeutige Kennung der Seite. Über sie verweist eine Sicht auf ihre Dokumentationsseite: die an der Sicht konfigurierte Hilfe-ID wird mit diesem Wert verglichen. Beim Import wird eine Seite darüber wiedererkannt, so dass sie eine Umbenennung übersteht.
model.tl.doc.Root = Wurzelseite
model.tl.doc.Root.tooltip = Die Wurzelseite der Dokumentation. Sie wird automatisch als Wurzelobjekt ihres Moduls angelegt und kann nicht gelöscht werden.
model.tl.doc.tooltip = Modul mit den Typen der Dokumentation, die in der Anwendung angezeigt wird. Die Seiten bilden einen Baum, der in das Dateisystem exportiert und von dort importiert werden kann.
