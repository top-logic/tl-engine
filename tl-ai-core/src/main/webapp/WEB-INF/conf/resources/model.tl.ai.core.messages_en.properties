model.tl.ai.core = TL-AI-Core
model.tl.ai.core.Agent = AI Agent
model.tl.ai.core.Agent.contextWindow = Context Window
model.tl.ai.core.Agent.contextWindow.tooltip = Maximum number of tokens the model can process in a single conversation, including input and output. Overrides the model's default context size.
model.tl.ai.core.Agent.delegations = Delegations
model.tl.ai.core.Agent.delegations.tooltip = Other agents this agent can hand off tasks to. The agent decides when to delegate based on the sub-agent's description.
model.tl.ai.core.Agent.description = Description
model.tl.ai.core.Agent.description.tooltip = A short summary of what this agent does. Shown to other agents when they decide which agent to delegate to.
model.tl.ai.core.Agent.entryPoint = Entry point
model.tl.ai.core.Agent.entryPoint.tooltip = If enabled, this agent is available as a starting point for new conversations. Agents without this flag can only be reached via delegation.
model.tl.ai.core.Agent.maxRetries = Max. Retries
model.tl.ai.core.Agent.maxRetries.tooltip = Maximum number of times the agent retries after an error before giving up.
model.tl.ai.core.Agent.maxTokens = Max. Tokens
model.tl.ai.core.Agent.maxTokens.tooltip = Upper limit on the number of tokens the model may generate in a single response.
model.tl.ai.core.Agent.maxToolResultChars = Max. Tool Result Length
model.tl.ai.core.Agent.maxToolResultChars.tooltip = Maximum number of characters returned from a single tool call. Longer results are truncated.
model.tl.ai.core.Agent.maxTurns = Max. Turns
model.tl.ai.core.Agent.maxTurns.tooltip = Maximum number of agent loop iterations before the run is stopped. Each turn consists of one model response and its tool calls. Prevents runaway agents.
model.tl.ai.core.Agent.mcpServers = MCP Servers
model.tl.ai.core.Agent.mcpServers.tooltip = Names of MCP servers this agent may use for tool calls.
model.tl.ai.core.Agent.model = Model
model.tl.ai.core.Agent.model.tooltip = The language model used by this agent (e.g. Claude, GPT). If empty, the system default is used.
model.tl.ai.core.Agent.name = Name
model.tl.ai.core.Agent.name.tooltip = The unique name used to identify this agent.
model.tl.ai.core.Agent.reasoningEffort = Reasoning Effort
model.tl.ai.core.Agent.reasoningEffort.tooltip = Controls how much reasoning effort the model spends on a request (OpenAI and xAI models only). Higher values improve accuracy on complex tasks but increase latency and cost.
model.tl.ai.core.Agent.reasoningSummary = Reasoning Summary
model.tl.ai.core.Agent.reasoningSummary.tooltip = Controls whether the model returns a summary of its internal reasoning (OpenAI models only). "Auto" lets the model decide, "Detailed" always includes a full summary.
model.tl.ai.core.Agent.skills = Skills
model.tl.ai.core.Agent.skills.tooltip = Reusable instructions attached to this agent. Skills provide domain knowledge or behavioral guidelines for specific tasks.
model.tl.ai.core.Agent.systemPrompt = System prompt
model.tl.ai.core.Agent.systemPrompt.tooltip = Instructions that define the agent's behavior, role, and response style. Sent to the language model at the start of every conversation.
model.tl.ai.core.Agent.temperature = Temperature
model.tl.ai.core.Agent.temperature.tooltip = Controls how creative or random the model's responses are. Lower values (e.g. 0.0) produce more deterministic output, higher values (e.g. 1.0) more varied output.
model.tl.ai.core.Agent.thinkingEffort = Thinking Effort
model.tl.ai.core.Agent.thinkingEffort.tooltip = Controls how much internal reasoning the model performs before answering (Anthropic models only). Higher values produce more thorough analysis but increase latency and token usage.
model.tl.ai.core.Agent.timeoutSeconds = Timeout (s)
model.tl.ai.core.Agent.timeoutSeconds.tooltip = Maximum time in seconds the agent may run before the request is cancelled.
model.tl.ai.core.Agent.toolChoice = Tool Choice
model.tl.ai.core.Agent.toolChoice.tooltip = Controls how the model selects tools. "Auto" lets the model decide freely, "Required" forces at least one tool call per turn, "None" disables tool use entirely.
model.tl.ai.core.Agent.tools = Tools
model.tl.ai.core.Agent.tools.tooltip = The tools this agent is allowed to use (e.g. search, database queries). Only selected tools are available during execution.
model.tl.ai.core.Agent.tooltip = An AI agent that processes user requests using a language model, tools, and skills.
model.tl.ai.core.Agent.topK = Top-K
model.tl.ai.core.Agent.topK.tooltip = Limits the model's word choices to the K most likely next tokens at each step (Anthropic models only). Lower values make output more focused, higher values allow more variety.
model.tl.ai.core.Agent.topP = Top-P
model.tl.ai.core.Agent.topP.tooltip = Limits the model's word choices to the most likely options whose combined probability reaches this threshold. Lower values make output more focused.
model.tl.ai.core.ReasoningEffort = Reasoning Effort
model.tl.ai.core.ReasoningEffort.HIGH = High
model.tl.ai.core.ReasoningEffort.HIGH.tooltip = Maximum reasoning. Best accuracy for complex tasks.
model.tl.ai.core.ReasoningEffort.LOW = Low
model.tl.ai.core.ReasoningEffort.LOW.tooltip = Minimal reasoning. Fastest responses, suitable for simple tasks.
model.tl.ai.core.ReasoningEffort.MEDIUM = Medium
model.tl.ai.core.ReasoningEffort.MEDIUM.tooltip = Moderate reasoning. Good balance for most tasks.
model.tl.ai.core.ReasoningEffort.tooltip = The level of reasoning effort for OpenAI and xAI models.
model.tl.ai.core.ReasoningSummary = Reasoning Summary
model.tl.ai.core.ReasoningSummary.AUTO = Auto
model.tl.ai.core.ReasoningSummary.AUTO.tooltip = The model decides whether to include a reasoning summary.
model.tl.ai.core.ReasoningSummary.DETAILED = Detailed
model.tl.ai.core.ReasoningSummary.DETAILED.tooltip = Always include a detailed summary of the model's reasoning.
model.tl.ai.core.ReasoningSummary.tooltip = Controls whether the model's internal reasoning is summarized in the r.esponse
model.tl.ai.core.Skill = Skill
model.tl.ai.core.Skill.agents = Agents
model.tl.ai.core.Skill.agents.tooltip = The agents this skill is assigned to.
model.tl.ai.core.Skill.content = Content
model.tl.ai.core.Skill.content.tooltip = The full instruction text of the skill. This is injected into the agent's context when the skill is activated.
model.tl.ai.core.Skill.description = Description
model.tl.ai.core.Skill.description.tooltip = A short summary of what this skill provides. Helps the agent decide when to apply it.
model.tl.ai.core.Skill.name = Name
model.tl.ai.core.Skill.name.tooltip = The unique name of this skill.
model.tl.ai.core.Skill.tooltip = A reusable instruction that can be attached to agents to guide their behavior in specific situations.
model.tl.ai.core.ThinkingEffort = Thinking Effort
model.tl.ai.core.ThinkingEffort.HIGH = High
model.tl.ai.core.ThinkingEffort.HIGH.tooltip = Extensive thinking. Thorough reasoning at the cost of higher latency.
model.tl.ai.core.ThinkingEffort.LOW = Low
model.tl.ai.core.ThinkingEffort.LOW.tooltip = Minimal thinking. Fast responses with less deliberation.
model.tl.ai.core.ThinkingEffort.MAX = Maximum
model.tl.ai.core.ThinkingEffort.MAX.tooltip = Maximum thinking effort. Most thorough reasoning available.
model.tl.ai.core.ThinkingEffort.MEDIUM = Medium
model.tl.ai.core.ThinkingEffort.MEDIUM.tooltip = Moderate thinking. Balanced between speed and thoroughness.
model.tl.ai.core.ThinkingEffort.tooltip = The level of internal reasoning effort for Anthropic models with extended thinking.
model.tl.ai.core.ToolChoice = Tool Choice
model.tl.ai.core.ToolChoice.AUTO = Auto
model.tl.ai.core.ToolChoice.AUTO.tooltip = The model decides whether and which tools to call.
model.tl.ai.core.ToolChoice.NONE = None
model.tl.ai.core.ToolChoice.NONE.tooltip = Tool use is disabled. The model responds with text only.
model.tl.ai.core.ToolChoice.REQUIRED = Required
model.tl.ai.core.ToolChoice.REQUIRED.tooltip = The model must call at least one tool in every turn.
model.tl.ai.core.ToolChoice.tooltip = Strategy for how the model selects tools during execution.
