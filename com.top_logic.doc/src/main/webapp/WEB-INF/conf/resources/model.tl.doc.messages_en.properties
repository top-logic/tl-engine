model.tl.doc = Documentation
model.tl.doc.Page = Page
model.tl.doc.Page.content = Content
model.tl.doc.Page.content.tooltip = The text of the page. It is edited in the WYSIWYG editor and can be entered in every language in which the documentation is offered.
model.tl.doc.Page.importSource = Import source
model.tl.doc.Page.importSource.tooltip = The module the page was imported from. On export the page is written back into that module instead of into the default directory.
model.tl.doc.Page.name = Help ID
model.tl.doc.Page.name.tooltip = The technical name of the page. It is used as the path segment of the page when the documentation is exported and identifies an existing page on import when no unique identifier is given for it.
model.tl.doc.Page.position = Position
model.tl.doc.Page.position.tooltip = The position of the page among its sibling pages. The value comes from the properties file of the imported documentation and determines the order in which the pages are sorted on import.
model.tl.doc.Page.title = Title
model.tl.doc.Page.title.tooltip = The heading of the page. It can be entered in every language in which the documentation is offered.
model.tl.doc.Page.tooltip = A page of the documentation. A page can contain further pages, so that the documentation forms a tree.
model.tl.doc.Page.uuid = UUID
model.tl.doc.Page.uuid.tooltip = The unique identifier of the page. A view refers to its documentation page by this identifier: the help ID configured at the view is compared with this value. On import a page is recognized by it, so that it survives a rename.
model.tl.doc.Root = Root page
model.tl.doc.Root.tooltip = The root page of the documentation. It is created automatically as the root object of its module and cannot be deleted.
model.tl.doc.tooltip = Module with the types of the documentation displayed in the application. The pages form a tree that can be exported to the file system and imported from it.
