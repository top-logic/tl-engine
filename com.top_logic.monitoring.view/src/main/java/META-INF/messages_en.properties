com.top_logic.monitoring.view.MonitorFunctions.memoryUsage = Memory usage over time
com.top_logic.monitoring.view.MonitorFunctions.memoryUsage.return = The recorded entries in the order they were recorded, the oldest first. Empty if the <i>memory logging</i> is not running or keeps no entries.
com.top_logic.monitoring.view.MonitorFunctions.memoryUsage.tooltip = The memory usage the <i>memory logging</i> has recorded. <p> Each entry is a dictionary with the time it was recorded under <code>"date"</code>, the bytes used by objects under <code>"used"</code>, reserved by the VM under <code>"total"</code>, available to the VM at most under <code>"max"</code> and reserved but unused under <code>"free"</code>. The number of garbage collections and the milliseconds spent in them since the start of the VM, summed over all garbage collectors, are given under <code>"gcCount"</code> and <code>"gcTime"</code>; the difference of two entries tells how much garbage collection happened between them. </p>
