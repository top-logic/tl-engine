com.top_logic.tl.ai.browser.BrowserToolsService = Browser-Tools-Dienst
com.top_logic.tl.ai.browser.BrowserToolsService$SandboxMode = Sandbox-Modus
com.top_logic.tl.ai.browser.BrowserToolsService$SandboxMode.tooltip = Ob für die Browsersitzungen die Sandbox von Chromium auf Betriebssystemebene verwendet wird.
com.top_logic.tl.ai.browser.BrowserToolsService.Config.acquire-timeout-seconds = Timeout für die Sitzungsanforderung in Sekunden
com.top_logic.tl.ai.browser.BrowserToolsService.Config.acquire-timeout-seconds.tooltip = Wie lange ein Tool-Aufruf in Sekunden auf einen freien Sitzungsplatz wartet, bevor er mit dem Fehler „Browser beschäftigt, bitte erneut versuchen“ vorzeitig abgebrochen wird. <p> Absichtlich kurz gehalten: Eine begrenzte Wartezeit kann den Servlet-Thread-Pool nicht so erschöpfen, wie es die frühere unbegrenzte Sperre konnte. </p>
com.top_logic.tl.ai.browser.BrowserToolsService.Config.action-timeout-seconds = Timeout für Elementaktionen in Sekunden
com.top_logic.tl.ai.browser.BrowserToolsService.Config.action-timeout-seconds.tooltip = Timeout in Sekunden für eine Aktion auf einem einzelnen <b>Element</b> - browserClick / browserType sowie das Lesen des Accessibility-Snapshots. <p> Bewusst deutlich kürzer als das Timeout für Seitenladevorgänge, denn beide warten auf völlig verschiedene Dinge. Ein Klick wartet darauf, dass das Element <em>bedienbar</em> wird (im DOM vorhanden, sichtbar, stabil, nicht verdeckt, aktiviert); wenn die Seite dieses Element inzwischen neu gerendert und dabei entfernt hat - der klassische Fall eines Suchfelds, dessen Vorschlagsliste das Bedienelement ersetzt, nachdem die Suchanfrage eingegeben wurde - kann kein weiteres Warten den Vorgang mehr erfolgreich machen; ein Zeitbudget in Größe eines Seitenladevorgangs macht aus einem aussichtslosen Klick lediglich eine halbminütige Blockade mit einer nichtssagenden Zeitüberschreitung am Ende. Die Begrenzung auf wenige Sekunden erlaubt es dem Tool, umgehend mit der umsetzbaren Anweisung „erneuten Snapshot erstellen und eine frische Referenz verwenden“ zu antworten (siehe <i>Ausnahme „Browser-Referenz nicht bedienbar“</i>), und fängt den normalen Fall eines Elements, das einen Moment zur Stabilisierung braucht, weiterhin ab. </p> <p> Erhöhen Sie den Wert für eine bewusst langsame oder stark animierte Anwendung; er wird auf höchstens das Timeout für Seitenladevorgänge begrenzt, da es niemals sinnvoll ist, auf ein einzelnes Element länger zu warten als auf einen vollständigen Seitenladevorgang. </p>
com.top_logic.tl.ai.browser.BrowserToolsService.Config.allow-any-domains = Alle Domains zulassen
com.top_logic.tl.ai.browser.BrowserToolsService.Config.allow-any-domains.tooltip = Gibt an, ob die Zulassungsliste für Domains im öffentlichen Bereich deaktiviert ist (Modus „allow-any-domains“). <p> Bei „false“ (der sichere Standardwert) ist eine Navigation nur zulässig, wenn die Top-Level-Domain auf der Zulassungsliste steht. Bei „true“ wird die Zulassungsliste ignoriert und jede öffentliche Domain ist erreichbar – <em>mit der Ausnahme</em>, dass der SSRF-Schutz und die Sperrliste weiterhin bedingungslos gelten. „Allow-any“ lockert lediglich die Zulassungsliste für öffentliche Domänen, niemals jedoch den SSRF-Schutz oder die Sperrliste. </p>
com.top_logic.tl.ai.browser.BrowserToolsService.Config.allowed-domains = Zulässige Domains
com.top_logic.tl.ai.browser.BrowserToolsService.Config.allowed-domains.tooltip = Vom Administrator verwaltete Zulassungsliste mit Domänen, zu denen der Browser navigieren darf. <p> Ein Aufruf ist nur zulässig, wenn der Zielhost mit einem dieser Einträge übereinstimmt oder eine Subdomain davon ist. Ist die Liste leer, lehnt der Browser jeden Aufruf ab (Fail-Closed). Hierbei handelt es sich um eine Richtlinienkonfiguration – nicht um das vom Modell bereitgestellte Argument „allowedDomains“ des <i>Web-Suchtools</i>. </p>
com.top_logic.tl.ai.browser.BrowserToolsService.Config.apply-allowlist-to-all-requests = Zulassungsliste auf alle Anfragen anwenden
com.top_logic.tl.ai.browser.BrowserToolsService.Config.apply-allowlist-to-all-requests.tooltip = Ob die Zulassungsliste <b>jede</b> Verbindung des Browsers regelt und nicht nur die Herkunft des Hauptdokuments. <p> Die Zulassungsliste war bisher stets eine Kontrolle auf Ebene der <em>Top-Level-Herkunft</em>: Eine zugelassene Seite darf Unterressourcen (Schriften, Skripte, Bilder von einem CDN) von überall dort nachladen, wo weder der SSRF-Schutz greift noch ein Eintrag auf der Sperrliste vorliegt - genau wie ein gewöhnlicher Browser. „false“ (der Standardwert) behält dieses Verhalten bei: Der filternde Proxy setzt SSRF-Schutz und Sperrliste für jede Verbindung durch, die Zulassungsliste wird weiterhin nur für die Top-Level-Herkunft geprüft. </p> <p> Setzen Sie den Wert auf „true“ für eine abgeschottete Installation nach dem Grundsatz „dieser Browser darf mit diesen Domains sprechen und mit sonst keinen“: Der Proxy lehnt dann <em>jede</em> Verbindung zu einem Host ab, der nicht auf der Zulassungsliste steht, Unterressourcen eingeschlossen. Das ist strikt sicherer - es verhindert auch, dass eine zugelassene Seite Daten an Dritte sendet -, aber eine Seite, deren Ressourcen auf anderen Domains liegen, wird ohne diese dargestellt; es ist daher eine bewusste Entscheidung des Betreibers und nicht der Standard. Die Option hat keine Wirkung, wenn „allow-any“ aktiviert ist (dann gibt es keine Zulassungsliste, die angewendet werden könnte), und sie kann niemals etwas lockern: SSRF-Schutz und Sperrliste gelten in beiden Einstellungen für jede Verbindung. </p>
com.top_logic.tl.ai.browser.BrowserToolsService.Config.blocked-domains = Gesperrte Domains
com.top_logic.tl.ai.browser.BrowserToolsService.Config.blocked-domains.tooltip = Vom Administrator verwaltete Sperrliste mit Domains, zu denen der Browser niemals navigieren darf. <p> Eine Top-Level-Quelle wird abgelehnt, wenn ihr Host mit einem dieser Einträge übereinstimmt oder eine Subdomain davon ist (gleiche Übereinstimmungsregeln wie bei <i>den zugelassenen Domänen</i>). Die Sperrliste hat Vorrang vor der Zulassungsliste und gilt in jedem Modus, einschließlich „allow-any“. Sie schränkt eine umfassende Zulassungsliste (oder den Modus „allow-any“) durch Ausnahmen ein. Der SSRF-Schutz wird unabhängig davon durchgesetzt und kann nicht gelockert werden. </p>
com.top_logic.tl.ai.browser.BrowserToolsService.Config.browser-sandbox = Browser-Sandbox
com.top_logic.tl.ai.browser.BrowserToolsService.Config.browser-sandbox.tooltip = Ob die Browsersitzungen innerhalb der Chromium-eigenen Sandbox auf Betriebssystemebene laufen. <p> Die Sandbox ist die Grenze zwischen einem Renderer, der <em>von Angreifern kontrolliertes Seiten-JavaScript</em> ausführt, und dem Host, auf dem die Anwendung läuft: Ohne sie ist ein Renderer-Exploit einfach Code, der mit den Berechtigungen der Anwendung selbst und innerhalb ihres Prozessbaums läuft. Sie ist daher überall aktiv, wo sie es sein kann, und sie ist kein Regler zur Leistungsoptimierung. </p> <p> <i>Auto</i> (der Standard) lässt sie aktiv und gibt sie nur innerhalb eines Containers auf, erkannt an den Markerdateien und dem cgroup-Layout, die eine Container-Laufzeitumgebung hinterlässt. Das ist die einzige Umgebung, in der sie nicht einfach aktiv bleiben kann: Das Standard-Seccomp-Profil von Docker/Podman verweigert die clone- und unshare-Aufrufe, die die Namespace-Sandbox von Chromium benötigt, sodass ein Start mit Sandbox dort sofort fehlschlägt. Die richtige Lösung für einen Container ist ein Laufzeitprofil, das diese Aufrufe zulässt (verfolgt im Ticket zum Deploy-Image); bis dahin wird die Sandbox in Containern und nur in Containern aufgegeben. </p> <p> <i>Aktiviert</i> und <i>Deaktiviert</i> sind die Ausweichoptionen: „Aktiviert“ behält die Sandbox auch in einem Container (richtig, sobald das Image ein Seccomp-Profil mitbringt, das sie zulässt; andernfalls startet der Browser nicht), „Deaktiviert“ gibt sie bedingungslos auf, was die Isolation jeder aufgerufenen Seite schwächt und daher immer nur eine vorübergehende Diagnosemaßnahme sein sollte. </p>
com.top_logic.tl.ai.browser.BrowserToolsService.Config.cookie-pools-enabled = Cookie-Pools aktiviert
com.top_logic.tl.ai.browser.BrowserToolsService.Config.cookie-pools-enabled.tooltip = Hauptschalter für Cookie-Pools: Legt fest, ob die Verben „browserSaveCookies“ und „browserUseCookies“ aktiv sind. <p> „true“ (Standard) aktiviert persistente, benannte, verschlüsselte Anmeldepools: Eine Sitzung kann ihren aktuellen Anmeldestatus in einem benannten Pool speichern, und eine spätere Sitzung kann mit den Daten aus diesem Pool beginnen (siehe CookiePoolService). Bei „false“ werden beide Befehle mit einer eindeutigen Meldung abgelehnt, und es wird kein Cookie-Status erfasst oder als Ausgangswert verwendet – nutzen Sie diese Option, um die gesamte Funktion für eine Installation zu deaktivieren, unabhängig davon, was das Modell versucht. Das Deaktivieren hat keine Auswirkungen auf die normale Navigation oder den isolierten Kontext pro Sitzung. </p>
com.top_logic.tl.ai.browser.BrowserToolsService.Config.evade-bot-detection = Bot-Erkennung umgehen
com.top_logic.tl.ai.browser.BrowserToolsService.Config.evade-bot-detection.tooltip = Ob der Browser seinen Automatisierungs-Fingerabdruck verschleiern soll, damit Bot-Schutzmechanismen ihm mit geringerer Wahrscheinlichkeit eine Seite mit Zugriffsverweigerung oder einer Sicherheitsabfrage anzeigen (standardmäßig deaktiviert). <p> Bei „false“ (Standardeinstellung) verhält sich der Browser wie ein unverändertes headless Chromium: keine User-Agent-Überschreibung, keine zusätzlichen Startargumente, kein Fingerabdruck-Initialisierungsskript. Bei „true“ wird der Kontext jeder Sitzung so gestaltet, dass er wie ein gewöhnlicher Desktop-Chrome aussieht: Der Startparameter --disable-blink-features=AutomationControlled wird hinzugefügt, ein realistischer Desktop-Chrome-User-Agent (und eine passende „Accept-Language“-Einstellung) wird gesetzt, und ein kleines Init-Skript maskiert die üblichen Automatisierungshinweise (navigator.webdriver, leere navigator.plugins, navigator.languages, fehlendes window.chrome). </p> <p> Der <b>vollständige</b> Chromium-Build (Playwright-Kanal „chromium“, neuer Headless-Modus - weiterhin fensterlos), auf den die Verschleierung ebenfalls angewiesen ist - die leichtgewichtige chrome-headless-shell ist selbst ein Erkennungsmerkmal, aufgrund dessen manche Bot-Schutzmechanismen Inhalte unterdrücken, selbst wenn der User-Agent und navigator.webdriver maskiert sind -, wird unabhängig von dieser Einstellung für jede Sitzung gestartet, denn nur er erlaubt es, die UDP-Kommunikation von WebRTC abzuschalten. Siehe BrowserSession.buildLaunchOptions, einschließlich der damit verbundenen Voraussetzung für die Bereitstellung. </p> <p> <b>Warnhinweis - nur für autorisierte Nutzung.</b> Die Aktivierung dieser Option umgeht bewusst den Schutz einer Website vor automatisiertem Zugriff und kann gegen die Nutzungsbedingungen dieser Website verstoßen. Es handelt sich um eine vom Betreiber aktivierbare Option für autorisierte Ziele (z. B. eine Website, bei der der Betreiber angemeldet ist und die ihm gehört oder für deren Automatisierung er die Erlaubnis besitzt); sie ist standardmäßig deaktiviert und darf nicht aktiviert werden, um auf Websites zuzugreifen, bei denen dies nicht gestattet ist. SSRF-Schutz, Sperrliste und Zulassungsliste bleiben davon unberührt und werden weiterhin unverändert durchgesetzt. </p>
com.top_logic.tl.ai.browser.BrowserToolsService.Config.headless = Headless-Modus
com.top_logic.tl.ai.browser.BrowserToolsService.Config.headless.tooltip = Ob Browsersitzungen im Headless-Modus (ohne sichtbares Fenster) gestartet werden. <p> „true“ (Standard) ist die produktionssichere Variante: Jede Sitzung führt ein fensterloses Chromium aus, sodass auf dem App-Host nichts angezeigt wird und kein lokaler Bildschirm erforderlich ist. Setzen Sie den Wert auf „false“, um ein Chromium-Fenster <b>mit Benutzeroberfläche</b> (sichtbar) auf dem Desktop des App-Hosts zu starten – eine Annehmlichkeit für die Entwicklung und den lokalen Einsatz, die einen lokalen Bildschirm erfordert und nicht in der Produktion oder auf Remote-/Headless-Hosts verwendet werden darf. Wenn auf einem Host ohne Bildschirm ein „headed“ Modus angefordert wird, bricht der Dienst beim Start sofort ab, anstatt bei einem Startvorgang zu hängen, der niemals erfolgreich sein kann. </p>
com.top_logic.tl.ai.browser.BrowserToolsService.Config.max-concurrent-sessions = Maximale Anzahl gleichzeitiger Sitzungen
com.top_logic.tl.ai.browser.BrowserToolsService.Config.max-concurrent-sessions.tooltip = Maximale Anzahl gleichzeitig zulässiger aktiver Browsersitzungen (isolierte Kontexte). <p> Dies begrenzt den Speicherbedarf: Jede aktive Sitzung läuft in einem eigenen Chromium-Prozess (ca. 200–400 MB einschließlich des Playwright-Treibers). Anfragen, die diese Obergrenze überschreiten, geben eine inaktive Sitzung nach dem LRU-Prinzip frei oder schlagen – falls keine Sitzung inaktiv ist – sofort mit einem wiederholbaren „Browser beschäftigt“-Fehler fehl. Der Standardwert von 4 hält den Spitzenwert des Browser-Speicherbedarfs bei etwa 1 GB; erhöhen Sie diesen Wert entsprechend dem verfügbaren RAM. </p>
com.top_logic.tl.ai.browser.BrowserToolsService.Config.max-page-bytes = Maximale Seitenbyteanzahl
com.top_logic.tl.ai.browser.BrowserToolsService.Config.max-page-bytes.tooltip = Maximale Anzahl an HTML-Bytes, die von einer Seite gelesen werden, bevor die Extraktion beendet wird.
com.top_logic.tl.ai.browser.BrowserToolsService.Config.max-page-chars = Maximale Zeichenanzahl pro Seite
com.top_logic.tl.ai.browser.BrowserToolsService.Config.max-page-chars.tooltip = Maximale Zeichenanzahl des extrahierten Textes, den ein Browser-Tool zurückgibt.
com.top_logic.tl.ai.browser.BrowserToolsService.Config.navigation-settle-millis = Navigations-Beruhigungszeit in Millisekunden
com.top_logic.tl.ai.browser.BrowserToolsService.Config.navigation-settle-millis.tooltip = Höchstgrenze (in Millisekunden) für die <b>Stabilisierungsphase</b> nach dem Laden: Nachdem ein Seitenladevorgang (browserNavigate, browserBack oder ein browserClick, der navigiert hat) das Laden der Seite abgewartet hat und bevor die Seite erfasst wird, wartet der Browser darauf, dass die Seite zur Ruhe kommt - und jede der drei Wartephasen wird einzeln durch diese eine Obergrenze begrenzt. <p> <b>Commit.</b> Nur für einen browserClick, und nur dann, wenn die Seite sich per Skript selbst weiterbewegt hat statt über den angeklickten Link: Der Browser wartet, bis das neue Dokument das alte tatsächlich ersetzt hat, bevor er überhaupt etwas stabilisieren lässt - denn bis dahin sind die Adresse der Seite und ihr Ladezustand noch die des alten Dokuments. Eine Navigation, die begonnen wird und nie ankommt - ein 204, ein Download, ein Handler, der es sich anders überlegt -, wird nach dieser Obergrenze aufgegeben. </p> <p> <b>Netzwerkruhe.</b> Eine kurze Gelegenheit für clientseitiges Rendern, das erst nach dem load-Ereignis beginnt: Die Wartezeit endet, sobald die Seite für die Dauer von Playwrights Leerlauffenster keine Anfrage mehr gestellt hat, oder wenn diese Obergrenze abläuft. Sie wird bewusst <em>nicht</em> durch das Timeout für Seitenladevorgänge begrenzt: Eine Seite, die pollt, streamt oder Beacons sendet - die meisten SSO-Anmeldeseiten und die meisten Single-Page-Anwendungen -, erreicht überhaupt nie Netzwerkruhe; ein Budget in der Größe eines Seitenladevorgangs brachte hier also nichts und kostete bei jedem Vorgang dieses gesamte Budget. </p> <p> <b>DOM-Ruhe.</b> Anschließend wartet der Browser, bis das DOM ruhig ist (keine Änderung während eines kurzen internen Entprellungsfensters, ~500 ms) und jede laufende, endliche CSS-Animation beendet ist, oder bis diese Obergrenze abläuft. Dies schließt die häufige Lücke, bei der eine Seite ein Cookie-Einwilligungsbanner, ein Lazy-Widget oder andere Inhalte erst einen Moment <em>nach</em> der Rückkehr von der Navigation einblendet: Ohne die Stabilisierungsphase wird der Snapshot zu früh aufgenommen und verpasst diesen Inhalt, was einen manuellen erneuten Snapshot erzwingt. Eine statische Seite kommt fast sofort zur Ruhe und wird höchstens um das Entprellungsfenster verzögert, sodass schnelle Seiten nicht nennenswert verlangsamt werden; eine Seite, die ständig Änderungen durchläuft (ständige Animationen/Abfragen), unterliegt dieser Obergrenze. </p> <p> Die drei Phasen summieren sich auf keinem gewöhnlichen Weg: Ein Klick, der nicht navigiert, durchläuft allein die DOM-Ruhe, und ein gewöhnlicher Link- oder Formular-Klick hat bereits committet, wenn die Commit-Phase erreicht wird. Die Obergrenze wird immer deutlich innerhalb der Frist pro Operation angewendet, sodass sie niemals zu einem Hängenbleiben führen kann. Setzen Sie den Wert auf 0, um die Stabilisierungsphase vollständig zu deaktivieren und die Seite zu erfassen, sobald sie geladen ist; die dann erfasste Seite ist immer noch in sich stimmig - Adresse, Inhalt und Element-Referenzen werden in einem Zug gelesen -, sie wird nur früher erfasst. Die Stabilisierungsphase gilt <em>nicht</em> für browserSnapshot (explizite erneute Erfassung), für browserType (Bearbeitung derselben Seite) und auch nicht für einen browserClick, der keine Navigation ausgelöst hat - dieser erhält allein die Wartezeit auf DOM-Ruhe, da es keinen Seitenladevorgang gibt, auf den zu warten wäre. </p>
com.top_logic.tl.ai.browser.BrowserToolsService.Config.navigation-timeout-seconds = Timeout für Seitenladevorgänge in Sekunden
com.top_logic.tl.ai.browser.BrowserToolsService.Config.navigation-timeout-seconds.tooltip = Timeout für einen <b>Seitenladevorgang</b> (browserNavigate, browserBack und ein browserClick, der eine Navigation ausgelöst hat) in Sekunden. <p> Dies begrenzt das Warten auf das Dokument: wie lange der Browser höchstens benötigen darf, um auf einer langsamen Seite domcontentloaded und anschließend das load-Ereignis zu erreichen. Es begrenzt <em>nicht</em> die Stabilisierungsphase, die auf einen Ladevorgang folgt - diese wird durch <i>Navigations-Beruhigungszeit in Millisekunden</i> wesentlich strenger begrenzt, denn eine Seite, die nie zur Ruhe kommt, darf nicht bei jedem Vorgang so viel Zeit kosten wie ein ganzer Seitenladevorgang. Aktionen auf einem <em>Element</em> werden noch einmal separat und deutlich strenger durch <i>Timeout für Elementaktionen in Sekunden</i> begrenzt. </p>
com.top_logic.tl.ai.browser.BrowserToolsService.Config.session-idle-timeout-seconds = Timeout für inaktive Sitzungen in Sekunden
com.top_logic.tl.ai.browser.BrowserToolsService.Config.session-idle-timeout-seconds.tooltip = Wie lange eine Sitzung inaktiv bleiben darf (kein Tool-Aufruf), bevor sie geschlossen und ihre Ressourcen freigegeben werden, in Sekunden.
com.top_logic.tl.ai.browser.BrowserToolsService.SandboxMode.AUTO = Auto
com.top_logic.tl.ai.browser.BrowserToolsService.SandboxMode.AUTO.tooltip = Der Standard: Die Sandbox wird überall verwendet, nur nicht innerhalb eines Containers, wo das Standard-Laufzeitprofil Chromium daran hindert, eine einzurichten.
com.top_logic.tl.ai.browser.BrowserToolsService.SandboxMode.DISABLED = Deaktiviert
com.top_logic.tl.ai.browser.BrowserToolsService.SandboxMode.DISABLED.tooltip = Die Sandbox wird nie verwendet, unabhängig von der Umgebung. Das schwächt die Isolation jeder aufgerufenen Seite.
com.top_logic.tl.ai.browser.BrowserToolsService.SandboxMode.ENABLED = Aktiviert
com.top_logic.tl.ai.browser.BrowserToolsService.SandboxMode.ENABLED.tooltip = Die Sandbox wird immer verwendet, auch in einem Container. Chromium startet nicht, wo es keine einrichten kann.
com.top_logic.tl.ai.browser.BrowserToolsService.tooltip = Dienst, der den Pool isolierter, sitzungsspezifischer, headless Chromium-Browser verwaltet, die vom <i>Browser-Tool</i> verwendet werden. <p> Er verwaltet die Konfiguration (Timeout pro Navigation, Byte-/Zeichen-Obergrenzen pro Seite, die vom Administrator festgelegte Richtlinie für die Zulassungsliste, Sperrliste und „Alles zulassen“ sowie die Begrenzungen für die gleichzeitige Nutzung) und ist für den <i>Browser-Sitzungspool</i> verantwortlich. Jede Agentensitzung erhält eine <b>eigene</b> <i>Browsersitzung</i> – eine dedizierte <code>Playwright/Browser/BrowserContext</code> mit separaten Cookies und Speicher –, die über die vielen Tool-Aufrufe eines Durchlaufs hinweg wiederverwendet wird. Zwei gleichzeitig laufende Sitzungen können niemals die Cookies, Seiten oder Ergebnisse der jeweils anderen einsehen. </p> <p><b>Parallelitätsmodell (ersetzt die frühere einzelne globale Sperre).</b> Sitzungen laufen vollständig parallel. Ein <i>Browser-Sitzungspool</i> begrenzt die Anzahl der aktiven Sitzungen auf <i>die maximale Anzahl gleichzeitiger Sitzungen</i> (eine Speichergrenze, keine Durchsatzdrosselung). Beim Starten einer neuen Sitzung wird höchstens <i>„Acquire-Timeout“-Sekunden</i> lang auf einen freien Slot gewartet, wobei bei Bedarf die am längsten nicht genutzte inaktive Sitzung freigegeben wird; wenn kein Slot frei wird, schlägt der Vorgang schnell mit <i>einer „Browser-Busy“-Ausnahme</i> fehl, anstatt den aufrufenden Thread auf unbestimmte Zeit zu blockieren. Inaktive Sitzungen werden nach <i>„Session-Idle-Timeout“-Sekunden</i> entfernt. Jeder Browservorgang läuft unter einer festen äußeren Frist, sodass eine hängende Seite niemals einen Slot blockieren kann. </p> <p> Die Sicherheit ist mehrschichtig aufgebaut und wird bei jeder Navigation und jeder browserinternen Anfrage (Hauptdokument, Weiterleitungen und Unterressourcen) in einer festgelegten Prioritätsreihenfolge angewendet: </p> <ol> <li><b>SSRF hat immer Vorrang.</b> Jede Anfrage an eine private, Loopback-, Link-Local- oder anderweitig interne Adresse wird aufgrund <i>der URL-Sicherheit</i> bedingungslos abgelehnt. Diese Regelung kann durch keine Konfiguration gelockert werden.</li> <li><b>Die Sperrliste gilt immer.</b> Eine Top-Level-Quelle, die auf der vom Administrator geführten Sperrliste steht, wird in jedem Modus abgelehnt.</li> <li><b>Anschließend kommt die Zulassungsliste zum Tragen – es sei denn, „allow-any“ ist aktiviert.</b> Standardmäßig muss die Top-Level-Herkunftsquelle ebenfalls auf der Zulassungsliste stehen. Wenn „allow-any“ aktiviert ist, wird die Allowlist für die Public Domain übersprungen (jede Public Domain, die weder durch SSRF blockiert noch auf der Blockliste steht, ist erreichbar); „allow-any“ lockert <em>nur</em> die Allowlist, niemals die SSRF-Regeln oder die Blockliste.</li> </ol> <p> Die Zulassungsliste, die Sperrliste und das „allow-any“-Flag sind vom Administrator festgelegte Richtlinien – keine vom Modell vorgegebenen Argumente. Die Standardeinstellung („allowlist-enforced“, „allow-any“ deaktiviert) ist von Haus aus sicher: Eine leere Zulassungsliste bei deaktiviertem „allow-any“ lehnt jede Navigation ab. </p> <p><b>Über all dem steht die Navigationssteuerung durch <i>die Navigationsrichtlinie</i></b>, die im WebToolsService konfiguriert und pro Sicherheitsrolle aufgelöst wird: Welche Ursprünge <em>der User-</em> Agent <em>dieses Benutzers</em> erreichen darf und ob eine Seite dort ihm eine Datei übergeben darf. Sie wirkt sich auf die oben genannten Listen aus – beide müssen einen Ursprung zulassen – und eine Anwendung, die keine davon konfiguriert, unterliegt keinen zusätzlichen Einschränkungen. </p> <p><b>Wo die Richtlinie durchgesetzt wird.</b> Die maßgebliche Ebene ist ein <i>Filter-Proxy</i> auf der Loopback-Schnittstelle, an die <em>jede</em> Browsersitzung gebunden ist: Jede von Chromium hergestellte Verbindung – Navigation auf oberster Ebene, Weiterleitungssprung, Unterressource, Ziel mit IP-Literal – wird dort geprüft, bevor ein Paket den Rechner verlässt, und das Ziel ist per DNS festgebunden, sodass ein neu gebundener Host nicht durchschlüpfen kann. Die Zulassungsliste, die Sperrliste und das „allow-any“-Flag sind Teil <em>der Dienstkonfiguration</em> und für jede Sitzung identisch, sodass sich an dieser Hälfte der Entscheidung von Sitzung zu Sitzung nichts ändert; die Browserrichtlinie variiert hingegen je nach Rolle, weshalb pro <em>Richtlinie</em> ein eigener Proxy <em>verwendet</em> wird und nicht nur einer für den gesamten Dienst. Innerhalb jedes Browsers wird dieselbe Richtlinie erneut durch eine kontextbezogene Anforderungsweiterleitung sowie einen Umleitungsschutz und eine erneute Validierung der Ziel-URL angewendet – wodurch aus einer Ablehnung die klare Richtlinienmeldung des Tools wird. </p>
com.top_logic.tl.ai.browser.cookiepool.CookiePoolService = Cookie-Pool-Dienst
com.top_logic.tl.ai.browser.cookiepool.CookiePoolService.tooltip = Dienst, der <i>Cookie-Pool-Geschäftsobjekte</i> verwaltet und auswählt: benannte, benutzerspezifische (oder explizit freigegebene) Browser-Anmeldepools, deren „storageState“-JSON-Daten <b>im Ruhezustand verschlüsselt</b> gespeichert werden. <p> Ein Cookie-Pool erfasst den authentifizierten Anmeldestatus einer Browsersitzung (storageState: Cookies + Ursprungsspeicher), sodass eine spätere Sitzung – einschließlich eines im Hintergrund laufenden oder unbeaufsichtigten Agenten – bereits im angemeldeten Zustand starten kann. Der Status ist ebenso sensibel wie ein Passwort; daher wird er stets mit dem Installationsschlüssel der Plattform verschlüsselt, bevor er in die Status-Binärdatei gelangt, und erst beim Lesen über den <i>Verschlüsselungsdienst</i> der Plattform (dessen <i>symmetrische Verschlüsselung</i>) entschlüsselt. Dieser Dienst speichert oder gibt den Status niemals im Klartext zurück; ist kein Verschlüsselungsschlüssel installiert, lehnt er den Vorgang ab, anstatt auf Klartext zurückzugreifen. </p> <p><b>Gültigkeitsbereich.</b> Ein von einem Benutzer erstellter Pool ist standardmäßig so eingestellt, dass „owner“ = dieser Benutzer und „shared“ = „false“ ist, und kann nur von seinem Eigentümer ausgewählt werden. Ein Pool mit „shared = true“ – eine explizite Auswahl beim Speichern oder eine Bearbeitung durch einen Administrator, niemals ein Fallback – ist für jede Sitzung auswählbar, einschließlich einer unbeaufsichtigten: der beabsichtigte Anwendungsfall für „shared-login“. Die Auswahl gibt daher die eigenen Pools des Aufrufers sowie gemeinsam genutzte Pools zurück, und dieser Filter wird hier, auf dem Auswahlpfad, durchgesetzt, der niemals die Berechtigung des Modells abfragt: Die Auswahl eines Pools steuert einen Browser mit einer gespeicherten Anmeldung an; die gespeicherten Daten werden an niemanden weitergegeben. </p> <p><b>Das Lesen dieser Bytes ist eine andere Frage</b>, und die Modellebene beantwortet sie. Die seit #227 ausgelieferte Standardeinstellung ist der Eigentümer plus Administratoren – die &lt;SECURITY-config&gt; in tl-ai-browser.binarySecurity.config.xml, nach der „viewDocument“ über „ModelSecurity.canRead“ fragt. Das Teilen eines Anmeldedatensatzes macht den gespeicherten Sitzungsstatus daher nicht lesbar: Ein geteilter Pool, der durch einen unbeaufsichtigten Lauf gespeichert wurde, hat keinen Eigentümer und ist nur für Administratoren und das System lesbar. </p> <p><b>Jeder private Pool hat einen Eigentümer.</b> Beim Speichern eines privaten Pools wird ein null-Eigentümer abgelehnt, anstatt einen Eigentümerlosen Pool zu speichern. Ein solcher Pool hätte „shared = false“, ohne dass jemand dazu passt, sodass kein Aufrufer ihn jemals wieder auswählen könnte, während der Speichervorgang als erfolgreich gemeldet würde; und jeder Eigentümerlose Aufrufer würde sich einen Bucket pro Poolnamen teilen, sodass ein unbeaufsichtigter Lauf stillschweigend die gespeicherten Anmeldedaten eines anderen überschreiben würde. Das stillschweigende Zurücksetzen einer besitzerlosen Speicherung auf `shared = true` wird aus demselben Grund abgelehnt, aus dem dies ohnehin nicht die Standardeinstellung ist: Es würde einen Anmeldedatenspeicher in etwas verwandeln, das jede Sitzung hinter dem Rücken des Aufrufers lesen kann. </p> <p><b>Das Speichern eines gemeinsam genutzten Pools ist die zulässige Opt-in-Option.</b> Ein Speichervorgang, der „shared = true“ übergibt, fordert diesen Geltungsbereich an und erhält ihn: Der Pool wird als „shared“ markiert, ist für jeden Benutzer und jede Agent-Sitzung der Installation auswählbar und kann <em>ohne</em> Eigentümer gespeichert werden – was es einem unbeaufsichtigten Lauf ermöglicht, die benötigten Anmeldedaten zu erstellen. Der aktuelle Benutzer – sofern dieser identifizierbar ist – wird weiterhin als Eigentümer eines neu erstellten gemeinsam genutzten Pools aufgezeichnet, und zwar als Prüfpfad; der Pool wird lediglich zusätzlich als „gemeinsam genutzt“ gekennzeichnet. Die Sicherheitsvorkehrung besteht darin, dass der weitreichende Geltungsbereich explizit angefordert und in der Bestätigung namentlich genannt werden muss, nicht darin, dass er unerreichbar ist. Zwei Regeln verhindern, dass sich diese Opt-in-Einstellung implizit ausweitet: Ein bestehender Pool wird nur dann an Ort und Stelle aktualisiert, wenn er <em>bereits</em> gemeinsam genutzt wird – ein privater Pool wird niemals umgewandelt – und eine gemeinsame Speicherung wird abgelehnt, wenn der Aufrufer bereits einen privaten Pool mit diesem Namen besitzt, da bei der Auswahl weiterhin dieser private Pool bevorzugt würde und der gemeinsam genutzte Pool genau vor dem Aufrufer verborgen bliebe, der ihn erstellt hat. </p> <p> Er spiegelt den „ScreenshotService“ in seiner Funktionsweise wider: Er eröffnet <b>keine</b> eigene Transaktion. Der „pool-upsert“-Aufruf erfolgt über das Verb „browserSaveCookies“, ein „DATA_WRITE“-Tool, dessen Transaktion vom „TransactionScope“ der Agentenschleife eröffnet und bestätigt wird, sodass der Pool mit dem Durchlauf bestätigt wird. Programmatische Aufrufer (und Tests) stellen ihre eigene Transaktion bereit. </p>
