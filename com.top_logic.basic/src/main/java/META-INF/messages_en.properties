com.top_logic.basic.io.binary.scan.ClamAvScanner.Config.max-scan-size.tooltip = The maximum content size in bytes that is scanned, or <code>0</code> for no limit. <p> Content larger than this limit is not sent to the daemon; it is treated like an unreachable daemon (see <i>Unavailable policy</i>). The limit should not exceed the daemon's own <code>StreamMaxLength</code> setting. </p>
com.top_logic.basic.io.binary.scan.ClamAvScanner.Config.port = Port
com.top_logic.basic.io.binary.scan.ClamAvScanner.Config.port.tooltip = The TCP port the ClamAV daemon listens on.
