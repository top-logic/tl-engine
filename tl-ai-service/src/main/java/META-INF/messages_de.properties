com.top_logic.ai.service.AIService.tooltip = TopLogic-Dienst, der den Zugriff auf KI-Modelle �ber <i>LangChain4j</i> mit thread-sicherem Client-Pooling erm�glicht. <p> Dieser Dienst verwaltet mehrere <i>Chat-Modell-Fabrik-Instanzen</i>, die jeweils f�r ein bestimmtes KI-Modell konfiguriert sind. Die Modelle werden gepoolt und automatisch an den aktuellen <i>Interaktionskontext</i> gebunden und dann an den Pool zur�ckgegeben, wenn der Kontext zerst�rt wird. </p>
