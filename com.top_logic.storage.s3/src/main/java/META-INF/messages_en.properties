com.top_logic.storage.s3.S3BlobStore = S3blob store
com.top_logic.storage.s3.S3BlobStore.Config.access-key = Access key
com.top_logic.storage.s3.S3BlobStore.Config.access-key.tooltip = The access key ID for authenticating at the storage. <p> Access key and secret key are either both given or both empty. When both are empty, the credentials are taken from the default credentials provider chain of the AWS SDK (environment variables, <code>~/.aws/credentials</code>, IAM role of the instance or container). </p>
com.top_logic.storage.s3.S3BlobStore.Config.bucket = Bucket
com.top_logic.storage.s3.S3BlobStore.Config.bucket.tooltip = The name of the bucket holding the blobs. <p> The bucket must exist; it is not created by the store. </p>
com.top_logic.storage.s3.S3BlobStore.Config.class.tooltip = Implementation class of the store.
com.top_logic.storage.s3.S3BlobStore.Config.endpoint = Endpoint
com.top_logic.storage.s3.S3BlobStore.Config.endpoint.tooltip = The URL of the S3 service, e.g. <code>https://minio.example.com:9000</code>. <p> Empty for AWS S3, where the endpoint is derived from the region. Required for S3-compatible servers. </p>
com.top_logic.storage.s3.S3BlobStore.Config.kms-key-id = KMS key ID
com.top_logic.storage.s3.S3BlobStore.Config.kms-key-id.tooltip = The ID or ARN of the key used for the encryption mode SSE-KMS. <p> Empty to use the default key of the key management service. Ignored for other encryption modes. </p>
com.top_logic.storage.s3.S3BlobStore.Config.multipart-threshold = Multipart threshold
com.top_logic.storage.s3.S3BlobStore.Config.multipart-threshold.tooltip = The maximum size of content uploaded in a single request. <p> Content up to this size is buffered in memory and uploaded in one request. Larger content is uploaded in parts. The size is given in bytes, optionally with a unit, e.g. <code>16MB</code>. </p>
com.top_logic.storage.s3.S3BlobStore.Config.part-size = Part size
com.top_logic.storage.s3.S3BlobStore.Config.part-size.tooltip = The size of the parts of a multipart upload. <p> One part is buffered in memory per running upload. The size must be at least 5 MB. Since S3 accepts at most 10,000 parts per upload, the part size limits the size of a blob: the default of 8 MB allows blobs of up to 80 GB. </p>
com.top_logic.storage.s3.S3BlobStore.Config.path-style-access = Path style access
com.top_logic.storage.s3.S3BlobStore.Config.path-style-access.tooltip = Whether the bucket is addressed as part of the URL path (<code>https://host/bucket/key</code>) instead of the host name (<code>https://bucket.host/key</code>). <p> Most self-hosted S3-compatible servers (e.g. <code>MinIO</code>) require path-style access. </p>
com.top_logic.storage.s3.S3BlobStore.Config.prefix = Prefix
com.top_logic.storage.s3.S3BlobStore.Config.prefix.tooltip = Prefix of the object names of the blobs inside the bucket, e.g. <code>blobs/</code>. <p> The object name of a blob is this prefix directly followed by the key of the blob, so a prefix that is meant as directory must end with a slash. Several stores may share a bucket with different prefixes. Empty to store the blobs at the top level of the bucket. Objects under the prefix that are not blobs of the store, and objects in deeper directories below the prefix, are ignored. </p>
com.top_logic.storage.s3.S3BlobStore.Config.region = Region
com.top_logic.storage.s3.S3BlobStore.Config.region.tooltip = The region of the bucket, e.g. <code>eu-central-1</code>. <p> S3-compatible servers usually accept any region; the request signature is computed for the region given here. </p>
com.top_logic.storage.s3.S3BlobStore.Config.secret-key = Secret key
com.top_logic.storage.s3.S3BlobStore.Config.secret-key.tooltip = The secret key belonging to the access key. <p> The value is given encrypted in the configuration, or as plain text with the prefix <code>unencrypted:</code>. </p>
com.top_logic.storage.s3.S3BlobStore.Config.server-side-encryption = Server side encryption
com.top_logic.storage.s3.S3BlobStore.Config.server-side-encryption.tooltip = The server-side encryption the storage applies to stored blobs.
com.top_logic.storage.s3.S3BlobStore.tooltip = <i>Blob store</i> keeping each blob as an object in a bucket of AWS S3 or an S3-compatible object storage (e.g. <code>MinIO</code>, Ceph RGW, Garage, <code>SeaweedFS</code>). <p> The object of a blob is named by the configured prefix followed by the key of the blob. The bucket must exist. Content up to the multipart threshold is buffered in memory and uploaded in a single request; larger content and content of unknown size exceeding the threshold is streamed in a multipart upload, buffering one part at a time. A failed multipart upload is aborted; leftovers of interrupted uploads are removed by the cleanup of the store. </p> <p> Without configured access keys, the credentials are taken from the default credentials provider chain of the AWS SDK: environment variables, the <code>~/.aws/credentials</code> file, or the IAM role of the instance or container. </p>
com.top_logic.storage.s3.ServerSideEncryptionMode = Server side encryption mode
com.top_logic.storage.s3.ServerSideEncryptionMode.NONE = None
com.top_logic.storage.s3.ServerSideEncryptionMode.NONE.tooltip = No encryption is requested; the default encryption settings of the bucket apply.
com.top_logic.storage.s3.ServerSideEncryptionMode.SSE_KMS = SSE-KMS
com.top_logic.storage.s3.ServerSideEncryptionMode.SSE_KMS.tooltip = Encryption with a key of the key management service of the storage (SSE-KMS). <p> The key is configured in the store; without a key, the default key of the key management service is used. </p>
com.top_logic.storage.s3.ServerSideEncryptionMode.SSE_S3 = SSE-S3
com.top_logic.storage.s3.ServerSideEncryptionMode.SSE_S3.tooltip = Encryption with keys managed by the storage (SSE-S3, AES-256).
com.top_logic.storage.s3.ServerSideEncryptionMode.tooltip = Server-side encryption applied by the storage to the blobs of a <i>s3blob store</i>. <p> The content is encrypted and decrypted by the storage, transparently for the application. Range reads keep working. </p>
