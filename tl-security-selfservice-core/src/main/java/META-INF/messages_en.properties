class.com.top_logic.security.selfservice.I18NConstants.ERROR_NO_AUTHENTICATION_DEVICE__ID = The authentication device "{0}" for accounts created from invitations does not exist.
class.com.top_logic.security.selfservice.I18NConstants.ERROR_NO_PUBLIC_ADDRESS = The public address of the application is not configured and there is no current request, so no invitation link can be built. Set it with the variable "tl_host" (alias %HOST%), e.g. "https://app.example.com".
