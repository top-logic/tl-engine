class.com.top_logic.ai.service.agents.I18NConstants.ADAPTIVE_THINKING_NOT_SUPPORTED = Adaptives Denken wird von diesem Modell nicht unterstützt. Verwenden Sie stattdessen 'ENABLED'.
class.com.top_logic.ai.service.agents.I18NConstants.MAX_TOKENS_MUST_EXCEED_THINKING_BUDGET = Die maximalen Token müssen größer sein als die denkbaren Budget-Token.
class.com.top_logic.ai.service.agents.I18NConstants.MAX_TOKENS_REQUIRED_WHEN_THINKING_ENABLED = Die maximale Anzahl von Token ist erforderlich, wenn der Denktyp AKTIVIERT ist.
class.com.top_logic.ai.service.agents.I18NConstants.THINKING_BUDGET_REQUIRED_WHEN_ENABLED = Das Denkbudget ist erforderlich, wenn die Denkart AKTIVIERT ist.
com.top_logic.ai.service.AIService = AI-Dienst
com.top_logic.ai.service.AIService.Config.default-model = Standardmodell
com.top_logic.ai.service.AIService.Config.default-model.tooltip = Der Standardmodellname, der verwendet wird, wenn kein Modell explizit angegeben wird. <p> Dieser sollte mit einem der in <i>Factories</i> konfigurierten Modellnamen übereinstimmen. Wird er nicht angegeben oder ist er null, wird das Modell der ersten Fabrik als Standard verwendet. </p>
com.top_logic.ai.service.AIService.Config.factories = Fabriken
com.top_logic.ai.service.AIService.Config.factories.tooltip = Die konfigurierten Modellfabriken. <p> Jede Fabrik wird durch den Modellnamen identifiziert, den sie produziert, und verwaltet einen Pool von Chat-Modell-Instanzen für dieses spezifische Modell. </p>
com.top_logic.ai.service.AIService.tooltip = TopLogic-Dienst, der den Zugriff auf KI-Modelle über <i>LangChain4j</i> mit thread-sicherem Client-Pooling ermöglicht. <p> Dieser Dienst verwaltet mehrere <i>Chat-Modell-Fabrik-Instanzen</i>, die jeweils für ein bestimmtes KI-Modell konfiguriert sind. Die Modelle werden gepoolt und automatisch an den aktuellen <i>Interaktionskontext</i> gebunden und dann an den Pool zurückgegeben, wenn der Kontext zerstört wird. </p>
com.top_logic.ai.service.ChatModelFactory = Chat-Modellfabrik
com.top_logic.ai.service.ChatModelFactory.Config.max-idle-models = Maximale Modelle im Leerlauf
com.top_logic.ai.service.ChatModelFactory.Config.max-idle-models.tooltip = Die maximale Anzahl der inaktiven Chat-Modelle, die im Pool gehalten werden. <p> Voreinstellung: 5 </p>
com.top_logic.ai.service.ChatModelFactory.Config.max-pool-size = Maximale Poolgröße
com.top_logic.ai.service.ChatModelFactory.Config.max-pool-size.tooltip = Die maximale Anzahl von Chatmodellen im Pool. <p> Standard: 10 </p>
com.top_logic.ai.service.ChatModelFactory.Config.models = Modelle
com.top_logic.ai.service.ChatModelFactory.Config.models.tooltip = Die Modellnamen (z. B. "gpt-4o, gpt-3.5-turbo" oder "claude-3-opus, claude-3-sonnet"). <p> Kommagetrennte Liste von Modellnamen. Jeder Modellname dient als eindeutiger Bezeichner und bestimmt, welche Modelle angefordert werden können. Alle aufgelisteten Modelle verwenden dieselben API-Anmeldeinformationen von dieser Fabrik. </p>
com.top_logic.ai.service.ChatModelFactory.tooltip = Abstrakte Fabrik zum Erstellen und Verwalten von gepoolten <i>Chat-Modell-Instanzen</i>. <p> Diese Fabrik erstellt Objektpools für <i>LangChain4j-Chatmodell-Instanzen</i>. Jede Fabrik ist für einen bestimmten AI-Anbieter konfiguriert und kann Pools für mehrere Modelle dieses Anbieters erstellen. </p> <p> Konkrete Implementierungen existieren für verschiedene AI-Anbieter: </p> <ul> <li><i>OpenAI-Chatmodellfabrik</i>: Für OpenAI-Modelle (GPT-4o, GPT-3.5-turbo, etc.)</li> <li><i>anthropische Chat-Modell-Fabrik</i>: Für Anthropic-Modelle (Claude, etc.)</li> <li><i>mistral chat model factory</i>: Für Mistral-KI-Modelle</li> </ul>
com.top_logic.ai.service.agents.AgentConfig = Konfiguration des Agenten
com.top_logic.ai.service.agents.AgentConfig$ResponseFormatOption = Option Antwortformat
com.top_logic.ai.service.agents.AgentConfig$ResponseFormatOption.tooltip = Antwortformat-Optionen, die von OpenAI/Mistral-Buildern unterstützt werden.
com.top_logic.ai.service.agents.AgentConfig.ResponseFormatOption.DEFAULT = Standard
com.top_logic.ai.service.agents.AgentConfig.ResponseFormatOption.DEFAULT.tooltip = Verwenden Sie das Standardantwortformat des Anbieters.
com.top_logic.ai.service.agents.AgentConfig.ResponseFormatOption.JSON = JSON
com.top_logic.ai.service.agents.AgentConfig.ResponseFormatOption.JSON.tooltip = JSON-Antwortformat.
com.top_logic.ai.service.agents.AgentConfig.ResponseFormatOption.TEXT = Text
com.top_logic.ai.service.agents.AgentConfig.ResponseFormatOption.TEXT.tooltip = Antwortformat im Klartext.
com.top_logic.ai.service.agents.AgentConfig.delegations = Delegationen
com.top_logic.ai.service.agents.AgentConfig.delegations.tooltip = Andere Agenten, an die dieser Agent delegieren kann, ausgewählt nach Namen. <p> Für jeden hier aufgeführten Namen eines Zielagenten wird zur Laufzeit von der <i>Agentenregistrierung</i> ein eigenes delegate_to_<name> Tool mit einer selbstbeschreibenden <i>Tool-Spezifikation</i> erstellt. </p>
com.top_logic.ai.service.agents.AgentConfig.description = Beschreibung
com.top_logic.ai.service.agents.AgentConfig.description.tooltip = Kurze Beschreibung des Zwecks dieses Agenten. <p> Wird als Werkzeugbeschreibung verwendet, wenn andere Agenten an diesen Agenten delegieren. Zum Beispiel: "Nur-Lese-Modellinspektion: Module, Typen, Teile, Anmerkungen, Suche". </p>
com.top_logic.ai.service.agents.AgentConfig.disable-parallel-tool-use = Parallele Werkzeugnutzung deaktivieren
com.top_logic.ai.service.agents.AgentConfig.disable-parallel-tool-use.tooltip = Ob Anthropic Werkzeugaufrufe parallel ausführen darf. <p> Nur für Anthropic-Modelle sichtbar. </p>
com.top_logic.ai.service.agents.AgentConfig.entry-point = Einstiegspunkt
com.top_logic.ai.service.agents.AgentConfig.entry-point.tooltip = Ob dieser Agent der Chat-Einstiegspunkt ist. <p> Es muss genau ein Agent in der <i>Agentenregistrierung</i> als Einstiegspunkt markiert sein. Das Chatsystem verwendet diesen Agenten, um eingehende Benutzernachrichten zu bearbeiten. </p>
com.top_logic.ai.service.agents.AgentConfig.frequency-penalty = Frequency Penalty
com.top_logic.ai.service.agents.AgentConfig.frequency-penalty.tooltip = OpenAI Frequency Penalty. <p> Nur für OpenAI-Modelle sichtbar. </p>
com.top_logic.ai.service.agents.AgentConfig.is-adaptive-thinking-capable = Unterstützt adaptives Denken
com.top_logic.ai.service.agents.AgentConfig.is-adaptive-thinking-capable.tooltip = Ob das gewählte Modell adaptives Denken unterstützt.
com.top_logic.ai.service.agents.AgentConfig.is-anthropic-provider = Ist Anthropic-Anbieter
com.top_logic.ai.service.agents.AgentConfig.is-anthropic-provider.tooltip = Ob das ausgewählte Modell zum Anthropic-Anbieter gehört.
com.top_logic.ai.service.agents.AgentConfig.is-mistral-provider = Ist Mistral-Anbieter
com.top_logic.ai.service.agents.AgentConfig.is-mistral-provider.tooltip = Ob das ausgewählte Modell zum Mistral-Anbieter gehört.
com.top_logic.ai.service.agents.AgentConfig.is-openai-provider = Ist OpenAI-Anbieter
com.top_logic.ai.service.agents.AgentConfig.is-openai-provider.tooltip = Ob das ausgewählte Modell zum OpenAI-Anbieter gehört.
com.top_logic.ai.service.agents.AgentConfig.is-reasoning-effort-capable = Unterstützt Reasoning-Aufwand
com.top_logic.ai.service.agents.AgentConfig.is-reasoning-effort-capable.tooltip = Ob das gewählte Modell den Reasoning-Aufwand unterstützt.
com.top_logic.ai.service.agents.AgentConfig.is-thinking-capable = Unterstützt erweitertes Denken
com.top_logic.ai.service.agents.AgentConfig.is-thinking-capable.tooltip = Ob das aktuell ausgewählte Modell erweitertes Denken unterstützt. <p> Diese abgeleitete Eigenschaft ist wahr, wenn das Modell <i>"Denken aktiviert"</i> oder <i>"Denken adaptiv"</i> unterstützt. Sie steuert die Sichtbarkeit von thinking-bezogenen Feldern. </p>
com.top_logic.ai.service.agents.AgentConfig.max-retries = Wiederholungsversuche
com.top_logic.ai.service.agents.AgentConfig.max-retries.tooltip = Maximale Wiederholungsversuche für vorübergehende Anbieter/API-Ausfälle.
com.top_logic.ai.service.agents.AgentConfig.max-tokens = Token
com.top_logic.ai.service.agents.AgentConfig.max-tokens.tooltip = Die maximale Anzahl der Ausgabe-Token für die Modellantwort. <p> Erforderlich, wenn der <i>Typ Thinking</i> <i>aktiviert</i> ist. </p>
com.top_logic.ai.service.agents.AgentConfig.model = Modell
com.top_logic.ai.service.agents.AgentConfig.model.tooltip = Der LLM-Modellname, der für diesen Agenten verwendet werden soll (z. B. "claude-sonnet-4-20250514"). <p> Die Optionen werden aus den im <i>AI-Dienst</i> registrierten Modellen ausgefüllt. </p>
com.top_logic.ai.service.agents.AgentConfig.presence-penalty = Presence Penalty
com.top_logic.ai.service.agents.AgentConfig.presence-penalty.tooltip = OpenAI Presence Penalty. <p> Nur sichtbar für OpenAI-Modelle. </p>
com.top_logic.ai.service.agents.AgentConfig.reasoning-effort = Reasoning-Aufwand
com.top_logic.ai.service.agents.AgentConfig.reasoning-effort.tooltip = Der Reasoning-Aufwand für OpenAI Reasoning-Modelle. <p> Nur sichtbar für Modelle, die Reasoning-Aufwand unterstützen (OpenAI o-series, GPT-5). </p>
com.top_logic.ai.service.agents.AgentConfig.response-format = Antwortformat
com.top_logic.ai.service.agents.AgentConfig.response-format.tooltip = Präferenz für das Antwortformat. <p> Nur sichtbar für Anbieter, die die Steuerung des Antwortformats unterstützen. </p>
com.top_logic.ai.service.agents.AgentConfig.return-thinking = Denkinhalte zurückgeben
com.top_logic.ai.service.agents.AgentConfig.return-thinking.tooltip = Ob das Denken des Modells in die Antwort einbezogen werden soll. <p> Nur sichtbar, wenn das Modell das Denken unterstützt und ein Denktyp ausgewählt ist. Bei "true" wird der Denkinhalt neben dem Antworttext eingefügt. </p>
com.top_logic.ai.service.agents.AgentConfig.seed = Seed
com.top_logic.ai.service.agents.AgentConfig.seed.tooltip = Seed für deterministische Ausgabe. Wenn diese Option gesetzt ist, sollten wiederholte Anfragen mit demselben Seed und denselben Parametern ähnliche Ergebnisse liefern. <p> Nützlich für Tests und Fehlersuche. Nur für OpenAI-Modelle sichtbar. </p>
com.top_logic.ai.service.agents.AgentConfig.send-thinking = Denkinhalte mitsenden
com.top_logic.ai.service.agents.AgentConfig.send-thinking.tooltip = Ob vorherige Denkblöcke in Folgemeldungen gesendet werden sollen. <p> Nur sichtbar, wenn das Modell Denken unterstützt und ein Denktyp ausgewählt ist. Bei "true" wird der Denkinhalt aus früheren Runden in den an das Modell gesendeten Gesprächsverlauf aufgenommen. </p>
com.top_logic.ai.service.agents.AgentConfig.skills = Skills
com.top_logic.ai.service.agents.AgentConfig.skills.tooltip = Durch Kommata getrennte Liste von Skill-IDs, die für diesen Agenten verfügbar sind. <p> Skills werden durch ihren registrierten Namen in der <i>Agentenregistrierungskonfiguration</i> referenziert. </p>
com.top_logic.ai.service.agents.AgentConfig.stop-sequences = Stopp-Sequenzen
com.top_logic.ai.service.agents.AgentConfig.stop-sequences.tooltip = Optionale Stoppsequenzen, die die Generierung beenden, wenn sie angetroffen werden.
com.top_logic.ai.service.agents.AgentConfig.system-prompt = System-Prompt
com.top_logic.ai.service.agents.AgentConfig.system-prompt.tooltip = Die System-Prompt, die das Verhalten und die Anweisungen dieses Agenten definiert.
com.top_logic.ai.service.agents.AgentConfig.temperature = Temperatur
com.top_logic.ai.service.agents.AgentConfig.temperature.tooltip = Die Abtasttemperatur für das Modell (0,0 bis 1,0). <p> Niedrigere Werte machen die Ausgabe deterministischer, höhere Werte machen sie kreativer. </p>
com.top_logic.ai.service.agents.AgentConfig.thinking-budget-tokens = Denkbudget (Token)
com.top_logic.ai.service.agents.AgentConfig.thinking-budget-tokens.tooltip = Die maximale Anzahl von Token, die das Modell für sein internes Denken verwenden darf. <p> Erforderlich, wenn <i>der Denktyp</i> <i>aktiviert</i> ist. Nur sichtbar, wenn das Modell Denken unterstützt und ein Denktyp ausgewählt ist. </p>
com.top_logic.ai.service.agents.AgentConfig.thinking-type = Denktyp
com.top_logic.ai.service.agents.AgentConfig.thinking-type.tooltip = Der Denktyp für die erweiterte Denkunterstützung. <p> Nur sichtbar, wenn das ausgewählte Modell Denken unterstützt (Anthropic-Modelle). <i>Adaptiv</i> lässt das Modell entscheiden, wann es denkt. <i>Aktiviert</i> erzwingt das Denken bei jeder Anfrage und erfordert das Setzen von <i>Denk-Budget-Token</i>. </p>
com.top_logic.ai.service.agents.AgentConfig.timeout-seconds = Zeitüberschreitung
com.top_logic.ai.service.agents.AgentConfig.timeout-seconds.tooltip = Anfrage-Timeout in Sekunden.
com.top_logic.ai.service.agents.AgentConfig.tools = Werkzeuge
com.top_logic.ai.service.agents.AgentConfig.tools.tooltip = Die für diesen Agenten verfügbaren Standardwerkzeuge, ausgewählt nach Namen. <p> Jeder Name steht für eine bekannte Werkzeugklasse. Die Werkzeuge werden zur Laufzeit von der <i>Agentenregistrierung</i> instanziiert. </p>
com.top_logic.ai.service.agents.AgentConfig.tooltip = Konfiguration für einen einzelnen Agenten in der <i>Agentenregistrierung</i>. <p> Jeder Agent wird durch einen eindeutigen Namen identifiziert (durch <i>benannte Konfiguration obligatorisch</i>) und definiert das LLM-Modell, optionale Denkparameter, die Systemaufforderung und verfügbare Werkzeuge und Fähigkeiten. </p> <p> Denk-Parameter<i>(Denk-Typ</i>, <i>Denk-Budget-Token</i>, <i>Return Thinking</i>, <i>Send Thinking</i>) sind nur sichtbar, wenn das ausgewählte Modell erweitertes Denken unterstützt (derzeit Anthropic-Modelle). Wenn die Option <i>aktiviert</i> ist, werden die <i>Denkbudget-Token</i> und <i>Maximum-Token</i> obligatorisch. </p>
com.top_logic.ai.service.agents.AgentConfig.top-k = Top-K
com.top_logic.ai.service.agents.AgentConfig.top-k.tooltip = Top-k-Sampling-Parameter. <p> Nur sichtbar für Anthropic-Modelle. </p>
com.top_logic.ai.service.agents.AgentConfig.top-p = Top-P
com.top_logic.ai.service.agents.AgentConfig.top-p.tooltip = Top-P (Nucleus-Sampling) begrenzt die Token-Auswahl auf die kleinste Menge, deren kumulative Wahrscheinlichkeit diesen Schwellenwert überschreitet (0,0 bis 1,0). <p> Niedrigere Werte (z. B. 0,1) machen die Ausgabe fokussierter, höhere Werte (z. B. 0,9) erlauben mehr Vielfalt. </p>
com.top_logic.ai.service.agents.AgentRegistry = Agenten-Registrierung
com.top_logic.ai.service.agents.AgentRegistry.Config.agents = Agenten
com.top_logic.ai.service.agents.AgentRegistry.Config.agents.tooltip = Die konfigurierten Agenten, geordnet nach Agentennamen. <p> Jeder Eintrag definiert einen Agenten mit seinem Modell, seiner Eingabeaufforderung, seinen Werkzeugen und Fähigkeiten. </p>
com.top_logic.ai.service.agents.AgentRegistry.Config.skills = Skills
com.top_logic.ai.service.agents.AgentRegistry.Config.skills.tooltip = Die konfigurierten Fertigkeiten, geordnet nach dem Namen der Fertigkeit. <p> Jeder Eintrag definiert einen wiederverwendbaren Skill mit seiner Beschreibung und seinem Prompt-Inhalt. Skills werden über den Namen von <i>Skills</i><i>(Agentenkonfiguration</i>) referenziert. </p>
com.top_logic.ai.service.agents.AgentRegistry.tooltip = Register der zur Laufzeit konfigurierbaren Agenten und Fähigkeiten. <p> Jeder Agent wird in XML über die <i>Agentenkonfiguration</i> deklariert und enthält seinen LLM-Modellnamen, optionale Denkparameter, Systemaufforderung, Werkzeuge und Fähigkeiten. Skills werden über die <i>Skill-Konfiguration</i> deklariert. Dieser Dienst validiert die Konfigurationen beim Start und bietet Factory-Methoden, um daraus vollständig verdrahtete <i>LangChain4j-Agenten</i> zu erstellen. </p> <p> Die Modellbildung ist anbieterabhängig: Wenn das referenzierte Modell von einem bekannten Anbieter bereitgestellt wird<i>(anthropic chat model factory</i>, <i>mistral chat model factory</i>, <i>open AI chat model factory</i>), werden die Parameter des Agenten (Denken, Temperatur, maximale Token) auf eine neue, ungepoolte Modellinstanz angewendet. Andernfalls wird das gepoolte Modell des <i>KI-Dienstes</i> als Fallback zurückgegeben. </p>
com.top_logic.ai.service.agents.ReasoningEffort = Reasoning-Aufwand
com.top_logic.ai.service.agents.ReasoningEffort.HIGH = Hoch
com.top_logic.ai.service.agents.ReasoningEffort.HIGH.tooltip = Hoher Reasoning-Aufwand.
com.top_logic.ai.service.agents.ReasoningEffort.LOW = Niedrig
com.top_logic.ai.service.agents.ReasoningEffort.LOW.tooltip = Geringer Reasoning-Aufwand.
com.top_logic.ai.service.agents.ReasoningEffort.MEDIUM = Mittel
com.top_logic.ai.service.agents.ReasoningEffort.MEDIUM.tooltip = Mittlerer Reasoning-Aufwand (Standard für die meisten Reasoning-Modelle).
com.top_logic.ai.service.agents.ReasoningEffort.MINIMAL = Minimal
com.top_logic.ai.service.agents.ReasoningEffort.MINIMAL.tooltip = Minimaler Reasoning-Aufwand (GPT-5-Familie).
com.top_logic.ai.service.agents.ReasoningEffort.NONE = Kein Reasoning
com.top_logic.ai.service.agents.ReasoningEffort.NONE.tooltip = Keine Argumentation.
com.top_logic.ai.service.agents.ReasoningEffort.XHIGH = Extra hoch
com.top_logic.ai.service.agents.ReasoningEffort.XHIGH.tooltip = Besonders hohe Denkleistung (GPT-5.1-codex-max, GPT-5.2).
com.top_logic.ai.service.agents.ReasoningEffort.tooltip = Von OpenAI-Schlussfolgermodellen (o-Serie, GPT-5) unterstützte Reasoning-Aufwand-Stufen. <p> Dies ist eine Obermenge aller bekannten Werte in den Modellfamilien. Nicht jedes Modell unterstützt jede Stufe; die verfügbaren Optionen werden dynamisch auf der Grundlage des ausgewählten Modells gefiltert. </p>
com.top_logic.ai.service.agents.ThinkingType = Denktyp
com.top_logic.ai.service.agents.ThinkingType.ADAPTIVE = Adaptiv
com.top_logic.ai.service.agents.ThinkingType.ADAPTIVE.tooltip = Das Modell entscheidet selbständig, wann und wie viel es denkt.
com.top_logic.ai.service.agents.ThinkingType.ENABLED = Aktiviert
com.top_logic.ai.service.agents.ThinkingType.ENABLED.tooltip = Das Modell verwendet immer das erweiterte Denken. Erfordert das Setzen von <i>Denk-Budget-Token</i><i>(Agenten-Konfiguration</i>).
com.top_logic.ai.service.agents.ThinkingType.tooltip = Erweiterte Denkweisen werden von LLM-Anbietern unterstützt (derzeit Anthropic).
com.top_logic.ai.service.providers.AnthropicChatModelFactory = Anthropic Chat-Modellfabrik\ 
com.top_logic.ai.service.providers.AnthropicChatModelFactory.Config.api-key = API-Schlüssel
com.top_logic.ai.service.providers.AnthropicChatModelFactory.Config.api-key.tooltip = Der Anthropic-API-Schlüssel für die Authentifizierung.
com.top_logic.ai.service.providers.AnthropicChatModelFactory.Config.base-url = Basis-URL
com.top_logic.ai.service.providers.AnthropicChatModelFactory.Config.base-url.tooltip = Die Basis-URL für die Anthropic-API. <p> Standard: https://api.anthropic.com/v1 </p>
com.top_logic.ai.service.providers.AnthropicChatModelFactory.Config.version = Version
com.top_logic.ai.service.providers.AnthropicChatModelFactory.Config.version.tooltip = Die zu verwendende API-Version. <p> Optional. Anthropic verwendet versionierte APIs. Wenn nicht angegeben, wird der Standardwert von <i>LangChain4j</i> verwendet. </p>
com.top_logic.ai.service.providers.AnthropicChatModelFactory.tooltip = Fabrik zur Erstellung von Anthropic-Chatmodell-Instanzen. <p> Diese Fabrik erstellt <i>Chatmodell-Instanzen</i> unter Verwendung der Anthropic-API für Claude-Modelle. </p>
com.top_logic.ai.service.providers.MistralChatModelFactory = Mistral Chat Modellfabrik
com.top_logic.ai.service.providers.MistralChatModelFactory.Config.api-key = API-Schlüssel
com.top_logic.ai.service.providers.MistralChatModelFactory.Config.api-key.tooltip = Der Mistral AI API Schlüssel für die Authentifizierung.
com.top_logic.ai.service.providers.MistralChatModelFactory.Config.base-url = Basis-URL
com.top_logic.ai.service.providers.MistralChatModelFactory.Config.base-url.tooltip = Die Basis-URL für die Mistral AI API. <p> Standard: https://api.mistral.ai/v1 </p>
com.top_logic.ai.service.providers.MistralChatModelFactory.tooltip = Fabrik zur Erstellung von Mistral AI Chat-Modell-Instanzen. <p> Diese Fabrik erstellt <i>Chat-Modell-Instanzen</i> unter Verwendung der Mistral AI API für Modelle wie Mistral Large, Mistral Medium, etc. </p>
com.top_logic.ai.service.providers.ModelCapability = Modellfähigkeit
com.top_logic.ai.service.providers.ModelCapability.REASONING_EFFORT = Reasoning-Aufwand
com.top_logic.ai.service.providers.ModelCapability.REASONING_EFFORT.tooltip = Unterstützt den Parameter reasoning effort. <p> OpenAI reasoning_effort für o-series und GPT-5 Modelle. </p>
com.top_logic.ai.service.providers.ModelCapability.THINKING_ADAPTIVE = Adaptives Denken
com.top_logic.ai.service.providers.ModelCapability.THINKING_ADAPTIVE.tooltip = Unterstützt adaptives Denken, bei dem das Modell entscheidet, wann und wie viel es denken soll. <p> Anthropisches Denken: {type: "adaptive"}. Wird nur von neueren Claude-Modellen (Opus 4.6, Sonnet 4.6) unterstützt. </p>
com.top_logic.ai.service.providers.ModelCapability.THINKING_ENABLED = Denken ermöglicht
com.top_logic.ai.service.providers.ModelCapability.THINKING_ENABLED.tooltip = Unterstützt explizit erweitertes Denken mit einem Token-Budget. <p> Anthropisches Denken: {type: "enabled", budget_tokens: N}. </p>
com.top_logic.ai.service.providers.ModelCapability.tooltip = Fähigkeiten, die ein LLM-Modell über die grundlegende Texterstellung hinaus unterstützen kann. <p> Wird von <code>com.top_logic.ai.service.ChatModelFactory#getModelCapabilities(String)</code> verwendet, um die Fähigkeiten eines Modells zu melden. Die Agenten-Konfigurationsschnittstelle verwendet diese, um die Sichtbarkeit von Feldern zu steuern und Parameterkombinationen zu validieren. </p>
com.top_logic.ai.service.providers.OpenAIChatModelFactory = OpenAI Chat-Modellfabrik
com.top_logic.ai.service.providers.OpenAIChatModelFactory.Config.api-key = API-Schlüssel
com.top_logic.ai.service.providers.OpenAIChatModelFactory.Config.api-key.tooltip = Der <i>OpenAI-API-Schlüssel</i> für die Authentifizierung.
com.top_logic.ai.service.providers.OpenAIChatModelFactory.Config.base-url = Basis-URL
com.top_logic.ai.service.providers.OpenAIChatModelFactory.Config.base-url.tooltip = Die Basis-URL für die <i>OpenAI-API</i>. <p> Standard: https://api.openai.com/v1 </p> <p> Sie können diesen Wert überschreiben, um einen anderen Endpunkt zu verwenden, z. B. einen Azure <i>OpenAI-Einsatz</i> oder einen lokalen Proxy-Server. </p>
com.top_logic.ai.service.providers.OpenAIChatModelFactory.Config.organization = Organisation
com.top_logic.ai.service.providers.OpenAIChatModelFactory.Config.organization.tooltip = Die <i>OpenAI-Organisations-ID</i>. <p> Optional. Für Benutzer, die mehreren Organisationen angehören, können Sie angeben, welche Organisation für eine API-Anfrage verwendet wird. </p>
com.top_logic.ai.service.providers.OpenAIChatModelFactory.tooltip = Fabrik zur Erstellung von <i>OpenAI-Chatmodell-Instanzen</i>. <p> Diese Fabrik erstellt <i>Chatmodell-Instanzen</i> unter Verwendung der <i>OpenAI-API</i> (oder kompatibler APIs wie Azure <i>OpenAI</i>). </p>
com.top_logic.ai.service.scripting.Converters.htmlToMarkdown = HTML zu Markdown
com.top_logic.ai.service.scripting.Converters.htmlToMarkdown.param.html.tooltip = Text im HTML-Format.
com.top_logic.ai.service.scripting.Converters.htmlToMarkdown.return = Markdown-formatierter Text.
com.top_logic.ai.service.scripting.Converters.htmlToMarkdown.tooltip = Konvertiert HTML in <i>Markdown</i>.
com.top_logic.ai.service.scripting.Converters.markdownToHtml = Markdown zu HTML
com.top_logic.ai.service.scripting.Converters.markdownToHtml.param.markdown.tooltip = Text im <i>Markdown-Format</i>.
com.top_logic.ai.service.scripting.Converters.markdownToHtml.return = HTML-Fragment, das gerendert werden kann.
com.top_logic.ai.service.scripting.Converters.markdownToHtml.tooltip = Konvertiert <i>Markdown</i> in HTML.
com.top_logic.ai.service.scripting.Converters.markdownToHtmlString = Markdown zu HTML-String
com.top_logic.ai.service.scripting.Converters.markdownToHtmlString.param.markdown.tooltip = Text im <i>Markdown-Format</i>.
com.top_logic.ai.service.scripting.Converters.markdownToHtmlString.return = HTML-Zeichenfolge.
com.top_logic.ai.service.scripting.Converters.markdownToHtmlString.tooltip = Konvertiert <i>Markdown</i> in eine HTML-Zeichenkette.
com.top_logic.ai.service.scripting.OpenAIScriptFunctions.callTool = Tool aufrufen
com.top_logic.ai.service.scripting.OpenAIScriptFunctions.callTool.param.parameters.tooltip = Eine Zuordnung von Parameternamen zu Werten oder null, wenn das Werkzeug keine Parameter hat.
com.top_logic.ai.service.scripting.OpenAIScriptFunctions.callTool.param.toolName.tooltip = Der qualifizierte Name des aufzurufenden Werkzeugs.
com.top_logic.ai.service.scripting.OpenAIScriptFunctions.callTool.return = Das Ergebnis der Ausführung des Werkzeugs in Form einer Zeichenkette.
com.top_logic.ai.service.scripting.OpenAIScriptFunctions.callTool.tooltip = Ruft ein Tool manuell mit den angegebenen Parametern auf. <p> Diese Funktion ermöglicht den direkten Aufruf von registrierten Werkzeugen aus TL-Script. Das Werkzeug wird durch seinen qualifizierten Namen im Format Fabrik-Name.Werkzeug-Name identifiziert. </p> <p> Die Parameter können als Map übergeben werden, deren Schlüssel mit den Parameternamen des Werkzeugs übereinstimmen, oder als Positionsargumente, falls das Werkzeug diese akzeptiert. Die Funktion gibt das Ergebnis des Werkzeugs als Zeichenkette zurück. </p> <p> Beispiel für die Verwendung in TL-Script: </p> <pre> aiCallTool("tlscript.listTLScriptFunctions", map()) aiCallTool("tlscript.getTLScriptFunctionDocumentation", map("functionName" -&gt; "list")) </pre>
com.top_logic.ai.service.scripting.OpenAIScriptFunctions.chat = Chat
com.top_logic.ai.service.scripting.OpenAIScriptFunctions.chat.param.messages.tooltip = Eine Liste von Nachrichten. Jede Nachricht kann sein: <ul> <li>Zeichenkette: Wird als Benutzertextnachricht behandelt</li> <li>Karte mit "Rolle" und "Inhalt": Explizite Rolle (System/Benutzer/Assistent). Der Inhalt kann eine Zeichenkette, binäre Daten oder eine Liste mit gemischtem Inhalt sein.</li> <li>Binäre Daten: Werden als Bild-/Dokumentennachricht des Benutzers behandelt</li> </ul>
com.top_logic.ai.service.scripting.OpenAIScriptFunctions.chat.param.model.tooltip = Der zu verwendende Modellname (z. B. "gpt-4o", "gpt-3.5-turbo") oder null, um das im <i>offenen AI-Dienst</i> konfigurierte Standardmodell zu verwenden.
com.top_logic.ai.service.scripting.OpenAIScriptFunctions.chat.param.responseFormat.tooltip = Die Spezifikation des Antwortformats. Kann sein: <ul> <li>Null: Keine spezifische Formatanforderung</li> <li>Zeichenfolge "text" oder "json": Einfacher Formattyp</li> <li>Karte mit den Feldern "name" und "schema", die ein JSON-Schema für eine strukturierte Ausgabe beschreiben.</li> </ul>
com.top_logic.ai.service.scripting.OpenAIScriptFunctions.chat.param.tools.tooltip = Eine Sammlung von qualifizierten Werkzeugnamen, die dem KI-Agenten zur Verfügung gestellt werden sollen (z. B. ["mytools.calculateSum", "texttools.formatText"]), oder null, um keine Werkzeuge bereitzustellen.
com.top_logic.ai.service.scripting.OpenAIScriptFunctions.chat.return = Der Antworttext des Assistenten.
com.top_logic.ai.service.scripting.OpenAIScriptFunctions.chat.tooltip = Sendet eine Multiturn-Konversation an die Chat-Abschluss-API. <p> Nachrichten können Strings, Maps mit Rolle/Inhalt oder Listen sein. Der Inhalt kann aus Textstrings oder <i>binären Daten</i> für Bilder und Dokumente bestehen. </p>
com.top_logic.ai.service.scripting.OpenAIScriptFunctions.models = Modelle
com.top_logic.ai.service.scripting.OpenAIScriptFunctions.models.return = Eine unveränderliche Liste mit allen konfigurierten Modellnamen.
com.top_logic.ai.service.scripting.OpenAIScriptFunctions.models.tooltip = Gibt eine Liste aller verfügbaren Modellnamen aus dem <i>KI-Dienst</i> zurück. <p> Die Modellnamen können an die <i>Chat-Funktion</i> übergeben werden, um das zu verwendende KI-Modell auszuwählen. Die zurückgegebene Liste sorgt für eine konsistente Reihenfolge bei allen Aufrufen. </p>
com.top_logic.ai.service.scripting.OpenAIScriptFunctions.toolInfo = Werkzeug-Infos
com.top_logic.ai.service.scripting.OpenAIScriptFunctions.toolInfo.param.toolName.tooltip = Der qualifizierte Name des Werkzeugs.
com.top_logic.ai.service.scripting.OpenAIScriptFunctions.toolInfo.return = Eine Karte, die die Metadaten des Werkzeugs mit der oben beschriebenen Struktur enthält, oder null, wenn das Werkzeug nicht gefunden wird.
com.top_logic.ai.service.scripting.OpenAIScriptFunctions.toolInfo.tooltip = Ruft detaillierte Informationen über ein registriertes Werkzeug ab. <p> Diese Funktion gibt Metadaten über ein Werkzeug zurück, einschließlich seines Namens, seiner Beschreibung und seiner Parameterspezifikationen. Das Werkzeug wird durch seinen qualifizierten Namen im Format Fabrik-Name.Werkzeug-Name identifiziert. </p> <p> Die zurückgegebene Karte enthält: </p> <ul> <li>name - Einfacher Name des Werkzeugs (ohne Fabrikpräfix)</li> <li>qualifiedName - Der vollständig qualifizierte Name des Werkzeugs</li> <li>description - Eine Beschreibung der Funktion des Werkzeugs (optional, kann fehlen)</li> <li>parameters - Eine Liste von Parameterspezifikationen, wobei jeder Parameter eine Karte mit Namen (String) und erforderlichen (booleschen) Feldern ist</li> </ul> <p> Beispiel für die Verwendung in TL-Script: </p> <pre> // Ermittelt Informationen für ein Werkzeug ohne Parameter aiToolInfo("tlscript.listTLScriptFunctions") // Rückgabe: // { // "name": "listTLScriptFunctions", // "qualifiedName": "tlscript.listTLScriptFunctions", // "description": "List all available TLScript functions...", // "parameters": [] // } // Ermittelt Informationen zu einem Werkzeug mit Parametern aiToolInfo("tlscript.getTLScriptFunctionDocumentation") // Rückgabe: // { // "name": "getTLScriptFunctionDocumentation", // "qualifiedName": "tlscript.getTLScriptFunctionDocumentation", // "description": "Get detailed documentation for a specific TLScript function...", // "parameters": [ // { // "name": "functionName", // "required": true // } // ] // } // Nicht existierendes Werkzeug aiToolInfo("nicht existierendes.Werkzeug") // Rückgabe: null </pre>
com.top_logic.ai.service.scripting.OpenAIScriptFunctions.tools = Werkzeuge
com.top_logic.ai.service.scripting.OpenAIScriptFunctions.tools.return = Eine Liste mit allen registrierten Werkzeugnamen.
com.top_logic.ai.service.scripting.OpenAIScriptFunctions.tools.tooltip = Gibt eine Liste aller verfügbaren Werkzeugnamen aus der <i>Werkzeugregistrierung</i> zurück. <p> Die Werkzeugnamen haben das qualifizierte Format Fabrikname.Werkzeugname. Diese Namen können an die <i>Chat-Funktion</i> übergeben werden, um dem KI-Agenten Werkzeuge zur Verfügung zu stellen. </p>
com.top_logic.ai.service.skills.SkillConfig = Konfiguration der Fertigkeiten
com.top_logic.ai.service.skills.SkillConfig.content = Inhalt
com.top_logic.ai.service.skills.SkillConfig.content.tooltip = Der eigentliche Prompt-Text dieser Fertigkeit.
com.top_logic.ai.service.skills.SkillConfig.description = Beschreibung
com.top_logic.ai.service.skills.SkillConfig.description.tooltip = Von Menschen lesbare Beschreibung des Zwecks dieser Fertigkeit.
com.top_logic.ai.service.skills.SkillConfig.tooltip = Konfiguration für einen einzelnen Skill in der <i>Agentenregistrierung</i>. <p> Ein Skill ist ein Anweisungsfragment, das Agenten bei Bedarf über loadSkill(id) laden können. Die ID und die Beschreibung des Skills erscheinen im Systemprompt-Katalog, damit der Agent weiß, wann er ihn laden muss. </p>
com.top_logic.ai.service.tools.TraceEventKind = Art des Trace-Ereignisses
com.top_logic.ai.service.tools.TraceEventKind.AGENT_CALL = Agenten-Aufruf
com.top_logic.ai.service.tools.TraceEventKind.AGENT_CALL.tooltip = Ein Agent delegiert an einen anderen (fromAgent, toAgent, Zusammenfassung der Arbeitsaufträge, Zusammenfassung der Ergebnisse).
com.top_logic.ai.service.tools.TraceEventKind.TOOL_CALL = Werkzeugaufruf
com.top_logic.ai.service.tools.TraceEventKind.TOOL_CALL.tooltip = Ein Werkzeug wurde aufgerufen (toolName, args, result).
com.top_logic.ai.service.tools.TraceEventKind.tooltip = Art des Eintrags in der Zeitleiste einer Ablaufverfolgung.
com.top_logic.ai.service.tools.help.TLScriptReferenceTool = Skript-Referenzwerkzeug
com.top_logic.ai.service.tools.help.TLScriptReferenceTool.tooltip = Werkzeug zum Auflisten von TLScript-Funktionen und zum Abrufen der Dokumentation. <p> Dieses Tool ermöglicht den Zugriff auf die TLScript-Funktionsregistrierung, so dass KI-Agenten verfügbare Funktionen entdecken und detaillierte Dokumentationen zu ihnen abrufen können. Es verwendet den <i>Search Builder</i>, um auf die Metadaten der Funktionen zuzugreifen. </p>
com.top_logic.ai.service.tools.model.AnnotationDefinitionExplorerTool = Explorer-Tool für Anmerkungsdefinitionen
com.top_logic.ai.service.tools.model.AnnotationDefinitionExplorerTool.tooltip = Werkzeug zur Erkundung von Schemata für Anmerkungsdefinitionen. <p> Dieses Tool ermöglicht es KI-Agenten, Anmerkungsdefinitionen zu verstehen (was konfiguriert werden KANN), nicht Anmerkungsinstanzen (was konfiguriert ist). Es bietet Schemainformationen, einschließlich Metadaten zu Eigenschaften, Typen, Einschränkungen und Standardeinstellungen. </p> <h3>Beispiel für die Verwendung:</h3> <pre> // Untersuchen einer bestimmten Anmerkungsdefinition describeAnnotation("com.top_logic.model.annotate.Visibility") // Untersuchen einer Formulardefinitionsanmerkung describeAnnotation("com.top_logic.model.form.definition.FormDefinition") </pre> <h3>Integration</h3>: <p> Um dieses Tool mit einem KI-Agenten zu verwenden, instanziieren Sie es und fügen Sie es zu den Tools des Agenten hinzu: </p> <pre> AnnotationDefinitionExplorerTool definitionTool = new AnnotationDefinitionExplorerTool(); ModelExplorer explorer = AgenticServices.agentBuilder(ModelExplorer.class) .chatModel(explorationModel) .tools(browserTool, instanceTool, analysisTool, searchTool, annotationTool, definitionTool) .build(); </pre>
com.top_logic.ai.service.tools.model.InstanceBrowserTool = Instanz-Browser-Tool
com.top_logic.ai.service.tools.model.InstanceBrowserTool.tooltip = Tool für den Zugriff auf TopLogic-Instanzdaten aus der Wissensdatenbank. <p> Dieses Tool bietet zwei Methoden für die Arbeit mit Instanzen: <ul> <li><code>#listInstances(String, String, Integer, String)</code> - Auflistung aller TIDs für einen Typ</li> <li><code>#getInstance(String)</code> - Abrufen detaillierter Informationen für eine bestimmte Instanz</li> </ul> </p> <p> Alle Methoden geben JSON-formatierte Strings zurück, die von KI-Agenten verwendet werden können. </p>
com.top_logic.ai.service.tools.model.ModelAnnotationBrowserTool = Browser-Tool für Modellkommentare
com.top_logic.ai.service.tools.model.ModelAnnotationBrowserTool.tooltip = Werkzeug zum Durchsuchen von Annotationen auf TopLogic-Modellelementen (Module, Typen, Teile, Aufzählungen, Klassifikatoren). <p> Mit diesem Tool können KI-Agenten die Metadaten von Annotationen auf Modellelementen mit optionaler Vererbungsunterstützung prüfen. Es liefert detaillierte Informationen über jede Anmerkung, einschließlich ihres Tag-Namens, der Konfigurationsschnittstelle und der Eigenschaftswerte. </p> <h3>Beispiel für die Verwendung:</h3> <pre> // Auflisten lokaler Anmerkungen zu einem Modul listAnnotations("tl.core", false) // Auflisten lokaler Anmerkungen zu einem Typ listAnnotations("tl.core:TLObject", false) // Auflisten aller Anmerkungen einschließlich vererbter listAnnotations("tl.core:TLObject", true) // Auflisten von Anmerkungen zu einer Enumeration listAnnotations("tl.core:TLScope", false) // Anmerkungen zu einem Typteil auflisten listAnnotations("tl.core:TLObject#name", false) // Anmerkungen zu einem Klassifikator (Enum-Literal) auflisten listAnnotations("tl.core:TLScope#global", false) </pre> <h3>Integration</h3>: <p> Um dieses Tool mit einem KI-Agenten zu verwenden, instanziieren Sie es und fügen Sie es zu den Tools des Agenten hinzu: </p> <pre> ModelAnnotationBrowserTool annotationTool = new ModelAnnotationBrowserTool(); ModelExplorer explorer = AgenticServices.agentBuilder(ModelExplorer.class) .chatModel(explorationModel) .tools(browserTool, instanceTool, analysisTool, searchTool, annotationTool) .build(); </pre>
com.top_logic.ai.service.tools.model.ModelBrowserTool = Modell-Browser-Tool
com.top_logic.ai.service.tools.model.ModelBrowserTool.tooltip = Werkzeug zum Durchsuchen der TopLogic-Modellstruktur (Module, Typen, Teile). <p> Dieses Werkzeug bietet drei Methoden, die die natürliche Hierarchie für die Modelluntersuchung bilden: <ul> <li><code>#listModules()</code> - Auflistung aller Module in der Anwendung</li> <li><code>#listTypes(String)</code> - Auflistung der Typen innerhalb eines bestimmten Moduls</li> <li><code>#listTypeParts(String, String, Boolean)</code> - Auflistung der Eigenschaften/Referenzen eines Typs</li> </ul> </p> <p> Alle Methoden geben JSON-formatierte Zeichenketten zurück, die von KI-Agenten verwendet werden können. </p>
com.top_logic.ai.service.tools.model.ModelEditorTool = Modell-Editor-Werkzeug
com.top_logic.ai.service.tools.model.ModelEditorTool.tooltip = <code>LangChain4j</code> Tool zum Erstellen und Aktualisieren von TopLogic-Modellelementen. <p> Dieses Tool bietet Methoden zum Erstellen und Aktualisieren von Modulen, Klassen, Eigenschaften, Referenzen, Rückwärtsreferenzen und Aufzählungen im TopLogic-Anwendungsmodell. </p> <p> Alle Methoden geben JSON-formatierte Zeichenketten zurück, die von KI-Agenten verwendet werden können. </p>
com.top_logic.ai.service.tools.model.ModelSearchTool = Werkzeug zur Modellsuche
com.top_logic.ai.service.tools.model.ModelSearchTool.tooltip = Werkzeug für die Suche im gesamten TopLogic-Anwendungsmodell. <p> Dieses Tool bietet eine intelligente Textsuche über Module, Typen (Klassen, Aufzählungen, Datentypen) und Eigenschaften/Referenzen. Es durchsucht technische Namen, qualifizierte Namen, Bezeichnungen und Beschreibungen und gibt die 10 relevantesten Treffer mit Kontextinformationen zurück. </p>
com.top_logic.ai.service.tools.model.TypeAnalysisTool = Werkzeug zur Typenanalyse
com.top_logic.ai.service.tools.model.TypeAnalysisTool.tooltip = Tool zur Analyse der TopLogic-Typ-Abhängigkeiten und -Beziehungen. <p> Dieses Tool bietet Methoden, um zu verstehen, wie Typen im gesamten Modell verwendet werden: <ul> <li><code>#findTypeUsages(String)</code> - Findet alle Verwendungen eines Typs</li> <li><code>#findPartUsages(String, String)</code> - Findet, wo ein Teil definiert und vererbt wird</li> </ul> </p> <p> Alle Methoden geben JSON-formatierte Strings zurück, die von KI-Agenten verwendet werden können. </p>
com.top_logic.ai.service.tools.registry.ReflectiveToolFactory = Reflektierende Werkzeugfabrik
com.top_logic.ai.service.tools.registry.ReflectiveToolFactory.Config.tool-class = Werkzeugklasse
com.top_logic.ai.service.tools.registry.ReflectiveToolFactory.Config.tool-class.tooltip = Die Java-Klasse, die mit @Tool annotierte Methoden enthält. <p> Diese Klasse wird nach Werkzeugdefinitionen durchsucht. Alle öffentlichen Methoden, die mit @Tool annotiert sind, werden als AI-Tools angezeigt. </p>
com.top_logic.ai.service.tools.registry.ReflectiveToolFactory.tooltip = Eine <i>Werkzeugfabrik</i>, die reflektiv Werkzeuge aus einer Java-Klasse mit @Tool-kommentierten Methoden entdeckt. <p> Diese Fabrik extrahiert Werkzeugspezifikationen aus der konfigurierten Klasse und erstellt entsprechende Executors für jedes Werkzeug. </p>
com.top_logic.ai.service.tools.registry.ScriptToolFactory = Script-Werkzeugfabrik
com.top_logic.ai.service.tools.registry.ScriptToolFactory.Config.tools = Werkzeuge
com.top_logic.ai.service.tools.registry.ScriptToolFactory.Config.tools.tooltip = Die zu erstellenden Werkzeuge. <p> Jedes Werkzeug wird durch seine Spezifikation (Name, Beschreibung, Parameter) und eine TL-Script-Implementierung definiert. </p>
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.description = Beschreibung
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.description.tooltip = Die Beschreibung dessen, was das Werkzeug tut.
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.implementation = Umsetzung
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.implementation.tooltip = Die TL-Script-Implementierung des Werkzeugs. <p> Das Skript erhält die Parameter des Tools als Variablen und sollte das Ergebnis des Tools als String zurückgeben. </p>
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.name = Name
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.name.tooltip = Der Name des Tools.
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.parameters = Parameter
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.parameters.tooltip = Die Parameter, die dieses Werkzeug akzeptiert. <p> Jeder Parameter wird durch seinen Namen und seine Konfiguration (Typ, Beschreibung usw.) definiert. </p>
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ToolParameterConfig.description = Beschreibung
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ToolParameterConfig.description.tooltip = Die Beschreibung des Parameters.
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ToolParameterConfig.name = Name
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ToolParameterConfig.name.tooltip = Der Name des Parameters.
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ToolParameterConfig.type = Typ
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ToolParameterConfig.type.tooltip = Der JSON-Schematyp des Parameters (z. B. "string", "number", "boolean", "object", "array").
com.top_logic.ai.service.tools.registry.ScriptToolFactory.tooltip = Eine <i>Werkzeugfabrik</i>, die Werkzeuge aus TL-Script-Implementierungen erstellt. <p> Mit dieser Fabrik können Werkzeuge direkt in der Konfiguration mit TL-Script-Code definiert werden. Jedes Werkzeug besteht aus einer Spezifikation (Name, Beschreibung, Parameter) und einem TL-Script-Ausdruck, der die Logik des Werkzeugs implementiert. </p>
com.top_logic.ai.service.tools.registry.ToolRegistry = Werkzeug-Register
com.top_logic.ai.service.tools.registry.ToolRegistry$ToolFactoryConfig = Werkzeug-Werkskonfiguration
com.top_logic.ai.service.tools.registry.ToolRegistry$ToolFactoryConfig.tooltip = Konfiguration für eine benannte Werkzeugfabrik.
com.top_logic.ai.service.tools.registry.ToolRegistry.Config.tool-factories = Werkzeugfabriken
com.top_logic.ai.service.tools.registry.ToolRegistry.Config.tool-factories.tooltip = Karte der benannten Werkzeugfabriken, die in der Anwendung verfügbar sind. <p> Jede Werkzeugfabrik wird durch einen eindeutigen Namen identifiziert. Der Fabrikname wird Teil des qualifizierten Werkzeugnamens (Fabrikname.Werkzeugname), mit dem in TL-Script-Funktionen auf Werkzeuge verwiesen wird. </p>
com.top_logic.ai.service.tools.registry.ToolRegistry.ToolFactoryConfig.implementation = Umsetzung
com.top_logic.ai.service.tools.registry.ToolRegistry.ToolFactoryConfig.implementation.tooltip = Die Implementierung der Werkzeugfabrik.
com.top_logic.ai.service.tools.registry.ToolRegistry.tooltip = Registrierungsdienst zur Verwaltung der in der Anwendung verfügbaren Werkzeuge. <p> Die Werkzeuge sind nach Fabriken organisiert. Jede Fabrik produziert einen Satz von Werkzeugen, und jedes Werkzeug wird durch einen qualifizierten Namen im Format {factory-name}{tool-name} identifiziert. So können Werkzeuge aus verschiedenen Fabriken denselben einfachen Namen haben, ohne dass es zu Konflikten kommt. </p>
com.top_logic.ai.service.tools.script.TLScriptTool = Skript-Tool
com.top_logic.ai.service.tools.script.TLScriptTool.tooltip = Langchain4j-Werkzeug zur Validierung und Ausführung von TLScript-Code. <p> Dieses Tool bietet zwei Methoden für die Arbeit mit TLScript: </p> <ul> <li><code>#validateTLScript(String)</code> - Validierung von Syntax, Modellreferenzen und Typen</li> <li><code>#executeTLScript(String, Boolean, List)</code> - Validiert und führt TLScript-Code aus</li> </ul> <p> Beide Methoden verwenden den gemeinsamen <i>Skript-Executor</i> für die zentrale Validierungs- und Ausführungslogik. </p>
com.top_logic.ai.service.tools.script.messages.ErrorType = Fehlerart
com.top_logic.ai.service.tools.script.messages.ErrorType.LEXICAL_ERROR = Lexikalischer Fehler
com.top_logic.ai.service.tools.script.messages.ErrorType.LEXICAL_ERROR.tooltip = Lexikalischer Fehler (ungültige Zeichen).
com.top_logic.ai.service.tools.script.messages.ErrorType.SYNTAX_ERROR = Syntax-Fehler
com.top_logic.ai.service.tools.script.messages.ErrorType.SYNTAX_ERROR.tooltip = Syntaxfehler (Parserfehler).
com.top_logic.ai.service.tools.script.messages.ErrorType.VALIDATION_ERROR = Validierungsfehler
com.top_logic.ai.service.tools.script.messages.ErrorType.VALIDATION_ERROR.tooltip = Validierungsfehler (Modellreferenzen, Typenprüfung).
com.top_logic.ai.service.tools.script.messages.ErrorType.tooltip = Art des Validierungsfehlers.
