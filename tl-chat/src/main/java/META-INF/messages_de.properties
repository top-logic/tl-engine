com.top_logic.ai.chat.history.LegacyChatSessionMigration = Migration alter Chat-Sitzungen
com.top_logic.ai.chat.history.LegacyChatSessionMigration.tooltip = Einmalige sofortige Migration von Legacy <code>tl.ai.chat:ChatSession</code> Objekten in <i>Agentensitzungen</i> beim Anwendungsstart. <p> Jede Legacy-Sitzung wird zu einer <i>Agentensitzung</i> (Typ CHAT) mit demselben Titel, Besitzer, denselben Zeitstempeln und Metadaten sowie einer synthetischen, abgeschlossenen <i>Agentenausführung</i>, die den alten V2-Nachrichten-Blob wortwörtlich als Transkript enthält. Legacy-Blobs im Format vor V2 können nicht wiedergegeben werden; ihr Gesprächsinhalt wird mit einer Warnung verworfen (Titel und Zeitstempel bleiben erhalten). Jedes Legacy-Objekt wird nach der Migration gelöscht, sodass die Tabelle <code>ChatSession</code> nach einem Start dieser Version leer ist und nachfolgende Starts einen geringen Aufwand erfordern (No-Op). </p> <p> Die Migration erfolgt nach dem Best-Effort-Prinzip: Ein Fehler wird protokolliert, verhindert jedoch niemals den Start der Anwendung; verbleibende ältere Sitzungen werden beim nächsten Systemstart erneut versucht. </p> <p> Der Rest des alten Modells ist verschwunden: <code>WEB-INF/model/tl.ai.chat.model.xml</code>, <code>WEB-INF/kbase/ChatMeta.xml</code> und <code>WEB-INF/autoconf/model.tl.ai.chat.config.xml</code> wurden gelöscht, und die Migration „tl-ai-core“ <code>Issue_230_remove_module_tl_ai_chat</code> entfernt die Tabelle und das Modul aus den Datenbanken, auf die sie zugreift (Refs #230). </p> <p> Da das Modell nicht mehr vorhanden ist, hat dieser Dienst keine Aufgabe mehr: Unabhängig davon, ob die Migration eine Datenbank erreicht oder nicht, entfernt <code>DynamicModelService</code> das nicht deklarierte Modul <code>tl.ai.chat</code> während seines inkrementellen Modell-Upgrades, das vor dem Start dieses Dienstes ausgeführt wird. Er wird nur beibehalten, damit die Entfernung des alten Modells an einer Stelle noch rückgängig gemacht werden kann und weil das Löschen erst dann sicher ist, wenn jede Bereitstellung es ausgeführt hat. </p> <p>
