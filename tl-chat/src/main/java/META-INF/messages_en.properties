com.top_logic.ai.chat.view.ChatSessionsElement.tooltip = Declarative <chat-sessions/> element: the chat's session list as a view element of its own. <p> Several chat elements on one page join the same conversation through chat-id. The optional selection channel carries the open AgentSession object, so a host table or form can write and read it. Without a channel the list still drives the shared browser store, and every element on the same chat-id follows. </p>
