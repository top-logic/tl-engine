com.top_logic.ai.service.tools.registry.ToolRegistry.ToolFactoryConfig.implementation.tooltip = Die Implementierung der Werkzeugfabrik.
com.top_logic.ai.service.tools.registry.ToolRegistry.tooltip = Registrierungsdienst zur Verwaltung der in der Anwendung verfï¿½gbaren Werkzeuge. <p> Die Werkzeuge sind nach Fabriken organisiert. Jede Fabrik produziert einen Satz von Werkzeugen, und jedes Werkzeug wird durch einen qualifizierten Namen im Format {factory-name}{tool-name} identifiziert. So kï¿½nnen Werkzeuge aus verschiedenen Fabriken denselben einfachen Namen haben, ohne dass es zu Konflikten kommt. </p>
com.top_logic.ai.service.tools.script.TLScriptTool = Skript-Tool
com.top_logic.ai.service.tools.script.TLScriptTool.tooltip = Langchain4j-Werkzeug zur Validierung und Ausfï¿½hrung von TLScript-Code. <p> Dieses Tool bietet zwei Methoden fï¿½r die Arbeit mit TLScript: </p> <ul> <li><code>#validateTLScript(String)</code> - Validierung von Syntax, Modellreferenzen und Typen</li> <li><code>#executeTLScript(String, Boolean, List)</code> - Validiert und fï¿½hrt TLScript-Code aus</li> </ul> <p> Beide Methoden verwenden den gemeinsamen <i>Skript-Executor</i> fï¿½r die zentrale Validierungs- und Ausfï¿½hrungslogik. </p>
