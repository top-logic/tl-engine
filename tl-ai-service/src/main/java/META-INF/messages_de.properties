com.top_logic.ai.service.AIService = AI-Dienst
com.top_logic.ai.service.AIService.Config.default-model = Standardmodell
com.top_logic.ai.service.AIService.Config.default-model.tooltip = Der Standardmodellname, der verwendet wird, wenn kein Modell explizit angegeben wird. <p> Dieser sollte mit einem der in <i>Factories</i> konfigurierten Modellnamen ï¿½bereinstimmen. Wird er nicht angegeben oder ist er null, wird das Modell der ersten Fabrik als Standard verwendet. </p>
com.top_logic.ai.service.AIService.Config.factories = Fabriken
com.top_logic.ai.service.AIService.Config.factories.tooltip = Die konfigurierten Modellfabriken. <p> Jede Fabrik wird durch den Modellnamen identifiziert, den sie produziert, und verwaltet einen Pool von Chat-Modell-Instanzen fï¿½r dieses spezifische Modell. </p>
com.top_logic.ai.service.AIService.tooltip = TopLogic-Dienst, der den Zugriff auf KI-Modelle ï¿½ber <i>LangChain4j</i> mit thread-sicherem Client-Pooling ermï¿½glicht. <p> Dieser Dienst verwaltet mehrere <i>Chat-Modell-Fabrik-Instanzen</i>, die jeweils fï¿½r ein bestimmtes KI-Modell konfiguriert sind. Die Modelle werden gepoolt und automatisch an den aktuellen <i>Interaktionskontext</i> gebunden und dann an den Pool zurï¿½ckgegeben, wenn der Kontext zerstï¿½rt wird. </p>
com.top_logic.ai.service.ChatModelFactory = Chat-Modellfabrik
com.top_logic.ai.service.ChatModelFactory.Config.max-idle-models = Maximale Modelle im Leerlauf
com.top_logic.ai.service.ChatModelFactory.Config.max-idle-models.tooltip = Die maximale Anzahl der inaktiven Chat-Modelle, die im Pool gehalten werden. <p> Voreinstellung: 5 </p>
com.top_logic.ai.service.ChatModelFactory.Config.max-pool-size = Maximale Poolgrï¿½ï¿½e
com.top_logic.ai.service.ChatModelFactory.Config.max-pool-size.tooltip = Die maximale Anzahl von Chatmodellen im Pool. <p> Standard: 10 </p>
com.top_logic.ai.service.ChatModelFactory.Config.models = Modelle
com.top_logic.ai.service.ChatModelFactory.Config.models.tooltip = Die Modellnamen (z. B. "gpt-4o, gpt-3.5-turbo" oder "claude-3-opus, claude-3-sonnet"). <p> Kommagetrennte Liste von Modellnamen. Jeder Modellname dient als eindeutiger Bezeichner und bestimmt, welche Modelle angefordert werden kï¿½nnen. Alle aufgelisteten Modelle verwenden dieselben API-Anmeldeinformationen von dieser Fabrik. </p>
com.top_logic.ai.service.ChatModelFactory.tooltip = Abstrakte Fabrik zum Erstellen und Verwalten von gepoolten <i>Chat-Modell-Instanzen</i>. <p> Diese Fabrik erstellt Objektpools fï¿½r <i>LangChain4j-Chatmodell-Instanzen</i>. Jede Fabrik ist fï¿½r einen bestimmten AI-Anbieter konfiguriert und kann Pools fï¿½r mehrere Modelle dieses Anbieters erstellen. </p> <p> Konkrete Implementierungen existieren fï¿½r verschiedene AI-Anbieter: </p> <ul> <li><i>OpenAI-Chatmodellfabrik</i>: Fï¿½r OpenAI-Modelle (GPT-4o, GPT-3.5-turbo, etc.)</li> <li><i>anthropische Chat-Modell-Fabrik</i>: Fï¿½r anthropische Modelle (Claude, etc.)</li> <li><i>mistral chat model factory</i>: Fï¿½r Mistral-KI-Modelle</li> </ul>
com.top_logic.ai.service.agents.AgentConfig = Konfiguration des Agenten
com.top_logic.ai.service.agents.AgentConfig.max-tokens = Maximale Token
com.top_logic.ai.service.agents.AgentConfig.max-tokens.tooltip = Die maximale Anzahl der Ausgabe-Token für die Modellantwort.
com.top_logic.ai.service.agents.AgentConfig.model = Modell
com.top_logic.ai.service.agents.AgentConfig.model.tooltip = Der LLM-Modellname, der für diesen Agenten verwendet werden soll (z. B. "claude-sonnet-4-20250514"). <p> Die Optionen werden aus den im <i>AI-Dienst</i> registrierten Modellen ausgefüllt. </p>
com.top_logic.ai.service.agents.AgentConfig.return-thinking = Zurückdenken
com.top_logic.ai.service.agents.AgentConfig.return-thinking.tooltip = Ob das Denken des Modells in die Antwort aufgenommen werden soll. <p> Wenn dies der Fall ist, wird der Inhalt der Überlegungen zusammen mit dem Antworttext aufgenommen. </p>
com.top_logic.ai.service.agents.AgentConfig.send-thinking = Denken senden
com.top_logic.ai.service.agents.AgentConfig.send-thinking.tooltip = Ob frühere Denkblöcke in Folgemeldungen gesendet werden sollen. <p> Wenn dies der Fall ist, werden die Denkinhalte aus früheren Runden in den an das Modell gesendeten Gesprächsverlauf aufgenommen. </p>
com.top_logic.ai.service.agents.AgentConfig.skills = Fertigkeiten
com.top_logic.ai.service.agents.AgentConfig.skills.tooltip = Durch Kommata getrennte Liste von Skill-IDs, die für diesen Agenten verfügbar sind. <p> Skills werden durch ihren registrierten Namen im <i>Skill-Register</i> referenziert (z. B. "shared/prompting-model-explorer"). </p>
com.top_logic.ai.service.agents.AgentConfig.system-prompt = System-Eingabeaufforderung
com.top_logic.ai.service.agents.AgentConfig.system-prompt.tooltip = Die Systemeingabeaufforderung, die das Verhalten und die Anweisungen dieses Agenten definiert.
com.top_logic.ai.service.agents.AgentConfig.temperature = Temperatur
com.top_logic.ai.service.agents.AgentConfig.temperature.tooltip = Die Abtasttemperatur für das Modell (0,0 bis 1,0). <p> Niedrigere Werte machen die Ausgabe deterministischer, höhere Werte machen sie kreativer. </p>
com.top_logic.ai.service.agents.AgentConfig.thinking-budget-tokens = Nachdenken über Budget-Token
com.top_logic.ai.service.agents.AgentConfig.thinking-budget-tokens.tooltip = Die maximale Anzahl von Spielsteinen, die das Modell für sein internes Denken verwenden darf. <p> Erforderlich, wenn der <i>Typ "Denken"</i> <i>aktiviert</i> ist. </p>
com.top_logic.ai.service.agents.AgentConfig.thinking-type = Art des Denkens
com.top_logic.ai.service.agents.AgentConfig.thinking-type.tooltip = Der Denktyp für erweiterte Denkunterstützung. <p> <i>Adaptiv</i> lässt das Modell entscheiden, wann es denkt. <i>Aktiviert</i> erzwingt das Denken bei jeder Anfrage und erfordert das Setzen von <i>Denk-Budget-Token</i>. </p>
com.top_logic.ai.service.agents.AgentConfig.tools = Werkzeuge
com.top_logic.ai.service.agents.AgentConfig.tools.tooltip = Die für diesen Agenten verfügbaren Werkzeugkonfigurationen. <p> Jeder Eintrag ist eine polymorphe Konfiguration einer Werkzeugklasse, die instanziiert und dem Agenten während der Konversation zur Verfügung gestellt wird. </p>
com.top_logic.ai.service.agents.AgentConfig.tooltip = Konfiguration für einen einzelnen Agenten in der <i>Agentenregistrierung</i>. <p> Jeder Agent wird durch einen eindeutigen Namen identifiziert (durch <i>benannte Konfiguration obligatorisch</i>) und definiert das LLM-Modell, optionale Denkparameter, Systemaufforderung und verfügbare Werkzeuge und Fähigkeiten. </p>
com.top_logic.ai.service.agents.AgentDelegationTools$Creation = Erstellung
com.top_logic.ai.service.agents.AgentDelegationTools$Creation.tooltip = Delegiert an den <i>Modelleditor</i> zur Erstellung oder Änderung von Modellen.
com.top_logic.ai.service.agents.AgentDelegationTools$Exploration = Erkundung
com.top_logic.ai.service.agents.AgentDelegationTools$Exploration.tooltip = Delegiert an den <i>Modell-Explorer</i>, um das Modell schreibgeschützt zu prüfen.
com.top_logic.ai.service.agents.AgentDelegationTools$TLScript = Drehbuch
com.top_logic.ai.service.agents.AgentDelegationTools$TLScript.tooltip = Delegiert an den <i>Skript-Agenten</i> für TLScript-Fragen und -Validierung.
com.top_logic.ai.service.agents.AgentDelegationTools.Creation.Config.from-agent = Von Agent
com.top_logic.ai.service.agents.AgentDelegationTools.Creation.Config.from-agent.tooltip = Name des anrufenden Agenten für die Aufzeichnung.
com.top_logic.ai.service.agents.AgentDelegationTools.Exploration.Config.from-agent = Von Agent
com.top_logic.ai.service.agents.AgentDelegationTools.Exploration.Config.from-agent.tooltip = Name des anrufenden Agenten für die Aufzeichnung.
com.top_logic.ai.service.agents.AgentDelegationTools.TLScript.Config.from-agent = Von Agent
com.top_logic.ai.service.agents.AgentDelegationTools.TLScript.Config.from-agent.tooltip = Name des anrufenden Agenten für die Aufzeichnung.
com.top_logic.ai.service.agents.AgentRegistry = Vertreter-Register
com.top_logic.ai.service.agents.AgentRegistry.Config.agents = Agenten
com.top_logic.ai.service.agents.AgentRegistry.Config.agents.tooltip = Die konfigurierten Agenten, geordnet nach Agentennamen. <p> Jeder Eintrag definiert einen Agenten mit seinem Modell, seiner Eingabeaufforderung, seinen Werkzeugen und Fähigkeiten. </p>
com.top_logic.ai.service.agents.AgentRegistry.tooltip = Register der zur Laufzeit konfigurierbaren Agenten. <p> Jeder Agent wird in XML über die <i>Agentenkonfiguration</i> deklariert und enthält seinen LLM-Modellnamen, optionale Denkparameter, System-Eingabeaufforderung, Werkzeuge und Fähigkeiten. Dieser Dienst validiert die Konfigurationen beim Start und bietet Factory-Methoden, um daraus vollständig verdrahtete <i>LangChain4j-Agenten</i> zu erstellen. </p> <p> Die Modellbildung ist anbieterabhängig: Wenn das referenzierte Modell von einem bekannten Anbieter bereitgestellt wird<i>(anthropic chat model factory</i>, <i>mistral chat model factory</i>, <i>open AI chat model factory</i>), werden die Parameter des Agenten (Denken, Temperatur, maximale Token) auf eine neue, ungepoolte Modellinstanz angewendet. Andernfalls wird das gepoolte Modell des <i>KI-Dienstes</i> als Fallback zurückgegeben. </p>
com.top_logic.ai.service.agents.ThinkingType = Art des Denkens
com.top_logic.ai.service.agents.ThinkingType.ADAPTIVE = Anpassungsfähig
com.top_logic.ai.service.agents.ThinkingType.ADAPTIVE.tooltip = Das Modell entscheidet selbständig, wann und wie viel es denkt.
com.top_logic.ai.service.agents.ThinkingType.ENABLED = Aktiviert
com.top_logic.ai.service.agents.ThinkingType.ENABLED.tooltip = Das Modell verwendet immer das erweiterte Denken. Erfordert das Setzen von <i>Denk-Budget-Token</i><i>(Agenten-Konfiguration</i>).
com.top_logic.ai.service.agents.ThinkingType.tooltip = Erweiterte Denkweisen werden von LLM-Anbietern unterstützt (derzeit Anthropic).
com.top_logic.ai.service.providers.AnthropicChatModelFactory = Antropic Chat-Modellfabrik\ 
