model.tl.accounts.Person.passkeys = Passkeys
model.tl.accounts.Person.passkeys.tooltip = Die für diesen Zugang registrierten Passkeys. Ein Passkey meldet den Zugang ohne Passwort an oder bestätigt eine Anmeldung mit Passwort als zweiter Faktor.
model.tl.security.passkey = Passkeys
