model.tl.model = Model
model.tl.model.DBType = Datenbanktyp
model.tl.model.DBType.tooltip = Der Typ einer Datenbankspalte. Er bestimmt, wie ein Wert physisch in der Datenbank gespeichert wird.
model.tl.model.DeletionPolicy = Löschstrategie
model.tl.model.DeletionPolicy.tooltip = Legt fest, was mit einer Referenz geschieht, wenn ein referenziertes Objekt gelöscht wird: die Referenz wird geleert, das referenzierende Objekt wird ebenfalls gelöscht, die Referenz wird auf den letzten Zustand vor der Löschung festgeschrieben, oder die Löschung wird abgelehnt.
model.tl.model.DerivedTLTypePart = Berechneter Teil
model.tl.model.DerivedTLTypePart.derived = Berechnet
model.tl.model.DerivedTLTypePart.derived.tooltip = Ob der Wert dieses Bestandteils berechnet wird. Ein berechneter Wert kann nicht bearbeitet werden.
model.tl.model.DerivedTLTypePart.tooltip = Basistyp für Bestandteile eines Typs, deren Wert aus anderen Werten berechnet werden kann, anstatt gespeichert zu werden.
model.tl.model.HistoryType = Historisierung
model.tl.model.HistoryType.tooltip = Legt fest, ob eine Referenz auf den aktuellen Zustand eines Objekts, auf einen festen historischen Zustand verweist oder beides enthalten darf.
model.tl.model.TLAnnotation = Annotation
model.tl.model.TLAnnotation.tooltip = Eine Annotation eines Modellelements. Annotationen verfeinern das Verhalten und die Anzeige eines Modellelements, ohne dessen Struktur zu verändern.
model.tl.model.TLAssociation = Assoziation
model.tl.model.TLAssociation.ends = Assoziationsenden
model.tl.model.TLAssociation.ends.tooltip = Die Enden der Assoziation. Sie legen fest, welche Typen durch die Assoziation verbunden werden.
model.tl.model.TLAssociation.subsets = Teilmengen
model.tl.model.TLAssociation.subsets.tooltip = Die Assoziationen, deren Verknüpfungen zusammen diese abgeleitete Assoziation bilden.
model.tl.model.TLAssociation.tooltip = Eine Beziehung zwischen Fachobjekten. Eine Assoziation besitzt Enden, die die beteiligten Typen beschreiben. Jede Referenz wird durch eine Assoziation umgesetzt.
model.tl.model.TLAssociation.union = Obermengen
model.tl.model.TLAssociation.union.tooltip = Die abgeleiteten Assoziationen, deren Teilmenge diese Assoziation ist. Die Verknüpfungen dieser Assoziation sind auch in jenen Assoziationen sichtbar.
model.tl.model.TLAssociationEnd = Assoziationsende
model.tl.model.TLAssociationEnd.aggregate = Aggregation
model.tl.model.TLAssociationEnd.aggregate.tooltip = Auszeichnung für ein Assoziationsende, das in Richtung der Aggregation (dem Ganzen) einer Kompositionsbeziehung (Teil/Ganzes) zeigt.
model.tl.model.TLAssociationEnd.composite = Komposition
model.tl.model.TLAssociationEnd.composite.tooltip = Auszeichnung für ein Assoziationsende, das in Richtung der Teile eines Ganzen einer Kompositionsbeziehung (Teil/Ganzes) zeigt.
model.tl.model.TLAssociationEnd.deletionPolicy = Löschstrategie
model.tl.model.TLAssociationEnd.deletionPolicy.tooltip = Legt fest, was mit einer Verknüpfung geschieht, wenn das Objekt an diesem Ende gelöscht wird.
model.tl.model.TLAssociationEnd.endIndex = Index des Assoziationsendes
model.tl.model.TLAssociationEnd.endIndex.tooltip = Die Position dieses Endes in der Liste der Enden seiner Assoziation.
model.tl.model.TLAssociationEnd.historyType = Historisierung
model.tl.model.TLAssociationEnd.historyType.tooltip = Legt fest, ob dieses Ende aktuelle Objekte, Objekte eines festen historischen Zustands oder beides aufnimmt.
model.tl.model.TLAssociationEnd.navigate = Navigierbar
model.tl.model.TLAssociationEnd.navigate.tooltip = Ob die Assoziation zu diesem Ende navigiert werden darf. Nur bei einem navigierbaren Ende können die Werte vom Objekt am anderen Ende aus ermittelt werden.
model.tl.model.TLAssociationEnd.reference = Referenz
model.tl.model.TLAssociationEnd.reference.tooltip = Die Referenz, die die Assoziation zu diesem Ende navigiert.
model.tl.model.TLAssociationEnd.tooltip = Ein Ende einer Assoziation. Es legt fest, welcher Typ an dieser Stelle an der Beziehung teilnimmt und wie die Werte behandelt werden.
model.tl.model.TLClass = Fachobjekttyp
model.tl.model.TLClass.abstract = Abstrakt
model.tl.model.TLClass.abstract.tooltip = Eine abstrakte Klasse kann nicht instanziiert werden. Sie dient nur als gemeinsamer Basistyp ihrer Spezialisierungen.
model.tl.model.TLClass.final = Final
model.tl.model.TLClass.final.tooltip = Eine finale Klasse kann nicht weiter spezialisiert werden.
model.tl.model.TLClass.generalizations = Generalisierungen
model.tl.model.TLClass.generalizations.tooltip = Die Klassen, von denen diese Klasse ihre Eigenschaften und Referenzen erbt.
model.tl.model.TLClass.scope = Bereich
model.tl.model.TLClass.specializations = Spezialisierungen
model.tl.model.TLClass.specializations.tooltip = Die Klassen, die von dieser Klasse erben.
model.tl.model.TLClass.tooltip = Ein Typ von Fachobjekten. Eine Klasse definiert Eigenschaften und Referenzen und kann diese von anderen Klassen erben.
model.tl.model.TLClassifier = Klassifikator
model.tl.model.TLClassifier.default = Vorgabewert
model.tl.model.TLClassifier.default.tooltip = Ob dieser Klassifikator als Standardwert seiner Aufzählung vorausgewählt ist.
model.tl.model.TLClassifier.index = Index
model.tl.model.TLClassifier.index.tooltip = Die Position des Klassifikators in der Liste der Klassifikatoren seiner Aufzählung.
model.tl.model.TLClassifier.tooltip = Ein möglicher Wert einer Aufzählung.
model.tl.model.TLEnumeration = Aufzählung
model.tl.model.TLEnumeration.classifiers = Klassifikatoren
model.tl.model.TLEnumeration.classifiers.tooltip = Die Klassifikatoren der Aufzählung in der Reihenfolge, in der sie zur Auswahl angeboten werden.
model.tl.model.TLEnumeration.tooltip = Ein Typ, dessen Werte eine feste Menge von Klassifikatoren sind. Aufzählungen werden zur Klassifikation von Fachobjekten verwendet.
model.tl.model.TLModel = TL Modell
model.tl.model.TLModel.modules = Module
model.tl.model.TLModel.modules.tooltip = Die Module des Anwendungsmodells.
model.tl.model.TLModel.tooltip = Das Anwendungsmodell als Ganzes. Es ist die Wurzel des Modells und enthält alle Module der Anwendung.
model.tl.model.TLModelPart = Modellteil
model.tl.model.TLModelPart.annotations = Annotationen
model.tl.model.TLModelPart.annotations.tooltip = Die Annotationen des Modellelements. Sie konfigurieren dessen Verhalten und dessen Anzeige.
model.tl.model.TLModelPart.model = Modell
model.tl.model.TLModelPart.model.tooltip = Das Modell, zu dem dieses Element gehört.
model.tl.model.TLModelPart.tooltip = Basistyp aller Elemente des Anwendungsmodells: des Modells selbst, seiner Module, seiner Typen und deren Bestandteile. Jedes Modellelement kann annotiert werden.
model.tl.model.TLModule = Modul
model.tl.model.TLModule.singletons = Wurzelobjekte
model.tl.model.TLModule.singletons.tooltip = Die Wurzelobjekte des Moduls. Ein Wurzelobjekt wird automatisch mit dem Modul angelegt und dient als Einstiegspunkt in die Daten des Moduls.
model.tl.model.TLModule.tooltip = Ein Modul des Anwendungsmodells. Ein Modul fasst zusammengehörende Typen zusammen und bildet für diese den globalen Namensraum.
model.tl.model.TLModuleSingletons = Wurzelobjekte
model.tl.model.TLModuleSingletons.module = Modul
model.tl.model.TLModuleSingletons.module.tooltip = Das Modul, zu dem das Wurzelobjekt gehört.
model.tl.model.TLModuleSingletons.name = Name
model.tl.model.TLModuleSingletons.name.tooltip = Der Name, unter dem das Wurzelobjekt an seinem Modul abgerufen werden kann. Das Standard-Wurzelobjekt trägt den Namen "ROOT".
model.tl.model.TLModuleSingletons.singleton = Wurzelobjekt
model.tl.model.TLModuleSingletons.singleton.tooltip = Das Objekt, das als Wurzelobjekt des Moduls dient.
model.tl.model.TLModuleSingletons.tooltip = Die Zuordnung eines Wurzelobjekts zu einem Modul. Ein Modul kann mehrere Wurzelobjekte besitzen, die über ihren Namen unterschieden werden.
model.tl.model.TLNamedPart = Benannter Teil
model.tl.model.TLNamedPart.name = Name
model.tl.model.TLNamedPart.name.tooltip = Der technische Name des Modellelements. Er identifiziert das Element innerhalb seines Containers und wird in Konfigurationen und in TL-Script verwendet.
model.tl.model.TLNamedPart.tooltip = Basistyp aller Modellelemente, die einen Namen besitzen.
model.tl.model.TLObject = Fachobjekt
model.tl.model.TLObject.tType = Typ
model.tl.model.TLObject.tType.tooltip = Der Modelltyp, der dieses Objekt beschreibt.
model.tl.model.TLObject.tooltip = Basistyp aller Objekte, die in der Persistenzschicht gespeichert werden. Jedes Fachobjekt der Anwendung ist von diesem Typ.
model.tl.model.TLPrimitive = Datentyp
model.tl.model.TLPrimitive.binary = Binär
model.tl.model.TLPrimitive.binary.tooltip = Ob Werte dieses Datentyps byteweise verglichen werden. Texte unterscheiden dann zwischen Groß- und Kleinschreibung.
model.tl.model.TLPrimitive.dbPrecision = Datenbankpräzision
model.tl.model.TLPrimitive.dbPrecision.tooltip = Die Anzahl der Dezimalstellen der Datenbankspalte, in der ein Wert dieses Datentyps gespeichert wird.
model.tl.model.TLPrimitive.dbSize = Datenbankgröße
model.tl.model.TLPrimitive.dbSize.tooltip = Die Größe der Datenbankspalte, in der ein Wert dieses Datentyps gespeichert wird, z.B. die maximale Zeichenzahl eines Textes.
model.tl.model.TLPrimitive.dbType = Datenbanktyp
model.tl.model.TLPrimitive.dbType.tooltip = Der Typ der Datenbankspalte, in der ein Wert dieses Datentyps gespeichert wird.
model.tl.model.TLPrimitive.tooltip = Ein primitiver Datentyp wie eine Zahl, ein Text oder ein Datum. Ein Datentyp beschreibt, wie ein Wert in der Datenbank gespeichert und wie er angezeigt und eingegeben wird.
model.tl.model.TLProperty = Eigenschaft
model.tl.model.TLProperty.tooltip = Eine Eigenschaft eines Typs, deren Wert ein primitiver Wert wie eine Zahl, ein Text oder ein Datum ist.
model.tl.model.TLReference = Referenz
model.tl.model.TLReference.aggregate = Aggregation
model.tl.model.TLReference.aggregate.tooltip = Ob das referenzierte Objekt der Container des referenzierenden Objekts ist. Eine solche Referenz ist die Umkehrung einer Komposition.
model.tl.model.TLReference.backwards = Rückwärts
model.tl.model.TLReference.backwards.tooltip = Ob diese Referenz ihre Assoziation entgegen der Richtung navigiert, in der die Assoziation deklariert wurde.
model.tl.model.TLReference.composite = Komposition
model.tl.model.TLReference.composite.tooltip = Ob die referenzierten Objekte Bestandteile des referenzierenden Objekts sind. Bestandteile werden gemeinsam mit ihrem Container gelöscht.
model.tl.model.TLReference.deletionPolicy = Löschstrategie
model.tl.model.TLReference.deletionPolicy.tooltip = Legt fest, was mit dieser Referenz geschieht, wenn ein referenziertes Objekt gelöscht wird.
model.tl.model.TLReference.end = Assoziationsende
model.tl.model.TLReference.end.tooltip = Das Assoziationsende, zu dem diese Referenz navigiert. Die meisten Eigenschaften der Referenz werden von diesem Ende abgeleitet.
model.tl.model.TLReference.historyType = Historisierung
model.tl.model.TLReference.historyType.tooltip = Legt fest, ob die Referenz aktuelle Objekte, Objekte eines festen historischen Zustands oder beides aufnimmt.
model.tl.model.TLReference.opposite = Gegenrichtung
model.tl.model.TLReference.opposite.tooltip = Die Referenz, die dieselbe Assoziation in die entgegengesetzte Richtung navigiert.
model.tl.model.TLReference.oppositeEnd = Assoziationsende der Gegenrichtung
model.tl.model.TLReference.oppositeEnd.tooltip = Das Assoziationsende, von dem diese Referenz aus navigiert, also das Ende, das das referenzierende Objekt aufnimmt.
model.tl.model.TLReference.tooltip = Eine Referenz von einem Fachobjekt auf andere Fachobjekte. Eine Referenz wird durch eine Assoziation umgesetzt und navigiert diese in eine Richtung.
model.tl.model.TLScope = Bereich
model.tl.model.TLScope.tooltip = Basistyp für Objekte, in denen Typen definiert werden können. Neben dem Modul, in dem die global sichtbaren Typen definiert werden, kann auch ein Objekt Typen definieren, die nur lokal sichtbar sind.
model.tl.model.TLScope.types = Typen
model.tl.model.TLScope.types.tooltip = Die Typen, die in diesem Gültigkeitsbereich definiert sind.
model.tl.model.TLStructuredType = Strukturierter Typ
model.tl.model.TLStructuredType.localParts = Lokale Teile
model.tl.model.TLStructuredType.localParts.tooltip = Die Bestandteile, die an diesem Typ selbst deklariert sind. Bestandteile, die lediglich von einer Oberklasse geerbt werden, sind nicht enthalten.
model.tl.model.TLStructuredType.tooltip = Basistyp aller Typen, die Bestandteile besitzen, also Eigenschaften und Referenzen: Fachobjekttypen, Aufzählungen und Assoziationen.
model.tl.model.TLStructuredTypePart = Teil eines strukturierten Typs
model.tl.model.TLStructuredTypePart.abstract = Abstrakt
model.tl.model.TLStructuredTypePart.abstract.tooltip = Abstrakte Eigenschaften können nur in abstrakten Klassen definiert werden und müssen in konkreten Klassen überschrieben werden. Abstrakte Eigenschaften haben keine Speichervorschrift.
model.tl.model.TLStructuredTypePart.bag = Mehrfachnennungen
model.tl.model.TLStructuredTypePart.bag.tooltip = Darf ein Wert mehrfach auftreten?
model.tl.model.TLStructuredTypePart.classifiedBy = Klassifiziert durch
model.tl.model.TLStructuredTypePart.classifiedBy.tooltip = Die Klassifikatoren, die diesen Bestandteil einer oder mehreren Gruppen zuordnen. Über eine solche Klassifikation können z.B. die Sichtbarkeit des Bestandteils oder der Zugriff darauf gesteuert werden.
model.tl.model.TLStructuredTypePart.definition = Definition
model.tl.model.TLStructuredTypePart.definition.tooltip = Der Bestandteil, in dem dieser Bestandteil ursprünglich deklariert wurde. Bei einer Überschreibung ist dies der überschriebene Bestandteil der Oberklasse, ansonsten der Bestandteil selbst.
model.tl.model.TLStructuredTypePart.mandatory = Verpflichtend
model.tl.model.TLStructuredTypePart.mandatory.tooltip = Ob für diesen Bestandteil ein Wert angegeben werden muss.
model.tl.model.TLStructuredTypePart.multiple = Mehrfach
model.tl.model.TLStructuredTypePart.multiple.tooltip = Ob der Bestandteil mehrere Werte aufnehmen kann und nicht nur einen einzelnen.
model.tl.model.TLStructuredTypePart.ordered = Geordnet
model.tl.model.TLStructuredTypePart.ordered.tooltip = Ob die Reihenfolge der Werte erhalten bleibt. Nur für einen Bestandteil relevant, der mehrere Werte aufnehmen kann.
model.tl.model.TLStructuredTypePart.override = Überschreibung
model.tl.model.TLStructuredTypePart.override.tooltip = Ob dieser Bestandteil einen gleichnamigen Bestandteil einer Oberklasse überschreibt.
model.tl.model.TLStructuredTypePart.tooltip = Basistyp der Eigenschaften und Referenzen eines strukturierten Typs. Er definiert die für beide gemeinsamen Einstellungen wie Mehrfachwertigkeit, Pflichtangabe und Klassifikation.
model.tl.model.TLType = Typ
model.tl.model.TLType.module = Modul
model.tl.model.TLType.module.tooltip = Das Modul, in dem der Typ definiert ist.
model.tl.model.TLType.scope = Bereich
model.tl.model.TLType.scope.tooltip = Der Gültigkeitsbereich, in dem der Typ definiert ist. Bei einem global sichtbaren Typ ist dies sein Modul.
model.tl.model.TLType.tooltip = Basistyp aller Typen des Anwendungsmodells: Fachobjekttypen, Aufzählungen, Datentypen und Assoziationen.
model.tl.model.TLTypePart = Teil eines Typs
model.tl.model.TLTypePart.owner = Definitionstyp
model.tl.model.TLTypePart.owner.tooltip = Der Typ, an dem dieser Bestandteil deklariert ist.
model.tl.model.TLTypePart.tooltip = Basistyp aller Bestandteile eines Typs: Eigenschaften, Referenzen, Assoziationsenden und Klassifikatoren.
model.tl.model.TLTypePart.type = Zieltyp
model.tl.model.TLTypePart.type.tooltip = Der Typ der Werte dieses Bestandteils.
model.tl.model.tooltip = Modul mit den Typen, die das Anwendungsmodell selbst beschreiben. Jedes Element des Modells - Modul, Typ, Attribut - ist selbst ein Fachobjekt eines dieser Typen und kann daher wie Anwendungsdaten betrachtet und durchsucht werden.
