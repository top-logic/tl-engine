com.top_logic.layout.configedit.ConfigControlService.AnnotationControlMapping.impl.tooltip = Der <i>Annotations-Kontroll-Anbieter</i>, der die Kontrolle für eine Eigenschaft mit der Annotation erstellt. <p> Der Anbieter muss den Annotationstyp dieses Eintrags akzeptieren. </p>
com.top_logic.layout.configedit.ConfigControlService.Config.annotation-controls = Annotations-Kontrollen
com.top_logic.layout.configedit.ConfigControlService.Config.annotation-controls.tooltip = Kontrollen, die durch eine Annotation der bearbeiteten Eigenschaft gewählt werden. <p> Eine Eigenschaft, die eine der konfigurierten Annotationen trägt, an der Eigenschaft selbst oder an ihrem Werttyp, wird mit der Kontrolle bearbeitet, die der <i>Annotations-Kontroll-Anbieter</i> der Annotation erstellt. Trägt eine Eigenschaft mehrere der konfigurierten Annotationen, gewinnt der erste Eintrag dieser Liste, dessen Annotation vorhanden ist. </p> <p> Eine hier gewählte Kontrolle hat Vorrang vor jeder anderen Zuordnung dieses Dienstes und vor einer Auswahl. Nur eine verschlüsselte Eigenschaft wird nie mit einer hier gewählten Kontrolle bearbeitet. </p>
com.top_logic.layout.configedit.ConfigControlService.Config.control-providers = Kontroll-Anbieter
com.top_logic.layout.configedit.ConfigControlService.Config.control-providers.tooltip = Zuordnungen von der Kontrolle, die eine Eigenschaft mit der <i>Control-Provider</i>-Annotation der deklarativen Form nennt, zu der Kontrolle, mit der dieser Dienst sie bearbeitet, indiziert nach der Control-Provider-Klasse der Annotation. <p> Gesucht wird zuerst nach der annotierten Klasse, danach entlang ihrer Oberklassen; eine für einen Basis-Anbieter eingetragene Zuordnung gilt damit auch für dessen Spezialisierungen. Eine Eigenschaft, deren annotierter Anbieter keine Zuordnung hat, wird bearbeitet, als trüge sie keine solche Annotation. </p>
com.top_logic.layout.configedit.ConfigControlService.Config.formats = Formate
com.top_logic.layout.configedit.ConfigControlService.Config.formats.tooltip = Zuordnungen von Wertanbieter zu Kontroll-Anbieter, indiziert nach der Klasse des Wertanbieters der Eigenschaft. <p> Getrennt von <i>Anbieter</i>: Zwei Eigenschaften desselben Java-Typs (etwa Date) können verschiedene Wertanbieter tragen — ein reines Datum und eine Tageszeit sind beide ein Date —, so dass nur die Klasse des Wertanbieters sie unterscheiden kann, nicht der Java-Typ. Gesucht wird zuerst nach der konkreten Klasse des Wertanbieters, danach entlang seiner Oberklassen; eine für eine Basisklasse eingetragene Zuordnung gilt damit auch für deren Spezialisierungen. </p>
com.top_logic.layout.configedit.ConfigControlService.Config.providers = Anbieter
com.top_logic.layout.configedit.ConfigControlService.Config.providers.tooltip = Zuordnungen von Werttyp zu Anbieter, indiziert nach dem Java-Typ des Eigenschaftswerts.
com.top_logic.layout.configedit.ConfigControlService.ControlProviderMapping.impl = Implementierung
com.top_logic.layout.configedit.ConfigControlService.ControlProviderMapping.impl.tooltip = Der Kontroll-Anbieter, der für eine Eigenschaft verwendet wird, auf deren Annotation diese Zuordnung zutrifft.
com.top_logic.layout.configedit.ConfigControlService.ControlProviderMapping.provider = Anbieter
com.top_logic.layout.configedit.ConfigControlService.ControlProviderMapping.provider.tooltip = Die Control-Provider-Klasse (oder eine ihrer Oberklassen), die die <i>Control-Provider</i>-Annotation einer Eigenschaft nennen muss, damit diese Zuordnung gilt.
com.top_logic.layout.configedit.ConfigControlService.FormatMapping.impl = Implementierung
com.top_logic.layout.configedit.ConfigControlService.FormatMapping.impl.tooltip = Der Kontroll-Anbieter, der für eine von dieser Zuordnung beanspruchte Eigenschaft verwendet wird.
com.top_logic.layout.configedit.ConfigControlService.FormatMapping.provider = Wertanbieter
com.top_logic.layout.configedit.ConfigControlService.FormatMapping.provider.tooltip = Die Klasse des <i>Konfigurations-Wertanbieters</i> (oder eine ihrer Oberklassen), von der der Wertanbieter einer Eigenschaft eine Instanz sein muss, damit diese Zuordnung greift.
com.top_logic.layout.configedit.ConfigControlService.ProviderMapping.impl = Implementierung
com.top_logic.layout.configedit.ConfigControlService.ProviderMapping.impl.tooltip = Der Kontroll-Anbieter, der für Eigenschaften dieses Werttyps verwendet wird.
com.top_logic.layout.configedit.ConfigControlService.ProviderMapping.type = Typ
com.top_logic.layout.configedit.ConfigControlService.ProviderMapping.type.tooltip = Der Java-Typ des Eigenschaftswerts, für den diese Zuordnung gilt.
com.top_logic.layout.configedit.ConfigControlService.tooltip = Dienst, der die Eingabekontrolle für eine Konfigurationseigenschaft auflöst. <p> Löst eine Eigenschaft auf, deren Wert sich in eine einzige Kontrolle einbringen lässt: direkt nach ihrem Java-Typ, durch Auswahl aus einer festen Optionsmenge, oder als Text über einen Wertanbieter, der den Wert in Text umwandeln kann und zurück. Ob ein Format das kann, wird für den Wert entschieden, den die Eigenschaft gerade hält: Ein Format, das den Wert nicht akzeptiert - ein nur parsendes Format akzeptiert gar keinen -, lässt die Eigenschaft ohne Textform. Eine Eigenschaft, auf die nichts davon zutrifft, wird abgelehnt statt still von einem Bedienelement dargestellt, das mit ihrem Wert nicht umgehen könnte. Eine solche Eigenschaft (eine Struktur, eine Sammlung, eine komplexe Eigenschaft mit nur einer Wertbindung und ohne Format, oder eine, deren Format ihren Wert nicht ausdrücken kann) wird durch einen eigenen verschachtelten Editor oder Typauswähler dargestellt, bevor dieser Dienst überhaupt gefragt wird. </p> <p> Die Kontrolle für eine Eigenschaft wird in dieser Reihenfolge aufgelöst: </p> <ol> <li>Eine verschlüsselte Eigenschaft erhält immer das Passwortfeld, bewusst vor jedem anderen Schritt.</li> <li>Die Zuordnung von einer Annotation der Eigenschaft oder ihres Werttyps zu einer Kontrolle dieses Dienstes (<i>Annotations-Kontrollen</i>) - eine Annotation sagt, was der Wert bedeutet (etwa dass sein Text mehrere Zeilen umfasst), und die Zuordnung entscheidet, wie ein solcher Wert bearbeitet wird. Die erste konfigurierte Annotation, die die Eigenschaft trägt, gewinnt.</li> <li>Eine durch Auswahl aus einer festen Optionsmenge bearbeitete Eigenschaft erhält eine durchsuchbare Auswahlliste - die Auswahl modellbasierter Formulare -, ob sie eine Option aufnimmt oder mehrere.</li> <li>Die in diesem Dienst konfigurierte Zuordnung von Werttyp zu Anbieter (Anbieter).</li> <li>Die in diesem Dienst konfigurierte Zuordnung von Wertanbieter zu Anbieter (Formate) — sie beansprucht eine Eigenschaft, deren Wertanbieter (oder eine seiner Oberklassen) eingetragen ist, noch vor dem allgemeinen Format-Textfeld. Das ist es, was einem als Tageszeit formatierten Date ein Uhrzeit-Eingabefeld statt reinen Textes gibt: Die Zuordnung nach Java-Typ oben kann es nicht von einem reinen Datum unterscheiden, die Klasse des Wertanbieters aber schon.</li> <li>Die Zuordnung von der Kontrolle, die die <i>Control-Provider</i>-Annotation der deklarativen Form (an der Eigenschaft oder an ihrem Werttyp) nennt, zu einer Kontrolle dieses Dienstes (<i>Kontroll-Anbieter</i>) - etwa erhält eine mit <i>Mehrzeiliger Text</i> annotierte Eigenschaft ein mehrzeiliges Texteingabefeld. Eine Anbieter-Klasse ohne Zuordnung überlässt die Eigenschaft dem Rückfall.</li> <li>Der eingebaute Rückfall: die direkte Kontrolle für den Java-Typ der Eigenschaft - ein Date erhält eine Auswahl für Datum und Uhrzeit, die Form, in der sein Wert gespeichert wird -, andernfalls Text, geparst und formatiert über den eigenen ConfigurationValueProvider der Eigenschaft.</li> </ol> <p> Die beiden Annotations-Zuordnungen (<i>Annotations-Kontrollen</i> und <i>Kontroll-Anbieter</i>) wählen eine Kontrolle, nicht aber die Form des Werts, den sie bearbeitet: Eine Annotation sagt etwas über den Wert aus, nicht dass der Wert in einer anderen Form gehalten wird als der, in der die Eigenschaft sonst bearbeitet würde. Eine Wert-Zuordnung dagegen beansprucht die Eigenschaft für eine Kontrolle, die ihren typisierten Wert bearbeitet (eine internationalisierte Zeichenkette in einem Editor je Sprache, eine Farbe in einer Farbauswahl). Eine durch eine Annotation gewählte Kontrolle bearbeitet den Wert daher in der Form, die ihm die übrigen Regeln geben: den typisierten Wert einer Eigenschaft, deren Java-Typ eine der eingebauten Kontrollen direkt bearbeitet oder die eine Wert-Zuordnung beansprucht, die ausgewählten Optionen einer durch Auswahl bearbeiteten Eigenschaft, andernfalls den Text ihres Formats. </p> <p> Die konfigurierten Zuordnungen (<i>Annotations-Kontrollen</i>, <i>Anbieter</i>, <i>Formate</i> und <i>Kontroll-Anbieter</i>) sind es, die einem Modul oberhalb dieses Moduls erlauben, eine Kontrolle beizutragen - der TL-Script-Editor etwa liegt in tl-model-search-react. </p>
com.top_logic.layout.configedit.ConfigFormControl$Commands = Befehle
com.top_logic.layout.configedit.ConfigFormControl$Commands.tooltip = Wo die Befehle Bearbeiten, Übernehmen und Abbrechen eines <i>Konfigurationsformulars</i> dargestellt werden.
com.top_logic.layout.configedit.ConfigFormControl.Commands.INLINE = Im Formular
com.top_logic.layout.configedit.ConfigFormControl.Commands.INLINE.tooltip = Als Knöpfe des Formulars selbst, neben seinen Feldern. <p> Für eine eigenständige Verwendung, die keine Symbolleiste hat, in die sie gehören könnten. </p>
com.top_logic.layout.configedit.ConfigFormControl.Commands.NONE = Keine
com.top_logic.layout.configedit.ConfigFormControl.Commands.NONE.tooltip = Gar nicht - kein Bearbeitungsmodus, der Editor schreibt direkt in die übergebene Konfiguration.
com.top_logic.layout.configedit.ConfigFormControl.Commands.TOOLBAR = Symbolleiste
com.top_logic.layout.configedit.ConfigFormControl.Commands.TOOLBAR.tooltip = Nicht durch dieses Steuerelement: Die Befehle werden über <code>ConfigFormControl#commands()</code> herausgegeben, damit eine umgebende Symbolleiste sie darstellt. <p> Das tut ein aus einem Modell erzeugtes Formular, und deshalb sollte ein Konfigurationsformular innerhalb eines Panels es genauso tun - die Befehle sitzen in der Symbolleiste des Panels, und das Formular füllt das Panel. </p>
com.top_logic.layout.configedit.DatePickerFormatProvider = Datumswähler nach Format
com.top_logic.layout.configedit.DatePickerFormatProvider.Config.kind = Art
com.top_logic.layout.configedit.DatePickerFormatProvider.Config.kind.tooltip = Welchen Teil eines Zeitpunkts der Wert der beanspruchten Eigenschaft bezeichnet.
com.top_logic.layout.configedit.DatePickerFormatProvider.tooltip = <i>Konfigurations-Kontroll-Anbieter</i>, der einen <i>Datumswähler</i> einer festen <i>Art</i> erzeugt. <p> Gedacht als Implementierung eines <i>Format-Zuordnungs</i>-Eintrags, der eine Eigenschaft beansprucht, deren Wertanbieter ein Date auf einen bestimmten Teil eines Zeitpunkts einschränkt — etwa <i>Tageszeit als Date</i> auf <i>Uhrzeit</i>. Eingetragen wird er je Wertanbieter-Klasse (siehe <i>Formate</i>), nicht je Java-Typ: Ein formatiertes Date erreicht dieses Bedienelement über jene Zuordnung, noch vor dem allgemeinen Format-Textfeld, das der eingebaute Rückfall ihm sonst gibt — der Rückfall kann eine Tageszeit nicht von einem reinen Datum unterscheiden, weil beide ein Date sind, die Klasse des Wertanbieters aber schon. </p>
com.top_logic.layout.configedit.I18NStringFormatProvider = Anbieter für internationalisierte Zeichenketten
com.top_logic.layout.configedit.I18NStringFormatProvider.Config.rows = Zeilen
com.top_logic.layout.configedit.I18NStringFormatProvider.Config.rows.tooltip = Die Anzahl sichtbarer Zeilen des eingebetteten Eingabefeldes, oder 0 für eine einzelne Zeile.
com.top_logic.layout.configedit.I18NStringFormatProvider.tooltip = <i>Konfigurations-Kontroll-Anbieter</i>, der eine <i>Ressourcenschlüssel</i>-Eigenschaft so bearbeitet, wie ein Modellattribut vom Typ <i>Internationalisierte Zeichenkette</i> bearbeitet wird: ein eingebettetes Feld in der Sprache des Benutzers, dazu ein Knopf, der den Editor für die übrigen Sprachen öffnet. <p> Gedacht als Implementierung eines <i>Format-Zuordnungs</i>-Eintrags, der eine Eigenschaft beansprucht, deren Wertanbieter einen <i>Ressourcenschlüssel</i> liefert, etwa <i>Value format</i>. Ohne diesen Anspruch landet eine solche Eigenschaft beim eingebauten Rückfall, der nur die <em>kodierte</em> Form des Wertes als Text anbieten kann - eine einzelne Zeichenkette, die alle Sprachen zugleich in der Kodierung des Frameworks trägt. So bearbeitet niemand eine Übersetzung; derselbe Wert hat im Modell ein Eingabefeld je Sprache und maschinelle Übersetzung dazwischen, und ein konfigurierter sollte es nicht anders haben. </p> <p> Der Anspruch ist zugleich das, was diesem Bedienelement den benötigten Wert verschafft: Durch ihn liefert createModel das typisierte <i>Konfigurations-Feldmodell</i> über dem <i>Ressourcenschlüssel</i> selbst statt des <i>Konfigurations-Format-Feldmodells</i> über dessen kodiertem Text - und genau einen <i>Ressourcenschlüssel</i> liest und schreibt das <i>React-Eingabefeld für internationalisierte Zeichenketten</i>. </p>
com.top_logic.layout.configedit.MultiLineTextConfigProvider = Kontroll-Anbieter für mehrzeiligen Text
com.top_logic.layout.configedit.MultiLineTextConfigProvider.Config.rows = Zeilen
com.top_logic.layout.configedit.MultiLineTextConfigProvider.Config.rows.tooltip = Die Anzahl sichtbarer Zeilen des Textbereichs. <p> Die Annotation der deklarativen Form nennt nur eine Control-Provider-Klasse, die diese Form mit ihrer Standard-Zeilenzahl instanziiert; dies ist derselbe Standardwert. </p>
com.top_logic.layout.configedit.MultiLineTextConfigProvider.tooltip = <i>Konfigurations-Kontroll-Anbieter</i>, der eine Text-Eigenschaft in einem mehrzeiligen Textbereich bearbeitet. <p> Die Implementierung eines <i>Kontroll-Anbieter-Zuordnungs</i>-Eintrags, der den <i>Mehrzeiligen Text</i> der deklarativen Form diesem Dienst zuordnet: Eine damit annotierte Eigenschaft wird in einem <i>React-Texteingabefeld</i> über mehrere Zeilen bearbeitet. In jeder anderen Hinsicht verhält sich die Eingabe wie die einzeilige Texteingabe - ein formatierter Wert wird beim Verlassen des Feldes gesendet, ein reiner Text schon während der Eingabe. </p>
