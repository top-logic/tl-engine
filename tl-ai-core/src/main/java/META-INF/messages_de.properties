class.com.top_logic.ai.service.agents.I18NConstants.ADAPTIVE_THINKING_NOT_SUPPORTED = Adaptives Denken wird von diesem Modell nicht unterstützt. Verwenden Sie stattdessen 'ENABLED'.
class.com.top_logic.ai.service.agents.I18NConstants.MAX_TOKENS_MUST_EXCEED_THINKING_BUDGET = Die maximalen Token müssen größer sein als die denkbaren Budget-Token.
class.com.top_logic.ai.service.agents.I18NConstants.MAX_TOKENS_REQUIRED_WHEN_THINKING_ENABLED = Die maximale Anzahl von Token ist erforderlich, wenn der Denktyp AKTIVIERT ist.
class.com.top_logic.ai.service.agents.I18NConstants.THINKING_BUDGET_REQUIRED_WHEN_ENABLED = Das Denkbudget ist erforderlich, wenn die Denkart AKTIVIERT ist.
class.com.top_logic.ai.service.agents.background.I18NConstants.CHAT_CONTEXT_INPUT_NOT_ALLOWED_FOR_APPLICATION = Die Chat-Kontext-Eingabe erfordert einen Chat-Bereich. Verwenden Sie eine benutzerdefinierte Nachricht, ein TL-Skript oder eine Anbieter-Eingabe für Agenten, die in den Anwendungsbereich fallen.
class.com.top_logic.ai.service.agents.background.I18NConstants.CHAT_CONTEXT_INPUT_NOT_ALLOWED_FOR_PRE_TURN = Die Chat-Kontext-Eingabe ist für Pre-Turn-Trigger nicht verfügbar. Verwenden Sie stattdessen eine benutzerdefinierte Nachricht, ein TL-Skript oder eine Anbieter-Eingabe.
class.com.top_logic.ai.service.agents.background.I18NConstants.CHAT_TRIGGER_NOT_ALLOWED_FOR_APPLICATION = Pre-Turn- und Post-Turn-Trigger erfordern den Chat-Scope. Verwenden Sie einen geplanten Trigger für den Applikations-Scope.
com.top_logic.ai.service.agents.AgentConfig$ResponseFormatOption = Option Antwortformat
com.top_logic.ai.service.agents.AgentConfig$ResponseFormatOption.tooltip = Antwortformat-Optionen, die von OpenAI/Mistral-Buildern unterstützt werden.
com.top_logic.ai.service.agents.AgentConfig.ResponseFormatOption.DEFAULT = Standard
com.top_logic.ai.service.agents.AgentConfig.ResponseFormatOption.DEFAULT.tooltip = Verwenden Sie das Standardantwortformat des Anbieters.
com.top_logic.ai.service.agents.AgentConfig.ResponseFormatOption.JSON = JSON
com.top_logic.ai.service.agents.AgentConfig.ResponseFormatOption.JSON.tooltip = JSON-Antwortformat.
com.top_logic.ai.service.agents.AgentConfig.ResponseFormatOption.TEXT = Text
com.top_logic.ai.service.agents.AgentConfig.ResponseFormatOption.TEXT.tooltip = Antwortformat im Klartext.
com.top_logic.ai.service.agents.AgentConfig.description = Beschreibung
com.top_logic.ai.service.agents.AgentConfig.description.tooltip = Kurze Beschreibung des Zwecks dieses Agenten. <p> Wird als Werkzeugbeschreibung verwendet, wenn andere Agenten an diesen Agenten delegieren. Zum Beispiel: "Nur-Lese-Modellinspektion: Module, Typen, Teile, Anmerkungen, Suche". </p>
com.top_logic.ai.service.agents.AgentConfig.disable-parallel-tool-use = Parallele Werkzeugnutzung deaktivieren
com.top_logic.ai.service.agents.AgentConfig.disable-parallel-tool-use.tooltip = Ob Anthropic Werkzeugaufrufe parallel ausführen darf. <p> Nur für Anthropic-Modelle sichtbar. </p>
com.top_logic.ai.service.agents.AgentConfig.frequency-penalty = Häufigkeitsstrafe
com.top_logic.ai.service.agents.AgentConfig.frequency-penalty.tooltip = Die Häufigkeitsstrafe bestraft Token proportional dazu, wie oft sie bereits erschienen sind, und verringert so Wiederholungen (-2,0 bis 2,0). <p> Positive Werte verringern die Wahrscheinlichkeit, dass das Modell dieselben Phrasen wortwörtlich wiederholt. Nur für OpenAI-Modelle sichtbar. </p>
com.top_logic.ai.service.agents.AgentConfig.is-adaptive-thinking-capable = Unterstützt adaptives Denken
com.top_logic.ai.service.agents.AgentConfig.is-adaptive-thinking-capable.tooltip = Ob das gewählte Modell adaptives Denken unterstützt.
com.top_logic.ai.service.agents.AgentConfig.is-anthropic-provider = Ist Anthropic-Anbieter
com.top_logic.ai.service.agents.AgentConfig.is-anthropic-provider.tooltip = Ob das ausgewählte Modell zum Anthropic-Anbieter gehört.
com.top_logic.ai.service.agents.AgentConfig.is-mistral-provider = Ist Mistral-Anbieter
com.top_logic.ai.service.agents.AgentConfig.is-mistral-provider.tooltip = Ob das ausgewählte Modell zum Mistral-Anbieter gehört.
com.top_logic.ai.service.agents.AgentConfig.is-openai-provider = Ist OpenAI-Anbieter
com.top_logic.ai.service.agents.AgentConfig.is-openai-provider.tooltip = Ob das ausgewählte Modell zum OpenAI-Anbieter gehört.
com.top_logic.ai.service.agents.AgentConfig.is-reasoning-effort-capable = Unterstützt Reasoning-Aufwand
com.top_logic.ai.service.agents.AgentConfig.is-reasoning-effort-capable.tooltip = Ob das gewählte Modell den Reasoning-Aufwand unterstützt.
com.top_logic.ai.service.agents.AgentConfig.is-thinking-capable = Unterstützt erweitertes Denken
com.top_logic.ai.service.agents.AgentConfig.is-thinking-capable.tooltip = Ob das aktuell ausgewählte Modell erweitertes Denken unterstützt. <p> Diese abgeleitete Eigenschaft ist wahr, wenn das Modell <i>"Denken aktiviert"</i> oder <i>"Denken adaptiv"</i> unterstützt. Sie steuert die Sichtbarkeit von thinking-bezogenen Feldern. </p>
com.top_logic.ai.service.agents.AgentConfig.max-retries = Wiederholungsversuche
com.top_logic.ai.service.agents.AgentConfig.max-retries.tooltip = Maximale Wiederholungsversuche für vorübergehende Anbieter/API-Ausfälle.
com.top_logic.ai.service.agents.AgentConfig.max-tokens = Token
com.top_logic.ai.service.agents.AgentConfig.max-tokens.tooltip = Die maximale Anzahl der Ausgabe-Token für die Modellantwort. <p> Erforderlich, wenn der <i>Typ Thinking</i> <i>aktiviert</i> ist. </p>
com.top_logic.ai.service.agents.AgentConfig.model = Modell
com.top_logic.ai.service.agents.AgentConfig.model.tooltip = Der für diesen Agenten zu verwendende LLM-Modellname (z. B. "claude-sonnet-4-20250514"). <p> Die Optionen werden aus den in den Konfigurationen des <i>Agentenregistrierungsanbieters</i> aufgeführten Modellen ausgefüllt. </p>
com.top_logic.ai.service.agents.AgentConfig.presence-penalty = Presence Penalty
com.top_logic.ai.service.agents.AgentConfig.presence-penalty.tooltip = OpenAI Presence Penalty. <p> Nur sichtbar für OpenAI-Modelle. </p>
com.top_logic.ai.service.agents.AgentConfig.reasoning-effort = Reasoning-Aufwand
com.top_logic.ai.service.agents.AgentConfig.reasoning-effort.tooltip = Der Reasoning-Aufwand für OpenAI Reasoning-Modelle. <p> Nur sichtbar für Modelle, die Reasoning-Aufwand unterstützen (OpenAI o-series, GPT-5). </p>
com.top_logic.ai.service.agents.AgentConfig.response-format = Antwortformat
com.top_logic.ai.service.agents.AgentConfig.response-format.tooltip = Präferenz für das Antwortformat. <p> Nur sichtbar für Anbieter, die die Steuerung des Antwortformats unterstützen. </p>
com.top_logic.ai.service.agents.AgentConfig.return-thinking = Denkinhalte zurückgeben
com.top_logic.ai.service.agents.AgentConfig.return-thinking.tooltip = Ob das Denken des Modells in die Antwort einbezogen werden soll. <p> Nur sichtbar, wenn das Modell das Denken unterstützt und ein Denktyp ausgewählt ist. Bei "true" wird der Denkinhalt neben dem Antworttext eingefügt. </p>
com.top_logic.ai.service.agents.AgentConfig.seed = Seed
com.top_logic.ai.service.agents.AgentConfig.seed.tooltip = Seed für deterministische Ausgabe. Wenn diese Option gesetzt ist, sollten wiederholte Anfragen mit demselben Seed und denselben Parametern ähnliche Ergebnisse liefern. <p> Nützlich für Tests und Fehlersuche. Nur für OpenAI-Modelle sichtbar. </p>
com.top_logic.ai.service.agents.AgentConfig.send-thinking = Denkinhalte mitsenden
com.top_logic.ai.service.agents.AgentConfig.send-thinking.tooltip = Ob vorherige Denkblöcke in Folgemeldungen gesendet werden sollen. <p> Nur sichtbar, wenn das Modell Denken unterstützt und ein Denktyp ausgewählt ist. Bei "true" wird der Denkinhalt aus früheren Runden in den an das Modell gesendeten Gesprächsverlauf aufgenommen. </p>
com.top_logic.ai.service.agents.AgentConfig.skills = Skills
com.top_logic.ai.service.agents.AgentConfig.skills.tooltip = Durch Kommata getrennte Liste von Skill-IDs, die für diesen Agenten verfügbar sind. <p> Skills werden durch ihren registrierten Namen in der <i>Agentenregistrierungskonfiguration</i> referenziert. </p>
com.top_logic.ai.service.agents.AgentConfig.stop-sequences = Stopp-Sequenzen
com.top_logic.ai.service.agents.AgentConfig.stop-sequences.tooltip = Optionale Stoppsequenzen, die die Generierung beenden, wenn sie angetroffen werden.
com.top_logic.ai.service.agents.AgentConfig.system-prompt = System-Prompt
com.top_logic.ai.service.agents.AgentConfig.system-prompt.tooltip = Die System-Prompt, die das Verhalten und die Anweisungen dieses Agenten definiert.
com.top_logic.ai.service.agents.AgentConfig.temperature = Temperatur
com.top_logic.ai.service.agents.AgentConfig.temperature.tooltip = Die Abtasttemperatur für das Modell (0,0 bis 1,0). <p> Niedrigere Werte machen die Ausgabe deterministischer, höhere Werte machen sie kreativer. </p>
com.top_logic.ai.service.agents.AgentConfig.thinking-budget-tokens = Denkbudget (Token)
com.top_logic.ai.service.agents.AgentConfig.thinking-budget-tokens.tooltip = Die maximale Anzahl von Token, die das Modell für sein internes Denken verwenden darf. <p> Erforderlich, wenn <i>der Denktyp</i> <i>aktiviert</i> ist. Nur sichtbar, wenn das Modell Denken unterstützt und ein Denktyp ausgewählt ist. </p>
com.top_logic.ai.service.agents.AgentConfig.thinking-type = Denktyp
com.top_logic.ai.service.agents.AgentConfig.thinking-type.tooltip = Der Denktyp für die erweiterte Denkunterstützung. <p> Nur sichtbar, wenn das ausgewählte Modell Denken unterstützt (Anthropic-Modelle). <i>Adaptiv</i> lässt das Modell entscheiden, wann es denkt. <i>Aktiviert</i> erzwingt das Denken bei jeder Anfrage und erfordert das Setzen von <i>Denk-Budget-Token</i>. </p>
com.top_logic.ai.service.agents.AgentConfig.timeout-seconds = Zeitüberschreitung
com.top_logic.ai.service.agents.AgentConfig.timeout-seconds.tooltip = Anfrage-Timeout in Sekunden.
com.top_logic.ai.service.agents.AgentConfig.tools = Werkzeuge
com.top_logic.ai.service.agents.AgentConfig.tools.tooltip = Die für diesen Agenten verfügbaren Standardwerkzeuge, ausgewählt nach Namen. <p> Jeder Name steht für eine bekannte Werkzeugklasse. Die Werkzeuge werden zur Laufzeit von der <i>Agentenregistrierung</i> instanziiert. </p>
com.top_logic.ai.service.agents.AgentConfig.top-k = Top-K
com.top_logic.ai.service.agents.AgentConfig.top-k.tooltip = Top-k-Sampling-Parameter. <p> Nur sichtbar für Anthropic-Modelle. </p>
com.top_logic.ai.service.agents.AgentConfig.top-p = Top-P
com.top_logic.ai.service.agents.AgentConfig.top-p.tooltip = Top-P (Nucleus-Sampling) begrenzt die Token-Auswahl auf die kleinste Menge, deren kumulative Wahrscheinlichkeit diesen Schwellenwert überschreitet (0,0 bis 1,0). <p> Niedrigere Werte (z. B. 0,1) machen die Ausgabe fokussierter, höhere Werte (z. B. 0,9) erlauben mehr Vielfalt. </p>
com.top_logic.ai.service.agents.AgentRegistry = Agenten-Registrierung
com.top_logic.ai.service.agents.AgentRegistry$ProviderConfig = Anbieter-Konfiguration
com.top_logic.ai.service.agents.AgentRegistry$ProviderConfig.tooltip = Konfiguration für einen einzelnen LLM-Anbieter. <p> Jeder Anbieter hat einen Namen (z. B. "anthropic", "openai", "mistral"), API-Anmeldeinformationen und eine durch Kommata getrennte Liste von Modellnamen, die er bedient. </p>
com.top_logic.ai.service.agents.AgentRegistry.Config.agents = Agenten
com.top_logic.ai.service.agents.AgentRegistry.Config.agents.tooltip = Die konfigurierten Agenten, geordnet nach Agentennamen. <p> Jeder Eintrag definiert einen Agenten mit seinem Modell, seiner Eingabeaufforderung, seinen Werkzeugen und Fähigkeiten. </p>
com.top_logic.ai.service.agents.AgentRegistry.Config.default-model = Standardmodell
com.top_logic.ai.service.agents.AgentRegistry.Config.default-model.tooltip = Der Standardmodellname, der verwendet wird, wenn für einen Agenten kein Modell explizit angegeben ist. <p> Dieser sollte mit einem in einem der Anbieter aufgeführten Modell übereinstimmen. </p>
com.top_logic.ai.service.agents.AgentRegistry.Config.providers = Anbieter
com.top_logic.ai.service.agents.AgentRegistry.Config.providers.tooltip = Die konfigurierten LLM-Anbieter, verschlüsselt nach Anbieternamen. <p> Jeder Anbietereintrag enthält Verbindungsdetails (API-Schlüssel, Basis-URL) und eine durch Kommata getrennte Liste von Modellnamen, die er bedient. Bei der Erstellung eines Agenten gleicht die Registry den Modellnamen des Agenten mit diesen Listen ab, um den richtigen Anbieter auszuwählen. </p>
com.top_logic.ai.service.agents.AgentRegistry.Config.skills = Skills
com.top_logic.ai.service.agents.AgentRegistry.Config.skills.tooltip = Die konfigurierten Fertigkeiten, geordnet nach dem Namen der Fertigkeit. <p> Jeder Eintrag definiert einen wiederverwendbaren Skill mit seiner Beschreibung und seinem Prompt-Inhalt. Skills werden über den Namen von <i>Skills</i><i>(Agentenkonfiguration</i>) referenziert. </p>
com.top_logic.ai.service.agents.AgentRegistry.ProviderConfig.api-key = Api-Schlüssel
com.top_logic.ai.service.agents.AgentRegistry.ProviderConfig.api-key.tooltip = Der API-Schlüssel für die Authentifizierung beim Anbieter.
com.top_logic.ai.service.agents.AgentRegistry.ProviderConfig.base-url = Basis-URL
com.top_logic.ai.service.agents.AgentRegistry.ProviderConfig.base-url.tooltip = Die Basis-URL für die API des Anbieters. <p> Optional. Wenn nicht festgelegt, wird die Standard-URL für den Anbietertyp verwendet. </p>
com.top_logic.ai.service.agents.AgentRegistry.ProviderConfig.models = Modelle
com.top_logic.ai.service.agents.AgentRegistry.ProviderConfig.models.tooltip = Durch Kommata getrennte Liste von Modellnamen, die von diesem Anbieter bedient werden. <p> Wird verwendet, um Verweise auf Agentenmodelle mit dem richtigen Anbieter abzugleichen. Kann leer sein, wenn der Anbietername allein für den Abgleich ausreicht. </p>
com.top_logic.ai.service.agents.AgentRegistry.ProviderConfig.version = Version
com.top_logic.ai.service.agents.AgentRegistry.ProviderConfig.version.tooltip = Anbieter-spezifische API-Versionszeichenfolge. <p> Wird von Anthropic verwendet, um den anthropic-version-Header zu setzen. Wird von anderen Anbietern ignoriert. </p>
com.top_logic.ai.service.agents.AgentRegistry.tooltip = Register der zur Laufzeit konfigurierbaren Agenten, Fähigkeiten und LLM-Anbieterverbindungen. <p> Jeder Agent wird in XML über die <i>Agentenkonfiguration</i> deklariert und enthält seinen LLM-Modellnamen, optionale Denkparameter, Systemaufforderung, Werkzeuge und Fähigkeiten. Skills werden über die <i>Skill-Konfiguration</i> deklariert. LLM-Anbieterverbindungen werden über die <i>Anbieterkonfiguration</i> konfiguriert. </p> <p> Dieser Dienst validiert alle Konfigurationen beim Start, baut Provider-Verbindungen auf und bietet die Methode zur Ausführung von Agenten unter Verwendung der <i>tl-ai-core-Agentenschleife</i>. </p>
com.top_logic.ai.service.agents.AllModelNamesGenerator = Generator für alle Modellnamen
com.top_logic.ai.service.agents.AllModelNamesGenerator.tooltip = <i>Listengenerator-Adapter</i>, der alle verfügbaren AI-Modellnamen als Optionen bereitstellt. <p> Wird als <options> Generator für das Modell-Attribut von tl.ai.core:Agent verwendet. </p>
com.top_logic.ai.service.agents.AllToolNamesGenerator = Generator für alle Werkzeugnamen
com.top_logic.ai.service.agents.AllToolNamesGenerator.tooltip = <i>Listengenerator-Adapter</i>, der alle verfügbaren Werkzeugnamen als Optionen bereitstellt. <p> Verwendet als <options> Generator für das Attribut tools von tl.ai.core:Agent. </p>
com.top_logic.ai.service.agents.ChatAgentConfig = Konfiguration des Chat-Agenten
com.top_logic.ai.service.agents.ChatAgentConfig.delegations = Delegationen
com.top_logic.ai.service.agents.ChatAgentConfig.delegations.tooltip = Andere Agenten, an die dieser Agent delegieren kann, ausgewählt nach Namen. <p> Für jeden hier aufgeführten Namen eines Zielagenten wird zur Laufzeit von der <i>Agentenregistrierung</i> ein spezielles delegate_to_<name> Tool mit einem selbstbeschreibenden <i>Toolschema</i> erstellt. </p>
com.top_logic.ai.service.agents.ChatAgentConfig.entry-point = Einstiegspunkt
com.top_logic.ai.service.agents.ChatAgentConfig.entry-point.tooltip = Ob dieser Agent der Chat-Einstiegspunkt ist. <p> Es muss genau ein Agent in der <i>Agentenregistrierung</i> als Einstiegspunkt markiert sein. Das Chatsystem verwendet diesen Agenten, um eingehende Benutzernachrichten zu bearbeiten. </p>
com.top_logic.ai.service.agents.ChatAgentConfig.tooltip = Konfiguration für einen Agenten, der an der Chat-Organisationskette teilnimmt. <p> Ein Chat-Agent kann als Einstiegspunkt dienen, der Benutzernachrichten empfängt, oder als Spezialist, an den andere Agenten delegieren. </p>
com.top_logic.ai.service.agents.ReasoningEffort = Begründungsaufwand
com.top_logic.ai.service.agents.ReasoningEffort.HIGH = Hoch
com.top_logic.ai.service.agents.ReasoningEffort.HIGH.tooltip = Hoher Reasoning-Aufwand.
com.top_logic.ai.service.agents.ReasoningEffort.LOW = Niedrig
com.top_logic.ai.service.agents.ReasoningEffort.LOW.tooltip = Geringer Reasoning-Aufwand.
com.top_logic.ai.service.agents.ReasoningEffort.MEDIUM = Mittel
com.top_logic.ai.service.agents.ReasoningEffort.MEDIUM.tooltip = Mittlerer Reasoning-Aufwand (Standard für die meisten Reasoning-Modelle).
com.top_logic.ai.service.agents.ReasoningEffort.MINIMAL = Minimal
com.top_logic.ai.service.agents.ReasoningEffort.MINIMAL.tooltip = Minimaler Reasoning-Aufwand (GPT-5-Familie).
com.top_logic.ai.service.agents.ReasoningEffort.NONE = Kein Reasoning
com.top_logic.ai.service.agents.ReasoningEffort.NONE.tooltip = Kein Reasoning-Aufwand.
com.top_logic.ai.service.agents.ReasoningEffort.XHIGH = Extra hoch
com.top_logic.ai.service.agents.ReasoningEffort.XHIGH.tooltip = Besonders hohe Denkleistung (GPT-5.1-codex-max, GPT-5.2).
com.top_logic.ai.service.agents.ReasoningEffort.tooltip = Von OpenAI-Schlussfolgermodellen (o-Serie, GPT-5) unterstützte Reasoning-Aufwandsstufen. <p> Dies ist eine Obermenge aller bekannten Werte in den Modellfamilien. Nicht jedes Modell unterstützt jede Stufe; die verfügbaren Optionen werden dynamisch auf der Grundlage des ausgewählten Modells gefiltert. </p>
com.top_logic.ai.service.agents.ThinkingType = Denktyp
com.top_logic.ai.service.agents.ThinkingType.ADAPTIVE = Adaptiv
com.top_logic.ai.service.agents.ThinkingType.ADAPTIVE.tooltip = Das Modell entscheidet selbständig, wann und wie viel es denkt.
com.top_logic.ai.service.agents.ThinkingType.ENABLED = Aktiviert
com.top_logic.ai.service.agents.ThinkingType.ENABLED.tooltip = Das Modell verwendet immer das erweiterte Denken. Erfordert das Setzen von <i>Denk-Budget-Token</i><i>(Agenten-Konfiguration</i>).
com.top_logic.ai.service.agents.ThinkingType.tooltip = Erweiterte Denkweisen werden von LLM-Anbietern unterstützt (derzeit Anthropic).
com.top_logic.ai.service.agents.background.BackgroundAgentConfig = Konfiguration des Hintergrundagenten
com.top_logic.ai.service.agents.background.BackgroundAgentConfig$Scope = Scope
com.top_logic.ai.service.agents.background.BackgroundAgentConfig$Scope.tooltip = Legt den Scope des Hintergrundagenten fest.
com.top_logic.ai.service.agents.background.BackgroundAgentConfig.Scope.APPLICATION = Anwendung
com.top_logic.ai.service.agents.background.BackgroundAgentConfig.Scope.APPLICATION.tooltip = Der Agent arbeitet auf der Anwendungsebene, unabhängig von jeder Chatsitzung.
com.top_logic.ai.service.agents.background.BackgroundAgentConfig.Scope.CHAT = Chat
com.top_logic.ai.service.agents.background.BackgroundAgentConfig.Scope.CHAT.tooltip = Der Agent arbeitet im Kontext einer bestimmten Chatsitzung.
com.top_logic.ai.service.agents.background.BackgroundAgentConfig.input = Eingabe
com.top_logic.ai.service.agents.background.BackgroundAgentConfig.input.tooltip = Optionale zusätzliche Eingabekonfiguration für diesen Hintergrundagenten. <p> Bei Pre-Turn-Auslösern wird die anstehende Benutzernachricht immer in &lt;user-message&gt;-Tags verpackt. Wenn hier eine zusätzliche Eingabequelle konfiguriert wird, wird sie in einem &lt;additional-context&gt;-Block angehängt. </p> <p> Bei anderen Auslösertypen ist die Eingabekonfiguration die einzige Datenquelle für den Agenten. <i>Chat-Kontext</i> ist für Pre-Turn-Trigger oder anwendungsspezifische Agenten nicht verfügbar. </p>
com.top_logic.ai.service.agents.background.BackgroundAgentConfig.output-handlers = Output-Handler
com.top_logic.ai.service.agents.background.BackgroundAgentConfig.output-handlers.tooltip = Der Output-Hanlder, die die Ergebnisse dieses Hintergrundagenten verarbeiten. <p> Handler erhalten die rohe LLM-Antwort und können eine beliebige Verarbeitung durchführen. Zwei Handler-Typen sind verfügbar: <i>Konfiguration</i> für benutzerdefinierte Java-Klassen und <i>TL-Script-Ausgabe-Handler</i> für Inline-TL-Script. </p>
com.top_logic.ai.service.agents.background.BackgroundAgentConfig.scope = Umfang
com.top_logic.ai.service.agents.background.BackgroundAgentConfig.scope.tooltip = Der Einsatzbereich dieses Hintergrundagenten. <p> Standardmäßig ist dies die <i>Anwendung</i>. </p>
com.top_logic.ai.service.agents.background.BackgroundAgentConfig.tooltip = Konfiguration für einen Hintergrundagenten, der automatisch als Reaktion auf bestimmte Auslöser läuft. <p> Ein Hintergrund-Agent wird durch seinen <i>Anwendungsbereich</i>, einen <i>Auslöser</i>, der bestimmt, wann er läuft, eine <i>Eingabe</i>, die bestimmt, welche Daten er verarbeitet, und <i>Output-Handler</i>, die das Ergebnis verarbeiten, definiert. </p> <p> Ein Hintergrund-Agent kann weder ein Einstiegspunkt noch ein Delegationsziel sein. Er wird unabhängig ausgelöst und läuft außerhalb der Orchestrierungskette. </p>
com.top_logic.ai.service.agents.background.BackgroundAgentConfig.trigger = Auslöser
com.top_logic.ai.service.agents.background.BackgroundAgentConfig.trigger.tooltip = Die Auslösekonfiguration, die bestimmt, wann dieser Hintergrundagent aktiviert wird. <p> Wenn der Wert Null ist, ist der Hintergrund-Agent effektiv deaktiviert und wird nicht ausgelöst. Auf diese Weise kann ein Hintergrund-Agent schnell deaktiviert werden, ohne seine Konfiguration zu entfernen. </p>
com.top_logic.ai.service.agents.background.input.ChatContextInput = Chat-Kontext
com.top_logic.ai.service.agents.background.input.ChatContextInput$Content = Inhaltlicher Umfang
com.top_logic.ai.service.agents.background.input.ChatContextInput$Content.tooltip = Legt fest, wie viel vom Chat-Kontext in die Eingabe einfließen soll.
com.top_logic.ai.service.agents.background.input.ChatContextInput.Content.FULL_CHAT = Vollständiger Chat
com.top_logic.ai.service.agents.background.input.ChatContextInput.Content.FULL_CHAT.tooltip = Einschließlich des gesamten Chatverlaufs.
com.top_logic.ai.service.agents.background.input.ChatContextInput.Content.LAST_TURN = Letzte Runde
com.top_logic.ai.service.agents.background.input.ChatContextInput.Content.LAST_TURN.tooltip = Nur die letzte Runde (Benutzernachricht und Antwort des Assistenten) einbeziehen. <p> Dies ist die Standardeinstellung. </p>
com.top_logic.ai.service.agents.background.input.ChatContextInput.content = Inhaltlicher Umfang
com.top_logic.ai.service.agents.background.input.ChatContextInput.content.tooltip = Die Menge des Chat-Kontextes, die als Eingabe berücksichtigt werden soll. <p> Der Standardwert ist die <i>letzte Runde</i>. </p>
com.top_logic.ai.service.agents.background.input.ChatContextInput.tooltip = Eingabekonfiguration, die den Kontext der Chat-Konversation verwendet. <p> Der Hintergrund-Agent erhält je nach Einstellung des <i>Inhaltsbereichs</i> entweder die letzte Runde oder den gesamten Gesprächsverlauf als Eingabe. </p>
com.top_logic.ai.service.agents.background.input.CustomInput = Benutzerdefinierte Nachricht
com.top_logic.ai.service.agents.background.input.CustomInput.custom-message = Benutzerdefinierte Nachricht
com.top_logic.ai.service.agents.background.input.CustomInput.custom-message.tooltip = Die feste Nachricht, die als Eingabe an den Hintergrundagenten übergeben wird.
com.top_logic.ai.service.agents.background.input.CustomInput.tooltip = Eingabekonfiguration, die eine feste benutzerdefinierte Nachricht verwendet. <p> Der Hintergrund-Agent wird mit einer statischen Nachricht aufgerufen, die zur Konfigurationszeit definiert wird. Dies ist nützlich für autonome Agenten, die eine vordefinierte Aufgabe ausführen, ohne einen dynamischen Kontext zu benötigen. </p>
com.top_logic.ai.service.agents.background.input.ProviderInput = Anbieter
com.top_logic.ai.service.agents.background.input.ProviderInput.provider = Anbieter
com.top_logic.ai.service.agents.background.input.ProviderInput.provider.tooltip = Der Anbieter, der den Input für den Hintergrundagenten sammelt.
com.top_logic.ai.service.agents.background.input.ProviderInput.tooltip = Eingabekonfiguration, die an einen steckbaren <i>Eingabeanbieter</i> delegiert. <p> Auf diese Weise kann eine benutzerdefinierte Logik zur Erfassung von Eingaben als <i>Eingabeanbieter</i> implementiert und deklarativ konfiguriert werden. </p>
com.top_logic.ai.service.agents.background.input.ScriptInput = TL-Script
com.top_logic.ai.service.agents.background.input.ScriptInput.script = Script
com.top_logic.ai.service.agents.background.input.ScriptInput.script.tooltip = Der TL-Script-Ausdruck, der die Eingabe des Agenten erzeugt. <p> Das Skript wird im Kontext der Ausführung des Hintergrundagenten ausgewertet und muss einen String-Wert zurückgeben. </p>
com.top_logic.ai.service.agents.background.input.ScriptInput.tooltip = Eingabekonfiguration, die einen TL-Script-Ausdruck verwendet, um die Eingabe des Agenten zu erzeugen. <p> Das konfigurierte Skript wird zur Laufzeit ausgewertet, um die Eingabezeichenfolge zu erzeugen, die an den Hintergrundagenten übergeben wird. </p>
com.top_logic.ai.service.agents.background.output.OutputHandlerImplementation = Implementierung des Output-Handlers
com.top_logic.ai.service.agents.background.output.OutputHandlerImplementation.tooltip = Basisklasse für benutzerdefinierte Java-Ausgabe-Handler-Implementierungen. <p> Unterklassen erhalten die rohe LLM-Antwort und den <i>Hintergrundkontext</i> und können beliebige Verarbeitungen durchführen (Protokollierung, Benachrichtigungen, Persistenz usw.). </p>
com.top_logic.ai.service.agents.background.output.ScriptOutputHandler = TL-Script-Ausgabe-Handler
com.top_logic.ai.service.agents.background.output.ScriptOutputHandler.script = Skript
com.top_logic.ai.service.agents.background.output.ScriptOutputHandler.script.tooltip = Der auszuwertende TL-Script-Ausdruck. <p> Das erste Argument ist der rohe LLM-Antwortstring. Verwenden Sie log(), um in das Anwendungsprotokoll zu schreiben. </p>
com.top_logic.ai.service.agents.background.output.ScriptOutputHandler.tooltip = Output-Handler, der einen TL-Script-Ausdruck mit der Antwort des Agenten auswertet.
com.top_logic.ai.service.agents.background.scheduler.BackgroundAgentTask = Hintergrund-Agentenaufgabe
com.top_logic.ai.service.agents.background.scheduler.BackgroundAgentTask.Config.agent-name = Name des Agenten
com.top_logic.ai.service.agents.background.scheduler.BackgroundAgentTask.Config.agent-name.tooltip = Der Name des auszuführenden Hintergrundagenten.
com.top_logic.ai.service.agents.background.scheduler.BackgroundAgentTask.tooltip = TopLogic Scheduler-Aufgabe, die einen Hintergrundagenten ausführt und das Ergebnis protokolliert. <p> Wird mit einem Agentennamen konfiguriert. Wenn der Scheduler gemäß dem konfigurierten Zeitplan ausgelöst wird, erstellt diese Aufgabe einen <i>Anwendungskontext</i> und führt die Pipeline des Hintergrundagenten aus. </p>
com.top_logic.ai.service.agents.background.trigger.PostTurnTrigger = Post-Turn
com.top_logic.ai.service.agents.background.trigger.PostTurnTrigger.tooltip = Auslöser, der nach Beendigung einer Chat-Runde ausgelöst wird. <p> Der Hintergrundagent wird asynchron ausgeführt, nachdem der primäre Agent seine Antwort beendet hat. Dies ist nützlich für die Qualitätsüberwachung, Inhaltsüberprüfung oder Folgeaktionen, die die Antwort des Benutzers nicht verzögern sollten. </p>
com.top_logic.ai.service.agents.background.trigger.PreTurnTrigger = Vor der Wende
com.top_logic.ai.service.agents.background.trigger.PreTurnTrigger$FailPolicy = Fail-Richtlinie
com.top_logic.ai.service.agents.background.trigger.PreTurnTrigger$FailPolicy.tooltip = Richtlinie für die Behandlung von Zeitüberschreitungen.
com.top_logic.ai.service.agents.background.trigger.PreTurnTrigger.FailPolicy.CLOSED = Geschlossen
com.top_logic.ai.service.agents.background.trigger.PreTurnTrigger.FailPolicy.CLOSED.tooltip = Blockieren Sie die Nachricht, wenn der Hintergrund-Agent eine Zeitüberschreitung hat. <p> Verwenden Sie diese Richtlinie für sicherheitskritische Prüfungen, die abgeschlossen werden müssen, bevor die Nachricht weitergeleitet wird. </p>
com.top_logic.ai.service.agents.background.trigger.PreTurnTrigger.FailPolicy.OPEN = Offen
com.top_logic.ai.service.agents.background.trigger.PreTurnTrigger.FailPolicy.OPEN.tooltip = Erlauben Sie, dass der Vorgang fortgesetzt wird, wenn der Hintergrund-Agent ausfällt. <p> Dies ist die Standardrichtlinie, die sicherstellt, dass die Benutzerfreundlichkeit nicht durch Ausfälle des Hintergrundagenten beeinträchtigt wird. </p>
com.top_logic.ai.service.agents.background.trigger.PreTurnTrigger.fail-policy = Fail-Richtlinie
com.top_logic.ai.service.agents.background.trigger.PreTurnTrigger.fail-policy.tooltip = Die Richtlinie, die angewendet werden soll, wenn der Hintergrund-Agent die <i>Zeitüberschreitung</i> überschreitet. <p> Die Standardeinstellung ist " <i>offen"</i>, so dass der Vorgang auch dann fortgesetzt werden kann, wenn der Hintergrund-Agent noch nicht abgeschlossen ist. </p>
com.top_logic.ai.service.agents.background.trigger.PreTurnTrigger.timeout = Zeitüberschreitung
com.top_logic.ai.service.agents.background.trigger.PreTurnTrigger.timeout.tooltip = Die maximale Zeit in Millisekunden, die gewartet werden soll, bis der Hintergrund-Agent fertig ist, bevor die <i>Fail-Richtlinie</i> angewendet wird. <p> Der Standardwert ist 30000 (30 Sekunden). </p>
com.top_logic.ai.service.agents.background.trigger.PreTurnTrigger.tooltip = Auslöser, der ausgelöst wird, bevor ein Chatverlauf verarbeitet wird. <p> Der Hintergrundagent läuft synchron, bevor der primäre Agent die Nachricht des Benutzers verarbeitet. Dies ist nützlich für Inhaltsfilterung, Sicherheitsprüfungen oder Eingabevalidierung. Eine Zeitüberschreitung stellt sicher, dass der Benutzer nicht auf unbestimmte Zeit blockiert wird, und eine Fehlerrichtlinie bestimmt das Verhalten, wenn die Zeitüberschreitung überschritten wird. </p> <p> Der Agent empfängt immer die anstehende Benutzernachricht. Wenn eine zusätzliche Eingabekonfiguration festgelegt ist, wird die Eingabe mit XML-Tags strukturiert: </p> <pre> &lt;user-message&gt; Der ausstehende Text der Benutzernachricht &lt;/user-message&gt; &lt;additional-context&gt; Das Ergebnis der konfigurierten Eingabequelle &lt;/additional-context&gt; </pre> <p> Wenn keine Eingabekonfiguration festgelegt ist, empfängt der Agent die rohe Benutzernachricht ohne XML-Tags. Gestalten Sie die Systemaufforderung des Agenten entsprechend. </p>
com.top_logic.ai.service.agents.background.trigger.ScheduledTrigger = Geplant
com.top_logic.ai.service.agents.background.trigger.ScheduledTrigger.schedules = Zeitpläne
com.top_logic.ai.service.agents.background.trigger.ScheduledTrigger.schedules.tooltip = Die Zeitplanungsalgorithmen, die bestimmen, wann dieser Auslöser ausgelöst wird. <p> Es können mehrere Zeitpläne konfiguriert werden; der Auslöser wird immer dann ausgelöst, wenn einer von ihnen fällig ist. </p>
com.top_logic.ai.service.agents.background.trigger.ScheduledTrigger.tooltip = Auslöser, der nach einem zeitbasierten Zeitplan ausgelöst wird. <p> Der Hintergrund-Agent läuft periodisch nach einer oder mehreren Konfigurationen des <i>Planungsalgorithmus</i>. Dies ist nützlich für regelmäßige Überprüfungen, Berichterstellung oder Wartungsaufgaben. </p>
com.top_logic.ai.service.approval.ApprovalMode = Genehmigungsmodus
com.top_logic.ai.service.approval.ApprovalMode.AUTO_APPROVE = Auto genehmigen
com.top_logic.ai.service.approval.ApprovalMode.AUTO_APPROVE.tooltip = Alle Tool-Aufrufe werden automatisch und ohne Benutzerinteraktion genehmigt.
com.top_logic.ai.service.approval.ApprovalMode.MANUAL = Handbuch
com.top_logic.ai.service.approval.ApprovalMode.MANUAL.tooltip = Jeder Werkzeugaufruf erfordert eine manuelle Genehmigung durch den Benutzer.
com.top_logic.ai.service.approval.ApprovalMode.tooltip = Steuert, wie Werkzeugaufrufe im Human-in-the-Loop-Workflow genehmigt werden.
com.top_logic.ai.service.providers.ModelCapability = Modellfähigkeit
com.top_logic.ai.service.providers.ModelCapability.REASONING_EFFORT = Reasoning-Aufwand
com.top_logic.ai.service.providers.ModelCapability.REASONING_EFFORT.tooltip = Unterstützt den Parameter reasoning effort. <p> OpenAI reasoning_effort für o-series und GPT-5 Modelle. </p>
com.top_logic.ai.service.providers.ModelCapability.THINKING_ADAPTIVE = Adaptives Denken
com.top_logic.ai.service.providers.ModelCapability.THINKING_ADAPTIVE.tooltip = Unterstützt adaptives Denken, bei dem das Modell entscheidet, wann und wie viel es denken soll. <p> Anthropisches Denken: {type: "adaptive"}. Wird nur von neueren Claude-Modellen (Opus 4.6, Sonnet 4.6) unterstützt. </p>
com.top_logic.ai.service.providers.ModelCapability.THINKING_ENABLED = Denken ermöglicht
com.top_logic.ai.service.providers.ModelCapability.THINKING_ENABLED.tooltip = Unterstützt explizit erweitertes Denken mit einem Token-Budget. <p> Anthropisches Denken: {type: "enabled", budget_tokens: N}. </p>
com.top_logic.ai.service.providers.ModelCapability.tooltip = Fähigkeiten, die ein LLM-Modell über die grundlegende Texterstellung hinaus unterstützen kann. <p> Die Benutzeroberfläche der Agenten-Konfiguration verwendet diese, um die Sichtbarkeit von Feldern zu steuern und Parameterkombinationen zu validieren. </p>
com.top_logic.ai.service.scripting.AIScriptFunctions.agentChat = Agenten-Chat
com.top_logic.ai.service.scripting.AIScriptFunctions.agentChat.param.agentName.tooltip = Der Agentenname aus der Agentenkartei.
com.top_logic.ai.service.scripting.AIScriptFunctions.agentChat.param.userMessage.tooltip = Die Benutzernachricht, mit der der Agent aufgefordert werden soll.
com.top_logic.ai.service.scripting.AIScriptFunctions.agentChat.return = Die Antwort des KI-Agenten.
com.top_logic.ai.service.scripting.AIScriptFunctions.agentChat.tooltip = Rufen Sie einen KI-Agenten aus dem Register auf.
com.top_logic.ai.service.scripting.AIScriptFunctions.agentChatWithListener = Agenten-Chat mit Zuhörer
com.top_logic.ai.service.scripting.AIScriptFunctions.agentChatWithListener.param.agentName.tooltip = Der Agentenname aus der Agentenkartei.
com.top_logic.ai.service.scripting.AIScriptFunctions.agentChatWithListener.param.listener.tooltip = Empfängt Fortschrittsereignisse während des Laufs.
com.top_logic.ai.service.scripting.AIScriptFunctions.agentChatWithListener.param.userMessage.tooltip = Die Benutzernachricht, mit der der Agent aufgefordert werden soll.
com.top_logic.ai.service.scripting.AIScriptFunctions.agentChatWithListener.return = Die Antwort des KI-Agenten.
com.top_logic.ai.service.scripting.AIScriptFunctions.agentChatWithListener.tooltip = Aufruf eines AI-Agenten aus der Registry mit einem Event-Listener. <p> Wird nicht als TL-Script-Funktion angezeigt - verwendet einen eigenen Namen, um Mehrdeutigkeit in der Script-Registry zu vermeiden. </p>
com.top_logic.ai.service.scripting.AIScriptFunctions.callTool = Tool aufrufen
com.top_logic.ai.service.scripting.AIScriptFunctions.callTool.param.parameters.tooltip = Eine Zuordnung von Parameternamen zu Werten oder null, wenn das Werkzeug keine Parameter hat.
com.top_logic.ai.service.scripting.AIScriptFunctions.callTool.param.toolName.tooltip = Der qualifizierte Name des aufzurufenden Werkzeugs.
com.top_logic.ai.service.scripting.AIScriptFunctions.callTool.return = Das Ergebnis der Ausführung des Werkzeugs in Form einer Zeichenkette.
com.top_logic.ai.service.scripting.AIScriptFunctions.callTool.tooltip = Ruft ein Tool manuell mit den angegebenen Parametern auf. <p> Diese Funktion ermöglicht den direkten Aufruf von registrierten Werkzeugen aus TL-Script. Das Werkzeug wird durch seinen qualifizierten Namen im Format Fabrik-Name.Werkzeug-Name identifiziert. </p>
com.top_logic.ai.service.scripting.AIScriptFunctions.chat = Chat
com.top_logic.ai.service.scripting.AIScriptFunctions.chat.param.messages.tooltip = Eine Liste von Nachrichten. Jede Nachricht kann sein: <ul> <li>Zeichenkette: Wird als Benutzertextnachricht behandelt</li> <li>Karte mit "Rolle" und "Inhalt": Explizite Rolle (System/Benutzer/Assistent). Der Inhalt kann eine Zeichenkette, binäre Daten oder eine Liste mit gemischtem Inhalt sein.</li> <li>Binäre Daten: Werden als Bild-/Dokumentennachricht des Benutzers behandelt</li> </ul>
com.top_logic.ai.service.scripting.AIScriptFunctions.chat.param.model.tooltip = Der zu verwendende Modellname oder null, um das in der <i>Agentenregistrierung</i> konfigurierte Standardmodell zu verwenden.
com.top_logic.ai.service.scripting.AIScriptFunctions.chat.param.responseFormat.tooltip = Die Spezifikation des Antwortformats. Kann sein: <ul> <li>Null: Keine spezifische Formatanforderung</li> <li>Zeichenfolge "text" oder "json": Einfacher Formattyp</li> <li>Karte mit den Feldern "name" und "schema", die ein JSON-Schema für eine strukturierte Ausgabe beschreiben.</li> </ul>
com.top_logic.ai.service.scripting.AIScriptFunctions.chat.param.tools.tooltip = Eine Sammlung qualifizierter Werkzeugnamen, die dem KI-Agenten zur Verfügung gestellt werden sollen (z. B. ["mytools.calculateSum", "texttools.formatText"]), oder null, um keine Werkzeuge bereitzustellen.
com.top_logic.ai.service.scripting.AIScriptFunctions.chat.return = Der Antworttext des Assistenten.
com.top_logic.ai.service.scripting.AIScriptFunctions.chat.tooltip = Sendet eine Multiturn-Konversation an einen Chat-Abschlussanbieter. <p> Nachrichten können Strings, Maps mit Rolle/Inhalt oder Listen sein. Der Inhalt kann aus Textstrings oder <i>binären Daten</i> für Bilder und Dokumente bestehen. </p>
com.top_logic.ai.service.scripting.AIScriptFunctions.models = Modelle
com.top_logic.ai.service.scripting.AIScriptFunctions.models.return = Eine unveränderliche Liste mit allen konfigurierten Modellnamen.
com.top_logic.ai.service.scripting.AIScriptFunctions.models.tooltip = Gibt eine Liste aller verfügbaren Modellnamen aus der <i>Agentenregistrierung</i> zurück. <p> Die Modellnamen können an die <i>Chatfunktion</i> übergeben werden, um das zu verwendende KI-Modell auszuwählen. Die zurückgegebene Liste sorgt für eine konsistente Reihenfolge bei Aufrufen. </p>
com.top_logic.ai.service.scripting.AIScriptFunctions.runAgent = Agent ausführen
com.top_logic.ai.service.scripting.AIScriptFunctions.runAgent.param.agentName.tooltip = Der Agentenname, wie er in der KB gespeichert ist
com.top_logic.ai.service.scripting.AIScriptFunctions.runAgent.param.userMessage.tooltip = Die Benutzernachricht, die an den Agenten gesendet werden soll
com.top_logic.ai.service.scripting.AIScriptFunctions.runAgent.return = Die endgültige Textantwort des Agenten
com.top_logic.ai.service.scripting.AIScriptFunctions.runAgent.tooltip = Führt einen in der Wissensbasis definierten Agenten über AgentFactory aus. <p> Erstellt eine <i>Agentenschleife</i> aus einem KB-definierten Agenten und führt ihn mit der angegebenen Benutzernachricht aus. Der Agent wird anhand seines Namens aus den tl.ai.core:Agent-Modellinstanzen aufgelöst. </p>
com.top_logic.ai.service.scripting.AIScriptFunctions.toolInfo = Werkzeug-Infos
com.top_logic.ai.service.scripting.AIScriptFunctions.toolInfo.param.toolName.tooltip = Der qualifizierte Name des Werkzeugs.
com.top_logic.ai.service.scripting.AIScriptFunctions.toolInfo.return = Eine Karte, die die Metadaten des Werkzeugs mit der oben beschriebenen Struktur enthält, oder null, wenn das Werkzeug nicht gefunden wird.
com.top_logic.ai.service.scripting.AIScriptFunctions.toolInfo.tooltip = Ruft detaillierte Informationen über ein registriertes Werkzeug ab. <p> Diese Funktion gibt Metadaten über ein Werkzeug zurück, einschließlich seines Namens, seiner Beschreibung und seines Parameterschemas. Das Werkzeug wird durch seinen qualifizierten Namen im Format Fabrik-Name.Werkzeug-Name identifiziert. </p> <p> Die zurückgegebene Karte enthält: </p> <ul> <li>name - Der Name des Werkzeugs</li> <li>qualifiedName - Der vollständig qualifizierte Name des Werkzeugs</li> <li>description - Eine Beschreibung der Funktion des Werkzeugs</li> <li>inputSchemaJson - Die JSON-Schemazeichenkette für Werkzeugparameter</li> </ul>
com.top_logic.ai.service.scripting.AIScriptFunctions.tools = Werkzeuge
com.top_logic.ai.service.scripting.AIScriptFunctions.tools.return = Eine Liste mit allen registrierten Werkzeugnamen.
com.top_logic.ai.service.scripting.AIScriptFunctions.tools.tooltip = Gibt eine Liste aller verfügbaren Werkzeugnamen aus der <i>Werkzeugregistrierung</i> zurück. <p> Die Werkzeugnamen haben das qualifizierte Format Fabrikname.Werkzeugname. Diese Namen können an die <i>Chat-Funktion</i> übergeben werden, um dem KI-Agenten Werkzeuge zur Verfügung zu stellen. </p>
com.top_logic.ai.service.scripting.Converters.htmlToMarkdown = HTML zu Markdown
com.top_logic.ai.service.scripting.Converters.htmlToMarkdown.param.html.tooltip = Text im HTML-Format.
com.top_logic.ai.service.scripting.Converters.htmlToMarkdown.return = Markdown-formatierter Text.
com.top_logic.ai.service.scripting.Converters.htmlToMarkdown.tooltip = Konvertiert HTML in <i>Markdown</i>.
com.top_logic.ai.service.scripting.Converters.markdownToHtml = Markdown zu HTML
com.top_logic.ai.service.scripting.Converters.markdownToHtml.param.markdown.tooltip = Text im <i>Markdown-Format</i>.
com.top_logic.ai.service.scripting.Converters.markdownToHtml.return = HTML-Fragment, das gerendert werden kann.
com.top_logic.ai.service.scripting.Converters.markdownToHtml.tooltip = Konvertiert <i>Markdown</i> in HTML.
com.top_logic.ai.service.scripting.Converters.markdownToHtmlString = Markdown zu HTML-String
com.top_logic.ai.service.scripting.Converters.markdownToHtmlString.param.markdown.tooltip = Text im <i>Markdown-Format</i>.
com.top_logic.ai.service.scripting.Converters.markdownToHtmlString.return = HTML-Zeichenfolge.
com.top_logic.ai.service.scripting.Converters.markdownToHtmlString.tooltip = Konvertiert <i>Markdown</i> in eine HTML-Zeichenkette.
com.top_logic.ai.service.skills.SkillConfig = Konfiguration der Fertigkeiten
com.top_logic.ai.service.skills.SkillConfig.content = Inhalt
com.top_logic.ai.service.skills.SkillConfig.content.tooltip = Der eigentliche Prompt-Text dieser Fertigkeit.
com.top_logic.ai.service.skills.SkillConfig.description = Beschreibung
com.top_logic.ai.service.skills.SkillConfig.description.tooltip = Von Menschen lesbare Beschreibung des Zwecks dieser Fertigkeit.
com.top_logic.ai.service.skills.SkillConfig.tooltip = Konfiguration für einen einzelnen Skill in der <i>Agentenregistrierung</i>. <p> Ein Skill ist ein Anweisungsfragment, das Agenten bei Bedarf über loadSkill(id) laden können. Die ID und die Beschreibung des Skills erscheinen im Systemprompt-Katalog, damit der Agent weiß, wann er ihn laden muss. </p>
com.top_logic.ai.service.tools.TraceEventKind = Art des Trace-Ereignisses
com.top_logic.ai.service.tools.TraceEventKind.AGENT_CALL = Agenten-Aufruf
com.top_logic.ai.service.tools.TraceEventKind.AGENT_CALL.tooltip = Ein Agent delegiert an einen anderen (fromAgent, toAgent, Zusammenfassung der Arbeitsaufträge, Zusammenfassung der Ergebnisse).
com.top_logic.ai.service.tools.TraceEventKind.OUTPUT = Ausgabe
com.top_logic.ai.service.tools.TraceEventKind.OUTPUT.tooltip = Zwischentext aus dem LLM (der neben den Toolaufrufen vor der endgültigen Antwort erstellt wird).
com.top_logic.ai.service.tools.TraceEventKind.TOOL_CALL = Werkzeugaufruf
com.top_logic.ai.service.tools.TraceEventKind.TOOL_CALL.tooltip = Ein Werkzeug wurde aufgerufen (toolName, args, result).
com.top_logic.ai.service.tools.TraceEventKind.tooltip = Art des Eintrags in der Zeitleiste einer Ablaufverfolgung.
com.top_logic.ai.service.tools.help.TLScriptReferenceTool = Skript-Referenzwerkzeug
com.top_logic.ai.service.tools.help.TLScriptReferenceTool.tooltip = Werkzeug zum Auflisten von TLScript-Funktionen und zum Abrufen der Dokumentation. <p> Dieses Tool ermöglicht den Zugriff auf die TLScript-Funktionsregistrierung, so dass KI-Agenten verfügbare Funktionen entdecken und detaillierte Dokumentationen zu ihnen abrufen können. Es verwendet den <i>Search Builder</i>, um auf die Metadaten der Funktionen zuzugreifen. </p>
com.top_logic.ai.service.tools.model.AnnotationDefinitionExplorerTool = Explorer-Tool für Anmerkungsdefinitionen
com.top_logic.ai.service.tools.model.AnnotationDefinitionExplorerTool.tooltip = Werkzeug zur Erkundung von Schemata für Anmerkungsdefinitionen. <p> Dieses Tool ermöglicht es KI-Agenten, Anmerkungsdefinitionen zu verstehen (was konfiguriert werden KANN), nicht Anmerkungsinstanzen (was konfiguriert ist). Es bietet Schemainformationen, einschließlich Metadaten zu Eigenschaften, Typen, Einschränkungen und Standardeinstellungen. </p> <h3>Beispiel für die Verwendung:</h3> <pre> // Untersuchen einer bestimmten Anmerkungsdefinition describeAnnotation("com.top_logic.model.annotate.Visibility") // Untersuchen einer Formulardefinitionsanmerkung describeAnnotation("com.top_logic.model.form.definition.FormDefinition") </pre> <h3>Integration</h3>: <p> Registrieren Sie dieses Werkzeug über <i>annotierte Werkzeuge</i> und weisen Sie es einem Agenten über die Konfiguration <i>der Agentenregistrierung</i> zu. </p>
com.top_logic.ai.service.tools.model.InstanceBrowserTool = Instanz-Browser-Tool
com.top_logic.ai.service.tools.model.InstanceBrowserTool.tooltip = Tool für den Zugriff auf TopLogic-Instanzdaten aus der Wissensdatenbank. <p> Dieses Tool bietet Methoden zum Auflisten von Instanzen eines Typs mit Paginierung und zum Abrufen detaillierter Informationen über einzelne Instanzen. Alle Methoden geben JSON-formatierte Zeichenketten für die Verwendung durch KI-Agenten zurück. </p>
com.top_logic.ai.service.tools.model.ModelAnnotationBrowserTool = Browser-Tool für Modellkommentare
com.top_logic.ai.service.tools.model.ModelAnnotationBrowserTool.tooltip = Werkzeug zum Durchsuchen von Annotationen auf TopLogic-Modellelementen (Module, Typen, Teile, Aufzählungen, Klassifikatoren). <p> Mit diesem Tool können KI-Agenten die Metadaten von Annotationen auf Modellelementen mit optionaler Vererbungsunterstützung prüfen. Es liefert detaillierte Informationen über jede Anmerkung, einschließlich ihres Tag-Namens, der Konfigurationsschnittstelle und der Eigenschaftswerte. </p> <h3>Beispiel für die Verwendung:</h3> <pre> // Auflisten lokaler Anmerkungen zu einem Modul getCurrentAnnotations("tl.core", false) // Auflisten lokaler Anmerkungen zu einem Typ getCurrentAnnotations("tl.core:TLObject", false) // Auflisten aller Anmerkungen einschließlich vererbter getCurrentAnnotations("tl.core:TLObject", true) // Anmerkungen zu einer Aufzählung auflisten getCurrentAnnotations("tl.core:TLScope", false) // Anmerkungen zu einem Typteil auflisten getCurrentAnnotations("tl.core:TLObject#name", false) // Anmerkungen zu einem Klassifikator (Enum-Literal) auflisten getCurrentAnnotations("tl.core:TLScope#global", false) </pre> <h3>Integration</h3>: <p> Registrieren Sie dieses Tool über <i>annotierte Tools</i> und weisen Sie es einem Agenten über die Konfiguration <i>der Agentenregistrierung</i> zu. </p>
com.top_logic.ai.service.tools.model.ModelAnnotationEditorTool = Editor für Modellbeschriftungen
com.top_logic.ai.service.tools.model.ModelAnnotationEditorTool.tooltip = Werkzeug zum Setzen und Entfernen von Annotationen auf TopLogic-Modellelementen. <p> Mit diesem Tool können KI-Agenten Metadaten zu Modellelementen (Module, Typen, Teile, Klassifikatoren) ändern. Annotationskonfigurationen werden als JSON akzeptiert, die dem Schema des <i>Konfigurationsschematools</i> entsprechen. </p>
com.top_logic.ai.service.tools.model.ModelBrowserTool = Modell-Browser-Tool
com.top_logic.ai.service.tools.model.ModelBrowserTool.tooltip = Werkzeug zum Durchsuchen der TopLogic-Modellstruktur (Module, Typen, Teile). <p> Dieses Tool bietet drei Methoden, die die natürliche Hierarchie für die Modelluntersuchung bilden: Auflistung aller Module, Auflistung der Typen innerhalb eines Moduls und Auflistung der Eigenschaften/Referenzen eines Typs. Alle Methoden geben JSON-formatierte Strings zurück, die von KI-Agenten verwendet werden können. </p>
com.top_logic.ai.service.tools.model.ModelEditorTool = Modell-Editor-Werkzeug
com.top_logic.ai.service.tools.model.ModelEditorTool.tooltip = Werkzeug zum Erstellen und Aktualisieren von TopLogic-Modellelementen. <p> Dieses Tool bietet Methoden zum Erstellen und Aktualisieren von Modulen, Klassen, Eigenschaften, Referenzen, Rückwärtsreferenzen und Aufzählungen im TopLogic-Anwendungsmodell. </p> <p> Alle Methoden geben JSON-formatierte Zeichenketten zurück, die von KI-Agenten verwendet werden können. </p>
com.top_logic.ai.service.tools.model.ModelSearchTool = Werkzeug zur Modellsuche
com.top_logic.ai.service.tools.model.ModelSearchTool.tooltip = Werkzeug für die Suche im gesamten TopLogic-Anwendungsmodell. <p> Dieses Tool bietet eine intelligente Textsuche über Module, Typen (Klassen, Aufzählungen, Datentypen) und Eigenschaften/Referenzen. Es durchsucht technische Namen, qualifizierte Namen, Bezeichnungen und Beschreibungen und gibt die 10 relevantesten Treffer mit Kontextinformationen zurück. </p>
com.top_logic.ai.service.tools.model.SearchAnnotationTool = Werkzeug für Suchanmerkungen
com.top_logic.ai.service.tools.model.SearchAnnotationTool.tooltip = Tool zur Auflistung der verfügbaren Annotationstypen für TopLogic-Modellelemente. <p> Mit diesem Tool können KI-Agenten herausfinden, welche Annotationstypen auf ein bestimmtes Modellelement angewendet werden können. Es listet alle @InApp-Annotationsarten auf, gefiltert nach Art und Typ des Zielelements. </p>
com.top_logic.ai.service.tools.model.TypeAnalysisTool = Werkzeug zur Typenanalyse
com.top_logic.ai.service.tools.model.TypeAnalysisTool.tooltip = Werkzeug zur Analyse von TopLogic-Typ-Abhängigkeiten und -Beziehungen. <p> Dieses Tool bietet Methoden, um zu verstehen, wie Typen im gesamten Modell verwendet werden: Finden aller Verwendungen eines Typs und Finden, wo ein Teil definiert und vererbt wird. Alle Methoden geben JSON-formatierte Strings zurück, die von KI-Agenten verwendet werden können. </p>
com.top_logic.ai.service.tools.registry.ReflectiveToolFactory = Reflektierende Werkzeugfabrik
com.top_logic.ai.service.tools.registry.ReflectiveToolFactory.Config.tool-class = Werkzeugklasse
com.top_logic.ai.service.tools.registry.ReflectiveToolFactory.Config.tool-class.tooltip = Die Java-Klasse, die mit @ToolMethod annotierte Methoden enthält. <p> Diese Klasse wird nach Werkzeugdefinitionen durchsucht. Alle Methoden, die mit @ToolMethod annotiert sind, werden als AI-Tools angezeigt. </p>
com.top_logic.ai.service.tools.registry.ReflectiveToolFactory.tooltip = Eine <i>Werkzeugfabrik</i>, die reflektiv Werkzeuge aus einer Java-Klasse mit @ToolMethod-kommentierten Methoden entdeckt. <p> Diese Fabrik extrahiert Werkzeugspezifikationen aus der konfigurierten Klasse und erstellt entsprechende <i>Werkzeuginstanzen</i> für jede annotierte Methode. </p>
com.top_logic.ai.service.tools.registry.ScriptToolFactory = Script-Werkzeugfabrik
com.top_logic.ai.service.tools.registry.ScriptToolFactory.Config.tools = Werkzeuge
com.top_logic.ai.service.tools.registry.ScriptToolFactory.Config.tools.tooltip = Die zu erstellenden Werkzeuge. <p> Jedes Werkzeug wird durch seine Spezifikation (Name, Beschreibung, Parameter) und eine TL-Script-Implementierung definiert. </p>
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.description = Beschreibung
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.description.tooltip = Die Beschreibung dessen, was das Werkzeug tut.
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.implementation = Umsetzung
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.implementation.tooltip = Die TL-Script-Implementierung des Werkzeugs. <p> Das Skript erhält die Parameter des Tools als Variablen und sollte das Ergebnis des Tools als String zurückgeben. </p>
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.name = Name
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.name.tooltip = Der Name des Tools.
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.parameters = Parameter
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.parameters.tooltip = Die Parameter, die dieses Werkzeug akzeptiert. <p> Jeder Parameter wird durch seinen Namen und seine Konfiguration (Typ, Beschreibung usw.) definiert. </p>
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ToolParameterConfig.description = Beschreibung
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ToolParameterConfig.description.tooltip = Die Beschreibung des Parameters.
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ToolParameterConfig.name = Name
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ToolParameterConfig.name.tooltip = Der Name des Parameters.
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ToolParameterConfig.type = Typ
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ToolParameterConfig.type.tooltip = Der JSON-Schematyp des Parameters (z. B. "string", "number", "boolean", "object", "array").
com.top_logic.ai.service.tools.registry.ScriptToolFactory.tooltip = Eine <i>Werkzeugfabrik</i>, die Werkzeuge aus TL-Script-Implementierungen erstellt. <p> Mit dieser Fabrik können Werkzeuge direkt in der Konfiguration mit TL-Script-Code definiert werden. Jedes Werkzeug besteht aus einer Spezifikation (Name, Beschreibung, Parameter) und einem TL-Script-Ausdruck, der die Logik des Werkzeugs implementiert. </p>
com.top_logic.ai.service.tools.registry.ToolRegistry = Werkzeug-Register
com.top_logic.ai.service.tools.registry.ToolRegistry$ToolFactoryConfig = Werkzeug-Werkskonfiguration
com.top_logic.ai.service.tools.registry.ToolRegistry$ToolFactoryConfig.tooltip = Konfiguration für eine benannte Werkzeugfabrik.
com.top_logic.ai.service.tools.registry.ToolRegistry.Config.tool-factories = Werkzeugfabriken
com.top_logic.ai.service.tools.registry.ToolRegistry.Config.tool-factories.tooltip = Karte der benannten Werkzeugfabriken, die in der Anwendung verfügbar sind. <p> Jede Werkzeugfabrik wird durch einen eindeutigen Namen identifiziert. Der Fabrikname wird Teil des qualifizierten Werkzeugnamens (Fabrikname.Werkzeugname), mit dem in TL-Script-Funktionen auf Werkzeuge verwiesen wird. </p>
com.top_logic.ai.service.tools.registry.ToolRegistry.ToolFactoryConfig.implementation = Umsetzung
com.top_logic.ai.service.tools.registry.ToolRegistry.ToolFactoryConfig.implementation.tooltip = Die Implementierung der Werkzeugfabrik.
com.top_logic.ai.service.tools.registry.ToolRegistry.tooltip = Registrierungsdienst zur Verwaltung der in der Anwendung verfügbaren Werkzeuge. <p> Die Werkzeuge sind nach Fabriken organisiert. Jede Fabrik produziert einen Satz von Werkzeugen, und jedes Werkzeug wird durch einen qualifizierten Namen im Format {factory-name}{tool-name} identifiziert. So können Werkzeuge aus verschiedenen Fabriken denselben einfachen Namen haben, ohne dass es zu Konflikten kommt. </p>
com.top_logic.ai.service.tools.script.TLScriptTool = Skript-Tool
com.top_logic.ai.service.tools.script.TLScriptTool.tooltip = Werkzeug zur Validierung und Ausführung von TLScript-Code. <p> Dieses Tool ermöglicht die Validierung und Ausführung von TLScript. Beide Methoden verwenden den gemeinsamen <i>Skript-Executor</i> für die zentrale Validierungs- und Ausführungslogik. </p>
