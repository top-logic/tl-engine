com.top_logic.presentation.script.PptDeckFunctions.deck = Create presentation
com.top_logic.presentation.script.PptDeckFunctions.deck.param.footer.tooltip = The footer text shown on each slide whose layout has a footer placeholder. A slide sets its own footer by filling the footer placeholder in its <code>placeholders</code>.
com.top_logic.presentation.script.PptDeckFunctions.deck.param.name.tooltip = The file name of the result.
com.top_logic.presentation.script.PptDeckFunctions.deck.param.profile.tooltip = Entries overriding the template profile as reported by <code>pptProfile()</code>, e.g. <code>{"layouts": {"content": 10}}</code> to create content slides on the layout with index 10, or <code>{"roles": {"risk": "#C00000"}}</code> to define the color of the color role <code>risk</code>. Dictionaries are merged entry by entry.
com.top_logic.presentation.script.PptDeckFunctions.deck.param.slides.tooltip = The slides, each described by <code>pptSlide()</code> or an equivalent dictionary.
com.top_logic.presentation.script.PptDeckFunctions.deck.param.template.tooltip = The PowerPoint template (<code>.pptx</code> or <code>.potx</code>).
com.top_logic.presentation.script.PptDeckFunctions.deck.return = The presentation as <code>.pptx</code> file.
com.top_logic.presentation.script.PptDeckFunctions.deck.tooltip = Creates a PowerPoint presentation in the design of a template. <p> Each slide is created on a slide layout of the template: the layout given in the slide description, or the layout of the role <code>content</code>. Of the layout's placeholders, the slide shows only those that get a text: the title, the subtitle, the footer and the placeholders filled explicitly. Placeholder texts take the style of the template, unless the description formats them. The content elements are placed at their position; the elements without position are arranged one below the other in the content area of the layout. Texts that do not fit into their element are shrunk or cut off as requested by their <code>overflow</code>. A table that does not fit onto its slide, or a text marked with <code>split</code>, continues on further slides. The sample slides of the template are not part of the result. </p> <p> Example: </p> <pre> pptDeck($template, [ pptSlide(layout: "title", title: "Quarterly report", subtitle: "Q3 2026"), pptSlide(title: "Figures", content: pptTable([["Region", "Sales"], ["North", 12]], headerRows: 1)) ], footer: "Confidential", profile: {"roles": {"risk": "#C00000"}}) </pre>
com.top_logic.presentation.script.PptDeckFunctions.profile = Template profile
com.top_logic.presentation.script.PptDeckFunctions.profile.param.template.tooltip = The PowerPoint template (<code>.pptx</code> or <code>.potx</code>).
com.top_logic.presentation.script.PptDeckFunctions.profile.return = The dictionary describing the profile of the template.
com.top_logic.presentation.script.PptDeckFunctions.profile.tooltip = Describes what the creation of a presentation needs to know about a template beyond its slide layouts. <p> The profile is derived from the slide layouts of the template and can be adjusted for each presentation by the <code>profile</code> argument of <code>pptDeck()</code>. It is a dictionary with the following entries: </p> <ul> <li><code>layouts</code>: The index of the slide layout for each role: <code>title</code> (the title slide), <code>content</code> (a slide with title and content), <code>section</code> (the first slide of a section), <code>closing</code> (the last slide). A role without a suitable layout has no entry. A slide refers to these layouts by the role name.</li> <li><code>slideLayouts</code>: For each slide layout by its index: its <code>name</code>, the index of the placeholder taking the <code>subtitle</code>, the index of the placeholder taking the <code>footer</code>, and the <code>contentArea</code> (<code>x</code>, <code>y</code>, <code>width</code>, <code>height</code> in points), in which the content elements without position are arranged.</li> <li><code>roles</code>: The color for each color role name. A derived profile defines no color roles.</li> <li><code>gap</code>: The distance in points between the elements of a row or column that gives none, and between the content elements of a slide arranged one below the other (default 17).</li> <li><code>minFontSize</code>: The smallest font size in points to which a text is shrunk to fit into its element (default 10).</li> <li><code>continuationSuffix</code>: The text appended to the title of a slide continuing a table or text of the previous slide, separated by a space. The default is "(cont.)" in the language of the current user.</li> </ul> <p> The content layout is a layout with a title and a single large text placeholder, whose area becomes the content area. A layout without such a placeholder offers the area between title (or subtitle) and footer. The subtitle is a placeholder directly below the title, the footer a placeholder at the bottom of the slide. </p>
com.top_logic.presentation.script.PptDescriptionFunctions.cell = Describe a table cell
com.top_logic.presentation.script.PptDescriptionFunctions.cell.param.align.tooltip = The horizontal alignment: <code>left</code>, <code>center</code>, <code>right</code> or <code>justify</code>.
com.top_logic.presentation.script.PptDescriptionFunctions.cell.param.anchor.tooltip = The vertical alignment: <code>top</code>, <code>middle</code> or <code>bottom</code>.
com.top_logic.presentation.script.PptDescriptionFunctions.cell.param.bold.tooltip = Whether the text is bold.
com.top_logic.presentation.script.PptDescriptionFunctions.cell.param.caps.tooltip = Whether the text is shown in capital letters.
com.top_logic.presentation.script.PptDescriptionFunctions.cell.param.color.tooltip = The text color.
com.top_logic.presentation.script.PptDescriptionFunctions.cell.param.fill.tooltip = The fill of the cell: a color or <code>none</code>.
com.top_logic.presentation.script.PptDescriptionFunctions.cell.param.font.tooltip = The font family.
com.top_logic.presentation.script.PptDescriptionFunctions.cell.param.insets.tooltip = The inner margins: a number for all sides or a dictionary with the entries <code>left</code>, <code>top</code>, <code>right</code> and <code>bottom</code>.
com.top_logic.presentation.script.PptDescriptionFunctions.cell.param.italic.tooltip = Whether the text is italic.
com.top_logic.presentation.script.PptDescriptionFunctions.cell.param.overflow.tooltip = What happens to a word that is wider than the column: <code>shrink</code> (the default) reduces the font size, but not below the <code>minFontSize</code> of the template profile, and cuts the text off with "…" if the word still does not fit; <code>ellipsis</code> cuts the text off without reducing the font size; <code>visible</code> breaks the word; <code>error</code> stops the creation of the presentation.
com.top_logic.presentation.script.PptDescriptionFunctions.cell.param.size.tooltip = The font size.
com.top_logic.presentation.script.PptDescriptionFunctions.cell.param.spacing.tooltip = Additional space between characters, negative to condense the text.
com.top_logic.presentation.script.PptDescriptionFunctions.cell.param.text.tooltip = The text of the cell.
com.top_logic.presentation.script.PptDescriptionFunctions.cell.param.underline.tooltip = Whether the text is underlined.
com.top_logic.presentation.script.PptDescriptionFunctions.cell.return = The dictionary describing the cell.
com.top_logic.presentation.script.PptDescriptionFunctions.cell.tooltip = Describes a table cell with its own formatting.
com.top_logic.presentation.script.PptDescriptionFunctions.color = Describe a color
com.top_logic.presentation.script.PptDescriptionFunctions.color.param.alpha.tooltip = The opacity between 0 (transparent) and 1 (opaque).
com.top_logic.presentation.script.PptDescriptionFunctions.color.param.color.tooltip = The base color: a theme color name, a hexadecimal color, a color role name or a color dictionary, whose modifications are kept unless given here.
com.top_logic.presentation.script.PptDescriptionFunctions.color.param.lumMod.tooltip = Factor for the brightness, e.g. 0.75 to darken.
com.top_logic.presentation.script.PptDescriptionFunctions.color.param.lumOff.tooltip = Offset for the brightness between -1 and 1, e.g. 0.4 together with a <code>lumMod</code> of 0.6 to lighten.
com.top_logic.presentation.script.PptDescriptionFunctions.color.param.satMod.tooltip = Factor for the saturation.
com.top_logic.presentation.script.PptDescriptionFunctions.color.param.satOff.tooltip = Offset for the saturation between -1 and 1.
com.top_logic.presentation.script.PptDescriptionFunctions.color.param.shade.tooltip = Mixes the color with black: 1 keeps the color, 0 is black.
com.top_logic.presentation.script.PptDescriptionFunctions.color.param.tint.tooltip = Mixes the color with white: 1 keeps the color, 0 is white.
com.top_logic.presentation.script.PptDescriptionFunctions.color.return = The dictionary describing the color.
com.top_logic.presentation.script.PptDescriptionFunctions.color.tooltip = Describes a color modified in brightness, saturation or transparency. <p> Example: <code>pptColor("accent1", lumMod: 0.75)</code> is the first accent color of the theme, darkened to 75% brightness. All modifications are given as fractions, e.g. 0.75 for 75%. </p> <p> The result is a dictionary with the entry <code>"scheme"</code> (theme color), <code>"rgb"</code> (fixed color) or <code>"role"</code> (color role) and the given modifications. </p>
com.top_logic.presentation.script.PptDescriptionFunctions.column = Describe a column
com.top_logic.presentation.script.PptDescriptionFunctions.column.param.align.tooltip = The horizontal alignment of children with own width: <code>stretch</code> (the default) and <code>start</code> align them left, <code>center</code> centers them, <code>end</code> aligns them right.
com.top_logic.presentation.script.PptDescriptionFunctions.column.param.children.tooltip = The elements of the column: shapes, text boxes, tables, images, rows and columns.
com.top_logic.presentation.script.PptDescriptionFunctions.column.param.gap.tooltip = The vertical distance between two children. If not given, the <code>gap</code> of the template profile is used.
com.top_logic.presentation.script.PptDescriptionFunctions.column.param.height.tooltip = The height, or <code>auto</code> for the height of its children.
com.top_logic.presentation.script.PptDescriptionFunctions.column.param.weight.tooltip = The share in the free space of an enclosing row or column, or of the content area. The default is 1.
com.top_logic.presentation.script.PptDescriptionFunctions.column.param.weights.tooltip = The shares of the children in the remaining height, one number for each child.
com.top_logic.presentation.script.PptDescriptionFunctions.column.param.width.tooltip = The width.
com.top_logic.presentation.script.PptDescriptionFunctions.column.param.x.tooltip = The horizontal position of the left border. If neither <code>x</code> nor <code>y</code> is given, the column is arranged with the other content of the slide.
com.top_logic.presentation.script.PptDescriptionFunctions.column.param.y.tooltip = The vertical position of the top border.
com.top_logic.presentation.script.PptDescriptionFunctions.column.return = The dictionary describing the column.
com.top_logic.presentation.script.PptDescriptionFunctions.column.tooltip = Describes a column: elements arranged one below the other. <p> Example: a text of its natural height above a table taking the rest: <code>pptColumn([pptTextBox("Summary", height: "auto"), pptTable($rows, headerRows: 1)])</code> </p> <p> A child with a <code>height</code> gets this height, a child with height <code>auto</code> the height of its content at the width of the column. The other children share the remaining height by their <code>weight</code> (default 1), or by the <code>weights</code> of the column. Horizontally, a child without own width takes the width of the column. Children have no position of their own. Rows and columns can be nested arbitrarily. </p> <p> Several content elements of a slide without position are arranged as in a column. </p>
com.top_logic.presentation.script.PptDescriptionFunctions.gradient = Describe a color gradient
com.top_logic.presentation.script.PptDescriptionFunctions.gradient.param.angle.tooltip = The direction of a linear gradient in degrees, clockwise with 0 (the default) running from left to right.
com.top_logic.presentation.script.PptDescriptionFunctions.gradient.param.path.tooltip = The shape of a gradient spreading from the center: <code>circle</code>, <code>rect</code> or <code>shape</code>. Not to be given together with an angle.
com.top_logic.presentation.script.PptDescriptionFunctions.gradient.param.stops.tooltip = The colors along the gradient, at least two. A color is placed at an even distance from its neighbors, unless given as dictionary with the entries <code>"position"</code> (between 0 and 1) and <code>"color"</code>.
com.top_logic.presentation.script.PptDescriptionFunctions.gradient.return = The dictionary describing the gradient.
com.top_logic.presentation.script.PptDescriptionFunctions.gradient.tooltip = Describes a color gradient to fill a shape. <p> Example: <code>pptGradient(["accent1", "accent2"], angle: 90)</code> runs from the first accent color at the top to the second at the bottom. </p>
com.top_logic.presentation.script.PptDescriptionFunctions.image = Describe an image
com.top_logic.presentation.script.PptDescriptionFunctions.image.param.data.tooltip = The image, e.g. a PNG, JPEG or SVG file.
com.top_logic.presentation.script.PptDescriptionFunctions.image.param.fit.tooltip = How the image is fitted into its bounds: <code>contain</code> (the default) shows the whole image as large as possible, <code>cover</code> fills the bounds and cuts off what exceeds them, <code>stretch</code> distorts the image to the bounds.
com.top_logic.presentation.script.PptDescriptionFunctions.image.param.height.tooltip = The height, or <code>auto</code> for the height of the image keeping its aspect ratio at its width.
com.top_logic.presentation.script.PptDescriptionFunctions.image.param.weight.tooltip = The share in the free space of a row or column (<code>pptRow()</code>, <code>pptColumn()</code>) or of the content area, if no own size is given. The default is 1.
com.top_logic.presentation.script.PptDescriptionFunctions.image.param.width.tooltip = The width.
com.top_logic.presentation.script.PptDescriptionFunctions.image.param.x.tooltip = The horizontal position of the left border.
com.top_logic.presentation.script.PptDescriptionFunctions.image.param.y.tooltip = The vertical position of the top border.
com.top_logic.presentation.script.PptDescriptionFunctions.image.return = The dictionary describing the image.
com.top_logic.presentation.script.PptDescriptionFunctions.image.tooltip = Describes an image.
com.top_logic.presentation.script.PptDescriptionFunctions.line = Describe an outline
com.top_logic.presentation.script.PptDescriptionFunctions.line.param.color.tooltip = The line color.
com.top_logic.presentation.script.PptDescriptionFunctions.line.param.dash.tooltip = The dash style: <code>solid</code>, <code>dot</code>, <code>dash</code>, <code>lgDash</code>, <code>dashDot</code>, <code>lgDashDot</code>, <code>lgDashDotDot</code>, <code>sysDash</code>, <code>sysDot</code>, <code>sysDashDot</code> or <code>sysDashDotDot</code>.
com.top_logic.presentation.script.PptDescriptionFunctions.line.param.width.tooltip = The line width.
com.top_logic.presentation.script.PptDescriptionFunctions.line.return = The dictionary describing the outline.
com.top_logic.presentation.script.PptDescriptionFunctions.line.tooltip = Describes the outline of a shape.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph = Describe a paragraph
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.param.align.tooltip = The horizontal alignment: <code>left</code>, <code>center</code>, <code>right</code> or <code>justify</code>.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.param.bold.tooltip = Whether the text is bold.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.param.bullet.tooltip = The bullet: <code>true</code> or <code>false</code> to switch the bullet of the placeholder on or off, <code>none</code>, the bullet character, or a dictionary with the entries <code>char</code> and <code>color</code>.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.param.caps.tooltip = Whether the text is shown in capital letters.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.param.color.tooltip = The text color.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.param.font.tooltip = The font family.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.param.italic.tooltip = Whether the text is italic.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.param.level.tooltip = The indentation level from 0 (the default) to 8.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.param.lineSpacing.tooltip = The line spacing as multiple of the single line height, e.g. 1.2.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.param.runs.tooltip = The content of the paragraph: a string, a text run (<code>pptRun()</code>) or a list of those.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.param.size.tooltip = The font size.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.param.spaceAfter.tooltip = The space after the paragraph.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.param.spaceBefore.tooltip = The space before the paragraph.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.param.spacing.tooltip = Additional space between characters, negative to condense the text.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.param.underline.tooltip = Whether the text is underlined.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.return = The dictionary describing the paragraph.
com.top_logic.presentation.script.PptDescriptionFunctions.paragraph.tooltip = Describes a paragraph of a text. <p> The formatting arguments (font, size, color, ...) apply to all runs of the paragraph, unless a run defines its own formatting. </p>
com.top_logic.presentation.script.PptDescriptionFunctions.row = Describe a row
com.top_logic.presentation.script.PptDescriptionFunctions.row.param.align.tooltip = The vertical alignment of the children: <code>stretch</code> (the default), <code>start</code>, <code>center</code> or <code>end</code>.
com.top_logic.presentation.script.PptDescriptionFunctions.row.param.children.tooltip = The elements of the row: shapes, text boxes, tables, images, rows and columns.
com.top_logic.presentation.script.PptDescriptionFunctions.row.param.gap.tooltip = The horizontal distance between two children. If not given, the <code>gap</code> of the template profile is used.
com.top_logic.presentation.script.PptDescriptionFunctions.row.param.height.tooltip = The height, or <code>auto</code> for the height of the highest child.
com.top_logic.presentation.script.PptDescriptionFunctions.row.param.weight.tooltip = The share in the free space of an enclosing row or column, or of the content area. The default is 1.
com.top_logic.presentation.script.PptDescriptionFunctions.row.param.weights.tooltip = The shares of the children in the remaining width, one number for each child.
com.top_logic.presentation.script.PptDescriptionFunctions.row.param.width.tooltip = The width.
com.top_logic.presentation.script.PptDescriptionFunctions.row.param.x.tooltip = The horizontal position of the left border. If neither <code>x</code> nor <code>y</code> is given, the row is arranged with the other content of the slide.
com.top_logic.presentation.script.PptDescriptionFunctions.row.param.y.tooltip = The vertical position of the top border.
com.top_logic.presentation.script.PptDescriptionFunctions.row.return = The dictionary describing the row.
com.top_logic.presentation.script.PptDescriptionFunctions.row.tooltip = Describes a row: elements arranged side by side. <p> Example: three cards of equal width, the middle one twice as wide: <code>pptRow([pptShape(fill: "accent1", text: "A"), pptShape(fill: "accent2", text: "B", weight: 2), pptShape(fill: "accent3", text: "C")])</code> </p> <p> A child with a <code>width</code> gets this width. The other children share the remaining width by their <code>weight</code> (default 1), or by the <code>weights</code> of the row. Vertically, a child without own height is stretched to the height of the row, unless <code>align</code> is given; then it gets the height of its content. Children have no position of their own. Rows and columns can be nested arbitrarily. </p>
com.top_logic.presentation.script.PptDescriptionFunctions.run = Describe a text run
com.top_logic.presentation.script.PptDescriptionFunctions.run.param.bold.tooltip = Whether the text is bold.
com.top_logic.presentation.script.PptDescriptionFunctions.run.param.caps.tooltip = Whether the text is shown in capital letters.
com.top_logic.presentation.script.PptDescriptionFunctions.run.param.color.tooltip = The text color.
com.top_logic.presentation.script.PptDescriptionFunctions.run.param.font.tooltip = The font family.
com.top_logic.presentation.script.PptDescriptionFunctions.run.param.hyperlink.tooltip = The URL the text links to.
com.top_logic.presentation.script.PptDescriptionFunctions.run.param.italic.tooltip = Whether the text is italic.
com.top_logic.presentation.script.PptDescriptionFunctions.run.param.size.tooltip = The font size.
com.top_logic.presentation.script.PptDescriptionFunctions.run.param.spacing.tooltip = Additional space between characters, negative to condense the text.
com.top_logic.presentation.script.PptDescriptionFunctions.run.param.text.tooltip = The text. A line break breaks the line without starting a new paragraph.
com.top_logic.presentation.script.PptDescriptionFunctions.run.param.underline.tooltip = Whether the text is underlined.
com.top_logic.presentation.script.PptDescriptionFunctions.run.return = The dictionary describing the text run.
com.top_logic.presentation.script.PptDescriptionFunctions.run.tooltip = Describes a part of a paragraph with its own formatting. <p> Example: <code>pptParagraph([pptRun("Note: ", bold: true), "the rest"])</code> </p>
com.top_logic.presentation.script.PptDescriptionFunctions.shadow = Describe a shadow
com.top_logic.presentation.script.PptDescriptionFunctions.shadow.param.blur.tooltip = The blur radius. The default is 6.
com.top_logic.presentation.script.PptDescriptionFunctions.shadow.param.color.tooltip = The shadow color, its transparency given as <code>alpha</code> (see <code>pptColor()</code>). The default is black with 35% opacity.
com.top_logic.presentation.script.PptDescriptionFunctions.shadow.param.direction.tooltip = The direction of the shadow in degrees, clockwise with 0 pointing to the right. The default is 90 (downwards).
com.top_logic.presentation.script.PptDescriptionFunctions.shadow.param.distance.tooltip = The distance of the shadow from the shape. The default is 2.
com.top_logic.presentation.script.PptDescriptionFunctions.shadow.return = The dictionary describing the shadow.
com.top_logic.presentation.script.PptDescriptionFunctions.shadow.tooltip = Describes the shadow of a shape.
com.top_logic.presentation.script.PptDescriptionFunctions.shape = Describe a shape
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.adjust.tooltip = Adjust values of the preset geometry by their names (e.g. <code>adj</code>), as given in the file (100000 for 100%).
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.align.tooltip = The horizontal alignment of the text: <code>left</code>, <code>center</code>, <code>right</code> or <code>justify</code>.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.anchor.tooltip = The vertical alignment of the text: <code>top</code>, <code>middle</code> or <code>bottom</code>.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.bold.tooltip = Whether the text is bold.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.caps.tooltip = Whether the text is shown in capital letters.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.color.tooltip = The text color.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.cornerRadius.tooltip = The corner radius of a <code>roundRect</code>. If given without geometry, the shape is a <code>roundRect</code>.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.fill.tooltip = The fill: a color, <code>none</code>, or a gradient (<code>pptGradient()</code>). If not given, the shape is not filled.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.font.tooltip = The font family.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.geometry.tooltip = The name of the preset geometry, e.g. <code>rect</code> (the default), <code>roundRect</code>, <code>ellipse</code>, <code>triangle</code>, <code>rightArrow</code>, <code>chevron</code> or <code>line</code>.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.height.tooltip = The height, or <code>auto</code> for the height of its text at its width.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.insets.tooltip = The inner margins: a number for all sides or a dictionary with the entries <code>left</code>, <code>top</code>, <code>right</code> and <code>bottom</code>.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.italic.tooltip = Whether the text is italic.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.line.tooltip = The outline: a color, <code>none</code>, or an outline description (<code>pptLine()</code>), drawn in the text color <code>tx1</code> if it gives no color. If not given, the shape has no outline.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.overflow.tooltip = What happens to a text that does not fit into the shape: <code>shrink</code> (the default) reduces the font size, but not below the <code>minFontSize</code> of the template profile, and cuts the text off with "…" if it still does not fit; <code>ellipsis</code> cuts the text off without reducing the font size; <code>visible</code> lets the text exceed the shape; <code>error</code> stops the creation of the presentation.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.shadow.tooltip = The shadow: <code>true</code> for the default shadow or a shadow description (<code>pptShadow()</code>).
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.size.tooltip = The font size.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.spacing.tooltip = Additional space between characters, negative to condense the text.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.split.tooltip = Whether paragraphs that do not fit into the shape continue on a further slide repeating the title of the slide. Only one element of a slide can be continued.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.text.tooltip = The text in the shape.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.underline.tooltip = Whether the text is underlined.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.weight.tooltip = The share in the free space of a row or column (<code>pptRow()</code>, <code>pptColumn()</code>) or of the content area, if no own size is given. The default is 1.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.width.tooltip = The width.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.wrap.tooltip = Whether the text is wrapped at the shape border.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.x.tooltip = The horizontal position of the left border.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.param.y.tooltip = The vertical position of the top border.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.return = The dictionary describing the shape.
com.top_logic.presentation.script.PptDescriptionFunctions.shape.tooltip = Describes a geometric shape, optionally with text. <p> Example: <code>pptShape(geometry: "roundRect", x: 30, y: 130, width: 300, height: 200, fill: "accent1", text: "Hello", color: "bg1")</code> </p> <p> The shape shows only what is described: without <code>fill</code> it is not filled, without <code>line</code> it has no outline, and its text has the text color of the template unless <code>color</code> is given. The text is centered horizontally and vertically unless <code>align</code> or <code>anchor</code> say otherwise. </p> <p> The formatting arguments (font, size, color, ...) apply to the whole text, unless a paragraph or text run defines its own formatting. </p>
com.top_logic.presentation.script.PptDescriptionFunctions.slide = Describe a slide
com.top_logic.presentation.script.PptDescriptionFunctions.slide.param.content.tooltip = The elements on the slide: shapes, text boxes, tables, images, rows and columns.
com.top_logic.presentation.script.PptDescriptionFunctions.slide.param.hidden.tooltip = Whether the slide is hidden in the slide show.
com.top_logic.presentation.script.PptDescriptionFunctions.slide.param.layout.tooltip = The slide layout: its index (as in the <code>layouts</code> of <code>pptAnalyze()</code>), its name, or its role <code>title</code>, <code>content</code>, <code>agenda</code>, <code>section</code> or <code>closing</code>. If not given, the content layout is used.
com.top_logic.presentation.script.PptDescriptionFunctions.slide.param.notes.tooltip = The speaker notes as text, or a list of lines.
com.top_logic.presentation.script.PptDescriptionFunctions.slide.param.placeholders.tooltip = Texts of further placeholders: a dictionary from the placeholder index (as in the <code>placeholders</code> of a layout in <code>pptAnalyze()</code>) or the placeholder name to its text.
com.top_logic.presentation.script.PptDescriptionFunctions.slide.param.subtitle.tooltip = The text of the subtitle placeholder.
com.top_logic.presentation.script.PptDescriptionFunctions.slide.param.title.tooltip = The text of the title placeholder.
com.top_logic.presentation.script.PptDescriptionFunctions.slide.return = The dictionary describing the slide.
com.top_logic.presentation.script.PptDescriptionFunctions.slide.tooltip = Describes a slide. <p> The slide is created on a slide layout of the template. Its title and subtitle fill the title and subtitle placeholders of the layout, further placeholders are filled by their index or name. The content elements are placed on the slide: An element with a position (<code>x</code> or <code>y</code>) is placed there. The elements without position are arranged one below the other in the content area of the layout, like the children of a column (<code>pptColumn()</code>); a single one fills the content area. </p>
com.top_logic.presentation.script.PptDescriptionFunctions.table = Describe a table
com.top_logic.presentation.script.PptDescriptionFunctions.table.param.columnWeights.tooltip = The relative widths of the columns, distributing the width of the table. If neither weights nor widths are given, all columns have the same width.
com.top_logic.presentation.script.PptDescriptionFunctions.table.param.columnWidths.tooltip = The widths of the columns. Not to be given together with weights.
com.top_logic.presentation.script.PptDescriptionFunctions.table.param.headerRows.tooltip = The number of rows at the top formatted as header.
com.top_logic.presentation.script.PptDescriptionFunctions.table.param.height.tooltip = The height, or <code>auto</code> for the height of its rows at its width.
com.top_logic.presentation.script.PptDescriptionFunctions.table.param.rowHeight.tooltip = The minimum height of a row.
com.top_logic.presentation.script.PptDescriptionFunctions.table.param.rows.tooltip = The rows of the table, each a list of cells with the same number of cells. A cell is a text or a cell description (<code>pptCell()</code>).
com.top_logic.presentation.script.PptDescriptionFunctions.table.param.weight.tooltip = The share in the free space of a row or column (<code>pptRow()</code>, <code>pptColumn()</code>) or of the content area, if no own size is given. The default is 1.
com.top_logic.presentation.script.PptDescriptionFunctions.table.param.width.tooltip = The width.
com.top_logic.presentation.script.PptDescriptionFunctions.table.param.x.tooltip = The horizontal position of the left border.
com.top_logic.presentation.script.PptDescriptionFunctions.table.param.y.tooltip = The vertical position of the top border.
com.top_logic.presentation.script.PptDescriptionFunctions.table.return = The dictionary describing the table.
com.top_logic.presentation.script.PptDescriptionFunctions.table.tooltip = Describes a table. <p> Example: <code>pptTable(rows: [["Name", "Value"], ["A", 1], ["B", pptCell("2", fill: "accent2")]], headerRows: 1, columnWeights: [2, 1])</code> </p> <p> The rows grow with their text. Rows that do not fit into the height of the table continue on further slides, which repeat the header rows and the title of the slide extended by the <code>continuationSuffix</code> of the template profile. On these slides, the table fills the content area. Only one element of a slide can be continued. </p>
com.top_logic.presentation.script.PptDescriptionFunctions.textBox = Describe a text box
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.align.tooltip = The horizontal alignment: <code>left</code>, <code>center</code>, <code>right</code> or <code>justify</code>.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.anchor.tooltip = The vertical alignment: <code>top</code>, <code>middle</code> or <code>bottom</code>.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.bold.tooltip = Whether the text is bold.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.caps.tooltip = Whether the text is shown in capital letters.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.color.tooltip = The text color.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.font.tooltip = The font family.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.height.tooltip = The height, or <code>auto</code> for the height of its text at its width.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.insets.tooltip = The inner margins: a number for all sides or a dictionary with the entries <code>left</code>, <code>top</code>, <code>right</code> and <code>bottom</code>.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.italic.tooltip = Whether the text is italic.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.overflow.tooltip = What happens to a text that does not fit into the box: <code>shrink</code> (the default) reduces the font size, but not below the <code>minFontSize</code> of the template profile, and cuts the text off with "…" if it still does not fit; <code>ellipsis</code> cuts the text off without reducing the font size; <code>visible</code> lets the text exceed the box; <code>error</code> stops the creation of the presentation.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.size.tooltip = The font size.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.spacing.tooltip = Additional space between characters, negative to condense the text.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.split.tooltip = Whether paragraphs that do not fit into the box continue on a further slide repeating the title of the slide, e.g. for a long list of bullet points. Only one element of a slide can be continued.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.text.tooltip = The text.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.underline.tooltip = Whether the text is underlined.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.weight.tooltip = The share in the free space of a row or column (<code>pptRow()</code>, <code>pptColumn()</code>) or of the content area, if no own size is given. The default is 1.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.width.tooltip = The width.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.wrap.tooltip = Whether the text is wrapped at the box border.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.x.tooltip = The horizontal position of the left border.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.param.y.tooltip = The vertical position of the top border.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.return = The dictionary describing the text box.
com.top_logic.presentation.script.PptDescriptionFunctions.textBox.tooltip = Describes a text box: a text without fill and outline. <p> Unless given otherwise, the text box has no inner margins, so that the text starts exactly at its position. </p>
com.top_logic.presentation.script.PptRenderFunctions.render = Render slides
com.top_logic.presentation.script.PptRenderFunctions.render.param.presentation.tooltip = The PowerPoint file (<code>.pptx</code> or <code>.potx</code>) to render.
com.top_logic.presentation.script.PptRenderFunctions.render.param.slides.tooltip = The indices of the slides to render, the first slide has index 0. A single number renders a single slide. If not given or empty, all slides are rendered.
com.top_logic.presentation.script.PptRenderFunctions.render.param.width.tooltip = The width of the images in pixels, between 16 and 8000.
com.top_logic.presentation.script.PptRenderFunctions.render.return = The list of PNG images.
com.top_logic.presentation.script.PptRenderFunctions.render.tooltip = Renders slides of a PowerPoint presentation into images. <p> The result contains a PNG image for each requested slide in the requested order. An image is named after the slide index, e.g. <code>slide-03.png</code> for the slide with index 3 (the fourth slide). Its height follows from the width and the aspect ratio of the slides. </p> <p> To see how the slide layouts of a template look, use <code>pptRenderLayouts()</code>. </p>
com.top_logic.presentation.script.PptRenderFunctions.renderLayouts = Render slide layouts
com.top_logic.presentation.script.PptRenderFunctions.renderLayouts.param.layouts.tooltip = The indices of the layouts to render, the first layout has index 0. A single number renders a single layout. If not given or empty, all layouts are rendered.
com.top_logic.presentation.script.PptRenderFunctions.renderLayouts.param.template.tooltip = The PowerPoint file (<code>.pptx</code> or <code>.potx</code>) whose layouts to render.
com.top_logic.presentation.script.PptRenderFunctions.renderLayouts.param.width.tooltip = The width of the images in pixels, between 16 and 8000.
com.top_logic.presentation.script.PptRenderFunctions.renderLayouts.return = The list of PNG images.
com.top_logic.presentation.script.PptRenderFunctions.renderLayouts.tooltip = Renders slide layouts of a PowerPoint template into images. <p> For each requested layout, a slide using this layout is rendered. Its placeholders show their prompt text, or their type name (e.g. <code>body</code>) if they have none, so that the position and the text style of each placeholder become visible. The layouts are numbered in the order of the <code>layouts</code> entry of <code>pptAnalyze()</code>. </p> <p> The result contains a PNG image for each requested layout in the requested order. An image is named after the layout index, e.g. <code>layout-11.png</code>. </p> <p> The sample slides of a template are rendered by <code>pptRender()</code>. </p>
com.top_logic.presentation.script.PptTemplateFunctions.analyze = Analyze presentation template
com.top_logic.presentation.script.PptTemplateFunctions.analyze.param.template.tooltip = The PowerPoint file (<code>.pptx</code> or <code>.potx</code>) to analyze.
com.top_logic.presentation.script.PptTemplateFunctions.analyze.return = The dictionary describing the template.
com.top_logic.presentation.script.PptTemplateFunctions.analyze.tooltip = Describes the structure and the style of a PowerPoint presentation or template. <p> The result tells which slide layouts a template offers, where their placeholders are and how their texts look, and which colors, fonts and shape styles the template uses. It consists of dictionaries, lists, texts, numbers and truth values only, so it can be converted to JSON. Entries without a value are left out. All lengths are given in points, colors as six hexadecimal digits <code>RRGGBB</code>. </p> <p> The result is a dictionary with the following entries: </p> <ul> <li><code>"slideSize"</code>: The width and height of a slide.</li> <li><code>"masters"</code>: The slide masters with their theme (theme colors and fonts), their background, their placeholders and their other shapes such as logos.</li> <li><code>"layouts"</code>: The slide layouts of all masters in the order PowerPoint shows them. Each layout has its position in this list, its name, its predefined type (e.g. <code>TITLE</code>, if it is no custom layout), its master, its background, its placeholders and its other shapes. A placeholder is described by its type (e.g. <code>title</code>, <code>body</code>), its index, its effective position and size, the style of its text and its prompt text.</li> <li><code>"slides"</code>: The slides of the presentation with their layout and their shapes. A shape is described by its kind, name, position and size, geometry, fill, outline, shadow and text. Shapes of a group are listed as its children.</li> </ul> <p> A color taken from the theme names the theme color it refers to together with the modifications applied to it (e.g. brightness or transparency), so that a shape can be created that follows the template's color scheme. </p>
com.top_logic.presentation.script.PptTextFunctions.measureText = Measure text on a slide
com.top_logic.presentation.script.PptTextFunctions.measureText.param.bold.tooltip = Whether the text is set in bold face.
com.top_logic.presentation.script.PptTextFunctions.measureText.param.caps.tooltip = Whether the text is shown in upper case letters, like a text formatted with "all caps" in PowerPoint.
com.top_logic.presentation.script.PptTextFunctions.measureText.param.font.tooltip = The name of the font family, e.g. <code>Arial</code>.
com.top_logic.presentation.script.PptTextFunctions.measureText.param.italic.tooltip = Whether the text is set in italics.
com.top_logic.presentation.script.PptTextFunctions.measureText.param.size.tooltip = The font size in points.
com.top_logic.presentation.script.PptTextFunctions.measureText.param.spacing.tooltip = The additional space between two characters in points, as set as character spacing in PowerPoint. A negative value condenses the text.
com.top_logic.presentation.script.PptTextFunctions.measureText.param.text.tooltip = The text to measure.
com.top_logic.presentation.script.PptTextFunctions.measureText.param.width.tooltip = The width in points available for the text. If not given, the text is not wrapped.
com.top_logic.presentation.script.PptTextFunctions.measureText.return = The dictionary describing the extent of the text.
com.top_logic.presentation.script.PptTextFunctions.measureText.tooltip = Measures the space a text takes on a PowerPoint slide. <p> The text is laid out exactly like in a text box without inner margins that is rendered into an image. Each line break in the text starts a new paragraph. If a width is given, the text is wrapped at word boundaries to fit this width, otherwise only at its line breaks. Character spacing and upper case letters are applied as PowerPoint does, e.g. to measure the letter-spaced titles of a template. </p> <p> The result is a dictionary with the following entries: </p> <ul> <li><code>"width"</code>: The width of the widest line in points.</li> <li><code>"lines"</code>: The number of lines after wrapping.</li> <li><code>"height"</code>: The height of the text in points. A text box needs this height plus its inner top and bottom margins to show the whole text.</li> <li><code>"lineHeight"</code>: The distance between two lines in points.</li> <li><code>"fontAvailable"</code>: Whether the font is installed on the server. A font that is not installed is replaced by a standard font, so the measurement does not match the text shown by PowerPoint on a computer having the font.</li> </ul>
