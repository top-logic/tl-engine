com.top_logic.storage.azure.blob.CloudBasedRepository = Cloud based repository
com.top_logic.storage.azure.blob.CloudBasedRepository.Config.connect-string = Connect string
com.top_logic.storage.azure.blob.CloudBasedRepository.Config.connect-string.tooltip = String to be used for connecting to the blob storage. <p> The connection string contains the account key and is therefore a secret. Recommended is a reference to the connection string by its secret name, so that it is not part of the configuration, e.g. <code>&lt;connect-string name="blob_connect"/&gt;</code>, which the default secret store reads from the environment variable of that name holding the plain connection string. An attribute value is an encrypted connection string, or a plain connection string with the prefix <code>unencrypted:</code>. </p> <p> The connection string is read when the repository is created at startup. </p>
com.top_logic.storage.azure.blob.CloudBasedRepository.Config.container-name = Container name
com.top_logic.storage.azure.blob.CloudBasedRepository.Config.container-name.tooltip = Name of the container to be opened.
com.top_logic.storage.azure.blob.CloudBasedRepository.Config.directory-name = Directory name
com.top_logic.storage.azure.blob.CloudBasedRepository.Config.directory-name.tooltip = Name of the base directory this repository is located in.
com.top_logic.storage.azure.blob.CloudBasedRepository.tooltip = Cloud based implementation of a top-logic repository.
