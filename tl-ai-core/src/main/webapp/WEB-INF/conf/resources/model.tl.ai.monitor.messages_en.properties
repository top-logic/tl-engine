model.tl.ai.monitor = Agent monitor
model.tl.ai.monitor.Period = Period
model.tl.ai.monitor.Period.firstDay = First day of the axis
model.tl.ai.monitor.Period.firstDay.tooltip = Left edge of a time-series chart, as a whole day: the day in the field "From".
model.tl.ai.monitor.Period.fromDay = From
model.tl.ai.monitor.Period.fromDay.tooltip = First day of the period. This day counts in full. A selection such as "30 days" writes it; changed by hand, the period becomes a custom one.
model.tl.ai.monitor.Period.label = Name
model.tl.ai.monitor.Period.label.tooltip = What the period is called where a number has to state its period - in the label of a tile, for instance. The name of the selected option while it still holds, the two days otherwise.
model.tl.ai.monitor.Period.lastDay = Last day of the axis
model.tl.ai.monitor.Period.lastDay.tooltip = Right edge of a time-series chart, as a whole day: the day in the field "To".
model.tl.ai.monitor.Period.preset = Selection
model.tl.ai.monitor.Period.preset.tooltip = Where the two days came from: a number of days, 0 for "All", -1 for entered by hand.
model.tl.ai.monitor.Period.toDay = To
model.tl.ai.monitor.Period.toDay.tooltip = Last day of the period. This day counts in full. A selection such as "30 days" writes it; changed by hand, the period becomes a custom one.
model.tl.ai.monitor.Period.windowEnd = End of the time window
model.tl.ai.monitor.Period.windowEnd.tooltip = Upper bound, exclusive: the midnight after the last day.
model.tl.ai.monitor.Period.windowStart = Start of the time window
model.tl.ai.monitor.Period.windowStart.tooltip = Lower bound, inclusive: the midnight of the first day.
