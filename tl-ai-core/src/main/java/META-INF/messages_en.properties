com.top_logic.tl.ai.core.security.layout.ToolAccessPolicyComponent.tooltip = Configures which security roles may use which agents, models, MCP servers or capabilities. <p> One matrix of roles against names. Writes the policy of the tool access service; what is saved takes effect when that service is restarted, and this view offers the restart. </p>
com.top_logic.tl.ai.core.security.layout.ToolAccessVerdict = Tool access verdict
com.top_logic.tl.ai.core.security.layout.ToolAccessVerdict.ALLOWED = Allowed
com.top_logic.tl.ai.core.security.layout.ToolAccessVerdict.ALLOWED.tooltip = May be used.
