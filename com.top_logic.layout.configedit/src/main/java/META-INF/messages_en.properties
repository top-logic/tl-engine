com.top_logic.layout.configedit.ConfigControl = Configuration control
com.top_logic.layout.configedit.ConfigControl.tooltip = Annotation naming the <i>configuration control provider</i> that edits the annotated property. <p> On a getter, it decides the control for that property. On a configuration interface, it decides the control for properties whose value type is that interface. It is the configuration-side counterpart of TLInputControl and takes precedence over every other step of ConfigControlService's resolution. </p>
com.top_logic.layout.configedit.ConfigControl.value = Value
com.top_logic.layout.configedit.ConfigControl.value.tooltip = The provider creating the control. Must have a public constructor without arguments.
com.top_logic.layout.configedit.ConfigControlService = Configuration control service
com.top_logic.layout.configedit.ConfigControlService$FormatMapping = Format mapping
com.top_logic.layout.configedit.ConfigControlService$FormatMapping.tooltip = A single value-provider-to-provider mapping entry.
com.top_logic.layout.configedit.ConfigControlService$ProviderMapping = Provider mapping
com.top_logic.layout.configedit.ConfigControlService$ProviderMapping.tooltip = A single value-type-to-provider mapping entry.
com.top_logic.layout.configedit.ConfigControlService.Config.formats = Formats
com.top_logic.layout.configedit.ConfigControlService.Config.formats.tooltip = Value-provider-to-provider mappings, keyed by the <i>configuration value provider</i> class of the property's value provider. <p> Separate from <i>Providers</i>: two properties of the same Java value type (e.g. Date) can carry different value providers - a plain date and a time of day both use Date - so only the value provider's own class, not the Java type, can tell them apart. Looked up by a property's concrete value-provider class first, then by walking up its superclasses, so a mapping registered for a base provider also covers its specializations. </p>
com.top_logic.layout.configedit.ConfigControlService.Config.providers = Providers
com.top_logic.layout.configedit.ConfigControlService.Config.providers.tooltip = Value-type-to-provider mappings, keyed by the Java type of the property value.
com.top_logic.layout.configedit.ConfigControlService.FormatMapping.impl = Implementation
com.top_logic.layout.configedit.ConfigControlService.FormatMapping.impl.tooltip = The control provider to use for a property claimed by this mapping.
com.top_logic.layout.configedit.ConfigControlService.FormatMapping.provider = Provider
com.top_logic.layout.configedit.ConfigControlService.FormatMapping.provider.tooltip = The <i>configuration value provider</i> class (or a superclass of it) a property's value provider must be an instance of for this mapping to apply.
com.top_logic.layout.configedit.ConfigControlService.ProviderMapping.impl = Implementation
com.top_logic.layout.configedit.ConfigControlService.ProviderMapping.impl.tooltip = The control provider to use for properties of this value type.
com.top_logic.layout.configedit.ConfigControlService.ProviderMapping.type = Type
com.top_logic.layout.configedit.ConfigControlService.ProviderMapping.type.tooltip = The Java type of the property value this mapping applies to.
com.top_logic.layout.configedit.ConfigControlService.tooltip = Service resolving the input control for a configuration property. <p> Resolves a property whose value can go into a single widget: directly by its Java type, by selecting from a fixed set of options, or as text through a value provider that can turn the value into text and back. createModel and createControl both reject any property that fits none of those - see checkSupportedKind's own JavaDoc for exactly which <i>property kinds</i> that excludes and why. Such a property (a structure, a collection, or a <i>complex</i> property with only a value binding and no format) is rendered by a dedicated nested editor or type selector before this service is ever asked. </p> <p> createModel decides the value domain: a property that is not specialized and whose Java type one of the built-in widgets handles directly - String, boolean, a numeric type, or Date - gets the plain, typed <i>configuration field model</i>; otherwise a property edited by selecting (an option list, or an enum) gets a <i>configuration select field model</i>; everything else with a value provider gets the format-aware <i>configuration format field model</i> (text). </p> <p> createControl then resolves the widget: </p> <ol> <li>@Encrypted always wins, deliberately ahead of every other step - see below.</li> <li><i>Configuration control</i> annotation on the property or on its value type.</li> <li>A <i>configuration select field model</i> gets a select.</li> <li>The value-type-to-provider map configured in this service.</li> <li>The value-provider-to-provider map configured in this service - claims a property whose value provider (or one of its superclasses) is mapped, ahead of the generic format text field. This is what lets a Date formatted as a time of day get a time picker instead of plain text: the Java-type map above cannot separate it from a plain date, but the value provider's own class can.</li> <li>The built-in fallback: the direct widget for a non-specialized property whose type createModel also treated as directly editable, otherwise text parsed and formatted through the property's own ConfigurationValueProvider.</li> </ol> <p> @Encrypted runs before the <i>configuration control</i> annotation, not just before the built-in steps: a module may override the control for a property, but it must never be able to make a secret readable by choosing a control that displays it in the clear. This is a deliberate security decision on its own terms, independent of the specialization veto below. </p> <p> The specialization veto is why a property with its own format is never handed to the "direct" widget for its Java type: a Date formatted as a time of day is edited through that format as text, not in a date picker that could not show or accept a time - the same defect DatePickerControlProvider was fixed against on the model-attribute side. A property whose value provider is claimed by the value-provider-to-provider map is a deliberate exception: such a property counts as not specialized after all (unless it also has options - see below), so it gets the plain, typed <i>configuration field model</i> instead of the format-aware one, and the claimed control (bound to that same typed value) is what actually edits it - see <i>react date picker control</i> for the time-of-day case. </p> <p> Options win over a claim: a property that both has @Options and is claimed stays specialized and is edited by selecting, not by the claimed control - an explicit option list is a statement about that one property, narrower than a mapping registered for a whole value-provider class, so the narrower statement wins. </p> <p> The configured maps are what let a module above this one contribute a control - the TL-Script editor, for instance, lives in tl-model-search-react. </p>
com.top_logic.layout.configedit.DatePickerFormatProvider = Date picker format provider
com.top_logic.layout.configedit.DatePickerFormatProvider.Config.kind = Kind
com.top_logic.layout.configedit.DatePickerFormatProvider.Config.kind.tooltip = Which part of a point in time the claimed property's value represents.
com.top_logic.layout.configedit.DatePickerFormatProvider.tooltip = <i>Configuration control provider</i> that creates a <i>react date picker control</i> of a fixed <i>kind</i>. <p> The impl for a <i>format mapping</i> entry that claims a property whose value provider narrows a Date to a specific part of a point in time, e.g. <i>Time of day as date value provider</i> to <i>time</i>. Registered per value-provider class (see <i>Formats</i> (<i>configuration control service configuration</i>)), not per Java type: a formatted Date reaches this control through that mapping, ahead of the generic format text field the built-in fallback would otherwise give it - the fallback cannot tell a time of day apart from a plain date, both being Date, but the value provider's own class can. </p>
