com.top_logic.tl.ai.core.tools.authoring.AgentAuthoringTool = Tool zur Erstellung von Agenten
com.top_logic.tl.ai.core.tools.authoring.AgentAuthoringTool.tooltip = Tool zum Erstellen, Überprüfen, Aktualisieren und Löschen von Anwendungsagenten und Skills. <p> Änderungsmethoden erben den standardmäßigen <i>Strukturmodus</i>, erfordern daher eine manuelle Freigabe und sind in der Produktionsumgebung gesperrt. Abfragemethoden sind <i>schreibgeschützt</i>. Dieses Tool zeigt nur Anwendungsagenten und -fähigkeiten an; diejenigen des Frameworks (von TopLogic bereitgestellt) sind hier weder sichtbar noch bearbeitbar. </p>
com.top_logic.tl.ai.core.tools.authoring.FrameworkWiringTool = Tool zur Verkabelung von Rahmen
com.top_logic.tl.ai.core.tools.authoring.FrameworkWiringTool.tooltip = Tool zum Hinzufügen und Entfernen von Tools, Fähigkeiten und Delegationen bei (von TopLogic bereitgestellten) Agenten und Fähigkeiten des Frameworks. <p> Bei der Konfiguration wird ein zusätzliches Konfigurations-Overlay geschrieben und <i>die TopLogic-Agenten sowie -Fähigkeiten</i> werden neu gestartet, sodass die Änderungen sofort wirksam werden. Abfragemethoden lesen den Status des laufenden Dienstes aus. </p>
com.top_logic.tl.ai.core.tools.authoring.ScriptToolAuthoringTool = Tool zur Erstellung von Skripten
com.top_logic.tl.ai.core.tools.authoring.ScriptToolAuthoringTool.tooltip = Tool zum Erstellen, Überprüfen, Aktualisieren und Löschen von TL-Script-Tools in der benutzerdefinierten Factory der Konfiguration <i>des Tool-Registry-Dienstes</i>. <p> Mutationsmethoden speichern eine Konfigurationsüberlagerung und starten den <i>Tool-Registrierungsdienst</i> neu, damit die Änderungen sofort wirksam werden; sie erben <i>strukturelle Eigenschaften</i> (Genehmigung erforderlich, in der Produktion gesperrt). Abfragemethoden <i>lesen</i> die gespeicherte Konfiguration <i>aus</i>. </p>
com.top_logic.tl.ai.core.tools.interaction.TaskTool = Aufgaben-Tool
com.top_logic.tl.ai.core.tools.interaction.TaskTool.tooltip = Tool zur Verwaltung von Agentenaufgaben innerhalb einer Verarbeitungssitzung. <p> Bietet CRUD-Operationen für einen speicherinternen <i>Aufgabenspeicher</i>, der über die <i>Aufgabenspeicherbindung</i> an den aktuellen Thread gebunden ist. Aufgaben werden verwendet, um den Fortschritt zu verfolgen und mehrstufige Agentenarbeit zu organisieren. </p>
com.top_logic.tl.ai.core.tools.model.AnnotationDefinitionExplorerTool = Explorer-Tool für Anmerkungsdefinitionen
com.top_logic.tl.ai.core.tools.model.AnnotationDefinitionExplorerTool.tooltip = Tool zur Erkundung von Schemata für Anmerkungsdefinitionen. <p> Dieses Tool ermöglicht es KI-Agenten, Anmerkungsdefinitionen zu verstehen (was konfiguriert werden KANN), nicht Anmerkungsinstanzen (was konfiguriert ist). Es bietet Schemainformationen, einschließlich Metadaten zu Eigenschaften, Typen, Einschränkungen und Standardeinstellungen. </p> <h3>Beispiel für die Verwendung:</h3> <pre> // Untersuchen einer bestimmten Anmerkungsdefinition describeAnnotation("com.top_logic.model.annotate.Visibility") // Untersuchen einer Formulardefinitionsanmerkung describeAnnotation("com.top_logic.model.form.definition.FormDefinition") </pre> <h3>Integration</h3>: <p> Registrieren Sie dieses Tool über <i>annotierte Tools</i> und weisen Sie es einem Agenten über die <i>LLM-Dienstkonfiguration</i> zu. </p>
com.top_logic.tl.ai.core.tools.model.InstanceBrowserTool = Instanz-Browser-Tool
com.top_logic.tl.ai.core.tools.model.InstanceBrowserTool.tooltip = Tool für den Zugriff auf TopLogic-Instanzdaten aus der Wissensbasis. <p> Dieses Tool bietet Methoden zum Auflisten von Instanzen eines Typs mit Paginierung und zum Abrufen detaillierter Informationen über einzelne Instanzen. Alle Methoden geben JSON-formatierte Zeichenketten für die Verwendung durch KI-Agenten zurück. </p> <p> Beide Methoden greifen mit der Identität des Laufs auf die Wissensbasis zu, sodass beide durch den <i>Lesefilter</i> des Laufs gefiltert werden: Eine Instanz, die der Prinzipal nicht lesen darf, fehlt in der Auflistung und wird in der Gesamtzahl nicht mitgezählt, und ein nicht lesbares Attribut einer lesbaren Instanz fehlt in deren Beschreibung. Diese Klasse hat keinen eigenen Serialisierer – früher waren es drei, und genau so kam es dazu, dass die Filterung hier zunächst fehlte. </p>
com.top_logic.tl.ai.core.tools.model.LockTool = Sperr-Tool
com.top_logic.tl.ai.core.tools.model.LockTool.tooltip = Tool zur Überprüfung, ob ein Modellelement gerade von einem anderen Bearbeiter gesperrt ist.
com.top_logic.tl.ai.core.tools.model.ModelAnnotationBrowserTool = Browser-Tool für Modellkommentare
com.top_logic.tl.ai.core.tools.model.ModelAnnotationBrowserTool.tooltip = Tool zum Durchsuchen von Annotationen auf TopLogic-Modellelementen (Module, Typen, Teile, Aufzählungen, Klassifikatoren). <p> Mit diesem Tool können KI-Agenten die Metadaten von Annotationen auf Modellelementen mit optionaler Vererbungsunterstützung prüfen. Es liefert detaillierte Informationen über jede Anmerkung, einschließlich ihres Tag-Namens, der Konfigurationsschnittstelle und der Eigenschaftswerte. </p> <h3>Beispiel für die Verwendung:</h3> <pre> // Auflisten lokaler Anmerkungen zu einem Modul getCurrentAnnotations("tl.core", false) // Auflisten lokaler Anmerkungen zu einem Typ getCurrentAnnotations("tl.core:TLObject", false) // Auflisten aller Anmerkungen einschließlich vererbter getCurrentAnnotations("tl.core:TLObject", true) // Anmerkungen zu einer Aufzählung auflisten getCurrentAnnotations("tl.core:TLScope", false) // Anmerkungen zu einem Typteil auflisten getCurrentAnnotations("tl.core:TLObject#name", false) // Anmerkungen zu einem Klassifikator (Enum-Literal) auflisten getCurrentAnnotations("tl.core:TLScope#global", false) </pre> <h3>Integration</h3>: <p> Registrieren Sie dieses Tool über <i>annotierte Tools</i> und weisen Sie es einem Agenten über die <i>LLM-Dienstkonfiguration</i> zu. </p>
com.top_logic.tl.ai.core.tools.model.ModelAnnotationEditorTool = Editor für Modellbeschriftungen
com.top_logic.tl.ai.core.tools.model.ModelAnnotationEditorTool.tooltip = Tool zum Setzen und Entfernen von Annotationen auf TopLogic-Modellelementen. <p> Mit diesem Tool können KI-Agenten Metadaten zu Modellelementen (Module, Typen, Teile, Klassifikatoren) ändern. Annotationskonfigurationen werden als JSON akzeptiert, die dem Schema des <i>Konfigurationsschematools</i> entsprechen. </p>
com.top_logic.tl.ai.core.tools.model.ModelBrowserTool = Modell-Browser-Tool
com.top_logic.tl.ai.core.tools.model.ModelBrowserTool.tooltip = Tool zum Durchsuchen der TopLogic-Modellstruktur (Module, Typen, Teile). <p> Dieses Tool bietet drei Methoden, die die natürliche Hierarchie für die Modelluntersuchung bilden: Auflistung aller Module, Auflistung der Typen innerhalb eines Moduls und Auflistung der Eigenschaften/Referenzen eines Typs. Alle Methoden geben JSON-formatierte Strings zurück, die von KI-Agenten verwendet werden können. </p>
com.top_logic.tl.ai.core.tools.model.ModelEditorTool = Modell-Editor-Tool
com.top_logic.tl.ai.core.tools.model.ModelEditorTool.tooltip = Tool zum Erstellen und Aktualisieren von TopLogic-Modellelementen. <p> Dieses Tool bietet Methoden zum Erstellen und Aktualisieren von Modulen, Klassen, Eigenschaften, Referenzen, Rückwärtsreferenzen und Aufzählungen im TopLogic-Anwendungsmodell. </p> <p> Alle Methoden geben JSON-formatierte Zeichenketten zurück, die von KI-Agenten verwendet werden können. </p>
com.top_logic.tl.ai.core.tools.model.ModelSearchTool = Tool zur Modellsuche
com.top_logic.tl.ai.core.tools.model.ModelSearchTool.tooltip = Tool für die Suche im gesamten TopLogic-Anwendungsmodell. <p> Dieses Tool bietet eine intelligente Textsuche über Module, Typen (Klassen, Aufzählungen, Datentypen) und Eigenschaften/Referenzen. Es durchsucht technische Namen, qualifizierte Namen, Bezeichnungen und Beschreibungen und gibt die 10 relevantesten Treffer mit Kontextinformationen zurück. </p>
com.top_logic.tl.ai.core.tools.model.SearchAnnotationTool = Tool für Suchanmerkungen
com.top_logic.tl.ai.core.tools.model.SearchAnnotationTool.tooltip = Tool zur Auflistung der verfügbaren Annotationstypen für TopLogic-Modellelemente. <p> Mit diesem Tool können KI-Agenten herausfinden, welche Annotationstypen auf ein bestimmtes Modellelement angewendet werden können. Es listet alle @InApp-Annotationsarten auf, gefiltert nach Art und Typ des Zielelements. </p>
com.top_logic.tl.ai.core.tools.model.TypeAnalysisTool = Tool zur Typenanalyse
com.top_logic.tl.ai.core.tools.model.TypeAnalysisTool.tooltip = Tool zur Analyse von TopLogic-Typ-Abhängigkeiten und -Beziehungen. <p> Dieses Tool bietet Methoden, um zu verstehen, wie Typen im gesamten Modell verwendet werden: Finden aller Verwendungen eines Typs und Finden, wo ein Teil definiert und vererbt wird. Alle Methoden geben JSON-formatierte Strings zurück, die von KI-Agenten verwendet werden können. </p>
com.top_logic.tl.ai.core.tools.model.ViewDocumentTool = Dokument-Anzeige-Tool
com.top_logic.tl.ai.core.tools.model.ViewDocumentTool.tooltip = Ermöglicht es einem Agenten, die in einem Modellobjekt gespeicherten Inhalte wahrzunehmen. <p> Bei Angabe der TID eines beliebigen Objekts, das ein Attribut vom Typ tl.core:Binary besitzt, liest das Tool die gespeicherten Bytes und überträgt sie in der richtigen Modalität an das Modell: Bilder und PDFs werden im Tool-Ergebnis als multimodaler Inhalt mitgeliefert (sodass ein visuell fähiges Modell sie tatsächlich <em>sieht</em>), Text wird inline zurückgegeben und alles andere führt zu einer einfachen Erklärung. Es ist nicht an einen bestimmten Typ gebunden – ein Browser-Screenshot, eine hochgeladene Rechnung als PDF und eine angehängte CSV-Datei durchlaufen alle denselben Weg. </p> <p> Der Lesezugriff wird über die Modellsicherheit des Laufs geprüft, die die Modellzugriffsrechte der Engine für den Prinzipal des Laufs abfragt. Geprüft wird dort, wo die TID aufgelöst wird: Der <i>TID-Resolver</i> verweigert ein Objekt, das der Prinzipal nicht lesen darf, sodass dieses Tool nie eines erhält. </p>
com.top_logic.tl.ai.core.tools.perception.Modality = Modalität
com.top_logic.tl.ai.core.tools.perception.Modality.IMAGE = Bild
com.top_logic.tl.ai.core.tools.perception.Modality.IMAGE.tooltip = Ein Rasterbild (PNG, JPEG, GIF, WebP, ...).
com.top_logic.tl.ai.core.tools.perception.Modality.PDF = PDF
com.top_logic.tl.ai.core.tools.perception.Modality.PDF.tooltip = Ein PDF-Dokument.
com.top_logic.tl.ai.core.tools.perception.Modality.tooltip = Eine nicht-textuelle Eingabemodalität, die ein Modell wahrnehmen kann oder auch nicht.
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport = Wahrnehmungsunterstützung
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport.SUPPORTED = Unterstützt
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport.SUPPORTED.tooltip = Laut Katalog akzeptiert das Modell diese Modalität.
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport.UNKNOWN = Unbekannt
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport.UNKNOWN.tooltip = Der Katalog enthält keinen Eintrag zu diesem Modell, daher lässt sich nichts ableiten.
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport.UNSUPPORTED = Nicht unterstützt
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport.UNSUPPORTED.tooltip = Laut Katalog akzeptiert das Modell diese Modalität nicht.
com.top_logic.tl.ai.core.tools.perception.PerceptionSupport.tooltip = Ob das aktive Modell eine bestimmte <i>Modalität</i> wahrnehmen kann. <p> Die Antwort wird aus dem Modellkatalog abgeleitet, der Best-Effort-Metadaten enthält: Bei lokal gehosteten oder benutzerdefinierten Modellen können diese Angaben vollständig fehlen. <i>Unbekannt</i> hält diesen Fall von einem Modell unterscheidbar, das als reines Textmodell dokumentiert ist. </p>
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory = Script-Tool-Fabrik
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory$ScriptToolConfig = Konfiguration des Skript-Tools
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory$ScriptToolConfig.tooltip = Konfiguration für ein einzelnes TL-Script-Tool. <p> Übernimmt Name, Parameter (mit vollständiger <i>Typauswahl</i> ), Bezeichnung, Beschreibung und Implementierungsausdruck aus der <i>Skriptkonfiguration</i>. Fügt den AI-spezifischen Modus und die Gleichzeitigkeitsflags hinzu. </p>
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.Config.tools = Tools
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.Config.tools.tooltip = Die Tools zum Erstellen.
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.concurrency-safe = Gleichzeitigkeitssicher
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.concurrency-safe.tooltip = Ob dieses Tool sicher parallel zu anderen parallelen Tools ausgeführt werden kann.
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.mode = Modus
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.ScriptToolConfig.mode.tooltip = Welche Art von Zustandsänderung dieses Tool vornimmt. Der Standardwert ist " <i>Daten schreiben"</i>.
com.top_logic.tl.ai.core.tools.registry.ScriptToolFactory.tooltip = Eine <i>Tool-Fabrik</i>, die Tools aus TL-Script-Implementierungen erstellt. <p> Jede Tool-Konfiguration verwendet den <i>Skriptkonfigurationsvertrag</i> der Engine wieder - dieselbe Parameterauswahl, obligatorische/mehrere Flags, Standardwerte und i18n-Beschreibungen, die von konfigurierten TL-Script-Funktionen verwendet werden - und fügt den AI-spezifischen Modus und das Gleichzeitigkeitsflag hinzu. </p>
com.top_logic.tl.ai.core.tools.registry.SubagentToolFactory = Tool-Fabrik für Subagenten
com.top_logic.tl.ai.core.tools.registry.SubagentToolFactory.tooltip = Eine <i>Tool-Factory</i>, die generische Tools zur Orchestrierung asynchroner Subagenten bereitstellt (spawn_subagent, list_agents und wait_for_subagent, wobei letzteres auch den Status jedes Subagenten meldet). <p> Diese Tools sind unabhängig vom vorgefertigten Delegationsablauf: Jeder Agent kann sie namentlich auswählen, um einen beliebigen, zum Zeitpunkt des Aufrufs ausgewählten, vordefinierten Agenten zu starten. Die <i>Ziel-Agenten-Factory</i> wird bei jedem Aufruf verzögert aufgelöst, sodass die Factory erstellt werden kann, bevor die Agentendienste gestartet wurden. </p>
com.top_logic.tl.ai.core.tools.script.TLScriptReferenceTool = Skript-Referenz-Tool
com.top_logic.tl.ai.core.tools.script.TLScriptReferenceTool.tooltip = Tool zum Auflisten von TLScript-Funktionen und zum Abrufen der Dokumentation. <p> Dieses Tool ermöglicht den Zugriff auf die TLScript-Funktionsregistrierung, so dass KI-Agenten verfügbare Funktionen entdecken und detaillierte Dokumentationen zu ihnen abrufen können. Es verwendet den <i>Search Builder</i>, um auf die Metadaten der Funktionen zuzugreifen. </p>
com.top_logic.tl.ai.core.tools.script.TLScriptTool = Skript-Tool
com.top_logic.tl.ai.core.tools.script.TLScriptTool.tooltip = Tool zur Validierung und Ausführung von TLScript-Code. <p> Dieses Tool ermöglicht die Validierung und Ausführung von TLScript. Beide Methoden verwenden den gemeinsamen <i>Skript-Executor</i> für die zentrale Validierungs- und Ausführungslogik. </p>
com.top_logic.tl.ai.core.tools.script.messages.ErrorType = Fehlerart
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.LEXICAL_ERROR = Lexikalischer Fehler
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.LEXICAL_ERROR.tooltip = Lexikalischer Fehler (ungültige Zeichen).
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.SYNTAX_ERROR = Syntax-Fehler
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.SYNTAX_ERROR.tooltip = Syntaxfehler (Parserfehler).
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.VALIDATION_ERROR = Validierungsfehler
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.VALIDATION_ERROR.tooltip = Validierungsfehler (Modellreferenzen, Typenprüfung).
com.top_logic.tl.ai.core.tools.script.messages.ErrorType.tooltip = Art des Validierungsfehlers.
com.top_logic.tl.ai.core.tools.web.BraveSearchEngine = Brave
com.top_logic.tl.ai.core.tools.web.BraveSearchEngine.Config.api-key = Api-Schlüssel
com.top_logic.tl.ai.core.tools.web.BraveSearchEngine.Config.api-key.tooltip = Das Brave Search API-Abonnement-Token (verschlüsselt gespeichert).
com.top_logic.tl.ai.core.tools.web.BraveSearchEngine.Config.base-url = Basis-URL
com.top_logic.tl.ai.core.tools.web.BraveSearchEngine.Config.base-url.tooltip = Die URL des Brave Search API-Endpunkts.
com.top_logic.tl.ai.core.tools.web.BraveSearchEngine.tooltip = <i>Websuchmaschine</i>, die von der Brave Web Search API unterstützt wird (GET /res/v1/web/search). <p> Brave hat keine nativen Include/Exclude-Domain-Anfrageparameter, daher werden Domain-Filter durch Anhängen von site:/-site: Suchoperatoren an die Abfrage realisiert. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService = Browser-Tools-Dienst
com.top_logic.tl.ai.core.tools.web.BrowserToolsService$SandboxMode = Sandbox-Modus
com.top_logic.tl.ai.core.tools.web.BrowserToolsService$SandboxMode.tooltip = Ob für die Browsersitzungen die Sandbox von Chromium auf Betriebssystemebene verwendet wird.
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.acquire-timeout-seconds = Timeout für die Sitzungsanforderung in Sekunden
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.acquire-timeout-seconds.tooltip = Wie lange ein Tool-Aufruf in Sekunden auf einen freien Sitzungsplatz wartet, bevor er mit dem Fehler „Browser beschäftigt, bitte erneut versuchen“ vorzeitig abgebrochen wird. <p> Absichtlich kurz gehalten: Eine begrenzte Wartezeit kann den Servlet-Thread-Pool nicht so erschöpfen, wie es die frühere unbegrenzte Sperre konnte. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.action-timeout-seconds = Timeout für Elementaktionen in Sekunden
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.action-timeout-seconds.tooltip = Timeout in Sekunden für eine Aktion auf einem einzelnen <b>Element</b> - browserClick / browserType sowie das Lesen des Accessibility-Snapshots. <p> Bewusst deutlich kürzer als das Timeout für Seitenladevorgänge, denn beide warten auf völlig verschiedene Dinge. Ein Klick wartet darauf, dass das Element <em>bedienbar</em> wird (im DOM vorhanden, sichtbar, stabil, nicht verdeckt, aktiviert); wenn die Seite dieses Element inzwischen neu gerendert und dabei entfernt hat - der klassische Fall eines Suchfelds, dessen Vorschlagsliste das Bedienelement ersetzt, nachdem die Suchanfrage eingegeben wurde - kann kein weiteres Warten den Vorgang mehr erfolgreich machen; ein Zeitbudget in Größe eines Seitenladevorgangs macht aus einem aussichtslosen Klick lediglich eine halbminütige Blockade mit einer nichtssagenden Zeitüberschreitung am Ende. Die Begrenzung auf wenige Sekunden erlaubt es dem Tool, umgehend mit der umsetzbaren Anweisung „erneuten Snapshot erstellen und eine frische Referenz verwenden“ zu antworten (siehe <i>Ausnahme „Browser-Referenz nicht bedienbar“</i>), und fängt den normalen Fall eines Elements, das einen Moment zur Stabilisierung braucht, weiterhin ab. </p> <p> Erhöhen Sie den Wert für eine bewusst langsame oder stark animierte Anwendung; er wird auf höchstens das Timeout für Seitenladevorgänge begrenzt, da es niemals sinnvoll ist, auf ein einzelnes Element länger zu warten als auf einen vollständigen Seitenladevorgang. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.allow-any-domains = Alle Domains zulassen
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.allow-any-domains.tooltip = Gibt an, ob die Zulassungsliste für Domains im öffentlichen Bereich deaktiviert ist (Modus „allow-any-domains“). <p> Bei „false“ (der sichere Standardwert) ist eine Navigation nur zulässig, wenn die Top-Level-Domain auf der Zulassungsliste steht. Bei „true“ wird die Zulassungsliste ignoriert und jede öffentliche Domain ist erreichbar – <em>mit der Ausnahme</em>, dass der SSRF-Schutz und die Sperrliste weiterhin bedingungslos gelten. „Allow-any“ lockert lediglich die Zulassungsliste für öffentliche Domänen, niemals jedoch den SSRF-Schutz oder die Sperrliste. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.allowed-domains = Zulässige Domains
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.allowed-domains.tooltip = Vom Administrator verwaltete Zulassungsliste mit Domänen, zu denen der Browser navigieren darf. <p> Ein Aufruf ist nur zulässig, wenn der Zielhost mit einem dieser Einträge übereinstimmt oder eine Subdomain davon ist. Ist die Liste leer, lehnt der Browser jeden Aufruf ab (Fail-Closed). Hierbei handelt es sich um eine Richtlinienkonfiguration – nicht um das vom Modell bereitgestellte Argument „allowedDomains“ des <i>Web-Suchtools</i>. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.apply-allowlist-to-all-requests = Zulassungsliste auf alle Anfragen anwenden
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.apply-allowlist-to-all-requests.tooltip = Ob die Zulassungsliste <b>jede</b> Verbindung des Browsers regelt und nicht nur die Herkunft des Hauptdokuments. <p> Die Zulassungsliste war bisher stets eine Kontrolle auf Ebene der <em>Top-Level-Herkunft</em>: Eine zugelassene Seite darf Unterressourcen (Schriften, Skripte, Bilder von einem CDN) von überall dort nachladen, wo weder der SSRF-Schutz greift noch ein Eintrag auf der Sperrliste vorliegt - genau wie ein gewöhnlicher Browser. „false“ (der Standardwert) behält dieses Verhalten bei: Der filternde Proxy setzt SSRF-Schutz und Sperrliste für jede Verbindung durch, die Zulassungsliste wird weiterhin nur für die Top-Level-Herkunft geprüft. </p> <p> Setzen Sie den Wert auf „true“ für eine abgeschottete Installation nach dem Grundsatz „dieser Browser darf mit diesen Domains sprechen und mit sonst keinen“: Der Proxy lehnt dann <em>jede</em> Verbindung zu einem Host ab, der nicht auf der Zulassungsliste steht, Unterressourcen eingeschlossen. Das ist strikt sicherer - es verhindert auch, dass eine zugelassene Seite Daten an Dritte sendet -, aber eine Seite, deren Ressourcen auf anderen Domains liegen, wird ohne diese dargestellt; es ist daher eine bewusste Entscheidung des Betreibers und nicht der Standard. Die Option hat keine Wirkung, wenn „allow-any“ aktiviert ist (dann gibt es keine Zulassungsliste, die angewendet werden könnte), und sie kann niemals etwas lockern: SSRF-Schutz und Sperrliste gelten in beiden Einstellungen für jede Verbindung. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.blocked-domains = Gesperrte Domains
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.blocked-domains.tooltip = Vom Administrator verwaltete Sperrliste mit Domains, zu denen der Browser niemals navigieren darf. <p> Eine Top-Level-Quelle wird abgelehnt, wenn ihr Host mit einem dieser Einträge übereinstimmt oder eine Subdomain davon ist (gleiche Übereinstimmungsregeln wie bei <i>den zugelassenen Domänen</i>). Die Sperrliste hat Vorrang vor der Zulassungsliste und gilt in jedem Modus, einschließlich „allow-any“. Sie schränkt eine umfassende Zulassungsliste (oder den Modus „allow-any“) durch Ausnahmen ein. Der SSRF-Schutz wird unabhängig davon durchgesetzt und kann nicht gelockert werden. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.browser-sandbox = Browser-Sandbox
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.browser-sandbox.tooltip = Ob die Browsersitzungen innerhalb der Chromium-eigenen Sandbox auf Betriebssystemebene laufen. <p> Die Sandbox ist die Grenze zwischen einem Renderer, der <em>von Angreifern kontrolliertes Seiten-JavaScript</em> ausführt, und dem Host, auf dem die Anwendung läuft: Ohne sie ist ein Renderer-Exploit einfach Code, der mit den Berechtigungen der Anwendung selbst und innerhalb ihres Prozessbaums läuft. Sie ist daher überall aktiv, wo sie es sein kann, und sie ist kein Regler zur Leistungsoptimierung. </p> <p> <i>Auto</i> (der Standard) lässt sie aktiv und gibt sie nur innerhalb eines Containers auf, erkannt an den Markerdateien und dem cgroup-Layout, die eine Container-Laufzeitumgebung hinterlässt. Das ist die einzige Umgebung, in der sie nicht einfach aktiv bleiben kann: Das Standard-Seccomp-Profil von Docker/Podman verweigert die clone- und unshare-Aufrufe, die die Namespace-Sandbox von Chromium benötigt, sodass ein Start mit Sandbox dort sofort fehlschlägt. Die richtige Lösung für einen Container ist ein Laufzeitprofil, das diese Aufrufe zulässt (verfolgt im Ticket zum Deploy-Image); bis dahin wird die Sandbox in Containern und nur in Containern aufgegeben. </p> <p> <i>Aktiviert</i> und <i>Deaktiviert</i> sind die Ausweichoptionen: „Aktiviert“ behält die Sandbox auch in einem Container (richtig, sobald das Image ein Seccomp-Profil mitbringt, das sie zulässt; andernfalls startet der Browser nicht), „Deaktiviert“ gibt sie bedingungslos auf, was die Isolation jeder aufgerufenen Seite schwächt und daher immer nur eine vorübergehende Diagnosemaßnahme sein sollte. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.cookie-pools-enabled = Cookie-Pools aktiviert
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.cookie-pools-enabled.tooltip = Hauptschalter für Cookie-Pools: Legt fest, ob die Verben „browserSaveCookies“ und „browserUseCookies“ aktiv sind. <p> „true“ (Standard) aktiviert persistente, benannte, verschlüsselte Anmeldepools: Eine Sitzung kann ihren aktuellen Anmeldestatus in einem benannten Pool speichern, und eine spätere Sitzung kann mit den Daten aus diesem Pool beginnen (siehe CookiePoolService). Bei „false“ werden beide Befehle mit einer eindeutigen Meldung abgelehnt, und es wird kein Cookie-Status erfasst oder als Ausgangswert verwendet – nutzen Sie diese Option, um die gesamte Funktion für eine Installation zu deaktivieren, unabhängig davon, was das Modell versucht. Das Deaktivieren hat keine Auswirkungen auf die normale Navigation oder den isolierten Kontext pro Sitzung. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.evade-bot-detection = Bot-Erkennung umgehen
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.evade-bot-detection.tooltip = Ob der Browser seinen Automatisierungs-Fingerabdruck verschleiern soll, damit Bot-Schutzmechanismen ihm mit geringerer Wahrscheinlichkeit eine Seite mit Zugriffsverweigerung oder einer Sicherheitsabfrage anzeigen (standardmäßig deaktiviert). <p> Bei „false“ (Standardeinstellung) verhält sich der Browser wie ein unverändertes headless Chromium: keine User-Agent-Überschreibung, keine zusätzlichen Startargumente, kein Fingerabdruck-Initialisierungsskript. Bei „true“ wird der Kontext jeder Sitzung so gestaltet, dass er wie ein gewöhnlicher Desktop-Chrome aussieht: Der Startparameter --disable-blink-features=AutomationControlled wird hinzugefügt, ein realistischer Desktop-Chrome-User-Agent (und eine passende „Accept-Language“-Einstellung) wird gesetzt, und ein kleines Init-Skript maskiert die üblichen Automatisierungshinweise (navigator.webdriver, leere navigator.plugins, navigator.languages, fehlendes window.chrome). </p> <p> Der <b>vollständige</b> Chromium-Build (Playwright-Kanal „chromium“, neuer Headless-Modus - weiterhin fensterlos), auf den die Verschleierung ebenfalls angewiesen ist - die leichtgewichtige chrome-headless-shell ist selbst ein Erkennungsmerkmal, aufgrund dessen manche Bot-Schutzmechanismen Inhalte unterdrücken, selbst wenn der User-Agent und navigator.webdriver maskiert sind -, wird unabhängig von dieser Einstellung für jede Sitzung gestartet, denn nur er erlaubt es, die UDP-Kommunikation von WebRTC abzuschalten. Siehe BrowserSession.buildLaunchOptions, einschließlich der damit verbundenen Voraussetzung für die Bereitstellung. </p> <p> <b>Warnhinweis - nur für autorisierte Nutzung.</b> Die Aktivierung dieser Option umgeht bewusst den Schutz einer Website vor automatisiertem Zugriff und kann gegen die Nutzungsbedingungen dieser Website verstoßen. Es handelt sich um eine vom Betreiber aktivierbare Option für autorisierte Ziele (z. B. eine Website, bei der der Betreiber angemeldet ist und die ihm gehört oder für deren Automatisierung er die Erlaubnis besitzt); sie ist standardmäßig deaktiviert und darf nicht aktiviert werden, um auf Websites zuzugreifen, bei denen dies nicht gestattet ist. SSRF-Schutz, Sperrliste und Zulassungsliste bleiben davon unberührt und werden weiterhin unverändert durchgesetzt. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.headless = Headless-Modus
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.headless.tooltip = Ob Browsersitzungen im Headless-Modus (ohne sichtbares Fenster) gestartet werden. <p> „true“ (Standard) ist die produktionssichere Variante: Jede Sitzung führt ein fensterloses Chromium aus, sodass auf dem App-Host nichts angezeigt wird und kein lokaler Bildschirm erforderlich ist. Setzen Sie den Wert auf „false“, um ein Chromium-Fenster <b>mit Benutzeroberfläche</b> (sichtbar) auf dem Desktop des App-Hosts zu starten – eine Annehmlichkeit für die Entwicklung und den lokalen Einsatz, die einen lokalen Bildschirm erfordert und nicht in der Produktion oder auf Remote-/Headless-Hosts verwendet werden darf. Wenn auf einem Host ohne Bildschirm ein „headed“ Modus angefordert wird, bricht der Dienst beim Start sofort ab, anstatt bei einem Startvorgang zu hängen, der niemals erfolgreich sein kann. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.max-concurrent-sessions = Maximale Anzahl gleichzeitiger Sitzungen
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.max-concurrent-sessions.tooltip = Maximale Anzahl gleichzeitig zulässiger aktiver Browsersitzungen (isolierte Kontexte). <p> Dies begrenzt den Speicherbedarf: Jede aktive Sitzung läuft in einem eigenen Chromium-Prozess (ca. 200–400 MB einschließlich des Playwright-Treibers). Anfragen, die diese Obergrenze überschreiten, geben eine inaktive Sitzung nach dem LRU-Prinzip frei oder schlagen – falls keine Sitzung inaktiv ist – sofort mit einem wiederholbaren „Browser beschäftigt“-Fehler fehl. Der Standardwert von 4 hält den Spitzenwert des Browser-Speicherbedarfs bei etwa 1 GB; erhöhen Sie diesen Wert entsprechend dem verfügbaren RAM. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.max-page-bytes = Maximale Seitenbyteanzahl
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.max-page-bytes.tooltip = Maximale Anzahl an HTML-Bytes, die von einer Seite gelesen werden, bevor die Extraktion beendet wird.
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.max-page-chars = Maximale Zeichenanzahl pro Seite
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.max-page-chars.tooltip = Maximale Zeichenanzahl des extrahierten Textes, den ein Browser-Tool zurückgibt.
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.navigation-settle-millis = Navigations-Beruhigungszeit in Millisekunden
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.navigation-settle-millis.tooltip = Höchstgrenze (in Millisekunden) für die <b>Stabilisierungsphase</b> nach einer Navigation: Nachdem ein Seitenladevorgang (browserNavigate / browserBack) seine Netzwerk-/Ladewartezeit beendet hat und bevor die Seite erfasst wird, wartet der Browser, bis das DOM ruhig ist (keine Änderung während eines kurzen internen Entprellungsfensters, ~500 ms) oder bis diese Obergrenze abgelaufen ist, je nachdem, was zuerst eintritt. <p> Dies schließt die häufige Lücke, bei der eine Seite ein Cookie-Einwilligungsbanner, ein Lazy-Widget oder andere Inhalte erst einen Moment <em>nach</em> der Rückkehr von der Navigation einblendet: Ohne die Stabilisierungsphase wird der Snapshot zu früh aufgenommen und verpasst diese Inhalte, was einen manuellen erneuten Snapshot erzwingt. Eine statische Seite kommt fast sofort zur Ruhe und wird höchstens um das Debounce-Fenster verzögert, sodass schnelle Seiten nicht nennenswert verlangsamt werden; eine Seite, die ständig Änderungen durchläuft (ständige Animationen/Abfragen), unterliegt dieser Obergrenze. Die Obergrenze wird immer deutlich innerhalb der Frist pro Operation angewendet, sodass sie niemals zu einem Hängenbleiben führen kann. </p> <p> Setzen Sie den Wert auf 0, um die „settle“-Funktion vollständig zu deaktivieren und die sofortige Erfassung wiederherzustellen. Dies gilt <em>nicht</em> für „browserSnapshot“ (explizite erneute Erfassung) oder „browserType“ (Bearbeitung derselben Seite), die weiterhin sofort erfolgen. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.navigation-timeout-seconds = Timeout für Seitenladevorgänge in Sekunden
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.navigation-timeout-seconds.tooltip = Timeout für einen <b>Seitenladevorgang</b> (Navigieren, Zurück) in Sekunden. <p> Dies begrenzt das Warten auf das Netzwerk: wie lange der Browser höchstens benötigen darf, um auf einer langsamen Seite domcontentloaded zu erreichen. Aktionen auf einem <em>Element</em> werden separat und deutlich strenger durch das <i>Timeout für Elementaktionen in Sekunden</i> begrenzt. </p>
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.session-idle-timeout-seconds = Timeout für inaktive Sitzungen in Sekunden
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.Config.session-idle-timeout-seconds.tooltip = Wie lange eine Sitzung inaktiv bleiben darf (kein Tool-Aufruf), bevor sie geschlossen und ihre Ressourcen freigegeben werden, in Sekunden.
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.SandboxMode.AUTO = Auto
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.SandboxMode.AUTO.tooltip = Der Standard: Die Sandbox wird überall verwendet, nur nicht innerhalb eines Containers, wo das Standard-Laufzeitprofil Chromium daran hindert, eine einzurichten.
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.SandboxMode.DISABLED = Deaktiviert
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.SandboxMode.DISABLED.tooltip = Die Sandbox wird nie verwendet, unabhängig von der Umgebung. Das schwächt die Isolation jeder aufgerufenen Seite.
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.SandboxMode.ENABLED = Aktiviert
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.SandboxMode.ENABLED.tooltip = Die Sandbox wird immer verwendet, auch in einem Container. Chromium startet nicht, wo es keine einrichten kann.
com.top_logic.tl.ai.core.tools.web.BrowserToolsService.tooltip = Dienst, der den Pool isolierter, sitzungsbezogener, headless Chromium-Browser verwaltet, die vom <i>Browser-Tool</i> verwendet werden. <p> Er verwaltet die Konfiguration (Timeout pro Navigation, Obergrenzen für Seitenbytes/Zeichen, die vom Administrator festgelegte Richtlinie für Zulassungs-/Sperrlisten bzw. „Alles zulassen“ sowie die Begrenzungen für die gleichzeitige Nutzung) und ist für den <i>Browser-Sitzungspool</i> verantwortlich. Jede Agentensitzung erhält eine <b>eigene</b> <i>Browsersitzung</i> – eine dedizierte <code>Playwright/Browser/BrowserContext</code> mit separaten Cookies und Speicherplatz –, die über die vielen Tool-Aufrufe eines Durchlaufs hinweg wiederverwendet wird. Zwei gleichzeitig laufende Sitzungen können niemals die Cookies, Seiten oder Ergebnisse der jeweils anderen einsehen. </p> <p><b>Parallelitätsmodell (ersetzt die frühere einzelne globale Sperre).</b> Sitzungen laufen vollständig parallel. Ein <i>Browser-Sitzungspool</i> begrenzt die Anzahl der aktiven Sitzungen auf <i>die maximale Anzahl gleichzeitiger Sitzungen</i> (eine Speichergrenze, keine Durchsatzdrosselung). Beim Starten einer neuen Sitzung wird höchstens das <i>Timeout für die Sitzungsanforderung in Sekunden</i> auf einen freien Slot gewartet, wobei bei Bedarf die am längsten inaktiv gebliebene Sitzung freigegeben wird; wird kein Slot frei, schlägt der Vorgang schnell mit <i>einer „Browser-Busy“-Ausnahme</i> fehl, anstatt den aufrufenden Thread auf unbestimmte Zeit zu blockieren. Inaktive Sitzungen werden nach dem <i>Timeout für inaktive Sitzungen in Sekunden</i> entfernt. Jeder Browservorgang läuft unter einer festen äußeren Frist, sodass eine hängende Seite niemals einen Slot blockieren kann. </p> <p> Die Sicherheit ist mehrschichtig aufgebaut und wird bei jeder Navigation und jeder browserinternen Anfrage (Hauptdokument, Weiterleitungen und Unterressourcen) in einer festgelegten Prioritätsreihenfolge angewendet: </p> <ol> <li><b>SSRF hat immer Vorrang.</b> Jede Anfrage an eine private, Loopback-, Link-Local- oder anderweitig interne Adresse wird aufgrund <i>der URL-Sicherheit</i> bedingungslos abgelehnt. Diese Regelung kann durch keine Konfiguration gelockert werden.</li> <li><b>Die Sperrliste gilt immer.</b> Eine Top-Level-Herkunft, die auf der vom Administrator geführten Sperrliste steht, wird in jedem Modus abgelehnt.</li> <li><b>Anschließend kommt die Zulassungsliste zum Tragen – es sei denn, „allow-any“ ist aktiviert.</b> Standardmäßig muss die Top-Level-Herkunft auch auf der Zulassungsliste stehen. Wenn „allow-any“ aktiviert ist, wird die Allowlist für öffentliche Domains übersprungen (jede öffentliche Domain, die weder durch SSRF blockiert noch auf der Blockliste steht, ist erreichbar); „allow-any“ lockert <em>nur</em> die Allowlist, niemals die SSRF-Regeln oder die Blockliste.</li> </ol> <p> Die Zulassungsliste, die Sperrliste und das „allow-any“-Flag sind vom Administrator verwaltete Richtlinienkonfigurationen – keine vom Modell bereitgestellten Argumente. Die Standardeinstellung („allowlist-enforced“, „allow-any“ deaktiviert) ist von Haus aus sicher: Eine leere Zulassungsliste bei deaktiviertem „allow-any“ lehnt jede Navigation ab. </p> <p> <b>Wo die Richtlinie durchgesetzt wird.</b> Maßgeblich ist ein einzelner dienstweiter <i>filternder Proxy</i> auf der Loopback-Schnittstelle, an den <em>jede</em> Browsersitzung gebunden ist: Jede Verbindung, die Chromium aufbaut - Top-Level-Navigation, Weiterleitungsschritt, Unterressource, IP-Literal als Ziel -, wird dort geprüft, bevor ein Paket den Rechner verlässt; zudem wird das Ziel per DNS-Pinning festgelegt, sodass ein Host mit DNS-Rebinding nicht durchschlüpfen kann. Ein einziger Proxy genügt, weil Zulassungsliste, Sperrliste und das „allow-any“-Flag <em>Dienst</em>-Konfiguration sind und damit für jede Sitzung identisch; keine Teilentscheidung hängt von der einzelnen Sitzung ab. Innerhalb jedes Browsers wird dieselbe Richtlinie zusätzlich durch eine kontextbezogene Anforderungsroute angewendet, ergänzt um einen Weiterleitungsschutz und eine erneute Prüfung der End-URL - dadurch wird aus einer Ablehnung die verständliche Richtlinienmeldung des Tools. </p>
