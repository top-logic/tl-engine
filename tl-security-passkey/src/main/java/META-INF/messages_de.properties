com.top_logic.security.passkey.PasskeyRefusedException.Category.EXPIRED = Abgelaufen
com.top_logic.security.passkey.PasskeyRefusedException.Category.EXPIRED.tooltip = Die Anfrage wurde bereits beantwortet oder ist abgelaufen.
com.top_logic.security.passkey.PasskeyRefusedException.Category.FAILED = Fehlgeschlagen
com.top_logic.security.passkey.PasskeyRefusedException.Category.FAILED.tooltip = Eine weitere Überprüfung der vertrauenden Partei ist fehlgeschlagen, siehe Ursache.
com.top_logic.security.passkey.PasskeyRefusedException.Category.INVALID_DATA = Ungültige Daten
com.top_logic.security.passkey.PasskeyRefusedException.Category.INVALID_DATA.tooltip = Die Antwort des Browsers konnte nicht gelesen werden.
com.top_logic.security.passkey.PasskeyRefusedException.Category.LABEL_MISSING = Bezeichnung fehlt
com.top_logic.security.passkey.PasskeyRefusedException.Category.LABEL_MISSING.tooltip = In der Registrierung ist kein Name für den Passkey angegeben.
