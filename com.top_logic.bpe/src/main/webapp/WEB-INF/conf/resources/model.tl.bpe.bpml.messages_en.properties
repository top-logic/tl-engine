model.tl.bpe = Business Process Engine
model.tl.bpe.bpml = BPML Model
model.tl.bpe.bpml.Annotated = Annotated
model.tl.bpe.bpml.Annotated.annotationAssociations = Annotation links
model.tl.bpe.bpml.Annotated.annotationAssociations.tooltip = The links to the text annotations attached to this element in the diagram.
model.tl.bpe.bpml.Annotated.tooltip = Base type for the elements of a diagram to which a text annotation can be attached.
model.tl.bpe.bpml.AnnotationAssociation = AnnotationAssociation
model.tl.bpe.bpml.AnnotationAssociation.source = Annotated element
model.tl.bpe.bpml.AnnotationAssociation.source.tooltip = The diagram element the text annotation is attached to.
model.tl.bpe.bpml.AnnotationAssociation.target = Annotation
model.tl.bpe.bpml.AnnotationAssociation.target.tooltip = The text annotation attached to the element.
model.tl.bpe.bpml.AnnotationAssociation.tooltip = The link between a diagram element and a text annotation attached to it.
model.tl.bpe.bpml.AnnotationContainer = AnnotationContainer
model.tl.bpe.bpml.AnnotationContainer.annotationDefinitions = Annotations
model.tl.bpe.bpml.AnnotationContainer.annotationDefinitions.tooltip = The text annotations contained in this element. They are read from the diagram and are deleted together with their container.
model.tl.bpe.bpml.AnnotationContainer.tooltip = Base type for the elements of a diagram that can contain text annotations: the collaboration and a process.
model.tl.bpe.bpml.ApprovalState = Workflow state
model.tl.bpe.bpml.ApprovalState.Development = Development
model.tl.bpe.bpml.ApprovalState.Development.tooltip = The workflow is being edited and cannot be started yet.
model.tl.bpe.bpml.ApprovalState.Released = Released
model.tl.bpe.bpml.ApprovalState.Released.tooltip = The workflow is released. Only a released workflow can be started.
model.tl.bpe.bpml.ApprovalState.Retired = Retired
model.tl.bpe.bpml.ApprovalState.Retired.tooltip = The workflow is no longer to be used. Runs already started are continued, but no new run can be started.
model.tl.bpe.bpml.ApprovalState.tooltip = The state of a workflow in its lifecycle: it is being edited, it is released for use, or it has been retired.
model.tl.bpe.bpml.BPTimeGranularity = Time granularity
model.tl.bpe.bpml.BPTimeGranularity.tooltip = The unit in which the waiting time of a timer event is given: day, hour, minute or second.
model.tl.bpe.bpml.BoundaryEvent = BoundaryEvent
model.tl.bpe.bpml.BoundaryEvent.attachedTo = Attached to
model.tl.bpe.bpml.BoundaryEvent.attachedTo.tooltip = The task description this event is attached to.
model.tl.bpe.bpml.BoundaryEvent.cancelActivity = BoundaryEvent.cancelActivity
model.tl.bpe.bpml.BoundaryEvent.cancelActivity.tooltip = Whether the task the event is attached to is ended when the event occurs. Otherwise the task remains open and the process continues along both ways.
model.tl.bpe.bpml.BoundaryEvent.tooltip = An event attached to the border of a task. It occurs while the task is being worked on and leads the process along another way.
model.tl.bpe.bpml.BusinessRuleTask = BusinessRuleTask
model.tl.bpe.bpml.BusinessRuleTask.tooltip = A task whose result is determined by a business rule.
model.tl.bpe.bpml.CallActivity = CallActivity
model.tl.bpe.bpml.CallActivity.tooltip = A task that calls another process and waits for its result.
model.tl.bpe.bpml.CancelEventDefinition = Cancel
model.tl.bpe.bpml.CancelEventDefinition.tooltip = The event cancels a transaction that has already been carried out.
model.tl.bpe.bpml.Collaboration = Collaboration
model.tl.bpe.bpml.Collaboration.diagram = Diagram
model.tl.bpe.bpml.Collaboration.diagram.tooltip = The BPMN diagram of the workflow in its source form. All other elements of the workflow are derived from it when it is imported.
model.tl.bpe.bpml.Collaboration.messageFlows = Message flows
model.tl.bpe.bpml.Collaboration.messageFlows.tooltip = The message flows between the participants of the workflow. They are read from the diagram and are deleted together with the workflow.
model.tl.bpe.bpml.Collaboration.myProcessesDescriptionI18N = "My processes" description
model.tl.bpe.bpml.Collaboration.myProcessesDescriptionI18N.tooltip = Description to be displayed on the "My processes" tile in the generic workflow view.
model.tl.bpe.bpml.Collaboration.myProcessesIcon = "My processes" icon
model.tl.bpe.bpml.Collaboration.myProcessesIcon.tooltip = Image to be displayed on the "My processes" tile in the generic workflow view.
model.tl.bpe.bpml.Collaboration.myProcessesTitleI18N = "My processes" title
model.tl.bpe.bpml.Collaboration.myProcessesTitleI18N.tooltip = Alternative title for the "My processes" tile in the generic workflow view.
model.tl.bpe.bpml.Collaboration.myTasksDescriptionI18N = "My tasks" description
model.tl.bpe.bpml.Collaboration.myTasksDescriptionI18N.tooltip = Description to be displayed on the "My tasks" tile in the generic workflow view.
model.tl.bpe.bpml.Collaboration.myTasksIcon = "My tasks" icon
model.tl.bpe.bpml.Collaboration.myTasksIcon.tooltip = Image to be displayed on the "My tasks" tile in the generic workflow view.
model.tl.bpe.bpml.Collaboration.myTasksTitleI18N = "My tasks" title
model.tl.bpe.bpml.Collaboration.myTasksTitleI18N.tooltip = Alternative title for the "My tasks" tile in the generic workflow view.
model.tl.bpe.bpml.Collaboration.participants = Participants
model.tl.bpe.bpml.Collaboration.participants.tooltip = The participants of the workflow, one per pool of the diagram. They are read from the diagram and are deleted together with the workflow.
model.tl.bpe.bpml.Collaboration.processes = Processes
model.tl.bpe.bpml.Collaboration.processes.tooltip = The processes of the workflow, one per participant. They are read from the diagram and are deleted together with the workflow.
model.tl.bpe.bpml.Collaboration.state = State
model.tl.bpe.bpml.Collaboration.state.tooltip = The state of the workflow in its lifecycle. Only a released workflow can be started.
model.tl.bpe.bpml.Collaboration.tooltip = A workflow as a whole. The collaboration holds the diagram, the participants shown in it and their processes.
model.tl.bpe.bpml.CompensateEventDefinition = Compensate
model.tl.bpe.bpml.CompensateEventDefinition.tooltip = The event compensates work that has already been done.
model.tl.bpe.bpml.ComplexGateway = ComplexGateway
model.tl.bpe.bpml.ComplexGateway.tooltip = A gateway whose branching cannot be expressed by the other gateways.
model.tl.bpe.bpml.ConditionalEventDefinition = Conditional
model.tl.bpe.bpml.ConditionalEventDefinition.tooltip = The event occurs as soon as a condition is fulfilled.
model.tl.bpe.bpml.DefaultGateway = DefaultGateway
model.tl.bpe.bpml.DefaultGateway.defaultFlow = Default flow
model.tl.bpe.bpml.DefaultGateway.defaultFlow.tooltip = The way the process takes when the condition of no other outgoing way is fulfilled.
model.tl.bpe.bpml.DefaultGateway.tooltip = Base type of the gateways at which one of the outgoing ways can be marked as the default way.
model.tl.bpe.bpml.Described = Described
model.tl.bpe.bpml.Described.descriptionI18N = Description
model.tl.bpe.bpml.Described.descriptionI18N.tooltip = A description of this element that is shown to the user working on the workflow.
model.tl.bpe.bpml.Described.tooltip = Abstract super type for all components of a workflow that can contain a description.
model.tl.bpe.bpml.DisplayDescription = DisplayDescription
model.tl.bpe.bpml.DisplayDescription.tooltip = A form definition. The value describes which attributes of the process object are displayed and how they are arranged.
model.tl.bpe.bpml.Edge = Edge
model.tl.bpe.bpml.Edge.process = Process
model.tl.bpe.bpml.Edge.process.tooltip = The process this edge belongs to. An edge is deleted together with its process.
model.tl.bpe.bpml.Edge.source = Source
model.tl.bpe.bpml.Edge.source.tooltip = The node this edge starts at.
model.tl.bpe.bpml.Edge.target = Target
model.tl.bpe.bpml.Edge.target.tooltip = The node this edge leads to.
model.tl.bpe.bpml.Edge.title = Title
model.tl.bpe.bpml.Edge.title.tooltip = Name of the edge as it should be displayed to a user during workflow processing (e.g. when making a decision or as text on a button).
model.tl.bpe.bpml.Edge.tooltip = Tooltip
model.tl.bpe.bpml.Edge.tooltip.tooltip = Further instructions to be displayed to the user of the workflow for this transition. The instructions should make the consequences of any decision to be made clear to the user.
model.tl.bpe.bpml.Edge.weight = Weight
model.tl.bpe.bpml.Edge.weight.tooltip = A weight that determines the order of the edge in a selection dialog for a user decision. The higher the number, the further down the edge is sorted in the decision list. All edges that have a weight are displayed before edges without a weight.
model.tl.bpe.bpml.EndEvent = EndEvent
model.tl.bpe.bpml.EndEvent.tooltip = The event a run of the process ends at. When it is reached, the process instance counts as finished.
model.tl.bpe.bpml.ErrorEventDefinition = Error
model.tl.bpe.bpml.ErrorEventDefinition.tooltip = The event signals an error that prevents the normal course of the process.
model.tl.bpe.bpml.EscalationEventDefinition = Escalation
model.tl.bpe.bpml.EscalationEventDefinition.tooltip = The event escalates the process, so that it is handled at a higher level.
model.tl.bpe.bpml.Event = Event
model.tl.bpe.bpml.Event.definition = Definition
model.tl.bpe.bpml.Event.definition.tooltip = The definition that determines the kind of this event. It is read from the diagram and is deleted together with the event.
model.tl.bpe.bpml.Event.tooltip = Base type of all events of a process. What an event does is determined by its definition.
model.tl.bpe.bpml.EventBasedGateway = EventBasedGateway
model.tl.bpe.bpml.EventBasedGateway.tooltip = A gateway at which the process waits for several events and continues along the way of the event that occurs first.
model.tl.bpe.bpml.EventDefinition = EventDefinition
model.tl.bpe.bpml.EventDefinition.event = Event
model.tl.bpe.bpml.EventDefinition.event.tooltip = The event this definition belongs to.
model.tl.bpe.bpml.EventDefinition.tooltip = Base type of all event definitions. The definition determines what kind of event it is attached to.
model.tl.bpe.bpml.ExclusiveGateway = ExclusiveGateway
model.tl.bpe.bpml.ExclusiveGateway.automatic = Automatic
model.tl.bpe.bpml.ExclusiveGateway.automatic.tooltip = Whether the way is chosen without asking. If set, the workflow execution takes the first way whose condition is fulfilled; otherwise the user completing the preceding task decides.
model.tl.bpe.bpml.ExclusiveGateway.tooltip = A gateway at which the process continues along exactly one of the outgoing ways.
model.tl.bpe.bpml.Externalized = Externalized
model.tl.bpe.bpml.Externalized.extId = Diagram ID
model.tl.bpe.bpml.Externalized.extId.tooltip = The identifier of the element in the BPMN diagram. It is used to find the element again when the diagram is imported anew, so that its additional configuration is preserved.
model.tl.bpe.bpml.Externalized.tooltip = Base type for all elements that originate from a BPMN diagram and can therefore be assigned to an element of that diagram.
model.tl.bpe.bpml.FlowSource = FlowSource
model.tl.bpe.bpml.FlowSource.tooltip = Base type for the elements a message flow can start from.
model.tl.bpe.bpml.FlowTarget = FlowTarget
model.tl.bpe.bpml.FlowTarget.tooltip = Base type for the elements a message flow can point to.
model.tl.bpe.bpml.Gateway = Gateway
model.tl.bpe.bpml.Gateway.tooltip = Base type of all gateways. A gateway splits the course of the process into several ways or brings several ways together again.
model.tl.bpe.bpml.Iconified = Iconified
model.tl.bpe.bpml.Iconified.icon = Icon
model.tl.bpe.bpml.Iconified.icon.tooltip = The icon with which this element is displayed in the workflow views.
model.tl.bpe.bpml.Iconified.tooltip = Abstract super type for all components of a workflow that can be represented with an icon.
model.tl.bpe.bpml.InclusiveGateway = InclusiveGateway
model.tl.bpe.bpml.InclusiveGateway.tooltip = A gateway at which the process continues along every outgoing way whose condition is fulfilled.
model.tl.bpe.bpml.IntermediateCatchEvent = IntermediateCatchEvent
model.tl.bpe.bpml.IntermediateCatchEvent.tooltip = An event the process waits at until the event occurs.
model.tl.bpe.bpml.IntermediateEvent = IntermediateEvent
model.tl.bpe.bpml.IntermediateEvent.tooltip = Base type of the events that lie between the start and the end of a process.
model.tl.bpe.bpml.IntermediateMessageThrowEvent = IntermediateMessageThrowEvent
model.tl.bpe.bpml.IntermediateMessageThrowEvent.tooltip = An event that sends a message while the process passes through it.
model.tl.bpe.bpml.IntermediateThrowEvent = IntermediateThrowEvent
model.tl.bpe.bpml.IntermediateThrowEvent.tooltip = An event the process triggers itself while passing through it.
model.tl.bpe.bpml.Lane = Lane
model.tl.bpe.bpml.Lane.nodes = Nodes
model.tl.bpe.bpml.Lane.nodes.tooltip = The nodes of the diagram that lie in this lane.
model.tl.bpe.bpml.Lane.owner = Owner
model.tl.bpe.bpml.Lane.owner.tooltip = The process or the lane this lane lies in. A lane is deleted together with its container.
model.tl.bpe.bpml.Lane.title = Title
model.tl.bpe.bpml.Lane.title.tooltip = Name of the lane as it should be displayed to a user during workflow processing.
model.tl.bpe.bpml.Lane.tooltip = A lane of the diagram. It determines who has to work on the nodes lying in it.
model.tl.bpe.bpml.LaneSet = LaneSet
model.tl.bpe.bpml.LaneSet.actorGroups = Actor group
model.tl.bpe.bpml.LaneSet.actorGroups.tooltip = The groups whose members may work on the tasks in this lane. Which actors are possible can be computed with the actor function instead.
model.tl.bpe.bpml.LaneSet.actorRule = Actor function
model.tl.bpe.bpml.LaneSet.actorRule.tooltip = Function taking the process instance as single argument and computing the set of actors (persons or groups).
model.tl.bpe.bpml.LaneSet.lanes = Lanes
model.tl.bpe.bpml.LaneSet.lanes.tooltip = The lanes contained in this element, in the order of the diagram. They are deleted together with their container.
model.tl.bpe.bpml.LaneSet.tooltip = Base type for the elements that can contain lanes: a process and a lane itself, so that lanes can be nested.
model.tl.bpe.bpml.ManualTask = ManualTask
model.tl.bpe.bpml.ManualTask.canEdit = Editable
model.tl.bpe.bpml.ManualTask.canEdit.tooltip = Whether the form can be edited in this process step. If not, it is only used to display the status of the current process object.
model.tl.bpe.bpml.ManualTask.displayDescription = Display description
model.tl.bpe.bpml.ManualTask.formDefinition = Form
model.tl.bpe.bpml.ManualTask.formDefinition.tooltip = Form for this process step. This form is displayed to a user who is assigned as the processor for this process step.
model.tl.bpe.bpml.ManualTask.tooltip = A task that a user works on in a form. The form determines which data of the process object are displayed and whether they may be edited.
model.tl.bpe.bpml.MessageEventDefinition = Message
model.tl.bpe.bpml.MessageEventDefinition.tooltip = The event sends or receives a message.
model.tl.bpe.bpml.MessageFlow = MessageFlow
model.tl.bpe.bpml.MessageFlow.collaboration = Collaboration
model.tl.bpe.bpml.MessageFlow.collaboration.tooltip = The workflow this message belongs to. A message is deleted together with its workflow.
model.tl.bpe.bpml.MessageFlow.connectExpession = Process connection
model.tl.bpe.bpml.MessageFlow.connectExpession.tooltip = Function with two arguments (sending process instance and receiving process instance) with the side-effect of linking both process instances.
model.tl.bpe.bpml.MessageFlow.source = Source
model.tl.bpe.bpml.MessageFlow.source.tooltip = The element the message is sent from.
model.tl.bpe.bpml.MessageFlow.target = Target
model.tl.bpe.bpml.MessageFlow.target.tooltip = The element the message is sent to.
model.tl.bpe.bpml.MessageFlow.tooltip = A message between two participants of the workflow. It connects the runs of their processes with each other.
model.tl.bpe.bpml.Named = Named
model.tl.bpe.bpml.Named.name = Name
model.tl.bpe.bpml.Named.name.tooltip = Technical name of the diagram element.
model.tl.bpe.bpml.Named.tooltip = Base type for all diagram elements that carry a technical name.
model.tl.bpe.bpml.Node = Node
model.tl.bpe.bpml.Node.incomming = Incomming
model.tl.bpe.bpml.Node.incomming.tooltip = The edges that lead to this node.
model.tl.bpe.bpml.Node.lane = Lane
model.tl.bpe.bpml.Node.lane.tooltip = The lane of the diagram this node lies in. It determines who has to work on the node.
model.tl.bpe.bpml.Node.outgoing = Outgoing
model.tl.bpe.bpml.Node.outgoing.tooltip = The edges that start at this node.
model.tl.bpe.bpml.Node.process = Process
model.tl.bpe.bpml.Node.process.tooltip = The process this node belongs to. A node is deleted together with its process.
model.tl.bpe.bpml.Node.tooltip = Base type of all nodes of a process diagram: events, gateways, tasks and participants.
model.tl.bpe.bpml.ParallelGateway = ParallelGateway
model.tl.bpe.bpml.ParallelGateway.tooltip = A gateway that splits the process into all outgoing ways at once, or waits until all incoming ways have arrived.
model.tl.bpe.bpml.Participant = Participant
model.tl.bpe.bpml.Participant.collaboration = Collaboration
model.tl.bpe.bpml.Participant.collaboration.tooltip = The workflow this participant belongs to. A participant is deleted together with the workflow.
model.tl.bpe.bpml.Participant.defaultOperation = Default operation
model.tl.bpe.bpml.Participant.defaultOperation.tooltip = Operation that is executed additionally at each step in the workflow. The function receives four arguments, the process object, the old task, the new task (if available) and the form data of the selection dialog for the next task. If no form type is defined for the transition, the last argument is null. If several parallel tasks are started, the third argument is a set with all subsequent tasks. If the process execution encounters an end event, no new task is created.
model.tl.bpe.bpml.Participant.displayDescription = Display description
model.tl.bpe.bpml.Participant.displayDescription.tooltip = The form in which the process object is displayed where no form of its own is configured for the task.
model.tl.bpe.bpml.Participant.dynamicName = Test ID
model.tl.bpe.bpml.Participant.dynamicName.tooltip = Function computing an identifier of a task used in test scripts.
model.tl.bpe.bpml.Participant.edgeFormType = Form model
model.tl.bpe.bpml.Participant.edgeFormType.tooltip = The type that describes the form to be displayed to the user on a state transition out of a manual task. For the attributes of this type, input fields are shown in the form that otherwise only offers the next task for selection.
model.tl.bpe.bpml.Participant.exportDescription = Export description
model.tl.bpe.bpml.Participant.exportDescription.tooltip = The form that determines which data of the process object are written when a run is exported.
model.tl.bpe.bpml.Participant.modelType = Model type
model.tl.bpe.bpml.Participant.modelType.tooltip = Type of the process-controlled object (process execution). An instance of this type is created when a process is started.
model.tl.bpe.bpml.Participant.process = Process
model.tl.bpe.bpml.Participant.process.tooltip = The process this participant carries out.
model.tl.bpe.bpml.Participant.taskLabel = Dynamic task description
model.tl.bpe.bpml.Participant.taskLabel.tooltip = Function that calculates the name of a task in workflow views if no name is configured on the task itself.\n\nThe function receives two arguments, the process execution and the current task.
model.tl.bpe.bpml.Participant.tokenType = State type
model.tl.bpe.bpml.Participant.tokenType.tooltip = The type of object that describes the status of a process execution in the current task. \n\nThe history of a process execution is made up of the list of all status objects that were created during the course of the process execution. In each of these objects, at least the duration of the process in this task and the processor of the task are saved. \n\nBy specifying a separate type for the status object, further information can be collected during the course of the process that is not directly linked to the process object itself.
model.tl.bpe.bpml.Participant.tooltip = A participant of the workflow, one per pool of the diagram. The participant determines the type of the process object and how it is displayed.
model.tl.bpe.bpml.Process = Process
model.tl.bpe.bpml.Process.collaboration = Collaboration
model.tl.bpe.bpml.Process.collaboration.tooltip = The workflow this process belongs to. A process is deleted together with the workflow.
model.tl.bpe.bpml.Process.edges = Edges
model.tl.bpe.bpml.Process.edges.tooltip = The edges of this process. They are read from the diagram and are deleted together with the process.
model.tl.bpe.bpml.Process.isExecutable = Is executable
model.tl.bpe.bpml.Process.isExecutable.tooltip = Whether the process is marked as executable in the diagram. Only such a process is run by the application.
model.tl.bpe.bpml.Process.nodes = Nodes
model.tl.bpe.bpml.Process.nodes.tooltip = The nodes of this process. They are read from the diagram and are deleted together with the process.
model.tl.bpe.bpml.Process.participant = Participant
model.tl.bpe.bpml.Process.participant.tooltip = The participant that carries out this process.
model.tl.bpe.bpml.Process.tooltip = The process of a participant. It contains the nodes and edges the run passes through.
model.tl.bpe.bpml.ProcessFormDefinition = Process form
model.tl.bpe.bpml.ProcessFormDefinition.tooltip = A form definition for a task of a workflow. In addition to the arrangement of the attributes, it can define which of them may be edited in this task.
model.tl.bpe.bpml.ReceiveTask = ReceiveTask
model.tl.bpe.bpml.ReceiveTask.tooltip = A task at which the process waits for a message from another participant.
model.tl.bpe.bpml.ScriptTask = ScriptTask
model.tl.bpe.bpml.ScriptTask.tooltip = A task that is carried out by a script without a user being involved.
model.tl.bpe.bpml.SendTask = SendTask
model.tl.bpe.bpml.SendTask.contentTemplate = Content
model.tl.bpe.bpml.SendTask.contentTemplate.tooltip = Text with embedded expressions. The variable $model contains the current task.
model.tl.bpe.bpml.SendTask.receiverGroups = Receiver groups
model.tl.bpe.bpml.SendTask.receiverGroups.tooltip = The groups whose members receive the mail. Further recipients can be computed with the recipient rule.
model.tl.bpe.bpml.SendTask.receiverRule = Receiver rule
model.tl.bpe.bpml.SendTask.receiverRule.tooltip = Function computing the receivers (persons). The function takes the current process instance as single argument.
model.tl.bpe.bpml.SendTask.subjectTemplate = Subject
model.tl.bpe.bpml.SendTask.subjectTemplate.tooltip = Text with embedded expressions. The variable $model contains the current task.
model.tl.bpe.bpml.SendTask.tooltip = A task that sends a mail. Recipients, subject and content are configured at the task.
model.tl.bpe.bpml.SequenceFlow = SequenceFlow
model.tl.bpe.bpml.SequenceFlow.formType = Form type
model.tl.bpe.bpml.SequenceFlow.formType.tooltip = Model for the form that is displayed during the state transition from a manual task. This form receives the associated operation to process the entered values further. If a form type is specified, an operation must also be specified, otherwise the values entered will not be taken into account.
model.tl.bpe.bpml.SequenceFlow.operation = Operation
model.tl.bpe.bpml.SequenceFlow.operation.tooltip = Operation to be executed if the workflow runs via this edge. An operation can only be specified on edges that start from a manual task. Specifying an operation is equivalent to modeling a service task. An operation on an edge simplifies the diagram and does not create any additional entries in the process execution history. The function receives four arguments, the process object, the old task, the new task (if available) and the form data of the selection dialog for the next task. If no form type is defined for the transition, the last argument is null. If several parallel tasks are started, the third argument is a set with all subsequent tasks.
model.tl.bpe.bpml.SequenceFlow.rule = Rule
model.tl.bpe.bpml.SequenceFlow.rule.tooltip = Predicate function testing whether the sequence flow can be executed. The process instance is given as single argument. The function is expected to return a boolean value or an (internationalized) error text describing the error.
model.tl.bpe.bpml.SequenceFlow.skipStandardOperation = Skip standard operation
model.tl.bpe.bpml.SequenceFlow.skipStandardOperation.tooltip = If set, the standard operation defined on the process will not be executed for this state transition.
model.tl.bpe.bpml.SequenceFlow.tooltip = An edge along which the workflow moves from one node to the next. A condition can decide whether this way may be taken, and an operation can be performed while taking it.
model.tl.bpe.bpml.SequenceFlowRule = Sequence flow condition
model.tl.bpe.bpml.SequenceFlowRule.tooltip = The condition of a sequence flow. It decides whether the workflow may take this way and can state a message explaining why it may not.
model.tl.bpe.bpml.ServiceTask = ServiceTask
model.tl.bpe.bpml.ServiceTask.action = Action
model.tl.bpe.bpml.ServiceTask.action.tooltip = Operation to execute. The function takes the current process instance as single argument.
model.tl.bpe.bpml.ServiceTask.tooltip = A task that the application carries out itself by running the configured operation.
model.tl.bpe.bpml.SignalEventDefinition = Signal
model.tl.bpe.bpml.SignalEventDefinition.tooltip = The event sends or receives a signal. In contrast to a message, a signal is not directed at a single recipient.
model.tl.bpe.bpml.StartEvent = StartEvent
model.tl.bpe.bpml.StartEvent.requireReview = Require review
model.tl.bpe.bpml.StartEvent.requireReview.tooltip = Controls what happens after a user fills out the initial form when starting a new process:\n\nIf enabled (true): The process begins at the first task, allowing users to review and modify the data they just entered.\n\nIf disabled (false): The process skips the first task and moves directly to the second task.
model.tl.bpe.bpml.StartEvent.title = Title
model.tl.bpe.bpml.StartEvent.title.tooltip = Title of the start event as it should be displayed to a user during workflow processing.
model.tl.bpe.bpml.StartEvent.tooltip = The event a run of the process starts with. A user with a suitable permission can start the workflow at it.
model.tl.bpe.bpml.SubProcess = SubProcess
model.tl.bpe.bpml.SubProcess.tooltip = A task that is itself a process. It contains its own nodes and edges, which are run through when the task is reached.
model.tl.bpe.bpml.Task = Task description
model.tl.bpe.bpml.Task.boundaryEvents = Boundary Events
model.tl.bpe.bpml.Task.boundaryEvents.tooltip = The events attached to the border of this task description.
model.tl.bpe.bpml.Task.titleFunction = Dynamic title
model.tl.bpe.bpml.Task.titleFunction.tooltip = Function to calculate the title of a task. The process model and the current task can be included in the calculation. \n\nA function with up to four arguments is expected: The specified static title is available as the first argument. This is followed by the current process execution (instance of `tl.bpe.execution:ProcessExecution`), the task currently being processed (`tl.bpe.bpml:Task`) and, as the last argument, the current process step (`tl.bpe.execution:Token`). \n\nIf no dynamic title is specified, the effect is the same as if the following function were specified: i18n -> execution -> task -> token -> $i18n.localize($execution, $task, $token).
model.tl.bpe.bpml.Task.titleI18N = Title
model.tl.bpe.bpml.Task.titleI18N.tooltip = Name of the task as it should be displayed to a user during workflow processing (e.g. in a heading). \n\nIf no dynamic name is specified, a placeholder ({0}) in the text is filled with the underlying process instance.
model.tl.bpe.bpml.Task.tokenType = State type
model.tl.bpe.bpml.Task.tokenType.tooltip = The type of object that describes the status of a process execution in the current task. \n\nThe history of a process execution is made up of the list of all status objects that were created during the course of the process execution. In each of these objects, at least the duration of the process in this task and the processor of the task are saved. \n\nBy specifying a separate type for the status object, further information can be collected during the course of the process that is not directly linked to the process object itself.
model.tl.bpe.bpml.Task.tooltip = Abstract super type for all states in a workflow description. An active process execution is in one or more of these states. The combination of abstract task description and process execution object results in the concrete task. Depending on the concrete task description, such a concrete task must either be carried out by a user of the system in the application, or it is carried out automatically or time-controlled by the system.
model.tl.bpe.bpml.TerminateEventDefinition = Terminate
model.tl.bpe.bpml.TerminateEventDefinition.tooltip = The event ends the whole process immediately, including all tasks still open in it.
model.tl.bpe.bpml.TextAnnotation = TextAnnotation
model.tl.bpe.bpml.TextAnnotation.annotationAssociations = Annotation links
model.tl.bpe.bpml.TextAnnotation.annotationAssociations.tooltip = The links to the diagram elements this annotation is attached to.
model.tl.bpe.bpml.TextAnnotation.text = Text
model.tl.bpe.bpml.TextAnnotation.text.tooltip = The text of the annotation as it was entered in the diagram.
model.tl.bpe.bpml.TextAnnotation.tooltip = A text annotation of the diagram. It documents the element it is attached to and has no effect on the run.
model.tl.bpe.bpml.TimerEventDefinition = Timer
model.tl.bpe.bpml.TimerEventDefinition.delayInMillis = Delay
model.tl.bpe.bpml.TimerEventDefinition.delayInMillis.tooltip = The waiting time after which the event occurs. The value results from the waiting time and the unit that are configured at the event.
model.tl.bpe.bpml.TimerEventDefinition.delayInUnit = Delay
model.tl.bpe.bpml.TimerEventDefinition.timeUnit = Time unit
model.tl.bpe.bpml.TimerEventDefinition.tooltip = The event occurs after a waiting time has elapsed.
model.tl.bpe.bpml.UserTask = UserTask
model.tl.bpe.bpml.UserTask.tooltip = A task that a user carries out outside the application. The workflow execution only waits until the task is reported as done.
model.tl.bpe.bpml.tooltip = Module with the types that describe a workflow. They mirror the elements of a BPMN diagram and hold the additional configuration that makes the diagram executable.
