com.top_logic.dsa.repos.Repository.checkName.tooltip = Löst <i>eine Ausnahme wegen eines ungültigen Arguments</i> aus, wenn der angegebene Datei- oder Verzeichnisname für dieses <i>Repository</i> ungültig ist. <p> Eine Repository-Implementierung darf das Zeichen „/“ nicht als Teil des Namens akzeptieren, da <i>der Repository-Datenquellenadapter</i> bei der Erstellung der URI darauf angewiesen ist. </p>
com.top_logic.dsa.repos.Repository.create = Erstellen
com.top_logic.dsa.repos.Repository.create.param.aFile.tooltip = Die zu speichernden Daten sind aufgebraucht, und die Funktion wird mit „close()“ beendet.
com.top_logic.dsa.repos.Repository.create.param.aFilename.tooltip = Der Name der Datei
com.top_logic.dsa.repos.Repository.create.param.aPath.tooltip = Der Pfad zur Datei einschließlich des Dateinamens
com.top_logic.dsa.repos.Repository.create.param.aPathIncludingFileName.tooltip = Pfad zur Datei einschließlich des Dateinamens
com.top_logic.dsa.repos.Repository.create.param.aPathWithoutFilename.tooltip = Der Pfad zur Datei ohne Dateinamen; verwende „null“, um eine Datei auf oberster Ebene anzugeben
com.top_logic.dsa.repos.Repository.create.param.user.tooltip = Der Benutzer, der den Eintrag erstellt
com.top_logic.dsa.repos.Repository.create.return = Ein OputputStream, mit dem Sie in die neue Revision schreiben können. Bitte schließen Sie diesen Stream so bald wie möglich.
com.top_logic.dsa.repos.Repository.create.tooltip = Fügt dem Repository ein neues Dokument hinzu. Handelt es sich um einen neuen Eintrag, wird dieser mit einer Sperre versehen. Existiert der Eintrag bereits, muss er mit einer Sperre versehen werden, um eine Aktualisierung zu ermöglichen. Solange der Eintrag <code>unlock()</code>hat, werden bei jedem weiteren Erstellungsversuch lediglich die bestehenden Einträge aktualisiert (der Eintrag hat <code>inUpdate</code>).
com.top_logic.dsa.repos.Repository.delete = Löschen
com.top_logic.dsa.repos.Repository.delete.param.aPathIncludingFileName.tooltip = Pfad zur Datei einschließlich des Dateinamens. Verwenden Sie „null“, um eine Datei auf oberster Ebene anzugeben.
com.top_logic.dsa.repos.Repository.delete.param.force.tooltip = Ob Sperren automatisch aufgehoben werden, unabhängig davon, welcher Benutzer die Sperre gesetzt hat. Siehe <i>Entsperren</i>.
com.top_logic.dsa.repos.Repository.delete.param.user.tooltip = Der Benutzer, der den Eintrag löscht
com.top_logic.dsa.repos.Repository.delete.return = Die Revision, die für die Löschung herangezogen wurde.
com.top_logic.dsa.repos.Repository.delete.tooltip = Kennzeichnet ein Dokument im Repository als gelöscht. Es darf keine Sperre für das Objekt geben, damit es gelöscht werden kann.
com.top_logic.dsa.repos.Repository.exists = Existiert
com.top_logic.dsa.repos.Repository.exists.param.aPath.tooltip = Ein Pfad zu einer Datei oder einem Verzeichnis
com.top_logic.dsa.repos.Repository.exists.tooltip = Prüft, ob der angegebene Name im Repository vorhanden ist
com.top_logic.dsa.repos.Repository.existsEntry = Eintrag vorhanden
