com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.fetch-max-chars.tooltip = Maximum number of characters of extracted text webFetch returns.
com.top_logic.tl.ai.core.tools.web.WebToolsService.Config.fetch-timeout-seconds = Fetch timeout seconds
