class.com.top_logic.layout.view.recorder.I18NConstants.COLUMN_DESCRIPTION = Beschreibung
class.com.top_logic.layout.view.recorder.I18NConstants.COLUMN_INDEX = Schritt
class.com.top_logic.layout.view.recorder.I18NConstants.ERROR_NO_RECORDER = Es ist kein Fenster zur Aufzeichnung verfügbar.
class.com.top_logic.layout.view.recorder.I18NConstants.ERROR_REPLAY_FAILED__MSG = Wiederholung des Schritts fehlgeschlagen: {0}
class.com.top_logic.layout.view.recorder.I18NConstants.RECORDER_STARTED = Die Aufzeichnung wurde gestartet. Führen Sie Aktionen im Hauptfenster aus; die erfassten Schritte werden hier angezeigt.
class.com.top_logic.layout.view.recorder.I18NConstants.RECORDER_STOPPED__COUNT = Die Aufzeichnung wurde beendet. Es wurden {0} Schritte erfasst.
class.com.top_logic.layout.view.recorder.I18NConstants.SELECT_STEP_TO_REPLAY = Wählen Sie zunächst einen Schritt aus, den Sie wiederholen möchten.
class.com.top_logic.layout.view.security.I18NConstants.CREATING_SECURITY_SCOPES = Erstellen von Berechtigungsbereichen für Ansichten.
com.top_logic.layout.view.ContainerElement = Container-Element
com.top_logic.layout.view.ContainerElement.Config.children = Kinder
com.top_logic.layout.view.ContainerElement.Config.children.tooltip = Die untergeordneten Elemente. <p> Unterelemente werden normalerweise direkt mit ihren eigenen Element-Tags geschrieben (z. B. <card>, <table>). Der explizite Eintragstag <child class="..."/> ermöglicht zusätzlich die Referenzierung einer Elementimplementierung, die keinen eigenen Tag-Namen hat. </p>
com.top_logic.layout.view.ContainerElement.tooltip = Basisklasse für UIElements, die eine Liste von untergeordneten Elementen enthalten.
com.top_logic.layout.view.ReferenceElement = Bezugselement
com.top_logic.layout.view.ReferenceElement.Config.bindings = Bindungen
com.top_logic.layout.view.ReferenceElement.Config.bindings.tooltip = Kanalbindungen vom übergeordneten Bereich zu den Kanälen der referenzierten Ansicht. <p> Jede Bindung ordnet einen in der referenzierten Ansicht deklarierten Kanal einem Kanal im Bereich des Elternteils zu. Zur Laufzeit wird die Channel-Instanz des Parents direkt im Context des Childs registriert - beide Seiten teilen sich dasselbe Objekt. </p>
com.top_logic.layout.view.ReferenceElement.Config.view = Siehe
com.top_logic.layout.view.ReferenceElement.Config.view.tooltip = Pfad zur referenzierten .view.xml-Datei, relativ zu /WEB-INF/views/.
com.top_logic.layout.view.ReferenceElement.tooltip = Ein <i>UI-Element</i>, das eine andere View als isolierte Komponente einbettet. <p> Jedes <view-ref> erstellt eine unabhängige Instanz der referenzierten View mit eigenem <i>View-Context</i> und Channel-Namespace. Die Kommunikation über die Grenze hinweg erfolgt über explizite <bind> Elemente, die die Kanalinstanz des Elternteils mit dem Kind teilen. </p> <p> Die referenzierte Ansicht wird zur Zeit der Erstellung des Controls geladen, nicht zur Zeit des Parsens der Konfiguration. Dies unterstützt natürlich mehrere Instanzen und rekursive Verwendung. </p>
com.top_logic.layout.view.UIElement.Config.css-class = CSS-Klasse
com.top_logic.layout.view.UIElement.Config.css-class.tooltip = Die CSS-Klasse, mit der das Element dargestellt wird, zusätzlich zu den Klassen, die seinem Typ eigen sind. <p> Die Klasse wird dem Element zugewiesen, auf dem die Darstellung dieses Elements basiert, sodass ein Stylesheet der Anwendung dieses eine Element – eine Karte, ein Bild, einen Textabschnitt – formatiert, ohne jedes Element desselben Typs zu beeinflussen. </p> <p> Mehrere Klassen werden wie in HTML durch Leerzeichen voneinander getrennt angegeben. </p>
com.top_logic.layout.view.UIElement.Config.personalization-key = Personalisierungsschlüssel
com.top_logic.layout.view.UIElement.Config.personalization-key.tooltip = Optionaler Override für den automatisch abgeleiteten Personalisierungsschlüssel. <p> Wenn gesetzt, verwenden zustandsabhängige Elemente diesen Schlüssel anstelle des automatisch abgeleiteten Pfads aus dem View-Kontext. </p>
com.top_logic.layout.view.ViewConfig = Ansichtskonfiguration
com.top_logic.layout.view.ViewConfig$EntryPoint = Einstiegspunkt
com.top_logic.layout.view.ViewConfig$EntryPoint.tooltip = Eine Ansicht, die eine URL als Inhalt eines Browser-Tabs benennen kann.
com.top_logic.layout.view.ViewConfig.EntryPoint.anonymous = Anonym
com.top_logic.layout.view.ViewConfig.EntryPoint.anonymous.tooltip = Ob die Ansicht auch einer Sitzung angezeigt wird, die keinem Konto zugeordnet ist. <p> Eine Anwendung mit einer Anmeldeseite zeigt diese Seite jeder anonymen Sitzung anstelle dessen an, was in der URL angegeben ist; eine hier markierte Einstiegsseite bildet die Ausnahme – eine URL, die diese Seite benennt, zeigt sie an, z. B. eine Seite, die einem Besucher etwas erklärt, bevor er sich anmelden kann. </p> <p> Eine Anwendung ohne Anmeldeansicht zeigt einem Besucher ohnehin das an, was in der URL steht, sodass diese Einstellung hier keine Auswirkung hat. </p>
com.top_logic.layout.view.ViewConfig.EntryPoint.view = Ansicht
com.top_logic.layout.view.ViewConfig.EntryPoint.view.tooltip = Die Ansichtsdatei, relativ zu /WEB-INF/views/ in der Webanwendung, z. B. demo/pdf-demo.view.xml.
com.top_logic.layout.view.ViewConfig.default-view = Standardansicht
com.top_logic.layout.view.ViewConfig.default-view.tooltip = Der Name der Standard-View-Datei, die geladen wird, wenn ohne Pfad auf das <i>View-Servlet</i> zugegriffen wird (z. B. /view/). <p> Die Datei wird relativ zu /WEB-INF/views/ in der Webanwendung aufgelöst. </p> <p> Die Standardansicht ist ein Einstiegspunkt der Anwendung, daher ist kein Eintrag unter <i>Einstiegspunkte</i> erforderlich. </p>
com.top_logic.layout.view.ViewConfig.entry-points = Einstiegspunkte
com.top_logic.layout.view.ViewConfig.entry-points.tooltip = Die Ansichten, die eine URL als Inhalt eines Browser-Tabs benennen kann, abgesehen von der <i>Standardansicht</i>. <p> Eine Ansichtsdatei ist nur dann Teil der Oberfläche der Anwendung, wenn sie hier aufgeführt ist: Eine URL, die eine andere Ansicht benennt, wird mit „nicht gefunden“ beantwortet. Die meisten Ansichtsdateien sind Fragmente einer Anzeige – ein Dialogfeld, ein Menü, eine Seite eines Tabs –, die von der übergeordneten Ansicht mit den von ihnen gelesenen Kanälen versorgt werden und die allein in einem Browser-Tab nichts anzeigen oder fehlschlagen. Ein Einstiegspunkt ist eine eigenständige Ansicht. </p> <p> Als Schlüssel dient die <i>Ansicht</i>, sodass die Registrierungen mehrerer Module zu einer Liste zusammengeführt werden. </p>
com.top_logic.layout.view.ViewConfig.login-view = Anmeldeansicht
com.top_logic.layout.view.ViewConfig.login-view.tooltip = Die Ansicht, die für eine Sitzung ohne zugehöriges Konto gerendert wird, unabhängig davon, was in der URL angegeben ist. <p> Jeder Besucher greift unter einer anonymen Sitzung auf die Anwendung zu. Eine Anwendung, die einem Besucher nichts anzuzeigen hat, benennt hier eine Anmeldeseite: Ein Besucher sieht dann diese Ansicht und nichts anderes, unabhängig davon, ob die URL eine Route, die <i>Standardansicht</i> oder einen der <i>Einstiegspunkte</i> benennt. Die angeforderte URL wird während der Anzeige beibehalten, sodass die Seite, die der Besucher angefordert hat, auch diejenige ist, die er nach der Anmeldung erreicht. </p> <p> Die Ausnahme bildet ein als „anonym“ gekennzeichneter Einstiegspunkt: Eine URL, die eine solche Ansicht benennt, zeigt diese an, da es sich um eine Seite handelt, die für Besucher ohne Konto hier geschrieben wurde. </p> <p> Nicht gesetzt für eine Anwendung, die sich Besuchern anzeigt und die dann über die für sie gerenderte Ansicht zur Anmeldung gelangt. </p> <p> Die Datei wird relativ zu /WEB-INF/views/ in der Webanwendung aufgelöst. </p>
com.top_logic.layout.view.ViewConfig.tooltip = Konfiguration auf Anwendungsebene für das Ansichtssystem. <p> Wird über die <i>Anwendungskonfiguration</i> registriert und ist von jedem Modul aus zugänglich. Anwendungen setzen Eigenschaften in ihren .conf.config.xml-Dateien außer Kraft. </p>
com.top_logic.layout.view.ViewElement = Element anzeigen
com.top_logic.layout.view.ViewElement.Config.channels = Kanäle
com.top_logic.layout.view.ViewElement.Config.channels.tooltip = Kanaldeklarationen für diese Ansicht. <p> Kanäle sind benannte reaktive Werte, die von UI-Elementen innerhalb dieser Ansicht gelesen und geschrieben werden können. </p>
com.top_logic.layout.view.ViewElement.Config.content = Inhalt
com.top_logic.layout.view.ViewElement.Config.content.tooltip = Das oberste „content“-Element dieser Ansicht.
com.top_logic.layout.view.ViewElement.Config.param-bindings = Parameter-Bindungen
com.top_logic.layout.view.ViewElement.Config.param-bindings.tooltip = Bindungen von URL-Routenparametern an Ansichtskanäle. <p> Routenparameter sind Werte, die aus dem URL-Pfad extrahiert werden (z. B. /view/123, wobei 123 ein Routenparameter ist). </p>
com.top_logic.layout.view.ViewElement.Config.query-bindings = Abfrageverknüpfungen
com.top_logic.layout.view.ViewElement.Config.query-bindings.tooltip = Zuordnungen von URL-Abfrageparametern zu Ansichtskanälen. <p> Abfrageparameter sind Werte aus dem Abfrage-String (z. B. ?type=foo&amp;sort=name). Im Gegensatz zu einem Routenparameter belegt ein Abfrageparameter kein Pfadsegment: Er wird durch seinen Namen identifiziert, sodass er erscheint und verschwindet, ohne dass sich etwas anderes in der URL verschiebt, und seine Änderung allein führt zu keinem Eintrag im Verlauf. </p>
com.top_logic.layout.view.ViewElement.tooltip = Das obligatorische Stammelement jeder .view.xml-Datei. <p> Legt die Grenzen des Geltungsbereichs einer Ansicht fest: ihre Kanal-Deklarationen, die Zuordnungen von URL-Parametern zu diesen Kanälen und die darin angezeigten Inhalte. </p>
com.top_logic.layout.view.admin.CreateAccountAction = Aktion "Konto erstellen
com.top_logic.layout.view.admin.CreateAccountAction.tooltip = <i>Ansichtsaktion</i>, die ein neues dauerhaftes Konto aus einem Anmeldenamen erstellt. <p> Als Eingabe wird ein (vorübergehendes) Objekt mit einem Login-Attribut und einem optionalen Passwort-Attribut erwartet (z. B. das Modell des "neuen Kontos" <form> nach <store-form-state/>). Das Konto wird mit dem <i>Standard-Authentifizierungsgerät</i> erstellt; wenn ein Kennwort angegeben wird (und das Gerät die Kennwortänderung unterstützt), wird es gesetzt, so dass das Konto sofort für die Anmeldung verwendet werden kann. Muss innerhalb einer Transaktion ausgeführt werden (verpacken Sie die Aktion in <with-transaction>); das erstellte <i>Konto</i> wird als Ergebnis der Aktion zurückgegeben. </p>
com.top_logic.layout.view.admin.SecurityMatrixElement = Sicherheitsmatrixelement
com.top_logic.layout.view.admin.SecurityMatrixElement.tooltip = Berechtigungsmatrix für die Verwaltung der Zugriffskontrolle: eine Zeile pro Bereich und Befehlsgruppe, eine Spalte pro Rolle, wobei ein Kontrollkästchen in jeder Zelle die Befehlsgruppe dieser Rolle in diesem Bereich gewährt bzw. entzieht. <p> Anwendungsspezifisches Admin-Widget (referenziert über „class=“, kein wiederverwendbares „@TagName“-Element). Die Zeilen und Rollenspalten stammen aus dem Katalog <i>der Berechtigungen</i> und den persistierten Rollenzuweisungen und nicht aus einer Modellabfrage; in den Zellen werden diese Zuweisungen direkt bearbeitet, sodass es sich um ein eigenständiges Element und nicht um eine Konfiguration der generischen Datentabelle handelt. Die Darstellung erfolgt über das <i>„Green-Field“-Tabellenansicht-Steuerelement</i> (wie das Element „ <table> “), sodass die beiden ersten Bezeichnungen sortierbar und nach Text filterbar sind, die Zellen mit den Rollen-Kontrollkästchen bearbeitbar sind und Spaltenbreite sowie -reihenfolge benutzerspezifisch angepasst werden können. </p>
com.top_logic.layout.view.admin.SetPasswordAction = Aktion „Passwort festlegen“
com.top_logic.layout.view.admin.SetPasswordAction.tooltip = <i>Aktion</i> zum Festlegen (Zurücksetzen) des Passworts eines bestehenden Kontos. <p> Als Eingabe wird ein (transientes) Objekt erwartet, das eine Kontoreferenz (das zu aktualisierende <i>Konto</i> ) und ein Passwort-Attribut enthält (z. B. das Modell des „Passwort zurücksetzen“- <form> s unter <store-form-state/>). Das Passwort wird über das <i>Standard-Authentifizierungsmodul</i> gesetzt. Muss innerhalb einer Transaktion ausgeführt werden (die Aktion mit <with-transaction> umschließen); das aktualisierte <i>Konto</i> wird als Ergebnis der Aktion zurückgegeben. </p>
com.top_logic.layout.view.admin.monitor.ApplicationMonitorTable = Tabelle zum Anwendungsmonitor
com.top_logic.layout.view.admin.monitor.ApplicationMonitorTable.tooltip = Schreibgeschützte Tabelle zum Laufzeitstatus der Anwendung: die registrierten Anwendungsmonitore und deren Meldungen, die JVM-Heap-Auslastung, die Java-VM-Identität sowie grundlegende Systemdaten, gruppiert in Abschnitte. <p> Anwendungsspezifisches Admin-Widget (referenziert über „class=“, kein wiederverwendbares „@TagName“-Element). Die Heap-Werte sind ein Live-Snapshot, der zum Zeitpunkt der Darstellung aus der <i>Laufzeitumgebung</i> ausgelesen wird; das historische Speicherdiagramm ist ein separater, zeitversetzter Vorgang. </p>
com.top_logic.layout.view.admin.monitor.FailedLoginTable = Tabelle mit fehlgeschlagenen Anmeldeversuchen
com.top_logic.layout.view.admin.monitor.FailedLoginTable.tooltip = Schreibgeschützte Tabelle der fehlgeschlagenen Anmeldeversuche der letzten <code>30</code> Tage, eine Zeile pro <i>fehlgeschlagener Anmeldung</i> mit Uhrzeit, Benutzername, Client-IP, Server und Fehlerursache. <p> App-spezifisches Admin-Widget (referenziert über „class=“, kein wiederverwendbares „@TagName“-Element). </p>
com.top_logic.layout.view.admin.monitor.SectionedTable = Tabelle mit Spalten
com.top_logic.layout.view.admin.monitor.SectionedTable.tooltip = Grundlage für schreibgeschützte Überwachungstabellen, die Daten als Zeilen im Format (Abschnitt, Name, Wert) in einer sortierbaren, nach Text filterbaren „Green-Field“-Tabelle darstellen.
com.top_logic.layout.view.admin.monitor.SqlMonitorAction = SQL-Monitor-Aktion
com.top_logic.layout.view.admin.monitor.SqlMonitorAction$Mode = Modus
com.top_logic.layout.view.admin.monitor.SqlMonitorAction$Mode.tooltip = Wie sich eine <i>SQL-Monitor-Aktion</i> auf den Überwachungsstatus auswirkt.
com.top_logic.layout.view.admin.monitor.SqlMonitorAction.Config.mode = Modus
com.top_logic.layout.view.admin.monitor.SqlMonitorAction.Config.mode.tooltip = Wie sich die Aktion auf den Überwachungsstatus auswirkt.
com.top_logic.layout.view.admin.monitor.SqlMonitorAction.Mode.REFRESH = Aktualisieren
com.top_logic.layout.view.admin.monitor.SqlMonitorAction.Mode.REFRESH.tooltip = Gibt eine Momentaufnahme der Statistiken des laufenden Analysators zurück, wobei dieser installiert bleibt.
com.top_logic.layout.view.admin.monitor.SqlMonitorAction.Mode.START = Start
com.top_logic.layout.view.admin.monitor.SqlMonitorAction.Mode.START.tooltip = Installiere einen neuen Analysator und leere den Pool; gibt eine leere Liste zurück.
com.top_logic.layout.view.admin.monitor.SqlMonitorAction.Mode.STOP = Stopp
com.top_logic.layout.view.admin.monitor.SqlMonitorAction.Mode.STOP.tooltip = Gibt die abschließenden Statistiken des laufenden Analysators zurück und deinstalliert ihn.
com.top_logic.layout.view.admin.monitor.SqlMonitorAction.tooltip = <i>Aktionsansicht, die</i> die Überwachung von SQL-Anweisungen im Standard-Verbindungspool steuert und die aktuellen Statistiken (ein Eintrag pro normalisierter Anweisung) zur Anzeige zurückgibt. <p> Die Überwachung erfolgt durch die Installation eines <i>aggregierenden Analysators</i> auf <i>dem Proxyserver der Protokollierungsdatenquelle</i> des Pools; der Analysator verbleibt zwischen den Befehlen auf der (gemeinsam genutzten) Datenquelle, sodass jeder <i>Modus</i> ihn einfach erneut abruft. Die zurückgegebene Statistikliste ist dafür vorgesehen, in einen Kanal geschrieben zu werden, der eine <i>SQL-Statistiktabelle</i> speist. </p>
com.top_logic.layout.view.admin.monitor.SqlStatisticsTable = SQL-Statistiktabelle
com.top_logic.layout.view.admin.monitor.SqlStatisticsTable.Config.input = Eingabe
com.top_logic.layout.view.admin.monitor.SqlStatisticsTable.Config.input.tooltip = Kanal, der die erfassten Statistiken enthält (List&lt;MAP.Entry<String, Statistics>&gt;).
com.top_logic.layout.view.admin.monitor.SqlStatisticsTable.tooltip = Schreibgeschützte Tabelle mit Statistiken zu erfassten SQL-Anweisungen, eine Zeile pro normalisierter Anweisung mit deren Aufrufanzahl, Gesamt-/Durchschnitts-/Maximalausführungszeit (ms) und der Anzahl der verarbeiteten Zeilen. Die Zeilen stammen aus einem Eingabekanal, der von <i>einer SQL-Monitor-Aktion</i> gespeist wird, sodass die Tabelle aktualisiert wird, wenn die Überwachung gestartet, aktualisiert oder beendet wird. <p> Anwendungsspezifisches Admin-Widget (referenziert über „class=“, kein wiederverwendbares „@TagName“-Element). </p>
com.top_logic.layout.view.admin.monitor.SystemEnvironmentTable = Tabelle der Systemumgebung
com.top_logic.layout.view.admin.monitor.SystemEnvironmentTable.tooltip = Schreibgeschützte Tabelle der Laufzeitumgebung: Java-Systemeigenschaften, JVM-Startargumente und die Konfigurationsvariablen der Anwendung; eine Zeile pro Eintrag mit dem Ursprungsabschnitt, dem Eintragsnamen und seinem Wert. <p> Anwendungsspezifisches Admin-Widget (referenziert über `class=`, kein wiederverwendbares `@TagName`-Element). Werte, deren Schlüssel einem konfigurierten „protected-alias“-Muster entspricht (siehe <i>globale Konfiguration</i>), werden maskiert, sodass Passwörter und Geheimnisse, die in Eigenschaften, VM-Argumenten oder Konfigurationsvariablen enthalten sind, nicht offengelegt werden. </p>
com.top_logic.layout.view.admin.monitor.ThreadStackTable = Thread-Stack-Tabelle
com.top_logic.layout.view.admin.monitor.ThreadStackTable.Config.input = Eingabe
com.top_logic.layout.view.admin.monitor.ThreadStackTable.Config.input.tooltip = Kanal, der den <i>Thread</i> enthält, dessen Stack-Trace angezeigt wird.
com.top_logic.layout.view.admin.monitor.ThreadStackTable.tooltip = Schreibgeschützte Tabelle, die den aktuellen Stack-Trace des von einem Eingangskanal gehaltenen <i>Threads</i> anzeigt, mit einer Zeile pro Stack-Frame. Sie wird reaktiv aktualisiert, wenn sich die Kanalauswahl ändert. <p> Anwendungsspezifisches Admin-Widget (referenziert über „class=“, kein wiederverwendbares „@TagName“-Element), das Detail-Widget zur <i>Thread-Tabelle</i>. </p>
com.top_logic.layout.view.admin.monitor.ThreadTable = Gewindetabelle
com.top_logic.layout.view.admin.monitor.ThreadTable.Config.selection = Auswahl
com.top_logic.layout.view.admin.monitor.ThreadTable.Config.selection.tooltip = Der Kanal, in den der ausgewählte <i>Thread</i> geschrieben wird (oder null, wenn die Auswahl aufgehoben ist).
com.top_logic.layout.view.admin.monitor.ThreadTable.tooltip = Schreibgeschützte Tabelle der aktiven JVM-Threads (ein zum Zeitpunkt der Darstellung erstellter Snapshot), eine Zeile pro <i>Thread</i> mit dessen Namen, Status, Priorität, Typ und Thread-Gruppe. <p> Anwendungsspezifisches Admin-Widget (referenziert über „class=“, kein wiederverwendbares „@TagName“-Element). Wenn ein Auswahlkanal konfiguriert ist, wird der ausgewählte Thread dorthin geschrieben, sodass eine zugehörige <i>Thread-Stack-Tabelle</i> dessen aktuellen Stack-Trace anzeigen kann. </p>
com.top_logic.layout.view.admin.monitor.UserSessionTable = Benutzersitzungstabelle
com.top_logic.layout.view.admin.monitor.UserSessionTable.tooltip = Schreibgeschützte Tabelle der aufgezeichneten Benutzersitzungen der letzten <code>30</code> Tage, eine Zeile pro <i>Benutzersitzung</i> mit dem Benutzer, der Anmelde- und Abmeldezeit sowie dem Client und dem Server. Eine noch aktive Sitzung hat keine Abmeldezeit. <p> App-spezifisches Admin-Widget (referenziert über „class=“, kein wiederverwendbares „@TagName“-Element). </p>
com.top_logic.layout.view.admin.system.LockListAction = Sperrlisten-Aktion
com.top_logic.layout.view.admin.system.LockListAction$Mode = Modus
com.top_logic.layout.view.admin.system.LockListAction$Mode.tooltip = Was eine <i>Sperre-List-Aktion</i> ausführt, bevor sie die Sperre-Liste zurückgibt.
com.top_logic.layout.view.admin.system.LockListAction.Config.mode = Modus
com.top_logic.layout.view.admin.system.LockListAction.Config.mode.tooltip = Was die Aktion ausführt, bevor sie die Liste der Sperren zurückgibt.
com.top_logic.layout.view.admin.system.LockListAction.Mode.REFRESH = Aktualisieren
com.top_logic.layout.view.admin.system.LockListAction.Mode.REFRESH.tooltip = Gib einfach den aktuellen Snapshot der Sperre zurück.
com.top_logic.layout.view.admin.system.LockListAction.Mode.RELEASE = Freigeben
com.top_logic.layout.view.admin.system.LockListAction.Mode.RELEASE.tooltip = Die als Eingabe übergebene Sperre zwangsweise aufheben und anschließend den aktualisierten Snapshot zurückgeben.
com.top_logic.layout.view.admin.system.LockListAction.tooltip = <i>Aktion, die</i> die aktuellen Cluster-Sperren zur Anzeige in einer <i>Sperrtabelle</i> zurückgibt und optional die ausgewählte Sperre zuvor zwangsweise aufhebt. <p> Die zurückgegebene Liste „<LockInfo> “ ist dafür vorgesehen, in den Kanal geschrieben zu werden, der die <i>Sperrtabelle</i> speist. Das Freigeben einer Sperre wird an den <i>Token-Dienst</i> delegiert, der seine eigene Transaktion verwaltet. </p>
com.top_logic.layout.view.admin.system.LockTable = Sperrtabelle
com.top_logic.layout.view.admin.system.LockTable.Config.input = Eingabe
com.top_logic.layout.view.admin.system.LockTable.Config.input.tooltip = Kanal, der die anzuzeigende Liste der Sperren enthält (Liste „<LockInfo> “); ist dieser nicht gesetzt, zeigt die Tabelle eine zum Zeitpunkt der Darstellung erfasste Live-Momentaufnahme an.
com.top_logic.layout.view.admin.system.LockTable.Config.selection = Auswahl
com.top_logic.layout.view.admin.system.LockTable.Config.selection.tooltip = Der Kanal, in den die ausgewählten <i>Informationen zur Sperre</i> geschrieben werden (oder null, wenn die Auswahl aufgehoben wird).
com.top_logic.layout.view.admin.system.LockTable.tooltip = Tabelle der derzeit gehaltenen Cluster-Sperren; eine Zeile pro <i>Sperrinformation</i> mit dem Eigentümer, der auslösenden Operation, den gesperrten Objekten und Aspekten, dem Timeout und dem Cluster-Knoten, der die Sperre erworben hat. <p> Anwendungsspezifisches Admin-Widget (referenziert durch „class=“, kein wiederverwendbares „@TagName“-Element). Die Tabelle zeigt beim Öffnen eine Live-Momentaufnahme der gehaltenen Sperren. Wenn ein Eingabekanal konfiguriert ist, ersetzt eine geschriebene Sperrliste die Zeilen, sodass ein Freigabe- oder Aktualisierungsbefehl die Tabelle aktualisieren kann. Die ausgewählte Sperre wird in den konfigurierten Auswahlkanal geschrieben, sodass ein Freigabebefehl darauf angewendet werden kann. </p>
com.top_logic.layout.view.admin.system.LogFileTable = Tabelle der Protokolldateien
com.top_logic.layout.view.admin.system.LogFileTable.Config.selection = Auswahl
com.top_logic.layout.view.admin.system.LogFileTable.Config.selection.tooltip = Kanal, in den die ausgewählte Protokolldatei geschrieben wird (oder null, wenn die Auswahl aufgehoben ist).
com.top_logic.layout.view.admin.system.LogFileTable.tooltip = Tabelle der Dateien im Anwendungsprotokollverzeichnis, eine Zeile pro Datei mit Name, Größe und Zeitpunkt der letzten Änderung; die ausgewählte Datei wird in den konfigurierten Auswahlkanal geschrieben, damit sie in einer Inhaltsansicht in Echtzeit verfolgt werden kann. <p> Anwendungsspezifisches Admin-Widget (referenziert über „class=“, kein wiederverwendbares „@TagName“-Element). Beim Öffnen der Ansicht wird ein Live-Snapshot des Protokollverzeichnisses erstellt. </p>
com.top_logic.layout.view.admin.system.LogLineTable = Tabelle mit Log-Zeilen
com.top_logic.layout.view.admin.system.LogLineTable.Config.input = Eingabe
com.top_logic.layout.view.admin.system.LogLineTable.Config.input.tooltip = Kanal, der die ausgewählte <i>Protokolldatei</i> enthält, deren Einträge angezeigt werden.
com.top_logic.layout.view.admin.system.LogLineTable.Config.reload = Neu laden
com.top_logic.layout.view.admin.system.LogLineTable.Config.reload.tooltip = Kanal, dessen Änderung (ein Aktualisierungstakt) die aktuelle Datei neu analysiert, ohne die Auswahl zu ändern.
com.top_logic.layout.view.admin.system.LogLineTable.tooltip = Sortierbare, spaltenweise filterbare Tabelle der geparsten Protokolleinträge der Datei, die vom konfigurierten Eingangskanal verwaltet wird; die Tabelle wird bei jeder Änderung des Eingangs- oder Neuladekanals neu geparst. <p> Anwendungsspezifisches Admin-Widget (referenziert über „class=“, kein wiederverwendbares „@TagName“-Element). Die Einträge werden vom wiederverwendbaren <i>Log-Parser</i> erzeugt (eine Zeile pro Log-Eintrag, mehrzeilige Stack-Traces werden in den Eintragsdetails zusammengefasst); es werden nur die letzten <code>4194304</code> Bytes geparst, damit die Anzeige großer Dateien ressourcenschonend bleibt. Die Zeilen sind nach Aktualität sortiert, wobei die neuesten Einträge zuerst angezeigt werden. </p>
com.top_logic.layout.view.admin.system.LoggerLevelAction = Aktion auf Logger-Ebene
com.top_logic.layout.view.admin.system.LoggerLevelAction$Mode = Modus
com.top_logic.layout.view.admin.system.LoggerLevelAction$Mode.tooltip = Was eine <i>Logger-Level-Aktion</i> ausführt, bevor sie die Logger-Liste zurückgibt.
com.top_logic.layout.view.admin.system.LoggerLevelAction.Config.mode = Modus
com.top_logic.layout.view.admin.system.LoggerLevelAction.Config.mode.tooltip = Was die Aktion ausführt, bevor sie die Logger-Liste zurückgibt.
com.top_logic.layout.view.admin.system.LoggerLevelAction.Config.model = Modell
com.top_logic.layout.view.admin.system.LoggerLevelAction.Config.model.tooltip = Name des Kanals, der den transienten Eingang „tl.admin:NewLogger“ enthält; erforderlich für <i>„add</i>“.
com.top_logic.layout.view.admin.system.LoggerLevelAction.Config.selection = Auswahl
com.top_logic.layout.view.admin.system.LoggerLevelAction.Config.selection.tooltip = Name des Kanals, der den Namen des ausgewählten Loggers enthält; erforderlich für <i>das Entfernen</i>.
com.top_logic.layout.view.admin.system.LoggerLevelAction.Mode.ADD = Hinzufügen
com.top_logic.layout.view.admin.system.LoggerLevelAction.Mode.ADD.tooltip = Konfigurieren Sie den im Modellkanal genannten Logger auf der Standardstufe.
com.top_logic.layout.view.admin.system.LoggerLevelAction.Mode.REFRESH = Aktualisieren
com.top_logic.layout.view.admin.system.LoggerLevelAction.Mode.REFRESH.tooltip = Gib einfach den aktuellen Logger-Snapshot zurück.
com.top_logic.layout.view.admin.system.LoggerLevelAction.Mode.REMOVE = Entfernen
com.top_logic.layout.view.admin.system.LoggerLevelAction.Mode.REMOVE.tooltip = Entfernen Sie die explizite Konfiguration des ausgewählten Loggers.
com.top_logic.layout.view.admin.system.LoggerLevelAction.tooltip = <i>Aktion anzeigen</i>, die die konfigurierten Logger und deren Stufen zur Darstellung in einer <i>Logger-Stufentabelle</i> zurückgibt, wobei optional zunächst eine Logger-Konfiguration hinzugefügt oder entfernt werden kann. <p> Die zurückgegebene Liste `List&lt;MAP.Entry<String, String>&gt;` (Logger-Name zu Level-Name) ist dafür vorgesehen, in den Kanal geschrieben zu werden, der die <i>Logger-Level-Tabelle</i> speist. <i>„Add“</i> konfiguriert den im Modellkanal genannten Logger (ein transienter `tl.admin:NewLogger`) auf der Standardstufe, sodass er anschließend inline angepasst werden kann; <i>„remove“</i> entfernt die explizite Konfiguration des vom Auswahlkanal gehaltenen Loggers und setzt ihn auf seine geerbte Stufe zurück. </p>
com.top_logic.layout.view.admin.system.LoggerLevelTable = Tabelle der Logger-Ebenen
com.top_logic.layout.view.admin.system.LoggerLevelTable.Config.input = Eingabe
com.top_logic.layout.view.admin.system.LoggerLevelTable.Config.input.tooltip = Kanal, der die anzuzeigende Logger-Liste (List&lt;MAP.Entry<String, String>&gt;) enthält; wenn dieser nicht festgelegt ist oder kein Listenelement enthält, wird zum Zeitpunkt der Darstellung ein Live-Snapshot erstellt.
com.top_logic.layout.view.admin.system.LoggerLevelTable.Config.selection = Auswahl
com.top_logic.layout.view.admin.system.LoggerLevelTable.Config.selection.tooltip = Der Kanal, in den der Name des ausgewählten Loggers geschrieben wird (oder „null“, wenn die Auswahl aufgehoben ist).
com.top_logic.layout.view.admin.system.LoggerLevelTable.tooltip = Tabelle der konfigurierten Logger, eine Zeile pro Logger mit dessen Namen und einer Inline-Stufenauswahl, mit der die Stufe des Loggers zur Laufzeit geändert werden kann; der Name des ausgewählten Loggers wird in den konfigurierten Auswahlkanal geschrieben, damit er entfernt werden kann.
com.top_logic.layout.view.admin.system.MaintenanceModeAction = Aktion im Wartungsmodus
com.top_logic.layout.view.admin.system.MaintenanceModeAction$Mode = Modus
com.top_logic.layout.view.admin.system.MaintenanceModeAction$Mode.tooltip = Was eine <i>Aktion im Wartungsmodus</i> ausführt, bevor sie das Status-Token zurückgibt.
com.top_logic.layout.view.admin.system.MaintenanceModeAction.Config.mode = Modus
com.top_logic.layout.view.admin.system.MaintenanceModeAction.Config.mode.tooltip = Was die Aktion tut, bevor sie die Sperre zurückgibt.
com.top_logic.layout.view.admin.system.MaintenanceModeAction.Config.model = Modell
com.top_logic.layout.view.admin.system.MaintenanceModeAction.Config.model.tooltip = Name des Kanals, der den transienten Eingang „tl.admin:MaintenanceMode“ enthält; nur für <i>die Eingabe</i> erforderlich.
com.top_logic.layout.view.admin.system.MaintenanceModeAction.Mode.ABORT = Abbrechen
com.top_logic.layout.view.admin.system.MaintenanceModeAction.Mode.ABORT.tooltip = Ein geplantes, noch nicht begonnenes Wartungsfenster abbrechen.
com.top_logic.layout.view.admin.system.MaintenanceModeAction.Mode.ENTER = Eingabe
com.top_logic.layout.view.admin.system.MaintenanceModeAction.Mode.ENTER.tooltip = Rufen Sie den Wartungsmodus über den Eingang des Modellkanals auf (oder planen Sie dessen Aufruf).
com.top_logic.layout.view.admin.system.MaintenanceModeAction.Mode.LEAVE = Gehen
com.top_logic.layout.view.admin.system.MaintenanceModeAction.Mode.LEAVE.tooltip = Beenden Sie den Wartungsmodus und kehren Sie zum Normalbetrieb zurück.
com.top_logic.layout.view.admin.system.MaintenanceModeAction.Mode.REFRESH = Aktualisieren
com.top_logic.layout.view.admin.system.MaintenanceModeAction.Mode.REFRESH.tooltip = Gib einfach den aktuellen Wartungsstatus zurück.
com.top_logic.layout.view.admin.system.MaintenanceModeAction.tooltip = <i>View-Aktion</i>, die den Wartungsmodus der Anwendung umschaltet und den resultierenden Status als <code>"NORMAL"</code> <code>"PENDING"</code> <code>"ACTIVE"</code> -Sperre für die Befehlssteuerung und Statusanzeige zurückgibt. <p> Die Sperre soll in den Kanal geschrieben werden, auf den die Befehle in der Datei „maintenance.view.xml“ zugreifen (über „ <visible-if> “), und aus dem die <i>Wartungsstatusansicht</i> neu gerendert wird. Für die <i>Eingabe</i> der Verzögerung werden die Anmeldeentscheidung und die Meldung aus dem konfigurierten Modellkanal gelesen (dem transienten „tl.admin:MaintenanceMode“, der an das Formular des Eingabedialogs gebunden ist); bei einer leeren oder null Verzögerung wird der Wartungsmodus sofort aktiviert. </p>
com.top_logic.layout.view.admin.system.MaintenanceStatusView = Ansicht des Wartungsstatus
com.top_logic.layout.view.admin.system.MaintenanceStatusView.Config.state = Status
com.top_logic.layout.view.admin.system.MaintenanceStatusView.Config.state.tooltip = Der Kanal wird beim Öffnen mit der aktuellen Sperre initialisiert und bei Änderungen erneut gelesen; er wird mit den Befehlen geteilt, die davon abhängig sind.
com.top_logic.layout.view.admin.system.MaintenanceStatusView.tooltip = Zeigt den aktuellen Wartungsstatus der Anwendung als Textzeile an und füllt den konfigurierten Statuskanal mit der entsprechenden Sperre, sodass die Wartungsbefehle ab dem Zeitpunkt des Öffnens der Ansicht korrekt weitergeleitet werden. <p> Anwendungsspezifisches Admin-Widget (referenziert über „class=“, kein wiederverwendbares „@TagName“-Element). Der Statustext spiegelt den globalen, serverseitigen Status wider, der vom <i>Wartungsfenster</i> verwaltet wird (sowie – solange ein Fenster geplant oder aktiv ist – dessen Meldung), was kein generisches Wertesteuerelement ausdrücken kann. Die Ansicht wird bei jeder Änderung des Statuskanals neu gerendert, d. h. nach jedem Wartungsbefehl. </p>
com.top_logic.layout.view.admin.system.ServiceLifecycleAction = Dienst-Lebenszyklus-Aktion
com.top_logic.layout.view.admin.system.ServiceLifecycleAction$Mode = Modus
com.top_logic.layout.view.admin.system.ServiceLifecycleAction$Mode.tooltip = Was eine <i>Aktion im Service-Lebenszyklus</i> ausführt, bevor die Serviceliste zurückgegeben wird.
com.top_logic.layout.view.admin.system.ServiceLifecycleAction.Config.mode = Modus
com.top_logic.layout.view.admin.system.ServiceLifecycleAction.Config.mode.tooltip = Was die Aktion ausführt, bevor sie die Serviceliste zurückgibt.
com.top_logic.layout.view.admin.system.ServiceLifecycleAction.Config.selection = Auswahl
com.top_logic.layout.view.admin.system.ServiceLifecycleAction.Config.selection.tooltip = Name des Kanals, der den zu bearbeitenden Dienst enthält; erforderlich für alle Modi außer <i>„Refresh</i>“.
com.top_logic.layout.view.admin.system.ServiceLifecycleAction.Mode.REFRESH = Aktualisieren
com.top_logic.layout.view.admin.system.ServiceLifecycleAction.Mode.REFRESH.tooltip = Gib einfach den aktuellen Service-Snapshot zurück.
com.top_logic.layout.view.admin.system.ServiceLifecycleAction.Mode.RESTART = Neustart
com.top_logic.layout.view.admin.system.ServiceLifecycleAction.Mode.RESTART.tooltip = Starten Sie den ausgewählten Dienst (und die davon abhängigen Dienste) neu.
com.top_logic.layout.view.admin.system.ServiceLifecycleAction.Mode.START = Start
com.top_logic.layout.view.admin.system.ServiceLifecycleAction.Mode.START.tooltip = Starten Sie den ausgewählten Dienst (und dessen Abhängigkeiten).
com.top_logic.layout.view.admin.system.ServiceLifecycleAction.Mode.STOP = Stopp
com.top_logic.layout.view.admin.system.ServiceLifecycleAction.Mode.STOP.tooltip = Den ausgewählten Dienst (und die davon abhängigen Dienste) beenden.
com.top_logic.layout.view.admin.system.ServiceLifecycleAction.tooltip = <i>Aktion anzeigen, die</i> die aktuellen Anwendungsdienste zur Anzeige in einer <i>Diensttabelle</i> zurückgibt und optional den ausgewählten Dienst zunächst startet, stoppt oder neu startet. <p> Die zurückgegebene Liste „<BasicRuntimeModule> “ ist dafür vorgesehen, in den Kanal geschrieben zu werden, der die <i>Diensttabelle</i> speist. Der zu bearbeitende Dienst wird aus dem konfigurierten Auswahlkanal gelesen (nicht aus der Befehlseingabe, die den Laufstatus enthält, der zur Steuerung des Befehls verwendet wird). Abhängige Dienste werden automatisch gestartet, gestoppt oder neu gestartet. </p>
com.top_logic.layout.view.admin.system.ServiceTable = Servicetabelle
com.top_logic.layout.view.admin.system.ServiceTable.Config.input = Eingabe
com.top_logic.layout.view.admin.system.ServiceTable.Config.input.tooltip = Kanal, der die anzuzeigende Modulliste enthält (List<BasicRuntimeModule>); ist dieser nicht gesetzt, zeigt die Tabelle eine Live-Momentaufnahme an, die zum Zeitpunkt der Darstellung erstellt wurde.
com.top_logic.layout.view.admin.system.ServiceTable.Config.selection = Auswahl
com.top_logic.layout.view.admin.system.ServiceTable.Config.selection.tooltip = Kanal, in den das ausgewählte Modul geschrieben wird (oder null, wenn die Auswahl aufgehoben ist).
com.top_logic.layout.view.admin.system.ServiceTable.Config.state = Status
com.top_logic.layout.view.admin.system.ServiceTable.Config.state.tooltip = Kanal, in den der Betriebsstatus des ausgewählten Moduls geschrieben wird (<code>"ACTIVE"</code> / <code>"INACTIVE"</code> oder null, wenn die Auswahl aufgehoben ist).
com.top_logic.layout.view.admin.system.ServiceTable.tooltip = Tabelle der Anwendungsdienste (Laufzeitmodule), eine Zeile pro <i>Dienstmodul</i> mit dessen Laufstatus, Bezeichnung und dem Namen der Implementierungsklasse. <p> Anwendungsspezifisches Admin-Widget (referenziert über „class=“, kein wiederverwendbares „@TagName“-Element). Die Tabelle zeigt beim Öffnen eine Live-Momentaufnahme der bekannten Module und wird nach einem Lebenszyklusbefehl anhand des konfigurierten Eingabekanals neu aufgebaut. Das ausgewählte Modul wird in den Auswahlkanal geschrieben (damit ein Befehl darauf wirken kann) und sein Ausführungsstatus als <code>"ACTIVE"</code> / <code>"INACTIVE"</code> in den Statuskanal (damit „Start“ vs. „Stopp“ / „Neustart“ sich gegenseitig ausschließend dargestellt werden können); beide werden auf null zurückgesetzt, wenn die Auswahl leer ist. </p>
com.top_logic.layout.view.channel.ChannelBindingConfig = Konfiguration der Kanalbindung
com.top_logic.layout.view.channel.ChannelBindingConfig.channel = Kanal
com.top_logic.layout.view.channel.ChannelBindingConfig.channel.tooltip = Name des Kanals in der referenzierten (untergeordneten) Ansicht.
com.top_logic.layout.view.channel.ChannelBindingConfig.to = An
com.top_logic.layout.view.channel.ChannelBindingConfig.to.tooltip = Verweis auf einen Kanal im übergeordneten Bereich.
com.top_logic.layout.view.channel.ChannelBindingConfig.tooltip = Konfiguration für eine Kanalbindung zwischen einer übergeordneten Ansicht und einer referenzierten untergeordneten Ansicht. <p> Wird innerhalb von <view-ref> verwendet, um einen Kanal aus dem Bereich des Elternteils auf einen in der referenzierten Ansicht deklarierten Kanal abzubilden. Zur Laufzeit wird die Channel-Instanz des Parent mit dem Child geteilt - beide Seiten lesen und schreiben das gleiche Objekt. </p> <p> Beispiel: </p> <pre> &lt;view-ref view="detail.view.xml"&gt; &lt;bind channel="item" to="selectedCustomer"/&gt; &lt;/view-ref&gt; </pre>
com.top_logic.layout.view.channel.ChannelConfig.name = Name
com.top_logic.layout.view.channel.ChannelConfig.name.tooltip = Der eindeutige Name dieses Channels innerhalb der Ansicht.
com.top_logic.layout.view.channel.ChannelMappingConfig = Konfiguration der Abbildung von Kanälen
com.top_logic.layout.view.channel.ChannelMappingConfig.from = Von
com.top_logic.layout.view.channel.ChannelMappingConfig.from.tooltip = Der Name des Quellkanals (in dem Kontext, der den Wert liefert).
com.top_logic.layout.view.channel.ChannelMappingConfig.to = An
com.top_logic.layout.view.channel.ChannelMappingConfig.to.tooltip = Der Name des Zielkanals (im Kontext, in dem der Wert empfangen wird).
com.top_logic.layout.view.channel.ChannelMappingConfig.tooltip = Konfiguration für eine Abbildung eines einzelnen Kanals zwischen zwei Bereichen. <p> Wird in den Elementen <input> und <output> innerhalb der Dialogbefehlskonfiguration verwendet, um einen Kanal von einem Kontext (übergeordnet) auf einen anderen (Dialog) abzubilden. </p>
com.top_logic.layout.view.channel.DerivedChannelConfig.expr = Ausdruck
com.top_logic.layout.view.channel.DerivedChannelConfig.expr.tooltip = TL-Script-Ausdruck, der den abgeleiteten Wert berechnet. <p> Der Ausdruck erhält die Werte der Eingangskanäle als positionale Argumente. Beispiel: Mit inputs="a,b" und expr="x -&gt; y -&gt; $x + $y" wird der Ausdruck mit den aktuellen Werten der Kanäle a und b aufgerufen. </p>
com.top_logic.layout.view.channel.DerivedChannelConfig.observed-types = Beobachtete Typen
com.top_logic.layout.view.channel.DerivedChannelConfig.observed-types.tooltip = Typen, bei denen sich das Objekt ändert (Erstellen / Aktualisieren / Löschen), lösen eine Neuberechnung des Ausdrucks aus – zusätzlich zu den Objekten, welche die Eingaben halten und die stets beobachtet werden. <p> Konfigurieren Sie dies nur für einen Ausdruck, der über die Eingabeobjekte hinausnavigiert, z. B. einen Ausdruck, der ein Attribut des Containers der Eingabe ausliest: Eine Änderung dieses anderen Objekts ist für die Beobachtung der Eingaben selbst nicht sichtbar. „Leer“ (Standard) beobachtet nur die Eingabeobjekte. </p>
com.top_logic.layout.view.channel.DerivedChannelConfig.reverse = Umgekehrt
com.top_logic.layout.view.channel.DerivedChannelConfig.reverse.tooltip = Optionaler TL-Script-Ausdruck für die umgekehrte (Rückwärts-)Ausbreitung. <p> Ist diese Option vorhanden, wird der abgeleitete Kanal bidirektional: Wird ein Wert an diesem Kanal eingestellt, wird dieser Ausdruck zur Berechnung des Quellwerts verwendet, der dann in den ersten Eingangskanal geschrieben wird. </p> <p> Der Ausdruck erhält den abgeleiteten Wert als einziges Argument und muss den entsprechenden Wert für den ersten Eingangskanal zurückgeben. Beispiel: Mit expr="id -&gt; 'id-' + $id" und reverse="s -&gt; $s.substring(3)" wird durch das Schreiben von "id-42" in den abgeleiteten Kanal der Wert "42" auf die Quelle gesetzt. </p>
com.top_logic.layout.view.channel.DerivedChannelFactory = Abgeleitete Kanalfabrik
com.top_logic.layout.view.channel.DerivedChannelFactory.tooltip = <i>Kanalgenerator</i> für abgeleitete (berechnete, schreibgeschützte) Kanäle. <p> Kompiliert den TL-Script-Ausdruck einmalig zum Zeitpunkt der Konfigurationsauswertung. Löst pro Sitzung die Verweise auf Eingangskanäle und die beobachteten Typen auf und erstellt einen <i>abgeleiteten Ansichtskanal</i>, der bei Änderungen der Eingaben sowie – solange er angezeigt wird – bei Änderungen der beobachteten Objekte neu berechnet wird. </p>
com.top_logic.layout.view.channel.Inputs = Eingaben
com.top_logic.layout.view.channel.Inputs.inputs = Eingaben
com.top_logic.layout.view.channel.Inputs.inputs.tooltip = Verweise auf die <i>Ansichtskanäle</i>, deren aktuelle Werte in der Reihenfolge ihrer Deklaration zu den führenden Positionsargumenten der TL-Script-Funktionen dieser Konfiguration werden. <p> Die Kanäle werden bei jeder Anwendung einer Funktion gelesen, sodass das Ergebnis einer Funktion dem folgt, was die referenzierten Kanäle aktuell enthalten. </p> <p> Die Verweise werden entweder als durch Kommata getrenntes Attribut geschrieben: </p> <pre> inputs="selectedCustomer, editMode" </pre> <p> oder als geschachtelte Elemente, eines pro Kanal: </p> <pre> &lt;inputs&gt; &lt;input channel="selectedCustomer"/&gt; &lt;input channel="editMode"/&gt; &lt;/inputs&gt; </pre>
com.top_logic.layout.view.channel.Inputs.tooltip = Die Kanäle, aus denen ein konfiguriertes Element oder eine Aktion die führenden Argumente seiner Funktionen liest. <p> Eine Funktion einer Ansicht berechnet ihr Ergebnis aus mehr als dem Wert, auf den sie angewendet wird: aus dem, was an anderer Stelle ausgewählt ist, aus dem, was ein Filter darüber enthält, aus dem Objekt, für das ein Dialog geöffnet wurde. Ein solcher Wert stammt aus einem <i>Ansichtskanal</i>, den die Konfiguration als Eingabe benennt, und jede Funktion dieser Konfiguration erhält die Werte dieser Kanäle vor den Argumenten, mit denen sie aufgerufen wird. </p>
com.top_logic.layout.view.channel.ValueChannelFactory = Wertkanalfabrik
com.top_logic.layout.view.channel.ValueChannelFactory.tooltip = <i>Channel-Fabrik</i>, die veränderbare <i>Standard-View-Channel-Instanzen</i> erstellt.
com.top_logic.layout.view.command.CancelDialogCommand = Befehl "Dialog abbrechen
com.top_logic.layout.view.command.CancelDialogCommand.tooltip = Ein <i>Ansichtsbefehl</i>, der das oberste geöffnete Dialogfeld schließt, ohne Ergebnisse zu übertragen. <p> Dieser Befehl ist für "Abbrechen"- oder "Schließen"-Schaltflächen in XML-Dateien von Dialogansichten gedacht. Er benötigt keine über die <i>Standardkonfiguration</i> hinausgehenden Eigenschaften (Bezeichnung, Bild, etc.). </p> <p> Solange ein Befehl des Dialogs noch ausgeführt wird, kann der Dialog nicht verlassen werden; die Schaltfläche nennt diesen Grund, statt nichts zu tun, siehe <i>unterbrochene Befehle</i>. </p>
com.top_logic.layout.view.command.CloseDialogAction = Aktion "Dialog schließen
com.top_logic.layout.view.command.CloseDialogAction.tooltip = <i>Ansichtsaktion</i>, die das oberste Dialogfeld schließt. <p> Leitet die Eingabe als Ausgabe weiter, damit sie in einer Kette verwendet werden kann, in der eine nachfolgende Aktion das Ergebnis benötigt. </p>
com.top_logic.layout.view.command.CommandReference = Befehlsreferenz
com.top_logic.layout.view.command.CommandReference.tooltip = Ein <i>Ansichtsbefehl</i>, der an einen benannten Befehl aus dem umschließenden <i>Befehlsbereich</i> delegiert. <p> Wird in <button> Elementen verwendet, um auf einen Befehl zu verweisen, der im umschließenden Panel deklariert ist: </p> <pre> &lt;button&gt; &lt;command-ref name="approve"/&gt; &lt;/button&gt; </pre>
com.top_logic.layout.view.command.ConfirmAction = Aktion bestätigen
com.top_logic.layout.view.command.ConfirmAction.Config.cancel-label = Abbrechen-Beschriftung
com.top_logic.layout.view.command.ConfirmAction.Config.cancel-label.tooltip = Die Bezeichnung der Schaltfläche „Abbrechen“. <p> Wenn keine Angabe erfolgt, wird standardmäßig die Standardbezeichnung „Nein“ verwendet. </p>
com.top_logic.layout.view.command.ConfirmAction.Config.confirm-label = Bestätigen-Beschriftung
com.top_logic.layout.view.command.ConfirmAction.Config.confirm-label.tooltip = Die Bezeichnung der Schaltfläche „Ja“ (Bestätigen). <p> Wenn keine Angabe erfolgt, wird standardmäßig die Standardbezeichnung „Ja“ verwendet. </p>
com.top_logic.layout.view.command.ConfirmAction.Config.expr = Ausdruck
com.top_logic.layout.view.command.ConfirmAction.Config.expr.tooltip = TL-Script-Ausdruck, der die Bestätigungsmeldung erzeugt, oder null/leer, um die Bestätigung zu überspringen (ohne Abfrage fortfahren). <p> Wird mit den Werten des Eingangskanals als führende Positionsargumente (in der Reihenfolge der Deklaration) aufgerufen, gefolgt vom aktuellen Eingangswert der Kette als letztem Argument. </p>
com.top_logic.layout.view.command.ConfirmAction.Config.title = Titel
com.top_logic.layout.view.command.ConfirmAction.Config.title.tooltip = Der Titel des Bestätigungsdialogs. <p> Wird standardmäßig auf einen allgemeinen Bestätigungstitel gesetzt, wenn kein Titel angegeben ist. </p>
com.top_logic.layout.view.command.ConfirmAction.tooltip = <i>Eine</i> unterbrechbare <i>Ansichtshandlung</i>, bei der der Benutzer um Bestätigung gebeten wird, bevor die Kette fortgesetzt wird. <p> Wird als Schutzmaßnahme in einer Befehlskette platziert – typischerweise <em>nach</em> „ <store-form-state/> “ (damit die validierten, übernommenen Formularwerte berücksichtigt werden) und <em>vor</em> „ <with-transaction> “ (damit während des Dialogs keine Transaktion offen bleibt). Die Meldung wird durch einen TL-Script-Ausdruck erzeugt, der wie <i>die Aktion „Skript ausführen“</i> ausgewertet wird: Die konfigurierten Werte des Eingabekanals werden als führende Positionsargumente übergeben, gefolgt vom aktuellen Eingabewert der Kette als letztem Argument. Der Ausdruck gibt die Bestätigungsmeldung (typischerweise ein i18n-Literal wie #('Replace?'@en, 'Ersetzen?'@de)) zur Abfrage zurück oder null/leer, um ohne Abfrage fortzufahren – wodurch <em>die Bedingung zur</em> Schutzklausel <em>wird</em>. </p> <p> Bei Bestätigung wird die Kette fortgesetzt (die Eingabe wird unverändert weitergeleitet); bei Ablehnung wird sie abgebrochen, wobei die Kompensationen bereits ausgeführter Aktionen durchgeführt werden. </p>
com.top_logic.layout.view.command.DirtyCheckScope = Verschmutzter Prüfbereich
com.top_logic.layout.view.command.DirtyCheckScope.NONE = Keine
com.top_logic.layout.view.command.DirtyCheckScope.NONE.tooltip = überspringen Sie schmutzige Kontrollen vollständig.
com.top_logic.layout.view.command.DirtyCheckScope.SELF = Selbst
com.top_logic.layout.view.command.DirtyCheckScope.SELF.tooltip = überprüfen Sie nur das Element, das diesen Befehl besitzt, auf ungespeicherte Änderungen.
com.top_logic.layout.view.command.DirtyCheckScope.VIEW = Siehe
com.top_logic.layout.view.command.DirtyCheckScope.VIEW.tooltip = Prüfen Sie die gesamte Ansicht auf nicht gespeicherte Änderungen.
com.top_logic.layout.view.command.DirtyCheckScope.tooltip = Umfang der Schmutzprüfung, die vor der Ausführung eines <i>View-Befehls</i> durchgeführt wird.
com.top_logic.layout.view.command.DisabledIf = Deaktiviert, wenn
com.top_logic.layout.view.command.DisabledIf.Config.expr = Ausdruck
com.top_logic.layout.view.command.DisabledIf.Config.expr.tooltip = TL-Script-Funktion, die mit dem aktuellen Eingabewert des Befehls aufgerufen wird und den Grund berechnet, warum der Befehl nicht ausgeführt werden darf. <p> Kein Wert oder <code>false</code> lässt den Befehl ausführbar. Ein Ressourcenschlüssel oder ein Text deaktiviert den Befehl mit diesem Grund, <code>true</code> deaktiviert ihn mit einem allgemeinen Grund. </p>
com.top_logic.layout.view.command.DisabledIf.tooltip = <i>Ausführbarkeitsregel</i>, die einen Befehl deaktiviert, solange eine konfigurierte TL-Script-Funktion, ausgewertet auf der Eingabe des Befehls, einen Grund meldet, der die Ausführung verhindert. <p> Das Ergebnis der Funktion entscheidet: Kein Wert oder <code>false</code> lässt den Befehl ausführbar, <code>true</code> deaktiviert ihn mit einem allgemeinen Grund, ein Ressourcenschlüssel oder ein Text deaktiviert ihn mit diesem Grund. Der Grund wird als Tooltip der deaktivierten Schaltfläche angezeigt, sodass der Benutzer erfährt, was fehlt. </p> <p> Gegenstück zu <i>Sichtbar, wenn</i>: Ein Befehl, den der Benutzer noch nicht ausführen darf, bleibt zusammen mit seinem Grund sichtbar, während ein Befehl, der dem Benutzer gar nicht zusteht, ausgeblendet wird. </p> <p> Die Regel wird immer dann ausgewertet, wenn sich die Eingabe des Befehls ändert. Eine Funktion, die Objekte über das Eingabeobjekt hinaus betrachtet, muss deren Typen in den <i>Beobachteten Typen</i> des Befehls (<i>Befehlskonfiguration</i>) angeben, da eine Änderung eines solchen Objekts für den Befehl sonst nicht sichtbar ist. </p> <p> Beispiel – ein Befehl, der einen zugewiesenen Status voraussetzt: </p> <pre> &lt;disabled-if expr="t -&gt; if($t.get(`demo.tickets:Ticket#status`) == null, #('Bitte weisen Sie zuerst einen Status zu.'@de))"/&gt; </pre>
com.top_logic.layout.view.command.DiscardFormStateAction = Formular verwerfen Status Aktion
com.top_logic.layout.view.command.DiscardFormStateAction.tooltip = <i>Ansichtsaktion</i>, die das Formular-Overlay verwirft, ohne Änderungen zu übernehmen. <p> Setzt das Formular-Overlay zurück und verlässt den Bearbeitungsmodus. Nützlich in Abbruch-Aktionsketten für Dialogformulare, bei denen der Dialog nach dem Verwerfen der Änderungen geschlossen werden muss. </p>
com.top_logic.layout.view.command.ExecuteScriptAction = Skriptaktion ausführen
com.top_logic.layout.view.command.ExecuteScriptAction.Config.function = Funktion
com.top_logic.layout.view.command.ExecuteScriptAction.Config.function.tooltip = TL-Script-Funktionsausdruck. <p> Wird mit den Werten der Eingangskanäle als führende Positionsargumente (in der Reihenfolge ihrer Deklaration) aufgerufen, gefolgt vom aktuellen Eingangswert der Kette als letztem Argument. Ohne Eingaben wird die Funktion mit dem aktuellen Eingangswert der Kette als einzigem Argument aufgerufen. </p>
com.top_logic.layout.view.command.ExecuteScriptAction.tooltip = <i>Aktion anzeigen</i>, die eine konfigurierte TL-Script-Funktion auswertet. <p> Ohne Eingaben muss der konfigurierte Ausdruck eine Funktion sein, die ein Argument entgegennimmt: Der aktuelle Eingabewert der Kette wird als Argument übergeben, und der Rückgabewert der Funktion wird zur Ausgabe dieser Aktion. </p> <p> Beispiel: Erstellen eines transienten Objekts: </p><pre> &lt;execute-script function="x -&gt; new(`test.constraints:ConstraintTestType`, transient: true)"/&gt; </pre> <p> Bei Vorhandensein von Eingaben werden die aktuellen Werte der referenzierten <i>Ansichtskanäle</i> als führende Positionsargumente übergeben, gefolgt vom aktuellen Eingabewert der Kette als letztem Argument. Dies ermöglicht es einer Aktion, einen separaten Kanalwert (z. B. einen Erstellungs-Kontext/Container) mit dem verketteten Wert (z. B. dem zu erstellenden Formularobjekt) zu kombinieren. Beispiel: Ein temporäres Formularobjekt in der zusammengesetzten Referenz eines Container-Kanals persistieren: </p><pre> &lt;execute-script function="container -&gt; obj -&gt; $container.add(`my.module:Container#children`, $obj.copy(transient: false))"&gt; &lt;inputs&gt; &lt;input channel="context"/&gt; &lt;/inputs&gt; &lt;/execute-script&gt; </pre>
com.top_logic.layout.view.command.FormValid = Formular gültig
com.top_logic.layout.view.command.FormValid.tooltip = <i>Ausführbarkeitsregel anzeigen</i>, die einen Befehl deaktiviert, solange das übergeordnete Formular Validierungsfehler anzeigt. <p> Schützt Befehle, die die eingegebenen Werte speichern: Ein solcher Befehl wird vom Formular ohnehin abgelehnt, daher ist es irreführend, ihn anzubieten, solange die Probleme auf dem Bildschirm angezeigt werden. Fehler, die der Benutzer noch nicht sehen kann, deaktivieren den Befehl nicht – erst der Speicherversuch macht sie überhaupt erst sichtbar. </p> <p> Wird automatisch auf einen Formularbefehl angewendet, dessen Aktionskette eine <i>Aktion zum Speichern des Formularzustands</i> enthält. Konfigurieren Sie diese Regel explizit für einen Befehl, der Formularwerte über eine andere Aktion übernimmt. </p>
com.top_logic.layout.view.command.GenericViewCommand = Generischer Ansichtsbefehl
com.top_logic.layout.view.command.GenericViewCommand.Config.actions = Aktionen
com.top_logic.layout.view.command.GenericViewCommand.Config.actions.tooltip = Die Kette von Aktionen, die nacheinander ausgeführt werden sollen.
com.top_logic.layout.view.command.GenericViewCommand.tooltip = Ein <i>View-Befehl</i>, der eine konfigurierte Kette von <i>View-Aktionen</i> ausführt. <p> Der Rückgabewert jeder Aktion wird zur Eingabe für die nächste Aktion. Die erste Aktion erhält die Eingabe des Befehls (in der Regel null für Symbolleistenschaltflächen). Auf diese Weise lassen sich komplexe Verhaltensweisen aus einfachen, wiederverwendbaren Bausteinen zusammenstellen. </p> <p> Beispiel: Erstellen Sie ein transientes Objekt und öffnen Sie damit einen Dialog: </p> <pre> &lt;generic-command Bezeichnung="New"&gt; &lt;execute-script function="x -&gt; new(`my.module:MyType`, transient: true)"/&gt; &lt;open-dialog dialog-view="demo/create.view.xml" bind-input-to="model"/&gt; &lt;/generic-command&gt; </pre>
com.top_logic.layout.view.command.IfAction = Bedingte Aktion
com.top_logic.layout.view.command.IfAction.Config.else = Sonst
com.top_logic.layout.view.command.IfAction.Config.else.tooltip = Die Aktionen, die ausgeführt werden sollen, wenn die Bedingung nicht erfüllt ist; keine, um den Wert der Kette weiterzugeben.
com.top_logic.layout.view.command.IfAction.Config.test = Test
com.top_logic.layout.view.command.IfAction.Config.test.tooltip = TL-Script-Bedingung, die entscheidet, welcher Zweig ausgeführt wird. <p> Wird mit den Werten der Eingangskanäle als führende Positionsargumente aufgerufen, gefolgt vom aktuellen Wert der Kette als letztem Argument. Das Ergebnis wird als Bedingung im Fuzzy-Sinne von TL-Script interpretiert, sodass ein einfaches Objekt für eine wahre Bedingung steht und nichts – Null, eine leere Liste, ein leerer Text – für eine falsche. </p>
com.top_logic.layout.view.command.IfAction.Config.then = Dann
com.top_logic.layout.view.command.IfAction.Config.then.tooltip = Die Aktionen, die ausgeführt werden sollen, wenn die Bedingung erfüllt ist; keine, um den Wert der Kette weiterzugeben.
com.top_logic.layout.view.command.IfAction.tooltip = <i>Aktion anzeigen</i>, die anhand einer TL-Script-Bedingung, die den aktuellen Wert der umschließenden Kette berücksichtigt, zwischen zwei Aktionsketten entscheidet. <p> Die ausgewählte Kette wird als verschachtelte Kette der übergeordneten Kette ausgeführt: Sie beginnt mit dem aktuellen Wert, und das Ergebnis ihrer letzten Aktion wird zu dem Wert, mit dem die übergeordnete Kette fortfährt. Der nicht ausgewählte Zweig wird nicht ausgeführt, und ein nicht konfigurierter Zweig gibt den Wert unverändert weiter. Ein Abbruch innerhalb eines Zweigs – eine abgelehnte <i>Bestätigungsaktion</i> – bricht den gesamten Befehl ab, und eine innerhalb eines Zweigs registrierte Kompensation wird beim Abbruch des Befehls genauso ausgeführt wie eine, die neben dem Zweig registriert ist. </p> <p> Beispiel: Wähle das von der Kette gefundene Ticket aus oder biete an, eines zu erstellen, wenn keine gefunden wurde: </p><pre> &lt;if test="ticket -&gt; $ticket != null"&gt; &lt;then&gt; &lt;write-channel name="ticket"/&gt; &lt;/then&gt; &lt;else&gt; &lt;execute-script function="x -&gt; new(`demo.tickets:Ticket`, transient: true)"/&gt; &lt;open-dialog bind-input-to="model" dialog-view="tickets-create.view.xml"/&gt; &lt;/else&gt; &lt;/if&gt; </pre>
com.top_logic.layout.view.command.InspectEnabled = UI-Inspektion aktiviert
com.top_logic.layout.view.command.InspectEnabled.tooltip = <i>Regel zur Ausführbarkeit anzeigen</i>, die einen Befehl nur dann anzeigt, wenn die Anwendung mit aktivierter UI-Prüfung läuft, und ihn andernfalls ausblendet. <p> Das Tor zu den Entwicklertools – der UI-Inspector und alles andere, was Aufschluss darüber gibt, wie die Benutzeroberfläche aufgebaut ist, und nicht darüber, was sie anzeigt. Es handelt sich um einen Bereitstellungsschalter, nicht um eine Berechtigung: Wer an einem System arbeitet, bei dem diese Option aktiviert ist, sieht die Tools unabhängig von seiner Rolle, und niemand sieht sie auf einem System, bei dem diese Option deaktiviert ist. </p>
com.top_logic.layout.view.command.LanguageCommands = Sprachbefehle
com.top_logic.layout.view.command.LanguageCommands.tooltip = Ein Befehl pro Sprache, die die Anwendung unterstützt; jeder Befehl wechselt den aktuellen Benutzer in diese Sprache. <p> Die Liste folgt den unterstützten Locales der <i>Internationalisierungsressourcen</i>, und ein Eintrag trägt den Namen der Sprache in dieser Sprache selbst – „Deutsch“, „English“ –, was ein Leser, der nach seiner Sprache sucht, erkennt und was keiner eigenen Übersetzung bedarf. Der Eintrag für die aktuell aktive Sprache ist als aktiv markiert, so wie <i>Theme-Befehle</i> das aktuell gültige Theme kennzeichnen; er bleibt ausführbar, und ihn auszuwählen tut nichts. </p> <p> Solange die Sitzung anonym ist, wird nichts angeboten: Die Auswahl wird im Konto gespeichert, und bei einer anonymen Sitzung gibt es kein Konto, in dem sie gespeichert werden könnte. Eine einzige unterstützte Sprache führt ebenfalls zu keinen Einträgen. </p>
com.top_logic.layout.view.command.MenuTrigger = Menü-Auslöser
com.top_logic.layout.view.command.MenuTrigger.CLICK = Klick
com.top_logic.layout.view.command.MenuTrigger.CLICK.tooltip = Das Menü öffnet sich per Klick und wird unterhalb des Bereichs angezeigt, ähnlich wie bei einem Dropdown-Menü.
com.top_logic.layout.view.command.MenuTrigger.CONTEXT_MENU = Kontextmenü
com.top_logic.layout.view.command.MenuTrigger.CONTEXT_MENU.tooltip = Das Menü wird durch ein Kontextmenü-Ereignis – einen Rechtsklick oder die entsprechenden Gesten bzw. Tastenkombinationen – geöffnet und erscheint an der Position des Mauszeigers.
com.top_logic.layout.view.command.MenuTrigger.tooltip = Die Geste auf einem <i>Menübereichs-Steuerelement</i>, die dessen Menü öffnet.
com.top_logic.layout.view.command.NotifyAction = Benachrichtigungsaktion
com.top_logic.layout.view.command.NotifyAction$Display = Anzeige
com.top_logic.layout.view.command.NotifyAction$Display.tooltip = Wo der Nutzer liest, was ihm gesagt wird.
com.top_logic.layout.view.command.NotifyAction$Kind = Art
com.top_logic.layout.view.command.NotifyAction$Kind.tooltip = Wie ernst die Informationen sind, die dem Nutzer mitgeteilt werden.
com.top_logic.layout.view.command.NotifyAction.Config.display = Anzeige
com.top_logic.layout.view.command.NotifyAction.Config.display.tooltip = Wo der Benutzer die Nachricht liest.
com.top_logic.layout.view.command.NotifyAction.Config.expr = Ausdruck
com.top_logic.layout.view.command.NotifyAction.Config.expr.tooltip = TL-Script-Ausdruck, der die Meldung erzeugt, oder null/leer, um nichts auszugeben (die Kette wird unverändert fortgesetzt). <p> Wird mit den Werten der Eingangskanäle als führende Positionsargumente (in der Reihenfolge ihrer Deklaration) aufgerufen, gefolgt vom aktuellen Eingangswert der Kette als letztem Argument. </p>
com.top_logic.layout.view.command.NotifyAction.Config.kind = Art
com.top_logic.layout.view.command.NotifyAction.Config.kind.tooltip = Wie ernst die Meldung ist. <p> Legt fest, wie eine <i>Snackbar</i> -Meldung gekennzeichnet wird und welchen Titel ein <i>Dialogfeld</i> trägt, wenn kein Titel konfiguriert ist. </p>
com.top_logic.layout.view.command.NotifyAction.Config.stop = Stopp
com.top_logic.layout.view.command.NotifyAction.Config.stop.tooltip = Ob die Kette mit der Meldung endet, anstatt mit unverändertem Wert fortgesetzt zu werden. <p> Eine endende Kette führt die Kompensationen der ihr vorausgehenden Aktionen aus und meldet nichts über die Nachricht selbst hinaus. Gab es nichts zu sagen, endet keine Kette. </p>
com.top_logic.layout.view.command.NotifyAction.Config.title = Titel
com.top_logic.layout.view.command.NotifyAction.Config.title.tooltip = Der Titel eines <i>Dialogfelds</i>. <p> Wenn nicht festgelegt, wird standardmäßig ein Titel verwendet, der dem Schweregrad entspricht. </p>
com.top_logic.layout.view.command.NotifyAction.Display.DIALOG = Dialog
com.top_logic.layout.view.command.NotifyAction.Display.DIALOG.tooltip = Ein Dialogfeld, das so lange angezeigt bleibt, bis der Benutzer es bestätigt, und das die Kette hält, solange es geöffnet ist.
com.top_logic.layout.view.command.NotifyAction.Display.SNACKBAR = Snackbar
com.top_logic.layout.view.command.NotifyAction.Display.SNACKBAR.tooltip = Eine Nachricht, die am Arbeitsbereich des Benutzers vorbeiläuft und auf die er nicht reagieren muss.
com.top_logic.layout.view.command.NotifyAction.Kind.ERROR = Fehler
com.top_logic.layout.view.command.NotifyAction.Kind.ERROR.tooltip = Etwas, das der Benutzer angefordert hatte, ist nicht geschehen.
com.top_logic.layout.view.command.NotifyAction.Kind.INFO = Info
com.top_logic.layout.view.command.NotifyAction.Kind.INFO.tooltip = Es ist etwas passiert, worum der Benutzer gebeten hatte.
com.top_logic.layout.view.command.NotifyAction.Kind.WARNING = Warnung
com.top_logic.layout.view.command.NotifyAction.Kind.WARNING.tooltip = Etwas, dessen sich der Nutzer bewusst sein sollte, ohne dass ihn dies davon abgehalten hat.
com.top_logic.layout.view.command.NotifyAction.tooltip = Aktion, die dem Benutzer eine Rückmeldung gibt – warum seine Anfrage abgelehnt wurde oder was geschehen ist – und die Kette entweder fortsetzt oder nach der Rückmeldung beendet. <p> Die Meldung wird durch einen TL-Script-Ausdruck erzeugt, der wie <i>die Aktion „Skript ausführen“</i> ausgewertet wird: Die konfigurierten Werte des Eingangskanals werden als führende Positionsargumente übergeben, gefolgt vom aktuellen Eingangswert der Kette als letztem Argument. Der Ausdruck gibt die Meldung zurück (in der Regel ein i18n-Literal wie #('Nothing selected.'@en, 'Nichts ausgewählt.'@de)) oder null/leer, wenn nichts zu melden ist – wodurch die Meldung <em>bedingt</em> wird und der Wert der Kette unverändert weitergeleitet wird. </p> <p> Die Meldung erscheint als Laufmeldung neben der Arbeit des Benutzers oder als Dialog, den dieser bestätigen muss; ihr Schweregrad bestimmt, wie eine Laufmeldung gekennzeichnet wird und welchen Titel ein Dialog trägt. Ein Dialog hält die Kette so lange, bis er geschlossen wird. </p>
com.top_logic.layout.view.command.NullInputDisabled = Null-Eingang deaktiviert
com.top_logic.layout.view.command.NullInputDisabled.tooltip = <i>Ausführbarkeitsregel anzeigen</i>, die den Befehl deaktiviert, wenn die Eingabe Null ist. <p> Gibt <code>NO_EXEC_NO_MODEL</code> für Nulleingabe und sonst <code>EXECUTABLE</code> zurück. </p>
com.top_logic.layout.view.command.NullInputHidden = Nulleingabe versteckt
com.top_logic.layout.view.command.NullInputHidden.tooltip = <i>Ausführbarkeitsregel anzeigen</i>, die den Befehl ausblendet, wenn die Eingabe Null ist. <p> Gibt <code>NOT_EXEC_HIDDEN</code> für Nulleingabe und sonst <code>EXECUTABLE</code> zurück. </p>
com.top_logic.layout.view.command.OpenDialogAction = Dialogaktion öffnen
com.top_logic.layout.view.command.OpenDialogAction.Config.bind-input-to = Eingabe binden an
com.top_logic.layout.view.command.OpenDialogAction.Config.bind-input-to.tooltip = Name des Dialogkanals, der das Eingabeobjekt der Aktion empfangen soll. <p> Der Standardwert ist "model", wenn nichts angegeben wird. </p>
com.top_logic.layout.view.command.OpenDialogAction.Config.bindings = Bindungen
com.top_logic.layout.view.command.OpenDialogAction.Config.bindings.tooltip = Kanalbindungen vom übergeordneten Bereich zum Dialog.
com.top_logic.layout.view.command.OpenDialogAction.Config.close-on-backdrop = Hintergrund schließen
com.top_logic.layout.view.command.OpenDialogAction.Config.close-on-backdrop.tooltip = Ob das Anklicken des Hintergrunds den Dialog schließt.
com.top_logic.layout.view.command.OpenDialogAction.Config.dialog-view = Dialog-Ansicht
com.top_logic.layout.view.command.OpenDialogAction.Config.dialog-view.tooltip = Pfad zur Datei der Dialogansicht, relativ zu /WEB-INF/views/.
com.top_logic.layout.view.command.OpenDialogAction.tooltip = <i>Ansichtsaktion</i>, die einen modalen Dialog öffnet. <p> Die Eingabe der Aktion wird in einen benannten Dialogkanal eingespeist (<i>Eingabe binden an</i>, Standard: „model“). Zusätzliche übergeordnete Kanäle können über Live-Bindungen gemeinsam genutzt werden. </p> <p> Wenn ein Formular, das an einen der gemeinsam genutzten übergeordneten Kanäle gebunden ist, ungespeicherte Änderungen enthält, wird der Benutzer <em>vor</em> dem Öffnen des Dialogs gefragt, wie mit diesen verfahren werden soll: Da die eigenen Befehle des Dialogs in diese Kanäle schreiben, würde eine erst dann erfolgende Abfrage den Benutzer zwingen, entweder die Änderungen oder alles, was gerade in den Dialog eingegeben wurde, zu opfern. Wird die Frage abgelehnt, wird die Kette abgebrochen und der Dialog bleibt geschlossen. </p> <p> Diese Aktion enthält die Kernlogik zum Öffnen des Dialogs. <i>Der Befehl „Dialog öffnen“</i> erweitert diese um Optionen zur Darstellung des Befehls (Bezeichnung, Bild, Ausführbarkeit). </p>
com.top_logic.layout.view.command.OpenDialogCommand = Befehl "Dialog öffnen
com.top_logic.layout.view.command.OpenDialogCommand.Config.bind-input-to = Eingabe binden an
com.top_logic.layout.view.command.OpenDialogCommand.Config.bind-input-to.tooltip = Name des Dialogkanals, der den Eingabeparameter des Befehls empfangen soll.
com.top_logic.layout.view.command.OpenDialogCommand.Config.bindings = Bindungen
com.top_logic.layout.view.command.OpenDialogCommand.Config.bindings.tooltip = Kanalbindungen vom übergeordneten Bereich zu den Kanälen der Dialogansicht. <p> Jede Bindung teilt sich die Kanalinstanz des übergeordneten Bereichs mit dem Dialog - beide Seiten lesen und schreiben dasselbe Objekt (Live-Bindung), identisch mit dem von <view-ref> verwendeten Mechanismus. </p>
com.top_logic.layout.view.command.OpenDialogCommand.Config.close-on-backdrop = Hintergrund schließen
com.top_logic.layout.view.command.OpenDialogCommand.Config.close-on-backdrop.tooltip = Ob das Anklicken des Hintergrunds (außerhalb des Dialogs) diesen schließt.
com.top_logic.layout.view.command.OpenDialogCommand.Config.dialog-view = Dialog-Ansicht
com.top_logic.layout.view.command.OpenDialogCommand.Config.dialog-view.tooltip = Pfad zu der .view.xml-Datei, die den Inhalt des Dialogs definiert, relativ zu /WEB-INF/views/.
com.top_logic.layout.view.command.OpenDialogCommand.Config.outputs = Ausgänge
com.top_logic.layout.view.command.OpenDialogCommand.Config.outputs.tooltip = Ausgabe der Kanalzuordnungen aus dem Dialogfeld zurück in die übergeordnete Ansicht. <p> Reserviert für zukünftige Verwendung. </p>
com.top_logic.layout.view.command.OpenDialogCommand.tooltip = Ein <i>Ansichtsbefehl</i>, der einen modalen Dialog öffnet, dessen Inhalt in einer separaten .view.xml-Datei definiert ist. <p> Delegiert die Kernlogik für das <i>öffnen von Dialogen</i> an die <i>Aktion open dialog</i>. Dieser Befehl fügt die <i>Standardkonfigurationsoptionen</i> für die Darstellung hinzu (Bezeichnung, Bild, Ausführbarkeit). </p> <p> Beispiel für die Verwendung: </p> <pre> &lt;button&gt; &lt;action class="com.top_logic.layout.view.command.OpenDialogCommand" dialog-view="demo/show-details.view.xml" close-on-backdrop="true"&gt; &lt;bind channel="model" to="selection"/&gt; &lt;/action&gt; &lt;/button&gt; </pre>
com.top_logic.layout.view.command.OpenViewWindowCommand = Befehl „Ansichtsfenster öffnen“
com.top_logic.layout.view.command.OpenViewWindowCommand.Config.height = Höhe
com.top_logic.layout.view.command.OpenViewWindowCommand.Config.height.tooltip = Die anfängliche Fensterhöhe in Pixeln.
com.top_logic.layout.view.command.OpenViewWindowCommand.Config.resizable = Größenveränderbar
com.top_logic.layout.view.command.OpenViewWindowCommand.Config.resizable.tooltip = Ob die Größe des Fensters geändert werden kann.
com.top_logic.layout.view.command.OpenViewWindowCommand.Config.singleton-key = Singleton-Schlüssel
com.top_logic.layout.view.command.OpenViewWindowCommand.Config.singleton-key.tooltip = Ein optionaler Schlüssel, der dieses Fenster als Singleton kennzeichnet: Wird es erneut geöffnet, wird das bereits vorhandene Fenster in den Vordergrund geholt, anstatt ein Duplikat zu erstellen. Leer, wenn es sich um ein Nicht-Singleton-Fenster handelt.
com.top_logic.layout.view.command.OpenViewWindowCommand.Config.title = Titel
com.top_logic.layout.view.command.OpenViewWindowCommand.Config.title.tooltip = Der im Browserfenster angezeigte Fenstertitel (wird beim Öffnen des Fensters entsprechend der Ländereinstellung des Benutzers angepasst).
com.top_logic.layout.view.command.OpenViewWindowCommand.Config.view = Anzeigen
com.top_logic.layout.view.command.OpenViewWindowCommand.Config.view.tooltip = Die Fensterinhaltsansicht als Pfad relativ zu <code>"/WEB-INF/views/"</code> (z. B. demo/script-recorder.view.xml).
com.top_logic.layout.view.command.OpenViewWindowCommand.Config.width = Breite
com.top_logic.layout.view.command.OpenViewWindowCommand.Config.width.tooltip = Die anfängliche Fensterbreite in Pixeln.
com.top_logic.layout.view.command.OpenViewWindowCommand.tooltip = Ein <i>„View“-Befehl</i>, der ein neues Browserfenster öffnet, dessen Inhalt eine konfigurierte .view.xml-Datei ist. <p> Das generische Verhalten „ein Fenster mit einer Ansicht öffnen“ – jede Funktion, die ein Nebenfenster benötigt (ein Aufzeichnungsfenster, ein Hilfefenster, ein Detail-Popup) – konfiguriert diesen Befehl mit der Ansicht und der Fenstergeometrie, anstatt einen maßgeschneiderten Öffnungsbefehl zu schreiben. Ein Singleton-Schlüssel sorgt dafür, dass bei wiederholten Aufrufen der Fokus auf das bereits vorhandene Fenster gerichtet wird, anstatt Duplikate zu öffnen. </p>
com.top_logic.layout.view.command.ReadFormObjectAction = Aktion Formularobjekt lesen
com.top_logic.layout.view.command.ReadFormObjectAction.tooltip = <i>Ansichtsaktion</i>, die das aktuelle Objekt aus dem umschließenden Formular liest. <p> Gibt das aktuelle Objekt des Formulars zurück, das im Bearbeitungsmodus das Overlay mit den Bearbeitungen des Benutzers ist. Die Eingabe wird ignoriert. </p>
com.top_logic.layout.view.command.RememberStartPageAction = Aktion auf der Startseite speichern
com.top_logic.layout.view.command.RememberStartPageAction.tooltip = Merkt sich die Seite, die der Benutzer gerade betrachtet, als Startseite – oder vergisst sie wieder, sobald er sich bereits dort befindet. <p> Ein Eintrag dient für beide Fälle, da die Frage, die ein Nutzer stellt, in beiden Fällen dieselbe ist – nämlich, ob diese Seite der Startpunkt ist. Wird der Eintrag auf der Seite aufgerufen, die bereits die Startseite ist, wird die Auswahl gelöscht, sodass kein zweiter Eintrag erforderlich ist, der in den meisten Fällen bedeutungslos wäre. </p>
com.top_logic.layout.view.command.ResetPersonalConfigurationAction = Aktion „Persönliche Konfiguration zurücksetzen“
com.top_logic.layout.view.command.ResetPersonalConfigurationAction.tooltip = Löscht alle vom aktuellen Benutzer vorgenommenen Anpassungen an der Darstellung der Anwendung, sodass sie für ihn so aussieht, wie für jemanden, der sie noch nie benutzt hat. <p> Dazu gehören das ausgewählte Theme, die Spaltenbreiten einer Tabelle, der Zustand eines ausgeblendeten Bereichs – alles, was sich in der persönlichen Konfiguration angesammelt hat. Was das Konto als eigene Daten enthält – Sprache, Land, Zeitzone – ist davon nicht betroffen und bleibt erhalten. </p> <p> Die gespeicherte Konfiguration und die Kopien, die die Sitzung enthält, werden gemeinsam verworfen – eine pro Tab, wobei jede eine eigene Untersitzung darstellt –, da das Beibehalten einer davon die anderen wiederherstellen würde, sobald das Tab, zu dem sie gehört, sie ausgibt. </p> <p> Jedes Fenster der Sitzung wird daraufhin neu aufgebaut, da das, was gerade verworfen wurde, genau das ist, woraus die angezeigte Seite aufgebaut war. Der vorübergehende Anzeigestatus dieser Seiten geht damit einher: die Auswahl in einer Tabelle, ihre Scrollposition, die Eingaben in einem Formular. </p>
com.top_logic.layout.view.command.ScrollToAnchorAction = Zum Anker scrollen
com.top_logic.layout.view.command.ScrollToAnchorAction.Config.target = Ziel
com.top_logic.layout.view.command.ScrollToAnchorAction.Config.target.tooltip = TL-Script-Funktion, die das Scroll-Ziel aus dem aktuellen Eingabewert der Kette berechnet: input -&gt; target. <p> Das Ergebnis ist ein Modellobjekt (das anhand seiner Anker-ID angesteuert wird) oder eine Zeichenkette (ein literaler Ankername). Wenn diese Option nicht gesetzt ist, wird der Eingabewert der Kette direkt als Ziel verwendet. </p>
com.top_logic.layout.view.command.ScrollToAnchorAction.tooltip = <i>Aktion</i>, die den Browser zu einem &lt;Anker&gt; scrollt und das Ziel dynamisch berechnet. <p> Das Ziel ist entweder ein Modellobjekt – zu dem anhand seiner Anker-ID gescrollt wird – oder eine Zeichenfolge, die einen festen Anker benennt. In einer Befehlskette platziert, z. B. in einem Antwortbefehl, der den Editor für neue Elemente in den Blickbereich bringt: </p><pre> &lt;generic-command&gt; ... Antwort vorbereiten ... &lt;scroll-to-anchor target="'composer'"/&gt; &lt;/generic-command&gt; </pre>
com.top_logic.layout.view.command.SetThemeCommand = Befehl zum Festlegen des Themes
com.top_logic.layout.view.command.SetThemeCommand.Config.theme = Theme
com.top_logic.layout.view.command.SetThemeCommand.Config.theme.tooltip = ID des zu aktivierenden Themes. <p> Ohne Theme verwirft der Befehl das vom Benutzer ausgewählte Theme, sodass die Seiten des Benutzers der Darstellungs-Einstellung des Betriebssystems folgen. </p>
com.top_logic.layout.view.command.SetThemeCommand.tooltip = Ein <i>View-Befehl</i>, der ein UI-Theme aktiviert. <p> Speichert das Theme als Einstellung des Benutzers und wendet es sofort auf dem Client an, ohne die Seite neu zu laden. Ein Befehl, der kein Theme benennt, verwirft die Einstellung, sodass die Seiten des Benutzers der Darstellungs-Einstellung des Betriebssystems folgen. </p>
com.top_logic.layout.view.command.StoreFormStateAction = Formularstatus Aktion speichern
com.top_logic.layout.view.command.StoreFormStateAction.tooltip = <i>Ansichtsaktion</i>, die das Formular validiert, alle Fehler aufdeckt und Bearbeitungen auf das Basisobjekt anwendet. <p> Bei der Ausführung: </p> <ol> <li>Zeigt alle Überprüfungsfehler in den Feldern an (setzt bei allen Feldern "revealed = true").</li> <li>Wenn das Formular Überprüfungsfehler aufweist, wird eine <i>TopLogic-Ausnahme</i> ausgelöst, um die Aktionskette abzubrechen und den Fehler in der Zwischenablage anzuzeigen.</li> <li>Andernfalls werden die Overlay-Bearbeitungen auf das Basisobjekt angewendet und dieses zurückgegeben.</li> </ol>
com.top_logic.layout.view.command.SwitchAction = Fallunterscheidung
com.top_logic.layout.view.command.SwitchAction$CaseConfig = Fall-Konfiguration
com.top_logic.layout.view.command.SwitchAction$CaseConfig.tooltip = Konfiguration eines einzelnen <case> einer <i>Fallunterscheidung</i>. <p> Ein Fall konfiguriert genau eines von „match“ und „test“. </p>
com.top_logic.layout.view.command.SwitchAction.CaseConfig.actions = Aktionen
com.top_logic.layout.view.command.SwitchAction.CaseConfig.actions.tooltip = Die Aktionen, die ausgeführt werden sollen, wenn dieser Fall zutrifft; keine, um den Wert der Kette weiterzugeben.
com.top_logic.layout.view.command.SwitchAction.CaseConfig.match = Vergleichswert
com.top_logic.layout.view.command.SwitchAction.CaseConfig.match.tooltip = TL-Script-Ausdruck ohne Parameter, der den Wert berechnet, für den dieser Fall steht. <p> Der Fall trifft zu, wenn der Wert der Fallunterscheidung im Sinne des TL-Script-Vergleichs diesem Wert entspricht; daher wird ein Klassifikator als `module:Enumeration#literal`, ein Text als 'text' und eine Zahl als die Zahl selbst geschrieben. Der Ausdruck wird bei jeder Entscheidung der Fallunterscheidung ausgewertet, sodass er den Wert auch aus dem Zustand der Anwendung berechnen kann. </p>
com.top_logic.layout.view.command.SwitchAction.CaseConfig.test = Test
com.top_logic.layout.view.command.SwitchAction.CaseConfig.test.tooltip = Ein TL-Script-Prädikat, das mit dem Wert der Fallunterscheidung aufgerufen wird; dieser Fall trifft zu, wenn das Prädikat wahr ist. <p> Das Ergebnis wird im fuzzy-Sinne von TL-Script als Bedingung gewertet, sodass ein einfaches Objekt für eine wahre Bedingung steht und nichts – null, eine leere Liste, ein leerer Text – für eine falsche. Verwenden Sie dies für einen Fall, der nicht als einzelner Wert geschrieben werden kann, wie beispielsweise einen Bereich oder eine Prüfung auf Leere; ein Fall, der für einen Wert steht, wird als „match“ geschrieben. </p>
com.top_logic.layout.view.command.SwitchAction.Config.cases = Fälle
com.top_logic.layout.view.command.SwitchAction.Config.cases.tooltip = Die Fälle werden der Reihe nach verglichen; der erste übereinstimmende Fall wird ausgeführt.
com.top_logic.layout.view.command.SwitchAction.Config.default = Standard
com.top_logic.layout.view.command.SwitchAction.Config.default.tooltip = Die Aktionen, die ausgeführt werden sollen, wenn kein Fall zutrifft; keine, um den Wert der Kette weiterzugeben.
com.top_logic.layout.view.command.SwitchAction.Config.value = Wert
com.top_logic.layout.view.command.SwitchAction.Config.value.tooltip = TL-Script-Funktion, die den Wert berechnet, über den die „cases“ entscheiden. <p> Wird mit den Kanalwerten der Eingaben als führende Positionsargumente aufgerufen, gefolgt vom aktuellen Wert der Kette als letztem Argument. Ohne eine solche Funktion ist der aktuelle Wert der Kette der Wert, über den die Fälle entscheiden. </p>
com.top_logic.layout.view.command.SwitchAction.tooltip = <i>Ansichtsaktion</i>, die anhand eines Werts, der aus dem aktuellen Wert der umschließenden Kette berechnet wird, eine von mehreren Aktionsketten auswählt. <p> Der Wert der Fallunterscheidung ist das, worüber die Fälle entscheiden: das Ergebnis ihrer Wertfunktion oder der aktuelle Wert der Kette selbst, wenn keine solche Funktion konfiguriert ist. Ein Fall benennt entweder den Wert, für den er steht, mit „match“ – einem TL-Script-Ausdruck ohne Parameter, der mit der Gleichheit von TL-Script mit dem Wert der Fallunterscheidung verglichen wird, sodass ein Klassifikator, ein Text und eine Zahl jeweils als das Literal geschrieben werden, das sie sind – oder er entscheidet anhand eines Prädikats „test“, das mit dem Wert der Fallunterscheidung aufgerufen und als Bedingung im Fuzzy-Sinne von TL-Script gelesen wird. Jeder Fall konfiguriert genau eine der beiden Möglichkeiten. </p> <p> Die Fälle werden in der Reihenfolge ihrer Konfiguration verglichen, und der erste passende Fall wird ausgeführt; wenn keiner passt, wird der Standardwert ausgeführt. Die ausgewählte Kette läuft als verschachtelte Kette der umschließenden Kette ab: Sie beginnt mit dem aktuellen Wert, und das Ergebnis ihrer letzten Aktion wird zum Wert, mit dem die umschließende Kette fortfährt. Ein Fall ohne Aktionen, eine Standardregel ohne Aktionen und ein Wert, der weder mit einem Fall noch mit einer konfigurierten Standardregel übereinstimmt, leiten den Wert unverändert weiter. Ein Abbruch innerhalb eines Falls – eine abgelehnte <i>Bestätigungsaktion</i> – bricht den gesamten Befehl ab, und eine innerhalb eines Falls registrierte Kompensation wird beim Abbruch des Befehls wie eine neben der Fallunterscheidung registrierte Kompensation ausgeführt. </p> <p> Beispiel: Ein offenes Ticket schließen und ein geschlossenes wieder öffnen – in einem einzigen Befehl: </p><pre> &lt;switch value="t -&gt; $t.get(`demo.tickets:Ticket#status`)"&gt; &lt;case match="`demo.tickets:TicketStatus#closed`"&gt; &lt;with-transaction&gt; &lt;execute-script function="t -&gt; $t.set(`demo.tickets:Ticket#status`, `demo.tickets:TicketStatus#open`)"/&gt; &lt;/with-transaction&gt; &lt;/case&gt; &lt;default&gt; &lt;with-transaction&gt; &lt;execute-script function="t -&gt; $t.set(`demo.tickets:Ticket#status`, `demo.tickets:TicketStatus#closed`)"/&gt; &lt;/with-transaction&gt; &lt;/default&gt; &lt;/switch&gt; </pre> <p> Beispiel: Entscheidung über den Wert der Kette selbst mit einem Literal und einem Prädikat: </p><pre> &lt;switch&gt; &lt;case test="s -&gt; $s == null"&gt; &lt;execute-script function="x -&gt; new(`demo.tickets:Ticket`, transient: true)"/&gt; &lt;/case&gt; &lt;case match="'closed'"&gt; &lt;write-channel name="closedTicket"/&gt; &lt;/case&gt; &lt;/switch&gt; </pre>
com.top_logic.layout.view.command.ThemeCommands = Theme-Befehle
com.top_logic.layout.view.command.ThemeCommands.tooltip = Die Befehle, die dem Benutzer ein UI-Theme zum Wechseln anbieten: eines pro konfiguriertem Theme, angeführt von einem Eintrag, der der Darstellungs-Einstellung des Betriebssystems folgt. <p> Die Menge folgt den <i>UI-Themes</i>, sodass eine Anwendung ihre eigenen Themes durch Konfiguration anbietet und dafür keine Änderung der Ansicht braucht; Bezeichnung und Symbol eines Theme-Eintrags sind die, die das Theme deklariert. Der erste Eintrag erscheint dort, wo die helle und die dunkle Einstellung des Betriebssystems von unterschiedlichen Themes beantwortet werden, und wählt keines der Themes aus: Er verwirft die gespeicherte Auswahl des Benutzers und überlässt die Darstellung dem Betriebssystem. </p> <p> Der Eintrag, der beschreibt, was der Benutzer sieht, ist als aktiv markiert, sodass das Menü die aktuelle Darstellung unter den angebotenen Alternativen zeigt. Er bleibt ausführbar: Die bereits gültige Darstellung erneut anzuwenden, ist eine leere Operation, bei der der Benutzer nichts falsch machen kann. Eine Anwendung mit einem einzigen konfigurierten Theme hat nichts, zu dem sie wechseln könnte, und erhält überhaupt keine Einträge. </p> <p> Das ist es, was ein einzelner <i>Befehl zum Festlegen des Themes</i> nicht leisten kann: Dieser Befehl benennt eine statische Theme-ID, sodass eine Ansicht, die ihn verwendet, jedes Theme, das sie kennt, einzeln auflisten muss und niemals erkennen kann, welches aktiv ist. </p>
com.top_logic.layout.view.command.UploadCommand = Befehl „Hochladen“
com.top_logic.layout.view.command.UploadCommand.Config.accept = Akzeptierte Dateitypen
com.top_logic.layout.view.command.UploadCommand.Config.accept.tooltip = Der Zulassungsfilter für die native Dateieingabe (z. B. „image/*,.pdf“). <p> Standardwert ist „*“ (keine Einschränkung). Nur clientseitiger Hinweis. </p>
com.top_logic.layout.view.command.UploadCommand.Config.actions = Aktionen
com.top_logic.layout.view.command.UploadCommand.Config.actions.tooltip = Die Abfolge von Aktionen, die einmal pro hochgeladener Datei ausgeführt werden soll (die Datei ist die Eingabe für diese Abfolge).
com.top_logic.layout.view.command.UploadCommand.Config.multiple = Mehrere Dateien
com.top_logic.layout.view.command.UploadCommand.Config.multiple.tooltip = Ob mehrere Dateien gleichzeitig ausgewählt werden können.
com.top_logic.layout.view.command.UploadCommand.tooltip = Ein <i>„View“-Befehl</i>, der als Symbolleisten-Schaltfläche dargestellt wird und beim Anklicken einen nativen Dateiauswähler öffnet und die ausgewählte(n) Datei(en) direkt hochlädt – ohne Zwischendialog. <p> Die konfigurierte Aktionskette (z. B. <confirm> + <with-transaction><execute-script>) wird <em>einmal pro hochgeladener Datei</em> nacheinander ausgeführt, wobei die hochgeladene Datei ( <i>binäre Daten</i>) als Eingabewert der Kette dient. Container-/Kontextwerte werden über ihre Kanalreferenzen „ <inputs> “ in die Aktionen eingefädelt, genau wie bei einem „ <generic-command> “. </p> <p> Die dateispezifische Orchestrierung findet im <i>Befehlsmodell des Upload-Views</i> statt; der Klick selbst löst keinen Serverbefehl aus. </p>
com.top_logic.layout.view.command.ViewCommand.Config.check-dirty = Schmutzig prüfen
com.top_logic.layout.view.command.ViewCommand.Config.check-dirty.tooltip = Umfang der Schmutzprüfung, die vor der Ausführung dieses Befehls durchgeführt werden soll.
com.top_logic.layout.view.command.ViewCommand.Config.clique = Clique
com.top_logic.layout.view.command.ViewCommand.Config.clique.tooltip = Der Cliquenname für die Gruppierung zusammengehöriger Befehle.
com.top_logic.layout.view.command.ViewCommand.Config.css-classes = Css-Klassen
com.top_logic.layout.view.command.ViewCommand.Config.css-classes.tooltip = Zusätzliche CSS-Klassen, die auf das UI-Element des Befehls anzuwenden sind.
com.top_logic.layout.view.command.ViewCommand.Config.display = Anzeige
com.top_logic.layout.view.command.ViewCommand.Config.display.tooltip = Wie die Schaltfläche dieses Befehls das Symbol und die Bezeichnung anzeigt, z. B. „nur Symbol“ für eine kompakte Symbolschaltfläche, bei der die Bezeichnung zum Tooltip wird. <p> Wenn keine Angabe erfolgt, gilt die Standardeinstellung des übergeordneten Befehlsbereichs; fehlt diese, zeigt die Schaltfläche das Symbol (sofern konfiguriert) zusammen mit der Bezeichnung an. </p>
com.top_logic.layout.view.command.ViewCommand.Config.executability = Ausführbarkeit
com.top_logic.layout.view.command.ViewCommand.Config.executability.tooltip = Regeln, die bestimmen, wann dieser Befehl ausführbar ist.
com.top_logic.layout.view.command.ViewCommand.Config.image = Bild
com.top_logic.layout.view.command.ViewCommand.Config.image.tooltip = Das für diesen Befehl angezeigte Symbol.
com.top_logic.layout.view.command.ViewCommand.Config.input = Eingabe
com.top_logic.layout.view.command.ViewCommand.Config.input.tooltip = Verweis auf einen Kanal, dessen Wert als Eingabe an den Befehl übergeben wird.
com.top_logic.layout.view.command.ViewCommand.Config.key = Tastaturgeste
com.top_logic.layout.view.command.ViewCommand.Config.key.tooltip = Die Tastaturgeste, die diesen Befehl auslöst, wird als Taste angegeben, der optional Modifikatortasten vorangestellt werden können, z. B. „Enter“, „Escape“, „Strg+S“ oder „Umschalt+Pfeil nach unten“. <p> Ist diese Option nicht gesetzt, verwenden Dialoge die üblichen Standardwerte: Der einzige oder primäre Befehl in der Befehlsleiste wird mit der Eingabetaste ausgelöst, und die Abbrechen-Aktion des Dialogs wird mit der Escape-Taste ausgelöst. </p>
com.top_logic.layout.view.command.ViewCommand.Config.label = Etikett
com.top_logic.layout.view.command.ViewCommand.Config.label.tooltip = Die für den Benutzer sichtbare Bezeichnung für diesen Befehl.
com.top_logic.layout.view.command.ViewCommand.Config.name = Name
com.top_logic.layout.view.command.ViewCommand.Config.name.tooltip = Der programmatische Name dieses Befehls. <p> Wird verwendet, um den Befehl in Skripten und Tests zu referenzieren. Wenn nicht festgelegt, kann der Befehl nur über die Benutzeroberfläche aufgerufen werden. </p>
com.top_logic.layout.view.command.ViewCommand.Config.observed-types = Beobachtete Typen
com.top_logic.layout.view.command.ViewCommand.Config.observed-types.tooltip = Typen, bei denen sich das Objekt ändert (Erstellen / Aktualisieren / Löschen), lösen eine Neubewertung der Ausführbarkeit aus – zusätzlich zu dem Eingabeobjekt, das stets beobachtet wird. <p> Konfigurieren Sie dies nur für eine Regel, die über das Eingabeobjekt hinausnavigiert, z. B. eine Regel, die anhand eines Attributs des Containers der Eingabe entscheidet: Eine Änderung dieses anderen Objekts ist für die Beobachtung der Eingabe selbst nicht sichtbar. „Leer“ (Standard) beobachtet nur das Eingabeobjekt. </p>
com.top_logic.layout.view.command.ViewCommand.Config.placement = Platzierung
com.top_logic.layout.view.command.ViewCommand.Config.placement.tooltip = Wo dieser Befehl in der Benutzeroberfläche dargestellt werden soll.
com.top_logic.layout.view.command.ViewCommand.Config.tooltip = QuickInfo
com.top_logic.layout.view.command.ViewCommand.Config.tooltip.tooltip = Der Tooltip, der beim Hover für die Schaltfläche dieses Befehls angezeigt wird.
com.top_logic.layout.view.command.ViewCommandSource.Config.label = Bezeichnung
com.top_logic.layout.view.command.ViewCommandSource.Config.label.tooltip = Die Überschrift eines Menüs wird über den Einträgen dieser Quelle angezeigt. <p> Ist diese Option nicht gesetzt, gilt die eigene Überschrift der Quelle – diejenige, die die Art der angebotenen Auswahl bezeichnet. </p>
com.top_logic.layout.view.command.VisibleIf = Sichtbar, wenn
com.top_logic.layout.view.command.VisibleIf.Config.expr = Ausdruck
com.top_logic.layout.view.command.VisibleIf.Config.expr.tooltip = TL-Script-Prädikatfunktion, die mit dem aktuellen Eingabewert des Befehls aufgerufen wird; der Befehl wird angezeigt, wenn die Funktion den Wert „true“ zurückgibt.
com.top_logic.layout.view.command.VisibleIf.tooltip = <i>Regel zur Sichtbarkeit anzeigen</i>, die einen Befehl nur dann anzeigt, wenn ein konfiguriertes TL-Script-Prädikat, das auf die Eingabe des Befehls angewendet wird, den Wert „wahr“ zurückgibt; andernfalls wird der Befehl ausgeblendet. <p> Eine wiederverwendbare, bedingungsgesteuerte Alternative zu den festen Regeln <i>„Bei Null-Eingabe verborgen</i> “ bzw. <i>„Nur anonym</i> “: Binden Sie die Eingabe des Befehls an den Kanal, den das Prädikat überprüft, sodass die Symbolleiste die Regel bei jeder Änderung dieses Kanals neu auswertet. Beispiel – nur anzeigen, solange ein boolescher „Running“-Kanal gesetzt ist: <visible-if expr="x -> $x == true"/>. </p>
com.top_logic.layout.view.command.WithTransactionAction = Mit Transaktionsaktion
com.top_logic.layout.view.command.WithTransactionAction.Config.actions = Aktionen
com.top_logic.layout.view.command.WithTransactionAction.Config.actions.tooltip = Innere Aktionen, die innerhalb der Transaktion ausgeführt werden sollen.
com.top_logic.layout.view.command.WithTransactionAction.tooltip = <i>Aktion anzeigen</i>, die innere Aktionen in eine KB-Transaktion einbindet. <p> Alle inneren Aktionen werden innerhalb derselben Transaktion ausgeführt. Wenn eine Aktion einen Fehler auslöst, wird die Transaktion zurückgesetzt. Das Ergebnis der letzten inneren Aktion wird zurückgegeben. </p> <p> Innere Aktionen müssen synchron abgeschlossen werden: Eine Aktion darf innerhalb einer Transaktion nicht angehalten werden (z. B. eine <i>Bestätigungsaktion</i>), da dies die Transaktion über eine asynchrone Wartezeit hinweg offen halten würde. Eine solche Konfiguration schlägt schnell mit einem eindeutigen Fehler fehl – platzieren Sie die Schutzanweisung stattdessen <em>vor</em> dem Befehl ` <with-transaction> `. </p> <p> Beispiel: Kopieren eines transienten Objekts in ein persistentes Objekt innerhalb einer Transaktion: </p><pre> &lt;with-transaction&gt; &lt;execute-script function="obj -&gt; $obj.copy(transient: false)"/&gt; &lt;/with-transaction&gt; </pre>
com.top_logic.layout.view.command.WriteChannelAction = Schreibkanal-Aktion
com.top_logic.layout.view.command.WriteChannelAction.Config.name = Name
com.top_logic.layout.view.command.WriteChannelAction.Config.name.tooltip = Name des Kanals, in den geschrieben werden soll.
com.top_logic.layout.view.command.WriteChannelAction.tooltip = <i>Ansichtsaktion</i>, die den Eingabewert in einen benannten Kanal schreibt. <p> Leitet die Eingabe als Ausgabe weiter, damit die Kette fortgesetzt werden kann. </p> <p> Ein Formular, das den Kanalwert anzeigt, verhindert das Schreiben, solange es ungespeicherte Änderungen enthält. Die Aktion fragt den Benutzer dann, wie es weitergehen soll, und setzt die Kette entsprechend der Antwort fort: Nach dem Speichern oder Verwerfen dieser Änderungen wird der Schreibvorgang erneut versucht; bei „Abbrechen“ behält der Kanal seinen Wert bei. In beiden Fällen läuft die Kette weiter, sodass die auf den Schreibvorgang folgenden Aktionen (z. B. das Schließen des Dialogs, dessen Befehl den Kanal beschrieben hat) weiterhin ausgeführt werden. </p>
com.top_logic.layout.view.designer.ConfigEditorElement = Element des Konfigurationseditors
com.top_logic.layout.view.designer.ConfigEditorElement.Config.input = Eingabe
com.top_logic.layout.view.designer.ConfigEditorElement.Config.input.tooltip = Verweis auf den Kanal, der den aktuell ausgewählten <i>Entwurfsbaumknoten</i> bereitstellt.
com.top_logic.layout.view.designer.ConfigEditorElement.tooltip = Ein <i>UI-Element</i>, das ein Konfigurations-Editor-Formular für den ausgewählten <i>Entwurfsbaumknoten</i> wiedergibt. <p> Liest einen <i>Entwurfsbaumknoten</i> aus einem Eingabekanal und gibt ein <i>Konfigurationseditor-Steuerelement</i> für dessen Eigenschaften wieder. Wenn sich die Auswahl ändert, wird der Editor neu aufgebaut, um den neu ausgewählten Knoten wiederzugeben. </p>
com.top_logic.layout.view.designer.DesignerTreeElement = Designer-Baumelement
com.top_logic.layout.view.designer.DesignerTreeElement.Config.input = Eingabe
com.top_logic.layout.view.designer.DesignerTreeElement.Config.input.tooltip = Verweis auf den Kanal, der den <i>Wurzelknoten des Entwurfsbaums</i> bereitstellt.
com.top_logic.layout.view.designer.DesignerTreeElement.Config.selection = Auswahl
com.top_logic.layout.view.designer.DesignerTreeElement.Config.selection.tooltip = Optionaler Verweis auf einen Kanal, der den ausgewählten <i>Entwurfsbaumknoten</i> empfängt.
com.top_logic.layout.view.designer.DesignerTreeElement.tooltip = Ein <i>UI-Element</i>, das ein <i>React Tree Control</i> aus einer <i>Design Tree Node</i> Hierarchie aufbaut. <p> Im Gegensatz zum <i>Tree-Element</i>, das TL-Script-Ausdrücke zur Berechnung der Kinder verwendet, liest dieses Element die Baumstruktur direkt aus dem <i>Design Tree Node</i> Model. Der Eingabekanal liefert den <i>Wurzelknoten des Designbaums</i>, und der Auswahlkanal empfängt den aktuell ausgewählten Knoten. </p>
com.top_logic.layout.view.designer.MoveElementCommand$Direction = Richtung
com.top_logic.layout.view.designer.MoveElementCommand$Direction.tooltip = Richtungskonstanten für die Bewegung eines Knotens.
com.top_logic.layout.view.designer.MoveElementCommand.Direction.DOWN = Daunen
com.top_logic.layout.view.designer.MoveElementCommand.Direction.DOWN.tooltip = Verschiebe den Knoten in seinem Container um eine Position weiter.
com.top_logic.layout.view.designer.MoveElementCommand.Direction.UP = Nach oben
com.top_logic.layout.view.designer.MoveElementCommand.Direction.UP.tooltip = Verschiebe den Knoten in seinem Container um eine Position nach vorne.
com.top_logic.layout.view.designer.OpenDesignerCommand = Befehl Designer öffnen
com.top_logic.layout.view.designer.OpenDesignerCommand.tooltip = Ein <i>View-Befehl</i>, der den View Designer in einem neuen Browserfenster öffnet. <p> Lädt die Designer-Ansicht aus /WEB-INF/views/designer.view.xml, baut die <i>Design-Baumknotenstruktur</i> aus der Standard-Stammansicht der Anwendung auf und öffnet sie in einem neuen Fenster über die <i>React Window Registry</i>. </p>
com.top_logic.layout.view.designer.RevertDesignCommand = Befehl "Entwurf rückgängig machen
com.top_logic.layout.view.designer.RevertDesignCommand.Config.design-tree = Entwurfsbaum
com.top_logic.layout.view.designer.RevertDesignCommand.Config.design-tree.tooltip = Verweis auf den Kanal, der den <i>Wurzelknoten der Entwurfsbaumstruktur</i> enthält. <p> Nach der Rückgängigmachung wird die neu erstellte Baumwurzel auf diesen Kanal gesetzt, was einen vollständigen Neuaufbau der Benutzeroberfläche des Entwurfsbaums auslöst. </p>
com.top_logic.layout.view.designer.RevertDesignCommand.Config.selection = Auswahl
com.top_logic.layout.view.designer.RevertDesignCommand.Config.selection.tooltip = Optionaler Verweis auf einen Auswahlkanal, der beim Zurücksetzen gelöscht wird. <p> Falls konfiguriert, wird dieser Kanal auf Null gesetzt, so dass jeder zuvor ausgewählte Knoten (der im neuen Baum nicht mehr existiert) abgewählt wird. </p>
com.top_logic.layout.view.designer.RevertDesignCommand.tooltip = Ein <i>View-Befehl</i>, der alle speicherinternen Änderungen am Entwurfsbaum verwirft und ihn von der Festplatte neu lädt. <p> Liest den Standard-View-Pfad der Anwendung aus der <i>View-Konfiguration</i>, baut den <i>Knotenbaum des Designbaums</i> mit dem <i>Erbauer des Designbaums</i> neu auf und setzt ihn auf den konfigurierten Designbaumkanal. Dies veranlasst das <i>Design Tree-Element</i>, seinen Baum von der neuen Wurzel aus neu zu erstellen. Optional kann der Auswahlkanal gelöscht werden. </p>
com.top_logic.layout.view.designer.SaveDesignCommand = Befehl Muster speichern
com.top_logic.layout.view.designer.SaveDesignCommand.Config.design-tree = Entwurfsbaum
com.top_logic.layout.view.designer.SaveDesignCommand.Config.design-tree.tooltip = Verweis auf den Kanal, der den <i>Wurzelknoten des Entwurfsbaums</i> enthält.
com.top_logic.layout.view.designer.SaveDesignCommand.tooltip = Ein <i>View-Befehl</i>, der geänderte <i>Konfigurationsbäume</i> zurück in .view.xml-Dateien serialisiert. <p> Liest den <i>Root-Entwurfsbaumknoten</i> aus dem konfigurierten Kanal, durchläuft den Baum, um alle eindeutigen Quelldateien aufzulisten, und schreibt jede geänderte <i>Konfiguration</i> zurück auf die Festplatte. Der Cache des <i>View-Loaders</i> wird beim nächsten Zugriff automatisch über Zeitstempel validiert. </p>
com.top_logic.layout.view.designer.SelectViewCommand = Befehl „Ansicht“ auswählen
com.top_logic.layout.view.designer.SelectViewCommand.Config.design-tree = Entwurfsbaum
com.top_logic.layout.view.designer.SelectViewCommand.Config.design-tree.tooltip = Verweis auf den Kanal, der den <i>Stammknoten des Konstruktionsbaums</i> enthält.
com.top_logic.layout.view.designer.SelectViewCommand.Config.selection = Auswahl
com.top_logic.layout.view.designer.SelectViewCommand.Config.selection.tooltip = Verweis auf den Kanal, der den ausgewählten <i>Knoten des Entwurfsbaums</i> empfängt.
com.top_logic.layout.view.designer.SelectViewCommand.tooltip = Befehl in der Symbolleiste, der den Modus „Ansicht auswählen“ im Hauptfenster der Anwendung startet. Der Benutzer klickt dort auf eine Ansicht; daraufhin wird der entsprechende Knoten im Designbaum im Designer ausgewählt.
com.top_logic.layout.view.element.AbstractMenuElement = Abstraktes Menü-Element
com.top_logic.layout.view.element.AbstractMenuElement$Config$CommandGroup = Eintragsgruppe
com.top_logic.layout.view.element.AbstractMenuElement$Config$CommandGroup.tooltip = Eine Gruppe von Menüeinträgen, die von den umgebenden Gruppen abgesetzt ist.
com.top_logic.layout.view.element.AbstractMenuElement.Config.CommandGroup.commands = Befehle
com.top_logic.layout.view.element.AbstractMenuElement.Config.CommandGroup.commands.tooltip = Die Befehle, die als Einträge dieser Gruppe angeboten werden.
com.top_logic.layout.view.element.AbstractMenuElement.Config.CommandGroup.label = Bezeichnung
com.top_logic.layout.view.element.AbstractMenuElement.Config.CommandGroup.label.tooltip = Die Überschrift, die über den Einträgen der Gruppe angezeigt wird; wird nicht angezeigt, wenn sie nicht festgelegt ist.
com.top_logic.layout.view.element.AbstractMenuElement.Config.command-sources = Befehlsquellen
com.top_logic.layout.view.element.AbstractMenuElement.Config.command-sources.tooltip = Quellen für weitere Einträge, deren Befehle nicht in der Ansicht geschrieben, sondern zur Laufzeit abgeleitet werden. <p> Ihre Einträge folgen auf die unter <i>„Befehle“</i> deklarierten Einträge, wobei die Einträge jeder Quelle in der Reihenfolge aufgeführt werden, in der sie bereitgestellt werden. </p>
com.top_logic.layout.view.element.AbstractMenuElement.Config.groups = Gruppen
com.top_logic.layout.view.element.AbstractMenuElement.Config.groups.tooltip = Weitere Gruppen von Einträgen, die jeweils durch ein Trennzeichen vom vorhergehenden abgesetzt sind und – sofern vorhanden – mit ihrer Bezeichnung eingeleitet werden. <p> Die unter <i>„Befehle“</i> deklarierten Einträge bilden die erste Gruppe; darauf folgen diese, und danach die Quellen. Eine Gruppe, deren Einträge derzeit nicht verfügbar sind, wird zusammen mit ihrem Trennzeichen und ihrer Überschrift weggelassen, sodass sich ein Menü niemals an einer Trennlinie öffnet, unter der sich nichts befindet. </p>
com.top_logic.layout.view.element.AbstractMenuElement.Config.input = Eingabe
com.top_logic.layout.view.element.AbstractMenuElement.Config.input.tooltip = Optionaler Verweis auf einen vorhandenen Kanal, der den Zielwert des Menüs überträgt. <p> Ist dieser Parameter nicht gesetzt, wird ein neuer Kanal <code>"contextTarget"</code> im aktuellen Kontext registriert und als Zielkanal für den erstellten <i>Kontextmenü-Beitrag</i> verwendet. </p>
com.top_logic.layout.view.element.AbstractMenuElement.tooltip = Grundlage für <i>UI-Elemente</i>, die ihre Befehle nicht als Schaltflächen, sondern als Einträge eines Popup-Menüs anbieten. <p> Die untergeordneten Elemente des Elements bilden dessen Menübereich: Das von ihnen gerenderte DOM ist das, worauf der Benutzer einwirkt, um das Menü zu öffnen. Die Befehle werden zu einem einzigen <i>Kontextmenü-Beitrag</i>, der an einen Zielkanal gebunden ist, und der <i>Kontextmenü-Öffner</i> des umschließenden Frames rendert und versendet sie. </p>
com.top_logic.layout.view.element.AdaptiveDetailElement = Adaptives Detailelement
com.top_logic.layout.view.element.AdaptiveDetailElement.Config.detail = Details
com.top_logic.layout.view.element.AdaptiveDetailElement.Config.detail-display = Detaildarstellung
com.top_logic.layout.view.element.AdaptiveDetailElement.Config.detail-display.tooltip = Wie das Detail bei einem breiten Ansichtsfenster neben dem Selektor dargestellt wird: Entweder teilt es die Breite mit ihm in einer verschiebbaren Teilung, oder es überlagert ihn in einer Schublade, die den Selektor in voller Breite bestehen lässt. <p> Bei einem schmalen Ansichtsfenster ersetzt das Detail in beiden Fällen den Selektor. </p>
com.top_logic.layout.view.element.AdaptiveDetailElement.Config.detail-size = Detailgröße
com.top_logic.layout.view.element.AdaptiveDetailElement.Config.detail-size.tooltip = Die Breite in Pixeln der Schublade, in der das Detail angezeigt wird. <p> Die Schublade wird niemals breiter als das Element, das sie überlagert. Ein Wert, der die verfügbare Breite überschreitet, führt daher dazu, dass die Schublade den Selektor vollständig bedeckt. Ohne Schubladendarstellung hat der Wert keine Auswirkung. </p>
com.top_logic.layout.view.element.AdaptiveDetailElement.Config.detail.tooltip = Der Detailinhalt, der an den Auswahlkanal gebunden ist.
com.top_logic.layout.view.element.AdaptiveDetailElement.Config.home-label = Startseite-Bezeichnung
com.top_logic.layout.view.element.AdaptiveDetailElement.Config.home-label.tooltip = Bezeichnung des Startelements der Breadcrumb-Navigation (dasjenige, das zum leeren Selektor zurückführt). <p> Nur im äußersten „ <adaptive-detail> “ von Bedeutung: Im Kompaktmodus wird ein einziger Breadcrumb dargestellt, der alle verschachtelten Ebenen umfasst (Startseite &gt; selected-master &gt; selected-detail ...); durch Antippen eines Breadcrumb-Elements werden die Auswahlen ab dieser Ebene nach unten gelöscht. Verschachtelte Elemente tragen die Bezeichnung ihres ausgewählten Objekts bei und stellen keinen eigenen Breadcrumb dar. </p>
com.top_logic.layout.view.element.AdaptiveDetailElement.Config.reset-on = Zurücksetzen auf
com.top_logic.layout.view.element.AdaptiveDetailElement.Config.reset-on.tooltip = Kanäle, von denen die Auswahl dieses Elements abhängt; sobald sich einer davon ändert, wird die Auswahl auf null zurückgesetzt. <p> Verwenden Sie dies, wenn die auswählbaren Zeilen aus einer vorgelagerten Auswahl stammen (typischerweise verschachtelte, kaskadierende Master-Detail-Strukturen): Beispielsweise ist eine Meilensteinauswahl nur innerhalb eines Projektumfangs sinnvoll, sodass „reset-on=“selectedScope““ den Meilenstein löscht, wenn sich der Umfang ändert – unabhängig davon, ob die Meilensteinauswahl derzeit angezeigt wird (im Kompaktmodus wird er nach dem Aufklappen entfernt, sodass ein im Kanal verbleibender Wert andernfalls im neuen Umfang wieder erscheinen würde). </p>
com.top_logic.layout.view.element.AdaptiveDetailElement.Config.selection = Auswahl
com.top_logic.layout.view.element.AdaptiveDetailElement.Config.selection.tooltip = Der Kanal, der das im Selektor ausgewählte und in der Detailansicht angezeigte Objekt enthält.
com.top_logic.layout.view.element.AdaptiveDetailElement.Config.selector = Auswahlschalter
com.top_logic.layout.view.element.AdaptiveDetailElement.Config.selector.tooltip = Der Master-Inhalt (z. B. <table> oder <tree>), der den Auswahlkanal schreibt.
com.top_logic.layout.view.element.AdaptiveDetailElement.tooltip = Responsives Master-Detail-Element, das dieselbe Konfiguration je nach Anzeige-Klasse des Clients unterschiedlich darstellt. <p> Das Element enthält genau einmal ein „ <selector> “ (den Master, z. B. eine Tabelle oder eine Baumstruktur, die den Auswahlkanal schreibt) und ein „ <detail> “ (das an denselben Kanal gebunden ist) und stellt die beiden auf eine von drei Arten dar: </p> <ul> <li>In einem breiten (REGULAR) Ansichtsfenster mit <i>geteilter</i> Anzeige stehen beide nebeneinander in einer verschiebbaren Teilung.</li> <li>In einem breiten Ansichtsfenster mit einer <i>Schubladendarstellung</i> behält der Selektor die volle Breite, und das Detail überlagert ihn vom rechten Rand aus in einem Panel, dessen Breite <code>"detail-size"</code> bestimmt; es erscheint mit der Auswahl und wird durch Aufheben der Auswahl ausgeblendet.</li> <li>In einem schmalen (COMPACT) Ansichtsbereich wird der Selektor unabhängig von der konfigurierten Anzeige vollflächig angezeigt und durch die Detailansicht ersetzt, sobald etwas ausgewählt wird (mit einer „Zurück“-Funktion zum Aufheben der Auswahl).</li> </ul> <p> Da ein „ <detail> “ selbst einen weiteren „ <adaptive-detail> “ enthalten kann, setzen sich mehrstufige Auswahlpfade zusammen: kaskadierende Spalten auf breiten Bildschirmen, schrittweises Einzoomen auf schmalen – alles aus einer einzigen Konfiguration heraus. </p>
com.top_logic.layout.view.element.AnchorElement = Ankerelement
com.top_logic.layout.view.element.AnchorElement.Config.content = Inhalt
com.top_logic.layout.view.element.AnchorElement.Config.content.tooltip = Der umschlossene Inhalt.
com.top_logic.layout.view.element.AnchorElement.Config.input = Eingabe
com.top_logic.layout.view.element.AnchorElement.Config.input.tooltip = Kanal, der das Objekt bereitstellt, auf das dieser Anker verweist; der Anker-Schlüssel ist die Anker-ID des Objekts. Schließt <i>„Name“</i> aus.
com.top_logic.layout.view.element.AnchorElement.Config.name = Name
com.top_logic.layout.view.element.AnchorElement.Config.name.tooltip = Literaler Ankerschlüssel für einen festen Bereich ohne Modellobjekt. Schließt <i>„Input“</i> aus.
com.top_logic.layout.view.element.AnchorElement.tooltip = Deklaratives <i>UI-Element</i>, das seinen Inhalt in einen Scroll-Anker einbindet. <p> Der Anker wird entweder durch ein Objekt aus dem Eingabekanal (seine Anker-ID) oder durch einen literalen Namen für einen festen Bereich ohne Modellobjekt definiert. Eine &lt;scroll-link&gt;- oder eine <scroll-to-anchor> -Aktion, die auf denselben Schlüssel abzielt, scrollt den Browser an diese Stelle – z. B. kann man jede Kommentarkarte in <anchor input="comment"> umschließen, um zu einem zitierten Kommentar zu springen, oder den neuen Kommentar-Editor in <anchor name="composer">, um ihn bei einer Antwort in den sichtbaren Bereich zu bringen. </p>
com.top_logic.layout.view.element.AppBarElement = Element der App-Leiste
com.top_logic.layout.view.element.AppBarElement.Config.children = Kinder
com.top_logic.layout.view.element.AppBarElement.Config.children.tooltip = Beliebige Inline-Kinder, die zwischen Titel und Aktionsbereich gerendert werden. <p> Typischerweise ein einzelnes <slot>, über das tiefer liegende Ansichten Inhalt in die App-Leiste projizieren können (z.B. eine Brotkrümelnavigation oder eine kontextspezifische Steuergruppe); es kann jedoch jedes beliebige UIElement hier platziert werden. </p>
com.top_logic.layout.view.element.AppBarElement.Config.commands = Befehle
com.top_logic.layout.view.element.AppBarElement.Config.commands.tooltip = Befehle, die im Aktionsbereich der App-Leiste dargestellt werden. <p> Befehle mit TOOLBAR-Platzierung werden, nach Cliquen gruppiert, zu den Schaltflächen der Aktionsleiste. Solange die App-Leiste breit genug ist, zeigt die Aktionsleiste Symbol und Bezeichnung nebeneinander; reicht die Breite nicht, lässt sie die Bezeichnungen weg und klappt die Befehle, die dann immer noch nicht passen, in ein Überlaufmenü. </p>
com.top_logic.layout.view.element.AppBarElement.Config.leading = Führender Bereich
com.top_logic.layout.view.element.AppBarElement.Config.leading.tooltip = Elemente, die im führenden Bereich vor dem Titel gerendert werden (z.B. ein mobiler Drawer-Toggle-Button, der über <slot name="appbar-leading"/> eingebracht wird).
com.top_logic.layout.view.element.AppBarElement.Config.title = Titel
com.top_logic.layout.view.element.AppBarElement.Config.title.tooltip = Der Titel der Leiste.
com.top_logic.layout.view.element.AppBarElement.Config.trailing = Abschließender Bereich
com.top_logic.layout.view.element.AppBarElement.Config.trailing.tooltip = Elemente, die die Leiste rechts neben dem Aktionsbereich abschließen (z. B. der Kontobereich). <p> Dies ist das rechte Ende der Leiste, hinter den Schaltflächen der in der Symbolleiste angeordneten Befehle. Mehrere Elemente werden nebeneinander in der angegebenen Reihenfolge dargestellt. </p>
com.top_logic.layout.view.element.AppBarElement.Config.variant = Variante
com.top_logic.layout.view.element.AppBarElement.Config.variant.tooltip = Die visuelle Variante.
com.top_logic.layout.view.element.AppBarElement.tooltip = UIElement, das die <i>React App Bar-Steuerung</i> umhüllt. <p> Rendert eine Anwendungsleiste auf oberster Ebene mit einem Titel und einer optionalen Variante/Farbkonfiguration. Befehle, die im Abschnitt <commands> mit TOOLBAR-Platzierung konfiguriert sind, bilden die Aktionsleiste der App-Leiste, die die nicht passenden Befehle an ihrem hinteren Ende in ein Überlaufmenü klappt. </p>
com.top_logic.layout.view.element.AppShellElement = App-Schalenelement
com.top_logic.layout.view.element.AppShellElement.Config.content = Inhalt
com.top_logic.layout.view.element.AppShellElement.Config.content.tooltip = Das wichtigste Inhaltselement.
com.top_logic.layout.view.element.AppShellElement.Config.footer = Fußzeile
com.top_logic.layout.view.element.AppShellElement.Config.footer.tooltip = Optionales Fußzeilenelement (z. B. eine untere Leiste).
com.top_logic.layout.view.element.AppShellElement.Config.header = Kopfzeile
com.top_logic.layout.view.element.AppShellElement.Config.header.tooltip = Optionales Kopfelement (z. B. eine Anwendungsleiste).
com.top_logic.layout.view.element.AppShellElement.Config.notices = Hinweise
com.top_logic.layout.view.element.AppShellElement.Config.notices.tooltip = Optionale systemweite Hinweise, die zwischen Kopfzeile und Inhalt angezeigt werden. <p> Enthält Elemente, die den Status der gesamten Anwendung und nicht einer einzelnen Ansicht anzeigen, z. B. „ <maintenance-notice/> “. Jedes dieser Elemente entscheidet selbst, ob es etwas mitzuteilen hat; der Bereich nimmt keinen Platz ein, solange alle Elemente still sind. </p>
com.top_logic.layout.view.element.AppShellElement.tooltip = UIElement, das <i>das React-App-Shell-Steuerelement</i> umschließt. <p> Bietet vier Slots: einen optionalen Header, einen optionalen Hinweisbereich, einen obligatorischen Inhaltsbereich und eine optionale Fußzeile. Die Slot-Eigenschaften verwenden Listentypen, damit die Auflösung von @TagName funktioniert (z. B. „ <stack> “ innerhalb von „ <content> “). Wenn mehrere Elemente in einem Slot konfiguriert sind, werden sie in ein <i>React-Stack-Steuerelement</i> eingeschlossen. </p>
com.top_logic.layout.view.element.AvatarElement = Avatar
com.top_logic.layout.view.element.AvatarElement.Config.image = Bild
com.top_logic.layout.view.element.AvatarElement.Config.image.tooltip = Kanal, dessen Wert als Bild anstelle der Initialen angezeigt wird. <p> Der Wert ist entweder Bilddaten (Inhaltstyp „image/...“) oder ein Text, der die Adresse angibt, von der das Bild geladen wird. Jeder andere Wert – eine Person ohne Foto, ein nicht zugehöriges Objekt – lässt die Initialen stehen. Das Bild wird dem Kanal nachgeführt, sodass ein an anderer Stelle ersetztes Foto angezeigt wird, ohne dass der Avatar neu erstellt werden muss. </p>
com.top_logic.layout.view.element.AvatarElement.Config.input = Eingabe
com.top_logic.layout.view.element.AvatarElement.Config.input.tooltip = Kanal, dessen Wert angezeigt wird; der Avatar leitet die Initialen und die Kategoriefarbe aus der Bezeichnung des Werts ab.
com.top_logic.layout.view.element.AvatarElement.Config.size = Größe
com.top_logic.layout.view.element.AvatarElement.Config.size.tooltip = Durchmesser des Kreises: sm, md (die Voreinstellung), lg oder xl.
com.top_logic.layout.view.element.AvatarElement.tooltip = Deklaratives <i>UI-Element</i>, das den Wert eines Kanals (z. B. eine Person) als kreisförmigen Avatar anzeigt. <p> Der Kreis zeigt das Bild dessen, den er darstellt. Gibt es keines, wird er mit den Initialen der Bezeichnung des Wertes gefüllt, auf einem Hintergrund, dessen Farbe sich aus dieser Bezeichnung ableitet. </p>
com.top_logic.layout.view.element.BottomBarElement = Unteres Balkenelement
com.top_logic.layout.view.element.BottomBarElement$ItemConfig = Konfiguration der Artikel
com.top_logic.layout.view.element.BottomBarElement$ItemConfig.tooltip = Konfiguration für ein einzelnes Element der unteren Leiste.
com.top_logic.layout.view.element.BottomBarElement.Config.active-item = Aktiver Artikel
com.top_logic.layout.view.element.BottomBarElement.Config.active-item.tooltip = Die ID des ursprünglich aktiven Elements.
com.top_logic.layout.view.element.BottomBarElement.Config.items = Artikel
com.top_logic.layout.view.element.BottomBarElement.Config.items.tooltip = Die Navigationspunkte.
com.top_logic.layout.view.element.BottomBarElement.ItemConfig.icon = Icon
com.top_logic.layout.view.element.BottomBarElement.ItemConfig.icon.tooltip = Die CSS-Symbolklasse (z. B. "bi bi-speedometer2").
com.top_logic.layout.view.element.BottomBarElement.ItemConfig.id = ID
com.top_logic.layout.view.element.BottomBarElement.ItemConfig.id.tooltip = Der Artikelbezeichner.
com.top_logic.layout.view.element.BottomBarElement.ItemConfig.label = Etikett
com.top_logic.layout.view.element.BottomBarElement.ItemConfig.label.tooltip = Die Anzeigebezeichnung.
com.top_logic.layout.view.element.BottomBarElement.tooltip = UIElement, das das <i>Steuerelement für die untere Leiste</i> umschließt. <p> Rendert eine untere Navigationsleiste mit Icon-Elementen. Da es sich um ein deklaratives Element ohne serverseitige Befehlsverarbeitung handelt, ist die Elementauswahl derzeit nur visuell. </p>
com.top_logic.layout.view.element.ButtonElement = Knopf-Element
com.top_logic.layout.view.element.ButtonElement.Config.action = Aktion
com.top_logic.layout.view.element.ButtonElement.Config.action.tooltip = Der Befehl, den diese Schaltfläche ausführt. <p> Konfiguriert als <action class="..." .../> innerhalb des Elements <button>. </p>
com.top_logic.layout.view.element.ButtonElement.Config.appearance = Aussehen
com.top_logic.layout.view.element.ButtonElement.Config.appearance.tooltip = Darstellung der Schaltfläche (z. B. <i>Link</i>, der als Inline-Textlink dargestellt werden soll).
com.top_logic.layout.view.element.ButtonElement.Config.size = Größe
com.top_logic.layout.view.element.ButtonElement.Config.size.tooltip = Größe der Knöpfe.
com.top_logic.layout.view.element.ButtonElement.tooltip = Ein <i>UI-Element</i>, das eine Schaltfläche darstellt, die einen <i>View-Befehl</i> ausführt. <p> Der Befehl wird inline innerhalb des Elements „ <button> “ konfiguriert. Das <i>View-Befehlsmodell</i>, das eine Brücke zur Benutzeroberfläche schlägt – wobei der Eingabekanal des Befehls aufgelöst und seine Ausführungsregeln erstellt werden –, stammt aus dem Konstruktionspfad, den jedes Element, das Befehle hostet, gemeinsam nutzt. </p>
com.top_logic.layout.view.element.CalendarElement = Kalenderelement
com.top_logic.layout.view.element.CalendarElement$EventConfig = Ereigniskonfiguration
com.top_logic.layout.view.element.CalendarElement$EventConfig.tooltip = Die Ausdrücke pro Feld, die aus einem Geschäftsobjekt ein Kalenderereignis ableiten. Jeder davon ist eine Funktion mit einem einzigen Argument, die das Objekt als Argument entgegennimmt.
com.top_logic.layout.view.element.CalendarElement.Config.day-end-hour = Stunde zum Tagesende
com.top_logic.layout.view.element.CalendarElement.Config.day-end-hour.tooltip = Die Stunde nach der letzten im Zeitraster hervorgehobenen Arbeitsstunde.
com.top_logic.layout.view.element.CalendarElement.Config.day-start-hour = Tagesbeginn
com.top_logic.layout.view.element.CalendarElement.Config.day-start-hour.tooltip = Die erste Arbeitsstunde, die im Zeitraster hervorgehoben ist.
com.top_logic.layout.view.element.CalendarElement.Config.editable = Bearbeitbar
com.top_logic.layout.view.element.CalendarElement.Config.editable.tooltip = Ob der Benutzer Ereignisse per Drag &amp; Drop bearbeiten darf.
com.top_logic.layout.view.element.CalendarElement.Config.event = Ereignis
com.top_logic.layout.view.element.CalendarElement.Config.event.tooltip = Die Ausdrücke pro Feld, die aus einem Geschäftsobjekt ein Kalenderereignis ableiten.
com.top_logic.layout.view.element.CalendarElement.Config.granularity = Granularität
com.top_logic.layout.view.element.CalendarElement.Config.granularity.tooltip = Die anfänglich angezeigte Granularität.
com.top_logic.layout.view.element.CalendarElement.Config.objects = Objekte
com.top_logic.layout.view.element.CalendarElement.Config.objects.tooltip = TL-Script-Funktion zur Berechnung der als Ereignisse dargestellten Geschäftsobjekte (eine <i>Auflistung</i>). <p> Die Werte der deklarierten Eingaben stehen an erster Stelle, in der Reihenfolge ihrer Deklaration. </p>
com.top_logic.layout.view.element.CalendarElement.Config.observed-types = Beobachtete Typen
com.top_logic.layout.view.element.CalendarElement.Config.observed-types.tooltip = Typen, bei denen sich das Objekt ändert (Erstellen / Aktualisieren / Löschen), lösen eine Neubewertung der Objekte aus, sodass der Kalender automatisch aktualisiert wird.
com.top_logic.layout.view.element.CalendarElement.Config.on-create = Beim Anlegen
com.top_logic.layout.view.element.CalendarElement.Config.on-create.tooltip = Die Write-Back-Funktion <code>start, end, allDay, title -&gt; object</code> wird angewendet, wenn der Benutzer einen leeren Terminfeld auswählt und den in den Kalender eingegebenen Titel bestätigt. Ohne diese Funktion ist die Erstellung deaktiviert.
com.top_logic.layout.view.element.CalendarElement.Config.on-move = Beim Verschieben
com.top_logic.layout.view.element.CalendarElement.Config.on-move.tooltip = Die Rückschreibfunktion <code>object, newStart, newEnd -&gt; …</code> wird angewendet, wenn der Benutzer ein Ereignis per Drag &amp; Drop verschiebt. Ohne diese Funktion ist das Verschieben deaktiviert.
com.top_logic.layout.view.element.CalendarElement.Config.on-resize = Bei Größenänderung
com.top_logic.layout.view.element.CalendarElement.Config.on-resize.tooltip = Die Rückschreibfunktion <code>object, newEnd -&gt; …</code> wird angewendet, wenn der Benutzer die Größe eines Ereignisses ändert. Ohne diese Funktion ist die Größenänderung deaktiviert.
com.top_logic.layout.view.element.CalendarElement.Config.range-end = Ende des Bereichs
com.top_logic.layout.view.element.CalendarElement.Config.range-end.tooltip = Optionaler <i>Ansichtskanal</i>, in den die Steuerung das exklusive Ende des angezeigten Intervalls schreibt. Nur in Verbindung mit <i>„Bereichsanfang“</i> wirksam.
com.top_logic.layout.view.element.CalendarElement.Config.range-start = Bereichsanfang
com.top_logic.layout.view.element.CalendarElement.Config.range-start.tooltip = Optionaler <i>Ansichtskanal</i>, in den die Steuerung den Startpunkt des angezeigten Intervalls (einschließlich) schreibt, sodass ein Anbieter nur die Ereignisse des sichtbaren Fensters laden kann. Wirkt nur in Verbindung mit <i>„Bereichsende</i>“.
com.top_logic.layout.view.element.CalendarElement.Config.selection = Auswahl
com.top_logic.layout.view.element.CalendarElement.Config.selection.tooltip = Optionaler <i>Ansichtskanal</i>, in den das Geschäftsobjekt des ausgewählten Ereignisses geschrieben werden soll.
com.top_logic.layout.view.element.CalendarElement.EventConfig.all-day = Ganztägig
com.top_logic.layout.view.element.CalendarElement.EventConfig.all-day.tooltip = Funktion, die ermittelt, ob sich ein Ereignis über ganze Tage erstreckt. Ohne diese Funktion werden die Ereignisse zeitlich festgelegt.
com.top_logic.layout.view.element.CalendarElement.EventConfig.category = Kategorie
com.top_logic.layout.view.element.CalendarElement.EventConfig.category.tooltip = Funktion zur Berechnung des Kategorieschlüssels des Ereignisses, der dessen Farbe bestimmt.
com.top_logic.layout.view.element.CalendarElement.EventConfig.color = Farbe
com.top_logic.layout.view.element.CalendarElement.EventConfig.color.tooltip = Funktion zur Berechnung der CSS-Farbe des Ereignisses, die Vorrang vor der durch den Kategorieschlüssel ausgewählten Farbe hat. Ein Wert vom Modelltyp <code>tl.util:Color</code> wird direkt akzeptiert.
com.top_logic.layout.view.element.CalendarElement.EventConfig.end = Ende
com.top_logic.layout.view.element.CalendarElement.EventConfig.end.tooltip = Funktion zur Berechnung der Endzeit des Ereignisses (ein Datum). Ohne diese Angabe dauern Ereignisse eine Stunde.
com.top_logic.layout.view.element.CalendarElement.EventConfig.movable = Beweglich
com.top_logic.layout.view.element.CalendarElement.EventConfig.movable.tooltip = Funktion, die prüft, ob das Ereignis verschoben werden darf. Ohne diese Funktion sind alle Ereignisse verschiebbar.
com.top_logic.layout.view.element.CalendarElement.EventConfig.resizable = Größenveränderbar
com.top_logic.layout.view.element.CalendarElement.EventConfig.resizable.tooltip = Funktion, die prüft, ob die Größe des Ereignisses geändert werden kann. Ohne diese Funktion sind Ereignisse in ihrer Größe veränderbar.
com.top_logic.layout.view.element.CalendarElement.EventConfig.start = Start
com.top_logic.layout.view.element.CalendarElement.EventConfig.start.tooltip = Funktion zur Berechnung des Startzeitpunkts des Ereignisses (ein Datum), erforderlich.
com.top_logic.layout.view.element.CalendarElement.EventConfig.title = Titel
com.top_logic.layout.view.element.CalendarElement.EventConfig.title.tooltip = Funktion zur Berechnung des Titels des Ereignisses.
com.top_logic.layout.view.element.CalendarElement.EventConfig.tooltip = Tooltip
com.top_logic.layout.view.element.CalendarElement.EventConfig.tooltip.tooltip = Funktion zur Berechnung des Hover-Tooltips des Ereignisses.
com.top_logic.layout.view.element.CalendarElement.tooltip = Deklaratives <i>UI-Element</i>, das einen modelldefinierten Kalender (das Tag „ <calendar> “) über ein <i>Kalender-View-Steuerelement</i> darstellt. <p> Die angezeigten Geschäftsobjekte stammen aus einem TL-Script-Ausdruck über die konfigurierten <i>Eingabeansichtskanäle</i>; die Ereignisfelder jedes Objekts (Start, Ende, Titel, …) werden durch die feldspezifischen Ausdrücke des Unterelements „ <event> “ abgeleitet. Bei Bearbeitungen per Drag-and-Drop werden die konfigurierten Write-Back-Ausdrücke für „on-move“, „on-resize“ und „on-create“ innerhalb einer Transaktion ausgeführt. Das Geschäftsobjekt des ausgewählten Ereignisses wird in den Auswahlkanal geschrieben. </p>
com.top_logic.layout.view.element.CardElement = Element der Karte
com.top_logic.layout.view.element.CardElement.Config.header-content = Inhalt der Kopfzeile
com.top_logic.layout.view.element.CardElement.Config.header-content.tooltip = Elemente, die am rechten Rand der Kartenüberschrift nach dem Titel angezeigt werden – ein Symbol, das die Karte als Einstiegspunkt kennzeichnet, ein Abzeichen, eine Schaltfläche.
com.top_logic.layout.view.element.CardElement.Config.padding = Polsterung
com.top_logic.layout.view.element.CardElement.Config.padding.tooltip = Der Inhalt polstert auf.
com.top_logic.layout.view.element.CardElement.Config.title = Titel
com.top_logic.layout.view.element.CardElement.Config.title.tooltip = Der Kartentitel oder null, wenn keine Überschrift vorhanden ist.
com.top_logic.layout.view.element.CardElement.Config.variant = Variante
com.top_logic.layout.view.element.CardElement.Config.variant.tooltip = Die visuelle Variante.
com.top_logic.layout.view.element.CardElement.tooltip = UIElement, das die <i>React Card-Steuerung</i> umhüllt. <p> Rendert einen leichten Inhaltscontainer mit optionalem Titel und visueller Variante. </p>
com.top_logic.layout.view.element.ColumnElement = Spalte
com.top_logic.layout.view.element.ColumnElement.Config.weight = Gewicht
com.top_logic.layout.view.element.ColumnElement.Config.weight.tooltip = Der Anteil der Breite, den diese Spalte im Verhältnis zu den Gewichten der übrigen Spalten einnimmt. <p> Eine Spalte mit Gewicht 2 neben einer Spalte mit Gewicht 1 ist doppelt so breit wie diese. Unterhalb der Umbruchbreite, wo jede Spalte die volle Breite einnimmt, hat das Gewicht keine Wirkung. </p>
com.top_logic.layout.view.element.ColumnElement.tooltip = Eine Spalte eines <i>Spalten-Layouts</i>. <p> Der Inhalt einer Spalte steht in der geschriebenen Reihenfolge untereinander, jedes Element über die volle Breite der Spalte. Eine Spalte ist so hoch wie ihr Inhalt; sie scrollt nicht für sich und wird auch nicht auf die Höhe einer höheren Nachbarspalte gedehnt, sodass eine lange Hauptspalte neben einer kurzen Seitenspalte einfach weiter nach unten reicht. </p> <p> Das Gewicht gibt an, wie viel der Breite diese Spalte einnimmt, solange die Spalten nebeneinander stehen: Zwei Spalten mit Gewicht 2 und Gewicht 1 teilen sich die Breite zwei Drittel zu einem Drittel, zwei Spalten mit gleichem Gewicht teilen sie gleichmäßig. Unterhalb der Umbruchbreite des umgebenden Spalten-Layouts wirkt das Gewicht nicht, weil dann jede Spalte die volle Breite einnimmt. </p>
com.top_logic.layout.view.element.ColumnsElement = Spalten-Layout
com.top_logic.layout.view.element.ColumnsElement.Config.breakpoint = Umbruchbreite
com.top_logic.layout.view.element.ColumnsElement.Config.breakpoint.tooltip = Die Breite, unterhalb derer die Spalten untereinander stehen, als CSS-Länge wie „48rem“. <p> Verglichen wird mit der Breite, die diesem Element zugestanden wird, nicht mit der Breite des Browserfensters. Dasselbe Layout bricht deshalb auch in einem schmalen Bereich eines breiten Fensters um. </p>
com.top_logic.layout.view.element.ColumnsElement.Config.columns = Spalten
com.top_logic.layout.view.element.ColumnsElement.Config.columns.tooltip = Die Spalten, von links nach rechts, und unterhalb der Umbruchbreite in dieser Reihenfolge untereinander. <p> Mindestens eine Spalte wird benötigt. </p>
com.top_logic.layout.view.element.ColumnsElement.Config.gap = Abstand
com.top_logic.layout.view.element.ColumnsElement.Config.gap.tooltip = Der Abstand zwischen den Spalten, und zwischen den untereinander stehenden Spalten unterhalb der Umbruchbreite.
com.top_logic.layout.view.element.ColumnsElement.tooltip = Eine Seite aus Spalten unterschiedlicher Breite, die bei wenig Platz zu einer einzigen Spalte umbricht. <p> Jede Spalte erhält einen Anteil der Breite nach ihrem Gewicht: Eine Hauptspalte mit Gewicht 2 neben einer Seitenspalte mit Gewicht 1 teilt die Breite zwei Drittel zu einem Drittel. Die Spalten behalten die geschriebene Reihenfolge, von links nach rechts. </p> <p> Unterhalb der Umbruchbreite stehen die Spalten untereinander, jede über die volle Breite, in der geschriebenen Reihenfolge: die Hauptspalte zuerst, die Seitenspalte darunter. Maßgeblich ist die Breite, die diesem Element selbst zugestanden wird, nicht die Breite des Browserfensters; dieselbe Seite bricht deshalb in einem schmalen Bereich eines geteilten Fensters genauso um wie auf einem Telefon. </p> <p> Die Spalten sind ein Seitenlayout, keine Menge von Bereichen: Es gibt keine Trenner zum Ziehen, das Layout ist so hoch wie seine höchste Spalte, und eine Spalte ist so hoch wie ihr eigener Inhalt. Inhalt, der über das Fenster hinausgeht, wird durch Scrollen der Seite erreicht, sodass eine lange Hauptspalte und eine kurze Seitenspalte als eine Seite gelesen werden und nicht als zwei gegeneinander scrollende Kästen. </p>
com.top_logic.layout.view.element.CommandCarrierElement = Kommando Trägerelement
com.top_logic.layout.view.element.CommandCarrierElement.Config.commands = Befehle
com.top_logic.layout.view.element.CommandCarrierElement.Config.commands.tooltip = Für dieses Element deklarierte Befehle.
com.top_logic.layout.view.element.CommandCarrierElement.tooltip = Abstrakte Basis für <i>UI-Elemente</i>, die <i>View-Befehlskonfigurationen</i> enthalten. <p> Verantwortlich für das Laden von Befehlskonfigurationen, den Aufbau von <i>View-Befehlsmodellen</i>, das Zusammenführen untergeordneter Elemente zu einem einzigen <i>Content-React-Steuerelement</i> und die Verwaltung des Lebenszyklus des Anhängens/Abnehmens der Befehlsmodelle. </p> <p> Erzeugt KEINEN <i>Befehlsbereich</i> oder Chrom. Unterklassen entscheiden, was mit der resultierenden Modellliste geschehen soll: <i>Das Command Scope-Element</i> wickelt sie in einen gemeinsamen Bereich ein und fügt Toolbar-Chrome hinzu; <i>das Kontextmenü-Element</i> verwendet sie, um eine Kontextmenü-Region zu füllen. </p>
com.top_logic.layout.view.element.CommandItemElement = Befehlselement
com.top_logic.layout.view.element.CommandItemElement.Config.action = Aktion
com.top_logic.layout.view.element.CommandItemElement.Config.action.tooltip = Der Befehl, den dieser Eintrag ausführt. <p> Wird als <action class="..." .../> innerhalb des <command-item>-Elements konfiguriert. Bezeichnung und Symbol des Befehls sind das, was der Eintrag anzeigt, und seine Ausführbarkeitsregeln entscheiden, ob der Eintrag angeboten wird. </p>
com.top_logic.layout.view.element.CommandItemElement.tooltip = Ein Element in einer <i>Seitenleiste</i>, das einen <i>Ansichtsbefehl</i> ausführt, anstatt zu einer Seite zu führen. <p> Abmelden, die Sprache wechseln, einen Dialog öffnen: eine Aktion, die zur Navigation gehört, obwohl sie keine eigene Seite anzeigt. Der Befehl enthält eine Bezeichnung und ein Symbol, sodass sich das Element wie die Schaltfläche desselben Befehls an anderer Stelle liest. </p> <p> Das Element zeigt so lange, wie die Seitenleiste angezeigt wird, was die Ausführungsregeln des Befehls vorsehen: Ein Element, dessen Befehl gerade nicht angeboten wird, wird ausgeblendet oder außerhalb der Reichweite angezeigt und nimmt seinen Platz wieder ein, sobald die Regeln dies wieder zulassen. Der Grund, den eine Regel für die Deaktivierung des Befehls angibt, wird im Element angezeigt, solange der Mauszeiger darauf ruht. </p>
com.top_logic.layout.view.element.CommandScopeElement = Element des Befehlsumfangs
com.top_logic.layout.view.element.CommandScopeElement.Config.command-display = Befehlsanzeige
com.top_logic.layout.view.element.CommandScopeElement.Config.command-display.tooltip = Legt fest, wie die Schaltflächen dieses Bereichs Symbole und Bezeichnungen anzeigen, z. B. „nur Symbol“ für kompakte Symbolschaltflächen, deren Bezeichnungen als Tooltips angezeigt werden. <p> Gilt für alle Schaltflächen, die aus diesem Bereich gerendert werden – sowohl explizit konfigurierte Befehle als auch Befehle, die von untergeordneten Elementen bereitgestellt werden (z. B. die Schaltflächen „Bearbeiten“ und „Speichern“ eines Formulars). Die eigenen Anzeigeeinstellungen eines Befehls haben Vorrang. Wenn keine Einstellung vorhanden ist, zeigen die Schaltflächen das Symbol (sofern konfiguriert) zusammen mit der Bezeichnung an. </p>
com.top_logic.layout.view.element.CommandScopeElement.tooltip = Basisklasse für <i>UI-Elemente</i>, die einen <i>Befehlsbereich</i> festlegen und platzierte Befehle als strukturierte Symbolleisten darstellen. <p> Unterklassen erzeugen ihr spezifisches Chrom (Panel, Fenster, etc.). Diese Klasse fügt oben auf dem <i>Befehlsträgerelement</i> hinzu: </p> <ul> <li>Erstellen eines <i>Befehlsbereichs</i> und eines abgeleiteten <i>Ansichtskontexts</i></li> <li>Erstellung von clique-gruppierten Symbolleisten für in <i>der Symbolleiste</i> und in der <i>Schaltflächenleiste</i> platzierte Befehle mit Hilfe des <i>Symbolleisten-Erbauers</i></li> <li>Neuaufbau der Symbolleisten, wenn sich die Menge der Befehle ändert (implizite Befehle)</li> </ul>
com.top_logic.layout.view.element.CompositionTableElement = Zusammensetzung Tabellenelement
com.top_logic.layout.view.element.CompositionTableElement$DetailDialogConfig = Konfiguration des Detaildialogs
com.top_logic.layout.view.element.CompositionTableElement$DetailDialogConfig.tooltip = Konfiguration für den Detaildialog, der aus einer Zeile der Zusammensetzungstabelle geöffnet wird.
com.top_logic.layout.view.element.CompositionTableElement.Config.attribute = Attribut
com.top_logic.layout.view.element.CompositionTableElement.Config.attribute.tooltip = Der Name des Kompositionsreferenzattributs des übergeordneten Objekts.
com.top_logic.layout.view.element.CompositionTableElement.Config.columns = Rubriken
com.top_logic.layout.view.element.CompositionTableElement.Config.columns.tooltip = Die Spaltendefinitionen für diese Tabelle.
com.top_logic.layout.view.element.CompositionTableElement.Config.detail-dialog = Detail-Dialog
com.top_logic.layout.view.element.CompositionTableElement.Config.detail-dialog.tooltip = Optionale Konfiguration des Detail-Dialogs. <p> Wenn gesetzt, erhält jede Tabellenzeile eine Schaltfläche "Detail", die die konfigurierte Dialogansicht mit dem in den angegebenen Kanal injizierten Zeilenobjekt öffnet. </p>
com.top_logic.layout.view.element.CompositionTableElement.DetailDialogConfig.edit-mode-channel = Kanal im Bearbeitungsmodus
com.top_logic.layout.view.element.CompositionTableElement.DetailDialogConfig.edit-mode-channel.tooltip = Name des Dialogkanals, der den aktuellen Status des Bearbeitungsmodus empfängt. <p> Wenn nicht gesetzt, wird kein Kanal für den Bearbeitungsmodus in den Dialog eingefügt. </p>
com.top_logic.layout.view.element.CompositionTableElement.DetailDialogConfig.height = Höhe
com.top_logic.layout.view.element.CompositionTableElement.DetailDialogConfig.height.tooltip = Dialoghöhe in Pixel. Null bedeutet, dass die Standardhöhe verwendet wird.
com.top_logic.layout.view.element.CompositionTableElement.DetailDialogConfig.input-channel = Eingangskanal
com.top_logic.layout.view.element.CompositionTableElement.DetailDialogConfig.input-channel.tooltip = Name des Dialogkanals, der das Zeilenobjekt empfangen soll.
com.top_logic.layout.view.element.CompositionTableElement.DetailDialogConfig.layout = Layout
com.top_logic.layout.view.element.CompositionTableElement.DetailDialogConfig.layout.tooltip = Pfad zur Datei der Dialogansicht, relativ zu /WEB-INF/views/.
com.top_logic.layout.view.element.CompositionTableElement.DetailDialogConfig.width = Breite
com.top_logic.layout.view.element.CompositionTableElement.DetailDialogConfig.width.tooltip = Dialogbreite in Pixel. Null bedeutet, dass die Standardbreite verwendet wird.
com.top_logic.layout.view.element.CompositionTableElement.tooltip = Deklaratives <i>UI-Element</i>, das ein <i>Row-Set-Tabellensteuerelement</i> für eine Inline-Kompositionstabelle innerhalb eines Formulars erstellt. <p> Muss innerhalb eines <i>Formularelements</i> verschachtelt sein. Analysiert ein Konfigurationselement „ <composition-table> “ mit einem Attribut „reference“ und einem optionalen untergeordneten Element „ <columns> “, das Elemente vom Typ „ <column> “ enthält. </p> <p> Beispielkonfiguration: </p><pre> &lt;composition-table attribute="items"&gt; &lt;columns&gt; &lt;column attribute="name"/&gt; &lt;column attribute="quantity"/&gt; &lt;column attribute="unitPrice" readonly="true"/&gt; &lt;/columns&gt; &lt;/composition-table&gt; </pre>
com.top_logic.layout.view.element.ConfigFormElement = Konfigurationsformular-Element
com.top_logic.layout.view.element.ConfigFormElement.Config.input = Eingabekanal
com.top_logic.layout.view.element.ConfigFormElement.Config.input.tooltip = Kanal, der die zu bearbeitende <i>Konfiguration</i> führt. <p> Optional: Ohne ihn bearbeitet das Element eine neue Konfiguration des konfigurierten <i>Typs</i>. </p>
com.top_logic.layout.view.element.ConfigFormElement.Config.noModelMessage = Meldung ohne Modell
com.top_logic.layout.view.element.ConfigFormElement.Config.noModelMessage.tooltip = Wird anstelle des Formulars angezeigt, solange es nichts zu bearbeiten gibt.
com.top_logic.layout.view.element.ConfigFormElement.Config.type = Typ
com.top_logic.layout.view.element.ConfigFormElement.Config.type.tooltip = Die Konfigurationsschnittstelle, von der eine neue Konfiguration erzeugt wird, wenn der <i>Eingabekanal</i> keinen Wert hat. <p> Ohne ihn bedeutet ein leerer Kanal, dass es nichts zu bearbeiten gibt; stattdessen wird die <i>Meldung ohne Modell</i> angezeigt. </p>
com.top_logic.layout.view.element.ConfigFormElement.Config.withEditMode = Im Bearbeitungsmodus
com.top_logic.layout.view.element.ConfigFormElement.Config.withEditMode.tooltip = Ob die Konfiguration über eine Arbeitskopie bearbeitet wird, mit Bearbeiten, Übernehmen und Abbrechen. <p> Ausgeschaltet schreibt das Formular jede Änderung direkt in die Konfiguration - für einen Aufrufer mit eigenem Speicherzyklus oder eine Konfiguration, die niemandes dauerhafter Zustand ist. </p>
com.top_logic.layout.view.element.ConfigFormElement.tooltip = <i>UI-Element</i> zum Bearbeiten einer <i>Konfiguration</i> - das Gegenstück zum <i>Formular-Element</i> für Konfigurationen. <p> Die Konfiguration kommt vom <i>Eingabekanal</i>, so dass eine anderswo ausgewählte Konfiguration (eine Tabellenzeile, ein Baumknoten) hier bearbeitet werden kann. Sie kann ebenso von nirgends kommen: Mit einem konfigurierten <i>Typ</i> bearbeitet das Element eine neue Konfiguration dieses Typs, sobald der Kanal nichts anzubieten hat. Das ist der Fall, den ein gewöhnliches Formular gar nicht bedienen kann - es gibt nirgends ein Modellobjekt, nur eine Konfiguration. </p> <p> Der Bearbeitungsmodus arbeitet wie bei einem Formular mit Bearbeitungsmodus: Die Konfiguration ist schreibgeschützt, bis "Bearbeiten" eine Arbeitskopie beginnt; "Übernehmen" prüft sie und überträgt sie, "Abbrechen" verwirft sie. Diese drei Befehle gehen in die Symbolleiste des umgebenden Panels statt zwischen die Felder. </p>
com.top_logic.layout.view.element.ContextMenuElement = Kontextmenü-Element
com.top_logic.layout.view.element.ContextMenuElement.tooltip = Ein Menü über den untergeordneten Elementen dieses Elements, das sich per Rechtsklick öffnet. <p> Befehle, die innerhalb eines <context-menu>-Elements mit placement="CONTEXT_MENU" deklariert sind, werden in einer einzigen Auflistung <i>von Kontextmenü-Beiträgen</i> zusammengefasst, die an einen impliziten Kanal <code>"contextTarget"</code> (oder an den über das optionale input-Attribut referenzierten Kanal) gebunden sind. Die untergeordneten Elemente bilden den Bereich, auf den der Benutzer mit der rechten Maustaste klickt, und können Befehle mit eigenen Platzierungen enthalten; daher werden nur die Befehle aus dem Kontextmenü zu Einträgen. </p>
com.top_logic.layout.view.element.DashboardElement = Dashboard-Element
com.top_logic.layout.view.element.DashboardElement.Config.id = ID
com.top_logic.layout.view.element.DashboardElement.Config.id.tooltip = Stabile ID, die als Persistenzschlüssel für die Bestellung persönlicher Kacheln verwendet wird.
com.top_logic.layout.view.element.DashboardElement.Config.min-col-width = Minimale Spaltenbreite
com.top_logic.layout.view.element.DashboardElement.Config.min-col-width.tooltip = CSS-Längenhinweis, der vom Client verwendet wird, um die Spaltenanzahl zu bestimmen. Der Standardwert ist 16rem.
com.top_logic.layout.view.element.DashboardElement.Config.row-height = Zeilenhöhe
com.top_logic.layout.view.element.DashboardElement.Config.row-height.tooltip = Die Höhe einer Gitterzeile als CSS-Längenangabe. <p> Eine Kachel ist so viele Zeilen hoch wie die Zeilenspanne ihres <i>Kachel-Elements</i>, zuzüglich der Abstände zwischen diesen Zeilen. Inhalte, die die verfügbare Höhe ausfüllen – beispielsweise ein zum Ausfüllen konfiguriertes Panel oder eine Tabelle –, passen ihre Höhe an die Kachel an und scrollen innerhalb dieser; Inhalte, die die Kachel nicht ausfüllen und höher sind als diese, scrollen ebenfalls innerhalb der Kachel. </p>
com.top_logic.layout.view.element.DashboardElement.Config.tiles = Kacheln
com.top_logic.layout.view.element.DashboardElement.Config.tiles.tooltip = Die Kacheln. Dargestellt als polymorphe Konfigurationen, so dass der Standardcontainer (untergeordnete Elemente) <tile> Einträge enthalten kann.
com.top_logic.layout.view.element.DashboardElement.tooltip = Ein UI-Element, das ein responsives Dashboard-Gitter aus Kacheln darstellt. <p> Die Reihenfolge der Kacheln wird für jeden Benutzer über die <i>persönliche Konfiguration</i> personalisiert, die durch die ID dieses Elements festgelegt wird. Unbekannte IDs in der persistierten Reihenfolge werden ignoriert; nicht erwähnte Kacheln werden in ihrer konfigurierten Reihenfolge angefügt. </p>
com.top_logic.layout.view.element.DetailDisplay = Detaildarstellung
com.top_logic.layout.view.element.DetailDisplay.DRAWER = Schublade
com.top_logic.layout.view.element.DetailDisplay.DRAWER.tooltip = Das Detail überlagert den Selektor als Panel, das vom rechten Rand her einschiebt, wobei der Selektor darunter in voller Breite sichtbar bleibt.
com.top_logic.layout.view.element.DetailDisplay.SPLIT = Geteilt
com.top_logic.layout.view.element.DetailDisplay.SPLIT.tooltip = Das Detail teilt sich die verfügbare Breite mit dem Selektor, in einer Teilung, deren Trennlinie verschoben werden kann.
com.top_logic.layout.view.element.DetailDisplay.tooltip = Wie ein <i>adaptives Detailelement</i> sein Detail in einem breiten Ansichtsfenster neben seinem Selektor darstellt. <p> In einem schmalen Ansichtsfenster ersetzt das Detail immer den Selektor, unabhängig davon, welcher Wert konfiguriert ist. </p>
com.top_logic.layout.view.element.FieldElement = Feldelement
com.top_logic.layout.view.element.FieldElement.Config.attribute = Attribut
com.top_logic.layout.view.element.FieldElement.Config.attribute.tooltip = Der Name des anzuzeigenden Modellattributs.
com.top_logic.layout.view.element.FieldElement.Config.full-line = Komplette Zeile
com.top_logic.layout.view.element.FieldElement.Config.full-line.tooltip = Ob das Feld eine eigene Zeile des Formularrasters einnimmt, anstatt sich eine mit den umliegenden Feldern zu teilen. <p> Bei einem Feld, dessen Eingabe nicht aus einer einzigen Zeile besteht – beispielsweise eine Auflistung von Konfigurationen, ein Textbereich oder eine Tabelle –, ist eine Spalte des Rasters zu schmal, um den Inhalt lesen zu können, und die daneben liegenden Felder werden auf die Höhe dieses Feldes angepasst. </p> <p> Absichtlich dreistufig: Ist der Wert nicht festgelegt, ist eine <i>ganze Zeile</i> im Modellattribut weiterhin ausschlaggebend; eine Ansicht gibt hier also nur dann eine Aussage ab, wenn sie von dem abweichen möchte, was das Modell bereits angibt. </p>
com.top_logic.layout.view.element.FieldElement.Config.input-control = Eingabe-Steuerelement
com.top_logic.layout.view.element.FieldElement.Config.input-control.tooltip = Das Steuerelement bearbeitet hier das Attribut und überschreibt damit das vom Modell vorgegebene. <p> Es handelt sich um dieselbe Auswahlmöglichkeit, die auch die Annotation für <i>ein Eingabesteuerelement</i> eines Modellattributs bietet, allerdings wird sie an der Stelle vorgenommen, an der das Feld angezeigt wird, und nicht dort, wo das Attribut definiert ist. Hier wird ein Steuerelement ausgewählt, das zu einer bestimmten Stelle in der Benutzeroberfläche gehört – beispielsweise ein Editor, dessen Symbolleiste einen Dialog dieser Ansicht öffnet –, sodass das Modell weiterhin festlegt, was das Attribut ist, und die Ansicht bestimmt, wie es dargestellt wird. </p> <p> Wird keine Angabe gemacht, ist das Steuerelement dasjenige, auf das die eigene Annotation des Attributs, sein Typ oder die Art des Werts, den es enthält, hinweist. </p>
com.top_logic.layout.view.element.FieldElement.Config.label = Etikett
com.top_logic.layout.view.element.FieldElement.Config.label-position = Position der Bezeichnung
com.top_logic.layout.view.element.FieldElement.Config.label-position.tooltip = Gibt an, wo das Feld seine Bezeichnung relativ zur Eingabe darstellt, z. B. „hide-label“ für ein Feld ohne Bezeichnung. <p> Wenn nicht festgelegt, gilt eine am Modellattribut annotierte <i>Position der Bezeichnung</i>; ist auch keine solche vorhanden, die responsive Standardposition des umgebenden Formularlayouts. </p>
com.top_logic.layout.view.element.FieldElement.Config.label.tooltip = Optionale Überschreibung der Bezeichnung für das Feld. <p> Wenn nicht festgelegt, wird die Bezeichnung vom Modellattribut abgeleitet. </p>
com.top_logic.layout.view.element.FieldElement.Config.readonly = Schreibgeschützt
com.top_logic.layout.view.element.FieldElement.Config.readonly.tooltip = Ob das Feld immer schreibgeschützt sein soll, unabhängig vom Bearbeitungsmodus des Formulars.
com.top_logic.layout.view.element.FieldElement.tooltip = Deklaratives <i>UI-Element</i>, das eine <i>Attributfeldsteuerung</i> für ein einzelnes Modellattribut erstellt. <p> Muss innerhalb eines <i>Formularelements</i> verschachtelt sein. Löst das umschließende <i>Formularmodell</i> aus dem <i>Ansichtskontext</i> auf und erstellt ein chrome-umhülltes Feldsteuerelement für das konfigurierte Attribut. </p>
com.top_logic.layout.view.element.FieldsElement = Felder-Element
com.top_logic.layout.view.element.FieldsElement.tooltip = <i>UI-Element</i>, das seinen Inhalt als Felder eines Formulars anordnet. <p> Ein Formular umgibt seine Felder mit einem Raster: Es versetzt sie vom Rand des Containers nach innen, verteilt sie auf so viele Spalten, wie die verfügbare Breite zulässt, und platziert jede Bezeichnung je nach Breite der Spalte, in der sie landet, neben oder über dem Eingabefeld. Dieses Element ist dieses Raster für sich allein. Es erfüllt zwei Zwecke: </p> <ul> <li>Es ordnet Eingabeelemente an, die zur Ansicht und nicht zu einem Objekt gehören und daher außerhalb eines Formulars stehen: ein <i>Wert-Eingabeelement</i> und alles andere, was die Bezeichnung und das Eingabefeld eines Feldes anzeigt.</li> <li>Es ordnet einen Teil der Felder eines <i>Formularelements</i> an: die Felder eines Bereichs eines Formulars, dessen Bereiche aus Panels oder geteilten Fenstern bestehen. Ein solches Formular ordnet diese Felder nicht selbst an, da es bündig um die Bereiche liegt, die es überspannt. Ein Raster innerhalb eines Formulars zeigt den Bearbeitungsmodus des Formulars an: Seine Felder erscheinen schreibgeschützt, solange das Formular nicht bearbeitet wird.</li> </ul> <p> Ein <i>Feldelement</i> benötigt in jedem Fall ein Formular: Dieses Element ordnet Felder an, enthält jedoch kein Objekt, das diese anzeigen könnte. </p>
com.top_logic.layout.view.element.FileListElement = Dateiliste
com.top_logic.layout.view.element.FileListElement.Config.attribute = Attribut
com.top_logic.layout.view.element.FileListElement.Config.attribute.tooltip = Der Name des Kompositionsreferenzattributs des übergeordneten Objekts.
com.top_logic.layout.view.element.FileListElement.Config.data-attribute = Datenattribut
com.top_logic.layout.view.element.FileListElement.Config.data-attribute.tooltip = Der Name des binären Attributs des zusammengesetzten Typs, in dem die Datei gespeichert ist. <p> Ist dieser nicht festgelegt, wird die einzige Eigenschaft vom Typ „binär“ des Zieltyps der Zusammensetzung verwendet. </p>
com.top_logic.layout.view.element.FileListElement.Config.label-position = Position der Bezeichnung
com.top_logic.layout.view.element.FileListElement.Config.label-position.tooltip = Gibt an, wo die Dateiliste ihre Bezeichnung relativ zu den Chips darstellt, z. B. „hide-label“ für eine Dateiliste ohne Bezeichnung.
com.top_logic.layout.view.element.FileListElement.tooltip = Deklaratives <i>UI-Element</i>, das ein <i>Dateilisten-Steuerelement</i> für eine Kompositionsreferenz erstellt, deren zusammengesetzte Objekte eine Datei enthalten. <p> Muss innerhalb eines <i>Formularelements</i> verschachtelt sein. Zeigt die zusammengesetzten Objekte als Dateichips an (Name, Größe, Download); im Bearbeitungsmodus können Dateien per Upload hinzugefügt und pro Chip entfernt werden. </p> <p> Beispielkonfiguration: </p><pre> &lt;file-list attribute="attachments"/&gt; </pre>
com.top_logic.layout.view.element.FormElement = Formular-Element
com.top_logic.layout.view.element.FormElement.Config.cancel-action = Aktion abbrechen
com.top_logic.layout.view.element.FormElement.Config.cancel-action.tooltip = Optionale Aktionskette, die beim Abbrechen anstelle des Standardverhaltens ausgeführt wird. <p> Wenn konfiguriert, führt die Schaltfläche "Abbrechen" diese <i>Ansichtsaktionskette</i> anstelle des Standardabbruchverhaltens aus. </p>
com.top_logic.layout.view.element.FormElement.Config.commands = Befehle
com.top_logic.layout.view.element.FormElement.Config.commands.tooltip = Befehle, die zum umschließenden Befehlsbereich beitragen. <p> Diese Befehle werden im Kontext des Formulars ausgeführt und haben über ReadFormObjectAction Zugriff auf das Formularmodell. Sie werden in den übergeordneten <i>Befehlsbereich</i> eingefügt und vom umschließenden Bedienfeld oder Fenster als Symbolleistenschaltflächen dargestellt. </p>
com.top_logic.layout.view.element.FormElement.Config.dirty = Schmutzig
com.top_logic.layout.view.element.FormElement.Config.dirty.tooltip = Optionaler Verweis auf einen Kanal zur Veröffentlichung des Dirty-Status.
com.top_logic.layout.view.element.FormElement.Config.edit-executability = Ausführbarkeit der Bearbeitung
com.top_logic.layout.view.element.FormElement.Config.edit-executability.tooltip = Regeln, die festlegen, ob dieses Formular die Bearbeitung seines Objekts zulässt. <p> Sichert den Übergang in den Bearbeitungsmodus, unabhängig davon, wo er ausgelöst wird: Die Schaltfläche „Bearbeiten“ wird gemäß den Regeln deaktiviert oder ausgeblendet, und das Formular verweigert den Übergang, wenn ein Client ihn dennoch anfordert. Die übrigen Lebenszyklusbefehle (Anwenden, Speichern, Abbrechen) sind nur innerhalb einer Bearbeitungssitzung erreichbar und werden daher durch diese gesichert. </p> <p> Eine <i>Berechtigung</i> überprüft die Rollen des Benutzers für eine Befehlsgruppe im übergeordneten Sicherheitsbereich; ein <i>„visible if“-Ausdruck</i> wertet ein Skriptprädikat für das angezeigte Objekt aus. Ohne eine solche Berechtigung kann jeder Benutzer, der das Formular sieht, es bearbeiten. </p>
com.top_logic.layout.view.element.FormElement.Config.editMode = Bearbeitungsmodus
com.top_logic.layout.view.element.FormElement.Config.editMode.tooltip = Optionaler Verweis auf einen Kanal für die Veröffentlichung des Bearbeitungsmodusstatus.
com.top_logic.layout.view.element.FormElement.Config.initial-edit-mode = Ursprünglicher Bearbeitungsmodus
com.top_logic.layout.view.element.FormElement.Config.initial-edit-mode.tooltip = Ob das Formular sofort in den Bearbeitungsmodus übergeht. <p> Wenn true, wird das Formular in den Bearbeitungsmodus versetzt, sobald ein Objekt verfügbar ist, ohne dass der Benutzer auf eine Schaltfläche Bearbeiten klicken muss. Nützlich für die Erstellung von Dialogen, bei denen das Objekt immer bearbeitbar ist. </p>
com.top_logic.layout.view.element.FormElement.Config.input = Eingabe
com.top_logic.layout.view.element.FormElement.Config.input.tooltip = Verweis auf den Kanal, der das Objekt bereitstellt, das im Formular angezeigt werden soll.
com.top_logic.layout.view.element.FormElement.Config.lockHandler = Lock-Handler
com.top_logic.layout.view.element.FormElement.Config.lockHandler.tooltip = Algorithmus für die Bearbeitung von Token im Bearbeitungsmodus. <p> Standardmäßig <i>anwendungsweite Sperrdefinition</i>, die den anwendungsweiten LockService verwendet. Um das Sperren zu deaktivieren, konfigurieren Sie NoTokenHandling. </p>
com.top_logic.layout.view.element.FormElement.Config.mode-switch = Modus-Schalter
com.top_logic.layout.view.element.FormElement.Config.mode-switch.tooltip = Ob Schaltflächen zum Umschalten zwischen den Modi Bearbeiten/Speichern/Abbrechen angezeigt werden sollen. <p> Wenn false, werden keine Befehlsmodelle für Bearbeiten, Speichern und Abbrechen erstellt. Das Formular bleibt entweder im Ansichtsmodus oder im Bearbeitungsmodus, abhängig vom <i>anfänglichen Bearbeitungsmodus</i>. Nützlich für die Erstellung von Dialogen, bei denen die Schaltflächen des Dialogs selbst die Übermittlung übernehmen. </p>
com.top_logic.layout.view.element.FormElement.Config.noModelMessage = Keine Modellmeldung
com.top_logic.layout.view.element.FormElement.Config.noModelMessage.tooltip = Meldung, die angezeigt wird, wenn kein Objekt verfügbar ist. <p> Der Standardwert ist "Kein Objekt ausgewählt", wenn nichts angegeben wird. </p>
com.top_logic.layout.view.element.FormElement.Config.save-action = Aktion speichern
com.top_logic.layout.view.element.FormElement.Config.save-action.tooltip = Optionale Aktionskette, die beim Speichern anstelle des Standardverhaltens ausgeführt wird. <p> Wenn konfiguriert, führt die Schaltfläche "Speichern" diese <i>Ansichtsaktionskette</i> (ähnlich dem GenericViewCommand) anstelle des Standardverhaltens "Speichern" aus. </p>
com.top_logic.layout.view.element.FormElement.Config.withEditMode = Im Bearbeitungsmodus
com.top_logic.layout.view.element.FormElement.Config.withEditMode.tooltip = Ob Befehlsmodelle für Bearbeiten/Speichern/Abbrechen für dieses Formular erstellt werden sollen. <p> Bei true werden Befehlsmodelle für Bearbeiten, Speichern und Abbrechen erstellt und in den umschließenden <i>Befehlsbereich</i> eingefügt. Dies ermöglicht es einem übergeordneten Panel, Symbolleistenschaltflächen für den Wechsel zwischen Ansicht und Bearbeitungsmodus zu rendern, ohne dass das <i>Formularsteuerelement</i> über UI-Elemente Bescheid weiß. </p>
com.top_logic.layout.view.element.FormElement.tooltip = Deklaratives <i>UI-Element</i>, das ein <i>Formularsteuerelement</i> umhüllt. <p> Richtet einen Formularbereich für untergeordnete Elemente ein. Löst einen Eingabekanal auf, um das anzuzeigende Objekt zu erhalten, erstellt ein <i>Formularsteuerelement</i> und macht es über den <i>Ansichtskontext</i> für verschachtelte <i>Feldelemente</i> verfügbar. </p>
com.top_logic.layout.view.element.FormLayoutOptions = Optionen für das Formularlayout
com.top_logic.layout.view.element.FormLayoutOptions.label-position = Position der Bezeichnung
com.top_logic.layout.view.element.FormLayoutOptions.label-position.tooltip = Wo die Felder ihre Bezeichnungen relativ zu ihren Eingabefeldern anzeigen. <p> Bei <i>auto</i> steht jede Bezeichnung neben ihrem Eingabefeld, sofern die Spalte breit genug für beides ist, und wird darüber verschoben, wenn dies nicht der Fall ist. <i>Side</i> und <i>Top</i> legen die Position unabhängig von der Breite fest. </p> <p> Ein Feld, das eine eigene Position angibt, behält diese bei. </p>
com.top_logic.layout.view.element.FormLayoutOptions.max-columns = Maximale Spaltenanzahl
com.top_logic.layout.view.element.FormLayoutOptions.max-columns.tooltip = Die maximale Anzahl an Spalten, in denen die Felder angeordnet sind. <p> Wie viele davon tatsächlich ausgefüllt werden, hängt von der verfügbaren Breite ab: Auf einem schmalen Bildschirm werden weniger Spalten angezeigt, auf einem Smartphone nur eine einzige. </p>
com.top_logic.layout.view.element.FormLayoutOptions.tooltip = Das Layout eines Rasters aus Formularfeldern. <p> Ein Formularraster versetzt seine Felder vom Rand des Containers nach innen, verteilt sie auf so viele Spalten, wie die verfügbare Breite zulässt, und platziert jede Bezeichnung je nach Breite der Spalte, in der sie landet, neben oder über dem Eingabefeld. Die Konfiguration legt nicht die Anzahl der Spalten fest, sondern die höchstens gewünschte Anzahl und wo die Bezeichnungen stehen. </p>
com.top_logic.layout.view.element.FullPageElement = Ganzseitiges Element
com.top_logic.layout.view.element.FullPageElement.tooltip = Ein UIElement, das seinen Container mit einem einzigen Hauptinhalt (in der Regel einer Tabelle) füllt, ohne jegliche Kopfzeilenelemente. <p> Verwenden Sie es als Stamminhalt einer Ansicht, deren übergeordnete Tab-Registerkarte oder Navigationseintrag bereits diesen Namen trägt: Es wird kein Panel-Titel angezeigt, sodass die Bezeichnung nicht doppelt erscheint und kein vertikaler Platz verschwendet wird. Das Element füllt stets die verfügbare Höhe aus, sodass ein virtualisiertes Inhaltssteuerelement (eine Tabelle) den Bildlaufbereich begrenzt und intern scrollt. </p> <p> Im Gegensatz zu einem Panel rendert eine Vollseite keine lokale Symbolleiste: Befehle werden auf einen höher in der Baumstruktur liegenden Bereich (z. B. die Anwendungsleiste) projiziert, nicht in eine eigene Kopfzeilenleiste. </p>
com.top_logic.layout.view.element.GridElement = Raster-Element
com.top_logic.layout.view.element.GridElement.tooltip = UIElement, das die <i>React Grid-Steuerung</i> umhüllt. <p> Rendert einen CSS-Grid-Container mit reaktionsfähigen Auto-Fit-Spalten. </p>
com.top_logic.layout.view.element.GridOptions = Rasteroptionen
com.top_logic.layout.view.element.GridOptions.gap = Lücke
com.top_logic.layout.view.element.GridOptions.gap.tooltip = Der Abstand zwischen den Elementen des Rasters.
com.top_logic.layout.view.element.GridOptions.max-columns = Maximale Spaltenanzahl
com.top_logic.layout.view.element.GridOptions.max-columns.tooltip = Die größte Anzahl von Spalten, die angeordnet werden; ohne Angabe so viele, wie nebeneinander Platz finden. <p> Auch ein begrenztes Raster gibt Spalten auf, wenn es schmaler wird; es wächst nur nicht über die angegebene Anzahl hinaus, wie breit es auch wird. So breiten sich wenige Elemente auf einem breiten Bildschirm nicht zu einer dünnen Reihe aus. </p>
com.top_logic.layout.view.element.GridOptions.max-width = Maximale Breite
com.top_logic.layout.view.element.GridOptions.max-width.tooltip = Die größte Breite, die die Elemente zusammen einnehmen, als CSS-Länge wie "60rem". <p> So begrenzt, wird die Anordnung in dem Platz zentriert, den sie erhält; der übrige Platz wird auf ihre beiden Seiten verteilt. So bleiben wenige Elemente in der Mitte eines breiten Bildschirms zusammen, statt sich über ihn zu verteilen. Unterhalb der Grenze ändert sich nichts, die Elemente füllen einen schmalen Bildschirm also weiterhin aus. </p> <p> Ohne Angabe nehmen die Elemente die Breite ein, die ihr Container bietet. </p>
com.top_logic.layout.view.element.GridOptions.min-column-width = Minimale Spaltenbreite
com.top_logic.layout.view.element.GridOptions.min-column-width.tooltip = Die Breite, die eine Spalte mindestens haben muss, als CSS-Länge wie "16rem". <p> Eine Spalte ist nie schmaler als dies, sodass sich die Anzahl der Spalten nach der verfügbaren Breite richtet: je breiter das Raster, desto mehr Spalten werden angeordnet. Passt nicht einmal eine Spalte dieser Breite, werden die Elemente in voller Breite angezeigt, statt über den Rand hinauszuragen. </p>
com.top_logic.layout.view.element.GridOptions.tooltip = Das Layout eines Rasters aus gleich gebauten Elementen. <p> Ein Raster ordnet seine Elemente in so vielen Spalten an, wie nebeneinander Platz finden, und ordnet sie neu an, wenn sich die verfügbare Breite ändert, sodass dieselbe Konfiguration einen breiten Bildschirm und ein Telefon bedient. Die Konfiguration legt nicht die Anzahl der Spalten fest, sondern wie breit eine Spalte mindestens sein muss, optional wie viele Spalten höchstens gewünscht sind, wie viel Platz sie trennt und wie breit das Raster insgesamt werden darf. </p>
com.top_logic.layout.view.element.GroupElement = Gruppenelement
com.top_logic.layout.view.element.GroupElement.Config.border = Rahmen
com.top_logic.layout.view.element.GroupElement.Config.border.tooltip = Der um den Abschnitt gezeichnete Rahmen.
com.top_logic.layout.view.element.GroupElement.Config.collapsed = Eingeklappt
com.top_logic.layout.view.element.GroupElement.Config.collapsed.tooltip = Ob der Abschnitt eingeklappt beginnt. <p> Der Benutzer klappt ihn über die Überschrift wieder aus; dies gilt daher für einen Abschnitt, der eingeklappt werden kann. </p>
com.top_logic.layout.view.element.GroupElement.Config.collapsible = Einklappbar
com.top_logic.layout.view.element.GroupElement.Config.collapsible.tooltip = Ob der Benutzer den Abschnitt einklappen kann.
com.top_logic.layout.view.element.GroupElement.Config.full-line = Komplette Zeile
com.top_logic.layout.view.element.GroupElement.Config.full-line.tooltip = Ob sich der Abschnitt über die gesamte Breite des Formulars erstreckt, in dem er sich befindet. <p> Ein Abschnitt, der sich über die gesamte Breite erstreckt, verteilt seine Felder auf die Spalten des Formulars. Ein auf eine einzelne Spalte beschränkter Abschnitt stapelt seinen Inhalt in dieser Spalte, ein Element unter dem anderen. </p>
com.top_logic.layout.view.element.GroupElement.Config.label = Bezeichnung
com.top_logic.layout.view.element.GroupElement.Config.label.tooltip = Die Überschrift, unter der der Abschnitt angezeigt wird. <p> Ein Abschnitt ohne Bezeichnung hat keine Überschrift und wird allein durch seinen Rahmen abgegrenzt. </p>
com.top_logic.layout.view.element.GroupElement.tooltip = <i>UI-Element</i>, das die Felder eines Formulars unterteilt. <p> Eine Gruppe fasst die zusammengehörigen Felder unter einer eigenen Überschrift zusammen – Name, Kontakt, Adresse – und kann eingerahmt und eingeklappt werden. Sie fügt sich in das Raster des umschließenden <i>Formularelements</i> oder <i>Feldelements</i> ein, anstatt ein eigenes Raster zu eröffnen: Die Felder innerhalb eines Abschnitts sind Spalte für Spalte mit den Feldern außerhalb des Abschnitts ausgerichtet. </p> <p> Ein Abschnitt erstreckt sich über die gesamte Breite dieses Rasters. Ein Abschnitt, der sich hingegen nur über eine einzige Spalte erstreckt, beschränkt seinen Inhalt auf diese Spalte, in der die Elemente untereinander gestapelt werden. </p>
com.top_logic.layout.view.element.GroupItemElement = Gruppenelement
com.top_logic.layout.view.element.GroupItemElement.Config.expanded = Aufgeklappt
com.top_logic.layout.view.element.GroupItemElement.Config.expanded.tooltip = Ob die Gruppe für einen Benutzer, der sie zuvor noch nicht zusammengeklappt hat, aufgeklappt ist.
com.top_logic.layout.view.element.GroupItemElement.Config.icon = Symbol
com.top_logic.layout.view.element.GroupItemElement.Config.icon.tooltip = Die neben der Überschrift angezeigte CSS-Symbolklasse (z. B. "bi bi-gear").
com.top_logic.layout.view.element.GroupItemElement.Config.items = Einträge
com.top_logic.layout.view.element.GroupItemElement.Config.items.tooltip = Die unter der Überschrift zusammengefassten Einträge.
com.top_logic.layout.view.element.GroupItemElement.Config.label = Bezeichnung
com.top_logic.layout.view.element.GroupItemElement.Config.label.tooltip = Die Überschrift, unter der die Gruppe zusammengefasst ist.
com.top_logic.layout.view.element.GroupItemElement.tooltip = Eine zusammenklappbare Gruppe weiterer Elemente eines <i>Seitenleistenelements</i>. <p> Die Gruppe fasst Elemente unter einer Überschrift zusammen, die der Benutzer einklappen kann. Ob sie eingeklappt ist, wird für jeden Benutzer unter der ID der Gruppe gespeichert, sodass sich die Seitenleiste so öffnet, wie sie zuletzt hinterlassen wurde. </p> <p> Eine Gruppe enthält Elemente, keinen Inhalt: Die darin enthaltenen Navigationselemente führen zu denselben Zielen wie auf der obersten Ebene der Seitenleiste und werden in der Seitenleiste selbst aufgerufen. Eine Gruppe ist somit verschachtelt – eine Gruppe innerhalb einer Gruppe –, ohne dass sich die Darstellung der Elemente ändert. </p>
com.top_logic.layout.view.element.HeaderItemElement = Überschriftselement
com.top_logic.layout.view.element.HeaderItemElement.Config.icon = Symbol
com.top_logic.layout.view.element.HeaderItemElement.Config.icon.tooltip = Die neben der Überschrift angezeigte CSS-Symbolklasse (z. B. "bi bi-gear").
com.top_logic.layout.view.element.HeaderItemElement.Config.label = Bezeichnung
com.top_logic.layout.view.element.HeaderItemElement.Config.label.tooltip = Die Überschrift, die den Abschnitt benennt.
com.top_logic.layout.view.element.HeaderItemElement.tooltip = Eine Überschrift, die die ihr folgenden Einträge eines <i>Seitenleistenelements</i> benennt. <p> Die Überschrift ist eine Bezeichnung, kein Ziel: Sie führt nirgendwohin und kann nicht aktiviert werden. Sie unterteilt eine lange Navigation in benannte Abschnitte, die alle sichtbar bleiben, während eine Gruppe sie zusammenklappen würde. </p>
com.top_logic.layout.view.element.HtmlDisplay = HTML-Darstellung
com.top_logic.layout.view.element.HtmlDisplay.DOCUMENT = Dokument
com.top_logic.layout.view.element.HtmlDisplay.DOCUMENT.tooltip = Eine eigene Seite. <p> Der Inhalt wird als eigenständiges Dokument angezeigt und füllt den dem Element zugewiesenen Platz aus. Er behält die Stile, die er mitbringt, und übernimmt keine Stile der Seite; Skripte, die er enthält, werden nicht ausgeführt. </p>
com.top_logic.layout.view.element.HtmlDisplay.INLINE = Inline
com.top_logic.layout.view.element.HtmlDisplay.INLINE.tooltip = Als Teil der umgebenden Seite (Standardeinstellung). <p> Der Inhalt wird an der Stelle des Elements eingefügt und erhält das Layout der Seite, in die er eingebettet wird, sodass er als Teil dieser Seite erscheint. Es wird nur der Inhalt eingefügt, der die Sicherheitsprüfung besteht; abgelehnter Inhalt wird durch eine entsprechende Meldung ersetzt. </p>
com.top_logic.layout.view.element.HtmlDisplay.THUMBNAIL = Miniaturansicht
com.top_logic.layout.view.element.HtmlDisplay.THUMBNAIL.tooltip = Eine verkleinerte Vorschau. <p> Der Inhalt wird als Dokument dargestellt, das der Leser eher betrachtet als liest: skaliert, um sich dem für das Element vorgesehenen Platz anzupassen, so wie eine Dokumentliste eine Vorschau auf die darin aufgeführten Elemente bietet. </p>
com.top_logic.layout.view.element.HtmlDisplay.tooltip = Wie ein <i>HTML-Element</i> seinen HTML-Inhalt darstellt.
com.top_logic.layout.view.element.HtmlElement = HTML-Element
com.top_logic.layout.view.element.HtmlElement.Config.display = Anzeige
com.top_logic.layout.view.element.HtmlElement.Config.display.tooltip = Wie der Inhalt angezeigt wird.
com.top_logic.layout.view.element.HtmlElement.Config.input = Eingabe
com.top_logic.layout.view.element.HtmlElement.Config.input.tooltip = Kanal, dessen Wert als HTML angezeigt wird. <p> Der HTML-Quellcode als Text, ein Fragment, das durch ein HTML-Literal eines Skriptausdrucks erzeugt wurde, oder ein Dokument vom Inhaltstyp „text/html“. Ein Wert eines anderen Typs wird anstelle des Inhalts gemeldet. </p>
com.top_logic.layout.view.element.HtmlElement.Config.print = Drucken
com.top_logic.layout.view.element.HtmlElement.Config.print.tooltip = Ob bei Inhalten, die als Dokument angezeigt werden, eine Schaltfläche zum Drucken angezeigt wird. <p> Die Schaltfläche leitet das Dokument an den Druckdialog des Browsers weiter, der auch die Möglichkeit bietet, es als PDF-Datei zu speichern. Eine Miniaturansicht ist ein Bild eines Dokuments und nicht das Dokument selbst und trägt keine solche Schaltfläche, sodass die Einstellung dort keine Wirkung hat. </p>
com.top_logic.layout.view.element.HtmlElement.Config.thumbnail-height = Höhe der Miniaturansicht
com.top_logic.layout.view.element.HtmlElement.Config.thumbnail-height.tooltip = Die Höhe in CSS-Pixeln, in der eine Miniaturansicht ihren Inhalt anordnet. <p> Der Standardwert ist die Höhe einer Seite im Hochformat mit der Breite der Miniaturansicht, sodass als Dokument verfasste Inhalte in den Proportionen des Papiers erscheinen, für das sie gedacht sind. Inhalt, der höher ist, wird am unteren Rand der Vorschau abgeschnitten, wie bei einer Seite. </p>
com.top_logic.layout.view.element.HtmlElement.Config.thumbnail-width = Breite der Miniaturansicht
com.top_logic.layout.view.element.HtmlElement.Config.thumbnail-width.tooltip = Die Breite in CSS-Pixeln, in der eine Miniaturansicht ihren Inhalt anordnet. <p> Eine Miniaturansicht zeigt den Inhalt als die Seite, für die er geschrieben ist, und skaliert diese Seite auf den Platz herunter, den das Element erhält. Es ist also die Breite, die der Inhalt sieht, und nicht die Breite, in der er angezeigt wird. Zusammen mit der Höhe der Miniaturansicht bestimmt sie die Proportionen der Vorschau, die das Seitenverhältnis der beiden beibehält. </p>
com.top_logic.layout.view.element.HtmlElement.tooltip = <i>UI-Element</i>, das HTML-Inhalte über das <i>React-HTML-Steuerelement</i> (TLHtml) anzeigt. <p> Der Inhalt wird aus einem Eingabekanal gelesen und mit diesem synchron gehalten: Ein neuer Wert im Kanal ersetzt den angezeigten Inhalt. Der Kanal kann den HTML-Quellcode als Text, als <i>HTML-Fragment</i> – also das Ergebnis der Auswertung eines HTML-Literals in einem Skriptausdruck – oder als <i>Binärdatendokument</i> vom Inhaltstyp „text/html“ enthalten. Ein Wert eines anderen Typs hat keine HTML-Darstellung, und an seiner Stelle wird eine entsprechende Meldung angezeigt. </p> <p> Inhalte, die als Teil der Seite angezeigt werden, durchlaufen zuerst die HTML-Sicherheitsprüfung der Anwendung. Inhalte, die diese Prüfung ablehnt – ein Skript oder ein Attribut, das ein solches enthält –, werden nicht angezeigt; an ihrer Stelle erscheint die Meldung der Prüfung. Inhalte, die als Dokument oder als Miniaturansicht angezeigt werden, werden nicht geprüft: Sie sind in einem eigenen Frame von der Seite isoliert, in dem kein Skript ausgeführt wird. </p>
com.top_logic.layout.view.element.IconElement = Symbol-Element
com.top_logic.layout.view.element.IconElement.Config.css-class = CSS-Klasse
com.top_logic.layout.view.element.IconElement.Config.css-class.tooltip = Optionale zusätzliche CSS-Klasse, die an die Größenklasse des Icons angehängt wird.
com.top_logic.layout.view.element.IconElement.Config.image = Symbol
com.top_logic.layout.view.element.IconElement.Config.image.tooltip = Das anzuzeigende Symbol.
com.top_logic.layout.view.element.IconElement.Config.size = Größe
com.top_logic.layout.view.element.IconElement.Config.size.tooltip = Die Größenstufe des Icons nach seiner Rolle: <code>sm</code> neben einer Beschriftung (Voreinstellung), <code>md</code>, wo das Icon das Bedienelement ist, <code>lg</code>, wo es eine Aussage ist, <code>glyph</code> für ein Richtungszeichen in einem Control.
com.top_logic.layout.view.element.IconElement.Config.tooltip = Tooltip
com.top_logic.layout.view.element.IconElement.Config.tooltip.tooltip = Der Text, der beim Darüberfahren mit der Maus angezeigt wird. <p> Der Text benennt das Symbol auch für Leser, die es nicht sehen können. Wird dieser Text nicht festgelegt, dient das Symbol lediglich als Verzierung für das, neben dem es steht, und wird nicht angesagt. </p>
com.top_logic.layout.view.element.IconElement.tooltip = Ein Theme-Symbol – ein Font-Icon wie beispielsweise „css:bi bi-chevron-right“ oder eine Bilddatei –, das dekorativ dargestellt oder über seinen Tooltip benannt wird.
com.top_logic.layout.view.element.ImageElement = Bild-Element
com.top_logic.layout.view.element.ImageElement.Config.alt = Alt
com.top_logic.layout.view.element.ImageElement.Config.alt.tooltip = Was das Bild zeigt – für Leser, die es nicht sehen können. <p> Dies ist immer dann erwähnenswert, wenn das Bild eher Informationen vermittelt als nur dekorativen Charakter hat – beispielsweise ein QR-Code zur Registrierung eines Authentifikators, ein Diagramm oder ein Scan. Wird dies nicht festgelegt, wird es lediglich als Bild angezeigt und nichts weiter. </p>
com.top_logic.layout.view.element.ImageElement.Config.aspect-ratio = Seitenverhältnis
com.top_logic.layout.view.element.ImageElement.Config.aspect-ratio.tooltip = Proportionen des Rahmens, in dem das Bild angezeigt wird, als Breite und Höhe, getrennt durch einen Schrägstrich, z. B. „16/9“. <p> Mit festen Proportionen behält der Rahmen seine Form, wenn sich die verfügbare Breite ändert, sodass eine Reihe von Bildern unterschiedlichen Zuschnitts gleichmäßig bleibt. Ohne Angabe übernimmt der Rahmen die Form des Bildes. </p>
com.top_logic.layout.view.element.ImageElement.Config.fit = Einpassung
com.top_logic.layout.view.element.ImageElement.Config.fit.tooltip = Wie ein Bild, dessen Proportionen von denen des Rahmens abweichen, diesen ausfüllt. <p> Dies ist nur dann von Bedeutung, wenn der Rahmen durch <i>Seitenverhältnis</i>, <i>Breite</i> oder <i>Höhe</i> eine eigene Form hat. </p>
com.top_logic.layout.view.element.ImageElement.Config.height = Höhe
com.top_logic.layout.view.element.ImageElement.Config.height.tooltip = Höhe des Rahmens, in dem das Bild angezeigt wird, als CSS-Längenangabe, z. B. „12rem“.
com.top_logic.layout.view.element.ImageElement.Config.input = Eingabe
com.top_logic.layout.view.element.ImageElement.Config.input.tooltip = Kanal, dessen Wert als Bild angezeigt wird. <p> Der Wert besteht entweder aus Bilddaten (Inhaltstyp „image/...“) oder aus einem Text, der die Adresse angibt, von der das Bild geladen wird. Bei jedem anderen Wert – binäre Daten, die der Browser nicht als Bild darstellen kann, oder ein nicht zugehöriges Objekt – wird stattdessen die <i>Ressource</i> angezeigt; gibt es keine, wird nichts angezeigt. </p>
com.top_logic.layout.view.element.ImageElement.Config.lazy = Verzögertes Laden
com.top_logic.layout.view.element.ImageElement.Config.lazy.tooltip = Ob der Browser das Laden des Bildes aufschieben darf, bis es sich dem sichtbaren Bereich der Seite nähert. <p> Für ein Bild weit unten auf einer langen Seite lohnt sich das, für ein sofort sichtbares Bild ist es verkehrt: Es erscheint dann später als nötig. </p>
com.top_logic.layout.view.element.ImageElement.Config.resource = Ressource
com.top_logic.layout.view.element.ImageElement.Config.resource.tooltip = Pfad einer statischen Ressource der Webanwendung, z. B. „/images/logo.svg“. <p> Für sich genommen ist dies das Bild, das das Element anzeigt. Zusammen mit der <i>Eingabe</i> ist es der Platzhalter, der angezeigt wird, solange dieser Kanal kein Bild enthält. </p>
com.top_logic.layout.view.element.ImageElement.Config.width = Breite
com.top_logic.layout.view.element.ImageElement.Config.width.tooltip = Breite des Rahmens, in dem das Bild angezeigt wird, als CSS-Längenangabe, z. B. „12rem“.
com.top_logic.layout.view.element.ImageElement.tooltip = <i>UI-Element</i>, das ein Bild über das <i>React-Image-Control</i> anzeigt. <p> Das Bild ist entweder eine Ressource der Webanwendung oder wird aus einem Eingabekanal gelesen (z. B. eine QR-Code-PNG-Datei, die eine <i>View-Aktion</i> in einen Dialogkanal eingefügt hat) und mit diesem Kanal synchron gehalten: Ändert sich der Kanalwert, wird das angezeigte Bild aktualisiert. Sind beide konfiguriert, ist die Ressource der Platzhalter, der angezeigt wird, solange der Kanal kein Bild enthält. </p> <p> Der Rahmen, in dem das Bild angezeigt wird, wird durch Proportionen, Breite und Höhe beschrieben; ist keines davon angegeben, behält das Bild seine natürliche Größe, begrenzt auf die verfügbare Breite. </p>
com.top_logic.layout.view.element.InsetElement = Eingebettetes Element
com.top_logic.layout.view.element.InsetElement.tooltip = Ein UIElement, das seinen Inhalt vom Rand des umgebenden Containers zurückversetzt. <p> Im Abstandsmodell sind Container standardmäßig bündig angeordnet, und der Inhalt verfügt über eigenen Freiraum. Ein „ <inset> “ wird an einer Stelle in die Ansicht eingefügt, an der der Inhalt andernfalls direkt am Rand anliegen würde – z. B. um einen Stapel oder ein Raster von Karten herum oder um Erläuterungstext in einem Dialogfeld. </p>
com.top_logic.layout.view.element.JobStatusElement = Auftragsstatus
com.top_logic.layout.view.element.JobStatusElement.Config.input = Eingabe
com.top_logic.layout.view.element.JobStatusElement.Config.input.tooltip = Der Kanal, über den der Auftrag berichtet und der den Zustand des anzuzeigenden Auftrags hält. <p> Dies ist der Kanal, an den ein gestarteter Auftrag seine Momentaufnahmen veröffentlicht. Ein Kanal, der keinen Auftrag hält, zeigt nichts an; eine Ansicht, die das Starten eines Auftrags anbietet, braucht daher für die Zeit vor dem ersten Start keinen eigenen Fall. </p>
com.top_logic.layout.view.element.JobStatusElement.tooltip = <i>UI-Element</i>, das den lang laufenden Auftrag anzeigt, über den sein Eingabekanal berichtet, über das <i>React-Steuerelement für den Auftragsstatus</i>. <p> Der Kanal hält die Momentaufnahmen des <i>Auftragszustands</i>, die der Auftrag veröffentlicht; ein Kanal, der etwas anderes hält – vor dem Start gar nichts –, zeigt keinen Auftrag an. Jeder Text wird hier für den Leser aufgelöst: die Schritte und die Meldung über ihren <i>Ressourcenschlüssel</i>, das Ergebnis des Auftrags über die <i>Standardbeschriftung</i>, so wie jeder andere Wert eines Kanals zu einem Text wird. </p> <p> Die Anzeige folgt allein dem Kanal. Eine Momentaufnahme ist unveränderlich; ein Auftrag, der Neues zu melden hat, veröffentlicht daher eine neue, und es ändert sich kein Objekt, das die Anzeige beobachten müsste. </p>
com.top_logic.layout.view.element.LayerElement = Ebene
com.top_logic.layout.view.element.LayerElement.Config.position = Position
com.top_logic.layout.view.element.LayerElement.Config.position.tooltip = Wo der Inhalt über der Basis des umgebenden Overlays sitzt: ob er sie vollständig überdeckt oder an einer ihrer Kanten, einer Ecke oder in der Mitte verankert ist.
com.top_logic.layout.view.element.LayerElement.tooltip = Inhalt eines <i>Overlay-Elements</i> zusammen mit der Position, die er über der Basis einnimmt. <p> Eine Ebene wird innerhalb eines Overlays geschrieben, wenn ihr Inhalt eine eigene Position braucht – eine Bildunterschrift am unteren Rand eines Bildes, ein Abzeichen in der Ecke eines Avatars. Inhalt, der die ganze Basis überdeckt, braucht keine Ebene um sich herum: Ein direkt im Overlay geschriebenes Element ist bereits eine solche Ebene. </p> <p> Außerhalb eines Overlays ist eine Ebene eine einfache Gruppe ihrer untergeordneten Elemente: Die Position liest das umgebende Overlay aus ihr ab, und wo es keines gibt, gibt es auch nichts, wogegen positioniert werden könnte. </p>
com.top_logic.layout.view.element.LoginCommandsElement = Element „Anmeldebefehle“
com.top_logic.layout.view.element.LoginCommandsElement.tooltip = <i>UI-Element</i>, das die zusätzlichen Befehle für den Anmeldedialog rendert, die über <i>die Konfiguration der Anmeldebefehle</i> bereitgestellt werden (z. B. eine Selbstbedienungsschaltfläche „Passwort vergessen?“ oder SSO-Anbieter). <p> Im Gegensatz zu <stack> werden die untergeordneten Elemente nicht inline konfiguriert, sondern aus der Anwendungskonfiguration übernommen, sodass optionale Funktionsmodule Schaltflächen bereitstellen können, ohne dass das Basisansichtsmodul davon abhängig ist. Zeigt nichts an, wenn kein Befehl bereitgestellt wird. </p>
com.top_logic.layout.view.element.LoginMethodsElement = Element „Anmeldemethoden“
com.top_logic.layout.view.element.LoginMethodsElement.tooltip = <i>UI-Element</i>, das pro externer <i>Anmeldemethode</i>, die über <i>die Anmeldemethoden</i> bereitgestellt wird (z. B. SSO-Anbieter), eine Weiterleitungsschaltfläche anzeigt. <p> Jede Schaltfläche führt zu einer seitenweiten Browser-Weiterleitung zur Start-URL der jeweiligen Methode und kehrt anschließend zu der vom Besucher angeforderten Seite zurück. Da keine Schaltfläche angezeigt wird, wenn keine Anmeldemethode konfiguriert ist, kann dieses Element bedingungslos in jeder Anmeldeseite platziert werden. </p>
com.top_logic.layout.view.element.MaintenanceNoticeElement = Element „Wartungshinweis“
com.top_logic.layout.view.element.MaintenanceNoticeElement.tooltip = Informiert den Benutzer über das Wartungsfenster der Anwendung. <p> Das Element wird im Bereich „ <notices> “ eines „ <app-shell> “ platziert und zeigt einen Balken an, solange ein Wartungsfenster angekündigt oder aktiv ist, während es im Normalbetrieb nichts anzeigt. Es ist somit das Gegenstück aus der „New World“ zur „MaintenanceViewConfiguration“ aus der „Old World“, die dem Meldungsbereich der klassischen Benutzeroberfläche ein „MaintenanceControl“ zur Verfügung stellt. </p> <p> Das Element registriert einen <i>Wartungsstatus-Listener</i> für das <i>Wartungsfenster</i>, sodass ein bereits angemeldeter Benutzer die Ankündigung sofort sieht, sobald ein Administrator sie veröffentlicht, ohne dass eine Neu ladung erforderlich ist. Da der Manager vom ClusterManager gespeist wird, funktioniert dies auch über Clusterknoten hinweg. </p>
com.top_logic.layout.view.element.MenuElement = Menü-Element
com.top_logic.layout.view.element.MenuElement.tooltip = Ein Dropdown-Menü, dessen untergeordnete Elemente als Auslöser dienen. <p> Die untergeordneten Elemente stellen den Auslöser dar – einen Avatar, ein Symbol, eine Bezeichnung oder eine beliebige Kombination daraus – und durch Klicken darauf wird ein Menü mit den für dieses Element definierten Befehlen geöffnet, das darunter verankert ist. Verwenden Sie dies anstelle einer Reihe von Schaltflächen, wann immer eine Gruppe von Befehlen zu einem bestimmten Element gehört und nicht zu der Oberfläche, auf der sie sich befinden: Das Kontomenü einer App-Leiste ist das klassische Beispiel hierfür. </p> <p> Jeder deklarierte Befehl wird zu einem Eintrag, unabhängig von seiner Platzierung: Ein Befehl, der innerhalb eines Menüs geschrieben ist, ist per Definition ein Eintrag dieses Menüs. Einträge, die der aktuelle Benutzer nicht sehen darf, werden automatisch ausgeblendet, da ein Befehl, der aufgrund seiner Ausführungsregel verborgen ist, nicht angeboten wird. </p> <p> Beispiel: </p><pre> &lt;menu&gt; &lt;avatar input="currentUser"/&gt; &lt;commands&gt; &lt;logout-command image="css:bi bi-box-arrow-right"&gt; &lt;label&gt;&lt;en&gt;Log out&lt;/en&gt;&lt;/label&gt; &lt;/logout-command&gt; &lt;/commands&gt; &lt;/menu&gt; </pre>
com.top_logic.layout.view.element.OverlayElement = Overlay-Element
com.top_logic.layout.view.element.OverlayElement.tooltip = <i>UI-Element</i>, das Inhalt über einem Basiselement stapelt. <p> Das erste untergeordnete Element ist die Basis; jedes weitere wird darüber platziert. Ein untergeordnetes Element, das eine <i>Ebene</i> ist, bringt seine Position und eine eigene CSS-Klasse mit; jedes andere überdeckt die Basis vollständig. Eine Bildunterschrift über einem Bild, ein Abzeichen in der Ecke eines Avatars und ein Schleier über einer Karte sind ein und dieselbe Komposition. </p> <p> Die Basis gibt dem Overlay seine Höhe; seine Breite ist die, die das umgebende Layout gewährt, und eine relativ zum Overlay bemessene Basis füllt es aus. Eine Basis mit fester Breite braucht einen Container, der seine Elemente nicht dehnt, etwa einen an seinem Anfang ausgerichteten Stack: über seine Basis hinaus gedehnt, verankert das Overlay seine Ebenen an der freien Fläche neben der Basis statt an der Basis. </p> <p> Eine Ebene lässt den Mauszeiger überall dort durch, wo sie nichts anzeigt, sodass die Basis unter dem freien Bereich einer Ebene, die nur ein kleines Element verankert, bedienbar bleibt. </p>
com.top_logic.layout.view.element.PanelElement = Paneel-Element
com.top_logic.layout.view.element.PanelElement.Config.appearance = Aussehen
com.top_logic.layout.view.element.PanelElement.Config.appearance.tooltip = Die visuelle Variante des Panels: „Karte“ zeigt ein umrandetes, abgerundetes Panel mit kompakten Innenabständen, z. B. für einen Eintrag einer Objektliste.
com.top_logic.layout.view.element.PanelElement.Config.fill = Füllen
com.top_logic.layout.view.element.PanelElement.Config.fill.tooltip = Ob das Panel die festgelegte Höhe seines Containers ausfüllt, anstatt mit dessen Inhalt mitzuwachsen. <p> Aktivieren Sie diese Option für ein Panel, dessen einziges untergeordnetes Element intern scrollt – insbesondere für eine Tabelle (<i>Table-View-Steuerelement</i>), die ihren Scroll-Viewport nur dann begrenzt (und virtualisiert), wenn ihr Container eine bestimmte Höhe hat. Ein einfaches (nicht ausfüllendes) Panel wächst mit seinem Inhalt mit, sodass eine große Tabelle überlaufen und den umgebenden Tab statt sich selbst scrollen würde. </p> <p> Die Container zwischen einem ausfüllenden Panel und der nächsten begrenzten Box wachsen mit, sodass das Panel die verfügbare Höhe ausfüllt, wo immer es sitzt – verschachtelt in Stacks, in einem Tab oder im Frame eines Drilldown-Stacks. </p>
com.top_logic.layout.view.element.PanelElement.Config.hover-actions = Hover-Aktionen
com.top_logic.layout.view.element.PanelElement.Config.hover-actions.tooltip = Ob die Schaltflächen der Symbolleiste in der Kopfzeile ausgeblendet bleiben, bis der Mauszeiger über das Feld bewegt wird oder eine Schaltfläche den Tastaturfokus erhält. <p> Reduziert visuelle Unruhe bei sich wiederholenden Feldern wie beispielsweise Kommentarlisten. Beachten Sie, dass es auf Touch-Geräten keinen Hover-Effekt gibt; die Schaltflächen werden dort angezeigt, sobald ein Steuerelement innerhalb des Feldes den Fokus erhält. </p>
com.top_logic.layout.view.element.PanelElement.Config.title = Titel
com.top_logic.layout.view.element.PanelElement.Config.title-content = Titelinhalt
com.top_logic.layout.view.element.PanelElement.Config.title-content.tooltip = Elemente, die im Titelbereich der Kopfzeile dargestellt werden, z. B. ein Avatar mit einem Namen und einem Zeitstempel. <p> Werden nach dem <i>Titeltext</i> dargestellt; mehrere Elemente werden in einer horizontalen Reihe angeordnet. </p>
com.top_logic.layout.view.element.PanelElement.Config.title.tooltip = Der Titel des Bereichs, der in der Kopfzeile der Symbolleiste angezeigt wird.
com.top_logic.layout.view.element.PanelElement.Config.width = Breite
com.top_logic.layout.view.element.PanelElement.Config.width.tooltip = Die Breite des Panels selbst, als CSS-Längenangabe, z. B. 380px. <p> Ein Panel mit seiner eigenen Breite erstreckt sich nicht über den gesamten Container, sodass die Ausrichtung des Containers bestimmt, wo es platziert wird: Innerhalb eines „ <stack align="center"> “ wird es zentriert – so wird ein Formular mit fester Breite auf einer ansonsten leeren Seite platziert. Die Breite ist eine Einstellung, kein Mindestwert – das Panel wächst niemals über den verfügbaren Platz hinaus. </p> <p> Ist die Einstellung nicht festgelegt, nimmt das Panel die Breite an, die sein Container bietet. </p>
com.top_logic.layout.view.element.PanelElement.tooltip = UIElement, das das <i>Panel-Steuerelement react</i> umhüllt. <p> Rendert ein betiteltes Panel mit einem Toolbar-Header. Befehle, die im Abschnitt <commands> konfiguriert sind, stehen untergeordneten Elementen über den Befehlsbereich zur Verfügung und in der Symbolleiste platzierte Befehle werden automatisch als Schaltflächen der Clique gruppiert dargestellt. </p>
com.top_logic.layout.view.element.PdfElement = PDF-Element
com.top_logic.layout.view.element.PdfElement.Config.input = Eingabe
com.top_logic.layout.view.element.PdfElement.Config.input.tooltip = Kanal, dessen <i>Binärdatenwert</i> (ein PDF-Dokument) angezeigt wird.
com.top_logic.layout.view.element.PdfElement.tooltip = <i>UI-Element</i>, das ein PDF-Dokument <i>mit binären Daten</i> über das <i>React-PDF-Viewer-Steuerelement</i> (TLPdfViewer) anzeigt. <p> Die PDF-Datei wird aus einem Eingabekanal gelesen und mit diesem Kanal synchronisiert: Wenn sich der Kanalwert ändert, wird das angezeigte Dokument aktualisiert. Dieses Element ist das deklarative Rendering-Ziel für PDF-Inhalte; ein übergeordneter Office-Dokument-Viewer kann .docx-, .xlsx- und .pptx-Dateien in PDF konvertieren und das Ergebnis an denselben Kanal binden. </p>
com.top_logic.layout.view.element.ProgressElement = Fortschritt
com.top_logic.layout.view.element.ProgressElement.Config.done = Erledigt
com.top_logic.layout.view.element.ProgressElement.Config.done.tooltip = TL-Script-Ausdruck, der angibt, wie viel erledigt ist – der Zähler des Anteils. <p> Wird zusammen mit der Gesamtzahl angegeben und niemals zusammen mit dem Anteil. </p>
com.top_logic.layout.view.element.ProgressElement.Config.fraction = Anteil
com.top_logic.layout.view.element.ProgressElement.Config.fraction.tooltip = TL-Script-Ausdruck, der den gefüllten Teil des Balkens angibt, eine Zahl zwischen 0 und 1. <p> Ausgenommen sind die beiden Zählwerte, die dasselbe aussagen wie ein Verhältnis. Ein Ausdruck, der gar nichts zurückgibt – ein Balken über einer Operation, die nicht weiß, wie weit sie fortgeschritten ist –, lässt den Balken ohne Anteil zurück, den der Client dann eher abträgt, als ihn zu füllen. </p>
com.top_logic.layout.view.element.ProgressElement.Config.input = Eingabe
com.top_logic.layout.view.element.ProgressElement.Config.input.tooltip = Kanal, mit dessen Wert jeder Ausdruck dieses Elements aufgerufen wird und dessen Änderung den Balken neu berechnet. <p> Ein aus dem gesamten Modell berechneter Balken benötigt keinen solchen Kanal; seine Ausdrücke werden dann ohne Wert aufgerufen. </p>
com.top_logic.layout.view.element.ProgressElement.Config.label = Bezeichnung
com.top_logic.layout.view.element.ProgressElement.Config.label.tooltip = TL-Script-Ausdruck, der den neben dem Balken angezeigten Text angibt. <p> Ohne ihn trägt ein durch zwei Zahlen angegebener Balken diese als Bezeichnung („3 / 7“), und ein durch einen Anteil angegebener Balken trägt keine. </p>
com.top_logic.layout.view.element.ProgressElement.Config.observed-types = Beobachtete Typen
com.top_logic.layout.view.element.ProgressElement.Config.observed-types.tooltip = Typen, deren Objektänderungen (Anlegen, Ändern, Löschen) den Balken neu berechnen – zusätzlich zum Objekt auf dem Eingabekanal, das immer beobachtet wird. <p> Für einen Balken zu konfigurieren, dessen Zahlen über das Eingabeobjekt hinausreichen: einen, der alle Objekte eines Typs zählt, oder die Elemente einer Sammlung, die die Eingabe nur enthält. </p>
com.top_logic.layout.view.element.ProgressElement.Config.total = Gesamt
com.top_logic.layout.view.element.ProgressElement.Config.total.tooltip = TL-Script-Ausdruck, der angibt, wie viel es insgesamt gibt – der Nenner des Anteils. <p> Wird zusammen mit dem Erledigten angegeben und niemals zusammen mit dem Anteil. Eine Gesamtzahl von null lässt den Balken leer. </p>
com.top_logic.layout.view.element.ProgressElement.tooltip = <i>UI-Element</i>, das einen Bruch als Balken mit optionaler Bezeichnung mithilfe des <i>React-Progress-Controls</i> anzeigt. <p> Der Bruch wird entweder direkt als Zahl zwischen 0 und 1 angegeben oder als Verhältnis der beiden Zahlen – beispielsweise „3 von 7 erledigt“, was auch die Bezeichnung dieses Balkens ist, sofern keine andere angegeben wird. Die beiden Formen schließen sich gegenseitig aus. </p> <p> Ein Bruch, der überhaupt keine Aussage trifft, ist der unbestimmte Balken: Er zeigt an, dass etwas im Gange ist, ohne anzugeben, wie weit der Vorgang fortgeschritten ist, und der Client bewegt den Cursor darüber, anstatt einen bestimmten Anteil davon auszufüllen. Ein Balken, der auf einen Vorgang folgt, dessen Anteil erst später bekannt wird, wechselt daher je nach Status des Vorgangs zwischen den beiden Darstellungsarten hin und her. </p> <p> Jeder Ausdruck wird mit dem aktuellen Wert des Eingangskanals aufgerufen, und der Balken wird neu berechnet, sobald sich dieser Wert ändert, sobald sich das darauf befindliche Objekt ändert und sobald ein Objekt eines beobachteten Typs erstellt, geändert oder gelöscht wird – ein Balken, der die Elemente einer Auflistung zählt, folgt dem Hinzufügen oder Verlassen eines Elements nur über Letzteres. </p>
com.top_logic.layout.view.element.RelativeTimeElement = Relative Zeit
com.top_logic.layout.view.element.RelativeTimeElement.Config.input = Eingabe
com.top_logic.layout.view.element.RelativeTimeElement.Config.input.tooltip = Kanal, dessen Datumswert angezeigt wird.
com.top_logic.layout.view.element.RelativeTimeElement.tooltip = Deklaratives <i>UI-Element</i>, das den Datumswert eines Kanals als relative Zeitangabe („vor 5 Minuten“) anzeigt, wobei der genaue Zeitstempel als Tooltip erscheint.
com.top_logic.layout.view.element.ScrollLinkElement = Scroll-Link-Element
com.top_logic.layout.view.element.ScrollLinkElement.Config.input = Eingabe
com.top_logic.layout.view.element.ScrollLinkElement.Config.input.tooltip = Kanal, der das Objekt bereitstellt, zu dem gescrollt werden soll; der Link ist ausgeblendet, solange er den Wert „null“ hat.
com.top_logic.layout.view.element.ScrollLinkElement.Config.label = Bezeichnung
com.top_logic.layout.view.element.ScrollLinkElement.Config.label.tooltip = TL-Script-Funktion zur Berechnung des Linktextes aus dem Zielobjekt: Ziel -&gt; Text. <p> Ist diese Option nicht gesetzt, wird die Bezeichnung des Zielobjekts verwendet. </p>
com.top_logic.layout.view.element.ScrollLinkElement.tooltip = Deklaratives <i>UI-Element</i>, das einen Link rendert, der die Ansicht zum &lt;anchor&gt; des Objekts auf dem Eingabekanal scrollt. <p> Der Link ist ausgeblendet, solange die Eingabe null ist, sodass er erst dann einen Verweis auf „zitiert“/„Antworten an“ anzeigen kann, wenn dieser gesetzt ist. Der Linktext ist die Bezeichnung des Objekts oder das Ergebnis einer optionalen Bezeichnungsfunktion. </p> <p> Der Link wird ebenfalls ausgeblendet, sobald sein Zielobjekt gelöscht wird: Sein Anker wird dann nicht mehr dargestellt, sodass ein Scrollen dorthin ins Leere führen würde. Dadurch bleibt ein Zitierlink auch dann mit dem Modell konsistent, wenn das zitierte Objekt entfernt wird – selbst wenn der Kanal das nun gelöschte Objekt weiterhin enthält. </p>
com.top_logic.layout.view.element.SessionTimeoutNoticeElement = Element „Hinweis zum Ablauf der Sitzung“
com.top_logic.layout.view.element.SessionTimeoutNoticeElement.Config.lead-seconds = Vorwarnzeit (Sekunden)
com.top_logic.layout.view.element.SessionTimeoutNoticeElement.Config.lead-seconds.tooltip = Wie lange vor Ablauf der Sitzung die Warnung angezeigt wird (in Sekunden).
com.top_logic.layout.view.element.SessionTimeoutNoticeElement.tooltip = Weist den Benutzer darauf hin, dass die Sitzung bald endet. <p> Das Element wird im Bereich „ <notices> “ einer <app-shell> platziert und zählt die verbleibende Zeit bis zum Ablauf der Sitzung herunter. Es bleibt dabei unauffällig, bis die verbleibende Zeit unter <i>die Vorwarnzeit (in Sekunden)</i> fällt. </p> <p> Ein Klick auf den Hinweis verlängert die Sitzung: Die durch den Klick ausgelöste Anfrage setzt das Inaktivitäts-Timeout wie jede andere Anfrage zurück, sodass der Countdown von vorne beginnt. </p> <p> Was die Sitzung beendet, bleibt dem Container überlassen – ein Browser, dessen Timer angehalten wurden, weil ein Laptop geschlossen wurde, darf nicht entscheiden, dass eine Sitzung beendet ist, nur weil sein Countdown Null erreicht hat. Der Container verwirft eine abgelaufene Sitzung jedoch erst, sobald eine Anfrage eintrifft: Solange ein Fenster seine SSE-Verbindung offen hält, wird diese nicht bereinigt, sodass niemand dem Browser mitteilen würde, dass seine Sitzung beendet ist. Der Client fragt daher nach Ablauf einer Karenzzeit, nachdem der Countdown Null erreicht hat, und die Antwort liegt beim Server – entweder das Neuladen jedes Fensters einer beendeten Sitzung oder eine neue Frist. </p>
com.top_logic.layout.view.element.SidebarElement = Element der Seitenleiste
com.top_logic.layout.view.element.SidebarElement$NavItemElement = Nav-Element
com.top_logic.layout.view.element.SidebarElement$NavItemElement.tooltip = Implementierung eines Elements in der Navigationsleiste.
com.top_logic.layout.view.element.SidebarElement$SeparatorElement = Abscheider-Element
com.top_logic.layout.view.element.SidebarElement$SeparatorElement.tooltip = Implementierung eines Trennseitenleistenelements.
com.top_logic.layout.view.element.SidebarElement.Config.active-item = Aktiver Artikel
com.top_logic.layout.view.element.SidebarElement.Config.active-item.tooltip = Die ID des ersten aktiven Elements oder leer für das erste Navigationselement.
com.top_logic.layout.view.element.SidebarElement.Config.collapsed = Zusammengeklappt
com.top_logic.layout.view.element.SidebarElement.Config.collapsed.tooltip = Ob die Seitenleiste eingeklappt beginnt.
com.top_logic.layout.view.element.SidebarElement.Config.drawer-open-slot-name = Slot-Name für Drawer-Schaltfläche
com.top_logic.layout.view.element.SidebarElement.Config.drawer-open-slot-name.tooltip = Name des Slots, in den die Seitenleiste eine Hamburger-Schaltfläche zum Öffnen des mobilen Drawers einbringt. Leer lassen, um den Beitrag vollständig zu unterdrücken.
com.top_logic.layout.view.element.SidebarElement.Config.footer = Fußzeile
com.top_logic.layout.view.element.SidebarElement.Config.footer-collapsed = Fußzeile eingeklappt
com.top_logic.layout.view.element.SidebarElement.Config.footer-collapsed.tooltip = Was die Leiste unterhalb ihrer Einträge anzeigt, während sie zu einem schmalen Streifen eingeklappt ist. <p> Eine eingeklappte Leiste bietet Platz für ein Avatarbild, nicht für einen Namen daneben; sie zeigt daher dies anstelle der Fußzeile. Bleibt die Angabe leer, hat die eingeklappte Leiste keine Fußzeile. </p>
com.top_logic.layout.view.element.SidebarElement.Config.footer.tooltip = Was die Leiste unterhalb ihrer Einträge anzeigt: den Kontobereich, einen Versionshinweis, einen Hilfe-Link. <p> Der Inhalt steht am unteren Rand der Leiste, außerhalb der Liste der Einträge, und wird angezeigt, solange die Seitenleiste zu sehen ist. Bleibt die Angabe leer, endet die Leiste mit ihrem letzten Eintrag. </p>
com.top_logic.layout.view.element.SidebarElement.Config.header = Kopfzeile
com.top_logic.layout.view.element.SidebarElement.Config.header-collapsed = Kopfzeile eingeklappt
com.top_logic.layout.view.element.SidebarElement.Config.header-collapsed.tooltip = Was die Leiste oberhalb ihrer Einträge anzeigt, während sie zu einem schmalen Streifen eingeklappt ist. <p> Eine eingeklappte Leiste bietet Platz für ein Symbol, nicht für einen Namen und ein Suchfeld; sie zeigt daher dies anstelle der Kopfzeile. Bleibt die Angabe leer, hat die eingeklappte Leiste keine Kopfzeile. </p>
com.top_logic.layout.view.element.SidebarElement.Config.header.tooltip = Was die Leiste oberhalb ihrer Einträge anzeigt: ein Produktlogo, den Namen der Anwendung, ein Suchfeld. <p> Der Inhalt steht am oberen Rand der Leiste, außerhalb der Liste der Einträge, und wird angezeigt, solange die Seitenleiste zu sehen ist. Bleibt die Angabe leer, beginnt die Leiste mit ihrem ersten Eintrag. </p>
com.top_logic.layout.view.element.SidebarElement.Config.items = Artikel
com.top_logic.layout.view.element.SidebarElement.Config.items.tooltip = Die Einträge der Seitenleiste.
com.top_logic.layout.view.element.SidebarElement.NavItemConfig.badge = Badge
com.top_logic.layout.view.element.SidebarElement.NavItemConfig.badge.tooltip = Kanal, dessen Wert als Badge neben der Bezeichnung des Elements angezeigt wird – beispielsweise die Anzahl der Elemente, die auf der Seite warten, zu der das Element führt. <p> Der Wert wird so benannt, wie es das Modell über die <i>Standardbezeichnung</i> vorsieht; wenn kein Wert angegeben ist und der Text leer ist, wird überhaupt kein Badge angezeigt. Der Badge wird sowohl bei einem neuen Wert im Kanal als auch bei einer Änderung des Objekts, auf das dieser Wert verweist, aktualisiert, sodass eine aus einem bearbeiteten Objekt berechnete Zählung auf dem neuesten Stand ist, ohne dass der Kanal neu geschrieben werden muss. </p>
com.top_logic.layout.view.element.SidebarElement.NavItemConfig.children = Kinder
com.top_logic.layout.view.element.SidebarElement.NavItemConfig.children.tooltip = Die Inhaltselemente, die angezeigt werden, wenn dieses Element ausgewählt wird.
com.top_logic.layout.view.element.SidebarElement.NavItemConfig.hidden = Versteckt
com.top_logic.layout.view.element.SidebarElement.NavItemConfig.hidden.tooltip = Ob das Element in der Seitenleiste ausgeblendet wird. <p> Ein ausgeblendeter Eintrag wird nicht angezeigt, bleibt aber über seinen Pfad erreichbar: die Seite, zu der eine URL direkt führt und die keinen eigenen Platz in der Navigation hat. </p>
com.top_logic.layout.view.element.SidebarElement.NavItemConfig.icon = Icon
com.top_logic.layout.view.element.SidebarElement.NavItemConfig.icon.tooltip = Die CSS-Symbolklasse (z. B. "bi bi-speedometer2").
com.top_logic.layout.view.element.SidebarElement.NavItemConfig.label = Etikett
com.top_logic.layout.view.element.SidebarElement.NavItemConfig.label.tooltip = Die Anzeigebezeichnung.
com.top_logic.layout.view.element.SidebarElement.NavItemConfig.route = Route
com.top_logic.layout.view.element.SidebarElement.NavItemConfig.route.tooltip = Das Route-Segment für dieses Element. Standardmäßig wird die ID als Route-Segment verwendet. Auf "none" setzen, um Routing explizit zu deaktivieren. Einen anderen Wert setzen, um ein vom ID abweichendes Route-Segment zu verwenden. Routen sind immer relativ.
com.top_logic.layout.view.element.SidebarElement.SidebarItemConfig.id = ID
com.top_logic.layout.view.element.SidebarElement.SidebarItemConfig.id.tooltip = Die eindeutige Artikel-ID.
com.top_logic.layout.view.element.SidebarElement.tooltip = UIElement, das das <i>React-Sidebar-Steuerelement</i> umhüllt. <p> Stellt eine Seitenleiste aus Einträgen dar: Navigationseinträge mit Inhalt, der erst bei Auswahl des Eintrags erzeugt wird, zusammenklappbare Gruppen weiterer Einträge, Überschriften, Einträge, die einen Befehl ausführen, sowie Trennlinien. </p>
com.top_logic.layout.view.element.SplitPanelElement = Geteiltes Flächenelement
com.top_logic.layout.view.element.SplitPanelElement$PaneConfig = Konfiguration des Fensters
com.top_logic.layout.view.element.SplitPanelElement$PaneConfig.tooltip = Konfiguration für einen einzelnen Bereich im geteilten Panel.
com.top_logic.layout.view.element.SplitPanelElement.Config.orientation = Orientierung
com.top_logic.layout.view.element.SplitPanelElement.Config.orientation.tooltip = Die Ausrichtung des Layouts.
com.top_logic.layout.view.element.SplitPanelElement.Config.panes = Scheiben
com.top_logic.layout.view.element.SplitPanelElement.Config.panes.tooltip = Die Definitionen der untergeordneten Fensterbereiche.
com.top_logic.layout.view.element.SplitPanelElement.Config.resizable = Veränderbar
com.top_logic.layout.view.element.SplitPanelElement.Config.resizable.tooltip = Ob ziehbare Trennlinien zwischen den Fenstern angezeigt werden.
com.top_logic.layout.view.element.SplitPanelElement.PaneConfig.children = Kinder
com.top_logic.layout.view.element.SplitPanelElement.PaneConfig.children.tooltip = Die Inhaltselemente in diesem Bereich.
com.top_logic.layout.view.element.SplitPanelElement.PaneConfig.min-size = Mindestgröße
com.top_logic.layout.view.element.SplitPanelElement.PaneConfig.min-size.tooltip = Die Mindestgröße in Pixeln (0 für kein Minimum).
com.top_logic.layout.view.element.SplitPanelElement.PaneConfig.size = Größe
com.top_logic.layout.view.element.SplitPanelElement.PaneConfig.size.tooltip = Die Größe des Fensters in der angegebenen Einheit.
com.top_logic.layout.view.element.SplitPanelElement.PaneConfig.unit = Einheit
com.top_logic.layout.view.element.SplitPanelElement.PaneConfig.unit.tooltip = Die Größeneinheit.
com.top_logic.layout.view.element.SplitPanelElement.tooltip = UIElement, das ein <i>reaktives geteiltes Bedienfeld</i> umschließt. <p> Rendert ein geteiltes Panel mit verschiebbaren Splittern zwischen untergeordneten Panels. Jedes <pane> definiert seine Größe, Einheit und Inhaltselemente. </p>
com.top_logic.layout.view.element.StackElement = Stapel-Element
com.top_logic.layout.view.element.StackElement.Config.align = Ausrichten
com.top_logic.layout.view.element.StackElement.Config.align.tooltip = Die achsübergreifende Ausrichtung.
com.top_logic.layout.view.element.StackElement.Config.direction = Richtung
com.top_logic.layout.view.element.StackElement.Config.direction.tooltip = Die Flex-Richtung.
com.top_logic.layout.view.element.StackElement.Config.gap = Lücke
com.top_logic.layout.view.element.StackElement.Config.gap.tooltip = Die Kluft zwischen Kindern.
com.top_logic.layout.view.element.StackElement.Config.justify = Verteilung
com.top_logic.layout.view.element.StackElement.Config.justify.tooltip = Wie die Kinder entlang der Stapelrichtung verteilt werden. <p> Sind die Kinder zusammen kleiner als der Stapel, entscheidet dies, was mit dem übrigen Platz geschieht: Er bleibt hinter ihnen (Standard), vor ihnen, auf beiden Seiten, oder er wird zwischen ihnen aufgeteilt - ein Titel und die zugehörigen Aktionen an die gegenüberliegenden Enden einer Zeile gerückt, eine Reihe von Schaltflächen unter einem Formular zentriert. </p>
com.top_logic.layout.view.element.StackElement.Config.max-width = Maximale Breite
com.top_logic.layout.view.element.StackElement.Config.max-width.tooltip = Die größte Breite, die der Stapel einnimmt, als CSS-Länge wie "60rem". <p> Ein Stapel begrenzter Breite wird in dem Platz zentriert, den er erhält; der übrige Platz wird auf seine beiden Seiten verteilt. So bleibt eine Spalte mit Fließtext auch auf einem breiten Bildschirm lesbar. Unterhalb der Grenze ändert sich nichts, der Stapel füllt einen schmalen Bildschirm also weiterhin aus. </p> <p> Ohne Angabe nimmt der Stapel die Breite ein, die sein Container bietet. </p>
com.top_logic.layout.view.element.StackElement.Config.wrap = Umbruch
com.top_logic.layout.view.element.StackElement.Config.wrap.tooltip = Ob die Kinder in weitere Zeilen umbrechen, sobald sie nicht mehr nebeneinander passen. <p> Eine umbrechende Zeile behält die Größe ihrer Kinder, statt sie in eine Zeile zu stauchen - so verhält sich eine Reihe von Elementen, die jeweils eine lesbare Breite brauchen (Chips, Karten, Filterschaltflächen), auf einem schmalen Bildschirm. Ohne Angabe bleiben die Kinder in einer Zeile. </p>
com.top_logic.layout.view.element.StackElement.tooltip = UIElement, das das <i>React-Stack-Steuerelement</i> umhüllt. <p> Gibt einen Flexbox-Container wieder, der seine Kinder entlang einer konfigurierbaren Richtung anordnet: mit konfigurierbarem Abstand und konfigurierbarer Ausrichtung, den übrigen Platz wie konfiguriert verteilend, bei Bedarf in weitere Zeilen umbrechend und auf eine Breite begrenzt, in der er dann zentriert wird. </p>
com.top_logic.layout.view.element.SwitchElement = Schaltelement
com.top_logic.layout.view.element.SwitchElement$CaseConfig = Fall-Konfiguration
com.top_logic.layout.view.element.SwitchElement$CaseConfig.tooltip = Konfiguration für ein einzelnes „ <case> “ eines <i>Switch-Elements</i>.
com.top_logic.layout.view.element.SwitchElement.CaseConfig.content = Inhalt
com.top_logic.layout.view.element.SwitchElement.CaseConfig.content.tooltip = Die Inhaltselemente, die angezeigt werden, wenn diese Option ausgewählt wird.
com.top_logic.layout.view.element.SwitchElement.CaseConfig.test = Test
com.top_logic.layout.view.element.SwitchElement.CaseConfig.test.tooltip = TL-Script-Prädikat, das mit dem aktuellen Wert des Eingangskanals des Schalters aufgerufen wird; dieser Fall wird ausgewählt, wenn das Prädikat „true“ zurückgibt.
com.top_logic.layout.view.element.SwitchElement.Config.cases = Fälle
com.top_logic.layout.view.element.SwitchElement.Config.cases.tooltip = Die Fälle werden der Reihe nach ausgewertet; der erste passende Fall wird angezeigt.
com.top_logic.layout.view.element.SwitchElement.Config.default = Standard
com.top_logic.layout.view.element.SwitchElement.Config.default.tooltip = Inhalt, der angezeigt wird, wenn kein „ <case> “-Eintrag gefunden wird; leer, wenn kein Fallback-Inhalt vorhanden ist.
com.top_logic.layout.view.element.SwitchElement.Config.input = Eingabe
com.top_logic.layout.view.element.SwitchElement.Config.input.tooltip = Der Kanal, dessen aktueller Wert an jedes „ <case> “-Testprädikat übergeben wird, um den sichtbaren Inhalt auszuwählen.
com.top_logic.layout.view.element.SwitchElement.Config.observed-types = Beobachtete Typen
com.top_logic.layout.view.element.SwitchElement.Config.observed-types.tooltip = Typen, bei denen sich das Objekt ändert (Erstellen / Aktualisieren / Löschen), lösen zusätzlich zu dem Eingabeobjekt, das stets beobachtet wird, eine Neubewertung der Fälle aus. <p> Konfigurieren Sie dies nur für einen Test, der über das Eingabeobjekt hinausgeht, z. B. einen Test, der anhand eines Attributs des Containers der Eingabe entscheidet: Eine Änderung dieses anderen Objekts ist für die Beobachtung der Eingabe selbst nicht sichtbar. „Leer“ (Standard) beobachtet nur das Eingabeobjekt. </p>
com.top_logic.layout.view.element.SwitchElement.tooltip = Ein UIElement, das genau eine von mehreren konfigurierten Inhaltsansichten anzeigt, wobei die Auswahl durch die Auswertung eines TL-Script-Prädikats pro <case> anhand des Werts eines Eingangskanals erfolgt. <p> Die Fälle werden in der Reihenfolge ihrer Konfiguration geprüft; der erste, dessen Test „true“ zurückgibt, wird angezeigt. Wenn keiner passt, wird der Inhalt von „ <default> “ angezeigt (oder nichts, wenn kein Standardwert konfiguriert ist). Der Schalter wird bei jeder Änderung des Eingabekanals sowie bei einer Änderung des Eingabeobjekts selbst neu ausgewertet (ein Test entscheidet typischerweise anhand eines Attributs dieses Objekts, das bearbeitet werden kann, ohne dass sich der Kanalwert ändert) – siehe <i>„Beobachtete Typen“</i> für Tests, die über das Eingabeobjekt hinausgehen. Die sichtbare Ansicht wird nur dann umgeschaltet, wenn sich der passende Fall tatsächlich ändert – innerhalb eines einzelnen Falls aktualisiert sich der Inhalt (gebunden an seine eigenen Kanäle) selbst. </p> <p> Wenn sich der passende Fall ändert, wird der zuvor angezeigte Inhalt entsorgt und nicht zwischengespeichert, sodass ein ausgeblendeter Fall keine Spuren (z. B. die Befehle „Bearbeiten“, „Speichern“ oder „Abbrechen“ eines Formulars) im umgebenden Geltungsbereich hinterlässt. </p>
com.top_logic.layout.view.element.TabBarElement = Element der Registerkartenleiste
com.top_logic.layout.view.element.TabBarElement$TabConfig = Konfiguration der Registerkarte
com.top_logic.layout.view.element.TabBarElement$TabConfig.tooltip = Konfiguration für eine einzelne Registerkarte.
com.top_logic.layout.view.element.TabBarElement.Config.active-tab = Aktive Registerkarte
com.top_logic.layout.view.element.TabBarElement.Config.active-tab.tooltip = Die ID der anfänglich aktiven Registerkarte, oder leer für die erste Registerkarte.
com.top_logic.layout.view.element.TabBarElement.Config.tabs = Registerkarten
com.top_logic.layout.view.element.TabBarElement.Config.tabs.tooltip = Die Tab-Definitionen.
com.top_logic.layout.view.element.TabBarElement.TabConfig.children = Kinder
com.top_logic.layout.view.element.TabBarElement.TabConfig.children.tooltip = Die Inhaltselemente, die angezeigt werden, wenn diese Registerkarte aktiv ist.
com.top_logic.layout.view.element.TabBarElement.TabConfig.icon = Symbol
com.top_logic.layout.view.element.TabBarElement.TabConfig.icon.tooltip = Die CSS-Symbolklasse, die neben der Bezeichnung des Tabs angezeigt wird (z. B. „css:fa-solid fa-tags“), oder leer, wenn kein Symbol vorhanden ist.
com.top_logic.layout.view.element.TabBarElement.TabConfig.id = ID
com.top_logic.layout.view.element.TabBarElement.TabConfig.id.tooltip = Die eindeutige Kennung der Registerkarte.
com.top_logic.layout.view.element.TabBarElement.TabConfig.label = Etikett
com.top_logic.layout.view.element.TabBarElement.TabConfig.label.tooltip = Die Beschriftung der Registerkarte.
com.top_logic.layout.view.element.TabBarElement.TabConfig.route = Route
com.top_logic.layout.view.element.TabBarElement.TabConfig.route.tooltip = Das Route-Segment für diesen Tab. Standardmäßig wird die Tab-ID als Route-Segment verwendet. Auf "none" setzen, um Routing explizit zu deaktivieren. Einen anderen Wert setzen, um ein vom ID abweichendes Route-Segment zu verwenden. Routen sind immer relativ.
com.top_logic.layout.view.element.TabBarElement.tooltip = UIElement, das das <i>Steuerelement für die Registerkartenleiste</i> umschließt. <p> Stellt eine Registerkartenleiste mit langsam erstellten Inhalten für jede Registerkarte dar. Jedes <tab> Kind in der Konfiguration definiert eine Registerkarte mit einer ID, einem Label und Inline-Inhaltselementen. Bei Auswahl einer Registerkarte werden die Inhaltselemente bei Bedarf erstellt und zwischengespeichert. </p>
com.top_logic.layout.view.element.TableElement = Tabellenelement
com.top_logic.layout.view.element.TableElement$CriterionConfig = Kriteriumskonfiguration
com.top_logic.layout.view.element.TableElement$CriterionConfig.tooltip = Was eine <i>Voreinstellungskonfiguration</i> in einer Spalte auswählt. <p> Ein Kriterium gibt auf eine von zwei Arten an, was ausgewählt wird: entweder als Wert, den der spalteneigene Filter umsetzt, oder in Form dieses Filters selbst. Es wird genau eine der beiden Optionen deklariert. </p>
com.top_logic.layout.view.element.TableElement$DragConfig = Ziehen-Konfiguration
com.top_logic.layout.view.element.TableElement$DragConfig.tooltip = Konfiguration des <drag> eines <i>Tabellenelements</i>: dass seine Zeilen gezogen werden dürfen, und als was sie dabei angekündigt werden.
com.top_logic.layout.view.element.TableElement$DropConfig = Ablegen-Konfiguration
com.top_logic.layout.view.element.TableElement$DropConfig.tooltip = Konfiguration eines <drop> eines <i>Tabellenelements</i>: was es akzeptiert, worauf es zielt und was es tut.
com.top_logic.layout.view.element.TableElement$PresetConfig = Voreinstellungskonfiguration
com.top_logic.layout.view.element.TableElement$PresetConfig.tooltip = Ein Filterkriterium, das ein <i>Tabellenelement</i> unter einem Namen bereitstellt.
com.top_logic.layout.view.element.TableElement$PresetsConfig = Konfiguration der Voreinstellungen
com.top_logic.layout.view.element.TableElement$PresetsConfig.tooltip = Container für die Liste der <i>Voreinstellungskonfigurationen</i> eines <i>Tabellenelements</i>.
com.top_logic.layout.view.element.TableElement.Config.activation-button = Aktivierungsschaltfläche
com.top_logic.layout.view.element.TableElement.Config.activation-button.tooltip = Ob jede Zeile eine Schaltfläche enthält, die den zugehörigen Aktivierungsbefehl ausführt. <p> Die Schaltfläche befindet sich in einer eigenen Spalte am rechten Rand der Tabelle und bleibt dort, auch wenn in der Tabelle gescrollt wird. Sie ermöglicht die Aktivierung der Zeile, wenn die dafür vorgesehenen Gesten – ein Doppelklick oder die Eingabetaste in der Zeile, auf der sich der Cursor befindet – weder sichtbar noch verfügbar sind: Ein Touch-Gerät bietet keine von beiden. Jede Schaltfläche richtet sich nach der Ausführbarkeit des Befehls für die jeweilige Zeile; daher wird bei einer Zeile, die von den Regeln abgelehnt wird, eine deaktivierte Schaltfläche angezeigt, und bei einer Zeile, die ausgeblendet wird, erscheint keine Schaltfläche. </p> <p> Deaktivieren Sie diese Funktion für eine Tabelle, deren Zeilen auf andere Weise geöffnet werden – über einen Link in einer Zelle oder einen Befehl der umgebenden Symbolleiste. Eine Tabelle ohne Aktivierungsbefehl zeigt in keinem Fall eine Schaltfläche an. </p>
com.top_logic.layout.view.element.TableElement.Config.active-preset = Aktive Voreinstellung
com.top_logic.layout.view.element.TableElement.Config.active-preset.tooltip = Optionaler <i>Ansichtskanal</i>, der den Namen des benannten Filters enthält, nach dem diese Tabelle gefiltert wird, und leer ist, wenn keiner der Filter zutrifft. <p> Er enthält sowohl den Namen einer Voreinstellung als auch den generierten Namen eines vom Benutzer gespeicherten Filters und wirkt in beide Richtungen: Ein hineingeschriebener Name filtert die Tabelle nach diesem Filter, und ein Name, den kein Filter trägt – ein Link, dessen Voreinstellung es nicht mehr gibt –, lässt die Tabelle ungefiltert und wird auf das korrigiert, was die Tabelle zeigt. </p> <p> Eine Voreinstellung sagt, welche Zeilen ausgewählt sind, nicht, wonach gesucht wird: Der Name bleibt daher auf dem Kanal stehen, während der Benutzer innerhalb der Voreinstellung sucht. </p> <p> An einen Abfrageparameter gebunden, macht dies zusammen mit dem gesuchten Text eine gefilterte Tabelle verlinkbar. </p>
com.top_logic.layout.view.element.TableElement.Config.columns = Spalten
com.top_logic.layout.view.element.TableElement.Config.columns.tooltip = Die anzuzeigenden Spalten in der Reihenfolge ihrer Anzeige. <p> Ohne Angabe zeigt die Tabelle die Haupteigenschaften ihres Zeilentyps an, und alle nicht ausgeblendeten Attribute, wenn der Typ keine benennt. </p>
com.top_logic.layout.view.element.TableElement.Config.create-type = Typ erstellen
com.top_logic.layout.view.element.TableElement.Config.create-type.tooltip = Der Konkrettyp, der instanziiert wird, wenn im Bearbeitungsmodus eine neue Zeile angelegt wird. <p> Ist dieser Wert nicht gesetzt, bietet die Tabelle keine Zeilenerstellung an. </p>
com.top_logic.layout.view.element.TableElement.Config.drag = Ziehen
com.top_logic.layout.view.element.TableElement.Config.drag.tooltip = Macht die Zeilen dieser Tabelle ziehbar, sodass sie auf einer Anzeige abgelegt werden können, die ihren Typ akzeptiert. <p> Beim Ziehen einer ausgewählten Zeile wird die gesamte Auswahl gezogen, eine nicht ausgewählte Zeile zieht sich selbst. Ohne Angabe (Standard) sind die Zeilen nicht ziehbar. </p>
com.top_logic.layout.view.element.TableElement.Config.drops = Ablegen
com.top_logic.layout.view.element.TableElement.Config.drops.tooltip = Was diese Tabelle akzeptiert und was sie mit den abgelegten Objekten tut. <p> Ein Ablegen wird von dem ersten deklarierten Eintrag angewendet, der es akzeptiert; eine Tabelle kann daher mehrere Arten von Objekten akzeptieren – und eine davon auf ihren Zeilen und eine andere als Ganzes. Ohne Eintrag (Standard) akzeptiert die Tabelle kein Ablegen. </p>
com.top_logic.layout.view.element.TableElement.Config.filter-bar = Filterleiste
com.top_logic.layout.view.element.TableElement.Config.filter-bar.tooltip = Ob die Tabelle ihre Filterleiste anzeigt: die benannten Filter, die sie als Chips anbietet, ein Suchfeld zur Durchsuche der angezeigten Spalten und die Möglichkeit, den aktuellen Filter unter einem selbst gewählten Namen zu speichern. <p> Eine Tabelle, die Voreinstellungen enthält, zeigt die Leiste in jedem Fall an – dort werden die Voreinstellungen angeboten. </p>
com.top_logic.layout.view.element.TableElement.Config.fixed-columns = Feste Spalten
com.top_logic.layout.view.element.TableElement.Config.fixed-columns.tooltip = Wie viele der vorderen Spalten bleiben beim waagerechten Scrollen stehen? <p> Ist die Tabelle breiter als ihr Anzeigebereich, verschwinden die weiteren Spalten hinter diesen. Der Benutzer kann die Grenze verschieben (durch Ziehen oder über das Kontextmenü des Spaltenkopfes); der hier konfigurierte Wert ist der Ausgangszustand, solange keine eigene Personalisierung vorliegt. Null (Standard) hält keine Spalte fest. </p>
com.top_logic.layout.view.element.TableElement.Config.group-by = Gruppieren nach
com.top_logic.layout.view.element.TableElement.Config.group-by.tooltip = Der Name der Spalte, nach deren Wert die Zeilen zunächst gruppiert sind: pro Wert eine einklappbare Kopfzeile, die diesen Wert, die Anzahl der darin enthaltenen Zeilen und die Aggregation der anderen Spalten über diese Zeilen anzeigt. <p> Der Benutzer gruppiert die Tabelle neu, entweder über eine Spaltenüberschrift oder über die Spaltenauswahl, und diese Auswahl wird unter dem Personalisierungsschlüssel der Tabelle gespeichert. Dies ist also die Gruppierung, mit der eine Tabelle beginnt, solange keine eigene Personalisierung vorliegt. Ohne Angabe (Standard) ist die Tabelle zunächst ungruppiert. Die Zeilen werden nach jeweils einer Spalte gruppiert. Die Zeilen werden jeweils nach einer Spalte gruppiert. </p>
com.top_logic.layout.view.element.TableElement.Config.observed-types = Beobachtete Typen
com.top_logic.layout.view.element.TableElement.Config.observed-types.tooltip = Typen, bei denen sich das Objekt ändert (Erstellen / Aktualisieren / Löschen), lösen eine Neubewertung der Zeilen aus, sodass die Tabelle automatisch aktualisiert wird. Bei der Einstellung „Leer“ (Standard) bleibt die Tabelle unverändert.
com.top_logic.layout.view.element.TableElement.Config.on-activate = Bei Aktivierung
com.top_logic.layout.view.element.TableElement.Config.on-activate.tooltip = Der Befehl, der bei der Aktivierung einer Zeile ausgeführt wird – ein Doppelklick auf die Zeile, oder die Eingabetaste, während die Zeile den Tastaturcursor trägt. <p> Die aktivierte Zeile wird zunächst zur Auswahl in der Tabelle, anschließend wird der Befehl mit dieser Zeile als Eingabe ausgeführt. Die Ausführungsregeln des Befehls entscheiden über die Zeile; eine Zeile, die von den Regeln abgelehnt wird, löst daher keine Aktion aus. Ohne Befehl führt die Aktivierung einer Zeile lediglich zu deren Auswahl. </p> <p> Konfiguriert als <on-activate class="..." .../> innerhalb des Elements <table>. </p>
com.top_logic.layout.view.element.TableElement.Config.on-remove = Beim Entfernen
com.top_logic.layout.view.element.TableElement.Config.on-remove.tooltip = Was das Löschen einer Zeile beim Speichern des Formulars bedeutet. <p> Wenn diese Option deaktiviert ist, bietet die Tabelle keine Möglichkeit zum Löschen von Zeilen. </p>
com.top_logic.layout.view.element.TableElement.Config.presets = Voreinstellungen
com.top_logic.layout.view.element.TableElement.Config.presets.tooltip = Filterkriterien, die diese Tabelle unter einem Namen anbietet und die in der Filterleiste als Chips angezeigt werden. <p> Eine Voreinstellung wird mit einem Klick angewendet – und wieder entfernt –, und die Leiste markiert die Voreinstellung, nach deren Kriterien die Tabelle derzeit filtert. Daneben werden die vom Benutzer selbst gespeicherten Filter angezeigt; diese werden unter dem Personalisierungsschlüssel der Tabelle gespeichert, sodass eine Tabelle, die Voreinstellungen anbietet, auch „personalization-key“ konfigurieren sollte. </p>
com.top_logic.layout.view.element.TableElement.Config.row-edit = Zeile bearbeiten
com.top_logic.layout.view.element.TableElement.Config.row-edit.tooltip = Welche Zeilen sind bearbeitbar, während sich das übergeordnete Formular im Bearbeitungsmodus befindet? <p> Wenn diese Option aktiviert ist, muss die Tabelle in ein Formular eingebettet sein; Zellbearbeitungen werden bei Zeilenüberlagerungen zwischengespeichert und zusammen mit dem Speichern des Formulars übernommen. Standardmäßig ist die Tabelle schreibgeschützt. </p>
com.top_logic.layout.view.element.TableElement.Config.rows = Zeilen
com.top_logic.layout.view.element.TableElement.Config.rows.tooltip = TL-Script-Funktion zur Berechnung der Zeilenobjekte (eine <i>Auflistung</i>). <p> Die Werte der deklarierten Eingaben stehen an erster Stelle, in der Reihenfolge ihrer Deklaration. </p>
com.top_logic.layout.view.element.TableElement.Config.search-term = Suchbegriff
com.top_logic.layout.view.element.TableElement.Config.search-term.tooltip = Optionaler <i>Ansichtskanal</i>, der den Text enthält, nach dem diese Tabelle in ihren angezeigten Spalten sucht, und der nichts enthält, wenn nicht gesucht wird. <p> Er wirkt in beide Richtungen: Was der Benutzer in das Suchfeld der Filterleiste eingibt, gelangt in den Kanal, und nach einem in den Kanal geschriebenen Text wird gesucht – so kann eine Tabelle ohne eigene Filterleiste über eine Eingabe an anderer Stelle durchsucht werden. </p> <p> Die Suche schränkt die Zeilen innerhalb dessen ein, wonach die Tabelle gefiltert ist, und lässt diese Filterung unberührt: Eine Voreinstellung, der die Tabelle entspricht, bleibt die aktive Voreinstellung, während nach dem Text gesucht wird. An Abfrageparameter gebunden, ergeben die beiden zusammen eine Adresse: die Voreinstellung und den Text, unter dem der Benutzer die Tabelle sieht. Eine Ausnahme ist ein Filter, den der Benutzer während einer Suche gespeichert hat – er trägt den Text, mit dem er gespeichert wurde, und trifft nur zu, solange genau nach diesem Text gesucht wird. </p>
com.top_logic.layout.view.element.TableElement.Config.selection = Auswahl
com.top_logic.layout.view.element.TableElement.Config.selection-mode = Auswahlmodus
com.top_logic.layout.view.element.TableElement.Config.selection-mode.tooltip = Ob der Benutzer jeweils eine Zeile oder eine beliebige Anzahl von Zeilen auswählen kann. <p> Bei <i>Einzel</i> (Standardeinstellung) ersetzt jeder Klick die Auswahl, und ein Klick mit Strg auf die ausgewählte Zeile hebt sie wieder auf. </p> <p> Bei <i>Mehrere</i> steht vor jeder Zeile ein Kontrollkästchen und in der Kopfzeile eines, das alle Zeilen aus- und wieder abwählt; ein Klick mit Strg nimmt eine Zeile in die Auswahl auf oder wieder heraus, ein Klick mit Umschalt wählt den Bereich ab der zuletzt ausgewählten Zeile, und Strg+A wählt alle Zeilen aus. </p> <p> Der Auswahlkanal enthält das Objekt der ausgewählten Zeile, solange genau eine Zeile ausgewählt ist, die Menge der ausgewählten Zeilenobjekte, solange es mehrere sind, und nichts, solange keine ausgewählt ist - eine an den Kanal gebundene Anzeige funktioniert also in beiden Modi, und nur eine, die mehrere Zeilen zugleich zeigen soll, muss mit einer Menge rechnen. </p>
com.top_logic.layout.view.element.TableElement.Config.selection.tooltip = Optionaler <i>Ansichtskanal</i>, in den die ausgewählten Zeilenobjekte geschrieben werden sollen.
com.top_logic.layout.view.element.TableElement.Config.types = Typen
com.top_logic.layout.view.element.TableElement.Config.types.tooltip = Optionale, qualifizierte TL-Typnamen der Zeilenobjekte, die zur Auflösung von Spaltenbezeichnungen aus den Modellattributen verwendet werden. Ist dieser Parameter nicht gesetzt, wird der Typ aus der ersten Zeile abgeleitet.
com.top_logic.layout.view.element.TableElement.CriterionConfig.column = Spalte
com.top_logic.layout.view.element.TableElement.CriterionConfig.column.tooltip = Das Attribut der Spalte, nach der dieses Kriterium filtert. <p> Die Tabelle muss eine Spalte für dieses Attribut enthalten, und diese Spalte muss filterbar sein. </p>
com.top_logic.layout.view.element.TableElement.CriterionConfig.expr = Ausdruck
com.top_logic.layout.view.element.TableElement.CriterionConfig.expr.tooltip = TL-Script-Ausdruck, der den Wert berechnet, nach dem die Spalte gefiltert wird. <p> Er wird beim Erstellen der Tabelle und bei jeder Änderung einer ihrer Eingaben ausgewertet, wobei die Eingabewerte als Argumente dienen – so liefert ein Ausdruck wie `currentUser()` einen voreingestellten Wert, der für jeden Benutzer etwas anderes bedeutet, und ein Ausdruck über eine Eingabe liefert einen voreingestellten Wert, der der an anderer Stelle angezeigten Wert entspricht. Welchen Wert der Ausdruck liefert, hängt vom Filter der Spalte ab: Ein Textfilter akzeptiert einen beliebigen Einzelwert und gleicht diesen mit dem Text ab, ein Auswahlfilter akzeptiert einen der auszuwählenden Werte oder eine Liste davon, ein boolescher Filter akzeptiert „true“ oder „false“, und ein Bereichsfilter akzeptiert einen Einzelwert, der exakt übereinstimmen muss, oder eine Liste von zwei Werten als inklusive Grenzen eines Bereichs. Ein Wert, den der Filter der Spalte nicht ausdrücken kann, wird als Konfigurationsfehler gemeldet, und die Voreinstellung wird dann nicht angeboten. </p> <p> Alternativ wird das Kriterium in Form des Spaltenfilters geschrieben, siehe <i>Kriteriumsform</i>; ein Kriterium legt eines von beiden fest, nicht beides. </p>
com.top_logic.layout.view.element.TableElement.CriterionConfig.inverted = Umgekehrt
com.top_logic.layout.view.element.TableElement.CriterionConfig.inverted.tooltip = Ob die Spalte genau die Zeilen akzeptiert, die dieses Kriterium <em>nicht</em> auswählt. <p> Auch hier kann nur ein Filter umgekehrt werden, der dem Benutzer die Möglichkeit bietet, ihn umzukehren; das Umkehren eines Filters, der diese Möglichkeit nicht bietet, ist ein Konfigurationsfehler. </p>
com.top_logic.layout.view.element.TableElement.CriterionConfig.states = Kriteriumsform
com.top_logic.layout.view.element.TableElement.CriterionConfig.states.tooltip = Das Kriterium, das in Form des Spaltenfilters angegeben wird, als Alternative zum Wert von <i>Ausdruck</i>: ein Textmuster mit seinen Übereinstimmungsoptionen, ein Vergleich, eine Auswahl oder die zulässigen Wahrheitswerte. <p> Dies ist die Form für alles, was ein einzelner Wert nicht ausdrücken kann – ein Muster, bei dem die Groß-/Kleinschreibung beachtet wird, ein einseitiger Vergleich, mehrere zulässige Wahrheitswerte gleichzeitig. Es darf höchstens eine Kriteriumsform deklariert werden, und ein Kriterium, das keine Form deklariert, stellt ebenso einen Konfigurationsfehler dar wie eines, das sowohl eine Form als auch einen Wert deklariert. </p>
com.top_logic.layout.view.element.TableElement.DragConfig.type = Typ
com.top_logic.layout.view.element.TableElement.DragConfig.type.tooltip = Der Typ, als der die gezogenen Zeilen angekündigt werden und unter dem ein Ablegen sie akzeptiert. <p> Standardmäßig der erste der für die Tabelle deklarierten Zeilentypen. Eine Tabelle, die keinen von beiden deklariert, ist ein Konfigurationsfehler: nichts würde sagen, was ihre Zeilen sind. </p>
com.top_logic.layout.view.element.TableElement.DropConfig.accept = Akzeptierte Typen
com.top_logic.layout.view.element.TableElement.DropConfig.accept.tooltip = Die Typen der Objekte, die dieses Ablegen akzeptiert. <p> Ein Untertyp eines akzeptierten Typs wird ebenfalls akzeptiert. Entschieden wird über das Modell auf dem Server; dem Client wird die daraus entstehende Menge der Typnamen mitgeteilt, sodass ein Ziehen, auf das das Ablegen nicht angewendet werden kann, gar nicht erst angeboten wird. </p>
com.top_logic.layout.view.element.TableElement.DropConfig.actions = Aktionen
com.top_logic.layout.view.element.TableElement.DropConfig.actions.tooltip = Die Aktionskette, die das Ablegen anwendet und die abgelegten Objekte als Eingabe ihrer ersten Aktion erhält.
com.top_logic.layout.view.element.TableElement.DropConfig.target = Ziel
com.top_logic.layout.view.element.TableElement.DropConfig.target-channel = Zielkanal
com.top_logic.layout.view.element.TableElement.DropConfig.target-channel.tooltip = Ein <i>View-Kanal</i>, in den die Zielzeile geschrieben wird, bevor die Aktionen laufen, damit diese lesen können, worauf abgelegt wurde. <p> Ohne Angabe (Standard) bleibt das Ziel unveröffentlicht, was ein Ablegen auf der <i>Tabelle</i> braucht – es hat keine Zielzeile und schreibt dort, wo dennoch ein Kanal deklariert ist, „null“. </p>
com.top_logic.layout.view.element.TableElement.DropConfig.target.tooltip = Ob die Tabelle als Ganzes oder eine einzelne Zeile das Ziel dieses Ablegens ist.
com.top_logic.layout.view.element.TableElement.PresetConfig.criteria = Kriterien
com.top_logic.layout.view.element.TableElement.PresetConfig.criteria.tooltip = Nach welchen Kriterien diese Voreinstellung filtert: ein Kriterium pro Spalte. <p> Eine Spalte, die hier nicht erwähnt wird, wird von dieser Voreinstellung nicht gefiltert. </p>
com.top_logic.layout.view.element.TableElement.PresetConfig.label = Bezeichnung
com.top_logic.layout.view.element.TableElement.PresetConfig.label.tooltip = Der Name, der auf dem Chip dieser Voreinstellung angezeigt wird. Ist dieser nicht vorhanden, wird der technische Name angezeigt.
com.top_logic.layout.view.element.TableElement.PresetConfig.name = Name
com.top_logic.layout.view.element.TableElement.PresetConfig.name.tooltip = Technische Bezeichnung, die diese Voreinstellung unter den benannten Filtern der Tabelle identifiziert. <p> Unter diesem Namen wird die vom Benutzer gewählte Voreinstellung gespeichert; daher darf er nicht geändert werden, sobald die Tabelle in Gebrauch ist. </p>
com.top_logic.layout.view.element.TableElement.PresetsConfig.initial = Anfängliche Voreinstellung
com.top_logic.layout.view.element.TableElement.PresetsConfig.initial.tooltip = Der Name der Voreinstellung, nach der die Tabelle gefiltert wird, bis der Benutzer selbst über die Filterung entscheidet. <p> Das ist es, was ein Benutzer sieht, der die Tabelle zum ersten Mal öffnet – die offenen Posten, seine eigenen Zeilen – statt alles, was die Tabelle enthält. Dies ist Teil des Ausgangszustands der Tabelle, ebenso wie ihre Sortierreihenfolge und ihre Gruppierung, und gilt daher nur so lange, wie keine Personalisierung dieser Tabelle vorliegt: Ein Benutzer, der andere Kriterien angewendet hat, behält diese bei, und einer, der den Filter gelöscht hat, behält die ungefilterte Tabelle bei. </p> <p> Wenn nicht festgelegt (Standard), ist die Tabelle zunächst ungefiltert. Ein Name, den keine der deklarierten Voreinstellungen trägt, ist ein Konfigurationsfehler. </p>
com.top_logic.layout.view.element.TableElement.PresetsConfig.presets = Voreinstellungen
com.top_logic.layout.view.element.TableElement.PresetsConfig.presets.tooltip = Die benannten Filter, die die Tabelle bietet, in der Reihenfolge, in der sie angezeigt werden.
com.top_logic.layout.view.element.TableElement.tooltip = Deklaratives <i>UI-Element</i>, das eine modelldefinierte Tabelle (das „ <table> “-Tag) über das Green-Field-Tabellenmodell (<i>Tabellenansicht</i>) mittels eines <i>Tabellenansicht-Steuerelements</i> darstellt. <p> Die Eingabedaten stammen aus <i>View-Kanälen</i>, die Zeilen werden durch einen TL-Script-Ausdruck berechnet, und jede Spalte wird durch einen Eintrag im <columns> -Tag deklariert – entweder über ein Modellattribut der Zeilen, über einen daraus berechneten Wert oder über ein Objekt, auf das sie verweisen. Die Spalten sind sortierbar und (spaltenweise) filterbar. </p> <p> Was der Benutzer an einer Tabelle personalisiert – die Spaltenreihenfolge, die Spaltenbreiten, welche Spalten angezeigt werden, die Sortierreihenfolge – sowie die Filter, die der Benutzer unter einem Namen speichert, werden unter dem Personalisierungsschlüssel des Elements gespeichert. Ist kein solcher konfiguriert, entspricht dieser Schlüssel der strukturellen Signatur der Tabelle: ihren Zeilentypen sowie den Namen ihrer deklarierten Spalten. Diese Signatur ändert sich, sobald eine Spalte hinzugefügt oder entfernt wird, und alle von den Benutzern der Tabelle vorgenommenen Anpassungen – einschließlich ihrer gespeicherten Filter – gehen dabei verloren. Das Festlegen eines Personalisierungsschlüssels verleiht der Tabelle eine eigene Identität, die eine solche Bearbeitung der Ansicht überdauert; legen Sie ihn daher für jede Tabelle fest, deren Personalisierung dauerhaft sein soll. </p>
com.top_logic.layout.view.element.TextElement = Text-Element
com.top_logic.layout.view.element.TextElement.Config.appearance = Darstellung
com.top_logic.layout.view.element.TextElement.Config.appearance.tooltip = Die Form, in der der Text dargestellt wird: als einfacher Text (Standardeinstellung) oder als Pill, unabhängig davon, ob der angezeigte Wert eine eigene Farbe hat oder nicht.
com.top_logic.layout.view.element.TextElement.Config.input = Eingabe
com.top_logic.layout.view.element.TextElement.Config.input.tooltip = Kanal, dessen Wert angezeigt wird (wird über die <i>Standardbezeichnung</i> wiedergegeben).
com.top_logic.layout.view.element.TextElement.Config.label = Bezeichnung
com.top_logic.layout.view.element.TextElement.Config.label.tooltip = Statischer Text, der angezeigt werden soll. Wird ignoriert, wenn ein Eingangskanal eingestellt ist.
com.top_logic.layout.view.element.TextElement.Config.overflow = Überlauf
com.top_logic.layout.view.element.TextElement.Config.overflow.tooltip = Wie Text behandelt wird, der länger ist als die verfügbare Breite: Umbruch auf mehrere Zeilen (Standard) oder Kürzung auf eine Zeile mit Auslassungspunkten.
com.top_logic.layout.view.element.TextElement.Config.tone = Farbton
com.top_logic.layout.view.element.TextElement.Config.tone.tooltip = Was die Farbe des Textes bedeutet: die Farbe, in der er gelesen wird (Standard), eine geringere Gewichtung, ein erklärender Hinweis, eine Hervorhebung oder ein Ergebnis (Erfolg, Warnung, Fehler); „On-Color“ für Text auf einer gefüllten Fläche. <p> Die Farbe der Rolle stammt aus den Design-Tokens des aktiven Themes. </p>
com.top_logic.layout.view.element.TextElement.Config.variant = Variante
com.top_logic.layout.view.element.TextElement.Config.variant.tooltip = Verwendungszweck des Textes: Fließtext (Standard), Titel, Überschrift, Display, Bezeichnung eines Werts oder Beschriftung. <p> Die Schriftfamilie, Schriftgröße, Zeilenhöhe und Schriftstärke der Rolle werden aus den Design-Tokens des aktiven Themes übernommen. </p>
com.top_logic.layout.view.element.TextElement.tooltip = <i>UI-Element</i>, das einen Textwert über das <i>React-Text-Steuerelement</i> (TLText) anzeigt. <p> Entweder eine statische Bezeichnung oder der Wert eines Eingabekanals (dargestellt über <i>die Standardbezeichnung</i>, die reaktiv aktualisiert wird, wenn sich der Kanal ändert). </p> <p> Ein Kanalwert, dem das Modell eine Farbe zuweist – ein Aufzählungsliteral oder ein Objekt, dessen Typ die Farbe seiner Instanzen berechnet –, wird als „Pill“ in dieser Farbe angezeigt. </p> <p> Wie der Text dargestellt wird, wird durch Rollen festgelegt: eine typografische Rolle, eine Farbrolle und die Form, die er annimmt. Jede Rolle wird aus den Design-Tokens des aktiven Themes gefüllt, sodass ein Anwendungs-Theme jeden Text einer Rolle auf einmal neu gestaltet. </p> <p> Die Darstellung passt sich einem neuen Wert auf dem Kanal und einer Änderung des vom Kanal gehaltenen Objekts an: Die Bezeichnung und die Farbe werden gemeinsam neu berechnet, sodass die Pille eines Objekts, dessen Zustand bearbeitet wurde, dieser Bearbeitung folgt, ohne dass das Objekt erneut ausgewählt werden muss. </p>
com.top_logic.layout.view.element.TileElement = Kachel-Element
com.top_logic.layout.view.element.TileElement.Config.action = Aktion
com.top_logic.layout.view.element.TileElement.Config.action.tooltip = Der Befehl, den eine Aktivierung der Kachel ausführt. <p> Ist ein Befehl konfiguriert, bildet die gesamte Kachel die Oberfläche, die der Benutzer aktiviert – die Kachel ist das, was ein Dashboard als Einstiegspunkt in die angezeigten Inhalte bereitstellt. Die Ausführungsregeln des jeweiligen Befehls entscheiden darüber: Eine Kachel, deren Befehl abgelehnt wird, gibt dies an, anstatt ins Leere zu führen, und eine Kachel, deren Befehl ausgeblendet ist, zeigt lediglich ihren Inhalt an. </p> <p> Eine sichtbare Markierung setzt der Inhalt der Kachel, z. B. in der Kopfzeile einer Karte. </p> <p> Konfiguriert als <action class="..." .../> innerhalb des Elements <tile>. </p>
com.top_logic.layout.view.element.TileElement.Config.content = Inhalt
com.top_logic.layout.view.element.TileElement.Config.content.tooltip = Das innerhalb dieser Kachel gerenderte <i>UI-Element</i>.
com.top_logic.layout.view.element.TileElement.Config.id = ID
com.top_logic.layout.view.element.TileElement.Config.id.tooltip = Stabile ID zur Identifizierung dieser Kachel. Wird als Persistenzschlüssel verwendet, wenn Benutzer Kacheln per Drag-and-Drop neu anordnen.
com.top_logic.layout.view.element.TileElement.Config.row-span = Zeilenabstand
com.top_logic.layout.view.element.TileElement.Config.row-span.tooltip = Die Anzahl der Gitterreihen, über die sich diese Kachel erstreckt. Der Standardwert ist 1.
com.top_logic.layout.view.element.TileElement.Config.width = Breite
com.top_logic.layout.view.element.TileElement.Config.width.tooltip = Die relative Breite der Kachel als Bruchteil der verfügbaren Spalten.
com.top_logic.layout.view.element.TileElement.tooltip = Eine einzelne Kachel in einem Dashboard. <p> Innerhalb der Kachel wird genau ein inneres <i>UI-Element</i> gerendert. Die Kachel enthält Layout-Metadaten: eine stabile ID (die als Persistenzschlüssel für die Neuanordnung dient), einen relativen Breitenanteil und eine optionale Zeilenausdehnung. </p> <p> Eine Kachel mit einer Aktion ist ein Einstiegspunkt: Die gesamte Kachel ist die Fläche, die der Benutzer aktiviert, und die Kachel wird durch die Bezeichnung der Aktion oder – falls die Aktion keine eigene Bezeichnung hat – durch den Titel ihres Inhalts gekennzeichnet. Als Einstiegspunkt gekennzeichnet wird sie dadurch, wie sie auf den Benutzer reagiert – durch den Zeiger, die Erhebung unter ihm, den Fokusring um sie herum – und durch ihren Namen. </p>
com.top_logic.layout.view.element.TreeElement = Baum-Element
com.top_logic.layout.view.element.TreeElement.Config.canExpandAll = Kann alles erweitern
com.top_logic.layout.view.element.TreeElement.Config.canExpandAll.tooltip = Ob der Baum expand-all unterstützt.
com.top_logic.layout.view.element.TreeElement.Config.children = Kinder
com.top_logic.layout.view.element.TreeElement.Config.children.tooltip = TL-Script-Funktion zur Berechnung der Kinder eines Knotens. <p> Nimmt die Werte des Eingabekanals, gefolgt vom übergeordneten Geschäftsobjekt als letztes Argument. Gibt eine <i>Sammlung</i> von untergeordneten Geschäftsobjekten zurück. </p>
com.top_logic.layout.view.element.TreeElement.Config.nodeContent = Inhalt des Knotens
com.top_logic.layout.view.element.TreeElement.Config.nodeContent.tooltip = Wie ein Knoten des Baums angezeigt wird. <p> Standardmäßig zeigt ein Knoten das Symbol und die Bezeichnung des Objekts an, für das er steht, und ein Klick darauf wählt diesen Knoten aus, siehe <i>Knotendarstellung</i>. Ein explizit konfigurierter Knoteninhalt ist die allgemeine Darstellung eines Objekts, die zu der Stelle führt, an der die Anwendung dieses Objekt anzeigt: </p><pre> &lt;nodeContent class="com.top_logic.layout.react.controlprovider.MetaResourceControlProvider"/&gt; </pre>
com.top_logic.layout.view.element.TreeElement.Config.observed-types = Beobachtete Typen
com.top_logic.layout.view.element.TreeElement.Config.observed-types.tooltip = Typen, die bei Objekterzeugungsereignissen zu beobachten sind. <p> Wenn der Baum so konfiguriert ist, wertet er seine Wurzelfunktion neu aus, wenn Objekte dieser Typen erstellt werden. Dies ermöglicht das automatische Einfügen von Knoten für Bäume, die alle Instanzen eines Typs abfragen. </p> <p> Wenn leer (Standard), werden nur Aktualisierungen und Löschungen von aktuell angezeigten Knoten beobachtet. Dies ist korrekt für Bäume, deren Knoten direkt aus einem Kanal stammen. </p>
com.top_logic.layout.view.element.TreeElement.Config.on-activate = Bei Aktivierung
com.top_logic.layout.view.element.TreeElement.Config.on-activate.tooltip = Der Befehl, der bei der Aktivierung eines Knotens ausgeführt wird – ein Doppelklick auf den Knoten oder die Eingabetaste, während der Knoten den Tastaturfokus hat. <p> Der aktivierte Knoten wird zunächst zur Auswahl im Baum, anschließend wird der Befehl mit dem Geschäftsobjekt dieses Knotens als Eingabe ausgeführt. Die Ausführungsregeln des Befehls entscheiden über dieses Objekt; ein Knoten, der nach diesen Regeln abgelehnt wird, löst daher keine Aktion aus. Ohne Befehl bewirkt das Aktivieren eines Knotens lediglich dessen Auswahl. </p> <p> Konfiguriert als <on-activate class="..." .../> innerhalb des Elements <tree>. </p>
com.top_logic.layout.view.element.TreeElement.Config.parents = Eltern
com.top_logic.layout.view.element.TreeElement.Config.parents.tooltip = Optionale TL-Script-Funktion, die berechnet, worunter ein Objekt im Baum hängt. <p> Nimmt die Werte der Eingabekanäle, gefolgt von einem Objekt als letztem Argument, und liefert das Objekt, dessen Kinderliste es enthält – nichts für das Objekt, aus dem der Baum aufgebaut ist, und für ein Objekt, das zu keinem Baum gehört. </p> <p> So wird der Knoten eines Objekts gefunden, das in den Auswahlkanal geschrieben wurde: Der Baum läuft vom Objekt aufwärts bis zu dem Objekt, aus dem er aufgebaut ist, und steigt entlang dieser Kette wieder hinab, wobei nur die Kinderlisten auf dem Weg berechnet werden. Ohne sie wird der Knoten gesucht, wobei die Kinderliste jedes Knotens auf dem Weg berechnet wird – für einen Baum geringer Ausdehnung vertretbar, für einen großen oder unbegrenzten nicht. </p>
com.top_logic.layout.view.element.TreeElement.Config.root = Wurzel
com.top_logic.layout.view.element.TreeElement.Config.root.tooltip = TL-Script Funktion, die das Wurzelobjekt des Baumes berechnet. <p> Nimmt die Werte des Eingabekanals als Positionsargumente und gibt ein einzelnes Objekt zurück, das als Wurzel des Baums verwendet wird. </p>
com.top_logic.layout.view.element.TreeElement.Config.selection = Auswahl
com.top_logic.layout.view.element.TreeElement.Config.selection-mode = Auswahlmodus
com.top_logic.layout.view.element.TreeElement.Config.selection-mode.tooltip = Ob der Benutzer jeweils einen Knoten oder eine beliebige Anzahl von Knoten auswählen kann. <p> Bei <i>Einzel</i> (Standardeinstellung) ersetzt jeder Klick die Auswahl, und die Pfeiltasten bewegen die Auswahl von Knoten zu Knoten. </p> <p> Bei <i>Mehrere</i> ersetzt ein einfacher Klick weiterhin die Auswahl, ein Klick mit Strg nimmt einen Knoten in die Auswahl auf oder wieder heraus, und ein Klick mit Umschalt wählt den Bereich ab dem Knoten, an dem die Auswahl begann. Die Pfeiltasten bewegen dann nur den Tastaturcursor und lassen die Auswahl unverändert; die Leertaste nimmt den Knoten unter dem Cursor in die Auswahl auf oder wieder heraus, und eine Pfeiltaste mit Umschalt erweitert den Bereich ab dem Knoten, an dem die Auswahl begann. </p> <p> Der Auswahlkanal enthält das Geschäftsobjekt des ausgewählten Knotens, solange genau ein Knoten ausgewählt ist, die Menge dieser Objekte, solange es mehrere sind, und nichts, solange keiner ausgewählt ist - eine an den Kanal gebundene Anzeige funktioniert also in beiden Modi, und nur eine, die mehrere Objekte zugleich zeigen soll, muss mit einer Menge rechnen. </p>
com.top_logic.layout.view.element.TreeElement.Config.selection.tooltip = Optionaler Verweis auf den <i>Ansichtskanal</i>, der die Auswahl enthält. <p> Das Geschäftsobjekt des ausgewählten Knotens wird hineingeschrieben, und ein Objekt, das ein anderer Schreiber hineinschreibt, wird im Baum aufgedeckt und ausgewählt – ein Objekt, für das der Baum keinen Knoten hat, lässt sowohl den Kanal als auch die Auswahl unverändert. </p>
com.top_logic.layout.view.element.TreeElement.NodeDisplay.link.tooltip = Ob der Knoten zu der Stelle führt, an der die Anwendung das Objekt anzeigt. <p> Ein Knoten ist der eigene Platz des Objekts in der Ansicht, und ein Klick darauf wählt das Objekt aus. Ein Link, der bei diesem Klick den Baum verlässt, ist störend, daher ist ein Knoten standardmäßig ohne Link, es sei denn, der Baum fordert den Link an. Das Öffnen des Objekts, für das ein Knoten steht, ist Aufgabe von <i>Bei Aktivierung</i> (<i>Konfiguration des Baumelements</i>). </p>
com.top_logic.layout.view.element.TreeElement.tooltip = Deklaratives <i>UI-Element</i>, das ein <i>React-Tree-Control</i> umschließt. <p> Das Objekt, aus dem der Baum aufgebaut wird, und die Kinder eines Knotens werden von TL-Script-Funktionen über den Werten der <i>Ansichtskanäle</i> berechnet, die der Baum liest. Die Kinder eines Knotens werden berechnet, wenn ihn jemand öffnet – ein Baum beliebiger Ausdehnung kostet daher nicht mehr als das, was von ihm angezeigt wird, und ein Knoten mit leerer Kinderliste ist ein Blatt. </p> <p> Der Baum folgt dem Modell, das er anzeigt: Ein gelöschtes Objekt verliert seinen Knoten, ein Objekt, das in einer Kinderliste erscheint, bekommt einen, und die vom Benutzer geöffneten Unterbäume bleiben dabei geöffnet. Eine Eingabe, die ein anderes Objekt zum Aufbau des Baums benennt, baut ihn neu auf und öffnet die zuvor geöffneten Unterbäume überall dort wieder, wo der neue Baum deren Objekte enthält. Siehe <i>beobachtbares Baummodell</i>. </p> <p> Der Auswahlkanal wird gelesen und geschrieben, siehe <i>Baumauswahl-Bindung</i>: Der Baum deckt den Knoten eines Objekts auf, das ein anderer Schreiber hineinschreibt – etwa das Objekt, das ein Erzeugen-Befehl gerade angelegt hat –, wählt ihn aus und schreibt zurück, was der Benutzer auswählt. </p>
com.top_logic.layout.view.element.ValueInputElement = Eingabefeld für Werte
com.top_logic.layout.view.element.ValueInputElement.Config.clearable = Löschbar
com.top_logic.layout.view.element.ValueInputElement.Config.clearable.tooltip = Ob das Eingabefeld über eine Schaltfläche verfügt, mit der es geleert werden kann. <p> Für einen Wert, der ebenso oft entnommen wie eingegeben wird – den Begriff, nach dem in einer Tabelle gesucht wird, den Text, auf den eine Liste eingegrenzt wird –, bei dem das Leeren des Eingabefelds ein eigenständiger Schritt ist und nicht nur ein Nebenprodukt des Löschens aller Zeichen. Die Schaltfläche wird nur angezeigt, solange das Eingabefeld einen Wert enthält und dieser geändert werden kann, und sie setzt den Wert sofort auf leer, anstatt dies erst nach einer Verzögerung zu tun. </p> <p> Wird von einem Textfeld angeboten; ein Eingabefeld für eine Zahl, ein Datum, einen Wahrheitswert oder eine Auswahl ignoriert dies. </p>
com.top_logic.layout.view.element.ValueInputElement.Config.debounce = Verzögerung
com.top_logic.layout.view.element.ValueInputElement.Config.debounce.tooltip = Wie lange die Eingabe nach dem letzten Tastendruck wartet, bevor der eingegebene Wert den Kanal erreicht; wird als Dauer angegeben (300ms, 1s). <p> Eine kürzere Wartezeit sorgt dafür, dass die aus dem Wert berechneten Ergebnisse – also die Zeilen, auf die eine Suche eingegrenzt wird – der Eingabe zeitnaher folgen, allerdings auf Kosten eines Hin- und Rücklaufs pro Pause; bei einer längeren Wartezeit wird gewartet, bis der Benutzer mit der Eingabe aufhört. Leer lassen, um die Standardwartezeit für eine eingegebene Eingabe zu verwenden. </p> <p> Nur ein eingegebener Wert wartet überhaupt; ein ausgewählter Wert – aus einem Dropdown-Menü, einem Datumswähler oder einem Kontrollkästchen – gelangt mit der Auswahl in den Kanal. Ein Eingabefeld, dessen Wert der Server beim Speichern umschreibt – beispielsweise eine Zahl –, hält den Wert zurück, bis das Eingabefeld verlassen wird, und ignoriert die Wartezeit vollständig. </p>
com.top_logic.layout.view.element.ValueInputElement.Config.icon = Symbol
com.top_logic.layout.view.element.ValueInputElement.Config.icon.tooltip = Das Symbol, das innerhalb des Eingabefelds vor dem Eingegebenen angezeigt wird. <p> Um welche Art von Eingabefeld es sich handelt, wird durch ein Bild dargestellt: die Lupe eines Suchfelds, der Briefumschlag einer E-Mail-Adresse. Das Symbol dient lediglich der Verzierung – beim Anklicken passiert nichts, und ein Screenreader überspringt es –, sodass das Eingabefeld weiterhin über seine Bezeichnung oder seinen Platzhalter benannt wird. </p> <p> Eine Symbol-Font-Klasse wie z. B. css:fa-solid fa-magnifying-glass oder ein Pfad zu einem Bild. Wird bei einem Eingabefeld für Text angezeigt; bei Eingabefeldern für Zahlen, Datumsangaben, Wahrheitswerte oder Auswahlen wird es ignoriert. </p>
com.top_logic.layout.view.element.ValueInputElement.Config.input-control = Eingabe-Steuerelement
com.top_logic.layout.view.element.ValueInputElement.Config.input-control.tooltip = Das Steuerelement, in dem der Wert eingegeben wird, und das damit dasjenige überschreibt, auf das sein Typ hinweist. <p> Es handelt sich um dieselbe Auswahl, die ein <field> für das angezeigte Attribut trifft, hier jedoch für einen Wert, der zur Ansicht gehört: eine Auswahl, die als Wolke von Umschaltern angeboten wird statt als Liste, die sich bei Bedarf öffnet, eine Zahl, die entlang einer Leiste gezogen statt eingegeben wird, ein Wahrheitswert, der auf einem Schalter umgelegt statt in einem Kästchen angekreuzt wird. </p> <p> Wird keine Angabe gemacht, ist das Steuerelement dasjenige, auf das der Typ des Werts hinweist. </p>
com.top_logic.layout.view.element.ValueInputElement.Config.label = Bezeichnung
com.top_logic.layout.view.element.ValueInputElement.Config.label-position = Position der Bezeichnung
com.top_logic.layout.view.element.ValueInputElement.Config.label-position.tooltip = Gibt an, wo das Eingabefeld seine Bezeichnung relativ zu sich selbst darstellt, z. B. „hide-label“ für ein Eingabefeld ohne Bezeichnung. <p> Wenn nicht festgelegt, gilt die responsive Standardposition des umgebenden Layouts. </p>
com.top_logic.layout.view.element.ValueInputElement.Config.label.tooltip = Die Bezeichnung, die neben dem Eingabefeld angezeigt wird. <p> Ohne eine solche steht das Eingabefeld für sich allein – so wie es bei einem Eingabefeld in einer Symbolleiste oder über einer Liste der Fall ist, wo die umgebende Anzeige angibt, wozu es dient. </p>
com.top_logic.layout.view.element.ValueInputElement.Config.multiple = Mehrere
com.top_logic.layout.view.element.ValueInputElement.Config.multiple.tooltip = Ob der Kanal eine Auflistung von Werten statt nur eines einzelnen Werts enthält.
com.top_logic.layout.view.element.ValueInputElement.Config.on-submit = Beim Absenden
com.top_logic.layout.view.element.ValueInputElement.Config.on-submit.tooltip = Der Befehl, der auf dem vom Benutzer abgesendeten Wert ausgeführt wird. <p> Ein Wert, dessen Eingabe der Benutzer abgeschlossen hat, wird in den Wertkanal geschrieben und anschließend diesem Befehl als Eingabe übergeben. In einem Feld, in das der Benutzer etwas eingibt – einen Text, eine Zahl –, wird die Eingabe durch Drücken der Eingabetaste abgeschlossen; in einem Feld, aus dem eine Auswahl getroffen wird – einem Dropdown-Menü, einem Datumsfeld, einem Kontrollkästchen –, wird die Eingabe durch jede Auswahl abgeschlossen. </p> <p> Sofern kein anderer Befehl angegeben ist, handelt es sich um einen <i>generischen View-Befehl</i>, sodass die auf den Wert anzuwendenden Aktionen direkt in diesem Element stehen. </p>
com.top_logic.layout.view.element.ValueInputElement.Config.options = Optionen
com.top_logic.layout.view.element.ValueInputElement.Config.options.tooltip = Die zur Auswahl stehenden Werte. <p> Wird mit den Werten der Eingabekanäle als Argumente aufgerufen, sodass die Optionen davon abhängen können, was der Rest der Ansicht anzeigt; ohne Eingaben ein Ausdruck, der die Optionen direkt berechnet. </p> <p> Ohne Ausdruck sind die Optionen diejenigen, die der Typ selbst bietet: die Klassifikatoren einer Aufzählung, die Instanzen einer Klasse. Ein Wert eines primitiven Typs wird dann eingegeben statt ausgewählt. </p> <p> Die Optionen werden jedes Mal neu berechnet, wenn sich einer der Eingabekanäle ändert. </p>
com.top_logic.layout.view.element.ValueInputElement.Config.placeholder = Platzhalter
com.top_logic.layout.view.element.ValueInputElement.Config.placeholder.tooltip = Der Text, der im Eingabefeld angezeigt wird, solange es leer ist. <p> Was der Benutzer voraussichtlich eingeben wird, steht direkt im Eingabefeld selbst: „Suche“ in einem Suchfeld, „name@example.com“ in einem E-Mail-Feld. Er gibt den Zweck eines Eingabefelds an, das ohne sichtbare Bezeichnung steht – in einer Symbolleiste, über einer Liste – und verschwindet, sobald ein Wert eingegeben wird. </p>
com.top_logic.layout.view.element.ValueInputElement.Config.readonly = Schreibgeschützt
com.top_logic.layout.view.element.ValueInputElement.Config.readonly.tooltip = Ob der Wert angezeigt wird, hier aber nicht geändert werden kann.
com.top_logic.layout.view.element.ValueInputElement.Config.type = Typ
com.top_logic.layout.view.element.ValueInputElement.Config.type.tooltip = Der Typ des Werts, der bestimmt, wie er eingegeben wird. <p> Ein primitiver Typ wie tl.core:String, tl.core:Integer, tl.core:Date oder tl.core:Boolean wird eingegeben, eine Aufzählung oder eine Klasse wird aus Optionen ausgewählt. </p>
com.top_logic.layout.view.element.ValueInputElement.Config.value = Wert
com.top_logic.layout.view.element.ValueInputElement.Config.value.tooltip = Der Kanal, der den vom Benutzer eingegebenen Wert enthält.
com.top_logic.layout.view.element.ValueInputElement.tooltip = <i>UI-Element</i>, über das der Benutzer den Wert eines Kanals eingeben kann. <p> Das Eingabefeld ist in beide Richtungen an den Wertkanal gebunden: Was der Benutzer eingibt, wird zum Wert des Kanals, und ein Wert, den der Kanal von anderswo erhält, erscheint im Eingabefeld. Es ist das Gegenstück zu einem <field> für einen Wert, der zur Ansicht und nicht zu einem Modellobjekt gehört – der Begriff, nach dem eine Tabelle filtert, der Zustand, auf den eine Liste eingegrenzt ist – und benötigt weder ein Formular noch ein Objekt, um ihn zu speichern. Da es außerhalb eines Formulars steht, wird es in einem <i>Felder-Element</i> für das Raster platziert, das ein Formular seinen Feldern bereitstellt. </p> <p> Der Typ des Werts bestimmt das Eingabefeld: ein Textfeld für Text, ein Zahlenfeld für eine Zahl, eine Datumsauswahl für einen Zeitpunkt, ein Kontrollkästchen für einen booleschen Wert, ein Dropdown-Menü für eine Aufzählung oder eine Klasse. Die Auflösung erfolgt über dieselben <i>Formularfeld-Steuerelemente</i>, die auch das Steuerelement für ein Attribut auswählen, sodass ein Wert eines bestimmten Typs überall, wo er auftritt, auf dieselbe Weise eingegeben wird. </p> <p> Ein Wert einer Aufzählung oder einer Klasse wird aus Optionen ausgewählt: den Klassifikatoren bzw. den Instanzen des Typs oder dem, was der Optionsausdruck berechnet. Ist <i>Mehrere</i> gesetzt, enthält der Kanal eine Auflistung solcher Werte anstelle eines einzelnen Werts. </p> <p> Ein Absendebefehl wandelt die Eingabe in eine Aktion um: Der Wert, den der Benutzer eingegeben hat, wird in den Kanal geschrieben und anschließend durch den Befehl verarbeitet – genau das ist ein Suchfeld oder ein Sprungfeld: eine Eingabe und ein Befehl, der auf der Eingabe basiert. </p>
com.top_logic.layout.view.element.VisibleIfElement = Bedingte Anzeige
com.top_logic.layout.view.element.VisibleIfElement.Config.content = Inhalt
com.top_logic.layout.view.element.VisibleIfElement.Config.content.tooltip = Die Inhaltselemente, die angezeigt werden, solange die Bedingung erfüllt ist.
com.top_logic.layout.view.element.VisibleIfElement.Config.expr = Ausdruck
com.top_logic.layout.view.element.VisibleIfElement.Config.expr.tooltip = Ein TL-Script-Prädikat, das mit dem aktuellen Wert des Eingangskanals aufgerufen wird; der Inhalt wird angezeigt, solange das Prädikat „true“ zurückgibt.
com.top_logic.layout.view.element.VisibleIfElement.Config.input = Eingabe
com.top_logic.layout.view.element.VisibleIfElement.Config.input.tooltip = Der Kanal, dessen aktueller Wert an die Bedingung übergeben wird.
com.top_logic.layout.view.element.VisibleIfElement.Config.observed-types = Beobachtete Typen
com.top_logic.layout.view.element.VisibleIfElement.Config.observed-types.tooltip = Typen, bei denen sich das Objekt ändert (Erstellen / Aktualisieren / Löschen), lösen zusätzlich zum Eingabeobjekt, das stets beobachtet wird, eine Neubewertung der Bedingung aus. <p> Konfigurieren Sie dies nur für eine Bedingung, die über das Eingabeobjekt hinausgeht, z. B. eine, die anhand eines Attributs des Containers der Eingabe entscheidet: Eine Änderung dieses anderen Objekts ist für die Beobachtung der Eingabe selbst unsichtbar. „Leer“ (Standard) beobachtet nur das Eingabeobjekt. </p>
com.top_logic.layout.view.element.VisibleIfElement.tooltip = Ein UIElement, das seinen Inhalt anzeigt, solange eine TL-Script-Bedingung über den Wert eines Eingangskanals erfüllt ist, und nichts anzeigt, solange dies nicht der Fall ist. <p> Die Bedingung wird bei jeder Änderung des Eingabekanals sowie bei einer Änderung des Eingabeobjekts selbst neu ausgewertet – eine Bedingung wird in der Regel anhand eines Attributs dieses Objekts entschieden, das bearbeitet werden kann, ohne dass sich der Kanalwert ändert. Eine Bedingung, die über das Eingabeobjekt hinausgeht, gibt unter <i>„Beobachtete Typen“</i> die Typen an, zu denen sie navigiert. </p> <p> Ausgeblendeter Inhalt wird verworfen und nicht weiter vorgehalten, sodass er keine Beiträge (z. B. die Befehle „Bearbeiten“, „Speichern“ und „Abbrechen“ eines Formulars) im umgebenden Gültigkeitsbereich hinterlässt. Solange die Bedingung erfüllt ist, bleibt der Inhalt unverändert – an seine eigenen Kanäle gebunden, aktualisiert er sich selbst. </p> <p> Dies ist die Kurzform eines <i>„switch“-Elements</i> mit einem einzigen Fall und ohne Standardfall. Mit einem <i>„switch“-Element</i> werden mehrere Alternativen beschrieben, von denen jeweils eine angezeigt wird. </p> <p> Die Bedingung eines Elements ist nicht mit der Bedingung eines Befehls zu verwechseln: Ob ein Befehl für seine Eingabe ausgeführt werden kann, wird durch die Ausführbarkeitsregel <i>„visible if“</i> entschieden, die innerhalb des Befehls „ <executability> “ denselben Tag-Namen trägt. </p>
com.top_logic.layout.view.element.WindowElement = Fenster-Element
com.top_logic.layout.view.element.WindowElement.Config.actions = Aktionen
com.top_logic.layout.view.element.WindowElement.Config.actions.tooltip = Fußzeilen-Aktionselemente (in der Regel Schaltflächen). <p> Diese werden in der Fußleiste des Fensters unterhalb des Hauptinhalts dargestellt. </p>
com.top_logic.layout.view.element.WindowElement.Config.resizable = Veränderbar
com.top_logic.layout.view.element.WindowElement.Config.resizable.tooltip = Ob die Größe des Fensters durch den Benutzer geändert werden kann. <p> Der Standardwert ist true. Wenn diese Option aktiviert ist, werden an allen Kanten und Ecken Griffe zur Größenänderung angezeigt. </p>
com.top_logic.layout.view.element.WindowElement.Config.title = Titel
com.top_logic.layout.view.element.WindowElement.Config.title.tooltip = Der in der Titelleiste angezeigte Fenstertitel.
com.top_logic.layout.view.element.WindowElement.Config.width = Breite
com.top_logic.layout.view.element.WindowElement.Config.width.tooltip = Die Fensterbreite als CSS-Pixelwert (z. B. "500px"). <p> Der Standardwert ist "500px", wenn er nicht angegeben wird. </p>
com.top_logic.layout.view.element.WindowElement.tooltip = Ein <i>UI-Element</i>, das mit Hilfe des <i>React Window Controls</i> ein verchromtes Dialogfenster darstellt. <p> Rendert ein Fenster mit Titelleiste (einschließlich Schließen-Schaltfläche und Symbolleisten-Schaltflächen), scrollbarem Körper und optionalen Fußzeilen-Aktionsschaltflächen. Vorgesehen für die Verwendung als Root-Element innerhalb von Dialog-View-XML-Dateien. </p> <p> Die Schließen-Schaltfläche (X) in der Titelleiste bricht den Dialog über den <i>Dialogmanager</i> ab. Fußzeilen-Aktionen werden als untergeordnete Elemente innerhalb des <actions> Abschnitts deklariert. Toolbar-Befehle von Child-Elementen (z. B. Formular bearbeiten/speichern/abbrechen) werden automatisch in der Titelleiste angezeigt. </p> <p> Beispiel: </p> <pre> &lt;window title="Details" width="500px"&gt; &lt;form input="model"&gt; &lt;field attribute="name"/&gt; &lt;/form&gt; &lt;actions&gt; &lt;button&gt; &lt;action class="...CancelDialogCommand" label="Close"/&gt; &lt;/button&gt; &lt;/actions&gt; &lt;/window&gt; </pre>
com.top_logic.layout.view.form.BooleanControlProvider = Anbieter für boolesche Eingabefelder
com.top_logic.layout.view.form.BooleanControlProvider.Config.display = Anzeige
com.top_logic.layout.view.form.BooleanControlProvider.Config.display.tooltip = Wie der Wert angezeigt wird, oder nichts, um ihn so anzuzeigen, wie es das bearbeitete Attribut vorsieht. <p> Ein Kontrollkästchen und ein Schalter zeigen den Wert direkt an und werden durch die daneben stehende Bezeichnung benannt, während Optionsfelder und ein Auswahlfeld ihn als Auswahlmöglichkeit zwischen beschrifteten Werten anbieten. Hier angegeben, gilt die Anzeige nur für dieses Feld; als <i>boolesche Annotation</i> eines Attributs angegeben, gilt sie überall dort, wo dieses Attribut angezeigt wird. </p> <p> Ein Wert, der möglicherweise auch unbekannt ist, wird als Kontrollkästchen angezeigt, selbst wenn ein Schalter verlangt wird, da ein Schalter keine dritte Position für „kein Wert“ hat. </p>
com.top_logic.layout.view.form.BooleanControlProvider.tooltip = <i>Anbieter für React-Feldsteuerelemente</i> für boolesche Attribute. <p> Standardmäßig ein Kontrollkästchen, und ein Schalter, Optionsfelder oder eine Ja/Nein-Auswahl, wenn das Feld so angezeigt wird. Ausschlaggebend ist, was das Feld angibt - bei einem Modellattribut dessen <i>boolesche Annotation</i>; eine hier konfigurierte Anzeige hat Vorrang, sodass ein einzelnes Formularfeld von der Darstellung des Attributs an anderer Stelle abweicht. </p> <p> Ein Tri-State-Feld verfügt über einen Zustand für „kein Wert“: Das Kontrollkästchen erhält einen dritten Zustand, die Auswahlmöglichkeit eine dritte Option. Ein Schalter hat keine dritte Position, in der er diesen Zustand anzeigen kann, und bleibt daher ein Kontrollkästchen. </p>
com.top_logic.layout.view.form.FieldControlService = Steuerelemente für Formularfelder
com.top_logic.layout.view.form.FieldControlService$ProviderMapping = Zuordnung der Anbieter
com.top_logic.layout.view.form.FieldControlService$ProviderMapping.tooltip = Ein einzelner Eintrag für die Zuordnung von Typ zu Anbieter.
com.top_logic.layout.view.form.FieldControlService$ValueTypeMapping = Zuordnung für einen Werttyp
com.top_logic.layout.view.form.FieldControlService$ValueTypeMapping.tooltip = Ein Steuerelement, mit dem die Werte eines Java-Typs bearbeitet werden können.
com.top_logic.layout.view.form.FieldControlService.Config.providers = Anbieter
com.top_logic.layout.view.form.FieldControlService.Config.providers.tooltip = Globale Typ-zu-Anbieter-Zuordnungen, die durch eine Modell-Typ-Referenz verschlüsselt werden.
com.top_logic.layout.view.form.FieldControlService.Config.value-type-providers = Steuerelemente für Werttypen
com.top_logic.layout.view.form.FieldControlService.Config.value-type-providers.tooltip = Die Steuerelemente dienen zur Bearbeitung von Werten eines einfachen Java-Typs. <p> Eine Konfigurationseigenschaft kann einen Wert enthalten, der durch keinen Modelltyp beschrieben wird, beispielsweise einen TL-Script-Ausdruck. Ein solcher Wert wird über das hier benannte Steuerelement bearbeitet, sodass durch eine einmalige Deklaration alle Konfigurationseigenschaften abgedeckt sind, die diesen Wert enthalten. </p>
com.top_logic.layout.view.form.FieldControlService.ProviderMapping.impl = Umsetzung
com.top_logic.layout.view.form.FieldControlService.ProviderMapping.impl.tooltip = Der Kontrollanbieter, der für Attribute dieses Typs zu verwenden ist.
com.top_logic.layout.view.form.FieldControlService.ProviderMapping.type = Typ
com.top_logic.layout.view.form.FieldControlService.ProviderMapping.type.tooltip = Der Modelltyp, für den diese Zuordnung gilt.
com.top_logic.layout.view.form.FieldControlService.ValueTypeMapping.impl = Implementierung
com.top_logic.layout.view.form.FieldControlService.ValueTypeMapping.impl.tooltip = Das Steuerelement, das Werte dieses Typs bearbeitet.
com.top_logic.layout.view.form.FieldControlService.ValueTypeMapping.value-type = Werttyp
com.top_logic.layout.view.form.FieldControlService.ValueTypeMapping.value-type.tooltip = Der Typ des bearbeiteten Werts.
com.top_logic.layout.view.form.FieldControlService.tooltip = Dienst, der den passenden <i>React Field Control Provider</i> für ein Modellattribut auflöst. <p> Auflösungskette: </p> <ol> <li>Das Steuerelement, das die Anzeige anfordert.</li> <li><i>Input-Control-Annotation</i> auf dem Attribut oder seinem Typ (über <i>Werttyp</i>).</li> <li>Globale Typ-zu-Anbieter-Map in diesem Dienst konfiguriert.</li> <li>Eingebauter Fallback basierend auf dem <i>Typ</i>.</li> </ol> <p> Hier wird nur entschieden, <em>welcher</em> Anbieter einen Wert bearbeitet. Wie viele Werte das Feld hält, realisiert die <i>Field Control Registry</i>, gleich in welchem Schritt der Kette der Anbieter gefunden wurde: Ein Feld mit mehreren Werten, dessen Anbieter jeweils einen Wert bearbeitet, wird als Liste von Element-Steuerelementen angezeigt, eines pro Wert. </p>
com.top_logic.layout.view.form.NumberInputControlProvider = Anbieter für Zahleneingabefelder
com.top_logic.layout.view.form.NumberInputControlProvider.Config.display = Anzeige
com.top_logic.layout.view.form.NumberInputControlProvider.Config.display.tooltip = Wie der Wert bearbeitet wird. <p> Ein Eingabefeld nimmt jede Zahl an, die das Format des Feldes liest, unabhängig von ihrer Größe. Ein Schieberegler bietet die Zahlen eines Bereichs an und wird gezogen statt getippt, was einem Wert entspricht, dessen Bereich Teil seiner Bedeutung ist; er braucht den kleinsten und den größten Wert dieses Bereichs. </p>
com.top_logic.layout.view.form.NumberInputControlProvider.Config.max = Maximum
com.top_logic.layout.view.form.NumberInputControlProvider.Config.max.tooltip = Der größte Wert, den ein Schieberegler setzen kann und der ihm angegeben werden muss. <p> Der Wert, auf dem der Griff am rechten Ende der Schiene steht, oberhalb des kleinsten Werts. Ein Eingabefeld hat keinen Bereich zu durchlaufen und ignoriert die Angabe. </p>
com.top_logic.layout.view.form.NumberInputControlProvider.Config.min = Minimum
com.top_logic.layout.view.form.NumberInputControlProvider.Config.min.tooltip = Der kleinste Wert, den ein Schieberegler setzen kann und der ihm angegeben werden muss. <p> Der Wert, auf dem der Griff am linken Ende der Schiene steht. Ein Eingabefeld hat keinen Bereich zu durchlaufen und ignoriert die Angabe. </p>
com.top_logic.layout.view.form.NumberInputControlProvider.Config.step = Schrittweite
com.top_logic.layout.view.form.NumberInputControlProvider.Config.step.tooltip = Der Abstand zwischen zwei Werten, die ein Schieberegler setzen kann; ohne Angabe ganze Zahlen. <p> Das Raster, in das der Griff einrastet: Eine Schrittweite von 0,5 bietet jeden halben Wert an, eine Schrittweite von 10 jeden zehnten Wert des Bereichs. Ein Eingabefeld hat kein Raster und ignoriert die Angabe. </p>
com.top_logic.layout.view.form.NumberInputControlProvider.tooltip = <i>Anbieter für React-Feldsteuerelemente</i> für ganzzahlige und gleitkommawertige Attribute. <p> Der Wert wird in dem Format angezeigt und eingegeben, das das Feld verlangt – bei einem Modellattribut dessen Format-Annotation, sofern vorhanden –, sodass ein deutscher Benutzer „12,5“ liest und tippt, wo ein englischer „12.5“ liest und tippt. </p> <p> Die Zahl wird als Text getippt, es sei denn, die Anzeige verlangt einen Griff, der zwischen dem kleinsten und dem größten Wert entlang einer Schiene gezogen wird. </p>
com.top_logic.layout.view.form.RowEditPolicy = Rundenbearbeitungsrichtlinie
com.top_logic.layout.view.form.RowEditPolicy.ALL = Alle
com.top_logic.layout.view.form.RowEditPolicy.ALL.tooltip = Alle Zeilen können bearbeitet werden.
com.top_logic.layout.view.form.RowEditPolicy.NONE = Keine
com.top_logic.layout.view.form.RowEditPolicy.NONE.tooltip = Die Tabelle ist schreibgeschützt (Standardeinstellung).
com.top_logic.layout.view.form.RowEditPolicy.SELECTED = Ausgewählt
com.top_logic.layout.view.form.RowEditPolicy.SELECTED.tooltip = Genau die ausgewählte Zeile kann bearbeitet werden. <p> Änderungen an zuvor ausgewählten Zeilen bleiben in deren Zeilen-Overlays zwischengespeichert und werden beim Speichern des Formulars gemeinsam übernommen. </p>
com.top_logic.layout.view.form.RowEditPolicy.tooltip = Welche Zeilen einer Tabelle, die innerhalb eines Formulars bearbeitet wird, sind im Bearbeitungsmodus des Formulars bearbeitbar?
com.top_logic.layout.view.form.RowSetBinding$RemoveMode = Modus entfernen
com.top_logic.layout.view.form.RowSetBinding$RemoveMode.tooltip = Wie sich das Löschen einer Zeile aus der Tabelle auf das entfernte Objekt auswirkt, wenn das Formular gespeichert wird.
com.top_logic.layout.view.form.RowSetBinding.RemoveMode.DELETE = Löschen
com.top_logic.layout.view.form.RowSetBinding.RemoveMode.DELETE.tooltip = Das entfernte Objekt wird gelöscht.
com.top_logic.layout.view.form.RowSetBinding.RemoveMode.NONE = Keine
com.top_logic.layout.view.form.RowSetBinding.RemoveMode.NONE.tooltip = Zeilen können nicht entfernt werden.
com.top_logic.layout.view.form.RowSetBinding.RemoveMode.UNLINK = Verknüpfung aufheben
com.top_logic.layout.view.form.RowSetBinding.RemoveMode.UNLINK.tooltip = Das entfernte Objekt wird lediglich aus der Zeilenmenge entfernt; das Objekt selbst bleibt erhalten.
com.top_logic.layout.view.form.SelectControlProvider = Steuerungsanbieter auswählen
com.top_logic.layout.view.form.SelectControlProvider.Config.display = Anzeige
com.top_logic.layout.view.form.SelectControlProvider.Config.display.tooltip = Die Form, in der die Optionen angeboten werden. <p> Eine Liste, die bei Bedarf geöffnet wird, nimmt unabhängig von der Anzahl der Optionen den Platz eines Feldes ein und wird durch Tippen durchsucht, was einer Liste beliebiger Länge entspricht. Eine Wolke von Schaltern und eine Leiste von Segmenten zeigen jederzeit jede Option, so dass der Wert und das, was sonst noch zu wählen wäre, gelesen werden, ohne dass etwas geöffnet wird – um den Preis des Platzes, den alle Optionen brauchen, was sie zur Wahl für eine Handvoll Optionen macht und nicht für eine lange Liste. </p>
com.top_logic.layout.view.form.SelectControlProvider.Config.option-provider = Optionsanbieter
com.top_logic.layout.view.form.SelectControlProvider.Config.option-provider.tooltip = Die Optionsquelle für die auswählbaren Werte. <p> Ist diese Option nicht gesetzt, werden die Optionen aus dem Typ des Attributs (Aufzählung, Referenz, Enum-Datentyp) oder aus dessen TL-Script-Annotation abgeleitet. </p>
com.top_logic.layout.view.form.SelectControlProvider.tooltip = <i>React-Feldsteuerungs-Berechnung</i> für Attribute, die durch Auswahl aus einer Reihe von Optionen bearbeitet werden. <p> Schließt ein <i>Auswahlfeldmodell</i> (ein <i>Attribut-Auswahlfeldmodell</i>) in ein <i>React-Dropdown-Auswahlsteuerelement</i> ein und nutzt dabei <i>einen Meta-Ressourcen-Anbieter</i>, sodass Optionen und die aktuelle Auswahl sowohl im Bearbeitungs- als auch im Anzeigemodus mit der Bezeichnung und dem Bild gerendert werden, die in ihrem Modell hinterlegt sind. </p> <p> Wenn die Konfiguration über die Typzuordnung <i>der Formularfeld-Steuerelemente</i> für einen speziellen Modelldatentyp (z. B. tl.util:Country) erfolgt, stellt ein Optionsanbieter die auswählbaren Werte bereit. Ohne eine konfigurierte Berechnung werden die Optionen aus dem Attribut selbst abgeleitet (Aufzählung, Referenz, Enum-Datentyp oder eine TL-Script-Annotation). </p> <p> Die Optionen werden in einer Liste angeboten, die bei Bedarf geöffnet wird, es sei denn, die Anzeige erfordert eine Darstellung, in der alle Optionen angezeigt werden. </p>
com.top_logic.layout.view.form.TLInputControl = Eingabekontrolle
com.top_logic.layout.view.form.TLInputControl.impl = Umsetzung
com.top_logic.layout.view.form.TLInputControl.impl.tooltip = Die Implementierung des Kontrollanbieters.
com.top_logic.layout.view.form.TLInputControl.tooltip = <i>Attribut-Anmerkung</i>, die das React-Eingabefeld für ein Modell-Attribut oder einen Typ konfiguriert. <p> Wenn sie für ein Attribut gesetzt wird, überschreibt sie die Standardauswahl des Steuerelements. Wenn sie für einen Typ gesetzt ist, bietet sie die Standardsteuerung für alle Attribute dieses Typs (über den <i>Werttyp</i>). </p>
com.top_logic.layout.view.form.TextInputControlProvider = Anbieter für Texteingabefelder
com.top_logic.layout.view.form.TextInputControlProvider.Config.input-type = Eingabetyp
com.top_logic.layout.view.form.TextInputControlProvider.Config.input-type.tooltip = Die Art des Werts, den das Feld bearbeitet. <p> In einem Textfeld wird einfacher Text bearbeitet, während eine Webadresse, eine E-Mail-Adresse und eine Telefonnummer zusätzlich als Link angeboten werden, über den der Wert geöffnet wird. </p>
com.top_logic.layout.view.form.TextInputControlProvider.tooltip = <i>Anbieter für React-Feldsteuerelemente</i> für Zeichenketten-, Tristate-, Binär- und andere als Text darstellbare Attribute. <p> Der Eingabetyp gibt an, was der eingegebene Text bedeutet: einfacher Text, eine Webadresse, eine E-Mail-Adresse, eine Telefonnummer oder ein Suchbegriff. Der Browser bearbeitet den Wert mit dem Eingabefeld dieser Art – mit der passenden Bildschirmtastatur und Vervollständigung – und das Feld zeigt eine Adresse als Verweis an, der sie öffnet. Ist der Eingabetyp in der Typzuordnung der <i>Formularfeld-Steuerelemente</i> für einen Modelltyp konfiguriert, gilt er für jedes Attribut dieses Typs. </p> <p> Dient außerdem als letzter Rückgriff, wenn kein anderer Anbieter passt; der Text ist dann einfacher Text. </p>
com.top_logic.layout.view.inspector.InspectNodeAction = Element untersuchen
com.top_logic.layout.view.inspector.InspectNodeAction$Mode = Modus
com.top_logic.layout.view.inspector.InspectNodeAction$Mode.tooltip = Welches Element eine <i>Element untersuchen</i>-Aktion untersucht.
com.top_logic.layout.view.inspector.InspectNodeAction.Config.mode = Modus
com.top_logic.layout.view.inspector.InspectNodeAction.Config.mode.tooltip = Welches Element soll überprüft werden?
com.top_logic.layout.view.inspector.InspectNodeAction.Config.node = Knoten
com.top_logic.layout.view.inspector.InspectNodeAction.Config.node.tooltip = Der Kanal, der das <i>untersuchte Element</i> enthält und von dieser Aktion gelesen und geschrieben wird.
com.top_logic.layout.view.inspector.InspectNodeAction.Mode.PARENT = Übergeordnetes Element
com.top_logic.layout.view.inspector.InspectNodeAction.Mode.PARENT.tooltip = Das Element, das das untersuchte Element umschließt.
com.top_logic.layout.view.inspector.InspectNodeAction.Mode.REFRESH = Aktualisieren
com.top_logic.layout.view.inspector.InspectNodeAction.Mode.REFRESH.tooltip = Das untersuchte Element selbst, in seinem aktuellen Zustand.
com.top_logic.layout.view.inspector.InspectNodeAction.tooltip = Nimmt den untersuchten Knoten erneut auf, entweder an seiner eigenen Adresse oder an der Adresse des Elements, das ihn umschließt. <p> Beide Vorgänge bestehen aus demselben Schritt – das Auflösen einer Adresse im untersuchten Fenster und das Abbilden dessen, was sich dort gerade befindet – und unterscheiden sich lediglich in der Ausgangsadresse, die durch den <i>Modus</i> benannt wird. Da es sich bei der Projektion um eine Momentaufnahme handelt, zeigt eine erneute Projektion den Zustand, der sich in der Zwischenzeit geändert hat. </p> <p> Anwendungsspezifische Aktion, auf die in der Inspektoransicht über `class=` verwiesen wird, anstatt ein globales `@TagName` zu beanspruchen. </p>
com.top_logic.layout.view.inspector.InspectedNodeElement = Untersuchtes Element
com.top_logic.layout.view.inspector.InspectedNodeElement.Config.node = Knoten
com.top_logic.layout.view.inspector.InspectedNodeElement.Config.node.tooltip = Der Kanal, der das anzuzeigende <i>untersuchte Element</i> enthält.
com.top_logic.layout.view.inspector.InspectedNodeElement.Config.selection = Auswahl
com.top_logic.layout.view.inspector.InspectedNodeElement.Config.selection.tooltip = Optionaler Kanal, der die ausgewählten Zustandspfade enthält: ein Pfad als dieser Pfad, mehrere als deren Menge, keiner als null.
com.top_logic.layout.view.inspector.InspectedNodeElement.tooltip = Zeigt an, was das untersuchte Steuerelement enthält: seine Identität, seinen Zustand Eintrag für Eintrag und die von ihm angebotenen Aktionen. <p> Der Zustand wird flach in einer Zeile pro Blattwert dargestellt, adressiert durch den gepunkteten Pfad, nach dem eine Assertion ihn benennt, sodass eine gruppierte Beobachtung – was eine Tabelle beispielsweise verborgen hat, weil der Benutzer sie möglicherweise nicht lesen kann – genauso auswählbar ist wie ein einfacher Zustandsschlüssel. Die ausgewählten Pfade werden in den Auswahlkanal geschrieben, aus dem ein Befehl die zu prüfenden Elemente entnehmen kann. </p> <p> Das Element folgt dem Knotenkanal und aktualisiert die von ihm erstellten Steuerelemente: Die Identitätstexte erhalten neue Werte, die Tabellen neue Zeilen. Es wird nichts entsorgt und neu aufgebaut, sodass ein Steuerelement, das denselben Kanal abhört, niemals abgebaut wird, solange dieser Kanal noch Benachrichtigungen sendet. </p> <p> Anwendungsspezifisches Widget, auf das in der Inspektoransicht über `class=` verwiesen wird, anstatt ein globales `@TagName` zu beanspruchen. </p>
com.top_logic.layout.view.inspector.RecordAssertionAction = Zusicherung aufzeichnen
com.top_logic.layout.view.inspector.RecordAssertionAction.Config.node = Knoten
com.top_logic.layout.view.inspector.RecordAssertionAction.Config.node.tooltip = Der Kanal, der das <i>untersuchte Element</i> enthält, für das die Zusicherung aufgezeichnet wird.
com.top_logic.layout.view.inspector.RecordAssertionAction.tooltip = Wandelt die im UI-Inspektor ausgewählten Zustandseinträge in einen Zusicherungs-Schritt der laufenden Skript-Aufzeichnung um. <p> Die Eingabe der Aktion ist die Auswahl der Zustandstabelle – die vom Benutzer markierten Pfade – und der konfigurierte Kanal enthält das untersuchte Element, aus dem sie stammen. Aufgezeichnet wird der Teil des Zustands dieses Elements, auf den sich die Pfade beziehen, sodass die Zusicherung die vom Benutzer ausgewählten Beobachtungen prüft und alles andere, was das Element anzeigt, außer Acht lässt. Der Schritt geht an den Rekorder des untersuchten Fensters – denselben Rekorder, in dem auch die eigenen Interaktionen des Benutzers erfasst werden –, sodass die Prüfung zwischen den Schritten landet, zwischen die sie gehört. Ohne laufende Aufzeichnung wird nichts aufgezeichnet, denn erst ein Skript, zu dem die Zusicherung gehören kann, macht sie zu einem Schritt. </p> <p> Anwendungsspezifische Aktion, auf die in der Inspektoransicht über class= verwiesen wird, anstatt ein globales @TagName zu beanspruchen. </p>
com.top_logic.layout.view.inspector.SelectElementAction = Element wählen
com.top_logic.layout.view.inspector.SelectElementAction.Config.node = Knoten
com.top_logic.layout.view.inspector.SelectElementAction.Config.node.tooltip = Der Kanal, der das <i>untersuchte Element</i> des gewählten Elements empfängt.
com.top_logic.layout.view.inspector.SelectElementAction.tooltip = Ermöglicht es dem Benutzer, auf ein Element im untersuchten Fenster zu klicken, und überträgt das angeklickte Element in den Knotenkanal des Inspektors. <p> Das untersuchte Fenster ist dasjenige, das dieses Seitenfenster geöffnet hat. Der Klick wird asynchron zurückgemeldet, daher gibt die Aktion den untersuchten Knoten nicht zurück: Sie schreibt den Kanal selbst über den Callback, den der Picker ausführt, sobald der Benutzer geklickt hat. Das Inspektor-Fenster wird daraufhin wieder in den Vordergrund geholt, da der Benutzer auf das Anwendungsfenster geblickt hat, um dort zu klicken. </p> <p> Anwendungsspezifische Aktion, auf die in der Inspektoransicht über `class=` verwiesen wird, anstatt ein globales `@TagName` zu beanspruchen. </p>
com.top_logic.layout.view.job.ChunkedScriptJobBody = Blockweise festgeschriebener Skriptauftrag
com.top_logic.layout.view.job.ChunkedScriptJobBody$Config$Step = Schritt
com.top_logic.layout.view.job.ChunkedScriptJobBody$Config$Step.tooltip = Ein Durchlauf über die Arbeitselemente.
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.Step.expr = Ausdruck
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.Step.expr.tooltip = Das Skript des Durchlaufs, aufgerufen mit dem Monitor des Auftrags, dem Block von Arbeitselementen, den es verarbeiten soll, und dem Zustand. <p> Es läuft in einer Transaktion, die festgeschrieben wird, sobald es zurückkehrt, und es läuft erneut für ein einzelnes Element, während ein fehlgeschlagener Block wiederholt wird; was es tut, muss daher für ein bereits gesehenes Element wiederholbar sein. </p>
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.Step.label = Bezeichnung
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.Step.label.tooltip = Was der Leser für diesen Durchlauf sieht; dessen Nummer, wenn keine angegeben ist.
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.chunk-size = Blockgröße
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.chunk-size.tooltip = Wie viele Arbeitselemente eine Transaktion umfasst.
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.elements = Elemente
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.elements.tooltip = Skript, das die Arbeitselemente liefert, einmal gegen den Zustand ausgewertet, lesend und außerhalb jeder Transaktion. <p> Aufgerufen mit dem Monitor des Auftrags und dem Zustand. Eine Sammlung ist die Liste der Elemente, jeder andere Wert ist das einzelne Element, für das er steht. </p>
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.finish = Abschluss
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.finish-label = Bezeichnung des Abschlusses
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.finish-label.tooltip = Was der Leser für den Abschluss sieht, den Schritt, mit dem der Auftrag endet.
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.finish.tooltip = Skript, das einmal ausgeführt wird, nachdem jeder Durchlauf festgeschrieben ist, in einer eigenen Transaktion und gegen den Zustand. <p> Aufgerufen mit dem Monitor des Auftrags und dem Zustand. Der einmalige Abschluss, der alles Festgeschriebene sehen muss – eine Sequenz hinter das Importierte zurücksetzen, eine Kennzahl berechnen –, und was er liefert, ist das Ergebnis des Auftrags. Arbeit, die sich über die Elemente erstreckt, gehört in einen späteren Durchlauf, nicht hierher. </p>
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.init = Initialisierung
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.init-label = Bezeichnung der Vorbereitung
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.init-label.tooltip = Was der Leser für die Vorbereitung sieht, den Schritt, mit dem der Auftrag beginnt.
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.init.tooltip = Skript, das den Zustand liefert, gegen den die späteren Skripte arbeiten, einmal in einer eigenen Transaktion ausgeführt. <p> Aufgerufen mit dem Monitor des Auftrags, gefolgt von den Werten, mit denen der Auftrag gestartet wurde. Es liefert das, was die Durchläufe erreichen müssen – typischerweise den Behälter, in dem die Arbeitselemente angelegt werden und der vor ihnen persistent sein muss. Ist es nicht gesetzt, ist der erste Wert, mit dem der Auftrag gestartet wurde, der Zustand. </p>
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.steps = Schritte
com.top_logic.layout.view.job.ChunkedScriptJobBody.Config.steps.tooltip = Die Durchläufe über die Arbeitselemente, der Reihe nach abgearbeitet. <p> Jeder Durchlauf wird auf aufeinanderfolgende Blöcke von <i>Blockgröße</i> Elementen angewendet, wobei jeder Block für sich festgeschrieben wird. Ein fehlgeschlagener Block wird Element für Element wiederholt, sodass nur die Elemente übersprungen werden, die tatsächlich nicht verarbeitet werden können – jedes von ihnen gemeldet und gezählt –, statt den ganzen Durchlauf aufzugeben. </p> <p> Ein Durchlauf beginnt, sobald der Durchlauf vor ihm jeden Block festgeschrieben hat. Arbeit, die alle Elemente eines früheren Durchlaufs sehen muss – etwa Querverweise zwischen ihnen aufzulösen –, gehört daher in einen späteren Durchlauf, wo sie ebenfalls blockweise und fehlertolerant abläuft. </p>
com.top_logic.layout.view.job.ChunkedScriptJobBody.tooltip = Die Arbeit eines lang laufenden Auftrags, als TL-Script geschrieben und blockweise festgeschrieben. <p> Die Arbeit eines Auftrags läuft außerhalb jeder Transaktion, und TL-Script öffnet keine. Dies ist der transaktionale Rahmen um skriptgeschriebene Arbeit, die persistente Objekte erzeugt: Die Arbeitselemente werden in Blöcken von <i>Blockgröße</i> Elementen durchlaufen, wobei jeder Block für sich festgeschrieben wird. So bleibt der Speicherbedarf begrenzt, ein Fehlschlag spät im Lauf bewahrt, was die früheren Blöcke erzeugt haben, und ein einzelnes Element, das nicht verarbeitet werden kann, kostet nur sich selbst. </p> <p> Jedes Skript wird mit dem Monitor des Auftrags als erstem Argument aufgerufen – dem undurchsichtigen Wert, auf dem die meldenden Funktionen aufgerufen werden, sodass ein Skript mit <code>$job.jobMessage('…')</code> sagt, was es gerade tut: </p> <ul> <li><i>Initialisierung</i> als <code>job -&gt; a -&gt; b -&gt; …</code>, der Monitor, gefolgt von den Werten, mit denen der Auftrag gestartet wurde,</li> <li><i>Elemente</i> als <code>job -&gt; state -&gt; …</code>,</li> <li><i>Ausdruck</i> (<i>Schritt der Konfiguration</i>) als <code>job -&gt; chunk -&gt; state -&gt; …</code>,</li> <li><i>Abschluss</i> als <code>job -&gt; state -&gt; …</code>.</li> </ul> <p> Der <em>Zustand</em> ist das, was die Skripte verbindet: Er ist der Wert, den die <i>Initialisierung</i> erzeugt hat, und jedes spätere Skript erhält ihn. Gibt es keine Vorbereitung, ist der Zustand der erste Wert, mit dem der Auftrag gestartet wurde. Ein Zustand, der sich während des Laufs ändern muss, ist ein transientes Objekt, <code>new(`my:State`, transient: true)</code>, dessen Attribute die Durchläufe setzen; mehrere Objekte, welche die Durchläufe brauchen, sind ein Map-Literal. </p> <pre> &lt;body class="com.top_logic.layout.view.job.ChunkedScriptJobBody" chunk-size="100"&gt; &lt;init-label&gt;&lt;en&gt;Reading the file&lt;/en&gt;&lt;/init-label&gt; &lt;init&gt;job -&gt; file -&gt; $file.parse()&lt;/init&gt; &lt;elements&gt;job -&gt; state -&gt; $state.get(`my:Import#rows`)&lt;/elements&gt; &lt;steps&gt; &lt;step&gt; &lt;label&gt;&lt;en&gt;Creating the records&lt;/en&gt;&lt;/label&gt; &lt;expr&gt;job -&gt; chunk -&gt; state -&gt; $chunk.foreach(r -&gt; $state.create($r))&lt;/expr&gt; &lt;/step&gt; &lt;/steps&gt; &lt;finish&gt;job -&gt; state -&gt; $state.get(`my:Import#created`)&lt;/finish&gt; &lt;/body&gt; </pre> <p> Das Ergebnis des Auftrags ist das, was der <i>Abschluss</i> erzeugt hat; eine Arbeit ohne Abschluss endet mit dem Text, der sagt, wie viele Elemente verarbeitet und wie viele übersprungen wurden. </p>
com.top_logic.layout.view.job.JobFunctions.error = Fehler des Auftrags
com.top_logic.layout.view.job.JobFunctions.error.param.job.tooltip = Der Zustand eines Auftrags, wie ihn sein Kanal hält.
com.top_logic.layout.view.job.JobFunctions.error.return = Die Meldung des Fehlschlags, oder gar nichts für einen Auftrag, der nicht fehlgeschlagen ist.
com.top_logic.layout.view.job.JobFunctions.error.tooltip = Warum der angegebene Auftrag fehlgeschlagen ist.
com.top_logic.layout.view.job.JobFunctions.indeterminate = Einen unbekannten Fortschritt melden
com.top_logic.layout.view.job.JobFunctions.indeterminate.param.job.tooltip = Der Auftrag, der seinen Fortschritt aufgibt, das erste Argument der Funktion, die seine Arbeit erledigt.
com.top_logic.layout.view.job.JobFunctions.indeterminate.tooltip = Gibt an, dass der Auftrag nicht weiß, wie viel seiner Arbeit erledigt ist. <p> Die Anzeige zeigt dann, dass etwas geschieht, ohne zu zeigen, wie weit es gekommen ist, bis der Auftrag wieder einen Fortschritt meldet. </p>
com.top_logic.layout.view.job.JobFunctions.isFinished = Auftrag ist beendet
com.top_logic.layout.view.job.JobFunctions.isFinished.param.job.tooltip = Der Zustand eines Auftrags, wie ihn sein Kanal hält; gar kein Auftrag ist nicht beendet.
com.top_logic.layout.view.job.JobFunctions.isFinished.return = Ob der Auftrag beendet ist.
com.top_logic.layout.view.job.JobFunctions.isFinished.tooltip = Ob der angegebene Auftrag beendet ist, gleich wie er geendet hat.
com.top_logic.layout.view.job.JobFunctions.isRunning = Auftrag läuft
com.top_logic.layout.view.job.JobFunctions.isRunning.param.job.tooltip = Der Zustand eines Auftrags, wie ihn sein Kanal hält; gar kein Auftrag läuft nicht.
com.top_logic.layout.view.job.JobFunctions.isRunning.return = Ob der Auftrag noch arbeitet.
com.top_logic.layout.view.job.JobFunctions.isRunning.tooltip = Ob der angegebene Auftrag noch arbeitet, sich das von ihm Berichtete also noch ändert.
com.top_logic.layout.view.job.JobFunctions.message = Melden, was der Auftrag gerade tut
com.top_logic.layout.view.job.JobFunctions.message.param.job.tooltip = Der Auftrag, der meldet, was er tut, das erste Argument der Funktion, die seine Arbeit erledigt.
com.top_logic.layout.view.job.JobFunctions.message.param.message.tooltip = Was der Benutzer sieht - ein Text oder ein internationalisierter, geschrieben als <code>#('Reading'@en, 'Lesen'@de)</code>; gar nichts sagt nichts.
com.top_logic.layout.view.job.JobFunctions.message.tooltip = Gibt an, was der Auftrag gerade tut.
com.top_logic.layout.view.job.JobFunctions.phase = Einen Schritt des Auftrags beginnen
com.top_logic.layout.view.job.JobFunctions.phase.param.job.tooltip = Der Auftrag, der den Schritt beginnt, das erste Argument der Funktion, die seine Arbeit erledigt.
com.top_logic.layout.view.job.JobFunctions.phase.param.name.tooltip = Der Name des Schritts, der begonnen wird.
com.top_logic.layout.view.job.JobFunctions.phase.tooltip = Beginnt den genannten Schritt des Auftrags und markiert die übersprungenen Schritte als erledigt. <p> Der Schritt ist einer der Schritte, die der Auftrag angekündigt hat, sei es in seiner Konfiguration oder mit <code>jobPhases</code>; einen anderen Schritt zu benennen beendet den Auftrag mit einem Fehler. Ein Auftrag, der in einem Schritt nichts zu tun hat, beginnt ihn einfach nicht. </p>
com.top_logic.layout.view.job.JobFunctions.phases = Die Schritte des Auftrags ankündigen
com.top_logic.layout.view.job.JobFunctions.phases.param.job.tooltip = Der Auftrag, der seine Schritte ankündigt, das erste Argument der Funktion, die seine Arbeit erledigt.
com.top_logic.layout.view.job.JobFunctions.phases.param.phases.tooltip = Die Schritte, als Liste von Namen oder als Abbildung von einem Namen auf das, was der Benutzer sieht.
com.top_logic.layout.view.job.JobFunctions.phases.tooltip = Ersetzt die Schritte, die der Auftrag ankündigt. <p> Für einen Auftrag, der erst während seiner Arbeit erfährt, was er zu tun hat. Die Schritte werden entweder als Liste von Namen angegeben, die dann auch das sind, was der Benutzer sieht, oder als Abbildung vom Namen eines Schritts auf das, was der Benutzer für ihn sieht - ein Text oder ein internationalisierter, geschrieben als <code>#('Reading'@en, 'Lesen'@de)</code>. Sie werden in der Reihenfolge angekündigt, in der die Liste oder die Abbildung sie angibt. </p><pre> $job.jobPhases({'read': #('Reading'@en), 'write': #('Writing'@en)}); </pre>
com.top_logic.layout.view.job.JobFunctions.progress = Den Fortschritt des Auftrags melden
com.top_logic.layout.view.job.JobFunctions.progress.param.done.tooltip = Wie viel erledigt ist.
com.top_logic.layout.view.job.JobFunctions.progress.param.job.tooltip = Der Auftrag, der seinen Fortschritt meldet, das erste Argument der Funktion, die seine Arbeit erledigt.
com.top_logic.layout.view.job.JobFunctions.progress.param.total.tooltip = Wie viel es insgesamt gibt; gar nichts lässt den Fortschritt leer, statt dadurch zu teilen.
com.top_logic.layout.view.job.JobFunctions.progress.tooltip = Gibt an, wie viel der Arbeit erledigt ist, als die beiden Zahlen, deren Verhältnis der Fortschritt ist.
com.top_logic.layout.view.job.JobFunctions.result = Ergebnis des Auftrags
com.top_logic.layout.view.job.JobFunctions.result.param.job.tooltip = Der Zustand eines Auftrags, wie ihn sein Kanal hält.
com.top_logic.layout.view.job.JobFunctions.result.return = Das Ergebnis des Auftrags, oder gar nichts für einen Auftrag, der nicht abgeschlossen ist.
com.top_logic.layout.view.job.JobFunctions.result.tooltip = Was der angegebene Auftrag hervorgebracht hat.
com.top_logic.layout.view.job.JobFunctions.status = Status des Auftrags
com.top_logic.layout.view.job.JobFunctions.status.param.job.tooltip = Der Zustand eines Auftrags, wie ihn sein Kanal hält.
com.top_logic.layout.view.job.JobFunctions.status.return = Wie der Auftrag steht, oder gar nichts, wenn es keinen Auftrag gibt.
com.top_logic.layout.view.job.JobFunctions.status.tooltip = Wie der angegebene Auftrag steht, als einer der Texte <code>running</code>, <code>completed</code>, <code>failed</code> und <code>cancelled</code>. <p> Ein Text, damit eine Anzeige darüber verzweigen kann: <code>&lt;case match="'completed'"&gt;</code>. </p>
com.top_logic.layout.view.job.JobStatus = Auftragsstatus
com.top_logic.layout.view.job.JobStatus.CANCELLED = Abgebrochen
com.top_logic.layout.view.job.JobStatus.CANCELLED.tooltip = Der Auftrag wurde abgebrochen, er hat daher weder ein Ergebnis noch einen Fehler geliefert.
com.top_logic.layout.view.job.JobStatus.COMPLETED = Abgeschlossen
com.top_logic.layout.view.job.JobStatus.COMPLETED.tooltip = Der Auftrag ist bis zu seinem Ende gelaufen und hat sein Ergebnis geliefert.
com.top_logic.layout.view.job.JobStatus.FAILED = Fehlgeschlagen
com.top_logic.layout.view.job.JobStatus.FAILED.tooltip = Der Auftrag wurde mit einem Fehler beendet, den der Status benennt.
com.top_logic.layout.view.job.JobStatus.RUNNING = Läuft
com.top_logic.layout.view.job.JobStatus.RUNNING.tooltip = Der Auftrag arbeitet noch; sein Fortschritt und seine Phase ändern sich weiterhin.
com.top_logic.layout.view.job.JobStatus.tooltip = Wie ein lang laufender Auftrag beendet wurde, oder dass er noch nicht beendet ist. <p> Ein Auftrag geht von <i>Läuft</i> in genau einen der drei Endzustände über und bleibt dort: Was die Anzeige über einen beendeten Auftrag zeigt - das Ergebnis, der Fehler, die Phase, in der er stehen geblieben ist - ändert sich nicht mehr. </p>
com.top_logic.layout.view.job.PhaseStatus = Phasenstatus
com.top_logic.layout.view.job.PhaseStatus.ACTIVE = Aktiv
com.top_logic.layout.view.job.PhaseStatus.ACTIVE.tooltip = Die Phase, in der der Auftrag gerade steht.
com.top_logic.layout.view.job.PhaseStatus.DONE = Erledigt
com.top_logic.layout.view.job.PhaseStatus.DONE.tooltip = Der Auftrag hat diese Phase hinter sich - sie ist gelaufen oder sie wurde übersprungen.
com.top_logic.layout.view.job.PhaseStatus.PENDING = Ausstehend
com.top_logic.layout.view.job.PhaseStatus.PENDING.tooltip = Der Auftrag hat diese Phase noch nicht erreicht.
com.top_logic.layout.view.job.PhaseStatus.tooltip = Wo eine einzelne Phase eines Auftrags im Verhältnis zu der Phase steht, in der der Auftrag gerade ist. <p> Rein positionsbezogen: Es sagt, ob der Auftrag eine Phase hinter sich hat, gerade in ihr steht oder sie noch nicht erreicht hat. Ob an der Phase, in der der Auftrag steht, noch gearbeitet wird, sagt der <i>Auftragsstatus</i> - die Phase, in der ein fehlgeschlagener Auftrag stehen geblieben ist, ist die <i>aktive</i>. </p>
com.top_logic.layout.view.job.ScriptJobBody = Auftrag als TL-Script
com.top_logic.layout.view.job.ScriptJobBody.Config.function = Funktion
com.top_logic.layout.view.job.ScriptJobBody.Config.function.tooltip = TL-Script-Funktion, die die Arbeit des Auftrags erledigt. <p> Sie wird mit dem Monitor des Auftrags als erstem Argument aufgerufen, gefolgt von den Werten, mit denen der Auftrag gestartet wurde. </p>
com.top_logic.layout.view.job.ScriptJobBody.tooltip = Die Arbeit eines Auftrags, geschrieben als TL-Script-Funktion. <p> Die Funktion wird mit dem <i>Monitor</i> des Auftrags als erstem Argument aufgerufen, gefolgt von den Werten, mit denen der Auftrag gestartet wurde, in der Reihenfolge, in der der Aufrufer sie angegeben hat. Der Monitor ist für das Skript ein undurchsichtiges Objekt: Er wird an die Funktionen weitergereicht, die eine Phase, einen Fortschritt oder eine Meldung berichten, und wird sonst nicht betrachtet. </p><pre> job -&gt; customers -&gt; x -&gt; { $customers.forEach(c -&gt; $c.doSomething()); $customers.size(); } </pre> <p> Was die Funktion zurückgibt, ist das Ergebnis des Auftrags. </p>
com.top_logic.layout.view.job.StartJobAction = Auftrag starten
com.top_logic.layout.view.job.StartJobAction$PhaseConfig = Phase
com.top_logic.layout.view.job.StartJobAction$PhaseConfig.tooltip = Konfiguration eines einzelnen Schrittes, den ein Auftrag durchläuft.
com.top_logic.layout.view.job.StartJobAction.Config.body = Implementierung
com.top_logic.layout.view.job.StartJobAction.Config.body.tooltip = Die Aufgabenbeschreibung, geschrieben in Java. <p> Die Alternative zu einer TL-Script-Funktion für Aufgaben, die nicht als Ausdruck dargestellt werden. Genau eines davon und eine Funktion beschreiben, was der Job tut. </p>
com.top_logic.layout.view.job.StartJobAction.Config.cancelable = Abbrechbar
com.top_logic.layout.view.job.StartJobAction.Config.cancelable.tooltip = Ob der Benutzer diesen Auftrag anhalten darf. <p> Nur für Arbeit, die halb fertig aufgegeben werden darf: Der Auftrag wird gebeten anzuhalten und endet an der nächsten Stelle, von der er berichtet, nachdem er einen Teil dessen getan hat, wofür er gestartet wurde. </p>
com.top_logic.layout.view.job.StartJobAction.Config.function = Funktion
com.top_logic.layout.view.job.StartJobAction.Config.function.tooltip = TL-Script-Funktion, die die Arbeit des Jobs ausführt. <p> Wird mit dem Monitor des Jobs als erstem Argument aufgerufen, gefolgt von den Werten der Eingangskanäle in der Reihenfolge ihrer Deklaration und dem aktuellen Wert des Befehls als letztem Argument. </p> <p> Genau eine solche Funktion und ihr eigener Funktionskörper legen fest, was der Auftrag tut. </p>
com.top_logic.layout.view.job.StartJobAction.Config.job = Auftrag
com.top_logic.layout.view.job.StartJobAction.Config.job.tooltip = Der Kanal, auf dem der Auftrag seinen Zustand veröffentlicht. <p> Er enthält vom Start des Auftrags an einen <i>Auftragszustand</i>, und bei jedem Bericht des Auftrags einen neuen. Was den Auftrag anzeigt, liest ihn von dort. </p>
com.top_logic.layout.view.job.StartJobAction.Config.phases = Phasen
com.top_logic.layout.view.job.StartJobAction.Config.phases.tooltip = Die Schritte, die der Auftrag durchläuft, in ihrer Reihenfolge. <p> Hier angegeben, damit die Anzeige den ganzen Weg kennt, bevor der Auftrag ihn gegangen ist. Der Auftrag benennt den Schritt, in den er eintritt, mit dessen Namen; ein Auftrag, der seine Schritte nicht benennt, gibt keine an. </p>
com.top_logic.layout.view.job.StartJobAction.Config.update-interval = Aktualisierungsintervall
com.top_logic.layout.view.job.StartJobAction.Config.update-interval.tooltip = Die kürzeste Zeit in Millisekunden zwischen zwei Zuständen, die ein Auftrag veröffentlicht. <p> Ein Auftrag, der schneller berichtet, wird in diesem Takt verfolgt, damit ein Auftrag, der Tausende von Elementen zählt, den Browser nicht mit Aktualisierungen überschwemmt. </p>
com.top_logic.layout.view.job.StartJobAction.PhaseConfig.label = Bezeichnung
com.top_logic.layout.view.job.StartJobAction.PhaseConfig.label.tooltip = Was der Benutzer für diesen Schritt sieht; dessen Name, wenn nichts angegeben ist.
com.top_logic.layout.view.job.StartJobAction.PhaseConfig.name = Name
com.top_logic.layout.view.job.StartJobAction.PhaseConfig.name.tooltip = Die Kennung, mit der der Auftrag diesen Schritt benennt; eindeutig unter den Schritten eines Auftrags.
com.top_logic.layout.view.job.StartJobAction.tooltip = <i>Aktion</i>, die ihre Arbeit an einen Worker-Thread übergibt und das Kommando darauf warten lässt. <p> Arbeit, die länger dauert, als eine Anfrage dauern darf, gehört nicht in die Anfrage: Die Aktion startet sie, veröffentlicht, was sie berichtet, als <i>Auftragszustand</i> auf dem angegebenen Kanal und hält das Kommando an, bis die Arbeit beendet ist. Eine an diesen Kanal gebundene Anzeige verfolgt den Auftrag, während er läuft - in welchem Schritt er ist, wie weit er gekommen ist, was er gerade tut - und darf ihn bitten anzuhalten. </p> <p> Sobald der Auftrag abgeschlossen ist, macht das Kommando dort weiter, wo es angehalten hat, mit dem Ergebnis des Auftrags als seinem Wert; ein Auftrag, der fehlschlägt oder abgebrochen wird, bricht das Kommando ab, sodass die Kompensationen der Aktionen davor laufen und der Fehler im letzten Zustand des Auftrags sichtbar bleibt. Die Arbeit läuft außerhalb jeder Transaktion: Ihr Ergebnis zu speichern ist Sache der Aktionen, die ihr folgen. </p><pre> &lt;start-job job="importState" cancelable="true"&gt; &lt;phases&gt; &lt;phase name="read"&gt;&lt;label&gt;&lt;de&gt;Lesen&lt;/de&gt;&lt;/label&gt;&lt;/phase&gt; &lt;phase name="check"&gt;&lt;label&gt;&lt;de&gt;Prüfen&lt;/de&gt;&lt;/label&gt;&lt;/phase&gt; &lt;/phases&gt; &lt;body class="com.acme.ImportJob"/&gt; &lt;/start-job&gt; </pre>
com.top_logic.layout.view.list.LinkElementAction = Aktion für Link-Element
com.top_logic.layout.view.list.LinkElementAction.tooltip = <i>Aktion anzeigen</i>, die den aktuellen Eingabewert der Kette über die umschließende &lt;object-list&gt; anfügt. <p> Führt die konfigurierte Verknüpfungsfunktion der Liste mit den Werten der Eingaben der Liste und dem Element in einer Transaktion aus und setzt anschließend den Kanal für neue Elemente der Liste auf ein neues temporäres Element zurück. Typische Verwendung in einer Vorlage für neue Elemente, nachdem die eingegebenen Feldwerte in das temporäre Element geschrieben wurden: </p><pre> &lt;generic-command placement="TOOLBAR"&gt; &lt;store-form-state/&gt; &lt;link-element/&gt; &lt;/generic-command&gt; </pre>
com.top_logic.layout.view.list.ObjectListElement = Element der Objektliste
com.top_logic.layout.view.list.ObjectListElement$Layout = Layout
com.top_logic.layout.view.list.ObjectListElement$Layout.tooltip = Wie ein <i>Element einer Objektliste</i> seine Elemente anordnet.
com.top_logic.layout.view.list.ObjectListElement.Config.element-channel = Elementkanal
com.top_logic.layout.view.list.ObjectListElement.Config.element-channel.tooltip = Name des Kanals, der das aktuelle Element in die Elementvorlage einfügt.
com.top_logic.layout.view.list.ObjectListElement.Config.element-type = Elementtyp
com.top_logic.layout.view.list.ObjectListElement.Config.element-type.tooltip = Der Typ des temporären Elements, das für die Vorlage „new-element“ erstellt wurde.
com.top_logic.layout.view.list.ObjectListElement.Config.empty-text = Leerer Text
com.top_logic.layout.view.list.ObjectListElement.Config.empty-text.tooltip = Text, der anstelle der Einträge angezeigt wird, wenn die Liste leer ist.
com.top_logic.layout.view.list.ObjectListElement.Config.item = Element
com.top_logic.layout.view.list.ObjectListElement.Config.item.tooltip = Der Inhalt wird einmal pro Listenelement instanziiert, wobei das Element auf dem Elementkanal veröffentlicht wird. <p> Gewöhnlicher Ansichtsinhalt: in der Regel ein einzelnes &lt;view-ref&gt;-Element, das an den Elementkanal gebunden ist, oder inline geschriebene Elemente. Mehrere Einträge werden vertikal übereinander angeordnet. </p>
com.top_logic.layout.view.list.ObjectListElement.Config.items = Elemente
com.top_logic.layout.view.list.ObjectListElement.Config.items.tooltip = TL-Script-Funktion, die die angezeigten Elemente aus den Werten der Eingaben berechnet: ...inputs -&gt; elements. <p> Wird bei jeder Änderung einer Eingabe erneut angewendet, sodass die angezeigten Elemente den aktuellen Werten der Eingaben entsprechen. Eine Eingabe, deren Objekt inzwischen gelöscht wurde, wird als kein Wert übergeben. </p>
com.top_logic.layout.view.list.ObjectListElement.Config.layout = Layout
com.top_logic.layout.view.list.ObjectListElement.Config.layout.tooltip = Wie die Elemente angeordnet sind. <p> Bei einer Liste werden die Elemente untereinander angeordnet, bei einem Raster so viele nebeneinander, wie hineinpassen. Die Rasteroptionen gelten nur für das Raster, mit Ausnahme des Abstands zwischen den Elementen, der sie in beiden Anordnungen voneinander trennt. </p>
com.top_logic.layout.view.list.ObjectListElement.Config.link = Link
com.top_logic.layout.view.list.ObjectListElement.Config.link.tooltip = TL-Script-Funktion zum Anhängen eines neu zusammengesetzten Elements: ...inputs -&gt; element -&gt; .... <p> Wird von &lt;link-element&gt; in einer Transaktion ausgeführt. Das hinter den Eingabewerten übergebene Element ist das transiente Objekt der „new-element“-Vorlage; die Funktion ist dafür verantwortlich, es persistent zu machen (z. B. über eine nicht-transiente Kopie) und es an der richtigen Stelle einzufügen. </p>
com.top_logic.layout.view.list.ObjectListElement.Config.new-element = Neues Element
com.top_logic.layout.view.list.ObjectListElement.Config.new-element-channel = Neuer Elementkanal
com.top_logic.layout.view.list.ObjectListElement.Config.new-element-channel.tooltip = Name des Kanals, der das vorübergehende Element in die Vorlage für neue Elemente einfügt.
com.top_logic.layout.view.list.ObjectListElement.Config.new-element.tooltip = Der Inhalt wird einmalig hinter den Elementen zur Eingabe eines neuen Elements instanziiert, wobei das neue temporäre Element auf dem Kanal „new-element“ veröffentlicht wird; bei einer schreibgeschützten Liste entfällt dies. <p> Wird angezeigt, solange jede Eingabe einen Wert enthält, denn ein Element wird zusammengestellt, um irgendwo angefügt zu werden. Gewöhnlicher Ansichtsinhalt, wie <i>Element</i>. </p>
com.top_logic.layout.view.list.ObjectListElement.Config.observed-types = Beobachtete Typen
com.top_logic.layout.view.list.ObjectListElement.Config.observed-types.tooltip = Typen, bei denen sich das Objekt ändert (Erstellen / Aktualisieren / Löschen), lösen eine Neubewertung der Elementabfrage aus, sodass die Liste automatisch aktualisiert wird. <p> Ist das Feld leer, wird der Elementtyp überwacht. </p>
com.top_logic.layout.view.list.ObjectListElement.Config.remove = Entfernen
com.top_logic.layout.view.list.ObjectListElement.Config.remove.tooltip = TL-Script-Funktion zum Abtrennen eines Elements: ...inputs -&gt; element -&gt; .... <p> Wird von &lt;remove-element&gt; in einer Transaktion ausgeführt, wobei das Element hinter den Eingabewerten übergeben wird. </p>
com.top_logic.layout.view.list.ObjectListElement.Layout.GRID = Raster
com.top_logic.layout.view.list.ObjectListElement.Layout.GRID.tooltip = So viele nebeneinander liegende Elemente, wie hineinpassen, wobei die Anordnung an die verfügbare Breite angepasst wird.
com.top_logic.layout.view.list.ObjectListElement.Layout.LIST = Liste
com.top_logic.layout.view.list.ObjectListElement.Layout.LIST.tooltip = Ein Element unter dem anderen, jedes davon so breit wie die Liste.
com.top_logic.layout.view.list.ObjectListElement.tooltip = Deklaratives <i>UI-Element</i>, das eine Inhaltsvorlage über eine berechnete Liste von Modellobjekten wiederholt (das Tag „ <object-list> “) – z. B. die Kommentare zu einem Ticket, die als Konversation dargestellt werden, oder die Produkte eines Katalogs, die als Kartenraster dargestellt werden. <p> Das Element ist modellunabhängig: Es ist an eine beliebige Anzahl von Eingaben sowie an drei Funktionen über deren Werte gebunden – die Element-Abfrage, die Verknüpfungsfunktion, die ein neu erstelltes Element anfügt, und die Entfernungsfunktion, die ein Element entfernt. Jeder Einbettungsstil ist möglich: eine zusammengesetzte Referenz, eine Rückreferenz auf das Element, eine Assoziation oder eine einfache Abfrage – die Funktionen entscheiden. </p> <p> Für jedes Element wird der Elementinhalt mit dem auf einem lokalen Kanal (<i>Element-Kanal</i>) veröffentlichten Element instanziiert, sodass der Inhalt typischerweise eine „ <form input="..."> “ über das Element bindet. Hinter den Elementen wird der Inhalt „new-element“ einmal instanziiert und an einen Kanal (<i>New-Element-Kanal</i>) gebunden, der ein neues, vorübergehendes Element vom <i>Typ „Element“</i> enthält; eine Befehlskette mit <store-form-state/> und &lt;link-element&gt; sorgt für dessen Persistenz. Innerhalb des Elementinhalts trennt &lt;remove-element&gt; das Element ab. </p> <p> Beide Slots enthalten gewöhnlichen Ansichtsinhalt, sodass das Layout pro Element keine maßgeschneiderte Vorlage, sondern ein reguläres <i>UI-Element</i> ist: typischerweise ein &lt;view-ref&gt; auf eine externe .view.xml-Datei, die den Elementkanal bindet und eigene Anzeigekanäle (z. B. Autor, Datum) deklariert, oder ein beliebiges Element inline. </p> <p> Die Elemente werden gemäß dem Layout angeordnet – standardmäßig in einer Spalte und in einem responsiven Raster, wenn pro Element eine Karte gewünscht ist. Die Anordnung umfasst allein die Elemente: Der leere Text und der Inhalt für ein neues Element folgen der Anordnung als Ganzes, statt einen Platz zwischen den Elementen einzunehmen. </p><pre> &lt;object-list inputs="catalogue" items="catalogue -&gt; $catalogue.get(`demo:Catalogue#products`)" layout="grid" max-columns="4" min-column-width="18rem" &gt; &lt;item&gt; &lt;view-ref view="catalogue/product-card.view.xml"&gt; &lt;bind channel="product" to="element"/&gt; &lt;/view-ref&gt; &lt;/item&gt; &lt;/object-list&gt; </pre> <p> Die angezeigte Liste folgt dem Modell: Änderungen an einer Eingabe, an angezeigten Elementen oder an Objekten der beobachteten Typen führen zu einer erneuten Elementabfrage; unveränderte Elemente behalten ihre Steuerelemente (einschließlich des Bearbeitungsstatus). </p>
com.top_logic.layout.view.list.RemoveElementAction = Aktion „Element entfernen“
com.top_logic.layout.view.list.RemoveElementAction.tooltip = <i>Aktion anzeigen</i>, die den aktuellen Eingabewert der Kette über die umschließende &lt;object-list&gt; abtrennt. <p> Führt die konfigurierte Entfernungsfunktion der Liste mit den Werten der Eingaben der Liste und dem Element in einer Transaktion aus. Typische Verwendung in einer Elementvorlage, wobei der Elementkanal als Befehlseingabe dient: </p><pre> &lt;generic-command placement="TOOLBAR" input="comment"&gt; &lt;remove-element/&gt; &lt;/generic-command&gt; </pre>
com.top_logic.layout.view.login.AnonymousOnly = Nur anonym
com.top_logic.layout.view.login.AnonymousOnly.tooltip = <i>Ausführbarkeitsregel für die Ansicht</i>, die einen Befehl nur für den anonymen Benutzer anzeigt (z. B. eine "Login"-Aktion) und ihn nach der Authentifizierung ausblendet.
com.top_logic.layout.view.login.AuthenticatedOnly = Nur authentifiziert
com.top_logic.layout.view.login.AuthenticatedOnly.tooltip = <i>Ausführbarkeitsregel für die Ansicht</i>, die einen Befehl nur für einen authentifizierten (nicht anonymen) Benutzer anzeigt (z. B. eine "Abmelden"-Aktion) und ihn für den anonymen Benutzer ausblendet.
com.top_logic.layout.view.login.ChangePasswordApplyAction = Passwort ändern Aktion anwenden
com.top_logic.layout.view.login.ChangePasswordApplyAction.tooltip = <i>Aktion anzeigen</i>, mit der ein neu gewähltes Passwort auf ein Konto angewendet wird. <p> Gilt für beide Arten der Passwortänderung. Eine Anmeldung mit einem abgelaufenen Passwort erzwingt die Änderung, bevor die Sitzung beendet wird: <i>Die Anmeldeaktion</i> öffnet den Dialog mit dem authentifizierten Konto auf Kanal <code>"account"</code>, und die verzögerte Anmeldung wird fortgesetzt, sobald das neue Passwort gespeichert ist. Ein Benutzer, der sein Passwort freiwillig ändert, hat bereits eine Sitzung; ein solcher Kanal ist nicht betroffen, das aktuelle Konto wird geändert, und danach wird nichts fortgesetzt. </p> <p> Erwartet als Eingabe das transiente Modell <code>"tl.login:PasswordChange"</code> (mit den Parametern „newPassword“ und „newPasswordConfirm“), z. B. nach <store-form-state/>. Die Überprüfung der Passwortrichtlinien und die eigentliche Änderung werden an das <i>Authentifizierungsgerät</i> delegiert, das zudem das Ablauf-Flag zurücksetzt und den Passwortverlauf verwaltet. Bei einem Verstoß gegen die Richtlinien oder einer Nichtübereinstimmung wird eine <i>TopLogic-Ausnahme</i> ausgelöst, sodass das Formular den Fehler anzeigt. </p> <p> Ein Konto, dessen Gerät das Passwort an anderer Stelle speichert – bei einem Verzeichnisdienst oder einem Identitätsanbieter –, wird abgelehnt, bevor das Gerät aufgefordert wird, etwas zu speichern, unabhängig davon, auf welchem Weg der Dialog aufgerufen wurde. Eine Ansicht entscheidet anhand derselben Bedingung, ob die Änderung überhaupt angeboten wird, und zwar mit der TL-Script-Funktion <code>accountPasswordChangeAllowed()</code>. </p>
com.top_logic.layout.view.login.DisableMfaAction = MFA-Aktion deaktivieren
com.top_logic.layout.view.login.DisableMfaAction.tooltip = Deaktiviert die Multi-Faktor-Authentifizierung für das als Eingabe übergebene Konto, sodass bei der nächsten Anmeldung nur noch das Passwort benötigt wird. <p> Löscht sowohl das gespeicherte Geheimnis als auch die Anforderung: Eine Anforderung ohne Geheimnis ist der Zustand, der bei der nächsten Anmeldung die Registrierung auslöst – das Gegenteil davon ist das Deaktivieren des zweiten Authentifizierungsfaktors. </p> <p> Ein Konto, bei dem der zweite Faktor verlangt wird – also <i>vorgeschrieben</i> und nicht frei gewählt –, kann diesen nicht deaktivieren. Ob dies der Fall ist, hängt vom jeweiligen Konto ab; daher wird diese Frage hier beantwortet und nicht der Ansicht überlassen, die die Aktion anbietet. </p>
com.top_logic.layout.view.login.EnableMfaAction = Aktivieren der MFA-Aktion
com.top_logic.layout.view.login.EnableMfaAction.Config.secret = Geheimnis
com.top_logic.layout.view.login.EnableMfaAction.Config.secret.tooltip = Ein festes Base32-TOTP-Geheimnis, das im Konto gespeichert wird (zum Testen des OTP-Anmeldepfads). <p> Wenn es leer ist, wird das Konto stattdessen als MFA-pflichtig ohne Geheimnis markiert, so dass die nächste Anmeldung die Registrierung auslöst. </p>
com.top_logic.layout.view.login.EnableMfaAction.tooltip = Administrative / <i>Demo-Ansicht-Aktion</i>, die die Multi-Faktor-Authentifizierung für das als Eingabe übergebene Konto konfiguriert, um die OTP-/Einschreibungs-Anmeldeschritte durchzuführen. <p> Mit einem konfigurierten Geheimnis wird dieses TOTP-Geheimnis im Konto gespeichert, so dass die nächste Anmeldung eine OTP-Verifizierung mit einem bekannten Geheimnis durchläuft. Ohne ein solches Geheimnis wird das gespeicherte Geheimnis gelöscht und MFA als erforderlich markiert, so dass die nächste Anmeldung die Registrierung durchläuft. </p>
com.top_logic.layout.view.login.EnrollMfaAction = Anmeldung zum MFA-Studiengang
com.top_logic.layout.view.login.EnrollMfaAction.tooltip = Richtet für den aktuellen Benutzer sofort einen zweiten Faktor ein, indem der Registrierungsdialog für ein neu generiertes Geheimnis geöffnet wird. <p> So nimmt ein Benutzer einen zweiten Authentifizierungsfaktor selbst in Gebrauch. Der Geheimcode wird erst dann gespeichert, wenn ein daraus generierter Code verifiziert wurde – was der Dialog übernimmt –, und die <i>MFA-Anforderung</i> des Kontos bleibt unverändert: Ein vom Benutzer gewählter zweiter Faktor ist einer, den er auch wieder deaktivieren kann – genau das bedeutet <i>„optional</i> “. Nur ein Administrator kann die Option <i>„erforderlich“</i> festlegen, und ein Konto, für das dies gilt, behält diese Einstellung bei. </p> <p> Das Gegenstück im Anmeldeablauf ist <i>die Anmeldeaktion</i>, die denselben Dialog für ein Konto öffnet, das einen zweiten Faktor verwenden muss und noch keinen hat. Der Unterschied besteht lediglich darin, wer darum gebeten hat: Dort besteht die Anwendung darauf, bevor sie den Benutzer hereinlässt; hier hat der Benutzer selbst darum gebeten, während er bereits angemeldet ist. </p>
com.top_logic.layout.view.login.ExpirePasswordAction = Aktion Passwort ablaufen
com.top_logic.layout.view.login.ExpirePasswordAction.tooltip = <i>Ansichtsaktion</i>, die das Passwort des als Eingabe übergebenen Kontos ablaufen lässt und eine Passwortänderung bei der nächsten Anmeldung des Kontos erzwingt. <p> Die Gültigkeitsdauer befindet sich im internen Berechtigungsnachweis-Speicher des Authentifizierungsgeräts (nicht als Modellattribut), kann also nicht über TL-Script festgelegt werden; diese Aktion wird an das <i>Authentifizierungsgerät</i> delegiert. Es handelt sich in erster Linie um eine Verwaltungs-/Demonstrationsmöglichkeit, um die erzwungene Änderung des Passworts bei der Anmeldung durchzuführen. </p>
com.top_logic.layout.view.login.LoginAction = Login-Aktion
com.top_logic.layout.view.login.LoginAction.tooltip = <i>Aktion</i>, die die Anmeldedaten des Eingabeobjekts authentifiziert und die Sitzung auf den resultierenden Benutzer umschaltet. <p> Erwartet als Eingabe ein (transientes) Objekt mit den Attributen „name“ und „password“, z. B. das Modell des Anmelde <form> s nach <store-form-state/>. Bei Erfolg wird der eigentliche Sitzungswechsel über <i>die Aktion „pending session“</i> auf den Reload verschoben; bei Fehlschlag wird eine <i>TopLogic-Ausnahme</i> ausgelöst, sodass das Formular den Fehler anzeigt. </p> <p> Vor dem Sitzungswechsel können Folgeschritte eingefügt werden (jeder als eigene Dialogansicht, wobei das Konto auf Kanal <code>"account"</code> übertragen wird): </p> <ul> <li>Ein abgelaufenes Passwort erzwingt einen Dialog zur Passwortänderung (<i>Aktion „Passwort ändern anwenden“</i>).</li> <li>Ein Konto mit einem TOTP-Geheimnis muss einen OTP-Verifizierungsdialog durchlaufen (<i>Aktion „OTP verifizieren“</i>).</li> <li>Ein Konto, für das MFA erforderlich ist, das aber noch keinen Secret hat, wird durch einen Registrierungsdialog geleitet, der einen Secret generiert, dessen QR-Code anzeigt und diesen über <i>die Aktion „OTP verifizieren“</i> bestätigt.</li> </ul> <p> Der eigentliche Sitzungswechsel (über <i>die Aktion „Pending Session“</i>) erfolgt erst, wenn der letzte Schritt die Anmeldung abschließt. </p>
com.top_logic.layout.view.login.LoginCommandsConfig = Konfiguration der Anmeldebefehle
com.top_logic.layout.view.login.LoginCommandsConfig.commands = Befehle
com.top_logic.layout.view.login.LoginCommandsConfig.commands.tooltip = Die bereitgestellten Elemente des Anmeldedialogs (in der Regel „ <button>“, die einen Dialog öffnen).
com.top_logic.layout.view.login.LoginCommandsConfig.tooltip = Anwendungskonfiguriertes Verzeichnis zusätzlicher Befehle, die zum React-Anmeldedialog beigetragen haben. <p> Die Anmeldungsansicht rendert diese über das Element „ <login-commands> “ (<i>Element für Anmeldungsbefehle</i>). Optionale Funktionsmodule (z. B. Passwort-Zurücksetzen im Self-Service, SSO-Anbieter) stellen ihre Schaltflächen hier über ein Anwendungs-Konfigurationsfragment bereit, ohne dass das Basisansichtsmodul von ihnen abhängig ist. </p>
com.top_logic.layout.view.login.LogoutCommand = Befehl "Abmelden
com.top_logic.layout.view.login.LogoutCommand.tooltip = <i>View-Befehl</i>, der die Sitzung wieder auf den anonymen Benutzer zurücksetzt. <p> Der Sitzungswechsel wird über die <i>ausstehende Sitzungsaktion</i> auf die nächste Anfrage des View-Servlets verschoben. Der Browser wird zur Wurzel der View-Anwendung geschickt: Die Seite, auf der der abgehende Benutzer war, gehört ihm und ist nicht die Startseite dessen, der sich als Nächstes an den Browser setzt. </p>
com.top_logic.layout.view.login.VerifyIdentityAction = Identität bestätigen
com.top_logic.layout.view.login.VerifyIdentityAction.Config.message = Nachricht
com.top_logic.layout.view.login.VerifyIdentityAction.Config.message.tooltip = Die Erläuterung oberhalb des Passwortfelds, die angibt, wofür das Passwort abgefragt wird. <p> Lohnt sich überall dort, wo die abgesicherte Aktion aus dem Dialog, in dem der Benutzer steht, nicht hervorgeht. Ohne Angabe wird eine allgemeine Aufforderung verwendet. Eine Sitzung, die bei einem externen Identitätsanbieter bestätigt wird, wird nicht nach einem Passwort gefragt und nennt ihre eigene Meldung. </p>
com.top_logic.layout.view.login.VerifyIdentityAction.Config.title = Titel
com.top_logic.layout.view.login.VerifyIdentityAction.Config.title.tooltip = Der Titel des Dialogs, der um die Bestätigung bittet. <p> Ohne Angabe wird ein allgemeiner Titel verwendet. </p>
com.top_logic.layout.view.login.VerifyIdentityAction.tooltip = Unterbrechbare <i>Ansichtsaktion</i>, die die Kette erst fortsetzt, nachdem der Benutzer erneut nachgewiesen hat, dass er der Inhaber des Kontos ist, zu dem die Sitzung gehört. <p> Die Sicherheitsmaßnahme für einen Schritt, dessen Auswirkungen über die Sitzung hinausreichen, in der er ausgeführt wurde – beispielsweise die Übertragung der Befugnis an einen Bevollmächtigten, im Namen des Benutzers zu handeln, oder die Änderung des Passworts selbst –, wobei es nicht darum geht, was die Sitzung tun darf, sondern darum, ob die Person am Bildschirm der Kontoinhaber ist. Wird in eine Befehlskette eingesetzt wie <confirm>, typischerweise nach <store-form-state/> und vor der Aktion, die sie schützt, damit während des Dialogs keine Transaktion offen steht. </p> <p> Der Nachweis erfolgt über die Art und Weise, wie die Sitzung aufgebaut wurde. Eine über einen externen Identitätsanbieter aufgebaute Sitzung wird dort bestätigt: Der Browser öffnet ein eigenes Fenster, durchläuft die Authentifizierung des Anbieters noch einmal und kehrt zur Anwendung zurück; der vom Nutzer zurückgelassene Dialog schließt sich von selbst, sobald die Bestätigung eingegangen ist. Jede andere Sitzung wird mit dem Passwort des eigenen Kontos bestätigt, das vom <i>Authentifizierungsgerät</i> des Kontos überprüft wird. </p> <p> Das zu bestätigende Konto ist immer das der jeweiligen Sitzung selbst; nichts, was die Ansicht übergibt, kann ein anderes benennen. Auf die Bestätigung hin wird die Kette mit unveränderter Eingabe fortgesetzt; ein abgebrochener Dialog bricht sie ab und führt die Kompensationen der bereits ausgeführten Aktionen aus. </p> <p> Die Absicherung verweigert im Zweifel. Wo sie nicht fragen kann – kein Sitzungskonto, das anonyme Konto, ein Konto, das weder ein Identitätsanbieter noch ein <i>Authentifizierungsgerät</i> bestätigen kann, oder ein Kontext ohne Dialogmanager – bricht die Kette ab, statt durchzulassen, und ein Passwort, das das Gerät nicht annimmt, ist ein nicht bestätigtes Passwort, ob es nun vertippt war oder das Gerät anderswo authentifiziert und gar keines annimmt. </p>
com.top_logic.layout.view.login.VerifyOtpAction = Otp-Aktion überprüfen
com.top_logic.layout.view.login.VerifyOtpAction.Config.persist = Bleiben Sie
com.top_logic.layout.view.login.VerifyOtpAction.Config.persist.tooltip = Ob das verifizierte Geheimnis im Konto gespeichert werden soll (MFA-Anmeldung). <p> Bei false (einfaches OTP-Login) trägt das Konto das Geheimnis bereits, so dass nichts gespeichert wird. </p>
com.top_logic.layout.view.login.VerifyOtpAction.tooltip = <i>Ansichtsaktion</i>, die den im MFA-Schritt des Anmeldeflusses eingegebenen Einmalcode verifiziert und bei Erfolg die verzögerte Anmeldung abschließt. <p> Liest den Code aus der Eingabe (das transiente <code>"tl.login:OtpEntry"</code> ), das TOTP-Geheimnis aus dem Kanal <code>"secret"</code> des Dialogs und das Konto aus dem Kanal <code>"account"</code>. Wenn persist gesetzt ist (der Anmeldefall), wird das soeben bestätigte Geheimnis im Konto gespeichert, bevor die Anmeldung fortgesetzt wird. </p>
com.top_logic.layout.view.navigation.DisplayTargetService = Anzeigeziele
com.top_logic.layout.view.navigation.DisplayTargetService$BindConfig = Bindungskonfiguration
com.top_logic.layout.view.navigation.DisplayTargetService$BindConfig.tooltip = Der Wert, den ein Kanal einer angezeigten Ansicht erhält.
com.top_logic.layout.view.navigation.DisplayTargetService$ShowConfig = Anzeigekonfiguration
com.top_logic.layout.view.navigation.DisplayTargetService$ShowConfig.tooltip = Eine Ansicht, die das Objekt und die Werte der einzelnen Kanäle anzeigt.
com.top_logic.layout.view.navigation.DisplayTargetService$TargetConfig = Zielkonfiguration
com.top_logic.layout.view.navigation.DisplayTargetService$TargetConfig.tooltip = Dort, wo die Objekte eines Modelltyps angezeigt werden.
com.top_logic.layout.view.navigation.DisplayTargetService.BindConfig.channel = Kanal
com.top_logic.layout.view.navigation.DisplayTargetService.BindConfig.channel.tooltip = Name des Kanals in der angezeigten Ansicht, der den Wert empfängt.
com.top_logic.layout.view.navigation.DisplayTargetService.BindConfig.expr = Ausdruck
com.top_logic.layout.view.navigation.DisplayTargetService.BindConfig.expr.tooltip = Funktion zur Berechnung des Kanalwerts aus dem angezeigten Objekt. <p> Leer übergibt das angezeigte Objekt selbst. </p>
com.top_logic.layout.view.navigation.DisplayTargetService.Config.targets = Ziele
com.top_logic.layout.view.navigation.DisplayTargetService.Config.targets.tooltip = Die Typen, deren Objekte angezeigt werden können, und wo. <p> Es kann mehrere Einträge geben, die denselben Typ deklarieren. Es gilt derjenige, der am nächsten an der Stelle angezeigt wird, an der das Objekt angeboten wird; bei gleicher Nähe derjenige, der als Standard markiert ist, und bei weiterer Gleichheit der zuerst deklarierte. </p>
com.top_logic.layout.view.navigation.DisplayTargetService.ShowConfig.bindings = Bindungen
com.top_logic.layout.view.navigation.DisplayTargetService.ShowConfig.bindings.tooltip = Die Werte, die die Kanäle der angezeigten Ansicht erhalten.
com.top_logic.layout.view.navigation.DisplayTargetService.ShowConfig.dialog = Dialog
com.top_logic.layout.view.navigation.DisplayTargetService.ShowConfig.dialog.tooltip = Ob die Ansicht als Dialogfeld über der aktuellen Anzeige und nicht innerhalb dieser angezeigt werden soll.
com.top_logic.layout.view.navigation.DisplayTargetService.ShowConfig.label = Bezeichnung
com.top_logic.layout.view.navigation.DisplayTargetService.ShowConfig.label-expr = Bezeichnungsausdruck
com.top_logic.layout.view.navigation.DisplayTargetService.ShowConfig.label-expr.tooltip = Funktion, die aus dem angezeigten Objekt die Bezeichnung der angezeigten Ansicht berechnet. <p> Hat Vorrang vor der festen Bezeichnung. Eine Ansicht, die der Benutzer durch Drilldown erreicht, wird mit dem Namen des darin angezeigten Objekts angekündigt; daher muss ein Ziel, das an dieselbe Stelle führt, dieselbe Bezeichnung berechnen, um zu dem Drilldown zu gelangen, den der Benutzer bereits aufgerufen hat. </p>
com.top_logic.layout.view.navigation.DisplayTargetService.ShowConfig.label.tooltip = Die Bezeichnung, mit der die angezeigte Ansicht gekennzeichnet wird, z. B. in einer Breadcrumb-Navigation oder als Dialogtitel. <p> Wenn das Feld leer bleibt, wird die Benennung der Anzeige selbst überlassen. </p>
com.top_logic.layout.view.navigation.DisplayTargetService.ShowConfig.view = Ansicht
com.top_logic.layout.view.navigation.DisplayTargetService.ShowConfig.view.tooltip = Pfad der anzuzeigenden Ansichtsdatei, relativ zum Ansichtsverzeichnis der Anwendung.
com.top_logic.layout.view.navigation.DisplayTargetService.TargetConfig.default = Standard
com.top_logic.layout.view.navigation.DisplayTargetService.TargetConfig.default.tooltip = Ob dieses Ziel den anderen für denselben Typ angegebenen Zielen vorgezogen werden soll.
com.top_logic.layout.view.navigation.DisplayTargetService.TargetConfig.shows = Ansichten
com.top_logic.layout.view.navigation.DisplayTargetService.TargetConfig.shows.tooltip = Die Ansichten, in denen das Objekt angezeigt wird – zuerst die übergeordneten, zuletzt diejenige, die das Objekt selbst enthält.
com.top_logic.layout.view.navigation.DisplayTargetService.TargetConfig.type = Typ
com.top_logic.layout.view.navigation.DisplayTargetService.TargetConfig.type.tooltip = Der Typ, dessen Objekte hier angezeigt werden. <p> Ein Objekt wird an dem Ziel seines eigenen Typs angezeigt; gibt es keines, an dem Ziel seiner nächsten Verallgemeinerung. </p>
com.top_logic.layout.view.navigation.DisplayTargetService.tooltip = Der Katalog der Orte, an denen die Anwendung ihre Geschäftsobjekte anzeigt. <p> Ein Ziel bezeichnet einen Modelltyp und die Ansichten, die ein Objekt dieses Typs anzeigen: Die übergeordnete Ansicht wird zuerst angezeigt, diejenige, die das Objekt selbst enthält, zuletzt. Jede Ansicht erhält die Werte, die ihre Bindungen aus dem angezeigten Objekt berechnen. </p><pre> &lt;config service-class="com.top_logic.layout.view.navigation.DisplayTargetService"&gt; &lt;instance&gt; &lt;targets&gt; &lt;target type="demo.tickets:Ticket"&gt; &lt;show view="milestones.view.xml"&gt; &lt;bind channel="milestone" expr="t -&gt; $t.get(`demo.tickets:Ticket#milestone`)" /&gt; &lt;/show&gt; &lt;show view="ticket-detail.view.xml"&gt; &lt;bind channel="ticket"/&gt; &lt;/show&gt; &lt;/target&gt; &lt;/targets&gt; &lt;/instance&gt; &lt;/config&gt; </pre> <p> Durch die Deklaration der Ziele an einer einzigen Stelle statt in den Ansichten, die die Objekte anzeigen, kann ein Objekt von überall aus angezeigt werden: Wer ein Objekt hält, fragt diesen Dienst, wo dessen Typ angezeigt wird, und bietet das Objekt genau dann als Link an, wenn ein Ziel antwortet. </p>
com.top_logic.layout.view.navigation.ShowObjectAction = Objekt anzeigen
com.top_logic.layout.view.navigation.ShowObjectAction.tooltip = <i>Eine Ansicht-Aktion</i>, die ihr Eingabeobjekt dort anzeigt, wo die Anwendung Objekte dieses Typs darstellt. <p> Wo dies geschieht, wird pro Modelltyp durch die Anzeigeziele der Anwendung festgelegt, sodass ein Befehl, der mit dieser Aktion endet, das Objekt an den Ort bringt, an den es gehört – ohne eine Ansicht zu benennen: </p><pre> &lt;generic-command input="selection"&gt; &lt;show-object/&gt; &lt;/generic-command&gt; </pre> <p> Wenn nichts angezeigt werden soll (keine Eingabe), wird die Kette unverändert weitergeleitet. Bei der Auswahl genau eines Objekts wird dieses Objekt angezeigt, sodass die Aktion direkt auf eine Auswahl folgen kann. </p>
com.top_logic.layout.view.navigation.ShowViewAction = Ansicht anzeigen
com.top_logic.layout.view.navigation.ShowViewAction.tooltip = <i>Eine Ansicht-Aktion</i>, die eine Ansicht einblendet und die Werte schreibt, die ihre Kanäle empfangen. <p> Die Ansicht wird nach ihrer Datei benannt, sodass ein Befehl zu einem Ort in der Anwendung führt, ohne dass ein Geschäftsobjekt beteiligt ist: </p><pre> &lt;show-view view="tickets.view.xml"&gt; &lt;bind channel="activeFilter" expr="term -&gt; 'all'"/&gt; &lt;bind channel="searchTerm" expr="term -&gt; $term"/&gt; &lt;/show-view&gt; </pre> <p> Die Ansicht wird dort erreicht, wo sie angezeigt wird: Die Container auf dem Weg dorthin werden geöffnet, oder sie wird als Rahmen auf den umgebenden Stapel gelegt, oder – mit dialog – als Dialog geöffnet. Jede Bindung ist eine Funktion des aktuellen Werts der Kette; eine Bindung ohne Ausdruck erhält diesen Wert selbst. Die Kette wird mit dem Wert fortgesetzt, den sie zuvor hatte, sodass die weiteren Schritte eines Befehls nach der Anzeige der Ansicht davon unberührt bleiben. </p>
com.top_logic.layout.view.navigation.ShowViewsAction = Ansichten anzeigen
com.top_logic.layout.view.navigation.ShowViewsAction.Config.shows = Ansichten
com.top_logic.layout.view.navigation.ShowViewsAction.Config.shows.tooltip = Die anzuzeigenden Ansichten, wobei die äußeren zuerst und die innerste zuletzt angezeigt werden.
com.top_logic.layout.view.navigation.ShowViewsAction.tooltip = <i>Eine Ansicht-Aktion</i>, die nacheinander mehrere Ansichten einblendet, jede mit den Werten, die ihre Kanäle empfangen. <p> Die Ansichten werden so angezeigt, wie es bei den Ansichten eines Anzeigeziels üblich ist: Die übergeordneten Ansichten zuerst, die innerste zuletzt, und jede Ansicht wird innerhalb der zuvor angezeigten Ansicht gesucht, sodass eine Ansicht auf einem Tab eines Rahmens, den der Schritt davor aufgelegt hat, dort eingeblendet wird. </p><pre> &lt;show-views&gt; &lt;show view="projects/overview.view.xml"&gt; &lt;bind channel="project" expr="t -&gt; $t.container()"/&gt; &lt;/show&gt; &lt;show view="projects/ticket-detail.view.xml"&gt; &lt;bind channel="ticket"/&gt; &lt;/show&gt; &lt;/show-views&gt; </pre> <p> Jede Bindung ist eine Funktion des aktuellen Werts der Kette; eine Bindung ohne Ausdruck erhält diesen Wert selbst. Die Kette wird mit dem bisherigen Wert fortgesetzt, sodass die Ausführung eines Befehls nach dem Anzeigen der Ansichten davon unberührt bleibt. </p>
com.top_logic.layout.view.recorder.RecordedStepsTable = Tabelle der erfassten Schritte
com.top_logic.layout.view.recorder.RecordedStepsTable.Config.selection = Auswahl
com.top_logic.layout.view.recorder.RecordedStepsTable.Config.selection.tooltip = Optionaler Kanal, der mit dem 1-basierten Zeilenschlüssel des ausgewählten Schritts synchronisiert ist: Die Tabelle schreibt ihn, wenn der Benutzer eine Zeile auswählt, und wählt die durch ihn benannte Zeile aus, wenn er sich ändert (sodass eine Schrittaktion die Auswahl vorantreiben kann).
com.top_logic.layout.view.recorder.RecordedStepsTable.tooltip = Schreibgeschützte Tabelle der aufgezeichneten Recorder-Schritte, eine Zeile pro Schritt mit der Nummer (ab 1), der Zieladresse, dem Befehl und den Argumenten. <p> Die Tabelle spiegelt den <i>Skript-Recorder</i> des Fensters wider, das dieses Seitenfenster geöffnet hat (ermittelt durch <i>Zugriff auf den Recorder</i>), und überwacht diesen; daher erscheint ein im Hauptfenster erfasster Schritt hier in Echtzeit über die SSE-Verbindung des Seitenfensters – eine manuelle Aktualisierung ist nicht erforderlich. </p> <p> Anwendungsspezifisches Widget (referenziert über class=, kein wiederverwendbares @TagName-Element). </p>
com.top_logic.layout.view.recorder.RecorderAction = Aufzeichnung steuern
com.top_logic.layout.view.recorder.RecorderAction$Mode = Modus
com.top_logic.layout.view.recorder.RecorderAction$Mode.tooltip = Wie sich eine <i>Recorder-Aktion</i> auf den Aufzeichnungsstatus auswirkt.
com.top_logic.layout.view.recorder.RecorderAction.Config.mode = Modus
com.top_logic.layout.view.recorder.RecorderAction.Config.mode.tooltip = Was die Aktion mit dem Aufnahmestatus bewirkt.
com.top_logic.layout.view.recorder.RecorderAction.Mode.START = Start
com.top_logic.layout.view.recorder.RecorderAction.Mode.START.tooltip = Starten Sie eine neue Aufnahme und verwerfen Sie die bisherigen Schritte.
com.top_logic.layout.view.recorder.RecorderAction.Mode.STOP = Stopp
com.top_logic.layout.view.recorder.RecorderAction.Mode.STOP.tooltip = Beenden Sie die Aufzeichnung. Die aufgezeichneten Schritte bleiben bis zum nächsten Start sichtbar.
com.top_logic.layout.view.recorder.RecorderAction.tooltip = <i>Aktion anzeigen</i>, mit der der <i>Skript-Recorder</i> des Fensters, das dieses Seitenfenster geöffnet hat, gestartet und gestoppt wird. <p> Die Start-/Stopp-Kette schaltet einen booleschen Aufzeichnungskanal über die wiederverwendbaren Aktionen „ <execute-script> “ und „ <write-channel> “ um (wodurch die Sichtbarkeit der Start-/Stopp-Schaltfläche gesteuert wird). Die erfassten Schritte selbst werden live in <i>der Tabelle „Aufgezeichnete Schritte“</i> angezeigt, die direkt vom Recorder gespeist wird. Der Recorder befindet sich in der Warteschlange des öffnenden Fensters (siehe <i>„Zugriff auf den Recorder“</i>), sodass die eigenen Befehle dieses Seitenfensters niemals erfasst werden. </p>
com.top_logic.layout.view.recorder.StepReplayAction = Schritt-für-Schritt-Wiedergabe
com.top_logic.layout.view.recorder.StepReplayAction.tooltip = <i>Zeigt die Wiedergabe</i> des aktuell ausgewählten aufgezeichneten Schritts im Eröffnungsfenster <i>an</i> – die Schaltfläche „Schritt“ des Schritt-Debuggers im Seitenfenster des Rekorders. <p> Als Eingabe dient der 1-basierte Zeilenschlüssel des ausgewählten Schritts (der von der Schritttabelle in einen Auswahlkanal geschrieben wird). Die Funktion spielt diesen Schritt im aufgezeichneten (Öffner-)Fenster über <i>die „React Window Replay“-Funktion</i> ab, sodass der Effekt im Hauptbrowserfenster sichtbar wird, und gibt den Zeilenschlüssel des <em>nächsten</em> Schritts zurück, damit der verkettete „ <write-channel> “ die Auswahl weiterführt. Wenn der letzte Schritt wiedergegeben wurde, bleibt die Auswahl unverändert. Ein Schritt, dessen Wiedergabe fehlschlägt (z. B. weil seine Adresse im aktuellen Zustand des Öffnerfensters nicht aufgelöst werden kann), meldet den Fehler über den <i>Fehler-Sink</i> des Fensters und belässt die Auswahl auf dem fehlgeschlagenen Schritt, sodass der Debugger an der Stelle anhält, an der das Skript abstürzt. </p>
com.top_logic.layout.view.routing.ParamBindingConfig = Konfiguration der Parameterbindung
com.top_logic.layout.view.routing.ParamBindingConfig.channel = Kanal
com.top_logic.layout.view.routing.ParamBindingConfig.channel.tooltip = Der Name des Kanals, an den gebunden werden soll.
com.top_logic.layout.view.routing.ParamBindingConfig.prefix = Präfix
com.top_logic.layout.view.routing.ParamBindingConfig.prefix.tooltip = Statische Pfadsegmente, die vor dem Wert stehen. <p> Ein Präfix detail lässt die Bindung detail/&lt;Wert&gt; belegen statt eines bloßen Wertsegments; das unterscheidet sie von den anderen Segmenten der URL und benennt, was der Wert identifiziert. Das Präfix erscheint genau dann, wenn der Wert erscheint: Eine URL, die das Präfix ohne einen Wert dahinter trägt, beschreibt keinen Wert, und der Kanal behält, was er hält. </p> <p> Ohne Präfix belegt die Bindung das Wertsegment allein, und ihre Position in der URL ist es, die sie identifiziert. </p>
com.top_logic.layout.view.routing.ParamBindingConfig.route-param = Parameter der Route
com.top_logic.layout.view.routing.ParamBindingConfig.route-param.tooltip = Der Name des URL-Routenparameters, von dem aus gebunden werden soll.
com.top_logic.layout.view.routing.ParamBindingConfig.tooltip = Bindet einen Ansichtskanal an einen URL-Routenparameter. <p> Beispiel: <bind channel="estateId" route-param="estateId"/> </p> <p> Die Bindung wirkt in beide Richtungen: Der Wert des Kanals wird zum URL-Pfadsegment, und das Segment einer geöffneten URL wird zum Wert des Kanals. Eine URL ohne dieses Segment lässt den Kanal unverändert – sie sagt nichts über den Wert aus, statt auszusagen, dass es keinen gibt. Eine so geöffnete Ansicht behält daher, was sie selbst festlegt, etwa das Element, das eine Tabelle standardmäßig auswählt, und die Adressleiste wird mit diesem Wert vervollständigt. </p> <p> Der Wert füllt ein Pfadsegment und wird prozentkodiert, sodass ein Wert beliebiger Form – auch einer mit einem Schrägstrich oder einem Leerzeichen – das eine Segment bleibt, aus dem die Bindung ihn zurückliest. Ein <i>Präfix</i> stellt statische Segmente davor, die benennen, wofür der Wert steht. </p>
com.top_logic.layout.view.routing.QueryBindingConfig = Konfiguration der Abfragebindung
com.top_logic.layout.view.routing.QueryBindingConfig.channel = Kanal
com.top_logic.layout.view.routing.QueryBindingConfig.channel.tooltip = Der Name des Kanals, an den gebunden werden soll.
com.top_logic.layout.view.routing.QueryBindingConfig.query-param = Abfrage-Parameter
com.top_logic.layout.view.routing.QueryBindingConfig.query-param.tooltip = Der Name des URL-Abfrageparameters, von dem aus gebunden werden soll.
com.top_logic.layout.view.routing.QueryBindingConfig.tooltip = Bindet einen Ansichtskanal an einen URL-Abfrageparameter. <p> Beispiel: <bind channel="typeFilter" query-param="type"/> </p>
com.top_logic.layout.view.security.AccessControl = Zugangskontrolle
com.top_logic.layout.view.security.AccessControl.scope = Umfang
com.top_logic.layout.view.security.AccessControl.scope.tooltip = Die ID des <i>Bereichs der Berechtigung</i> (definiert unter <i>„Berechtigungen“</i>), der die übergeordnete UI-Einheit schützt.
com.top_logic.layout.view.security.AccessControl.tooltip = Verweis von einer entfernbaren UI-Einheit auf einen <i>Berechtigungsbereich</i>. <p> Wird als <access-control scope="..."/> Eigenschaft auf ein sicheres Element (nav-item, Tab, Kachel) erstellt. Das Element wird nur gebaut, wenn der referenzierte Bereich dem aktuellen Benutzer Zugriff gewährt; andernfalls wird es ganz weggelassen. Elemente ohne <i>Zugriffskontrolle</i> werden immer angezeigt. </p>
com.top_logic.layout.view.security.SecurityRule = Sicherheitsregel
com.top_logic.layout.view.security.SecurityRule.Config.group = Gruppe
com.top_logic.layout.view.security.SecurityRule.Config.group.tooltip = Die für die Ausführung des Befehls erforderliche Befehlsgruppe. <p> Die Gruppe (z. B. Schreiben, Löschen) muss im referenzierten Bereich deklariert werden, damit ihr Rollen zugewiesen werden können. </p>
com.top_logic.layout.view.security.SecurityRule.Config.scope = Bereich
com.top_logic.layout.view.security.SecurityRule.Config.scope.tooltip = Die ID des Sicherheitsbereichs, der die Rollenzuordnung für diesen Befehl bereitstellt. <p> Wenn sie nicht gesetzt ist, wird der Bereich der nächstgelegenen abnehmbaren Einheit (die Zugriffskontrolle, die das umgebende Nav-Item, Tab oder die Kachel umschließt) verwendet, so dass der Befehl die Abbildung der Rolle teilt, die bereits seine Sichtbarkeit begrenzt. Ein geschützter Befehl, der weder einen Bereich hat noch von einem solchen umschlossen ist, verweigert jedem den Zugriff. </p>
com.top_logic.layout.view.security.SecurityRule.Config.security-object = Objekt der Berechtigung
com.top_logic.layout.view.security.SecurityRule.Config.security-object.tooltip = Kanal, dessen Wert das Objekt ist, für das der Zugriff geprüft wird. <p> Wenn er nicht gesetzt ist, wird der Zugriff auf die Berechtigung im Stammobjekt geprüft (eine Prüfung auf Strukturebene "darf dieser Benutzer diese Aktion hier ausführen"). Wenn er gesetzt ist, wird der aktuelle Wert des Kanals als Berechtigung verwendet, was Zugriffsüberprüfungen pro Objekt ermöglicht. Ein Kanalwert, der kein Sicherheitsobjekt ist, fällt auf die Sicherheitsstammdaten zurück. </p>
com.top_logic.layout.view.security.SecurityRule.tooltip = <i>Ausführbarkeitsregel für die Ansicht</i>, die einen Befehl ausblendet, wenn der aktuelle Benutzer nicht die Berechtigung für die entsprechende Befehlsgruppe in einem <i>Berechtigungsbereich</i> hat. <p> Das Gegenstück zur <i>Zugriffskontrolle</i> auf Befehlsebene bei herausnehmbaren Einheiten: Während die Sichtbarkeit die Frage stellt, "darf dieser Benutzer diesen Teil der Anwendung sehen", fragt diese Regel, "darf dieser Benutzer <em>diese Aktion</em> hier ausführen". Die Entscheidung durchläuft denselben <i>Berechtigungsbereich</i> (und damit dieselbe dauerhafte Rollenzuweisung) wie die Sichtbarkeit, so dass die neue Benutzeroberfläche mit der alten Semantik übereinstimmt. Da der serverseitige Versand eines Befehls seine Ausführbarkeitsregel neu bewertet, wird diese Regel sowohl auf der Schaltfläche (deaktiviert/ausgeblendet) als auch zur Ausführungszeit durchgesetzt. </p> <p> Zwei Dinge werden aufgelöst, wenn die Regel gebunden ist: </p> <ul> <li>Der <i>Sicherheitsbereich</i>, der die Abbildung der Rolle bereitstellt: der explizit konfigurierte Bereich, wenn er festgelegt ist, andernfalls der Bereich der umschließenden Einheit. Ein geschützter Befehl, der zu keinem Bereich führt, wird nicht geschlossen.</li> <li>Das Sicherheitsobjekt, an dem die Rollen geprüft werden: der Wert des konfigurierten Sicherheitsobjektkanals, wenn es sich um ein <i>gebundenes Objekt</i> handelt, andernfalls die Sicherheitsstammdaten (Prüfung auf Strukturebene).</li> </ul>
com.top_logic.layout.view.security.SecurityScopeService = Berechtigung-Bereiche
com.top_logic.layout.view.security.SecurityScopeService$GroupConfig = Konfiguration der Gruppe
com.top_logic.layout.view.security.SecurityScopeService$GroupConfig.tooltip = Eine in einer <i>Bereichskonfiguration</i> deklarierte Befehlsgruppe.
com.top_logic.layout.view.security.SecurityScopeService$ScopeConfig = Umfang der Konfiguration
com.top_logic.layout.view.security.SecurityScopeService$ScopeConfig.tooltip = Ein Knoten im Katalogbaum der Berechtigungen. <p> Ein Knoten mit einer ID ist ein referenzierbarer <i>Berechtigungsbereich</i>. Die Verschachtelung über <i>Bereiche</i> ermöglicht eine Gruppierung; die Bezeichnung eines Knotens dient gleichzeitig als Gruppierungsbezeichnung für seine Kinder in der Benutzeroberfläche der Sicherheitsverwaltung. </p>
com.top_logic.layout.view.security.SecurityScopeService.Config.scopes = Geltungsbereiche
com.top_logic.layout.view.security.SecurityScopeService.Config.scopes.tooltip = Die obersten Knoten des Katalogs für Berechtigungen. <p> Sie sind nach ID indiziert, sodass eine Anwendung, die dieses Modul einbindet, einen geerbten Bereich (z. B. den Verwaltungsbereich des Frameworks) <em>überschreiben oder anpassen</em> kann, indem sie einen Eintrag mit derselben ID neu deklariert, zusätzlich zum Hinzufügen eigener Bereiche. </p>
com.top_logic.layout.view.security.SecurityScopeService.GroupConfig.name = Name
com.top_logic.layout.view.security.SecurityScopeService.GroupConfig.name.tooltip = Verweis auf die <i>Befehlsgruppe</i> (z. B. Schreiben, Löschen), die gegen den umschließenden Bereich geprüft werden kann.
com.top_logic.layout.view.security.SecurityScopeService.ScopeConfig.groups = Gruppen
com.top_logic.layout.view.security.SecurityScopeService.ScopeConfig.groups.tooltip = Die Nicht-Standard-Befehlsgruppen, die von Zugriffsregeln auf Befehlsebene gegen diesen Bereich geprüft werden können. <p> Die Standard-Befehlsgruppe (Sichtbarkeit) ist immer verfügbar und braucht hier nicht aufgeführt zu werden; nur zusätzliche Gruppen (z. B. Schreiben, Löschen), die von einer Sicherheitsregel auf Befehlsebene verwendet werden, müssen deklariert werden, damit das materialisierte Sicherheitsobjekt sie für die Rollenzuweisung trägt. </p>
com.top_logic.layout.view.security.SecurityScopeService.ScopeConfig.id = ID
com.top_logic.layout.view.security.SecurityScopeService.ScopeConfig.id.tooltip = Die eindeutige Bereichskennung. <p> Ist sie gesetzt, handelt es sich bei diesem Knoten um eine <i>Berechtigung</i>, auf die von der <access-control> einer Ansicht aus verwiesen werden kann. Wenn er nicht gesetzt ist, ist der Knoten ein reiner Gruppierungsknoten. </p>
com.top_logic.layout.view.security.SecurityScopeService.ScopeConfig.label = Bezeichnung
com.top_logic.layout.view.security.SecurityScopeService.ScopeConfig.label.tooltip = Von Menschen lesbare Bezeichnung für die Benutzeroberfläche der Sicherheitsverwaltung.
com.top_logic.layout.view.security.SecurityScopeService.ScopeConfig.scopes = Geltungsbereiche
com.top_logic.layout.view.security.SecurityScopeService.ScopeConfig.scopes.tooltip = Verschachtelte Bereichsknoten (Untergruppen oder Unterbereiche). <p> Sie sind nach ID indiziert, sodass ein verschachtelter Bereich ebenfalls über die ID in der Konfiguration einer übergeordneten Anwendung überschrieben werden kann. </p>
com.top_logic.layout.view.security.SecurityScopeService.tooltip = Zentraler Katalog der <i>Berechtigungsbereiche</i>, die dem deklarativen Sichtsystem zur Verfügung stehen. <p> Bereiche werden hier einmal als Baum von id/label-Einträgen definiert (Verschachtelung bietet Gruppierung für die Sicherheitsverwaltungs-UI) und von entfernbaren UI-Einheiten über <i>Zugriffskontrolle</i> referenziert. Durch die zentrale Definition von Bereichen - statt inline in der View - können sich mehrere UI-Einheiten einen Bereich teilen, indem sie auf dieselbe id verweisen, ohne ihre Bezeichnung zu duplizieren. </p> <p> Beim Start materialisiert der Dienst eine persistente <i>, gebundene Komponente</i> für jeden konfigurierten Bereich (verschlüsselt durch seine Kennung), so dass die vorhandenen Werkzeuge zur Sicherheitsverwaltung den Sicherheitsbereichen der Ansicht genau wie den Legacy-Komponenten Rollen zuweisen können. </p>
com.top_logic.layout.view.security.WithAccessControl = Mit Zugangskontrolle
com.top_logic.layout.view.security.WithAccessControl.access-control = Zugangskontrolle
com.top_logic.layout.view.security.WithAccessControl.access-control.tooltip = Die Zugangskontrolle, die diese UI-Einheit schützt.
com.top_logic.layout.view.security.WithAccessControl.tooltip = Konfigurations-Mixin, das eine optionale <i>Zugriffskontrollreferenz</i> zu einer entfernbaren UI-Einheit hinzufügt. <p> Sicherbare Elementkonfigurationen (nav-item, Tab, Kachel) erweitern diese Schnittstelle, so dass dieselbe <access-control> Deklaration und derselbe Durchsetzungscode<i>(Zugriffsüberprüfungen</i>) einheitlich für alle gelten. </p>
com.top_logic.layout.view.slot.SlotContentElement = Slot-Inhalts-Element
com.top_logic.layout.view.slot.SlotContentElement.Config.children = Kinder
com.top_logic.layout.view.slot.SlotContentElement.Config.children.tooltip = Die beigesteuerten Kindelemente.
com.top_logic.layout.view.slot.SlotContentElement.Config.to = An
com.top_logic.layout.view.slot.SlotContentElement.Config.to.tooltip = Name des Ziel-<slot>. Der Beitrag wird an den im Baum nächstgelegenen Slot dieses Namens geleitet. <p> Das Attribut heißt {@code to} (nicht {@code slot}), um eine Mehrdeutigkeit mit dem Tag-Namen des Kindelements {@code <slot>} innerhalb des Standardcontainers zu vermeiden. </p>
com.top_logic.layout.view.slot.SlotContentElement.tooltip = UIElement, das seine Kinder zum nächstgelegenen passenden <i>Slot-Element</i> beiträgt. <p> Der Beitrag wird an seiner deklarierten Position nicht sichtbar gerendert; stattdessen werden die Kinder von dem zugeordneten <slot>-Platzhalter gerendert. Die Kinder werden im <i>Ansichtskontext</i> der deklarierenden Ansicht erstellt, so dass ihre Kanal-Referenzen lokal aufgelöst werden. </p>
com.top_logic.layout.view.slot.SlotElement = Slot-Element
com.top_logic.layout.view.slot.SlotElement.Config.name = Name
com.top_logic.layout.view.slot.SlotElement.Config.name.tooltip = Der Slot-Name. <slot-content to="X">-Beiträge werden hierher geleitet, wenn dies der im Baum nächstgelegene passende <slot name="X"/> ist.
com.top_logic.layout.view.slot.SlotElement.tooltip = UIElement, das einen benannten Platzhalter für <slot-content>-Beiträge deklariert. <p> Der Platzhalter rendert alle Beiträge, deren Ziel-Slot-Name übereinstimmt und deren im Baum nächstgelegener passender <slot> dieser ist. Die Zuordnung wird vom gemeinsamen <i>Slot-Verzeichnis</i> durchgeführt. </p>
com.top_logic.layout.view.table.AbstractColumnDeclaration = Spaltendeklaration
com.top_logic.layout.view.table.AbstractColumnDeclaration.Config.aggregate = Aggregat
com.top_logic.layout.view.table.AbstractColumnDeclaration.Config.aggregate.tooltip = Was diese Spalte für eine Gruppe von Zeilen anzeigt: eine Funktion über die Zeilen der Gruppe, deren Ergebnis in der Kopfzeile der Gruppe angezeigt wird. <p> Die Funktion erhält die Liste der Zeilen in der Gruppe und liefert einen Wert des Typs, den die Spalte enthält – die Summe einer Zahlen-Spalte, das früheste Datum einer Datums-Spalte –, der dann genau wie eine Zelle dieser Spalte angezeigt wird. Ohne Angabe (Standard) bleibt die Gruppenzelle der Spalte leer. </p>
com.top_logic.layout.view.table.AbstractColumnDeclaration.Config.filter = Filter
com.top_logic.layout.view.table.AbstractColumnDeclaration.Config.filter.tooltip = Ein anwendungsdefinierter Filter für diese Spalte, der die vom Typ abgeleitete Standardeinstellung überschreibt. Der Filter gleicht den angezeigten Text der Zelle ab.
com.top_logic.layout.view.table.AbstractColumnDeclaration.Config.label = Bezeichnung
com.top_logic.layout.view.table.AbstractColumnDeclaration.Config.label.tooltip = Die Spaltenüberschrift oder – falls nicht festgelegt – die Bezeichnung, die sich aus der Spalte ableitet: die Bezeichnung des Attributs, das sie anzeigt, sowie der Name der Spalte, sofern kein Attribut diesen angibt.
com.top_logic.layout.view.table.AbstractColumnDeclaration.Config.readonly = Schreibgeschützt
com.top_logic.layout.view.table.AbstractColumnDeclaration.Config.readonly.tooltip = Ob diese Spalte schreibgeschützt bleibt, während die Zeilen der Tabelle bearbeitet werden.
com.top_logic.layout.view.table.AbstractColumnDeclaration.Config.sort = Sortierung
com.top_logic.layout.view.table.AbstractColumnDeclaration.Config.sort.tooltip = Die Sortierrichtung dieser Spalte beim ersten Anzeigen der Tabelle; lassen Sie dieses Feld leer, um die Spalte unsortiert zu lassen. <p> Das Sortieren nach mehreren Spalten erfolgt durch Festlegen dieser Option für mehr als eine Spalte; die Reihenfolge der Angabe bestimmt, welche Spalte zuerst sortiert wird. Die Standardeinstellung gilt nur so lange, bis der Benutzer die Tabelle selbst sortiert; danach wird die vom Benutzer gewählte Reihenfolge gespeichert. </p>
com.top_logic.layout.view.table.AbstractColumnDeclaration.Config.width = Breite
com.top_logic.layout.view.table.AbstractColumnDeclaration.Config.width.tooltip = Die Standardanzeigebreite der Spalte in Pixeln. <p> Dies ist die Breite, die der Benutzer sieht, bis er die Spalte selbst in der Größe anpasst; ab diesem Zeitpunkt wird die vom Benutzer festgelegte Breite gespeichert. 0 – der Standardwert – behält die Breite bei, die sich aus dem Spaltentyp ergibt. </p>
com.top_logic.layout.view.table.AbstractColumnDeclaration.tooltip = Grundlage der <i>Spaltendeklarationen</i>, die eine einzelne Spalte beschreiben, mit den Eigenschaften, die jede solche Spalte aufweist: ihre Bezeichnung, ihr Filter, ihre Breite, ob sie bearbeitet werden kann, die Reihenfolge, in der sie die Tabelle sortiert, und welche Aggregation sie über eine Gruppe von Zeilen durchführt. <p> Eine Unterklasse legt fest, wie die Spalte heißt und was ihre Zellen enthalten; alles, was die Tabelle mit diesen Werten macht, wird hier beschrieben und gelangt über den von dieser Klasse erstellten Deskriptor in die Spalte. </p>
com.top_logic.layout.view.table.AttributeColumn = Attributspalte
com.top_logic.layout.view.table.AttributeColumn.Config.attribute = Attribut
com.top_logic.layout.view.table.AttributeColumn.Config.attribute.tooltip = Der Name des anzuzeigenden Attributs, d. h. der Name der Spalte.
com.top_logic.layout.view.table.AttributeColumn.tooltip = Die „ <column> “ einer Tabelle: eine Spalte, die ein Modellattribut ihrer Zeilen anzeigt. <p> Das Attribut sagt alles über die Spalte aus – was ihre Zellen enthalten, wie sie angezeigt, sortiert, gefiltert und durchsucht werden, wie breit die Spalte ist und was in ihrer Kopfzeile steht –, sodass die Deklaration des Attributs alles ist, was eine solche Spalte benötigt. Wenn die Zeilen der Tabelle bearbeitet werden, schreibt eine bearbeitete Zelle ihren Wert in dieses Attribut. </p>
com.top_logic.layout.view.table.ColumnProviderService = Tabellenspalten
com.top_logic.layout.view.table.ColumnProviderService$ProviderMapping = Anbieterzuordnung
com.top_logic.layout.view.table.ColumnProviderService$ProviderMapping.tooltip = Eine einzelne Zuordnung eines Typs zu einem Spaltenanbieter.
com.top_logic.layout.view.table.ColumnProviderService.Config.boolean-width = Breite von Wahrheitswert-Spalten
com.top_logic.layout.view.table.ColumnProviderService.Config.boolean-width.tooltip = Die Breite einer Spalte in Pixeln, die einen Wahrheitswert anzeigt; wird verwendet, wenn die Spalte keine Breite konfiguriert. <p> Ein Wahrheitswert wird als Häkchen angezeigt, daher bestimmt die Spaltenbeschriftung, wie viel Platz die Spalte benötigt. </p>
com.top_logic.layout.view.table.ColumnProviderService.Config.date-time-width = Breite von Spalten mit Datum und Uhrzeit
com.top_logic.layout.view.table.ColumnProviderService.Config.date-time-width.tooltip = Die Breite einer Spalte in Pixeln, die ein Datum mit Uhrzeit anzeigt; wird verwendet, wenn die Spalte keine Breite konfiguriert.
com.top_logic.layout.view.table.ColumnProviderService.Config.date-width = Breite von Datumsspalten
com.top_logic.layout.view.table.ColumnProviderService.Config.date-width.tooltip = Die Breite einer Spalte in Pixeln, die ein Datum anzeigt; wird verwendet, wenn die Spalte keine Breite konfiguriert.
com.top_logic.layout.view.table.ColumnProviderService.Config.enumeration-width = Breite von Aufzählungsspalten
com.top_logic.layout.view.table.ColumnProviderService.Config.enumeration-width.tooltip = Die Breite einer Spalte in Pixeln, die einen Klassifikator einer Aufzählung anzeigt; wird verwendet, wenn die Spalte keine Breite konfiguriert.
com.top_logic.layout.view.table.ColumnProviderService.Config.label-width = Breite von Spalten mit Bezeichnungen
com.top_logic.layout.view.table.ColumnProviderService.Config.label-width.tooltip = Die Breite einer Spalte in Pixeln, die ihre Werte durch deren Bezeichnung anzeigt; wird verwendet, wenn die Spalte keine Breite konfiguriert. <p> Die Breite jeder Spalte, die nicht unter eine der anderen Breiten fällt: eine Referenz, ein mehrwertiges Attribut, ein Wert eines anwendungsdefinierten Datentyps und eine Spalte, deren Typ nicht aufgelöst werden konnte. </p>
com.top_logic.layout.view.table.ColumnProviderService.Config.number-width = Breite von Zahlenspalten
com.top_logic.layout.view.table.ColumnProviderService.Config.number-width.tooltip = Die Breite einer Spalte in Pixeln, die eine Zahl anzeigt; wird verwendet, wenn die Spalte keine Breite konfiguriert.
com.top_logic.layout.view.table.ColumnProviderService.Config.providers = Anbieter
com.top_logic.layout.view.table.ColumnProviderService.Config.providers.tooltip = Anbieterzuordnungen, indiziert nach Modelltyp-Referenz.
com.top_logic.layout.view.table.ColumnProviderService.Config.string-width = Breite von Textspalten
com.top_logic.layout.view.table.ColumnProviderService.Config.string-width.tooltip = Die Breite einer Spalte in Pixeln, die einen Text anzeigt; wird verwendet, wenn die Spalte keine Breite konfiguriert.
com.top_logic.layout.view.table.ColumnProviderService.Config.time-width = Breite von Uhrzeitspalten
com.top_logic.layout.view.table.ColumnProviderService.Config.time-width.tooltip = Die Breite einer Spalte in Pixeln, die eine Uhrzeit anzeigt; wird verwendet, wenn die Spalte keine Breite konfiguriert.
com.top_logic.layout.view.table.ColumnProviderService.ProviderMapping.impl = Implementierung
com.top_logic.layout.view.table.ColumnProviderService.ProviderMapping.impl.tooltip = Der Spaltenanbieter, der für Werte dieses Typs zu verwenden ist.
com.top_logic.layout.view.table.ColumnProviderService.ProviderMapping.type = Typ
com.top_logic.layout.view.table.ColumnProviderService.ProviderMapping.type.tooltip = Der Modelltyp, auf den diese Abbildung zutrifft.
com.top_logic.layout.view.table.ColumnProviderService.tooltip = Löst die Berechnung <i>des Spalten-Providers</i> für einen bestimmten Werttyp auf und wandelt einen Datentyp in eine <i>„Green-Field“-Tabellenspalte</i> um (Zugriffsfunktion + Renderer + Vergleichsfunktion + Filter). <p> Eine Spalte wird durch einen <i>Spaltentyp</i> beschrieben – den Modelltyp ihrer Werte, ob eine Zelle mehrere davon enthält und woher ihre Annotationen stammen – sowie durch eine Funktion, die den Zellenwert aus einer Zeile ausliest. Ein Modellattribut ist eine solche Beschreibung, jedoch nicht die einzige; daher erhält eine Spalte, die auf einem berechneten Wert basiert, dieselben Funktionen wie eine Spalte, die auf einem Attribut basiert. </p> <p> Zellen zeigen ihre Werte über <i>Formularfeld-Steuerelemente</i> an: Eine Zelle zeigt einen Wert genau so an wie ein Formularfeld im Ansichtsmodus (Farbfeld, Symbol, Kontrollkästchen, Bezeichnungen für die Auswahl), sodass Formulare und Tabellen denselben Mechanismus zur Umwandlung von Typen in Darstellungen nutzen. </p> <p> Vergleichs- und Filterfunktionen werden je nach Werttyp aufgelöst (entspricht <i>den Formularfeld-Steuerelementen</i>): </p> <ol> <li>Eine in diesem Dienst für den <i>Typ</i> der Werte konfigurierte Berechnung (durch die App erweiterbar).</li> <li>Ein integrierter Standard, der sich aus der Struktur des Typs ableitet: Aufzählung → Optionsfilter, INT/FLOAT → numerischer Bereich, DATE → Datumsbereich, BOOLEAN/TRISTATE → Boolescher Wert, STRING → Text; alles andere (benutzerdefinierte Primitive, Referenzen, mehrwertige oder nicht aufgelöste Deskriptoren) → ein Textfilter für die Anzeige-Bezeichnung.</li> </ol> <p> Der integrierte Standardwert ist der einzige Ort, an dem ein Typ überprüft wird, und er kann pro Typ über <i>die Berechnung</i> vollständig überschrieben werden – so fügt ein neuer Datentyp eine Spaltenfunktion ein, ohne diese Ebene bearbeiten zu müssen. </p> <p> Dieselbe Klassifizierung bestimmt, wie breit eine Spalte anfänglich ist, wobei pro Wertetyp eine konfigurierte Breite gilt: Ein Wahrheitswert ist schmal, ein Datum mit Uhrzeit breit. Eine Spalte, die ihre eigene Breite konfiguriert, wird stattdessen in dieser Breite angezeigt. </p>
com.top_logic.layout.view.table.ColumnsConfig = Konfiguration der Spalten
com.top_logic.layout.view.table.ColumnsConfig.columns = Spalten
com.top_logic.layout.view.table.ColumnsConfig.columns.tooltip = Die Deklarationen, die die anzuzeigenden Spalten beitragen, in der Reihenfolge ihrer Anzeige.
com.top_logic.layout.view.table.ColumnsConfig.tooltip = Die „ <columns> “ einer Tabelle: Was angezeigt wird, in der Reihenfolge der Anzeige. <p> Ein Eintrag deklariert eine Spalte – „ <column attribute="..."/> “ für eine Spalte über ein Modellattribut, „ <computed-column .../> “ für eine Spalte über einen berechneten Wert – oder eine ganze Reihe davon, wie es „ <embedded-columns reference="..."/> “ für die Spalten eines Objekts tut, auf das die Zeile verweist. Jede Tabelle, die ihre Spalten beschreibt, verwendet diese eine Konfiguration, sodass eine hier hinzugefügte Spaltenart von allen angeboten wird. </p>
com.top_logic.layout.view.table.ComputedColumn = Berechnete Spalte
com.top_logic.layout.view.table.ComputedColumn.Config.can-update = Bearbeitbar
com.top_logic.layout.view.table.ComputedColumn.Config.can-update.tooltip = Ob die Zelle einer Zeile bearbeitet werden kann: eine Funktion der Zeile, die angibt, ob dort die Bearbeitung angeboten wird. <p> Die Werte der deklarierten Eingaben stehen an erster Stelle, in der Reihenfolge ihrer Deklaration, genau wie bei der Wertfunktion. Ohne Angabe wird jede Zeile einer Spalte bearbeitet, die eine Aktualisierungsfunktion deklariert. </p>
com.top_logic.layout.view.table.ComputedColumn.Config.multiple = Mehrere
com.top_logic.layout.view.table.ComputedColumn.Config.multiple.tooltip = Ob eine Zelle eine Auflistung von Werten des deklarierten Typs enthält und nicht nur einen einzigen Wert.
com.top_logic.layout.view.table.ComputedColumn.Config.name = Name
com.top_logic.layout.view.table.ComputedColumn.Config.name.tooltip = Der Name der Spalte, unter dem die vom Benutzer vorgenommene Anordnung gespeichert wird. <p> Es handelt sich um den Namen, unter dem die übrigen Elemente der Tabelle auf die Spalte verweisen – beispielsweise als Gruppierung oder Filterkriterium –, und keine zwei Spalten einer Tabelle dürfen denselben Namen haben. </p>
com.top_logic.layout.view.table.ComputedColumn.Config.type = Typ
com.top_logic.layout.view.table.ComputedColumn.Config.type.tooltip = Der Typ der berechneten Werte, der bestimmt, wie die Spalte diese anzeigt, sortiert und filtert. <p> Wenn diese Option nicht festgelegt ist, sind keine Informationen zu den Werten bekannt, und die Spalte zeigt sie anhand ihrer Anzeige-Bezeichnung an. </p>
com.top_logic.layout.view.table.ComputedColumn.Config.update = Aktualisierung
com.top_logic.layout.view.table.ComputedColumn.Config.update.tooltip = Die Funktion, die den Wert einer bearbeiteten Zelle schreibt und dabei die Zeile sowie den eingegebenen Wert als ihre letzten beiden Argumente erhält. <p> Die Werte der deklarierten Eingaben kommen an erster Stelle, in der Reihenfolge ihrer Deklaration, genau wie bei der Wertfunktion. Was die Aktualisierungsfunktion mit dem Wert macht, bleibt ihr überlassen – sie kann ein Attribut setzen, ein Objekt anlegen oder den Wert auf mehrere Attribute verteilen. </p> <p> Ohne Angabe wird die Spalte zwar angezeigt, aber nicht bearbeitet. </p>
com.top_logic.layout.view.table.ComputedColumn.Config.value = Wert
com.top_logic.layout.view.table.ComputedColumn.Config.value.tooltip = Die Funktion, die den Zellenwert berechnet und die Zeile als letztes Argument erhält. <p> Die Werte der deklarierten Eingaben kommen an erster Stelle, in der Reihenfolge ihrer Deklaration, sodass eine Spalte etwas anzeigen kann, das davon abhängt, was an anderer Stelle angezeigt wird. </p>
com.top_logic.layout.view.table.ComputedColumn.tooltip = Die „ <computed-column> “ einer Tabelle: eine Spalte, die einen aus der Zeile berechneten Wert anzeigt. <p> Die Wertfunktion wird für jede Zeile ausgewertet und liefert den Wert, den die Zelle enthält. Der deklarierte Typ gibt an, um welche Art von Wert es sich handelt, und bestimmt damit, wie die Spalte angezeigt, sortiert, gefiltert und durchsucht wird sowie welche Breite sie zunächst hat – eine berechnete Spalte verfügt also über alle Eigenschaften einer Spalte, die auf einem Modellattribut basiert. Eine Spalte ohne Typangabe zeigt ihre Werte anhand ihrer Bezeichnung an. </p> <p> Eine solche Spalte zeigt das an, was die Zeile selbst nicht enthält: eine Summe über die Werte eines Attributs, eine Differenz zwischen zwei Datumsangaben, einen Wert, der über eine Kette von Verweisen ausgelesen wird. </p> <p> Eine Spalte, die eine Aktualisierungsfunktion deklariert, wird überall dort bearbeitet, wo auch die Zeilen der Tabelle bearbeitet werden: Was ein bearbeiteter Wert für die Zeile bedeutet, ist das, was diese Funktion damit macht, und welche Zeilen die Bearbeitung anbieten, sagt das Prädikat. Das Eingabeelement für den Wert ergibt sich aus dem deklarierten Typ; eine Spalte, die bearbeitet wird, deklariert daher einen. </p>
com.top_logic.layout.view.table.DropTargetMode = Ablageziel
com.top_logic.layout.view.table.DropTargetMode.ROW = Zeile
com.top_logic.layout.view.table.DropTargetMode.ROW.tooltip = Eine einzelne Zeile ist das Ziel. <p> Ein Ablegen gilt für die Zeile, auf der es vorgenommen wurde – das ist es, was der Zielkanal des Ablegens in die Aktionskette trägt; ein Ablegen neben den Zeilen gilt für nichts. Die Zeilen werden einzeln hervorgehoben, während ein solches Ziehen über die Tabelle bewegt wird. </p>
com.top_logic.layout.view.table.DropTargetMode.TABLE = Tabelle
com.top_logic.layout.view.table.DropTargetMode.TABLE.tooltip = Die Tabelle als Ganzes ist das Ziel. <p> Ein Ablegen an beliebiger Stelle der Tabelle gilt, und der Aktionskette wird nichts über die abgelegten Objekte hinaus mitgeteilt – was das Ablegen bedeutet, ist überall dasselbe. </p>
com.top_logic.layout.view.table.DropTargetMode.tooltip = Worauf ein deklariertes Ablegen einer Tabelle zielt: auf die Tabelle als Ganzes oder auf eine einzelne Zeile davon.
com.top_logic.layout.view.table.DynamicColumns = Dynamische Spalten
com.top_logic.layout.view.table.DynamicColumns.Config.aggregate = Aggregat
com.top_logic.layout.view.table.DynamicColumns.Config.aggregate.tooltip = Was eine Spalte für eine Gruppe von Zeilen anzeigt: eine Funktion aus den Zeilen der Gruppe und dem Objekt, für das die Spalte steht, deren Ergebnis in der Kopfzeile der Gruppe angezeigt wird. <p> Die Werte der deklarierten Eingaben stehen an erster Stelle, in der Reihenfolge ihrer Deklaration. Das Ergebnis ist ein Wert des Typs, den die Spalte enthält, und wird genau so dargestellt wie eine Zelle dieser Spalte. Ist diese Option nicht gesetzt, bleiben die Zellen der Gruppe leer. </p>
com.top_logic.layout.view.table.DynamicColumns.Config.can-update = Bearbeitbar
com.top_logic.layout.view.table.DynamicColumns.Config.can-update.tooltip = Ob die Zelle einer Zeile bearbeitet werden kann: Eine Funktion der Zeile und des Objekts, für das die Spalte steht, die angibt, ob dort die Bearbeitungsfunktion angeboten wird. <p> Die Werte der deklarierten Eingaben stehen an erster Stelle, in der Reihenfolge ihrer Deklaration. Ist die Funktion nicht gesetzt, wird jede Zeile einer Spalte bearbeitet, die eine Aktualisierung deklariert. </p>
com.top_logic.layout.view.table.DynamicColumns.Config.column-label = Spaltenbezeichnung
com.top_logic.layout.view.table.DynamicColumns.Config.column-label.tooltip = Die Funktion, die die Spaltenüberschrift einer Spalte berechnet und dabei das Objekt erhält, für das diese Spalte steht. <p> Die Werte der deklarierten Eingaben stehen an erster Stelle, in der Reihenfolge ihrer Deklaration. Das Ergebnis ist ein internationalisierter Text, eine Zeichenkette oder ein beliebiges Objekt, das durch seine Bezeichnung dargestellt wird. Ist diese Option nicht gesetzt, benennt das Objekt selbst seine Spalte. </p>
com.top_logic.layout.view.table.DynamicColumns.Config.column-name = Spaltenname
com.top_logic.layout.view.table.DynamicColumns.Config.column-name.tooltip = Die Funktion, die den Namen einer Spalte berechnet und dabei das Objekt erhält, für das diese Spalte steht. <p> Die Werte der deklarierten Eingaben stehen an erster Stelle, in der Reihenfolge ihrer Deklaration. Das Ergebnis ist ein Text, der über alle Sitzungen hinweg gleich bleibt, da die Anordnung einer Spalte durch den Benutzer unter ihrem Namen gespeichert wird. Ist diese Option nicht gesetzt, wird die Spalte mit der Bezeichnung des Objekts benannt. </p>
com.top_logic.layout.view.table.DynamicColumns.Config.column-type = Spaltentyp
com.top_logic.layout.view.table.DynamicColumns.Config.column-type.tooltip = Die Funktion, die den Typ der Werte einer Spalte berechnet und dabei das Objekt erhält, für das diese Spalte steht. <p> Die Werte der deklarierten Eingaben stehen an erster Stelle, in der Reihenfolge ihrer Deklaration. Das Ergebnis ist eine Referenz auf einen Modelltyp, z. B. <code>`tl.core:Integer`</code>. Eine Deklaration, deren Spalten alle Werte desselben Typs aufweisen, gibt diesen Typ an, anstatt ihn zu berechnen. </p>
com.top_logic.layout.view.table.DynamicColumns.Config.columns = Spalten
com.top_logic.layout.view.table.DynamicColumns.Config.columns.tooltip = Die Funktion, die die Objekte berechnet, für die die Spalten stehen, wobei jede Spalte einem Objekt entspricht und die Reihenfolge der Spalten der Reihenfolge der Objekte entspricht. <p> Die Werte der deklarierten Eingaben stehen an erster Stelle, in der Reihenfolge ihrer Deklaration, sodass die Spalten der Darstellung an anderer Stelle entsprechen. Ein Objekt ist alles, womit die anderen Funktionen dieser Deklaration arbeiten können – ein Modellobjekt, ein Datum, eine Zeichenkette. </p>
com.top_logic.layout.view.table.DynamicColumns.Config.multiple = Mehrere
com.top_logic.layout.view.table.DynamicColumns.Config.multiple.tooltip = Ob eine Zelle statt eines einzelnen Werts eine Auflistung von Werten des deklarierten Typs enthält.
com.top_logic.layout.view.table.DynamicColumns.Config.name = Name
com.top_logic.layout.view.table.DynamicColumns.Config.name.tooltip = Der Name, nach dem jede Spalte dieser Deklaration benannt ist. <p> Der Name einer Spalte setzt sich aus diesem Namen, einem Punkt und dem Namen des Objekts zusammen, für das die Spalte steht – so bleiben die Spalten dieser Deklaration von den anderen Spalten der Tabelle getrennt, unabhängig davon, für welche Objekte sie erstellt wurden. </p>
com.top_logic.layout.view.table.DynamicColumns.Config.readonly = Schreibgeschützt
com.top_logic.layout.view.table.DynamicColumns.Config.readonly.tooltip = Ob die Spalten dieser Deklaration schreibgeschützt bleiben, während die Zeilen der Tabelle bearbeitet werden.
com.top_logic.layout.view.table.DynamicColumns.Config.type = Typ
com.top_logic.layout.view.table.DynamicColumns.Config.type.tooltip = Der Typ der berechneten Werte, der bestimmt, wie die Spalten diese Werte anzeigen, sortieren und filtern. <p> Alle Spalten dieser Deklaration zeigen Werte dieses Typs an. Ist dies nicht der Fall, wird der Typ stattdessen für jede Spalte berechnet. Ist der Typ nicht festgelegt und gibt es auch keine Funktion, die ihn berechnet, ist nichts über die Werte bekannt, und die Spalten zeigen sie anhand ihrer Bezeichnung an. </p>
com.top_logic.layout.view.table.DynamicColumns.Config.update = Aktualisierung
com.top_logic.layout.view.table.DynamicColumns.Config.update.tooltip = Die Funktion, die den Wert einer bearbeiteten Zelle schreibt und dabei die Zeile, das Objekt, für das die Spalte steht, sowie den eingegebenen Wert als ihre letzten drei Argumente erhält. <p> Die Werte der deklarierten Eingaben stehen an erster Stelle, in der Reihenfolge ihrer Deklaration. Ist diese Funktion nicht gesetzt, werden die Spalten angezeigt, aber nicht bearbeitet. </p>
com.top_logic.layout.view.table.DynamicColumns.Config.value = Wert
com.top_logic.layout.view.table.DynamicColumns.Config.value.tooltip = Die Funktion, die den Zellenwert berechnet und die Zeile sowie das Objekt, für das die Spalte steht, als ihre letzten beiden Argumente erhält. <p> Die Werte der deklarierten Eingaben stehen an erster Stelle, in der Reihenfolge ihrer Deklaration. </p>
com.top_logic.layout.view.table.DynamicColumns.Config.width = Breite
com.top_logic.layout.view.table.DynamicColumns.Config.width.tooltip = Die Standard-Anzeigebreite jeder Spalte dieser Deklaration in Pixeln. <p> Dies ist die Breite, die der Benutzer sieht, bis er die Spaltenbreite selbst anpasst; ab diesem Zeitpunkt wird die von ihm gewählte Breite gespeichert. Der Wert 0 – der Standardwert – behält die Breite bei, die sich aus dem Typ der Werte ergibt. </p>
com.top_logic.layout.view.table.DynamicColumns.tooltip = Die <dynamic-columns> einer Tabelle: eine Spalte pro Element einer berechneten Objektmenge. <p> Eine Tabelle mit Mitarbeitern, die eine Spalte pro Monat enthält, eine Tabelle mit Aufgaben, die eine Spalte pro Meilenstein enthält: Welche Spalten vorhanden sind, wird durch die Daten bestimmt, nicht durch die Konfiguration. Jede dieser Spalten steht für ein Objekt – einen Monat, einen Meilenstein – und zeigt an, welchen Wert die Zeile dafür enthält, den die Wertfunktion aus der Zeile und diesem Objekt berechnet. </p> <p> Die Spalten sind nach der Deklaration und dem Objekt benannt, für das sie jeweils stehen, sodass die Anordnung einer Spalte durch den Benutzer unter einem Namen gespeichert wird, der ihr dauerhaft zugeordnet bleibt. Sie teilen sich die Eigenschaften, die in der Deklaration für alle festgelegt sind: den Typ ihrer Werte (oder eine Funktion, die diesen pro Spalte berechnet), ihre Anzeigebreite und die Tatsache, dass sie während der Bearbeitung der Zeilen schreibgeschützt bleiben. Ihr Filter ist derjenige, der sich aus ihrem Typ ergibt; ein eigener Filter wird nicht deklariert, da es keine einzelne Spalte gibt, für die er deklariert werden könnte. </p> <p> Die Spalten sind diejenigen, die die Funktion liefert, wenn die Tabelle erstellt wird. Eine Tabelle, deren Zeilen einer Eingabe folgen, liest ihre Zeilen erneut, sobald sich diese Eingabe ändert; ihre Spalten sind diejenigen, mit denen sie erstellt wurde. </p>
com.top_logic.layout.view.table.EmbeddedColumns = Eingebettete Spalten
com.top_logic.layout.view.table.EmbeddedColumns.Config.label = Bezeichnung
com.top_logic.layout.view.table.EmbeddedColumns.Config.label.tooltip = Womit die Überschrift jeder eingebetteten Spalte beginnt, oder nicht gesetzt, um es aus den Bezeichnungen der Verweise zu übernehmen, die zu dem eingebetteten Objekt führen. <p> Die Bezeichnung einer eingebetteten Spalte setzt sich aus diesem Präfix und der eigenen Bezeichnung der Spalte zusammen, sodass der Name der Zeile und der Name des Bearbeiters unterschiedlich lauten. Eine berechnete Einbettung verfügt über keine Referenz, aus der das Präfix entnommen werden könnte, und legt es daher selbst fest. </p>
com.top_logic.layout.view.table.EmbeddedColumns.Config.multiple = Mehrere
com.top_logic.layout.view.table.EmbeddedColumns.Config.multiple.tooltip = Ob die Funktion <i>Objekt</i> eine Auflistung von Objekten anstelle eines einzelnen Objekts liefert. <p> Jede eingebettete Spalte zeigt dann den Wert jedes einzelnen Objekts an, genau wie in dem Fall, in dem eine Referenz im Pfad mehrere Objekte enthält. Eine Einbettung, die eine Referenz benennt, übernimmt dies aus dem Pfad. </p>
com.top_logic.layout.view.table.EmbeddedColumns.Config.name = Name
com.top_logic.layout.view.table.EmbeddedColumns.Config.name.tooltip = Der Name, nach dem die eingebetteten Spalten benannt sind, oder nicht gesetzt, um sie nach der Referenz zu benennen, die zu ihnen führt. <p> Dies ist der Anfang der Namen der eingebetteten Spalten, damit eine Spalte des eingebetteten Objekts und eine der Zeile selbst voneinander unterschieden werden können. Eine berechnete Einbettung hat keine Referenz, aus der sie entnommen werden könnte, und deklariert sie selbst. </p>
com.top_logic.layout.view.table.EmbeddedColumns.Config.object = Objekt
com.top_logic.layout.view.table.EmbeddedColumns.Config.object.tooltip = Die Funktion, die das eingebettete Objekt berechnet und die Zeile als letztes Argument erhält. <p> Die Werte der deklarierten Eingaben werden zuerst in der Reihenfolge ihrer Deklaration angegeben. Die Funktion liefert das eine Objekt, dessen Spalten eingebettet sind, vom deklarierten Typ. </p>
com.top_logic.layout.view.table.EmbeddedColumns.Config.reference = Referenz
com.top_logic.layout.view.table.EmbeddedColumns.Config.reference.tooltip = Die Referenz, die von der Zeile zum eingebetteten Objekt führt. <p> Ein durch Punkte getrennter Pfad aus Referenznamen führt zu einem weiter entfernten Objekt, wobei jeder Schritt in dem Typ aufgelöst wird, zu dem der vorhergehende Schritt führt. Bei einem Schritt, der mehrere Objekte enthält, wird in jeder eingebetteten Spalte der Wert jedes einzelnen Objekts angezeigt. </p> <p> Entweder wird hier die Referenz zum eingebetteten Objekt benannt, oder das Objekt wird durch eine Funktion berechnet und sein Typ deklariert. </p>
com.top_logic.layout.view.table.EmbeddedColumns.Config.type = Typ
com.top_logic.layout.view.table.EmbeddedColumns.Config.type.tooltip = Der Typ des berechneten Objekts, der bestimmt, mit welchen Spalten es eingebettet wird. <p> Wird zusammen mit der Funktion deklariert, die das Objekt berechnet; eine Einbettung, die eine Referenz benennt, übernimmt den Typ dieser Referenz. </p>
com.top_logic.layout.view.table.EmbeddedColumns.tooltip = Die „ <embedded-columns> “ einer Tabelle: Die Spalten eines Objekts, auf das die Zeile verweist, werden als Spalten der Zeile dargestellt. <p> Eine Tabelle mit Tickets zeigt den Namen und die E-Mail-Adresse des Bearbeiters an, ohne ein zweites Mal anzugeben, wie eine Person dargestellt wird: Sie bettet die Spalten des Bearbeiters ein, und jede von ihnen liest ihren Wert aus der Person aus, auf die die Zeile verweist. Das eingebettete Objekt wird entweder durch die Benennung der darauf verweisenden Referenz erreicht – ein ganzer Pfad von Referenzen, wenn es weiter entfernt ist – oder durch eine Funktion, die es berechnet, falls keine einzelne Referenz auf das Objekt verweist. </p> <p> Eingebettet werden Spaltendeklarationen jeglicher Art, die genau wie die Spalten einer Tabelle über diesem Objekt anhand des Typs des eingebetteten Objekts aufgelöst werden – einschließlich der Spalten, die der eingebettete Typ zusätzlich bietet, sowie einer weiteren Einbettung einen Schritt weiter. Eine Einbettung, die nichts deklariert, zeigt die Haupteigenschaften des eingebetteten Typs an, sodass die Nennung der Referenz ausreicht. </p> <p> Die eingebetteten Spalten werden nach dem zu ihnen führenden Pfad benannt und erhalten eine Bezeichnung, sodass der Name der Zeile und der Name des Zuweisungsempfängers in der Kopfzeile und bei der Spaltenauswahl voneinander getrennt bleiben. Wenn eine Zeile mehrere Objekte umfasst – über eine Referenz, die mehr als eines enthält, oder über eine Funktion, die eine Auflistung davon liefert –, zeigt eine Zelle den Wert jedes einzelnen Objekts an. </p>
com.top_logic.layout.view.table.FilterStateConfig$BooleanConfig = Boolesche Konfiguration
com.top_logic.layout.view.table.FilterStateConfig$BooleanConfig.tooltip = Ein Kriterium für eine Spalte, die nach einem Wahrheitswert gefiltert wird.
com.top_logic.layout.view.table.FilterStateConfig$OptionsConfig = Konfiguration der Optionen
com.top_logic.layout.view.table.FilterStateConfig$OptionsConfig.tooltip = Ein Kriterium für eine Spalte, die durch Auswahl aus ihren Werten gefiltert wird.
com.top_logic.layout.view.table.FilterStateConfig$RangeConfig = Konfiguration des Bereichs
com.top_logic.layout.view.table.FilterStateConfig$RangeConfig.tooltip = Ein Kriterium für eine Spalte, die durch den Vergleich ihrer Werte gefiltert wird.
com.top_logic.layout.view.table.FilterStateConfig$TextConfig = Textkonfiguration
com.top_logic.layout.view.table.FilterStateConfig$TextConfig.tooltip = Ein Kriterium für eine Spalte, die nach einem Textmuster gefiltert wird. <p> Die Übereinstimmungsoptionen entsprechen denen, die der Filter der Spalte dem Benutzer anbietet, und haben hier dieselbe Bedeutung: Ein Muster stimmt mit einem Teil des Zelltextes überein, wobei die Groß-/Kleinschreibung ignoriert wird, sofern nicht anders angegeben. </p>
com.top_logic.layout.view.table.FilterStateConfig.BooleanConfig.accept = Akzeptierte Werte
com.top_logic.layout.view.table.FilterStateConfig.BooleanConfig.accept.tooltip = TL-Script-Ausdruck, der berechnet, welche Wahrheitswerte akzeptiert werden: einer davon oder eine Sammlung mehrerer. <p> Kein Wert steht für die Zellen ohne Wert, die nur von einer Spalte akzeptiert werden, die solche Zellen hat; alles andere wird als Wahrheitswert gelesen, so wie TL-Script einen solchen liest. Ein Kriterium, das alle Werte einer Spalte akzeptiert, filtert nichts. </p>
com.top_logic.layout.view.table.FilterStateConfig.OptionsConfig.selected = Ausgewählt
com.top_logic.layout.view.table.FilterStateConfig.OptionsConfig.selected.tooltip = TL-Script-Ausdruck, der den Wert oder die Sammlung von Werten berechnet, die ausgewählt werden sollen. <p> Jeder berechnete Wert muss zu den Optionen gehören, die die Spalte anbietet; ein Wert, den sie nicht anbietet, führt zu einem Konfigurationsfehler, und die Voreinstellung wird dann nicht angeboten – eine Auswahl, bei der einer der Werte fehlt, entspricht anderen Zeilen als in der Deklaration angegeben. Ein Wert, der nicht vorhanden ist, wählt nichts aus; daher lässt ein Kriterium, das auswählt, was an anderer Stelle angezeigt wird, die Spalte ungefiltert, solange dort nichts ausgewählt ist. </p>
com.top_logic.layout.view.table.FilterStateConfig.RangeConfig.operator = Vergleichsoperator
com.top_logic.layout.view.table.FilterStateConfig.RangeConfig.operator.tooltip = Wie der Zellenwert mit den festgelegten Grenzen verglichen wird.
com.top_logic.layout.view.table.FilterStateConfig.RangeConfig.primary = Primärwert
com.top_logic.layout.view.table.FilterStateConfig.RangeConfig.primary.tooltip = TL-Script-Ausdruck, der den Wert berechnet, mit dem der Zellwert verglichen wird – die untere Grenze eines Vergleichs mit einem Bereich. <p> Ein Ausdruck, der nichts ergibt, filtert nichts heraus. </p>
com.top_logic.layout.view.table.FilterStateConfig.RangeConfig.secondary = Sekundärwert
com.top_logic.layout.view.table.FilterStateConfig.RangeConfig.secondary.tooltip = TL-Script-Ausdruck zur Berechnung der Obergrenze eines Vergleichs mit einem Bereich; dies ist der einzige Vergleich, bei dem eine zweite Grenze verwendet wird.
com.top_logic.layout.view.table.FilterStateConfig.TextConfig.case-sensitive = Groß-/Kleinschreibung beachten
com.top_logic.layout.view.table.FilterStateConfig.TextConfig.case-sensitive.tooltip = Ob Groß- und Kleinschreibung ebenfalls übereinstimmen müssen.
com.top_logic.layout.view.table.FilterStateConfig.TextConfig.pattern = Muster
com.top_logic.layout.view.table.FilterStateConfig.TextConfig.pattern.tooltip = TL-Script-Ausdruck zur Berechnung des abzugleichenden Musters. <p> Der Text, den der Ausdruck liefert, ist das Muster; ein Ausdruck, der nichts liefert, filtert nichts, sodass ein Kriterium, das mit einer an anderer Stelle getroffenen Auswahl übereinstimmt, die Spalte ungefiltert lässt, solange nichts ausgewählt ist. </p>
com.top_logic.layout.view.table.FilterStateConfig.TextConfig.regexp = Regulärer Ausdruck
com.top_logic.layout.view.table.FilterStateConfig.TextConfig.regexp.tooltip = Ob es sich bei dem Muster um einen regulären Ausdruck handelt und nicht um einen zu suchenden Text.
com.top_logic.layout.view.table.FilterStateConfig.TextConfig.whole-field = Gesamtes Feld
com.top_logic.layout.view.table.FilterStateConfig.TextConfig.whole-field.tooltip = Ob der gesamte Zelltext übereinstimmen muss oder nur ein Teil davon.
com.top_logic.layout.view.table.ScriptedFilter = Skriptbasierter Filter
com.top_logic.layout.view.table.ScriptedFilter.Config.label = Bezeichnung
com.top_logic.layout.view.table.ScriptedFilter.Config.label.tooltip = Der Titel des Dialogfelds bzw. die Bezeichnung des Spaltenfilters.
com.top_logic.layout.view.table.ScriptedFilter.Config.match = Abgleichfunktion
com.top_logic.layout.view.table.ScriptedFilter.Config.match.tooltip = Die Closure-Bildungsfunktion (params [, ...inputs]) -&gt; ((value, row) -&gt; Boolean).
com.top_logic.layout.view.table.ScriptedFilter.Config.model = Modell
com.top_logic.layout.view.table.ScriptedFilter.Config.model.tooltip = Der Modelltyp, dessen Attribute die Filterparameter sind (dargestellt als Filterformular).
com.top_logic.layout.view.table.ScriptedFilter.tooltip = Ein vollständig modell- und skriptbasierter Spaltenfilter: Die Filter-Benutzeroberfläche ist ein Formular, das auf einer temporären Instanz eines konfigurierten Parametertyps basiert, und die Filterlogik ist eine TL-Script-Abgleichfunktion. <p> Die Match-Funktion ist ein <em>Closure-Erbauer</em>: </p><pre> match : (params [, ...inputs]) -&gt; ( (value, row) -&gt; Boolean ) </pre> <p> Sie wird <em>einmal</em> pro Filteranwendung ausgewertet (wobei das Parameterobjekt des Formulars und etwaige konfigurierte zusätzliche Eingaben gebunden werden), um eine Prädikat-Closure zu erzeugen, die dann pro Zeile mit dem Zellwert der Spalte und der gesamten Zeile als Kontext angewendet wird – so erfolgt die aufwendige, aus Parametern abgeleitete Einrichtung nur einmal und nicht pro Zeile. </p> <p> Der Filter integriert seine eigene Spalte und seinen eigenen Dialog durch die Implementierung <i>einer Spaltenbindung</i>: Die Spaltenzelle enthält eine <i>skriptgesteuerte Zelle</i> (Wert + Zeile), sodass der Filter beides sieht, ohne zu wissen, woher der Wert stammt, und der Filter registriert sein eigenes <i>skriptgesteuertes Filter-UI-Formular</i>. </p>
com.top_logic.layout.view.tiles.FrameParamConfig = Rahmenparameter
com.top_logic.layout.view.tiles.FrameParamConfig.expr = Ausdruck
com.top_logic.layout.view.tiles.FrameParamConfig.expr.tooltip = Ausdruck, der die Abbildung des Wertes des Parameters auf den Text vornimmt, den die URL enthält. <p> Empfängt den Wert, den der Frame enthält, und gibt den Text zurück, der ihn benennt. Ein Ausdruck, der nichts zurückgibt, bedeutet, dass der Wert keinen Namen in einer URL hat – beispielsweise ein temporäres Objekt – und der Frame liefert dann kein Segment: Eine Adresse, die nicht erneut geöffnet werden kann, sollte besser nicht geschrieben werden. </p>
com.top_logic.layout.view.tiles.FrameParamConfig.name = Name
com.top_logic.layout.view.tiles.FrameParamConfig.name.tooltip = Der Parameter, auf den diese Konvertierung angewendet wird. <p> Der Name eines Parameterplatzhalters der Route, der gleichzeitig der Name des Kanals ist, über den der Frame den Wert empfängt. </p>
com.top_logic.layout.view.tiles.FrameParamConfig.reverse = Umgekehrt
com.top_logic.layout.view.tiles.FrameParamConfig.reverse.tooltip = Ausdruck, der den in der URL enthaltenen Text auf den Wert des Parameters abbildet. <p> Empfängt den Text der URL und gibt den Wert zurück, mit dem der Frame eingebunden wird. Ein Ausdruck, der nichts zurückgibt, bedeutet, dass die URL etwas benennt, das die Anzeige nicht darstellen kann – ein gelöschtes Objekt, eine falsch eingegebene Kennung – und der Frame wird dann überhaupt nicht wiederhergestellt. </p>
com.top_logic.layout.view.tiles.FrameParamConfig.tooltip = Umwandlung eines Parameters einer Frame-Route zwischen dem Wert, den der Frame enthält, und dem Text, den die URL überträgt. <p> Eine URL enthält Text, ein Frame-Parameter typischerweise ein Geschäftsobjekt. Die beiden Ausdrücke führen eine Abbildung zwischen diesen beiden Formen durch: „expr“ erstellt eine Abbildung, die den Wert mit dem Text verbindet, der ihn benennt, „reverse“ erstellt eine Abbildung, die den Text mit dem Wert verbindet. Für ein Objekt, das durch seine technische Kennung identifiziert wird, lautet dies „expr="p -&gt; objectId($p)" und „reverse="id -&gt; objectResolve(`tl.accounts:Person`, $id)“; eine lesbare URL verwendet stattdessen einen Geschäftsschlüssel, was jedoch auf Kosten der Eindeutigkeit geht, die der Schlüssel dann aufweisen muss. </p> <p> Ein Parameter der Route ohne eigenen Eintrag wird als Text übertragen: Der Wert benennt sich selbst in der URL, und der Text der URL ist der Wert – genau das, was ein Parameter benötigt, der eine Zeichenkette enthält. </p>
com.top_logic.layout.view.tiles.FrameRouteConfig = Rahmen-Route
com.top_logic.layout.view.tiles.FrameRouteConfig.label = Bezeichnung
com.top_logic.layout.view.tiles.FrameRouteConfig.label.tooltip = Berechnung der Bezeichnung eines Frames dieser Ansicht. <p> Die Auswertung erfolgt über die Parameter des Frames, die die Berechnung als Kanäle ihrer Namen liest: &lt;scripted&gt; mit inputs="person" expr="p -&gt; $p.get(`tl.accounts:Person#name`)" benennt einen Frame nach dem Objekt, das sie anzeigt, &lt;static&gt; nach festem Text. </p> <p> Die Deklaration benennt jeden Frame dieser Ansicht: sowohl den, der über eine URL wiederhergestellt wird, als auch den, den ein &lt;navigate-push&gt; ohne eigene Frame-Bezeichnung einfügt – wodurch ein Frame für jede Stelle, an der er eingefügt wird, einmalig auf der Stapelebene benannt wird. </p>
com.top_logic.layout.view.tiles.FrameRouteConfig.params = Parameter
com.top_logic.layout.view.tiles.FrameRouteConfig.params.tooltip = Umwandlungen zwischen den Parameterwerten des Frames und den Texten, die die URL enthält. <p> Ein Eintrag pro Parameter der Route, der noch kein Text ist. Ein Parameter ohne Eintrag wird als Text übertragen. </p>
com.top_logic.layout.view.tiles.FrameRouteConfig.route = Route
com.top_logic.layout.view.tiles.FrameRouteConfig.route.tooltip = Muster der URL-Segmente, die der Frame einnimmt. <p> Ein Muster aus statischen Segmenten und Parameterplatzhaltern, zum Beispiel „person/:person“. Jeder Platzhalter bezeichnet einen Parameter des Frames, und die davor stehenden statischen Segmente verleihen der Adresse ein lesbares Präfix, das angibt, was der Frame anzeigt. </p>
com.top_logic.layout.view.tiles.FrameRouteConfig.tooltip = Der Pfad in der URL, den ein Frame eines &lt;tile-stack&gt; einnimmt. <p> Ein Drill-Down-Pfad ist Teil der Adresse der Seite: Jeder Frame auf dem Pfad trägt die für seine Ansicht deklarierte Route bei, sodass die URL den Pfad benennt, den der Benutzer durchlaufen hat, und beim erneuten Öffnen genau diese Frames wiederhergestellt werden. Eine Frame-Ansicht ohne Deklaration wird wie jede andere angezeigt, hat jedoch keine Adresse, und es gibt auch keine Unterebene, in die von ihr aus vorgelängt wurde. </p> <p> Die Route ist ein Muster aus statischen Segmenten und Parameterplatzhaltern wie z. B. person/:person: Die statischen Segmente benennen, was der Frame anzeigt, die Platzhalter enthalten seine Parameter. Die Deklaration enthält außerdem die Bezeichnung des Frames, nach der jeder Frame dieser Ansicht benannt wird – sowohl der, der über eine URL wiederhergestellt wird, als auch der, den ein &lt;navigate-push&gt; ohne eigene Bezeichnung übergibt. </p> <p> Beispiel: </p><pre> &lt;tile-stack initial="accounts/overview.view.xml" path="navPath"&gt; &lt;frame route="person/:person" view="accounts/person-detail.view.xml"&gt; &lt;param name="person" expr="p -&gt; objectId($p)" reverse="id -&gt; objectResolve(`tl.accounts:Person`, $id)"/&gt; &lt;label class="com.top_logic.layout.view.tiles.ScriptedTileLabel" expr="p -&gt; $p.get(`tl.accounts:Person#name`)" inputs="person"/&gt; &lt;/frame&gt; &lt;/tile-stack&gt; </pre>
com.top_logic.layout.view.tiles.FrameRouteConfig.view = Ansicht
com.top_logic.layout.view.tiles.FrameRouteConfig.view.tooltip = Pfad der Frame-Ansicht, die diese Route beschreibt, relativ zu /WEB-INF/views/. <p> Dies ist dieselbe Referenz, mit der ein Frame dieser Ansicht übermittelt wird, sodass ein Frame auf diesem Pfad die Route findet, die ihn beschreibt. </p>
com.top_logic.layout.view.tiles.NavigatePopAction = Pop-Aktion
com.top_logic.layout.view.tiles.NavigatePopAction.tooltip = <i>Ansichtsaktion</i>, die den obersten Rahmen vom umgebenden Kachel-Stapel entfernt. <p> Die Eingabe wird als Ausgabe weitergegeben, so dass eine nachfolgende Aktion der Kette weiterhin das Objekt sieht, mit dem die Kette arbeitet - dadurch wird "das Objekt löschen und anschließend den Rahmen verlassen, der es angezeigt hat" zu einem einzigen Befehl. </p>
com.top_logic.layout.view.tiles.NavigatePopCommand = Pop-Befehl navigieren
com.top_logic.layout.view.tiles.NavigatePopCommand.tooltip = <i>Ansichtsbefehl</i>, der den obersten Rahmen vom umgebenden Kachel-Stapel entfernt. <p> Löst den Zielstapel aus dem <i>Ansichtskontext</i> auf - typischerweise verwendet von einer "Zurück"-Schaltfläche innerhalb eines geschobenen Rahmens. Für eine Breadcrumb-gesteuerte Navigation ist es vorzuziehen, den &lt;tile-breadcrumb&gt; direkt in den Pfadkanal schreiben zu lassen. Um das Entfernen als einen Schritt eines längeren Befehls auszuführen, verwenden Sie die Aktion mit demselben Tag innerhalb eines &lt;generic-command&gt;. </p>
com.top_logic.layout.view.tiles.NavigatePopToAction = Pop-bis-Tiefe-Aktion
com.top_logic.layout.view.tiles.NavigatePopToAction.Config.depth = Tiefe
com.top_logic.layout.view.tiles.NavigatePopToAction.Config.depth.tooltip = Anzahl der Rahmen, die auf dem Stapel verbleiben sollen.
com.top_logic.layout.view.tiles.NavigatePopToAction.tooltip = <i>Ansichtsaktion</i>, die den umgebenden Kachel-Stapel auf eine feste Tiefe abschneidet. <p> Nach der Ausführung verbleiben genau <i>Depth-Frames</i> auf dem Stack. depth=0 leert den Stack (die Ausgangsansicht wird wieder angezeigt). Werte, die größer als die aktuelle Tiefe sind, sind no-ops. </p> <p> Die Eingabe wird als Ausgabe weitergegeben, so dass eine nachfolgende Aktion der Kette weiterhin das Objekt sieht, mit dem die Kette arbeitet. </p>
com.top_logic.layout.view.tiles.NavigatePopToCommand = Navigieren Sie zum Befehl pop
com.top_logic.layout.view.tiles.NavigatePopToCommand.Config.depth = Tiefe
com.top_logic.layout.view.tiles.NavigatePopToCommand.Config.depth.tooltip = Anzahl der Frames, die nach Ausführung des Befehls auf dem Stack verbleiben sollen.
com.top_logic.layout.view.tiles.NavigatePopToCommand.tooltip = <i>Ansichtsbefehl</i>, der den Kachel-Stapelpfad auf eine feste Tiefe abschneidet. <p> Nach der Ausführung verbleiben genau <i>Depth-Frames</i> auf dem Stack. depth=0 leert den Stack (die Ausgangsansicht wird wieder angezeigt). Werte, die größer als die aktuelle Tiefe sind, sind no-ops. Um das Abschneiden als einen Schritt eines längeren Befehls auszuführen, verwenden Sie die Aktion mit demselben Tag innerhalb eines &lt;generic-command&gt;. </p>
com.top_logic.layout.view.tiles.NavigatePushCommand = Push-Befehl navigieren
com.top_logic.layout.view.tiles.NavigatePushCommand.Config.bind-input-to = Eingabe binden an
com.top_logic.layout.view.tiles.NavigatePushCommand.Config.bind-input-to.tooltip = Name des Kanals in der geschobenen Ansicht, der den Eingabewert des Befehls erhalten soll. <p> Bequemlichkeit für den häufigen Fall, dass das Drilldown-Ziel ein einzelnes Geschäftsobjekt ist (z. B. die in einer Tabelle ausgewählte Zeile). Ist der Wert null, wird die Eingabe nicht weitergegeben - verwenden Sie stattdessen explizit <bind>s. </p>
com.top_logic.layout.view.tiles.NavigatePushCommand.Config.bindings = Bindungen
com.top_logic.layout.view.tiles.NavigatePushCommand.Config.bindings.tooltip = Kanalbindungen aus dem aufrufenden Bereich an die Kanäle des neuen Rahmens. <p> Jede Bindung erfasst den <em>aktuellen Wert</em> des referenzierten übergeordneten Kanals zur Push-Zeit und speichert ihn unter <i>Channel</i><i>(Kanalbindungskonfiguration</i>) in den Push-Frame-Parametern. Der Kanal der eingebundenen Ansicht mit diesem Namen erhält den erfassten Wert als Anfangszustand. </p>
com.top_logic.layout.view.tiles.NavigatePushCommand.Config.frame-label = Bezeichnung des Rahmens
com.top_logic.layout.view.tiles.NavigatePushCommand.Config.frame-label.tooltip = Berechnung der Bezeichnung für den Breadcrumb des geschobenen Rahmens. <p> Wird genau einmal zur Push-Zeit aufgelöst; der resultierende <i>Ressourcenschlüssel</i> wird als Bezeichnung des geschobenen Frames erfasst. Verwenden Sie &lt;static&gt; für festen Text, &lt;scripted&gt; für eine Bezeichnung, die zum Push-Zeitpunkt aus den Kanälen des Aufruferbereichs abgeleitet wird. </p>
com.top_logic.layout.view.tiles.NavigatePushCommand.Config.view = Siehe
com.top_logic.layout.view.tiles.NavigatePushCommand.Config.view.tooltip = Pfad der View-Datei, die als neuer Frame eingebunden werden soll, relativ zu /WEB-INF/views/.
com.top_logic.layout.view.tiles.NavigatePushCommand.tooltip = <i>View-Befehl</i>, der einen neuen <i>Kachel-Frame</i> auf den umschließenden Kachel-Stapel schiebt. <p> Löst den Zielstapel aus dem <i>View-Kontext</i> auf - der Befehl muss aus einem Frame heraus ausgeführt werden, der von einem &lt;Kachel-Stapel&gt; eingehängt wurde. Zur Ausführungszeit werden erfasst: die Eingabe des Befehls (abgebildet auf einen benannten Kanal des neuen Frames, wenn bind-input-to gesetzt ist) und der aktuelle Wert jedes Kanals, der von einem <bind> referenziert wird. </p> <p> Beispiel - Drilling in eine Produkt-Detailansicht von einer Schaltfläche neben einer Produkttabelle: </p> <pre> &lt;button&gt; &lt;action class="com.top_logic.layout.view.tiles.NavigatePushCommand" view="products/detail.view.xml" input="selectedProduct" bind-input-to="product" frame-label="product.detail.crumb"/&gt; &lt;label&gt;&lt;en&gt;Open&lt;/en&gt;&lt;/label&gt; &lt;/button&gt; </pre>
com.top_logic.layout.view.tiles.ScriptedTileLabel = Bezeichnung der Kachel in Schriftform
com.top_logic.layout.view.tiles.ScriptedTileLabel.Config.expr = Ausdruck
com.top_logic.layout.view.tiles.ScriptedTileLabel.Config.expr.tooltip = TL-Script-Ausdruck, der die Bezeichnung zurückgibt. <p> Die Werte der deklarierten Eingaben stehen an erster Stelle, in der Reihenfolge ihrer Deklaration. </p>
com.top_logic.layout.view.tiles.ScriptedTileLabel.tooltip = <i>Kachel-Label-Berechnung</i>, die die Bezeichnung anhand der aktuellen Kanalwerte unter Verwendung eines TL-Script-Ausdrucks berechnet. <p> Löst alle Eingaben zur Berechnungszeit in Kanäle auf, liest deren aktuelle Werte aus und übergibt sie als Positionsargumente an den kompilierten Ausdruck. Das Ergebnis des Ausdrucks wird entsprechend seinem Laufzeittyp in einen <i>Ressourcenschlüssel</i> umgewandelt – vorgesehen für Bezeichnungen, die aus Namen von Geschäftsobjekten abgeleitet werden. </p>
com.top_logic.layout.view.tiles.StaticTileLabel = Statische Bezeichnung der Kachel
com.top_logic.layout.view.tiles.StaticTileLabel.Config.value = Wert
com.top_logic.layout.view.tiles.StaticTileLabel.Config.value.tooltip = Die Bezeichnung, die für den geschobenen Rahmen verwendet werden soll.
com.top_logic.layout.view.tiles.StaticTileLabel.tooltip = <i>Berechnung der Kachel-Bezeichnung</i>, die immer einen konfigurierten <i>Ressourcenschlüssel</i> zurückgibt.
com.top_logic.layout.view.tiles.TileBreadcrumbElement = Kachel-Brotkrümel-Element
com.top_logic.layout.view.tiles.TileBreadcrumbElement.Config.home-label = Bezeichnung des Hauses
com.top_logic.layout.view.tiles.TileBreadcrumbElement.Config.home-label.tooltip = Bezeichnung des Home-Crumbs (wird als erster Eintrag gerendert, navigiert immer zu einem leeren Pfad).
com.top_logic.layout.view.tiles.TileBreadcrumbElement.Config.path = Pfad
com.top_logic.layout.view.tiles.TileBreadcrumbElement.Config.path.tooltip = Verweis auf den Kanal, der die Liste<TileFrame> path enthält.
com.top_logic.layout.view.tiles.TileBreadcrumbElement.tooltip = UIElement, das einen nach außen gerichteten Navigationspfad für einen Kachel-Stapel wiedergibt. <p> Liest denselben Pfadkanal wie der Stapel. Der Pfad besteht aus dem Home-Eintrag, gefolgt von einem Krümel pro Frame auf dem Pfad; der letzte Krümel stellt die aktuell angezeigte Ansicht dar. </p> <p> Der Breadcrumb schreibt einen verkürzten Pfad zurück in den Kanal, wenn der Benutzer auf einen Crumb klickt - er benötigt keinen Zugriff auf einen <i>Kachel-Stack-Bereich</i> und kann daher frei platziert werden (Geschwister, Kopfzeile, Seitenleiste, dedizierte Ansicht, die über <bind> verlinkt ist). </p>
com.top_logic.layout.view.tiles.TileStackElement = Kachel-Stapel-Element
com.top_logic.layout.view.tiles.TileStackElement.Config.bind-path-to = Pfad binden an
com.top_logic.layout.view.tiles.TileStackElement.Config.bind-path-to.tooltip = Name, unter dem jeder eingebundene Rahmen den Pfadkanal dieses Stapels sieht. <p> Der Rahmen erhält den Kanal des Stapels selbst, keine Kopie: Eine Rahmenansicht, die einen <channel name="..."/> dieses Namens deklariert, liest den lebenden Pfad. Damit weiß sie, wie tief sie sitzt - ein <derived-channel name="depth" inputs="navPath" expr="p -&gt; $p.size()"/> macht aus dem Pfad eine Zahl, die die &lt;visible-if&gt;-Regel eines Befehls prüfen kann, so dass eine "Zurück"-Schaltfläche sich im Ausgangsrahmen selbst ausblendet. </p> <p> Ohne Namen sieht ein Rahmen nur die Parameter, mit denen er geschoben wurde. </p>
com.top_logic.layout.view.tiles.TileStackElement.Config.frames = Rahmen
com.top_logic.layout.view.tiles.TileStackElement.Config.frames.tooltip = Die Pfade in der URL, die die Frames dieses Stacks belegen. <p> Ein Eintrag pro Frame-Ansicht, deren Frames Teil der Adresse der Seite sind. Ein Pfad solcher Frames wird in die URL geschrieben, und beim erneuten Öffnen dieser URL wird der Pfad Frame für Frame wiederhergestellt; eine Frame-Ansicht ohne Eintrag wird wie jede andere angezeigt, hat jedoch keine Adresse. </p>
com.top_logic.layout.view.tiles.TileStackElement.Config.initial = Ursprüngliche
com.top_logic.layout.view.tiles.TileStackElement.Config.initial.tooltip = Pfad der Ansichtsdatei, die angezeigt wird, wenn der Stapel leer ist (der Homeframe), relativ zu /WEB-INF/views/.
com.top_logic.layout.view.tiles.TileStackElement.Config.path = Pfad
com.top_logic.layout.view.tiles.TileStackElement.Config.path.tooltip = Verweis auf den Kanal, der die Liste<TileFrame> path enthält. <p> Der Kanal muss in einer umschließenden Ansicht deklariert werden. Der Breadcrumb und jede URL-Persistenz verwenden denselben Kanal als Quelle der Wahrheit. </p>
com.top_logic.layout.view.tiles.TileStackElement.tooltip = UIElement, das einen Stapel von Drilldown-Ansichten wiedergibt. <p> Der Stapel verwaltet einen Pfad von <i>Kachel-Frames</i> in dem von <i>Path</i> referenzierten Kanal. Der Pfad ist die einzige Quelle der Wahrheit: sowohl push (von einem &lt;navigate-push&gt; über den installierten <i>Kachel-Stapelbereich</i>) als auch pop (z.B. von einem &lt;tile-breadcrumb&gt;, das ein kürzeres Präfix in den Kanal schreibt) funktionieren durch Mutation des Kanalwertes. </p> <p> Angezeigt wird der Frame am Ende des Pfades; ist der Pfad leer, ist das die ursprüngliche Ansicht. Die von ihm verdeckten Frames bleiben so, wie der Benutzer sie verlassen hat, so dass die Rückkehr zu einem Frame ihn wieder anzeigt, anstatt ihn neu aufzubauen. Jeder Frame erhält seinen eigenen isolierten Kanal-Namensraum und einen für Nachkommen erreichbaren <i>Kachel-Stapelbereich</i>, so dass verschachtelte Befehle weitere Frames ohne explizite Konfiguration schieben können. Unter dem Namen bind-path-to sieht ein Frame zusätzlich den Pfad, auf dem er sich befindet. </p> <p> Der Drilldown-Pfad ist Teil der Adresse der Seite, für jede Frame-Ansicht, für die der Stapel eine &lt;frame&gt;-Route deklariert: Die URL benennt die Frames des Pfades mit je einer Route, und das erneute Öffnen dieser URL stellt genau diese Frames wieder her. </p> <p> Beispiel: </p> <pre> &lt;view&gt; &lt;channels&gt;&lt;channel name="navPath"/&gt;&lt;/channels&gt; &lt;tile-stack path="navPath" initial="products/overview.view.xml"&gt; &lt;frame route="product/:product" view="products/detail.view.xml"&gt; &lt;param name="product" expr="p -&gt; objectId($p)" reverse="id -&gt; objectResolve(`my:Product`, $id)"/&gt; &lt;/frame&gt; &lt;/tile-stack&gt; &lt;/view&gt; </pre>
com.top_logic.layout.view.wizard.AdvanceStepArguments = Zeit für Assistenten-Schritt '{stepId}' abgelaufen
com.top_logic.layout.view.wizard.AdvanceStepArguments.stepId = Schritt-ID
com.top_logic.layout.view.wizard.AdvanceStepArguments.stepId.tooltip = Die clientseitige Kennung des Schritts, für den der Timer gestartet wurde, wie sie vom Assistenten in seiner Schrittliste veröffentlicht wurde.
com.top_logic.layout.view.wizard.AdvanceStepArguments.tooltip = Typisierte Argumente des Befehls <code>"advanceStep"</code>: der Schritt, dessen Zeit abgelaufen ist. <p> Der Schritt wird namentlich genannt und nicht nur angenommen, da der Benutzer möglicherweise selbst weitergeschaltet hat, während der Timer lief: Der Assistent bewegt sich nur, solange der Schritt, zu dem der Timer gehört, noch angezeigt wird. </p>
com.top_logic.layout.view.wizard.DynamicStepsSource = Quelle für dynamische Schritte
com.top_logic.layout.view.wizard.DynamicStepsSource.Config.auto-advance = Automatisch weiter
com.top_logic.layout.view.wizard.DynamicStepsSource.Config.auto-advance.tooltip = TL-Script-Funktion, die angibt, wie lange ein Schritt angezeigt wird, bevor der Assistent automatisch weitergeht: element -&gt; millis. <p> Ein Element, für das die Funktion keinen Wert zurückgibt, ist ein Schritt, den der Benutzer verlässt; ohne diese Funktion ist das bei jedem Schritt der Fall. </p> <p> Die Zeit läuft, solange der Ablauf durch den Schritt führt. Ein Schritt, zu dem der Benutzer zurückgekehrt ist, wartet auf ihn, unabhängig davon, was die Funktion für das entsprechende Element zurückgibt. </p>
com.top_logic.layout.view.wizard.DynamicStepsSource.Config.content = Inhalt
com.top_logic.layout.view.wizard.DynamicStepsSource.Config.content.tooltip = Der Inhalt, der angezeigt wird, während einer dieser Schritte der aktuelle ist, mit dem Element dieses Schritts auf dem Elementkanal.
com.top_logic.layout.view.wizard.DynamicStepsSource.Config.element-channel = Elementkanal
com.top_logic.layout.view.wizard.DynamicStepsSource.Config.element-channel.tooltip = Name des Kanals, über den das Element eines Schritts in die Inhaltsvorlage veröffentlicht wird.
com.top_logic.layout.view.wizard.DynamicStepsSource.Config.icon = Symbol
com.top_logic.layout.view.wizard.DynamicStepsSource.Config.icon.tooltip = TL-Script-Funktion zur Auswahl des neben der Bezeichnung angezeigten Symbols: element -&gt; „css:fa-solid fa-user“. <p> Ohne diese Angabe werden die Schritte ohne Symbol angezeigt. </p>
com.top_logic.layout.view.wizard.DynamicStepsSource.Config.label = Bezeichnung
com.top_logic.layout.view.wizard.DynamicStepsSource.Config.label.tooltip = TL-Script-Funktion zur Benennung eines Schritts in der Schrittanzeige: Element -&gt; Text. <p> Ohne diese Angabe wird das Element so benannt, wie es auch an allen anderen Stellen in der Anwendung benannt ist. </p>
com.top_logic.layout.view.wizard.DynamicStepsSource.Config.steps = Schritte
com.top_logic.layout.view.wizard.DynamicStepsSource.Config.steps.tooltip = Verweis auf den Kanal, der die Elemente enthält, je ein Schritt pro Element, in der Reihenfolge der Liste. <p> Ein Kanal, der nichts enthält, trägt überhaupt keinen Schritt bei; ein Kanal, der ein einzelnes Objekt enthält, das keine Liste ist, trägt einen Schritt bei. </p>
com.top_logic.layout.view.wizard.DynamicStepsSource.tooltip = Ein Schritt eines &lt;wizard&gt; pro Element einer Liste, die ein Kanal enthält. <p> Die Schrittfolge folgt diesem Kanal: Das Anhängen eines Elements fügt einen Schritt hinter den bereits vorhandenen hinzu, das Entfernen eines Elements entfernt dessen Schritt, und der Wizard wird im selben Atemzug wieder erweitert – ein Befehl, der ein Element anhängt und dann weitergeht, landet also auf dem Schritt, den er gerade erstellt hat. </p> <p> Das Element selbst ist der Schlüssel seines Schritts, den der Schrittkanal des Assistenten enthält, solange dieser Schritt angezeigt wird. Der Inhalt ist eine Vorlage, die pro angezeigtem Schritt instanziiert wird, wobei das Element auf dem Elementkanal veröffentlicht wird – typischerweise ein &lt;switch&gt;, der die Anzeige je nach Art des Elements auswählt. </p> <p> Quellen sind kombinierbar, sodass ein Ablauf mit einem ausgeschriebenen &lt;step&gt; beginnen, über so viele Elemente wie der Kanal enthält fortgesetzt werden und mit einem weiteren ausgeschriebenen Schritt enden kann. </p> <p> Beispiel: </p><pre> &lt;wizard current-step="currentStep"&gt; &lt;step id="welcome" label="wizard.welcome"&gt;...&lt;/step&gt; &lt;dynamic-steps steps="questions" label="q -&gt; $q.get(`demo:Question#title`)" &gt; &lt;switch input="element"&gt;...&lt;/switch&gt; &lt;/dynamic-steps&gt; &lt;step id="summary" label="wizard.summary"&gt;...&lt;/step&gt; &lt;/wizard&gt; </pre>
com.top_logic.layout.view.wizard.GotoStepArguments = Zu Schritt '{stepId}' des Assistenten wechseln
com.top_logic.layout.view.wizard.GotoStepArguments.stepId = Schritt-ID
com.top_logic.layout.view.wizard.GotoStepArguments.stepId.tooltip = Die clientseitige Kennung des anzuzeigenden Schritts, wie sie vom Assistenten in seiner Schrittliste veröffentlicht wurde.
com.top_logic.layout.view.wizard.GotoStepArguments.tooltip = Typisierte Argumente des Befehls <code>"gotoStep"</code>: Welcher Schritt soll angezeigt werden? <p> Die <i>Bezeichnung</i> dient gleichzeitig als Vorlage <i>für die Berechnung der Konfigurationsbezeichnungen</i>, die einen aufgezeichneten Schritt für Menschen darstellen. </p>
com.top_logic.layout.view.wizard.StaticStepSource = Schritt
com.top_logic.layout.view.wizard.StaticStepSource.Config.auto-advance = Automatisch weiter
com.top_logic.layout.view.wizard.StaticStepSource.Config.auto-advance.tooltip = Wie lange dieser Schritt angezeigt wird, bevor der Assistent automatisch weitergeht, angegeben als Dauer (2 s, 500 ms). <p> Bei einem Interstitial schaut der Nutzer nur zu. Leer, wenn der Nutzer den Schritt verlässt. </p> <p> Die Zeit läuft, solange der Ablauf durch den Schritt führt. Ein Schritt, zu dem der Nutzer zurückgekehrt ist, wartet auf ihn; daher wird ein „Zurück“-Klick aus dem Schritt hinter einem Interstitial nicht dadurch beantwortet, dass der Nutzer erneut weitergeleitet wird. </p>
com.top_logic.layout.view.wizard.StaticStepSource.Config.children = Kinder
com.top_logic.layout.view.wizard.StaticStepSource.Config.children.tooltip = Der Inhalt, der angezeigt wird, solange dieser Schritt aktiv ist.
com.top_logic.layout.view.wizard.StaticStepSource.Config.icon = Symbol
com.top_logic.layout.view.wizard.StaticStepSource.Config.icon.tooltip = Das Symbol, das neben der Bezeichnung in der Schrittanzeige angezeigt wird (z. B. „css:fa-solid fa-user“), oder leer, wenn ein Schritt kein Symbol enthält.
com.top_logic.layout.view.wizard.StaticStepSource.Config.id = ID
com.top_logic.layout.view.wizard.StaticStepSource.Config.id.tooltip = Bezeichnet diesen Schritt innerhalb des Assistenten. <p> Der Schrittkanal des Assistenten enthält diesen Wert, solange der Schritt angezeigt wird, und ein Sprung zu diesem Schritt benennt ihn. </p>
com.top_logic.layout.view.wizard.StaticStepSource.Config.label = Bezeichnung
com.top_logic.layout.view.wizard.StaticStepSource.Config.label.tooltip = Name des Schritts in der Schrittanzeige.
com.top_logic.layout.view.wizard.StaticStepSource.tooltip = Ein einzelner Schritt eines &lt;wizard&gt;, der in der Ansicht angezeigt wird. <p> Der Schritt wird durch seine ID identifiziert: Das ist der Wert, den der Schrittkanal des Assistenten enthält, während der Schritt angezeigt wird, und der Wert, den ein &lt;wizard-goto&gt; angibt, um zu diesem Schritt zu springen. </p> <p> Beispiel: </p><pre> &lt;wizard current-step="currentStep"&gt; &lt;step id="contact" label="wizard.contact" icon="css:fa-solid fa-user"&gt; &lt;form input="order"&gt;...&lt;/form&gt; &lt;/step&gt; &lt;step id="summary" label="wizard.summary"&gt;...&lt;/step&gt; &lt;/wizard&gt; </pre>
com.top_logic.layout.view.wizard.WizardBackAction = Assistent-Zurück-Aktion
com.top_logic.layout.view.wizard.WizardBackAction.tooltip = Aktion, die den umgebenden Assistenten zum vorherigen Schritt zurückbringt. <p> Im ersten Schritt passiert nichts. Kombinieren Sie die Aktion mit einer &lt;wizard-has-back&gt;-Regel, um die Schaltfläche in diesem Schritt auszublenden, anstatt eine Schaltfläche anzubieten, die nichts bewirkt. </p> <p> Leitet die Eingabe als Ausgabe weiter, sodass eine nachfolgende Aktion in der Kette weiterhin das Objekt sieht, auf das die Kette angewendet wird – dadurch wird aus „Eingabe verwerfen und einen Schritt zurückgehen“ ein einziger Befehl. </p>
com.top_logic.layout.view.wizard.WizardBackCommand = Assistent-Zurück-Befehl
com.top_logic.layout.view.wizard.WizardBackCommand.tooltip = Befehl, der den umgebenden Assistenten zum vorherigen Schritt verschiebt. <p> Löst den Assistenten aus dem Kontext der Ansicht auf, sodass der Befehl unabhängig von seiner Position innerhalb eines Schritts funktioniert. Schützen Sie ihn mit einer &lt;wizard-has-back&gt;-Regel, damit die Schaltfläche im ersten Schritt ausgeblendet wird. Um als Teil eines längeren Befehls einen Schritt zurückzugehen, verwenden Sie die Aktion mit demselben Tag innerhalb eines &lt;generic-command&gt;. </p>
com.top_logic.layout.view.wizard.WizardElement = Assistent
com.top_logic.layout.view.wizard.WizardElement.Config.counter = Zähler
com.top_logic.layout.view.wizard.WizardElement.Config.counter.tooltip = Ob der Indikator den angezeigten Schritt zur Gesamtzahl der Schritte hinzuzählt.
com.top_logic.layout.view.wizard.WizardElement.Config.current-step = Aktueller Schritt
com.top_logic.layout.view.wizard.WizardElement.Config.current-step.tooltip = Verweis auf den Kanal, der den Schlüssel des angezeigten Schritts enthält. <p> Der Kanal muss in einer übergeordneten Ansicht deklariert sein. Ein Wert, den kein Schritt enthält – einschließlich Null –, zeigt den ersten Schritt an. </p>
com.top_logic.layout.view.wizard.WizardElement.Config.progress = Fortschritt
com.top_logic.layout.view.wizard.WizardElement.Config.progress.tooltip = Ob der Indikator in Form eines Balkens anzeigt, wie weit der angezeigte Schritt im Assistenten bereits fortgeschritten ist.
com.top_logic.layout.view.wizard.WizardElement.Config.step-list = Schrittliste
com.top_logic.layout.view.wizard.WizardElement.Config.step-list.tooltip = Ob der Indikator die Schritte namentlich auflistet und jeden einzelnen als „erledigt“, „aktuell“ oder „noch ausstehend“ kennzeichnet. <p> Ein bereits abgeschlossener Schritt wird als Sprungziel angeboten; ein noch ausstehender Schritt hingegen nicht, da der Weg dorthin über die dazwischenliegenden Schritte führt. </p>
com.top_logic.layout.view.wizard.WizardElement.Config.steps = Schritte
com.top_logic.layout.view.wizard.WizardElement.Config.steps.tooltip = Die Quellen, aus denen die Schritte stammen, in der Reihenfolge, in der der Assistent sie durchläuft.
com.top_logic.layout.view.wizard.WizardElement.tooltip = Ein UIElement, das durch eine Abfolge von Schritten führt und jeweils einen davon anzeigt. <p> Der Schlüssel des angezeigten Schritts befindet sich in dem Kanal, auf <i>Aktueller Schritt</i> verweist, und dieser Kanal ist die einzige Quelle der Wahrheit: Das Durchlaufen des Assistenten erfolgt durch einen Schreibvorgang in diesen Kanal, unabhängig davon, ob der Vorgang von einem &lt;wizard-next&gt;, einem &lt;wizard-back&gt;, einem &lt;wizard-goto&gt; oder vom Schrittindikator ausgeht. Ein Wert, den kein Schritt enthält – einschließlich „null“ –, zeigt den ersten Schritt an, sodass ein Assistent am Anfang beginnt, ohne dass zuvor jemand in den Kanal geschrieben hat. Durch die Bindung des Kanals an die Adresse der Seite über „ <param-bindings> “ wird ein Schritt zu einem Deep-Link. </p> <p> Die Schrittsequenz ist die Verkettung der Beiträge der Quellen des Assistenten; ein &lt;step&gt; trägt genau den einen Schritt bei, als den er geschrieben ist, ein &lt;dynamic-steps&gt; einen pro Element einer Liste, die ein Kanal enthält, und beide vermischen sich in einem Assistenten. Die Sequenz wird jedes Mal neu erweitert, wenn ein Kanal, über den eine Quelle entscheidet, einen neuen Wert annimmt. Der Inhalt des angezeigten Schritts wird beim Erreichen des Schritts aufgebaut und beim Verlassen wieder abgebaut, sodass ein Schritt im umgebenden Geltungsbereich nichts zurücklässt – einschließlich der Schaltfläche „Speichern“ eines Formulars. </p> <p> Der Assistent zeigt die Schrittanzeige und den Inhalt des Schritts an, verfügt jedoch über keine eigenen Navigationsschaltflächen: Was sich durch den Assistenten bewegt, wird in der Ansicht aus den Befehlen oben zusammengesetzt – entweder innerhalb eines Schritts oder durch einen ` <slot-content>` aus diesem herausgerufen. Der Inhalt jedes Schritts sieht einen Bereich des Assistenten, sodass diese Befehle keine Konfiguration benötigen, um den Assistenten zu finden, den sie steuern. </p> <p> Beispiel: </p><pre> &lt;view&gt; &lt;channels&gt;&lt;channel name="currentStep"/&gt;&lt;/channels&gt; &lt;wizard current-step="currentStep" step-list="true"&gt; &lt;step id="contact" label="wizard.contact"&gt;...&lt;/step&gt; &lt;step id="payment" label="wizard.payment"&gt;...&lt;/step&gt; &lt;step id="summary" label="wizard.summary"&gt;...&lt;/step&gt; &lt;/wizard&gt; &lt;/view&gt; </pre>
com.top_logic.layout.view.wizard.WizardGotoAction = Assistent-Sprung-Aktion
com.top_logic.layout.view.wizard.WizardGotoAction.Config.step = Schritt
com.top_logic.layout.view.wizard.WizardGotoAction.Config.step.tooltip = Die ID des anzuzeigenden Schritts. <p> Fehlt diese, dient der Wert der Kette als Name des Schritts; auf diese Weise wird zu einem zuvor berechneten Schritt gesprungen. </p>
com.top_logic.layout.view.wizard.WizardGotoAction.tooltip = Aktion, die einen benannten Schritt des übergeordneten Assistenten anzeigt. <p> Der Schritt ist derjenige, <i>Schritt</i> aufgeführt ist, oder – falls in der Konfiguration kein Name angegeben ist – der Wert, den die Kette enthält, sodass einem von einer früheren Aktion berechneten Sprungziel gefolgt wird. Ein Schlüssel, den kein Schritt des Assistenten enthält, belässt den Assistenten an seiner aktuellen Position. </p> <p> Leitet die Eingabe als Ausgabe weiter, sodass eine nachfolgende Aktion in der Kette weiterhin das Objekt sieht, auf das die Kette wirkt. </p>
com.top_logic.layout.view.wizard.WizardGotoCommand = Assistent-Sprung-Befehl
com.top_logic.layout.view.wizard.WizardGotoCommand.Config.step = Schritt
com.top_logic.layout.view.wizard.WizardGotoCommand.Config.step.tooltip = Die ID des anzuzeigenden Schritts. <p> Wird keine angegeben, wird der Schritt anhand des Eingabewerts des Befehls benannt. </p>
com.top_logic.layout.view.wizard.WizardGotoCommand.tooltip = Befehl, der einen benannten Schritt des übergeordneten Assistenten anzeigt. <p> Löst den Assistenten aus dem Kontext der Ansicht auf, sodass der Befehl unabhängig davon funktioniert, an welcher Stelle innerhalb eines Schritts er sich befindet. Der Schritt ist derjenige, <i>Schritt</i>, oder – falls in der Konfiguration kein Name angegeben ist – der Eingabewert des Befehls. Um als einen Schritt eines längeren Befehls zu springen, verwenden Sie die Aktion mit demselben Tag innerhalb eines &lt;generic-command&gt;. </p>
com.top_logic.layout.view.wizard.WizardHasBack = Assistent hat vorherigen Schritt
com.top_logic.layout.view.wizard.WizardHasBack.tooltip = Ausführbarkeitsregel, die einen Befehl nur dann anzeigt, wenn ein Schritt demjenigen vorausgeht, den der übergeordnete Assistent anzeigt. <p> Schützt den Befehl zum Zurückgehen, sodass er bei jedem Schritt außer dem ersten angeboten wird, bei dem ein Zurückgehen keine Wirkung hätte. Außerhalb eines Assistenten bleibt der Befehl ausgeblendet. </p>
com.top_logic.layout.view.wizard.WizardHasNext = Assistent hat nächsten Schritt
com.top_logic.layout.view.wizard.WizardHasNext.tooltip = Ausführbarkeitsregel, die einen Befehl nur dann anzeigt, wenn auf den Schritt, den der übergeordnete Assistent anzeigt, ein weiterer Schritt folgt. <p> Schützt den Befehl zum Weitergehen, sodass er bei jedem Schritt außer dem letzten angeboten wird, bei dem ein Weitergehen keine Wirkung hätte. Außerhalb eines Assistenten bleibt der Befehl ausgeblendet. </p>
com.top_logic.layout.view.wizard.WizardNextAction = Assistent-Weiter-Aktion
com.top_logic.layout.view.wizard.WizardNextAction.tooltip = Aktion, die den übergeordneten Assistenten zum nächsten Schritt weiterleitet. <p> Im letzten Schritt geschieht nichts. Kombinieren Sie die Aktion mit einer &lt;wizard-has-next&gt;-Regel, um die Schaltfläche in diesem Schritt auszublenden, anstatt eine Schaltfläche anzubieten, die nichts bewirkt. </p> <p> Leitet die Eingabe als Ausgabe weiter, sodass eine nachfolgende Aktion in der Kette weiterhin das Objekt sieht, auf das die Kette angewendet wird – wodurch „die Eingabe speichern und dann fortfahren“ zu einem einzigen Befehl wird. </p>
com.top_logic.layout.view.wizard.WizardNextCommand = Assistent-Weiter-Befehl
com.top_logic.layout.view.wizard.WizardNextCommand.tooltip = Befehl, der den übergeordneten Assistenten zum nächsten Schritt weiterleitet. <p> Löst den Assistenten aus dem Kontext der Ansicht auf, sodass der Befehl unabhängig von seiner Position innerhalb eines Schritts funktioniert. Schützen Sie ihn mit einer &lt;wizard-has-next&gt;-Regel, damit die Schaltfläche im letzten Schritt verschwindet. Um als Teil eines längeren Befehls fortzufahren, verwenden Sie die Aktion mit demselben Tag innerhalb eines &lt;generic-command&gt;. </p>
