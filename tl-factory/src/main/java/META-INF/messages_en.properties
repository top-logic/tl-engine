com.top_logic.factory.project.FactoryFunctions.start.tooltip = Starts the workspace of a project and with it its application.
com.top_logic.factory.project.FactoryFunctions.startBuild = Start a CI build
com.top_logic.factory.project.FactoryFunctions.startBuild.param.project.tooltip = A project with repository and CI job.
com.top_logic.factory.project.FactoryFunctions.startBuild.return = The message telling which build was started.
com.top_logic.factory.project.FactoryFunctions.startBuild.tooltip = Starts a build of the application of a project on the CI server. The CI job of the project is created again if it no longer exists on the CI server, and set to build the repository of the project.
com.top_logic.factory.project.FactoryFunctions.stop = Stop the workspace of a project
com.top_logic.factory.project.FactoryFunctions.stop.param.project.tooltip = A project whose workspace is running.
com.top_logic.factory.project.FactoryFunctions.stop.tooltip = Stops the workspace of a project and with it its application. The sources, the Maven repository and the database of the workspace are kept.
com.top_logic.factory.project.FactoryFunctions.update = Update the workspace of a project
com.top_logic.factory.project.FactoryFunctions.update.param.project.tooltip = A project whose workspace is not busy.
com.top_logic.factory.project.FactoryFunctions.update.tooltip = Creates the container of the workspace of a project anew on the current workspace image. The sources, the Maven repository, the database and the initial password of the workspace are kept; a running workspace is started again.
com.top_logic.factory.project.FactoryFunctions.updateGitConnection = Change a git connection
com.top_logic.factory.project.FactoryFunctions.updateGitConnection.param.connection.tooltip = The connection of a tenant.
com.top_logic.factory.project.FactoryFunctions.updateGitConnection.param.name.tooltip = The display name.
com.top_logic.factory.project.FactoryFunctions.updateGitConnection.param.owner.tooltip = The organization or user the repositories live in.
com.top_logic.factory.project.FactoryFunctions.updateGitConnection.param.providerType.tooltip = The type of the git hosting service.
com.top_logic.factory.project.FactoryFunctions.updateGitConnection.param.url.tooltip = The URL of the server.
com.top_logic.factory.project.FactoryFunctions.updateGitConnection.tooltip = Changes a git connection of a tenant. Only a user who may change the tenant may do so; type, URL and owner stay as they are while projects live on the connection.
com.top_logic.factory.project.ProjectWorkspaces = Project workspaces
com.top_logic.factory.project.ProjectWorkspaces.Config.application-check-interval = Application check interval
com.top_logic.factory.project.ProjectWorkspaces.Config.application-check-interval.tooltip = Milliseconds between two checks of the applications of the workspaces whose container runs, 0 for no checks. <p> The application of a running container may stop or start without an operation of the control application, e.g. when the agent of the workspace restarts it. The check stores <i>app stopped</i> for a <i>running</i> workspace whose application stopped or failed, and <i>running</i> for an <i>app stopped</i> one whose application answers again. </p>
com.top_logic.factory.project.ProjectWorkspaces.Config.log-flush-interval = Log flush interval
com.top_logic.factory.project.ProjectWorkspaces.Config.log-flush-interval.tooltip = Milliseconds between two commits of the output of a running operation.
com.top_logic.factory.project.ProjectWorkspaces.Config.max-log-size = Maximum log size
com.top_logic.factory.project.ProjectWorkspaces.Config.max-log-size.tooltip = Number of characters of the output of an operation that are stored; older output is dropped.
com.top_logic.factory.project.ProjectWorkspaces.tooltip = Service running the operations on the workspaces of projects in the background and keeping the workspace objects up to date with them. <p> Creating, starting, stopping and removing a workspace takes from seconds to minutes. An operation is therefore started from a request, which only stores the state the operation is in (e.g. <i>Building</i>), and runs on a worker thread of this service in a system context. The output of the operation is collected in a <i>workspace log</i>, which stores it every flush interval in a transaction of its own; the final state is stored when the operation ends. A view following these commits displays the progress while the operation runs. </p> <p> Only one operation runs on a workspace at a time. After a restart, the service compares the stored states with the containers that exist, see <i>workspace reconciliation</i>. It does that on a worker thread as well, so that the application starts also when the container platform is not reachable. </p>
com.top_logic.factory.project.WorkspaceLogSource = Workspace log source
com.top_logic.factory.project.WorkspaceLogSource.Config.tail-lines = Tail lines
com.top_logic.factory.project.WorkspaceLogSource.Config.tail-lines.tooltip = The number of the last lines of the log that are published.
com.top_logic.factory.project.WorkspaceLogSource.Config.workspace = Workspace
com.top_logic.factory.project.WorkspaceLogSource.Config.workspace.tooltip = The channel of the view holding the tl.factory:Workspace whose log is published.
com.top_logic.factory.project.WorkspaceLogSource.tooltip = <i>Channel source</i> publishing the log of the application of a workspace while it is written: the last lines of the output of the main process of the workspace on the configured channel, as one text. <pre> &lt;source-channel name="appLog" update-interval="1000"&gt; &lt;source class="com.top_logic.factory.project.WorkspaceLogSource" workspace="workspace" tail-lines="500"/&gt; &lt;/source-channel&gt; </pre> <p> Each displayed view follows the log of the workspace its channel holds, and follows another one when the channel changes. A restart of the workspace ends the output of its main process; the next commit changing the workspace - its state - starts following the new output. The delivery ends when the view is no longer displayed. </p>
com.top_logic.factory.project.WorkspaceStatus = Workspace status
com.top_logic.factory.project.WorkspaceStatus.APP_STOPPED = App stopped
com.top_logic.factory.project.WorkspaceStatus.APP_STOPPED.tooltip = The container runs, its application does not: it was stopped, or it failed to start. <p> The agent of the workspace can work in this state, e.g. to repair the application. </p>
com.top_logic.factory.project.WorkspaceStatus.BUILDING = Building
com.top_logic.factory.project.WorkspaceStatus.BUILDING.tooltip = The container is being created and the application is being generated and built.
com.top_logic.factory.project.WorkspaceStatus.CREATED = Created
com.top_logic.factory.project.WorkspaceStatus.CREATED.tooltip = The container exists but has never been started.
com.top_logic.factory.project.WorkspaceStatus.ERROR = Error
com.top_logic.factory.project.WorkspaceStatus.ERROR.tooltip = The last operation failed, or the container got lost; the log tells why.
com.top_logic.factory.project.WorkspaceStatus.REMOVING = Removing
com.top_logic.factory.project.WorkspaceStatus.REMOVING.tooltip = The container and the volumes are being removed.
com.top_logic.factory.project.WorkspaceStatus.RUNNING = Running
com.top_logic.factory.project.WorkspaceStatus.RUNNING.tooltip = The application runs and answers at the preview URL.
com.top_logic.factory.project.WorkspaceStatus.STARTING = Starting
com.top_logic.factory.project.WorkspaceStatus.STARTING.tooltip = The application is starting; the state changes to <i>running</i> as soon as it answers.
com.top_logic.factory.project.WorkspaceStatus.STOPPED = Stopped
com.top_logic.factory.project.WorkspaceStatus.STOPPED.tooltip = The container is stopped, its volumes are kept.
com.top_logic.factory.project.WorkspaceStatus.STOPPING = Stopping
com.top_logic.factory.project.WorkspaceStatus.STOPPING.tooltip = The container is being stopped.
com.top_logic.factory.project.WorkspaceStatus.UNKNOWN = Unknown
com.top_logic.factory.project.WorkspaceStatus.UNKNOWN.tooltip = The container platform did not tell the state, e.g. because it was not reachable.
com.top_logic.factory.project.WorkspaceStatus.UPDATING = Updating
com.top_logic.factory.project.WorkspaceStatus.UPDATING.tooltip = The container is being created anew on the current workspace image, keeping the volumes.
com.top_logic.factory.project.WorkspaceStatus.tooltip = The stored state of the workspace of a project, the Java counterpart of the classifiers of the enumeration <code>"WorkspaceStatus"</code>. <p> Besides the states of the container a <i>workspace provider</i> reports (see <i>workspace state</i>), a workspace is in a busy state while an operation runs on it, and in state <i>error</i> after an operation failed. </p>
com.top_logic.factory.proxy.ProxyAdmission$Status = Status
com.top_logic.factory.proxy.ProxyAdmission$Status.tooltip = Whether a request is passed to its route, and why not.
com.top_logic.factory.proxy.ProxyAdmission.Status.ADMITTED = Admitted
com.top_logic.factory.proxy.ProxyAdmission.Status.ADMITTED.tooltip = The token is valid; the request is passed to its route.
com.top_logic.factory.proxy.ProxyAdmission.Status.FOREIGN_SOURCE = Foreign source
com.top_logic.factory.proxy.ProxyAdmission.Status.FOREIGN_SOURCE.tooltip = The token is valid but was first used from another address.
com.top_logic.factory.proxy.ProxyAdmission.Status.INVALID_TOKEN = Invalid token
com.top_logic.factory.proxy.ProxyAdmission.Status.INVALID_TOKEN.tooltip = The token is missing, unknown, revoked or expired, or its workspace no longer exists.
com.top_logic.factory.proxy.ProxyAdmission.Status.RATE_LIMITED = Rate limited
com.top_logic.factory.proxy.ProxyAdmission.Status.RATE_LIMITED.tooltip = The token is valid but has made too many requests in the last minute.
com.top_logic.factory.proxy.ProxyError = Proxy error
com.top_logic.factory.proxy.ProxyError.FOREIGN_SOURCE = Foreign source
com.top_logic.factory.proxy.ProxyError.FOREIGN_SOURCE.tooltip = The token of the request is bound to another address.
com.top_logic.factory.proxy.ProxyError.INVALID_TOKEN = Invalid token
com.top_logic.factory.proxy.ProxyError.INVALID_TOKEN.tooltip = The request carries no valid token.
com.top_logic.factory.proxy.ProxyError.NOT_FOUND = Not found
com.top_logic.factory.proxy.ProxyError.NOT_FOUND.tooltip = The request reaches no route, or the proxy is switched off.
com.top_logic.factory.proxy.ProxyError.RATE_LIMITED = Rate limited
com.top_logic.factory.proxy.ProxyError.RATE_LIMITED.tooltip = The token of the request is over its rate limit.
com.top_logic.factory.proxy.ProxyError.SOURCE_NOT_ALLOWED = Source not allowed
com.top_logic.factory.proxy.ProxyError.SOURCE_NOT_ALLOWED.tooltip = The request comes from an address the proxy does not accept.
com.top_logic.factory.proxy.ProxyError.tooltip = Why the <i>workspace proxy handler</i> refuses a request before its route handles it. <p> The route answers it in the format of its protocol. The message is a fixed text, never something of the request. </p>
com.top_logic.factory.proxy.ProxyRoute.Config.path = Path
com.top_logic.factory.proxy.ProxyRoute.Config.path.tooltip = The path of the route below the root of the proxy: starts with a slash, has none at its end, e.g. /llm-proxy.
com.top_logic.factory.proxy.WorkspaceProxyService = Workspace proxy service
com.top_logic.factory.proxy.WorkspaceProxyService.Config.allowed-sources = Allowed sources
com.top_logic.factory.proxy.WorkspaceProxyService.Config.allowed-sources.tooltip = The client addresses requests are accepted from: ranges in CIDR notation (IPv4 or IPv6), single addresses, or <code>"workspace-network"</code> for the network of the workspace containers. <p> Empty accepts every address. The address is the one of the connection, never a header of the request: behind a reverse proxy or a gateway it is the address of that proxy. </p>
com.top_logic.factory.proxy.WorkspaceProxyService.Config.listen-address = Listen address
com.top_logic.factory.proxy.WorkspaceProxyService.Config.listen-address.tooltip = The address the proxy listens on with a port of its own, see <i>Listen port</i>. <p> The default, the loopback address, serves a reverse proxy or a tunnel on the same host only. With the control application on the host of the Docker daemon, it is the address host-gateway stands for in the workspaces - the gateway of Docker's default bridge, e.g. 172.17.0.1 -, so that workspaces reach it but no other host does. In a container of its own, the control application listens on 0.0.0.0 and the port is not published, or published on an internal address only. </p>
com.top_logic.factory.proxy.WorkspaceProxyService.Config.listen-port = Listen port
com.top_logic.factory.proxy.WorkspaceProxyService.Config.listen-port.tooltip = The port the proxy listens on, apart from the port of the control application; 0 for no port of its own. <p> The routes are reached there at their paths. The port is opened only if the proxy is switched on by its URL. </p>
com.top_logic.factory.proxy.WorkspaceProxyService.Config.max-token-lifetime = Maximum token lifetime
com.top_logic.factory.proxy.WorkspaceProxyService.Config.max-token-lifetime.tooltip = The longest lifetime of a token in milliseconds, e.g. 4h; a longer one asked for is cut to it.
com.top_logic.factory.proxy.WorkspaceProxyService.Config.proxy-url = Proxy URL
com.top_logic.factory.proxy.WorkspaceProxyService.Config.proxy-url.tooltip = The URL of the root of the proxy as the workspace containers reach it, without the path of a route: the port of its own, e.g. http://host.docker.internal:8091, or the web application with the <i>workspace proxy servlet</i>, e.g. http://host.docker.internal:8080/tl-factory-app. <p> A route is reached at this URL followed by its path. Empty switches the proxy off. </p>
com.top_logic.factory.proxy.WorkspaceProxyService.Config.rate-limit = Rate limit
com.top_logic.factory.proxy.WorkspaceProxyService.Config.rate-limit.tooltip = The requests per minute a token may make, with bursts up to this number; 0 for no limit. <p> A request beyond is answered with 429 and the seconds to wait in Retry-After, which Claude Code waits for before it repeats the request. The default leaves an agent working at full speed - a request per step and a few side requests - room, and limits a token that got out of the workspace. </p>
com.top_logic.factory.proxy.WorkspaceProxyService.Config.routes = Routes
com.top_logic.factory.proxy.WorkspaceProxyService.Config.routes.tooltip = The services the proxy gives the workspaces access to, each below a path of its own.
com.top_logic.factory.proxy.WorkspaceProxyService.Config.servlet-enabled = Servlet enabled
com.top_logic.factory.proxy.WorkspaceProxyService.Config.servlet-enabled.tooltip = Whether the proxy also answers in the web application, through the port of the control application, at the paths the <i>workspace proxy servlet</i> is mapped to. <p> Off by default: the port of the control application is the one its users reach, and the proxy needs not be reachable there. Switched on, a reverse proxy in front of the control application must keep clients from outside from reaching these paths. </p>
com.top_logic.factory.proxy.WorkspaceProxyService.tooltip = Access of the workspaces to services of the control application's environment without a credential in the workspace. <p> A workspace container gets no credential and no token in its environment, only what its routes need to find the proxy, e.g. the URL of the LLM route - the URL of the proxy followed by the path of the route. A process that may use the proxy - an agent run - gets a token of its own, issued for its workspace and passed only to that process, in the environment of its command, with the git configuration the routes contribute. The proxy accepts a request from an accepted address whose token admits it and passes it to the route of its path, which adds the credentials of its upstream and forwards it, see <i>workspace proxy handler</i>. </p> <p> A token is <code>"tlwst_"</code> followed by a random secret of about 256 bits. It is valid for all routes until it is revoked - when its run ends -, until its lifetime ends (at most <i>Maximum token lifetime</i>), or until its workspace is removed. It is bound to the address of its first request and limited to <i>Rate limit</i> requests per minute, see <i>token grants</i>. Tokens are kept in memory only, as their hashes; a restart of the control application invalidates all of them, together with the runs it started. </p> <p> The proxy is switched on by its URL: without one, workspaces get no URL, no token is issued, and the proxy answers every request with 404. It listens on a port of its own (<i>workspace proxy listener</i>, <i>Listen address</i>, <i>Listen port</i>); the <i>workspace proxy servlet</i> in the web application answers only if <i>Servlet enabled</i> is set. </p>
com.top_logic.factory.server.ServerProviderConfig.base-url = Base URL
com.top_logic.factory.server.ServerProviderConfig.base-url.tooltip = The URL of the server; empty switches the provider off.
com.top_logic.factory.tenant.TenantRole = Tenant role
com.top_logic.factory.tenant.TenantRole.ADMINISTRATOR = Administrator
com.top_logic.factory.tenant.TenantRole.ADMINISTRATOR.tooltip = Manages the members of the tenant and works on its projects.
com.top_logic.factory.tenant.TenantRole.DEVELOPER = Developer
com.top_logic.factory.tenant.TenantRole.DEVELOPER.tooltip = Works on the projects of the tenant.
com.top_logic.factory.tenant.TenantRole.READER = Reader
com.top_logic.factory.tenant.TenantRole.READER.tooltip = Reads the projects of the tenant.
com.top_logic.factory.tenant.TenantRole.tooltip = The role of a member in a tenant: the reference of the tenant holding the member. <p> Mirrors the enumeration <code>"TenantRole"</code> of the model module <code>"tl.factory"</code>; the name of a constant is the name of its classifier. </p>
com.top_logic.factory.workspace.WorkspaceService = Workspace service
com.top_logic.factory.workspace.WorkspaceService.Config.applications = Applications
com.top_logic.factory.workspace.WorkspaceService.Config.applications.tooltip = How workspaces holding a TopLogic application are set up.
com.top_logic.factory.workspace.WorkspaceService.Config.provider = Provider
com.top_logic.factory.workspace.WorkspaceService.Config.provider.tooltip = The container platform the workspaces are created in.
com.top_logic.factory.workspace.WorkspaceService.tooltip = Service holding the <i>workspace provider</i> that manages the workspaces of the application. <p> Starting the service does not contact the container platform, so the application starts also when the platform is not reachable; the first workspace operation reports that. </p>
com.top_logic.factory.workspace.WorkspaceState = Workspace state
com.top_logic.factory.workspace.WorkspaceState.CREATED = Created
com.top_logic.factory.workspace.WorkspaceState.CREATED.tooltip = The container exists but has never been started.
com.top_logic.factory.workspace.WorkspaceState.MISSING = Missing
com.top_logic.factory.workspace.WorkspaceState.MISSING.tooltip = The workspace has no container. Volumes of the workspace may still exist.
com.top_logic.factory.workspace.WorkspaceState.RUNNING = Running
com.top_logic.factory.workspace.WorkspaceState.RUNNING.tooltip = The container is running.
com.top_logic.factory.workspace.WorkspaceState.STOPPED = Stopped
com.top_logic.factory.workspace.WorkspaceState.STOPPED.tooltip = The container has been started before and is not running now. Its volumes are kept.
com.top_logic.factory.workspace.WorkspaceState.UNKNOWN = Unknown
com.top_logic.factory.workspace.WorkspaceState.UNKNOWN.tooltip = The container is in a state the provider does not manage, e.g. paused, being removed or dead.
com.top_logic.factory.workspace.WorkspaceState.tooltip = The state of the container of a workspace, as reported by a <i>workspace provider</i>.
com.top_logic.factory.workspace.app.ApplicationWorkspaces$ApplicationState = Application state
com.top_logic.factory.workspace.app.ApplicationWorkspaces$ApplicationState.tooltip = The state of the application in a running workspace, as the <code>"tl-workspace-app"</code> reports it.
com.top_logic.factory.workspace.app.ApplicationWorkspaces$Config = Configuration
com.top_logic.factory.workspace.app.ApplicationWorkspaces$Config.tooltip = Configuration of <i>application workspaces</i>.
com.top_logic.factory.workspace.app.ApplicationWorkspaces.ApplicationState.CHANGING = Changing
com.top_logic.factory.workspace.app.ApplicationWorkspaces.ApplicationState.CHANGING.tooltip = The application is starting or stopping.
com.top_logic.factory.workspace.app.ApplicationWorkspaces.ApplicationState.FAILED = Failed
com.top_logic.factory.workspace.app.ApplicationWorkspaces.ApplicationState.FAILED.tooltip = The application ended by itself or its initialization failed.
com.top_logic.factory.workspace.app.ApplicationWorkspaces.ApplicationState.RUNNING = Running
com.top_logic.factory.workspace.app.ApplicationWorkspaces.ApplicationState.RUNNING.tooltip = The application answers.
com.top_logic.factory.workspace.app.ApplicationWorkspaces.ApplicationState.STOPPED = Stopped
com.top_logic.factory.workspace.app.ApplicationWorkspaces.ApplicationState.STOPPED.tooltip = The application is stopped on request, or not built yet.
com.top_logic.factory.workspace.app.ApplicationWorkspaces.ApplicationState.UNKNOWN = Unknown
com.top_logic.factory.workspace.app.ApplicationWorkspaces.ApplicationState.UNKNOWN.tooltip = The workspace does not tell.
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.build-timeout = Build timeout
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.build-timeout.tooltip = Seconds a Maven run may take: generating an application, building it, filling a release repository. <p> A run that takes longer is terminated and fails the operation. </p>
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.engine-version = Engine version
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.engine-version.tooltip = The TopLogic version an application is built on that does not choose one.
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.image-repository = Image repository
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.image-repository.tooltip = Name of the workspace image without tag. <p> The tag is the content hash of the files the image is built from. </p>
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.repository-url = Repository URL
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.repository-url.tooltip = URL of the Maven repository the TopLogic releases are taken from.
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.start-timeout = Start timeout
com.top_logic.factory.workspace.app.ApplicationWorkspaces.Config.start-timeout.tooltip = Seconds to wait for a started application to answer.
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider = Docker workspace provider
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.connect-timeout = Connect timeout
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.connect-timeout.tooltip = Timeout in seconds for establishing a connection to the daemon.
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.cpu-limit = CPU limit
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.cpu-limit.tooltip = The number of CPUs a workspace container may use, e.g. 4 or 1.5; 0 for no limit. <p> A limit above the CPUs of the daemon host is cut to them. Under a rootless daemon, the limit needs the CPU controller delegated to the user of the daemon, see the article factory/docker-server. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.docker-host = Docker host
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.docker-host.tooltip = The URI of the Docker daemon. <p> Either the socket of a local daemon, e.g. unix:///var/run/docker.sock, or the address of a remote daemon or a socket proxy, e.g. tcp://docker-proxy:2375. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.extra-hosts = Extra hosts
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.extra-hosts.tooltip = Entries added to the host names a workspace container resolves, each a host name and an address separated by a colon. <p> The address host-gateway stands for the address of the daemon host as the containers see it: host.docker.internal:host-gateway lets a workspace reach a service on the daemon host, e.g. an application that runs there directly, under the name host.docker.internal. The entries apply to containers created afterwards. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.host-ip = Host IP
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.host-ip.tooltip = The address of the daemon host the port of a workspace is published on. <p> The default, the loopback address, makes the applications of the workspaces reachable from the daemon host only. A server publishing them to the browsers of its users names the address of the interface they are to be reached on, e.g. the one a reverse proxy forwards to; empty publishes them on all addresses of the host. A rootful Docker daemon publishes ports past the firewall rules of the host (UFW), so the address is the restriction that holds. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.host-port-max = Host port maximum
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.host-port-max.tooltip = The highest port of the daemon host a workspace port is published on.
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.host-port-min = Host port minimum
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.host-port-min.tooltip = The lowest port of the daemon host a workspace port is published on.
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.isolate-workspaces = Isolate workspaces
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.isolate-workspaces.tooltip = Whether the workspace containers are kept from reaching each other on the network. <p> The network is created with <code>"com.docker.network.bridge.enable_icc"</code> switched off: a container reaches the daemon host - its gateway - and, through it, the outside, but not the ports of another container on the network. The option is set when the network is created; an existing network with another setting is not changed, the provider logs a warning, and the network has to be removed to be created anew. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.label-namespace = Label namespace
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.label-namespace.tooltip = Prefix of the keys of the labels by which the provider recognizes its objects. <p> Two applications that use the same daemon must use different namespaces, otherwise each one regards the workspaces of the other as its own. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.memory-limit = Memory limit
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.memory-limit.tooltip = The memory a workspace container may use, e.g. 8g; 0 for no limit. <p> The default of 8g holds the Java processes of a workspace - the application, a Maven build and the tl-mcp server of the agent, each taking a quarter of the limit as its default heap - beside Claude Code and the headless Chromium of the browser checks. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.name-prefix = Name prefix
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.name-prefix.tooltip = Prefix of the names of the containers and volumes the provider creates. <p> The name of a container is the prefix followed by the workspace identifier, the name of a volume additionally followed by the volume name. Names only have to be unique, the provider never recognizes an object by its name. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.network = Network
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.network.tooltip = Name of the Docker network the workspace containers join. <p> If the network does not exist, it is created. An application that itself runs in a container of the same daemon must be connected to this network to reach the workspaces by container name. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.pids-limit = PIDs limit
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.pids-limit.tooltip = The number of processes and threads a workspace container may run at once; 0 for no limit. <p> The limit stops a fork bomb; the default leaves room for the threads of several Java processes and the browser. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.public-host = Public host
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.public-host.tooltip = Host name of the daemon host under which a browser reaches the published ports. <p> The preview URL of a workspace is built from this name and the host port. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.stop-timeout = Stop timeout
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.stop-timeout.tooltip = Seconds a container gets to shut down when it is stopped, before it is killed.
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.terminate-timeout = Terminate timeout
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.terminate-timeout.tooltip = Seconds a command run in a workspace gets to finish when it is terminated, before it is killed.
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.tls-cert-path = TLS certificate directory
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.Config.tls-cert-path.tooltip = Directory with the client certificate (cert.pem, key.pem) and the CA certificate (ca.pem) for a TLS connection to a tcp:// daemon. <p> If not set, the connection is not encrypted. </p>
com.top_logic.factory.workspace.docker.DockerWorkspaceProvider.tooltip = <i>Workspace provider</i> running each workspace in a container of a Docker daemon, accessed through the Docker Engine API. <p> The daemon is addressed by <i>Docker host</i>, so the application may run on the daemon host itself, in a container of that daemon (with access to its socket or to a socket proxy) or anywhere else (with a remote daemon). Because of that, the provider only ever creates named volumes and never bind-mounts a path: a host path would be resolved on the daemon host, not where the application runs. </p> <p> Everything the provider creates carries labels in the label namespace: containers and volumes the label <code>"workspace"</code> with the workspace identifier, shared volumes the label <code>"shared"</code> with their logical name, built images the label <code>"image"</code> with their repository, the network the label <code>"network"</code>. The provider finds its objects by these labels only, never by name. </p> <p> All workspace containers join the network <i>Network</i>, which is created if it does not exist. The container port of a workspace is published on a port of the range from <i>Host port minimum</i> to <i>Host port maximum</i>, which the daemon chooses anew on every start among the ports of the range that are free at that time. </p> <p> The network is created with <code>"com.docker.network.bridge.enable_icc"</code> switched off if <i>Isolate workspaces</i> is set, so that a workspace container cannot reach another one on it. The host port is bound to <i>host IP</i> only, by default the loopback address of the daemon host. </p> <p> Every workspace container is limited in memory, CPUs and processes, runs without any capability (<i>all</i> dropped) and with <code>"no-new-privileges"</code>: no process in it gains rights, not even one of the root user or a setuid program. The provider runs no command as root itself; a command is terminated by its own user. </p> <p> The extra hosts are added to the host names a workspace container resolves, e.g. to reach the application on the daemon host through the gateway of the daemon. </p> <p> A command run in a workspace needs a sh with kill in the image: the command is run under a shell script reporting its process ID, and terminating it sends signals to its process group by kill. </p>
