com.top_logic.layout.configedit.ConfigControlService.Config.formats = Formate
com.top_logic.layout.configedit.ConfigControlService.Config.formats.tooltip = Zuordnungen von Wertanbieter zu Kontroll-Anbieter, indiziert nach der Klasse des Wertanbieters der Eigenschaft. <p> Getrennt von <i>Anbieter</i>: Zwei Eigenschaften desselben Java-Typs (etwa Date) können verschiedene Wertanbieter tragen — ein reines Datum und eine Tageszeit sind beide ein Date —, so dass nur die Klasse des Wertanbieters sie unterscheiden kann, nicht der Java-Typ. Gesucht wird zuerst nach der konkreten Klasse des Wertanbieters, danach entlang seiner Oberklassen; eine für eine Basisklasse eingetragene Zuordnung gilt damit auch für deren Spezialisierungen. </p>
com.top_logic.layout.configedit.ConfigControlService.Config.providers = Anbieter
com.top_logic.layout.configedit.ConfigControlService.Config.providers.tooltip = Zuordnungen von Werttyp zu Anbieter, indiziert nach dem Java-Typ des Eigenschaftswerts.
com.top_logic.layout.configedit.ConfigControlService.FormatMapping.impl = Implementierung
com.top_logic.layout.configedit.ConfigControlService.FormatMapping.impl.tooltip = Der Kontroll-Anbieter, der für eine von dieser Zuordnung beanspruchte Eigenschaft verwendet wird.
com.top_logic.layout.configedit.ConfigControlService.FormatMapping.provider = Wertanbieter
com.top_logic.layout.configedit.ConfigControlService.FormatMapping.provider.tooltip = Die Klasse des <i>Konfigurations-Wertanbieters</i> (oder eine ihrer Oberklassen), von der der Wertanbieter einer Eigenschaft eine Instanz sein muss, damit diese Zuordnung greift.
com.top_logic.layout.configedit.ConfigControlService.ProviderMapping.impl = Implementierung
com.top_logic.layout.configedit.ConfigControlService.ProviderMapping.impl.tooltip = Der Kontroll-Anbieter, der für Eigenschaften dieses Werttyps verwendet wird.
com.top_logic.layout.configedit.ConfigControlService.ProviderMapping.type = Typ
com.top_logic.layout.configedit.ConfigControlService.ProviderMapping.type.tooltip = Der Java-Typ des Eigenschaftswerts, für den diese Zuordnung gilt.
com.top_logic.layout.configedit.ConfigControlService.tooltip = Dienst, der die Eingabekontrolle für eine Konfigurationseigenschaft auflöst. <p> Löst eine Eigenschaft auf, deren Wert sich in eine einzige Kontrolle einbringen lässt: direkt nach ihrem Java-Typ, durch Auswahl aus einer festen Optionsmenge, oder als Text über einen Wertanbieter, der den Wert in Text umwandeln kann und zurück. createModel und createControl weisen jede Eigenschaft zurück, auf die nichts davon zutrifft - welche Eigenschaftsarten das genau ausschließt und warum, steht in der eigenen Dokumentation von checkSupportedKind. Eine solche Eigenschaft (eine Struktur, eine Sammlung, oder eine komplexe Eigenschaft mit nur einer Wertbindung und ohne Format) wird durch einen eigenen verschachtelten Editor oder Typauswähler dargestellt, bevor dieser Dienst überhaupt gefragt wird. </p> <p> createModel entscheidet über den Wertbereich: Eine Eigenschaft, die nicht spezialisiert ist und deren Java-Typ eine der eingebauten Kontrollen direkt unterstützt - String, boolean, ein numerischer Typ oder Date - erhält das einfache, typisierte Konfigurationsfeldmodell; andernfalls erhält eine durch Auswahl bearbeitete Eigenschaft (eine Optionsliste oder ein Enum) ein Konfigurationsauswahlfeldmodell; alles andere mit einem Wertanbieter erhält das formatbewusste Konfigurationsformatfeldmodell (Text). </p> <p> createControl löst dann die Kontrolle auf: </p> <ol> <li>@Encrypted gewinnt immer, bewusst vor jedem anderen Schritt - siehe unten.</li> <li>Die Konfigurationskontrolle-Annotation an der Eigenschaft oder an ihrem Werttyp.</li> <li>Ein Konfigurationsauswahlfeldmodell erhält eine Auswahl.</li> <li>Die in diesem Dienst konfigurierte Zuordnung von Werttyp zu Anbieter.</li> <li>Die in diesem Dienst konfigurierte Zuordnung von Wertanbieter zu Anbieter — sie beansprucht eine Eigenschaft, deren Wertanbieter (oder eine seiner Oberklassen) eingetragen ist, noch vor dem allgemeinen Format-Textfeld. Das ist es, was einem als Tageszeit formatierten Date ein Uhrzeit-Eingabefeld statt reinen Textes gibt: Die Zuordnung nach Java-Typ oben kann es nicht von einem reinen Datum unterscheiden, die Klasse des Wertanbieters aber schon.</li><li>Der eingebaute Rückfall: die direkte Kontrolle für eine nicht spezialisierte Eigenschaft, deren Typ createModel ebenfalls als direkt bearbeitbar einstuft, andernfalls Text, geparst und formatiert über den eigenen ConfigurationValueProvider der Eigenschaft.</li> </ol> <p> @Encrypted läuft vor der Konfigurationskontrolle-Annotation, nicht nur vor den eingebauten Schritten: Ein Modul darf die Kontrolle für eine Eigenschaft überschreiben, aber es darf niemals in der Lage sein, ein Geheimnis lesbar zu machen, indem es eine Kontrolle wählt, die es im Klartext anzeigt. Dies ist eine bewusste Sicherheitsentscheidung aus eigenem Recht, unabhängig vom unten beschriebenen Spezialisierungs-Veto. </p> <p> Das Spezialisierungs-Veto ist der Grund, warum eine Eigenschaft mit eigenem Format nie an die "direkte" Kontrolle für ihren Java-Typ übergeben wird: ein als Tageszeit formatiertes Date wird über dieses Format als Text bearbeitet, nicht in einem Datumswähler, der eine Zeit weder anzeigen noch entgegennehmen könnte - derselbe Fehler, der bei DatePickerControlProvider auf Seiten der Modellattribute behoben wurde. Eine Eigenschaft, deren Wertanbieter von der Zuordnung nach Wertanbieter beansprucht wird, ist eine bewusste Ausnahme: Das Spezialisierungs-Veto meldet sie dann doch als nicht spezialisiert (sofern sie nicht zugleich Optionen hat — siehe unten), sie erhält also das einfache, typisierte Konfigurationsfeldmodell statt des formatbewussten, und das beanspruchte Bedienelement — an denselben typisierten Wert gebunden — bearbeitet sie tatsächlich. </p> <p> Optionen gewinnen gegen einen Anspruch: Eine Property, die sowohl @Options trägt als auch beansprucht ist, bleibt spezialisiert und wird durch Auswahl bearbeitet, nicht durch das beanspruchte Bedienelement — eine ausdrückliche Optionsliste ist eine Aussage über diese eine Property und damit enger als eine Zuordnung, die für eine ganze Wertanbieter-Klasse eingetragen ist; die engere Aussage gewinnt. </p> <p> Die konfigurierten Zuordnungen sind es, die einem Modul oberhalb dieses Moduls erlauben, eine Kontrolle beizutragen - der TL-Script-Editor etwa liegt in tl-model-search-react. </p>
com.top_logic.layout.configedit.DatePickerFormatProvider = Datumswähler nach Format
com.top_logic.layout.configedit.DatePickerFormatProvider.Config.kind = Art
com.top_logic.layout.configedit.DatePickerFormatProvider.Config.kind.tooltip = Welchen Teil eines Zeitpunkts der Wert der beanspruchten Eigenschaft bezeichnet.
com.top_logic.layout.configedit.DatePickerFormatProvider.tooltip = <i>Konfigurations-Kontroll-Anbieter</i>, der einen <i>Datumswähler</i> einer festen <i>Art</i> erzeugt. <p> Gedacht als Implementierung eines <i>Format-Zuordnungs</i>-Eintrags, der eine Eigenschaft beansprucht, deren Wertanbieter ein Date auf einen bestimmten Teil eines Zeitpunkts einschränkt — etwa <i>Tageszeit als Date</i> auf <i>Uhrzeit</i>. Eingetragen wird er je Wertanbieter-Klasse (siehe <i>Formate</i>), nicht je Java-Typ: Ein formatiertes Date erreicht dieses Bedienelement über jene Zuordnung, noch vor dem allgemeinen Format-Textfeld, das der eingebaute Rückfall ihm sonst gibt — der Rückfall kann eine Tageszeit nicht von einem reinen Datum unterscheiden, weil beide ein Date sind, die Klasse des Wertanbieters aber schon. </p>
