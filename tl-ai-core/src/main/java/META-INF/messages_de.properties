com.top_logic.tl.ai.core.provider.local.LocalProviderConfig.tooltip = <i>LLM-Anbieterkonfiguration</i> für lokale OpenAI-kompatible Server (Ollama, LM Studio, vLLM). <p> Die Basis-URL ist obligatorisch und es ist kein API-Schlüssel erforderlich. Erzeugt einen <i>offenen AI-Anbieter</i>, da die lokalen Server das OpenAI-Protokoll sprechen. </p>
