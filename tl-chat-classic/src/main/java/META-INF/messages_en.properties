com.top_logic.ai.chat.classic.ReactViewComponent = React view component
com.top_logic.ai.chat.classic.ReactViewComponent.Config.view = View
com.top_logic.ai.chat.classic.ReactViewComponent.Config.view.tooltip = The view to display, as a path below /WEB-INF/views/, e.g. tl-chat-classic/chat.view.xml.
com.top_logic.ai.chat.classic.ReactViewComponent.tooltip = A classic <i>component</i> that displays a React view, e.g. the agent chat, in its layout cell. <p> A React control is an <i>HTML fragment</i> like any classic control: it writes its root tag, and the React bridge renders the rest on the client. This component builds the control tree of the configured view once per window and writes it whenever the classic layout renders the component. </p> <p> <b>The React window is the classic window.</b> The tree is registered in the <i>react window registry</i> under the name of the classic window's sub-session. That is what makes the two update paths meet in one page: the React servlet resolves the window name of a React command to the classic sub-session and its MainLayout, so the classic repaints and InfoService messages a React command causes reach the page over the React event stream, while classic commands keep using the AJAX servlet. It is also the window id the chat's /chat/* API is addressed with. </p> <p> Errors of React commands are shown in the window snackbar this component adds to the tree, as in a React page. </p>
