model.tl.ai.core = TL-AI-Core
model.tl.ai.core.Agent = AI Agent
model.tl.ai.core.Agent.delegations = Delegations
model.tl.ai.core.Agent.delegations.tooltip = Other agents this agent can hand off tasks to. The agent decides when to delegate based on the sub-agent's description.
model.tl.ai.core.Agent.description = Description
model.tl.ai.core.Agent.description.tooltip = A short summary of what this agent does. Shown to other agents when they decide which agent to delegate to.
model.tl.ai.core.Agent.entryPoint = Entry point
model.tl.ai.core.Agent.entryPoint.tooltip = If enabled, this agent is available as a starting point for new conversations. Agents without this flag can only be reached via delegation.
model.tl.ai.core.Agent.maxRetries = Max. Retries
model.tl.ai.core.Agent.maxRetries.tooltip = Maximum number of times the agent retries after an error before giving up.
model.tl.ai.core.Agent.maxTokens = Max. Tokens
model.tl.ai.core.Agent.maxTokens.tooltip = Upper limit on the number of tokens the model may generate in a single response.
model.tl.ai.core.Agent.maxToolResultChars = Max. Tool Result Length
model.tl.ai.core.Agent.maxToolResultChars.tooltip = Maximum number of characters returned from a single tool call. Longer results are truncated.
model.tl.ai.core.Agent.mcpServers = MCP Servers
model.tl.ai.core.Agent.mcpServers.tooltip = Names of MCP servers this agent may use for tool calls.
model.tl.ai.core.Agent.model = Model
model.tl.ai.core.Agent.model.tooltip = The language model used by this agent (e.g. Claude, GPT). If empty, the system default is used.
model.tl.ai.core.Agent.name = Name
model.tl.ai.core.Agent.name.tooltip = The unique name used to identify this agent.
model.tl.ai.core.Agent.skills = Skills
model.tl.ai.core.Agent.skills.tooltip = Reusable instructions attached to this agent. Skills provide domain knowledge or behavioral guidelines for specific tasks.
model.tl.ai.core.Agent.systemPrompt = System prompt
model.tl.ai.core.Agent.systemPrompt.tooltip = Instructions that define the agent's behavior, role, and response style. Sent to the language model at the start of every conversation.
model.tl.ai.core.Agent.temperature = Temperature
model.tl.ai.core.Agent.temperature.tooltip = Controls how creative or random the model's responses are. Lower values (e.g. 0.0) produce more deterministic output, higher values (e.g. 1.0) more varied output.
model.tl.ai.core.Agent.timeoutSeconds = Timeout (s)
model.tl.ai.core.Agent.timeoutSeconds.tooltip = Maximum time in seconds the agent may run before the request is cancelled.
model.tl.ai.core.Agent.tools = Tools
model.tl.ai.core.Agent.tools.tooltip = The tools this agent is allowed to use (e.g. search, database queries). Only selected tools are available during execution.
model.tl.ai.core.Agent.tooltip = An AI agent that processes user requests using a language model, tools, and skills.
model.tl.ai.core.Agent.topP = Top P
model.tl.ai.core.Agent.topP.tooltip = Limits the model's word choices to the most likely options whose combined probability reaches this threshold. Lower values make output more focused.
model.tl.ai.core.Skill = Skill
model.tl.ai.core.Skill.agents = Agents
model.tl.ai.core.Skill.agents.tooltip = The agents this skill is assigned to.
model.tl.ai.core.Skill.content = Content
model.tl.ai.core.Skill.content.tooltip = The full instruction text of the skill. This is injected into the agent's context when the skill is activated.
model.tl.ai.core.Skill.description = Description
model.tl.ai.core.Skill.description.tooltip = A short summary of what this skill provides. Helps the agent decide when to apply it.
model.tl.ai.core.Skill.name = Name
model.tl.ai.core.Skill.name.tooltip = The unique name of this skill.
model.tl.ai.core.Skill.tooltip = A reusable instruction that can be attached to agents to guide their behavior in specific situations.
