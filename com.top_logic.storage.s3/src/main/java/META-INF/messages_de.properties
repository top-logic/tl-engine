com.top_logic.storage.s3.S3BlobStore = S3-Blob-Speicher
com.top_logic.storage.s3.S3BlobStore.Config.access-key = Zugriffsschlüssel
com.top_logic.storage.s3.S3BlobStore.Config.access-key.tooltip = Die Zugriffsschlüssel-ID zur Authentifizierung beim Speicher. <p> Entweder werden sowohl der Zugriffsschlüssel als auch der geheime Schlüssel angegeben, oder beide Felder bleiben leer. Sind beide Felder leer, werden die Anmeldedaten aus der Standard-Anmeldedaten-Anbieter-Kette des AWS SDK bezogen (Umgebungsvariablen, <code>~/.aws/credentials</code>, IAM-Rolle der Instanz oder des Containers). </p>
com.top_logic.storage.s3.S3BlobStore.Config.bucket = Bucket
com.top_logic.storage.s3.S3BlobStore.Config.bucket.tooltip = Der Name des Buckets, in dem die Blobs gespeichert sind. <p> Der Bucket muss bereits vorhanden sein; er wird nicht vom Speicher angelegt. </p>
com.top_logic.storage.s3.S3BlobStore.Config.class.tooltip = Implementierungsklasse des Speichers.
com.top_logic.storage.s3.S3BlobStore.Config.direct-download = Direkter Download
com.top_logic.storage.s3.S3BlobStore.Config.direct-download-lifetime = Gültigkeitsdauer direkter Downloads
com.top_logic.storage.s3.S3BlobStore.Config.direct-download-lifetime.tooltip = Die Zeit, in der eine URL für einen direkten Download gültig bleibt, z. B. <code>60s</code>. <p> Der Speicher überprüft die Gültigkeit zu Beginn der Übertragung, sodass ein langsamer Download großer Inhalte auch dann abgeschlossen wird, wenn die URL bereits abgelaufen ist. Jeder, der die URL besitzt, kann den Inhalt innerhalb dieses Zeitraums abrufen. Maximal 7 Tage. Nur relevant, wenn <i>„Direkter Download“</i> aktiviert ist. </p>
com.top_logic.storage.s3.S3BlobStore.Config.direct-download-min-size = Mindestgröße direkter Downloads
com.top_logic.storage.s3.S3BlobStore.Config.direct-download-min-size.tooltip = Die Mindestgröße von Inhalten, die direkt aus dem Speicher heruntergeladen werden. <p> Kleinere Inhalte werden über den Anwendungsserver gestreamt, da die Umleitung mehr kosten würde, als sie einspart. Die Größe wird in Byte angegeben, optional mit einer Einheit, z. B. <code>1MB</code>. Nur relevant, wenn <i>„Direkter Download“</i> aktiviert ist. </p>
com.top_logic.storage.s3.S3BlobStore.Config.direct-download.tooltip = Ob Browser Inhalte direkt aus dem Speicher herunterladen. <p> Wenn diese Option aktiviert ist, wird ein Download in der React-Benutzeroberfläche mit einer Weiterleitung zu einer vorab signierten URL des Objekts beantwortet, anstatt den Inhalt über den Anwendungsserver zu streamen. Der Browser muss auf den Speicher zugreifen können (siehe <i>Öffentlicher Endpunkt</i>). Der Speicher bedient dann auch Bereichsanfragen, z. B. zum Suchen in Audio- oder PDF-Inhalten. Die Integritätsprüfung des Inhalts anhand seines gespeicherten Hash-Werts wird bei direkten Downloads nicht durchgeführt. </p>
com.top_logic.storage.s3.S3BlobStore.Config.endpoint = Endpunkt
com.top_logic.storage.s3.S3BlobStore.Config.endpoint.tooltip = Die URL des S3-Dienstes, z. B. <code>https://minio.example.com:9000</code>. <p> Bei AWS S3 leer lassen, da der Endpunkt aus der Region abgeleitet wird. Erforderlich für S3-kompatible Server. </p>
com.top_logic.storage.s3.S3BlobStore.Config.kms-key-id = KMS-Schlüssel-ID
com.top_logic.storage.s3.S3BlobStore.Config.kms-key-id.tooltip = Die ID oder ARN des Schlüssels, der für den Verschlüsselungsmodus SSE-KMS verwendet wird. <p> Lassen Sie das Feld leer, um den Standardschlüssel des Schlüsselverwaltungsdienstes zu verwenden. Wird bei anderen Verschlüsselungsmodi ignoriert. </p>
com.top_logic.storage.s3.S3BlobStore.Config.multipart-threshold = Schwellenwert für Multipart-Upload
com.top_logic.storage.s3.S3BlobStore.Config.multipart-threshold.tooltip = Die maximale Größe von Inhalten, die in einer einzelnen Anfrage hochgeladen werden können. <p> Inhalte bis zu dieser Größe werden im Speicher gepuffert und in einer einzigen Anfrage hochgeladen. Größere Inhalte werden in Teilen hochgeladen. Die Größe wird in Byte angegeben, optional mit einer Einheit, z. B. <code>16MB</code>. </p>
com.top_logic.storage.s3.S3BlobStore.Config.part-size = Teilgröße
com.top_logic.storage.s3.S3BlobStore.Config.part-size.tooltip = Die Größe der Teile eines Multipart-Uploads. <p> Pro laufendem Upload wird ein Teil im Speicher gepuffert. Die Größe muss mindestens 5 MB betragen. Da S3 maximal 10.000 Teile pro Upload akzeptiert, begrenzt die Teilgröße die Größe eines Blobs: Der Standardwert von 8 MB ermöglicht Blobs von bis zu 80 GB. </p>
com.top_logic.storage.s3.S3BlobStore.Config.path-style-access = Zugriff über Pfadstil
com.top_logic.storage.s3.S3BlobStore.Config.path-style-access.tooltip = Ob der Bucket als Teil des URL-Pfads (<code>https://host/bucket/key</code>) anstelle des Hostnamens (<code>https://bucket.host/key</code>) angegeben wird. <p> Die meisten selbst gehosteten S3-kompatiblen Server (z. B. <code>MinIO</code>) erfordern den Zugriff im Pfadstil. </p>
com.top_logic.storage.s3.S3BlobStore.Config.prefix = Präfix
com.top_logic.storage.s3.S3BlobStore.Config.prefix.tooltip = Präfix der Objektnamen der Blobs im Bucket, z. B. <code>blobs/</code>. <p> Der Objektname eines Blobs besteht aus diesem Präfix, direkt gefolgt vom Schlüssel des Blobs; daher muss ein Präfix, das als Verzeichnis dienen soll, mit einem Schrägstrich enden. Mehrere Speicher können sich einen Bucket mit unterschiedlichen Präfixen teilen. Leer, um die Blobs auf der obersten Ebene des Buckets zu speichern. Objekte unter dem Präfix, die keine Blobs des Speichers sind, sowie Objekte in tieferen Verzeichnissen unterhalb des Präfixes werden ignoriert. </p>
com.top_logic.storage.s3.S3BlobStore.Config.public-endpoint = Öffentlicher Endpunkt
com.top_logic.storage.s3.S3BlobStore.Config.public-endpoint.tooltip = Die URL, über die Browser auf den S3-Dienst zugreifen, z. B. <code>https://storage.example.com</code>. <p> Für diese Adresse werden URLs für direkte Downloads ausgegeben. Leer, wenn Browser den Speicher unter der im <i>Endpunkt</i> angegebenen Adresse erreichen. Nur relevant, wenn <i>„Direkter Download“</i> aktiviert ist. </p>
com.top_logic.storage.s3.S3BlobStore.Config.region = Region
com.top_logic.storage.s3.S3BlobStore.Config.region.tooltip = Die Region des Buckets, z. B. <code>eu-central-1</code>. <p> S3-kompatible Server akzeptieren in der Regel jede Region; die Signatur der Anfragen wird für die hier angegebene Region berechnet. </p>
com.top_logic.storage.s3.S3BlobStore.Config.secret-key = Geheimer Schlüssel
com.top_logic.storage.s3.S3BlobStore.Config.secret-key.tooltip = Der zum Zugriffsschlüssel gehörende geheime Schlüssel. <p> Der Wert wird in der Konfiguration verschlüsselt oder als Klartext mit dem Präfix <code>unencrypted:</code> angegeben. </p>
com.top_logic.storage.s3.S3BlobStore.Config.server-side-encryption = Serverseitige Verschlüsselung
com.top_logic.storage.s3.S3BlobStore.Config.server-side-encryption.tooltip = Die serverseitige Verschlüsselung, die der Speicher auf gespeicherte Blobs anwendet.
com.top_logic.storage.s3.S3BlobStore.tooltip = <i>Blob-Speicher</i>, bei dem jeder Blob als Objekt in einem Bucket von AWS S3 oder einem S3-kompatiblen Objektspeicher (z. B. <code>MinIO</code>, Ceph RGW, Garage, <code>SeaweedFS</code>) gespeichert wird. <p> Der Name eines Blobs setzt sich aus dem konfigurierten Präfix und dem darauf folgenden Schlüssel des Blobs zusammen. Der Bucket muss bereits vorhanden sein. Inhalte bis zum Multipart-Schwellenwert werden im Arbeitsspeicher gepuffert und in einer einzigen Anfrage hochgeladen; größere Inhalte sowie Inhalte unbekannter Größe, die den Schwellenwert überschreiten, werden in einem Multipart-Upload gestreamt, wobei jeweils ein Teil gepuffert wird. Ein fehlgeschlagener Multipart-Upload wird abgebrochen; Reste unterbrochener Uploads werden durch die Bereinigung des Speichers entfernt. </p> <p> Ohne konfigurierte Zugriffsschlüssel werden die Anmeldedaten aus der Standardkette der Anmeldedatenanbieter des AWS SDK entnommen: Umgebungsvariablen, die Datei <code>~/.aws/credentials</code> oder die IAM-Rolle der Instanz oder des Containers. </p> <p> Optional laden Browser Inhalte direkt aus dem Speicher über kurzlebige, vorab signierte URLs herunter, anstatt sie über den Anwendungsserver zu empfangen (siehe <i>„Direkter Download“</i>). </p>
com.top_logic.storage.s3.ServerSideEncryptionMode = Serverseitiger Verschlüsselungsmodus
com.top_logic.storage.s3.ServerSideEncryptionMode.NONE = Keine
com.top_logic.storage.s3.ServerSideEncryptionMode.NONE.tooltip = Es wird keine Verschlüsselung angefordert; es gelten die Standardverschlüsselungseinstellungen des Buckets.
com.top_logic.storage.s3.ServerSideEncryptionMode.SSE_KMS = SSE-KMS
com.top_logic.storage.s3.ServerSideEncryptionMode.SSE_KMS.tooltip = Verschlüsselung mit einem Schlüssel des Schlüsselverwaltungsdienstes des Speichers (SSE-KMS). <p> Der Schlüssel wird im Speicher konfiguriert; ohne Schlüssel wird der Standardschlüssel des Schlüsselverwaltungsdienstes verwendet. </p>
com.top_logic.storage.s3.ServerSideEncryptionMode.SSE_S3 = SSE-S3
com.top_logic.storage.s3.ServerSideEncryptionMode.SSE_S3.tooltip = Verschlüsselung mit vom Speicher verwalteten Schlüsseln (SSE-S3, AES-256).
com.top_logic.storage.s3.ServerSideEncryptionMode.tooltip = Serverseitige Verschlüsselung, die vom Speicher auf die Blobs eines <i>S3-Blob-Speichers</i> angewendet wird. <p> Der Inhalt wird vom Speicher verschlüsselt und entschlüsselt, für die Anwendung transparent. Das Lesen von Teilbereichen funktioniert weiterhin. </p>
