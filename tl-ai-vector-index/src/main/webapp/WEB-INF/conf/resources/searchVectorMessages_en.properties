com.top_logic.ai.vector.index.scripting.runtime.action.WaitForVectorFinishedActionOp = Wait for Vector indexer{#gt(max-sleep, 0) ? { ({max-sleep}ms)}}.
search.engine.name.Vector = TopLogic
com.top_logic.ai.vector.index.VectorIndex.VectorConfig.mistral-api-key.tooltip = Mistral API key - needed to consume Mistral service for vector embedding.
com.top_logic.ai.vector.index.VectorIndex.VectorConfig.vector-store-collection-name.tooltip = Qdrant vector indexing collection. Objects with enabled vector indexing will be stored as points in this Qdrant collection.
com.top_logic.ai.vector.index.VectorIndex.VectorConfig.qdrant-db-hostname.tooltip = Qdrant database host.
com.top_logic.ai.vector.index.VectorIndex.VectorConfig.qdrant-db-port.tooltip = Qdrant database port.
com.top_logic.ai.vector.index.VectorIndex.VectorConfig.mistral-embed-model.tooltip = Mistral Embed model ID (i.e. mistral-embed)
com.top_logic.ai.vector.index.VectorIndex.VectorConfig.vector-index-models.tooltip = Comma separated list of Fully Qualified Names (FQNs) of models to be serialized and stored in the Qdrant databse with vector index (Embedding service shall be used on the content of the object)
com.top_logic.ai.vector.index.VectorIndex.VectorConfig.no-vector-index-models.tooltip = Comma separated list of Fully Qualified Names (FQNs) of models to be serialized and stored in the Qdrant databse. These objects shall be stored without a vector - no embedding service shall be executed for them, just the content shall be stored in the _noVector collection. This is useful for content that shall be used for additional context for AI services. The models need to be present in the "Vector index models" configuration as well in order to be indexed. 
