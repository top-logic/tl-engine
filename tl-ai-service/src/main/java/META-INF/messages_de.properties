com.top_logic.ai.service.tools.registry.ToolRegistry.Config.tool-factories.tooltip = Karte der benannten Werkzeugfabriken, die in der Anwendung verfï¿½gbar sind. <p> Jede Werkzeugfabrik wird durch einen eindeutigen Namen identifiziert. Der Fabrikname wird Teil des qualifizierten Werkzeugnamens (Fabrikname.Werkzeugname), mit dem in TL-Script-Funktionen auf Werkzeuge verwiesen wird. </p>
