model.tl.bpe.execution = Workflow-Durchführung
model.tl.bpe.execution.ExecutionState = Ausführungsstatus
model.tl.bpe.execution.ExecutionState.ABORTED = Abgebrochen
model.tl.bpe.execution.ExecutionState.ABORTED.tooltip = Die Prozess-Instanz wurde vor ihrem Ende abgebrochen und wird nicht fortgesetzt.
model.tl.bpe.execution.ExecutionState.FINISHED = Beendet
model.tl.bpe.execution.ExecutionState.FINISHED.tooltip = Die Prozess-Instanz hat ein Ende-Ereignis erreicht. Sie hat keine aktiven Aufgaben mehr.
model.tl.bpe.execution.ExecutionState.RUNNING = Aktiv
model.tl.bpe.execution.ExecutionState.RUNNING.tooltip = Die Prozess-Instanz hat noch kein Ende-Ereignis erreicht und hat noch Aufgaben zu erledigen.
model.tl.bpe.execution.ExecutionState.tooltip = Der Zustand, in dem sich eine Prozess-Instanz befindet.
model.tl.bpe.execution.Named = Named
model.tl.bpe.execution.Named.name = Name
model.tl.bpe.execution.ProcessExecution = Prozess-Instanz
model.tl.bpe.execution.ProcessExecution.activeTokens = Aktive Aufgaben
model.tl.bpe.execution.ProcessExecution.activeTokens.tooltip = Die Aufgaben, die in diesem Durchlauf derzeit zu erledigen sind. Der Wert wird von der Workflow-Durchführung gepflegt.
model.tl.bpe.execution.ProcessExecution.allTokens = Verlauf
model.tl.bpe.execution.ProcessExecution.allTokens.tooltip = Die Abfolge aller Aufgaben, die in diesem Prozessdurchlauf erstellt wurden.
model.tl.bpe.execution.ProcessExecution.collaboration = Gesamtprozess
model.tl.bpe.execution.ProcessExecution.collaboration.tooltip = Die Collaboration, zu der dieser Durchlauf gehört.
model.tl.bpe.execution.ProcessExecution.createdBy = Ersteller
model.tl.bpe.execution.ProcessExecution.createdBy.tooltip = Der Zugang, der den Durchlauf gestartet hat. Der Wert wird berechnet.
model.tl.bpe.execution.ProcessExecution.createdByContact = Kontakt
model.tl.bpe.execution.ProcessExecution.createdByContact.tooltip = Der Personenkontakt des Zugangs, der den Durchlauf gestartet hat. Der Wert wird berechnet.
model.tl.bpe.execution.ProcessExecution.durationInMinutes = Dauer in Minuten
model.tl.bpe.execution.ProcessExecution.durationInMinutes.tooltip = Die Zeit in Minuten, die der Durchlauf bisher gedauert hat, beziehungsweise die Gesamtdauer, wenn er beendet ist. Der Wert wird berechnet.
model.tl.bpe.execution.ProcessExecution.executionNumber = Nummer
model.tl.bpe.execution.ProcessExecution.executionNumber.tooltip = Die fortlaufende Nummer des Durchlaufs. Sie wird beim Starten des Durchlaufs automatisch aus dem Nummernkreis vergeben.
model.tl.bpe.execution.ProcessExecution.executionState = Status
model.tl.bpe.execution.ProcessExecution.executionState.tooltip = Der Zustand des Durchlaufs. Ein neuer Durchlauf ist aktiv; beendet ist er, sobald ein Ende-Ereignis erreicht wird.
model.tl.bpe.execution.ProcessExecution.process = Prozess
model.tl.bpe.execution.ProcessExecution.process.tooltip = Der Prozess der Collaboration, der hier durchlaufen wird.
model.tl.bpe.execution.ProcessExecution.tooltip = Ein einzelner Durchlauf eines Workflows. An der Prozess-Instanz entstehen ihre Aufgaben, und sie ist das Objekt, auf dem die Formulare des Workflows arbeiten.
model.tl.bpe.execution.ProcessExecution.userRelevantTokens = Aktuelle Aufgaben
model.tl.bpe.execution.ProcessExecution.userRelevantTokens.tooltip = Die aktiven Aufgaben, die ein Nutzer bearbeiten muss. Aufgaben, die die Workflow-Durchführung selbstständig durchläuft, sind nicht enthalten. Der Wert wird berechnet.
model.tl.bpe.execution.Token = Aufgabe
model.tl.bpe.execution.Token.active = Aktiv
model.tl.bpe.execution.Token.active.tooltip = Ob die Aufgabe noch zu erledigen ist. Der Wert wird berechnet.
model.tl.bpe.execution.Token.actor = Aktor
model.tl.bpe.execution.Token.actor.tooltip = Die Rolle, die die Aufgabe bearbeiten muss. Der Wert ist die Bezeichnung der Bahn, in der der Knoten der Aufgabe liegt.
model.tl.bpe.execution.Token.durationInMinutes = Dauer in Minuten
model.tl.bpe.execution.Token.durationInMinutes.tooltip = Die Zeit in Minuten, die die Aufgabe offen ist, beziehungsweise die Zeit, die sie bis zu ihrem Abschluss offen war. Der Wert wird berechnet.
model.tl.bpe.execution.Token.executionNumber = Nummer
model.tl.bpe.execution.Token.executionNumber.tooltip = Die Nummer des Durchlaufs, zu dem diese Aufgabe gehört. Der Wert wird von der Prozess-Instanz übernommen.
model.tl.bpe.execution.Token.finishBy = Beendet durch
model.tl.bpe.execution.Token.finishBy.tooltip = Der Zugang, der die Aufgabe abgeschlossen hat.
model.tl.bpe.execution.Token.finishDate = Ende
model.tl.bpe.execution.Token.finishDate.tooltip = Der Zeitpunkt, zu dem die Aufgabe abgeschlossen wurde. Leer, solange die Aufgabe noch offen ist.
model.tl.bpe.execution.Token.name = Name
model.tl.bpe.execution.Token.name.tooltip = Die Bezeichnung der Aufgabe. Sie wird aus der Bezeichnung der Aufgabenbeschreibung des Workflows berechnet, in die die Daten der Prozess-Instanz eingesetzt werden.
model.tl.bpe.execution.Token.next = Nächste Aufgabe(n)
model.tl.bpe.execution.Token.next.tooltip = Die Aufgaben, mit denen der Durchlauf nach dieser Aufgabe weitergegangen ist.
model.tl.bpe.execution.Token.node = Aufgabe
model.tl.bpe.execution.Token.node.tooltip = Der Knoten des Prozessdiagramms, für den diese Aufgabe entstanden ist.
model.tl.bpe.execution.Token.previous = Vorige Aufgabe(n)
model.tl.bpe.execution.Token.previous.tooltip = Die Aufgaben, von denen aus der Durchlauf zu dieser Aufgabe gelangt ist.
model.tl.bpe.execution.Token.processExecution = Prozess
model.tl.bpe.execution.Token.processExecution.tooltip = Der Durchlauf, zu dem diese Aufgabe gehört. Eine Aufgabe wird gemeinsam mit ihrem Durchlauf gelöscht.
model.tl.bpe.execution.Token.startDate = Start
model.tl.bpe.execution.Token.startDate.tooltip = Der Zeitpunkt, zu dem die Aufgabe entstanden ist. Der Wert ist der Erzeugungszeitpunkt der Aufgabe.
model.tl.bpe.execution.Token.tooltip = Eine konkrete Aufgabe innerhalb einer Prozessdurchführung. Die Aufgabe wird definiert durch die Aufgabenbeschreibung eines Workflows und mit den Daten des Prozessdurchführungsobjekt angezeigt und ausgeführt.
model.tl.bpe.execution.Token.userRelevant = Manuell
model.tl.bpe.execution.Token.userRelevant.tooltip = Ob die Aufgabe von einem Nutzer bearbeitet werden muss. Aufgaben, die die Workflow-Durchführung selbstständig durchläuft, sind für einen Nutzer nicht relevant. Der Wert wird berechnet.
model.tl.bpe.execution.tooltip = Modul mit den Typen, die den Durchlauf eines Workflows beschreiben: die Prozess-Instanz und die darin anfallenden Aufgaben.
