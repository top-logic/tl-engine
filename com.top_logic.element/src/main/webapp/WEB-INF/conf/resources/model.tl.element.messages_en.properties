model.tl.element = Business objects
model.tl.element.Attributed = Business object
model.tl.element.Attributed.tooltip = Common base type for business objects whose properties are described by the application model.
model.tl.element.StructuredElement = Structured element
model.tl.element.StructuredElement.parent = Parent
model.tl.element.StructuredElement.parent.tooltip = The node that contains this element. The reference is the inverse of the children reference of the container. It is abstract and has to be redeclared in the structure deriving from this type; without that redeclaration every access to it fails.
model.tl.element.StructuredElement.tooltip = Base type for a node of a tree-shaped structure. A structured element knows the node that contains it. The top-level type of a structure derives from this type and has to redeclare the parent reference, narrowing it to the type of its own containers.
model.tl.element.StructuredElementContainer = Structured element container
model.tl.element.StructuredElementContainer.children = Children
model.tl.element.StructuredElementContainer.children.tooltip = The nodes contained in this node. The children are ordered and are deleted together with their container. The reference is abstract and has to be redeclared in every concrete type of the structure that has children; without that redeclaration every access to it fails.
model.tl.element.StructuredElementContainer.tooltip = Base type for a node of a tree-shaped structure that can itself contain further nodes. Every type of a structure that has a substructure derives from this type, and every concrete type among them has to redeclare the children reference, narrowing it to the types it may contain.
model.tl.element.tooltip = Module with the base types from which the business types of an application are derived. In particular, it defines the types for tree-shaped structures.
