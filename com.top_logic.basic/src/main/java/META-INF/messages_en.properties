com.top_logic.basic.i18n.CustomKey = Custom key
com.top_logic.basic.i18n.CustomKey.tooltip = Specifies a custom resource key for a <i>resource key</i> field in an <i>internationalization constants base</i> subclass. <p> By default, the resource key for a field is derived from the fully-qualified class name and the field name (e.g. <tt>class.com.my.pkg.I18NConstants.MY_FIELD</tt>). This annotation overrides that default with a custom key. </p> <p> Usage: </p> <pre> &#64;CustomKey("js.audioPlayer.play") public static ResKey JS_AUDIO_PLAYER_PLAY; </pre> <p> The field must <b>not</b> be pre-initialized (e.g. with ResKey.internalCreate(String)). The annotation is read both at runtime (by I18NConstantsBase.initConstants()) and at build time (by the <code>TLDoclet</code>) to ensure that the <code>JavaDoc</code>-based localization is stored under the correct key. </p>
com.top_logic.basic.i18n.CustomKey.value = Value
