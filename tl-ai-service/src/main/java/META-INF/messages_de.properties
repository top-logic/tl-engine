com.top_logic.ai.service.tools.TraceEventKind.TOOL_CALL = Werkzeugaufruf
com.top_logic.ai.service.tools.TraceEventKind.TOOL_CALL.tooltip = Ein Werkzeug wurde aufgerufen (toolName, args, result).
com.top_logic.ai.service.tools.TraceEventKind.tooltip = Art des Eintrags in der Zeitleiste einer Ablaufverfolgung.
com.top_logic.ai.service.tools.help.TLScriptReferenceTool = Skript-Referenzwerkzeug
com.top_logic.ai.service.tools.help.TLScriptReferenceTool.tooltip = Werkzeug zum Auflisten von TLScript-Funktionen und zum Abrufen der Dokumentation. <p> Dieses Tool ermöglicht den Zugriff auf die TLScript-Funktionsregistrierung, so dass KI-Agenten verfügbare Funktionen entdecken und detaillierte Dokumentationen zu ihnen abrufen können. Es verwendet den <i>Search Builder</i>, um auf die Metadaten der Funktionen zuzugreifen. </p>
com.top_logic.ai.service.tools.model.AnnotationDefinitionExplorerTool = Explorer-Tool für Anmerkungsdefinitionen
com.top_logic.ai.service.tools.model.AnnotationDefinitionExplorerTool.tooltip = Werkzeug zur Erkundung von Schemata für Anmerkungsdefinitionen. <p> Dieses Tool ermöglicht es KI-Agenten, Anmerkungsdefinitionen zu verstehen (was konfiguriert werden KANN), nicht Anmerkungsinstanzen (was konfiguriert ist). Es bietet Schemainformationen, einschließlich Metadaten zu Eigenschaften, Typen, Einschränkungen und Standardeinstellungen. </p> <h3>Beispiel für die Verwendung:</h3> <pre> // Untersuchen einer bestimmten Anmerkungsdefinition describeAnnotation("com.top_logic.model.annotate.Visibility") // Untersuchen einer Formulardefinitionsanmerkung describeAnnotation("com.top_logic.model.form.definition.FormDefinition") </pre> <h3>Integration</h3>: <p> Um dieses Tool mit einem KI-Agenten zu verwenden, instanziieren Sie es und fügen Sie es zu den Tools des Agenten hinzu: </p> <pre> AnnotationDefinitionExplorerTool definitionTool = new AnnotationDefinitionExplorerTool(); ModelExplorer explorer = AgenticServices.agentBuilder(ModelExplorer.class) .chatModel(explorationModel) .tools(browserTool, instanceTool, analysisTool, searchTool, annotationTool, definitionTool) .build(); </pre>
com.top_logic.ai.service.tools.model.InstanceBrowserTool = Instanz-Browser-Tool
com.top_logic.ai.service.tools.model.InstanceBrowserTool.tooltip = Tool für den Zugriff auf TopLogic-Instanzdaten aus der Wissensdatenbank. <p> Dieses Tool bietet zwei Methoden für die Arbeit mit Instanzen: <ul> <li><code>#listInstances(String, String, Integer, String)</code> - Auflistung aller TIDs für einen Typ</li> <li><code>#getInstance(String)</code> - Abrufen detaillierter Informationen für eine bestimmte Instanz</li> </ul> </p> <p> Alle Methoden geben JSON-formatierte Strings zurück, die von KI-Agenten verwendet werden können. </p>
com.top_logic.ai.service.tools.model.ModelAnnotationBrowserTool = Browser-Tool für Modellkommentare
com.top_logic.ai.service.tools.model.ModelAnnotationBrowserTool.tooltip = Werkzeug zum Durchsuchen von Annotationen auf TopLogic-Modellelementen (Module, Typen, Teile, Aufzählungen, Klassifikatoren). <p> Mit diesem Tool können KI-Agenten die Metadaten von Annotationen auf Modellelementen mit optionaler Vererbungsunterstützung prüfen. Es liefert detaillierte Informationen über jede Anmerkung, einschließlich ihres Tag-Namens, der Konfigurationsschnittstelle und der Eigenschaftswerte. </p> <h3>Beispiel für die Verwendung:</h3> <pre> // Auflisten lokaler Anmerkungen zu einem Modul listAnnotations("tl.core", false) // Auflisten lokaler Anmerkungen zu einem Typ listAnnotations("tl.core:TLObject", false) // Auflisten aller Anmerkungen einschließlich vererbter listAnnotations("tl.core:TLObject", true) // Auflisten von Anmerkungen zu einer Enumeration listAnnotations("tl.core:TLScope", false) // Anmerkungen zu einem Typteil auflisten listAnnotations("tl.core:TLObject#name", false) // Anmerkungen zu einem Klassifikator (Enum-Literal) auflisten listAnnotations("tl.core:TLScope#global", false) </pre> <h3>Integration</h3>: <p> Um dieses Tool mit einem KI-Agenten zu verwenden, instanziieren Sie es und fügen Sie es zu den Tools des Agenten hinzu: </p> <pre> ModelAnnotationBrowserTool annotationTool = new ModelAnnotationBrowserTool(); ModelExplorer explorer = AgenticServices.agentBuilder(ModelExplorer.class) .chatModel(explorationModel) .tools(browserTool, instanceTool, analysisTool, searchTool, annotationTool) .build(); </pre>
com.top_logic.ai.service.tools.model.ModelBrowserTool = Modell-Browser-Tool
com.top_logic.ai.service.tools.model.ModelBrowserTool.tooltip = Werkzeug zum Durchsuchen der TopLogic-Modellstruktur (Module, Typen, Teile). <p> Dieses Werkzeug bietet drei Methoden, die die natürliche Hierarchie für die Modelluntersuchung bilden: <ul> <li><code>#listModules()</code> - Auflistung aller Module in der Anwendung</li> <li><code>#listTypes(String)</code> - Auflistung der Typen innerhalb eines bestimmten Moduls</li> <li><code>#listTypeParts(String, String, Boolean)</code> - Auflistung der Eigenschaften/Referenzen eines Typs</li> </ul> </p> <p> Alle Methoden geben JSON-formatierte Zeichenketten zurück, die von KI-Agenten verwendet werden können. </p>
com.top_logic.ai.service.tools.model.ModelEditorTool = Modell-Editor-Werkzeug
com.top_logic.ai.service.tools.model.ModelEditorTool.tooltip = <code>LangChain4j</code> Tool zum Erstellen und Aktualisieren von TopLogic-Modellelementen. <p> Dieses Tool bietet Methoden zum Erstellen und Aktualisieren von Modulen, Klassen, Eigenschaften, Referenzen, Rückwärtsreferenzen und Aufzählungen im TopLogic-Anwendungsmodell. </p> <p> Alle Methoden geben JSON-formatierte Zeichenketten zurück, die von KI-Agenten verwendet werden können. </p>
com.top_logic.ai.service.tools.model.ModelSearchTool = Werkzeug zur Modellsuche
com.top_logic.ai.service.tools.model.ModelSearchTool.tooltip = Werkzeug für die Suche im gesamten TopLogic-Anwendungsmodell. <p> Dieses Tool bietet eine intelligente Textsuche über Module, Typen (Klassen, Aufzählungen, Datentypen) und Eigenschaften/Referenzen. Es durchsucht technische Namen, qualifizierte Namen, Bezeichnungen und Beschreibungen und gibt die 10 relevantesten Treffer mit Kontextinformationen zurück. </p>
com.top_logic.ai.service.tools.model.TypeAnalysisTool = Werkzeug zur Typenanalyse
com.top_logic.ai.service.tools.model.TypeAnalysisTool.tooltip = Tool zur Analyse der TopLogic-Typ-Abhängigkeiten und -Beziehungen. <p> Dieses Tool bietet Methoden, um zu verstehen, wie Typen im gesamten Modell verwendet werden: <ul> <li><code>#findTypeUsages(String)</code> - Findet alle Verwendungen eines Typs</li> <li><code>#findPartUsages(String, String)</code> - Findet, wo ein Teil definiert und vererbt wird</li> </ul> </p> <p> Alle Methoden geben JSON-formatierte Strings zurück, die von KI-Agenten verwendet werden können. </p>
com.top_logic.ai.service.tools.registry.ReflectiveToolFactory = Reflektierende Werkzeugfabrik
com.top_logic.ai.service.tools.registry.ReflectiveToolFactory.Config.tool-class = Werkzeugklasse
com.top_logic.ai.service.tools.registry.ReflectiveToolFactory.Config.tool-class.tooltip = Die Java-Klasse, die mit @Tool annotierte Methoden enthält. <p> Diese Klasse wird nach Werkzeugdefinitionen durchsucht. Alle öffentlichen Methoden, die mit @Tool annotiert sind, werden als AI-Tools angezeigt. </p>
com.top_logic.ai.service.tools.registry.ReflectiveToolFactory.tooltip = Eine <i>Werkzeugfabrik</i>, die reflektiv Werkzeuge aus einer Java-Klasse mit @Tool-kommentierten Methoden entdeckt. <p> Diese Fabrik extrahiert Werkzeugspezifikationen aus der konfigurierten Klasse und erstellt entsprechende Executors für jedes Werkzeug. </p>
com.top_logic.ai.service.tools.registry.ScriptToolFactory = Script-Werkzeugfabrik
com.top_logic.ai.service.tools.registry.ScriptToolFactory.Config.tools = Werkzeuge
com.top_logic.ai.service.tools.registry.ScriptToolFactory.Config.tools.tooltip = Die zu erstellenden Werkzeuge. <p> Jedes Werkzeug wird durch seine Spezifikation (Name, Beschreibung, Parameter) und eine TL-Script-Implementierung definiert. </p>
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.description = Beschreibung
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.description.tooltip = Die Beschreibung dessen, was das Werkzeug tut.
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.implementation = Umsetzung
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.implementation.tooltip = Die TL-Script-Implementierung des Werkzeugs. <p> Das Skript erhält die Parameter des Tools als Variablen und sollte das Ergebnis des Tools als String zurückgeben. </p>
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.name = Name
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.name.tooltip = Der Name des Tools.
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.parameters = Parameter
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ScriptToolConfig.parameters.tooltip = Die Parameter, die dieses Werkzeug akzeptiert. <p> Jeder Parameter wird durch seinen Namen und seine Konfiguration (Typ, Beschreibung usw.) definiert. </p>
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ToolParameterConfig.description = Beschreibung
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ToolParameterConfig.description.tooltip = Die Beschreibung des Parameters.
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ToolParameterConfig.name = Name
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ToolParameterConfig.name.tooltip = Der Name des Parameters.
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ToolParameterConfig.type = Typ
com.top_logic.ai.service.tools.registry.ScriptToolFactory.ToolParameterConfig.type.tooltip = Der JSON-Schematyp des Parameters (z. B. "string", "number", "boolean", "object", "array").
com.top_logic.ai.service.tools.registry.ScriptToolFactory.tooltip = Eine <i>Werkzeugfabrik</i>, die Werkzeuge aus TL-Script-Implementierungen erstellt. <p> Mit dieser Fabrik können Werkzeuge direkt in der Konfiguration mit TL-Script-Code definiert werden. Jedes Werkzeug besteht aus einer Spezifikation (Name, Beschreibung, Parameter) und einem TL-Script-Ausdruck, der die Logik des Werkzeugs implementiert. </p>
com.top_logic.ai.service.tools.registry.ToolRegistry = Werkzeug-Register
com.top_logic.ai.service.tools.registry.ToolRegistry$ToolFactoryConfig = Werkzeug-Werkskonfiguration
com.top_logic.ai.service.tools.registry.ToolRegistry$ToolFactoryConfig.tooltip = Konfiguration für eine benannte Werkzeugfabrik.
com.top_logic.ai.service.tools.registry.ToolRegistry.Config.tool-factories = Werkzeugfabriken
com.top_logic.ai.service.tools.registry.ToolRegistry.Config.tool-factories.tooltip = Karte der benannten Werkzeugfabriken, die in der Anwendung verfügbar sind. <p> Jede Werkzeugfabrik wird durch einen eindeutigen Namen identifiziert. Der Fabrikname wird Teil des qualifizierten Werkzeugnamens (Fabrikname.Werkzeugname), mit dem in TL-Script-Funktionen auf Werkzeuge verwiesen wird. </p>
com.top_logic.ai.service.tools.registry.ToolRegistry.ToolFactoryConfig.implementation = Umsetzung
com.top_logic.ai.service.tools.registry.ToolRegistry.ToolFactoryConfig.implementation.tooltip = Die Implementierung der Werkzeugfabrik.
com.top_logic.ai.service.tools.registry.ToolRegistry.tooltip = Registrierungsdienst zur Verwaltung der in der Anwendung verfügbaren Werkzeuge. <p> Die Werkzeuge sind nach Fabriken organisiert. Jede Fabrik produziert einen Satz von Werkzeugen, und jedes Werkzeug wird durch einen qualifizierten Namen im Format {factory-name}{tool-name} identifiziert. So können Werkzeuge aus verschiedenen Fabriken denselben einfachen Namen haben, ohne dass es zu Konflikten kommt. </p>
com.top_logic.ai.service.tools.script.TLScriptTool = Skript-Tool
com.top_logic.ai.service.tools.script.TLScriptTool.tooltip = Langchain4j-Werkzeug zur Validierung und Ausführung von TLScript-Code. <p> Dieses Tool bietet zwei Methoden für die Arbeit mit TLScript: </p> <ul> <li><code>#validateTLScript(String)</code> - Validierung von Syntax, Modellreferenzen und Typen</li> <li><code>#executeTLScript(String, Boolean, List)</code> - Validiert und führt TLScript-Code aus</li> </ul> <p> Beide Methoden verwenden den gemeinsamen <i>Skript-Executor</i> für die zentrale Validierungs- und Ausführungslogik. </p>
com.top_logic.ai.service.tools.script.messages.ErrorType = Fehlerart
com.top_logic.ai.service.tools.script.messages.ErrorType.LEXICAL_ERROR = Lexikalischer Fehler
com.top_logic.ai.service.tools.script.messages.ErrorType.LEXICAL_ERROR.tooltip = Lexikalischer Fehler (ungültige Zeichen).
com.top_logic.ai.service.tools.script.messages.ErrorType.SYNTAX_ERROR = Syntax-Fehler
com.top_logic.ai.service.tools.script.messages.ErrorType.SYNTAX_ERROR.tooltip = Syntaxfehler (Parserfehler).
com.top_logic.ai.service.tools.script.messages.ErrorType.VALIDATION_ERROR = Validierungsfehler
com.top_logic.ai.service.tools.script.messages.ErrorType.VALIDATION_ERROR.tooltip = Validierungsfehler (Modellreferenzen, Typenprüfung).
com.top_logic.ai.service.tools.script.messages.ErrorType.tooltip = Art des Validierungsfehlers.
