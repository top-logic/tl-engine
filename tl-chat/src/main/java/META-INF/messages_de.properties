class.com.top_logic.ai.chat.view.I18NConstants.ERROR_ATTACHMENT_TYPE__FILE.help = Eine Datei wurde nicht an eine Nachricht angehängt, weil eine Nachricht nur Bilder und PDF tragen kann.
class.com.top_logic.ai.chat.view.I18NConstants.ERROR_CHAT_CONTENT__COUNT_LOCATION = Ein &lt;chat&gt; enthält genau ein Element, enthält aber {0} (bei {1}). Er legt nur das Gespräch seines Inhalts fest; mehrere Elemente kommen in ein Layout-Element als seinen einzigen Inhalt, z.B. &lt;split-panel&gt; oder &lt;stack&gt;.
class.com.top_logic.ai.chat.view.I18NConstants.ERROR_CHAT_CONTENT__COUNT_LOCATION.help = Ein <chat> enthält nicht genau ein Element; er legt nur das Gespräch seines Inhalts fest und ordnet nichts an.
class.com.top_logic.ai.chat.view.I18NConstants.ERROR_SUBJECT_NOT_OF_TYPE__TYPE = Der Chat konnte nicht begonnen werden: Seine Fabrik für das Bezugsobjekt hat kein Objekt vom Typ {0} angelegt.
class.com.top_logic.ai.chat.view.I18NConstants.ERROR_SUBJECT_NOT_OF_TYPE__TYPE.help = Die Fabrik für das Bezugsobjekt eines Chats hat kein Objekt des konfigurierten Typs angelegt, daher wurde die erste Nachricht nicht gesendet.
class.com.top_logic.ai.chat.view.I18NConstants.ERROR_TOO_MANY_ATTACHMENTS__FILE_MAX = {0}: An eine Nachricht können höchstens {1} Dateien angehängt werden.
class.com.top_logic.ai.chat.view.I18NConstants.ERROR_TOO_MANY_ATTACHMENTS__FILE_MAX.help = Eine Datei wurde nicht an eine Nachricht angehängt, weil die Nachricht schon so viele Dateien trägt, wie sie darf.
class.com.top_logic.ai.chat.view.I18NConstants.PANE_COLUMN_LABEL = Bezeichnung
class.com.top_logic.ai.chat.view.I18NConstants.PANE_COLUMN_LABEL.help = Kopfzeile der Spalte einer Datentabelle, die jede Zeile benennt, bei Daten, deren Bezeichnungen keinen eigenen Namen tragen.
class.com.top_logic.ai.chat.view.I18NConstants.PANE_COLUMN_VALUE = Wert
class.com.top_logic.ai.chat.view.I18NConstants.PANE_COLUMN_VALUE.help = Überschrift der Spalte einer Datentabelle, die eine Zahlenreihe enthält, wenn diese keinen Namen hat.
class.com.top_logic.ai.chat.view.I18NConstants.PANE_TITLE_DATA = Auswertung
class.com.top_logic.ai.chat.view.I18NConstants.PANE_TITLE_DATA.help = Titel des Präsentationsfensters, wenn darin ein Diagramm oder eine Tabelle mit Daten angezeigt wird, die der Agent berechnet hat, und der Agent selbst keinen eigenen Titel vergeben hat.
class.com.top_logic.ai.chat.view.I18NConstants.PANE_TITLE_OBJECTS__COUNT = {0} Objekte
class.com.top_logic.ai.chat.view.I18NConstants.PANE_TITLE_OBJECTS__COUNT.help = Titel des Präsentationsfensters, wenn darin mehrere Objekte statt nur eines angezeigt werden. <p> Ein Objekt gibt dem Bereich seine eigene Bezeichnung; eine Gruppe von Objekten hat keine eigene Bezeichnung, und die Anzahl ist die einzige aussagekräftige Information, die man darüber erhalten kann, ohne die Objekte zu lesen. </p>
class.com.top_logic.ai.chat.view.I18NConstants.PANE_TITLE_TYPE__TYPE_COUNT = {0} ({1})
class.com.top_logic.ai.chat.view.I18NConstants.PANE_TITLE_TYPE__TYPE_COUNT.help = Titel des Präsentationsfensters, wenn darin eine Tabelle oder ein Diagramm mit Objekten eines Typs angezeigt wird, wobei der Agent keinen eigenen Titel hat.
com.top_logic.ai.chat.api.AccountRuns$SubagentMessageStatus = Status einer Nachricht an einen Subagenten
com.top_logic.ai.chat.api.AccountRuns$SubagentMessageStatus.tooltip = Was aus einer Nachricht geworden ist, die der Benutzer einem Subagenten geschrieben hat.
com.top_logic.ai.chat.api.AccountRuns.SubagentMessageStatus.EMPTY = Leer
com.top_logic.ai.chat.api.AccountRuns.SubagentMessageStatus.EMPTY.tooltip = Es gab keinen Text.
com.top_logic.ai.chat.api.AccountRuns.SubagentMessageStatus.ENDED = Beendet
com.top_logic.ai.chat.api.AccountRuns.SubagentMessageStatus.ENDED.tooltip = Der Subagent ist beendet und liest keine Nachrichten mehr.
com.top_logic.ai.chat.api.AccountRuns.SubagentMessageStatus.SENT = Gesendet
com.top_logic.ai.chat.api.AccountRuns.SubagentMessageStatus.SENT.tooltip = Der Subagent liest sie zu Beginn seines nächsten Durchgangs.
com.top_logic.ai.chat.api.AccountRuns.SubagentMessageStatus.UNKNOWN = Unbekannt
com.top_logic.ai.chat.api.AccountRuns.SubagentMessageStatus.UNKNOWN.tooltip = In einem Chat dieses Kontos gibt es keinen solchen Subagenten.
com.top_logic.ai.chat.backend.ConversationBackendResolver.backendFor = Backend für
com.top_logic.ai.chat.backend.ConversationBackendResolver.backendFor.param.subject.tooltip = Worum es in der Unterhaltung geht; niemals <code>null</code>: Eine Unterhaltung über nichts beantwortet der Agent des Frameworks, ohne einen Resolver zu fragen.
com.top_logic.ai.chat.backend.ConversationBackendResolver.backendFor.return = Das Backend oder <code>null</code>, wenn dieser Resolver Unterhaltungen über diesen Gegenstand nicht beantwortet.
com.top_logic.ai.chat.backend.ConversationBackendResolver.backendFor.tooltip = Das Backend, das eine Unterhaltung über den gegebenen Gegenstand beantwortet. <p> Aufgerufen im Chat-Worker-Thread vor jedem Lauf einer Unterhaltung und in einem Request-Thread, wann immer der Chat wissen will, was eine bestehende Unterhaltung unterstützt - beim Laden, beim Senden, beim erneuten Erzeugen oder Bearbeiten einer Nachricht. Immer im Kontext des Kontos, dem die Unterhaltung gehört, und häufig: Die Antwort soll billig sein und für denselben Gegenstand gleich ausfallen. </p>
com.top_logic.ai.chat.backend.ConversationBackendResolver.featuresFor = Funktionen für
com.top_logic.ai.chat.backend.ConversationBackendResolver.featuresFor.param.subjectType.tooltip = Der Typ des Gegenstands, um den es in einer Unterhaltung geht; niemals <code>null</code>.
com.top_logic.ai.chat.backend.ConversationBackendResolver.featuresFor.return = Die Funktionen oder <code>null</code>, wenn dieser Resolver Unterhaltungen über Gegenstände dieses Typs nicht beantwortet.
com.top_logic.ai.chat.backend.ConversationBackendResolver.featuresFor.tooltip = Was eine Unterhaltung über einen Gegenstand des gegebenen Typs anbietet. <p> Aufgerufen in einem Request-Thread, wann immer ein Chat noch keine Unterhaltung zeigt - ein leerer Chat über einen Gegenstand dieses Typs - und erneut, wenn sich sein Gegenstand ändert; häufig, die Antwort soll also billig sein. Die Antwort muss zu den Funktionen der Backends passen, die <i>Backend für</i> für Gegenstände dieses Typs nennt: Der Chat bietet vor der ersten Nachricht diese Bedienelemente an und danach die des Backends. </p>
com.top_logic.ai.chat.backend.ConversationBackendService = Backend-Dienst für Konversationen
com.top_logic.ai.chat.backend.ConversationBackendService.Config.resolvers = Resolver für Konversations-Backends
com.top_logic.ai.chat.backend.ConversationBackendService.Config.resolvers.tooltip = Was entscheidet, welche Konversationen ein externes Backend beantwortet. <p> Vor jedem Lauf einer Konversation in dieser Reihenfolge gefragt; der erste Resolver, der ein Backend nennt, gewinnt. Ist die Liste leer, beantwortet der Agent des Frameworks jede Konversation. </p>
com.top_logic.ai.chat.backend.ConversationBackendService.tooltip = Entscheidet, welche Konversationen des Chats von einem <i>Konversations-Backend</i> statt vom Agenten des Frameworks beantwortet werden. <p> Die Resolver werden in der konfigurierten Reihenfolge gefragt; der erste, der ein Backend nennt, gewinnt. Eine Konversation, die kein Resolver beansprucht – und jede Konversation, solange dieser Dienst nicht gestartet ist –, beantwortet der Agent des Frameworks. </p> <p> Dieses Modul konfiguriert den Dienst ohne Resolver. Eine Anwendung ergänzt ihren eigenen in ihrer Konfiguration: </p> <pre> &lt;config service-class="com.top_logic.ai.chat.backend.ConversationBackendService"&gt; &lt;instance&gt; &lt;resolvers&gt; &lt;resolver class="my.app.WorkspaceBackendResolver"/&gt; &lt;/resolvers&gt; &lt;/instance&gt; &lt;/config&gt; </pre>
com.top_logic.ai.chat.history.ChatScriptFunctions.activity = Chat-Aktivität
com.top_logic.ai.chat.history.ChatScriptFunctions.activity.param.session.tooltip = Der Chat, eine tl.ai.execution:AgentSession.
com.top_logic.ai.chat.history.ChatScriptFunctions.activity.return = „waiting“, „news“ oder „running“; <code>null</code>, wenn nichts davon zutrifft oder das Argument kein Chat ist.
com.top_logic.ai.chat.history.ChatScriptFunctions.activity.tooltip = Was in einem Chat vor sich geht, das der Benutzer womöglich nicht sieht: ob etwas auf ihn wartet, ob ein Subagent fertig geworden ist, seit er zuletzt hingesehen hat, oder ob dort noch ein Agent arbeitet. <p> Subagenten arbeiten über das Fenster hinaus, das sie gestartet hat. Ein Chat, den der Benutzer verlassen hat, kann also weiterarbeiten, fertig werden oder eine Antwort brauchen. Das zeigt eine Chat-Liste zu jedem Chat. Die Antworten haben einen Rang: Was auf den Benutzer wartet, kommt zuerst, dann ein Ergebnis, das er noch nicht gesehen hat, dann laufende Arbeit. </p> <p> „Gesehen“ heißt: Ein Fenster des Besitzers hat den Chat gezeigt - als der Benutzer ihn geöffnet oder verlassen hat, oder während der Subagent endete. </p>
com.top_logic.ai.chat.history.ChatScriptFunctions.start = Einen Chat mit einer Nachricht starten
com.top_logic.ai.chat.history.ChatScriptFunctions.start.param.chatId.tooltip = Der Chat des Fensters, der die Nachricht sendet: die Chat-ID der Chat-Elemente, die ihn anzeigen.
com.top_logic.ai.chat.history.ChatScriptFunctions.start.param.subject.tooltip = Worum es in der Unterhaltung geht, leer für nichts.
com.top_logic.ai.chat.history.ChatScriptFunctions.start.param.text.tooltip = Die erste Nachricht.
com.top_logic.ai.chat.history.ChatScriptFunctions.start.return = Die neue Unterhaltung, eine tl.ai.execution:AgentSession.
com.top_logic.ai.chat.history.ChatScriptFunctions.start.tooltip = Startet einen Chat im aktuellen Fenster: eine neue Unterhaltung über das angegebene Objekt, deren erste Nachricht sofort gesendet wird, als hätte der Benutzer sie in den Chat eingegeben. <p> Für einen Befehl, der einen Auftrag erteilt - „arbeite daran“ -, statt darauf zu warten, dass der Benutzer etwas eingibt. Die Unterhaltung handelt von Beginn an von dem angegebenen Objekt, sodass das, was Unterhaltungen über solche Objekte beantwortet, auch die erste Nachricht beantwortet. Die Nachricht wird über den Chat des Fensters gesendet, den chatId benennt: Schreiben Sie das Ergebnis in den Kanal „Eingabe“ einer „ <chat-conversation> “ dieses Chats, dann zeigt sie die Antwort, während sie geschrieben wird. </p>
com.top_logic.ai.chat.layout.PromptImprovementProcessor$Failure = Fehlerart
com.top_logic.ai.chat.layout.PromptImprovementProcessor$Failure.tooltip = Art des Anfrage- oder Konfigurationsfehlers.
com.top_logic.ai.chat.layout.PromptImprovementProcessor.Failure.DISABLED = Deaktiviert
com.top_logic.ai.chat.layout.PromptImprovementProcessor.Failure.DISABLED.tooltip = Die Prompt-Verbesserung ist nicht konfiguriert.
com.top_logic.ai.chat.layout.PromptImprovementProcessor.Failure.INVALID_REQUEST = Ungültige Anfrage
com.top_logic.ai.chat.layout.PromptImprovementProcessor.Failure.INVALID_REQUEST.tooltip = Die Browseranfrage ist fehlerhaft.
com.top_logic.ai.chat.layout.PromptImprovementProcessor.Failure.MISSING_AGENT = Fehlender Agent
com.top_logic.ai.chat.layout.PromptImprovementProcessor.Failure.MISSING_AGENT.tooltip = Der konfigurierte Agent ist nicht vorhanden.
com.top_logic.ai.chat.layout.PromptImprovementProcessor.Failure.NO_ROOM = Kein Platz
com.top_logic.ai.chat.layout.PromptImprovementProcessor.Failure.NO_ROOM.tooltip = Alle Chat-Worker sind ausgelastet, und auch die Warteschlange ist voll.
com.top_logic.ai.chat.sched.AgentTask = Agentenaufgabe
com.top_logic.ai.chat.sched.AgentTask.Config.agent = Agent
com.top_logic.ai.chat.sched.AgentTask.Config.agent.tooltip = Name des auszuführenden Agenten. <p> Lassen Sie das Feld leer, um den Einstiegs-Agenten der Anwendung auszuführen – genau das geschieht bei einer Chat-Nachricht ohne explizite Auswahl. Das Konto, unter dem diese Aufgabe ausgeführt wird, muss berechtigt sein, den genannten Agenten auszuführen, genau wie im Chat. </p>
com.top_logic.ai.chat.sched.AgentTask.Config.approval-mode = Genehmigungsmodus
com.top_logic.ai.chat.sched.AgentTask.Config.approval-mode.tooltip = Wie die Tool-Aufrufe des Laufs genehmigt werden. <p><i>Die automatische Genehmigung</i>, die Standardeinstellung, ist der einzige Modus, der unbeaufsichtigt abläuft: Der Agent bestätigt seine eigenen Aufrufe selbst und unterliegt stattdessen der <background-allowlist> der Tool-Zugriffsrichtlinie. <i>Im manuellen Modus</i> wird festgelegt, dass eine Person antworten muss – dies kann jedes Fenster des „Run-as“-Kontos tun – und jeder genehmigungsbedürftige Aufruf wartet auf diese Antwort, bis zum Ablauf des Interaktions-Timeouts von 30 Minuten. </p>
com.top_logic.ai.chat.sched.AgentTask.Config.prompt = Prompt
com.top_logic.ai.chat.sched.AgentTask.Config.prompt-expression = Prompt-Ausdruck
com.top_logic.ai.chat.sched.AgentTask.Config.prompt-expression.tooltip = TL-Script, das die an den Agenten zu übermittelnde Nachricht berechnet und zu Beginn jedes Durchlaufs ausgewertet wird. <p> Die Alternative zu <i>Prompt</i> für eine Aufgabe, deren Meldung davon abhängt, was die Anwendung zu diesem Zeitpunkt enthält – „das sind die bereits zusammengefassten Rechnungen, nimm den Rest“. Der Ausdruck nimmt keine Argumente entgegen und sein Ergebnis wird als Text verwendet. </p> <p> Konfigurieren Sie entweder dies oder <i>Prompt</i>, nicht beides und auch nicht keines von beiden. </p>
com.top_logic.ai.chat.sched.AgentTask.Config.prompt.tooltip = Die Nachricht, die an den Agenten gesendet werden soll, als Klartext. <p> Schreiben Sie sie als Element, damit ein mehrzeiliger Prompt lesbar bleibt: <prompt>Fassen Sie die heute erfassten Rechnungen zusammen.</prompt> Verwenden Sie stattdessen <i>den Prompt-Ausdruck</i>, wenn die Nachricht Anwendungsdaten benennen muss. </p>
com.top_logic.ai.chat.sched.AgentTask.Config.record-session = Sitzung aufzeichnen
com.top_logic.ai.chat.sched.AgentTask.Config.record-session.tooltip = Ob der Durchlauf als Chat-Sitzung des „Run-as“-Kontos aufgezeichnet wird. <p> Standardmäßig aktiviert – und der Grund, warum diese Aufgabe überhaupt über den Chat läuft: Die Sitzung erscheint im Chatverlauf dieses Kontos zusammen mit dem Protokoll der vom Agenten durchgeführten Aktionen. Deaktivieren Sie diese Option für eine Aufgabe, die ausschließlich wegen ihrer Auswirkungen ausgeführt werden soll; der Durchlauf hinterlässt dann kein Protokoll, sondern nur die von den Tools geschriebenen Daten und die Angaben im Protokoll. </p>
com.top_logic.ai.chat.sched.AgentTask.Config.run-as = Ausführen als
com.top_logic.ai.chat.sched.AgentTask.Config.run-as.tooltip = Anmeldename des Kontos, unter dem der Lauf ausgeführt wird. <p> Der Prinzipal des Laufs: Seine Rollen legen fest, welche Tools der Agent verwenden und welche Agenten er ausführen darf, und seine Zugriffsrechte bestimmen, auf welche Objekte diese Tools zugreifen dürfen. Die aufgezeichnete Chat-Sitzung gehört zu diesem Konto und erscheint in dessen Chat-Verlauf. Standardmäßig ist das Root-Konto eingestellt. </p>
com.top_logic.ai.chat.sched.AgentTask.Config.session-title = Titel der Sitzung
com.top_logic.ai.chat.sched.AgentTask.Config.session-title.tooltip = Titel der aufgezeichneten Chat-Sitzung. <p> Standardmäßig ist dies der Name der Aufgabe. Bei jedem Durchlauf wird eine eigene Sitzung erstellt, sodass der Titel dazu dient, die Durchläufe einer Aufgabe von den übrigen Chats des Kontos zu unterscheiden – nicht einzelne Durchläufe voneinander; dafür sorgt der Zeitstempel der Sitzung. </p>
com.top_logic.ai.chat.sched.AgentTask.tooltip = Eine Scheduler-Aufgabe, die einem benannten Agenten eine Abfrage übermittelt und den Durchlauf als Chat-Sitzung aufzeichnet. <p> Der Sinn darin, den Agenten <em>über den Chat</em> statt im Headless-Modus auszuführen, liegt im Protokoll: Ein geplanter Lauf erscheint im Chat-Verlauf des Kontos, unter dessen Namen er ausgeführt wurde, direkt neben den eigenen Unterhaltungen dieses Kontos, und kann dort geöffnet, gelesen und fortgesetzt werden. AgentRunner würde denselben Agenten mit weniger Aufwand ausführen, hinterlässt dabei jedoch lediglich einen Ausführungsdatensatz und keine Chat-Sitzung, die der Benutzer öffnen kann. Alles andere, was diese Aufgabe tut – der Tracker, der Genehmigungsmodus, die Untersitzung – ergibt sich aus dieser Vorgehensweise. </p> <p> Die Konfiguration erfolgt wie bei jeder anderen Aufgabe in der Dienstkonfiguration des Schedulers: </p><pre> &lt;task class="com.top_logic.ai.chat.sched.AgentTask" name="DailyInvoiceSummary" agent="Albert" run-as="root" &gt; &lt;prompt&gt;Fasse die heute erfassten Rechnungen zusammen.&lt;/prompt&gt; &lt;schedules&gt; &lt;daily time-of-day="18:00"/&gt; &lt;/schedules&gt; &lt;/task&gt; </pre> <p><b>Es ist niemand anwesend.</b> Ein geplanter Lauf verfügt über kein Browserfenster, daher können keine Fragen gestellt werden. Im standardmäßigen Modus <i>zur automatischen Genehmigung</i> markiert die Aufgabe ihren Tracker als unbeaufsichtigt: Der Lauf wird durch die Richtlinie „ <background-allowlist> “ begrenzt statt durch eine Genehmigungsabfrage, und „askUser“ antwortet dem Modell sofort, anstatt den Lauf bis zum Ablauf des Interaktions-Timeouts zu pausieren. Siehe den Entwicklerartikel ai/script-and-scheduled-runs. </p> <p> Nicht zu verwechseln mit tl.ai.execution:AgentTask, bei dem es sich um einen Eintrag im Plan handelt, den ein Agent während seiner Arbeit erstellt. Hier handelt es sich um ein com.top_logic.util.sched.task.Task – einen geplanten Auftrag. </p>
com.top_logic.ai.chat.view.ChatChannelsElement = Chat-Kanäle
com.top_logic.ai.chat.view.ChatChannelsElement.Config.channels = Kanäle
com.top_logic.ai.chat.view.ChatChannelsElement.Config.channels.tooltip = Kanäle dieser Ansicht, die die Seiten des Browserfensters schreiben können, durch Kommas getrennt. <p> Jeder Kanal ist unter seinem eigenen Namen erreichbar. Ein „ <page-selection to="..."> “ nennt einen davon. Nenne keinen Kanal, den Tabellen der Seiten über „ <bind> “ teilen: Eine Seite schreibt ihre Auswahl in den Kanal, und die Tabellen bekämen sie als ihre Auswahl. </p>
com.top_logic.ai.chat.view.ChatChannelsElement.Config.class.tooltip = Die Implementierung des Elements. Im Layout-Editor ausgeblendet: Das Tag legt sie bereits fest.
com.top_logic.ai.chat.view.ChatChannelsElement.tooltip = Deklaratives „ <chat-channels/> “-Element: macht Kanäle der Shell von jeder Seite des Browserfensters aus erreichbar. <p> Schreibe es einmal in die Ansicht der Shell, neben den „ <chat-dock> “. Es zeigt nichts. Ein „ <page-selection> “ auf einer Seite schreibt in einen hier genannten Kanal, auch aus einem Rahmen eines Kachelstapels, den ein „ <bind> “ nicht erreicht. Warum, steht bei <i>Chat-Kanäle</i>. </p> <pre> &lt;channels&gt;&lt;channel name="pageSelection"/&gt;&lt;/channels&gt; ... &lt;chat-channels channels="pageSelection"/&gt; &lt;chat-dock ...&gt; ... &lt;selection channel="pageSelection"/&gt; ... &lt;/chat-dock&gt; </pre>
com.top_logic.ai.chat.view.ChatConversationElement = Chat-Konversationselement
com.top_logic.ai.chat.view.ChatConversationElement$Actions = Aktionen
com.top_logic.ai.chat.view.ChatConversationElement$Actions.tooltip = Die Zeile mit Kopieren, Bewertung und Neu erzeugen sowie benannte Host-Aktionen.
com.top_logic.ai.chat.view.ChatConversationElement$Context = Kontext
com.top_logic.ai.chat.view.ChatConversationElement$Context.tooltip = Was eine Seite dem Agenten über die Situation mitteilt, in der sich der Benutzer befindet. <p> Verknüpft mit TL-Script, so wie <data-list> seine Zeilen verknüpft: Die Eingaben sind Kanäle dieser Seite, deren aktuelle Werte zu den führenden Argumenten des Wertausdrucks jeder Tatsache werden. Die Ausdrücke werden auf dem Server im Kontext des handelnden Nutzers ausgewertet und bei jeder Änderung eines Eingabewerts neu ausgewertet – was also mit einer Nachricht übertragen wird, ist das, was die Seite zum Zeitpunkt des Versendens anzeigte. </p> <p> Fakten, die die Anwendung einmal festlegt und die für die gesamte Konversation gelten, sind stabil und werden in die Systemaufforderung gerendert. Ein Fakt, der sich während der Konversation ändert, darf nicht stabil sein: Der Umgebungsblock steht vor jeder Anfrage dieser Konversation und muss byteweise identisch bleiben, sonst verfehlt der Prompt-Cache des Anbieters jeden Turn. Ein solcher Fakt wird stattdessen in den Turn-Kontextblock <turn-context> eingesetzt, der im Turn selbst neben dem Text des Benutzers mitgeführt wird. </p>
com.top_logic.ai.chat.view.ChatConversationElement$Controls = Bedienelemente
com.top_logic.ai.chat.view.ChatConversationElement$Controls.tooltip = Die Picker- und Footer-Schalter am Composer.
com.top_logic.ai.chat.view.ChatConversationElement$Fact = Fakt
com.top_logic.ai.chat.view.ChatConversationElement$Fact.tooltip = Auf jeder Seite wird eine Tatsache zur Situation dargelegt.
com.top_logic.ai.chat.view.ChatConversationElement$Mention = Erwähnung
com.top_logic.ai.chat.view.ChatConversationElement$Mention.tooltip = Deklarative Bindung, mit der @ jedes beliebige Modellobjekt erwähnen kann. <p> Die Bindung erfolgt mit TL-Script auf dieselbe Weise wie bei „ <data-list> “: „rows“ berechnet die Objekte, die @ anbieten kann; „label“ und „text“ berechnen, was angezeigt wird und welchen zitierten Text die Erwähnung in die Nachricht einfügt. Jede Erwähnung enthält die ID des Objekts, wie sie von den Tools des Agenten gelesen wird, sodass der Agent das Objekt mit „getInstance“ abrufen kann. Kandidaten werden an den Browser übermittelt und dort während der Eingabe des Nutzers gefiltert; halten Sie die Menge daher mithilfe von „rows“ und „limit“ überschaubar. </p>
com.top_logic.ai.chat.view.ChatConversationElement$PlaceholderBy = Berechneter Platzhalter
com.top_logic.ai.chat.view.ChatConversationElement$PlaceholderBy.tooltip = Der Platzhalter des Eingabefelds als TL-Script über die Kanäle der Seite.
com.top_logic.ai.chat.view.ChatConversationElement$Prompt = Fragenkarte
com.top_logic.ai.chat.view.ChatConversationElement$Prompt.tooltip = Eine Frage, die diese Seite dem Nutzer anbietet.
com.top_logic.ai.chat.view.ChatConversationElement$Prompts = Fragenkarten
com.top_logic.ai.chat.view.ChatConversationElement$Prompts.tooltip = Die ersten Fragen, die diese Seite anbietet, erscheinen als Karten unter der Begrüßung eines neuen Chats. <p> Ein neuer Chat ist der einzige Bildschirm, auf dem ein Nutzer nichts hat, worauf er reagieren kann, und eine Seite weiß besser als der Chat, welche Fragen dort gestellt werden sollten. Daher gibt die Anwendung hier die Fragen vor, und der Nutzer klickt auf eine davon, anstatt sie einzutippen. </p> <p> Die Karten befinden sich zwischen der Begrüßung und dem Eingabefeld und ausschließlich dort: Einem Gespräch, das der Nutzer aus der Liste geöffnet hat, fehlt es nicht an einer ersten Frage, unabhängig davon, ob es einen Gesprächszug enthält oder nicht. Das ist die Regel, keine Standardeinstellung – es gibt nichts, was man deaktivieren könnte. </p> <p> Verknüpft mit TL-Script, so wie <i>Context</i> seine Fakten verknüpft: Die Eingaben sind Kanäle dieser Seite, deren aktuelle Werte zu den führenden Argumenten des Wertausdrucks jeder Karte werden, die auf dem Server im Kontext des aktiven Nutzers ausgewertet und bei jeder Änderung einer Eingabe neu ausgewertet werden. Eine Karte kann daher benennen, was die Seite gerade anzeigt – „ <em>Diese</em> Rechnung zusammenfassen“ –, anstatt nur einen festen Satz wiederzugeben. </p> <p> Ein Klick darauf schreibt den ausgewerteten Text in den Composer, genau wie es eine Anwendung tut, die in den Entwurfskanal schreibt, und der Composer meldet ihn zurück an diesen Kanal. Es wird nichts gesendet. </p>
com.top_logic.ai.chat.view.ChatConversationElement$Selection = Auswahl
com.top_logic.ai.chat.view.ChatConversationElement$Selection.tooltip = Die aktuelle Auswahl der Seite, die dem Agenten als eine Tatsache pro Runde mitgeteilt wird. <p> Die einzeilige Form dessen, was <i>„fact“</i> auf umständliche Weise ausdrücken kann. Der dabei erzeugte Wert benennt das ausgewählte Objekt dreifach – die Bezeichnung, die der Benutzer sieht, den qualifizierten Typnamen und den Bezeichner, den jedes Tool zurückgibt –, sodass der Agent sowohl die Frage „Welches habe ich geöffnet?“ beantworten als auch entsprechend handeln kann. Die genaue Form finden Sie unter <i>„Chat-Auswahl</i> “. </p> <p> Es handelt sich um eine Angabe des Blocks „ <turn-context> “ und niemals um die Systemaufforderung: Eine Auswahl ist der Wert, der sich in einer Unterhaltung am häufigsten ändert, und der Umgebungsblock muss über alle Runden hinweg byteweise identisch bleiben, da sonst der Prompt-Cache jedes Anbieters fehlschlägt. </p>
com.top_logic.ai.chat.view.ChatConversationElement$Trace = Detailgrad
com.top_logic.ai.chat.view.ChatConversationElement$Trace.tooltip = Wie viel von der Ausführung des Agenten das Transkript zeigt. Eine einzige Einstellung: sie ersetzt den früheren getrennten Trace-Modus und die Laufzusammenfassung. „Zusammenfassung“ ist die eingeklappte, aber aufklappbare Laufzusammenfassung, die der Benutzer per Klick öffnet.
com.top_logic.ai.chat.view.ChatConversationElement.Actions.copy = Kopieren
com.top_logic.ai.chat.view.ChatConversationElement.Actions.copy.tooltip = Ob eine fertige Antwort kopiert werden kann.
com.top_logic.ai.chat.view.ChatConversationElement.Actions.host = Host
com.top_logic.ai.chat.view.ChatConversationElement.Actions.host.tooltip = Registrierte Namen für Nachrichten-Aktionen (im Code definierte Namenskomponenten). Unbekannte Namen werden mit einer Debug-Zeile ignoriert; sie führen nicht zu einem Fehler in der Ansicht. Im Layout-Editor ausgeblendet: Die Werte müssen mit den Registrierungen in TypeScript übereinstimmen.
com.top_logic.ai.chat.view.ChatConversationElement.Actions.rate = Bewertung
com.top_logic.ai.chat.view.ChatConversationElement.Actions.rate.tooltip = Ob eine fertige Antwort bewertet werden kann.
com.top_logic.ai.chat.view.ChatConversationElement.Actions.regenerate = Neu erzeugen
com.top_logic.ai.chat.view.ChatConversationElement.Actions.regenerate.tooltip = Ob die letzte Antwort erneut erzeugt werden kann.
com.top_logic.ai.chat.view.ChatConversationElement.Actions.timestamp = Zeitstempel
com.top_logic.ai.chat.view.ChatConversationElement.Actions.timestamp.tooltip = Ob der Zeitstempel der Antwort angezeigt wird.
com.top_logic.ai.chat.view.ChatConversationElement.AgentCommand.declared-parameters = Deklarierte Parameter
com.top_logic.ai.chat.view.ChatConversationElement.AgentCommand.declared-parameters.tooltip = Die Parameter, die einmalig anhand ihrer Deklaration erstellt werden.
com.top_logic.ai.chat.view.ChatConversationElement.AgentCommand.description = Beschreibung
com.top_logic.ai.chat.view.ChatConversationElement.AgentCommand.description.tooltip = Was der Befehl bewirkt, dem Modell mitgeteilt, damit es ihn danach auswählt. <p> Vom Modell gelesen, daher Englisch und keine Ressource, wie jeder andere Text, den ein Tool einem Modell vorlegt. Beschreiben Sie, was der Nutzer anschließend sieht und wozu der Befehl dient – „Öffnet das Formular, in das der Nutzer das Zugriffstoken einer Git-Verbindung eingibt.“ –, damit das Modell den Befehl ausführt, wenn der Nutzer dies benötigt, und dem Nutzer mitteilt, was als Nächstes zu tun ist. </p>
com.top_logic.ai.chat.view.ChatConversationElement.AgentCommand.name.tooltip = Der Name, unter dem das Modell diesen Befehl ausführt. <p> Einzigartig unter den Agentenbefehlen des Elements. </p>
com.top_logic.ai.chat.view.ChatConversationElement.AgentCommand.parameters = Parameter
com.top_logic.ai.chat.view.ChatConversationElement.AgentCommand.parameters.tooltip = Die Werte, die der Agent beim Ausführen des Befehls übergibt. <p> Deklariert in der Form der <code>&lt;properties&gt;</code> einer Layout-Vorlage: je Parameter sein Name und Typ, eine Beschriftung, deren Tooltip den Parameter für das Modell beschreibt, ob er Pflicht ist, seine Vorgabe, seine erlaubten Werte (<code>&lt;options&gt;</code> oder ein Aufzählungstyp) und seine Einschränkungen. Das Modell erhält sie als JSON-Schema und übergibt ihre Werte als JSON-Objekt; Werte, die nicht zur Deklaration passen, werden abgelehnt, und der Befehl läuft nicht. </p> <p> Die Kette des Befehls, seine Ausführbarkeitsregeln und Zugriffsprüfungen sowie seine Ausdrücke für Beschriftung, Tooltip und Bild sehen jeden Parameter als Argument seines Namens, z. B. <code>$tab</code>. Ein Parameter, der ein Modellobjekt hält, hat den Typ <code>com.top_logic.model.TLObject</code>, das Format <code>com.top_logic.ai.core.tools.model.AgentObjectFormat</code> und den Modelltyp in <code>&lt;object-type&gt;</code>: Der Agent übergibt die ID des Objekts, das mit den Rechten des Nutzers gelesen wird. Ein Klick auf eine Schaltfläche desselben Befehls hat keine Werte für die Parameter; dort sind sie <code>null</code>. </p><pre> &lt;parameters&gt; &lt;property name="tab" type="String"&gt; &lt;label&gt; &lt;en&gt;Tab&lt;/en&gt; &lt;tooltip&gt;&lt;en&gt;The tab to open.&lt;/en&gt;&lt;/tooltip&gt; &lt;/label&gt; &lt;mandatory/&gt; &lt;/property&gt; &lt;/parameters&gt; </pre>
com.top_logic.ai.chat.view.ChatConversationElement.Config.actions = Aktionen
com.top_logic.ai.chat.view.ChatConversationElement.Config.actions.tooltip = Welche Befehle unter einer fertigen Antwort stehen.
com.top_logic.ai.chat.view.ChatConversationElement.Config.agent = Agent
com.top_logic.ai.chat.view.ChatConversationElement.Config.agent-commands = Agentenbefehle
com.top_logic.ai.chat.view.ChatConversationElement.Config.agent-commands.tooltip = Die Befehle dieser Seite, die ein Agent ausführen darf – die Zulassungsliste der Tools für Seitenbefehle. <p><b>Standardmäßig verboten.</b> Leer bedeutet, dass ein Agent keinen Befehl dieser Seite ausführen kann, und bei einer Ausführung, deren Seite kein Element anzeigt, das einen solchen Befehl auflistet, werden die Tools überhaupt nicht angeboten. Jeder Eintrag ist ein gewöhnlicher Befehl mit einem Namen und einer Beschreibung für das Modell: Seine Aktionskette öffnet ein Dialogfeld, zeigt eine Ansicht an, schreibt in einen Kanal – was auch immer eine Schaltfläche der Seite tun könnte – und wird so ausgeführt, wie ein Klick auf eine solche Schaltfläche ihn ausführen würde, nachdem die Ausführbarkeitsregeln und Zugriffsprüfungen dies zugelassen haben. </p> <pre> &lt;agent-commands&gt; &lt;agent-command name="connectGit" description="Opens the form in which the user enters the access token of a git connection."&gt; &lt;open-dialog dialog-view="app/git-connection.view.xml"/&gt; &lt;/agent-command&gt; &lt;/agent-commands&gt; </pre> <p> Ein Befehl, der Parameter deklariert, entnimmt deren Werte dem Agenten – einen Text, eine Zahl, einen Wert aus einer Wertegruppe oder die ID eines Objekts, auf das der Benutzer Zugriff hat – und gleicht diese mit der Deklaration ab; seine Kette und seine Regeln betrachten sie – ausschließlich für diesen Durchlauf – als Argumente ihrer jeweiligen Namen. </p> <p> Die Befehle werden ausgeführt, solange dieses Element angezeigt wird. Ein Durchlauf ohne Browserfenster – headless, TL-Script, der Scheduler – kann keinen dieser Befehle ausführen, unabhängig davon, was hier angegeben ist. </p> <p> Ein Befehl wird ausgeführt, ohne dass der Benutzer zuvor dazu aufgefordert wird: Die Auflistung hier bedeutet, dass die Seite festlegt, dass ein Agent ihn auslösen darf. Listen Sie Befehle auf, deren Wirkung der Benutzer auf der Seite vervollständigt – ein Dialogfeld, das der Benutzer ausfüllt und speichert, eine Ansicht, die der Benutzer betrachtet – und keine Kette, die Daten von selbst ändert. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.agent.tooltip = Optionaler bidirektionaler Kanal, der den Namen des Agenten trägt, auf den der Composer eingestellt ist. Der Composer schreibt die Wahl des Benutzers und folgt einem Schreibvorgang von außen. Ein leerer Kanal sagt nichts und lässt die Auswahl unberührt. Ein Name, den dieses Konto nicht ausführen darf, wird ignoriert; der Agent des Composers wird dann zurückgeschrieben.
com.top_logic.ai.chat.view.ChatConversationElement.Config.busy = Beschäftigt
com.top_logic.ai.chat.view.ChatConversationElement.Config.busy.tooltip = Der optionale Ausgabekanal wird auf „true“ gesetzt, während der Agent arbeitet.
com.top_logic.ai.chat.view.ChatConversationElement.Config.chat-id = Chat-ID
com.top_logic.ai.chat.view.ChatConversationElement.Config.chat-id.tooltip = Welche Unterhaltung dieses Element zeigt, wenn es nicht die des umgebenden „ <chat> “ sein darf. Leer lassen: Ein Element in einem „ <chat> “ zeigt dessen Unterhaltung, ein Element außerhalb jedes „ <chat> “ die Unterhaltung „default“, sodass die Teile einer Seite einander finden, ohne dass es ihnen gesagt wird. Nur setzen, um aus dem umgebenden Chat auszubrechen, etwa für eine zweite Unterhaltung neben der ersten.
com.top_logic.ai.chat.view.ChatConversationElement.Config.citation-renderer = Zitier-Renderer
com.top_logic.ai.chat.view.ChatConversationElement.Config.citation-renderer.tooltip = Name des registrierten Zitier-Renderers (bezeichnet eine im Code eingerichtete Komponente). Bei leerem Wert wird das integrierte Zitier-Popover beibehalten. Im Layout-Editor ausgeblendet: Der Wert muss mit einer Registrierung in TypeScript übereinstimmen.
com.top_logic.ai.chat.view.ChatConversationElement.Config.citations = Quellenangaben
com.top_logic.ai.chat.view.ChatConversationElement.Config.citations.tooltip = Ob die Antwort ihre zitierten Quellen überhaupt anzeigt: die Inline-Markierungen und die „Quellen“-Spalte pro Antwort. Mit „Aus“ wird die gesamte Zitierfläche aus dem Transkript entfernt.
com.top_logic.ai.chat.view.ChatConversationElement.Config.class.tooltip = Die Implementierung des Elements. Im Layout-Editor ausgeblendet: Das Tag legt sie bereits fest, und eine Änderung ergibt ein Element, das nicht mehr zu den daneben angezeigten Optionen passt.
com.top_logic.ai.chat.view.ChatConversationElement.Config.commands = Befehle
com.top_logic.ai.chat.view.ChatConversationElement.Config.commands.tooltip = Befehle, die als Schaltflächen am Ende des Kopfes des Transkripts stehen. <p> Jeder ist ein gewöhnlicher Befehl der Sicht - ein <generic-command> mit Beschriftung, Bild, Badge, Ausführbarkeit und Eingabe. Eine Seite mit einer <side-rail> neben der Unterhaltung setzt hierher den Knopf, der die Seitenspalte öffnet und schließt: Er schaltet deren Kanal „open-channel“ um und zeigt ihren „badge-channel“ als sein Badge. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.context = Kontext
com.top_logic.ai.chat.view.ChatConversationElement.Config.context.tooltip = Was diese Seite dem Agenten über die Situation mitteilt, in der sich der Benutzer befindet. <p> Die Fakten werden aus den Kanälen dieser Seite berechnet und werden mit jeder Nachricht des Benutzers weitergeleitet, wobei das System die stabilen Fakten in den Umgebungsblock der System-Eingabeaufforderung überträgt. Der eigentliche Nachrichtentext des Benutzers wird dabei nie verändert – das Transkript zeigt genau das, was der Benutzer geschrieben hat. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.controls = Bedienelemente
com.top_logic.ai.chat.view.ChatConversationElement.Config.controls.tooltip = Welche Auswahlfelder und Fußzeilenelemente der Composer anzeigt.
com.top_logic.ai.chat.view.ChatConversationElement.Config.draft = Entwurf
com.top_logic.ai.chat.view.ChatConversationElement.Config.draft.tooltip = Optionaler bidirektionaler Kanal, der den noch nicht gesendeten Text des Composers trägt. <p> Der Composer meldet, was der Benutzer getippt hat - bei einer Tipppause, wenn das Feld den Fokus verliert und unmittelbar vor dem Senden - und folgt einem Schreibvorgang von außen: Der geschriebene Text ersetzt den Entwurf, der Composer erhält den Fokus, und der Cursor steht am Ende. Gesendet wird weiterhin vom Benutzer, sodass eine vom Host geschriebene Frage gelesen werden kann, bevor sie hinausgeht. </p> <p> Ein leerer Schreibvorgang löscht den Entwurf; „null“ sagt nichts und lässt den Composer in Ruhe - das ist es, was ein unbeschriebener Kanal trägt. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.effort = Aufwand
com.top_logic.ai.chat.view.ChatConversationElement.Config.effort.tooltip = Optionaler bidirektionaler Kanal, der trägt, wie angestrengt das Modell denken darf. Eine der Aufwandstufen, die das gewählte Modell anbietet, leer für keine. Wird geschrieben und befolgt wie <i>Agent</i>; eine Stufe, die das Modell nicht kennt, verwirft der Composer - genau wie die Wahl der Aufwandsauswahl selbst.
com.top_logic.ai.chat.view.ChatConversationElement.Config.input = Eingabe
com.top_logic.ai.chat.view.ChatConversationElement.Config.input.tooltip = Optionaler Kanal, der die geöffnete AgentSession enthält. Die Unterhaltung folgt einem Schreibvorgang und schreibt den Chat zurück, den sie erstellt oder den der Benutzer öffnet. <p> Ein Chat, zu dem das Fenster auf dem Server wechselt – einer, der durch einen Befehl der Seite mit `chatStart` gestartet wurde –, wird ebenfalls in den Kanal geschrieben: sofort, während die Konversation angezeigt wird, andernfalls bei ihrer Anzeige. Dies gilt auch für die erstmalige Anzeige: Eine Konversation, die in einem Fenster angezeigt wird, in dem bereits ein Chat mit derselben Chat-ID geöffnet ist (nach einem Neuladen oder nach „chatStart“), zeigt diesen Chat an; in einem Fenster ohne solchen Chat bleibt der Kanal leer – es entsteht eine neue Konversation. Es werden nur Chats geschrieben, die das angemeldete Konto lesen darf, und ein Kanal-Listener, der den Chat ablehnt und einen anderen schreibt, hat Vorrang. </p> <p> Lassen Sie das Feld leer, wenn kein anderes Element der Seite die geöffnete Unterhaltung benötigt: Das Element behält dann einen internen Kanal bei, der sich auf dieselbe Weise verhält. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.mcp-servers = MCP-Server
com.top_logic.ai.chat.view.ChatConversationElement.Config.mcp-servers.tooltip = Optionaler bidirektionaler Kanal, der die Namen der MCP-Server trägt, die der nächsten Runde beigegeben sind. Eine Sammlung von Namen oder ein einzelner Name. Wird geschrieben und befolgt wie <i>Agent</i>; ein leerer Kanal sagt nichts, eine leere Sammlung gibt dagegen gar keinen Server bei.
com.top_logic.ai.chat.view.ChatConversationElement.Config.mention = Erwähnung
com.top_logic.ai.chat.view.ChatConversationElement.Config.mention.tooltip = Deklarative @-Erwähnungsbindung: Ermöglicht es, mit @ ein beliebiges Modellobjekt anzubieten, das mit TL-Script konfiguriert wurde, wie z. B. <data-list>. Wenn diese Option gesetzt ist, liefert sie die @-Kandidaten und hat Vorrang vor <i>der Referenzquelle</i>.
com.top_logic.ai.chat.view.ChatConversationElement.Config.menu-items = Menüeinträge
com.top_logic.ai.chat.view.ChatConversationElement.Config.menu-items.tooltip = Registrierte Namen von Composer-Menüeinträgen. Im Layout-Editor ausgeblendet: Die Werte müssen mit den Registrierungen in TypeScript übereinstimmen.
com.top_logic.ai.chat.view.ChatConversationElement.Config.model = Modell
com.top_logic.ai.chat.view.ChatConversationElement.Config.model.tooltip = Optionaler bidirektionaler Kanal, der den Namen des Modells trägt, auf dem die nächste Runde läuft. Wird geschrieben und befolgt wie <i>Agent</i>. Die Wahl eines Agenten setzt hier das Modell, das diesem Agenten zugewiesen ist, sodass ein Host das Modell sieht, auf dem eine Runde tatsächlich liefe.
com.top_logic.ai.chat.view.ChatConversationElement.Config.personalization-key.tooltip = Optionale Überschreibung des automatisch abgeleiteten Personalisierungsschlüssels. Im Layout-Editor ausgeblendet: Der aus dem Ansichtskontext abgeleitete Schlüssel ist der richtige, und ein von Hand eingetragener Wert verschiebt stillschweigend, was ein Benutzer personalisiert hat.
com.top_logic.ai.chat.view.ChatConversationElement.Config.placeholder = Platzhalter
com.top_logic.ai.chat.view.ChatConversationElement.Config.placeholder-by = Berechneter Platzhalter
com.top_logic.ai.chat.view.ChatConversationElement.Config.placeholder-by.tooltip = Die Einladung, die im leeren Eingabefeld steht, aus der Seite berechnet. <p> Für einen Chat, dessen Gegenstand die Seite bestimmt: Ein Chat-Element auf jeder Seite einer Anwendung fragt nach dem geöffneten Projekt, solange eines geöffnet ist, und nach allem anderen, solange keines geöffnet ist. Ein fester Platzhalter nennt dann einen Bereich, den das Gespräch nicht hat. Der Text folgt seinen Eingaben. Ist er leer, gilt der Platzhalter. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.placeholder.tooltip = Die Einladung, die im leeren Eingabefeld steht, in den Worten dieser Anwendung. <p> Hier als Text je Sprache geschrieben oder als Schlüssel eines solchen Textes. Leer behält den Wortlaut des Chats selbst bei - das, was jede Anwendung erhielt, bevor es diese Option gab. </p> <p> Es ist <em>nur</em> die Einladung im Ruhezustand. Während der Agent arbeitet, steht im Feld weiterhin „Nächste Nachricht schreiben …“, denn dieser Satz handelt vom laufenden Vorgang und nicht von dieser Anwendung; eine Anwendung, die ihn ersetzt, fordert den Nutzer auf, etwas zu beginnen, das bereits läuft. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.present = Präsentierbare Kanäle
com.top_logic.ai.chat.view.ChatConversationElement.Config.present.tooltip = Die Kanäle, in die der Agent auf dieser Seite schreiben darf, durch Kommas getrennt – die Zulassungsliste des Tools „present“. <p><b>Standardmäßig wird der Zugriff verweigert.</b> Ein leerer Wert bedeutet, dass der Agent in keinen Kanal dieser Seite schreiben darf, und ein Aufruf, der einen anderen Kanal nennt, wird mit einer Meldung abgelehnt, in der die vorhandenen Namen aufgeführt werden. Die Nennung eines Kanals hier ist eine Entscheidung darüber, welchen Teil der Seite der Agent steuern darf; daher wird dies direkt im Element angegeben und nicht aus der zufälligen Verkabelung an einer beliebigen Stelle in der Ansicht abgeleitet. </p> <p> Die Kanäle zählen, solange dieses Element angezeigt wird. Ein Durchlauf, dessen Seite kein Element anzeigt, das einen Kanal benennt, erhält das vorliegende Tool überhaupt nicht angeboten, sodass der Agent auf eine Anfrage, Objekte im Text anzuzeigen, antwortet, anstatt einen Aufruf zu senden, der abgelehnt wird. </p> <p> Der Agent schreibt die Objekte, nicht die Darstellung: Wie der Wert aussieht, hängt davon ab, welches Element diesen Kanal ausliest – ein ` <presentation-pane>`, ein ` <form>` oder ein ` <data-list>`. In der Regel ist dies ein Kanal, nämlich der, den das Fenster ausliest: `present="paneObject"`. </p> <p> Ein Lauf ohne Browserfenster – headless, TL-Script, der Scheduler – hat überhaupt keine Kanäle, egal was hier steht; das Tool meldet dies und unternimmt nichts. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.prompt-improver-agent = Agent zur Prompt-Verbesserung
com.top_logic.ai.chat.view.ChatConversationElement.Config.prompt-improver-agent.tooltip = Name des Agenten, der Prompt-Entwürfe verbessert. Leer lassen, um die Prompt-Verbesserung abzuschalten.
com.top_logic.ai.chat.view.ChatConversationElement.Config.prompts = Fragenkarten
com.top_logic.ai.chat.view.ChatConversationElement.Config.prompts.tooltip = Die ersten Fragen, die diese Seite anbietet, als Karten, auf die der Nutzer klickt, statt sie einzutippen. <p> Ein Klick füllt den Composer; gesendet wird nichts. Der Nutzer liest den Satz und drückt auf „Senden“ – es gilt dieselbe Regel wie für die Kanäle „Entwurf“, „Referenz“ und „Zitat“, und sie ist der Grund dafür, dass eine Karte dort eine lange, präzise Frage anbieten kann, die niemand eintippen würde. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.quote = Zitat
com.top_logic.ai.chat.view.ChatConversationElement.Config.quote.tooltip = Optionaler Eingabekanal: Eine markierte Passage eines Objekts wird im Entwurf zu einem atomaren Referenz-Token; geschrieben wird eine Map mit dem, was das Token trägt. <p> Das, was der Kanal „Referenz“ nicht ausdrücken kann. Jener Kanal nimmt ein Objekt, dessen zitierter Text alles ist, was dieses Element über es weiß; wer in der eigenen Ansicht des Hosts einen Absatz markiert hat, möchte genau diesen Absatz zitiert sehen, und nur die Ansicht, die ihn angezeigt hat, weiß, welcher es ist. Dieser Kanal nimmt daher das Token selbst - das Objekt, aus dem die Passage stammt, die Passage und wahlweise eine Bezeichnung, eine Fundstelle und eine Art: </p> <pre> &lt;chat-conversation quote="chatQuote"/&gt; </pre> <p> Geschrieben wird eine Map, also das, was ein TL-Script-Ausdruck liefert: </p> <pre> section -&gt; {"id": $section, "location": "02 Kontext", "text": $marked} </pre> <p> Unter „id“ steht normalerweise das Modellobjekt selbst und kein ausgeschriebener Bezeichner: Das Element füllt dann die Art, die stabile ID und die Bezeichnung daraus - wobei ein verschachteltes „<mention>“ über die Bezeichnung mitbestimmt -, und der Schreibvorgang muss nur noch die Passage benennen. Eine Map ohne „text“ sagt nichts, denn ein Objekt ohne Passage ist das, wofür es den Kanal „Referenz“ gibt. Wie dieser wird auch dieser Kanal nur gelesen und nie geschrieben. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.react-element = React-Element
com.top_logic.ai.chat.view.ChatConversationElement.Config.react-element.tooltip = Registriertes React-Element, das diese Unterhaltung rendert. Standardmäßig ist „TLChatConversation“ eingestellt. Im Layout-Editor ausgeblendet: Der Wert muss mit einer Registrierung in TypeScript übereinstimmen.
com.top_logic.ai.chat.view.ChatConversationElement.Config.reference = Referenz
com.top_logic.ai.chat.view.ChatConversationElement.Config.reference-source = Referenzquelle
com.top_logic.ai.chat.view.ChatConversationElement.Config.reference-source.tooltip = Name einer registrierten Referenzquelle (bezeichnet eine im Code eingerichtete Komponente). Ist dieser Name leer und es liegt keine Erwähnungsbindung vor, wird der @-Picker ausgeblendet. Eine Erwähnungsbindung hat Vorrang vor diesem Namen. Im Layout-Editor ausgeblendet: Der Wert muss mit einer Registrierung in TypeScript übereinstimmen; ein Designer verknüpft @ stattdessen mit der Erwähnungsgruppe.
com.top_logic.ai.chat.view.ChatConversationElement.Config.reference.tooltip = Optionaler Eingabekanal: Ein hierhin geschriebenes Modellobjekt wird im Entwurf zu einem atomaren Referenz-Token, genau so, als hätte man es im @-Menü ausgewählt. <p> Das Token trägt die Bezeichnung des Objekts, dessen stabile ID und den zitierten Text, den der „text“-Ausdruck eines verschachtelten „ <mention> “ berechnet - ohne „ <mention> “ ist die Bezeichnung zugleich der zitierte Text, da das Element sonst nichts über das Objekt weiß. Das Token landet an der Cursorposition, sodass ein Host einen Satz nach „draft“ schreiben und eine Referenz hineinsetzen kann. </p> <p> Dieser Kanal wird nur gelesen, nie geschrieben: Der Composer meldet seine Token nicht zurück, denn der Entwurf, in dem sie stehen, ist bereits das, was „draft“ trägt. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.selection = Auswahl
com.top_logic.ai.chat.view.ChatConversationElement.Config.selection.tooltip = Das vom Benutzer ausgewählte Objekt, dem Agenten in einer Zeile mitgeteilt. <p> Die Frage, die damit beantwortet wird, ist die, die jeder Benutzer als Erstes stellt – „Was ist mit dem, das ich gerade geöffnet habe?“ – und die Kurzform für den „ <fact> “, die niemand schreibt, da man dafür wissen müsste, wie dieses Produkt einen Objektbezeichner schreibt. Geben Sie den Auswahlkanal der Seite an, und die Konversation gibt das ausgewählte Objekt mit seinem Typ und diesem Bezeichner als turnbezogene Tatsache des Blocks „ <turn-context> “ an: </p><pre> &lt;chat-conversation input="chatSession"&gt; &lt;selection channel="selectedInvoice"/&gt; &lt;/chat-conversation&gt; </pre> <p> Nie stabil: Was der Benutzer ausgewählt hat, ändert sich in einer Konversation am häufigsten; daher wird es im Gesprächszug weitergegeben und niemals in der Systemaufforderung. </p> <p> Ein „ <chat-dock/> “ gibt dies auf dieselbe Weise an, und zwar über den darin verschachtelten „ <chat-conversation/> “ – und das sollte auch so sein, denn im Dock fragt der Benutzer nach der dahinterliegenden Seite. Dazu muss dem eigenen Kanal des Docks die Auswahl der Seite übergeben werden: ein „ <page-selection> “ auf jeder Seite und „ <chat-channels> “ in der Shell. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.subject = Bezugsobjekt
com.top_logic.ai.chat.view.ChatConversationElement.Config.subject-factory = Fabrik für das Bezugsobjekt
com.top_logic.ai.chat.view.ChatConversationElement.Config.subject-factory.tooltip = Optionale TL-Script-Funktion, die das Bezugsobjekt einer Unterhaltung mit ihrer ersten Nachricht anlegt. <p> Für eine Anwendung, in der jede Unterhaltung ein eigenes Objekt hat, das mit der Unterhaltung entsteht. Die Funktion bekommt den Text der ersten Nachricht und die Liste ihrer angehängten Dateien (als Binärdaten) und liefert das Bezugsobjekt: </p> <pre> &lt;chat-conversation input="chatSession" subject="task" subject-type="my.module:Task" subject-factory="text -&gt; attachments -&gt; { task = new(`my.module:Task`); $task.set(`my.module:Task#name`, $text); $task; }"/&gt; </pre> <p> Sie wird nur von der ersten Nachricht einer Unterhaltung aufgerufen, die die Unterhaltung anlegt, und nur, solange der Kanal <i>Bezugsobjekt</i> kein Objekt hält; ein Objekt dort ist das Bezugsobjekt wie ohne Funktion. Sie läuft nach allem, was die Nachricht ohne die Unterhaltung ablehnen kann, in einer eigenen Transaktion und als das angemeldete Konto. Eine <i>TopLogic-Ausnahme</i>, die sie wirft, lehnt die Nachricht mit ihrem Text ab und legt nichts an; ebenso ein Ergebnis, das kein Objekt des <i>Typs des Bezugsobjekts</i> ist. Danach entsteht die Unterhaltung über das neue Objekt, und der Kanal <i>Bezugsobjekt</i> zeigt es. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.subject-type = Typ des Bezugsobjekts
com.top_logic.ai.chat.view.ChatConversationElement.Config.subject-type.tooltip = Der Typ der Objekte, die die <i>Fabrik für das Bezugsobjekt</i> anlegt. <p> Pflicht zu einer Fabrik für das Bezugsobjekt. Ein leerer Chat bietet die Bedienelemente einer Unterhaltung über ein Objekt dieses Typs an, solange der Kanal <i>Bezugsobjekt</i> kein Objekt hält. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.subject.tooltip = Optionaler Kanal, der das Objekt benennt, um das es in einer hier begonnenen Unterhaltung geht. <p> Was in diesem Kanal steht, wenn die erste Nachricht des Benutzers die Unterhaltung entstehen lässt, wird auf dieser Sitzung als tl.ai.execution:AgentSession#subject festgehalten und bleibt dort. Eine Seite, auf der es jeweils um ein Objekt geht - ein Projekt, einen Beleg, einen Vertrag -, bekommt so eine Unterhaltung je Objekt, ohne sich selbst etwas merken zu müssen: </p> <pre> &lt;chat-conversation input="chatSession" subject="project"/&gt; </pre> <p> Nur nach außen. Welche Unterhaltung angezeigt wird, bleibt Sache des Kanals „Eingabe“, und aus welchen Unterhaltungen der Benutzer wählen kann, bleibt Sache der „ <data-list> “ - eingegrenzt, indem das Objekt nach den Sitzungen gefragt wird, die auf es verweisen: </p> <pre> &lt;rows&gt;project -&gt; ifElse(isEmpty($project), list(), $project.referers(`tl.ai.execution:AgentSession#subject`) .filter(s -&gt; $s.get(`tl.ai.execution:AgentSession#owner`) == currentUser()))&lt;/rows&gt; </pre> <p> Eine Unterhaltung wird einmal festgeschrieben, von der Anfrage, die sie entstehen lässt - bevor ihre erste Nachricht gesendet wird, sodass ein <i>ConversationBackendResolver</i>, der nach dem Bezugsobjekt entscheidet, schon diese Nachricht beantwortet. Wird eine ältere geöffnet, während hier ein anderes Objekt steht, wandert sie nicht dorthin, und eine Unterhaltung, die bei leerem Kanal begonnen wurde, behält kein Bezugsobjekt, statt später eines zu bekommen - es sei denn, die <i>Fabrik für das Bezugsobjekt</i> legt mit der ersten Nachricht der Unterhaltung eines an, das dieser Kanal dann zeigt. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.trace = Detailgrad
com.top_logic.ai.chat.view.ChatConversationElement.Config.trace.tooltip = Inwieweit die Ausführung des Agenten im Protokoll angezeigt wird: gar nicht, als zusammengefasste Übersicht oder als vollständiger Inline-Trace. Der Benutzer kann dies weiterhin live über die Trace-Auswahl des Composers ändern.
com.top_logic.ai.chat.view.ChatConversationElement.Config.working-indicator = Arbeitsanzeige
com.top_logic.ai.chat.view.ChatConversationElement.Config.working-indicator.tooltip = Was dort steht, wo die Antwort erscheinen wird, solange der Agent arbeitet und noch nichts geschrieben hat - im eigenen Erscheinungsbild dieser Anwendung, z. B. ihr Logo als Animation. <p> Leer behält die drei pulsierenden Punkte des Chats bei. Andernfalls eine von drei Formen, in der Höhe der ersten Textzeile (das Token --chat-working-indicator-size): </p> <ul> <li>Eine SVG-Datei, z. B. /images/app-working.svg. Sie wird in die Seite selbst eingesetzt statt als Bild gezeigt, kann also in currentColor oder in den Farben des Designs (var(--text-secondary)) zeichnen und passt dann gleichermaßen zum hellen und zum dunklen Design. Das Stylesheet in ihr gilt deshalb für die ganze Seite: Ihre Klassen brauchen ein Präfix der Anwendung.</li> <li>Eine Icon-Klasse, z. B. css:app-working, die das Stylesheet der Anwendung zeichnet und animiert - die Form für ein Bild, das je Design verschieden ist, weil dieses Stylesheet es über [data-theme] wählen kann.</li> <li>Jedes andere Bild, z. B. ein animiertes .webp, so gezeigt, wie es ist.</li> </ul> <p> Wer beim System weniger Bewegung eingestellt hat, sieht das SVG und die Icon-Klasse stillstehen: Der Chat hält ihre CSS-Animationen an und pausiert die eigenen Animationen eines SVG. Ein animiertes Rasterbild lässt sich von außen nicht anhalten - der Grund, die anderen beiden Formen vorzuziehen. </p> <p> Rein dekorativ, wie die Punkte: Was der Screenreader ansagt, während der Agent arbeitet, ist der Statustext des Chats selbst, was immer hier eingestellt ist. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Config.writable = Beschreibbar
com.top_logic.ai.chat.view.ChatConversationElement.Config.writable.tooltip = Optionale TL-Script-Funktion der offenen tl.ai.execution:AgentSession, die entscheidet, ob sie in diesem Element überhaupt geschrieben werden darf. <p> Wer eine Konversation lesen oder schreiben darf, wird durch die modellbasierte Berechtigung festgelegt: „Read“ auf der Sitzung zeigt sie an, „Write“ ermöglicht es dem Konto, Beiträge zu senden und sie zu ändern. Diese Funktion schränkt „Write“ aus Gründen ein, die nichts mit Berechtigungen zu tun haben, z. B. bei einer Konversation über ein Objekt, das archiviert wurde: </p><pre> &lt;chat-conversation input="chatSession" subject="project" writable="s -&gt; $s.get(`tl.ai.execution:AgentSession#subject`).get(`my.module:Project#closed`) != true"/&gt; </pre> <p> Die Sitzung kann beschrieben werden, wenn das Konto „Write“ auf ihr hat und die Funktion „true“ zurückgibt. Andernfalls wird die Unterhaltung schreibgeschützt angezeigt: ohne die Eingabezeile und ohne die Aktionen, die sie ändern, und der Server lehnt solche Befehle ab. Eine neue Unterhaltung, die noch keine Sitzung hat, ist immer beschreibbar. Leer: Allein „Write“ entscheidet. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Context.facts = Fakten
com.top_logic.ai.chat.view.ChatConversationElement.Context.facts.tooltip = Die Fakten selbst, in der Reihenfolge, in der sie im Modell ankommen. <p> Der Standardcontainer, d. h., eine Tatsache wird als direktes untergeordnetes Element des Kontexts geschrieben und nicht innerhalb eines eigenen Wrapper-Elements. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Context.inputs = Eingaben
com.top_logic.ai.chat.view.ChatConversationElement.Context.inputs.tooltip = Verweise auf Kanäle, deren Werte in der Reihenfolge ihrer Auflistung zu den führenden Positionsargumenten jedes Faktenausdrucks werden.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.agent-picker = Agentenauswahl
com.top_logic.ai.chat.view.ChatConversationElement.Controls.agent-picker.tooltip = Ob die Agentenauswahl angeboten wird.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.attachments = Anhänge
com.top_logic.ai.chat.view.ChatConversationElement.Controls.attachments.tooltip = Ob Dateien angehängt werden können.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.auto-approve = Automatisch genehmigen
com.top_logic.ai.chat.view.ChatConversationElement.Controls.auto-approve.tooltip = Ob der Schalter für die automatische Genehmigung angezeigt wird.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.enter-hint = Enter-Hinweis
com.top_logic.ai.chat.view.ChatConversationElement.Controls.enter-hint.tooltip = Ob die Fußzeile den Enter-Hinweis zeigt.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.mcp = MCP
com.top_logic.ai.chat.view.ChatConversationElement.Controls.mcp.tooltip = Ob MCP-Server umgeschaltet werden können.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.model-picker = Modellauswahl
com.top_logic.ai.chat.view.ChatConversationElement.Controls.model-picker.tooltip = Ob der Modellauswähler angeboten wird.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.thinking = Denkaufwand
com.top_logic.ai.chat.view.ChatConversationElement.Controls.thinking.tooltip = Ob Aufwandstufen angeboten werden.
com.top_logic.ai.chat.view.ChatConversationElement.Controls.trace-picker = Trace-Auswahl
com.top_logic.ai.chat.view.ChatConversationElement.Controls.trace-picker.tooltip = Ob die Trace-Modus-Auswahl angeboten wird.
com.top_logic.ai.chat.view.ChatConversationElement.Fact.name = Name
com.top_logic.ai.chat.view.ChatConversationElement.Fact.name.tooltip = Wie die Instanz vor dem Modell bezeichnet wird, z. B. „Projekt“.
com.top_logic.ai.chat.view.ChatConversationElement.Fact.stable = Stall
com.top_logic.ai.chat.view.ChatConversationElement.Fact.stable.tooltip = Ob der Wert für die gesamte Unterhaltung gilt. <p> Nur eine unveränderliche Angabe gelangt in die Systemaufforderung. Lassen Sie diese Option für etwas aktiviert, das die Seite einmalig festlegt – das Projekt, zu dem ein Chat gehört –, und deaktivieren Sie sie für etwas, das sich nach den Klicks des Nutzers richtet. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Fact.value = Wert
com.top_logic.ai.chat.view.ChatConversationElement.Fact.value.tooltip = TL-Script berechnet den Wert und verwendet dabei die umgebenden Eingaben als erste Argumente.
com.top_logic.ai.chat.view.ChatConversationElement.Mention.label = Bezeichnung
com.top_logic.ai.chat.view.ChatConversationElement.Mention.label.tooltip = Optionales TL-Skript für ein Objekt, das seine angezeigte Beschriftung und die Beschriftung der Erwähnung berechnet. Bei leerer Eingabe wird die eigene Beschriftung des Objekts verwendet.
com.top_logic.ai.chat.view.ChatConversationElement.Mention.limit = Höchstzahl
com.top_logic.ai.chat.view.ChatConversationElement.Mention.limit.tooltip = Höchstens so viele Kandidaten werden an den Browser übertragen. Die Liste wird im Browser während der Eingabe gefiltert; dies begrenzt also die Datenmenge, nicht die Suche.
com.top_logic.ai.chat.view.ChatConversationElement.Mention.observed-types = Beobachtete Typen
com.top_logic.ai.chat.view.ChatConversationElement.Mention.observed-types.tooltip = Typen, bei denen sich das Objekt ändert (Erstellen / Aktualisieren / Löschen), führen <i>die Zeilen</i> erneut aus, sodass die Kandidatenmenge automatisch aktualisiert wird.
com.top_logic.ai.chat.view.ChatConversationElement.Mention.rows = Zeilen
com.top_logic.ai.chat.view.ChatConversationElement.Mention.rows.tooltip = Eine TL-Script-Funktion, die die Objekte berechnet, die @ erwähnen kann (eine <i>Sammlung</i>), ähnlich wie bei der Bindung von Zeilen in „ <data-list> “ und „ <table> “.
com.top_logic.ai.chat.view.ChatConversationElement.Mention.text = Text
com.top_logic.ai.chat.view.ChatConversationElement.Mention.text.tooltip = Optionales TL-Skript für ein Objekt, das den Zitattext berechnet, den die Erwähnung in die Nachricht einfügt – das, was der Agent vorliest. Bei leerer Angabe wird die Bezeichnung verwendet.
com.top_logic.ai.chat.view.ChatConversationElement.PlaceholderBy.inputs = Eingaben
com.top_logic.ai.chat.view.ChatConversationElement.PlaceholderBy.inputs.tooltip = Verweise auf Kanäle, deren Werte in der Reihenfolge ihrer Auflistung zu den Positionsargumenten des Werts werden.
com.top_logic.ai.chat.view.ChatConversationElement.PlaceholderBy.value = Wert
com.top_logic.ai.chat.view.ChatConversationElement.PlaceholderBy.value.tooltip = TL-Script, das den Text in der Sprache des Benutzers berechnet, z. B. mit #("..."@en, "..."@de). Ein leeres Ergebnis lässt den festen Platzhalter gelten.
com.top_logic.ai.chat.view.ChatConversationElement.Prompt.icon = Symbol
com.top_logic.ai.chat.view.ChatConversationElement.Prompt.icon.tooltip = Das Symbol auf der Karte, z. B. css:bi bi-receipt. <p> Benannt so, wie ein Abschnitt „ <side-rail> “ sein Symbol benennt. Karten ohne Symbol zeigen nur ihre Bezeichnung an – genau so sollte es bei einer Reihe von Karten sein, bei denen ein Symbol nichts hinzufügen würde. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Prompt.label = Bezeichnung
com.top_logic.ai.chat.view.ChatConversationElement.Prompt.label.tooltip = Was auf der Karte steht, in der Sprache des Benutzers. <p> Die Kurzform der Frage, nicht die Frage selbst: Die Karte umfasst eine Zeile, während der Wert, der dort eingetragen wird, einen ganzen Absatz umfassen kann. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Prompt.value = Wert
com.top_logic.ai.chat.view.ChatConversationElement.Prompt.value.tooltip = TL-Script berechnet den Text, den der Klick in den Composer einfügt, wobei die umgebenden Eingaben als erste Argumente verwendet werden.
com.top_logic.ai.chat.view.ChatConversationElement.Prompts.cards = Karten
com.top_logic.ai.chat.view.ChatConversationElement.Prompts.cards.tooltip = Die Karten selbst, in der Reihenfolge, in der sie angezeigt werden. <p> Der Standard-Container, sodass eine Karte als direktes untergeordnetes Element des Abschnitts geschrieben wird und nicht innerhalb eines eigenen Wrapper-Elements. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Prompts.inputs = Eingaben
com.top_logic.ai.chat.view.ChatConversationElement.Prompts.inputs.tooltip = Verweise auf Kanäle, deren Werte in der Reihenfolge ihrer Auflistung zu den führenden Positionsargumenten jedes Kartenausdrucks werden.
com.top_logic.ai.chat.view.ChatConversationElement.Selection.channel = Kanal
com.top_logic.ai.chat.view.ChatConversationElement.Selection.channel.tooltip = Der Kanal, der die Auswahl des Benutzers enthält – ein Objekt, mehrere Objekte oder nichts. <p> Normalerweise ist dies der Auswahlkanal der Tabelle oder Liste, aus der der Benutzer eine Auswahl trifft. Ein Kanal <em>dieser</em> Ansicht: Eine Seite einer Shell übergibt ihre Auswahl an ein Dock in der Fußzeile der Shell mit einem „ <page-selection> “, in einen Kanal, den „ <chat-channels> “ veröffentlicht. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Selection.label = Bezeichnung
com.top_logic.ai.chat.view.ChatConversationElement.Selection.label.tooltip = TL-Script ermittelt, wie ein ausgewähltes Objekt heißt, wobei dieses Objekt als Argument verwendet wird. <p> Wird das Feld leer gelassen, wird die anwendungsinterne Bezeichnung verwendet – das ist das, was der Benutzer auf dem Bildschirm sieht, und somit die richtige Antwort auf eine Frage dazu. Konfigurieren Sie hier einen Ausdruck, wenn die Bezeichnung eines Objekts nicht das ist, woran es in einem Satz zu erkennen ist. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Selection.name = Name
com.top_logic.ai.chat.view.ChatConversationElement.Selection.name.tooltip = Wie die Angabe vor dem Modell heißt. <p> Vom Modell gelesen, daher Englisch und keine Ressource, wie jeder andere Text, den ein Tool einem Modell vorlegt. Benennen Sie, was die Seite enthält – „Offene Rechnung“, „Ausgewählte Aufgabe“ –, wenn dies aussagekräftiger ist als die Standardbezeichnung. </p>
com.top_logic.ai.chat.view.ChatConversationElement.Trace.DETAILED = Ausführlich
com.top_logic.ai.chat.view.ChatConversationElement.Trace.DETAILED.tooltip = Der vollständige Ausführungsablauf, inline.
com.top_logic.ai.chat.view.ChatConversationElement.Trace.NONE = Keine
com.top_logic.ai.chat.view.ChatConversationElement.Trace.NONE.tooltip = Nur die Antwort; keine Details zur Ausführung.
com.top_logic.ai.chat.view.ChatConversationElement.Trace.SUMMARY = Zusammenfassung
com.top_logic.ai.chat.view.ChatConversationElement.Trace.SUMMARY.tooltip = Eine zusammengeklappte, einzeilige Zusammenfassung des Laufs, die der Benutzer aufklappen kann.
com.top_logic.ai.chat.view.ChatConversationElement.tooltip = Deklaratives „ <chat-conversation/> “-Element: Das Transkript und das Eingabefeld als ein Ansichtselement. <p> Führt die bisher getrennten Elemente „ <chat-thread/> “ und „ <chat-composer/> “ zusammen. Transkript und Eingabefeld befinden sich fast immer nebeneinander, daher bilden sie eine platzierbare Box; eine Sitzungsliste (ein „ <data-list> “ von „AgentSessions“) und eine Leiste (<side-rail>) bleiben getrennt, da diese tatsächlich unabhängig voneinander platziert werden sollen. Mehrere Chat-Elemente auf einer Seite nehmen über die „chat-id“ an derselben Unterhaltung teil. Der optionale Eingabekanal überträgt die geöffnete „AgentSession“; der optionale „busy“-Kanal wird auf „true“ gesetzt, während der Agent arbeitet, sodass ein Host seine eigenen Befehle deaktivieren kann. </p> <p> Vier weitere Kanäle übertragen die vom Benutzer für den nächsten Zug festgelegten Einstellungen: „agent“, „model“, „effort“ und „mcp-servers“. Jeder dieser Kanäle ist bidirektional – der Composer schreibt die Auswahl des Benutzers und reagiert auf Schreibvorgänge von außen –, sodass ein Host anzeigen kann, welcher Agent antwortet, eine Schaltfläche im Modell sperren oder einen Agenten für eine Seite vorab auswählen kann. Sie tragen die <em>Namen</em>, unter denen diese Elemente bekannt sind, da jede Anfrage – und die dahinterstehende Richtlinie für Berechtigungen – auf einem Namen basiert: Nur ein in der Wissensdatenbank erstellter Agent ist überhaupt ein Modellobjekt, während die mitgelieferten Agenten, die Modelle und die MCP-Server Teil der Konfiguration sind. Siehe <i>Kanäle für Chat-Runden</i>. </p> <p> „present“ ist die andere Richtung und die einzige, die der <em>Agent</em> steuert: Die dort genannten Kanäle sind diejenigen, in die ein Lauf mit dem „present“-Tool schreiben darf, und nichts anderes auf der Seite ist von einem Lauf aus erreichbar. <b>Standardmäßig verweigern</b> – ein Element, das keinen Namen angibt, lässt keinen Agenten in irgendeinen Kanal schreiben, und einem Lauf auf einer Seite, die keinen Namen angibt, wird das Tool überhaupt nicht angeboten. Siehe <i>„present“</i> und <i>das „chat present“-Tool</i>. </p> <p><agent-commands> Dies ist der andere Weg des Agenten auf die Seite, der standardmäßig ebenfalls verweigert wird: Die dort aufgeführten Befehle – gewöhnliche Befehle, deren Kette einen Dialog öffnet oder eine Ansicht anzeigt – sind diejenigen, die ein Lauf ausführen darf, und zwar nur, solange dieses Element angezeigt wird. Siehe <i>„Agent-Befehle“</i> und <i>„Chat-Befehls-Tool</i>“. </p> <p> Drei weitere Elemente enthalten den noch nicht gesendeten Text des Verfassers: „draft“ ist der Text selbst, bidirektional; „reference“ wandelt ein geschriebenes Modellobjekt in ein atomares Referenztoken innerhalb des Elements um; und „quote“ tut dasselbe für einen Textabschnitt <em>eines</em> Objekts, den nur der Betrachter benennen kann, der ihn angezeigt hat. Zusammen ermöglichen sie es, dass eine Schaltfläche an beliebiger Stelle auf der Seite eine Frage in den Chat einfügt, ohne dass eine einzige Zeile Code erforderlich ist – ein „ <execute-script> “, das den Satz oder den Abschnitt aufbaut, und ein „ <write-channel> “, das ihn schreibt. </p>
com.top_logic.ai.chat.view.ChatDockElement = Chat-Dock
com.top_logic.ai.chat.view.ChatDockElement.Config.chat-id = Chat-ID
com.top_logic.ai.chat.view.ChatDockElement.Config.chat-id.tooltip = Über welches Gespräch der Starter berichtet. <p> Anders als jedes andere Chat-Element muss dieses die ID erfahren, denn es <em>enthält</em> den „ <chat> “, statt darin zu stehen, und ein Chat-Bereich reicht nur nach unten. Trage hier dieselbe ID ein, die der eingebettete „ <chat> “ trägt. Leer gelassen nimmt das Dock am Gespräch „default“ teil, was für eine Seite richtig ist, deren Chat ebenfalls keine ID nennt. </p>
com.top_logic.ai.chat.view.ChatDockElement.Config.class.tooltip = Die Implementierung des Elements. Im Layout-Editor ausgeblendet: Das Tag legt sie bereits fest, und eine Änderung ergibt ein Element, das nicht mehr zu den daneben angezeigten Optionen passt.
com.top_logic.ai.chat.view.ChatDockElement.Config.content = Inhalt
com.top_logic.ai.chat.view.ChatDockElement.Config.content.tooltip = Was das Panel zeigt, geschrieben als Kinder des „ <chat-dock> “. <p> Jedes Anzeigeelement; üblicherweise ein „ <chat> “ mit dem Gespräch und allem, was die Anwendung daneben zeigen will. Der Inhalt nimmt die Höhe des geöffneten Panels ein, und ein Gespräch darin scrollt dort, statt mit seinem Verlauf zu wachsen. Mehrere Kinder stehen untereinander, und die füllenden teilen sich die Höhe, die die anderen übrig lassen. </p>
com.top_logic.ai.chat.view.ChatDockElement.Config.icon = Symbol
com.top_logic.ai.chat.view.ChatDockElement.Config.icon.tooltip = Das Symbol auf der Startschaltfläche, z. B. css:bi bi-stars. Es handelt sich um dasselbe Vokabular, das auch bei <nav-item> oder <side-rail> <section> verwendet wird. Solange das Panel geöffnet ist, zeigt die Schaltfläche stattdessen ein Schließkreuz an; dies ist also das Symbol für den geschlossenen Zustand.
com.top_logic.ai.chat.view.ChatDockElement.Config.label = Bezeichnung
com.top_logic.ai.chat.view.ChatDockElement.Config.label.tooltip = Wie der Starter heißt: sein Tooltip und sein barrierefreier Name. Das einzige Wort, das ein Benutzer über das Dock liest; benenne also den Assistenten, nicht den Mechanismus - „Assistent“, nicht „Chat-Panel öffnen“. Leer gelassen wird die eigene Bezeichnung des Chats verwendet.
com.top_logic.ai.chat.view.ChatDockElement.Config.open = Geöffnet
com.top_logic.ai.chat.view.ChatDockElement.Config.open-channel = Kanal „offen“
com.top_logic.ai.chat.view.ChatDockElement.Config.open-channel.tooltip = Kanal, der folgt, ob das Panel offen ist, und es öffnet oder schließt, wenn er geschrieben wird. <p> Binden Sie ihn in den Inhalt als Kanal „shown“ einer <side-rail>, sodass die Seitenspalte nichts als gesehen zählt, solange das Dock geschlossen ist, und ihr Badge-Kanal - auf dem Launcher als dessen Badge gezeigt - weiter zählt, was hereinkommt. Leer lassen, wenn nichts davon wissen muss. </p>
com.top_logic.ai.chat.view.ChatDockElement.Config.open.tooltip = Ob das Panel bereits offen ist, wenn die Seite zum ersten Mal gezeigt wird. <p> Der Zustand beim ersten Laden und nicht mehr: Das Dock merkt sich nicht, was der Benutzer damit getan hat, also beginnt jedes Laden der Seite wieder hier. </p>
com.top_logic.ai.chat.view.ChatDockElement.Config.personalization-key.tooltip = Optionale Überschreibung des automatisch abgeleiteten Personalisierungsschlüssels. Im Layout-Editor ausgeblendet: Der aus dem Ansichtskontext abgeleitete Schlüssel ist der richtige, und ein von Hand eingetragener Wert verschiebt stillschweigend, was ein Benutzer personalisiert hat.
com.top_logic.ai.chat.view.ChatDockElement.Config.react-element = React-Element
com.top_logic.ai.chat.view.ChatDockElement.Config.react-element.tooltip = Registriertes React-Element, das dieses Dock rendert. Standardwert ist „TLChatDock“. Im Layout-Editor ausgeblendet: Der Wert muss mit einer Registrierung in TypeScript übereinstimmen.
com.top_logic.ai.chat.view.ChatDockElement.tooltip = Deklaratives „ <chat-dock/> “-Element: Ein schwebender Launcher, der den Chat über der Seite öffnet. <p> Das Dock ist ein Rahmen und nichts weiter. Im geschlossenen Zustand nimmt es nur eine Schaltfläche in der Ecke des Fensters ein; im geöffneten Zustand zeigt es in einer Karte über der Seite alles an, was die darin eingebettete Anwendung enthält – normalerweise ein „ <chat> “, das ein geteiltes Panel mit einer Sitzungsliste, einem „ <chat-conversation/> “ und einem „ <side-rail> “ enthält, aber jedes View-Element ist geeignet. Woraus der Assistent <em>besteht,</em> bleibt der Entscheidung der Anwendung überlassen, genau wie auf einer eigenen Seite. </p> <p> Beim Öffnen findet kein Neuanordnung statt: Das Panel ist eine Karte mit fester Position über dem Arbeitsbereich, sodass kein Fenster erscheint, keine Tabelle schmaler wird und das Schließen die Seite unverändert zurückbringt. Die dahinterliegende Seite bleibt nutzbar, solange das Dock geöffnet ist. </p> <p><b>Da das Dock den Chat enthält, kann es nicht von diesem erben.</b> Jedes andere Chat-Element bezieht seine Konversation aus dem umschließenden ` <chat>`, doch ein Geltungsbereich erstreckt sich nur nach unten, und hier ist ` <chat> ` das untergeordnete Element. Das Dock wiederholt daher die ID: </p><pre> &lt;CHAT-dock chat-id="assistant" Symbol="css:bi bi-stars" badge="railBadge" open-channel="dockOpen"&gt; Bezeichnung &lt;EN&gt;&lt;EN&gt;Assistant&lt;/EN&gt;&lt;DE&gt;Assistent&lt;/DE&gt;&lt;/BEZEICHNUNG &gt; &lt;chat chat-id="assistant"&gt; &lt;split-panel orientation="horizontal" resizable="true"&gt; &lt;panes&gt; &lt;pane size="100" unit="%"&gt; &lt;panel fill="true"&gt;&lt;chat-conversation input="dockSession"/&gt;&lt;/panel&gt; &lt;/pane&gt; &lt;pane size="300" unit="px"&gt; &lt;side-rail side="right" badge-channel="railBadge" shown="dockOpen"&gt;...&lt;/side-rail&gt; &lt;/pane&gt; &lt;/panes&gt; &lt;/split-panel&gt; &lt;/chat&gt; &lt;/chat-dock&gt; </pre> <p> Die beiden IDs müssen übereinstimmen; eine Nichtübereinstimmung wird gemeldet und nicht einfach ignoriert: <i>Das Chat-Beitrittsprotokoll</i> warnt vor einem Fenster, dessen Chat-IDs nicht übereinstimmen – genau das ist die Folge eines Tippfehlers an dieser Stelle. </p> <p> Das Dock benötigt die ID für seinen „Beschäftigt“-Punkt, den es aus dem Browser-Speicher dieser Konversation ausliest: Der Punkt ändert sich während der Arbeit des Agenten mehrmals pro Sekunde, und ein Befehls-Roundtrip für einen Punkt entspricht nicht dem Zweck eines Kanals. Die Zählung des Launchers erfolgt über den Badge-Kanal, typischerweise den Badge-Kanal eines darin enthaltenen „ <side-rail> “, dessen angezeigter Kanal der „open-channel“ des Docks ist: Was hereinkommt, während das Dock geschlossen ist, bleibt unsichtbar. </p> <p><b>VORÜBERGEHENDE ABZWEIGUNG.</b> An einem schwebenden Launcher ist nichts chat-spezifisch, außer seinem „Beschäftigt“-Punkt. <b>Übergeordnetes Ziel:</b> eine generische „ <dock> “-Shell im „tl-layout-view“, die beliebige Elemente hostet, sodass „tl-chat“ nur den „Beschäftigt“-Punkt übernimmt. </p>
com.top_logic.ai.chat.view.ChatScopeElement = Chat
com.top_logic.ai.chat.view.ChatScopeElement.Config.chat-id = Chat-ID
com.top_logic.ai.chat.view.ChatScopeElement.Config.chat-id.tooltip = Die Unterhaltung, die die Chat-Elemente in diesem Element zeigen. Jedes darin liegende Element, das keine eigene Chat-ID nennt, tritt dieser bei. Standard ist „default“ - dieselbe Unterhaltung, der ein Element außerhalb jedes „ <chat> “ beitritt, sodass eine Seite mit einer einzigen Unterhaltung gar keine ID braucht. Eine ID vergeben, wo eine Seite zwei Chats hält, damit jeder sagt, welcher er ist.
com.top_logic.ai.chat.view.ChatScopeElement.Config.children.tooltip = Das eine Element, für das dieser <chat> das Gespräch festlegt. <p> Genau ein Element, direkt im <chat> geschrieben. Mehrere Elemente kommen in ein Layout-Element, z.B. ein <split-panel> oder einen <stack>, als dessen einzigen Inhalt. </p>
com.top_logic.ai.chat.view.ChatScopeElement.Config.class.tooltip = Die Implementierung des Elements. Im Layout-Editor verborgen: Das Tag sorgt bereits für die Korrektur, und eine Änderung führt dazu, dass das Element nicht mehr mit den daneben angezeigten Optionen übereinstimmt.
com.top_logic.ai.chat.view.ChatScopeElement.Config.css-class.tooltip = CSS-Klasse des Elements. Im Layout-Editor nicht sichtbar: Ein „ <chat> “ hat kein eigenes Element auf der Seite, dem diese Klasse zugewiesen werden könnte; sein Inhalt verfügt über eine eigene Klasse.
com.top_logic.ai.chat.view.ChatScopeElement.Config.personalization-key.tooltip = Optionale Überschreibung des automatisch abgeleiteten Personalisierungsschlüssels. Im Layout-Editor verborgen: Ein „ <chat> “ speichert selbst keine Daten, und der Schlüssel seines Inhalts wird aus dem Ansichtskontext abgeleitet.
com.top_logic.ai.chat.view.ChatScopeElement.tooltip = Deklaratives „ <chat> “-Element: Die Konversation, die in den verschachtelten Chat-Elementen angezeigt wird. <p> Die Elemente, aus denen ein Chat aufgebaut ist – ein „ <chat-conversation/> “, ein „ <chat-dock> “ und die eigenen Elemente des Chats in den Abschnitten eines „ <side-rail> “ – zeigen eine Konversation an, wenn sie sich auf eine „chat-id“ einigen. Wird diese ID in jedes einzelne Element geschrieben, wird die stärkste Kopplung auf der Seite zum am wenigsten sichtbaren Aspekt: Ein Tippfehler in einem Attribut eröffnet eine zweite, leere Konversation, und nichts weist darauf hin. Werden sie in ein „ <chat> “ eingeschlossen, wird die ID nur einmal geschrieben und jedes Element darin erbt sie, sodass die Gruppierung dort deklariert wird, wo sie gelesen werden kann: </p><pre> &lt;chat chat-id="support"&gt; &lt;split-panel orientation="horizontal" resizable="true"&gt; &lt;panes&gt; &lt;pane size="100" unit="%"&gt; &lt;panel fill="true"&gt;&lt;chat-conversation input="chatSession"/&gt;&lt;/panel&gt; &lt;/pane&gt; &lt;pane size="300" unit="px"&gt; &lt;side-rail side="right"&gt;...&lt;/side-rail&gt; &lt;/pane&gt; &lt;/panes&gt; &lt;/split-panel&gt; &lt;/chat&gt; </pre> <p> Ein Element innerhalb des Elements kann weiterhin eine eigene Chat-ID angeben; dies ist die Überschreibung, und ein Element außerhalb jedes „ <chat> “ wird auf <code>"default"</code> gesetzt. </p> <p> Ein „ <chat> “ ist ein Geltungsbereich und nichts anderes: Es enthält genau ein Element und zeigt dieses unverändert an, ohne ein eigenes Element auf der Seite zu besitzen, sodass der Inhalt die Höhe des Bereichs ausfüllt, in dem das „ <chat> “ steht, als stünde es selbst dort. Mehrere Elemente werden in ein Layout-Element – ein „ <split-panel> “ oder ein „ <stack> “ – als dessen einzigen Inhalt eingefügt. Jedes Element kann dieser Inhalt sein, egal ob es sich um ein Chat-Element handelt oder nicht: Ein „ <chat> “, das eine ganze Seite umschließt, ist ebenso zulässig wie eines, das eine einzelne Unterhaltung umschließt. </p>
com.top_logic.ai.chat.view.ChatSectionElement.Config.badge = Kennzahl
com.top_logic.ai.chat.view.ChatSectionElement.Config.badge.tooltip = Optionaler Kanal, in den dieser Abschnitt seine Anzahl schreibt - wie viele der dort gezeigten Dinge es gerade gibt. Nennen Sie denselben Kanal als Badge des Abschnitts der <side-rail>, die die Zahl neben den Titel des Abschnitts und auf sein Streifen-Symbol setzt und in ihren Badge-Kanal zählt. Leer lassen für einen Abschnitt, der nichts zu zählen hat.
com.top_logic.ai.chat.view.ChatSectionElement.Config.chat-id = Chat-ID
com.top_logic.ai.chat.view.ChatSectionElement.Config.chat-id.tooltip = Welche Unterhaltung dieser Abschnitt zeigt, wenn es nicht die des umgebenden „ <chat> “ sein darf. Leer lassen: Ein Abschnitt in einem „ <chat> “ zeigt dessen Unterhaltung, einer außerhalb jedes „ <chat> “ die Unterhaltung „default“, sodass die Teile einer Seite einander finden, ohne dass es ihnen gesagt wird. Nur setzen, um aus dem umgebenden Chat auszubrechen.
com.top_logic.ai.chat.view.ChatSectionElement.Config.personalization-key.tooltip = Optionale Überschreibung des automatisch abgeleiteten Personalisierungsschlüssels. Im Layout-Editor ausgeblendet: Der aus dem Ansichtskontext abgeleitete Schlüssel ist der richtige, und ein von Hand eingetragener Wert verschiebt stillschweigend, was ein Benutzer personalisiert hat.
com.top_logic.ai.chat.view.ChatSectionElement.Config.react-element = React-Element
com.top_logic.ai.chat.view.ChatSectionElement.Config.react-element.tooltip = Registriertes React-Element, das diesen Abschnitt rendert. Im Layout-Editor ausgeblendet: Der Wert muss mit einer Registrierung in TypeScript übereinstimmen.
com.top_logic.ai.chat.view.ChatSourcesElement = Chat-Quellen
com.top_logic.ai.chat.view.ChatSourcesElement.Config.class.tooltip = Die Implementierung des Elements. Im Layout-Editor ausgeblendet: Das Tag legt sie bereits fest, und eine Änderung ergibt ein Element, das nicht mehr zu den daneben angezeigten Optionen passt.
com.top_logic.ai.chat.view.ChatSourcesElement.Config.react-element.tooltip = Registriertes React-Element, das diesen Abschnitt rendert. Standardwert ist „TLChatSources“. Im Layout-Editor ausgeblendet: Der Wert muss mit einer Registrierung in TypeScript übereinstimmen.
com.top_logic.ai.chat.view.ChatSourcesElement.tooltip = Deklaratives „ <chat-sources/> “-Element: Was in dieser Unterhaltung zitiert wurde, z. B. als Abschnitt eines <side-rail>. <p> Eine Zeile pro Quelle, in der Reihenfolge, in der sie in den Antworten erstmals zitiert wurden, mit den Markierungsnummern, die darauf verweisen – eine Nummer scrollt zur entsprechenden Antwort, die Zeile öffnet die Quelle. Eine lange Liste verfügt über einen Filter. Der optionale Badge-Kanal erhält die Anzahl der vorhandenen Quellen, sodass der Badge in der Leiste diejenigen zählt, die seit dem letzten Blick des Nutzers zitiert wurden. </p>
com.top_logic.ai.chat.view.ChatWindowService = Chat-Fenster-Dienst
com.top_logic.ai.chat.view.ChatWindowService.Config.write-timeout-millis = Schreib-Timeout in Millisekunden
com.top_logic.ai.chat.view.ChatWindowService.Config.write-timeout-millis.tooltip = Wie lange ein Schreibvorgang in ein Fenster auf die Interaktion dieses Fensters wartet, in Millisekunden. <p> Die Interaktion ist belegt, während das Fenster einen Browserbefehl ausführt. Ein Schreibvorgang, der aufgibt, teilt dem Modell mit, dass die Seite nicht erreicht werden konnte, und das Modell kann es erneut versuchen. </p>
com.top_logic.ai.chat.view.ChatWindowService.tooltip = Verbindet Agent-Läufe mit den Browserfenstern, in denen der Chat angezeigt wird. <p> Ein Agent-Tool eines Laufs schreibt in das Browserfenster, zu dem der Lauf gehört, um beispielsweise Objekte auf einem Kanal der Seite anzuzeigen; ein solcher Schreibvorgang wartet höchstens <i>Schreib-Timeout in Millisekunden</i> auf einen laufenden Browserbefehl. Ein gelöschter Chat wird aus jedem geöffneten Fenster seines Besitzers entfernt. </p> <p> Die modellgebundenen Elemente eines Fensters folgen den Commits eines Laufs ohne diesen Dienst: Die Engine liefert die Commits anderer Threads selbstständig an jedes betroffene Fenster. </p>
com.top_logic.ai.chat.view.PageSelectionElement = Seitenauswahl
com.top_logic.ai.chat.view.PageSelectionElement.Config.class.tooltip = Die Implementierung des Elements. Im Layout-Editor ausgeblendet: Das Tag legt sie bereits fest.
com.top_logic.ai.chat.view.PageSelectionElement.Config.inputs = Eingaben
com.top_logic.ai.chat.view.PageSelectionElement.Config.inputs.tooltip = Die Kanäle dieser Seite, die ihre Auswahl halten, der genaueste zuerst. <p> Der erste Kanal, der ein Objekt hält, gibt den Wert, zum Beispiel der Abschnitt vor dem Dokument, das ihn enthält. Ein Kanal, der eine Menge mit genau einem Objekt hält, gibt dieses Objekt. Ein Kanal, der nichts oder mehrere Objekte hält, wird übersprungen. Hält kein Kanal ein Objekt, hat die Seite keine Auswahl. </p>
com.top_logic.ai.chat.view.PageSelectionElement.Config.to = Shell-Kanal
com.top_logic.ai.chat.view.PageSelectionElement.Config.to.tooltip = Der Shell-Kanal, der die Auswahl dieser Seite erhält. <p> Einer der Namen in „ <chat-channels channels="..."> “ der Shell. Es ist kein Kanal dieser Ansicht. </p>
com.top_logic.ai.chat.view.PageSelectionElement.tooltip = Deklaratives „ <page-selection/> “-Element: sagt dem Chat, welches Objekt diese Seite ausgewählt hat. <p> Setze es in die Ansicht einer Seite. Es zeigt nichts. Solange die Seite angezeigt wird, schreibt es die Auswahl der Seite in einen Shell-Kanal, den „ <chat-channels> “ nennt. Die Unterhaltung nennt diesen Kanal mit „ <selection> “. Verlässt die Seite den Bildschirm, entfernt das Element, was es geschrieben hat. </p> <pre> &lt;page-selection to="pageSelection"&gt; &lt;inputs&gt; &lt;input channel="selectedSection"/&gt; &lt;input channel="document"/&gt; &lt;/inputs&gt; &lt;/page-selection&gt; </pre> <p> Es wirkt dort, wo ein „ <bind> “ am „ <view-ref> “ der Seite nicht wirkt: in einem Rahmen eines Kachelstapels und in einer Seite, die ein Control selbst aufbaut. Siehe <i>Chat-Kanäle</i>. </p>
com.top_logic.ai.chat.view.PresentationPaneElement = Element „Präsentationsbereich“
com.top_logic.ai.chat.view.PresentationPaneElement.Config.input = Eingabe
com.top_logic.ai.chat.view.PresentationPaneElement.Config.input.tooltip = Kanal, der den Inhalt des Fensters enthält. <p> Ein Objekt wird als Formular angezeigt, mehrere als Tabelle, und das, was der Agent als Tabelle, Diagramm oder Formular präsentiert hat, das er angefordert hat. Die Schließen-Schaltfläche des Fensters schreibt „null“ zurück, die Zurück-Schaltfläche den zuvor angezeigten Wert. </p>
com.top_logic.ai.chat.view.PresentationPaneElement.tooltip = Deklaratives Element „ <presentation-pane input="…"> “: zeigt, was auf einem Kanal steht, für jeden Typ, und merkt sich, was es vorher zeigte. <p> Ein Objekt erscheint als sein Formular, mehrere als Tabelle mit den Spalten ihres Typs, und was das Tool „present“ des Agenten auf den Kanal gelegt hat, als die Tabelle, das Diagramm oder das Formular, das er verlangt hat. Ein Klick auf eine Zeile einer Tabelle öffnet das Formular dieses Objekts, und „Zurück“ kehrt zur Tabelle zurück, wie sie war. Schließen schreibt null in den Kanal. </p> <p> Nennen Sie den Kanal, in den die „ <chat-conversation present="…"> “ schreibt, damit der Agent hier Dinge zeigen kann. In einer „ <side-rail> “ ist der Bereich der Inhalt eines Abschnitts, der sichtbar ist, solange der Kanal etwas enthält: </p><pre> &lt;section name="presented" width="420"&gt; &lt;visibility inputs="paneObject" expr="!isEmpty($paneObject)"/&gt; &lt;presentation-pane input="paneObject"/&gt; &lt;/section&gt; </pre>
js.presentationPane.back = Zurück
js.presentationPane.close = Schließen
