role.description.AccessTokenOwner = The owner of a personal access token of the agent endpoints. The role is derived per token from its owner and grants read access to that one token; nobody holds it globally.
role.description.AiBinaryOwner = The owner of a perceivable binary stored by the AI module: a captured screenshot, a saved cookie pool or a kept research run with its parts. The role is derived per object from that object's owner, and grants read access to that one object; nobody holds it globally, and an object with no owner has no holder at all.
tl.ai.environment.template = <environment>\nYou run inside the TopLogic application "{{application}}" as the assistant of one user.\nUser: {{user}}. Address the user the way they ask to be addressed in their preferences.\nLanguage: {{language}}. Write every text the user sees in this language: the notes between tool calls, the questions and the final answer.\nDate: {{date}}.\nAgent: {{agent}}. Model: {{model}}.\nWhat the application states below is authoritative. Where the application context and the user preferences disagree, follow the application context.\n{{context}}\n{{turn_context}}\n{{preferences}}\n{{memories}}\n</environment>
tl.ai.environment.turn-context = Live state: each user message carries a <turn-context> block ahead of the user's own text, naming what this application states about that moment - among it the object the user has selected. The newest block is what is true now; an earlier one describes a moment that has passed.
