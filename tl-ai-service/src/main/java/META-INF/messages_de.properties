com.top_logic.ai.service.agents.AgentConfig.background = Hintergrund
com.top_logic.ai.service.agents.AgentConfig.background.tooltip = Optionale Konfiguration des Hintergrundagenten. <p> Wenn diese Option gesetzt ist, wird dieser Agent zu einem Hintergrundagenten, der durch das Framework und nicht durch Benutzernachrichten ausgelï¿½st wird. Wenn er nicht gesetzt ist, ist der Agent ein normaler Gesprï¿½chsagent (unverï¿½ndertes Verhalten). </p>
com.top_logic.ai.service.agents.AgentConfig.delegations = Delegationen
com.top_logic.ai.service.agents.AgentConfig.delegations.tooltip = Andere Agenten, an die dieser Agent delegieren kann, ausgewï¿½hlt nach Namen. <p> Fï¿½r jeden hier aufgefï¿½hrten Namen eines Zielagenten wird zur Laufzeit von der <i>Agentenregistrierung</i> ein eigenes delegate_to_<name> Tool mit einer selbstbeschreibenden <i>Tool-Spezifikation</i> erstellt. </p>
com.top_logic.ai.service.agents.AgentConfig.description = Beschreibung
