com.top_logic.tl.ai.core.agent.StopReason.tooltip = Warum die Agentenschleife angehalten wurde.
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions = TopLogic-Agenten und Skills
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions$AgentConfig = Konfiguration des Agenten
com.top_logic.tl.ai.core.agent.TopLogicAgentDefinitions$AgentConfig.tooltip = Konfiguration für eine einzelne Agentendefinition. <p> Enthält nur Identität und Fähigkeiten. Tuning-Parameter gehören in AgentOverride. </p>
