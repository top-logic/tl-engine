com.top_logic.ai.service.tools.help.TLScriptReferenceTool = Skript-Referenzwerkzeug
com.top_logic.ai.service.tools.help.TLScriptReferenceTool.tooltip = Werkzeug zum Auflisten von TLScript-Funktionen und zum Abrufen der Dokumentation. <p> Dieses Tool ermï¿½glicht den Zugriff auf die TLScript-Funktionsregistrierung, so dass KI-Agenten verfï¿½gbare Funktionen entdecken und detaillierte Dokumentationen zu ihnen abrufen kï¿½nnen. Es verwendet den <i>Search Builder</i>, um auf die Metadaten der Funktionen zuzugreifen. </p>
com.top_logic.ai.service.tools.model.AnnotationDefinitionExplorerTool = Explorer-Tool fï¿½r Anmerkungsdefinitionen
com.top_logic.ai.service.tools.model.AnnotationDefinitionExplorerTool.tooltip = Werkzeug zur Erkundung von Schemata fï¿½r Anmerkungsdefinitionen. <p> Dieses Tool ermï¿½glicht es KI-Agenten, Anmerkungsdefinitionen zu verstehen (was konfiguriert werden KANN), nicht Anmerkungsinstanzen (was konfiguriert ist). Es bietet Schemainformationen, einschlieï¿½lich Metadaten zu Eigenschaften, Typen, Einschrï¿½nkungen und Standardeinstellungen. </p> <h3>Beispiel fï¿½r die Verwendung:</h3> <pre> // Untersuchen einer bestimmten Anmerkungsdefinition describeAnnotation("com.top_logic.model.annotate.Visibility") // Untersuchen einer Formulardefinitionsanmerkung describeAnnotation("com.top_logic.model.form.definition.FormDefinition") </pre> <h3>Integration</h3>: <p> Um dieses Tool mit einem KI-Agenten zu verwenden, instanziieren Sie es und fï¿½gen Sie es zu den Tools des Agenten hinzu: </p> <pre> AnnotationDefinitionExplorerTool definitionTool = new AnnotationDefinitionExplorerTool(); ModelExplorer explorer = AgenticServices.agentBuilder(ModelExplorer.class) .chatModel(explorationModel) .tools(browserTool, instanceTool, analysisTool, searchTool, annotationTool, definitionTool) .build(); </pre>
com.top_logic.ai.service.tools.model.InstanceBrowserTool = Instanz-Browser-Tool
com.top_logic.ai.service.tools.model.InstanceBrowserTool.tooltip = Tool fï¿½r den Zugriff auf TopLogic-Instanzdaten aus der Wissensdatenbank. <p> Dieses Tool bietet zwei Methoden fï¿½r die Arbeit mit Instanzen: <ul> <li><code>#listInstances(String, String, Integer, String)</code> - Auflistung aller TIDs fï¿½r einen Typ</li> <li><code>#getInstance(String)</code> - Abrufen detaillierter Informationen fï¿½r eine bestimmte Instanz</li> </ul> </p> <p> Alle Methoden geben JSON-formatierte Strings zurï¿½ck, die von KI-Agenten verwendet werden kï¿½nnen. </p>
com.top_logic.ai.service.tools.model.ModelAnnotationBrowserTool = Browser-Tool fï¿½r Modellkommentare
com.top_logic.ai.service.tools.model.ModelAnnotationBrowserTool.tooltip = Werkzeug zum Durchsuchen von Annotationen auf TopLogic-Modellelementen (Module, Typen, Teile, Aufzï¿½hlungen, Klassifikatoren). <p> Mit diesem Tool kï¿½nnen KI-Agenten die Metadaten von Annotationen auf Modellelementen mit optionaler Vererbungsunterstï¿½tzung prï¿½fen. Es liefert detaillierte Informationen ï¿½ber jede Anmerkung, einschlieï¿½lich ihres Tag-Namens, der Konfigurationsschnittstelle und der Eigenschaftswerte. </p> <h3>Beispiel fï¿½r die Verwendung:</h3> <pre> // Auflisten lokaler Anmerkungen zu einem Modul listAnnotations("tl.core", false) // Auflisten lokaler Anmerkungen zu einem Typ listAnnotations("tl.core:TLObject", false) // Auflisten aller Anmerkungen einschlieï¿½lich vererbter listAnnotations("tl.core:TLObject", true) // Auflisten von Anmerkungen zu einer Enumeration listAnnotations("tl.core:TLScope", false) // Anmerkungen zu einem Typteil auflisten listAnnotations("tl.core:TLObject#name", false) // Anmerkungen zu einem Klassifikator (Enum-Literal) auflisten listAnnotations("tl.core:TLScope#global", false) </pre> <h3>Integration</h3>: <p> Um dieses Tool mit einem KI-Agenten zu verwenden, instanziieren Sie es und fï¿½gen Sie es zu den Tools des Agenten hinzu: </p> <pre> ModelAnnotationBrowserTool annotationTool = new ModelAnnotationBrowserTool(); ModelExplorer explorer = AgenticServices.agentBuilder(ModelExplorer.class) .chatModel(explorationModel) .tools(browserTool, instanceTool, analysisTool, searchTool, annotationTool) .build(); </pre>
com.top_logic.ai.service.tools.model.ModelAnnotationEditorTool = Editor fï¿½r Modellbeschriftungen
com.top_logic.ai.service.tools.model.ModelAnnotationEditorTool.tooltip = Werkzeug zum Setzen und Entfernen von Annotationen auf TopLogic-Modellelementen. <p> Mit diesem Tool kï¿½nnen KI-Agenten Metadaten zu Modellelementen (Module, Typen, Teile, Klassifikatoren) ï¿½ndern. Annotationskonfigurationen werden als JSON akzeptiert, die dem Schema des <i>Konfigurationsschematools</i> entsprechen. </p>
com.top_logic.ai.service.tools.model.ModelBrowserTool = Modell-Browser-Tool
com.top_logic.ai.service.tools.model.ModelBrowserTool.tooltip = Werkzeug zum Durchsuchen der TopLogic-Modellstruktur (Module, Typen, Teile). <p> Dieses Werkzeug bietet drei Methoden, die die natï¿½rliche Hierarchie fï¿½r die Modelluntersuchung bilden: <ul> <li><code>#listModules()</code> - Auflistung aller Module in der Anwendung</li> <li><code>#listTypes(String)</code> - Auflistung der Typen innerhalb eines bestimmten Moduls</li> <li><code>#listTypeParts(String, String, Boolean)</code> - Auflistung der Eigenschaften/Referenzen eines Typs</li> </ul> </p> <p> Alle Methoden geben JSON-formatierte Zeichenketten zurï¿½ck, die von KI-Agenten verwendet werden kï¿½nnen. </p>
com.top_logic.ai.service.tools.model.ModelEditorTool = Modell-Editor-Werkzeug
com.top_logic.ai.service.tools.model.ModelEditorTool.tooltip = <code>LangChain4j</code> Tool zum Erstellen und Aktualisieren von TopLogic-Modellelementen. <p> Dieses Tool bietet Methoden zum Erstellen und Aktualisieren von Modulen, Klassen, Eigenschaften, Referenzen, Rï¿½ckwï¿½rtsreferenzen und Aufzï¿½hlungen im TopLogic-Anwendungsmodell. </p> <p> Alle Methoden geben JSON-formatierte Zeichenketten zurï¿½ck, die von KI-Agenten verwendet werden kï¿½nnen. </p>
com.top_logic.ai.service.tools.model.ModelSearchTool = Werkzeug zur Modellsuche
com.top_logic.ai.service.tools.model.ModelSearchTool.tooltip = Werkzeug fï¿½r die Suche im gesamten TopLogic-Anwendungsmodell. <p> Dieses Tool bietet eine intelligente Textsuche ï¿½ber Module, Typen (Klassen, Aufzï¿½hlungen, Datentypen) und Eigenschaften/Referenzen. Es durchsucht technische Namen, qualifizierte Namen, Bezeichnungen und Beschreibungen und gibt die 10 relevantesten Treffer mit Kontextinformationen zurï¿½ck. </p>
com.top_logic.ai.service.tools.model.TypeAnalysisTool = Werkzeug zur Typenanalyse
com.top_logic.ai.service.tools.model.TypeAnalysisTool.tooltip = Tool zur Analyse der TopLogic-Typ-Abhï¿½ngigkeiten und -Beziehungen. <p> Dieses Tool bietet Methoden, um zu verstehen, wie Typen im gesamten Modell verwendet werden: <ul> <li><code>#findTypeUsages(String)</code> - Findet alle Verwendungen eines Typs</li> <li><code>#findPartUsages(String, String)</code> - Findet, wo ein Teil definiert und vererbt wird</li> </ul> </p> <p> Alle Methoden geben JSON-formatierte Strings zurï¿½ck, die von KI-Agenten verwendet werden kï¿½nnen. </p>
