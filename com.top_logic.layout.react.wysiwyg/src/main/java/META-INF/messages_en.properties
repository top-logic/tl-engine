com.top_logic.layout.react.wysiwyg.HtmlConfigProvider = HTML configuration provider
com.top_logic.layout.react.wysiwyg.HtmlConfigProvider.Config.source-feature-sets = Source feature sets
com.top_logic.layout.react.wysiwyg.HtmlConfigProvider.Config.source-feature-sets.tooltip = The feature sets for which the editor offers editing the HTML source. <p> A feature set is named by the <i>HTML</i> annotation of the property. </p>
com.top_logic.layout.react.wysiwyg.HtmlConfigProvider.tooltip = <i>Configuration annotation control provider</i> editing a property whose text is <i>HTML</i> in a <i>react wysiwyg control</i>. <p> While the property can be edited, the formatted text is edited in the WYSIWYG editor. For a feature set listed in <i>Source feature sets</i>, the editor additionally offers editing the HTML source. While the property cannot be edited, the formatted text is displayed. </p> <p> An edited text is stored only if it passes the application's HTML safety check. A text the check rejects is reported at the field, which keeps its last accepted value. </p> <p> A value held as text - a plain text, or the text of a value with a format, such as a TL-Script expression written as HTML with embedded expressions - is edited as one text. An internationalized text is edited per language: the text in the user's language inline, the other languages in a dialog. Any other property is left to the control the <i>configuration control service</i> chooses without the annotation. </p>
com.top_logic.layout.react.wysiwyg.Mention$Config = Configuration
com.top_logic.layout.react.wysiwyg.Mention$Config.tooltip = Configuration of a <i>mention</i>.
com.top_logic.layout.react.wysiwyg.Mention.Config.options = Options
com.top_logic.layout.react.wysiwyg.Mention.Config.options.tooltip = Function computing the objects offered while the mention is typed. <p> The function has the signature self -> query -> objects: self is the edited object (empty for a field editing no attribute of an object), query the text typed after the trigger character. The result is a single object or a collection of objects, offered in their order by their labels. The function decides which objects match the query. </p>
com.top_logic.layout.react.wysiwyg.Mention.Config.presentation = Presentation
com.top_logic.layout.react.wysiwyg.Mention.Config.presentation.tooltip = How the editor shows a reference to an object picked.
com.top_logic.layout.react.wysiwyg.Mention.Config.trigger = Trigger
com.top_logic.layout.react.wysiwyg.Mention.Config.trigger.tooltip = The character starting the mention when typed, e.g. <code>@</code> or <code>#</code>. <p> A single character, which no other mention of the same editor uses. </p>
com.top_logic.layout.react.wysiwyg.MentionArguments = Mention '{trigger}{query}' in '{target}'
com.top_logic.layout.react.wysiwyg.MentionArguments.query = Query
com.top_logic.layout.react.wysiwyg.MentionArguments.query.tooltip = The text typed after the trigger character, null for none.
com.top_logic.layout.react.wysiwyg.MentionArguments.tooltip = Typed arguments of the command <code>"mention"</code> asking a <i>react wysiwyg control</i> for the objects a <i>mention</i> offers: the trigger character typed and the text typed after it. <p> The <i>label</i> doubles as the recorder-step rendering template. </p>
com.top_logic.layout.react.wysiwyg.MentionArguments.trigger = Trigger
com.top_logic.layout.react.wysiwyg.MentionArguments.trigger.tooltip = The character that started the mention, the trigger of the mention asked for.
com.top_logic.layout.react.wysiwyg.MentionPresentation = Mention presentation
com.top_logic.layout.react.wysiwyg.MentionPresentation.CHIP = Chip
com.top_logic.layout.react.wysiwyg.MentionPresentation.CHIP.tooltip = A single unit standing for the object, removed as a whole and not edited character by character.
com.top_logic.layout.react.wysiwyg.MentionPresentation.LINK = Link
com.top_logic.layout.react.wysiwyg.MentionPresentation.LINK.tooltip = An ordinary link whose text is edited like the text around it.
com.top_logic.layout.react.wysiwyg.MentionPresentation.tooltip = How the editor shows an object reference inserted by a <i>mention</i>. <p> Both presentations store the same object link in the text; they differ in how the reference is edited. </p>
com.top_logic.layout.react.wysiwyg.WysiwygControlProvider = Wysiwyg control provider
com.top_logic.layout.react.wysiwyg.WysiwygControlProvider.Config.commands = Commands
com.top_logic.layout.react.wysiwyg.WysiwygControlProvider.Config.commands.tooltip = Commands the editor's toolbar offers beyond its formatting buttons. <p> A command goes to the toolbar unless it says otherwise, as every command placed in a toolbar does. The commands see the channels of the view the edited field is displayed in, so they take their input from it and hand it on to the dialogs they open, and they reach the text through the insertion channel. </p>
com.top_logic.layout.react.wysiwyg.WysiwygControlProvider.Config.insert-channel = Insert channel
com.top_logic.layout.react.wysiwyg.WysiwygControlProvider.Config.insert-channel.tooltip = Name of the channel whose text the editor inserts at the cursor. <p> Declared where the editor's commands need somewhere to write their result to; the channel then exists for them alone, beside the channels of the surrounding view. A view names the channels it works with, and this is one of them. </p> <p> Left unset, the editor has no such channel and its commands act on the view only. </p>
com.top_logic.layout.react.wysiwyg.WysiwygControlProvider.Config.mentions = Mentions
com.top_logic.layout.react.wysiwyg.WysiwygControlProvider.Config.mentions.tooltip = The ways of referring to objects by typing a trigger character. <p> Typing the trigger character of a mention offers the objects its function computes for the text typed after it; picking one inserts a link to the object. Each mention has a trigger character of its own. </p>
com.top_logic.layout.react.wysiwyg.WysiwygControlProvider.tooltip = <i>React field control provider</i> for tl.model.wysiwyg:Html attributes. <p> The editor's toolbar carries the commands the configuration gives it, next to the formatting buttons of the editor itself. Such a command does whatever a command of the surrounding view does - open a dialog, run a script, write a channel - and reaches the text through the insertion channel: what it writes there is inserted at the cursor. </p> <p> With mentions, typing a trigger character such as <code>@</code> offers a list of objects matching the text typed after it, and picking one inserts a link to it. </p>
