com.top_logic.ai.chat.history.LegacyChatSessionMigration = Legacy chat session migration
com.top_logic.ai.chat.history.LegacyChatSessionMigration.tooltip = One-time eager migration of legacy <code>tl.ai.chat:ChatSession</code> objects to <i>agent sessions</i> at application startup. <p> Each legacy session becomes an <i>agent session</i> (kind CHAT) with the same title, owner, timestamps and metadata, plus one synthetic completed <i>agent execution</i> carrying the old V2 message blob verbatim as its transcript. Legacy blobs in the pre-V2 format cannot be replayed; their conversation content is dropped with a warning (title and timestamps are preserved). Each legacy object is deleted after migration, so after one boot of this version the <code>ChatSession</code> table is empty and subsequent startups are a cheap no-op. </p> <p> Migration is best-effort: a failure is logged and never prevents application startup; remaining legacy sessions are retried on the next boot. </p> <p> The rest of the legacy model is gone: <code>WEB-INF/model/tl.ai.chat.model.xml</code>, <code>WEB-INF/kbase/ChatMeta.xml</code> and <code>WEB-INF/autoconf/model.tl.ai.chat.config.xml</code> have been deleted, and the tl-ai-core migration <code>Issue_230_remove_module_tl_ai_chat</code> drops the table and the module from databases it reaches (Refs #230). </p> <p> With the model gone, this service no longer has anything to do: whether or not the migration reaches a database, <code>DynamicModelService</code> drops the undeclared <code>tl.ai.chat</code> module during its incremental model upgrade, which runs before this service starts. It is kept only so that the removal of the legacy model can still be reverted in one place, and because deleting it is only safe once every deployment has run it. </p> <p>
