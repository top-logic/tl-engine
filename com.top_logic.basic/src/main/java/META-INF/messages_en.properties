com.top_logic.basic.io.binary.scan.ClamAvScanner.Config.read-timeout.tooltip = Timeout in milliseconds for reading the daemon's reply.
com.top_logic.basic.io.binary.scan.ClamAvScanner.Config.unavailable-policy = Unavailable policy
com.top_logic.basic.io.binary.scan.ClamAvScanner.Config.unavailable-policy.tooltip = What to do with an upload that could not be scanned because the daemon was unavailable.
com.top_logic.basic.io.binary.scan.ClamAvScanner.UnavailablePolicy.ACCEPT = Accept
com.top_logic.basic.io.binary.scan.ClamAvScanner.UnavailablePolicy.ACCEPT.tooltip = Accept the upload after logging a warning (fail open).
com.top_logic.basic.io.binary.scan.ClamAvScanner.UnavailablePolicy.REJECT = Reject
com.top_logic.basic.io.binary.scan.ClamAvScanner.UnavailablePolicy.REJECT.tooltip = Reject the upload (fail closed).
com.top_logic.basic.io.binary.scan.ClamAvScanner.tooltip = <i>Upload content checker</i> scanning uploaded content with a ClamAV daemon (<code>clamd</code>). <p> The content is streamed to <code>clamd</code> over a socket using its <code>INSTREAM</code> command, so the file never has to be shared with the daemon through the file system. When the daemon reports a signature match, the upload is rejected. What happens when the daemon cannot be reached is controlled by <i>Unavailable policy</i>. </p>
com.top_logic.basic.io.binary.scan.UploadSecurityService = Upload security service
com.top_logic.basic.io.binary.scan.UploadSecurityService.Config.checkers = Checkers
com.top_logic.basic.io.binary.scan.UploadSecurityService.Config.checkers.tooltip = The <i>upload content checkers</i> applied to every uploaded file, in order.
com.top_logic.basic.io.binary.scan.UploadSecurityService.tooltip = Service inspecting the content of uploaded files through the configured <i>upload content checkers</i>. <p> The service is consulted by the <i>upload guard request</i> of a servlet receiving uploads, once for every uploaded file. It runs the configured checkers in order and reports the first rejection. When the service is inactive or has no checkers, uploads pass unchanged, so enabling upload scanning is a pure deployment decision with no effect on other installations. </p>
