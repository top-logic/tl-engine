class.com.top_logic.presentation.profile.I18NConstants.ERROR_NO_LAYOUT_FOR_ROLE__PATH_ROLE_ROLES = The entry {0} asks for the slide layout with the role "{1}", but the template profile assigns no layout to this role. Roles with a layout are: {2}. Give the layout by its index or name, or assign it to the role in the "layouts" entry of the profile.
