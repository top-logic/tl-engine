com.top_logic.security.passkey.PasskeyRefusedException.Category.NOT_ALLOWED.tooltip = Das Konto darf keine Passkeys verwenden.
com.top_logic.security.passkey.PasskeyRefusedException.Category.OTHER_ACCOUNT = Anderes Konto
com.top_logic.security.passkey.PasskeyRefusedException.Category.OTHER_ACCOUNT.tooltip = Der Passkey gehört zu einem anderen Konto als dem, für das die Anmeldung gestartet wurde.
com.top_logic.security.passkey.PasskeyRefusedException.Category.SIGNATURE_COUNTER = Signaturzähler
com.top_logic.security.passkey.PasskeyRefusedException.Category.SIGNATURE_COUNTER.tooltip = Der Signaturzähler des Passkeys hat sich nicht erhöht: ein Anzeichen dafür, dass es sich um einen geklonten Authentifikator handelt.
com.top_logic.security.passkey.PasskeyRefusedException.Category.UNKNOWN_PASSKEY = Unbekannter Passkey
com.top_logic.security.passkey.PasskeyRefusedException.Category.UNKNOWN_PASSKEY.tooltip = Kein Konto der Anwendung hat einen Passkey mit dieser Credential-ID.
com.top_logic.security.passkey.PasskeyRefusedException.Category.USER_NOT_VERIFIED = Benutzer nicht verifiziert
com.top_logic.security.passkey.PasskeyRefusedException.Category.USER_NOT_VERIFIED.tooltip = Der Authentifikator hat seinen Benutzer nicht überprüft, obwohl dies erforderlich war.
com.top_logic.security.passkey.PasskeyRefusedException.Category.WRONG_ORIGIN = Falsche Adresse
com.top_logic.security.passkey.PasskeyRefusedException.Category.WRONG_ORIGIN.tooltip = Die Registrierung oder Anmeldung lief auf einer Seite, deren Ursprung die vertrauende Partei nicht akzeptiert.
com.top_logic.security.passkey.PasskeyService = Passkey-Dienst
com.top_logic.security.passkey.PasskeyService.Config.origins = Ursprünge
com.top_logic.security.passkey.PasskeyService.Config.origins.tooltip = Die Ursprünge, auf denen der Browser eine Registrierung oder Anmeldung ausführen darf, z. B. <code>https://app.example.com</code>. <p> Gesetzt, ersetzen sie den Ursprung der öffentlichen Adresse der Anwendung; geben Sie diese Adresse daher mit an, wenn Passkeys auch dort funktionieren sollen. Leer: der Ursprung der öffentlichen Adresse der Anwendung (%HOST%, Variable <code>tl_host</code>). </p>
com.top_logic.security.passkey.PasskeyService.Config.rp-id = ID der vertrauenden Partei
com.top_logic.security.passkey.PasskeyService.Config.rp-id.tooltip = Die ID der vertrauenden Partei: die Domäne, an die die Passkeys gebunden sind, z. B. <code>example.com</code>. <p> Ein Passkey kann nur auf dieser Domäne und ihren Subdomänen verwendet werden; eine Änderung macht daher alle registrierten Passkeys unbrauchbar. Sie muss der Host jedes akzeptierten Ursprungs oder eine übergeordnete Domäne davon sein. Leer: der Host der öffentlichen Adresse der Anwendung (%HOST%, Variable <code>tl_host</code>) oder, ohne diese, der Host des ersten der Ursprünge. </p>
com.top_logic.security.passkey.PasskeyService.Config.rp-name = Name der vertrauenden Partei
com.top_logic.security.passkey.PasskeyService.Config.rp-name.tooltip = Der Name der vertrauenden Partei, der bei der Erstellung eines Passkeys von einem Authentifikator angezeigt wird. <p> Leer: Der Titel der Anwendung. </p>
com.top_logic.security.passkey.PasskeyService.Config.timeout = Zeitlimit
com.top_logic.security.passkey.PasskeyService.Config.timeout.tooltip = Wie lange der Browser darauf wartet, dass der Benutzer eine Registrierung oder Anmeldung bestätigt, und wie lange eine gestartete Registrierung oder Anmeldung angenommen wird.
com.top_logic.security.passkey.PasskeyService.Config.user-verification = Benutzerüberprüfung
com.top_logic.security.passkey.PasskeyService.Config.user-verification.tooltip = Ob ein Authentifikator seinen Benutzer (PIN, biometrische Daten) verifizieren muss, wenn ein Passkey registriert oder als zweiter Faktor verwendet wird. <p> Eine Anmeldung nur mit einem Passkey erfordert immer eine Benutzerüberprüfung. </p>
com.top_logic.security.passkey.PasskeyService.tooltip = Die vertrauende Partei der Passkeys (Web-Authentication-Credentials) der Zugänge: Sie registriert Passkeys und überprüft Anmeldungen mit ihnen. <h2>Adresse der vertrauenden Partei</h2> <p> Die ID der vertrauenden Partei und die akzeptierten Ursprünge werden beim Start des Dienstes aus der öffentlichen Adresse der Anwendung genommen, dem Alias %HOST% (gesetzt aus der Variable <code>tl_host</code>): Der Ursprung dieser Adresse ist der akzeptierte Ursprung, ihr Host die ID der vertrauenden Partei. Die Optionen „rp-id“ und „origins“ überschreiben sie, siehe die Auflösung. Aus einer Anfrage wird nichts übernommen: Ein Reverse-Proxy entscheidet, was eine Anfrage aussagt, und die ID der vertrauenden Partei bindet jeden Passkey dauerhaft. Lässt sich kein Ursprung ermitteln, protokolliert der Dienst einen Fehler und läuft ohne Passkeys weiter: Jede Methode <code>start</code> lehnt mit der Meldung ab, dass keine Passkeys eingerichtet sind. </p> <h2>Ablehnungen</h2> <p> Eine Methode <code>finish</code> lehnt einen Passkey mit einer <i>Passkey-Ablehnung</i> ab, die die Kategorie der Ablehnung und den abgelehnten Passkey nennt, und protokolliert die Ablehnung als Warnung mit der Kategorie, dem Grund, der Credential-ID, den beteiligten Konten und dem Ursprung, den der Browser gemeldet hat. Die Kategorien ergeben sich aus den Prüfungen dieses Dienstes, bevor die Bibliothek ihre eigenen ausführt; eine Ablehnung durch die Bibliothek ist <i>Fehlgeschlagen</i> mit ihrem Grund. </p> <p> Registrierte Passkeys sind auffindbar, sodass eine Anmeldung ohne Benutzernamen möglich ist. Eine solche Anmeldung allein mit einem Passkey erfordert immer, dass der Authentifikator seinen Benutzer verifiziert (PIN, biometrische Daten), da der Passkey der einzige Nachweis ist. Registrierungen und Anmeldungen mit einem Passkey als zweitem Faktor nach dem Passwort erfordern die konfigurierte Benutzerüberprüfung. </p>
com.top_logic.security.passkey.view.DeletePasskeyAction = Aktion „Passkey löschen“
com.top_logic.security.passkey.view.DeletePasskeyAction.tooltip = <i>Aktion „Objekt löschen“</i>, die einen <i>Passkey</i> im Namen des Kontos löscht, dem er gehört, und dabei verhindert, dass ein Konto, das einen zweiten Faktor verwenden muss, seinen letzten löscht. <p> Ein Konto mit der <i>MFA-Anforderung</i> <i>erforderlich</i> kann seinen zweiten Faktor nicht abschalten (siehe <i>Aktion „MFA abschalten“</i>), also kann es auch den Passkey nicht löschen, der sein einziger zweiter Faktor ist: Das Löschen wird abgelehnt, es sei denn, das Konto behält einen weiteren Passkey oder hat eine andere konfigurierte Methode der Anmeldung eingerichtet, z. B. eine Authenticator-App. Ein Befehl mit dieser Aktion ist für einen solchen Passkey deaktiviert und nennt den Grund. </p> <p> Ein Administrator, der den Passkey eines anderen entfernt, löscht ihn mit der <i>Aktion „Objekt löschen“</i>: Ein Konto, das einen zweiten Faktor verwenden muss und keinen mehr hat, richtet bei seiner nächsten Anmeldung einen ein. </p> <p> Beispiel: Den ausgewählten Passkey des aktuellen Benutzers löschen. </p><pre> &lt;generic-command inputs="selectedPasskey"&gt; &lt;executability&gt; &lt;null-input-disabled/&gt; &lt;/executability&gt; &lt;confirm expr="..."/&gt; &lt;verify-identity/&gt; &lt;delete-passkey/&gt; &lt;write-channel name="selectedPasskey" clear="true"/&gt; &lt;/generic-command&gt; </pre>
com.top_logic.security.passkey.view.PasskeyCeremonyElement = Passkey-Element
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.account = Konto
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.account.tooltip = Kanal mit dem Konto, für das der Passkey verwendet oder erstellt wird. <p> Der Kanal muss vom Server gefüllt werden, z. B. von der Anmeldung, nicht durch eine Eingabe des Benutzers. Solange er kein Konto enthält, ist die Schaltfläche deaktiviert. </p>
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.appearance = Aussehen
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.appearance.tooltip = Das Aussehen der Schaltfläche, z. B. <i>„Link“</i> für einen Inline-Link.
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.auto-start = Automatischer Start
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.auto-start.tooltip = Ob der Browser den Passkey abfragt, sobald das Element angezeigt wird, ohne dass auf die Schaltfläche geklickt wird. <p> Ein Browser, der die Anfrage erst nach einem Klick des Benutzers akzeptiert, lehnt den automatischen Start stillschweigend ab; die Schaltfläche bleibt verfügbar. </p>
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.image = Bild
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.image.tooltip = Das Symbol der Schaltfläche.
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.label = Bezeichnung
com.top_logic.security.passkey.view.PasskeyCeremonyElement.Config.label.tooltip = Die Bezeichnung der Schaltfläche.
com.top_logic.security.passkey.view.PasskeyCeremonyElement.tooltip = Basisklasse eines <i>UI-Elements</i> mit einer Schaltfläche, die im Browser eine <i>Passkey-Zeremonie</i> für das Konto auf einem optionalen Kanal ausführt.
com.top_logic.security.passkey.view.PasskeyFunctions.mayUse = Konto darf Passkeys verwenden
com.top_logic.security.passkey.view.PasskeyFunctions.mayUse.param.account.tooltip = Das zu testende Konto.
com.top_logic.security.passkey.view.PasskeyFunctions.mayUse.return = Ob das Konto Passkeys erstellen darf.
com.top_logic.security.passkey.view.PasskeyFunctions.mayUse.tooltip = Ob das angegebene Konto Passkeys erstellen darf. <p> So bietet eine Ansicht das Erstellen eines Passkeys nur einem Konto an, das einen haben darf: <code>passkeyMayUse(currentUser())</code>. Weder das anonyme Konto noch ein Konto, dessen zweiter Faktor dauerhaft abgeschaltet ist, darf einen erstellen. </p>
com.top_logic.security.passkey.view.PasskeyLoginElement = Passkey-Anmeldeelement
com.top_logic.security.passkey.view.PasskeyLoginElement.tooltip = <i>UI-Element</i> mit einer Schaltfläche, die mit einem Passkey anmeldet. <p> Ohne Konto-Kanal wählt der Benutzer einen Passkey eines beliebigen Kontos, und der Passkey allein meldet sein Konto an (der Authentifikator verifiziert dabei immer seinen Benutzer). Mit Konto-Kanal werden nur die Passkeys des Kontos auf dem Kanal akzeptiert: der Passkey als zweiter Faktor, z. B. im Dialog, den die Anmeldung mit dem Konto öffnet, dessen Passwort sie geprüft hat. </p> <p> Die Anmeldung wird für das Konto abgeschlossen, dem der Passkey gehört, wie es die Prüfung des Passkeys festgestellt hat. </p>
com.top_logic.security.passkey.view.PasskeyRegistrationElement = Passkey-Registrierung
com.top_logic.security.passkey.view.PasskeyRegistrationElement.Config.complete-login = Anmeldung abschließen
com.top_logic.security.passkey.view.PasskeyRegistrationElement.Config.complete-login.tooltip = Ob ein gespeicherter Passkey die Anmeldung des Kontos auf dem Konto-Kanal abschließt, das bei der Anmeldung seinen zweiten Faktor einrichtet. <p> Erfordert den Konto-Kanal und schließt die Aktionen nach einer Registrierung aus. </p>
com.top_logic.security.passkey.view.PasskeyRegistrationElement.Config.on-success = Bei Erfolg
com.top_logic.security.passkey.view.PasskeyRegistrationElement.Config.on-success.tooltip = Aktionen, die ausgeführt werden, nachdem ein Passkey gespeichert wurde, mit dem Passkey als Argument <code>"passkey"</code>.
com.top_logic.security.passkey.view.PasskeyRegistrationElement.tooltip = <i>UI-Element</i> mit einer Schaltfläche, über die ein Passkey für ein Konto erstellt wird. <p> Das Element dient zwei Zwecken: </p> <ul> <li>Ein angemeldetes Konto erstellt einen eigenen Passkey, z. B. in seinen Einstellungen. Dabei handelt es sich entweder um das angemeldete Konto oder um das Konto auf dem Kontokanal, das dann ebenfalls das angemeldete Konto sein muss. Nachdem der Passkey gespeichert wurde, werden die Aktionen mit ihm als Argument <code>"passkey"</code> ausgeführt, z. B. um eine Liste der Passkeys zu aktualisieren.</li> <li>Bei der Anmeldung wird ein Passkey als zweiter Faktor eingerichtet (<i>vollständige Anmeldung</i>): Das Konto auf dem Kontokanal, das dort von der Anmeldung nach der Passwortprüfung abgelegt wurde, muss einen zweiten Faktor verwenden und hat noch keinen eingerichtet. Bei der Registrierung erfolgt die Verifizierung des Benutzers durch den Authentifikator, sodass der gespeicherte Passkey das Konto bestätigt und die Anmeldung damit abgeschlossen ist.</li> </ul> <p> Ein Konto, das nicht in diese Situation passt, erhält keinen Passkey: Die Schaltfläche ist deaktiviert und gibt den Grund dafür an. </p>
com.top_logic.security.passkey.view.PasskeySecondFactor = Passkey als zweiter Faktor
com.top_logic.security.passkey.view.PasskeySecondFactor.tooltip = <i>Zweiter Faktor</i> zur Bestätigung einer Anmeldung mit einem Passkey des Kontos. <p> Ein Konto ist entsprechend eingerichtet, wenn es über einen Passkey verfügt, und kann eingerichtet werden, wenn die Verwendung von Passkeys möglich ist. Bei der Verifizierung handelt es sich um den Passkey-Dialog mit einem <i>Passkey-Anmeldeelement</i> für das Konto, bei der Einrichtung um den Einrichtungsdialog mit einem <i>Passkey-Registrierungselement</i>, das die Anmeldung abschließt; beide erhalten das Konto über den Dialogkanal <code>"account"</code>. </p>
