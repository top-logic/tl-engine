<!doctype html>
<html lang="de" data-tl-mode="light" data-tl-density="normal">
<head>
<meta charset="utf-8">
<title>TopLogic Design System — Snackbar</title>
<link rel="stylesheet" href="/fonts/style/interFonts.css">
<link rel="stylesheet" href="/fonts/style/bootstrap-icons.css">
<link rel="stylesheet" href="/dist/primitives.css">
<link rel="stylesheet" href="/dist/tokens.css">
<link rel="stylesheet" href="/dist/base.css">
<link rel="stylesheet" href="/dist/components.css">
<link rel="stylesheet" href="/specimen/specimen.css">
<style>
  .stage { position: relative; height: 8rem; transform: translateZ(0); background: var(--tl-surface-base); }
  .stage .tl-snackbar { position: absolute; }
</style>
</head>
<body>
<main class="specimen">
  <div class="specimen__bar">
    <a class="tl-type-label" href="/">← Grundklassen</a>
    <span class="tl-type-heading-lg">Snackbar</span>
    <label class="tl-type-label"><input type="checkbox" id="mode"> dunkel</label>
    <label class="tl-type-label"><input type="checkbox" id="density"> kompakt</label>
  </div>

  <section class="specimen__panel"><p class="tl-type-heading-sm">error</p>
    <div class="stage">
      <div class="tl-alert tl-snackbar tl-type-body" data-tl-role="error" role="alert">
        <div class="tl-alert__body"><div class="tl-alert__message"><div class="tl-alert__title tl-type-body-strong">Speichern fehlgeschlagen</div><ul><li>Name fehlt.</li><li>Frist liegt in der Vergangenheit.</li></ul></div></div>
        <button type="button" class="tl-button tl-button--ghost tl-button--sm tl-button--icon tl-alert__close" aria-label="Schließen" data-tooltip="text:Schließen"><i class="tl-icon-sm bi bi-x-lg tl-button__icon" aria-hidden="true"></i></button>
      </div>
    </div>
  </section>
  <section class="specimen__panel"><p class="tl-type-heading-sm">success</p>
    <div class="stage">
      <div class="tl-alert tl-snackbar tl-type-body" data-tl-role="success" role="status">
        <div class="tl-alert__body"><div class="tl-alert__message">Gespeichert.</div></div>
        <button type="button" class="tl-button tl-button--ghost tl-button--sm tl-button--icon tl-alert__close" aria-label="Schließen" data-tooltip="text:Schließen"><i class="tl-icon-sm bi bi-x-lg tl-button__icon" aria-hidden="true"></i></button>
      </div>
    </div>
  </section>
  <section class="specimen__panel"><p class="tl-type-heading-sm">warning</p>
    <div class="stage">
      <div class="tl-alert tl-snackbar tl-type-body" data-tl-role="warning" role="status">
        <div class="tl-alert__body"><div class="tl-alert__message">Der Entwurf ist älter als die gespeicherte Fassung.</div></div>
        <button type="button" class="tl-button tl-button--ghost tl-button--sm tl-button--icon tl-alert__close" aria-label="Schließen" data-tooltip="text:Schließen"><i class="tl-icon-sm bi bi-x-lg tl-button__icon" aria-hidden="true"></i></button>
      </div>
    </div>
  </section>
  <section class="specimen__panel"><p class="tl-type-heading-sm">info</p>
    <div class="stage">
      <div class="tl-alert tl-snackbar tl-type-body" data-tl-role="info" role="status">
        <div class="tl-alert__body"><div class="tl-alert__message">Die Liste wurde aktualisiert.</div></div>
        <button type="button" class="tl-button tl-button--ghost tl-button--sm tl-button--icon tl-alert__close" aria-label="Schließen" data-tooltip="text:Schließen"><i class="tl-icon-sm bi bi-x-lg tl-button__icon" aria-hidden="true"></i></button>
      </div>
    </div>
  </section>
</main>
<script>
  const html = document.documentElement;
  document.getElementById('mode').addEventListener('change', (e) => html.setAttribute('data-tl-mode', e.target.checked ? 'dark' : 'light'));
  document.getElementById('density').addEventListener('change', (e) => html.setAttribute('data-tl-density', e.target.checked ? 'compact' : 'normal'));
</script>
</body>
</html>
